n-ege-bamyasi.php", "aoty_critic_score": 95, "aoty_user_score": 84, "mbid": "a4b405a6-0577-3b77-b46d-06af1b98fbd2", "yt_id": "Nxh4cVuokWE", "rym": "https://rateyourmusic.com/release/album/can/ege-bamyasi/", "genres": ["krautrock"], "desc_lfm_album": "Ege Bamyası is the fourth studio album by the German experimental rock band Can which was originally released as an LP in 1972 by United Artists. The album contains the single \"Spoon\", which charted in the Top 10 in Germany, largely because of its use as the theme of a German TV thriller series called \"Das Messer\" (The Knife). The success of the single allowed Can to move to a better studio in which they recorded Ege Bamyası. Ege Bamyası was remastered as a hybrid SACD in 2004 which includes a booklet with commentary on the album by former Melody .", "desc_lfm_artist": "CAN was a German experimental rock band formed in Cologne in 1968. They split up in 1979 and were active again in 1986, 1988, 1991 and 1999.\n\n\nMembers:\n** Guitar, vocals, violin: Michael Karoli (1968–1979, 1986, 1988, 1991, 1999; died 2001)\n** Drums, percussion, double bass, piano: Jaki Liebezeit (1968–1979, 1986, 1988, 1991, 1999; died 2017)\n** Keyboards, vocals: Irmin Schmidt (1968–1979, 1986, 1988, 1991, 1999)\n** Bass, sound engineer, electronics, vocals, French horn: Holger Czukay (1968–1977, 1986, 1988; died 2017)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 164, "title": "Can’t Buy a Thrill", "artist": "Steely Dan", "year": 1972, "cover": "https://dn721601.ca.archive.org/0/items/mbid-769750ca-9eb5-4fd6-b86a-984da312122f/mbid-769750ca-9eb5-4fd6-b86a-984da312122f-34031364152.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19932-steely-dan-cant-buy-a-thrill.php", "aoty_critic_score": 84, "aoty_user_score": 84, "mbid": "9d73a864-2976-3286-b6c1-8aabc7407737", "yt_id": "aQnW-MxAU6U", "rym": null, "genres": ["pop rock", "jazz rock"], "desc_lfm_album": "", "desc_lfm_artist": "Steely Dan is an American jazz rock band which formed in 1972. The band was formed by Donald Fagen (vocals, keyboards) and Walter Becker (guitar, bass), who met in 1967 while both attended Bard College in Annandale-on-Hudson, New York, and began a songwriting partnership shortly thereafter.\n\nTheir music is characterized by dark, witty lyrical narratives, obscure lyrical allusions and complex, jazz-influenced instrumentation and chord sequences, overlying more ordinary popular song structures.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 165, "title": "Acabou Chorare", "artist": "Novos Baianos", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12778-acabou-chorare_180700.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12778-novos-baianos-acabou-chorare.php", "aoty_critic_score": 85, "aoty_user_score": 89, "mbid": "65790705-6d7b-3596-a427-fe5b8ab6481d", "yt_id": "BoYP5oHMX9I", "rym": null, "genres": [], "desc_lfm_album": "Acabou Chorare (\"No More Crying\" in english) is the second album by the Brazilian musical group Novos Baianos. The album was released in 1972 by Som Livre, following the group's somewhat successful debut É Ferro na Boneca (1970). The group adopted the expressive guitar of Jimi Hendrix and the \"brasilidade\" of Assis Valente, and was heavily influenced by João Gilberto, who served as the group's mentor during the album's recording. Its opening track, \"Brasil Pandeiro\", was suggested by Gilberto and is one of two sambas (along with \"Recenseamento\"), which Valente composed for the arrival of Carmen Miranda to the United .", "desc_lfm_artist": "Novos Baianos (or Os Novos Bahianos prior to 1972) was a Brazilian MPB group from Bahia that was formed in 1969 and enjoyed success throughout most of the '70s. Band members were Paulinho Boca de Cantor, Pepeu Gomes, Moraes Moreira, Dadi, Luiz Galvão, Jorginho Gomes, and Baby Consuelo, today known as Baby do Brasil.\n\nInitially their sound was a fusion of psychedelic rock with traditional folk sounds, Brazilian as well as Latin, a style that is most evident in É Ferro na Boneca (1970).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 166, "title": "Talking Book", "artist": "Stevie Wonder", "year": 1972, "cover": "https://dn711107.ca.archive.org/0/items/mbid-31137e7a-dce1-4066-9c7a-05de177f1163/mbid-31137e7a-dce1-4066-9c7a-05de177f1163-4254007853.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12737-stevie-wonder-talking-book.php", "aoty_critic_score": 100, "aoty_user_score": 86, "mbid": "58c6d809-bfa7-3b25-acf3-a99d53402b08", "yt_id": "SbenaOqv4yQ", "rym": "https://rateyourmusic.com/release/album/stevie-wonder/talking-book", "genres": ["soul", "r&b", "funk", "smooth soul", "pop soul"], "desc_lfm_album": "After releasing two \"head\" records during 1970-71, Stevie Wonder expanded his compositional palate with 1972's Talking Book to include societal ills as well as tender love songs, and so recorded the first smash album of his career. What had been hinted at on the intriguing project Music of My Mind was here focused into a laser beam of tight songwriting, warm electronic arrangements, and ebullient performances -- altogether the most realistic vision of musical personality ever put to wax, beginning with a disarmingly simple love song, \"You Are the Sunshine of My Life\" (but of course, it's only the composition .", "desc_lfm_artist": "Stevie Wonder is the stage name of Stevland Hardaway Morris (b. Stevland Hardaway Judkins, 13 May 1950 in Saginaw, MI, USA - a.k.a. Little Stevie Wonder), a singer, multi-instrumentalist, composer,  record producer and activist.  He débuted, as Little Stevie Wonder, with the single \"I Call It Pretty Music but the Old People Call It the Blues\" (1961, Tamla Motown) and his latest album is \"A Time To Love\" (Oct 2005, Motown)\n\nStevland lost his eyesight shortly after birth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 167, "title": "On the Corner", "artist": "Miles Davis", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6052-on-the-corner-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6052-miles-davis-on-the-corner.php", "aoty_critic_score": 85, "aoty_user_score": 84, "mbid": "d8ced714-bc46-3657-9076-8577c9d50231", "yt_id": "AIqXprCArdo", "rym": "https://rateyourmusic.com/release/album/miles-davis/on-the-corner", "genres": ["jazz", "jazz-funk", "avant-garde jazz", "jazz fusion"], "desc_lfm_album": "Miles Davis' On the Corner, released on October 11, 1972, is one of the most polarizing and innovative albums in the history of jazz and beyond. It marked a significant departure from traditional jazz forms, embracing a fusion of funk, rock, avant-garde, and electronic influences. Davis created On the Corner with the intention of appealing to a younger African-American audience that had shifted its attention from jazz to funk and rock. He drew inspiration from funk pioneers like Sly Stone and James Brown, as well as avant-garde composer Karlheinz Stockhausen. Collaborator Paul Buckmaster also played a key role in shaping .", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 168, "title": "Foxtrot", "artist": "Genesis", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9169-foxtrot_182643.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9169-genesis-foxtrot.php", "aoty_critic_score": 87, "aoty_user_score": 84, "mbid": "81d890d2-e71a-3e96-b3f1-4ddb3b6feb81", "yt_id": "3MxhHeRUYno", "rym": "https://rateyourmusic.com/release/album/genesis/foxtrot", "genres": [], "desc_lfm_album": "Foxtrot is the fourth studio album by British progressive rock band Genesis and the second from the \"classic\" lineup of Peter Gabriel, Tony Banks, Mike Rutherford, Phil Collins, and Steve Hackett. The album was recorded and released in 1972 as the band's career quickly gained momentum. Foxtrot was also Genesis' first album to enter the UK charts, reaching # 12 and paving the way for a long and successful chart career for the band. Still, it failed to reach the US charts. It was not the first Genesis album to appear in the charts: Nursery Cryme reached #7 in Italy, .", "desc_lfm_artist": "There are at least three bands using the moniker Genesis;\n\n1) Genesis was an English rock band formed at Charterhouse School, Godalming, Surrey, in 1967. The band's longest-existing and most commercially successful line-up consisted of keyboardist Tony Banks, bassist/guitarist Mike Rutherford and drummer/singer Phil Collins. In the 1970s, during which the band also included singer Peter Gabriel and guitarist Steve Hackett, Genesis were among the pioneers of progressive rock. Banks and Rutherford were the only constant members of the group.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 169, "title": "Crying, Laughing, Loving, Lying", "artist": "Labi Siffre", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/148867-crying-laughing-loving-lying_090501.jpg", "aoty_url": "https://www.albumoftheyear.org/album/148867-labi-siffre-crying-laughing-loving-lying.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "f34a6030-1365-47ef-9f45-545c7dcc927a", "yt_id": "bQz8tFGyLL0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Labi Siffre (born June 25, 1945) is an English poet, songwriter, and singer. Born the fourth of five children to a Barbadian/Belgian mother and a Nigerian father and raised in Bayswater and Hampstead, London, he was educated at a Catholic monastery school, St Benedict's School in Ealing. His musical influences included Thelonious Monk, Miles Davis, Charles Mingus, Jimmy Reed, Wes Montgomery, Billie Holiday, and Mel Tormé. In July 1964, he met his partner Peter Lloyd", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 170, "title": "Black Sabbath Vol. 4", "artist": "Black Sabbath", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7076-black-sabbath-vol-4_125038.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7076-black-sabbath-black-sabbath-vol-4.php", "aoty_critic_score": 73, "aoty_user_score": 83, "mbid": null, "yt_id": "LgzSXsSMMUA", "rym": "https://rateyourmusic.com/release/album/black-sabbath/black-sabbath-vol-4", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Black Sabbath was an English heavy metal band formed in Birmingham in 1968 by guitarist Tony Iommi, drummer Bill Ward, bassist Geezer Butler, and vocalist Ozzy Osbourne. The band initially performed under the names Polka Tulk Blues Band and later Earth, before adopting the name Black Sabbath in 1969. They became known for lyrical themes influenced by horror and the occult, as well as for the use of down-tuned guitars. Their first three albums, \"Black Sabbath\" and \"Paranoid\" (both 1970)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 171, "title": "Close to the Edge", "artist": "Yes", "year": 1972, "cover": "https://ia801302.us.archive.org/31/items/mbid-2b9b5b13-5639-4645-b89b-e5ea555f9a65/mbid-2b9b5b13-5639-4645-b89b-e5ea555f9a65-7295017114.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9077-yes-close-to-the-edge.php", "aoty_critic_score": 80, "aoty_user_score": 89, "mbid": "5a59b948-1961-32ff-80d9-e970c7d4ebe9", "yt_id": "WRSugblInEY", "rym": "https://rateyourmusic.com/release/album/yes/close-to-the-edge/", "genres": ["art rock", "classic rock", "progressive rock", "symphonic rock"], "desc_lfm_album": "Close to the Edge set a trend for Yes of structuring an album around a single epic song, significantly longer than the album's other tracks. Here the centerpiece is the song \"Close to the Edge\". Later Yes albums that follow a similar pattern are Relayer (1974) (which features \"The Gates of Delirium\") and Going for the One (1977) (which features \"Awaken\"). The spiritual influences introduced by Jon Anderson, which later formed the basis of Tales from Topographic Oceans, are already evident in the music and lyrics of all three tracks on Close to the Edge. Renewal and repetition are other .", "desc_lfm_artist": "Yes is a British progressive rock band which formed in London, United Kingdom in 1968. They are best known for 1970's \"I've Seen All Good People\", the 1972 9-minute US Top 20 smash \"Roundabout\" and their 1983 #1 hit \"Owner of a Lonely Heart\". Despite many lineup changes, occasional splits and the influence of the many changes in popular music, the band has endured for 40 years and still retains a strong international following. Their music is marked by sharp dynamic contrasts", "desc_mb_album": "", "desc_mb_artist": "In 2017, former members Jon Anderson, Trevor Rabin and Rick Wakeman changed the name of their group ARW to [[https://musicbrainz.org/artist/d49ba74d-343b-48f3-8180-3a14821bf6a8|Yes featuring ARW]]. There is an ongoing dispute over the rights to the Yes band name. '''Please do not merge the two artists.'''", "heard_by": ["GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 172, "title": "Arthur Verocai", "artist": "Arthur Verocai", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/87595-arthur-verocai.jpg", "aoty_url": "https://www.albumoftheyear.org/album/87595-arthur-verocai-arthur-verocai.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "a48fe1e7-a088-3797-b4e8-3dfe45766faf", "yt_id": "vQg-ItQRfMc", "rym": "https://rateyourmusic.com/release/album/arthur-verocai/arthur-verocai", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Born Arthur Cortes Verocai in Rio de Janeiro, Brazil on 17/6/1945, he studied music with Lô Soares, Darci Villaverde, Nair Barbosa da Silva, Roberto Menescal and Vilma Graça. In 1966 Leny Andrade included his song \"Olhando o Mar\" (\"Looking at the Sea\") on her \"We Are There\" album. Two years later Verocai participated in Musicanossa an event that brought together composers, musicians and singers in presentations to play live in the Santa Rosa Theater in Rio de Janeiro, for which he wrote his first arrangements.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave", "paqueradejere"]}, {"n": 173, "title": "Superfly", "artist": "Curtis Mayfield", "year": 1972, "cover": "https://dn710606.ca.archive.org/0/items/mbid-df1c3d1f-7180-39b1-a367-8a0a7acb296a/mbid-df1c3d1f-7180-39b1-a367-8a0a7acb296a-2981127856.jpg", "aoty_url": "https://www.albumoftheyear.org/album/13232-curtis-mayfield-superfly.php", "aoty_critic_score": 98, "aoty_user_score": 86, "mbid": "3f68cf91-b4f0-39ef-8318-93dc064a53ba", "yt_id": "kJf31LHU98A", "rym": "https://rateyourmusic.com/release/album/curtis-mayfield/superfly/", "genres": ["soul", "r&b", "funk", "chicago soul"], "desc_lfm_album": "Super Fly is the third studio album by American soul musician Curtis Mayfield, released in July 1972 on Curtom Records. It was released as the soundtrack for the Blaxploitation film of the same name. Widely considered a classic of 1970s soul and funk music, Super Fly was a nearly immediate hit. Its sales were bolstered by two million-selling singles, \"Freddie's Dead\" (number 2 R&B charts, number 4 Pop charts) and the title track (number 5 R&B, number 8 Pop). Super Fly is one of the few soundtracks to out-gross the film it accompanied. Super Fly, along with Marvin Gaye's What's .", "desc_lfm_artist": "Curtis Mayfield (June 3, 1942 – December 26, 1999) was an American soul, funk and rhythm and blues, singer-songwriter and guitarist from Chicago, Illinois.\n\nMayfield is probably best known for his anthemic music with The Impressions and for the soundtrack to the blaxploitation film Superfly.\n\nPerhaps because he didn't cross over to the pop audience as heavily as Motown's stars, it may be that the scope of Curtis Mayfield's talents and contributions have yet to be fully recognized.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 174, "title": "The Rise and Fall of Ziggy Stardust and the Spiders From Mars", "artist": "David Bowie", "year": 1972, "cover": "https://dn710609.ca.archive.org/0/items/mbid-bb7f0f5a-586e-3f90-8665-fdc547aa2a54/mbid-bb7f0f5a-586e-3f90-8665-fdc547aa2a54-1239299887.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "6c9ae3dd-32ad-472c-96be-69d0a3536261", "yt_id": "XwxEGtorzFY", "rym": "https://rateyourmusic.com/release/album/david-bowie/the-rise-and-fall-of-ziggy-stardust-and-the-spiders-from-mars", "genres": ["art rock", "classic rock", "pop rock", "rock opera", "glam rock", "rock"], "desc_lfm_album": "The Rise and Fall of Ziggy Stardust and the Spiders from Mars is the fifth studio album by David Bowie, released on June 16, 1972, through RCA Records. Described as a loose concept album and rock opera, Ziggy Stardust is about Bowie's titular alter ego Ziggy Stardust, a fictional androgynous and bisexual rock star who is sent to Earth as a saviour before an impending apocalyptic disaster. In the story, Ziggy wins the hearts of fans but suffers a fall from grace after succumbing to his own ego. The character was inspired by numerous musicians, including Vince Taylor. Most of .", "desc_lfm_artist": "David Robert Jones (8 January 1947 – 10 January 2016), known professionally as David Bowie, was an English singer-songwriter and actor. A leading figure in the music industry, he is regarded as one of the most influential musicians of the 20th century. Bowie was acclaimed by critics and musicians, particularly for his innovative work during the 1970s. His career was marked by reinvention and visual presentation, and his music and stagecraft had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 175, "title": "Honky Château", "artist": "Elton John", "year": 1972, "cover": "https://dn710608.ca.archive.org/0/items/mbid-5d34753b-7cb9-34ef-aeb3-0dd73384f54c/mbid-5d34753b-7cb9-34ef-aeb3-0dd73384f54c-3734697776.jpg", "aoty_url": "https://www.albumoftheyear.org/album/13397-elton-john-honky-chateau.php", "aoty_critic_score": 99, "aoty_user_score": 80, "mbid": "e17f2d6e-7849-37f9-a6d8-cda4d59cea28", "yt_id": "iPicSRPwogI", "rym": "https://rateyourmusic.com/release/album/elton-john/honky-chateau-11", "genres": ["country rock", "classic rock", "pop rock", "soft rock", "piano rock"], "desc_lfm_album": "Honky Château is the fifth studio album by English musician Elton John. It was released in 1972, and was titled after the 18th century French chateau where it was recorded, Château d'Hérouville. The album reached number one in the US, the first of John's seven consecutive US number one albums. In 2012, the album was ranked number 359 on Rolling Stone magazine's list of the 500 greatest albums of all time. It was certified gold in July 1972 and platinum in October 1995 by the RIAA. This was the final Elton John album on the Uni label in the US .", "desc_lfm_artist": "Sir Elton Hercules John (born Reginald Kenneth Dwight; 25 March 1947) is a British singer, pianist, and composer. Collaborating with lyricist Bernie Taupin since 1967, John is one of the most successful artists of all time, having sold over 300 million records worldwide in a seven-decade career in music. He is acclaimed by critics and musicians, particularly for his work during the 1970s, and his lasting impact on the music industry. John's music and showmanship have had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 176, "title": "Exile on Main St.", "artist": "The Rolling Stones", "year": 1972, "cover": "https://dn711000.ca.archive.org/0/items/mbid-d561e006-3d45-45ea-b34f-1a2a06e5cb0d/mbid-d561e006-3d45-45ea-b34f-1a2a06e5cb0d-11291576233.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5440-the-rolling-stones-exile-on-main-st.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "4838a3c9-fd2b-30a5-83eb-e32545b5d7fc", "yt_id": "Sqk1kdjk5o0", "rym": "https://rateyourmusic.com/release/album/the-rolling-stones/exile-on-main-st", "genres": ["blues rock", "country rock", "classic rock", "hard rock", "roots rock", "r&b"], "desc_lfm_album": "Exile on Main St. is a double album by English rock band The Rolling Stones. It was released on 12 May 1972 by Rolling Stones Records. The album's music incorporates rock and roll, blues, soul, country, and gospel genres. Although it originally received mixed reviews, Exile on Main St. has been ranked on various lists as one of the greatest albums of all time.The 2010 remastered version of the album was released in Europe on 17 May 2010 and in the United States on 18 May 2010, featuring a bonus disc with 10 new tracks Recording: Exile on Main St. .", "desc_lfm_artist": "The Rolling Stones are an English rock band formed in London in 1962. Active for six decades, they are one of the most popular and enduring bands of the rock era. In the early 1960s, the Rolling Stones pioneered the gritty, rhythmically driven sound that came to define hard rock. Their first stable line-up consisted of vocalist Mick Jagger, multi-instrumentalist Brian Jones, guitarist Keith Richards, bassist Bill Wyman, and drummer Charlie Watts. During their formative years", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 177, "title": "You Don't Mess Around with Jim", "artist": "Jim Croce", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/46490-you-dont-mess-around-with-jim-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/46490-jim-croce-you-dont-mess-around-with-jim.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "68dfa5cd-f9eb-3deb-83c7-95f72704f4fb", "yt_id": "38B81cpwjNA", "rym": null, "genres": [], "desc_lfm_album": "You Don't Mess Around with Jim is the third studio album by American singer-songwriter Jim Croce, released in 1972. On release, the album spent 93 weeks on the US album charts, longer than any other Jim Croce album. .", "desc_lfm_artist": "Jim Croce (Jan 10, 1943 ‒ Sept 20, 1973) was an American singer-songwriter from South Philadelphia whose biggest single \"Bad, Bad Leroy Brown\" hit number 1 on the US charts in the summer of 1973. His influences included Ian & Sylvia, Gordon Lightfoot and Woody Guthrie. Sadly, Croce died in a small commercial plane crash one day before his third album, \"I Got a Name\" was to be released.\n\nEarly life\n\nCroce was born in South Philadelphia. He graduated from Upper Darby High School in Drexel Hill", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 178, "title": "Machine Head", "artist": "Deep Purple", "year": 1972, "cover": "https://dn710205.ca.archive.org/0/items/mbid-0aba4008-b3e2-443e-8d44-985bee0f3c3e/mbid-0aba4008-b3e2-443e-8d44-985bee0f3c3e-34266599999.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15393-deep-purple-machine-head.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "d00243c5-adcf-3018-9aa7-1957d7a5a774", "yt_id": "hMCVe0cs4DI", "rym": "https://rateyourmusic.com/release/album/deep-purple/machine-head", "genres": ["classic rock", "rock"], "desc_lfm_album": "Machine Head is the sixth Deep Purple studio album. It was recorded at the Grand Hotel Montreux, Switzerland in December 1971 with the Rolling Stones Mobile Studio, and released in March 1972. The album is often cited as being very influential in the development of the heavy metal music genre. It is Deep Purple's most successful recording, topping the charts in several countries following its release. In 2001 Q magazine named it as one of the 50 Heaviest Albums of All Time. Machine Head is the subject of one of the Classic Albums series of documentaries about the making of .", "desc_lfm_artist": "Deep Purple are a British rock band formed in London in 1968. They are regarded as pioneers of heavy metal and modern hard rock, although their musical style has incorporated elements of psychedelic rock, progressive rock, and blues rock over the course of their career. After beginning with a more psychedelic and progressive approach, they moved toward a heavier sound with the 1970 album \"Deep Purple in Rock\". Along with Led Zeppelin and Black Sabbath", "desc_mb_album": "", "desc_mb_artist": "'''Deep Purple Mk 1 (1968–1969)''' were\n[artist:fc5f555c-dfa2-4f16-9da5-98342105c23a|Ritchie Blackmore] (guitar), [artist:ed031718-b94c-403d-8a89-438e355db488|Rod Evans] (vocals), [artist:00929331-8a98-4651-9052-6feaf0458b81|Nick Simper] (bass, vocals), [artist:6bf692e0-baac-4428-94c3-423d52508cf0|Jon Lord] (organ, keyboards), [artist:29c11f6b-df9f-454f-964e-75eedadb4a1e|Ian Paice] (drums)\n\n'''Deep Purple Mk 2 (1969–1973)''' were\n[artist:fc5f555c-dfa2-4f16-9da5-98342105c23a|Ritchie Blackmore] (guitar), [artist:ff2a0e30-aec1-44dd-ae06-dc78877f512d|Ian Gillan] (vocals), [artist:583944a8-d43b-42e9-8e3c-29eb89f53587|Roger Glover] (bass), [artist:6bf692e0-baac-4428-94c3-423d52508cf0|Jon Lord] (organ, keyboards), [artist:29c11f6b-df9f-454f-964e-75eedadb4a1e|Ian Paice] (drums)\n\n'''Deep Purple Mk ", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 179, "title": "Thick as a Brick", "artist": "Jethro Tull", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10173-thick-as-a-brick_105929.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10173-jethro-tull-thick-as-a-brick.php", "aoty_critic_score": 68, "aoty_user_score": 85, "mbid": "13081627-5418-300c-af24-f65875ab61b7", "yt_id": "X15PsqN0DHc", "rym": "https://rateyourmusic.com/release/album/jethro-tull/thick-as-a-brick", "genres": [], "desc_lfm_album": "Jethro Tull's first LP-length epic is a masterpiece in the annals of progressive rock, and one of the few works of its kind that still holds up decades later. Mixing hard rock and English folk music with classical influences, set to stream-of-consciousness lyrics so dense with imagery that one might spend weeks pondering their meaning -- assuming one feels the need to do so -- the group created a dazzling tour de force, at once playful, profound, and challenging, without overwhelming the listener. The original LP was the best-sounding, best-engineered record Tull had ever released, easily capturing the shifting dynamics .", "desc_lfm_artist": "Jethro Tull is a British rock band formed in Blackpool, Lancashire in 1967. The band initially played blues rock and jazz fusion before incorporating elements of English folk music, hard rock, and classical music, developing a distinctive progressive rock sound. Ian Anderson, the band's founder, leader, principal composer, and lead vocalist, has been the only constant member. Anderson is a multi-instrumentalist, primarily playing flute and acoustic guitar.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "armandwave", "verygooood"]}, {"n": 180, "title": "Music of My Mind", "artist": "Stevie Wonder", "year": 1972, "cover": "https://ia601904.us.archive.org/35/items/mbid-54d0d4ee-1b1b-464c-8bbe-dd4417acf276/mbid-54d0d4ee-1b1b-464c-8bbe-dd4417acf276-19021245620.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10653-stevie-wonder-music-of-my-mind.php", "aoty_critic_score": 86, "aoty_user_score": 81, "mbid": "5a253b10-e9f8-334c-b343-7f14e92402c2", "yt_id": "O5o97EEehfY", "rym": "https://rateyourmusic.com/release/album/stevie-wonder/music-of-my-mind", "genres": ["soul", "r&b", "funk", "funk / soul"], "desc_lfm_album": "Quite possibly what could be called the beginning of Stevie Wonder's \"classic period\", Music of My Mind is the first time his audience hears him fully experiment with the instrumentation of his records by using the rather sparse and sporadic synthesizer on every track. Though full creative control over his records was given to Wonder on his previous album, Where I'm Coming From, this is the first time we hear Stevie breakaway from the conventional Motown sound provided by The Funk Brothers (who were session musicians whom provided the backing for most of the Motown recordings from 1959-1972). As usual .", "desc_lfm_artist": "Stevie Wonder is the stage name of Stevland Hardaway Morris (b. Stevland Hardaway Judkins, 13 May 1950 in Saginaw, MI, USA - a.k.a. Little Stevie Wonder), a singer, multi-instrumentalist, composer,  record producer and activist.  He débuted, as Little Stevie Wonder, with the single \"I Call It Pretty Music but the Old People Call It the Blues\" (1961, Tamla Motown) and his latest album is \"A Time To Love\" (Oct 2005, Motown)\n\nStevland lost his eyesight shortly after birth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd"]}, {"n": 181, "title": "Clube da Esquina", "artist": "Milton Nascimento & Lô Borges", "year": 1972, "cover": "https://dn721908.ca.archive.org/0/items/mbid-b934e4e6-a053-491d-bb43-d4ddbeb205fb/mbid-b934e4e6-a053-491d-bb43-d4ddbeb205fb-43259229058.jpg", "aoty_url": "https://www.albumoftheyear.org/album/40467-milton-nascimento-lo-borges-clube-da-esquina.php", "aoty_critic_score": 88, "aoty_user_score": 90, "mbid": "b29e94e7-0b0b-3a66-ab06-e02f8fa5054f", "yt_id": "GGmGMEVbTAY", "rym": null, "genres": ["mpb", "latin"], "desc_lfm_album": "Clube da Esquina is a collaborative studio album by Milton Nascimento and Lô Borges. Ir was released in March 1972, via EMI-Odeon Records. The duo recorded the album in November 1971 at Piratininanga Beach in Niterói and Odeon Studios in Rio de Janeiro, where they collaborated with musicians from the eponymous musical collective, which they helped to establish. .", "desc_lfm_artist": "Milton Nascimento and Lô Borges, both renowned masters of the Clube da Esquina (in English \"Corner Club\") movement, wrote and performed several pieces together. The most remarkeable fruit of their collaborative labour has to be the double-album \"Clube da Esquina\" (originally released on EMI Odeon, 1972), named after the particular post-bossa nova style, which Nascimento, Lô Borges, Márcio Borges, Fernando Brant, Ronaldo Bastos a.o. helped to flourish.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 182, "title": "Harvest", "artist": "Neil Young", "year": 1972, "cover": "https://dn710307.ca.archive.org/0/items/mbid-1cf4c76b-9cfb-3999-af86-34bc14b18ee0/mbid-1cf4c76b-9cfb-3999-af86-34bc14b18ee0-13369134145.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5402-neil-young-harvest.php", "aoty_critic_score": 83, "aoty_user_score": 85, "mbid": "b25419cf-71bf-3a54-8cd4-2161c61056a0", "yt_id": "TuXMQQtcQ_U", "rym": "https://rateyourmusic.com/release/album/neil-young/harvest", "genres": ["folk rock", "country rock", "rock and roll", "classic rock", "country"], "desc_lfm_album": "Harvest is an album by Neil Young, which was the best-selling album of 1972. The album featured several high calibre guests, including the London Symphony Orchestra, Linda Ronstadt, Stephen Stills, Graham Nash, David Crosby and James Taylor. Harvest hit #1 on the Billboard Music Charts (North America) pop albums chart, spawning two hit singles, \"Old Man\", which peaked at #31 on the Billboard Hot 100, and \"Heart of Gold\", which peaked at #1. After the supergroup Crosby, Stills, Nash & Young split, Young recruited a new group of country session musicians, which he christened The Stray Gators and recorded a .", "desc_lfm_artist": "Neil Percival Young (born November 12, 1945) is a Canadian singer, guitarist, songwriter, and social activist who is widely regarded as one of the most influential musicians of his generation, particularly as Neil Young & Crazy Horse. Young was born in Toronto, but he moved to the family home of Winnipeg as a child, which is where his music career began. Young began performing as a solo artist in Canada in 1960, before moving to California in 1966, where he co-founded the band Buffalo Springfield along with Stephen Stills and Richie Furay.", "desc_mb_album": "", "desc_mb_artist": "... has a gigography at [http://www.sugarmtn.org].", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 183, "title": "Pink Moon", "artist": "Nick Drake", "year": 1972, "cover": "https://dn721404.ca.archive.org/0/items/mbid-8fc8c213-6de1-4552-8196-1c65989c389d/mbid-8fc8c213-6de1-4552-8196-1c65989c389d-39411588958.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5886-nick-drake-pink-moon.php", "aoty_critic_score": 96, "aoty_user_score": 89, "mbid": "740ec10a-e887-38a6-a04d-fe2069c9e2a7", "yt_id": "ZgHdUeMHTwc", "rym": "https://rateyourmusic.com/release/album/nick-drake/pink-moon", "genres": ["folk rock", "folk", "contemporary folk", "folk pop"], "desc_lfm_album": "Pink Moon is the third and final studio album by Nick Drake, released in 1972. Unlike his previous albums, which featured lush arrangements and orchestration, Pink Moon is a stark, minimalist work consisting only of Drake’s voice, acoustic guitar, and a brief piano overdub on the title track. This stripped-down approach gives the album an intimate, haunting quality that has since become legendary. The album cover, designed by Michael Trevithick, reflects the album’s dreamlike and introspective nature. While Drake never publicly explained its meaning, the artwork has become as iconic as the music itself, adding to the album’s mystique. Though .", "desc_lfm_artist": "Nick Drake (Nicholas Rodney Drake, Yangon, Myanmar, June 19, 1948 - Tanworth-in-Arden, Warwickshire, England, November 25, 1974) was an English folk singer known for his gentle, enigmatic songs and his virtuosic right-hand finger picking technique.\n\nAlthough he recorded only three albums, critics and fellow musicians hold his work in very high esteem. Drake failed to find a wide audience during his lifetime and had a strong aversion to performing. Since his death, however, Drake's music has gained a significant cult following.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 184, "title": "Transa", "artist": "Caetano Veloso", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/17335-transa.jpg", "aoty_url": "https://www.albumoftheyear.org/album/17335-caetano-veloso-transa.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "fbd4a178-0c4a-3979-b626-8f2f3e3e335d", "yt_id": "2NjrZqzULfw", "rym": "https://rateyourmusic.com/release/album/caetano-veloso/transa/", "genres": [], "desc_lfm_album": "Transa é um álbum do cantor brasileiro Caetano Veloso. O disco foi lançado em LP em janeiro de 1972. Esse álbum foi eleito em uma lista da versão brasileira da revista Rolling Stone como o décimo melhor disco brasileiro de todos os tempos. .", "desc_lfm_artist": "Caetano Emanoel Viana Teles Veloso (born August 7, 1942 in Santo Amaro, Bahia, Brazil), professionally known as Caetano Veloso, is a singer, composer, musician, producer, arranger, writer and political activist, being one of the most popular and influential Brazilian MPB artists of all time. With a career that exceeds five decades, Caetano has built a musical work marked by renewal and widely considered to possess great intellectual and poetic value.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 185, "title": "Let My Children Hear Music", "artist": "Charles Mingus", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6662-let-my-children-hear-music_193622.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6662-charles-mingus-let-my-children-hear-music.php", "aoty_critic_score": 100, "aoty_user_score": 88, "mbid": "d0d9a8b2-4df6-3c28-9cbc-bfacb02ae8c9", "yt_id": "TKd_f2QBpvQ", "rym": "https://rateyourmusic.com/release/album/charles-mingus/let-my-children-hear-music", "genres": [], "desc_lfm_album": "Release Date: September 23, 1971 As Audio CD: April 21, 1992 Label: Columbia Records .", "desc_lfm_artist": "Charles Mingus (22nd April 1922 – 5th January 1979) was an American jazz bassist, composer, bandleader, and occasional pianist from Los Angeles. He was also known for his activism against racial injustice.\n\nMingus' legacy is notable: he is ranked among the finest composers and performers in jazz, and recorded many highly regarded albums. Dozens of musicians passed through his bands and later went on to impressive careers. His songs - though melodic and distinctive - are not often recorded by later musicians", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 186, "title": "Black Unity", "artist": "Pharoah Sanders", "year": 1972, "cover": "https://cdn2.albumoftheyear.org/600x0/album/64367-black-unity_022335.jpg", "aoty_url": "https://www.albumoftheyear.org/album/64367-pharoah-sanders-black-unity.php", "aoty_critic_score": 84, "aoty_user_score": 85, "mbid": "f13253d0-122c-3e29-88d8-343fb569272f", "yt_id": "mNn78K8D7NU", "rym": "https://rateyourmusic.com/release/album/pharoah-sanders/black-unity", "genres": [], "desc_lfm_album": "Bass – Cecil McBee, Stanley Clarke Congas, Talking Drum, Kalimba – Lawrence Killian Drums – Billy Hart, Norman Connors Piano – Joe Bonner Tenor Saxophone – Carlos Garnett Tenor Saxophone, Kalimba , Harmonium, Music By – Pharoah Sanders Trumpet – Hannibal Marvin Peterson .", "desc_lfm_artist": "Pharoah Sanders (1940-2022) was a U.S. jazz saxophonist.\n\nSanders was born on 13th October 1940 in Little Rock, Arkansas, under the name Farrell Sanders. He began his professional career playing tenor saxophone in Oakland, California.\n\nSanders moved to New York City in 1962. He received his nickname \"Pharoah\" from Sun Ra, with whom Sanders performed. He came to prominence playing with John Coltrane's band starting in 1965, as Coltrane began experimenting with the music which would soon become known as avant-garde jazz.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 187, "title": "Let’s Stay Together", "artist": "Al Green", "year": 1972, "cover": "https://dn710304.ca.archive.org/0/items/mbid-8a88c9a7-f5c0-4c41-a87d-4d7415e41981/mbid-8a88c9a7-f5c0-4c41-a87d-4d7415e41981-2264109941.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "eed9ffe2-5731-3b9a-9906-01728a083d1d", "yt_id": "XXx6RDzR6eM", "rym": null, "genres": ["soul", "r&b", "smooth soul", "pop soul", "gospel", "southern soul"], "desc_lfm_album": "", "desc_lfm_artist": "Reverend Albert Green (born April 13 1946 in Forrest City, Arkansas) is an American Grammy award winning soul and gospel singer who enjoyed great popularity in the 70s with hit singles such as \"Let's Stay Together\", Tired of Being Alone\", and \"You Oughta Be With Me\". Green has boasted a voice capable of both fluid high streams of sugar and deep south growls and rasps. He has sold over 20 million records worldwide, and he was also inducted into the Rock and Roll Hall of Fame in 1995", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 188, "title": "Paul Simon", "artist": "Paul Simon", "year": 1972, "cover": "https://dn710704.ca.archive.org/0/items/mbid-98525987-1acb-4a44-898e-fb44fa17a2ba/mbid-98525987-1acb-4a44-898e-fb44fa17a2ba-11383014541.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6312-paul-simon-paul-simon.php", "aoty_critic_score": 100, "aoty_user_score": 80, "mbid": "602d0c54-2901-3469-a683-a5a50f3e5260", "yt_id": "EIZwHUC_sgc", "rym": "https://rateyourmusic.com/release/album/paul-simon/paul-simon-21", "genres": ["folk rock", "folk", "pop rock", "blues", "folk pop", "soft rock"], "desc_lfm_album": "Paul Simon is the second solo studio album by American singer-songwriter Paul Simon. It was released in January 1972, nearly two years after he split up with longtime musical partner Art Garfunkel. .", "desc_lfm_artist": "Paul Frederic Simon (born October 13, 1941) is an American singer-songwriter. One of the most celebrated artists of the twentieth century, Simon's career has spanned six decades. Born in New Jersey, Simon grew up in the borough of Queens in New York City and developed an interest in rock music in his teens.\n\nHe began performing with his schoolfriend Art Garfunkel in 1956; together the two came to prominence in the 1960s as Simon & Garfunkel. The duo's blend of folk and rock music in hits like \"The Sound of Silence\", \"Mrs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "verygooood"]}, {"n": 189, "title": "Hunky Dory", "artist": "David Bowie", "year": 1971, "cover": "https://ia801508.us.archive.org/26/items/mbid-98d6d2b9-d173-3313-a5d9-c740753c1a66/mbid-98d6d2b9-d173-3313-a5d9-c740753c1a66-1951275113.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6330-david-bowie-hunky-dory.php", "aoty_critic_score": 99, "aoty_user_score": 86, "mbid": "743b0b2e-a23a-3182-950e-232f8cb0dfb7", "yt_id": "NNfY091jDRs", "rym": "https://rateyourmusic.com/release/album/david-bowie/hunky-dory/", "genres": ["art rock", "pop rock", "glam rock"], "desc_lfm_album": "Hunky Dory is the fourth studio album by English musician David Bowie, released on December 17, 1971, through RCA Records. Compared to the guitar-driven hard rock sound of his 1970 album, The Man Who Sold the World, Bowie opted for a warmer, more melodic piano-based pop rock and art pop style on Hunky Dory. His lyrical concerns on the record range from the compulsive nature of artistic reinvention on \"Changes\", to occultism and Nietzschean philosophy on \"Oh! You Pretty Things\" and \"Quicksand\"; several songs make cultural and literary references. He was also inspired by his stateside tour to write songs .", "desc_lfm_artist": "David Robert Jones (8 January 1947 – 10 January 2016), known professionally as David Bowie, was an English singer-songwriter and actor. A leading figure in the music industry, he is regarded as one of the most influential musicians of the 20th century. Bowie was acclaimed by critics and musicians, particularly for his innovative work during the 1970s. His career was marked by reinvention and visual presentation, and his music and stagecraft had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 190, "title": "Islands", "artist": "King Crimson", "year": 1971, "cover": "https://i.discogs.com/vvgl5vf5-tei3P_LJ9yuVSNFMYN8Jzbe1K-IgdxugcY/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTYwOTM5/MTUtMTQxMDkxMzUz/OS01MTg5LmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/15006-king-crimson-islands.php", "aoty_critic_score": 60, "aoty_user_score": 80, "mbid": "294ffbbb-75bb-3f65-b309-94a99fa3c194", "yt_id": "8AvNQk0PmTg", "rym": "https://rateyourmusic.com/release/album/king-crimson/islands", "genres": [], "desc_lfm_album": "Islands is the fourth studio album by English band King Crimson, released in December 1971 on the record label Island. Islands is the only studio album to feature the 1971-1972 touring line-up of Robert Fripp, Mel Collins, Boz Burrell and Ian Wallace. This would be the last album before an entirely new group (except for Fripp) would record the trilogy of Larks' Tongues in Aspic, Starless and Bible Black and Red between 1973-1974. This is also the last album to feature the lyrics of co-founding member Peter Sinfield. The album received a mixed response from critics. The harmonic basis for .", "desc_lfm_artist": "King Crimson are an English progressive rock band formed in London in 1968 by Robert Fripp, Michael Giles, Greg Lake, Ian McDonald and Peter Sinfield. Guitarist and leader Fripp has remained the only constant member throughout the band's long history. The band drew inspiration from a wide variety of music, incorporating elements of classical, jazz, folk, heavy metal, gamelan, blues, industrial, electronic, and experimental music. They also exerted a strong influence on the early 1970s progressive rock movement", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "paqueradejere"]}, {"n": 191, "title": "Fragile", "artist": "Yes", "year": 1971, "cover": "https://ia601309.us.archive.org/5/items/mbid-4a06b4d3-eda0-47cc-aa7f-299bfd5bd9cd/mbid-4a06b4d3-eda0-47cc-aa7f-299bfd5bd9cd-12979452897.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9076-yes-fragile.php", "aoty_critic_score": 89, "aoty_user_score": 83, "mbid": "b1176e7b-fa2e-3b28-959a-d8f55b5b6ccf", "yt_id": "jFB9aujS610", "rym": "https://rateyourmusic.com/release/album/yes/fragile", "genres": ["progressive rock"], "desc_lfm_album": "Fragile is the fourth album by British progressive rock band Yes, After \"Yes\", \"Time and a Word\" and \"The Yes Album\". It is best known for the song \"Roundabout\", which was released in an edited version as a U.S. single and became one of the band's best-known songs. This was Rick Wakeman's first album with Yes and also their first trans-atlantic Top 10 release. Fragile was issued in the UK in November 1971, but was held back in North America for two months because of the still-growing momentum of The Yes Album. Unlike Yes' previous releases, this album showcased the .", "desc_lfm_artist": "Yes is a British progressive rock band which formed in London, United Kingdom in 1968. They are best known for 1970's \"I've Seen All Good People\", the 1972 9-minute US Top 20 smash \"Roundabout\" and their 1983 #1 hit \"Owner of a Lonely Heart\". Despite many lineup changes, occasional splits and the influence of the many changes in popular music, the band has endured for 40 years and still retains a strong international following. Their music is marked by sharp dynamic contrasts", "desc_mb_album": "", "desc_mb_artist": "In 2017, former members Jon Anderson, Trevor Rabin and Rick Wakeman changed the name of their group ARW to [[https://musicbrainz.org/artist/d49ba74d-343b-48f3-8180-3a14821bf6a8|Yes featuring ARW]]. There is an ongoing dispute over the rights to the Yes band name. '''Please do not merge the two artists.'''", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 192, "title": "There’s a Riot Goin’ On", "artist": "Sly & the Family Stone", "year": 1971, "cover": "https://dn710306.ca.archive.org/0/items/mbid-75717ad0-80a8-31dc-8292-c0231625d2af/mbid-75717ad0-80a8-31dc-8292-c0231625d2af-11265442877.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "d8b8448a-2634-3e92-ac86-cf55e018f825", "yt_id": "uJZHm5_i1vI", "rym": "https://rateyourmusic.com/release/album/sly-and-the-family-stone/theres-a-riot-goin-on", "genres": ["soul", "psychedelic soul", "r&b", "funk", "progressive soul", "deep funk"], "desc_lfm_album": "", "desc_lfm_artist": "Sly & the Family Stone were a band from Vallejo, California, United States. Active from 1966 until 1975, the band was pivotal in the development of soul, funk and psychedelia. Headed by singer, songwriter, record producer, and multi-instrumentalist Sly Stone, and containing several of his family members and friends, the band was the first major American rock band to have an integrated lineup in both race and gender.\n\nBrothers Sly Stone and singer/guitarist", "desc_mb_album": "", "desc_mb_artist": "The 1975 album \"High on You\" was credited to \"Sly Stone\" and can be found in MB at http://musicbrainz.org/album/619cba8a-5d27-4546-9fa1-beb5ea7bcb15.html", "heard_by": ["MaxtorUwU", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 193, "title": "Nursery Cryme", "artist": "Genesis", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9168-nursery-cryme_105751.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9168-genesis-nursery-cryme.php", "aoty_critic_score": 63, "aoty_user_score": 80, "mbid": "863a205e-07c3-3930-8561-a23045719466", "yt_id": "jGZaH0JEiic", "rym": "https://rateyourmusic.com/release/album/genesis/nursery-cryme", "genres": [], "desc_lfm_album": "Nursery Cryme is the third studio album by Genesis and was recorded and released in 1971. It is also the first album to feature the lineup of Peter Gabriel, Tony Banks, Mike Rutherford, Phil Collins, and Steve Hackett; the latter two replacing John Mayhew and Anthony Phillips, on drums and guitar respectively, in 1970. This lineup would remain consistent until Gabriel's departure in 1975. Though not as polished in production terms as the albums that followed (most of the songs were only recorded on 8-track), Nursery Cryme was still a large progression from the group's second album Trespass. Although the .", "desc_lfm_artist": "There are at least three bands using the moniker Genesis;\n\n1) Genesis was an English rock band formed at Charterhouse School, Godalming, Surrey, in 1967. The band's longest-existing and most commercially successful line-up consisted of keyboardist Tony Banks, bassist/guitarist Mike Rutherford and drummer/singer Phil Collins. In the 1970s, during which the band also included singer Peter Gabriel and guitarist Steve Hackett, Genesis were among the pioneers of progressive rock. Banks and Rutherford were the only constant members of the group.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 194, "title": "[Led Zeppelin IV]", "artist": "Led Zeppelin", "year": 1971, "cover": "https://dn710600.ca.archive.org/0/items/mbid-c66df7b9-c773-4d7c-9a21-7d3f2518dd29/mbid-c66df7b9-c773-4d7c-9a21-7d3f2518dd29-22086503396.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "2e61da88-39e9-3473-81d2-c964cb394952", "yt_id": "0hLESLXqBLI", "rym": "https://rateyourmusic.com/release/album/led-zeppelin/led-zeppelin-iv", "genres": ["blues rock", "folk rock", "classic rock", "hard rock", "blues", "arena rock"], "desc_lfm_album": "\"Led Zeppelin IV\" is the common, but unofficial name of the untitled fourth album of English rock band Led Zeppelin. It was released on November 8, 1971. It has no official title printed anywhere on the album, but is generally called \"Led Zeppelin IV\" after the band's previous three numbered albums. Atlantic Records catalogs have used the names \"Four Symbols\" and \"The Fourth Album\"; it has also been referred to as Zoso, which the first symbol appears to spell. Led Zeppelin guitarist Jimmy Page frequently refers to the album in interviews as \"the fourth album\" and \"Led Zeppelin IV\", while .", "desc_lfm_artist": "Led Zeppelin were an English rock band formed in London in 1968. The group consisted of Robert Plant on vocals, Jimmy Page on guitar, John Paul Jones on bass and keyboards, and John Bonham on drums. Known for a heavy, guitar-based sound that drew from blues and folk traditions, they are widely regarded as a major influence on the development of hard rock and heavy metal. They became one of the best-selling music artists in history and helped shape album-oriented rock and stadium rock.", "desc_mb_album": "Do not remove editorial brackets from the title as this is officially [https://en.wikipedia.org/wiki/Led_Zeppelin_IV|untitled] but commonly known as '''Led Zeppelin IV'''.\nSee [https://musicbrainz.org/doc/Style/Unknown_and_untitled/Special_purpose_track_title#Untitled_tracks|guidance] and [https://musicbrainz.org/search/edits?auto_edit_filter=&order=desc&negation=0&combinator=and&conditions.2.field=release_group&conditions.2.operator=%3D&conditions.2.name=%5BLed+Zeppelin+IV%5D&conditions.2.args.0=18763&conditions.3.field=type&conditions.3.operator=%3D&conditions.3.args=21|edit history] (particularly [https://musicbrainz.org/edit/16277969#note-16277969-1|this edit] by our [https://musicbrainz.org/user/reosarevok|style leader]).", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 195, "title": "Meddle", "artist": "Pink Floyd", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5252-meddle_081553.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5252-pink-floyd-meddle.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "4e98c9b4-92f6-3049-b9da-a1088b623672", "yt_id": "LMOMIlFNDbc", "rym": "https://rateyourmusic.com/release/album/pink-floyd/meddle", "genres": ["psychedelic rock", "folk rock", "art rock", "classic rock", "space rock", "progressive rock"], "desc_lfm_album": "Meddle is a classic Pink Floyd album recorded and released in 1971, which contains Echoes, one of their longest compositions. A few tibits of information about this album: The song \"Echoes\" was the entire side B of Meddle. \"Echoes\" was also featured on the Pink Floyd feature length, crowd-less show video, titled \"Live at Pompeii\" The lyrics of the song \"One Of These Days\" has only one sentence and it was spoken as opposed to being sung. That Line was : \"One of these days I am going to cut you up into little pieces\" . The song \"Seamus\" was .", "desc_lfm_artist": "Pink Floyd are an English rock band formed in London in 1965 by Syd Barrett (guitar, vocals), Nick Mason (drums), Roger Waters (bass guitar, vocals) and Richard Wright (keyboards, vocals), with David Gilmour (guitar, vocals) joining at the end of 1967. Gaining an early following as one of the first British psychedelic groups, they were distinguished by their extended compositions, sonic experiments, philosophical lyrics, and elaborate live performances, and became a leading progressive rock band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 196, "title": "The Inner Mounting Flame", "artist": "Mahavishnu Orchestra", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/36032-the-inner-mounting-flame_200410.jpg", "aoty_url": "https://www.albumoftheyear.org/album/36032-mahavishnu-orchestra-the-inner-mounting-flame.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "cc166f72-5bb4-3534-941f-e974b20604aa", "yt_id": "5ofh_S52Uks", "rym": "https://rateyourmusic.com/release/album/the-mahavishnu-orchestra-with-john-mclaughlin/the-inner-mounting-flame", "genres": [], "desc_lfm_album": "The Inner Mounting Flame This is the album that made John McLaughlin a semi-household name, a furious, high-energy, yet rigorously conceived meeting of virtuosos that, for all intents and purposes, defined the fusion of jazz and rock a year after Miles Davis' Bitches Brew breakthrough. It also inadvertently led to the derogatory connotation of the word fusion, for it paved the way for an army of imitators, many of whose excesses and commercial panderings devalued the entire movement. Though much was made of the influence of jazz-influenced improvisation in the Mahavishnu band, it is the rock element that predominates, stemming .", "desc_lfm_artist": "The Mahavishnu Orchestra was a jazz-rock fusion group from New York, United States, that debuted in 1970 and dissolved in 1976, reuniting briefly from 1984 to 1987.\n\nIn its first version, the band was led by \"Mahavishnu\" John McLaughlin on acoustic and electric guitars, with Billy Cobham on drums, Rick Laird on electric and acoustic bass, Jan Hammer on electric and acoustic piano, and Jerry Goodman on violin. The group is best known for their two most popular albums: The Inner Mounting Flame (1971) and Birds of Fire (1973).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 197, "title": "Black Moses", "artist": "Isaac Hayes", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/21612-black-moses_234304.jpg", "aoty_url": "https://www.albumoftheyear.org/album/21612-isaac-hayes-black-moses.php", "aoty_critic_score": 82, "aoty_user_score": 88, "mbid": "7ed84a15-1ef3-33bd-8fb4-8d090216b5a2", "yt_id": "XtQBDlSeIOo", "rym": "https://rateyourmusic.com/release/album/isaac-hayes/black-moses-5", "genres": [], "desc_lfm_album": "Black Moses is a double album by Isaac Hayes, released on Stax Records' Enterprise label in 1971. The follow-up to Hayes' successful soundtrack for Shaft (also a double album), Black Moses features Hayes' version of The Jackson 5's hit single \"Never Can Say Goodbye\". Hayes' version became a hit in its own right, peaking at number 22 on the Billboard Hot 100. In addition to \"Never Can Say Goodbye\", other selections on Black Moses include covers of songs made popular by The Carpenters (\"(They Long to Be) Close to You\", Toussaint McCall (\"Nothing Takes the Place of You\"), The Friends .", "desc_lfm_artist": "Isaac Lee Hayes (August 20, 1942 – August 10, 2008) was a trailblazing soul singer, songwriter, composer, musician, producer, and actor whose groundbreaking contributions left an indelible mark on music and culture. Born in Covington, Tennessee, Hayes was raised by his grandparents in Memphis after the loss of his parents. From an early age, he showcased musical talent, singing in church choirs and mastering instruments such as the piano and saxophone.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "paqueradejere"]}, {"n": 198, "title": "Construção", "artist": "Chico Buarque", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/24945-construcao_153800.jpg", "aoty_url": "https://www.albumoftheyear.org/album/24945-chico-buarque-construcao.php", "aoty_critic_score": 95, "aoty_user_score": 90, "mbid": "5da13507-7e60-3dec-b2e7-0e75dba03997", "yt_id": "6MAzAIla1XY", "rym": "https://rateyourmusic.com/release/album/chico-buarque/construcao-3/", "genres": [], "desc_lfm_album": "Construção é um disco do cantor e compositor brasileiro Chico Buarque, lançado em 1971 e composto em períodos entre o exílio de Chico na Itália e sua volta ao Brasil. Liricamente, o álbum é carregado de críticas ao regime militar vigente, principalmente no que concerne à censura imposta pelo governo (\"Cordão\") e pelo estado indigno no qual as condições individuais se encontravam no país (\"Construção\"), além de algumas canções mais clássicas e pessoais (\"Valsinha\" e \"Minha História\"). O disco marca o aguçamento da vertente crítica da poética do autor. Se antes ele harmonizava Bossa Nova com composições veladamente críticas à .", "desc_lfm_artist": "Francisco Buarque de Hollanda, better know as Chico Buarque, is a Brazilian singer-songwriter, guitarist, composer, playwright, writer and poet. He is best known for his music, which often includes social, economic and cultural reflections on Brazil.\n\nThe firstborn son of Sérgio Buarque de Hollanda, Buarque lived at several locations throughout his childhood, though mostly in Rio de Janeiro, São Paulo, and Rome. He wrote and studied literature as a child and found music through the bossa nova compositions of Tom Jobim and João Gilberto.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 199, "title": "John Prine", "artist": "John Prine", "year": 1971, "cover": "https://dn721808.ca.archive.org/0/items/mbid-2b115165-6200-4a7f-9c78-f03b53d42b80/mbid-2b115165-6200-4a7f-9c78-f03b53d42b80-26589888596.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12749-john-prine-john-prine.php", "aoty_critic_score": 98, "aoty_user_score": 81, "mbid": "a13154a4-14a1-3344-ae14-3bea728ebe58", "yt_id": "7lHkugF0nyI", "rym": "https://rateyourmusic.com/release/album/john-prine/john-prine", "genres": ["folk", "contemporary folk", "country", "rock", "folk, world, & country"], "desc_lfm_album": "\"John Prine\" is the debut album by American country-folk singer-songwriter John Prine, released on Atlantic Records in 1971. In 2012, the album was ranked number 452 on Rolling Stone magazine's list of the 500 greatest albums of all time, and subsequently ranked number 149 in a revised version of the list published in 2020. The album features some of Prine's most heralded compositions, including \"Sam Stone\", \"Paradise\" and \"Hello In There\". On all songs except \"Paradise\" and \"Flashback Blues\": John Prine – acoustic guitar, vocals Reggie Young – lead guitar Leo LeBlanc – pedal steel guitar John Christopher – rhythm .", "desc_lfm_artist": "John Edward Prine (October 10, 1946 – April 7, 2020) was an American singer-songwriter of country-folk music. He was active as a composer, recording artist, live performer, and occasional actor from the early 1970s until his death. He was known for an often humorous style of original music that has elements of protest and social commentary.\n\nBorn and raised in Maywood, Illinois, Prine learned to play the guitar at age 14. He attended classes at Chicago's Old Town School of Folk Music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 200, "title": "Pawn Hearts", "artist": "Van Der Graaf Generator", "year": 1971, "cover": "https://dn710804.ca.archive.org/0/items/mbid-0a0bb76e-cf9a-4660-9c0b-be544b0969ee/mbid-0a0bb76e-cf9a-4660-9c0b-be544b0969ee-16319632544.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "d5afa3d7-a3b6-3b95-a812-8416dd292b9b", "yt_id": "VlGDnkM-9O8", "rym": "https://rateyourmusic.com/release/album/van-der-graaf-generator/pawn-hearts", "genres": ["progressive rock", "rock"], "desc_lfm_album": "Pawn Hearts is an album by the British progressive rock band Van der Graaf Generator. It was released in 1971. It is hailed as one of the masterpieces of progressive rock by many fans of the genre. The album held number 1 in Italy for 12 weeks in 1972. Differences between the European and North American releases The original vinyl release in the U.S. and Canada (for example on Buddah Records) contained a fourth track, squeezed between \"Lemmings\" and \"Man-Erg\", which was the band's arrangement of an old BBC Radio 1 closing theme. This instrumental, called \"Theme One\", was originally .", "desc_lfm_artist": "Van der Graaf Generator is a progressive rock band formed in Manchester, England, United Kingdom. They were the first act signed to Charisma Records. The band achieved considerable success in Italy during the 1970s. In 2005 they embarked on a reunion, which continues to the present day.\n\nThe signature Van der Graaf Generator sound in the 1970s was a combination of Peter Hammill's distinctive and dynamic voice and David Jackson's electronically-treated saxophones", "desc_mb_album": "", "desc_mb_artist": "Following the departure of Hugh Banton (organ) and David Jackson (saxophone) and the addition of Nic Potter (bass guitar) and Graham Smith (violin), [http://musicbrainz.org/show/artist/?artistid=36480|Van der Graaf Generator] shortened their name to Van der Graaf in 1977.", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 201, "title": "Electric Warrior", "artist": "T. Rex", "year": 1971, "cover": "https://dn711002.ca.archive.org/0/items/mbid-2e778d53-5187-4d53-9ec9-2fb8ae1a85c8/mbid-2e778d53-5187-4d53-9ec9-2fb8ae1a85c8-11819020454.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5655-t-rex-electric-warrior.php", "aoty_critic_score": 98, "aoty_user_score": 83, "mbid": "e53310bf-8ccc-3d7f-a0b7-5ca4dbababcb", "yt_id": "xhRjj4oIsAY", "rym": "https://rateyourmusic.com/release/album/t-rex/electric-warrior-9", "genres": ["rock and roll", "hard rock", "glam rock"], "desc_lfm_album": "Electric Warrior is the sixth studio album by British rock band T. Rex (being the second album under the name \"T. Rex\", with the first four billed as \"Tyrannosaurus Rex\"). The album marks a big turning point in the band's sound as it dispenses with the folk-oriented music of the previous albums and takes on a new music genre, glam rock. The album also drew attention to the band in the USA with the massive hit \"Get It On\". Though the album is full of rock classics, several of the songs still display something of the lyrical poetics of the .", "desc_lfm_artist": "T. Rex was a British rock band, formed in London in 1967 by singer/songwriter and guitarist Marc Bolan. The band began as a psychedelic folk-rock combo called Tyrannosaurus Rex, a name that was later shortened to T. Rex. In the 1970s, the band had success with glam rock hits like \"Jeepster\", \"Get It On\", \"Ride a White Swan\", \"20th Century Boy\", \"Children of the Revolution\", \"Hot Love\", \"Telegram Sam\", and \"Metal Guru\". After their success in the early and mid-1970s, the band broke up after Bolan was killed in a 1977 car accident.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 202, "title": "Imagine", "artist": "John Lennon", "year": 1971, "cover": "https://dn710103.ca.archive.org/0/items/mbid-25ecefb1-e5bb-4b21-9c2a-ec278318aa63/mbid-25ecefb1-e5bb-4b21-9c2a-ec278318aa63-17285428248.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6072-john-lennon-imagine.php", "aoty_critic_score": 88, "aoty_user_score": 80, "mbid": "f242f304-0f1f-33a5-81a2-7a965b30e3b5", "yt_id": "5pQ9To3DMuo", "rym": "https://rateyourmusic.com/release/album/john-lennon/imagine", "genres": ["folk", "rock and roll", "pop rock", "soft rock", "ballad", "piano rock"], "desc_lfm_album": "Imagine is John Lennon's second solo album and is considered the most popular of his solo works. Recorded and released in 1971, the album tended toward songs that were gentler, more commercial and less avant-garde than the ones he released on his more critically acclaimed previous album, John Lennon/Plastic Ono Band. The difference, he said, was that Imagine was \"chocolate-coated for public consumption\", in reference to the string sections prevalent throughout the album. Basic tracks for the album were recorded in his home studio (Ascot Sound Studios in Tittenhurst Park) with strings overdubs added at the Record Plant in New .", "desc_lfm_artist": "John Winston Ono Lennon (born John Winston Lennon; 9 October 1940 – 8 December 1980) was an English singer, songwriter and musician who gained worldwide fame as the founder, co-songwriter, co-lead vocalist and rhythm guitarist of the Beatles. His work included music, writing, drawings and film. His songwriting partnership with Paul McCartney remains the most successful in history.\n\nBorn in Liverpool, Lennon became involved in the skiffle craze as a teenager.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 203, "title": "Pieces of a Man", "artist": "Gil Scott-Heron", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15445-pieces-of-a-man_223942.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15445-gil-scott-heron-pieces-of-a-man.php", "aoty_critic_score": 82, "aoty_user_score": 88, "mbid": "950f8cdc-da7b-3cd1-8d98-1c73cf5432d9", "yt_id": "AAEpf-i0zwE", "rym": "https://rateyourmusic.com/release/album/gil-scott-heron/pieces-of-a-man", "genres": [], "desc_lfm_album": "Pieces of a Man is the debut studio album of American recording artist Gil Scott-Heron, released in 1971 in stereo format on Flying Dutchman Records in the United States. It was also issued in the United Kingdom on Philips Records in 1972. Recording sessions for the album took place at RCA Studios in New York City on April 19 and 20 in 1971. The album serves as the follow-up to Scott-Heron's live debut album, Small Talk at 125th and Lenox (1970), and it features compositions by Scott-Heron that were recorded in a more conventional song structure rather than the spoken .", "desc_lfm_artist": "Gil Scott-Heron (born April 1, 1949 in Chicago, died May 27, 2011 in New York City) was an American poet and musician, known primarily for his late 1960s and early 1970s work as a spoken word performer, associated with African American militant activists. Heron is perhaps most well known for his poems/songs \"The Revolution Will Not Be Televised\" and \"What's the Word - Johannesburg\" a movement hit during the 1980's South Africa college and national divestment movement in the United States of America.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 204, "title": "Surf’s Up", "artist": "The Beach Boys", "year": 1971, "cover": "https://dn711201.ca.archive.org/0/items/mbid-d54c9a87-f325-4914-a9ad-29978 earlier group, the Detours", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 206, "title": "Tago Mago", "artist": "Can", "year": 1971, "cover": "https://ia800508.us.archive.org/29/items/mbid-8c75af89-acca-384b-85f6-9c9b3688363d/mbid-8c75af89-acca-384b-85f6-9c9b3688363d-14747894023.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6042-can-tago-mago.php", "aoty_critic_score": 98, "aoty_user_score": 86, "mbid": "13d08c0e-14e2-30b2-9ad7-5f501761a8ea", "yt_id": "nLcmoIGudxA", "rym": "https://rateyourmusic.com/release/album/can/tago-mago", "genres": ["progressive rock", "krautrock", "rock"], "desc_lfm_album": "Tago Mago is the second studio album by the German experimental rock band Can, and was originally released as a double LP in 1971 by United Artists. It was the band's first studio album to feature Kenji \"Damo\" Suzuki after their previous vocalist, Malcolm Mooney, quit the band in 1970 due to a nervous breakdown. The album was remastered and released as a SACD in September 2004, and included commentary from former Melody Maker journalist David Stubbs and Bobby Gillespie of Primal Scream. Tago Mago has been described as Can's most extreme record in terms of sound and structure. The .", "desc_lfm_artist": "CAN was a German experimental rock band formed in Cologne in 1968. They split up in 1979 and were active again in 1986, 1988, 1991 and 1999.\n\n\nMembers:\n** Guitar, vocals, violin: Michael Karoli (1968–1979, 1986, 1988, 1991, 1999; died 2001)\n** Drums, percussion, double bass, piano: Jaki Liebezeit (1968–1979, 1986, 1988, 1991, 1999; died 2017)\n** Keyboards, vocals: Irmin Schmidt (1968–1979, 1986, 1988, 1991, 1999)\n** Bass, sound engineer, electronics, vocals, French horn: Holger Czukay (1968–1977, 1986, 1988; died 2017)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "M erto_gu", "armandwave", "sdecandelario"]}, {"n": 208, "title": "Maggot Brain", "artist": "Funkadelic", "year": 1971, "cover": "https://dn721602.ca.archive.org/0/items/mbid-f17855ba-2027-44c0-8a7d-bcdea711d716/mbid-f17855ba-2027-44c0-8a7d-bcdea711d716-8252926144.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6305-funkadelic-maggot-brain.php", "aoty_critic_score": 95, "aoty_user_score": 86, "mbid": "a334e612-e736-3b4f-82b4-c4dfb774983c", "yt_id": "21sP7orRS3c", "rym": "https://rateyourmusic.com/release/album/funkadelic/maggot-brain-10", "genres": ["acid rock", "hard rock", "funk", "p-funk", "funk rock", "rock"], "desc_lfm_album": "It starts with a crackle of feedback shooting from speaker to speaker and a voice intoning, \"Mother Earth is pregnant for the third time, for y'all have knocked her up. I have tasted the maggots of the mind of the universe. I was not offended. For I knew I had to rise above it all or drown in my own shit \" This could only have been utterly bizarre back in 1971 and it's no less so decades later; though the Mothership was well on its way already, Maggot Brain really helped it take off. The instrumental title track is .", "desc_lfm_artist": "Funkadelic was originally the backing band for the doo wop group, The Parliaments. The band was added in 1964, primarily for tours, and consisted of Frankie Boyce, Richard Boyce and Langston Booth. They enlisted in the army in 1966, and George Clinton (the leader of The Parliaments) recruited Billy Bass Nelson and Eddie Hazel in 1967, then also adding Tawl Ross and Tiki Fulwood.\n\nDue to legal difficulties between Clinton and Revilot, The Parliaments' label", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 209, "title": "Blue", "artist": "Joni Mitchell", "year": 1971, "cover": "https://dn710604.ca.archive.org/0/items/mbid-243fb7b0-e7f3-42e8-b
