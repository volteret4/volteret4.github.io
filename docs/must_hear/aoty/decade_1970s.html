 is a name used by at least four musical performers:\n\n1. \"Eno was the original stage-name of experimental musician Brian Eno prior to the release of the Discreet Music album. Eno studied at art school, taking inspiration from minimalist painting, but he had little musical education or playing experience when he joined the band Roxy Music as their keyboards and synthesisers player in the early 1970s. Roxy Music's success in the glam rock scene came quickly", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 94, "title": "Horses", "artist": "Patti Smith", "year": 1975, "cover": "https://dn710601.ca.archive.org/0/items/mbid-96c08749-3ffe-37f2-a226-132c6e59c17d/mbid-96c08749-3ffe-37f2-a226-132c6e59c17d-11436427595.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7217-patti-smith-horses.php", "aoty_critic_score": 100, "aoty_user_score": 85, "mbid": "ff8f533c-3cb3-3877-9209-11f433edaad2", "yt_id": "bXXQNtsBXYU", "rym": "https://rateyourmusic.com/release/album/patti-smith/horses", "genres": ["art rock", "garage rock", "proto-punk", "art punk", "punk", "punk rock"], "desc_lfm_album": "Horses is the debut studio album by American musician Patti Smith, released on November 10, 1975, on Arista Records. Smith, a fixture of the then-burgeoning New York punk rock music scene, began recording Horses with her band in 1975 after being signed to Arista Records, with John Cale being enlisted to produce the album. With its fusion of simplistic rock and roll structures and Smith's freeform, Beat poetry-infused lyrics, Horses was met with widespread critical acclaim upon its initial release. Despite a lack of airplay or a popular single to support the album, it nonetheless experienced modest commercial success, managing .", "desc_lfm_artist": "Patricia Lee \"Patti\" Smith (born December 30, 1946) is an American singer, poet and visual artist who was a highly influential component of the New York punk rock movement, particularly with her 1975 début album 'Horses'. Called the \"Godmother of Punk\", she integrated the beat poetry performance style with three-chord rock. Smith's most widely known song is \"Because the Night\", which was co-written with Bruce Springsteen and reached number 13 on the Billboard Hot 100 chart in 1978.", "desc_mb_album": "", "desc_mb_artist": "Not to be confused with [http://musicbrainz.org/artist/b7bf6771-2552-4fc4-8c48-66f042f04198|Patty Smyth]. See [http://musicbrainz.org/artist/26638df8-ef34-40d1-8d93-616836b72878|Patti Smith Group] for releases you may have expected finding here.", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 95, "title": "Zuma", "artist": "Neil Young", "year": 1975, "cover": "https://dn710007.ca.archive.org/0/items/mbid-6c728f67-4bfa-3751-b891-2b2b639c7d74/mbid-6c728f67-4bfa-3751-b891-2b2b639c7d74-33720076785.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "13b7462a-0764-3ece-946e-314aa01079cf", "yt_id": "8JJRzNotZ4o", "rym": "https://rateyourmusic.com/release/album/neil-young-with-crazy-horse/zuma", "genres": ["folk rock", "classic rock", "hard rock"], "desc_lfm_album": "Having apparently exorcised his demons by releasing the cathartic Tonight's the Night, Neil Young returned to his commercial strengths with Zuma (named after Zuma Beach in Los Angeles, where he now owned a house). Seven of the album's nine songs were recorded with the reunited Crazy Horse, in which rhythm guitarist Frank Sampedro had replaced the late Danny Whitten, but there were also nods to other popular Young styles in \"Pardon My Heart,\" an acoustic song that would have fit on Harvest, his most popular album, and \"Through My Sails,\" retrieved from one of Crosby, Stills, Nash & Young's abortive .", "desc_lfm_artist": "Neil Percival Young (born November 12, 1945) is a Canadian singer, guitarist, songwriter, and social activist who is widely regarded as one of the most influential musicians of his generation, particularly as Neil Young & Crazy Horse. Young was born in Toronto, but he moved to the family home of Winnipeg as a child, which is where his music career began. Young began performing as a solo artist in Canada in 1960, before moving to California in 1966, where he co-founded the band Buffalo Springfield along with Stephen Stills and Richie Furay.", "desc_mb_album": "", "desc_mb_artist": "... has a gigography at [http://www.sugarmtn.org].", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 96, "title": "The Hissing of Summer Lawns", "artist": "Joni Mitchell", "year": 1975, "cover": "https://dn711006.ca.archive.org/0/items/mbid-9fc9f85d-fe8d-49f5-8199-27ffb4f0991b/mbid-9fc9f85d-fe8d-49f5-8199-27ffb4f0991b-11436409893.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6087-joni-mitchell-the-hissing-of-summer-lawns.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "169a1a7e-f91e-3b10-a136-d94eba6eee2e", "yt_id": "I2rGbFhZrpk", "rym": "https://rateyourmusic.com/release/album/joni-mitchell/the-hissing-of-summer-lawns", "genres": ["folk rock", "jazz", "folk pop", "jazz pop"], "desc_lfm_album": "Joni Mitchell evolved from the smooth jazz-pop of Court and Spark to the radical Hissing of Summer Lawns, an adventurous work that remains among her most difficult records. After opening with the graceful \"In France They Kiss on Main Street,\" the album veers sharply into \"The Jungle Line,\" an odd, Moog-driven piece backed by the rhythms of the warrior drums of Burundi -- a move into multiculturalism that beat the likes of Paul Simon, Peter Gabriel, and Sting to the punch by a decade. While not as prescient, songs like \"Edith and the Kingpin\" and \"Harry's House -- Centerpiece\" are .", "desc_lfm_artist": "Roberta Joan Mitchell (née Anderson; born November 7, 1943) is a Canadian and American singer-songwriter, multi-instrumentalist, and painter. She gained recognition in the 1960s folk music scene for her personal lyrics and distinctive compositions, which later incorporated elements from various genres including pop, jazz, and rock. Over her career, she has received multiple awards, including eleven Grammy Awards, and was inducted into the Rock and Roll Hall of Fame in 1997.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 97, "title": "Minas", "artist": "Milton Nascimento", "year": 1975, "cover": "https://cdn2.albumoftheyear.org/600x0/album/81497-minas_183700.jpg", "aoty_url": "https://www.albumoftheyear.org/album/81497-milton-nascimento-minas.php", "aoty_critic_score": 85, "aoty_user_score": 87, "mbid": "0e3e22e1-708a-3a0d-ac5f-ea3a82261727", "yt_id": "hIGh4S3_JgE", "rym": "https://rateyourmusic.com/release/album/milton-nascimento/minas", "genres": [], "desc_lfm_album": "Minas é o sétimo álbum de estúdio do cantor, violonista e compositor brasileiro Milton Nascimento lançado pela gravadora EMI-Odeon em 1975. A origem do título do disco Minas, deve-se a um garoto chamado Rúbio que juntou as primeiras sílabas do nome e sobrenome do cantor e sugeriu como título para o próximo trabalho do artista. O disco segue a trazer a mesma fórmula dos discos anteriores: produção de Ronaldo Bastos, com direção musical e arranjos de Wagner Tiso. Minas apresenta músicas como \"Fé Cega, Faca Amolada\", \"Paula e Bebeto\" feita com Caetano Veloso, \"Ponta de Areia\", \"Idolatrada\", \"Saudade dos Aviões .", "desc_lfm_artist": "Milton Nascimento (born 26 October, 1942) is a Brazilian songwriter, singer, and guitarist, who is considered one of the foremost icons of Brazilian popular music. His work spans a multitude of genres, from contemporary folk to jazz, and is often rooted in the traditional and indigenous music of the country.\n\nNascimento was born in Rio de Janeiro, and grew up in Três Pontas, Minas Gerais. His mother was the maid Maria do Carmo Nascimento. When he was just a few months old", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 98, "title": "Wish You Were Here", "artist": "Pink Floyd", "year": 1975, "cover": "https://dn720307.ca.archive.org/0/items/mbid-ab775ce9-93b7-43d1-b6a6-7d7af6d8193f/mbid-ab775ce9-93b7-43d1-b6a6-7d7af6d8193f-12699578857.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4215-pink-floyd-wish-you-were-here.php", "aoty_critic_score": 100, "aoty_user_score": 93, "mbid": "1a272023-10d3-38ee-bab3-317b55fcc21d", "yt_id": "Tu7oq3VNgpY", "rym": "https://rateyourmusic.com/release/album/pink-floyd/wish-you-were-here", "genres": ["experimental rock", "psychedelic rock", "art rock", "space rock", "progressive rock", "jazz"], "desc_lfm_album": "The band entered Abbey Road Studios during the first week of 1975 to begin recording on their follow-up to Dark Side of the Moon. In the previous year, they introduced three new pieces to European audiences during the first sets of each show. Two of them, \"Raving and Drooling\" & \"You Gotta Be Crazy\", were ultimately not recorded for Wish You Were Here, but re-shaped and recorded in 1976 for the Animals album as respectively \"Sheep\" and \"Dogs\". The third would take shape as the album's centerpiece, \"Shine on You Crazy Diamond\". During tour rehearsals for the previous year's French .", "desc_lfm_artist": "Pink Floyd are an English rock band formed in London in 1965 by Syd Barrett (guitar, vocals), Nick Mason (drums), Roger Waters (bass guitar, vocals) and Richard Wright (keyboards, vocals), with David Gilmour (guitar, vocals) joining at the end of 1967. Gaining an early following as one of the first British psychedelic groups, they were distinguished by their extended compositions, sonic experiments, philosophical lyrics, and elaborate live performances, and became a leading progressive rock band.", "desc_mb_album": "A DiscID observation: '''[https://musicbrainz.org/cdtoc/7_0c1HUOtL94MTSdKJWc_OENTWo-|7_0c1HUOtL94MTSdKJWc_OENTWo-]'''\n\nThis is the EMI Europe DiscID.  First appeared in EMI SWINDON in 1984 and then lasted 20 years all round EMI Europe...\n\nPink Floyd Archives points out that it is not the Doug Sax 1992 remastered edition on the the 1990s European CDs.  I own this [https://musicbrainz.org/release/6948245b-aa08-4ad2-aeaf-2441d6fa89cd|1994 UDEN \"remaster\"] and this much older [https://musicbrainz.org/release/e2caa244-bf9c-4fd8-8cd4-b00802b02b02|1984 Harvest CD] which has the exact same [https://musicbrainz.org/cdtoc/7_0c1HUOtL94MTSdKJWc_OENTWo-|7_0c1HUOtL94MTSdKJWc_OENTWo- DiscID].  So holds exact same music.  Not actually a \"remaster\" at all!  (Unless they remastered to exact same times and o", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 99, "title": "Born to Run", "artist": "Bruce Springsteen", "year": 1975, "cover": "https://dn721609.ca.archive.org/0/items/mbid-7606de2e-a51f-4cc3-bd3c-1b475b4e1b16/mbid-7606de2e-a51f-4cc3-bd3c-1b475b4e1b16-27066375782.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5602-bruce-springsteen-born-to-run.php", "aoty_critic_score": 97, "aoty_user_score": 85, "mbid": "39b22944-7503-3937-8bba-09b17281cc6a", "yt_id": "W2X0Gf9jfz8", "rym": "https://rateyourmusic.com/release/album/bruce-springsteen/born-to-run", "genres": ["folk rock", "rock and roll", "pop rock", "heartland rock", "piano rock", "brill building"], "desc_lfm_album": "Born to Run is the third album by the American rock singer-songwriter Bruce Springsteen. It was released on August 25, 1975 through Columbia Records. It captured the heaviness of Springsteen's earlier releases while displaying a more diverse range of influences. Born to Run was a critical and commercial success and became Springsteen's breakthrough album. It peaked at number three on the Billboard 200 and reached high positions on charts worldwide. Two singles were released from the album: \"Born to Run\" and \"Tenth Avenue Freeze-Out\", the first helped Springsteen to reach mainstream popularity. The tracks \"Thunder Road\" and \"Jungleland\" became staples .", "desc_lfm_artist": "Bruce Frederick Joseph Springsteen (born September 23, 1949) is an American rock singer, songwriter, and guitarist. Nicknamed \"the Boss\", he has released 21 studio albums during a career spanning six decades, most of which feature his backing band, the E Street Band. Springsteen is a pioneer of heartland rock, a genre combining mainstream rock music with poetic and socially conscious lyrics that feature narratives primarily concerning working class American life.", "desc_mb_album": "", "desc_mb_artist": "You will find the most comprehensive information about '''Bruce Springsteen''' at '''''[http://brucebase.wikidot.com/|BruceBase Wiki]''''' and '''''[http://www.springsteenlyrics.com|SpringsteenLyrics.com]'''''\n\nThe '''''versioning''''' information for '''''studio recordings''''' is taken from the '''[http://brucebase.wikidot.com/stats:on-the-tracks|A studio guide to Bruce Springsteen]''' on the different '''''On The Tracks - recording sessions information''''' pages.", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 100, "title": "Sabotage", "artist": "Black Sabbath", "year": 1975, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7078-sabotage_163717.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7078-black-sabbath-sabotage.php", "aoty_critic_score": 88, "aoty_user_score": 80, "mbid": "8ef6fc58-d87a-46cf-ab9d-077291784ada", "yt_id": "mNnZA5VynNc", "rym": "https://rateyourmusic.com/release/album/black-sabbath/sabotage", "genres": [], "desc_lfm_album": "Black Sabbath began work on their sixth album in February 1975, again in England at Morgan Studios in Willesden, London. They had a decisive vision to differ the sound from their previous album Sabbath Bloody Sabbath. Guitarist Tony Iommi, who produced the album, said that \"We could've continued and gone on and on, getting more technical, using orchestras and everything else which we didn't particularly want to. We took a look at ourselves, and we wanted to do a rock album - Sabbath, Bloody Sabbath wasn't a rock album, really.\" Over the years, singer Ozzy Osbourne has often complained in .", "desc_lfm_artist": "Black Sabbath was an English heavy metal band formed in Birmingham in 1968 by guitarist Tony Iommi, drummer Bill Ward, bassist Geezer Butler, and vocalist Ozzy Osbourne. The band initially performed under the names Polka Tulk Blues Band and later Earth, before adopting the name Black Sabbath in 1969. They became known for lyrical themes influenced by horror and the occult, as well as for the use of down-tuned guitars. Their first three albums, \"Black Sabbath\" and \"Paranoid\" (both 1970)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 101, "title": "Fleetwood Mac", "artist": "Fleetwood Mac", "year": 1975, "cover": "https://cdn2.albumoftheyear.org/600x0/album/27890-fleetwood-mac_201634.jpg", "aoty_url": "https://www.albumoftheyear.org/album/27890-fleetwood-mac-fleetwood-mac.php", "aoty_critic_score": 93, "aoty_user_score": 83, "mbid": "6b5d9bf1-f496-34b5-9488-7df2533d6208", "yt_id": "qs-hn1y7T7c", "rym": "https://rateyourmusic.com/release/album/fleetwood-mac/fleetwood-mac", "genres": [], "desc_lfm_album": "It's unfair to say that Fleetwood Mac had no pop pretensions prior to the addition of Lindsey Buckingham and Stevie Nicks to the lineup in 1975. When they were led by Bob Welch they often flirted with pop, even recording the first version of the unabashedly smooth and sappy \"Sentimental Lady,\" which would later be one of the defining soft rock hits of the late '70s. Still, there's no denying that 1975's Fleetwood Mac represents not just the rebirth of the band, but in effect a second debut for the group -- the introduction of a band that would dominate .", "desc_lfm_artist": "Fleetwood Mac are a British-American rock band, formed in London in 1967. Fleetwood Mac was founded by guitarist Peter Green, drummer Mick Fleetwood and guitarist Jeremy Spencer, before bassist John McVie joined the lineup for their self-titled debut album. Danny Kirwan joined as a third guitarist in 1968. Keyboardist Christine Perfect (later known as Christine McVie), who contributed as a session musician from the second album, married McVie and joined in 1970.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 102, "title": "One Size Fits All", "artist": "Frank Zappa and The Mothers of Invention", "year": 1975, "cover": "https://cdn2.albumoftheyear.org/600x0/album/35617-one-size-fits-all-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/35617-frank-zappa-and-the-mothers-of-invention-one-size-fits-all.php", "aoty_critic_score": 75, "aoty_user_score": 83, "mbid": "19b7d4eb-0fe2-318f-a1f5-242a2e731b4b", "yt_id": "IibcKHMRwIU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "1970-1971; 1973-1975\n\nAfter disbanded the first incarnation of The Mothers of Invention in 1969, Frank Zappa formed a new version of the Mothers in the early 70's that included Ian Underwood, Jeff Simmons, George Duke, Aynsley Dunbar and singers Mark Volman and Howard Kaylan. Later adding bassist Jim Pons this lineup endured through 1971, when Zappa was injured by an audience member during a concert appearance.\n\nZappa focused on big-band and orchestral music while recovering from his injuries", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Rocky_stereo", "armandwave", "paqueradejere"]}, {"n": 103, "title": "Tonight’s the Night", "artist": "Neil Young", "year": 1975, "cover": "https://dn710701.ca.archive.org/0/items/mbid-a75df175-7a8b-4b88-b04e-47cf44e9c17d/mbid-a75df175-7a8b-4b88-b04e-47cf44e9c17d-11436419998.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e0207e33-af06-3862-baba-f42ca722de0d", "yt_id": "RTGjVvQPVWg", "rym": "https://rateyourmusic.com/release/album/neil-young/tonights-the-night", "genres": ["blues rock", "country rock", "classic rock", "hard rock", "rock"], "desc_lfm_album": "Written and recorded in 1973 shortly after the death of roadie Bruce Berry, Neil Young's second close associate to die of a heroin overdose in six months (the first was Crazy Horse guitarist Danny Whitten), Tonight's the Night was Young's musical expression of grief, combined with his rejection of the stardom he had achieved in the late '60s and early '70s. The title track, performed twice, was a direct narrative about Berry: \"Bruce Berry was a working man/He used to load that Econoline van.\" Whitten was heard singing \"Come On Baby Let's Go Downtown,\" a live track recorded years earlier. .", "desc_lfm_artist": "Neil Percival Young (born November 12, 1945) is a Canadian singer, guitarist, songwriter, and social activist who is widely regarded as one of the most influential musicians of his generation, particularly as Neil Young & Crazy Horse. Young was born in Toronto, but he moved to the family home of Winnipeg as a child, which is where his music career began. Young began performing as a solo artist in Canada in 1960, before moving to California in 1966, where he co-founded the band Buffalo Springfield along with Stephen Stills and Richie Furay.", "desc_mb_album": "", "desc_mb_artist": "... has a gigography at [http://www.sugarmtn.org].", "heard_by": ["MaxtorUwU", "Nubis84"]}, {"n": 104, "title": "Troupeau bleu", "artist": "Cortex", "year": 1975, "cover": "https://cdn2.albumoftheyear.org/600x0/album/161407-troupeau-bleu-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/161407-cortex-troupeau-bleu.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "17beaab5-7f01-3511-848a-7b981d4d92ff", "yt_id": "CuHNqaN5CmU", "rym": "https://rateyourmusic.com/release/album/cortex/troupeau-bleu", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Four (or more) artists have gone by the name Cortex: a French jazz-funk group from the 70s, a Swedish punk band, a Spanish metalcore band, a Macedonian thrash/death band and a experimental Belgian project by Alain Neffe, a Norwegian free jazz quartet.\n\n1. A French jazz funk group from the seventies. \nKey members were Alain Mion (Piano) and Alain Gandolfi (drums, percussion). Cortex recorded several albums and singles for the Sonodisc label. 2 albums got re-issued: 'Troupeau Bleu' (on 'Dare-Dare') and 'Volume 2' (on 'Follow Me').", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 105, "title": "Fruto Proibido", "artist": "Rita Lee & Tutti Frutti", "year": 1975, "cover": "https://cdn2.albumoftheyear.org/600x0/album/79686-fruto-proibido_221952.jpg", "aoty_url": "https://www.albumoftheyear.org/album/79686-rita-lee-tutti-frutti-fruto-proibido.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "3c613368-a1d5-3933-b87a-34f6f3eadcf7", "yt_id": "raJZBP613G4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Rita Lee is a central figure in Brazilian rock. A former member of the seminal rock band Os Mutantes, she eventually departed from that group and began an extremely successful solo career in the rock and dance styles that have lasted for more than 30 years.\n\nThe daughter of an amateur female pianist, she never took music lessons. In place of the traditional adolescent debut ball, she asked to receive a drum set. Lee formed a band with two other friends and they were quite good at vocals", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 106, "title": "Physical Graffiti", "artist": "Led Zeppelin", "year": 1975, "cover": "https://dn710607.ca.archive.org/0/items/mbid-e3f0f405-d50f-45a4-ba71-795e7333fb56/mbid-e3f0f405-d50f-45a4-ba71-795e7333fb56-21965725878.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6030-led-zeppelin-physical-graffiti.php", "aoty_critic_score": 87, "aoty_user_score": 88, "mbid": "116c9490-6af4-3827-8261-2d5b1f508fe7", "yt_id": "qhjaUsJ8PIk", "rym": "https://rateyourmusic.com/release/album/led-zeppelin/physical-graffiti", "genres": ["blues rock", "folk rock", "classic rock", "hard rock", "blues", "heavy metal"], "desc_lfm_album": "Physical Graffiti is the sixth album by the English rock band Led Zeppelin. It is a double album which was released on 24 February 1975. Recording sessions for the album were initially disrupted when John Paul Jones considered leaving the band. After reuniting at Headley Grange, the band wrote and recorded eight songs, the combined length of which stretched the album beyond the typical length of an LP. This prompted the band to make Physical Graffiti a double album by including previously unreleased tracks from earlier recording sessions. Physical Graffiti was commercially and critically successful; the album is 16 times .", "desc_lfm_artist": "Led Zeppelin were an English rock band formed in London in 1968. The group consisted of Robert Plant on vocals, Jimmy Page on guitar, John Paul Jones on bass and keyboards, and John Bonham on drums. Known for a heavy, guitar-based sound that drew from blues and folk traditions, they are widely regarded as a major influence on the development of hard rock and heavy metal. They became one of the best-selling music artists in history and helped shape album-oriented rock and stadium rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 107, "title": "Neu! ’75", "artist": "Neu!", "year": 1975, "cover": "https://dn711008.ca.archive.org/0/items/mbid-e80743e3-8f81-4877-b4f2-4931d35346fc/mbid-e80743e3-8f81-4877-b4f2-4931d35346fc-10570578304.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10742-neu-neu-75.php", "aoty_critic_score": 93, "aoty_user_score": 82, "mbid": "34ec11b1-07d4-3a25-a5bf-d43097a91f35", "yt_id": "oO7w90YG3Rg", "rym": "https://rateyourmusic.com/release/album/neu/neu-75", "genres": ["krautrock", "rock", "electronic"], "desc_lfm_album": "", "desc_lfm_artist": "There is more than one artist with the name \"Neu\".\n\n1) Neu! (the German word for \"new\", pronounced \"noy\") a band from Germany, were probably the archetypal example of what the UK music press at the time dubbed krautrock. The band had minimal commercial success when active, but are credited with being a huge influence on a diverse group of artists, including The Sex Pistols, Public Image Ltd., David Bowie, Gary Numan, Ultravox, Simple Minds, DEVO, Sonic Youth, Radiohead,  Stereolab, Wilco as well as the current electronic music scene.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 108, "title": "Blood on the Tracks", "artist": "Bob Dylan", "year": 1975, "cover": "https://dn710902.ca.archive.org/0/items/mbid-ee7f79c0-f52b-45e5-800e-daa8e1d69144/mbid-ee7f79c0-f52b-45e5-800e-daa8e1d69144-2113878756.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5656-bob-dylan-blood-on-the-tracks.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "9c1b8072-eb1d-33d2-af8c-984d46e40902", "yt_id": "8NfDUn4Cy4I", "rym": "https://rateyourmusic.com/release/album/bob-dylan/blood-on-the-tracks", "genres": ["blues rock", "folk rock", "country rock", "contemporary folk"], "desc_lfm_album": "Blood on the Tracks is singer-songwriter Bob Dylan's 15th studio album, released in 1975 by Columbia Records, which marked Dylan's return to Columbia after a two-album stint with Asylum Records. The album, which followed several years of lukewarm reception for Dylan's work, was greeted respectably by fans and critics. In the years following its release, it has come to be regarded as one of his very best albums — making it quite common for subsequent records to be labeled his \"best since Blood on the Tracks.\" It is also commonly seen as a standard for confessional singer-songwriter albums; though Dylan .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 109, "title": "Expensive Shit", "artist": "Fela Kuti & Africa 70", "year": 1975, "cover": "https://i.discogs.com/2LYdLZ8TqZvtnnTyMKqxLYUqNWYO0AFpfsIVuqba5BM/rs:fit/g:sm/q:90/h:450/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTEwODgz/NjY5LTE1MDU5MTc4/NzgtNTQ0MS5tcG8.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/6092-fela-kuti-africa-70-expensive-shit.php", "aoty_critic_score": 87, "aoty_user_score": 84, "mbid": null, "yt_id": "yUNkimxj0Vo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Fela Kuti (born Olufela Olusegun Oludotun Ransome-Kuti;15 October 1938 – 2 August 1997), also known as Fela Anikulapo Kuti or simply Fela, was a Nigerian multi-instrumentalist, musician, composer, pioneer of the Afrobeat music genre, human rights activist, and political maverick.\n\nIn 1969, he toured with his band in Los Angeles and was introduced by a friend to the writings of Black nationalist and Afrocentrist proponents such as Malcolm X and Eldridge Cleaver.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "alberto_gu"]}, {"n": 110, "title": "Relayer", "artist": "Yes", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9079-relayer_134701.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9079-yes-relayer.php", "aoty_critic_score": 64, "aoty_user_score": 83, "mbid": "db835afa-72f9-39d0-ae1b-067836ec5152", "yt_id": "quPoq2699Xo", "rym": "https://rateyourmusic.com/release/album/yes/relayer", "genres": [], "desc_lfm_album": "Relayer is the seventh studio album by the progressive rock band Yes. Recorded and released in 1974, it is the only Yes studio album to feature Patrick Moraz, who replaced keyboardist Rick Wakeman earlier in the year. History After the ambitious double-concept album Tales from Topographic Oceans, Rick Wakeman left Yes to resume his solo career. The band auditioned several prospective replacements, the closest contender being the Greek keyboardist Vangelis. He did not become a member of Yes, but these auditions paved the way for several future collaborations between Vangelis and Jon Anderson. The band finally chose Swiss-born Patrick Moraz .", "desc_lfm_artist": "Yes is a British progressive rock band which formed in London, United Kingdom in 1968. They are best known for 1970's \"I've Seen All Good People\", the 1972 9-minute US Top 20 smash \"Roundabout\" and their 1983 #1 hit \"Owner of a Lonely Heart\". Despite many lineup changes, occasional splits and the influence of the many changes in popular music, the band has endured for 40 years and still retains a strong international following. Their music is marked by sharp dynamic contrasts", "desc_mb_album": "", "desc_mb_artist": "In 2017, former members Jon Anderson, Trevor Rabin and Rick Wakeman changed the name of their group ARW to [[https://musicbrainz.org/artist/d49ba74d-343b-48f3-8180-3a14821bf6a8|Yes featuring ARW]]. There is an ongoing dispute over the rights to the Yes band name. '''Please do not merge the two artists.'''", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave", "verygooood"]}, {"n": 111, "title": "The Lamb Lies Down on Broadway", "artist": "Genesis", "year": 1974, "cover": "https://dn710803.ca.archive.org/0/items/mbid-53a9e4bf-fe0c-3099-9d08-d6bbf235604f/mbid-53a9e4bf-fe0c-3099-9d08-d6bbf235604f-1648019212.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9171-genesis-the-lamb-lies-down-on-broadway.php", "aoty_critic_score": 83, "aoty_user_score": 83, "mbid": "f2e5d462-6ec1-3cf8-8ea8-06eab8fe51f5", "yt_id": "F8Zs6axh7dE", "rym": "https://rateyourmusic.com/release/album/genesis/the-lamb-lies-down-on-broadway", "genres": ["art rock", "pop rock", "progressive rock", "rock opera", "symphonic prog", "rock"], "desc_lfm_album": "The Lamb Lies Down on Broadway (sometimes called simply The Lamb) is a double concept album recorded and released in 1974 by the British progressive rock band Genesis. It was their sixth studio album and the last album by the group to feature the involvement of lead singer Peter Gabriel The album tells the surreal story of a half-Puerto Rican juvenile delinquent named Rael living in New York City, who is swept underground to face bizarre creatures and nightmarish dangers in order to rescue his brother John. Several of the story's occurrences and places were derived from Peter Gabriel's dreams, .", "desc_lfm_artist": "There are at least three bands using the moniker Genesis;\n\n1) Genesis was an English rock band formed at Charterhouse School, Godalming, Surrey, in 1967. The band's longest-existing and most commercially successful line-up consisted of keyboardist Tony Banks, bassist/guitarist Mike Rutherford and drummer/singer Phil Collins. In the 1970s, during which the band also included singer Peter Gabriel and guitarist Steve Hackett, Genesis were among the pioneers of progressive rock. Banks and Rutherford were the only constant members of the group.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 112, "title": "Get Up With It", "artist": "Miles Davis", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19107-get-up-with-it_161328.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19107-miles-davis-get-up-with-it.php", "aoty_critic_score": 89, "aoty_user_score": 86, "mbid": "49f122e4-8eef-3c69-93d4-a4369dc408d8", "yt_id": "loiqgkXCO9s", "rym": "https://rateyourmusic.com/release/album/miles-davis/get-up-with-it", "genres": [], "desc_lfm_album": "Get Up With It is a double album by American jazz trumpeter Miles Davis, released in 1974 on Columbia Records. It is a dense and sprawling work primarily composed of recordings from 1970 to 1974, showcasing Davis's evolving electric jazz fusion sound and his deepening exploration of funk, rock, and avant-garde elements. The album is notable for its extended track lengths, its incorporation of diverse musical textures, and its status as a bridge between the more explicitly rock-influenced *On the Corner* and the introspective *Agharta* and *Pangaea*. Background Following the release of On the Corner in 1972, Miles Davis's experimental .", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 113, "title": "Taking Tiger Mountain By Strategy", "artist": "Brian Eno", "year": 1974, "cover": "https://dn721904.ca.archive.org/0/items/mbid-3418dbca-547b-4291-a990-ecbadfdb4e04/mbid-3418dbca-547b-4291-a990-ecbadfdb4e04-33045040912.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "bdde0830-6795-3a52-aaff-a5daf64184c8", "yt_id": "mNAvsMdGeOU", "rym": "https://rateyourmusic.com/release/album/eno/taking-tiger-mountain-by-strategy", "genres": ["art rock", "glam rock", "art pop", "rock"], "desc_lfm_album": "As wild as Brian Eno’s 1974 debut had been, Taking Tiger Mountain (By Strategy)—released at the end of that same year—was even more ambitious. Working with his former bandmates in Roxy Music, as well as a team of forward-looking adventurers that included Phil Collins and Robert Wyatt, Eno apparently had the goal of packing an album’s worth of ideas into each individual song. This was a notion that resulted in many of his peers making bloated and obtuse prog-rock, but Tiger Mountain remains impressively lean despite its kaleidoscopic concepts. Above all, it’s great fun. Eno gave many rock listeners their .", "desc_lfm_artist": "Brian Peter George Eno (b. 15 May 1948) is an English musician, record producer, visual artist, and theorist best known for his pioneering work in ambient music and contributions to rock, pop, and electronica. A self-described \"non-musician\", Eno has helped introduce unique conceptual approaches and recording techniques to contemporary music. He has been described as one of popular music's most influential and innovative figures.\n\nBorn in Suffolk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 114, "title": "Autobahn", "artist": "Kraftwerk", "year": 1974, "cover": "https://dn710601.ca.archive.org/0/items/mbid-3591d22e-fdc5-309a-91d3-7bbafe086d6c/mbid-3591d22e-fdc5-309a-91d3-7bbafe086d6c-14851814631.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6776-kraftwerk-autobahn.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "f73729e8-4501-3088-aa20-44945296036e", "yt_id": "WxFVhBwGr7U", "rym": "https://rateyourmusic.com/release/album/kraftwerk/autobahn", "genres": ["electro", "krautrock", "progressive electronic", "experimental electronic"], "desc_lfm_album": "Autobahn (German for \"motorway\") is an album by Kraftwerk, released in 1974. The album’s 22-minute title track was edited to about 3 minutes for single release and reached #25 on the US Billboard charts, charting even higher around Europe, including #11 in the UK. This commercial success came after the band had released three highly experimental and purely instrumental albums. Autobahn is not a completely electronic album, as violin, flute, and guitar are used along with synthesizers. The title track features both untreated and vocoded vocals; the remaining tracks are purely instrumental. Kraftwerk used a Minimoog, an ARP Odyssey, an .", "desc_lfm_artist": "Kraftwerk (\"power plant\" in English) are an electronic band founded in 1970 in Düsseldorf, Germany. They pioneered electronic music in the 70s and are considered the most important and influential band of their genre, often described as \"the godfathers of electronic music\". Kraftwerk's sound is minimalistic and strictly electronic; it combines driving, repetitive rhythms with catchy melodies and vocals usually sung through a vocoder. The current line-up consists of Ralf Hütter (the only original member)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 115, "title": "Crime of the Century", "artist": "Supertramp", "year": 1974, "cover": "https://dn711103.ca.archive.org/0/items/mbid-473e390a-bd9a-39e0-9576-34b2d8f0da10/mbid-473e390a-bd9a-39e0-9576-34b2d8f0da10-39145298931.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15560-supertramp-crime-of-the-century.php", "aoty_critic_score": 73, "aoty_user_score": 81, "mbid": "c3749af5-0d0c-3ed1-b1c0-8b4a8f6c3436", "yt_id": "y7R_gflT8tg", "rym": "https://rateyourmusic.com/release/album/supertramp/crime-of-the-century", "genres": ["art rock", "classic rock", "pop rock", "progressive rock", "progressive pop"], "desc_lfm_album": "Supertramp came into their own on their third album, 1974's Crime of the Century, as their lineup gelled but, more importantly, so did their sound. The group still betrayed a heavy Pink Floyd influence, particularly in its expansive art rock arrangements graced by saxophones, but Supertramp isn't nearly as spooky as Floyd -- they're snarky collegiate elitists, an art rock variation on Steely Dan or perhaps a less difficult 10cc, filled with cutting jokes and allusions, best heard on \"Bloody Well Right.\" This streak would later flourish on Breakfast in America, but it's present enough to give them their own .", "desc_lfm_artist": "Supertramp is a British group playing a mix of progressive rock and pop rock that notably had a series of top-selling albums in the 70s, producing several hit singles. The band was formed in the United Kingdom in 1969. All the group's members were musicians capable of playing multiple types of instruments, including brass and woodwinds. Co-founder, composer and lead singer, Roger Hodgson left the band in 1983 to bring up his children. In 1988, Supertramp re-formed with some former members plus several new ones, and they continue to tour.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 116, "title": "Red", "artist": "King Crimson", "year": 1974, "cover": "https://dn710607.ca.archive.org/0/items/mbid-097a5c3e-9210-3264-8e94-d33fe65021d6/mbid-097a5c3e-9210-3264-8e94-d33fe65021d6-21166425919.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6077-king-crimson-red.php", "aoty_critic_score": 92, "aoty_user_score": 90, "mbid": "89bc97c8-921a-3758-8481-3b39c564e297", "yt_id": "7Hcxp1U2pIE", "rym": "https://rateyourmusic.com/release/album/king-crimson/red", "genres": ["art rock", "hard rock", "jazz rock", "progressive rock", "free improvisation"], "desc_lfm_album": "Red is the seventh studio album by English progressive rock band King Crimson. It was released on October 6, 1974 through Island Records in the United Kingdom and Atlantic Records in North America and Japan. The album was recorded at Olympic Studios in London in July and August 1974, and produced by the band themselves. The track \"Providence\" was a free improvisation recorded at their 30 June 1974 concert at the Palace Theater in the city of the same name. Parts of some of the pieces were conceived during previous improvisations performed by the band live. \"Starless\" was originally considered .", "desc_lfm_artist": "King Crimson are an English progressive rock band formed in London in 1968 by Robert Fripp, Michael Giles, Greg Lake, Ian McDonald and Peter Sinfield. Guitarist and leader Fripp has remained the only constant member throughout the band's long history. The band drew inspiration from a wide variety of music, incorporating elements of classical, jazz, folk, heavy metal, gamelan, blues, industrial, electronic, and experimental music. They also exerted a strong influence on the early 1970s progressive rock movement", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 117, "title": "Love in Us All", "artist": "Pharoah Sanders", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/165700-love-in-us-all_023053.jpg", "aoty_url": "https://www.albumoftheyear.org/album/165700-pharoah-sanders-love-in-us-all.php", "aoty_critic_score": 60, "aoty_user_score": 84, "mbid": "afa53a52-9d7c-3171-894b-a513bab1e738", "yt_id": "6ZW0xvo_DB0", "rym": "https://rateyourmusic.com/release/album/pharoah-sanders/love-in-us-all", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Pharoah Sanders (1940-2022) was a U.S. jazz saxophonist.\n\nSanders was born on 13th October 1940 in Little Rock, Arkansas, under the name Farrell Sanders. He began his professional career playing tenor saxophone in Oakland, California.\n\nSanders moved to New York City in 1962. He received his nickname \"Pharoah\" from Sun Ra, with whom Sanders performed. He came to prominence playing with John Coltrane's band starting in 1965, as Coltrane began experimenting with the music which would soon become known as avant-garde jazz.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "paqueradejere"]}, {"n": 118, "title": "New Skin for the Old Ceremony", "artist": "Leonard Cohen", "year": 1974, "cover": "https://lastfm.freetls.fastly.net/i/u/300x300/014721dbaec74cacbce1d461a81e4f78.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15985-leonard-cohen-new-skin-for-the-old-ceremony.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "713b95c0-6259-33a5-9711-6bb791e15e3e", "yt_id": "34wXhWXHMY0", "rym": "https://rateyourmusic.com/release/album/leonard-cohen/new-skin-for-the-old-ceremony", "genres": [], "desc_lfm_album": "New Skin for the Old Ceremony is the fourth studio album by Leonard Cohen, released on August 11, 1974, via Columbia Records. On this album, he begins to evolve away from the rawer sound of his earlier albums, with violas, mandolins, banjos, guitars, percussion and other instruments giving the album a more orchestrated (but nevertheless spare) sound. .", "desc_lfm_artist": "Leonard Norman Cohen (September 21, 1934 – November 7, 2016) was a Canadian songwriter  poet, singer, and novelist. His work explored religion, politics, isolation, sexuality, and romantic relationships. Cohen was inducted into the Canadian Music Hall of Fame, the Canadian Songwriters Hall of Fame, and the Rock and Roll Hall of Fame. He was invested as a Companion of the Order of Canada, the nation's highest civilian honour. In 2011, Cohen received one of the Prince of Asturias Awards for literature and the ninth Glenn Gould Prize.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Rocky_stereo", "armandwave"]}, {"n": 119, "title": "Rock Bottom", "artist": "Robert Wyatt", "year": 1974, "cover": "https://dn710707.ca.archive.org/0/items/mbid-ff765c1e-bfdc-399d-8a0c-538aed56921e/mbid-ff765c1e-bfdc-399d-8a0c-538aed56921e-9113858281.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6324-robert-wyatt-rock-bottom.php", "aoty_critic_score": 92, "aoty_user_score": 80, "mbid": "94a36264-ab82-34b7-ae9d-2320803c4516", "yt_id": "agCX2RQWN44", "rym": "https://rateyourmusic.com/release/album/robert-wyatt/rock-bottom", "genres": ["avant-garde", "art rock", "canterbury scene", "experimental"], "desc_lfm_album": "Rock Bottom is the second solo album (the first post-Soft Machine) by Robert Wyatt. Although Rock Bottom is technically Wyatt's second solo LP, he has stated in several interviews that he considers its predecessor The End of an Ear as juvenilia and not part of the recognised \"canon\" of Wyatt solo records. Preparations were under way for a third Matching Mole album—likely featuring earlier versions of several songs that ended up on Rock Bottom such as Sea Song—when, during the course of a raucous party on the night of 1 July 1973, an inebriated Wyatt fell from a fourth-floor window .", "desc_lfm_artist": "Robert Wyatt, born Robert Ellidge, in Bristol, UK on 28 January 1945, is an English musician, and a former member of the influential Canterbury scene band Soft Machine.\n\nAs a teenager, he lived with his parents in a fourteen-room Georgian guest-house, Wellington House, in Lydden near Canterbury. Here he was taught the drums by visiting American jazz drummer George Niedorf.\n\nIn 1962, Wyatt and Niedorf moved to Majorca where they stayed with the poet Robert Graves.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 120, "title": "Fulfillingness’ First Finale", "artist": "Stevie Wonder", "year": 1974, "cover": "https://dn710605.ca.archive.org/0/items/mbid-53a9fa24-8648-4623-9217-ed91434217e7/mbid-53a9fa24-8648-4623-9217-ed91434217e7-25676215068.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "95e58ee5-5421-38b0-a937-803b004c7ae8", "yt_id": "TZGCP0W6DCg", "rym": "https://rateyourmusic.com/release/album/stevie-wonder/fulfillingness-first-finale", "genres": ["funk / soul", "platinum shm-cd"], "desc_lfm_album": "", "desc_lfm_artist": "Stevie Wonder is the stage name of Stevland Hardaway Morris (b. Stevland Hardaway Judkins, 13 May 1950 in Saginaw, MI, USA - a.k.a. Little Stevie Wonder), a singer, multi-instrumentalist, composer,  record producer and activist.  He débuted, as Little Stevie Wonder, with the single \"I Call It Pretty Music but the Old People Call It the Blues\" (1961, Tamla Motown) and his latest album is \"A Time To Love\" (Oct 2005, Motown)\n\nStevland lost his eyesight shortly after birth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 121, "title": "On the Beach", "artist": "Neil Young", "year": 1974, "cover": "https://dn711009.ca.archive.org/0/items/mbid-39fe3778-362c-4762-89fc-c03235fd8117/mbid-39fe3778-362c-4762-89fc-c03235fd8117-4477004070.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5993-neil-young-on-the-beach.php", "aoty_critic_score": 95, "aoty_user_score": 85, "mbid": "f4174531-b783-3786-b75f-4fe61a8f6333", "yt_id": "Cby46XsFm7Y", "rym": "https://rateyourmusic.com/release/album/neil-young/on-the-beach", "genres": ["country rock", "pop rock"], "desc_lfm_album": "Following the 1973 Time Fades Away tour, Neil Young wrote and recorded an Irish wake of a record called Tonight's the Night and went on the road drunkenly playing its songs to uncomprehending listeners and hostile reviewers. Reprise rejected the record, and Young went right back and made On the Beach, which shares some of the ragged style of its two predecessors. But where Time was embattled and Tonight mournful, On the Beach was savage and, ultimately, triumphant. \"I'm a vampire, babe,\" Young sang, and he proceeded to take bites out of various subjects: threatening the lives of the stars .", "desc_lfm_artist": "Neil Percival Young (born November 12, 1945) is a Canadian singer, guitarist, songwriter, and social activist who is widely regarded as one of the most influential musicians of his generation, particularly as Neil Young & Crazy Horse. Young was born in Toronto, but he moved to the family home of Winnipeg as a child, which is where his music career began. Young began performing as a solo artist in Canada in 1960, before moving to California in 1966, where he co-founded the band Buffalo Springfield along with Stephen Stills and Richie Furay.", "desc_mb_album": "", "desc_mb_artist": "... has a gigography at [http://www.sugarmtn.org].", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 122, "title": "Elis & Tom", "artist": "Elis Regina & Antônio Carlos Jobim", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/65009-elis-tom_031534.jpg", "aoty_url": "https://www.albumoftheyear.org/album/65009-elis-regina-tom-jobim-elis-tom.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "f9520003-6075-310e-b650-bbaa8aaeab4d", "yt_id": "4AUEfW0kBQU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Having celebrated the 10th career anniversary of some of its hired artists such as Jorge Ben and Jair Rodrigues in 1973, Philips label direction noted that in the next year the singer Elis Regina would be completing 10 years in the company's cast. After the resoundingly success of \"Casa no Campo\" and \"Águas de Mraço\" in previous years, the then chairman André Midan asked Elis what she wanted and soon heard: \"Record an album of songs by Tom Jobim ... with Tom Jobim.\"", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "alberto_gu", "armandwave"]}, {"n": 123, "title": "Kimono My House", "artist": "Sparks", "year": 1974, "cover": "https://dn710706.ca.archive.org/0/items/mbid-940f4f66-33da-4fd4-bfbe-b9f256406761/mbid-940f4f66-33da-4fd4-bfbe-b9f256406761-13458872183.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33756-sparks-kimono-my-house.php", "aoty_critic_score": 95, "aoty_user_score": 80, "mbid": "0539b843-2228-36f5-965d-f370d05f66c3", "yt_id": "BI9gOtRMogY", "rym": "https://rateyourmusic.com/release/album/sparks/kimono-my-house", "genres": ["art rock", "pop rock", "glam rock", "art pop"], "desc_lfm_album": "Kimono My House is the third studio album by American rock band Sparks, released on May 1, 1974 by Island Records. The album is considered to be their commercial breakthrough, and was met with widespread acclaim. Preceded by the single This Town Ain't Big Enough for Both of Us, Kimono My House peaked at No. 4 in the UK and No. 101 in the US. Retrospectively, the album is considered one of Sparks's best works and one of the best glam rock albums. .", "desc_lfm_artist": "Sparks is an American rock and pop music band formed in Los Angeles in 1970 by brothers Ron Mael (keyboards) and Russell Mael (vocals), initially under the name Halfnelson. Best known for their quirky approach to song writing, Sparks' music is often accompanied by cutting and acerbic lyrics, and an idiosyncratic stage presence, typified in the contrast between Russell's wide-eyed hyperactive frontman antics and Ron's sedentary scowling.\n\nThe band's long career has seen them successfully adopt many different musical genres; including glam pop", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 124, "title": "A Tábua de Esmeralda", "artist": "Jorge Ben", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/23494-a-tabua-de-esmeralda_222219.jpg", "aoty_url": "https://www.albumoftheyear.org/album/23494-jorge-ben-a-tabua-de-esmeralda.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "a29259f6-8623-34b8-b7d0-fa6461f31f6b", "yt_id": "8XpR8T851N0", "rym": "https://rateyourmusic.com/release/album/jorge-ben/a-tabua-de-esmeralda/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Jorge Duílio Lima Menezes (born in Rio de Janeiro, RJ, Brazil, on March 22, 1939), better known as Jorge Ben or Jorge Ben Jor, is a Brazilian multi-instrumentalist, singer, and songwriter. In 2008, Rolling Stone Brazil named him the 5th greatest artist in the history of Brazilian music. He was also included in the magazine’s 2012 list of the 30 Greatest Brazilian Icons of Guitar and Acoustic Guitar.\n\nHis characteristic style includes various elements such as rock", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 125, "title": "Apostrophe (')", "artist": "Frank Zappa", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/28251-apostrophe-.jpg", "aoty_url": "https://www.albumoftheyear.org/album/28251-frank-zappa-apostrophe-.php", "aoty_critic_score": 77, "aoty_user_score": 83, "mbid": "2f3aa511-3270-3bb0-9661-0a7ed7e04be0", "yt_id": "mpNn1nht0_8", "rym": "https://rateyourmusic.com/release/album/frank-zappa/apostrophe-", "genres": [], "desc_lfm_album": "Apostrophe (') is the fifth solo album and eighteenth in total by Frank Zappa, released in March 1974 in both stereo and quadraphonic formats. An edited version of its lead-off track, \"Don't Eat the Yellow Snow\", was the first of Zappa's three Billboard Top 100 hits, ultimately peaking at number 86. The album itself became the biggest commercial success of Zappa's career, reaching number 10 on the US Billboard 200. Apostrophe (') remains Zappa's most commercially successful album in the United States. It was certified gold by the RIAA on April 7, 1976 and peaked at number 10 (a career-high .", "desc_lfm_artist": "Frank Vincent Zappa (December 21, 1940 – December 4, 1993) was an American composer, songwriter, guitarist, conductor, actor, satirist, filmmaker, and activist. Over a career spanning more than 30 years, he produced a wide range of music, including rock, pop, jazz, jazz fusion, orchestral, and musique concrète. He released more than 60 albums both with his band the Mothers of Invention and as a solo artist, often producing them himself. His work is noted for experimentation, improvisation, musical virtuosity, and satire of American culture.", "desc_mb_album": "", "desc_mb_artist": "[https://musicbrainz.org/artist/fe98e268-4ddd-441b-95a0-b219375f9ae4|The Mothers of Invention] have their own entry. Please do not add releases by the Mothers to this artist.", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 126, "title": "Mirage", "artist": "Camel", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53011-mirage_151539.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53011-camel-mirage.php", "aoty_critic_score": 60, "aoty_user_score": 84, "mbid": "e7f41fc7-d659-3d80-b605-205a54367f04", "yt_id": "8f-nQPoi3aY", "rym": "https://rateyourmusic.com/release/album/camel/mirage", "genres": [], "desc_lfm_album": "Mirage is Camel's second album, released in 1974. Their self-titled debut Camel came before this one in 1973, and The Snow Goose came after it in 1975. Mirage is one of the group's most remembered albums. It features their most well known song, Lady Fantasy, and is also a showplace for Andrew Latimer's flute, notably on \"Supertwister\". There are only 5 tracks on this record, two over 9 minutes. Those two are multi-part epics: Lady Fantasy and Nimrodel/The Procession/The White Rider, the latter being about The Lord of the Rings. It was released on Deram Records. Musicians * Andrew Latimer: .", "desc_lfm_artist": "Camel is an English progressive rock group from London, England, United Kingdom. They formed circa 1964 when brothers Andrew and Ian Latimer got together with their respective friends Alan Butcher and Richard Over to form The Phantom Four. The band played extensively around their home town of Guildford, Surrey before changing their name to Strange Brew. The group performed mainly cover tunes until mid-1968 when Ian Latimer quit to get married. Andrew", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 127, "title": "Phaedra", "artist": "Tangerine Dream", "year": 1974, "cover": "https://dn721509.ca.archive.org/0/items/mbid-61349b01-d312-41ed-a2dd-baeec82e451e/mbid-61349b01-d312-41ed-a2dd-baeec82e451e-24995663399.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14728-tangerine-dream-phaedra.php", "aoty_critic_score": 87, "aoty_user_score": 81, "mbid": "866c88fa-a18b-3739-9814-2ad215e5e11a", "yt_id": "HIQ0dd7B_FU", "rym": "https://rateyourmusic.com/release/album/tangerine-dream/phaedra", "genres": ["art rock", "krautrock", "progressive electronic", "space ambient", "berlin school", "electronic"], "desc_lfm_album": "Phaedra (1974) is an album by the German electronic music group Tangerine Dream. This is the first Tangerine Dream album to feature their now classic sequencer-driven sound, which kicked off the whole Berlin School genre. This album marked the beginning of the group's international success and was their first album released on the British Virgin records label. It achieved a six-figure sale in the UK, reaching No.15 in the charts in a 15-week run, with virtually no air play, only by strong word-of-mouth. It also earned the group a gold disc in Australia, and yet amazingly in their native Germany .", "desc_lfm_artist": "Tangerine Dream is a German electronic music band founded in 1967 by Edgar Froese. The group has seen many personnel changes over the years, with Froese having been the only continuous member until his death in January 2015. The best-known lineup of the group was its mid-'70s trio of Froese, Christopher Franke, and Peter Baumann. In 1979, Johannes Schmoelling replaced Baumann. Since Froese's death in 2015, the group has been under the leadership of Thorsten Quaeschning (Froese's chosen successor and the current longest-serving band member", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 128, "title": "Here Come the Warm Jets", "artist": "Brian Eno", "year": 1973, "cover": "https://dn710705.ca.archive.org/0/items/mbid-46a2f184-ef38-4025-a6e8-c0507f790d90/mbid-46a2f184-ef38-4025-a6e8-c0507f790d90-5358642722.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6032-brian-eno-here-come-the-warm-jets.php", "aoty_critic_score": 88, "aoty_user_score": 82, "mbid": "90d9be4c-30be-3e28-949a-66ee22c3a63a", "yt_id": "2SWrIB75vc8", "rym": "https://rateyourmusic.com/release/album/eno/here-come-the-warm-jets", "genres": ["art rock", "progressive rock", "glam rock", "glam"], "desc_lfm_album": "Here Come the Warm Jets is the debut solo album by British musician Brian Eno, released on Island Records in January 1974. It was recorded and produced by Eno following his departure from the band Roxy Music, and blends glam and pop stylings with avant-garde approaches. The album features numerous guests, including three of Eno's former Roxy bandmates (guitarist Phil Manzanera, saxophonist/keyboardist Andy Mackay and drummer Paul Thompson), drummer Simon King (of Hawkwind), bassist Bill MacCormick (of Matching Mole), guitarist/bassist Paul Rudolph (of Pink Fairies) and guitarist Robert Fripp and bassist John Wetton (both of King Crimson). Notable contributions were .", "desc_lfm_artist": "Brian Peter George Eno (b. 15 May 1948) is an English musician, record producer, visual artist, and theorist best known for his pioneering work in ambient music and contributions to rock, pop, and electronica. A self-described \"non-musician\", Eno has helped introduce unique conceptual approaches and recording techniques to contemporary music. He has been described as one of popular music's most influential and innovative figures.\n\nBorn in Suffolk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 129, "title": "Jolene", "artist": "Dolly Parton", "year": 1974, "cover": "https://cdn2.albumoftheyear.org/600x0/album/58980-jolene.jpg", "aoty_url": "https://www.albumoftheyear.org/album/58980-dolly-parton-jolene.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "4a490d52-53e8-482d-9f20-4b84701adadb", "yt_id": "nvclftpa5Jo", "rym": "https://rateyourmusic.com/release/album/dolly-parton/jolene", "genres": [], "desc_lfm_album": "Country music fans long ago learned that it's a serious mistake to confuse Dolly Parton's over-the-top style with her musical substance. For beneath the flamboyant wigs, rhinestone-studded getups, hourglass figure and self deprecating humor is one of the most gifted songwriters and loveliest voices of the past 50 years. Jolene, recorded in 1972 and '73 in Nashville with that musical mecca's finest session musicians, is filled not only with richly tuneful love songs, but a pair of numbers--\"Jolene\" and \"I Will Always Love You\"-- that topped the Country chart. (Parton has had an incredible 23 Number One country hits.) \"I .", "desc_lfm_artist": "Dolly Rebecca Parton (born January 19, 1946 in  Sevierville, Tennessee, U.S.) is an American country singer, songwriter, composer, producer, entrepreneur, author and actress.\n\nParton began performing as a child, singing on local radio and television in East Tennessee. At age 12 she was appearing on Knoxville TV, and at 13, she was recording on a small label and appearing at the Grand Ole Opry in Nashville. When she graduated from high school in 1964 she moved to Nashville", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 130, "title": "Court and Spark", "artist": "Joni Mitchell", "year": 1974, "cover": "https://dn710301.ca.archive.org/0/items/mbid-a8c72f16-3888-3659-92a0-4603e5ad21f1/mbid-a8c72f16-3888-3659-92a0-4603e5ad21f1-6745238130.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6086-joni-mitchell-court-and-spark.php", "aoty_critic_score": 99, "aoty_user_score": 87, "mbid": "3bd19e28-698e-3b7e-a8ec-f872bf001651", "yt_id": "_1Z6I62yvfg", "rym": "https://rateyourmusic.com/release/album/joni-mitchell/court-and-spark", "genres": ["folk rock", "pop rock", "jazz", "folk pop", "jazz pop", "soft rock"], "desc_lfm_album": "Joni Mitchell's Court and Spark represents a pivotal moment in her artistic evolution, marking her sixth studio album released by Asylum Records on January 17, 1974. This groundbreaking record seamlessly merged her folk-rock foundations with sophisticated jazz arrangements, establishing a new direction that would define her later work. The album's title itself carries deeper meaning, with \"court\" suggesting both romantic pursuit and royal elegance, while \"spark\" implies creative inspiration and emotional connection. The album's production process was revolutionary for its time. In 1973, departing from her typical yearly release cycle, Mitchell immersed herself in Los Angeles's vibrant jazz scene with .", "desc_lfm_artist": "Roberta Joan Mitchell (née Anderson; born November 7, 1943) is a Canadian and American singer-songwriter, multi-instrumentalist, and painter. She gained recognition in the 1960s folk music scene for her personal lyrics and distinctive compositions, which later incorporated elements from various genres including pop, jazz, and rock. Over her career, she has received multiple awards, including eleven Grammy Awards, and was inducted into the Rock and Roll Hall of Fame in 1997.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 131, "title": "Band on the Run", "artist": "Paul McCartney & Wings", "year": 1973, "cover": "https://dn710300.ca.archive.org/0/items/mbid-498a6e7a-da0f-4739-94a2-11e5873956d3/mbid-498a6e7a-da0f-4739-94a2-11e5873956d3-11436135257.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "2b678170-1c4e-3e61-b18c-f889fc1537b3", "yt_id": "hNW1p1dKkOQ", "rym": "https://rateyourmusic.com/release/album/paul-mccartney-and-wings/band-on-the-run", "genres": ["art rock", "classic rock", "pop rock", "soft rock", "mainstream rock"], "desc_lfm_album": "Band on the Run is the third studio album by Paul McCartney & Wings, released in December 1973. The majority of Band on the Run was recorded at EMI's studio in Lagos, Nigeria, as McCartney wanted to make an album in an exotic locale. Shortly before departing for Lagos, however, drummer Denny Seiwell and guitarist Henry McCullough left the group. With no time to recruit replacements, McCartney went into the studio with just his wife Linda and Denny Laine. In addition to playing bass, McCartney also played drums, percussion and most of the lead guitar parts himself. On arriving, it .", "desc_lfm_artist": "Paul McCartney and Wings was a rock music band led by Paul McCartney, formed a couple of years after the dissolution of The Beatles. It achieved widespread popularity during the 1970s despite continual personnel changes.\n\nIn 1971, drummer Denny Seiwell, and ex-Moody Blues guitarist and singer Denny Laine, joined Paul McCartney and wife Linda McCartney to record Paul's third post-Beatles project. The result was Wild Life, the first project to credit Wings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 132, "title": "Sabbath Bloody Sabbath", "artist": "Black Sabbath", "year": 1973, "cover": "https://i.discogs.com/jRUbIHjhzgWzLNkuMejGt5Dco2UeX74oUF85bT2H3zM/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTI1OTY0/MDEtMTM2OTY4MzI2/NC00NDg2LmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/7077-black-sabbath-sabbath-bloody-sabbath.php", "aoty_critic_score": 73, "aoty_user_score": 83, "mbid": "dd9bd473-0232-3a12-b51e-742de1aca5ca", "yt_id": "nA9JHzhqznA", "rym": "https://rateyourmusic.com/release/album/black-sabbath/sabbath-bloody-sabbath", "genres": [], "desc_lfm_album": "Sabbath Bloody Sabbath is the fifth studio album by the British heavy metal band Black Sabbath, released in 1973. With this album, the band expanded upon their slow, crunching style of music but incorporated progressive rock elements such as synthesizers, strings, keyboards and more complex, orchestral arrangements. Building off the stylistic changes introduced on Volume 4, new songs incorporated synthesizers, strings, keyboards and more complex arrangements. \"Who Are You?\" incorporates a Moog, a common instrument in progressive rock at the time. Lyrics of some songs on the album were written about problems within the band at the time. \"Killing Yourself .", "desc_lfm_artist": "Black Sabbath was an English heavy metal band formed in Birmingham in 1968 by guitarist Tony Iommi, drummer Bill Ward, bassist Geezer Butler, and vocalist Ozzy Osbourne. The band initially performed under the names Polka Tulk Blues Band and later Earth, before adopting the name Black Sabbath in 1969. They became known for lyrical themes influenced by horror and the occult, as well as for the use of down-tuned guitars. Their first three albums, \"Black Sabbath\" and \"Paranoid\" (both 1970)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 133, "title": "The Wild, the Innocent & The E Street Shuffle", "artist": "Bruce Springsteen", "year": 1973, "cover": "https://dn721505.ca.archive.org/0/items/mbid-5b0c80bc-e570-4bb3-a9cb-ccec2bbd7255/mbid-5b0c80bc-e570-4bb3-a9cb-ccec2bbd7255-31317351173.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "4b443e66-52a7-3cc9-a522-0dc64a6a51dc", "yt_id": "LWLMaZ7H3B0", "rym": "https://rateyourmusic.com/release/album/bruce-springsteen/the-wild-the-innocent-and-the-e-street-shuffle-5", "genres": ["folk rock", "jazz rock", "progressive pop", "heartland rock", "rock"], "desc_lfm_album": "The Wild, the Innocent & the E Street Shuffle is the second studio album by Bruce Springsteen. It was recorded by Springsteen with the E Street Band at 914 Sound Studios in Blauvelt, New York; and released on November 11, 1973, by Columbia Records. .", "desc_lfm_artist": "Bruce Frederick Joseph Springsteen (born September 23, 1949) is an American rock singer, songwriter, and guitarist. Nicknamed \"the Boss\", he has released 21 studio albums during a career spanning six decades, most of which feature his backing band, the E Street Band. Springsteen is a pioneer of heartland rock, a genre combining mainstream rock music with poetic and socially conscious lyrics that feature narratives primarily concerning working class American life.", "desc_mb_album": "[http://brucebase.wikidot.com/stats:wild-innocent-e-street-shuffle-studio-sessions|'''''The Wild, The Innocent & The E Street Shuffle - Studio Sessions''''']\r\n\r\nRecording Details Summary\r\nRecorded at 914 Sound Studios, Blauvelt, New York. Louis Lahav, Engineer\r\nA1 The E Street Shuffle recorded June 28 and Sept 22, 1973\r\nA2 4th Of July, Asbury Park (Sandy) recorded August 9, 1973, lead vocal overdubbed with new final verse September 23, 1973\r\nA3 Kitty's Back recorded June 28, 1973 July 11, 24, with final overdubs September 23, 1973\r\nA4 \"Circus Song\" recorded June 25, 26 completed June 28, 1973, song title changed to \"Wild Billy's Circus Story\" for album release.\r\nB1 Incident on 57th Street recorded September 22 and 23, 1973\r\nB2 Rosalita (Come Out Tonight) recorded September 23, 1973 (piano ", "desc_mb_artist": "You will find the most comprehensive information about '''Bruce Springsteen''' at '''''[http://brucebase.wikidot.com/|BruceBase Wiki]''''' and '''''[http://www.springsteenlyrics.com|SpringsteenLyrics.com]'''''\n\nThe '''''versioning''''' information for '''''studio recordings''''' is taken from the '''[http://brucebase.wikidot.com/stats:on-the-tracks|A studio guide to Bruce Springsteen]''' on the different '''''On The Tracks - recording sessions information''''' pages.", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 134, "title": "Head Hunters", "artist": "Herbie Hancock", "year": 1973, "cover": "https://dn721609.ca.archive.org/0/items/mbid-52dda2f2-d7ee-4ec5-b00e-b1f4f86ebb95/mbid-52dda2f2-d7ee-4ec5-b00e-b1f4f86ebb95-36789594055.png", "aoty_url": "https://www.albumoftheyear.org/album/6316-herbie-hancock-head-hunters.php", "aoty_critic_score": 88, "aoty_user_score": 87, "mbid": "322f18bb-5491-38e9-9044-c0a468651eec", "yt_id": "3m3qOD-hhrQ", "rym": "https://rateyourmusic.com/release/album/herbie-hancock/head-hunters", "genres": ["jazz", "jazz-funk", "jazz fusion", "funk", "hard bop", "post-bop"], "desc_lfm_album": "Head Hunters is an album by Herbie Hancock, released in 1973 on Columbia Records. The album is a key release in Hancock's career and a defining moment in the genre of jazz fusion. Structure and release: Head Hunters followed a series of experimental albums by Hancock's sextet: Mwandishi (1970), Crossings (1971), and Sextant (1972), released at a time when Hancock was looking for a new direction in which to take his music: \"I began to feel that I had been spending so much time exploring the upper atmosphere of music and the more ethereal kind of far-out spacey stuff. Now .", "desc_lfm_artist": "Herbert Jeffrey Hancock (born April 12, 1940) is a jazz  pianist and composer from Chicago, Illinois, United States. Hancock is one of jazz music's most important and influential pianists and composers. He embraced elements of rock, funk, and soul while adopting freer stylistic elements from jazz.\n\nAs part of Miles Davis' \"second great quintet\" Hancock helped redefine the role of a jazz rhythm section, and was later one of the first jazz musicians to embrace synthesizers and Jazz funk.", "desc_mb_album": "", "desc_mb_artist": "''Herbert Jeffrey Hancock'', born in Chicago, IL, USA, is without doubt the most well known, controversial and influential of all jazz pianists.\r\nSoon noticed by and involved with ''Miles Davis'', Mr ''Hancock'' almost stormed the hardbop ''Blue Note'' 60's with a number of legendary sessions, from his (nearly) first record ''Takin' Off'', to ''The Prisoner''.\r\nRecording with the new ''Mile's'' cats, he then took an important turn (around the time of ''Head Hunters''), experimenting and mixing genres, thus drifting from his previous fan base expectations.\r\nWhile the hardbop's crowd thought he was completely lost for the cause, he then took a radical U-turn, with the all-stars-all-jazz ''V.S.O.P.''\r\nHe has since recorded and experimented in a lot of directions, exploring \"sound textures\" an", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 135, "title": "Quadrophenia", "artist": "Who", "year": 1973, "cover": "https://i.discogs.com/QzM7wjOH97hY9RunwxI5ZtrkyTKVwUnS-VquA1T7LzI/rs:fit/g:sm/q:90/h:600/w:596/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTQyNjM1/OS0xMjc4NTU2Njk3/LmpwZWc.jpeg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "9b191575-fa1f-3531-bff5-121782318972", "yt_id": "9NEQb6LdHGQ", "rym": "https://rateyourmusic.com/release/album/the-who/quadrophenia", "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 136, "title": "Selling England by the Pound", "artist": "Genesis", "year": 1973, "cover": "https://dn710701.ca.archive.org/0/items/mbid-b20fe9b2-ffdb-4765-8d1b-60e4c91577eb/mbid-b20fe9b2-ffdb-4765-8d1b-60e4c91577eb-2193822620.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9170-genesis-selling-england-by-the-pound.php", "aoty_critic_score": 73, "aoty_user_score": 85, "mbid": "1fadec3d-7451-32e8-9194-ad7e5312cb9b", "yt_id": "RqKtDn5ntms", "rym": "https://rateyourmusic.com/release/album/genesis/selling-england-by-the-pound/", "genres": ["art rock", "pop rock", "progressive rock", "symphonic prog"], "desc_lfm_album": "Selling England by the Pound is the fifth studio album by Genesis and was recorded and released in 1973. It followed Foxtrot and was the band's commercial peak with Peter Gabriel, hitting #3 in the UK. The album went gold in the US in 1990. The album cover is a painting by Betty Swanwick called The Dream. The original painting did not feature a lawn mower; the band had Swanwick add it later as an allusion to the song I Know What I Like (In Your Wardrobe). Theme Retaining the pastoral yearning for ancient or medieval England as its primary .", "desc_lfm_artist": "There are at least three bands using the moniker Genesis;\n\n1) Genesis was an English rock band formed at Charterhouse School, Godalming, Surrey, in 1967. The band's longest-existing and most commercially successful line-up consisted of keyboardist Tony Banks, bassist/guitarist Mike Rutherford and drummer/singer Phil Collins. In the 1970s, during which the band also included singer Peter Gabriel and guitarist Steve Hackett, Genesis were among the pioneers of progressive rock. Banks and Rutherford were the only constant members of the group.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 137, "title": "Berlin", "artist": "Lou Reed", "year": 1973, "cover": "https://dn710800.ca.archive.org/0/items/mbid-448ae14a-1053-341d-9639-94188a236caf/mbid-448ae14a-1053-341d-9639-94188a236caf-3592779547.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5659-lou-reed-berlin.php", "aoty_critic_score": 81, "aoty_user_score": 85, "mbid": "c6190069-644f-3b41-92aa-1e771e451036", "yt_id": "GyhJh1SMpVg", "rym": "https://rateyourmusic.com/release/album/lou-reed/berlin", "genres": ["rock and roll", "art rock", "proto-punk", "hard rock", "glam rock"], "desc_lfm_album": "The album is a tragic rock opera about a doomed couple, and addresses themes of drug use and depression. Upon its release, the response of fans and critics was not positive as many were expecting another upbeat glam outing. Despite lukewarm reviews the album reached #7 in the UK album chart (Reed's best achievement there). Poor sales in the US (#98) and harsh criticism made Reed feel disillusioned about the album and in subsequent years he rarely played any Berlin material in his live shows. Over time many have come to consider Berlin to be among Lou Reed's best studio .", "desc_lfm_artist": "Lewis Allan Reed (March 2, 1942 – October 27, 2013) was an American musician, songwriter, and poet. He was the guitarist, singer, and principal songwriter for the rock band the Velvet Underground and had a solo career that spanned five decades. Although not commercially successful during its existence, the Velvet Underground became regarded as one of the most influential bands in the history of underground and alternative rock music. Reed's distinctive deadpan voice", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 138, "title": "Goodbye Yellow Brick Road", "artist": "Elton John", "year": 1973, "cover": "https://dn710701.ca.archive.org/0/items/mbid-6f2f317d-ca9e-43df-bd67-d508f1d85803/mbid-6f2f317d-ca9e-43df-bd67-d508f1d85803-16069095608.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7517-elton-john-goodbye-yellow-brick-road.php", "aoty_critic_score": 88, "aoty_user_score": 83, "mbid": "80df0f1b-4ce7-348a-aa1b-0d31ebff111a", "yt_id": "3p_xAToFzck", "rym": "https://rateyourmusic.com/release/album/elton-john/goodbye-yellow-brick-road", "genres": ["classic rock", "pop rock", "progressive rock", "glam rock", "soft rock", "piano rock"], "desc_lfm_album": "Goodbye Yellow Brick Road is the seventh studio album by British singer-songwriter Elton John, released in 1973. It is regarded by many as his magnum opus. With worldwide sales of at least 31 million copies it is his best selling studio album. In 2000 Q magazine placed it at number 84 in its list of the 100 Greatest British Albums Ever. In 2003, the album was ranked number 91 on Rolling Stone magazine's list of the 500 greatest albums of all time. History Goodbye Yellow Brick Road was recorded at the Château d'Hérouville, where John had previously recorded Honky Château .", "desc_lfm_artist": "Sir Elton Hercules John (born Reginald Kenneth Dwight; 25 March 1947) is a British singer, pianist, and composer. Collaborating with lyricist Bernie Taupin since 1967, John is one of the most successful artists of all time, having sold over 300 million records worldwide in a seven-decade career in music. He is acclaimed by critics and musicians, particularly for his work during the 1970s, and his lasting impact on the music industry. John's music and showmanship have had a significant impact on popular music.", "desc_mb_
