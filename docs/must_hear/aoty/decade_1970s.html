lbum/5593-marvin-gaye-whats-going-on.php", "aoty_critic_score": 97, "aoty_user_score": 92, "mbid": "ef15d15b-85e5-45b1-b143-493d71374281", "yt_id": "qutfxAB36Zk", "rym": "https://rateyourmusic.com/release/album/marvin-gaye/whats-going-on", "genres": ["soul"], "desc_lfm_album": "What's Going On is the eleventh studio album by the American soul singer Marvin Gaye. It was released on May 21, 1971, by the Motown Records subsidiary label Tamla. Recorded between 1970 and 1971 in sessions at Hitsville U.S.A., Golden World, United Sound Studios in Detroit, and at The Sound Factory in West Hollywood, California, it was Gaye's first album to credit him as producer and to credit Motown's in-house session musicians, known as the Funk Brothers. What's Going On is a concept album with most of its songs segueing into the next and has been categorized as a song .", "desc_lfm_artist": "Marvin Pentz Gaye, Jr. (2 April 1939 - 1 April 1984) was an American soul and rnb singer, songwriter, producer, and multi-instrumentalist, known as \"The Prince of Soul\", or \"The Prince of Motown.\" Originally a member of the doo-wop group The Moonglows, he pursued a solo career after the group disbanded and released many successful solo hits including \"I Heard It Through the Grapevine\", \"Let's Get It On\" and  \"What's Going On\". His best albums are still held in extremely high regard, and he is often cited as one of the finest singers of his era.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 211, "title": "Ram", "artist": "Paul McCartney & Linda McCartney", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14357-ram-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14357-paul-mccartney-linda-mccartney-ram.php", "aoty_critic_score": 80, "aoty_user_score": 87, "mbid": null, "yt_id": "DmwCQaQm4ik", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "armandwave"]}, {"n": 212, "title": "Just As I Am", "artist": "Bill Withers", "year": 1971, "cover": "https://dn720705.ca.archive.org/0/items/mbid-d7538ee8-0ccb-466e-9fef-67a96f7c2ec9/mbid-d7538ee8-0ccb-466e-9fef-67a96f7c2ec9-12027277674.jpg", "aoty_url": "https://www.albumoftheyear.org/album/46141-bill-withers-just-as-i-am.php", "aoty_critic_score": 98, "aoty_user_score": 82, "mbid": "a72ee504-15b5-343c-bfd7-e71f9272e0e5", "yt_id": "Q1gSWK86o-4", "rym": "https://rateyourmusic.com/release/album/bill-withers/just-as-i-am", "genres": ["blues", "soul", "r&b", "smooth soul", "deep soul", "folk, world, & country"], "desc_lfm_album": "", "desc_lfm_artist": "William Harrison Withers Jr. (July 4, 1938 – March 30, 2020) was an American singer and songwriter known for a series of influential hits during a career spanning 18 years. His best-known songs include \"Ain't No Sunshine\" (1971), \"Grandma's Hands\" (1971), \"Use Me\" (1972), \"Lean on Me\" (1972), \"Lovely Day\" (1977), and \"Just the Two of Us\" (1980), the latter recorded in collaboration with Grover Washington Jr. Withers won three Grammy Awards from nine nominations.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "paqueradejere"]}, {"n": 213, "title": "Sticky Fingers", "artist": "The Rolling Stones", "year": 1971, "cover": "https://dn710006.ca.archive.org/0/items/mbid-5c230a38-999b-4331-a5ad-7d4c406bb0a6/mbid-5c230a38-999b-4331-a5ad-7d4c406bb0a6-35620164723.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5445-the-rolling-stones-sticky-fingers.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "4a4213d0-f224-3d51-bcca-476f61162681", "yt_id": "EWg-5IyM7S8", "rym": "https://rateyourmusic.com/release/album/the-rolling-stones/sticky-fingers", "genres": ["blues rock", "country rock", "rock and roll", "hard rock", "blues", "roots rock"], "desc_lfm_album": "Sticky Fingers is the ninth British and 11th American studio album by English rock band The Rolling Stones, released in April 1971. It is the band's first album of the 1970s and its first release on the band's newly formed label, Rolling Stones Records, after having been contracted since 1963 with Decca Records in the UK and London Records in the US. It is also Mick Taylor's first full-length appearance on a Rolling Stones album, the first Rolling Stones album not to feature any contributions from guitarist and founder Brian Jones and the first one on which singer Mick Jagger .", "desc_lfm_artist": "The Rolling Stones are an English rock band formed in London in 1962. Active for six decades, they are one of the most popular and enduring bands of the rock era. In the early 1960s, the Rolling Stones pioneered the gritty, rhythmically driven sound that came to define hard rock. Their first stable line-up consisted of vocalist Mick Jagger, multi-instrumentalist Brian Jones, guitarist Keith Richards, bassist Bill Wyman, and drummer Charlie Watts. During their formative years", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 214, "title": "L.A. Woman", "artist": "The Doors", "year": 1971, "cover": "https://dn711001.ca.archive.org/0/items/mbid-e68f23df-61e3-4264-bfc3-17ac3a6f856b/mbid-e68f23df-61e3-4264-bfc3-17ac3a6f856b-5132812481.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1362382-the-doors-la-woman-the-workshop-sessions.php", "aoty_critic_score": 88, "aoty_user_score": 82, "mbid": "7be633bd-d1f6-3d89-8939-803ae0ed0de8", "yt_id": "91vU3kHtnoU", "rym": "https://rateyourmusic.com/release/album/the-doors/l_a-woman", "genres": ["blues rock", "psychedelic rock", "acid rock", "classic rock", "hard rock", "psychedelic"], "desc_lfm_album": "\"L.A. Woman\" is the sixth studio album by the American rock band the Doors, released on April 19, 1971, by Elektra Records. It was the final album to feature lead singer Jim Morrison during his lifetime; he died two months and two weeks after its release. Morrison later appeared posthumously on the 1978 album \"An American Prayer\". The album is notable for its strong blues influence, more pronounced than on the band’s earlier recordings. Production of the album took place without long-time producer Paul A. Rothchild, who left the project due to dissatisfaction with the band’s studio performances. In his .", "desc_lfm_artist": "The Doors was an American rock band formed in Los Angeles in 1965, consisting of vocalist Jim Morrison, keyboardist Ray Manzarek, guitarist Robby Krieger, and drummer John Densmore. The band became known for its distinctive sound, Morrison’s lyrical style and vocal delivery, and the group’s association with the 1960s counterculture. They also attracted attention for Morrison’s stage behavior and various legal controversies.\n\nThe band took its name from the title of Aldous Huxley's book \"The Doors of Perception\"", "desc_mb_album": "", "desc_mb_artist": "Deprecated ISNI: [http://www.isni.org/0000000115160232|0000 0001 1516 0232]", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 215, "title": "Histoire de Melody Nelson", "artist": "Serge Gainsbourg", "year": 1971, "cover": "https://dn710601.ca.archive.org/0/items/mbid-6052c614-0ee0-444b-aa00-705b2dfab4d4/mbid-6052c614-0ee0-444b-aa00-705b2dfab4d4-16379498992.jpg", "aoty_url": "https://www.albumoftheyear.org/album/130-serge-gainsbourg-histoire-de-melody-nelson.php", "aoty_critic_score": 89, "aoty_user_score": 80, "mbid": "431ae137-315a-3faa-8005-c959fc0d57e9", "yt_id": "VB0X3wx3fX0", "rym": "https://rateyourmusic.com/release/album/serge-gainsbourg/histoire-de-melody-nelson", "genres": ["pop rock", "baroque pop", "art pop", "symphonic rock", "rock", "pop"], "desc_lfm_album": "", "desc_lfm_artist": "Serge Gainsbourg (April 2, 1928 – March 2, 1991) was a French poet-songwriter, singer, actor, novelist, painter and director. Gainsbourg's varied style and individuality made him difficult to categorize. Although famous in France for many years, he did not achieve his first No. 1 album until 1979, when he released Aux Armes et caetera more than twenty years after his music career had begun. But since the 1980s, his legacy has been firmly established.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 216, "title": "Songs of Love and Hate", "artist": "Leonard Cohen", "year": 1971, "cover": "https://ia800402.us.archive.org/18/items/mbid-4d27a9be-57b6-3376-bea3-a677412239f8/mbid-4d27a9be-57b6-3376-bea3-a677412239f8-22650646291.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6081-leonard-cohen-songs-of-love-and-hate.php", "aoty_critic_score": 98, "aoty_user_score": 86, "mbid": "964ccc52-2873-3bce-a806-73d71532c539", "yt_id": "3f0ADuVJhYQ", "rym": "https://rateyourmusic.com/release/album/leonard-cohen/songs-of-love-and-hate/lists", "genres": ["blues rock", "folk rock", "folk", "contemporary folk", "baroque pop", "ballad"], "desc_lfm_album": "Songs of Love and Hate is Canadian singer-songwriter Leonard Cohen's third album. It was mainly recorded in Columbia Studio A in Nashville from September 22–26, 1970. \"Sing Another Song, Boys\" was recorded at the Isle of Wight Festival on August 30, 1970. Further recording took place at Trident Studios in London. The album reached #145 on the US Billboard 200, but was his most commercially successful album in many other parts of the world, reaching #4 in the UK and #8 in Australia. The album title is descriptive, outlining its main themes. The songs contain emotive language and are frankly .", "desc_lfm_artist": "Leonard Norman Cohen (September 21, 1934 – November 7, 2016) was a Canadian songwriter  poet, singer, and novelist. His work explored religion, politics, isolation, sexuality, and romantic relationships. Cohen was inducted into the Canadian Music Hall of Fame, the Canadian Songwriters Hall of Fame, and the Rock and Roll Hall of Fame. He was invested as a Companion of the Order of Canada, the nation's highest civilian honour. In 2011, Cohen received one of the Prince of Asturias Awards for literature and the ninth Glenn Gould Prize.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "armandwave"]}, {"n": 217, "title": "Aqualung", "artist": "Jethro Tull", "year": 1971, "cover": "https://dn710802.ca.archive.org/0/items/mbid-382dc29a-c797-340b-92ef-4794f1665336/mbid-382dc29a-c797-340b-92ef-4794f1665336-3754617979.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9040-jethro-tull-aqualung.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "204cc47e-2e1a-3877-8e1e-d14bfffd19aa", "yt_id": "MslaxkQpTdI", "rym": "https://rateyourmusic.com/release/album/jethro-tull/aqualung", "genres": ["blues rock", "folk rock", "classic rock", "hard rock", "progressive rock", "arena rock"], "desc_lfm_album": "Aqualung is the fourth studio album by the rock band Jethro Tull. Released in 1971, Aqualung, despite the band's disapproval, is regarded as a concept album featuring a central theme of \"the distinction between religion and God\". The album's \"dour musings on faith and religion\" have marked it as \"one of the most cerebral albums ever to reach millions of rock listeners\". Aqualung's success marked a turning point in the band's career, who went on to become a major radio and touring act. Recorded at Island Records' studio in London, it was their first album with John Evan as a .", "desc_lfm_artist": "Jethro Tull is a British rock band formed in Blackpool, Lancashire in 1967. The band initially played blues rock and jazz fusion before incorporating elements of English folk music, hard rock, and classical music, developing a distinctive progressive rock sound. Ian Anderson, the band's founder, leader, principal composer, and lead vocalist, has been the only constant member. Anderson is a multi-instrumentalist, primarily playing flute and acoustic guitar.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 218, "title": "Bryter Layter", "artist": "Nick Drake", "year": 1970, "cover": "https://dn710706.ca.archive.org/0/items/mbid-2a747045-613a-4c67-95d0-5319e32ae39b/mbid-2a747045-613a-4c67-95d0-5319e32ae39b-40915385855.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6067-nick-drake-bryter-layter.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "d742fded-00e7-3746-a63d-aa2def3fdbcc", "yt_id": "emD7D2rPUI8", "rym": "https://rateyourmusic.com/release/album/nick-drake/bryter-layter", "genres": ["folk rock", "folk", "chamber folk", "contemporary folk", "baroque pop", "british folk rock"], "desc_lfm_album": "Nick Drake's second studio album is broadly similar in sound and outlook to his first, Five Leaves Left. It also assembled many of the same musicians, and Robert Kirby as arranger, whose string and occasionally woodwind scores have become indelibly associated with Drake for most listeners. Notably, as well as some of the most characteristic of Drake's songs, there are the somewhat soul-gospel-like 'Poor Boy' among the track listing on Bryter Layter, and a handful of instrumental tracks which wrap orchestrated melodies around Drake's trademark elaborate fingerpicking guitar accompaniment. The latter have proved controversial among fans, variously called 'lift music' .", "desc_lfm_artist": "Nick Drake (Nicholas Rodney Drake, Yangon, Myanmar, June 19, 1948 - Tanworth-in-Arden, Warwickshire, England, November 25, 1974) was an English folk singer known for his gentle, enigmatic songs and his virtuosic right-hand finger picking technique.\n\nAlthough he recorded only three albums, critics and fellow musicians hold his work in very high esteem. Drake failed to find a wide audience during his lifetime and had a strong aversion to performing. Since his death, however, Drake's music has gained a significant cult following.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 219, "title": "Jack Johnson (Original Soundtrack Recording)", "artist": "Miles Davis", "year": 1971, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6313-a-tribute-to-jack-johnson_072702.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6313-miles-davis-jack-johnson-original-soundtrack-recording.php", "aoty_critic_score": 98, "aoty_user_score": 84, "mbid": null, "yt_id": "up9yWDl0jBc", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 220, "title": "The Yes Album", "artist": "Yes", "year": 1971, "cover": "https://dn710708.ca.archive.org/0/items/mbid-5e4a1673-4c9f-4561-8043-50bbaa64b759/mbid-5e4a1673-4c9f-4561-8043-50bbaa64b759-11322772843.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9075-yes-the-yes-album.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "0fa03925-736c-3537-b0c6-201091543177", "yt_id": "1fUudna1Xuw", "rym": "https://rateyourmusic.com/release/album/yes/the-yes-album", "genres": ["art rock", "classic rock", "progressive rock", "arena rock", "symphonic prog"], "desc_lfm_album": "The Yes Album is the third studio album by English progressive rock band Yes, released on 19 February 1971 by Atlantic Records. It was the band's first album to feature guitarist Steve Howe, who replaced Peter Banks in 1970, as well as their last to feature keyboardist Tony Kaye until 1983's 90125. The band spent mid-1970 writing and rehearsing new material at a farmhouse at Romansleigh, Devon, and the new songs were recorded at Advision Studios in London in the autumn. The album was the first by the band to feature all-original material. While the album retained close harmony singing, .", "desc_lfm_artist": "Yes is a British progressive rock band which formed in London, United Kingdom in 1968. They are best known for 1970's \"I've Seen All Good People\", the 1972 9-minute US Top 20 smash \"Roundabout\" and their 1983 #1 hit \"Owner of a Lonely Heart\". Despite many lineup changes, occasional splits and the influence of the many changes in popular music, the band has endured for 40 years and still retains a strong international following. Their music is marked by sharp dynamic contrasts", "desc_mb_album": "", "desc_mb_artist": "In 2017, former members Jon Anderson, Trevor Rabin and Rick Wakeman changed the name of their group ARW to [[https://musicbrainz.org/artist/d49ba74d-343b-48f3-8180-3a14821bf6a8|Yes featuring ARW]]. There is an ongoing dispute over the rights to the Yes band name. '''Please do not merge the two artists.'''", "heard_by": ["Lonsonxd", "armandwave"]}, {"n": 221, "title": "First Utterance", "artist": "Comus", "year": 1971, "cover": "https://dn711308.ca.archive.org/0/items/mbid-652c22d0-7505-31d6-8a96-9edda5150613/mbid-652c22d0-7505-31d6-8a96-9edda5150613-41509758147.jpg", "aoty_url": "https://www.albumoftheyear.org/album/34395-comus-first-utterance.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "388aeddf-3bdd-3aa6-9632-75e8e368f59a", "yt_id": "eFmqHiHMC1Q", "rym": "https://rateyourmusic.com/release/album/comus/first-utterance", "genres": ["folk rock", "progressive folk", "psychedelic folk", "1971"], "desc_lfm_album": "First Utterance is the debut album by British progressive folk band Comus. It was released in 1971, with the opening song \"Diana\" being released as a single. The album is notable for its unique blend of progressive rock, folk, psychedelia, and elements of paganism and the macabre. The overall thematic tone of the album is of vulnerable innocence facing abusive power, with songs dealing with such themes as violence (\"Drip Drip\"), rape (\"Diana\", \"Song to Comus\"), and criticism surrounding electro-convulsive therapy (\"The Prisoner\"). These themes contrast starkly with the acoustic sound of the record, featuring acoustic guitar, violin, flute, and .", "desc_lfm_artist": "Comus is a British progressive folk band formed in Beckenham, UK in 1969. The band broke up shortly after releasing their first album, 'First Utterance', in 1971. They reformed briefly in 1974 and then reformed again in 2009, playing festivals and releasing a new album in 2012.\n\nTaking their name from a character in a John Milton masque, Comus mixes elements of progressive rock with the influences of The Pentangle, Fairport Convention and other more traditional folk outfits.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Rocky_stereo", "alberto_gu", "paqueradejere"]}, {"n": 222, "title": "Tapestry", "artist": "Carole King", "year": 1971, "cover": "https://dn711309.ca.archive.org/0/items/mbid-74467fc2-2b96-3e25-914b-082a82373014/mbid-74467fc2-2b96-3e25-914b-082a82373014-3890190163.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7514-carole-king-tapestry.php", "aoty_critic_score": 98, "aoty_user_score": 86, "mbid": "6e4f39e6-3403-39d7-81c6-8e61a990d509", "yt_id": "w5yK1EpMV0U", "rym": "https://rateyourmusic.com/release/album/carole-king/tapestry", "genres": ["folk rock", "pop rock", "folk pop", "soft rock", "pop"], "desc_lfm_album": "In 1971, a year after the release of the critically-acclaimed yet commercially unsuccessful album Writer, an undaunted King gave thoughtful, folk-flavored reinterpretations of some of her early pop hits as a songwriter, interweaving them with new compositions in the aptly-titled Tapestry. The album would become the turning point in her career. Tapestry was instantly recognized as one of the landmark albums of the singer-songwriter genre of the early 1970s. With numerous hit singles, it would remain on the charts for nearly six years, selling over 10 million copies in the United States alone, and an estimated 22 million worldwide, making .", "desc_lfm_artist": "Carole King Klein (born Carol Joan Klein; February 9, 1942) is an American singer, songwriter, and musician who has been active since 1958, initially as one of the staff songwriters at 1650 Broadway and later as a solo artist. Regarded as one of the most significant and influential musicians of all time, King is the most successful female songwriter of the latter half of the 20th century in the US, having written or co-written 118 pop hits on the Billboard Hot 100.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 223, "title": "Journey in Satchidananda", "artist": "Alice Coltrane featuring Pharoah Sanders", "year": 1971, "cover": "https://dn710107.ca.archive.org/0/items/mbid-2efc9b51-ab8a-3b10-883d-5821a6da989e/mbid-2efc9b51-ab8a-3b10-883d-5821a6da989e-18788031122.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "cf154081-2678-3778-95cf-cd31c4ea5dfe", "yt_id": "TQtEFdyhgdE", "rym": "https://rateyourmusic.com/release/album/alice-coltrane-featuring-pharoah-sanders/journey-in-satchidananda/", "genres": ["jazz", "avant-garde jazz", "free jazz", "modal jazz"], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["GabredMared", "MaxtorUwU", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 224, "title": "Pearl", "artist": "Janis Joplin", "year": 1970, "cover": "https://dn710603.ca.archive.org/0/items/mbid-72771116-bbfe-494f-ba38-68a6c9de0d95/mbid-72771116-bbfe-494f-ba38-68a6c9de0d95-10645741769.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10747-janis-joplin-pearl.php", "aoty_critic_score": 100, "aoty_user_score": 82, "mbid": "99878359-e736-3cdc-a225-548ad17d1c76", "yt_id": "W4zumh4m7Kg", "rym": "https://rateyourmusic.com/release/album/janis-joplin/pearl-38", "genres": ["blues rock", "psychedelic rock", "folk", "classic rock", "acoustic blues", "rock"], "desc_lfm_album": "Pearl is the second and final solo studio album by Janis Joplin, released on January 11, 1971, three months after her death on October 4, 1970. It was the final album with her direct participation, and the only Joplin album recorded with the Full Tilt Boogie Band, her final touring unit. It peaked at number one on the Billboard 200, holding that spot for nine weeks. It has been certified quadruple platinum by the RIAA. All nine tracks that she sings on were personally approved and arranged by Joplin. Joplin sang on all tracks except Buried Alive in the Blues, .", "desc_lfm_artist": "Janis Joplin (born 19 January 1943 in Port Arthur, Texas, United States, died 4 October 1970 in Los Angeles, California) was an American singer, songwriter, composer and painter. Originally the lead singer for the blues rock band Big Brother & The Holding Company, Joplin left the band in late 1968 for a solo career. She released two solo albums, I Got Dem Ol' Kozmic Blues Again Mama! (1969) and Pearl (1971), the latter released after her death. During her solo career, she was backed by the Kozmic Blues Band and later, the Full Tilt Boogie Band.", "desc_mb_album": "", "desc_mb_artist": "Janis' first two albums '''Big Brother & the Holding Company''' and '''Cheap Thrills''' can be found under '''[http://musicbrainz.org/artist/3cf5a3be-25ef-4408-98fe-e66fee536be1.html|Big Brother & the Holding Company]'''.", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 225, "title": "John Lennon/Plastic Ono Band", "artist": "John Lennon/Plastic Ono Band", "year": 1970, "cover": "https://ia801206.us.archive.org/12/items/mbid-dba99324-d642-3c64-a275-cf1423119315/mbid-dba99324-d642-3c64-a275-cf1423119315-11263339962.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "8be83468-4917-390d-82b6-d890f058cd22", "yt_id": "3D0nMzHjMR8", "rym": null, "genres": ["folk", "pop rock", "contemporary folk"], "desc_lfm_album": "", "desc_lfm_artist": "John Lennon/Plastic Ono Band is the debut solo album by English rock musician John Lennon. It was released in 1970 after Lennon issued three experimental albums with Yoko Ono and Live Peace In Toronto 1969, a live performance in Toronto credited to The Plastic Ono Band. The album was recorded simultaneously with Yoko Ono's debut avant garde solo album Yoko Ono / Plastic Ono Band at Ascot Sound Studios and Abbey Road Studios using the same musicians and production team, and featured nearly identical cover artwork.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 226, "title": "Just Another Diamond Day", "artist": "Vashti Bunyan", "year": 1970, "cover": "https://dn710304.ca.archive.org/0/items/mbid-e632ec9f-3ddc-4892-b16c-4d8a8d1e75cd/mbid-e632ec9f-3ddc-4892-b16c-4d8a8d1e75cd-19967164831.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16825-vashti-bunyan-just-another-diamond-day.php", "aoty_critic_score": 92, "aoty_user_score": 83, "mbid": "7c20803f-f1f5-3850-90d4-0b7553793801", "yt_id": "2qzFwk29Q48", "rym": "https://rateyourmusic.com/release/album/vashti-bunyan/just-another-diamond-day", "genres": ["folk rock", "folk", "ballad"], "desc_lfm_album": "Just Another Diamond Day is the debut album of English singer-songwriter Vashti Bunyan. In the mid to late 1960s, Bunyan was under contract to Andrew Oldham, which saw her release two singles. However, Bunyan found the experience frustrating, and decided to head for the Scottish islands in search of an artistic commune supposedly established by Donovan. She travelled around the countryside with her partner Robert in a horse-drawn wagon. It was during these travels that she wrote the songs which would later appear on Just Another Diamond Day. Bunyan returned to London where she was urged by producer Joe Boyd .", "desc_lfm_artist": "Jennifer Vashti Bunyan is an English singer-songwriter. She began her career in the mid-1960s and released a debut album, Just Another Diamond Day, in 1970. The album sold very few copies and Bunyan, discouraged, abandoned her musical career. By 2000, her album had acquired a cult following; it was re-released and Bunyan recorded more songs, initiating the second phase of her musical career after a gap of thirty years. She released two more albums, Lookaftering in 2005, and Heartleap in 2014.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 227, "title": "Desert Shore", "artist": "Nico", "year": 1970, "cover": "https://i.discogs.com/8ZhRBXM5W2ldqpdFNckSknpOHuLv3IBRSJN7-NWStAQ/rs:fit/g:sm/q:90/h:594/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTk0MDM3/Ny0xMjQ4MDA3NTAy/LmpwZWc.jpeg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "8c6a8264-be71-33ea-b94f-02c6f83dc6f9", "yt_id": "8fJ7b3VShJ8", "rym": "https://rateyourmusic.com/release/album/nico/desertshore", "genres": ["rock"], "desc_lfm_album": "", "desc_lfm_artist": "Nico (16 October 1938 – 18 July 1988) was a German model, actress, singer, and songwriter. She was born Christa Päffgen in Cologne, Germany.\nNico started a successful career as a model in Berlin and Paris, studied acting at Lee Strasberg's New York Actor Studio. She then became part of the Swinging London scene, and had a short relationship with The Rolling Stones' Brian Jones and she recorded her first record in London in 1965, the single I'm Not Saying/The Last Mile", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 228, "title": "All Things Must Pass", "artist": "George Harrison", "year": 1970, "cover": "https://dn710700.ca.archive.org/0/items/mbid-f953e75a-83b2-3e70-8454-40f546b04a52/mbid-f953e75a-83b2-3e70-8454-40f546b04a52-8094800915.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6083-george-harrison-all-things-must-pass.php", "aoty_critic_score": 96, "aoty_user_score": 90, "mbid": "d4b0f3e2-e3eb-3531-b305-ed8105cb5be4", "yt_id": "bEoaZc7pY4M", "rym": "https://rateyourmusic.com/release/album/george-harrison/all-things-must-pass", "genres": ["folk rock", "pop rock", "psychedelic pop", "jam band", "gospel"], "desc_lfm_album": "All Things Must Pass is a triple album by English musician George Harrison. Released in November 1970, it includes the hit singles \"My Sweet Lord\" and \"What Is Life\", as well as songs such as \"Isn't It a Pity\" and the title track that were turned down by Harrison's former band, the Beatles. The album reflects the influence of his musical activities outside the Beatles during 1968–70 – with Bob Dylan, the Band, Delaney & Bonnie, Billy Preston and others – and Harrison's growth as an artist beyond his supporting role to former bandmates John Lennon and Paul McCartney. The .", "desc_lfm_artist": "George Harrison MBE (25 February 1943 – 29 November 2001) born in Liverpool, UK, was an English rock musician, singer-songwriter and film producer who achieved international fame as lead guitarist in The Beatles, along with mainstream success as a solo artist. George contributed to the songwriting talents of his Beatles band mates, John Lennon and Paul McCartney, firstly by adding ideas and guitar parts, and later with his distinctive style of music inspired by Eastern spirituality.", "desc_mb_album": "", "desc_mb_artist": "Performs as '''Nelson Wilbury''' on '''[http://musicbrainz.org/release/bfbe1d07-ab65-456e-85b3-6e3ce8443d90.html|Traveling Wilburys, Volume 1]''' and '''Spike Wilbury''' on '''[http://musicbrainz.org/release/a072380c-3348-4147-8625-d5a277a1ff96.html|Traveling Wilburys, Volume 3]'''.", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 229, "title": "Lola Versus Powerman and the Moneygoround, Part One", "artist": "The Kinks", "year": 1970, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7515-lola-versus-powerman-and-the-moneygoround-part-one_234006.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7515-the-kinks-lola-versus-powerman-and-the-moneygoround-part-one.php", "aoty_critic_score": 70, "aoty_user_score": 82, "mbid": "a84e8dfd-1492-3377-a6f0-34d324dc49d7", "yt_id": "meNT_OYTNTg", "rym": null, "genres": [], "desc_lfm_album": "Lola Versus Powerman and the Moneygoround, Part One is a concept album by British rock band The Kinks, recorded and released in 1970. The album is a satirical look at the various facets of the music industry, including song publishers, unions, the press, accountants, business managers, and the road. Musically Lola Versus Powerman is varied, drawing on the genres of folk, hard rock, and traditional British music hall. Although it appeared during a transitional period for The Kinks, Lola Versus Powerman was a success both critically and commercially for the group, charting in the Top 40 in America and helping .", "desc_lfm_artist": "The Kinks (1963–1996; 2018-present) are an English pop-rock group that came out of the British R&B scene of the early 1960s. Formed in Muswell Hill, Middlesex, by brothers Ray Davies and Dave Davies in 1964 and categorised in the United States as a \"British Invasion\" band, the Kinks are recognised as one of the most important and influential rock groups of the era. In 1990, their first year of eligibility, the original four members were inducted into the Rock & Roll Hall of Fame.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 230, "title": "Tea for the Tillerman", "artist": "Cat Stevens", "year": 1970, "cover": "https://dn721809.ca.archive.org/0/items/mbid-e85224b5-15e6-48e6-8b43-0cd6c017a9e2/mbid-e85224b5-15e6-48e6-8b43-0cd6c017a9e2-39302736790.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8352-cat-stevens-tea-for-the-tillerman.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "418678e7-2807-3bed-a305-11b4181e533e", "yt_id": "YrKAe4d46mk", "rym": "https://rateyourmusic.com/release/album/cat-stevens/tea-for-the-tillerman", "genres": ["folk rock", "pop rock", "blues", "folk pop"], "desc_lfm_album": "Tea for the Tillerman is a highly-regarded album by singer-songwriter Cat Stevens. This album, Stevens' second during 1970, includes many of Stevens' most memorable and beloved songs by his fans, including \"Where Do the Children Play?,\" \"Hard Headed Woman,\" \"Wild World,\" \"Sad Lisa,\" \"Into White\" and \"Father and Son.\" Four of the tracks (\"Where Do the Children Play?\", \"On the Road to Find Out\", \"Tea for the Tillerman\" and \"Miles from Nowhere\") were featured in the Hal Ashby and Colin Higgins' black comedy film entitled Harold and Maude, in 1971, gaining Stevens more fans long afterward. The track \"But I .", "desc_lfm_artist": "Cat Stevens is the former stage name of Steven Demetre Georgiou (born in London on 21 July 1948). He is a British singer-songwriter, multi-instrumentalist, humanitarian and education philanthropist. In December 1977, Stevens converted to Islam and adopted the name Yusuf Islam the following year. He began releasing music as Yusuf in 2006.\n\nStevens' albums Tea for the Tillerman (1970) and Teaser and the Firecat (1971) were both certified triple platinum in the US by the RIAA.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 231, "title": "Loaded", "artist": "The Velvet Underground", "year": 1970, "cover": "https://dn710708.ca.archive.org/0/items/mbid-3645588f-cdcf-4746-97ac-da059d332010/mbid-3645588f-cdcf-4746-97ac-da059d332010-4529718708.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5738-the-velvet-underground-loaded.php", "aoty_critic_score": 100, "aoty_user_score": 81, "mbid": "4be9d91f-6ed7-34b8-aa5e-45be79819273", "yt_id": "AqVWBVbytXo", "rym": "https://rateyourmusic.com/release/album/the-velvet-underground/loaded", "genres": ["experimental rock", "folk rock", "art rock", "garage rock", "proto-punk", "pop rock"], "desc_lfm_album": "Loaded is the fourth album by The Velvet Underground, released in November 1970, by Atlantic Records' subsidiary label, Cotillion. The album was the final album recorded featuring Lou Reed, though he had departed from the band shortly before the album's release. In 2003, Loaded was #109 on Rolling Stone's reissue of their 500 greatest albums of all time. Loaded was a commercial effort aimed at radio play, another step away from the Warhol-influenced days. The album's title refers to Atlantic's request that the band produce an album \"loaded with hits\". Doug Yule said, \"On Loaded there was a big push .", "desc_lfm_artist": "The Velvet Underground was an American experimental rock band formed in New York City in 1964. It originally comprised singer and guitarist Lou Reed, Welsh multi-instrumentalist John Cale, guitarist Sterling Morrison, and drummer Angus MacLise. In 1965 MacLise was replaced by Moe Tucker, who played on most of the band's recordings. Though their integration of rock and the avant-garde resulted in little commercial success, they became one of the most influential bands in rock, underground, experimental, and alternative music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 232, "title": "Layla and Other Assorted Love Songs", "artist": "Derek and the Dominos", "year": 1970, "cover": "https://ia902803.us.archive.org/0/items/mbid-72a5da28-994d-4616-a178-93411e74ba24/mbid-72a5da28-994d-4616-a178-93411e74ba24-1239368360.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "ba53dcbd-9328-3cf7-bc72-179b4512867e", "yt_id": "iqA5FtpYL6w", "rym": "https://rateyourmusic.com/release/album/derek-and-the-dominos/layla-and-other-assorted-love-songs-44", "genres": ["blues rock", "classic rock", "blues", "soft rock"], "desc_lfm_album": "Layla and Other Assorted Love Songs is the only studio album by the English–American rock band Derek and the Dominos, released on 9 November 1970 as a double album by Polydor Records and Atco Records. It is best known for its title track, \"Layla\", which is often regarded as Eric Clapton's greatest musical achievement. The other band members were Bobby Whitlock (vocals, keyboard), Jim Gordon (drums, percussion), and Carl Radle (bass). Duane Allman played lead and slide guitar on 11 of the 14 songs. Initially regarded as a critical and commercial disappointment, it failed to chart in Britain and peaked .", "desc_lfm_artist": "Derek and the Dominos was a music group formed in the spring of 1970 by guitarist and singer Eric Clapton along with Bobby Whitlock, Carl Radle and Jim Gordon, who had all played with him in Delaney & Bonnie & Friends. Duane Allman from the Allman Brothers Band joined the group early in the recording of their first album. They were a blues-rock band that demonstrated virtuosity at its finest, showing some of Eric \"Slowhand\" Clapton's finest work.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 233, "title": "Parallelograms", "artist": "Linda Perhacs", "year": 1970, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12282-parallelograms.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12282-linda-perhacs-parallelograms.php", "aoty_critic_score": 89, "aoty_user_score": 85, "mbid": "0676bfd8-7c4c-39dc-b300-a0035853d9af", "yt_id": "jpkFXDXgQ9Y", "rym": "https://rateyourmusic.com/release/album/linda-perhacs/parallelograms/", "genres": [], "desc_lfm_album": "Parallelograms is an album by American psychedelic folk singer Linda Perhacs. It was produced by Leonard Rosenman. Her first and only album until the release of The Soul of All Natural Things in 2014, it was all but completely ignored when originally released on Kapp Records in 1970. Discouraged by the lack of commercial attention and the label's reluctance to promote the album, Perhacs returned to her career as a dental hygienist. In the 30 or so years that followed, the album gradually developed a cult following. .", "desc_lfm_artist": "Linda Perhacs is an American psychedelic folk singer-songwriter, who released her debut album \"Parallelograms\" in 1970 to scant notice or sales. The album was rediscovered by record enthusiasts and grew in popularity with the rise of the New Weird America movement and the Internet. It was reissued on CD and 2-LP in 2005, and again in 2008.\n\nNative of Mill Valley, California, United States, Linda Perhacs spent many years away from the music industry (mostly spent as dental technician).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere"]}, {"n": 234, "title": "Come to My Garden", "artist": "Minnie Riperton", "year": 1970, "cover": "https://cdn2.albumoftheyear.org/600x0/album/38494-come-to-my-garden-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/38494-minnie-riperton-come-to-my-garden.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "b35364f0-72f4-39f7-a563-adc9daf620d1", "yt_id": "XeYAQ526KHc", "rym": "https://rateyourmusic.com/release/album/minnie-riperton/come-to-my-garden", "genres": [], "desc_lfm_album": "Released 1970, on Chess. Charles Stephney, who also produced Ramsey Lewis, Ahmad Jamal's Chess sessions, and other jazz artists, was the maestro behind the lush music of this album. And, it couldn't have happened without the indescribable, 5-octave voice of Ms. Riperton. She put words to some of the tunes previously released on assorted Ramsey Lewis albums, such as Les Fleurs, Only When I'm Dreaming, and --- . How can I stay neutral when I know for a fact that we'll never hear another voice like this in our lifetime. As a Chicagoan, and knowing that her daughter who can .", "desc_lfm_artist": "Minnie Riperton (Nov 8, 1947 - Jul 12, 1979) was an American singer who is best remembered for her 1974 hit ballad, Lovin' You.\n\nThe tragic 1979 death of 31-year-old Riperton silenced one of soul music's most unique and unforgettable voices - blessed with an angelic five-octave vocal range, she scored her greatest commercial success with the chart-topping pop ballad, \"Lovin' You\". Riperton was born in Chicago on November 8, 1947. As a young girl, she studied music", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 235, "title": "Led Zeppelin III", "artist": "Led Zeppelin", "year": 1970, "cover": "https://dn710700.ca.archive.org/0/items/mbid-7aadcfa2-df82-480e-8d2d-7ec4d0b41172/mbid-7aadcfa2-df82-480e-8d2d-7ec4d0b41172-1287533205.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4523-led-zeppelin-led-zeppelin-iii.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "53f80f76-f8af-3558-bfd5-e7221e055c75", "yt_id": "4ryKUOjCgds", "rym": "https://rateyourmusic.com/release/album/led-zeppelin/led-zeppelin-iii", "genres": ["blues rock", "folk rock", "classic rock", "hard rock", "blues", "arena rock"], "desc_lfm_album": "Led Zeppelin III, the third album by English rock band Led Zeppelin. It was recorded between January and July 1970 and was released October 5, 1970 by Atlantic Records. Led Zeppelin III marked a change in focus for the band from late 1960s hard rock to a more folk rock and acoustic inspired sound. These styles had been present to a lesser degree in the band's first two releases, but here it was the main style - and one that would remain prominent in the group's later albums. This change in direction endeared the band to many progressive rock fans .", "desc_lfm_artist": "Led Zeppelin were an English rock band formed in London in 1968. The group consisted of Robert Plant on vocals, Jimmy Page on guitar, John Paul Jones on bass and keyboards, and John Bonham on drums. Known for a heavy, guitar-based sound that drew from blues and folk traditions, they are widely regarded as a major influence on the development of hard rock and heavy metal. They became one of the best-selling music artists in history and helped shape album-oriented rock and stadium rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 236, "title": "Abraxas", "artist": "Santana", "year": 1970, "cover": "https://dn710204.ca.archive.org/0/items/mbid-e91c52c3-5cb5-43ad-91df-16edeb97ded5/mbid-e91c52c3-5cb5-43ad-91df-16edeb97ded5-18276646672.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6015-santana-abraxas.php", "aoty_critic_score": 100, "aoty_user_score": 84, "mbid": "43424c73-fc58-36b0-b9cf-f8b057ac0603", "yt_id": "IfRCTJmmgpY", "rym": "https://rateyourmusic.com/release/album/santana/abraxas/", "genres": ["blues rock", "psychedelic rock", "classic rock", "hard rock", "latin", "latin rock"], "desc_lfm_album": "Abraxas is the second album by Santana, the Latin rock n' roll group led by guitarist Carlos Santana. Consolidating their live success at the Woodstock Festival in 1969, and the interest generated by their first album the band took some time to issue a follow-up. Released in September 1970, the album's mix of rock, blues, jazz, salsa and other influences made it a classic that defined Santana's early sound, and showed a musical maturation from their first album. Often considered Santana's greatest album, it drew widespread acclaim for its mixture of Latin influences with familiar rock themes such as overdriven .", "desc_lfm_artist": "Santana is an American rock band formed in San Francisco, California, in 1966 by Mexican-born guitarist Carlos Santana. The band has undergone numerous changes in its recording and performing line-ups, with Carlos Santana as the sole consistent member. After signing with Columbia Records, Santana gained widespread attention following their performance at the Woodstock Festival in 1969 and released the albums \"Santana\" (1969), \"Abraxas\" (1970), and \"Santana III\" (1971) with the group's classic line-up", "desc_mb_album": "", "desc_mb_artist": "Note that only releases by the '''band''' Santana are listed here. Solo releases are listed under the separate artist [http://www.musicbrainz.org/artist/f7fda030-0ba1-42e9-a385-3deebc939bc9.html|Carlos Santana].\r\n\r\nThe official discography of Santana can be found at http://www.santana.com/Sights-And-Sounds-Discography/ and a timeline at http://www.rockonthenet.com/artists-s/santana.htm", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario"]}, {"n": 237, "title": "After the Gold Rush", "artist": "Neil Young", "year": 1970, "cover": "https://dn710804.ca.archive.org/0/items/mbid-95723f6f-f2e3-4a94-9ede-5d2f69932a8a/mbid-95723f6f-f2e3-4a94-9ede-5d2f69932a8a-25980652618.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6097-neil-young-after-the-gold-rush.php", "aoty_critic_score": 92, "aoty_user_score": 85, "mbid": "b6a3952b-9977-351c-a80a-73e023143858", "yt_id": "sSWxU-mirqg", "rym": "https://rateyourmusic.com/release/album/neil-young/after-the-gold-rush", "genres": ["folk rock", "folk", "country rock", "classic rock", "hard rock", "country"], "desc_lfm_album": "Neil Young – guitar, piano, harmonica, vibes, vocal Nils Lofgren – piano, vocal Greg Reeves – bass Ralph Molina – drums, vocal Danny Whitten – guitar, vocal Jack Nitzsche – piano Billy Talbot – bass Bill Peterson – flugelhorn Stephen Stills – vocal Released September 19, 1970 Recorded Aug. 1969-June 1970 Genre Rock, country rock Length 35:10 Label Reprise Producer Neil Young, David Briggs with Kendall Pacios .", "desc_lfm_artist": "Neil Percival Young (born November 12, 1945) is a Canadian singer, guitarist, songwriter, and social activist who is widely regarded as one of the most influential musicians of his generation, particularly as Neil Young & Crazy Horse. Young was born in Toronto, but he moved to the family home of Winnipeg as a child, which is where his music career began. Young began performing as a solo artist in Canada in 1960, before moving to California in 1966, where he co-founded the band Buffalo Springfield along with Stephen Stills and Richie Furay.", "desc_mb_album": "", "desc_mb_artist": "... has a gigography at [http://www.sugarmtn.org].", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 238, "title": "Paranoid", "artist": "Black Sabbath", "year": 1971, "cover": "https://dn721204.ca.archive.org/0/items/mbid-188fb66b-2fd9-41a7-8d81-088e20714ad1/mbid-188fb66b-2fd9-41a7-8d81-088e20714ad1-22846264996.png", "aoty_url": "https://www.albumoftheyear.org/album/5588-black-sabbath-paranoid.php", "aoty_critic_score": 96, "aoty_user_score": 90, "mbid": "cc053745-c447-3566-8f27-bed5438c9133", "yt_id": "fWvKvOViM3g", "rym": "https://rateyourmusic.com/release/album/black-sabbath/paranoid", "genres": ["blues rock", "classic rock", "hard rock", "heavy metal", "doom metal", "metal"], "desc_lfm_album": "\"Paranoid\" is the second album by the British heavy metal band Black Sabbath, released in September 1970 through Vertigo Records. The album consists of some of the band's most readily identifiable work including \"Iron Man\", \"War Pigs\", and \"Paranoid\". The album is regarded as a classic, and one of the most influential of the heavy metal genre. It has been certified quadruple platinum with over four million copies in the US alone, making it Black Sabbath's best-selling album. The \"Paranoid\" single, released before the album, reached number four in the UK. Pushed by its success, the album hit number one .", "desc_lfm_artist": "Black Sabbath was an English heavy metal band formed in Birmingham in 1968 by guitarist Tony Iommi, drummer Bill Ward, bassist Geezer Butler, and vocalist Ozzy Osbourne. The band initially performed under the names Polka Tulk Blues Band and later Earth, before adopting the name Black Sabbath in 1969. They became known for lyrical themes influenced by horror and the occult, as well as for the use of down-tuned guitars. Their first three albums, \"Black Sabbath\" and \"Paranoid\" (both 1970)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 239, "title": "Curtis", "artist": "Curtis Mayfield", "year": 1971, "cover": "https://dn710203.ca.archive.org/0/items/mbid-34bf0064-0b15-4759-9964-d177c58fc7d8/mbid-34bf0064-0b15-4759-9964-d177c58fc7d8-19800314051.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12981-curtis-mayfield-curtis.php", "aoty_critic_score": 93, "aoty_user_score": 87, "mbid": "0c24e81f-b710-3e24-a4fa-12950e153585", "yt_id": "BzsmciMNAGU", "rym": "https://rateyourmusic.com/release/album/curtis-mayfield/curtis", "genres": ["soul", "funk", "funk / soul"], "desc_lfm_album": "Curtis is the debut studio album by Curtis Mayfield, released in September 1970. Produced by Mayfield, it was released on his own label Curtom Records. The musical styles of Curtis moved further away from the pop-soul sounds of Mayfield's previous group The Impressions and featured more of a funk and psychedelic-influenced sound. The album's subject matter incorporates political and social concerns of the time. .", "desc_lfm_artist": "Curtis Mayfield (June 3, 1942 – December 26, 1999) was an American soul, funk and rhythm and blues, singer-songwriter and guitarist from Chicago, Illinois.\n\nMayfield is probably best known for his anthemic music with The Impressions and for the soundtrack to the blaxploitation film Superfly.\n\nPerhaps because he didn't cross over to the pop audience as heavily as Motown's stars, it may be that the scope of Curtis Mayfield's talents and contributions have yet to be fully recognized.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 240, "title": "Fôrça bruta", "artist": "Jorge Ben", "year": 1970, "cover": "https://cdn2.albumoftheyear.org/600x0/album/27159-forca-bruta-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/27159-jorge-ben-forca-bruta.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "9be4876d-be66-312e-8027-38756d42eb4c", "yt_id": "JIj58k0lib0", "rym": "https://rateyourmusic.com/release/album/jorge-ben/forca-bruta/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Jorge Duílio Lima Menezes (born in Rio de Janeiro, RJ, Brazil, on March 22, 1939), better known as Jorge Ben or Jorge Ben Jor, is a Brazilian multi-instrumentalist, singer, and songwriter. In 2008, Rolling Stone Brazil named him the 5th greatest artist in the history of Brazilian music. He was also included in the magazine’s 2012 list of the 30 Greatest Brazilian Icons of Guitar and Acoustic Guitar.\n\nHis characteristic style includes various elements such as rock", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 241, "title": "Sunflower", "artist": "The Beach Boys", "year": 1970, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22351-sunflower-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22351-the-beach-boys-sunflower.php", "aoty_critic_score": 97, "aoty_user_score": 83, "mbid": "464dba39-079e-3ea4-84e1-1829324de678", "yt_id": "gDLGVD_1aMM", "rym": "https://rateyourmusic.com/release/album/the-beach-boys/sunflower", "genres": [], "desc_lfm_album": "Sunflower is the 16th studio album by The Beach Boys, released on August 31, 1970, and their first on Reprise Records. The recording sessions began in January 1969, and after a year-long search for a new record contract, completed in July 1970. .", "desc_lfm_artist": "The Beach Boys are an American rock band formed in Hawthorne, California, in 1961. The original lineup included brothers Brian, Dennis, and Carl Wilson, their cousin Mike Love, and their friend Al Jardine. Known for their vocal harmonies and lyrics often centered on youth culture, the band drew influence from older pop vocal groups, 1950s rock and roll, and rhythm and blues. Under Brian Wilson's leadership, their music sometimes incorporated elements of classical and jazz, as well as experimental recording techniques.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 242, "title": "Cosmo’s Factory", "artist": "Creedence Clearwater Revival", "year": 1970, "cover": "https://ia800205.us.archive.org/6/items/mbid-57b35ec9-77ed-4f5a-bad4-8f5992932563/mbid-57b35ec9-77ed-4f5a-bad4-8f5992932563-1856425267.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3a31800f-1916-3f4c-a7ae-26b783d00670", "yt_id": "MmjNIJ4YIFI", "rym": "https://rateyourmusic.com/release/album/creedence-clearwater-revival/cosmos-factory", "genres": ["blues rock", "country rock", "rock and roll", "classic rock", "southern rock", "swamp rock"], "desc_lfm_album": "Cosmo's Factory is the fifth album by American band Creedence Clearwater Revival, released in 1970. Six of the album's eleven tracks were released as singles in 1970, and all of them charted in the top 5 of the Billboard Hot 100. The album spent nine consecutive weeks in the number one position on the Billboard 200 chart and was certified 4x platinum by the Recording Industry Association of America (RIAA) in 1990. In 2003, the album was ranked number 265 on Rolling Stone's list of the 500 greatest albums of all time; it was re-ranked number 413 on the revised .", "desc_lfm_artist": "Creedence Clearwater Revival (often referred to as Creedence or CCR) was an American rock band active in the late 1960s and early 1970s which consisted of lead vocalist, lead guitarist, and primary songwriter John Fogerty, his brother rhythm guitarist Tom Fogerty, bassist Stu Cook, and drummer Doug Clifford.\n\nThese members played together since 1959, first as The Blue Velvets, then as The Golliwogs. Their musical style encompassed the roots rock, swamp rock, and blues rock genres.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "armandwave"]}, {"n": 243, "title": "Fun House", "artist": "The Stooges", "year": 1970, "cover": "https://dn711107.ca.archive.org/0/items/mbid-68ee7490-8776-4200-9ef1-d6553eb8ba16/mbid-68ee7490-8776-4200-9ef1-d6553eb8ba16-14524268492.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6035-the-stooges-funhouse.php", "aoty_critic_score": 97, "aoty_user_score": 83, "mbid": "edd57263-df77-3f1a-8803-8beb5d5b1a64", "yt_id": "o4GTkpSzRDQ", "rym": "https://rateyourmusic.com/release/album/the-stooges/fun-house", "genres": ["garage rock", "proto-punk", "classic rock", "hard rock", "punk", "punk rock"], "desc_lfm_album": "Fun House is the second studio album by American rock band the Stooges. It was released on July 7, 1970, by Elektra Records. Though initially commercially unsuccessful, Fun House developed a strong cult following. Like its predecessor (1969's The Stooges) and its successor (1973's Raw Power), it is generally considered integral in the development of punk rock. In 1969, Elektra Records had released the Stooges' debut album to mixed reviews and mediocre commercial success (peaking at number 106 on the Billboard charts). Company head Jac Holzman believed that MC5, another Michigan-based band, had more potential of success than the Stooges. .", "desc_lfm_artist": "The Stooges (also known as Iggy and the Stooges) was an American rock group that was formed in Ann Arbor, Michigan, United States in 1967. Featuring a bombastic proto-punk sound, they released three studio albums before breaking up in 1974. Despite picking up  little to no chart or radio success, the band has proved to be one of the most influential rock groups of the past several decades, inspiring many artists such as the Ramones. The band reunited in 2003", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 244, "title": "Stone Flower", "artist": "Antônio Carlos Jobim", "year": 1970, "cover": "https://cdn2.albumoftheyear.org/600x0/album/67402-stone-flower-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/67402-antonio-carlos-jobim-stone-flower.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "e749dd10-8be4-3c2c-abda-22102a2d7003", "yt_id": "_lfHX8NBmXk", "rym": "https://rateyourmusic.com/release/album/antonio-carlos-jobim/stone-flower", "genres": [], "desc_lfm_album": "The sixth studio album by Antônio Carlos Jobim. The LP has four brand new tracks (\"Tereza My Love\", \"Choro\", \"Stone Flower\" and \"Andorinha\"). .", "desc_lfm_artist": "Antônio Carlos Brasileiro de Almeida Jobim (January 25, 1927 – December 8, 1994), also known as Tom Jobim, was a Brazilian composer, pianist, songwriter, arranger and singer. Widely considered as one of the great exponents of Brazilian music, Jobim internationalized bossa nova and, with the help of important American artists, merged it with jazz in the 1960s to create a new sound with remarkable popular success. As such he is sometimes known as the \"father of bossa nova\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 245, "title": "Third", "artist": "Soft Machine", "year": 1970, "cover": "https://ia601703.us.archive.org/23/items/mbid-f74a5d98-213c-43f2-b87b-54f3fb3c4cb7/mbid-f74a5d98-213c-43f2-b87b-54f3fb3c4cb7-4138243916.jpg", "aoty_url": "https://www.albumoftheyear.org/album/23093-soft-machine-third.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "9fabbd9f-c6a2-3773-91ce-6ef937d47daa", "yt_id": "MP92af0TKT0", "rym": "https://rateyourmusic.com/release/album/soft-machine/third/", "genres": ["avant-garde", "psychedelic rock", "art rock", "jazz rock", "progressive rock", "jazz"], "desc_lfm_album": "The Soft Machine plunged deeper into jazz and contemporary electronic music on this pivotal release, which incited the Village Voice to call it a milestone achievement when it was released. It's a double album of stunning music, with each side devoted to one composition — two by Mike Ratledge, and one each by Hopper and Wyatt, with substantial help from a number of backup musicians, including Canterbury mainstays Elton Dean and Jimmy Hastings. The Ratledge songs come closest to fusion jazz, although this is fusion laced with tape loop effects and hypnotic, repetitive keyboard patterns. Hugh Hopper's \"Facelift\" recalls \"21st .", "desc_lfm_artist": "", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "verygooood"]}, {"n": 246, "title": "Deep Purple in Rock", "artist": "Deep Purple", "year": 1970, "cover": "https://dn711100.ca.archive.org/0/items/mbid-5156ea9f-eb54-4258-bbf0-e3af9219de1f/mbid-5156ea9f-eb54-4258-bbf0-e3af9219de1f-31715408459.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15391-deep-purple-deep-purple-in-rock.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "ebdb53c3-fbae-34b1-81cb-f825c9a56822", "yt_id": "W_jfHvcAXRY", "rym": "https://rateyourmusic.com/release/album/deep-purple/deep-purple-in-rock", "genres": ["classic rock", "hard rock", "heavy metal", "metal"], "desc_lfm_album": "Deep Purple in Rock (also known as In Rock) is an album by English rock band Deep Purple, released in June 1970. It was their fourth studio album, and the first with the classic Mk II lineup. Deep Purple in Rock was their breakthrough album in Europe and would peak at #4 in the UK, remaining in the charts for months. Album was supported by the hugely successful In Rock World Tour which lasted 15 months. Although this was the first studio album to feature the MK II lineup of the band, it was this lineup that had earlier recorded .", "desc_lfm_artist": "Deep Purple are a British rock band formed in London in 1968. They are regarded as pioneers of heavy metal and modern hard rock, although their musical style has incorporated elements of psychedelic rock, progressive rock, and blues rock over the course of their career. After beginning with a more psychedelic and progressive approach, they moved toward a heavier sound with the 1970 album \"Deep Purple in Rock\". Along with Led Zeppelin and Black Sabbath", "desc_mb_album": "", "desc_mb_artist": "'''Deep Purple Mk 1 (1968–1969)''' were\n[artist:fc5f555c-dfa2-4f16-9da5-98342105c23a|Ritchie Blackmore] (guitar), [artist:ed031718-b94c-403d-8a89-438e355db488|Rod Evans] (vocals), [artist:00929331-8a98-4651-9052-6feaf0458b81|Nick Simper] (bass, vocals), [artist:6bf692e0-baac-4428-94c3-423d52508cf0|Jon Lord] (organ, keyboards), [artist:29c11f6b-df9f-454f-964e-75eedadb4a1e|Ian Paice] (drums)\n\n'''Deep Purple Mk 2 (1969–1973)''' were\n[artist:fc5f555c-dfa2-4f16-9da5-98342105c23a|Ritchie Blackmore] (guitar), [artist:ff2a0e30-aec1-44dd-ae06-dc78877f512d|Ian Gillan] (vocals), [artist:583944a8-d43b-42e9-8e3c-29eb89f53587|Roger Glover] (bass), [artist:6bf692e0-baac-4428-94c3-423d52508cf0|Jon Lord] (organ, keyboards), [artist:29c11f6b-df9f-454f-964e-75eedadb4a1e|Ian Paice] (drums)\n\n'''Deep Purple Mk ", "heard_by": ["Lonsonxd", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 247, "title": "Exuma", "artist": "Exuma", "year": 1970, "cover": "https://ia801404.us.archive.org/33/items/mbid-d605007f-74eb-419b-9ed5-062c6743fbd0/mbid-d605007f-74eb-419b-9ed5-062c6743fbd0-6842201405.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5592-exuma-exuma.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "fcc0d3b8-d932-36f4-ad5c-9be0b62c592a", "yt_id": "98FnjPM-hec", "rym": "https://rateyourmusic.com/release/album/exuma/exuma", "genres": ["folk", "blues", "avant-folk"], "desc_lfm_album": "", "desc_lfm_artist": "Exuma was Bahamian musician, artist, playwright and author Macfarlane Gregory Anthony Mackey (born 18 February 1942 on Cat Island, Bahamas; died 25 January 1997; Nassau, Bahamas). Known for his almost unclassifiable music, he recorded many albums, starting with Exuma, The Obeah Man in 1970 and ending with Rude Boy in 1986. His songs invoke influences from calypso, junkanoo, reggae, African and folk music with his lyrics dealing heavily with Obeah, a sorcerous Caribbean folk religion resembling African voudou.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 248, "title": "Ladies Of The Canyon", "artist": "Joni Mitchell", "year": 1970, "cover": "https://i.discogs.com/DMyjrIAXHHRntjnvdZyj3J48x2H8t7brumteKn6GLL0/rs:fit/g:sm/q:90/h:598/w:598/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTEzMTc2/ODEtMTM0NTgzNTMx/Mi05ODQxLmpwZWc.jpeg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "b04408f3-7a41-30f0-89c0-eba1efea3aae", "yt_id": "3Rvf324HtJg", "rym": "https://rateyourmusic.com/release/album/joni-mitchell/ladies-of-the-canyon", "genres": [], "desc_lfm_album": "Ladies of the Canyon is the third studio album by Canadian singer-songwriter Joni Mitchell, released in 1970. The title makes reference to Laurel Canyon, a centre of popular music culture in Los Angeles during the 1960s. The album includes several of Mitchell's most noted songs, such as \"Big Yellow Taxi\", \"Woodstock\" and \"The Circle Game\". .", "desc_lfm_artist": "Roberta Joan Mitchell (née Anderson; born November 7, 1943) is a Canadian and American singer-songwriter, multi-instrumentalist, and painter. She gained recognition in the 1960s folk music scene for her personal lyrics and distinctive compositions, which later incorporated elements from various genres including pop, jazz, and rock. Over her career, she has received multiple awards, including eleven Grammy Awards, and was inducted into the Rock and Roll Hall of Fame in 1997.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave"]}, {"n": 249, "title": "Bitches Brew", "artist": "Miles Davis", "year": 1970, "cover": "https://ia902803.us.archive.org/34/items/mbid-432048e8-9f82-4d67-a29d-781a8df28475/mbid-432048e8-9f82-4d67-a29d-781a8df28475-12676938708.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6039-miles-davis-bitches-brew.php", "aoty_critic_score": 100, "aoty_user_score": 90, "mbid": "a9e30282-5b37-3f92-b897-b9659a1a312b", "yt_id": "SbCt-iXIXlQ", "rym": "https://rateyourmusic.com/release/album/miles-davis/bitches-brew", "genres": ["avant-garde", "jazz rock", "psychedelic", "jazz", "avant-garde jazz", "jazz fusion"], "desc_lfm_album": "Bitches Brew is a studio double album by jazz musician Miles Davis, released in April 1970 on Columbia Records. The album continued his experimentation with electric instruments previously featured on his critically acclaimed In A Silent Way album. With the use of these instruments, such as the electric piano and guitar, Davis rejected traditional jazz rhythms in favor of a looser, rock-influenced improvisational style. Bitches Brew was Davis's first gold record, selling more than half a million copies. Upon release, it received a mixed response, due to the album's unconventional style and revolutionary sound. Later, Bitches Brew gained recognition as .", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 250, "title": "Band Of Gypsys", "artist": "Jimi Hendrix", "year": 1970, "cover": "https://dn711009.ca.archive.org/0/items/mbid-7cff6dca-a5e9-4a22-92e0-bcb2ca7c6dcc/mbid-7cff6dca-a5e9-4a22-92e0-bcb2ca7c6dcc-23415142353.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "06eada6a-7bff-34ef-8311-a0435833061f", "yt_id": "d_Hr1R59OaI", "rym": "https://rateyourmusic.com/release/album/hendrix/band-of-gypsys", "genres": ["blues rock", "psychedelic rock", "acid rock", "classic rock", "hard rock", "rock"], "desc_lfm_album": "Band of Gypsys was the only live recording authorized by Jimi Hendrix before his death. It was recorded and released in order to get Hendrix out from under a contractual obligation that had been hanging over his head for a couple years. Helping him out were longtime friends Billy Cox on bass and Buddy Miles on the drums because the Experience had broken up in June of 1969, following a show in Denver. This rhythm section was vastly different from the Experience. Buddy Miles was an earthy, funky drummer in direct contrast to the busy, jazzy leanings of Mitch Mitchell. .", "desc_lfm_artist": "James Marshall \"Jimi\" Hendrix (born Johnny Allen Hendrix; November 27, 1942 – September 18, 1970) was an American rock guitarist, singer, and songwriter. Although his mainstream career spanned only four years, he is widely regarded as one of the most influential electric guitarists in the history of popular music, and one of the most celebrated musicians of the 20th century. The Rock and Roll Hall of Fame describes him as \"arguably the greatest instrumentalist in the history of rock music\".", "desc_mb_album": "", "desc_mb_artist": "Please note: The American/Canadian releases of \"Are You Experienced?\" had a spelling mistake on the song \"Foxy Lady\" (it is spelled \"Foxey Lady\" on the albums).  These copies were released months after the original UK version which had the correct spelling (\"Foxy Lady\").\r\n\r\nThe discography of Jimi Hendrix is a complex matter. Strictly speaking, only the four albums \"Are You Experienced?\", \"Axis: Bold as Love\", \"Electric Ladyland\", and \"Band of Gypsys\" are officially sanctioned by Hendrix. First three of those albums were released by his band, [http://musicbrainz.org/artist/33b3c323-77c2-417c-a5b4-af7e6a111cc9.html|The Jimi Hendrix Experience]. You will find those albums at that artist page.\r\n\r\n== Posthumous Releases ==\r\nThere are so many posthumous releases of Jimi Hendrix material that th", "heard_by": ["armandwave"]}, {"n": 251, "title": "Déjà vu", "artist": "Crosby, Stills, Nash & Young", "year": 1970, "cover": "https://ia601209.us.archive.org/27/items/mbid-dcad19e5-fe96-3be2-a9f2-b7ce395b0dac/mbid-dcad19e5-fe96-3be2-a9f2-b7ce395b0dac-43226604378.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7512-crosby-stills-nash-young-deja-vu.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "3412fd44-c6e6-3a3b-b91a-964a055192ec", "yt_id": "dfheqbqoGGg", "rym": "https://rateyourmusic.com/release/album/crosby-stills-nash-and-young/deja-vu", "genres": ["folk rock", "folk", "country rock", "contemporary folk"], "desc_lfm_album": "Déjà Vu is the first album by the rock band Crosby, Stills, Nash & Young, and the second by the trio configuration of Crosby, Stills, and Nash. It was released in March of 1970 by Atlantic Records, catalogue SD-7200. It topped the pop album chart for one week and generated three Top 40 singles: \"Teach Your Children,\" \"Our House,\" and \"Woodstock.\" In 2003, the album was ranked number 148 on Rolling Stone magazine's list of the 500 greatest albums of all time. Déjà Vu was greatly anticipated after the popularity of the first CSN album and the addition of Young .", "desc_lfm_artist": "Crosby, Stills, Nash & Young was a folk-rock supergroup formed when Crosby, Stills & Nash  (Stephen Stills of Buffalo Springfield, David Crosby from the Byrds, and Graham Nash from the Hollies) asked Neil Young, also of Buffalo Springfield to join them in 1969 and form \"Crosby, Stills, Nash & Young\".\nCommonly referred to by their initials CSNY, the band is primarily known for their four-part vocal harmonies. They were one of the few North American groups that rivaled the Beatles in popularity in the late 1960s and early 1970s.", "desc_mb_album": "", "desc_mb_artist": "See also [http://musicbrainz.org/artist/cfafad90-b736-4c74-8ded-f3f4d7b2c792|Crosby, Stills & Nash].", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 252, "title": "A Divina Comédia ou Ando Meio Desligado", "artist": "Os Mutantes", "year": 1970, "cover": "https://i.discogs.com/SObkQr9XbfyrTovOHDwEbocq3oIgCbHkmCp-jspNIDQ/rs:fit/g:sm/q:90/h:597/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTI4MjM1/MjctMTY3Mzk5NTA0/NC0zNjk0LmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/45056-os-mutantes-a-divina-comedia-ou-ando-meio-desligado.php", "aoty_critic_score": 80, "aoty_user_score": 85, "mbid": "79e9593d-3d7e-3dfd-8126-794b76d803e8", "yt_id": "ZNDbwixfGwI", "rym": null, "genres": [], "desc_lfm_album": "A divina comédia ou ando meio desligado is the third album by the Brazilian tropicalia/Psychedelic Rock band Os Mutantes. The album was originally released in 1970 and reissued in 1999 on Omplatten Records. The title in English means: The Divine Comedy or I Walk a bit Disconnected. \"I walk a bit disconnected\" in this sense means \"I feel a little spaced out.\" The second track features the band humorously imitating Californian accents. The album as a whole is characterized by an interesting mix of psychedelic and religious imagery, and is considered by many to be some of the group's finest .", "desc_lfm_artist": "Os Mutantes is a Brazilian psychedelic rock band formed during the Tropicalista Movement in 1966, in São Paulo, by Arnaldo Baptista, Rita Lee and Sérgio Dias.\n\nThe band is considered one of the main groups in Brazilian rock. Like most groups from the 1960s, Os Mutantes were heavily influenced by The Beatles, Jimi Hendrix and Sly & the Family Stone. However, Brazilian musicians were also immersed in their local culture, exercising their own creativity in the use of feedback", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 253, "title": "Black Sabbath", "artist": "Black Sabbath", "year": 1970, "cover": "https://dn711101.ca.archive.org/0/items/mbid-9fd196b4-0437-4ce2-9e7e-9966dfa86180/mbid-9fd196b4-0437-4ce2-9e7e-9966dfa86180-15612615429.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7075-black-sabbath-black-sabbath.php", "aoty_critic_score": 97, "aoty_user_score": 86, "mbid": "826c9743-a3f0-3479-bf06-8df2e140ef1d", "yt_id": "o8jPw5F8GJk", "rym": "https://rateyourmusic.com/release/album/black-sabbath/black-sabbath", "genres": ["blues rock", "hard rock", "heavy metal", "doom metal", "metal", "traditional doom metal"], "desc_lfm_album": "Black Sabbath's first release, almost universally known as \"Heavy Metal's first album\". The guys from Birmingham, England shocked, scared and enthused million with their new sound - a blend of bluesy, soulful riffs with heavy, distorted tones. Released on Friday the 13th February 1970 by Vertigo Records, Black Sabbath reached number eight on the UK Album Chart. Following its US release in May 1970 by Warner Bros. Records, the album reached number 23 on the Billboard 200, where it remained for over a year, selling a million copies. While the album was a commercial success, it was widely panned by .", "desc_lfm_artist": "Black Sabbath was an English heavy metal band formed in Birmingham in 1968 by guitarist Tony Iommi, drummer Bill Ward, bassist Geezer Butler, and vocalist Ozzy Osbourne. The band initially performed under the names Polka Tulk Blues Band and later Earth, before adopting the name Black Sabbath in 1969. They became known for lyrical themes influenced by horror and the occult, as well as for the use of down-tuned guitars. Their first three albums, \"Black Sabbath\" and \"Paranoid\" (both 1970)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 254, "title": "Morrison Hotel", "artist": "The Doors", "year": 1970, "cover": "https://dn721907.ca.archive.org/0/items/mbid-3e716665-f08b-4770-b94e-b82fa7d1928e/mbid-3e716665-f08b-4770-b94e-b82fa7d1928e-29224176053.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7767-the-doors-morrison-hotel.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "deee6f92-2662-3095-8aea-6892b10b8265", "yt_id": "hDO7_RkT3OY", "rym": "https://rateyourmusic.com/release/album/the-doors/morrison-hotel", "genres": ["blues rock", "psychedelic rock", "acid rock", "classic rock", "psychedelic", "rock"], "desc_lfm_album": "\"Morrison Hotel\" is the fifth studio album by the American rock band the Doors, released on February 9, 1970, by Elektra Records. Following the use of brass and string arrangements on their previous album \"The Soft Parade\", as encouraged by producer Paul A. Rothchild, the band returned to a more straightforward blues rock sound. This stylistic shift was widely regarded as a return to form. Recording took place at Elektra Sound Recorders in Los Angeles beginning in November 1969. The album is divided into two titled sides: \"Hard Rock Café\" and \"Morrison Hotel\". Notable contributions include session bass performances by .", "desc_lfm_artist": "The Doors was an American rock band formed in Los Angeles in 1965, consisting of vocalist Jim Morrison, keyboardist Ray Manzarek, guitarist Robby Krieger, and drummer John Densmore. The band became known for its distinctive sound, Morrison’s lyrical style and vocal delivery, and the group’s association with the 1960s counterculture. They also attracted attention for Morrison’s stage behavior and various legal controversies.\n\nThe band took its name from the title of Aldous Huxley's book \"The Doors of Perception\"", "desc_mb_album": "", "desc_mb_artist": "Deprecated ISNI: [http://www.isni.org/0000000115160232|0000 0001 1516 0232]", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 255, "title": "Moondance", "artist": "Van Morrison", "year": 1970, "cover": "https://dn710604.ca.archive.org/0/items/mbid-1a1ce8e2-8742-4146-8f3f-172376f94468/mbid-1a1ce8e2-8742-4146-8f3f-172376f94468-10696308872.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6829-van-morrison-moondance.php", "aoty_critic_score": 94, "aoty_user_score": 82, "mbid": "16506432-d133-3b2f-a504-dc88966dad2a", "yt_id": "UCDdpShvV_U", "rym": "https://rateyourmusic.com/release/album/van-morrison/moondance", "genres": ["folk rock", "blue-eyed soul", "classic rock", "jazz", "jazz pop", "r&b"], "desc_lfm_album": "Moondance is the third solo album by Northern Irish singer-songwriter Van Morrison. It was released on Warner Bros. Records on 28 February 1970 and peaked at #29 on Billboard's Pop Albums chart. The album's musical style blends R&B;, folk rock, country rock, and also jazz (most obviously on the title track). The single released was \"Come Running\" with \"Crazy Love\" as the B-side, which peaked at #39 on the Pop Singles chart. \"Crazy Love\" was only released as a single in the Netherlands and did not chart. \"Moondance\", as a single was not released until 1977 and peaked at #92. .", "desc_lfm_artist": "Sir George Ivan \"Van\" Morrison, OBE (generally known as Van Morrison or Van The Man) (born 31 August 1945) is a Grammy Award-winning artist from Belfast, Northern Ireland. He's a singer, songwriter, author, poet, and multi-instrumentalist, who has been a professional musician since 1958. He plays a variety of instruments, including the guitar, harmonica, keyboards, drums, and saxophone. Featuring his characteristic growl - a unique mix of folk, blues", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 256, "title": "Bridge Over Troubled Water", "artist": "Simon and Garfunkel", "year": 1970, "cover": "https://dn710701.ca.archive.org/0/items/mbid-82b19c9b-07e0-49c1-97e3-363510c26a30/mbid-82b19c9b-07e0-49c1-97e3-363510c26a30-18257588738.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "c39f7f80-d42f-3669-9653-230f8e922083", "yt_id": "4G-YQA_bsOU", "rym": "https://rateyourmusic.com/release/album/simon-and-garfunkel/bridge-over-troubled-water", "genres": ["folk rock", "folk", "pop rock", "folk pop", "soft rock"], "desc_lfm_album": "", "desc_lfm_artist": "Simon & Garfunkel were an American singer-songwriter duo consisting of Paul Simon and Art Garfunkel. They formed the group Tom and Jerry in 1957, and had their first taste of success with the minor hit \"Hey, Schoolgirl\". As Simon and Garfunkel, the duo rose to fame in 1965, backed by the hit single \"The Sounds of Silence\". Their music was featured in the landmark film The Graduate, propelling them further into the public consciousness.\n\nThey are well known for their close vocal harmonies and sometimes unstable relationship.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}];
