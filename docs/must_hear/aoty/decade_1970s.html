", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 47, "title": "Before and After Science", "artist": "Brian Eno", "year": 1977, "cover": "https://dn710300.ca.archive.org/0/items/mbid-654d72ba-0e6d-34c7-a4a2-8d47ffe7c2aa/mbid-654d72ba-0e6d-34c7-a4a2-8d47ffe7c2aa-16019369012.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6098-brian-eno-before-and-after-science.php", "aoty_critic_score": 94, "aoty_user_score": 83, "mbid": "6f9e2641-f79b-32f2-a752-f7212e9040e4", "yt_id": "eYDBTYfn9D8", "rym": "https://rateyourmusic.com/release/album/brian-eno/before-and-after-science", "genres": ["art rock"], "desc_lfm_album": "Before and After Science is really a study of \"studio composition\" whereby recordings are created by deconstruction and elimination: tracks are recorded and assembled in layers, then selectively subtracted one after another, resulting in a composition and sound quite unlike that at the beginning of the process. Despite the album's pop format, the sound is unique and strays far from the mainstream. Eno also experiments with his lyrics, choosing a sound-over-sense approach. When mixed with the music, these lyrics create a new sense or meaning, or the feeling of meaning, a concept inspired by abstract sound poet Kurt Schwitters (epitomized .", "desc_lfm_artist": "Brian Peter George Eno (b. 15 May 1948) is an English musician, record producer, visual artist, and theorist best known for his pioneering work in ambient music and contributions to rock, pop, and electronica. A self-described \"non-musician\", Eno has helped introduce unique conceptual approaches and recording techniques to contemporary music. He has been described as one of popular music's most influential and innovative figures.\n\nBorn in Suffolk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 48, "title": "AN INSATIABLE HIGH", "artist": "高中正義 [Masayoshi Takanaka]", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/130139-an-insatiable-high_160119.jpg", "aoty_url": "https://www.albumoftheyear.org/album/130139-masayoshi-takanaka-an-insatiable-high.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": null, "yt_id": "PQDGuUc-yrk", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["Rocky_stereo"]}, {"n": 49, "title": "Pink Flag", "artist": "Wire", "year": 1977, "cover": "https://dn710004.ca.archive.org/0/items/mbid-f1d890b3-84e0-43f0-9db2-c81fc1acf39b/mbid-f1d890b3-84e0-43f0-9db2-c81fc1acf39b-36502100048.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6047-wire-pink-flag.php", "aoty_critic_score": 97, "aoty_user_score": 84, "mbid": "9facb8b5-4b02-3f28-9f4a-61cb9b8fd7aa", "yt_id": "1Wi94-JGrtc", "rym": "https://rateyourmusic.com/release/album/wire/pink-flag", "genres": ["post-punk", "art punk", "punk", "punk rock", "rock"], "desc_lfm_album": "Pink Flag is the first studio album by the English band Wire. It was released in November 1977 by Harvest Records. Though the album failed to chart on its initial release, it has been widely considered to have been highly influential on many other musicians. Upon its release, Robert Christgau of The Village Voice called Pink Flag a \"punk suite\" and praised its \"simultaneous rawness and detachment\" and detected a rock-and-roll irony similar to but \"much grimmer and more frightening\" than the Ramones. In a retrospective review, Steve Huey of AllMusic opined that Pink Flag was \"perhaps the most original .", "desc_lfm_artist": "Wire is an English post-punk band formed in 1976 in Watford, England and after splitting in 1980, have reformed three times. They consist of Colin Newman (vocals, guitar), Graham Lewis (vocals, bass) and Robert Gotobed (drums). Founding guitarist Bruce Gilbert left in 2004. In 2008, Margaret Fielder McGinnis of Laika joined the band as their touring guitarist, but as of 2010 has been replaced by Matt Simms.\n\nWire's debut album, Pink Flag (1977), contains songs which are diverse in mood and style", "desc_mb_album": "", "desc_mb_artist": "\"Wir\" was the name the band \"Wire\" used temporarily after one of the members, Robert Gotobed, had left the band in 1991.", "heard_by": ["GabredMared", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 50, "title": "Out of the Blue", "artist": "Electric Light Orchestra", "year": 1977, "cover": "https://dn710901.ca.archive.org/0/items/mbid-e470249c-66e3-4565-a0cd-6b052bde709e/mbid-e470249c-66e3-4565-a0cd-6b052bde709e-12414410936.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29644-electric-light-orchestra-out-of-the-blue.php", "aoty_critic_score": 63, "aoty_user_score": 82, "mbid": "a720436f-9c8e-439a-a147-18e83441edab", "yt_id": "Jrd0yrpp5vg", "rym": "https://rateyourmusic.com/release/album/electric-light-orchestra/out-of-the-blue", "genres": ["art rock", "pop rock", "progressive rock", "progressive pop", "symphonic rock", "rock"], "desc_lfm_album": "Out of the Blue is the seventh studio album by the British rock group Electric Light Orchestra, released in October 1977. Written and produced by ELO frontman Jeff Lynne, the double album is among the most commercially successful records in the group's history. .", "desc_lfm_artist": "The Electric Light Orchestra, or ELO, was an English symphonic rock band which formed in Birmingham, Warwickshire in 1970. The band was formed by Jeff Lynne (vocals, guitar, multiple instruments), Roy Wood (multiple instruments, vocals), Richard Tandy (keyboards, vocals) and Bev Bevan (drums). Lynne, Wood and Bevan were former members of the psychedelic rock band The Move. The band's lineup would fluctuate throughout its original incarnation, although Lynne, Tandy and Bevan would remain constant members.", "desc_mb_album": "", "desc_mb_artist": "'''Group members over the years'''\r\n\r\n'''First Line Up'''\r\nJeff Lynne, Roy Wood, Bev Bevan, Steve Woolam, Bill Hunt\r\n\r\n'''Second Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Michael De Albuquerque, Wilf Gibson, Colin Walker, Mike Edwards\r\n\r\n'''Third Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Hugh McDowell, Melvyn Gale\r\n\r\n'''Fourth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Louis Clark, Dave Morgan\r\n\r\n'''Fifth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 51, "title": "“Heroes”", "artist": "David Bowie", "year": 1977, "cover": "https://dn721604.ca.archive.org/0/items/mbid-fa48c4d5-6d0a-492d-b91f-4a1f70d274f2/mbid-fa48c4d5-6d0a-492d-b91f-4a1f70d274f2-26856287557.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "1f5ef8d3-10ca-30eb-b41e-85b16987d412", "yt_id": "YLp2cW7ICCU", "rym": "https://rateyourmusic.com/release/album/david-bowie/heroes/reviews/9", "genres": ["experimental rock", "avant-garde", "alternative rock", "art rock", "psychedelic", "art pop"], "desc_lfm_album": "\"Heroes\" is an album by David Bowie, released in 1977. The second installment of his \"Berlin Trilogy\" with Brian Eno (the other releases being \"Low\" and \"Lodger\") \"Heroes\" developed the sound of \"Low\" in a more positive direction. Of the three albums, it was the most befitting of the appellation \"Berlin\", being the only one wholly recorded there. The title track remains one of Bowie's best known, a classic story of two lovers who meet at the Berlin Wall. The album is considered one of his best by critics, notably for the contributions of guitarist Robert Fripp who flew in .", "desc_lfm_artist": "David Robert Jones (8 January 1947 – 10 January 2016), known professionally as David Bowie, was an English singer-songwriter and actor. A leading figure in the music industry, he is regarded as one of the most influential musicians of the 20th century. Bowie was acclaimed by critics and musicians, particularly for his innovative work during the 1970s. His career was marked by reinvention and visual presentation, and his music and stagecraft had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 52, "title": "The Stranger", "artist": "Billy Joel", "year": 1977, "cover": "https://dn710807.ca.archive.org/0/items/mbid-cd0946e3-d1ac-4e2c-87e5-57eafec05e7d/mbid-cd0946e3-d1ac-4e2c-87e5-57eafec05e7d-11232338992.jpg", "aoty_url": "https://www.albumoftheyear.org/album/25593-billy-joel-the-stranger.php", "aoty_critic_score": 87, "aoty_user_score": 88, "mbid": "735bcee6-6be6-3957-af15-d21ba2bd355b", "yt_id": "cJtL8vWNZ4o", "rym": "https://rateyourmusic.com/release/album/billy-joel/the-stranger", "genres": ["pop rock", "progressive pop", "funk rock", "soft rock", "piano rock"], "desc_lfm_album": "The Stranger is the fifth studio album by American singer-songwriter Billy Joel, released on September 29, 1977, by Columbia Records. While his four previous albums had been moderately successful, The Stranger became Joel's true critical and commercial breakthrough, spending six weeks at #2 on the U.S. album charts. Considered his magnum opus, it remains his best-selling non-compilation album to date, and was ranked number 70 on Rolling Stone's list of the 500 greatest albums of all time. .", "desc_lfm_artist": "William Martin Joel (born May 9, 1949) is an American singer, songwriter, and pianist. He is known by the nickname “Piano Man”, derived from his 1973 song of the same name, and has maintained a career as a solo artist since the 1970s. Between 1971 and 1993 he released 12 studio albums in the pop and rock genres, followed by a studio album of classical compositions in 2001. With global record sales exceeding 160 million, he is among the best-selling", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 53, "title": "Aja", "artist": "Steely Dan", "year": 1977, "cover": "https://dn710807.ca.archive.org/0/items/mbid-5e8c8780-2b25-4e43-9d0f-804131132eb6/mbid-5e8c8780-2b25-4e43-9d0f-804131132eb6-9701088050.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9039-steely-dan-aja.php", "aoty_critic_score": 99, "aoty_user_score": 87, "mbid": "8588c5a5-b491-37a4-8d51-2227346a072e", "yt_id": "Cs6GDCs8LMQ", "rym": "https://rateyourmusic.com/release/album/steely-dan/aja", "genres": ["pop rock", "jazz rock", "jazz fusion", "yacht rock"], "desc_lfm_album": "Aja is the sixth studio album by the American jazz rock band Steely Dan, released by ABC Records on September 23, 1977. On the album, band leaders Donald Fagen and Walter Becker pushed Steely Dan further into experimenting with different combinations of session players, enlisting the services of nearly 40 musicians, while pursuing longer, more sophisticated compositions and arrangements. The album peaked at number three on the Billboard Top LPs & Tape chart, and number five on the UK Albums Chart, ultimately becoming Steely Dan's most commercially successful release. It spawned the hit singles \"Peg\", \"Deacon Blues\", and \"Josie\". At .", "desc_lfm_artist": "Steely Dan is an American jazz rock band which formed in 1972. The band was formed by Donald Fagen (vocals, keyboards) and Walter Becker (guitar, bass), who met in 1967 while both attended Bard College in Annandale-on-Hudson, New York, and began a songwriting partnership shortly thereafter.\n\nTheir music is characterized by dark, witty lyrical narratives, obscure lyrical allusions and complex, jazz-influenced instrumentation and chord sequences, overlying more ordinary popular song structures.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere"]}, {"n": 54, "title": "Películas", "artist": "La Máquina de Hacer Pájaros", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/147427-pelculas_171409.jpg", "aoty_url": "https://www.albumoftheyear.org/album/147427-la-maquina-de-hacer-pajaros-pelculas.php", "aoty_critic_score": 87, "aoty_user_score": null, "mbid": "e55fef24-6d3e-3636-a746-e954ef3b0152", "yt_id": "72_P82ICEPg", "rym": "https://rateyourmusic.com/release/album/la-maquina-de-hacer-pajaros/peliculas", "genres": [], "desc_lfm_album": "Películas is the second and final studio album by the Argentine progressive rock band La Máquina de Hacer Pájaros, released in 1977 through the Talent Microfón label. This album exhibits a greater variety in musical ideas, as well as a more bombastic work in the arrangements of the songs compared to the band's previous album, La Máquina de Hacer Pájaros, released in 1976. The graphic art was done by the famous designer Juan Oreste Gatti. In 2007, the Argentine magazine Rolling Stone ranked the album at number 71 on its list of \"The 100 Best Argentine Rock Albums.\" Unlike the .", "desc_lfm_artist": "La Máquina de Hacer Pájaros was a band formed in 1976, in Buenos Aires, Argentina by Charly García after the dissolution of Sui Generis. It was a project which left the folk genre of Sui Generis and moved into symphonic rock territory. In the short life of this band, two LP's were recorded: \"La Máquina de Hacer Pájaros\" (1976) and \"Películas\" (1977).\n\n«In this band I did what I liked», remembers Charly. Inspired by the \"elaborate\" rock of Steely Dan and the Genesis \"symphonism\"", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["verygooood"]}, {"n": 55, "title": "Lust for Life", "artist": "Iggy Pop", "year": 1977, "cover": "https://dn711004.ca.archive.org/0/items/mbid-1683dd66-9bd5-411c-8807-11e4d4f9a3a1/mbid-1683dd66-9bd5-411c-8807-11e4d4f9a3a1-25725487874.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "15dc9ccf-e33b-3f4d-8c81-8346388d0b29", "yt_id": "vYZ-n8L0AaI", "rym": "https://rateyourmusic.com/release/album/iggy-pop/lust-for-life", "genres": ["hard rock", "punk rock", "rock"], "desc_lfm_album": "Lust For Life is the second solo album by American musician Iggy Pop, released on August 29, 1977 by RCA Records. It was his second collaboration with David Bowie after The Idiot, released earlier in the year. The album achieved critical acclaim and became Pop's most commercially successful album to date; it also remains his only gold-certified release in the United Kingdom. The Lust For Life sessions took place soon after the completion of a concert tour in support of The Idiot, the tour ending on 16 April 1977. Pop has stated, \"David and I had determined that we would .", "desc_lfm_artist": "Iggy Pop (born James Newell Osterberg, Jr.; April 21, 1947) is an American singer, songwriter, musician, and actor. Though widely known as an innovator and \"godfather\" of punk rock, Pop's music has encompassed a number of styles over the years, including pop, hard rock, jazz and blues. Pop became known as 'Iggy' in high school, during which time he served as drummer for local blues band The Iguanas. He is vocalist of influential proto-punk band The Stooges (Pop and the other surviving members of the group reunited in 2003)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 56, "title": "A Farewell to Kings", "artist": "Rush", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15831-a-farewell-to-kings_234534.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15831-rush-a-farewell-to-kings.php", "aoty_critic_score": 65, "aoty_user_score": 82, "mbid": "5f27a05d-a12a-3611-a836-f720c9ab00a2", "yt_id": "wAlCJKRMc74", "rym": "https://rateyourmusic.com/release/album/rush/a-farewell-to-kings", "genres": ["classic rock", "hard rock", "progressive rock"], "desc_lfm_album": "A Farewell to Kings is the fifth studio album by Canadian progressive rock band Rush, released in 1977. The album was recorded at Rockfield Studios in Wales and mixed at Advision Studios in London. A Farewell to Kings would become Rush's first US Gold selling album going Gold in almost two months of its release and eventually Platinum. Geddy Lee played his bass lines on acoustic bass while writing them and came up with guitar lines also. The birds heard on \"A Farewell to Kings\" & \"Xanadu\" were recorded outside near Rockfield Studios. Track listing All songs music written by .", "desc_lfm_artist": "Rush is a Canadian rock band formed in Toronto in 1968. The original lineup consisted of guitarist Alex Lifeson, drummer John Rutsey, and bassist and vocalist Jeff Jones, who was soon replaced by Geddy Lee. Over the next six years, the band underwent several lineup changes before establishing its classic power trio with the addition of Neil Peart in July 1974, replacing Rutsey shortly after the release of their self-titled debut album. This lineup of Lifeson, Lee, and Peart remained stable until 2015, when Peart retired from music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 57, "title": "Sunshower", "artist": "大貫妙子 [Taeko Ōnuki]", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/73688-sunshower_233713.jpg", "aoty_url": "https://www.albumoftheyear.org/album/73688--taeko-nuki-sunshower.php", "aoty_critic_score": 94, "aoty_user_score": 82, "mbid": null, "yt_id": "z3PIsTkgXl8", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 58, "title": "I Robot", "artist": "The Alan Parsons Project", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15264-i-robot.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15264-the-alan-parsons-project-i-robot.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "bc5d259c-9323-3721-a346-5d379338eddf", "yt_id": "-lgsCe-fLG4", "rym": "https://rateyourmusic.com/release/album/the-alan-parsons-project/i-robot", "genres": [], "desc_lfm_album": "\"I Robot\" is a progressive rock album recorded by \"The Alan Parsons Project\", engineered by Alan Parsons and Eric Woolfson. It was released by Arista Records in 1977 and re-released on CD in 1984 and 2007. It was intended to be based on the \"I, Robot\" stories written by Isaac Asimov, and actually Woolfson spoke with Asimov, who was enthusiastic about it. But the rights had already been granted to a TV/movie company, so the album's title was altered slightly by removing the comma, and the theme and lyrics were made to be more generically about robots rather than specific .", "desc_lfm_artist": "The Alan Parsons Project was a British rock group active from 1975 until 1990, founded by Alan Parsons and Eric Woolfson both from London, England. The group is based on a number of regular group members such as Stuart Elliot and Ian Bairnson, complemented with varying lead vocals such as Colin Blunstone (the Zombies), Chris Rainbow and Gary Brooker (Procol Harum).  The group is well known for its concept albums, which cover themes such as Edgar Allan Poe, Gaudi, and Freud.", "desc_mb_album": "", "desc_mb_artist": "Please note that '''The Time Machine''', '''On Air''' and '''Try Anything Once''' are not by '''The Alan Parsons Project''', and should be filed under the '''[https://musicbrainz.org/artist/9774cfd1-8862-42bd-919e-156c31f079b4|Alan Parsons]''' artist (the new name of the project after Eric Woolfson's departure).\n\nThe Alan Parsons Project was a studio-only group, and ''never'' performed live. Live recordings should be filed under either '''[https://musicbrainz.org/artist/9774cfd1-8862-42bd-919e-156c31f079b4|Alan Parsons]''' or '''[https://musicbrainz.org/artist/a6b68de3-ba6d-4280-b08f-52fb4fa002af|The Alan Parsons Live Project]'''.\n\nThe Album '''Live in Colombia''' is filed under '''[https://musicbrainz.org/artist/54b81bc2-7634-4e3e-bf9c-68936d4c5668|The Alan Parsons Symphonic Project]'''", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 59, "title": "Exodus", "artist": "Bob Marley & The Wailers", "year": 1977, "cover": "https://dn710908.ca.archive.org/0/items/mbid-41ec6d32-57ca-4e67-803a-2260f957888e/mbid-41ec6d32-57ca-4e67-803a-2260f957888e-4411204473.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18234-bob-marley-and-the-wailers-exodus.php", "aoty_critic_score": 93, "aoty_user_score": 87, "mbid": "c5650313-60f3-34d3-92e4-300545133792", "yt_id": "DHKnxAsHkSI", "rym": "https://rateyourmusic.com/release/album/bob-marley-and-the-wailers/exodus", "genres": ["reggae", "roots reggae"], "desc_lfm_album": "Exodus is the ninth studio album by Jamaican reggae band Bob Marley & The Wailers, released on June 3, 1977 on Island Records. Much of Exodus was recorded in London, while Marley recuperated from an assassination attempt. The success of the album propelled Marley to international stardom. A remastered version of Exodus was released in 2007, in the United Kingdom as a full length book chronicling Bob Marley's retreat into exile after his assassination attempt and the making of the album. \"Jamming,\" \"Waiting in Vain\" and \"One Love/People Get Ready\" were all major international hits. Exodus peaked at #20 on .", "desc_lfm_artist": "Bob Marley and the Wailers (previously known as The Wailers, and prior to that The Wailing Rudeboys, The Wailing Wailers and The Teenagers) were a Jamaican ska, rocksteady and reggae band. The founding members, in 1963, were Bob Marley (Robert Nesta Marley), Peter Tosh (Hubert Winston McIntosh), and Bunny Wailer (Neville Livingston).\n\nDuring 1970 and 1971, Wailer, Marley and Tosh worked with renowned reggae producers Leslie Kong and Lee \"Scratch\" Perry.", "desc_mb_album": "", "desc_mb_artist": "Releases under \"Bob Marley & The Wailers\" belong here, '''no matter the band lineup'''.  \r\n\r\nReleases under \"The Wailing Wailers\", \"The Wailers\", or \"Marley, Tosh, Livingston & Associates\" belong under [http://musicbrainz.org/artist/c9e99d40-4a2c-4ca7-ac5b-e842264ee271.html|\"The Wailing Wailers\"], '''unless''' the track or release was produced by Lee \"Scratch\" Perry, in which case it ought to be listed here, not there.\r\n\r\nReleases by The Wailers Band after Bob Marley's death belong under [http://musicbrainz.org/artist/1e46801d-c27b-4f07-a50d-51597a26df60.html|\"The Wailers Band\"].\r\n\r\nSolo releases by [http://musicbrainz.org/artist/ed2ac1e9-d51d-4eff-a2c2-85e81abd6360.html|Bob Marley], [http://musicbrainz.org/artist/7db6aae5-6644-4513-9bfc-ca2e79d4469c.html|Peter Tosh], or [http://musicbrain", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 60, "title": "The Clash", "artist": "The Clash", "year": 1977, "cover": "https://dn711005.ca.archive.org/0/items/mbid-64d16be8-0039-4c74-86ed-4d16b61ed59b/mbid-64d16be8-0039-4c74-86ed-4d16b61ed59b-5133157385.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4998-the-clash-the-clash.php", "aoty_critic_score": 100, "aoty_user_score": 80, "mbid": "ca91cb5a-7ecc-3c46-84a0-0d4951889374", "yt_id": "GsVjWd1mh4w", "rym": "https://rateyourmusic.com/release/album/the-clash/the-clash", "genres": ["punk", "punk rock", "rock"], "desc_lfm_album": "By January 1977, punk had become a major media phenomenon in the UK. On 25 January 1977, The Clash signed to CBS Records for £100,000, a remarkable amount for a band that had played a total of about thirty gigs and almost none as a headliner. As Clash historian Marcus Gray describes, the \"band members found themselves having to justify to both the music press and to fans who picked up on the critics' muttered asides about The Clash having 'sold out' to the establishment.\"Mark Perry, founder of the leading London punk periodical, Sniffin' Glue, let loose with what he .", "desc_lfm_artist": "The Clash was an English punk band from London, England, active from 1976 to 1985. One of the most successful and iconic bands from the first wave of punk in the 70s, they incorporated rock and roll, reggae, rockabilly, and many other music styles into their repertoire. They were legendary for their uncommonly intense stage performances.\n\nFrom their earliest days as a band, The Clash stood apart from their peers with their musicianship as well as their lyrics", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 61, "title": "The Idiot", "artist": "Iggy Pop", "year": 1977, "cover": "https://ia600205.us.archive.org/21/items/mbid-57d53376-4fc4-3ab9-aeb6-84a632d39f0b/mbid-57d53376-4fc4-3ab9-aeb6-84a632d39f0b-1499126566.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6076-iggy-pop-the-idiot.php", "aoty_critic_score": 92, "aoty_user_score": 82, "mbid": "09c88c6d-090e-378d-b104-7966eb5d33d2", "yt_id": "nU3EyAYg4t4", "rym": "https://rateyourmusic.com/release/album/iggy-pop/the-idiot", "genres": ["art rock", "garage rock", "punk", "punk rock", "new wave"], "desc_lfm_album": "The Idiot is the debut solo album by American rock singer Iggy Pop. It was the first of two LPs released in 1977 which Pop wrote and recorded in collaboration with David Bowie. Although issued after Low, the opening installment of Bowie's so-called \"Berlin trilogy\", the pair began writing and recording songs for The Idiot in mid-1976, before Bowie started work on his own album. As such, The Idiot has been claimed as heralding the unofficial beginning of Bowie's \"Berlin\" period, and is a departure from the hard rock of Pop's former band the Stooges, being compared particularly to Low .", "desc_lfm_artist": "Iggy Pop (born James Newell Osterberg, Jr.; April 21, 1947) is an American singer, songwriter, musician, and actor. Though widely known as an innovator and \"godfather\" of punk rock, Pop's music has encompassed a number of styles over the years, including pop, hard rock, jazz and blues. Pop became known as 'Iggy' in high school, during which time he served as drummer for local blues band The Iguanas. He is vocalist of influential proto-punk band The Stooges (Pop and the other surviving members of the group reunited in 2003)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 62, "title": "TAKANAKA", "artist": "高中正義 [Masayoshi Takanaka]", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/420103-takanaka-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/420103-masayoshi-takanaka-takanaka.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": null, "yt_id": "WAEU9q1kLvk", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 63, "title": "Trans Europa Express", "artist": "Kraftwerk", "year": 1977, "cover": "https://dn710307.ca.archive.org/0/items/mbid-4a8ca762-d78e-39ec-be31-4b37e098db7f/mbid-4a8ca762-d78e-39ec-be31-4b37e098db7f-6280732317.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5786-kraftwerk-trans-europa-express.php", "aoty_critic_score": 94, "aoty_user_score": 81, "mbid": "33101a28-ae05-3a69-873c-684e336fe2df", "yt_id": "Ms6kC-3yq0k", "rym": "https://rateyourmusic.com/release/album/kraftwerk/trans-europa-express-1", "genres": ["electro", "krautrock", "progressive electronic", "experimental electronic", "synth-pop", "electronic"], "desc_lfm_album": "", "desc_lfm_artist": "Kraftwerk (\"power plant\" in English) are an electronic band founded in 1970 in Düsseldorf, Germany. They pioneered electronic music in the 70s and are considered the most important and influential band of their genre, often described as \"the godfathers of electronic music\". Kraftwerk's sound is minimalistic and strictly electronic; it combines driving, repetitive rhythms with catchy melodies and vocals usually sung through a vocoder. The current line-up consists of Ralf Hütter (the only original member)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "alberto_gu"]}, {"n": 64, "title": "Heavy Weather", "artist": "Weather Report", "year": 1977, "cover": "https://ia803100.us.archive.org/11/items/mbid-3a20f3f8-9cd7-42cd-beaf-c270110fd7ea/mbid-3a20f3f8-9cd7-42cd-beaf-c270110fd7ea-6195610317.jpg", "aoty_url": "https://www.albumoftheyear.org/album/48386-weather-report-heavy-weather.php", "aoty_critic_score": 100, "aoty_user_score": 79, "mbid": "f1753c0a-50be-3591-8cbb-6848142e055f", "yt_id": "SvhmaNlLgRM", "rym": null, "genres": ["jazz rock", "jazz", "jazz fusion", "jazz pop", "smooth jazz"], "desc_lfm_album": "Heavy Weather is Weather Report's seventh album, released in 1977 through Columbia Records. It is the band's second album with bassist Jaco Pastorius. On Black Market, Pastorius played on two of the seven tracks, but here he is a full member of the band. Featuring the jazz standard \"Birdland\", the album is one of the best-sellers in the Columbia jazz catalog. Heavy Weather is considered a landmark album in the jazz-rock or fusion movement of the 1970s. Its opening track, \"Birdland\", was a significant commercial success, something not typical of instrumental music. The Birdland melody had been performed live by .", "desc_lfm_artist": "Weather Report was an influential jazz fusion band of the 1970s and 1980s, one of the bands that defined the genre. Their initial style was collectively improvised free jazz with a strong rhythmic pulse and Latin influences; moving into more funk-oriented rhythms. The sound also developed from an acoustic lineup to increasingly synthesised textures as keyboardist Joe Zawinul embraced successive generations of technology.\n\nThe band was founded in", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere"]}, {"n": 65, "title": "Marquee Moon", "artist": "Television", "year": 1977, "cover": "https://dn710801.ca.archive.org/0/items/mbid-89c59339-a55f-4669-b919-c5a6e0e19b51/mbid-89c59339-a55f-4669-b919-c5a6e0e19b51-12342843332.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5657-television-marquee-moon.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "2b9f99d8-becf-3fc3-86a6-2bdd4cef93fe", "yt_id": "puIM6LkKLpI", "rym": "https://rateyourmusic.com/release/album/television/marquee-moon", "genres": ["post-punk", "art punk", "new wave"], "desc_lfm_album": "\"Marquee Moon\" is the debut album by American rock band Television, released in 1977. While often considered a seminal work to come out of the New York punk scene of the late 1970's, the album differs from conventional punk in its clean, textured guitar-based arrangements and extended improvisation. As a result, it is also often cited as important to the development of post-punk and New Wave genres. While critically acclaimed at the time of its release, the album failed to garner commercial success. A german post-punk band named themselves Marquee Moon after this album's name. .", "desc_lfm_artist": "Television was an American proto-punk band formed in New York City in 1973. One of the most creative bands to emerge from New York's CBGB scene of the mid-'70s, creating an influential new guitar vocabulary. While guitarists Tom Verlaine and Richard Lloyd liked to jam, they didn't follow the accepted rock structures for improvisation — they removed the blues while retaining the raw energy of garage rock, adding complex, lyrical solo lines that recalled both jazz and rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 66, "title": "Rumours", "artist": "Fleetwood Mac", "year": 1977, "cover": "https://dn710803.ca.archive.org/0/items/mbid-7699b503-6a69-4920-91ac-8ee8aa1c1622/mbid-7699b503-6a69-4920-91ac-8ee8aa1c1622-7946930592.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5668-fleetwood-mac-rumours.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "416bb5e5-c7d1-3977-8fd7-7c9daf6c2be6", "yt_id": "-uFU79MGj00", "rym": "https://rateyourmusic.com/release/album/fleetwood-mac/rumours", "genres": ["blues rock", "classic rock", "pop rock", "blues", "folk pop", "soft rock"], "desc_lfm_album": "Rumours is the eleventh studio album by British-American rock band Fleetwood Mac. Largely recorded in California during 1976, it was produced by the band with Ken Caillat and Richard Dashut and was released on 4 February 1977 by Warner Bros. Records. The record peaked at the top of both the main United States Billboard chart and the United Kingdom Albums Chart. \"Go Your Own Way\", \"Don't Stop\", \"Dreams\", and \"You Make Loving Fun\" were released as singles. A Grammy Award winner, Rumours is Fleetwood Mac's most successful release with sales of over 40 million copies worldwide, and diamond certifications in .", "desc_lfm_artist": "Fleetwood Mac are a British-American rock band, formed in London in 1967. Fleetwood Mac was founded by guitarist Peter Green, drummer Mick Fleetwood and guitarist Jeremy Spencer, before bassist John McVie joined the lineup for their self-titled debut album. Danny Kirwan joined as a third guitarist in 1968. Keyboardist Christine Perfect (later known as Christine McVie), who contributed as a session musician from the second album, married McVie and joined in 1970.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 67, "title": "Animals", "artist": "Pink Floyd", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5258-animals_000455.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5258-pink-floyd-animals.php", "aoty_critic_score": 69, "aoty_user_score": 91, "mbid": "20c77fb4-1c9f-33c8-9d7e-c4977f11e847", "yt_id": "D4KQae9oMWs", "rym": "https://rateyourmusic.com/release/album/pink-floyd/animals", "genres": [], "desc_lfm_album": "Animals is the tenth studio album by the English rock band Pink Floyd, released on 21 January 1977 through Harvest and Columbia Records. It was self-produced at Pink Floyd's Britannia Row Studios in London throughout 1976. The album continued the longform compositions that made up their previous works, including Wish You Were Here (1975). Animals is a concept album, based on the flaws of capitalism. Various castes in society are represented as different types of animals (Dogs as the businessmen, sheep as the powerless pawns, and pigs as the ruthless leaders). Although this album mainly attacks capitalism, several components are .", "desc_lfm_artist": "Pink Floyd are an English rock band formed in London in 1965 by Syd Barrett (guitar, vocals), Nick Mason (drums), Roger Waters (bass guitar, vocals) and Richard Wright (keyboards, vocals), with David Gilmour (guitar, vocals) joining at the end of 1967. Gaining an early following as one of the first British psychedelic groups, they were distinguished by their extended compositions, sonic experiments, philosophical lyrics, and elaborate live performances, and became a leading progressive rock band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 68, "title": "Low", "artist": "David Bowie", "year": 1977, "cover": "https://dn710805.ca.archive.org/0/items/mbid-83e786b5-d49c-4efd-bd10-57914f2eec9b/mbid-83e786b5-d49c-4efd-bd10-57914f2eec9b-9838985185.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5661-david-bowie-low.php", "aoty_critic_score": 95, "aoty_user_score": 88, "mbid": "f6a51281-56c4-3538-b915-65a9d4eb29b5", "yt_id": "-ekM3ZYgmS8", "rym": "https://rateyourmusic.com/release/album/david-bowie/low", "genres": ["experimental rock", "avant-garde", "alternative rock", "art rock", "krautrock", "art pop"], "desc_lfm_album": "Low is the eleventh studio album by British musician David Bowie, co-produced by Bowie and Tony Visconti. Widely regarded as one of Bowie's most influential releases, Low was the first of the \"Berlin Trilogy\", a series of collaborations with Brian Eno (though the album was mainly recorded in France and only mixed in West Berlin). The experimental, avant-garde style would be further explored on \"Heroes\" and Lodger. The album's working title was New Music Night and Day. The genesis of Low lies in both the foundations laid by Bowie's previous album Station to Station, and music he intended for the .", "desc_lfm_artist": "David Robert Jones (8 January 1947 – 10 January 2016), known professionally as David Bowie, was an English singer-songwriter and actor. A leading figure in the music industry, he is regarded as one of the most influential musicians of the 20th century. Bowie was acclaimed by critics and musicians, particularly for his innovative work during the 1970s. His career was marked by reinvention and visual presentation, and his music and stagecraft had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "verygooood"]}, {"n": 69, "title": "Zombie", "artist": "Fela Kuti & Africa 70", "year": 1977, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6093-zombie_201053.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6093-fela-kuti-africa-70-zombie.php", "aoty_critic_score": 88, "aoty_user_score": 85, "mbid": "d3de5856-816a-4759-bf9c-d5ff0e5cd740", "yt_id": "bsUL2-etPqA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Fela Kuti (born Olufela Olusegun Oludotun Ransome-Kuti;15 October 1938 – 2 August 1997), also known as Fela Anikulapo Kuti or simply Fela, was a Nigerian multi-instrumentalist, musician, composer, pioneer of the Afrobeat music genre, human rights activist, and political maverick.\n\nIn 1969, he toured with his band in Los Angeles and was introduced by a friend to the writings of Black nationalist and Afrocentrist proponents such as Malcolm X and Eldridge Cleaver.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 70, "title": "Oxygène", "artist": "Jean Michel Jarre", "year": 1976, "cover": "https://dn710802.ca.archive.org/0/items/mbid-3ed8b7ee-1f2a-448f-bfb2-dd3a7fb0efb8/mbid-3ed8b7ee-1f2a-448f-bfb2-dd3a7fb0efb8-1242540512.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3055cd07-9b9d-34ed-b227-942ba6977174", "yt_id": "5ab7tIZNplM", "rym": "https://rateyourmusic.com/release/album/jean-michel-jarre/oxygene", "genres": ["new age", "progressive electronic", "experimental electronic", "electronica", "pop", "electronic"], "desc_lfm_album": "Oxygène is the third studio album by French electronic musician and composer Jean-Michel Jarre. It was first released in France in December 1976 by Disques Motors, and distributed internationally in 1977 by Polydor Records. Jarre recorded the album in a makeshift studio that he set up in his apartment in Paris, using a variety of analog and digital synthesizers, and other electronic instruments and effects. French sound engineer Michel Geiss helped Jarre in the purchase, recording and programming of some instruments used on the album. Jarre's musical style was influenced by musique concrète, developed by Pierre Schaeffer. The album was .", "desc_lfm_artist": "Jean-Michel André Jarre (born in 24 August 1948, Lyon) is a French composer, performer and music producer, regarded as a pioneer of electronic music. He is well-known for huge outdoor shows which feature lights, projections, lasers and fireworks.\n\nJarre hold four Guiness World Records for biggest concert audience: Place De La Concorde (1979, 1 mil.), Rendez-Vous Houston (1986, 1.5 mil.), Paris La Defense (1990 2 mil.) and Oxygen in Moscow (1997, 3.", "desc_mb_album": "Recorded at Jean Michel Jarre private studio, mixed at Gang Studio, Paris, Aug-Nov 1976. Cutting at Translab, Paris.\r\n\r\n''First France Issue'':\r\nLabel: Disques Dreyfus - Catalog #: DCO 1000 \r\n\r\n''First European Issue'':\r\nLabel: Polydor - Catalog #: 800015-2 - Barcode: 4228000152\r\nAlso appeared with that same catalog # on the Disques Dreyfus label on an undated disc purchased in Canada\r\n\r\n''Les Annees Laser Issue'':\r\nLabel: Disques Dreyfus - Catalog #: 824 746-2 - Barcode: 4228247462  \r\n\r\n''HMV Numbered Collector's box set with booklet'':\r\nLabel: Polydor - Catalog #: C88 1-3\r\n\r\n''24bit Digital Remaster (France)'':\r\nLabel: Sony / Dreyfus - Catalog #: FDM 36140-2 \r\n\r\n''24bit Digital Remaster (UK)'':\r\nLabel: Epic / Dreyfus - Catalog #: 487 375-2\r\n\r\n''Special Limited Millenium Edition'':\r\nLabel", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 71, "title": "Hejira", "artist": "Joni Mitchell", "year": 1976, "cover": "https://dn710703.ca.archive.org/0/items/mbid-866d4044-7a79-40ff-ba3c-a25dbc42317f/mbid-866d4044-7a79-40ff-ba3c-a25dbc42317f-14268202431.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6088-joni-mitchell-hejira.php", "aoty_critic_score": 85, "aoty_user_score": 88, "mbid": "039f2ae4-36dd-3608-9103-67ce7f6c9288", "yt_id": "i4KBohkaHDE", "rym": "https://rateyourmusic.com/release/album/joni-mitchell/hejira", "genres": ["folk rock", "folk", "jazz", "folk pop", "jazz fusion", "vocal jazz"], "desc_lfm_album": "Hejira is the eighth studio album by Canadian singer-songwriter Joni Mitchell. The songs on the album were written during a series of road trips in 1975 and 1976, and reflect events that occurred during those trips, including several romantic relationships she had at the time. Characterized by lyrically dense, sprawling songs, as well as the overdubbed fretless bass playing of Jaco Pastorius (whom Mitchell had just met), Hejira continued the musician's journey beyond her pop records towards the freer, jazz-inspired music she would implement on later recordings. .", "desc_lfm_artist": "Roberta Joan Mitchell (née Anderson; born November 7, 1943) is a Canadian and American singer-songwriter, multi-instrumentalist, and painter. She gained recognition in the 1960s folk music scene for her personal lyrics and distinctive compositions, which later incorporated elements from various genres including pop, jazz, and rock. Over her career, she has received multiple awards, including eleven Grammy Awards, and was inducted into the Rock and Roll Hall of Fame in 1997.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 72, "title": "A New World Record", "artist": "Electric Light Orchestra", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29643-a-new-world-record_150738.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29643-electric-light-orchestra-a-new-world-record.php", "aoty_critic_score": 73, "aoty_user_score": 84, "mbid": "e3fb6403-71d2-3815-b85a-4f4edb18a556", "yt_id": "L4Qbf9t3gnI", "rym": "https://rateyourmusic.com/release/album/electric-light-orchestra/a-new-world-record", "genres": [], "desc_lfm_album": "A New World Record is the platinum-selling sixth studio album by Electric Light Orchestra (ELO). It was released in September 1976 on United Artists Records in the U.S., and on 19 November 1976 on Jet Records in the United Kingdom. A New World Record marked ELO's shift towards shorter pop songs, a trend which would continue across their career. Their second album to be recorded at Musicland Studios in Munich, the LP proved to be the band's breakthrough in the UK; after their previous three studio recordings failed to chart in their home market, A New World Record became their .", "desc_lfm_artist": "The Electric Light Orchestra, or ELO, was an English symphonic rock band which formed in Birmingham, Warwickshire in 1970. The band was formed by Jeff Lynne (vocals, guitar, multiple instruments), Roy Wood (multiple instruments, vocals), Richard Tandy (keyboards, vocals) and Bev Bevan (drums). Lynne, Wood and Bevan were former members of the psychedelic rock band The Move. The band's lineup would fluctuate throughout its original incarnation, although Lynne, Tandy and Bevan would remain constant members.", "desc_mb_album": "", "desc_mb_artist": "'''Group members over the years'''\r\n\r\n'''First Line Up'''\r\nJeff Lynne, Roy Wood, Bev Bevan, Steve Woolam, Bill Hunt\r\n\r\n'''Second Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Michael De Albuquerque, Wilf Gibson, Colin Walker, Mike Edwards\r\n\r\n'''Third Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Hugh McDowell, Melvyn Gale\r\n\r\n'''Fourth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Louis Clark, Dave Morgan\r\n\r\n'''Fifth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo"]}, {"n": 73, "title": "El jardín de los presentes", "artist": "Invisible", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/108978-el-jardn-de-los-presentes-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/108978-invisible-el-jardin-de-los-presentes.php", "aoty_critic_score": 89, "aoty_user_score": null, "mbid": "d73500e1-5105-3904-bbaf-ec9ae575c93b", "yt_id": "taTJ-jwd2m4", "rym": "https://rateyourmusic.com/release/album/invisible/el-jardin-de-los-presentes", "genres": [], "desc_lfm_album": "\"El jardín de los presentes\" es el tercer y último álbum de estudio de la banda argentina \"Invisible\" en su segunda etapa como cuarteto, integrada por Luis Alberto Spinetta, Machi Rufino, Pomo Lorenzo y Tomás Gubitsch, y el noveno en el que tiene participación decisiva Spinetta. Está considerado como una obra maestra del «Rock nacional» argentino y considerado el #28 entre los 100 mejores álbumes del Rock argentino por la revista Rolling Stone. Fue realizado en los estudios CBS y lanzado a mediados de 1976. El LP fue presentado el 6 de agosto de 1976 con un recital multitudinario para .", "desc_lfm_artist": "Invisible was originally formed in 1973 Buenos Aires, Argentina by Luis Alberto Spinetta (guitars and vocals) who was formerly from the band Pescado Rabioso* that recently broke up at the time. The bass and drums were played by two former Pappo's Blues members Hector Lorenzo (drums) and Carlos Rufino (bass.) During the beginning of the bands playing the music was more straightforward rock with influences of Hendrix and Zeppelin and touches of a Black Sabbath sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 74, "title": "Songs in the Key of Life", "artist": "Stevie Wonder", "year": 1976, "cover": "https://dn721806.ca.archive.org/0/items/mbid-e3a0afcc-79fa-44da-ab29-0da9973eac24/mbid-e3a0afcc-79fa-44da-ab29-0da9973eac24-1673790310.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5600-stevie-wonder-songs-in-the-key-of-life.php", "aoty_critic_score": 100, "aoty_user_score": 94, "mbid": "ea88b09b-fd34-33cf-a3e5-25a3a2fb4c6f", "yt_id": "FGZYWSfiYbM", "rym": "https://rateyourmusic.com/release/album/stevie-wonder/songs-in-the-key-of-life", "genres": ["soul", "r&b", "funk", "smooth soul", "contemporary r&b", "pop soul"], "desc_lfm_album": "Released in the fall of 1976, Songs In The Key Of Life was Stevie Wonder's longest, most ambitious collection of songs, a two-LP (plus accompanying EP) set that -- just as the title promised -- touched on nearly every issue under the sun, and did it all with ambitious (even for him), wide-ranging arrangements and some of the best performances of Wonder's career. The opening \"Love's in Need of Love Today\" and \"Have a Talk with God\" are curiously subdued, but Stevie soon kicks into gear with \"Village Ghetto Land,\" a fierce exposé of ghetto neglect set to a satirical .", "desc_lfm_artist": "Stevie Wonder is the stage name of Stevland Hardaway Morris (b. Stevland Hardaway Judkins, 13 May 1950 in Saginaw, MI, USA - a.k.a. Little Stevie Wonder), a singer, multi-instrumentalist, composer,  record producer and activist.  He débuted, as Little Stevie Wonder, with the single \"I Call It Pretty Music but the Old People Call It the Blues\" (1961, Tamla Motown) and his latest album is \"A Time To Love\" (Oct 2005, Motown)\n\nStevland lost his eyesight shortly after birth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 75, "title": "África Brasil", "artist": "Jorge Ben", "year": 1976, "cover": "https://dn710702.ca.archive.org/0/items/mbid-9d83fb29-d7a6-4d10-8e8e-4c84e34880b6/mbid-9d83fb29-d7a6-4d10-8e8e-4c84e34880b6-11444678062.jpg", "aoty_url": "https://www.albumoftheyear.org/album/57508-jorge-ben-africa-brasil.php", "aoty_critic_score": 88, "aoty_user_score": 83, "mbid": "a5e2f270-c00e-3309-84d1-2c4285565ee3", "yt_id": "Kk3Bci3jVBs", "rym": "https://rateyourmusic.com/release/album/jorge-ben/africa-brasil", "genres": ["mpb", "jazz", "latin", "funk / soul"], "desc_lfm_album": "", "desc_lfm_artist": "Jorge Duílio Lima Menezes (born in Rio de Janeiro, RJ, Brazil, on March 22, 1939), better known as Jorge Ben or Jorge Ben Jor, is a Brazilian multi-instrumentalist, singer, and songwriter. In 2008, Rolling Stone Brazil named him the 5th greatest artist in the history of Brazilian music. He was also included in the magazine’s 2012 list of the 30 Greatest Brazilian Icons of Guitar and Acoustic Guitar.\n\nHis characteristic style includes various elements such as rock", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 76, "title": "Mother Earth's Plantasia", "artist": "Mort Garson", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/39331-mother-earths-plantasia_185936.jpg", "aoty_url": "https://www.albumoftheyear.org/album/39331-mort-garson-mother-earths-plantasia.php", "aoty_critic_score": 82, "aoty_user_score": 83, "mbid": "c062737f-a5af-4119-84a6-d8b105801f75", "yt_id": "dRXLYnwKL8c", "rym": "https://rateyourmusic.com/release/album/mort-garson/mother-earths-plantasia/", "genres": [], "desc_lfm_album": "Mother Earth's Plantasia is an electronic album by Mort Garson first released in 1976. The music on it was composed specifically for plants to listen to. The album had a very limited distribution upon release, only being available to people who bought a houseplant from a store called Mother Earth in Los Angeles or those who purchased a Simmons mattress from a Sears outlet, both of which came with the record. As a result, the album failed to attain widespread popularity around the time of its release. However, it has since gained a cult following as an early work of .", "desc_lfm_artist": "Morton Sanford Garson (20 July 1924 – 4 January 2008) was a Canadian composer, arranger, songwriter, and pioneer of electronic music. \n\nHe is best known for his albums in the 1960s and 1970s, such as Mother Earth's Plantasia (1976). He also co-wrote several hit songs, including \"Our Day Will Come\", a hit for Ruby & the Romantics. According to Allmusic, Mort Garson boasts one of the most distinctive and outright bizarre resumés in popular music, spanning from easy listening to occult-influenced space-age electronic pop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 77, "title": "Boston", "artist": "Boston", "year": 1976, "cover": "https://dn710607.ca.archive.org/0/items/mbid-094224c6-c99f-4195-86bd-624ca0d438fd/mbid-094224c6-c99f-4195-86bd-624ca0d438fd-9479501382.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19633-boston-boston.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "f0371fc4-3e22-3d8d-8ce3-4af873ea6f1c", "yt_id": "UVsBpiq8CVQ", "rym": "https://rateyourmusic.com/release/album/boston/boston", "genres": ["hard rock", "arena rock", "aor"], "desc_lfm_album": "Boston is the debut studio album by American rock band Boston. Produced by Tom Scholz and John Boylan, the album was released on August 25, 1976, in the United States by Epic Records catalog 32038. Scholz had studied classical piano in his childhood and became involved in the Boston music scene in the late 1960s. He subsequently started to concentrate on demos recorded in his apartment basement with singer Brad Delp, and although their previous group, Mother's Milk, had received numerous rejection letters from major record labels in the early 1970s, by 1975, the demo tape had fallen into the .", "desc_lfm_artist": "Boston is an American rock band formed in 1975 in Boston, Massachusetts, by songwriter and composer Tom Scholz. The band’s core members included multi-instrumentalist Scholz and lead vocalist Brad Delp, who were the only constant members from 1975 to 1990 and again from 1994 until Delp’s death in 2007. Other musicians have participated at various times throughout the band’s history.\n\nBoston experienced significant commercial success during the 1970s and 1980s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 78, "title": "The Modern Lovers", "artist": "The Modern Lovers", "year": 1976, "cover": "https://dn721808.ca.archive.org/0/items/mbid-4071d957-1ac3-3f35-9437-c06d364ea8a3/mbid-4071d957-1ac3-3f35-9437-c06d364ea8a3-9417504826.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5757-the-modern-lovers-the-modern-lovers.php", "aoty_critic_score": 100, "aoty_user_score": 80, "mbid": "91e1f88a-f081-3639-9972-0d46b3d3b616", "yt_id": "Y0LesdhYkkQ", "rym": "https://rateyourmusic.com/release/album/the-modern-lovers/the-modern-lovers", "genres": ["rock and roll", "art rock", "garage rock", "proto-punk", "punk", "indie rock"], "desc_lfm_album": "The Modern Lovers is the debut studio album by American rock band the Modern Lovers. It was released on Beserkley Records in 1976, although the original nine tracks had been recorded in 1972 (or 1971 in the case of \"Hospital\"). Six of the original tracks were produced by John Cale. In 2003, the album was ranked number 381 on Rolling Stone magazine's list of the 500 greatest albums of all time, and 382 in 2012. .", "desc_lfm_artist": "The Modern Lovers was an American rock band led by Jonathan Richman in the 1970s and 1980s.\n\nThe original band, billed simply as \"The Modern Lovers\", existed from 1970–74 but their recordings were not released until 1976 or later. It featured Jonathan Richman and bassist Ernie Brooks with drummer David Robinson (later of The Cars) and keyboardist Jerry Harrison (later of Talking Heads). The sound of the band owed a great deal to the influence of The Velvet Underground, and is now considered one of the leading bands of the \"proto-punk\" scene.", "desc_mb_album": "", "desc_mb_artist": "Before adding a The Modern Lovers entry, please check that it's not already in the database under [http://musicbrainz.org/artist/bae34b81-9abd-416e-a720-fedc359df775|Jonathan Richman] or [http://musicbrainz.org/artist/8a5dff84-c79f-4898-9e15-e100c53ebb58|Jonathan Richman & The Modern Lovers].", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 79, "title": "SEYCHELLES", "artist": "高中正義 [Masayoshi Takanaka]", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/349109-seychelles_165537.jpg", "aoty_url": "https://www.albumoftheyear.org/album/349109-masayoshi-takanaka-seychelles.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": null, "yt_id": "FQQ4J4wr0Vk", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "Rocky_stereo", "verygooood"]}, {"n": 80, "title": "Alucinação", "artist": "Belchior", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/75630-alucinacao_213220.jpg", "aoty_url": "https://www.albumoftheyear.org/album/75630-belchior-alucinacao.php", "aoty_critic_score": 87, "aoty_user_score": null, "mbid": "b93dc0cd-bbc3-41ef-8c7a-830c18f9d073", "yt_id": "S0B2KPXMgZc", "rym": "https://rateyourmusic.com/release/album/belchior/alucinacao", "genres": [], "desc_lfm_album": "Alucinação é o segundo álbum de estúdio do cantor e compositor brasileiro Belchior, lançado em 1976 pela gravadora PolyGram, através do selo Philips (atual Universal Music). Conta com sucessos que consagraram o cantor, como \"Apenas um Rapaz Latino-Americano\", \"Como Nossos Pais\" e \"Velha Roupa Colorida\". Graças a esses hits, o álbum vendeu trinta mil cópias em apenas um mês. No total, o álbum vendeu mais de quinhentos mil, cópias, consagrando-o como um ídolo de massa .", "desc_lfm_artist": "Belchior (born Antônio Carlos Gomes Belchior Fontenelle Fernandes, Sobral, Ceará, Brazil, October 26, 1946, died April 30, 2017 at age 70) was a Brazilian singer and composer. He was one of the first MPB singer-songwriters from the Brazilian Northeast to reach mainstream success, in the early 1970s. His songs were recorded by many well known artists, specially Elis Regina, Engenheiros do Hawaii, Ney Matogrosso and Jair Rodrigues.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 81, "title": "Rising", "artist": "Rainbow", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/40815-rising_121920.jpg", "aoty_url": "https://www.albumoftheyear.org/album/40815-rainbow-rising.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "66576223-2647-37df-b6c2-746fc35c1a41", "yt_id": "FrJ0OCITw6g", "rym": "https://rateyourmusic.com/release/album/rainbow/rising", "genres": [], "desc_lfm_album": "\"Rising\" is a hard rock album by Rainbow, released in 1976. Rising has become known as the best album of Rainbow's career. With founder Ritchie Blackmore retaining only Ronnie James Dio from the previous album, he recruited keyboard player Tony Carey, bassist Jimmy Bain and drummer Cozy Powell to complete the new line-up. Recorded in Munich in less than a month, the album was overseen by \"Deep Purple\" engineer and rock producer Martin Birch. The album marks Dio's first work with bassist Jimmy Bain. Bain would later play bass in Dio's solo band. The album showpiece is the 8 minute .", "desc_lfm_artist": "1. A British rock band.\n2. A U.S. psychedelic rock band.\n3. A K-pop girl group. (other tags include 레인보우)\n\n1. Rainbow was a British rock band formed by Deep Purple founder and former guitarist Ritchie Blackmore in 1975. In addition to Blackmore, the band originally consisted of former Elf lead singer Ronnie James Dio, bassist Craig Gruber, drummer Gary Driscoll, and keyboardist Micky Lee Soule. Over the years, Rainbow went through many lineup changes.", "desc_mb_album": "", "desc_mb_artist": "Rainbow formed in 1974 and disbanded in 1984 (when Deep Purple reformed). They reformed in the mid 1990s.", "heard_by": ["Lonsonxd", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 82, "title": "The Royal Scam", "artist": "Steely Dan", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12545-the-royal-scam_144828.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12545-steely-dan-the-royal-scam.php", "aoty_critic_score": 86, "aoty_user_score": 85, "mbid": "586013b7-6cb0-39d4-b3cc-702b665fd830", "yt_id": "ZFKyi2BWyC4", "rym": "https://rateyourmusic.com/release/album/steely-dan/the-royal-scam", "genres": [], "desc_lfm_album": "The Royal Scam is an album by Steely Dan, originally released in 1976. The album went gold and peaked at #15 on the charts. The Royal Scam features more prominent guitar work than other Steely Dan albums. Guitarists on the recording include Walter Becker, Denny Dias, Larry Carlton, Elliott Randall and Dean Parks. With irony-laden verses about drug dealers, safe sex, and hardships faced by immigrants, The Royal Scam is arguably Steely Dan at their most cynical. The mood of the album stands in contrast with the band's mellower and hugely successful follow-up, Aja. The album cover, which shows a .", "desc_lfm_artist": "Steely Dan is an American jazz rock band which formed in 1972. The band was formed by Donald Fagen (vocals, keyboards) and Walter Becker (guitar, bass), who met in 1967 while both attended Bard College in Annandale-on-Hudson, New York, and began a songwriting partnership shortly thereafter.\n\nTheir music is characterized by dark, witty lyrical narratives, obscure lyrical allusions and complex, jazz-influenced instrumentation and chord sequences, overlying more ordinary popular song structures.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Rocky_stereo", "armandwave"]}, {"n": 83, "title": "Cartola", "artist": "Cartola", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/67400-cartola_234027.jpg", "aoty_url": "https://www.albumoftheyear.org/album/67400-cartola-cartola.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "4a58c393-a455-3aa9-8bc1-6641f9873dd9", "yt_id": "CDdvqnRrVdQ", "rym": "https://rateyourmusic.com/release/album/cartola/cartola-1", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Angenor de Oliveira, known as Cartola (it is Portuguese for 'top hat'), (October 11, 1908 – November 30, 1980) was born in Rio de Janeiro, in a neighborhood called Catete. He got his nickname because of the bowler hat he wore to keep the cement from ruining his hair while working at construction sites.\n\nHe was one of the samba composers and founders of the Estação Primeira de Mangueira, and has credit for both the name of the school and its colors: green and pink. Cartola composed, alone and alongside others, more than 500 songs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 84, "title": "Jailbreak", "artist": "Thin Lizzy", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12544-jailbreak.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12544-thin-lizzy-jailbreak.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "d55dae0d-835d-3756-8805-196e41bacc2f", "yt_id": "soNA79Xp7eQ", "rym": "https://rateyourmusic.com/release/album/thin-lizzy/jailbreak", "genres": [], "desc_lfm_album": "Jailbreak is the sixth studio album by Irish hard rock band Thin Lizzy, released in 1976. This album proved to be Thin Lizzy's commercial breakthrough in the U.S. The singles include \"Jailbreak\" and \"The Boys Are Back in Town\", the latter being Thin Lizzy's biggest hit. The band originally wanted to release the more pop-oriented \"Running Back\" as the first single, which may account for the song's accessible arrangement and production. On the 1996 Mercury CD reissue (#314 532 294-2), \"Angel from the Coast\" and \"Running Back\" are listed as the second track with only one running time, making it .", "desc_lfm_artist": "Thin Lizzy is an Irish rock band formed in Dublin in 1969. The original lineup included bassist, lead vocalist, and principal songwriter Phil Lynott, drummer Brian Downey, guitarist Eric Bell, and organist Eric Wrixon, although Wrixon left after a few months. Bell departed at the end of 1973, and was briefly replaced by Gary Moore, who was himself replaced in mid-1974 by twin lead guitarists Scott Gorham, who remained with the band until their breakup in 1983, and Brian Robertson, who stayed until 1978 when Moore rejoined.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 85, "title": "I Want You", "artist": "Marvin Gaye", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/17745-i-want-you_102312.jpg", "aoty_url": "https://www.albumoftheyear.org/album/17745-marvin-gaye-i-want-you.php", "aoty_critic_score": 75, "aoty_user_score": 85, "mbid": "18257379-85bf-3412-b0df-8e2916ee896e", "yt_id": "gjRLbzxz_3Y", "rym": "https://rateyourmusic.com/release/album/marvin-gaye/i-want-you", "genres": [], "desc_lfm_album": "I Want You, while it was a Top Ten smash for Marvin Gaye in 1976, is not as generally well-known as its predecessors for a number of reasons. First, it marked a sharp change in direction, leaving his trademark Motown soul for lush, funky, light disco. Secondly, its subject matter is as close to explicit as pop records got in 1976. Third, Gaye hadn't recorded in nearly three years and critics were onto something else — exactly what is now anybody's guess. From the amazing Ernie Barnes cover painting \"Back to Sugar Shack\" to the Coleridge-Taylor Perkinson string and horn .", "desc_lfm_artist": "Marvin Pentz Gaye, Jr. (2 April 1939 - 1 April 1984) was an American soul and rnb singer, songwriter, producer, and multi-instrumentalist, known as \"The Prince of Soul\", or \"The Prince of Motown.\" Originally a member of the doo-wop group The Moonglows, he pursued a solo career after the group disbanded and released many successful solo hits including \"I Heard It Through the Grapevine\", \"Let's Get It On\" and  \"What's Going On\". His best albums are still held in extremely high regard, and he is often cited as one of the finest singers of his era.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 86, "title": "2112", "artist": "Rush", "year": 1976, "cover": "https://ia803407.us.archive.org/8/items/mbid-fbd1d18d-79f3-4570-8e20-45f65beb4641/mbid-fbd1d18d-79f3-4570-8e20-45f65beb4641-28627341016.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12949-rush-2112.php", "aoty_critic_score": 75, "aoty_user_score": 81, "mbid": "9243ac59-9390-37e1-abee-fcf31fb8035f", "yt_id": "kEuja6lwGrI", "rym": "https://rateyourmusic.com/release/album/rush/2112", "genres": ["classic rock", "hard rock", "progressive rock", "rock opera"], "desc_lfm_album": "2112 (\"Twenty-One Twelve\") is the fourth studio album by Canadian progressive rock band Rush, released in 1976. The Toronto dates of the 2112 tour were recorded and released as All The World's a Stage in September 1976. In 2006 a poll of Planet Rock listeners picked 2112 as the definitive Rush album. The album 2112 features an eponymous seven-part suite written by Geddy Lee and Alex Lifeson, with lyrics written by Neil Peart. The suite tells a dystopian story set in the year 2112. Since the album is named after the suite it is mistakenly thought of as a concept .", "desc_lfm_artist": "Rush is a Canadian rock band formed in Toronto in 1968. The original lineup consisted of guitarist Alex Lifeson, drummer John Rutsey, and bassist and vocalist Jeff Jones, who was soon replaced by Geddy Lee. Over the next six years, the band underwent several lineup changes before establishing its classic power trio with the addition of Neil Peart in July 1974, replacing Rutsey shortly after the release of their self-titled debut album. This lineup of Lifeson, Lee, and Peart remained stable until 2015, when Peart retired from music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 87, "title": "A Trick of the Tail", "artist": "Genesis", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9172-a-trick-of-the-tail-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9172-genesis-a-trick-of-the-tail.php", "aoty_critic_score": 78, "aoty_user_score": 81, "mbid": "adcc32d7-cb30-3201-84fa-488e35c9c9ed", "yt_id": "peTleKETTLs", "rym": "https://rateyourmusic.com/release/album/genesis/a-trick-of-the-tail", "genres": [], "desc_lfm_album": "A Trick of the Tail was the seventh studio album by the progressive rock band Genesis and the first to feature Phil Collins as full-time lead vocalist following the departure of original vocalist Peter Gabriel. It was released in February 1976. After Peter Gabriel left Genesis, the remaining members held auditions for a permanent lead singer, although some members (most notably Banks) considered continuing as an instrumental act, while most songs were written without knowledge as to how they would be sung. Initially, Phil Collins did not wish to take over from Gabriel, instead teaching the potential lead singers the .", "desc_lfm_artist": "There are at least three bands using the moniker Genesis;\n\n1) Genesis was an English rock band formed at Charterhouse School, Godalming, Surrey, in 1967. The band's longest-existing and most commercially successful line-up consisted of keyboardist Tony Banks, bassist/guitarist Mike Rutherford and drummer/singer Phil Collins. In the 1970s, during which the band also included singer Peter Gabriel and guitarist Steve Hackett, Genesis were among the pioneers of progressive rock. Banks and Rutherford were the only constant members of the group.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84"]}, {"n": 88, "title": "Station to Station", "artist": "David Bowie", "year": 1976, "cover": "https://dn711203.ca.archive.org/0/items/mbid-6cd16d0d-4269-4cd2-ac9a-067d746d5c94/mbid-6cd16d0d-4269-4cd2-ac9a-067d746d5c94-5086932734.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5660-david-bowie-station-to-station.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "686cdbd1-b400-32d8-8cb8-9317a2e41a58", "yt_id": "ZpIhsGg2SJ0", "rym": "https://rateyourmusic.com/release/album/david-bowie/station-to-station", "genres": ["alternative rock", "blue-eyed soul", "art rock", "pop rock", "funk rock"], "desc_lfm_album": "\"Station to Station\" is the tenth studio album by English musician David Bowie, released by record label RCA in 1976. Commonly regarded as one of his most significant works, \"Station to Station\" is also notable as the vehicle for Bowie's last great 'character', The Thin White Duke. The album was recorded after he completed shooting Nicolas Roeg's \"The Man Who Fell to Earth\", and the cover featured a still from the movie. During the sessions Bowie was heavily dependent on drugs, especially cocaine, and recalls almost nothing of the production. Musically, \"Station to Station\" was a transitional album for Bowie, .", "desc_lfm_artist": "David Robert Jones (8 January 1947 – 10 January 2016), known professionally as David Bowie, was an English singer-songwriter and actor. A leading figure in the music industry, he is regarded as one of the most influential musicians of the 20th century. Bowie was acclaimed by critics and musicians, particularly for his innovative work during the 1970s. His career was marked by reinvention and visual presentation, and his music and stagecraft had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 89, "title": "Desire", "artist": "Bob Dylan", "year": 1976, "cover": "https://dn711302.ca.archive.org/0/items/mbid-53e4761d-024a-415f-833c-01b47e11c8c3/mbid-53e4761d-024a-415f-833c-01b47e11c8c3-11781535870.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5687-bob-dylan-desire.php", "aoty_critic_score": 86, "aoty_user_score": 84, "mbid": "fc325dd3-73ed-36aa-9c77-6b65a958e3cf", "yt_id": "6O7rngh2LCo", "rym": "https://rateyourmusic.com/release/album/bob-dylan/desire", "genres": ["blues rock", "folk rock", "folk", "country rock", "classic rock", "contemporary folk"], "desc_lfm_album": "Desire is singer-songwriter Bob Dylan's 17th studio album, released by Columbia Records in 1976. It is one of Dylan's most collaborative efforts, featuring the same caravan of musicians from the acclaimed Rolling Thunder Revue tours the previous year (later documented on The Bootleg Series Vol. 5). Most of the album was co-written by Jacques Levy, and is composed of lengthy story-songs, two of which quickly generated controversy: the over 11-minute long \"Joey\", which is seen as glorifying the violent gangster Joey Gallo, and \"Hurricane\", the opening track that tells a passionate account of the murder case against boxer Rubin Carter, .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "Part of the SACD Limited edition hybrid set with these discs:\r\n[http://musicbrainz.org/release/67e7ab93-d5c1-442f-b8c0-dbfad52e2d34.html|Bringing It All Back Home] | [http://musicbrainz.org/release/ee7f79c0-f52b-45e5-800e-daa8e1d69144.html|Blood on the Tracks] |[http://musicbrainz.org/release/c96d6546-25e4-4717-b514-62684245675f.html|Blonde on Blonde (disc 1)] |[http://musicbrainz.org/release/2b259ee4-06b0-4dbb-a248-be983aee6fbd.html|Blonde on Blonde (disc 2)] |[http://musicbrainz.org/release/ec4cf6e4-4e24-49b8-9fd6-fad64393e3e5.html|Another Side of Bob Dylan] | Desire |[http://musicbrainz.org/release/d61a2bd9-81ac-4023-bd22-1c884d4a176c.html|Highway 61 Revisited] |[http://musicbrainz.org/release/54a02da4-84ea-49b9-bc95-ec7476af7100.html|Infidels] |[http://musicbrainz.org/release/050fec95-", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 90, "title": "Scenery", "artist": "福居良 [Ryo Fukui]", "year": 1976, "cover": "https://cdn2.albumoftheyear.org/600x0/album/60518-scenery_013708.jpg", "aoty_url": "https://www.albumoftheyear.org/album/60518--ryo-fukui-scenery.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": null, "yt_id": "wdDkBIeZwZc", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["verygooood"]}, {"n": 91, "title": "Mothership Connection", "artist": "Parliament", "year": 1976, "cover": "https://dn710809.ca.archive.org/0/items/mbid-84bd98a9-017d-30eb-b557-d075957d802f/mbid-84bd98a9-017d-30eb-b557-d075957d802f-5544741092.png", "aoty_url": "https://www.albumoftheyear.org/album/14208-parliament-mothership-connection.php", "aoty_critic_score": 100, "aoty_user_score": 83, "mbid": "cb69bfc6-a15c-34cd-b1af-76b6481bf09a", "yt_id": "jjQ4iYh039g", "rym": "https://rateyourmusic.com/release/album/parliament/mothership-connection", "genres": ["psychedelic soul", "funk", "p-funk"], "desc_lfm_album": "Mothership Connection is the fourth album by American funk band Parliament, released in 1975. This concept album of P Funk mythology is usually rated as one of Parliament's best. Mothership Connection was the first P-funk album to feature Maceo Parker and Fred Wesley, who had left The J.B.'s, James Brown's backing band. \"Mothership Connection\" became Parliament's first album to be certified gold and later platinum. .", "desc_lfm_artist": "Parliament is an American funk band formed in 1968 in Plainfield, New Jersey by George Clinton as part of his Parliament-Funkadelic collective. Less rock-oriented than its sister act Funkadelic, Parliament drew on science-fiction and outlandish performances in their work. The band scored a number of Top 10 hits, including the million-selling 1976 single \"Give Up the Funk (Tear the Roof off the Sucker)\", and Top 40 albums such as Mothership Connection (1975).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 92, "title": "A Night at the Opera", "artist": "Queen", "year": 1975, "cover": "https://dn710805.ca.archive.org/0/items/mbid-90d2e40a-eee0-4290-aa0a-a5ae3683ea2f/mbid-90d2e40a-eee0-4290-aa0a-a5ae3683ea2f-2812830852.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7738-queen-a-night-at-the-opera.php", "aoty_critic_score": 87, "aoty_user_score": 80, "mbid": "6b47c9a0-b9e1-3df9-a5e8-50a6ce0dbdbd", "yt_id": "81t8mi5i0X0", "rym": "https://rateyourmusic.com/release/album/queen/a-night-at-the-opera", "genres": ["art rock", "classic rock", "hard rock", "baroque pop", "progressive rock", "glam rock"], "desc_lfm_album": "A Night at the Opera is a 1975 album by English rock band Queen. It was produced by Roy Thomas Baker and Queen, and reportedly was, at the time of its release, the most expensive album ever made. It was originally released by EMI in the UK where it topped the charts for nine weeks, a record at the time, and Elektra Records in the United States where the album peaked at #4 and has been certified Triple Platinum (three million copies sold). The album takes its name from the Marx Brothers film of the same name, which the band .", "desc_lfm_artist": "Queen are a British rock band formed in London in 1970 by Freddie Mercury (lead vocals, piano), Brian May (guitar, vocals), and Roger Taylor (drums, vocals), later joined by John Deacon (bass). Their earliest works were influenced by progressive rock, hard rock, and heavy metal, but the band gradually ventured into more conventional and radio-friendly styles by incorporating elements of arena rock and pop rock.\n\nBefore forming Queen, May and Taylor had played together in the band Smile.", "desc_mb_album": "", "desc_mb_artist": "'''Note:''' Please add any 2011 Remaster releases to either ''Universal Island Records'' or ''Hollywood Records'' and '''not''' '''''Island Records'''''. Any previously added releases which fall under this category should be edited.\n----\nSee also [artist:9dcffd99-eca6-4a09-8dbd-c6c4ed2f20fd|Queen + Paul Rodgers] and [artist:7e07a487-5438-4128-b2d0-f0f18ac08384|Queen + Adam Lambert] for releases from Brian May and Roger Taylor collaborating with other singers.", "heard_by": ["Lonsonxd", "armandwave", "verygooood"]}, {"n": 93, "title": "Another Green World", "artist": "Eno", "year": 1975, "cover": "https://dn710203.ca.archive.org/0/items/mbid-47e5f695-0704-44fe-a803-b6de96523d5b/mbid-47e5f695-0704-44fe-a803-b6de96523d5b-30382229179.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "7d5a684e-73a3-325c-a59c-34c9a941d8d6", "yt_id": "bNwhtnaoVZU", "rym": "https://rateyourmusic.com/release/album/eno/another-green-world/reviews/14", "genres": ["art rock"], "desc_lfm_album": "", "desc_lfm_artist": "'Eno'
