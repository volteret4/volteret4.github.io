album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 139, "title": "Artaud", "artist": "Pescado Rabioso", "year": 1973, "cover": "https://cdn2.albumoftheyear.org/600x0/album/67407-artaud_204016.jpg", "aoty_url": "https://www.albumoftheyear.org/album/67407-pescado-rabioso-artaud.php", "aoty_critic_score": 87, "aoty_user_score": null, "mbid": "8e50433a-c1d5-3019-a48d-0d6b97a5f32b", "yt_id": "LXYZQTt-Kuo", "rym": "https://rateyourmusic.com/release/album/pescado-rabioso/artaud", "genres": [], "desc_lfm_album": "Artaud is the third full-length album by Pescado Rabioso. The title makes reference of the French poet Antonin Artaud. Although Artaud was officially billed as the third Pescado Rabioso album, the Argentinean group had actually broken up by the time it was recorded. It’s essentially a solo effort by singer-guitarist-songwriter Luis Alberto Spinetta, with contributions from his brother, drummer Carlos Gustavo Spinetta, bassist Emilio Del Guercio, and drummer Rodolfo García, the latter two of whom had played with Spinetta back in the pre-Pescado Rabioso band Almendra. This album is considered the best in the history of Argentinian rock. Engineered at: .", "desc_lfm_artist": "Pescado Rabioso was a psychedelic rock band from Buenos Aires, Argentina, formed by musician Luis Alberto Spinetta, from 1971 to 1973, right after the breakup of his previous band Almendra. The band also consisted originally of Black Amaya, Osvaldo Frascino. Carlos Cutaia then joined in and David Lebón replaced Frascino. Despite its short life, Pescado Rabioso is still considered an important piece of Argentine rock history, mainly because of \"Artaud\", a masterpiece album featuring only Spinetta compositions.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 140, "title": "Faust IV", "artist": "Faust", "year": 1973, "cover": "https://dn710609.ca.archive.org/0/items/mbid-c07effcc-b1ed-4b19-8664-6e142f05c4b4/mbid-c07effcc-b1ed-4b19-8664-6e142f05c4b4-5714005311.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6317-faust-faust-iv.php", "aoty_critic_score": 91, "aoty_user_score": 81, "mbid": "75ec1e72-cc7d-37b6-bebd-a1131b578e7b", "yt_id": "m5-_c2VFxhQ", "rym": "https://rateyourmusic.com/release/album/faust/faust-iv/", "genres": ["krautrock"], "desc_lfm_album": "Faust IV is a 1973 album by the German krautrock group Faust. The album is included in the book 1001 Albums You Must Hear Before You Die, where it is referred to as a \"krautrock classic\". The band did not release another album for 20 years, and with a different lineup. The album was recorded at the Manor Studio in England. As the sessions took too long to complete, producer Uwe Nettelbeck opted to complete the album with material that was recorded at previous sessions in Wümme, Germany. These additions include \"Krautrock\" (previously aired on the John Peel show) and .", "desc_lfm_artist": "Several bands are called Faust (German for \"Fist\"):\n\nFaust is a German krautrock band, originally composed of Werner \"Zappi\" Diermaier, Hans Joachim Irmler, Arnulf Meifert, Jean-Hervé Péron, Rudolf Sosna and Gunter Wüsthoff, working with producer Uwe Nettelbeck and engineer Kurt Graupner. The group formed in Wümme, Germany in 1971 and soon began recording their debut, \"Faust\", which sold poorly, but established a devoted fanbase. With a series of early 1970s releases", "desc_mb_album": "On almost all editions, some tracks are mistitled on the sleeves!\r\n\r\n#6 \"Giggy Smile\" is really \"Läuft … Heißt das es läuft oder es kommt bald … Läuft\" (4:28)\r\n#7 \"Läuft …\" is really \"Run\" (3:40)\r\n#8 is \"It's a bit of a pain\"\r\n\r\nSee also: http://www.faust-pages.com/records/faustiv.html#Tracks", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 141, "title": "Over-Nite Sensation", "artist": "The Mothers of Invention", "year": 1973, "cover": "https://cdn2.albumoftheyear.org/600x0/album/36228-over-nite-sensation-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/36228-the-mothers-of-invention-over-nite-sensation.php", "aoty_critic_score": 73, "aoty_user_score": 81, "mbid": "d4b98ec7-a4af-37e2-ac83-2f7122d23b36", "yt_id": "VjBDKELNN3U", "rym": "https://rateyourmusic.com/release/album/the-mothers/over-nite-sensation", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Mothers of Invention was an American band active from 1966 to 1969. Throughout, their output was primarily directed by composer and guitarist, Frank Zappa (1940–1993). Their albums combined a broad span of genres and utilised diverse instrumentation. Their lyrics were generally humorous, with frequent style-parodies of contemporary Pop music (with doo-wop love ballads endlessly lampooned), bountiful surreal imagery, cartoonish vocals and oblique, satirical protest songs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 142, "title": "Let’s Get It On", "artist": "Marvin Gaye", "year": 1973, "cover": "https://dn710005.ca.archive.org/0/items/mbid-584a5090-cb03-31af-b3eb-c0750b84692d/mbid-584a5090-cb03-31af-b3eb-c0750b84692d-4516515462.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7510-marvin-gaye-lets-get-it-on.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "120c822e-3cd2-3652-975c-d687256a7931", "yt_id": "8nvii7LWFtg", "rym": "https://rateyourmusic.com/release/album/marvin-gaye/lets-get-it-on", "genres": ["blues", "soul", "r&b", "pop soul", "motown", "quiet storm"], "desc_lfm_album": "", "desc_lfm_artist": "Marvin Pentz Gaye, Jr. (2 April 1939 - 1 April 1984) was an American soul and rnb singer, songwriter, producer, and multi-instrumentalist, known as \"The Prince of Soul\", or \"The Prince of Motown.\" Originally a member of the doo-wop group The Moonglows, he pursued a solo career after the group disbanded and released many successful solo hits including \"I Heard It Through the Grapevine\", \"Let's Get It On\" and  \"What's Going On\". His best albums are still held in extremely high regard, and he is often cited as one of the finest singers of his era.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave", "paqueradejere"]}, {"n": 143, "title": "(pronounced ’lĕh-’nérd ’skin-’nérd)", "artist": "Lynyrd Skynyrd", "year": 1973, "cover": "https://ia601206.us.archive.org/29/items/mbid-5941cba2-4dbe-4a42-881a-6765286b4240/mbid-5941cba2-4dbe-4a42-881a-6765286b4240-5897896718.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "33446893-8c9f-30b6-aa73-d719df371430", "yt_id": "9ER6P8RgZK4", "rym": null, "genres": ["blues rock", "classic rock", "hard rock", "southern rock", "arena rock", "boogie rock"], "desc_lfm_album": "", "desc_lfm_artist": "Lynyrd Skynyrd (pronounced /ˌlɛnərd ˈskɪnərd/ LEN-ərd-SKIN-ərd) is a Southern Rock band, formed in Jacksonville, Florida, USA in 1964. The band became prominent in the Southern United States in 1973, and rose to worldwide recognition before three members and one road crew member died in an airplane crash in 1977. The band reformed in 1987 for a reunion tour with lead singer Ronnie Van Zant's younger brother Johnny as the frontman. Lynyrd Skynyrd continues to tour and record.", "desc_mb_album": "", "desc_mb_artist": "Lynyrd Skynyrd is an American Southern rock band, described by All Music Guide's Stephen Thomas Erlewine as \"the definitive Southern rock band, fusing the overdriven power of blues-rock with a rebellious, Southern image and a hard rock swagger.\"\r\n\r\nThe band reached prominence during the 1970s, under the leadership of vocalist and primary songwriter Ronnie Van Zant, until his death in 1977.", "heard_by": []}, {"n": 144, "title": "Innervisions", "artist": "Stevie Wonder", "year": 1973, "cover": "https://dn710702.ca.archive.org/0/items/mbid-f5b19d0e-1398-41db-a24f-50b3f6599a39/mbid-f5b19d0e-1398-41db-a24f-50b3f6599a39-1243783912.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5601-stevie-wonder-innervisions.php", "aoty_critic_score": 98, "aoty_user_score": 90, "mbid": "e626b377-74c5-3b97-8f16-8cef5e1c04ea", "yt_id": "q8dK0iEzi1M", "rym": "https://rateyourmusic.com/release/album/stevie-wonder/innervisions", "genres": ["soul", "psychedelic soul", "funk", "smooth soul"], "desc_lfm_album": "When Stevie Wonder applied his tremendous songwriting talents to the unsettled social morass that was the early '70s, he produced one of his greatest, most important works, a rich panoply of songs addressing drugs, spirituality, political ethics, the unnecessary perils of urban life, and what looked to be the failure of the '60s dream — all set within a collection of charts as funky and catchy as any he'd written before. Two of the highlights, \"Living for the City\" and \"Too High,\" make an especially deep impression thanks to Stevie's narrative talents; on the first, an eight-minute mini-epic, he brings .", "desc_lfm_artist": "Stevie Wonder is the stage name of Stevland Hardaway Morris (b. Stevland Hardaway Judkins, 13 May 1950 in Saginaw, MI, USA - a.k.a. Little Stevie Wonder), a singer, multi-instrumentalist, composer,  record producer and activist.  He débuted, as Little Stevie Wonder, with the single \"I Call It Pretty Music but the Old People Call It the Blues\" (1961, Tamla Motown) and his latest album is \"A Time To Love\" (Oct 2005, Motown)\n\nStevland lost his eyesight shortly after birth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 145, "title": "Future Days", "artist": "Can", "year": 1973, "cover": "https://dn710009.ca.archive.org/0/items/mbid-6a557839-2a65-43dd-822f-89df42420f19/mbid-6a557839-2a65-43dd-822f-89df42420f19-36773253857.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6045-can-future-days.php", "aoty_critic_score": 86, "aoty_user_score": 85, "mbid": "aa41b178-9f16-3dc4-84b6-e9ad8b5be4b8", "yt_id": "wQxMB4Wk_y8", "rym": "https://rateyourmusic.com/release/album/can/future-days", "genres": ["krautrock"], "desc_lfm_album": "Damo Suzuki's final effort is Can's most atmospheric and beautiful record, a spartan collection of lengthy, jazz-like compositions recorded with minimal vocal contributions. Employing keyboard washes to create a breezy, almost oceanic feel (indeed, two of the tracks are titled \"Spray\" and \"Bel Air\"), the mix buries Suzuki's voice to elevate drummer Jaki Liebezeit's complex rhythms to the foreground; despite the deceptive tranquility of its surface, Future Days is an intense work, bubbling with radical ideas and concepts. .", "desc_lfm_artist": "CAN was a German experimental rock band formed in Cologne in 1968. They split up in 1979 and were active again in 1986, 1988, 1991 and 1999.\n\n\nMembers:\n** Guitar, vocals, violin: Michael Karoli (1968–1979, 1986, 1988, 1991, 1999; died 2001)\n** Drums, percussion, double bass, piano: Jaki Liebezeit (1968–1979, 1986, 1988, 1991, 1999; died 2017)\n** Keyboards, vocals: Irmin Schmidt (1968–1979, 1986, 1988, 1991, 1999)\n** Bass, sound engineer, electronics, vocals, French horn: Holger Czukay (1968–1977, 1986, 1988; died 2017)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "MaxtorUwU", "armandwave", "verygooood"]}, {"n": 146, "title": "Secos & Molhados", "artist": "Secos & Molhados", "year": 1973, "cover": "https://cdn2.albumoftheyear.org/600x0/album/67397-secos-molhados_214400.jpg", "aoty_url": "https://www.albumoftheyear.org/album/67397-secos-molhados-secos-molhados.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "917bcbb3-77c2-3e0c-9bba-03bde7e3ef50", "yt_id": "tvoTrv-5fxE", "rym": "https://rateyourmusic.com/release/album/secos-and-molhados/secos-and-molhados-10", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Secos & Molhados was an innovative glam-rock Brazilian band formed in São Paulo in 1971 that helped launch singer Ney Matogrosso's career. The other two members were João Ricardo, founder and main songwriter of the group, and Gérson Conrad. Though this classic line-up was short-lived - only two albums were released, one in 1973 and one in 1974 - the band was very successful and remains highly influential. Matogrosso's unusual high-pitched voice helped create a distinct identity as well as the band's eccentric heavy make-up and outfits.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 147, "title": "Lo Mato", "artist": "Willie Colón & Héctor Lavoe", "year": 1973, "cover": "https://cdn2.albumoftheyear.org/600x0/album/164053-lo-mato.jpg", "aoty_url": "https://www.albumoftheyear.org/album/164053-willie-colon-hector-lavoe-lo-mato.php", "aoty_critic_score": 80, "aoty_user_score": 86, "mbid": null, "yt_id": "xLKKRUzBEqg", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 148, "title": "Countdown to Ecstasy", "artist": "Steely Dan", "year": 1973, "cover": "https://dn721607.ca.archive.org/0/items/mbid-469bb2b2-ac3c-4047-b7c0-9ccc47cc834d/mbid-469bb2b2-ac3c-4047-b7c0-9ccc47cc834d-36869177595.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10768-steely-dan-countdown-to-ecstasy.php", "aoty_critic_score": 91, "aoty_user_score": 80, "mbid": "33726877-dd41-301b-9f1e-498ebbadc7d8", "yt_id": "_lxAYIT4Wv4", "rym": "https://rateyourmusic.com/release/album/steely-dan/countdown-to-ecstasy", "genres": ["pop rock", "jazz rock", "jazz pop"], "desc_lfm_album": "Countdown to Ecstasy is the second studio album by the American rock band Steely Dan, released in July 1973 by ABC Records. It was recorded at Caribou Ranch in Nederland, Colorado, and The Village Recorder in West Los Angeles, California. After the departure of vocalist David Palmer, the group recorded the album with Donald Fagen singing lead on all the songs. Although it was a critical success, the album failed to generate a hit single, and consequently charted at only number 35 on the Billboard 200. It was eventually certified gold by the Recording Industry Association of America (RIAA), having .", "desc_lfm_artist": "Steely Dan is an American jazz rock band which formed in 1972. The band was formed by Donald Fagen (vocals, keyboards) and Walter Becker (guitar, bass), who met in 1967 while both attended Bard College in Annandale-on-Hudson, New York, and began a songwriting partnership shortly thereafter.\n\nTheir music is characterized by dark, witty lyrical narratives, obscure lyrical allusions and complex, jazz-influenced instrumentation and chord sequences, overlying more ordinary popular song structures.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 149, "title": "Living in the Material World", "artist": "George Harrison", "year": 1973, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18499-living-in-the-material-world_104916.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18499-george-harrison-living-in-the-material-world.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "35f1fade-fc94-3f95-906c-d91935add4d5", "yt_id": "cIL1TzfgUhM", "rym": null, "genres": [], "desc_lfm_album": "Living in the Material World is the fourth studio album by English musician George Harrison, released in 1973 on Apple Records. As the follow-up to 1970's critically acclaimed All Things Must Pass and his pioneering charity project, the Concert for Bangladesh, it was among the most highly anticipated releases of that year. The album was certified gold by the Recording Industry Association of America two days after release, on its way to becoming Harrison's second number 1 album in the United States, and produced the international hit \"Give Me Love (Give Me Peace on Earth)\". It also topped albums charts .", "desc_lfm_artist": "George Harrison MBE (25 February 1943 – 29 November 2001) born in Liverpool, UK, was an English rock musician, singer-songwriter and film producer who achieved international fame as lead guitarist in The Beatles, along with mainstream success as a solo artist. George contributed to the songwriting talents of his Beatles band mates, John Lennon and Paul McCartney, firstly by adding ideas and guitar parts, and later with his distinctive style of music inspired by Eastern spirituality.", "desc_mb_album": "", "desc_mb_artist": "Performs as '''Nelson Wilbury''' on '''[http://musicbrainz.org/release/bfbe1d07-ab65-456e-85b3-6e3ce8443d90.html|Traveling Wilburys, Volume 1]''' and '''Spike Wilbury''' on '''[http://musicbrainz.org/release/a072380c-3348-4147-8625-d5a277a1ff96.html|Traveling Wilburys, Volume 3]'''.", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo"]}, {"n": 150, "title": "Tubular Bells", "artist": "Mike Oldfield", "year": 1973, "cover": "https://dn721603.ca.archive.org/0/items/mbid-eebddc62-a628-3eb2-a244-020d35ffe32d/mbid-eebddc62-a628-3eb2-a244-020d35ffe32d-33363494255.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11941-mike-oldfield-tubular-bells.php", "aoty_critic_score": 70, "aoty_user_score": 81, "mbid": "d3f057b4-7e89-3018-9f84-9835ed9b4732", "yt_id": "bv_4sZCLlr0", "rym": "https://rateyourmusic.com/release/album/mike-oldfield/tubular-bells-89", "genres": ["folk rock", "art rock", "classic rock", "progressive rock", "modern classical", "new age"], "desc_lfm_album": "Tubular Bells is a record album, written and mostly performed by Mike Oldfield, released in 1973. The late Vivian Stanshall provided the voice of the \"Master of Ceremonies\" who reads off the list of instruments at the end of the first movement. The piece was later orchestrated by David Bedford for The Orchestral Tubular Bells version and it had two sequels in the 1990s, Tubular Bells II and Tubular Bells III. Significance Oldfield approached (and was rejected by) many other established record labels. Some of the rejections were because they believed the piece to be unmarketable. Oldfield then played his .", "desc_lfm_artist": "Mike Oldfield (born Michael Gordon Oldfield, 15 May 1953, Reading, Berkshire, England) is largely known for Tubular Bells, his groundbreaking album from 1973, the success of which also bankrolled Sir Richard Branson's Virgin Records, for which Tubular Bells was the inaugural release. However, his musical career has spread over more than 40 years encompassing a range of styles, with varying amounts of success. According to the Gibraltar Encyclopedia of Progressive Rock, his style is labeled as Oldfield Progressive.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 151, "title": "Aladdin Sane", "artist": "David Bowie", "year": 1973, "cover": "https://ia800603.us.archive.org/29/items/mbid-64418688-706e-3312-b2b0-fba6c123c506/mbid-64418688-706e-3312-b2b0-fba6c123c506-2980858586.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5587-david-bowie-aladdin-sane.php", "aoty_critic_score": 89, "aoty_user_score": 84, "mbid": "50f8710f-3ae6-319b-85a7-afe783f13449", "yt_id": "eQGobt4ub6U", "rym": "https://rateyourmusic.com/release/album/david-bowie/aladdin-sane", "genres": ["art rock", "classic rock", "hard rock", "pop rock", "glam rock", "piano rock"], "desc_lfm_album": "Aladdin Sane is the sixth studio album by the English musician David Bowie, released on 13 April 1973 through RCA Records. The follow-up to his breakthrough The Rise and Fall of Ziggy Stardust and the Spiders from Mars, it was the first album he wrote and released from a position of stardom. It was co-produced by Bowie and Ken Scott and features contributions from Bowie's backing band the Spiders from Mars — Mick Ronson, Trevor Bolder and Mick Woodmansey — with pianist Mike Garson, two saxophonists and three backing vocalists. Recorded in London and New York City between legs of .", "desc_lfm_artist": "David Robert Jones (8 January 1947 – 10 January 2016), known professionally as David Bowie, was an English singer-songwriter and actor. A leading figure in the music industry, he is regarded as one of the most influential musicians of the 20th century. Bowie was acclaimed by critics and musicians, particularly for his innovative work during the 1970s. His career was marked by reinvention and visual presentation, and his music and stagecraft had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 152, "title": "Catch a Fire", "artist": "The Wailers", "year": 1973, "cover": "https://dn710006.ca.archive.org/0/items/mbid-1eba9080-0be7-42fb-a331-895d99a1d847/mbid-1eba9080-0be7-42fb-a331-895d99a1d847-32875265734.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "63a3ac2f-5d63-3132-98d3-b00385d9a3a2", "yt_id": "uzv1kZBVs8w", "rym": "https://rateyourmusic.com/release/album/bob-marley-and-the-wailers/catch-a-fire", "genres": ["reggae", "roots reggae"], "desc_lfm_album": "Catch a Fire is the major-label-debut album for Jamaican reggae band The Wailers, released on Island Records in 1973. The album established the band as international superstars. Leader Bob Marley in particular became world-famous. The socially aware lyrics and militant tone surprised many listeners, but others were attracted to songwriters Marley and Peter Tosh's confrontational subjects and optimistic view of a future free from oppression. Catch a Fire peaked at #171 and #51 on Billboard's (North America) Pop Albums and Black Albums charts respectively. It is number 123 on Rolling Stone's list of the 500 greatest albums of all time, .", "desc_lfm_artist": "There are or have been - at least - two bands named The Wailers: \n\n- The legendary Jamaican reggae band (founded as a ska group 1963, and became a Rastafarian reggae band in 1968), renamed Bob Marley & The Wailers in 1974, which are still active led by bassist Aston Barrett after Marley's death in 1981.  \n\n- The Fabulous Wailers, a rock and roll and garage band from the USA, active 1958-1969, first led by John Greek, replaced in 1960 by Rockin' Robin Roberts.", "desc_mb_album": "", "desc_mb_artist": "Releases under \"Bob Marley & The Wailers\" belong here, '''no matter the band lineup'''.  \r\n\r\nReleases under \"The Wailing Wailers\", \"The Wailers\", or \"Marley, Tosh, Livingston & Associates\" belong under [http://musicbrainz.org/artist/c9e99d40-4a2c-4ca7-ac5b-e842264ee271.html|\"The Wailing Wailers\"], '''unless''' the track or release was produced by Lee \"Scratch\" Perry, in which case it ought to be listed here, not there.\r\n\r\nReleases by The Wailers Band after Bob Marley's death belong under [http://musicbrainz.org/artist/1e46801d-c27b-4f07-a50d-51597a26df60.html|\"The Wailers Band\"].\r\n\r\nSolo releases by [http://musicbrainz.org/artist/ed2ac1e9-d51d-4eff-a2c2-85e81abd6360.html|Bob Marley], [http://musicbrainz.org/artist/7db6aae5-6644-4513-9bfc-ca2e79d4469c.html|Peter Tosh], or [http://musicbrain", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 153, "title": "Milagre Dos Peixes", "artist": "Milton Nascimento", "year": 1973, "cover": "https://dn710802.ca.archive.org/0/items/mbid-3092a0ec-7cb6-4a83-9a8c-d8fd60121d6e/mbid-3092a0ec-7cb6-4a83-9a8c-d8fd60121d6e-35033675443.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a0530883-ad80-3663-96bb-ecfda64ddaa9", "yt_id": "_HAfK7BITrM", "rym": "https://rateyourmusic.com/release/album/milton-nascimento/milagre-dos-peixes", "genres": ["mpb", "latin"], "desc_lfm_album": "Milagre dos Peixes é um disco do cantor e compositor brasileiro Milton Nascimento lançado no ano de 1973. Várias canções do album tiveram suas letras censuradas pelo Regime militar no Brasil, porém Milton decidiu gravá-las mesmo sem letras. O disco é composto de 11 músicas, sendo 8 delas instrumentais. O disco, considerado o mais experimental e denso de Milton, foi eleito em uma lista da versão brasileira da revista Rolling Stone como o 63º melhor disco brasileiro de todos os tempos. .", "desc_lfm_artist": "Milton Nascimento (born 26 October, 1942) is a Brazilian songwriter, singer, and guitarist, who is considered one of the foremost icons of Brazilian popular music. His work spans a multitude of genres, from contemporary folk to jazz, and is often rooted in the traditional and indigenous music of the country.\n\nNascimento was born in Rio de Janeiro, and grew up in Três Pontas, Minas Gerais. His mother was the maid Maria do Carmo Nascimento. When he was just a few months old", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 154, "title": "Sextant", "artist": "Herbie Hancock", "year": 1973, "cover": "https://cdn2.albumoftheyear.org/600x0/album/58639-sextant.jpg", "aoty_url": "https://www.albumoftheyear.org/album/58639-herbie-hancock-sextant.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "57b856a7-e33c-35f3-8268-a7fb318e98b0", "yt_id": "6Mz5rR0y0fM", "rym": "https://rateyourmusic.com/release/album/herbie-hancock/sextant/", "genres": ["jazz", "jazz-funk", "avant-garde jazz", "progressive electronic", "jazz fusion"], "desc_lfm_album": "Herbie Hancock's Sextant, released on March 30, 1973, stands as an album that redefined the boundaries of jazz fusion. This groundbreaking work emerged during a transformative period in jazz history, when traditional acoustic instruments were being augmented by electronic innovations. As Hancock's eleventh studio album and the final recording with his Mwandishi-era sextet, it featured an exceptional lineup including saxophonist Bennie Maupin, whose bass clarinet work would later influence countless woodwind players; trumpeter Eddie Henderson, known for his pioneering use of electronic effects in jazz; and trombonist Julian Priester, whose textural approach helped shape the album's unique soundscape. When Herbie .", "desc_lfm_artist": "Herbert Jeffrey Hancock (born April 12, 1940) is a jazz  pianist and composer from Chicago, Illinois, United States. Hancock is one of jazz music's most important and influential pianists and composers. He embraced elements of rock, funk, and soul while adopting freer stylistic elements from jazz.\n\nAs part of Miles Davis' \"second great quintet\" Hancock helped redefine the role of a jazz rhythm section, and was later one of the first jazz musicians to embrace synthesizers and Jazz funk.", "desc_mb_album": "", "desc_mb_artist": "''Herbert Jeffrey Hancock'', born in Chicago, IL, USA, is without doubt the most well known, controversial and influential of all jazz pianists.\r\nSoon noticed by and involved with ''Miles Davis'', Mr ''Hancock'' almost stormed the hardbop ''Blue Note'' 60's with a number of legendary sessions, from his (nearly) first record ''Takin' Off'', to ''The Prisoner''.\r\nRecording with the new ''Mile's'' cats, he then took an important turn (around the time of ''Head Hunters''), experimenting and mixing genres, thus drifting from his previous fan base expectations.\r\nWhile the hardbop's crowd thought he was completely lost for the cause, he then took a radical U-turn, with the all-stars-all-jazz ''V.S.O.P.''\r\nHe has since recorded and experimented in a lot of directions, exploring \"sound textures\" an", "heard_by": ["MaxtorUwU"]}, {"n": 155, "title": "Houses of the Holy", "artist": "Led Zeppelin", "year": 1973, "cover": "https://dn710705.ca.archive.org/0/items/mbid-9be882ef-ebdb-49be-a5cb-5e0021c05e37/mbid-9be882ef-ebdb-49be-a5cb-5e0021c05e37-8219280991.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4525-led-zeppelin-houses-of-the-holy.php", "aoty_critic_score": 87, "aoty_user_score": 83, "mbid": "9b5006e5-b276-3a05-bcdd-8d986842320b", "yt_id": "97FpOlzPqFM", "rym": "https://rateyourmusic.com/release/album/led-zeppelin/houses-of-the-holy", "genres": ["blues rock", "folk rock", "classic rock", "hard rock", "arena rock", "heavy metal"], "desc_lfm_album": "Houses of the Holy is the fifth album by English rock band Led Zeppelin, released by Atlantic Records on 28 March 1973. The album title is a dedication by the band to their fans who appeared at venues they dubbed \"Houses of the Holy.\" It was the first Led Zeppelin album to not be, at least unofficially, titled after the band. The album represents a musical turning point for Led Zeppelin, as they began to use more layering and production techniques in recording their songs. It is also the first of three albums to be completely original, the first four .", "desc_lfm_artist": "Led Zeppelin were an English rock band formed in London in 1968. The group consisted of Robert Plant on vocals, Jimmy Page on guitar, John Paul Jones on bass and keyboards, and John Bonham on drums. Known for a heavy, guitar-based sound that drew from blues and folk traditions, they are widely regarded as a major influence on the development of hard rock and heavy metal. They became one of the best-selling music artists in history and helped shape album-oriented rock and stadium rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 156, "title": "Larks’ Tongues in Aspic", "artist": "King Crimson", "year": 1973, "cover": "https://dn710000.ca.archive.org/0/items/mbid-ad92decb-0031-477d-ae8a-28da10d714fb/mbid-ad92decb-0031-477d-ae8a-28da10d714fb-31497636610.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "6d655093-4a0b-32ca-8d0e-b497d6ac781d", "yt_id": "eDyf0ofV5n4", "rym": null, "genres": ["experimental rock", "avant-prog", "art rock", "progressive rock"], "desc_lfm_album": "", "desc_lfm_artist": "King Crimson are an English progressive rock band formed in London in 1968 by Robert Fripp, Michael Giles, Greg Lake, Ian McDonald and Peter Sinfield. Guitarist and leader Fripp has remained the only constant member throughout the band's long history. The band drew inspiration from a wide variety of music, incorporating elements of classical, jazz, folk, heavy metal, gamelan, blues, industrial, electronic, and experimental music. They also exerted a strong influence on the early 1970s progressive rock movement", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu"]}, {"n": 157, "title": "For Your Pleasure", "artist": "Roxy Music", "year": 1973, "cover": "https://dn721809.ca.archive.org/0/items/mbid-6d4932d4-c81a-3438-97f1-fac6e8902712/mbid-6d4932d4-c81a-3438-97f1-fac6e8902712-6802461026.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6328-roxy-music-for-your-pleasure.php", "aoty_critic_score": 93, "aoty_user_score": 80, "mbid": "72fd9993-17b8-3402-9f8d-c39cb3d2c27e", "yt_id": "M5X6BifSQ9U", "rym": "https://rateyourmusic.com/release/album/roxy-music/for-your-pleasure", "genres": ["art rock", "proto-punk", "pop rock", "psychedelic", "glam rock", "glam"], "desc_lfm_album": "For Your Pleasure is the second album by the English rock band Roxy Music, released by Island Records in 1973. It was their last to feature synthesiser and sound specialist Brian Eno, who would later gain acclaim as a solo artist and producer. .", "desc_lfm_artist": "Roxy Music are an English rock band formed in 1970 by Bryan Ferry—who became the band's lead vocalist and principal songwriter—and bassist Graham Simpson. The other longtime members are Phil Manzanera (guitar), Andy Mackay (saxophone and oboe), and Paul Thompson (drums and percussion). Other members included Brian Eno (synthesizer and \"treatments\") and Eddie Jobson (synthesizer and violin). Although the band took a break from group activities in 1976 and again in 1983", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 158, "title": "The Dark Side of the Moon", "artist": "Pink Floyd", "year": 1973, "cover": "https://dn710607.ca.archive.org/0/items/mbid-956fbc58-362d-43b8-b880-3779e0508559/mbid-956fbc58-362d-43b8-b880-3779e0508559-34025419985.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4204-pink-floyd-the-dark-side-of-the-moon.php", "aoty_critic_score": 97, "aoty_user_score": 91, "mbid": "f5093c06-23e3-404f-aeaa-40f72885ee3a", "yt_id": "k9ynZnEBtvw", "rym": "https://rateyourmusic.com/release/album/pink-floyd/the-dark-side-of-the-moon", "genres": ["psychedelic rock", "art rock", "classic rock", "hard rock", "space rock", "progressive rock"], "desc_lfm_album": "The Dark Side of the Moon is the eighth studio album by English rock band Pink Floyd, released on 1 March 1973 by Harvest Records. The album built on ideas explored in earlier recordings and live shows, but lacks the extended instrumental excursions that characterized their earlier work. Its themes explore conflict, greed, the passage of time, and mental illness, the latter partly inspired by the deteriorating mental state of founding member and principal contributor, Syd Barrett. Developed during live performances, an early version was premiered several months before recording began; the new material was recorded in two sessions in .", "desc_lfm_artist": "Pink Floyd are an English rock band formed in London in 1965 by Syd Barrett (guitar, vocals), Nick Mason (drums), Roger Waters (bass guitar, vocals) and Richard Wright (keyboards, vocals), with David Gilmour (guitar, vocals) joining at the end of 1967. Gaining an early following as one of the first British psychedelic groups, they were distinguished by their extended compositions, sonic experiments, philosophical lyrics, and elaborate live performances, and became a leading progressive rock band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 159, "title": "Closing Time", "artist": "Tom Waits", "year": 1973, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6165-closing-time.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6165-tom-waits-closing-time.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "35c9a4b0-d4dd-3e6f-87fd-2185519296e2", "yt_id": "cwYMGg_gUHw", "rym": "https://rateyourmusic.com/release/album/tom-waits/closing-time", "genres": [], "desc_lfm_album": "Tom Waits' Closing Time is the debut album and title track of the American singer-songwriter, released on March 6, 1973, by Asylum Records. This groundbreaking album not only marked the beginning of Waits' musical journey but also established his signature style of crafting minor-key masterpieces that capture the essence of urban solitude and late-night contemplation. The album's atmospheric sound would later influence artists like Bruce Springsteen and Nick Cave in their approach to storytelling through music. Producer: Jerry Yester (former member of Lovin' Spoonful) - whose experience with folk-rock arrangements proved instrumental in shaping the album's sound Recording: Early 1972 .", "desc_lfm_artist": "Tom Waits (born Thomas Alan Waits, in Pomona, California, on December 7, 1949) is a prolific American singer, songwriter, composer, and actor.\n\nHe started his career in the early 1970s as a singer in spit 'n' sawdust bars. Initially, he was deeply influenced by the beat generation, novelists like Jack Kerouac and William S. Burroughs, and poets like Allen Ginsberg and Charles Bukowski.  Waits is often compared to Charles Bukowski, being similar both in content and lifestyle", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 160, "title": "Raw Power", "artist": "Iggy and The Stooges", "year": 1973, "cover": "https://dn710700.ca.archive.org/0/items/mbid-d89b2fc8-3dad-3a08-952d-09622ab99f3a/mbid-d89b2fc8-3dad-3a08-952d-09622ab99f3a-8067123145.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "156cbf68-eaea-3f6a-852e-aa6afbd779db", "yt_id": "fzIbj8WWdiQ", "rym": "https://rateyourmusic.com/release/album/iggy-and-the-stooges/raw-power", "genres": ["garage rock", "proto-punk", "classic rock", "hard rock", "punk", "punk rock"], "desc_lfm_album": "", "desc_lfm_artist": "With the Stooges in limbo, Iggy Pop met David Bowie in September 1971, and the pair became good friends. Bowie, then at the height of his Ziggy Stardust-era fame, brought Pop and Williamson to the U.K. and got them a deal with Columbia Records. The pair attempted to reconstitute the Stooges with British musicians, but finding no suitable additions, brought the Asheton brothers back into the band (this \"second choice\" decision rankled Ron Asheton, as did his change from guitar to bass).", "desc_mb_album": "", "desc_mb_artist": "'''Do not merge this artist''' with [http://musicbrainz.org/artist/794c6bf2-3241-416f-9b8f-24e2d84a1c4b|The Stooges]. [http://musicbrainz.org/artist/ce433190-9ca1-467c-b5fd-c57ae7f4768c|James Williamson] is not a member of “The Stooges” and is the significant difference in [http://musicbrainz.org/artist/1253e5e9-eaa7-4ce6-81b8-09725e8cee43|Iggy & The Stooges] – the member that pushed “The Stooges” guitarist [http://musicbrainz.org/artist/a10c8616-cdc3-4fd1-a0fa-bc35a6514168|Ron Asheton] to bass guitar. [http://musicbrainz.org/artist/f37b3f31-b1f8-4b88-8cb5-b34f709b17d7|Iggy] [http://en.wikipedia.org/wiki/The_Stooges#Return_of_James_Williamson_.282009.E2.80.93present.29|says] ''although “The Stooges” died with Ron Asheton, there is still “Iggy and the Stooges”''.\r\n\r\n'''Do not split this art", "heard_by": ["Frikomid", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 161, "title": "For The Roses", "artist": "Joni Mitchell", "year": 1972, "cover": "https://dn710304.ca.archive.org/0/items/mbid-9fe48235-604a-4fa7-b3f7-05aa3f7b2213/mbid-9fe48235-604a-4fa7-b3f7-05aa3f7b2213-18168529412.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a5b7d474-4a69-31fc-86c9-c14eb6a1f963", "yt_id": "OcYvMQQolXI", "rym": "https://rateyourmusic.com/release/album/joni-mitchell/for-the-roses", "genres": ["folk rock", "folk", "contemporary folk", "folk pop"], "desc_lfm_album": "For the Roses is the fifth studio album by Canadian singer-songwriter Joni Mitchell, released in November 1972, between her two biggest commercial and critical successes – Blue and Court and Spark. Despite this, in 2007 it was one of 25 recordings chosen that year by the Library of Congress to be added to the National Recording Registry. It is Mitchell's first, and so far only, album to accomplish this feat. It is perhaps best known for the hit single \"You Turn Me On I'm a Radio\", which Mitchell wrote sarcastically out of a record company request for a radio-friendly song. .", "desc_lfm_artist": "Roberta Joan Mitchell (née Anderson; born November 7, 1943) is a Canadian and American singer-songwriter, multi-instrumentalist, and painter. She gained recognition in the 1960s folk music scene for her personal lyrics and distinctive compositions, which later incorporated elements from various genres including pop, jazz, and rock. Over her career, she has received multiple awards, including eleven Grammy Awards, and was inducted into the Rock and Roll Hall of Fame in 1997.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 162, "title": "Transformer", "artist": "Lou Reed", "year": 1972, "cover": "https://dn711301.ca.archive.org/0/items/mbid-c0afd87f-2f90-4c4d-b69d-ec150660fa
