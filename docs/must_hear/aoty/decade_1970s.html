<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOTY Must Hear — 1970s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/images/discount.png" />
<script defer src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;
  --accent:#e8ff47;--heard:#e8ff47;--pending:#ff4747;
  --text:#e0e0e0;--muted:#555;--gap:6px;
  --panel:390px;--header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{
  position:fixed;top:0;left:0;right:var(--panel);height:var(--header-h);z-index:100;
  background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:0 18px;display:flex;align-items:center;gap:12px;
}
.back-link{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.dec-wrap{position:relative}
.dec-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);
  color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.dec-btn:hover{background:rgba(232,255,71,.12)}
.dec-dropdown{
  display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:160px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.dec-dropdown.open{display:block}
.dec-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.dec-item{display:block;padding:6px 14px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);text-decoration:none;transition:background .1s}
.dec-item:hover{background:var(--surface)}
.dec-item.active{color:var(--accent)}
.controls{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0}
.filter-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.search-box{
  font-family:'DM Mono',monospace;font-size:.62rem;padding:4px 9px;
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);width:130px;outline:none;transition:border-color .15s;
}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.genre-wrap{position:relative}
.genre-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.genre-btn:hover,.genre-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.genre-btn .badge{background:var(--accent);color:#000;border-radius:10px;padding:1px 5px;font-size:.52rem;font-weight:700}
.genre-dropdown{
  display:none;position:fixed;
  background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:200px;max-height:320px;overflow-y:auto;padding:4px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.genre-dropdown.open{display:block}
.genre-dh{
  padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:3px;
  display:flex;justify-content:space-between;
}
.genre-clear{color:var(--pending);cursor:pointer}
.genre-item{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;transition:background .1s}
.genre-item:hover{background:var(--surface)}
.genre-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.genre-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);cursor:pointer;flex:1;display:flex;justify-content:space-between}
.genre-item label span{color:var(--muted);font-size:.56rem}
.user-wrap{position:relative}
.user-btn{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.user-btn:hover{background:rgba(232,255,71,.12)}
.user-btn .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.user-dropdown{display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;z-index:9999;min-width:164px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.user-dropdown.open{display:block}
.user-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.user-item{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;transition:background .1s;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text)}
.user-item:hover{background:var(--surface)}
.user-item.active{color:var(--accent)}
.user-item .u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.user-item.active .u-dot{background:var(--accent)}
#main{margin-top:var(--header-h);margin-right:var(--panel);padding:14px 18px 60px;position:relative;z-index:0}
.count-bar{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px;display:flex;gap:14px}
.count-bar b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.05);z-index:10}
.card.hidden{display:none}
.card.active-card{outline:2px solid var(--accent);outline-offset:2px;z-index:11}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.heard-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3;background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,0) 55%);
  opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px;z-index:2;
}
.card:hover .card-overlay{opacity:1}
.card-scores{display:flex;gap:3px;margin-bottom:2px}
.card-score{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;padding:1px 4px;border-radius:2px}
.card-score.c{background:rgba(108,184,250,.2);color:#6cb8fa}
.card-score.u{background:rgba(191,143,255,.2);color:#bf8fff}
.card-title{font-size:.56rem;font-weight:500;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{font-size:.52rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3}
.card.heard-user::before{background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card.unheard-user::before{background:var(--pending);box-shadow:0 0 5px var(--pending)}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panel);
  background:#0c0c0c;border-left:1px solid var(--border);
  z-index:50;display:flex;flex-direction:column;overflow:hidden;
}
.panel-topbar{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 15px;flex-shrink:0}
.panel-topbar-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel-cover{width:100%;aspect-ratio:1;flex-shrink:0;position:relative;background:var(--surface);max-height:200px;overflow:hidden}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-scores{display:flex;gap:6px;position:absolute;bottom:8px;left:8px}
.panel-score{padding:3px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700}
.panel-score.c{background:rgba(0,0,0,.7);color:#6cb8fa;border:1px solid #6cb8fa44}
.panel-score.u{background:rgba(0,0,0,.7);color:#bf8fff;border:1px solid #bf8fff44}
.panel-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.panel-empty-icon{font-size:2rem;opacity:.3}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);line-height:1.05;margin-bottom:2px}
.panel-artist{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.panel-year{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.panel-genre-tag{font-family:'DM Mono',monospace;font-size:.56rem;padding:2px 6px;border-radius:2px;background:rgba(232,255,71,.07);border:1px solid rgba(232,255,71,.18);color:rgba(232,255,71,.65)}
.panel-heard-by{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:9px}
.panel-heard-by b{color:var(--heard)}
.panel-divider{height:1px;background:var(--border);margin:9px 0}
.panel-section-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.panel-bio{font-size:.72rem;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-bio::-webkit-scrollbar{width:3px}
.panel-bio::-webkit-scrollbar-thumb{background:var(--border)}
.desc-block{margin-bottom:9px}
.desc-source-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.desc-source-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.desc-source-label.lfm{color:#d51007}.desc-source-label.mb{color:#ba478f}.desc-source-label.artist{color:#6a9fb5}
.desc-source-text{font-size:.7rem;color:#aaa;line-height:1.55}
.panel-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.panel-link{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}
.panel-link.aoty{border-color:#e87c2e;color:#e87c2e}
.panel-link.aoty:hover{background:rgba(232,124,46,.08)}
.panel-link.yt{border-color:#f00;color:#f00}
.panel-link.yt:hover{background:rgba(255,0,0,.08)}
.panel-link.rym{border-color:#5baadb;color:#5baadb}
.panel-link.rym:hover{background:rgba(91,170,219,.08)}
.panel-yt-wrap{margin-top:11px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.panel-yt-wrap iframe{display:block;width:100%;height:145px;border:none}
.panel-yt-placeholder{height:60px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.panel-close-btn{display:none;position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.18)}
.grid-sizer{display:flex;align-items:center;gap:5px}
.grid-sizer span{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);min-width:24px;text-align:right}
#grid-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#grid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
#grid-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#empty{display:none;text-align:center;padding:50px 0;font-family:'DM Mono',monospace;color:var(--muted);font-size:.7rem}
@media(max-width:600px){
  :root{--header-h:50px}
  header{right:0;height:auto;min-height:var(--header-h);flex-wrap:wrap;padding:8px 12px;gap:6px 10px;overflow:visible}
  #main{margin-right:0;padding:10px 10px 60px}
  #panel{inset:0;width:100%;border-left:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  #panel.panel-open{transform:translateY(0)}
  .panel-close-btn{display:flex}
  .controls{flex:0 0 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:5px;padding:5px 0 2px;border-top:1px solid var(--border);scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .dec-wrap{display:none}
}</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">←</a>
  <span class="header-title">AOTY Must Hear</span>
  <div class="dec-wrap">
    <button class="dec-btn" id="dec-btn" onclick="toggleDecDD()">
      1970s &#x25BE;
    </button>
  </div>
  <div class="controls">
    <button class="filter-btn active" id="btn-all"     onclick="setFilter('all')">All</button>
    <button class="filter-btn"        id="btn-heard"   onclick="setFilter('heard')">Heard</button>
    <button class="filter-btn"        id="btn-unheard" onclick="setFilter('unheard')">Unheard</button>
    <input class="search-box" id="search" placeholder="Search..." oninput="applyFilters()">
    <div class="genre-wrap">
      <button class="genre-btn" id="genre-btn" onclick="toggleGenreDD()">
        Genre <span class="badge" id="genre-badge" style="display:none">0</span> &#x25BE;
      </button>
    </div>
    <div class="user-wrap">
      <button class="user-btn" id="user-btn" onclick="toggleUserDD()">
        <span class="u-name" id="user-btn-label">All users</span> &#x25BE;
      </button>
    </div>
    <div class="grid-sizer">
      <span id="grid-label">10×</span>
      <input type="range" id="grid-slider" min="3" max="20" value="10" step="1" oninput="setGridSize(this.value)">
    </div>
  </div>
</header>
<main id="main">
  <div class="count-bar">
    <span>Showing <b id="vis-count">256</b> of 256</span>
    <span><b id="vis-heard">0</b> heard</span>
  </div>
  <div id="grid"></div>
  <div id="empty">No albums match your filters.</div>
</main>
<aside id="panel">
  <button class="panel-close-btn" onclick="closePanel()" aria-label="Close">&#x2715;</button>
  <div class="panel-topbar">
    <span class="panel-topbar-label">Album detail</span>
  </div>
  <div id="panel-cover-wrap" class="panel-cover" style="display:none">
    <img id="p-cover" src="" alt="">
    <div class="panel-scores" id="p-scores"></div>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="panel-empty"><div class="panel-empty-icon">◉</div>Click an album</div>
  </div>
</aside>
<div class="dec-dropdown" id="dec-dd">
  <div class="dec-dh">Jump to decade</div>
  <a class="dec-item" href="decade_1950s.html">1950s</a><a class="dec-item" href="decade_1960s.html">1960s</a><a class="dec-item active" href="decade_1970s.html">1970s</a><a class="dec-item" href="decade_1980s.html">1980s</a><a class="dec-item" href="decade_1990s.html">1990s</a><a class="dec-item" href="decade_2000s.html">2000s</a><a class="dec-item" href="decade_2010s.html">2010s</a><a class="dec-item" href="decade_2020s.html">2020s</a>
</div>
<div class="genre-dropdown" id="genre-dd">
  <div class="genre-dh">Filter by genre <span class="genre-clear" onclick="clearGenres()">clear</span></div>
  <div id="genre-list"></div>
</div>
<div class="user-dropdown" id="user-dd">
  <div class="user-dh">View as user</div>
  <div id="user-list"></div>
</div>

const ALBUMS = [{"n": 1, "title": "London Calling", "artist": "The Clash", "year": 1979, "cover": "https://dn710206.ca.archive.org/0/items/mbid-7bec22a0-eb73-4b79-a619-b253d5c2af87/mbid-7bec22a0-eb73-4b79-a619-b253d5c2af87-4527734511.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4996-the-clash-london-calling.php", "aoty_critic_score": 100, "aoty_user_score": 88, "mbid": "8d73e45e-7ca1-3cb4-ae28-6da76196c17c", "yt_id": "XN7iEFVLf5c", "rym": "https://rateyourmusic.com/release/album/the-clash/london-calling-8/", "genres": ["punk", "punk rock", "new wave", "ska", "rockabilly", "rock"], "desc_lfm_album": "\"London Calling\" is the third album by English punk rock band The Clash, released 14 December 1979, on CBS Records in the UK and in January 1980 on Epic Records in the United States. The album represented a change in The Clash's musical style, and featured elements of ska, pop, soul, rockabilly and reggae more prominently than in their previously released music. The album's subject matter included unemployment, racial conflict, drug use, and the responsibilities of adulthood. The album's cover was photographed by Pennie Smith and designed by Lowry. It was a homage to the design of Elvis Presley's debut .", "desc_lfm_artist": "The Clash was an English punk band from London, England, active from 1976 to 1985. One of the most successful and iconic bands from the first wave of punk in the 70s, they incorporated rock and roll, reggae, rockabilly, and many other music styles into their repertoire. They were legendary for their uncommonly intense stage performances.\n\nFrom their earliest days as a band, The Clash stood apart from their peers with their musicianship as well as their lyrics", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 2, "title": "The Wall", "artist": "Pink Floyd", "year": 1979, "cover": " cover": "https://dn711104.ca.archive.org/0/items/mbid-4b77b7c9-f6c7-4b5f-b07b-984786b24c00/mbid-4b77b7c9-f6c7-4b5f-b07b-984786b24c00-1261411302.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6379-public-image-limited-metal-box.php", "aoty_critic_score": 93, "aoty_user_score": 80, "mbid": "57209d3f-f3ef-34db-82a7-ad633497b784", "yt_id": "ZsxHzaPBBjM", "rym": null, "genres": ["experimental rock", "avant-garde", "post-punk", "dub", "punk", "dance"], "desc_lfm_album": "Metal Box is the second studio album by Public Image Ltd, released by Virgin Records on 23 November 1979. The album takes its name from the round metal canister which contained the initial pressings of the record. It was later reissued in standard vinyl packaging as Second Edition in February 1980 by Virgin Records in the United Kingdom, and by Warner Bros. Records and Island Records in the United States. The album was a departure from PiL's 1978 debut First Issue, with the band moving into a more avant-garde sound characterised by John Lydon's cryptic lyrics, propulsive dub-inspired rhythms led .", "desc_lfm_artist": "Public Image Ltd. (aka PiL), is a post-punk band which formed in 1978 in London, England. Its original lineup was John Lydon (vocals) (formerly of the Sex Pistols), Keith Levene (guitar) and Jah Wobble (bass), although by 1983, the band's lineup would become a fluctuating one, revolving around Lydon. PiL are often cited as one of the most challenging and innovative bands of the post-punk period; John Lydon is quoted as saying he wanted to form an anti-rock band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 4, "title": "Tusk", "artist": "Fleetwood Mac", "year": 1979, "cover": "https://dn710700.ca.archive.org/0/items/mbid-5645cc19-414c-4851-800b-c3d4fffd6f45/mbid-5645cc19-414c-4851-800b-c3d4fffd6f45-6917484588.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7044-fleetwood-mac-tusk.php", "aoty_critic_score": 91, "aoty_user_score": 80, "mbid": "22deeac8-6009-31ad-a069-26e85d246412", "yt_id": "_MeElAZ4t5k", "rym": "https://rateyourmusic.com/release/album/fleetwood-mac/tusk", "genres": ["experimental rock", "country rock", "art rock", "pop rock", "soft rock", "dream pop"], "desc_lfm_album": "More than any other Fleetwood Mac album, Tusk is born of a particular time and place -- it could only have been created in the aftermath of Rumours, which shattered sales records, which in turn gave the group a blank check for its next album. But if they were falling apart during the making of Rumours, they were officially broken and shattered during the making of Tusk, and that disconnect between bandmembers resulted in a sprawling, incoherent, and utterly brilliant 20-track double album. At the time of its release, it was a flop, never reaching the top of the charts .", "desc_lfm_artist": "Fleetwood Mac are a British-American rock band, formed in London in 1967. Fleetwood Mac was founded by guitarist Peter Green, drummer Mick Fleetwood and guitarist Jeremy Spencer, before bassist John McVie joined the lineup for their self-titled debut album. Danny Kirwan joined as a third guitarist in 1968. Keyboardist Christine Perfect (later known as Christine McVie), who contributed as a session musician from the second album, married McVie and joined in 1970.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 5, "title": "Entertainment!", "artist": "Gang of Four", "year": 1979, "cover": "https://dn710105.ca.archive.org/0/items/mbid-844c0de9-d040-492b-af05-6ae2f8f6bcf5/mbid-844c0de9-d040-492b-af05-6ae2f8f6bcf5-43109848254.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6303-gang-of-four-entertainment.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "d0493944-992b-3534-9174-8320c1879837", "yt_id": "ee_HrbO9xfI", "rym": "https://rateyourmusic.com/release/album/gang-of-four/entertainment", "genres": ["post-punk", "art punk", "punk", "punk rock", "dance-punk", "rock"], "desc_lfm_album": "Entertainment! is Gang of Four's debut LP, released in 1979. As a so-called post-punk record, it exhibits a tendency in bands from their time to take the then nascent punk rock style and experiment with its manifestations. This is definitely not a typical punk record in the sense of The Ramones' quick pop riffing or The Velvet Underground's too-cool to care attitude; Gang of Four's particular twist on the punk sound featured here used generally quick tempos as usual, but a different rhythmic attack with angular, sharp chords that stabbed into the music with staccato accents against a funkier, jammier .", "desc_lfm_artist": "Gang of Four is an English post-punk band formed in Leeds, England in 1976. Original personnel were singer Jon King, guitarist Andy Gill, bass guitarist Dave Allen and drummer Hugo Burnham. They were fully active from 1977 to 1984, and then re-emerged twice in the 1990s with King and Gill. In 2005, the original lineup reunited.\n\nThe group had a single in the British Top 60 with \"At Home He's A Tourist\" in 1979, which was blacklisted by Top Of The Pops for its use of the relatively innocuous term \"rubbers\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 6, "title": "Solid State Survivor", "artist": "Yellow Magic Orchestra", "year": 1979, "cover": "https://dn721905.ca.archive.org/0/items/mbid-5f9db705-bb08-4001-a028-35ebd953fb8c/mbid-5f9db705-bb08-4001-a028-35ebd953fb8c-7896816763.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16642-yellow-magic-orchestra-solid-state-survivor.php", "aoty_critic_score": 83, "aoty_user_score": 83, "mbid": "0b232453-8666-361f-b1db-2578fc4a9f97", "yt_id": "Wmed0gmwzKY", "rym": "https://rateyourmusic.com/release/album/yellow-magic-orchestra/solid-state-survivor", "genres": ["synth-pop", "electropop", "disco", "electro-disco", "hi-nrg", "j-pop"], "desc_lfm_album": "", "desc_lfm_artist": "Yellow Magic Orchestra (YMO) was an influential Japanese electronic music band, formed in 1978. They are renowned as a major influence in popular music, and for pioneering the synth-pop genre. The principal members are Haruomi Hosono  (bass), Yukihiro Takahashi  (1952-2023, drums) and Ryuichi Sakamoto  (1952-2023, keyboards).\n\nThe band was originally conceived as a one-off studio project by Hosono, the other two members being recruited session musicians", "desc_mb_album": "", "desc_mb_artist": "In 1984, Hosono, Sakamoto and Takahashi decided stop working together as '''[http://musicbrainz.org/artist/ac5af671-1df0-4312-8b7b-e61992ecc883.html?short=0|Yellow Magic Orchestra]''', deciding to return to their solo careers, though they each would occasionally join one of the other two in concert as a guest performer.  Though they stopped playing together, however, they were careful to not officially 'break up' the group, instead using a Japanese term meaning \"spreading out\". \r\n\r\nIn 1993, the trio briefly reunited for [http://musicbrainz.org/release-group/0f41dd55-6579-3c4d-9c28-9a0fc3e420bf.html|Technodon].  However, to avoid lawsuits and to avoid ending the \"Yellow Magic Orchestra is spreading out\" status of the group, that album was credited it to '''[http://musicbrainz.org/artist/e22", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 7, "title": "154", "artist": "Wire", "year": 1979, "cover": "https://ia903405.us.archive.org/23/items/mbid-904ee2f5-26e1-4513-b9b0-c8c98926c94f/mbid-904ee2f5-26e1-4513-b9b0-c8c98926c94f-39959185225.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6049-wire-154.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "30e3a3dc-f544-3bc0-b574-c680cfeb64fe", "yt_id": "aulVyCui5ss", "rym": "https://rateyourmusic.com/release/album/wire/154", "genres": ["avant-garde", "post-punk", "art punk"], "desc_lfm_album": "154 is the third studio album by the English post-punk band Wire, released in 1979 on EMI imprint Harvest Records in the UK and Europe and Warner Bros. Records in America. Branching out even further from the minimalist punk rock style of their earlier work, 154 is considered a progression of the sounds displayed on Wire's previous album Chairs Missing, with the group experimenting with slower tempos, fuller song structures and a more prominent use of guitar effects, synthesizers and electronics. The album is so named because the band had played 154 gigs in their career at the time of .", "desc_lfm_artist": "Wire is an English post-punk band formed in 1976 in Watford, England and after splitting in 1980, have reformed three times. They consist of Colin Newman (vocals, guitar), Graham Lewis (vocals, bass) and Robert Gotobed (drums). Founding guitarist Bruce Gilbert left in 2004. In 2008, Margaret Fielder McGinnis of Laika joined the band as their touring guitarist, but as of 2010 has been replaced by Matt Simms.\n\nWire's debut album, Pink Flag (1977), contains songs which are diverse in mood and style", "desc_mb_album": "", "desc_mb_artist": "\"Wir\" was the name the band \"Wire\" used temporarily after one of the members, Robert Gotobed, had left the band in 1991.", "heard_by": ["MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 8, "title": "Drums and Wires", "artist": "XTC", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5882-drums-and-wires.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5882-xtc-drums-and-wires.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "b2b0f57f-2caf-31b4-a2b1-ad245c3c7af2", "yt_id": "N66oJVIjk2M", "rym": "https://rateyourmusic.com/release/album/xtc/drums-and-wires", "genres": ["pop rock", "post-punk", "new wave", "zolo"], "desc_lfm_album": "XTC's third album, Originally released in 1979 after Barry Andrews left the band. This is Dave Gregory's first record with XTC. .", "desc_lfm_artist": "XTC were an English post-punk band formed in Swindon, England in 1972, led by Andy Partridge (guitars, vocals) and  Colin Moulding (bass, vocals). Active between the late 1970s and the mid 2000s, XTC's music ranged from jerky new wave/punk riffs to lushly-arranged progressive pop. They also drew heavily from vintage pop rock and psychedelia from the 1960s, genres which they began to explore more deeply after creating The Dukes of Stratosphear side-project.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 9, "title": "Off the Wall", "artist": "Michael Jackson", "year": 1979, "cover": "https://ia800204.us.archive.org/25/items/mbid-6258e39d-bef4-4d5a-a654-440cf4c4c29a/mbid-6258e39d-bef4-4d5a-a654-440cf4c4c29a-5349015874.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6267-michael-jackson-off-the-wall.php", "aoty_critic_score": 99, "aoty_user_score": 89, "mbid": "ee749c63-5699-38e0-b565-7e84414648d9", "yt_id": "kbwt8E-pPEU", "rym": "https://rateyourmusic.com/release/album/michael-jackson/off-the-wall-11", "genres": ["soul", "r&b", "funk", "disco", "ballad", "contemporary r&b"], "desc_lfm_album": "\"Off the Wall\" is the fifth studio album by the American recording artist Michael Jackson, released August 10, 1979 on Epic Records, after Jackson's critically well received film performance in The Wiz. While working on that project, Jackson and Quincy Jones had become friends, and Jones agreed to work with Jackson on his next studio album. Recording sessions took place between December 1978 and June 1979 at Allen Zentz Recording, Westlake Recording Studios, and Cherokee Studios in Los Angeles, California. Jackson collaborated with a number of other writers and performers such as Paul McCartney, Stevie Wonder and Rod Temperton. Five .", "desc_lfm_artist": "Michael Joseph Jackson (August 29, t and keyboardist Jerry Harrison. The band is often associated with the development of new wave music, combining elements of punk rock, art rock, funk, and world music with a distinctive visual and artistic style.\n\nDavid Byrne, Chris Frantz, and Tina Weymouth met while studying at the Rhode Island School of Design", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 11, "title": "Rust Never Sleeps", "artist": "Neil Young & Crazy Horse", "year": 1979, "cover": "https://dn711201.ca.archive.org/0/items/mbid-c5b00a6e-48e0-4eb3-b3c7-93a532f97554/mbid-c5b00a6e-48e0-4eb3-b3c7-93a532f97554-9407698409.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12872-neil-young-and-crazy-horse-rust-never-sleeps.php", "aoty_critic_score": 100, "aoty_user_score": 85, "mbid": "a710c7c7-46e6-36ca-9c3c-87c8e79f8daf", "yt_id": "kIYFrRY0B9I", "rym": "https://rateyourmusic.com/release/album/neil-young-crazy-horse/rust-never-sleeps", "genres": ["folk rock", "country rock", "hard rock", "acoustic rock"], "desc_lfm_album": "Rust Never Sleeps is a live album by Canadian singer-songwriter Neil Young, featuring his backing band Crazy Horse. It was released on June 22, 1979, by Reprise Records. .", "desc_lfm_artist": "Canadian singer and songwriter Neil Young includes his personal garage band Crazy Horse (\"second best backing band in the world\") to make raw and unpolished rock. Their gritty style of rock has influenced countless artists and music styles.\n\nCrazy Horse is best known for its long association with Young, despite having released five albums of its own over a 19-year span. It has been co-credited with Young as Neil Young and Crazy Horse on 15 albums, \"Americana\" and \"Psychedelic Pill\" from 2012 being the latest.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 12, "title": "Unknown Pleasures", "art 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/48984-i-am_041939.jpg", "aoty_url": "https://www.albumoftheyear.org/album/48984-earth-wind-fire-i-am.php", "aoty_critic_score": 60, "aoty_user_score": 81, "mbid": "866e9d8e-200e-334c-8df6-9b8f8384bb22", "yt_id": "8s_ynRnxT9E", "rym": "https://rateyourmusic.com/release/album/earth-wind-and-fire/i-am", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Earth, Wind & Fire (EW&F or EWF) is an American band whose music spans the genres of jazz, R&B, soul, funk, disco, pop, Latin, and Afro-pop. They are among the best-selling bands of all time, with sales of over 90 million records worldwide. The band was formed in Chicago by Maurice White in 1969, growing out of the Salty Peppers. Prominent members have included Verdine White, Philip Bailey, Ralph Johnson, Larry Dunn, Al McKay, Roland Bautista, Robert Brookins, Sonny Emory, Fred Ravel, Ronnie Laws, Sheldon Reynolds, and Andrew Woolfolk.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 14, "title": "Discovery", "artist": "Electric Light Orchestra", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29645-discovery_131110.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29645-electric-light-orchestra-discovery.php", "aoty_critic_score": 62, "aoty_user_score": 80, "mbid": "e4f25e55-94d2-3037-a826-b3610490ea2d", "yt_id": "eKkieWVvvNE", "rym": null, "genres": [], "desc_lfm_album": "Discovery is the eighth studio album by the English rock band Electric Light Orchestra (ELO). It was released on 1 June 1979 in the United Kingdom by Jet Records, where it topped record charts, and on 8 June in the United States on Jet through Columbia Records distribution. A music video album featuring all the songs being played by the band was then released on VHS in 1979, then re-released as part of the Out of the Blue: Live at Wembley DVD and VHS in 1998. Background Discovery was the band's first number 1 album in the UK, entering the .", "desc_lfm_artist": "The Electric Light Orchestra, or ELO, was an English symphonic rock band which formed in Birmingham, Warwickshire in 1970. The band was formed by Jeff Lynne (vocals, guitar, multiple instruments), Roy Wood (multiple instruments, vocals), Richard Tandy (keyboards, vocals) and Bev Bevan (drums). Lynne, Wood and Bevan were former members of the psychedelic rock band The Move. The band's lineup would fluctuate throughout its original incarnation, although Lynne, Tandy and Bevan would remain constant members.", "desc_mb_album": "", "desc_mb_artist": "'''Group members over the years'''\r\n\r\n'''First Line Up'''\r\nJeff Lynne, Roy Wood, Bev Bevan, Steve Woolam, Bill Hunt\r\n\r\n'''Second Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Michael De Albuquerque, Wilf Gibson, Colin Walker, Mike Edwards\r\n\r\n'''Third Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Hugh McDowell, Melvyn Gale\r\n\r\n'''Fourth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Louis Clark, Dave Morgan\r\n\r\n'''Fifth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 15, "title": "Casiopea", "artist": "Casiopea", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/98553-casiopea-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/98553-casiopea-casiopea.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "98db9f50-f730-3c22-a20a-0c9fbb434cd5", "yt_id": "WxVocjklWGY", "rym": "https://rateyourmusic.com/release/album/casiopea/casiopea", "genres": [], "desc_lfm_album": "Casiopea is the debut album of the jazz fusion group Casiopea which was recorded between 1978-1979 and released later that year. The cover depicts two racecars racing each other on a raceway. Recorded between December 1978 and March 1979 in Japan, \"Casiopea\" is Casiopea's self-titled debut album. The album includes the participation of some notable contemporary jazz players such as David Sanborn on the saxophone, giving a special touch to Issei Noro's compositions. Tunes like Black Joke are part of the multiple performances and variances along Casiopea's career. This album was recorded on LP in 1979 as ALR-6017 and years .", "desc_lfm_artist": "Casiopea/カシオペア are a Japanese jazz fusion band that was formed in 1976 by guitarist Issei Noro and bassist Tetsuo Sakurai. In 1977, keyboardist Minoru Mukaiya and drummer Takashi Sasaki joined the group. The group debuted with the album Casiopea in 1979, and 30 albums or more have since been released. In 1980, the drummer seat is replaced by 神保彰/Akira Jimbo.\n\nThe album Eyes of the Mind was released in the United States in 1981. They then released the album Mint Jams in 1982", "desc_mb_album": "", "desc_mb_artist": "The group was called CASIOPEA from 1979 to 2012. In 2012, the group renamed itself to CASIOPEA 3rd to reflect the changed composition of the band.", "heard_by": ["MaxtorUwU", "Rocky_stereo"]}, {"n": 16, "title": "カシオペア [Casiopea]", "artist": "Casiopea", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/836235--casiopea_224305.jpg", "aoty_url": "https://www.albumoftheyear.org/album/836235-casiopea--casiopea.php", "aoty_critic_score": 87, "aoty_user_score": null, "mbid": null, "yt_id": "z3wYYuvr21E", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Casiopea/カシオペア are a Japanese jazz fusion band that was formed in 1976 by guitarist Issei Noro and bassist Tetsuo Sakurai. In 1977, keyboardist Minoru Mukaiya and drummer Takashi Sasaki joined the group. The group debuted with the album Casiopea in 1979, and 30 albums or more have since been released. In 1980, the drummer seat is replaced by 神保彰/Akira Jimbo.\n\nThe album Eyes of the Mind was released in the United States in 1981. They then released the album Mint Jams in 1982", "desc_mb_album": "", "desc_mb_artist": "The group was called CASIOPEA from 1979 to 2012. In 2012, the group renamed itself to CASIOPEA 3rd to reflect the changed composition of the band.", "heard_by": []}, {"n": 17, "title": "Bad Girls", "artist": "Donna Summer", "year": 1979, "cover": "https://dn711201.ca.archive.org/0/items/mbid-ccc73b94-e531-4807-b9e0-885dbb82c621/mbid-ccc73b94-e531-4807-b9e0-885dbb82c621-19879143495.jpg", "aoty_url": "https://www.albumoftheyear.org/album/52884-donna-summer-bad-girls.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "f7568cc7-4c09-3a47-abbc-593e7aaac7d6", "yt_id": "nhyUICuE65Y", "rym": "https://rateyourmusic.com/release/album/donna-summer/bad-girls", "genres": ["dance", "synth-pop", "disco", "electro-disco", "pop soul", "house"], "desc_lfm_album": "Bad Girls is the eighth album by Donna Summer and her third consecutive double album. It was released in 1979 by Casablanca Records, who had had been distributing her work in the U.S. since 1975, and had more or less had full control over distributing her work worldwide since 1977. By the time Bad Girls was released, Summer felt that Casablanca were exploiting her. Since the release of her breakthrough, the sexually explicit \"Love to Love You Baby\", Summer had been named \"the first lady of love\" and her record label were keen for her to keep this image up, .", "desc_lfm_artist": "LaDonna Adrian Gaines (December 31, 1948 – May 17, 2012), known professionally as Donna Summer, was an American singer, songwriter, and actress. She gained prominence during the disco era of the 1970s and became known as the \"Queen of Disco\", while her music gained a global following.\n\nSummer was one of seven children raised by devout Christian parents. She sang in church, and in her teens joined a funk group called The Crow, so named because Donna was the only black member of the group.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 18, "title": "Voulez-Vous", "artist": "ABBA", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/20968-voulez-vous_064735.jpg", "aoty_url": "https://www.albumoftheyear.org/album/20968-abba-voulez-vous.php", "aoty_critic_score": 65, "aoty_user_score": 80, "mbid": "7401fb97-46e6-32cd-bd59-6c49debaa3ae", "yt_id": "eCPHJHqvxmM", "rym": null, "genres": [], "desc_lfm_album": "Voulez-Vous means “Do You Want” in French, and is typically used suggestively in English. The song was released in 1979 in Stockholm. It is a vibrant strong rock pop record. .", "desc_lfm_artist": "ABBA were a Swedish pop group formed in Stockholm in  1972 by Agnetha Fältskog, Björn Ulvaeus, Benny Andersson, and Anni-Frid Lyngstad. The group's name is an acronym of the first letters of their first names. They became one of the most commercially successful acts in the history of popular music, topping the charts worldwide from 1974 to 1982. ABBA won the Eurovision Song Contest 1974 at The Dome in Brighton, UK, giving Sweden its first triumph in the contest. They are the most successful group to have taken part in the competition.", "desc_mb_album": "", "desc_mb_artist": "Swedish group. Most of the songs were written by Benny Andersson and Björn Ulvaeus, and sometimes Stig Anderson.\n\nThere have been 7 known masters of the original studio recordings:\n    1. Original releases (1974–1981)\n    2. CD releases (1982–1992)\n    3. ABBA Gold and Thank You for the Music Box Set (1992–1994), remastered by Michael B. Tretow\n    4. Remastered releases (1997), remastered by Jon Astley and Tim Young.\n    5. Remastered releases (2001), when Jon Astley revisited his earlier remasters, and fixed some errors.\n    6. Remastered releases (2005), made by Henrik Jonsson. Featured on “The Complete Studio Recordings” and “The Albums” box sets.\n    7. Remastered releases (2005–), feature on the Deluxe albums. Some of these albums use the same remasters as the previous two box sets, ", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 19, "title": "Overkill", "artist": "Motörhead", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10506-overkill.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10506-motorhead-overkill.php", "aoty_critic_score": 88, "aoty_user_score": 80, "mbid": "9995e2f0-aaf2-39e1-8b3e-f2a40540d6a2", "yt_id": "M_X6lE6TF2o", "rym": "https://rateyourmusic.com/release/album/motorhead/overkill", "genres": [], "desc_lfm_album": "Overkill is the second album released by Motörhead, in 1979, and their first for Bronze Records. It peaked at number 24 on the UK charts. It had a big impact in the British punk culture of that time, paving the way for UK82. Kerrang! magazine listed the album at No. 46 among the \"100 Greatest Heavy Metal Albums of All Time\". .", "desc_lfm_artist": "Motörhead was an English rock band formed in London in 1975 by bassist and lead vocalist Lemmy Kilmister, guitarist Larry Wallis, and drummer Lucas Fox. Kilmister was the primary songwriter and the only constant member. The band is often considered a precursor to the new wave of British heavy metal, which re-energized heavy metal in the late 1970s and early 1980s. Several guitarists and drummers played in Motörhead, but most of their best-selling", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "armandwave", "sdecandelario"]}, {"n": 20, "title": "Breakfast in America", "artist": "Supertramp", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15563-breakfast-in-america_205632.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15563-supertramp-breakfast-in-america.php", "aoty_critic_score": 75, "aoty_user_score": 84, "mbid": "d584f7e7-55b4-39a1-87e9-af3b86773132", "yt_id": "5eXOXc9Q4oA", "rym": "https://rateyourmusic.com/release/album/supertramp/breakfast-in-america", "genres": ["art rock", "pop rock", "progressive rock", "art pop", "progressive pop", "soft rock"], "desc_lfm_album": "With Breakfast in America, Supertramp had a genuine blockbuster hit, topping the charts for four weeks in the U.S. and selling millions of copies worldwide; by the 1990s, the album had sold over 18 million units across the world. Although their previous records had some popular success, they never even hinted at the massive sales of Breakfast in America. Then again, Supertramp's earlier records weren't as pop-oriented as Breakfast. The majority of the album consisted of tightly written, catchy, well-constructed pop songs, like the hits \"The Logical Song,\" \"Take the Long Way Home,\" and \"Goodbye Stranger.\" Supertramp still had a .", "desc_lfm_artist": "Supertramp is a British group playing a mix of progressive rock and pop rock that notably had a series of top-selling albums in the 70s, producing several hit singles. The band was formed in the United Kingdom in 1969. All the group's members were musicians capable of playing multiple types of instruments, including brass and woodwinds. Co-founder, composer and lead singer, Roger Hodgson left the band in 1983 to bring up his children. In 1988, Supertramp re-formed with some former members plus several new ones, and they continue to tour.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 21, "title": "Ambient 1: Music for Airports", "artist": "Brian Eno", "year": 1978, "cover": "https://dn710704.ca.archive.org/0/items/mbid-b3060207-bdec-393a-bd9c-165e0300e6e7/mbid-b3060207-bdec-393a-bd9c-165e0300e6e7-1590672776.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "5fdd6ba8-83c1-3a87-b378-d5f61dec5ddd", "yt_id": "vNwYtllyt3Q", "rym": "https://rateyourmusic.com/release/album/brian-eno/ambient-1-music-for-airports/", "genres": [], "desc_lfm_album": "This release features all four tracks from Brian Eno's Ambient 1: Music for Airports LP played on classical instruments (cello, bass, piano, guitar, clarinet and percussion) performed by Bang On A Can. Recorded at Avatar & Looking Glass Studios, NYC, August 1997. Mixed at Looking Glass Studios. Mastered at Masterdisk. .", "desc_lfm_artist": "Brian Peter George Eno (b. 15 May 1948) is an English musician, record producer, visual artist, and theorist best known for his pioneering work in ambient music and contributions to rock, pop, and electronica. A self-described \"non-musician\", Eno has helped introduce unique conceptual approaches and recording techniques to contemporary music. He has been described as one of popular music's most influential and innovative figures.\n\nBorn in Suffolk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 22, "title": "Grasa de Las Capitales", "artist": "Serú Girán", "year": 1979, "cover": "https://cdn2.albumoftheyear.org/600x0/album/166267-la-grasa-de-las-capitales-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/166267-seru-giran-grasa-de-las-capitales.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": "2e02ae17-685a-3b9e-b9bf-55294ea22447", "yt_id": "Zm6Qzilw5Cs", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Progressive rock band from Buenos Aires, Argentina formed in 1977 by Charly García, guitarist David Lebón, bassist Pedro Aznar, and drummer Oscar Moro. Widely regarded as the most talented group of rock musicians Argentina produced in the late 70's and early 80's, to the point they were dubbed \"The Argentinean Beatles\" by fans and critics alike.\n\nAfter leaving La Máquina De Hacer Pájaros, García moved to Brazil to start his new project. In 1978, \"Serú Girán\" was released after recording sessions in São Paulo and Los Angeles, U.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave"]}, {" /YWdlcy9SLTg4NDYz/NS0xMjEwMjU3Nzg4/LmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/15832-rush-hemispheres.php", "aoty_critic_score": 70, "aoty_user_score": 84, "mbid": "484f8923-454e-3efa-8234-9d1b1f296cc8", "yt_id": "fMoHes_BChQ", "rym": "https://rateyourmusic.com/release/album/rush/hemispheres", "genres": ["classic rock", "hard rock", "progressive rock"], "desc_lfm_album": "Hemispheres is the sixth studio album by the Canadian rock band Rush, released in 1978. The album was recorded at Rockfield Studios in Wales. This album continues Rush's trend of using the fantasy and science fiction lyrics written by Neil Peart. Similar to their 1976 release, 2112, Hemispheres contains a single, epic song broken into chapters as the first half of the album (Cygnus X-1, Book II: Hemispheres) while the second half contains two more conventionally-executed tracks (\"Circumstances\", \"The Trees\"), then is rounded out by the nine-and-a-half-minute instrumental, \"La Villa Strangiato\". Side one: Hemispheres Though science fiction elements are not .", "desc_lfm_artist": "Rush is a Canadian rock band formed in Toronto in 1968. The original lineup consisted of guitarist Alex Lifeson, drummer John Rutsey, and bassist and vocalist Jeff Jones, who was soon replaced by Geddy Lee. Over the next six years, the band underwent several lineup changes before establishing its classic power trio with the addition of Neil Peart in July 1974, replacing Rutsey shortly after the release of their self-titled debut album. This lineup of Lifeson, Lee, and Peart remained stable until 2015, when Peart retired from music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "Rocky_stereo", "sdecandelario"]}, {"n": 26, "title": "Thousand Knives of Ryuichi Sakamoto", "artist": "坂本龍一 [Ryuichi Sakamoto]", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/51192-thousand-knives-of-ryuichi-sakamoto_221502.jpg", "aoty_url": "https://www.albumoftheyear.org/album/51192--ryuichi-sakamoto-thousand-knives-of-ryuichi-sakamoto.php", "aoty_critic_score": 71, "aoty_user_score": 81, "mbid": null, "yt_id": "rGo7n6CMCcE", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 27, "title": "52nd Street", "artist": "Billy Joel", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/24483-52nd-street_214431.jpg", "aoty_url": "https://www.albumoftheyear.org/album/24483-billy-joel-52nd-street.php", "aoty_critic_score": 70, "aoty_user_score": 82, "mbid": "54e6b4a1-7a6a-3ead-b032-0912cfd49a1e", "yt_id": "-Yj0i3XyQi0", "rym": "https://rateyourmusic.com/release/album/billy-joel/52nd-street", "genres": [], "desc_lfm_album": "52nd Street is the sixth studio album by American singer-songwriter Billy Joel, released on October 13, 1978. It was the first of four Joel albums to top the Billboard charts and earned him two Grammys (for a total of four). It was also the first ever music CD to be commercialized. Three songs reached the Top 40 in the United States, contributing to the album's success: \"My Life\" (#3), \"Big Shot\" (#14), and \"Honesty\" (#24). It was similarly well received by critics, earning the 1979 Grammy for Album of the Year. This Grammy was presented to its producer, Phil Ramone. .", "desc_lfm_artist": "William Martin Joel (born May 9, 1949) is an American singer, songwriter, and pianist. He is known by the nickname “Piano Man”, derived from his 1973 song of the same name, and has maintained a career as a solo artist since the 1970s. Between 1971 and 1993 he released 12 studio albums in the pop and rock genres, followed by a studio album of classical compositions in 2001. With global record sales exceeding 160 million, he is among the best-selling", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 28, "title": "Mignonne", "artist": "大貫妙子 [Taeko Ōnuki]", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/86607-mignonne_221859.jpg", "aoty_url": "https://www.albumoftheyear.org/album/86607--taeko-nuki-mignonne.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": null, "yt_id": "8mzSZzVx33I", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 29, "title": "Siembra", "artist": "Willie Colón", "year": 1978, "cover": "https://dn710609.ca.archive.org/0/items/mbid-cb7deac0-fc66-4e8a-882f-6065ef939561/mbid-cb7deac0-fc66-4e8a-882f-6065ef939561-11479278247.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6668-willie-colon-ruben-blades-siembra.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "0efd12a2-2d31-3fa8-a76c-5f8af6613fca", "yt_id": "t7CtO8HHu0c", "rym": "https://rateyourmusic.com/release/album/willie-colon-and-ruben-blades/siembra/lists/1", "genres": ["latin", "salsa"], "desc_lfm_album": "Siembra is the second studio album by Panamanian singer and songwriter Rubén Blades and Puerto Rican-American trombonist Willie Colón. It was released through Fania Records on 7 September 1978. It is considered the best selling salsa album in the history of salsa music. Was recorded by Jerry Masucci and Johnny Pacheco at the La Tierra Sound Studios between 1977 and 1978. Siembra is the second of four collaborative duo albums produced by Rubén Blades and Willie Colón. During its time, it was the best-selling salsa record in history. It has sold over three million copies worldwide, and almost all of .", "desc_lfm_artist": "Willie Colón (born William Anthony Colón Román in New York City on 28 April 1950; died 21 February 2026) was an American musician and social activist remembered as a pioneer of salsa music. In September 2004, Colón received the Lifetime Achievement Award from The Latin Recording Academy. In 2015 Billboard magazine named Willie Colón one of the 30 most influential Latin Artists of All Time. \n\nColón began his career as a trombonist but also sang, wrote, produced and acted.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 30, "title": "Parallel Lines", "artist": "Blondie", "year": 1978, "cover": "https://ia800809.us.archive.org/21/items/mbid-b969aa80-8b4c-42aa-8df9-2bd1b20ee535/mbid-b969aa80-8b4c-42aa-8df9-2bd1b20ee535-41049619288.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6164-blondie-parallel-lines.php", "aoty_critic_score": 93, "aoty_user_score": 82, "mbid": "0c1a4d70-5926-3ae8-aa25-466fe65639fe", "yt_id": "6Phbb2O1icY", "rym": "https://rateyourmusic.com/release/album/blondie/parallel-lines-8", "genres": ["pop rock", "new wave"], "desc_lfm_album": "Parallel Lines is the third studio album by American rock band Blondie, produced by Australian Mike Chapman and released on September 8, 1978, by Chrysalis Records. An instant critical and commercial success, the album reached No. 1 on the UK Albums Chart in February 1979 and proved to be the band's commercial breakthrough in the United States, where it reached No. 6 on the Billboard 200 in April 1979. It includes the singles \"Hanging On The Telephone\", \"Sunday Girl\", \"Heart Of Glass\", \"Picture This\", \"I'm Gonna Love You Too\" and \"One Way Or Another\" making this a veritable mini-greatest-hits collection. .", "desc_lfm_artist": "Blondie is an American rock band founded in New York City in 1974 by singer-songwriter Deborah Harry and guitarist Chris Stein. The band was a pioneer in the early American new wave and punk scenes of the mid-70s, developing their sound in famous NYC clubs such as CBGBs. With hits such as \"Atomic\", \"Call Me\". \"Heart of Glass\", and \"Maria\" as well as sales of over 40 million records worldwide, they were inducted into the Rock and Roll Hall of Fame in 2006.", "desc_mb_album": "Chris Stein also credited for playing 12 string guitar and ebow on the album", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 31, "title": "Q: Are We Not Men? A: We Are Devo!", "artist": "DEVO", "year": 1978, "cover": "https://ia803403.us.archive.org/14/items/mbid-ac5e2d19-f8f2-43a0-8830-170f2e09677d/mbid-ac5e2d19-f8f2-43a0-8830-170f2e09677d-6453898327.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "60a754f9-50e1-346a-97db-925a1e2ad7e0", "yt_id": "a8UcpmUQkNU", "rym": "https://rateyourmusic.com/release/album/devo/q-are-we-not-men-a-we-are-devo", "genres": ["art rock", "post-punk", "art punk", "punk rock", "new wave", "zolo"], "desc_lfm_album": "Q: Are We Not Men? A: We Are Devo! is the debut studio album by the American new wave band Devo. It was originally released in August 1978, on the labels Warner Bros., and Virgin. Produced by Brian Eno, the album was recorded over a period of four months between October 1977 and February 1978, primarily in Cologne, Germany, The album received somewhat mixed reviews from critics and peaked at number 12 on the UK Albums Chart and number 78 on the U.S. Billboard chart. Recent reviews of the album have been more uniformly positive, and the album has charted .", "desc_lfm_artist": "Devo are an American new wave band formed in Akron, Ohio in 1972. The band split in 1991 and returned in 1996. The band currently consists of Gerald Casale (vocals, bass), Mark Mothersbaugh (vocals, synthesizer), Bob Mothersbaugh (guitar), and Josh Freese (drums). Former members include Bob Casale (guitar, keyboards) (born July 14, 1952; died February 17, 2014) and Alan Myers (drums) (born 1955; died 2013). The band released their first album in 20 years, Something for Everybody on June 15, 2010.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 32, "title": "Chairs Missing", "artist": "Wire", "year": 1978, "cover": "https://dn721808.ca.archive.org/0/items/mbid-51c51799-84aa-4fec-bd37-6319963b21f9/mbid-51c51799-84aa-4fec-bd37-6319963b21f9-39959233147.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6048-wire-chairs-missing.php", "aoty_critic_score": 95, "aoty_user_score": 83, "mbid": "3e60a576-5bd0-3028-a0db-558c4a9845c7", "yt_id": "uXY-wTLbVW4", "rym": "https://rateyourmusic.com/release/album/wire/chairs-missing", "genres": ["experimental rock", "post-punk", "art punk", "new wave"], "desc_lfm_album": "Chairs Missing is the second album by the British band Wire. It was released in 1978. Although it shares a punk-derived \"outsider\" voice with the band's debut, Pink Flag, it features more developed song structure (taking some cues from 70's prog-rock, psychedelia and art rock) and a broader palette of emotional and intellectual subject matter. The album was produced by Mike Thorne, who added keyboard and synthesizer elements (compare the versions of Outdoor Miner; with and without the piano accompaniment), which were later expanded upon by the band members on their later releases. These contributions add to the album's identification .", "desc_lfm_artist": "Wire is an English post-punk band formed in 1976 in Watford, England and after splitting in 1980, have reformed three times. They consist of Colin Newman (vocals, guitar), Graham Lewis (vocals, bass) and Robert Gotobed (drums). Founding guitarist Bruce Gilbert left in 2004. In 2008, Margaret Fielder McGinnis of Laika joined the band as their touring guitarist, but as of 2010 has been replaced by Matt Simms.\n\nWire's debut album, Pink Flag (1977), contains songs which are diverse in mood and style", "desc_mb_album": "", "desc_mb_artist": "\"Wir\" was the name the band \"Wire\" used temporarily after one of the members, Robert Gotobed, had left the band in 1991.", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 33, "title": "BRASILIAN SKIES", "artist": "高中正義 [Masayoshi Takanaka]", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/423517-brasilian-skies_162107.jpg", "aoty_url": "https://www.albumoftheyear.org/album/423517-masayoshi-takanaka-brasilian-skies.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": null, "yt_id": "g8u3ff8dNjk", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["Rocky_stereo"]}, {"n": 34, "title": "Lanquidity", "artist": "Sun Ra", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18732-lanquidity_011225.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18732-sun-ra-lanquidity.php", "aoty_critic_score": 75, "aoty_user_score": 84, "mbid": "8c575926-9dd6-3ac8-bcce-c6e096507061", "yt_id": "238Dh6N9GLg", "rym": "https://rateyourmusic.com/release/album/sun-ra/lanquidity", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Sun Ra (1914 – 1993) was an innovative jazz composer, bandleader, piano and synthesiser player, who came to be known as much for his Cosmic Afro-futurist Philosophy as for his phenomenal musical compositions and performances.\n\nHe claimed that he was of the \"Angel Race\", not from Earth but from Saturn. Some of his most notable influences were African and African-American theatre, theosophy, and masonic Afro-futurism. His interest in these art forms", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 35, "title": "More Songs About Buildings and Food", "artist": "Talking Heads", "year": 1978, "cover": "https://dn710707.ca.archive.org/0/items/mbid-66c399b8-e67f-4031-82d5-fec6251fc6b0/mbid-66c399b8-e67f-4031-82d5-fec6251fc6b0-10611888787.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5859-talking-heads-more-songs-about-buildings-and-food.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "2cecb2c0-cac3-3c55-8083-577308746230", "yt_id": "L0yT4Yv4ey8", "rym": "https://rateyourmusic.com/release/album/talking-heads/more-songs-about-buildings-and-food-4", "genres": ["pop rock", "post-punk", "art punk", "new wave", "funk rock", "indie rock"], "desc_lfm_album": "More Songs About Buildings and Food is the second studio album by the American rock band Talking Heads, released in July 1978 and the first of a string of three co-produced by Brian Eno. The band's blend of funk, bubblegum, country, reggae and punk influences, with David Byrne's voice, established the group as a critical success, reaching 29 in the US Billboard Pop Albums chart and 21 in the UK Albums Chart. .", "desc_lfm_artist": "Talking Heads were an American rock band formed in New York City in 1975. The group consisted of vocalist and guitarist David Byrne, drummer Chris Frantz, bassist Tina Weymouth, and guitarist and keyboardist Jerry Harrison. The band is often associated with the development of new wave music, combining elements of punk rock, art rock, funk, and world music with a distinctive visual and artistic style.\n\nDavid Byrne, Chris Frantz, and Tina Weymouth met while studying at the Rhode Island School of Design", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 36, "title": "Pacific", "artist": "Haruomi Hosono, Shigeru Suzuki & Tatsuro Yamashita", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/58805-pacific.jpg", "aoty_url": "https://www.albumoftheyear.org/album/58805-haruomi-hosono-shigeru-suzuki-tatsuro-yamashita-pacific.php", "aoty_critic_score": 89, "aoty_user_score": 81, "mbid": "6919af6b-49db-4e37-954a-d92ae00e5d24", "yt_id": "dSCwoYcp0IY", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "A pre-Yellow Magic Orchestra outing for Haruomi Hosono, along with Shigeru Suzuki (formerly of Happy End) and Tatsuro Yamashita (then of Sugar Babe fame, later going on to a successful solo career). Released in 1978, Pacific also features contributions from future YMO members Ryuichi Sakamoto and  Yukihiro Takahashi.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 37, "title": "Darkness on the Edge of Town", "artist": "Bruce Springsteen", "year": 1978, "cover": "https://dn721606.ca.archive.org/0/items/mbid-205bb6e3-d485-4c8d-ad57-255edb516950/mbid-205bb6e3-d485-4c8d-ad57-255edb516950-32553013605.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5803-bruce-springsteen-darkness-on-the-edge-of-town.php", "aoty_critic_score": 95, "aoty_user_score": 84, "mbid": "b613123b-a234-3f48-9c45-e05bf4e6b9e7", "yt_id": "SDlSCeQXbPo", "rym": "https://rateyourmusic.com/release/album/bruce-springsteen/darkness-on-the-edge-of-town", "genres": ["folk rock", "rock and roll", "classic rock", "pop rock", "heartland rock", "piano rock"], "desc_lfm_album": "Darkness on the Edge of Town is the fourth album by Bruce Springsteen, released in the late spring of 1978. The album marked the end of a three year period of forced hiatus from recording brought on by contractual obligations and legal battling with former manager Mike Appel. Although the album did not produce high charting singles it nevertheless remained on the charts for 97 weeks. The album failed to generate any substantial hit singles, although \"Prove It All Night\" made it into the Top 40 in the U.S. at #33, and follow-up \"Badlands\" just missed, peaking at #42. At .", "desc_lfm_artist": "Bruce Frederick Joseph Springsteen (born September 23, 1949) is an American rock singer, songwriter, and guitarist. Nicknamed \"the Boss\", he has released 21 studio albums during a career spanning six decades, most of which feature his backing band, the E Street Band. Springsteen is a pioneer of heartland rock, a genre combining mainstream rock music with poetic and socially conscious lyrics that feature narratives primarily concerning working class American life.", "desc_mb_album": "", "desc_mb_artist": "You will find the most comprehensive information about '''Bruce Springsteen''' at '''''[http://brucebase.wikidot.com/|BruceBase Wiki]''''' and '''''[http://www.springsteenlyrics.com|SpringsteenLyrics.com]'''''\n\nThe '''''versioning''''' information for '''''studio recordings''''' is taken from the '''[http://brucebase.wikidot.com/stats:on-the-tracks|A studio guide to Bruce Springsteen]''' on the different '''''On The Tracks - recording sessions information''''' pages.", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 38, "title": "Die Mensch·Maschine", "artist": "Kraftwerk", "year": 1978, "cover": "https://dn711009.ca.archive.org/0/items/mbid-8360f429-ab2c-3b1c-ae23-3e94b7ef7438/mbid-8360f429-ab2c-3b1c-ae23-3e94b7ef7438-11445024061.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "d147e89b-90ca-35b6-9f7b-3e34b8edf63f", "yt_id": "swHJeeHknwY", "rym": "https://rateyourmusic.com/release/album/kraftwerk/die-mensch-maschine/reviews/7", "genres": ["electro", "krautrock", "new wave", "synth-pop", "electropop"], "desc_lfm_album": "", "desc_lfm_artist": "Kraftwerk (\"power plant\" in English) are an electronic band founded in 1970 in Düsseldorf, Germany. They pioneered electronic music in the 70s and are considered the most important and influential band of their genre, often described as \"the godfathers of electronic music\". Kraftwerk's sound is minimalistic and strictly electronic; it combines driving, repetitive rhythms with catchy melodies and vocals usually sung through a vocoder. The current line-up consists of Ralf Hütter (the only original member)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "verygooood"]}, {"n": 39, "title": "Music for 18 Musicians", "artist": "Steve Reich and Musicians", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6311-music-for-18-musicians.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6311-steve-reich-and-musicians-music-for-18-musicians.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "c856fe75-3c80-3ce3-98a6-d03f06aa6b3c", "yt_id": "1oOmUi4HGt0", "rym": "https://rateyourmusic.com/release/album/steve-reich-and-musicians/music-for-18-musicians-2/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Steve Reich and Musicians, sometimes credited as the Steve Reich Ensemble, is a musical ensemble founded and led by the American composer Steve Reich (born 1936) to perform his compositions. This ensemble has premiered many of Reich's works and has performed his works more than any other. The ensemble received a Grammy Award in 1999.\n\nHistory\nIn 1966, Steve Reich founded his own ensemble of three musicians, which quickly grew to 18 members or more beginning with concerts in lofts and small galleries in New York City.", "desc_mb_album": "", "desc_mb_artist": "This group was founded by [http://musicbrainz.org/artist/a3031680-c359-458f-a641-70ccbaec6a74.html|Steve Reich] for the purpose of performing works he composes.  Performances by the group can involve anywhere from 2 members to 18 (for performances of \"Music for 18 Musicians\").  It is also alternately credited as the \"Steve Reich Ensemble\".\r\n\r\nPlease do not confuse [http://musicbrainz.org/artist/5164d5aa-3c69-4692-9c8d-6b50f92a0c08.html|\"Steve Reich and Musicians\"] with the [http://musicbrainz.org/artist/f68c9b05-e155-40f1-9f17-9214316feb31.html|\"London Steve Reich Ensemble\"].\r\n\r\nA separate percussion ensemble, [http://musicbrainz.org/artist/7eb60d7b-4a75-40c6-9526-5aa42f127e67.html|Nexus], also has been formed from among members of this group.\r\n\r\n'''SubOptimal Credits'''\r\n    * \"other voca", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "armandwave"]}, {"n": 40, "title": "Kaya", "artist": "Bob Marley & The Wailers", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18235-kaya_183438.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18235-bob-marley-and-the-wailers-kaya.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "da0fbebe-0cef-344e-a0de-c9412ae0eb1a", "yt_id": "vbED91NU4vE", "rym": null, "genres": [], "desc_lfm_album": "Kaya is the tenth studio album released by Bob Marley and the Wailers in 1978. The album consists of tracks recorded alongside those present on the Exodus album in 1977. The album has a very relaxed, laid back sound, lacking much of the militant quality of the Wailers lyrically and musically. They received criticism for 'going soft' as a result of the general sound of the album as well as the theme: songs primarily revolving around love, as well as marijuana. The album's release coincided with the One Love Peace Concert, heralding Marley's triumphant return to Jamaica from exodus in .", "desc_lfm_artist": "Bob Marley and the Wailers (previously known as The Wailers, and prior to that The Wailing Rudeboys, The Wailing Wailers and The Teenagers) were a Jamaican ska, rocksteady and reggae band. The founding members, in 1963, were Bob Marley (Robert Nesta Marley), Peter Tosh (Hubert Winston McIntosh), and Bunny Wailer (Neville Livingston).\n\nDuring 1970 and 1971, Wailer, Marley and Tosh worked with renowned reggae producers Leslie Kong and Lee \"Scratch\" Perry.", "desc_mb_album": "", "desc_mb_artist": "Releases under \"Bob Marley & The Wailers\" belong here, '''no matter the band lineup'''.  \r\n\r\nReleases under \"The Wailing Wailers\", \"The Wailers\", or \"Marley, Tosh, Livingston & Associates\" belong under [http://musicbrainz.org/artist/c9e99d40-4a2c-4ca7-ac5b-e842264ee271.html|\"The Wailing Wailers\"], '''unless''' the track or release was produced by Lee \"Scratch\" Perry, in which case it ought to be listed here, not there.\r\n\r\nReleases by The Wailers Band after Bob Marley's death belong under [http://musicbrainz.org/artist/1e46801d-c27b-4f07-a50d-51597a26df60.html|\"The Wailers Band\"].\r\n\r\nSolo d", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 43, "title": "Kick Inside", "artist": "Kate Bush", "year": 1978, "cover": "https://dn710007.ca.archive.org/0/items/mbid-2355872f-a354-48f5-a3c2-33e433b3e5d3/mbid-2355872f-a354-48f5-a3c2-33e433b3e5d3-34690524477.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e8f3a858-20f8-3798-80ac-65264afa4672", "yt_id": "k2mt7_Xe7Lg", "rym": "https://rateyourmusic.com/release/album/kate-bush/the-kick-inside", "genres": ["avant-garde", "art rock", "pop rock", "art pop", "leftfield"], "desc_lfm_album": "", "desc_lfm_artist": "Catherine Bush (born 30 July 1958) is an English singer, songwriter, musician, dancer, and record producer. She is known for her eclectic musical style, literary and unconventional lyrics, and innovative use of dance and visual performance. Her work has influenced a wide range of artists across genres.\n\nBush began writing songs at the age of 11 and was later signed to EMI Records after David Gilmour of Pink Floyd helped fund a professional demo recording.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 44, "title": "Van Halen", "artist": "Van Halen", "year": 1978, "cover": "https://dn710005.ca.archive.org/0/items/mbid-776396df-90f1-4ecc-b096-21a17077aa6d/mbid-776396df-90f1-4ecc-b096-21a17077aa6d-12654787105.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6078-van-halen-van-halen.php", "aoty_critic_score": 100, "aoty_user_score": 81, "mbid": "43a0e8b5-6059-397f-81e6-b8df5a648496", "yt_id": "2VFJB-ZeVqM", "rym": "https://rateyourmusic.com/release/album/van-halen/van-halen", "genres": ["hard rock", "arena rock", "heavy metal", "trance"], "desc_lfm_album": "Van Halen is the self-titled debut album by American hard rock band Van Halen, released in 1978. The album recorded in 1977 and released in February 1978. It has sold over ten million copies in the United States alone, one of the most successful debuts by a hard rock band. Along with 1984, it gives Van Halen two original (non-greatest hits) albums with Diamond status in sales. From a technical perspective, Eddie Van Halen's guitar solo, Eruption, was influential on many rock guitarists who found popularity in the 1980s.\"Eruption\" was added to the album when producer, Ted Templeman heard Eddie .", "desc_lfm_artist": "Van Halen was an American rock band formed in Pasadena, California, in 1972. Credited with \"restoring hard rock to the forefront of the music scene\", Van Halen was known for its energetic live shows and for the virtuosity of its lead guitarist, Eddie Van Halen. The band was inducted into the Rock and Roll Hall of Fame in 2007.\n\nFrom 1974 until 1985, Van Halen consisted of Eddie Van Halen; Eddie's brother, drummer Alex Van Halen; vocalist David Lee Roth; and bassist/vocalist Michael Anthony.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 45, "title": "Stained Class", "artist": "Judas Priest", "year": 1978, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22380-stained-class.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22380-judas-priest-stained-class.php", "aoty_critic_score": 70, "aoty_user_score": 81, "mbid": "c035f09e-430c-3510-9a4d-7cb33dd56ed8", "yt_id": "mcuoB5xS-FI", "rym": "https://rateyourmusic.com/release/album/judas-priest/stained-class", "genres": [], "desc_lfm_album": "Stained Class is the fourth album by the British heavy metal group Judas Priest, released in February 1978. A popular album in the band's catalogue, Stained Class showcased a more streamlined songwriting style while not compromising on the band's trademark heavy metal riffs. The production is crisper, clearer, and cleaner than any of their preceding albums. This is the only Judas Priest album to feature songwriting by all five members (one of Ian Hill's few contributions to the songwriting process for the band, and the sole contribution thereof by then-drummer Les Binks - the guitar riff for Beyond the Realms .", "desc_lfm_artist": "Judas Priest is an English heavy metal band formed in Birmingham in 1969. They have sold over 50 million albums and are considered a significant influence within the heavy metal genre. The band has been associated with the new wave of British heavy metal movement and has influenced various metal subgenres, including speed metal, thrash metal, and power metal, as well as aspects of the hard rock and glam metal scenes of the 1980s. Despite producing innovative music in the latter half of the 1970s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 46, "title": "Pavilion Of Dreams", "artist": "Harold Budd", "year": 1978, "cover": "https://dn710702.ca.archive.org/0/items/mbid-a7ee8c52-1fbd-4ed8-93d8-f954d256a7f3/mbid-a7ee8c52-1fbd-4ed8-93d8-f954d256a7f3-34931988104.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "63ae8d41-f76f-309d-8a3d-1dc340923792", "yt_id": "KSEpSpIrt98", "rym": "https://rateyourmusic.com/release/album/harold-budd/the-pavilion-of-dreams", "genres": ["modern classical", "new age"], "desc_lfm_album": "", "desc_lfm_artist": "Harold Budd (May 24, 1936 - 7 December 2020) was an American ambient/avant-garde composer. Born in Los Angeles, California, he was raised in the Mojave Desert, and was inspired at an early age by the humming tone caused by wind blown across telephone wires.\n\nHis career as a composer began in 1962. In the following years he gained a notable reputation in the local avant-garde community. In 1966 he graduated from the University of Southern California with a degree in musical composition.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU
