uintet. Kick II and Kick III are to be released on the same day. Kick III has been supported by lead single \"Incendio\". .", "desc_lfm_artist": "Arca is an experimental project by Alejandra Ghersi Rodríguez, a Venezuelan electronic producer, mixing engineer, performance artist, painter and DJ.\nArca embraces fluidity and changing between states, whether it be gender, genre, or personality. In a 2020 interview, they say \"We all have multiple personalities. Rather than causing panic, I think maybe that could cause some relief\". \"There was a clear intention on their fourth album, Kick i to allow every self to express itself.", "desc_mb_album": "", "desc_mb_artist": "'''Gender''': non-binary / transgender female\n'''Pronouns''': she/it/they", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere"]}, {"n": 485, "title": "Raise The Roof", "artist": "Robert Plant and Alison Krauss", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/400597-raise-the-roof.jpg", "aoty_url": "https://www.albumoftheyear.org/album/400597-robert-plant-and-alison-krauss-raise-the-roof.php", "aoty_critic_score": 83, "aoty_user_score": 69, "mbid": "e78a611d-b0c8-4796-abdf-d0412918fe60", "yt_id": "MPZ575AC3wQ", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Robert Plant and Alison Krauss met at a tribute concert to Leadbelly.\n\nThe two decided to collaborate, and recorded an album called Raising Sand.  Recorded in Nashville, and produced by T-Bone Burnett, features the legendary singers doing lesser-known material from various folk, country and blues songwriters including he Everly Brothers, Townes Van Zandt, Gene Clark, Tom Waits, Doc Watson, Little Milton Campbell and Mel Tillis.\n\nRaising Sand was released during October 2007", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU"]}, {"n": 486, "title": "Flying Dream 1", "artist": "Elbow", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/409119-flying-dream-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/409119-elbow-flying-dream-1.php", "aoty_critic_score": 80, "aoty_user_score": 68, "mbid": "cfbac94f-baa9-4d33-bf70-bf70f9c41a03", "yt_id": "K55jaiWvAfQ", "rym": null, "genres": [], "desc_lfm_album": "\"Flying Dream 1\" is the ninth studio album by British alt- rock band Elbow. It was released on 19 November 2021, through Polydor Records. The tracks was written remotely during the COVID-19 pandemic, with each band member composing music at their homes (in Manchester and London) and exchanging their ideas online with the other members. The songs were then completed and recorded at the Theatre Royal in Brighton while it was still closed and empty, as a result of the pandemic. Elbow: Guy Garvey – vocals Craig Potter – keyboards Mark Potter – guitars Pete Turner – bass Additional personnel: .", "desc_lfm_artist": "Elbow is an alternative rock band that got started in Bury, Greater Manchester, United Kingdom in 1990. Formed when its members were in sixth-form college, the group consists of Guy Garvey (vocals, guitar), Mark Potter (guitar, vocals), Pete Turner (bass), Craig Potter (keyboards) and Richard Jupp (drums). Over the band's twenty plus year career, it has released eight studio albums and four EPs while also having over five top 40 singles in the U.K. alone.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 487, "title": "Bloodmoon: I", "artist": "Converge & Chelsea Wolfe", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/419622-bloodmoon-i.jpg", "aoty_url": "https://www.albumoftheyear.org/album/419622-converge-chelsea-wolfe-bloodmoon-i.php", "aoty_critic_score": 87, "aoty_user_score": 76, "mbid": "94a4b34d-6160-47f7-a869-56c149507493", "yt_id": "Mi5ag5-cV9Q", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "A supergroup comprised of hardcore/metalcore pioneers Converge, gothic/dark folk singer Chelsea Wolfe, multi-instrumentalist Ben Chisholm and Cave In frontman Stephen Brodsky (who performed with Converge briefly in 1997-1998). The group originally formed in 2016 at the Roadburn Festival in the Netherlands, where they performed reworked Converge songs under the name Blood Moon. They released their debut album Bloodmoon: I in 2021 via Epitaph Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "armandwave", "sdecandelario"]}, {"n": 488, "title": "30", "artist": "Adele", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/420983-30-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/420983-adele-30.php", "aoty_critic_score": 80, "aoty_user_score": 74, "mbid": "d8a99910-33c2-481d-9b96-085ece5545f6", "yt_id": "6evFeVn-4oU", "rym": null, "genres": ["soul", "jazz", "contemporary r&b", "pop soul", "neo soul", "house"], "desc_lfm_album": "30 is the fourth studio album by Adele, released on November 19, 2021. The album is Adele's first project since her contract with XL Recordings expired after the release of 25 (2015). The album's title alludes to the age the singer first married ex-husband Simon Konecki, and the album features themes of separation, divorce, motherhood, and the anxiety of fame. The album was supported by its lead single \"Easy on Me\", Adele's first solo release in over five years. .", "desc_lfm_artist": "Adele Laurie Blue Adkins MBE (born May 5, 1988) is an English singer and songwriter. After graduating in arts from the BRIT School in 2006, Adele signed a record deal with XL Recordings. Her debut album, 19, was released in 2008 and spawned the UK top-five singles \"Chasing Pavements\" and \"Make You Feel My Love\". The album was certified 8× platinum in the UK and triple platinum in the US. Adele was honoured with the Brit Award for Rising Star as well as the Grammy Award for Best New Artist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo"]}, {"n": 489, "title": "An Evening With Silk Sonic", "artist": "Silk Sonic", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/339855-an-evening-with-silk-sonic-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/339855-silk-sonic-an-evening-with-silk-sonic.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "97a8636b-af26-46b9-a3f4-4ed57c75a2da", "yt_id": "H7_mbMf3Spw", "rym": "https://rateyourmusic.com/release/album/silk-sonic/an-evening-with-silk-sonic", "genres": [], "desc_lfm_album": "An Evening with Silk Sonic is the debut studio album by American R&B duo Silk Sonic, composed of recording artists Bruno Mars and Anderson .Paak. It was released on November 12, 2021, by Aftermath Entertainment and Atlantic Records. Mars reunited with Christopher Brody Brown, while .Paak reached out to Domitille Degalle and JD Beck to write the album. Silk Sonic recruited American musician Bootsy Collins for narration, and composers such as D'Mile to co-produce the album, which was recorded in 2017 and early 2020 to mid-2021. Three singles preceded the album: the lead single \"Leave the Door Open\" was a .", "desc_lfm_artist": "Silk Sonic is an American R&B super duo, consisting of recording artists Bruno Mars and Anderson .Paak. In late February 2021, Mars and .Paak announced on social media the formation of their new band, Silk Sonic, and revealed the artwork for their debut studio album, titled An Evening with Silk Sonic. They also announced the release of the first single on March 5, 2021. \"Leave the Door Open\" was released as the first single in various countries, with their debut album being scheduled to be released January 2022", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 490, "title": "Red (Taylor's Version)", "artist": "Taylor Swift", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/381307-red-taylors-version-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/381307-taylor-swift-red-taylors-version.php", "aoty_critic_score": 89, "aoty_user_score": 80, "mbid": "67727253-f1c0-4243-9270-f9f1401c3b8c", "yt_id": "2D-4M9mfh_E", "rym": null, "genres": [], "desc_lfm_album": "Red (Taylor's Version) is the second re-recorded album by Taylor Swift. It was released on November 12, 2021, through Republic Records. It is a re-recording of Swift's fourth studio album, Red (2012), and follows her first re-recorded album, Fearless (Taylor's Version), which was released in April 2021. The re-recording is Swift's counter measure against the changed ownership of the masters to her first six studio albums. It features a set of unreleased tracks from the Red era billed as \"From the Vault\". Red (Taylor's Version) was met with widespread acclaim from music critics who admired Swift's vocal performances, the production quality, and the .", "desc_lfm_artist": "Taylor Alison Swift is an American singer-songwriter. Her discography spans multiple genres, and her narrative songwriting, which is often inspired by her personal life, has received widespread media coverage and critical praise.\n\nSwift rose to mainstream prominence with her sophomore studio album, Fearless (2008), a country pop record with crossover appeal. Aided by the top-five singles “Love Story” and “You Belong with Me”, Fearless was certified Diamond by the Recording Industry Recording Industry Association of America (RIAA).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo"]}, {"n": 491, "title": "Frailty", "artist": "Jane Remover", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/418876-frailty_190351.jpg", "aoty_url": "https://www.albumoftheyear.org/album/418876-jane-remover-frailty.php", "aoty_critic_score": 78, "aoty_user_score": 83, "mbid": "a0d3725b-18cb-4189-b968-14bdf8948c04", "yt_id": "FBNa4D_VjYI", "rym": "https://rateyourmusic.com/release/album/jane-remover/frailty", "genres": ["electropop", "glitch pop", "glitch", "emo pop", "hyperpop", "bitpop"], "desc_lfm_album": "Frailty is the debut album by American producer and singer-songwriter Jane Remover, released via deadAir records on November 12, 2021, just 8 months after her EP, Teen Week. About the album, Jane stated; \"I'm finally making the music I wanted to make since I was 9\". Inspired by the likes of Porter Robinson and Skrillex, as well as samples of Pokémon Diamond and Pearl, Pokémon Black and White, and Undertale throughout, Jane has also stated that her \"biggest inspirations as of today are my friends\". As Grant Sharples of Paste explains, Jane's influences are \"scattered throughout, but remains Jane's show .", "desc_lfm_artist": "Jane Remover is an American singer, songwriter, and producer from New Jersey based in Chicago, IL. They make electronic-infused pop, hip-hop, and rock music. They're also known for pioneering the genre dariacore under their side-project leroy  (a.k.a. c0ncernn). \n\nJane Remover's interest in music production stems back as far as 2011, inspired by dubstep producers like Skrillex, Kill The Noise, and Virtual Riot. They would later go on to produce different styles of EDM in the mid-2010s, citing Porter Robinson as their biggest influence.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84"]}, {"n": 492, "title": "We Had Good Times Together, Don't Forget That", "artist": "Sewerslvt", "year": 2021, "cover": "https://dn721800.ca.archive.org/0/items/mbid-c1999c12-21fc-4d9d-bc08-a822f0de848e/mbid-c1999c12-21fc-4d9d-bc08-a822f0de848e-42040438533.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "8c704c7e-51c5-4446-8291-62312629dc8d", "yt_id": "GU0Rkwm7lY4", "rym": "https://rateyourmusic.com/release/album/sewerslvt/we-had-good-times-together-dont-forget-that", "genres": ["trance", "drum and bass", "breakbeat", "atmospheric drum and bass", "harsh noise", "electronic"], "desc_lfm_album": "we had good times together, don't forget that is the final album released under the Sewerslvt alias. It was written primarily as a tribute to Jvne's late girlfriend Angel, who overdosed while in the care of medical professionals. Jvne had intended to either end the Sewerslvt project or take an extended hiatus after the release of Skitzofrenia Simulation in June 2021, but after news broke of the events in their personal life, they decided to create the final Sewerslvt album. The Sewerslvt brand and reputation had taken a toll on Jvne, and with the loss of their girlfriend as well, .", "desc_lfm_artist": "Sewerslvt (formerly Jvnko and Sadboy Sheldon) is a drum and bass / breakcore / electonic artist from Sydney, Australia.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "Rocky_stereo"]}, {"n": 493, "title": "BAILE", "artist": "FBC & VHOOR", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/432031-baile.jpg", "aoty_url": "https://www.albumoftheyear.org/album/432031-fbc-vhoor-baile.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "d1265a2e-66dc-4195-893e-12e65ae005e0", "yt_id": "wCyY8OXOHm0", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU"]}, {"n": 494, "title": "Once Twice Melody: Chapter 1", "artist": "Beach House", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/435714-once-twice-melody-chapter-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/435714-beach-house-once-twice-melody-chapter-1.php", "aoty_critic_score": 71, "aoty_user_score": 82, "mbid": "d0575df5-8acc-4a8c-88a5-687aad327fe4", "yt_id": "mGVq-3Kye48", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the n Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["armandwave"]}, {"n": 496, "title": "Valentine", "artist": "Snail Mail", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/412857-valentine_142327.jpg", "aoty_url": "https://www.albumoftheyear.org/album/412857-snail-mail-valentine.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "8de4d83b-1ec7-45c5-b8f8-34facbb4c4fc", "yt_id": "ZxarOZ0JBcc", "rym": null, "genres": [], "desc_lfm_album": "\"Valentine\" is the second studio album by Snail Mail. It was released on November 5, 2021 through Matador Records. Lindsey Jordan tried to begin writing material for her second album immediately after her debut \"Lush\". However, she struggled to write because she was on tour and lacked opportunities for solitude. During the beginning of the COVID-19 pandemic, Jordan returned to her parents' home in Baltimore, where she began to start working seriously on \"Valentine\". In November 2020, Jordan spent 45 days in a rehab facility in Arizona, an experience she references directly in \"Ben Franklin\". \"Valentine\" received critical acclaim upon .", "desc_lfm_artist": "Snail Mail is the American alternative rock solo project of guitarist and singer-songwriter Lindsey Jordan. In 2015, she started playing her songs live with her band and released the EP Habit in 2016. Snail Mail's debut studio album, Lush, was released on June 8, 2018. Snail Mail's music is heavily guitar-inspired.\n\nLindsey Jordan released her self-recorded solo EP Sticki in 2015 and played several live shows with her new band as Snail Mail. She was joined by Ryan Vieira playing bass and Shawn Durham on the drums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo"]}, {"n": 497, "title": "Absolutely", "artist": "Dijon", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/428835-absolutely.jpg", "aoty_url": "https://www.albumoftheyear.org/album/428835-dijon-absolutely.php", "aoty_critic_score": 71, "aoty_user_score": 81, "mbid": "c2455d4a-3e81-4aba-833c-5119d18a8fc0", "yt_id": "FEkOYs6aWIg", "rym": "https://rateyourmusic.com/release/album/dijon/absolutely", "genres": [], "desc_lfm_album": "Absolutely is the debut studio album by American musician Dijon. It was released on November 5, 2021, through R&R and Warner Records. .", "desc_lfm_artist": "Dijon Duenas (simply known as Dijon) is an American alternative/R&B singer-songwriter and producer, also known as the former vocalist of the R&B duo Abhi//Dijon. After the duo released two projects respectively in 2015 and 2016, Dijon began to step into his own in 2017, releasing a string of solo singles, including \"Skin\" and \"Nico's Red Truck\". His debut EP Sci Fi 1 was released in 2019 under the Warner-supported label R&R Digital, and was shortly followed by How Do You Feel About Getting Married the following year.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 498, "title": "Faith in Persona", "artist": "death's dynamic shroud", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/432640-faith-in-persona.jpg", "aoty_url": "https://www.albumoftheyear.org/album/432640-deaths-dynamic-shroud-faith-in-persona.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "4aba2e2c-f1cf-4dd4-b5c6-deaedb7fad2c", "yt_id": "ioZtKTicI0s", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ev ingle \"Peso\" was leaked online and gained radio airplay, contributing to the mainstream attention of cloud rap.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 502, "title": "Prioritise Pleasure", "artist": "Self Esteem", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/388071-prioritise-pleasure-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/388071-self-esteem-prioritise-pleasure.php", "aoty_critic_score": 93, "aoty_user_score": 64, "mbid": "72008926-5b9a-43a6-a89f-f6085eb27a49", "yt_id": "viabXU-cQq8", "rym": null, "genres": [], "desc_lfm_album": "Prioritise Pleasure is the second studio album by the British musician Self Esteem, aka Rebecca Lucy Taylor, released on 22 October 2021. The album was nominated for the 2022 Mercury Prize. .", "desc_lfm_artist": "Self Esteem is the moniker used by British singer and musician Rebecca Lucy Taylor (born 15 October 1986) (formerly one half of Slow Club) for her solo work. Taylor released Your Wife, her first single under the Self Esteem moniker, in 2017. Her debut album, Compliments Please appeared in March 2019 on Fiction Records , preceded by a string of singles. To support the album, she toured the UK, including festival performances at Glastonbury, British Summer Time and Latitude.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 503, "title": "LP", "artist": "Jpegmafia", "year": 2021, "cover": "https://dn721808.ca.archive.org/0/items/mbid-15fb9bdd-8fcc-4309-869a-9ec1bbc6d598/mbid-15fb9bdd-8fcc-4309-869a-9ec1bbc6d598-30736301339.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "c89e9cff-c0c9-4e34-95e7-185056956caf", "yt_id": "EXRLoV1I_UE", "rym": null, "genres": ["alternative hip hop", "experimental hip hop", "hardcore hip hop", "alternative r&b", "cloud rap", "glitch hop"], "desc_lfm_album": "", "desc_lfm_artist": "Barrington DeVaughn ‘Peggy’ Hendricks (born October 22, 1989), better known by his pseudonym JPEGMAFI "]}, {"n": 508, "title": "Seventeen Going Under", "artist": "Sam Fender", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/388089-seventeen-going-under.jpg", "aoty_url": "https://www.albumoftheyear.org/album/388089-sam-fender-seventeen-going-under.php", "aoty_critic_score": 85, "aoty_user_score": 78, "mbid": "bbf0d104-5965-44bf-81d2-d163612086a2", "yt_id": "WAifgn2Cvo8", "rym": "https://rateyourmusic.com/release/album/sam-fender/seventeen-going-under", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "Seventeen Going Under is the second studio album by English musician Sam Fender. The album was released on 8 October 2021 through Polydor Records. The album explores Fender's upbringing and how it has impacted who he is today, exploring both his outward nihilism as well as his internal self-examination .", "desc_lfm_artist": "Sam Fender (born Samuel Thomas Fender on 25 April 1994) is an English singer-songwriter who was named one of the BBC's Sound of 2018 alongside other emerging artists including Sigrid, Lewis Capaldi, and Khalid. He won the Brit Awards Critics’ Choice for 2019.\n\nFender was a teenager when he began performing in pubs throughout North Shields, England. He was spotted in a pub by Ben Howard's manager, Owain Davies, who then got him to support for Willy Mason.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared"]}, {"n": 509, "title": "Let Me Do One More", "artist": "illuminati hotties", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/378335-let-me-do-one-more.jpg", "aoty_url": "https://www.albumoftheyear.org/album/378335-illuminati-hotties-let-me-do-one-more.php", "aoty_critic_score": 82, "aoty_user_score": 75, "mbid": "d01c6235-7760-4e9d-887b-8dc368c1c55d", "yt_id": "v8-749VR2Zk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Illuminati Hotties is an American indie rock band from Los Angeles, California, created and fronted by producer, mixer, and au  Gunn announced on Twitter two official release dates for two albums that would be dropping, the Side-A of the double album and the then-rumored Side-B of the double album, saying: \"Idk who .", "desc_lfm_artist": "Alvin Lamar Worthy (born July 27, 1982), known professionally as Westside Gunn, is an American rapper. He is the paternal half-brother of fellow rapper Conway The Machine, with whom he forms the duo Hall N Nash, and the cousin of fellow Buffalo native rapper Benny the Butcher. In 2014, he founded the record label Griselda Records, as well as clothing brand Fashion Rebels.\n\nIn 2016, he released his first commercial album, Flygod. On March 3, 2017, Griselda Records signed a deal with Eminem's Shady Records", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "verygooood"]}, {"n": 514, "title": "MONTERO", "artist": "Lil Nas X", "year": 2021, "cover": "https://dn721608.ca.archive.org/0/items/mbid-d87a61cd-5201-4a7d-9b4c-a4b676c315bf/mbid-d87a61cd-5201-4a7d-9b4c-a4b676c315bf-30432380663.jpg", "aoty_url": "https://www.albumoftheyear.org/album/348440-lil-nas-x-montero.php", "aoty_critic_score": 81, "aoty_user_score": 71, "mbid": "5ff232ca-d9c8-459b-9253-9374ec07777e", "yt_id": "9YSgwSS5iN8", "rym": null, "genres": ["alternative rock", "contemporary r&b", "hip hop", "pop rap"], "desc_lfm_album": "MONTERO is the debut studio album by American rapper and singer Lil Nas X, released on September 17, 2021, by Columbia Records. It was supported by the singles \"MONTERO (Call Me by Your Name)\", \"SUN GOES DOWN\", \"INDUSTRY BABY (feat. Jack Harlow)\", and \"THATS WHAT I WANT\", the first and third of which topped the US Billboard Hot 100 while the latter reached the top 10. The album has been mostly described as a pop rap record by critics. Primarily rooted in hip-hop and pop, the hook-dominated album incorporates trap beats and distorted hard rock, and draws elements from 2000s R&B and stadium ballads. It features guest appearances from Jack Harlow, Doja Cat, Elton John, Megan Thee Stallion, and Miley Cyrus. Upon .", "desc_lfm_artist": "Lil Nas X (born April 9, 1999) is an American rapper, singer and songwriter from Atlanta, Georgia. In 2018, he dropped out of college during his freshman year to pursue music full-time. On July 24, 2018, he released his debut mixtape titled 'NASARATI'. His breakthrough came in 2019, when his single \"Old Town Road\" went viral on TikTok and became a number one hit, both in the US and internationally. The song also caused controversy when it was disqualified from the Billboard country chart", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "armandwave", "verygooood"]}, {"n": 515, "title": "DELTARUNE Chapter 2 (Original Game Soundtrack)", "artist": "Toby Fox", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/416206-deltarune-chapter-2-original-game-soundtrack.jpg", "aoty_url": "https://www.albumoftheyear.org/album/416206-toby-fox-deltarune-chapter-2-original-game-soundtrack.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": "e1670c2e-6d6d-4ded-9296-41c0b063e389", "yt_id": "e38ViqlkD0c", "rym": null, "genres": [], "desc_lfm_album": "This is the official sountrack (OST) from Deltarune : Chapter 2. Released September 17th, 2021. This game contains 47 tracks that you can hear in this album. There are some themes : Outside the Game : Faint Glow (1), Faint Courage (16), Until Next Time (45), Before The Story (46) Lightners Themes : Girl Next Door (2), Berdly (14), Smart Race (15), Bluebird of Misfortune (25), Lost Girl (30), sans. (42), Chap1 Darkners Themes : It's Pronounced \"Rules\" (29), Environments : My Castle Town (3), A CYBER'S WORLD? (6), Welcome to the CITY (17), Elegant Entrance (24), Pandora Palace (26), .", "desc_lfm_artist": "Toby Fox is an American developer and composer behind the 2015 hit indie video game Undertale.\n\nIn 2018, Toby Fox released Chapter 1 of his game Deltarune, following suit and composing the soundtrack on his own. Chapter 2 followed in 2021, Chapters 3 and 4 in 2025, and Chapter 5 slated for release in 2026, each accompanied by his music with minor contributions from other artists. In 2020, Fox contributed to the OMORI soundtrack.\n\nAdditionally, under the alias Radiation, Fox composed music for the webcomic Homestuck.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo"]}, {"n": 516, "title": "By The Time I Get To Phoenix", "artist": "Injury Reserve", "year": 2021, "cover": "https://dn721908.ca.archive.org/0/items/mbid-a919299b-d6da-48bb-b86c-1db938886f73/mbid-a919299b-d6da-48bb-b86c-1db938886f73-30425354751.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "242b18ed-5d47-4a4b-823d-645785525ae0", "yt_id": "ZdHwWJyKB3E", "rym": null, "genres": ["experimental rock", "trip hop", "hip hop", "experimental hip hop", "glitch", "abstract hip hop"], "desc_lfm_album": "By the Time I Get to Phoenix is the second and final studio album by American rap group Injury Reserve. It was released on September 15, 2021, and is dedicated to late member Stepa J. Groggs, who died during the recording of the album. The album features Bruiser Brigade rapper, ZelooperZ, with production contributions from Black Midi drummer Morgan Simpson, as well as Body Meat, Jam City, and SADPONY. .", "desc_lfm_artist": "Injury Reserve was an Arizona based hip-hop group formed in 2012 by rappers Stepa J. Groggs, RiTchie, and producer Parker Corey. After Groggs' passing, Ritchie With a T and Parker Corey are now releasing music as By Storm.\n\nIn 2015, the group self-released Live From the Dentist Office, their 11-track debut project with features from Chuck Inglish, Curtis Williams, Glass Popcorn, and Demi Hughes. The mixtape was released through multiple digital platforms such as SoundCloud, iTunes, Tidal, and Spotify.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 517, "title": "HEY WHAT", "artist": "Low", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/382458-hey-what.jpg", "aoty_url": "https://www.albumoftheyear.org/album/382458-low-hey-what.php", "aoty_critic_score": 82, "aoty_user_score": 79, "mbid": "b835ce22-736e-4338-8a88-f558daa84d60", "yt_id": "J00IWVtbXvQ", "rym": "https://rateyourmusic.com/release/album/low/hey-what", "genres": [], "desc_lfm_album": "HEY WHAT (stylized in all caps) is the 13th full-length album by Minnesota-based duo Low, released on September 10, 2021, through Sub Pop. It is their third recording produced by BJ Burton, who has worked with bands and musicians like Bon Iver, Charli XCX and Lizzo .", "desc_lfm_artist": "There are at least seven artists with this name:\n1) Low is an American indie rock/slowcore band from Duluth.\n2) Low is a German industrial punk rock band from Berlin.\n3)  Low is a Danish rapper.\n4) Low is a Spanish hip hop artist.\n5)  low is a doujin artist.\n6) Low (White Leaves)is a Japanese artist.\n7) Low is a member of CLOSER.\n\n1)  Low was a slowcore band formed in Duluth, Minnesota, United States in 1993, by Alan Sparhawk (guitar and vocals), Mimi Parker (drums and vocals) and original bassist John Nichols (bass guitar).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 518, "title": "Comfort to Me", "artist": "Amyl and the Sniffers", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/388038-comfort-to-me.jpg", "aoty_url": "https://www.albumoftheyear.org/album/388038-amyl-and-the-sniffers-comfort-to-me.php", "aoty_critic_score": 85, "aoty_user_score": 76, "mbid": "dae7fa1e-f8e6-4eef-a0a4-700307c439be", "yt_id": "huK6_LpBI34", "rym": null, "genres": [], "desc_lfm_album": "Comfort to Me is the second studio album by Australian pub rock and punk band Amyl and the Sniffers. It was released on 10 September 2021 by B2B Records in Australia, Rough Trade Records in Europe and ATO Records in North America. The album reached No. 2 in Australia and No. 21 on the UK Albums Chart. At the J Awards of 2021, the album was nominated for Australian Album of the Year. At the AIR Awards of 2022, the album was nominated for Independent Album of the Year and won Best Independent Punk Album or EP. At the 2022 .", "desc_lfm_artist": "Amyl and The Sniffers is an Australian pub rock and punk rock band based in Melbourne, consisting of vocalist Amy Taylor, drummer Bryce Wilson, guitarist Dec Martens, and bassist Gus Romer. At the ARIA Music Awards of 2019, their self-titled debut record won the Best Rock Album category.\n\nAmy Taylor (vocals), Bryce Wilson (drums) and Declan Martens (guitar) founded Amyl in their sharehouse in early 2016. They formed the band, wrote a handful of tunes and released their debut EP, Giddy Up, all in a span of twelve hours.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "sdecandelario", "verygooood"]}, {"n": 519, "title": "I've Been Trying To Tell You", "artist": "Saint Etienne", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/394516-ive-been-trying-to-tell-you.jpg", "aoty_url": "https://www.albumoftheyear.org/album/394516-saint-etienne-ive-been-trying-to-tell-you.php", "aoty_critic_score": 81, "aoty_user_score": 69, "mbid": "95e4db38-caf7-4d53-af13-0312409390f3", "yt_id": "gzpA6N_yMo4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Saint Etienne is an indie dance/indie pop trio which formed in Croydon, England in 1990. The band was founded by journalist Bob Stanley (born December 25, 1964) and Pete Wiggs (born May 15, 1966) in Croydon, UK, January 1990. After recording 2 singles with guest singers, Sarah Cracknell (born April 12, 1967, Chelmsford, Essex) joined as a full member. The band is named after a French football team.\n\nSaint Etienne are one of the bands who defined the early 90s indie dance genre", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 520, "title": "Civilisation", "artist": "Kero Kero Bonito", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/412565-civilisation.jpg", "aoty_url": "https://www.albumoftheyear.org/album/412565-kero-kero-bonito-civilisation.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "2450b1fe-f7f9-452b-be95-76b1bc183ae5", "yt_id": "txd7-2AGI2E", "rym": null, "genres": [], "desc_lfm_album": "Civilisation was inspired by the art pop lineage of artists like Kate Bush, David Sylvian and Peter Gabriel, with a sonic palette informed by Warp's Artificial Intelligence series, homemade New Age music and early digital synth experiments. It was created entirely with dusty old musical hardware and uses both ancient musical tropes (pentatonic scales, minimalist repetition) and contemporary songwriting techniques to summon an out-of-time atmosphere that spans the past, present and future simultaneously. The songs tackle widescreen themes like psychological warfare (on the mystical polyrhythmic funk of \"Battle Lines\"), ancient mythology (on the energetic, melancholy synth-pop of \"The Princess and .", "desc_lfm_artist": "Kero Kero Bonito is a British band from London, England. The band consists of vocalist Sarah Bonito and producers Gus Lobban and Jamie Bulled. Their name comes from the Japanese onomatopoeic words for frog croaks and a type of fish. \n\nGus and Jamie grew up in the suburbs south of London and went to school together. In search for a new band member, they posted advertisements, including on MixB, an online bulletin board for Japanese expatriates, largely due to their interest in Japanese rap.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 521, "title": "Indigo Borboleta Anil", "artist": "Liniker", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/405334-indigo-borboleta-anil_230547.jpg", "aoty_url": "https://www.albumoftheyear.org/album/405334-liniker-indigo-borboleta-anil.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "d5928952-1949-4b4a-9f22-ff0a4eb5d60a", "yt_id": "lbrtVU_aDac", "rym": null, "genres": [], "desc_lfm_album": "Indigo Borboleta Anil é primeiro álbum solo da cantora Liniker após a separação da banda Liniker e os Caramelows e conta com participações de Milton Nascimento e Tássia Reis, arranjos das orquestras Jazz Sinfônica de Ruriá Duprat e Orkestra Rumpilezz de Letieres Leite, letras com colaboração de Tulipa Ruiz, Mahmundi, Tassia Reis e Vitor Hugo e com produção de Liniker, Júlio Feijuca e Gustavo Ruiz. O álbum representa um passo gigante ao estrear em sua carreira solo, que traz uma verdadeira viagem interna pelos reencontros da artista com suas grandes referências e com sua ancestralidade. A obra venceu o Grammy Latino .", "desc_lfm_artist": "Liniker de Barros Ferreira Campos is a Brazilian singer, songwriter and actress. Former leader of soul and Black music band Liniker e os Caramelows, her music is an influence on young Brazilians facing gender discrimination, an audience which 'rarely finds itself represented in Brazilian music'. In 2022, Liniker became the first transgender woman to win a Latin Grammy, winning Best Portuguese Language Popular Music Album for Indigo Borboleta Anil and Best Portuguese Language Song for \"Baby 95\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 522, "title": "dariacore 2: enter here, hell to the left", "artist": "leroy", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/433925-dariacore-2-enter-here-hell-to-the-left.jpg", "aoty_url": "https://www.albumoftheyear.org/album/433925-leroy-dariacore-2-enter-here-hell-to-the-left.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "5b3e0208-868d-48a2-99c9-eb3d781a35a7", "yt_id": "O9rfJXoZwok", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are 7 artists known as Leroy:\n\n1. The EDM side project of American artist Jane Remover, also (unofficially) known as c0ncernn. Under this alias, Remover coined the genre Dariacore with her 2021 album of the same name as well as its 2 sequels. After the release of Grave Robbing in 2023, the project was supposedly retired until 2025.\n\n2. An American artist, whose music is featured in television shows such as Scrubs and Arrested Development\n\n3.", "desc_mb_album": "", "desc_mb_artist": "Leroy Anderson (1908-1975) was one of the pre-eminent composers of \"classical pops\" music. Though best known for \"Sleigh Ride\" (originally a pure instrumental) and \"Syncopated Clock\" (used as theme music for the CBS \"Late Show\" and Jeopardy), he wrote many others just as deserving of attention which are still widely played in pops concerts.\n\nNote that although his first name is spelled normally, it seems to be universally pronounced le-ROY. For more information, check out the official web page at http://www.leroy-anderson.com/ .", "heard_by": []}, {"n": 523, "title": "Sometimes I Might Be Introvert", "artist": "Little Simz", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/357961-sometimes-i-might-be-introvert.jpg", "aoty_url": "https://www.albumoftheyear.org/album/357961-little-simz-sometimes-i-might-be-introvert.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "e95de3f4-84db-4d24-8d06-fd970576a6ef", "yt_id": "mYpSUrP7uYI", "rym": "https://rateyourmusic.com/release/album/little-simz/sometimes-i-might-be-introvert", "genres": ["Hip-Hop"], "desc_lfm_album": "Sometimes I Might Be Introvert is the fourth studio album by Little Simz, released on September 3, 2021. The album succeeds the Mercury Prize-nominated album Grey Area, released in 2019, and the five-track EP, Drop 6. It was produced by frequent collaborator Inflo, and includes guest appearances from Cleo Sol and Obongjayar. The album debuted at #4 on the UK Charts, and received critical acclaim, getting a nomination at the Brit Awards. The album was named the best album of 2021 by Exclaim! and BBC Radio 6 Music. It won the 2022 Mercury Prize on 18th October 2022. It also .", "desc_lfm_artist": "Simbiatu \"Simbi\" Abisola Abiola Ajikawo, better known by her stage name Little Simz, is a British rapper, singer and actress. She rose to prominence with the independent release of her first three albums, namely A Curious Tale of Trials + Persons (2015), Stillness in Wonderland (2016) and Grey Area (2019), the latter of which was shortlisted for the Mercury Prize and won the awards for Best Album at both the Ivor Novello Awards and the NME Awards.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "verygooood"]}, {"n": 524, "title": "Senjutsu", "artist": "Iron Maiden", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/391875-senjutsu.jpg", "aoty_url": "https://www.albumoftheyear.org/album/391875-iron-maiden-senjutsu.php", "aoty_critic_score": 82, "aoty_user_score": 64, "mbid": "542a86ba-fcdf-4133-99e3-07a462743162", "yt_id": "U4VoksLlslU", "rym": null, "genres": [], "desc_lfm_album": "Iron Maiden released their 17th Studio album Senjutsu in 2021. It was recorded at Guillaume Tell Studio in early 2019. Senjutsu (Japanese: 戦術, loosely translated as \"tactics and strategy\") is the seventeenth studio album by British heavy metal band Iron Maiden, released on 3 September 2021. Senjutsu is the band's first studio album in nearly six years, following The Book of Souls (2015), marking the longest gap between two Iron Maiden studio albums. This is also their second double album, and their first studio album since Powerslave (1984) to have no songwriting contributions from guitarist Dave Murray in any way, .", "desc_lfm_artist": "Iron Maiden is an English heavy metal band formed in Leyton, East London, in 1975 by bassist and primary  "aoty_url": "https://www.albumoftheyear.org/album/360793-billie-eilish-happier-than-ever.php", "aoty_critic_score": 83, "aoty_user_score": 79, "mbid": "3ac5236a-3bd8-44c6-ab60-69b013594ae6", "yt_id": "qVEAdTvnRvE", "rym": "https://rateyourmusic.com/release/album/billie-eilish/happier-than-ever", "genres": ["alternative rock", "electropop", "contemporary r&b", "ambient pop", "alternative pop", "alternative r&b"], "desc_lfm_album": "Happier Than Ever is the second studio album by American singer Billie Eilish. It was released on July 30, 2021, by Darkroom and Interscope. Eilish wrote the album with her frequent collaborator, her brother FINNEAS, who produced the album himself. Eilish cited self-reflection during the COVID-19 pandemic as the biggest inspiration for the album. Primarily a downtempo pop record, Happier Than Ever is characterized by sparse, jazz-influenced, electropop arrangements set to meditative tempos, departing from the upbeat, trap-led sound of Eilish's debut album, WHEN WE ALL FALL ASLEEP, WHERE DO WE GO? (2019). Consisting of torch songs about the downsides of stardom, Happier Than Ever draws heavily from Eilish's rise to fame and the drawbacks that come with it. Upon .", "desc_lfm_artist": "Billie Eilish Pirate Baird O'Connell (born December 18, 2001), known professionally as Billie Eilish, is a Grammy and Academy Award-winning American singer and songwriter signed to Darkroom/Interscope Records.\n\nBorn and raised in Los Angeles, Eilish grew up in a household of actors and musicians and was homeschooled along with her brother Finneas O'Connell. At the age of eight, she joined the Los Angeles Children's Choir, developing the soulful vocals that would later appear on her early singles.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "paqueradejere", "verygooood"]}, {"n": 537, "title": "Animal", "artist": "LUMP", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/363248-animal.jpg", "aoty_url": "https://www.albumoftheyear.org/album/363248-lump-animal.php", "aoty_critic_score": 80, "aoty_user_score": 76, "mbid": "71398b39-fdda-444d-9f9b-cbc4a0d20832", "yt_id": "7Ckt_SPTk5A", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are at least four groups with the name Lump.\n\n1. (Stylized \"LUMP\") is a collaboration between English folk artist Laura Marling and Mike Lindsay of the bands Tuung and Throws. Their self-titled debut album is out June 1, 2018.\n\nLindsay began working on music outside of his respective bands, but eventually found himself in need of a vocalist. Marling and Lindsay met at a Neil Young show where Marling was appearing as the support act. They were both mutual fans of each other's work, and thus the Lump project was born.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 538, "title": "Thirstier", "artist": "TORRES", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/366049-thirstier.jpg", "aoty_url": "https://www.albumoftheyear.org/album/366049-torres-thirstier.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "8d3f3dfc-6393-4701-b89e-34e30912ca93", "yt_id": "oy_khf_cpro", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Torres is the stage name of Mackenzie Scott (born January 23, 1991), an independent American singer, songwriter, musician and artist. \n\nThe Brooklyn-based singer-songwriter waits until anything—an idea, an emotion, a memory—gnaws at her, tearing at her fingers and throat until she releases it in song. Scott escaped the confines of her churning mind in order to find herself by recording Sprinter in the market town of Bridport in Dorset, England; and then at the Bristol studio of Portishead's Adrian Utley.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 539, "title": "Spiral", "artist": "DARKSIDE", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/317615-spiral.jpg", "aoty_url": "https://www.albumoftheyear.org/album/317615-darkside-spiral.php", "aoty_critic_score": 80, "aoty_user_score": 74, "mbid": "da4462e7-4225-42e5-af2d-d076f7a474a9", "yt_id": "8QPL8aVVaTw", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are multiple artists using this name.\n\n1. Darkside is Dave Harrington, Nicolas Jaar and Tlacael Sparza.\n2. Darkside is  an Austrian death metal band.\n3. A doomcore musician from the UK.\n4. Short lived US Rock band.\n\n1. Darkside is a musical duo composed of guitarist Dave Harrington and electronic producer Nicolas Jaar. Despite having different musical backgrounds, they found common ground through touring together and have created a unique fusion of electronic and psychedelic rock music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "paqueradejere", "sdecandelario"]}, {"n": 540, "title": "We're All Alone In This Together", "artist": "Dave", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/387184-were-all-alone-in-this-together_144444.jpg", "aoty_url": "https://www.albumoftheyear.org/album/387184-dave-were-all-alone-in-this-together.php", "aoty_critic_score": 88, "aoty_user_score": 77, "mbid": "d8189133-bbf0-4071-a156-f67704a926c4", "yt_id": "7-UyqpYeLYc", "rym": null, "genres": [], "desc_lfm_album": "We’re All Alone In This Together is the highly anticipated sophomore studio album from Streatham rapper Dave, and follows his award winning debut studio album PSYCHODRAMA, which was released March 8th 2019. In a July 2021 interview with GQ Dave revealed: The album title is We’re All Alone In This Together. Hans Zimmer said it to me on FaceTime. He was like, “Dave, remember, we’re all alone in this together.” Following a 17-month hiatus, Dave dropped the singles bundle Titanium & Mercury on April 10th 2021 as a precursor to his sophomore album. He officially announced the album name and .", "desc_lfm_artist": "There are at least two artists called Dave:  1)  a British rapper, singer, songwriter, record producer, and actor,  who is among the most recognised British hip-hop artists, and 2) a Dutch Francophone singer with a string of number one hits in France in the 1970s\n\n1) David Orobosa Omoregie (born 5 June 1998), known professionally as Dave or Santan Dave, is a British rapper, singer, songwriter, record producer, and actor. Dave has gained acclaim for his socially conscious lyricism and wordplay and is among the most recognised British rappers.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 541, "title": "Sling", "artist": "Clairo", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/378656-sling.jpg", "aoty_url": "https://www.albumoftheyear.org/album/378656-clairo-sling.php", "aoty_critic_score": 80, "aoty_user_score": 78, "mbid": "2ae8fedc-5287-422e-998b-c1f38b81fb12", "yt_id": "mQc16FbvJeE", "rym": null, "genres": [], "desc_lfm_album": "\"Sling\" is the sophomore studio album by singer-songwriter Clairo. It was produced by Jack Antonoff and was released on July 16th, 2021. It features the single, \"Blouse,\" which was released on June 11th, 2021. It was released through a joint deal with FADER Label and Republic Records (UMG) licensed by Clairo Records. .", "desc_lfm_artist": "Claire Elizabeth Cottrill (born August 18, 1998), known professionally as Clairo, is an American singer-songwriter. She began sharing music online at age 13.\n\nClairo gained widespread attention following the viral success of the music video for her lo-fi single \"Pretty Girl\" in 2017. She subsequently signed with Fader Label and released her debut EP \"Diary 001\" in 2018. Her first studio album, \"Immunity\" (2019), included the singles \"Bags\" and \"Sofia,\" with the latter becoming her first entry on the Billboard Hot 100.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Rocky_stereo"]}, {"n": 542, "title": "Pink Noise", "artist": "Laura Mvula", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/345481-pink-noise.jpg", "aoty_url": "https://www.albumoftheyear.org/album/345481-laura-mvula-pink-noise.php", "aoty_critic_score": 84, "aoty_user_score": 73, "mbid": "dc08dda9-cfe3-4413-a1b1-21be12e00992", "yt_id": "7xTE82Wdnxo", "rym": null, "genres": [], "desc_lfm_album": "Pink Noise is the third studio album by British singer Laura Mvula, released on July 2, 2021 through Atlantic Records. .", "desc_lfm_artist": "Laura Mvula (née Douglas) is a British soul singer-songwriter from Birmingham. Her debut album \"Sing to the Moon\", was released on March 4, 2013. \nMvula grew up in the Birmingham suburbs of Selly Park and Kings Heath with two younger siblings, and was influenced by the girl band Eternal. She sang with Black Voices, an a capella group set up by her aunt. She graduated from the Birmingham Conservatoire with a degree in composition. While she was working as a supply teacher in a Birmingham secondary school", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 543, "title": "The Turning Wheel", "artist": "SPELLLING", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/212066-the-turning-wheel.jpg", "aoty_url": "https://www.albumoftheyear.org/album/212066-spellling-the-turning-wheel.php", "aoty_critic_score": 81, "aoty_user_score": 83, "mbid": "edaa59f9-7474-4f2e-bb36-4f48d1514d6d", "yt_id": "TnuG9jvRcHk", "rym": "https://rateyourmusic.com/release/album/spellling/the-turning-wheel", "genres": [], "desc_lfm_album": "The Turning Wheel is the third studio album by American experimental pop artist SPELLLING, released on June 25, 2021 on Sacred Bones Records. .", "desc_lfm_artist": "Chrystia \"Tia\" Cabral (born May 18, 1991), known professionally as Spellling, is an American experimental pop musician based in Oakland, California. Cabral released her debut album Pantheon of Me in September 2017; Pitchfork felt it was \"surely among the most overlooked debuts this calendar year\". Signing to Sacred Bones Records in 2018, she followed up in February 2019 with Mazy Fly. It was met with universal acclaim by music critics, who enjoyed the dark and eerie qualities of Spellling's sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 544, "title": "Mood Valiant", "artist": "Hiatus Kaiyote", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/345410-mood-valiant.jpg", "aoty_url": "https://www.albumoftheyear.org/album/345410-hiatus-kaiyote-mood-valiant.php", "aoty_critic_score": 81, "aoty_user_score": 76, "mbid": "22440c59-8982-4aa3-b04e-f91973a4d7b2", "yt_id": "zQIZ2SIz6TI", "rym": "https://rateyourmusic.com/release/album/hiatus-kaiyote/mood-valiant", "genres": ["Jazz"], "desc_lfm_album": "Melbourne-based, worldwide-beloved, genre-fluid Hiatus Kaiyote returns in 2021 with their new album Mood Valiant. Nai Palm (guitar, vox), Paul Bender (bass), Simon Mavin (keys), and Perrin Moss (drums) debuted in 2012 with LP Tawk Tomahawk, making fans of Erykah Badu, Questlove, and Prince, and embraced by tastemakers like Gilles Peterson and DJ Jazzy Jeff. Their first R&B Grammy nomination, for “Nakamarra,” was followed by another for “Breathing Underwater,” from their second LP, 2015’s Choose Your Weapon. They’ve been sampled on songs by The Carters (Beyonce + Jay-Z), Kendrick Lamar, Anderson .Paak, Chance The Rapper, and Drake, with whom Nai Palm .", "desc_lfm_artist": "Hiatus Kaiyote are a 4-piece independent future soul group based in Melbourne, performing on occasion with 3 additional backing singers.\n\nTheir sound is a fusion of future beats, hip-hop and soul with subtler influences of Latin, dubstep and opera. \n\nSince forming in mid 2011, Hiatus Kaiyote have already shared the bill with such acts as Stones Throw Record’s Taylor McFerrin, Warp legends Chris Clark and Harmonic 313 and sound genius Robin Fox, Brainfeeder’s Lapalux and oOoOO as well as playing bills at Woodford Folk Festival", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "paqueradejere"]}, {"n": 545, "title": "Home Video", "artist": "Lucy Dacus", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/355670-home-video.jpg", "aoty_url": "https://www.albumoftheyear.org/album/355670-lucy-dacus-home-video.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "5cc3fbf0-bfcd-4b2d-9242-c353626764e6", "yt_id": "N9H5rOzjG8U", "rym": null, "genres": [], "desc_lfm_album": "Home Video is the third studio album by American singer-songwriter Lucy Dacus. It was released on June 25, 2021, via Matador. It was promoted by the singles \"Thumbs\", \"Hot & Heavy\", \"VBS\", and \"Brando\". In late February 2021, certain fans of Dacus received a VHS tape of a new song in the mail. On March 9, 2021, the song was released using the title \"Thumbs\". It had long been a staple of Dacus' live performances prior to its release. Dacus explained the way the song came about in a press release. .", "desc_lfm_artist": "Lucy Elizabeth Dacus is an American singer-songwriter and producer. Originally from Richmond, Virginia, Dacus attracted attention with her debut album No Burden, which led to a deal with Matador Records. Her second album, Historian, was released in 2018 to further critical acclaim. Dacus' third studio album, Home Video, was released in 2021. Forever Is A Feeling, her fourth studio album, released in March 2025.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu"]}, {"n": 547, "title": "What We Have", "artist": "Summrs", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/381876-what-we-have.jpg", "aoty_url": "https://www.albumoftheyear.org/album/381876-summrs-what-we-have.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "def493e4-c2ed-4065-b153-e108248823f3", d studied piano in preparation for Jubilee. She noted \"I was just able to incorporate more interesting chord changes and write more on piano for the first time\". Supported by .", "desc_lfm_artist": "Japanese Breakfast is the solo musical project of Korean-American musician Michelle Zauner (of Little Girl, Big Spoon, Post Post, Little Big League). \n\nZauner released a tape in June 2013 under the solo moniker Japanese Breakfast. The tape was titled June and boasted thirty tracks written and recorded every day of the month. A stark deviation from Little Big League's guitar-based indie rock, it showcased Zauner's dark lyrics, unique vocals and inherent knack for pop melody.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "verygooood"]}, {"n": 551, "title": "Cavalcade", "artist": "black midi", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/347417-cavalcade_090844.jpg", "aoty_url": "https://www.albumoftheyear.org/album/347417-black-midi-cavalcade.php", "aoty_critic_score": 81, "aoty_user_score": 83, "mbid": "2ef2d793-4fe4-4947-a476-828ccfad19ad", "yt_id": "1lAmCVY35K4", "rym": "https://rateyourmusic.com/release/album/black-midi/cavalcade", "genres": [], "desc_lfm_album": "\"Cavalcade\" is the sophomore studio album from the British rock band black midi, released on May 26th through Rough Trade records. It was released early to a live audience with the video “black midi – Cavalcade Listening Party Extravaganza”. The album features an eclectic array of sounds and experimentation beginning with the explosive Avant-Garde Jazz track “John L” to the more cathartic and somber ballad “Marlene Dietrich.” “Their claim in a past interview that their music would soon be “unrecognisable” from their initial form suddenly doesn’t seem so ridiculous. A band who defy expectation at every turn, the only predictable .", "desc_lfm_artist": "black midi was an English experimental rock band from London comprising Morgan Simpson (drums), Cameron Picton (bass/vocals), and Geordie Greep (guitar/vocals). Between 2017 and 2020, the band also included guitarist Matt Kwasniewski-Kelvin. \n\nThey began gaining popularity through touring across Europe, their breakthrough into the U.S. and a number of videos of live performances being posted online. In early 2019, the band released two singles along", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 552, "title": "Afrique Victime", "artist": "Mdou Moctar", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/341281-afrique-victime.jpg", "aoty_url": "https://www.albumoftheyear.org/album/341281-mdou-moctar-afrique-victime.php", "aoty_critic_score": 84, "aoty_user_score": 77, "mbid": "6dad7139-7cd5-41bc-b7fc-6bf20fc1155a", "yt_id": "q0lPeQA2hu4", "rym": null, "genres": ["Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Tuareg singer/songwriter and guitarist who is known for his innovative and intense playing style, Mdou Moctar rose from a small village in Niger to earn viral success among West Africa's cell phone-trading network. An appearance on an American compilation in 2010 led to international recognition and further exploratory releases on the Sahel Sounds label. Moctar's sound continued to evolve as he pushed his musical boundaries as a multi-instrumentalist on 2017's Sousoume Tamachek.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 553, "title": "Seeking New Gods", "artist": "Gruff Rhys", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/345093-seeking-new-gods.jpg", "aoty_url": "https://www.albumoftheyear.org/album/345093-gruff-rhys-seeking-new-gods.php", "aoty_critic_score": 82, "aoty_user_score": 69, "mb  its predecessor, she produced the album alongside Jack Antonoff. It won Best Alternative Music Album at the 2022 Grammy Awards, making St. Vincent the first woman to have won this award twice. .", "desc_lfm_artist": "A pseudonym of Annie Clark (b. 28 Sept 1982), a USA multi-instrumentalist singer-songwriter. She was a member of The Polyphonic Spree and Sufjan Stevens' touring band. Born in Tulsa, Oklahoma, she began playing the guitar at the age of 12 and as a teenager worked as the tour manager for her uncle's band Tuck & Patti. She grew up in Dallas and attended Lake Highlands High School, graduating in 2001. Following this, she went on to attend Berklee College of Music, dropping out 3 years later.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "armandwave", "paqueradejere"]}, {"n": 557, "title": "IRA", "artist": "Iosonouncane", "year": 2021, "cover": "https://i.discogs.com/Q5TzsxgrCoggm2xdSNuAxLY44-n3VP5OBICHhVHzp14/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE4NzA5/NTU1LTE3NjUwMzI0/ODQtNjM0NS5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/339247-iosonouncane-ira.php", "aoty_critic_score": 100, "aoty_user_score": 81, "mbid": "a01f9c0f-7ae8-421d-a3f0-1c5295cfca74", "yt_id": "RYfkf-_HXqY", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Jacopo Incani, known under the pseudonym Iosonouncane (Buggerru, 1983), is an Italian singer-songwriter, musician, record producer and composer. Born in Buggerru, he spent his adolescence in Iglesias, where he founded the group Adharma, then moved to Bologna for university.\nHis debut album La macarena su Roma was released on 10 October 2010 by the independent record label Trovarobato. The album is characterised by a mix of singer-songwriter music, psychedelic pop samples and acoustic guitar for the melodic part.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario", "verygooood"]}, {"n": 558, "title": "Black To The Future", "artist": "Sons of Kemet", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/349619-black-to-the-future.jpg", "aoty_url": "https://www.albumoftheyear.org/album/349619-sons-of-kemet-black-to-the-future.php", "aoty_critic_score": 87, "aoty_user_score": 75, "mbid": "2cb88e38-3e04-4545-8a13-30c0659de3d0", "yt_id": "qB4-eH5mGf0", "rym": null, "genres": [], "desc_lfm_album": "Black To The Future is the fourth full-length release by Sons of Kemet, released on May 14, 2021. It features guest appearances from Angel Bat Dawid, D Double E, Joshua Edelin, Lianne La Havas, Moor Mother, Kojey Radical, and Steve Williamson. .", "desc_lfm_artist": "Sons of Kemet was a British jazz group formed in 2011 by Shabaka Hutchings, Oren Marshall, Seb Rochford, and Tom Skinner. Theon Cross replaced Marshall on tuba after the first album, and Eddie Hick replaced Rochford on drums after the third. The band disbanded in 2022. The group used saxophone and clarinet (Hutchings), tuba (Cross), and two drummers (Skinner & Rochford or Hick) to make their music and played a mixture of jazz, rock, Caribbean folk, and African music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 559, "title": "dariacore", "artist": "leroy", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/377799-dariacore.jpg", "aoty_url": "https://www.albumoftheyear.org/album/377799-leroy-dariacore.php", "aoty_critic_score": 86, "aoty_user_score": 81, "mbid": "3097b1f8-08d3-4caf-953e-116fbb922e0a", "yt_id": "O9rfJXoZwok", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are 7 artists known as Leroy:\n\n1. The EDM side project of American artist Jane Remover, also (unofficially) known as c0ncernn. Under this alias, Remover coined the genre Dariacore with her 2021 album of the same name as well as its 2 sequels. After the release of Grave Robbing in 2023, the project was supposedly retired until 2025.\n\n2. An American artist, whose music is featured in television shows such as Scrubs and Arrested Development\n\n3.", "desc_mb_album": "", "desc_mb_artist": "Leroy Anderson (1908-1975) was one of the pre-eminent composers of \"classical pops\" music. Though best known for \"Sleigh Ride\" (originally a pure instrumental) and \"Syncopated Clock\" (used as theme music for the CBS \"Late Show\" and Jeopardy), he wrote many others just as deserving of attention which are still widely played in pops concerts.\n\nNote that although his first name is spelled normally, it seems to be universally pronounced le-ROY. For more information, check out the official web page at http://www.leroy-anderson.com/ .", "heard_by": []}, {"n": 560, "title": "Bright Green Field", "artist": "Squid", "year": 2021, "cover": "https://dn710204.ca.archive.org/0/items/mbid-4bbf0c19-0885-4ca4-a69c-4fa77b2f4edd/mbid-4bbf0c19-0885-4ca4-a69c-4fa77b2f4edd-29289407273.png", "aoty_url": "https://www.albumoftheyear.org/album/329449-squid-bright-green-field.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "1cda298d-bffd-40e5-b4b7-a5fc35a3e5a1", "yt_id": "EBFk50oEqQE", "rym": "https://rateyourmusic.com/release/album/squid/bright-green-field", "genres": ["country", "post-punk", "art punk", "indie rock", "electronic"], "desc_lfm_album": "Bright Green Field is the debut studio album by British band Squid, released on 7 May 2021 through Warp Records. The album received widespread acclaim from critics. At Metacritic, which assigns a normalized rating out of 100 to reviews from mainstream publications, the album received a weighted average score of 89, based on 17 reviews, indicating \"universal acclaim\". In an interview with Exclaim!, frontman Ollie Judge said that the record's tracks \"illustrate the places, events, and architecture that exist within (the album). Previous releases were playful and concerned with characters, whereas this album is darker and more concerned with the .", "desc_lfm_artist": "Formed while at university in Brighton, the five-piece -- Ollie Judge (vocals, drums), Louis Borlase (vocals, guitar), Anton Pearson (guitar), Laurie Nankivell (bass), and Arthur Leadbetter (keys) -- played their first gig after replying to an advert for a \"young person's jazz night.\" Quickly putting a set list together, their idiosyncratic mix of half-yelped, half-sung vocals, jerky, angular guitars, brass blasts, and droney synth lines caught the ears of the U.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 561, "title": "For My Mama and Anyone Who Look Like Her", "artist": "McKinley Dixon", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/336575-for-my-mama-and-anyone-who-look-like-her.jpg", "aoty_url": "https://www.albumoftheyear.org/album/336575-mckinley-dixon-for-my-mama-and-anyone-who-look-like-her.php", "aoty_critic_score": 88, "aoty_user_score": 81, "mbid": "f00c0883-8627-43ad-b19f-2ac6a7d3d94c", "yt_id": "jwKyHtTDDzA", "rym": "https://rateyourmusic.com/release/album/mckinley-dixon/for-my-mama-and-anyone-who-look-like-her", "genres": [], "desc_lfm_album": "For My Mama And Anyone Who Look Like Her, McKinley Dixon’s debut album on Spacebomb, is the culmination of a journey where heartbreak and introspection challenged him to adapt new ways of communicating physically and mentally, as well as across time and space. The album challenges Black people to revisit more than one timeline and question everything they’ve been taught about processing grief in order to rebuild their present and future selves. There’s no definitive end to the darkness and trauma of the past, but this album is a stepping stone in Dixon’s pursuit of moving forward, and being a .", "desc_lfm_artist": "McKinley Dixon (born October 28, 1995) is an American rapper and singer from Richmond, Virginia.\n\nHis first album, “Who Taught You to Hate Yourself?”, was released in 2016.\n\nIn 2023, Dixon would release his second and most popular studio album, “Beloved! Paradise! Jazz!?” which received critical acclaim for its lyricism and storytelling.\n\nIn June 2025, Dixon released the next album called “Magic, Alive!”", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 562, "title": "Coral Island", "artist": "The Coral", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/329759-coral-island.jpg", "aoty_url": "https://www.albumoftheyear.org/album/329759-the-coral-coral-island.php", "aoty_critic_score": 82, "aoty_user_score": 68, "mbid": "a9ac9d83-9b6e-4842-98bb-3971c9ba03ea", "yt_id": "difQoPoSoxk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Coral is a rock band that formed in 1996 in Hoylake, Wirral Peninsula, England. The band consists of James Skelly (vocals, guitar), Lee Southall (guitar), Paul Duffy (bass), Nick Power (keyboards) and Ian Skelly (drums).\n\nThe band's music is a mixture of 1960s-style psychedelia and folk-rock with old-fashioned country and modern alternative rock influences. The Coral have released nine albums (The Coral, Magic and Medicine, Nightfreak and the Sons of Becker", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "paqueradejere"]}, {"n": 563, "title": "The Million Masks Of God", "artist": "Manchester Orchestra", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/337005-the-million-masks-of-god.jpg", "aoty_url": "https://www.albumoftheyear.org/album/337005-manchester-orchestra-the-million-masks-of-god.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "ea9b42b7-b414-43c6-8ef6-ef246c476409", "yt_id": "gJED17ThojI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Manchester Orchestra is an American indie rock band which formed in Atlanta, Georgia in 2004. The group is currently composed of rhythm guitarist, singer/songwriter Andy Hull, lead guitarist Robert McDowell, keyboardist and percussionist Chris Freeman, bassist Jonathan Corley and drummer Tim Very. Former drummer Jeremiah Edmond parted ways with the band in January 2010 to focus on his family as well as running the band's record label, Favorite Gentlemen.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere"]}, {"n": 564, "title": "Play with the Changes", "artist": "Rochelle Jordan", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/361287-play-with-the-changes.jpg", "aoty_url": "https://www.albumoftheyear.org/album/361287-rochelle-jordan-play-with-the-changes.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "79b3edf4-b637-4ddb-8e6e-9ea9b04713a2", "yt_id": "JUlXOQC3w0g", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Born in London, but raised on the Eastside of Toronto, singer/songwriter Rochelle Jordan is a pivotal figure in the future sound of R&B/pop.  A glorious anomaly in an era of brooding, gritty R&B, producing brash and buoyant feminist anthems,  Rochelle is known for her innovative yet throwback inspired, uncommon melody, lyrics, production and vocals.\n\nRochelle built a cult following with past releases including ROJO, the Origins EP (2011), PRESSURE (2012) and 1021 (2014).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 565, "title": "Te Amo Lá Fora", "artist": "DUDA BEAT", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/359135-te-amo-la-fora.jpg", "aoty_url": "https://www.albumoftheyear.org/album/359135-duda-beat-te-amo-la-fora.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "7b929d6a-21a6-4d9c-8123-9f1186fbf455", "yt_id": "_1peLuQ2j3A", "rym": null, "genres": [], "desc_lfm_album": "Te Amo Lá Fora is the second studio album by Brazilian singer-songwriter Duda Beat, released on April 27, 2021. \"Meu Pisêro\" was released as the lead single from the album on March 13, 2021. The singer announced the album on April 21, 2021, along with the album cover. .", "desc_lfm_artist": "Eduarda Bittencourt Simões, better known as DUDA BEAT, is a Brazilian singer and songwriter.\n\nShe was born in Recife, land of Manguebeat and beautiful musical traditions. From an early age, she showed an interest in singing. She moved to Rio de Janeiro at the time she graduated from school, still wishing to attend Medicine school. This whole journey, with an inevitable participation of some loves she had throughout her life, culminated in her first studio album titled Sinto Muito.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 566, "title": "Nurture", "artist": "Porter Robinson", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/211264-nurture_112746.jpg", "aoty_url": "https://www.albumoftheyear.org/album/211264-porter-robinson-nurture.php", "aoty_critic_score": 77, "aoty_user_score": 85, "mbid": "e2cc165d-b935-4e7c-8728-77cf01ab21ed", "yt_id": "5k0yOqIclC4", "rym": "https://rateyourmusic.com/release/album/porter-robinson/nurture", "genres": [], "desc_lfm_album": "Nurture is the second studio album by American electronic music producer Porter Robinson, released on April 23, 2021, by Mom + Pop Music. After almost 7 years of emotional struggle, creative drought, and family illness, Porter Robinson's sophomore album, Nurture, released on April 23rd, 2021. On January 28, 2020, Robinson's social media announced his sophomore album, Nurture. The album features vocals that are artificially pitched up to sound feminine. After the release of the lead single, \"Get Your Wish\", Porter explained that the lyrics were about his struggle to create and be proud of the music he was writing, due .", "desc_lfm_artist": "Porter Robinson is an American DJ, record producer, musician, and singer from Chapel Hill, North Carolina. He started his career at the young age of 12, his passion for music being ignited by the media he consumed at the time, especially Dance Dance Revolution. Starting off making music online, he found his way to popularity and was in the mainstream by the end of 2010, after which he started gaining recognition from popular artists. His first EP", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "alberto_gu", "paqueradejere", "sdecandelario"]}, {"n": 567, "title": "Inbred", "artist": "Ethel Cain", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/346144-inbred.jpg", "aoty_url": "https://www.albumoftheyear.org/album/346144-ethel-cain-inbred.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "6c185ab2-e304-417e-8279-36743cb3ed50", "yt_id": "MfQ1txGXXQg", "rym": null, "genres": [], "desc_lfm_album": "Inbred is the fourth EP by American singer-songwriter Ethel Cain, released on April 22, 2021, via Daughters of Cain Records. The project was a departure from the heavier dream-pop sound of her previous EP, Golden Age, and a step towards a cleaner, more alt-rock inspired sound. To promote the EP, three singles were released, \"Michelle Pfeiffer\", \"Crush\" and \"Unpunishable\". .", "desc_lfm_artist": "Ethel Cain is a musical project of American singer-songwriter, record producer, and model Hayden Silas Anhedönia (born March 24, 1998). This project is noted for lyrics focused on nostalgic and Southern Gothic themes, while the music has been associated with the ambient, indie rock, and contemporary folk genres. \n\nWhile Ethel Cain is her most notable project to-date, Anhedönia has other projects under different monikers, such as ΛTLΛS, Miss Anhedönia, Tommy, White Silas, and אשמדאי.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 568, "title": "Civilisation II", "artist": "Kero Kero Bonito", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/338956-civilisation-ii.jpg", "aoty_url": "https://www.albumoftheyear.or eleased thier debut album New Long Leg on 2nd April. The 10-track long-player, which includes ‘Strong Feelings’ and last year’s single ‘Scratchcard Lanyard’, was recorded over two weeks last summer at Rockfield Studios in rural Wales with producer John Parish (PJ Harvey, Aldous Harding). .", "desc_lfm_artist": "Dry Cleaning are an English post-punk band formed in South London in 2017. The group consists of vocalist Florence Shaw, guitarist Tom Dowse, bassist Lewis Maynard, and drummer Nick Buxton. Noted for their distinctive blend of motorik riffs, angular guitar work, and Shaw’s spoken-word vocal delivery, Dry Cleaning quickly gained attention for their unconventional lyrics, dry wit, and minimalist approach.\n\nAfter initially coming together as longtime friends experimenting with instrumentals", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 572, "title": "G_d's Pee AT STATE'S END!", "artist": "Godspeed You! Black Emperor", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/341595-g-ds-pee-at-states-end.jpg", "aoty_url": "https://www.albumoftheyear.org/album/341595-godspeed-you-black-emperor-g-ds-pee-at-states-end.php", "aoty_critic_score": 82, "aoty_user_score": 79, "mbid": "3805cfb2-b333-4ed0-a696-019666cca5d7", "yt_id": "IuovRNNjcvk", "rym": "https://rateyourmusic.com/release/album/godspeed-you-black-emperor/g_ds-pee-at-states-end", "genres": [], "desc_lfm_album": "\"we wrote it on the road mostly. when that was still a place. and then recorded it in masks later, distanced at the beginning of the second wave. it was autumn, and the falling sun was impossibly fat and orange. we tried to summon a brighter reckoning there, bent beneath varied states of discomfort, worry and wonderment. we fired up the shortwave radios again, for the first time in a long time. and found that many things had changed. the apocalypse pastors were still there, but yelling END TIMES NOW where they once yelled \"end times soon\". and the transmission-detritus .", "desc_lfm_artist": "Godspeed You! Black Emperor (formerly punctuated Godspeed You Black Emperor! and abbreviated to GY!BE, GYBE or Godspeed) is a Canadian post-rock band based in Montreal, Quebec. \n\nFormed in 1994 in Montreal, Canada, the band has been highly influential within the post-rock genre. Working with orchestrated arrangements, the nine-piece group created tracks with wide dynamic ranges, a highly evocative use of instrumentation and sounds and uncompromising long form compositions.", "desc_mb_album": "", "desc_mb_artist": "Up to the release of “'''[https://musicbrainz.org/release-group/fc3cf08c-3273-3af3-84ed-ab9782a72505|Yanqui U.X.O.]'''”, GYBE placed the exclamation mark at the end of their name. It was then moved to match the [https://en.wikipedia.org/wiki/God_Speed_You!_Black_Emperor|film] they had taken their name from.\r\n----\r\n    * “''&#91;Yanqui U.X.O.&#93; marks the first release by the group after slightly altering their name (moving the exclamation mark from the \"emperor\" to the \"you\")''” -- [https://en.wikipedia.org/wiki/Yanqui_U.X.O.|Wikipedia]\r\n    * “''In the beginning of their career, they were known as \"Godspeed You Black Emperor!\", but the name was later changed to have the exclamation point after the word \"You\".''” [https://www.urbandictionary.com/define.php?term=godspeed+you+black+emperor", "heard_by": ["Frikomid", "armandwave"]}, {"n": 573, "title": "For Those I Love", "artist": "For Those I Love", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/324684-for-those-i-love-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/324684-for-those-i-love-for-those-i-love.php", "aoty_critic_score": 91, "aoty_user_score": 69, "mbid": "0887eb1b-70bc-4b96-933a-fe7330ecbc24", "yt_id": "Nqybtz4BibQ", "rym": "https://rateyourmusic.com/release/album/for-those-i-love/for-those-i-love", "genres": [], "desc_lfm_album": "For Those I Love is the self-titled debut
