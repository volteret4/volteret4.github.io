<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOTY Must Hear — 2020s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/images/discount.png" />
<script defer src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;
  --accent:#e8ff47;--heard:#e8ff47;--pending:#ff4747;
  --text:#e0e0e0;--muted:#555;--gap:6px;
  --panel:390px;--header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{
  position:fixed;top:0;left:0;right:var(--panel);height:var(--header-h);z-index:100;
  background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:0 18px;display:flex;align-items:center;gap:12px;
}
.back-link{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.dec-wrap{position:relative}
.dec-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);
  color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.dec-btn:hover{background:rgba(232,255,71,.12)}
.dec-dropdown{
  display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:160px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.dec-dropdown.open{display:block}
.dec-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.dec-item{display:block;padding:6px 14px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);text-decoration:none;transition:background .1s}
.dec-item:hover{background:var(--surface)}
.dec-item.active{color:var(--accent)}
.controls{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0}
.filter-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.search-box{
  font-family:'DM Mono',monospace;font-size:.62rem;padding:4px 9px;
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);width:130px;outline:none;transition:border-color .15s;
}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.genre-wrap{position:relative}
.genre-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.genre-btn:hover,.genre-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.genre-btn .badge{background:var(--accent);color:#000;border-radius:10px;padding:1px 5px;font-size:.52rem;font-weight:700}
.genre-dropdown{
  display:none;position:fixed;
  background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:200px;max-height:320px;overflow-y:auto;padding:4px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.genre-dropdown.open{display:block}
.genre-dh{
  padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:3px;
  display:flex;justify-content:space-between;
}
.genre-clear{color:var(--pending);cursor:pointer}
.genre-item{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;transition:background .1s}
.genre-item:hover{background:var(--surface)}
.genre-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.genre-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);cursor:pointer;flex:1;display:flex;justify-content:space-between}
.genre-item label span{color:var(--muted);font-size:.56rem}
.user-wrap{position:relative}
.user-btn{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.user-btn:hover{background:rgba(232,255,71,.12)}
.user-btn .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.user-dropdown{display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;z-index:9999;min-width:164px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.user-dropdown.open{display:block}
.user-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.user-item{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;transition:background .1s;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text)}
.user-item:hover{background:var(--surface)}
.user-item.active{color:var(--accent)}
.user-item .u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.user-item.active .u-dot{background:var(--accent)}
#main{margin-top:var(--header-h);margin-right:var(--panel);padding:14px 18px 60px;position:relative;z-index:0}
.count-bar{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px;display:flex;gap:14px}
.count-bar b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.05);z-index:10}
.card.hidden{display:none}
.card.active-card{outline:2px solid var(--accent);outline-offset:2px;z-index:11}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.heard-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3;background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,0) 55%);
  opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px;z-index:2;
}
.card:hover .card-overlay{opacity:1}
.card-scores{display:flex;gap:3px;margin-bottom:2px}
.card-score{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;padding:1px 4px;border-radius:2px}
.card-score.c{background:rgba(108,184,250,.2);color:#6cb8fa}
.card-score.u{background:rgba(191,143,255,.2);color:#bf8fff}
.card-title{font-size:.56rem;font-weight:500;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{font-size:.52rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3}
.card.heard-user::before{background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card.unheard-user::before{background:var(--pending);box-shadow:0 0 5px var(--pending)}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panel);
  background:#0c0c0c;border-left:1px solid var(--border);
  z-index:50;display:flex;flex-direction:column;overflow:hidden;
}
.panel-topbar{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 15px;flex-shrink:0}
.panel-topbar-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel-cover{width:100%;aspect-ratio:1;flex-shrink:0;position:relative;background:var(--surface);max-height:200px;overflow:hidden}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-scores{display:flex;gap:6px;position:absolute;bottom:8px;left:8px}
.panel-score{padding:3px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700}
.panel-score.c{background:rgba(0,0,0,.7);color:#6cb8fa;border:1px solid #6cb8fa44}
.panel-score.u{background:rgba(0,0,0,.7);color:#bf8fff;border:1px solid #bf8fff44}
.panel-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.panel-empty-icon{font-size:2rem;opacity:.3}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);line-height:1.05;margin-bottom:2px}
.panel-artist{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.panel-year{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.panel-genre-tag{font-family:'DM Mono',monospace;font-size:.56rem;padding:2px 6px;border-radius:2px;background:rgba(232,255,71,.07);border:1px solid rgba(232,255,71,.18);color:rgba(232,255,71,.65)}
.panel-heard-by{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:9px}
.panel-heard-by b{color:var(--heard)}
.panel-divider{height:1px;background:var(--border);margin:9px 0}
.panel-section-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.panel-bio{font-size:.72rem;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-bio::-webkit-scrollbar{width:3px}
.panel-bio::-webkit-scrollbar-thumb{background:var(--border)}
.desc-block{margin-bottom:9px}
.desc-source-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.desc-source-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.desc-source-label.lfm{color:#d51007}.desc-source-label.mb{color:#ba478f}.desc-source-label.artist{color:#6a9fb5}
.desc-source-text{font-size:.7rem;color:#aaa;line-height:1.55}
.panel-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.panel-link{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}
.panel-link.aoty{border-color:#e87c2e;color:#e87c2e}
.panel-link.aoty:hover{background:rgba(232,124,46,.08)}
.panel-link.yt{border-color:#f00;color:#f00}
.panel-link.yt:hover{background:rgba(255,0,0,.08)}
.panel-link.rym{border-color:#5baadb;color:#5baadb}
.panel-link.rym:hover{background:rgba(91,170,219,.08)}
.panel-yt-wrap{margin-top:11px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.panel-yt-wrap iframe{display:block;width:100%;height:145px;border:none}
.panel-yt-placeholder{height:60px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.panel-close-btn{display:none;position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.18)}
.grid-sizer{display:flex;align-items:center;gap:5px}
.grid-sizer span{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);min-width:24px;text-align:right}
#grid-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#grid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
#grid-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#empty{display:none;text-align:center;padding:50px 0;font-family:'DM Mono',monospace;color:var(--muted);font-size:.7rem}
@media(max-width:600px){
  :root{--header-h:50px}
  header{right:0;height:auto;min-height:var(--header-h);flex-wrap:wrap;padding:8px 12px;gap:6px 10px;overflow:visible}
  #main{margin-right:0;padding:10px 10px 60px}
  #panel{inset:0;width:100%;border-left:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  #panel.panel-open{transform:translateY(0)}
  .panel-close-btn{display:flex}
  .controls{flex:0 0 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:5px;padding:5px 0 2px;border-top:1px solid var(--border);scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .dec-wrap{display:none}
}</style>
</head>
<body>
<header>

  </div>
</aside>

</div>

</div>
<div class="user-dropdown" id="user-dd">

  <div id="user-list"></div>
</div>
<script>
const ALBUMS = [{"n": 1, "title": "The Mountain", "artist": "Gorillaz", "year": 2026, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1460893-the-mountain_162157.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1460893-gorillaz-the-mountain.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "b82f59df-2659-4c23-a3b6-9eb2518b4327", "yt_id": "XOYI3HAUww0", "rym": null, "genres": ["Electronic", "Alternative Rock"], "desc_lfm_album": "The Mountain (also stylized in Devanagari as पर्वत, parvat, 'mountain' in Hindi) is the ninth studio album by English virtual band Gorillaz. Originally set for release on 20 March 2026, it was pushed forward to release on 27 February 2026 via the band's own label, Kong, and will be distributed by The Orchard, a subsidiary of Sony Music Entertainment. Produced by Damon Albarn, Remi Kabaka Jr., James Ford and Samuel Egglenton, the album includes collaborations with Anoushka Shankar, Jalen Ngonda, Black Thought, IDLES, Johnny Marr, Trueno, Omar Souleyman, Yasiin Bey, Asha Bhosle, Paul Simonon, as well as posthumous appearances by .", "desc_lfm_artist": "Gorillaz is a British virtual band created in 1998 by musician Damon Albarn and artist Jamie Hewlett. The band currently consists of four animated members: Murdoc Niccals (bass guitar) who formed the band, 2-D (lead vocals, keyboards), Noodle (guitar, vocals) and Russel Hobbs (drums and percussion). Their fictional universe is explored through animated music videos, interviews and animated shorts. In reality, Albarn is the only permanent musical contributor and often collaborates with other musicians.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 2, "title": "HYPERYOUTH (afterparty)", "artist": "Joey Valence & Brae", "year": 2026, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1599773-hyperyouth-afterparty_071816.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1599773-joey-valence-brae-hyperyouth-afterparty.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "c73adb8f-8fce-4dec-aa71-4be742e480c3", "yt_id": "QdKCUGMk2q4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Multi-genre producer, vocalist, and writer Joey Valence is blending elements of classic breakbeat hip-hop, boom bap, hardcore punk, and other alternative genres in a strikingly refreshing way. \n\nCombined with the additional lyrical talent of vocalist Brae, the two have explosively launched into the alternative and hip-hop scenes with their high-energy antics, easily identifiable style and masterful use of social media. Over just one year, the duo has organically garnered over 1 million total followers, 80 million views and 22 million streams.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 3, "title": "Nothing's About to Happen to Me", "artist": "Mitski", "year": 2026, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1617518-nothings-about-to-happen-to-me_130138.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1617518-mitski-nothings-about-to-happen-to-me.php", "aoty_critic_score": 85, "aoty_user_score": 78, "mbid": "f24aa16e-4bb0-4ba3-8317-91c0a518f0a1", "yt_id": "RaydHvEWGJE", "rym": null, "genres": ["Alternative Rock"], "desc_lfm_album": "\"Nothing's About to Happen to Me\" is the eighth studio album by Japanese-American musician Mitski. It was announced for release on February 27, 2026, through Dead Oceans Records. Mitski wrote and performed all the songs on the album, which was produced and engineered by her longtime collaborator Patrick Hyland and mastered by Bob Weston. It also features live instrumentation by The Land touring band and orchestral arrangements by Drew Erickson. The cover art painting was done by Marc Burkhardt, and New Yorker cartoonist Emily Flake drew an interpretation of the lead single, \"Where's My Phone?\". Nothing's About to Happen to .", bumoftheyear.org/600x0/album/1517560-singin-to-an-empty-chair_180228.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1517560-ratboys-singin-to-an-empty-chair.php", "aoty_critic_score": 83, "aoty_user_score": 73, "mbid": "362e059b-f4d8-4031-87d6-9118fdb5867f", "yt_id": "KYUMoL9FrIA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ratboys are an American indie rock band from Chicago, Illinois formed in 2010 by Julia Steiner and Dave Sagan. The band consists of Julia Steiner (guitar, vocals), Dave Sagan (guitar), Marcus Nuccio (drums) and Sean Neumann (bass, vocals). \n\nFounded by songwriters Julia Steiner and Dave Sagan during their time studying at Notre Dame in South Bend, Indiana, the band relocated back to Sagan's hometown of Chicago in 2015 and released its debut album AOID that same year on Topshelf Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 6, "title": "URGH", "artist": "Mandy, Indiana", "year": 2026, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1536004-urgh_135747.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1536004-mandy-indiana-urgh.php", "aoty_critic_score": 84, "aoty_user_score": 74, "mbid": "777553e9-0372-4c6a-8cb3-a3ded21c56c1", "yt_id": "BUn7Cu74pWI", "rym": "https://rateyourmusic.com/release/album/mandy-indiana/urgh", "genres": ["Punk"], "desc_lfm_album": "", "desc_lfm_artist": "Mandy, Indiana is the experimental project of Scott Fair, Valentine Caulfield and Liam Stewart (who has previously toured with Lonelady).\n\nIntentionally raw production from Fair combined with a heady interest in the more macabre elements of literature and film (the band cites the work of filmmakers and writers such as Gaspar Noe, Leos Carax and Irvine Welsh as inspiration) come together to present a vision that skews the lines between post punk and the rave.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "paqueradejere", "sdecandelario"]}, {"n": 7, "title atures previously unreleased vocals from him. .", "desc_lfm_artist": "De La Soul is an American hip-hop group formed in 1988 in the Amityville area of Long Island, New York. They are best known for their eclectic sampling, quirky lyrics, and their contributions to the evolution of the jazz rap and alternative hip-hop subgenres. The members are Posdnuos, Maseo, and Trugoy (until his death in 2023). The three formed the group in high school and caught the attention of producer Prince Paul with a demo tape of the song \"Plug Tunin'\".", "desc_mb_album": "", "desc_mb_artist": "Please don’t add the album [http://musicbrainz.org/release-group/4aebff62-baae-4017-a9e4-12cbbc4ecc7b|“First Serve”] here. It is already there with the correct Artist [http://musicbrainz.org/artist/a904f60a-b8d2-4ed5-90b5-569bf28d1a80|“First Serve”].", "heard_by": ["MaxtorUwU", "paqueradejere"]}, {"n": 16, "title": "Tranquilizer", "artist": "Oneohtrix Point Never", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1501893-tranquilizer_125846.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1501893-oneohtrix-point-never-tranquilizer.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "2018306c-88af-479a-9876-57a0a210ee18", "yt_id": "3ZMzLZJu6Qg", "rym": "https://rateyourmusic.com/release/album/oneohtrix-point-never/tranquilizer", "genres": ["Electronic"], "desc_lfm_album": "", "desc_lfm_artist": "Daniel Lopatin (born 25 July 1982), best known by the recording alias Oneohtrix Point Never, is an American experimental musician, composer, and producer based in Brooklyn. He began releasing electronic recordings under the OPN moniker in 2007, and received early acclaim in 2009 for the compilation Rifts. In subsequent years, he released albums such as Replica (2011) and R Plus Seven (2013) to critical praise and signed to British label Warp, while also taking part in a number of side-projects, collaborations, and film scores.", "desc_mb_album": "", "desc_mb_artist": "", ncluding the signature EGO color, reinforcing Williams' unconventional approach to distribution after leaving her Atlantic Records contract. Days before the surprise release, Williams premiered .", "desc_lfm_artist": "Hayley Williams (born December 27, 1988) is an American singer-songwriter. She is best known as the lead vocalist, primary songwriter, and keyboardist of the rock band Paramore. She is also one half of the indie rock duo  Power Snatch, alongside Daniel James.\n\nBorn and raised in Mississippi, Williams moved to Tennessee at the age of 15 when her parents divorced in 2002. In 2004, she formed Paramore alongside Josh Farro, Zac Farro, and Jeremy Davis.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 57, "title": "The Passionate Ones", "artist": "Nourished By Time", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1147985-the-passionate-ones_140850.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1147985-nourished-by-time-the-passionate-ones.php", "aoty_critic_score": 86, "aoty_user_score": 80, "mbid": "a0f0cb15-7873-44f4-a0d5-89f4f11e61fc", "yt_id": "rmypczDXOWg", "rym": null, "genres": ["Electronic"], "desc_lfm_album": "The Passionate Ones is the second studio album by Nourished by Time, released on August 22, 2025 through XL Recordings. The album was preceded by the singles “Max Potential”, released May 7, 2025, “9 2 5” in July 2025, and “BABY BABY” in August 2025. A 25-date North American and European tour in support of the album began on September 11, 2025, in Baltimore. .", "desc_lfm_artist": "Nourished By Time is a Baltimore based songwriter/producer. With a unique blend of New Wave, R&B, and dance, Nourished By Time’s music explores themes of existentialism, love, consumerism and their relationship with labor.\n\nThe project was initially created in Los Angeles (where the artist used to live in Koreatown) at the end of 2019. After two years of failure and artistic differences w "", "heard_by": []}, {"n": 68, "title": "I Love My Computer", "artist": "Ninajirachi", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1350630-i-love-my-computer_225950.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1350630-ninajirachi-i-love-my-computer.php", "aoty_critic_score": 88, "aoty_user_score": 84, "mbid": "6ab2d1f5-1730-499d-a814-6fe6eb9ec1f0", "yt_id": "RKybAhTw8iE", "rym": "https://rateyourmusic.com/release/album/ninajirachi/i-love-my-computer", "genres": ["Electronic", "Pop"], "desc_lfm_album": "I Love My Computer is the debut album from Australian electronic producer Ninajirachi, released on August 8, 2025. On June 12, 2025, the album was formally announced through her social media accounts. The album’s lead single, “All I Am” was released on February 25, 2025 and marked the beginning of a brand new era of Ninajirachi. Existing within the same universe as her previous release and her newly coined self-referential music style, girlEDM, this new computer-obsessed era was first teased through an interactive website, 4562—curated by Ninajirachi and frequent collaborator Aria Zarzycki. Fans who subscribed to a special mailing list .", "desc_lfm_artist": "Ninajirachi is the moniker of Australian DJ Nina Wilson, who is based near Sydney, New South Wales. She creates an eclectic palette of snappy and inspired electronic musings to deliver what Triple J has described as 'dance music made in an ice cave' and Indie Shuffle has described as 'Lush and ethereal' - taking influence from acts such as Flume, Porter Robinson and Mura Masa.\n\nShe was a finalist in Triple J's Unearthed High competition in both 2016 and 2017", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "alberto_gu", "verygooood"]}, {"n": 69, "title": "Apiary", "artist": "Gingerbee", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1410087-apiary_220856.jpg", "aoty_url": "https://www.albumoftheyear.org/album ustralia's ARIA Albums Chart. The album was shortlisted for the 2022 Mercury Prize.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 78, "title": "Virgin", "artist": "Lorde", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1303818-virgin_160626.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1303818-lorde-virgin.php", "aoty_critic_score": 81, "aoty_user_score": 77, "mbid": "a3734ef9-80a8-40e0-8718-9eb39860ff4a", "yt_id": "tvG2qdvotsE", "rym": "https://rateyourmusic.com/release/album/lorde/virgin", "genres": [], "desc_lfm_album": "Virgin is the fourth studio album by New Zealand singer Lorde. It was released on 27 June 2025 through Universal Music New Zealand and Republic Records. It was preceded by the singles \"What Was That\", \"Man of the Year\", and \"Hammer\". Lorde co-produced the album alongside Jim-E Stack, with songwriting and additional production contributions from Blood Orange, Dan Nigro, Fabiana Palladino, Andrew Aged and Buddy Ross. Spike Stent and Tom Elmhirst were enlisted for mixing of the record, while mastering was handled by Chris Gehringer. The artwork depicts an X-ray picture of a pelvis with a belt buckle, pant zipper, .", "desc_lfm_artist": "Ella Marija Lani Yelich-O'Connor, known professionally as Lorde (born 7 November 1996 in Takapuna, Auckland, New Zealand), is a New Zealand singer-songwriter. Taking inspiration from aristocracy for her stage name, she is known for her unconventional musical styles and introspective songwriting.\n\nLorde expressed interest in performing at local venues in her early teens. She signed with Universal Music Group (UMG) in 2009 and collaborated with producer Joel Little in 2011 to start recording music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "alberto_gu", "armandwave"]}, {"n": 79, "title": "hopefully !", "artist": "Loyle Carner", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1295776-hopefully-_181055.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1295776-loyle-carner-hopefully-.php", "aoty_critic_score": 81, "aoty_user_score": 75, "mbid": "712f0bf2-e445-4c00-a84c-7f48dea27940", "yt_id": "cWgfXgGa1is", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Loyle Carner, born Benjamin Gerard Coyle-Larner, is an acclaimed English hip hop musician from South London. He is known for his introspective, confessional, and poetic style of rap, often incorporating jazz-infused production. His music delves into themes of personal identity, family, grief, politics, and his experiences with ADHD and dyslexia.\n\nKey aspects of Loyle Carner's career and artistry:\n\nMusical Style: His sound is often described as \"languid\" and \"introspective", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 80, "title": "PRODUCT", "artist": "SOPHIE", "year": 2015, "cover": "https://cdn2.albumoftheyear.org/600x0/album/41761-product_173620.jpg", "aoty_url": "https://www.albumoftheyear.org/album/41761-sophie-product.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "787dc5d8-8a38-4a1c-b9f1-9edf7bcd653d", "yt_id": "lCoCOMxJENw", "rym": null, "genres": [], "desc_lfm_album": "PRODUCT is the debut compilation album by Scottish electronic music producer SOPHIE. It was released by Numbers on 27 November 2015. Four of the eight songs on PRODUCT have appeared on singles released by Numbers from 2013 to 2015. The album was made available in \"silicon bubble cases\", and its release coincides with the launch of a line of apparel and a \"silicon product\" resembling a sex toy. The Japanese CD release comes with a bonus track, GET HIGHER. On 25 September 2019, Numbers announced that the album was being re-released in limited quantities in it's original format of four .", "desc_lfm_artist": "There are multiple artists that have performed under the name Sophie:\n\n1) Sophie Xeon (September 17, 1986 – January 30, 2021), mononymously known by her stage name Sophie (stylized in all caps), was a Scottish producer and singer-songwriter who worked in Los Angeles and lived in Greece. She came to prominence in 2013 with her single \"Bipp\"/\"Elle\" and released \"Lemonade\"/\"Hard\" the following year. She worked closely with artists from the PC Music label and produced for acts including Charli XCX", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "alberto_gu"]}, {"n": 81, "title": "Tether", "artist": "Annahstasia", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1259532-tether_002504.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1259532-annahstasia-tether.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "ae371a9b-95de-4c92-b0ff-cac39ea05c7a", "yt_id": "EJendwI1Qec", "rym": null, "genres": ["avant-garde", "chamber folk", "art rock", "contemporary folk", "soul", "contemporary jazz"], "desc_lfm_album": "", "desc_lfm_artist": "Annahstasia Enuke is a Los Angeles/New York City based soul musician who weaves her spiritual evolution into hypnotic vocal tapestries. Working within multiple mediums Annahstasia creates a rich visual language that informs her music and collaborations.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 82, "title": "Alive In The Catacombs", "artist": "Queens of the Stone Age", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1347533-alive-in-the-catacombs_162551.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1347533-queens-of-the-stone-age-alive-in-the-catacombs.php", "aoty_critic_score": 87, "aoty_user_score": 80, "mbid": "2dc292b2-62ee-4f4d-a639-575d91f40a20", "yt_id": "G14LBixxxWo", "rym": null, "genres": [], "desc_lfm_album": "Alive in the Catacombs is an acoustic concert film recorded on the 8th of July 2024 and released digitally on the 5th of June 2025 Tracklist: Running Joke / Paper Machete (from Era Vulgaris / In Times New Roman...) Kalopsia (from ...Like Clockwork) Villians of Circumstance (from Villians) Suture Up Your Future (from Era Vulgaris) I Never Came (from Lullabies to Paralyze) Insignificant Other .", "desc_lfm_artist": "Queens of the Stone Age is a rock band from Palm Desert, California, United States. The band is frequently labeled stoner rock, although they reject the label. They developed a style of riff-oriented, heavy music which the band's founder and mastermind Josh Homme described as \"robot rock\", saying that he \"wanted to create a heavy sound based on a solid jam, just pound it into your head\". Since then, their sound has evolved to incorporate a variety of different styles and influences.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 83, "title": "Magic, Alive!", "artist": "McKinley Dixon", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1227674-magic-alive_133714.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1227674-mckinley-dixon-magic-alive.php", "aoty_critic_score": 86, "aoty_user_score": 87, "mbid": "4e3abdbf-998a-4da7-a26a-68e9e006f565", "yt_id": "9Si0lro-K5w", "rym": "https://rateyourmusic.com/release/album/mckinley-dixon/magic-alive", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "\"On 2023’s critically acclaimed Beloved! Paradise! Jazz!?, McKinley Dixon explored his literary-minded subject matter with a highly personalized, distinctly poetic point of view. Truly, the Chicago-based rapper did so much with that half-hour effort that it should surprise no one in his fanbase that he pulls it off once more for the marginally longer Magic, Alive! Diving right in with the introductory “Watch My Hands,” he evokes the characteristics of a sweaty summer as a means for scene-setting in his storytelling. Family ties tighten quickly around “Run, Run, Run Pt. II” and “Sugar Water,” the latter a soul-jazz hybrid elevated .", "desc_lfm_artist": "McKinley Dixon (born October 28, 1995) is an American rapper and singer from Richmond, Virginia.\n\nHis first album, “Who Taught You to Hate Yourself?”, was released in 2016.\n\nIn 2023, Dixon would release his second and most popular studio album, “Beloved! Paradise! Jazz!?” which received critical acclaim for its lyricism and storytelling.\n\nIn June 2025, Dixon released the next album called “Magic, Alive!”", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU"]}, {"n": 84, "title": "Lotus", "artist": "Little Simz", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1236309-lotus_184044.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1236309-little-simz-lotus.php", "aoty_critic_score": 86, "aoty_user_score": 82, "mbid": "749672ae-a51d-4cf5-920c-beaeab147bb6", "yt_id": "Z2BplWSCZpY", "rym": "https://rateyourmusic.com/release/album/little-simz/lotus", "genres": ["Hip-Hop"], "desc_lfm_album": "Lotus is the sixth studio album by Little Simz, released on June 6, 2025. It was produced by Miles Clinton James. .", "desc_lfm_artist": "Simbiatu \"Simbi\" Abisola Abiola Ajikawo, better known by her stage name Little Simz, is a British rapper, singer and actress. She rose to prominence with the independent release of her first three albums, namely A Curious Tale of Trials + Persons (2015), Stillness in Wonderland (2016) and Grey Area (2019), the latter of which was shortlisted for the Mercury Prize and won the awards for Best Album at both the Ivor Novello Awards and the NME Awards.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 85, "title": "NEVER ENOUGH", "artist": "Turnstile", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1277103-never-enough_164208.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1277103-turnstile-never-enough.php", "aoty_critic_score": 84, "aoty_user_score": 75, "mbid": "58310aac-65aa-492e-83fb-ec50c58e5a1d", "yt_id": "rLEqpQZ6tOE", "rym": null, "genres": [], "desc_lfm_album": "Never Enough (stylized in all caps) is the fourth studio album by American hardcore punk band Turnstile, released on June 6, 2025, through Roadrunner Records. It serves as a follow-up to the band's previous studio album Glow On. It is their first album to feature guitarist Meg Mills following founding member Brady Ebert’s 2022 departure. Never Enough was initially promoted through a billboard on Sunset Boulevard in Los Angeles, California in late March 2025, teasing a release date of June 6 the same year and confirming Mills as an official member. On April 8, 2025, Turnstile released the lead single .", "desc_lfm_artist": "Turnstile is a rock band that formed in Baltimore, Maryland in 2014. The band currently consists of Brendan Yates (vocals), Daniel Fang (drums), Franz Lyons (bass), Pat McCrory (guitar), and Meg Mills (guitar). Former members include Sean Cullen (guitar) and Brady Ebert (guitar). The band has released four studio albums: \"Nonstop Feeling\" (2015), \"Time & Space\" (2018), \"Glow On\" (2021), and \"Never Enough\" (2025). \n\nTurnstile is heavily influenced by NYHC bands such as Madball and Breakdown", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 86, "title": "More", "artist": "Pulp", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1277352-more_162208.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1277352-pulp-more.php", "aoty_critic_score": 81, "aoty_user_score": 72, "mbid": "4a71079c-4145-4466-a52f-6e3dd1318ecb", "yt_id": "-27a1ugJX8U", "rym": null, "genres": [], "desc_lfm_album": "WORDS FROM JARVIS ON “MORE” “This is the first Pulp album since “We Love Life” in 2001. Yes: the first Pulp album for 24 years. How did that happen? Well: when we started touring again in 2023, we practiced a new song called “Hymn of the North” during soundchecks & eventually played it at the end of our second night at Sheffield Arena. This seemed to open the floodgates: we came up with the rest of the songs on this album during the first half of 2024. A couple are revivals of ideas from last century. The music for one .", "desc_lfm_artist": "Pulp is a britpop band that formed in 1978 in Sheffield, England, United Kingdom. The band's best known and most stable lineup consists of Jarvis Cocker (vocals), Russell Senior (guitar, violin), Mark Webber (guitar), Candida Doyle (keyboards), Steve Mackey (bass) and Nick Banks (drums). Although many members have had a long tenure with the band, the only constant member has been Cocker. In 2011, it was announced on Pulp's official website that the band's classic lineup would reunite and perform at several festivals", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 87, "title": "DELTARUNE Chapters 3+4 (Original Game Soundtrack)", "artist": "Toby Fox", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1271779-deltarune-chapters-34-original-game-soundtrack_150710.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1271779-toby-fox-deltarune-chapters-34-original-game-soundtrack.php", "aoty_critic_score": 88, "aoty_user_score": null, "mbid": "a5a2af50-14b4-400d-aab9-f2f9a71bd5ca", "yt_id": "K-ifukvnICY", "rym": null, "genres": [], "desc_lfm_album": "Deltarune Chapters 3+4 (Original Game Soundtrack) (\"Deltarune\" stylized in all caps), also known as Deltarune Chapters 3+4 OST, comprises the music featured in the third and fourth chapters of the game titled \"Late Night\" and \"Prophecy\". All tracks are written by Toby Fox. .", "desc_lfm_artist": "Toby Fox is an American developer and composer behind the 2015 hit indie video game Undertale.\n\nIn 2018, Toby Fox released Chapter 1 of his game Deltarune, following suit and composing the soundtrack on his own. Chapter 2 followed in 2021, Chapters 3 and 4 in 2025, and Chapter 5 slated for release in 2026, each accompanied by his music with minor contributions from other artists. In 2020, Fox contributed to the OMORI soundtrack.\n\nAdditionally, under the alias Radiation, Fox composed music for the webcomic Homestuck.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 88, "title": "Birthing", "artist": "Swans", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1133856-birthing_132529.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1133856-swans-birthing.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "ad7a340c-006c-4aee-a94b-da016eed124d", "yt_id": "i6MaEjYztkA", "rym": "https://rateyourmusic.com/release/album/swans/birthing", "genres": ["Rock", "Punk"], "desc_lfm_album": "Birthing is the seventeenth studio album by American post rock band Swans, and described by frontman Michael Gira as the final “big sound” album of the band’s career. It released on May 30, 2025 It concludes the 2019-2025 trilogy of albums given by the second iteration of the group post its 2010 resurrection (the two others being 2019 leaving meaning. and 2023 The Beggar). .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Rocky_stereo", "paqueradejere", "sdecandelario"]}, {"n": 89, "title": "Carrie & Lowell (10th Anniversary Edition)", "artist": "Sufjan Stevens", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1269453-carrie-lowell-10th-anniversary-edition_134037.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1269453-sufjan-stevens-carrie-lowell-10th-anniversary-edition.php", "aoty_critic_score": 93, "aoty_user_score": 93, "mbid": null, "yt_id": "9FX34TjJe-c", "rym": null, "genres": [], "desc_lfm_album": "Even on his grandest albums, Sufjan Stevens sometimes went it alone, recording himself solo, as he played all the parts of his kaleidoscopic compositions. It’s telling, then, that one of Stevens’ smallest-sounding albums—2015’s heartbreaking Carrie & Lowell—was recorded in a half-dozen studios or hotel rooms, with the assistance of multiple engineers, musicians, and even a bona fide producer, Thomas Bartlett. Only two years before Stevens made the record, his largely estranged mother, Carrie, died of stomach cancer. Despite the tense relationship, the grief blindsided Stevens, who in turn rebelled against this face-off with mortality with loose sex, drugs, and booze. .", "desc_lfm_artist": "Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 90, "title": "caroline 2", "artist": "caroline", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1285858-caroline-2_110612.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1285858-caroline-caroline-2.php", "aoty_critic_score": 84, "aoty_user_score": 76, "mbid": "52089578-57af-48be-8ee8-594db56a91ed", "yt_id": "cwUapT421Xs", "rym": "https://rateyourmusic.com/release/album/caroline/caroline-2-1", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are at least five artists named Caroline:\n\n1. A UK experimental rock band.\n2. A Finnish rock band.\n3. A young Danish pop singer.\n4. A French jazz band.\n5. A singer-songwriter from Okinawa, Japan.\n\n\n1. An experimental rock outfit based out of London, caroline's patient, meditative songs and instrumentals started with a shared interest in Midwestern emo, Appalachian folk, and classical minimalism, and a practice of deconstructing and then rebuilding the same small groups of songs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 91, "title": "MAD!", "artist": "Sparks", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1209352-mad_214424.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1209352-sparks-mad.php", "aoty_critic_score": 80, "aoty_user_score": 60, "mbid": "03ad7eeb-c2db-4c68-80fe-7a7dceb8ea85", "yt_id": "a5bSd5UGiDI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Sparks is an American rock and pop music band formed in Los Angeles in 1970 by brothers Ron Mael (keyboards) and Russell Mael (vocals), initially under the name Halfnelson. Best known for their quirky approach to song writing, Sparks' music is often accompanied by cutting and acerbic lyrics, and an idiosyncratic stage presence, typified in the contrast between Russell's wide-eyed hyperactive frontman antics and Ron's sedentary scowling.\n\nThe band's long career has seen them successfully adopt many different musical genres; including glam pop", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 92, "title": "Instant Holograms On Metal Film", "artist": "Stereolab", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1277953-instant-holograms-on-metal-film_140332.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1277953-stereolab-instant-holograms-on-metal-film.php", "aoty_critic_score": 81, "aoty_user_score": 75, "mbid": "446fc616-c4db-46ce-8d4c-e4efc019b3f8", "yt_id": "PwS6LA70NGM", "rym": null, "genres": [], "desc_lfm_album": "Instant Holograms on Metal Film is the eleventh studio album by English-French rock band Stereolab. Released on 23 May 2025 through Duophonic UHF Disks and Warp Records. It marks their first studio album in nearly 15 years, following Not Music (2010). Background and release Stereolab started teasing the record in early April 2025, via a wordsearch image sent to subscribers of their Lab Report newsletter as well as a series of Instagram posts. On 2 April, 16 years to the day that the group announced their indefinite hiatus, fans received a package called \"unsolicited Stereolab material\" comprising the lead single .", "desc_lfm_artist": "Stereolab is an Anglo-French avant-pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "paqueradejere", "sdecandelario"]}, {"n": 93, "title": "Egotrip", "artist": "John Michel", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1323617-egotrip_200035.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1323617-john-michel-egotrip.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": "6eb36179-8a8f-424c-b384-9d4eb2d75010", "yt_id": "UOOKmV2bkHE", "rym": null, "genres": [], "desc_lfm_album": "Vocalist John Michel & Producer Anthony James's debut collaborative album is a jazz-rap project mixed with soul samples. .", "desc_lfm_artist": "", "desc_mb_albu t": "Psychedelic Porn Crumpets is an Australian psychedelic rock band formed in 2014 in Perth. Members include Jack McEwan (guitar and vocals), Luke Parish (guitar), Danny Caddy (drums), Luke Reynolds (bass), and Chris Young (keyboard), who began playing together in \"an old horse barn in rural Leederville\". They have self-described their sound as \"an energetic mess of colour and tone\". \n\nConcerning the reasoning behind the name of the band, its members have given little explanation.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "sdecandelario"]}, {"n": 96, "title": "the world is still here and so are we", "artist": "mclusky", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1156613-the-world-is-still-here-and-so-are-we_133710.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1156613-mclusky-the-world-is-still-here-and-so-are-we.php", "aoty_critic_score": 80, "aoty_user_score": 72, "mbid": "a7d6dfc5-95a3-4c63-b352-35ca48dbce78", "yt_id": "9Gp-aYUnMa8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Mclusky is a three-piece group from Cardiff, Wales, who combine the energy and ethos of punk with varied dynamics and intelligent, black-humoured lyrics. The group consists of Andy Falkous, aka Falco (vocals, guitar); Jonathan Chapple (bass, vocals) and Matthew Harding (drums). \n\nAccording to the band, they formed in 1996 when Andy and Matthew met at the Blackwood Miners' Institute, a venue in their home town from which they were both ejected for dressing as miners.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 97, "title": "Tall Tales", "artist": "Mark Pritchard", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1246338-tall-tales_092315.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1246338-mark-pritchard-tall-tales.php", "aoty_critic_score": 80, "aoty_user_score": 61, "mbid": "80e3d46d-8d77-409c-947d-efe50f02806f", "yt_id" Ph.D. Marxist writer, active in the Zimbabwe War of Liberation and then a member of the government in Zimbabwe.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "armandwave"]}, {"n": 100, "title": "Fancy That", "artist": "PinkPantheress", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1264184-fancy-that_183908.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1264184-pinkpantheress-fancy-that.php", "aoty_critic_score": 76, "aoty_user_score": 80, "mbid": "bf89cc4c-ab8b-4283-8b6a-948a40d342cb", "yt_id": "qCN3PRW4jyk", "rym": null, "genres": [], "desc_lfm_album": "Fancy That marks PinkPantheress’ second mixtape alongside her debut mixtape to hell with it. The mixtape was first hinted at over the course of March 2025 when her official website was changed to a different theme. Additionally, during an interview with Mixmag, she describes her new era behind this mixtape and also compares how different her fanbase was during the release of to hell with it and Heaven knows up until now. She states: \"This one is about letting go, I’ve always been trying to strike a balance between being a pop star and also being experimental…but if you like .", "desc_lfm_artist": "PinkPantheress (Victoria Beverley Walker, born 19 April 2001) is a British singer-songwriter and record producer. Her music is noted for its use of samples and personal, diaristic lyrics.\n\nBorn in Bath, Somerset, and raised in Kent, she began her musical career in 2021 while attending university in London, producing songs using GarageBand and sharing them on SoundCloud and TikTok. Tracks such as \"Break It Off\" gained popularity on TikTok, leading", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 101, "title": "Pirouette", "artist": "Model/Actriz", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1205974-pirouette_054547.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1205974-modelactriz-pirouette.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "a88a72a7-6997-4327-a644-24c840c644f8", "yt_id": "fhHWvpIugbk", "rym": "https://rateyourmusic.com/release/album/model_actriz/pirouette", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Currently based out of Brooklyn and known for their pulsing blend of danceable noise, visceral post-punk, and a live performance that mirrors the way the record unravels, Model/Actriz is an experiment in the primal aspects of human experience.  Formed in Boston, the band draws on inspirations from a myriad of scenes, with lead singer Cole hailing from Delaware, and Jack and Ruben from Southern California. Yet there is a certain darkness that influences and permeates their music", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 102, "title": "Bloodless", "artist": "Samia", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1185395-bloodless_190052.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1185395-samia-bloodless.php", "aoty_critic_score": 83, "aoty_user_score": 76, "mbid": "1636f8c8-4771-4032-9d08-db6c9a5d1093", "yt_id": "ARLKI6OY2Ms", "rym": null, "genres": [], "desc_lfm_album": "Bloodless is the third studio album by American singer-songwriter and musician Samia. It was released on April 25, 2025, by Grand Jury Music in vinyl, CD and digital formats. It features five singles released between January and March 2025, titled \"Bovine Excision\", \"Lizard\", \"Hole in a Frame\", \"Pants\", and \"Carousel\". Co-produced by Caleb Wright and Jake Luppen, Bloodless consists of thirteen songs with a total runtime of approximately forty minutes. Samia released the first single, \"Bovine Excision\", on January 14, 2025, alongside a music video. On February 18, 2025, the second single of the album, \"Lizard\", was released. Samia released .", "desc_lfm_artist": "Samia is American singer-songwriter Samia Finnerty (born Samia Najimy Finnerty in Los Angeles on 12 December 1996). Based in New York City, she is the daughter of actress Kathy Najimy, and musician Dan Finnerty of the Dan Band. Performing since she was seventeen around New York, Samia’s musical repertoire shows an astounding variety for her age, featuring poppy anthems, folk ballads, and indie rock jams. \nIn 2020 she released her debut album, The Baby.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 103, "title": "A Complicated Woman", "artist": "Self Esteem", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1200698-a-complicated-woman_184607.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1200698-self-esteem-a-complicated-woman.php", "aoty_critic_score": 81, "aoty_user_score": 37, "mbid": "494bccf2-5e02-4a06-adfd-4c8bb0e7cf34", "yt_id": "mrOWredvW78", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Self Esteem is the moniker used by British singer and musician Rebecca Lucy Taylor (born 15 October 1986) (formerly one half of Slow Club) for her solo work. Taylor released Your Wife, her first single under the Self Esteem moniker, in 2017. Her debut album, Compliments Please appeared in March 2019 on Fiction Records , preceded by a string of singles. To support the album, she toured the UK, including festival performances at Glastonbury, British Summer Time and Latitude.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 104, "title": "viagr aboys", "artist": "Viagra Boys", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1201495-viagr-aboys_122432.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1201495-viagra-boys-viagr-aboys.php", "aoty_critic_score": 82, "aoty_user_score": 79, "mbid": "97751ad2-72e1-4b96-832b-76530defaaa8", "yt_id": "d4jyaSXkC8I", "rym": "https://rateyourmusic.com/release/album/viagra-boys/viagr-aboys", "genres": [], "desc_lfm_album": "viagr aboys is the fourth studio album by Swedish post-punk band Viagra Boys, released on April 25, 2025, through Shrimptech Enterprises. .", "desc_lfm_artist": "Viagra Boys is a Swedish post-punk band formed in Stockholm in 2015. The group consists of lead singer Sebastian Murphy, guitarist Linus Hillborg, keyboardist Elias Jungqvist, bassist Henrik \"Benke\" Höckert, drummer Tor Sjödén, and saxophonist Oskar Carls. Their lyrics often employ satire and dark humor to critique hypermasculinity and far-right conspiracy theories.\n\nFull Wikipedia article: https://en.wikipedia.org/wiki/Viagra_Boys\n\nStudio albums\nStreet Worms (2018)\nWelfare Jazz (2021)\nCave World (2022)\nViagr Aboys (2025)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere", "sdecandelario"]}, {"n": 105, "title": "Cancionera", "artist": "Natalia Lafourcade", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1263208-cancionera_192430.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1263208-natalia-lafourcade-cancionera.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "8b4859fb-c847-4926-8766-426883273e0c", "yt_id": "FyKaPD59oCU", "rym": "https://rateyourmusic.com/release/album/natalia-lafourcade/cancionera", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "María Natalia Lafourcade Silva (born 26 February 1984) is a Mexican pop and folk singer-songwriter who since her debut in 2003 has been one of the most successful singers in Latin America. Lafourcade's voice has been categorized as a lyric soprano.\n\nLafourcade was born in Mexico City, Mexico, surrounded by music and art. Her father is the Chilean musician Gastón Lafourcade who had French parents and her mother is the pianist María del Carmen Silva Contreras.", "desc_mb_album": "", "desc_mb_artist": "See also [http://musicbrainz.org/artist/d7932a7f-c9f5-4f13-93b5-781a5aaed808|Natalia y La Forquetina].", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84"]}, {"n": 106, "title": "Live at Revolution Hall", "artist": "Adrianne Lenker", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1285683-live-at-revolution-hall_061828.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1285683-adrianne-lenker-live-at-revolution-hall.php", "aoty_critic_score": 85, "aoty_user_score": 89, "mbid": "5845983f-22b3-4fb7-8380-d7e78ea3d637", "yt_id": "TKcQyUszdhw", "rym": null, "genres": [], "desc_lfm_album": "The Big Thief lead documents a pair of rapturous Portland gigs and much more. .", "desc_lfm_artist": "Adrianne Lenker is an American singer, songwriter, and guitarist born on July 9, 1991, in Indianapolis, Indiana. She is best known as the lead vocalist and songwriter for the indie folk band Big Thief. In addition to her work with the band, Lenker also has a notable solo career, with albums such as Abysskiss (2018), Songs and Instrumentals (2020), and Bright Future (2024), the latter of which was nominated for a Grammy for Best Folk Album.\n\nHer music is marked by introspective and emotional lyrics", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 107, "title": "Clair Obscur: Expedition 33: Original Soundtrack", "artist": "Lorien Testard", "year": 2025, "cover": "https://dn721503.ca.archive.org/0/items/mbid-e07a1cd6-c286-4f81-a770-5cbcdb57f370/mbid-e07a1cd6-c286-4f81-a770-5cbcdb57f370-41881118075.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "d9f43de3-6c67-46e2-bfb7-9c398167fe41", "yt_id": "4FIMsKKvBRM", "rym": null, "genres": ["cinematic classical", "classical crossover"], "desc_lfm_album": "", "desc_lfm_artist": "Lorien Testard is a French composer renowned for his work on the 2025 video game Clair Obscur: Expedition 33, developed by Sandfall Interactive. This project marks his debut in video game composition, where he crafted an emotionally rich and cinematic soundtrack that has garnered significant attention.\n\nTestard's journey into  abbreviated to BCNR or BC,NR) is an English  experimental rock band formed in Cambridgeshire, United Kingdom in 2018, consisting of Tyler Hyde (bass, vocals), May Kershaw (keyboard, accordion, vocals), Georgia Ellery (violin, vocals), Lewis Evans (saxophone, flute, vocals), Charlie Wayne (drums, backing vocals), and Luke Mark (guitar, backing vocals). The band's first two albums featured lead vocalist Isaac Wood, who left the band in 2022.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 111, "title": "Coisas Naturais", "artist": "Marina Sena", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1146009-coisas-naturais_143716.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1146009-marina-sena-coisas-naturais.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "351c2823-f9ec-433d-a4b4-2c236ca3ea55", "yt_id": "2hnyzzve-aU", "rym": null, "genres": [], "desc_lfm_album": "Coisas Naturais (English: Natural Things) is the third studio album by Brazilian singer Marina Sena, released on 31 March 2025 through Sony Music Brasil. It was announced on 24 March 2025 through Marina's social media, along with the pre-save of the record. The album cover was revealed on 26 March 2025. Its lead single \"Numa Ilha\" was released on 4 December 2024. The album features international collaborations, including artists Gaia from Italy and Nenny from Portugal, who bring European influences. Spanish-based band Çantamarta brings a Latin Caribbean take on reggaeton to the project. .", "desc_lfm_artist": "Marina Sena, born on 26 September 1996 in Taiobeiras, Minas Gerais, is a Brazilian singer, songwriter, and performer. She began her artistic journey with the band A Outra Banda da Lua and gained national recognition as the vocalist of Rosa Neon with the hit song \"Ombrim\".\n\nIn 2021, she launched her solo career with the single \"Me Toca\", followed by her debut album De Primeira, which featured the hit \"Por Supuesto\", becoming a social media phenomenon.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 112, "title": "Dan's Boogie", "artist": "Destroyer", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1183604-trap-door-exit_195408.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1183604-destroyer-dans-boogie.php", "aoty_critic_score": 81, "aoty_user_score": 71, "mbid": "b9ec0b77-20ee-4e59-ac4d-77d4b5c6c785", "yt_id": "AypM7Bzz2uE", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Destroyer is a Canadian indie rock band from Vancouver, British Columbia fronted by singer-songwriter Dan Bejar and formed in 1995. Destroyer songs are characterized by abstract, poetic lyrics and idiosyncratic vocals. The band's discography draws on a variety of musical influences, resulting in albums that can sound markedly distinct from one another; in Bejar's words, \"That's kind of my goal: to start from scratch every time.\"\n\n1996–2001\nWe'll Build Them a Golden Bridge, Destroyer's 1996 debut, is made up of sixteen lo-fi home-recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 113, "title": "Glory", "artist": "Perfume Genius", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1193657-glory_073958.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1193657-perfume-genius-glory.php", "aoty_critic_score": 84, "aoty_user_score": 75, "mbid": "9026098c-a577-4097-8274-944db1536d13", "yt_id": "U1sffNdzjPU", "rym": null, "genres": [], "desc_lfm_album": "Glory is the seventh studio album by American musician Perfume Genius, released on March 28, 2025, through Matador Records. It features contributions from his partner Alan Wyffels and producer Blake Mills, and a guest appearance by Aldous Harding. .", "desc_lfm_artist": "Perfume Genius is the alias of ing David Pajo and his brothers Ned and Paul Oldham, but is generally the chief creator of the music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 136, "title": "EUSEXUA", "artist": "FKA twigs", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/959465-eusexua_130558.jpg", "aoty_url": "https://www.albumoftheyear.org/album/959465-fka-twigs-eusexua.php", "aoty_critic_score": 87, "aoty_user_score": 82, "mbid": "05c8e133-ba85-48cc-82c3-afcf0cc9e9ff", "yt_id": "E3RG4LGmSMY", "rym": null, "genres": [], "desc_lfm_album": "EUSEXUA is the third studio album by FKA twigs, released on January 24, 2025. It marks her first studio album in five years, following MAGDALENE (2019). In January 2024, Twigs began teasing her upcoming album via a series of posts on her Discord. After moving to Prague a couple of summers earlier, she developed a deep love for techno, though she clarified that while the album wouldn't strictly be in that genre, it would carry its \"spirit\". She described the album as \"deep but not sad\". Twigs also revealed that she collaborated with the electronic duo Two Shell, who helped .", "desc_lfm_artist": "Tahliah Debrett Barnett (born 16 January 1988), known professionally as FKA twigs, is an English singer, songwriter, and dancer. Born and raised in Cheltenham, Gloucestershire, she became a backup dancer for numerous famous musicians after moving to London at the age of 17, and made her own musical debut with EP1 (2012) and EP2 (2013).\n\nBarnett's debut studio album, LP1 (2014), reached number 16 on the UK Albums Chart and number 30 on the US Billboard 200.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 137, "title": "The Bad Fire", "artist": "Mogwai", "year": 2025, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1116620-the-bad-fire_115702.jpg", "aoty_url": "https:/ }, {"n": 144, "title": "Esquinas", "artist": "ANAVITÓRIA", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1156858-esquinas_063654.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1156858-anavitoria-esquinas.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "ee43df0d-b5fa-4037-bbd4-6dc71cceede9", "yt_id": "HNHlYPtophU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "ANAVITÓRIA are a Brazilian musical duo formed in 2014 by Ana Clara Caetano Costa (Goiânia, 5 October 1994) and Vitória Fernandes Falcão (Araguaína, 2 May 1995).\n\nThe duo's debut album, ANAVITÓRIA (2016), received diamond disc certification, selling more than 300,000 copies. In addition, their debut album received two Latin Grammy nominations, winning Best Song in Portuguese for \"Trevo (Tu)\". They released the autobiographical fiction feature Ana e Vitória (2018) and the second studio album O Tempo É Agora (2018)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 145, "title": "Heavy Metal", "artist": "Cameron Winter", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1131194-heavy-metal_191120.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1131194-cameron-winter-heavy-metal.php", "aoty_critic_score": 87, "aoty_user_score": 85, "mbid": "a9b6e76b-190b-4802-b120-ddef0fd852b7", "yt_id": "Xee_2r-5L2U", "rym": "https://rateyourmusic.com/release/album/cameron-winter/heavy-metal", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Heavy Metal is the debut studio album by American musician Cameron Winter, frontman of the Indie Rock band Geese. The album follows a more subdued and melancholy style compared to the Geese discography, with intimate vocals and acoustic instrumentals. The album was produced by Loren Humphrey, who has also worked with Cults and Arctic Monkeys. Heavy Metal was met with critical acclaim. .", "desc_lfm_artist": "Cameron Winter (Born March 4, 2002) is an American singer/son nto conflicts with authority. Deal married and moved to Boston with her husband, John Murphy. She became a bassist and vocalist for the seminal alternative rock band the Pixies in 1986, after answering an advert for a female bassist into Hüsker Dü and Peter, Paul & Mary.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 148, "title": "Small Changes", "artist": "Michael Kiwanuka", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1073330-small-changes_142533.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1073330-michael-kiwanuka-small-changes.php", "aoty_critic_score": 82, "aoty_user_score": 77, "mbid": "7940007c-780d-40aa-8eb8-c3d81768c6c0", "yt_id": "-4lokXVNLhU", "rym": "https://rateyourmusic.com/release/album/michael-kiwanuka/small-changes", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Michael Samuel Kiwanuka (born 3 May 1987) is an English soul musician who is signed to Communion Records. He has been compared to Marvin Gaye, Curtis Mayfield, Bill Withers, Randy Newman, Terry Callier, and Otis Redding, as well as Van Morrison and the Temptations. In January 2012, he won the BBC's Sound of 2012 poll.\nKiwanuka grew up in Muswell Hill, London, the son of Ugandan parents who had escaped the Amin regime. He attended Fortismere School, leaving there in 2005 after completing his A-Levels.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 149, "title": "Mahashmashana", "artist": "Father John Misty", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1075316-mahashmashana_123554.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1075316-father-john-misty-mahashmashana.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "4a1dd863-7f8a-4c5e-991b-ad315b367b21", "yt_id": "8GzimLQ_sHE", "rym": "https://rateyourmusic.com/release/album/father-john-misty/mahashmashana", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "After a decade being born, Josh Tillman is finally busy dying. Mahashmashana is the sixth album by Father John Misty. It was produced by Josh Tillman and Drew Erickson. It was engineered and additionally produced by Michael Harris. It was arranged by Drew Erickson. It was performed by Josh Tillman, Drew Erickson, Jonathan Wilson, Dan Bailey, Eli Thomson, David Vandervelde, Chris Dixie Darley, Jon Titterington, and Kyle Flynn. It was executive produced by Jonathan Wilson.It was recorded and mixed at Five Star and East/West , United and Drew's House Mahasmasana -- great cremation ground, all things going thither. Track listing: .", "desc_lfm_artist": "Father John Misty, or J. Tillman, has been recording/releasing solo albums since 2003. Josh also played drums for Seattle’s Fleet Foxes from 2008-2011.\n\nOn January 31st 2012, he released the first single, 'Hollywood Forever Cemetery Sings', for his debut album under the Father John Misty moniker, \"Fear Fun\". The Phil Ek mixed and Jonathan Wilson produced LP was released on May 1st 2012 through Sub Pop (U.S.) and Bella Union (U.K.)\n\nTo date, Father John Misty has released 6 studio albums: Fear Fun (2012)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "paqueradejere"]}, {"n": 150, "title": "GNX", "artist": "Kendrick Lamar", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1139965-gnx_174959.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1139965-kendrick-lamar-gnx.php", "aoty_critic_score": 87, "aoty_user_score": 81, "mbid": "32cb822c-a14e-49ce-a169-f209c5f31e0f", "yt_id": "HS7V4urC3oM", "rym": "https://rateyourmusic.com/release/album/kendrick-lamar/gnx", "genres": ["hip hop", "conscious hip hop", "west coast hip hop"], "desc_lfm_album": "GNX is Kendrick Lamar’s surprise released sixth studio album, released on November 22nd, 2024 with no prior announcement or promotion. It's his first to be released outside of the Top Dawg Entertainment umbrella, and comes months after his highly-publicised feud with Drake. For months, many rumors circulated amongst fans about the album’s release, though none seemed to materialize. The first signal of new music releasing beyond Kendrick’s rap feud emerged in the “Not Like Us” music video—briefly previewing a track that would be later known as \"squabble up.\" A month later, on August 25, 2024, Kendrick’s cousin uploaded an iMessage .", "desc_lfm_artist": "Kendrick Lamar Duckworth (born June 17, 1987) is an American rapper. Regarded as one of the most influential hip-hop artists of his generation, he was awarded the 2018 Pulitzer Prize for Music, becoming the first musician outside of the classical and jazz genres to receive the honor.\n\nBorn in Compton, California, Lamar began releasing music under the stage name K.Dot while attending high school. He signed with Top Dawg Entertainment (TDE) in 2005, and co-founded the hip hop supergroup Black Hippy there.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "sdecandelario"]}, {"n": 151, "title": "Monarch of Monsters", "artist": "Vylet Pony", "year": 2024, "cover": "https://i.discogs.com/TJlgK8VQKEWd2xzXRbLzqZOwnEnUvotVh0oZC9Sr2Lw/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTMyMzEx/NzgyLTE3MzE4MDIx/NjQtMjY4MC5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/725522-vylet-pony-monarch-of-monsters.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "efe8a1e8-4fed-4faa-be9d-fb8465648a4e", "yt_id": "wfunUQ-47nw", "rym": "https://rateyourmusic.com/release/album/vylet-pony/monarch-of-monsters", "genres": [], "desc_lfm_album": "\"Monarch of Monsters\" is an allegory for how trauma, loneliness, and selfishness can turn you into a horrible person; it's about endeavouring to stay alive even within a terminal state of regret; how — in this regret — experiencing any happiness at all feels insincere and undeserved; about perpetuating cycles of toxicity and wickedness because it's all you've known, especially in denial of being wrong; and ultimately, learning to find purpose and self-love in that din. .", "desc_lfm_artist": "Vylet Pony (also known as Zelda Trixie Lulamoon, Gwen, Trixie, and Wolf) is a musician from Portland, Oregon.\n\nDiscography\n\nAlbums\n2013-07-08 — Winter's End\n2014-09-27 — Horse Friends\n2016-06-17 — Super Pony World: Zräos Simulation\n2016-09-19 — Love Letters\n2017-03-12 — apathy.\n2017-06-17 — Starship Ponyville: Mystic Acoustics\n2017-11-24 — Tales from Equestria\n2018-03-16 — Our Light & After\n2018-06-22 — Aloe & Lotus\n2018-10-05 — Glitter", "desc_mb_album": "", "desc_mb_artist": "'''Gender''': non‐binary trans girl\n'''Pronouns''': [https://en.pronouns.page/she|She] / [https://en.pronouns.page/they|They] / [https://en.pronouns.page/it|It] / [https://en.pronouns.page/pony,pony,pony's,pony's,ponyself,0|Pony] / [https://en.pronouns.page/sea,sear,seas,seas,seaself,0|Sea]\n\nNot to be confused with another California‐based musician, [artist:bc3fce54-93a2-4239-a7c9-d1eaf5cbba51|Vylet].\n\nThe [https://docs.google.com/spreadsheets/d/1_uyBhqGtYBu_DqkQSkhIdR7TlmnTRw_u29zzmH-PqNk/edit#gid=0|Vylet Pony Canon Catalogue], a spreadsheet containing practically everything ever released by Vylet, maintained by them.\n\nTheir producer tag, “Sing a song about life” appears to be a sample from the track [recording:40296d4d-c376-4c55-b500-f4db5237b572|Life] by TheCobalion.\n\n== Release series ", "heard_by": ["EliasJ72", "Nubis84", "alberto_gu"]}, {"n": 152, "title": "King of the Mischievous South, Vol. 2", "artist": "Denzel Curry", "year": 2024, "cover": "https://dn710006.ca.archive.org/0/items/mbid-b0340ec7-af3e-4c5e-98f8-9c1132ced911/mbid-b0340ec7-af3e-4c5e-98f8-9c1132ced911-40476277444.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "f4e3c9f6-7ae4-4a8b-a11c-be9fd2e5c3f2", "yt_id": "shKjyl-bA8s", "rym": null, "genres": ["hip hop", "hardcore hip hop", "trap", "memphis rap"], med in Crawley in 1976 by Robert Smith (vocals, guitar) and Lol Tolhurst (drums). The band’s current lineup consists of Smith, Simon Gallup (bass), Roger O'Donnell (keyboards), Perry Bamonte (guitar and keyboards), Jason Cooper (drums), and Reeves Gabrels (guitar). Smith has been the sole constant member throughout the group’s history, while Gallup has appeared on all but two of the band’s studio albums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "alberto_gu", "armandwave"]}, {"n": 156, "title": "Night Palace", "artist": "Mount Eerie", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1061518-night-palace_160829.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1061518-mount-eerie-night-palace.php", "aoty_critic_score": 82, "aoty_user_score": 83, "mbid": "eb75fe35-d1fe-4b45-ab4f-c262947eccdc", "yt_id": "ncBNdiC_Yt0", "rym": "https://rateyourmusic.com/release/album/mount-eerie/night-palace", "genres": ["Alternative Rock"], "desc_lfm_album": "Night Palace appears as a culmination of eras, arrived at after tumbling through decades of a tumultuous life and building from scratch in the settled dust. The 26 track album is a palace of many rooms, all welcoming, all varied. The songs stand vivid in their diamond sharp eloquence and distorted feedback, but only after traveling the album as a whole do we find the door. The palace is dilapidated with moss dripping through, airy, bright and open. This is a return to the beloved deep analog fuzz world of the Microphones' the Glow pt. 2 (2001) and the many .", "desc_lfm_artist": "Mount Eerie represents the latest evolution of Phil Elverum's musical vision.  Formerly known as The Microphones, Elverum began Mount Eerie in 2003,  maintaining his previous project's subtle, lo-fi, and lyrically dense fuzz-folk aesthetic.  \n\nElverum explained this change in an 2003 interview with Discorder, asserting that \"Mount Eerie is a new project. The Microphones was completed, o
