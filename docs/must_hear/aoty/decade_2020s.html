k"], "desc_lfm_album": "The New Sound is the debut solo studio album by English musician Geordie Greep, former frontman and lead guitarist of Black midi. It was released on 4 October 2024 on Rough Trade Records. The album was produced by Black Midi touring and session member Seth Evans, with co-production from Greep. The album was recorded in London and São Paulo between September 2023 and April 2024. Black Midi, the band Greep had led since 2017, went public with their indefinite hiatus in August 2024. Days after, he announced the release of The New Sound, alongside its lead single \"Holy, Holy\". The .", "desc_lfm_artist": "Geordie Wade Greep (born 20 August 1999) is an English musician. From 2017 to 2024, he was the frontman and lead guitarist of the rock band black midi.\n\nHe met bandmates Matt Kwasniewski-Kelvin, Cameron Picton, and Morgan Simpson at the BRIT School - from where they would then go on to form Black Midi. The group got their start performing gigs at Brixton pub The Windmill, which had been the only one to accept Greep's emails sent to various music venues.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 170, "title": "Fête de la Vanille", "artist": "Lucy Bedroque", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1023355-fete-de-la-vanille_185941.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1023355-lucy-bedroque-fete-de-la-vanille.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "ef65d28f-e302-48f2-b35c-924c20742fd8", "yt_id": "8_dk143Ac2U", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Jeremiah Mark (born May 7th 2006 in New York), professionally known as Lucy Bedroque (formerly lostrushi) is a Zambian-American singer and producer based in LA. He's primarily known for his Nintendo DS and fairy-inspired sound.\n\nHe mainly draws inspiration from japanese culture such as anime for his visuals and the japanese visual kei rock band Malice Mizer which he sampled on the song \"INFINITUDE // UROBOROS\".\n\nIn 2021 he and fellow artists yuke", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 171, "title": "\"NO TITLE AS OF 13 FEBRUARY 2024 28,340 DEAD\"", "artist": "Godspeed You! Black Emperor", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1058751-no-title-as-of-13-february-2024-28340-dead_120856.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1058751-godspeed-you-black-emperor-no-title-as-of-13-february-2024-28340-dead.php", "aoty_critic_score": 78, "aoty_user_score": 86, "mbid": "7df4cbb0-30ed-4fed-9383-dd5fe3dbff30", "yt_id": "JSu6MNL7hVM", "rym": null, "genres": [], "desc_lfm_album": "THE PLAIN TRUTH== we drifted through it, arguing. every day a new war crime, every day a flower bloom. we sat down together and wrote it in one room, and then sat down in a different room, recording. NO TITLE= what gestures make sense while tiny bodies fall? what context? what broken melody? and then a tally and a date to mark a point on the line, the negative process, the growing pile. the sun setting above beds of ash while we sat together, arguing. the old world order barely pretended to care. this new century will be crueler still. .", "desc_lfm_artist": "Godspeed You! Black Emperor (formerly punctuated Godspeed You Black Emperor! and abbreviated to GY!BE, GYBE or Godspeed) is a Canadian post-rock band based in Montreal, Quebec. \n\nFormed in 1994 in Montreal, Canada, the band has been highly influential within the post-rock genre. Working with orchestrated arrangements, the nine-piece group created tracks with wide dynamic ranges, a highly evocative use of instrumentation and sounds and uncompromising long form compositions.", "desc_mb_album": "", "desc_mb_artist": "Up to the release of “'''[https://musicbrainz.org/release-group/fc3cf08c-3273-3af3- nya began her musical career by uploading demos to SoundCloud in 2014.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 179, "title": "Cascade", "artist": "Floating Points", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1011316-cascade_122701.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1011316-floating-points-cascade.php", "aoty_critic_score": 81, "aoty_user_score": 77, "mbid": "70410894-5005-4fac-a254-c82912a069cc", "yt_id": "m1rMpP5kMoU", "rym": "https://rateyourmusic.com/release/album/floating-points/cascade", "genres": ["Electronic"], "desc_lfm_album": "Sam Shepherd aka Floating Points has announced his new album Cascade will be released on 13 September via Ninja Tune. Along with the announcement Shepherd has shared lead single 'Key103' which comes with visuals continuing his ongoing collaboration with Tokyo based artist Akiko Nakayama. Cascade is an eruption of unfinished business. In late 2022, Shepherd – renowned for drifting between genres as freely as his stage name implies – found himself in the Californian desert working on something new. Mere Mortals, his first ballet score, created with the San Francisco Ballet, was to be a collision of sound and dance .", "desc_lfm_artist": "Floating Points is British electronic musician and neuroscientist Sam Shepherd from Manchester.  He also has a monthly radio programme on NTS.live named Floating Points. \n\nCiting influences as varied as Theo Parrish, Dorothy Ashby and Stravinsky, Shepherd has been an accomplished pianist since the age of 16. The variety in influences is mirrored in the diversity of his productions that range from string quartet to gritty beats. As a DJ, mostly his sets sit between boogie & house.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "paqueradejere", "sdecandelario"]}, {"n": 180, "title": "Escaper", "artist": "Sarah Kinsley", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/985055-escaper_154143.jpg", "aoty_url": "https://www.albumoftheyear.org/album/985055-sarah-kinsley-escaper.php", "aoty_critic_score": 87, "aoty_user_score": 80, "mbid": "eef15b81-fda5-4652-a33b-6fe844061589", "yt_id": "8ayxlIDZz4k", "rym": "https://rateyourmusic.com/release/album/sarah-kinsley/escaper", "genres": [], "desc_lfm_album": "Escaper is the debut studio album by Chinese-American singer Sarah Kinsley, released independently on September 6, 2024, and distributed through Universal Music and Verve Label Group. The album has 12 tracks and a duration of 40mins30secs, was written entirely by herself and maintains a similar theme to her previous projects “The King” (2021) and “Ascension” (2023). A mix of pop and emotional and cathartic alternative rhythms. The project was preceded by 3 promotional singles, «Last Time We Never Meet Again» was released on June 20th, an alt-pop single with quite prominent instruments, it talks about the irony of loving someone .", "desc_lfm_artist": "Sarah Kinsley (born in Mountain View, California, on 18 July 2000) is an American alt-pop singer-songwriter of Chinese-American descent. After her song \"The King\" had success on TikTok in 2021, she released an extended play (EP) of the same name, which was listed on NME's list of top debut projects of 2021. Kinsley followed up the project with subsequent EPs, Cypress (2022) and Ascension (2023). In 2024, she released her debut album Escaper. \n\nShortly after being born, she moved with her family to the US east coast and settled in Connecticut.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 181, "title": "Manning Fireworks", "artist": "MJ Lenderman", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/995133-manning-fireworks_140616.jpg", "aoty_url": "https://www.albumoftheyear.org/album/995133-mj-lenderman-manning-fireworks.php", "aoty_critic_score": 82, "aoty_user_score": 77, "mbid": "0c308741-7b98-4a36-b44e-1ba437b4e2c4", "yt_id": "9BKLMNY0Qtw", "rym": "https://rateyourmusic.com/release/album/mj-lenderman/manning-fireworks", "genres": ["Alternative Rock"], "desc_lfm_album": "Manning Fireworks is the fourth studio album by Asheville, NC-based singer-songwriter MJ Lenderman. His first record for Anti- and Epitaph Records, Manning Fireworks was released on September 6th, 2024. It was preceded by the singles \"She's Leaving You\", \"Joker Lips\" and \"Wristwatch\". All songs written by MJ Lenderman Produced by MJ Lenderman & Alex Farrar Mixed by Alex Farrar Mastered by Greg Obis at Chicago Mastering Service Recorded by Alex Farrar at Drop of Sun in Asheville, NC Assistant engineering by Lawson Anderson on track 7 Cover by Matthew Reed and Andrew James Personnel: MJ Lenderman – vocals, bass guitar, .", "desc_lfm_artist": "MJ Lenderman is the solo project of singer-songwriter, Jake Lenderman, based out of Asheville, NC. Taking notes from 90s alt-country and lo-fi aesthetics reminiscent of K Records, Jake’s music is honest — bare in production value but heavily packed in emotion. He is also the guitarist for Asheville-based shoegaze/alt country band, Wednesday.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "sdecandelario"]}, {"n": 182, "title": "Endlessness", "artist": "Nala Sinephro", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1020452-endlessness_142109.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1020452-nala-sinephro-endlessness.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "ed3161a7-d4fc-436a-9225-eec44f5bbcf9", "yt_id": "IyvqVDAGU0s", "rym": "https://rateyourmusic.com/release/album/nala-sinephro/endlessness", "genres": ["Electronic", "Jazz"], "desc_lfm_album": "", "desc_lfm_artist": "Caribbean-Belgian composer, producer and musician Nala Sinephro fuses meditative sounds, jazz sensibilities, folk and field recordings. Her musical practice is rooted in the study of frequency and geometry and guided by the premise that sound moves matter.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "paqueradejere"]}, {"n": 183, "title": "Wild God", "artist": "Nick Cave & The Bad Seeds", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/894186-wild-god_172317.jpg", "aoty_url": "https://www.albumoftheyear.org/album/894186-nick-cave-the-bad-seeds-wild-god.php", "aoty_critic_score": 86, "aoty_user_score": 78, "mbid": "cbe390d1-88b3-4ff2-8f53-b3b9d8a0e25c", "yt_id": "VIN5F5UNw5E", "rym": null, "genres": [], "desc_lfm_album": "\"Wild God\" is the 18th studio album by Australian rock band Nick Cave & the Bad Seeds, released on 30 August 2024 through PIAS. It is the band's first studio album in five years, following \"Ghosteen\" (2019). .", "desc_lfm_artist": "Nick Cave & the Bad Seeds is an Australian post-punk band formed in Melbourne in 1983 by vocalist Nick Cave, multi-instrumentalist Mick Harvey and guitarist Blixa Bargeld. The band has featured international personnel throughout its career and has released a lengthy series of studio albums and completed numerous international tours. \n\nThe band presently consists of Cave, violinist and multi-instrumentalist Warren Ellis, bassist Martyn P. Casey (all from Australia)", "desc_mb_album": "", "desc_mb_artist": "Some releases are credited to \"Nick Cave & the Bad Seeds\" others are \"Nick Cave and the Bad Seeds.\" This is intentional on the part of the editors and matches the various releases. If you need to group them or normalize them in your own collection, use the %albumartistsort% variable (or something like \"$if2(%albumartistsort%,%albumartist%,%artistsort%,%artist%)\") in your tagger.\r\n\r\nDo not make arbitrary edits to the artist credits unless you can prove that your edit matches the release.", "heard_by": ["armandwave"]}, {"n": 184, "title": "Romance", "artist": "Fontaines D.C.", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/931219-romance_191815.jpg", "aoty_url": "https://www.albumoftheyear.org/album/931219-fontaines-dc-romance.php", "aoty_critic_score": 89, "aoty_user_score": 79, "mbid": "92b095c1-3bbf-456f-9425-2078ad4e9504", "yt_id": "rwKzmVRaKUY", "rym": null, "genres": [], "desc_lfm_album": "Romance is the fourth studio album by Irish rock band Fontaines D.C. and was released on 23rd August 2024 via XL Recordings. It is the band’s first album with producer James Ford and is without doubt their most assured, inventive and sonically adventurous record yet. It’s set to build on the success of the Dublin-made, now London-based band’s acclaimed 2022 album Skinty Fia, which reached number 1 in the UK and Irish album charts and saw the band receiving a host of accolades including “International Group of the Year” at the 2023 BRIT Awards. Romance is Fontaines D.C.s most ambitious, .", "desc_lfm_artist": "Fontaines D.C. is an Irish post-punk band formed in Dublin, Ireland, in 2014. They have since moved to London, United Kingdom. The band comprises Grian Chatten (vocals), Carlos O'Connell (guitar), Conor Curley (guitar), Conor Deegan III (bass) and Tom Coll (drums). \n\nAfter meeting while attending music college, and bonding over a common love of poetry, the band began self-releasing singles and performing live regularly, signing to Partisan Records in 2018.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 185, "title": "Imaginal Disk", "artist": "Magdalena Bay", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1012480-imaginal-disk_115432.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1012480-magdalena-bay-imaginal-disk.php", "aoty_critic_score": 89, "aoty_user_score": 90, "mbid": "9c710cb4-6b20-47d7-a31a-5adb064c6c6b", "yt_id": "OPe7tn_Hju4", "rym": "https://rateyourmusic.com/release/album/magdalena-bay/imaginal-disk/", "genres": ["synth-pop", "electropop", "neo-psychedelia", "alternative dance", "dance-pop", "chillwave"], "desc_lfm_album": "Imaginal Disk is the second studio album by American duo Magdalena Bay, released on August 23, 2024, through Mom + Pop Music. The title shares its name with imaginal discs, the structures within the body of insect larvae that form part of their adult bodies. For the album, Magdalena Bay reimagined the term as a CD-shaped object created by aliens that, once inserted into the brain, gives the being \"upgraded consciousness\". In the story, the technology was inserted into the brains of apes to make humans. .", "desc_lfm_artist": "Magdalena Bay is an American alternative pop duo from Miami, Florida, based in Los Angeles, California. The duo consists of couple Mica Tenenbaum and Matthew Lewin, who write and produce together. They have released two studio albums, three EPs, and three mixtapes. The mixtapes are called Mini Mixes and are composed of short songs with accompanying homemade green screen music videos.\n\nThe duo released their debut studio album, Mercurial World, on October 8, 2021.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 186, "title": "epistolares", "artist": "AKRIILA", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1037190-epistolares_151549.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1037190-akriila-epistolares.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "ab1db314-a2c4-4043-8937-4741ed3fc703", "yt_id": "-BDQEPBs7J0", "rym": null, "genres": [], "desc_lfm_album": "\"epistolares\" is the debut studio album by Chilean singer-songwriter and rapper Fernanda Sepúlveda, known professionally as AKRIILA. It was released on 22 August 2024 through Lotus Records, with distribution by Warner Music Chile. The album contains 12 tracks and has a total runtime of approximately 30 minutes . The album was shaped by AKRIILA’s personal writing process, drawing from hundreds of notes and poems on her phone that she transformed into lyrics and song concepts. She described the aesthetic of this project as unique: “it sounds like Akri, it reads like Feña, and it looks like AKRIILA.” Production credits feature .", "desc_lfm_artist": "Akriila is a Chilean musician and producer known for her ethereal and electronic soundscapes. Her music blends dreamy synths with haunting vocals, creating an immersive experience that explores themes of introspection, identity, and emotional depth. Since her debut, Akriila has been recognized for her unique sound and has garnered a dedicated following in the indie music scene. Her work often reflects a deep connection to both personal experiences and broader", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "MaxtorUwU", "alberto_gu"]}, {"n": 187, "title": "The Thief Next to Jesus", "artist": "Ka", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1011890-the-thief-next-to-jesus_181340.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1011890-ka-the-thief-next-to-jesus.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "4dee98f6-c6cd-4ea1-b02c-3300f8fa90dd", "yt_id": "Btgzd7_JtuY", "rym": "https://rateyourmusic.com/release/album/ka/the-thief-next-to-jesus", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Kaseem Ryan (August 11, 1972 - October 12th, 2024), better known by his stage name Ka, was an American rapper, producer, and firefighter from Brownsville, Brooklyn, New York City, New York.\n\nHe was a former member of the group Natural Elements. In 1998 he formed the group Nightbreed with his friend Kev. In 2008, he was re-introduced on GZA's album Pro Tools on the song \"Firehouse\" and in that same year he released his debut album Iron Works. In 2012, he released the follow-up Grief Pedigree on his label Iron Works.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 188, "title": "CAJU", "artist": "Liniker", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1044786-caju_212721.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1044786-liniker-caju.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "5e729eed-4ef1-4445-a285-75c197c36127", "yt_id": "vXgUJWo_or0", "rym": null, "genres": [], "desc_lfm_album": "CAJU is the second studio album by Liniker, released on August 19, 2024, via Estúdio Brocal. The project blends blues and Brazilian pop, exploring genres like pagode, disco, jazz and electronic music. Liniker described the album as reflecting her desire to be seen as human and to receive affection despite her fame. The album's lead single, \"TUDO\", was released on July 11, 2024. In interviews, Liniker shared that the song was inspired by a brief but intense romance during a tour in Ireland. Critics praised the album's diversity and personal lyrics. CAJU was noted for its rhythmic variety, dynamic mix .", "desc_lfm_artist": "Liniker de Barros Ferreira Campos is a Brazilian singer, songwriter and actress. Former leader of soul and Black music band Liniker e os Caramelows, her music is an influence on young Brazilians facing gender discrimination, an audience which 'rarely finds itself represented in Brazilian music'. In 2022, Liniker became the first transgender woman to win a Latin Grammy, winning Best Portuguese Language Popular Music Album for Indigo Borboleta Anil and Best Portuguese Language Song for \"Baby 95\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 189, "title": "Re:結束バンド [Re:Kessoku Band]", "artist": "結束バンド [kessoku band]", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/978454-rekessoku-band_182643.jpg", "aoty_url": "https://www.albumoftheyear.org/album/978454--kessoku-band-re-rekessoku-band.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": null, "yt_id": "PiIAVnFX2eo", "rym": nu  and feeling the album would’ve felt rushed if released .", "desc_lfm_artist": "Barrington DeVaughn ‘Peggy’ Hendricks (born October 22, 1989), better known by his pseudonym JPEGMAFIA, is an American rapper and producer, strongly influenced by the music scene in Baltimore, Maryland, having been based there for a number of years. He is currently based in Los Angeles, California.\n\nHendricks was born in Flatbush, Brooklyn, to Jamaican parents. He spent the majority of his childhood in Flatbush before moving to Alabama at age 13, where he says he experienced a significant amount of racism, later affecting his music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "Rocky_stereo", "sdecandelario"]}, {"n": 194, "title": "SMILE! :D", "artist": "Porter Robinson", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/890326-smile-d_174533.jpg", "aoty_url": "https://www.albumoftheyear.org/album/890326-porter-robinson-smile-d.php", "aoty_critic_score": 75, "aoty_user_score": 81, "mbid": "87964290-66b9-4fd9-bea3-1bfe9de92862", "yt_id": "qiMfmd-UEG8", "rym": "https://rateyourmusic.com/release/album/porter-robinson/smile-d", "genres": [], "desc_lfm_album": "SMILE! :D is the third studio album by Porter Robinson, released on July 26th, 2024. On February 29th, 2024, Porter would upload a cryptic video to his YouTube channel in which a fictional video essayist from the year 2028 described the disappearance of Porter from the public eye, as well as the removal of all his music from streaming platforms. At the very end of the video, a short music snippet played, along with visuals saying \"it's done\". Porter's website was replaced with a 24 hour countdown. After its end, Robinson announced that his third album was finished. The lead .", "desc_lfm_artist": "Porter Robinson is an American DJ, record producer, musician, and singer from Chapel Hill, North Carolina. He started his career at the young age of 12, his passion for music being ignited by the media he consumed at the time, especially Dance Dance Revolution. Starting off making music online, he found his way to popularity and was in the mainstream by the end of 2010, after which he started gaining recognition from popular artists. His first EP", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 196, "title": "No Name", "artist": "Jack White", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1022379-no-name_081439.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1022379-jack-white-no-name.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "5ef2a512-3680-4661-bfea-870cb8bf6507", "yt_id": "A3neCOTqfj8", "rym": "https://rateyourmusic.com/release/album/jack-white/no-name", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "No Name is the sixth studio album by American rock musician Jack White. It was initially surprise released on vinyl on July 19, 2024, as a gift to customers of Third Man Records, before a wider digital release on August 2, 2024. The record was written, recorded, and produced entirely by White at Third Man Studio in Nashville, Tennessee. Musically, it is a garage rock, blues rock, and punk blues album. Initially, the album was released through unmarked white vinyl records secretly included with purchases at Third Man Records store locations in Detroit, London, and Nashville, and mailed to vinyl .", "desc_lfm_artist": "Jack White (born John Anthony Gillis on 9 July 1975 in Detroit, MI, United States) is an American rock musician, producer and actor. He rose to prominence as the guitarist and lead vocalist of the rock duo The White Stripes (1997-2011) and, after that, as the guitarist and vocalist of The Raconteurs, and drummer and vocalist for the band The Dead Weather, two bands that are still active on and off. White is also a recording artist in his own right and under his own name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "sdecandelario"]}, {"n": 197, "title": "Big Ideas", "artist": "Remi Wolf", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/905415-big-ideas_170506.jpg", "aoty_url": "https://www.albumoftheyear.org/album/905415-remi-wolf-big-ideas.php", "aoty_critic_score": 82, "aoty_user_score": 77, "mbid": "9fc40af7-4b44-4f63-a27b-fed0545f28d0", "yt_id": "_3pEI2k7BZ0", "rym": "https://rateyourmusic.com/release/album/remi-wolf/big-ideas", "genres": [], "desc_lfm_album": "Big Ideas is the second studio album by American singer and songwriter Remi Wolf, released on July 12, 2024, through Island Records. It received positive reviews from critics. .", "desc_lfm_artist": "Remi Francis Wolf (born February 2, 1996) is an American singer and songwriter from California. As a senior at Palo Alto High School, she appeared as a contestant on American Idol in 2014. After completing her studies at USC Thornton School of Music in 2018, she made her solo debut with the self-released extended play You're A Dog! in October 2019. Wolf subsequently released her second EP and major-label debut, I'm Allergic To Dogs!, on Island Records and Virgin EMI Records in June 2020", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere"]}, {"n": 198, "title": "My Light, My Destroyer", "artist": "Cassandra Jenkins", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/932058-my-light-my-destroyer_142249.jpg", "aoty_url": "https://www.albumoftheyear.org/album/932058-cassandra-jenkins-my-light-my-destroyer.php", "aoty_critic_score": 85, "aoty_user_score": 75, "mbid": "464fe9dd-d8db-4a56-b57a-4240215e5adb", "yt_id": "HqP94a-HRF8", "rym": "https://rateyourmusic.com/release/album/cassandra-jenkins/my-light-my-destroyer", "genres": [], "desc_lfm_album": "My Light, My Destroyer is the third studio album by Cassandra Jenkins. It was released on July 12, 2024. .", "desc_lfm_artist": "Cassandra Jenkins is an American singer-songwriter and visual artist based in Brooklyn.", "de ption in 2018, this record went to hell and back, dragging its immensity and too-big-to-hold emotion through the torturous process of translation to sound and returned triumphantly as a full-bodied record in a distinct new style. Impossible Light begins where Uboa's 2019 breakout album The Origin of My Depression left off — and ends somewhere entirely different. The Origin stunned with its methodical use of doom, harsh noise, and ambient soundscapes while documenting a raw, unhindered account of Xandra Metcalfe’s experiences with her transition .", "desc_lfm_artist": "Uboa is an experimental music/noise project formed in 2010 by Xandra Metcalfe in Melbourne, Australia.  \nhttp://uboa.bandcamp.com/ \n https://linktr.ee/Uboatheflesh", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 204, "title": "Fine Art", "artist": "KNEECAP", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/880816-fine-art_141013.jpg", "aoty_url": "https://www.albumoftheyear.org/album/880816-kneecap-fine-art.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "194d0907-10c8-4a99-b96b-6571b2a6c456", "yt_id": "zRQm9hW3k4o", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Kneecap are an Irish hip hop trio from West Belfast, NI, composed of Mo Chara, Móglaí Bap, and DJ Próvaí, the stage names of Liam Óg Ó hAnnaidh, Naoise Ó Cairealláin, and J.J. Ó Dochartaigh, respectively. They rap in a mixture of English and Irish, and their lyrics often contain Irish republican themes. \nThey released their first mixtape 3CAG, short for 3 Chonsan Agus Guta, on the 28th of June 2018. Their debut album Fine Art was released on the 14th of June 2024.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid"]}, {"n": 205, "title": "Cutting the Throat of God", "artist": "Ulcerate", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/901868-cutting-the-throat-of-god_ hat is both loud and bold. Critics have compared its sound to early 2000s Ministry of Sound compilations, describing the lyrics as both ‘shady and bratty’ yet ‘tender and heartbreaking.’ The .", "desc_lfm_artist": "Charlotte Emma Aitchison (born 2 August 1992), known professionally as Charli xcx, is a British pop singer and songwriter. She began sharing her music on Myspace in 2008 before entering the London rave scene. In 2010, she signed with Asylum Records and released a series of singles and mixtapes. In 2012, she was featured on \"I Love It\" by the Swedish duo Icona Pop, which became her first UK number-one single and achieved international success. Her debut studio album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 210, "title": "NO HANDS", "artist": "Joey Valence & Brae", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/941426-no-hands_203848.jpg", "aoty_url": "https://www.albumoftheyear.org/album/941426-joey-valence-brae-no-hands.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "3b871c8b-8d73-46ea-8266-15c272860cdc", "yt_id": "HIafot608TU", "rym": null, "genres": [], "desc_lfm_album": "NO HANDS is the second independent album from alternative rap duo Joey Valence & Brae. The title of this album is a double entendre playing on the concept of “no hands” meaning to do something effortlessly and skillfully that you don’t even need hands, but also doing so with no “hands” as in violence – indicated by JVB’s shirts in the album cover. Lyrically this album explores concepts from confidence, rebellion, violence, and authenticity. In an Instagram post, JVB adds some context to this. “This album forces you to be confident in yourself and do things simply because they make .", "desc_lfm_artist": "Multi-genre producer, vocalist, and writer Joey Valence is blending elements of classic breakbeat hip-hop, boom bap, hardcore punk, and other alternative genres in a strikingly refreshing way. \n\nCombined with the additional lyrical talent of vocalist Brae, the two have explosively launched into the alternative and hip-hop scenes with their high-energy antics, easily identifiable style and masterful use of social media. Over just one year, the duo has organically garnered over 1 million total followers, 80 million views and 22 million streams.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "sdecandelario"]}, {"n": 211, "title": "Maria Esmeralda", "artist": "VCR Slim", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/982957-maria-esmeralda_221107.jpg", "aoty_url": "https://www.albumoftheyear.org/album/982957-vcr-slim-maria-esmeralda.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "55490ddf-6ce4-44a0-8c19-8652bc376e65", "yt_id": "Xzy6l4vxqWI", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 212, "title": "[untitled]", "artist": "samlrc", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/977254-untitled_081050.jpg", "aoty_url": "https://www.albumoftheyear.org/album/977254-samlrc-untitled.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "b4331c10-3ec5-4c73-8194-a419624145c0", "yt_id": "I6k3tXxQeQU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "samlrc is the project of Brazilian experimental artist Samantha Rodrigues da Cruz (born June 21, 2004)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 213, "title": "Submarine", "artist": "The Marías", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/882149-submarine_182733.jpg", "aoty_url": "https://www.albumoftheyear.org/album/882149-the-marias-submarine.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "217f8621-5905-48eb-a837-000aeb7b7500", "yt_id": "sTNor6bcNm0", "rym": "https://rateyourmusic.com/release/album/the-marias/submarine", "genres": [], "desc_lfm_album": "Submarine is the second studio album by the American band The Marías, released on May 31, 2024 through Atlantic Records. The album features songs in English and Spanish and was produced entirely by the band itself. This album marks a new beginning in the same immersive style that the band is used to in their songs and as in their predecessor album “CINEMA”. Submarine presents immersive waves in its melodies as if we were underwater, along with its melancholic and progressively calm cathartic lyrics makes it very charming and hypnotic to listen to. The album has 14 songs and four .", "desc_lfm_artist": "Formed in Los Angeles in late 2016, The Marías is a smooth rendezvous of jazz percussion, hypnotic guitar riffs, smoke- velvet vocals and nostalgic horn solos, there’s something undeniably sensual in the group’s dreamlike fusion of jazz, psychedelia, funk and lounge.\n\nThe band is named after its lead singer María Zardoya, who was born in Puerto Rico and raised in Atlanta, Georgia. She and her partner Josh Conway, the drummer, met at a show at the Kibitz Room, the bar and music venue inside Canter's Deli in Los Angeles.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "verygooood"]}, {"n": 214, "title": "Dark Times", "artist": "Vince Staples", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/961934-dark-times_205543.jpg", "aoty_url": "https://www.albumoftheyear.org/album/961934-vince-staples-dark-times.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "ca6d37f2-b478-4317-b529-8f0ac0e351a9", "yt_id": "-VjAeaGu5x4", "rym": "https://rateyourmusic.com/release/album/vince-staples/dark-times", "genres": [], "desc_lfm_album": "Dark Times is the sixth studio album by American rapper Vince Staples. It was released on May 24, 2024, through Blacksmith Records and Def Jam Recordings, and is his final release with the latter label after more than 10 years. Vince Staples was discovered by Dijon \"LaVish\" Samo and Chuck Wun, alongside his cousin Campbell Emerson. LaVish took Staples on a trip to Los Angeles, where he befriended the Odd Future collective's members Syd tha Kyd, Mike G, and Earl Sweatshirt. Although he had not intended to become a rapper, he made some guest appearances on their songs, most notably .", "desc_lfm_artist": "Vincent Jamal Staples (born July 2, 1993) is an American rapper and actor from the Ramona Park area of North Long Beach, California.[2] He is a member of the hip hop trio Cutthroat Boyz alongside fellow Californian rappers Aston Matthews and Joey Fatts. Staples was once a close associate of Odd Future, in particular Mike G and Earl Sweatshirt. He is currently signed to Blacksmith Records, ARTium Recordings and Def Jam Recordings.\n\nStaples rose to", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 215, "title": "#RICHAXXHAITIAN", "artist": "Mach-Hommy", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/676662-richaxxhaitian_1025.jpg", "aoty_url": "https://www.albumoftheyear.org/album/676662-mach-hommy-richaxxhaitian.php", "aoty_critic_score": 83, "aoty_user_score": 81, "mbid": "4123546e-2fbe-436e-b103-be9c84364949", "yt_id": "MbuKbY3ch8I", "rym": "https://rateyourmusic.com/release/album/mach-hommy/_richaxxhaitian", "genres": [], "desc_lfm_album": "#RICHAXXHAITIAN (stylized in all caps) is an album by Haitian-American rapper Mach-Hommy. The album was released on May 17, 2024, and contains features from Georgia Anne Muldrow (credited as Hephzibah) Haitian Jack, Black Thought, Roc Marciano, Your Old Droog, and 03 Greedo. The album features production by Conductor Williams, Quelle Chris, Elijah Hooks, SadhuGold, Georgia Anne Muldrow, Sam Gendel, Kaytranada, Fortes, and Messiah Musik. The album serves as the final instalment of a 'pentalogy', comprised of 2016's H.B.O (Haitian Body Odor), 2019's Wap Konn Jòj!, and the 2021 albums Pray for Haiti and Balens Cho (Hot Candles). .", "desc_lfm_artist": "Mach-Hommy is a hop artist from Newark, New Jersey, by way of Port-au-Prince, Haiti. He has drawn attention for the high prices he charges for his work (between US$300 and $3000)  many of which have also been released as highly sought after and expensive limited vinyl editions. His reclusiveness and anonymity (expressed through a Haitian flag bandana draped across his face) also draw attention as well as a long standing affiliation with Griselda Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 216, "title": "Lives Outgrown", "artist": "Beth Gibbons", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/863906-lives-outgrown_101643.jpg", "aoty_url": "https://www.albumoftheyear.org/album/863906-beth-gibbons-lives-outgrown.php", "aoty_critic_score": 86, "aoty_user_score": 82, "mbid": "eaa72e4a-0e22-471f-bc92-97fd5d93d7d3", "yt_id": "G_-DftINZKg", "rym": "https://rateyourmusic.com/release/album/beth-gibbons/lives-outgrown", "genres": ["Rock"], "desc_lfm_album": "Lives Outgrown is the debut solo studio album by the English singer Beth Gibbons, released on 17 May 2024 through Domino Recording Company. Known for her work as the lead vocalist of Portishead, crafted the record over a decade, making it her most personal project to date, delving into topics specific to her walk of life nearing age 60, including \"motherhood, anxiety, menopause, and mortality\". It was produced by Gibbons alongside James Ford and Lee Harris. Lives Outgrown received a score of 88 out of 100 on review aggregator Metacritic based on 22 critics' reviews, which the website categorized as .", "desc_lfm_artist": "Beth Gibbons (born 4 January 1965, in Exeter, United Kingdom) is best known as the vocalist and front woman for the trip hop band Portishead. With Portishead, Gibbons released two studio albums and a live album in the 1990s, followed by a third studio album in p", "aoty_critic_score": 88, "aoty_user_score": 75, "mbid": "d704385c-1ad0-4d3e-9d26-89d0af3199c6", "yt_id": "gwRgJ66ylpU", "rym": "https://rateyourmusic.com/release/album/mdou-moctar/funeral-for-justice", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Tuareg singer/songwriter and guitarist who is known for his innovative and intense playing style, Mdou Moctar rose from a small village in Niger to earn viral success among West Africa's cell phone-trading network. An appearance on an American compilation in 2010 led to international recognition and further exploratory releases on the Sahel Sounds label. Moctar's sound continued to evolve as he pushed his musical boundaries as a multi-instrumentalist on 2017's Sousoume Tamachek.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 224, "title": "Fearless Movement", "artist": "Kamasi Washington", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/894651-fearless-movement_151050.jpg", "aoty_url": "https://www.albumoftheyear.org/album/894651-kamasi-washington-fearless-movement.php", "aoty_critic_score": 82, "aoty_user_score": 83, "mbid": "50c425d0-6ed6-47d9-af12-bfa2b80cb628", "yt_id": "x8WTPgeVPjg", "rym": "https://rateyourmusic.com/release/album/kamasi-washington/fearless-movement", "genres": ["Jazz"], "desc_lfm_album": "Fearless Movement is the fifth studio album by Kamasi Washington, released on May 3, 2024. It features contributions from André 3000, Thundercat, George Clinton, BJ the Chicago Kid, D Smoke, and Terrace Martin. The album marks a continuation of Washington's explorations in jazz, infusing it with elements of hip-hop, soul, and funk, over the span of 12 tracks. Each collaborator brings their unique flair, enhancing the rich tapestries of sound that define Washington's music. Recorded in various studios around Los Angeles, the production on Fearless Movement features lush orchestration and a complex layering of musical themes. Themes of resilience, social .", "desc_lfm_artist": "Kamasi Washington (born in in Los Angeles, CA, on 18 February 1981) is an American jazz saxophonist. He is a founding member of the jazz collective West Coast Get Down.\n\nIn Washington's family, music was more of a prerequisite than a privilege. His love for music began at first sound. His father, Rickey Washington is a professional saxophonist by night and a high school music teacher by day. Washingtoni’s mother, Valerie Washington is an accomplished", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 225, "title": "Nonetheless", "artist": "Pet Shop Boys", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/863038-nonetheless_062721.jpg", "aoty_url": "https://www.albumoftheyear.org/album/863038-pet-shop-boys-nonetheless.php", "aoty_critic_score": 81, "aoty_user_score": 65, "mbid": "c817b9c8-4fe5-4f02-9962-6ea6dd94b21b", "yt_id": "g8BMAM39fwU", "rym": null, "genres": [], "desc_lfm_album": "Nonetheless is the fifteenth studio album by English synth-pop duo Pet Shop Boys, released on 26 April 2024 through the band's own label x2 and Parlophone. It was produced by James Ford and mostly recorded at his East London studio. The band's first album for Parlophone since Elysium in 2012, its four-year gap with Hotspot (2020) marks their longest period between studio albums to date. It was preceded by the single \"Loneliness\", released alongside the album announcement. .", "desc_lfm_artist": "Pet Shop Boys is a British synthpop/dance music duo, consisting of Neil Tennant and Chris Lowe and were formed in London, UK in 1981.\n\nPost-modern ironists cloaked behind a veil of buoyantly melodic and lushly romantic synth pop confections, Pet Shop Boys offer wry yet strangely affecting cultural commentary communicated by the Morse code of synth washes and drum machine rhythms. After first emerging in the mid-'80s with \"West End Girls\" and \"Opportunities (Let's Make Lots of Money)", "desc_mb_album": "", "desc_mb_artist": "Pet Shop Boys Commentary: Interpretations and Analyses of Every Song Written or Performed by Chris Lowe and Neil Tennant \r\nby Wayne Studer, Ph.D. @ [http://www.geowayne.com/psbhtml.htm]  \r\n\r\nPet Shop Boys at dead of night: Visit [http://psb-atdeadofnight.net/] for lyrics to more than 300 songs, many MIDI files, news, pictures and much more.", "heard_by": ["Frikomid"]}, {"n": 226, "title": "Light Verse", "artist": "Iron & Wine", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/869515-light-verse_001637.jpg", "aoty_url": "https://www.albumoftheyear.org/album/869515-iron-wine-light-verse.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "af2fd1e7-1562-4e52-a4bb-9a1667e64e01", "yt_id": "I5lcBExdrCU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Iron & Wine is the stage and recording name of folk rock singer and composer Sam Beam (born July 26, 1974). He currently resides in Dripping Springs, Texas, outside Austin.  He  has released six studio albums, several EPs and singles, as well as a few download-only releases, which include a live album (a recording of his 2005 Bonnaroo performance). The name Iron & Wine is taken from a dietary supplement named \"Beef Iron & Wine\" that he found in a general store.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 227, "title": "All Born Screaming", "artist": "St. Vincent", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/889060-all-born-screaming_174514.jpg", "aoty_url": "https://www.albumoftheyear.org/album/889060-st-vincent-all-born-screaming.php", "aoty_critic_score": 85, "aoty_user_score": 79, "mbid": "9eae5bc4-4c1c-4a6c-9aeb-145eb02f2a03", "yt_id": "BWkxzcWt51w", "rym": null, "genres": [], "desc_lfm_album": "All Born Screaming is St. Vincent’s Grammy Award winning seventh studio album, released on April 26, 2024 through Total Pleasure Records and Virgin Music Group. It's the first self-produced record by St. Vincent and features musical contributions from several artists. It was preceded by the singles \"Broken Man\", \"Flea\" and \"Big Time Nothing\". At the 67th Annual Grammy Awards, its songs, \"Broken Man\" and \"Flea\" won Best Rock Song and Best Alternative Performance, respectively, while the album itself won Best Alternative Album. This made her the first woman to win three times and tied her for the most wins in .", "desc_lfm_artist": "A pseudonym of Annie Clark (b. 28 Sept 1982), a USA multi-instrumentalist singer-songwriter. She was a member of The Polyphonic Spree and Sufjan Stevens' touring band. Born in Tulsa, Oklahoma, she began playing the guitar at the age of 12 and as a teenager worked as the tour manager for her uncle's band Tuck & Patti. She grew up in Dallas and attended Lake Highlands High School, graduating in 2001. Following this, she went on to attend Berklee College of Music, dropping out 3 years later.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "sdecandelario"]}, {"n": 228, "title": "Bewitched: The Goddess Edition", "artist": "Laufey", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/894966-bewitched-the-goddess-edition_004431.jpg", "aoty_url": "https://www.albumoftheyear.org/album/894966-laufey-bewitched-the-goddess-edition.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "82c93285-46d7-4f44-ba7c-2c420cfc7665", "yt_id": "2t6zK1-iayc", "rym": null, "genres": [], "desc_lfm_album": "Bewitched: The Goddess Edition is the deluxe edition of Laufey's second studio album Bewitched. It was released on April 26, 2024 through Vingolf/AWAL Recordings. The album, unlike its standard version, has the 18 tracks with four new songs “Bored”, “Trouble”, “It Could Happen To You”, and the last song which in turn served as a single for the album, “Goddess”, was released on March 6, 2024. .", "desc_lfm_artist": "Laufey Lín Bing Jóns o album by American indie rock band Vampire Weekend, released on April 5, 2024, through Columbia Records. It marks the third collaboration between the band and their longtime producer Ariel Rechtshaid. It is also the first album recorded by the band as a trio of vocalist-guitarist Ezra Koenig, bassist Chris Baio and drummer Chris Tomson after the 2016 departure of keyboardist Rostam Batmanglij. 2019's Father of the Bride, was the first post-Batmanglij Vampire Weekend album, and was created and promoted by Koenig as a solo project with Baio and Tomson only involved .", "desc_lfm_artist": "Vampire Weekend is an American indie rock band formed in February 2006 in New York, New York, United States. The band consists of Ezra Koenig (vocals, guitar), Chris Baio (bass) and Christopher Tomson (drums). Rostam Batmanglij has left the band in early 2016 to begin solo career, but will continue to collaborate with Ezra. The band has released four albums: \"Vampire Weekend\" (2008), \"Contra\" (2010)\",\"Modern Vampires of the City\" (2013) and \"Father of the Bride\" (2019).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 238, "title": "Sweet Boy", "artist": "Malcolm Todd", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/921653-sweet-boy_040932.jpg", "aoty_url": "https://www.albumoftheyear.org/album/921653-malcolm-todd-sweet-boy.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "d5cafb7a-e76c-440c-acb4-0404f4f1f436", "yt_id": "7R6LXe-d45c", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Best known for his warm, alternative R&B sound-- 22 year-old Malcolm “Todd” Hobert hails from Los Angeles and is an up-and-coming lovesick musician.\n\nInitially starting with a small community of fans, he began advertising on TikTok and had a breakthrough with his single Art House. While being significantly popular, it was overshadowed by the success of an  by My Body in Bloom (2019). Their first full-length, Your Receding Warmth (2020), arrived via Unbeaten Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 241, "title": "COWBOY CARTER", "artist": "Beyoncé", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/873803-cowboy-carter_152906.jpg", "aoty_url": "https://www.albumoftheyear.org/album/873803-beyonce-cowboy-carter.php", "aoty_critic_score": 86, "aoty_user_score": 77, "mbid": "fa566e7b-254a-4fab-8aa5-ebcb7592d7f2", "yt_id": "ynCh7Jw4RnA", "rym": null, "genres": [], "desc_lfm_album": "COWBOY CARTER is the eighth studio album by American singer-songwriter Beyoncé, released on March 29, 2024, via Parkwood Entertainment and Columbia Records. The album was announced on February 11, 2024, in which was teased through a Verizon commercial aired during the Super Bowl LVIII. It was preceded by two singles that same night, \"TEXAS HOLD 'EM\" which hit #1 on Billboard Hot 100, and “16 CARRIAGES\". It serves as the second instalment of Beyoncé's three-act project recorded during the COVID-19 pandemic, following Grammy nominated-awarded Act I: RENAISSANCE. Along with it being a country album, “COWBOY CARTER” incorporates aspects of blues, .", "desc_lfm_artist": "Beyoncé Giselle Knowles-Carter  (born September 4, 1981 in Houston, Texas, USA) is an American singer, songwriter, businesswoman, and actress. Beyoncé performed in various singing and dancing competitions as a child and rose to fame in the late 1990s as the lead singer of Destiny's Child, one of the best-selling girl groups of all time. Beyoncé herself is the best-selling black female musician of all time and second best-selling female artist of all time, behind only Madonna.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "verygooood"]}, {"n": 242, "title": "Diamond Jubilee", "artist": "Cindy Lee", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/882225-darling-of-the-diskoteque_011726.jpg", "aoty_url": "https://www.albumoftheyear.org/album/882225-cindy-lee-diamond-jubilee.php", "aoty_critic_score": 86, "aoty_user_score": 83, "mbid": "442d3e54-f7f2-45b7-a743-61e0c2372284", "yt_id": "_LJi5na897Y", "rym": "https://rateyourmusic.com/release/album/cindy-lee/diamond-jubilee", "genres": ["psychedelic pop", "indie rock", "noise pop", "hypnagogic pop", "Rock", "Pop"], "desc_lfm_album": "This album is available for streaming on YouTube. Digital album only available for purchase via https://www.geocities.ws/ccqsk/ and https://cindylee.bandcamp.com/album/diamond-jubilee The album is 32 tracks. It is 2 hours and 2 minutes long. It is available at: - https://cindylee.bandcamp.com/album/diamond-jubilee - https://castexotic.com/realistikstudios/ .", "desc_lfm_artist": "Cindy Lee is the diva alter-ego of singer / guitarist / drag queen Patrick Flegel, the one-time captain of heralded Canadian experimental guitar pop act, Women. In Flegel's working on / as Cindy Lee exclusively over recent years, their songwriting makes a move toward high atmospherics, often achieving a mysterious sweetness rooted equally in beauty and ache.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu"]}, {"n": 243, "title": "Something in the Room She Moves", "artist": "Julia Holter", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/841283-something-in-the-room-she-moves_090837.jpg", "aoty_url": "https://www.albumoftheyear.org/album/841283-julia-holter-something-in-the-room-she-moves.php", "aoty_critic_score": 81, "aoty_user_score": 77, "mbid": "f0be7474-c683-4721-8389-11b3e011387b", "yt_id": "QG7k3RX_2eY", "rym": null, "genres": [], "desc_lfm_album": "Something in the Room She Moves is the sixth studio album from Julia Holter, released on March 22, 2024, by Domino Recording Company. Prior to the album's announcement, Holter released the lead single \"Sun Girl\" on November 7, 2023. The song came with a music video directed by , "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "paqueradejere"]}, {"n": 245, "title": "Bright Future", "artist": "Adrianne Lenker", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/848518-bright-future_015842.jpg", "aoty_url": "https://www.albumoftheyear.org/album/848518-adrianne-lenker-bright-future.php", "aoty_critic_score": 87, "aoty_user_score": 83, "mbid": "60db66ba-34f8-4a1d-b91a-67e85cfcb269", "yt_id": "GmycsQ30obg", "rym": "https://rateyourmusic.com/release/album/adrianne-lenker/bright-future", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "\"Bright Future\" is the sixth solo studio album by American musician Adrianne Lenker, released on 22 March 2024 through 4AD. The album was nominated for Best Folk Album at the 67th Annual Grammy Awards in 2024. .", "desc_lfm_artist": "Adrianne Lenker is an American singer, songwriter, and guitarist born on July 9, 1991, in Indianapolis, Indiana. She is best known as the lead vocalist and songwriter for the indie folk band Big Thief. In addition to her work with the band, Lenker also has a notable solo career, with albums such as Abysskiss (2018), Songs and Instrumentals (2020), and Bright Future (2024), the latter of which was nominated for a Grammy for Best Folk Album.\n\nHer music is marked by introspective and emotional lyrics", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "verygooood"]}, {"n": 246, "title": "Audio Vertigo", "artist": "Elbow", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/857122-audio-vertigo_120507.jpg", "aoty_url": "https://www.albumoftheyear.org/album/857122-elbow-audio-vertigo.php", "aoty_critic_score": 84, "aoty_user_score": 71, "mbid": "d9213961-c650-4100-b746-82e36963d524", "yt_id": "tc3GI5_M7iQ", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Elbow is an alternative rock band that got started in Bury, Greater Manchester, United Kingdom in 1990. Formed when its members were in sixth-form college, the group consists of Guy Garvey (vocals, guitar), Mark Potter (guitar, vocals), Pete Turner (bass), Craig Potter (keyboards) and Richard Jupp (drums). Over the band's twenty plus year career, it has released eight studio albums and four EPs while also having over five top 40 singles in the U.K. alone.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 248, "title": "A Lonely Sinner", "artist": "samlrc", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/707323-a-lonely-sinner_235731.jpg", "aoty_url": "https://www.albumoftheyear.org/album/707323-samlrc-a-lonely-sinner.php", "aoty_critic_score": 91, "aoty_user_score": 84, "mbid": "6debb0e7-170f-47b3-bbdd-6533da7eacca", "yt_id": "oSaiQMaV5GY", "rym": "https://rateyourmusic.com/release/album/samlrc/a-lonely-sinner", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "samlrc is the project of Brazilian experimental artist Samantha Rodrigues da Cruz (born June 21, 2004)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84"]}, {"n": 249, "title": "Invincible Shield", "artist": "Judas Priest", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/765203-invicible-shield_2042.jpg", "aoty_url": "https://www.albumoftheyear.org/album/765203-judas-priest-invincible-shield.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "21ec2311-2d78-4b60-9e4d-bbc696c1c2fa", "yt_id": "GpK5P7hCKA8", "rym": null, "genres": ["heavy metal", "metal", "Metal", "Rock"], "desc_lfm_album": "Invincible Shield is the nineteenth studio album by English heavy metal band Judas Priest, released on 8 March 2024 through Epic Records. It was produced by the band's touring guitarist Andy Sneap. The first single, \"Panic Attack\", was released on 13 October 2023. The band will embark on a world tour from the month of the album's release. \"Invincible Shield\" track listing: 01. Panic Attack 02. The Serpent And The King 03. Invincible Shield 04. Devil In Disguise 05. Gates Of Hell 06. Crown Of Horns 07. As God Is My Witness 08. Trial By Fire 09. Escape From Reality .", "desc_lfm_artist": "Judas Priest is an English heavy metal band formed in Birmingham in 1969. They have sold over 50 million albums and are considered a significant influence within the heavy metal genre. The band has been associated with the new wave of British heavy metal movement and has influenced various metal subgenres, including speed metal, thrash metal, and power metal, as well as aspects of the hard rock and glam metal scenes of the 1980s. Despite producing innovative music in the latter half of the 1970s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 250, "title": "The Collective", "artist": "Kim Gordon", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/847969-the-collective_091324.jpg", "aoty_url": "https://www.albumoftheyear.org/album/847969-kim-gordon-the-collective.php", "aoty_critic_score": 81, "aoty_user_score": 68, "mbid": "c35d3885-e1a2-4959-81ff-9c005c319b22", "yt_id": "IZ3i80B0qKg", "rym": "https://rateyourmusic.com/release/album/kim-gordon/the-collective", "genres": [], "desc_lfm_album": "The Collective is the second solo studio album by Kim Gordon. It was released on March 8, 2024, through Matador Records. .", "desc_lfm_artist": "Kim Gordon (born 28 April 1953 in Rochester, NY, United States) is chiefly known as the former bass player and singer (along with Lee Ranaldo and her then partner Thurston Moore) of the alternative rock band Sonic Youth (1981-2011). \n\nThe demise of Sonic Youth coincided with the dissolution of her marriage to Moore. Gordon's take on this painful story is in her post-Sonic Youth memoir, 'Girl in a Band' (2015).\n\nDuring and after Sonic Youth's existence she has taken part in many experimental side-projects", "desc_mb_album": "", "desc_mb_artist": " a and CEP before embarking on a career under her own name after Chairlift's disbandment in 2017.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 257, "title": "What Now", "artist": "Brittany Howard", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/769795-what-now_051526.jpg", "aoty_url": "https://www.albumoftheyear.org/album/769795-brittany-howard-what-now.php", "aoty_critic_score": 81, "aoty_user_score": 77, "mbid": "2782ec50-d1eb-47bf-9ac7-098f3447c2d8", "yt_id": "1fcIcOF-gRY", "rym": "https://rateyourmusic.com/release/album/brittany-howard/what-now", "genres": [], "desc_lfm_album": "What Now is the second solo studio album by Brittany Howard. It was released on February 9, 2024, as her label debut on Island Records. .", "desc_lfm_artist": "Brittany Howard (born 2 October 1988 in Athens, Alabama) is an American musician, singer, and songwriter known for being the lead vocalist, guitarist, and main songwriter of rock bands Alabama Shakes and Thunderbitch. She released her debut studio album, Jaime, in 2019. Her work with Alabama Shakes and as a solo artist have earned her four Grammy Awards out of 11 nominations.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "paqueradejere"]}, {"n": 258, "title": "PHASOR", "artist": "Helado Negro", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/772813-phasor_1055.jpg", "aoty_url": "https://www.albumoftheyear.org/album/772813-helado-negro-phasor.php", "aoty_critic_score": 80, "aoty_user_score": 72, "mbid": "0787cfb2-91a2-483b-aa9b-0d6750f78010", "yt_id": "p1TfBoSjfA8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Helado Negro is the pseudonym of North American musician Roberto Carlos Lange (born 1980 in Florida, U.S.A.). \n\nHis parents were immigrants from Ecuador, but Roberto grew up in the materialistic lifestyle of southern Florida, U.S.A. Pounding bass beats from passing cars, boom boxes bouncing down the block, and late-night parties provided a foundation for Lange’s interest in sound.\n\nLange has collaborated with visual and sound artist David Ellis to compose a new series of kinetic sound sculptures.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave", "paqueradejere"]}, {"n": 259, "title": "She Reaches Out to She Reaches Out to She", "artist": "Chelsea Wolfe", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/778140-she-reaches-out-to-she-reaches-out-to-she_1020.jpg", "aoty_url": "https://www.albumoftheyear.org/album/778140-chelsea-wolfe-she-reaches-out-to-she-reaches-out-to-she.php", "aoty_critic_score": 82, "aoty_user_score": 78, "mbid": "7a2e8e09-aa9c-4c39-8f2d-50577d0b4669", "yt_id": "RkPx5yyD570", "rym": "https://rateyourmusic.com/release/album/chelsea-wolfe/she-reaches-out-to-she-reaches-out-to-she", "genres": ["alternative rock", "doom metal", "dark wave", "post-industrial", "Rock"], "desc_lfm_album": "Chelsea Wolfe’s latest album, She Reaches Out To She Reaches Out To She, is a rebirth in process. It’s a powerfully cathartic statement about cutting ties, as well as an important reminder that healing is cyclical and circular, and not a simple linear process. released February 9, 2024 .", "desc_lfm_artist": "Chelsea Wolfe (born Chelsea Joy Wolfe on November 14, 1983) is an American singer-songwriter and musician from Roseville, California. Her work blends elements of gothic rock, doom metal, folk, and darkwave, often described as \"doom folk\" and \"drone-metal-art-folk.\" Growing up in Northern California with a country musician father who owned a home studio, Wolfe began writing poetry at age 7 and recording songs by age 9, which she later described as \"basically Casio-based gothy R&B songs.\"", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "alberto_gu", "paqueradejere", "sdecandelario"]}, {"n": 260, "title": "Prelude to Ecstasy", "artist":
