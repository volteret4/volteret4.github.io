nuary 26, 2024, through XL Recordings. It was recorded in Oxford and Abbey Road Studios, London, with the producer Sam Petts-Davies. The Smile developed the songs while on tour for their first album, A Light for Attracting Attention (2022). After releasing the single \"Bending Hectic\" in June 2023, the Smile announced the album with the single \"Wall of Eyes\" in November, followed by \"Friend of a Friend\" in January. .", "desc_lfm_artist": "The Smile is an English rock band formed by Radiohead members Thom Yorke and Jonny Greenwood and Sons of Kemet drummer Tom Skinner.\n\nThe Smile made their debut in a surprise performance for Live at Worthy Farm, a film with performances by numerous artists produced by Glastonbury Festival and streamed on May 22, 2021. They performed eight songs, including a new version of the unreleased Radiohead song \"Skating on the Surface\". Yorke and Greenwood played guitars, bass, Moog synthesiser and Rhodes piano.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 262, "title": "Iechyd Da", "artist": "Bill Ryder-Jones", "year": 2024, "cover": "https://cdn2.albumoftheyear.org/600x0/album/751023-iechyd-da_0632.jpg", "aoty_url": "https://www.albumoftheyear.org/album/751023-bill-ryder-jones-iechyd-da.php", "aoty_critic_score": 88, "aoty_user_score": 73, "mbid": "e874bd1d-1a93-43d1-9a8f-b6cf5736d742", "yt_id": "hEc6-NZkfxc", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Bill Ryder-Jones (born William Edward Ryder-Jones on 10 August 1983 in Warrington, Cheshire) is an English singer-songwriter, musician, producer and composer from West Kirby, Merseyside. He co-founded the band The Coral, together with James Skelly, Lee Southall, Paul Duffy, and Ian Skelly, playing as their lead guitarist from 1996 until 2008. He has since pursued a solo career, writing both his own albums and film scores, as well as producing records for other artists and appearing as a session musician.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere"]}, {"n": 263, "title": "ORQUÍDEAS", "artist": "Kali Uchis", "year": 2024, "cover": "https://lastfm.freetls.fastly.net/i/u/300x300/a7f9b7cf0bb3c5c6244875a62b5be5d4.png", "aoty_url": "https://www.albumoftheyear.org/album/765665-kali-uchis-orquideas.php", "aoty_critic_score": 80, "aoty_user_score": 77, "mbid": "ffe90330-8efd-49ec-b3dd-5edf11348eea", "yt_id": "_fjVJZ44bIo", "rym": "https://rateyourmusic.com/release/album/kali-uchis/orquideas", "genres": [], "desc_lfm_album": "ORQUÍDEAS is the fourth studio album and second Spanish-language album by Kali Uchis, released on January 12, 2024, through Geffen Records. It features guest appearances by Peso Pluma, El Alfa, JT, KAROL G and Rauw Alejandro. The album debuted at number two on the US Billboard 200, marking Uchis' highest-charting album. The album was announced following Uchis' reveal in 2022 that she had two ready-to-release albums, one in English and one in Spanish. Leading up to ORQUÍDEAS, several singles were released, including \"Muñekita (with El Alfa & JT)\", \"Te Mata\" and \"Labios Mordidos (with KAROL G)\". Critically acclaimed, ORQUÍDEAS received .", "desc_lfm_artist": "Karly-Marina Loaiza, professionally known as Kali Uchis, is a Colombian-American singer-songwriter, record producer, music video director and fashion designer. She writes and produces most of her own music.\n\nThe stylistic range of left-field pop artist Kali Uchis is reflected in the variety of her collaborators – an extensive genre-crossing list that includes Tyler, the Creator, Gorillaz, Daniel Caesar, Juanes, and BadBadNotGood. A singer, songwriter", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "alberto_gu", "armandwave", "verygooood"]}, {"n": 264, "title": "Letter to Self", "artist": "SPRINTS", "year": 2024, "cover": "https://dn710108.ca.archive.org/0/items/mbid-b091da43-d448-411e-afe8-fd90e5b50ff7/mbid-b091da43-d448-411e-afe8-fd90e5b50ff7-36642017654.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3801c47e-f902-49d2-8b0f-608ec03d8a6d", "yt_id": "0D6U-ymV_X0", "rym": null, "genres": ["alternative rock", "post-punk", "indie rock", "garage punk"], "desc_lfm_album": "", "desc_lfm_artist": "Sprints are a four-piece post-punk band from Dublin, Ireland. The band consists of Karla Chubb (Lead Singer and songwriter), Colm O’Reilly (Guitar), Jack Callan (Drums), and Sam McCann (Bass).\n\nFollowing 2020 singles Kissing Practise and The Cheek, the band released their debut EP, Manifesto, via Nice Swan Records, in March 2021.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "sdecandelario"]}, {"n": 265, "title": "wetdream", "artist": "Willy Rodriguez", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/828421-wetdream_014259.jpg", "aoty_url": "https://www.albumoftheyear.org/album/828421-willy-rodriguez-wetdream.php", "aoty_critic_score": 88, "aoty_user_score": null, "mbid": "be0237d4-1aae-4573-8ccc-8de36cf6de9e", "yt_id": "TeqcmeW0T9E", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["EliasJ72"]}, {"n": 266, "title": "London's Saviour", "artist": "fakemink", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/931120-londons-saviour_141230.jpg", "aoty_url": "https://www.albumoftheyear.org/album/931120-fakemink-londons-saviour.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "d3d6f96b-b0a2-4b96-adbc-71c77b033fc1", "yt_id": "cALIfMG_GXw", "rym": null, "genres": [], "desc_lfm_album": "London's Saviour, released 22 December 2023, is the self-produced debut album of emerging UK rapper Fakemink, known as 9090gate at the time of the album's release. Cloud Rap, Pop Rap and Electronic textures merge over nostalgic samples and simplistic, driving rhythms, crafting a nocturnal, wistful and vivid sonic portrait of urban London. Three brief 1-minute instrumental tracks punctuate the 21-minute project, with touches of Chillwave and Electropop adding texture to its atmospheric sound. Gaining notable cult status, London's Saviour established itself as not only a milestone in Fakemink's career, but also one of the key, defining projects of the UK .", "desc_lfm_artist": "Vincenzo Camille was born on 29 January 2005, in Essex. He began making music in FL Studio when he was ten years old, and started rapping in 2019. He is primarily known for his Cloud Rap catalogue, but also he dabbled in Jerk, Boom Bap and Hip House.\n\nFakemink is of Indian, Punjabi and Algerian descent. He is Muslim. He abstains from alcohol as he does not find it enjoyable and due to religious adherence. He also does huge amounts of cocaine.\n\nMink began his music career in 2019 under the name 9090gate", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 267, "title": "i/o", "artist": "Peter Gabriel", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/568281-io_1247.jpg", "aoty_url": "https://www.albumoftheyear.org/album/568281-peter-gabriel-io.php", "aoty_critic_score": 83, "aoty_user_score": 73, "mbid": "7dc5a2fe-452f-462b-a5c0-b303d3e60629", "yt_id": "w44HVOGn-VQ", "rym": null, "genres": ["Rock", "Pop"], "desc_lfm_album": "I/O is a studio album by Peter Gabriel, released on December 1, 2023. It's Gabriel's first full-length album of new original material in over 21 years since 2002's Up, marking the longest gap between two studio albums in his solo career. I/O had been in the works for nearly three decades, with its initial production dating back to 1995, at around the same time Gabriel began recording Up. He began planning the follow-up to Up as early as 2000 and had originally intended to release it in 2004, but the album was repeatedly delayed, reworked and re-recorded at seven recording .", "desc_lfm_artist": "Peter Brian Gabriel (born 13 February 1950) is an English musician, singer, songwriter, record producer, and activist. He rose to fame as the original lead singer of the progressive rock band Genesis. After leaving Genesis in 1975, he launched a successful solo career with \"Solsbury Hill\" as his first single. His fifth studio album, So (1986), is his best-selling release and is certified triple platinum in the UK and five times platinum in the US.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 268, "title": "SCRAPYARD III", "artist": "Quadeca", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/796715-scrapyard-iii_200707.jpg", "aoty_url": "https://www.albumoftheyear.org/album/796715-quadeca-scrapyard-iii.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "38d54112-4af3-444a-8196-cc313e7d00aa", "yt_id": "sXFdPQdk8Xw", "rym": null, "genres": [], "desc_lfm_album": "SCRAPYARD III is the third and final release of the SCRAPYARD EP's by Quadeca, preceding the SCRAPYARD album. .", "desc_lfm_artist": "Benjamin Fernando Barajas Lasky (born October 2, 2000), better known by his stage name Quadeca (formerly QuadecaX8), is an American singer, songwriter, rapper, and record producer. Lasky began on the Internet by uploading rap songs, music videos, comedy sketches, and video game gameplay to his YouTube channel.\n\nQuadeca deviated from his YouTube career to focus on his music career, releasing four mixtapes before the albums Voice Memos in 2019, From Me to You in 2021, and I Didn't Mean to Haunt You in 2022.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 269, "title": "Quaranta", "artist": "Danny Brown", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2023/738402-quaranta-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/738402-danny-brown-quaranta.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "6d016b33-9434-4aad-ae31-ec24ad13c845", "yt_id": "_B1bTui636Y", "rym": "https://rateyourmusic.com/release/album/danny-brown/quaranta", "genres": [], "desc_lfm_album": "Quaranta is Danny Brown’s sixth album, and final album released on Warp Records, with future releases being handled through his own label Bruiser Brigade Records. “Quaranta” is the Italian translation of the number 40, referring to Danny’s age in 2021, and also serves as an Italian word that refers to a forty-day quarantine. The album was first revealed under the titles “XXXX”, and later “40”, to directly reference the album being a sequel to Danny’s 2011 album XXX. The change in title would be announced in a 2021 interview with Anthony Fantano, with Danny stating that “It’s not called ‘40’, .", "desc_lfm_artist": "Daniel Dewan Sewell (born March 16, 1981), best known by his stage name Danny Brown, is a hip-hop artist from the Dexter-Linwood area of Detroit, Michigan. He has been described by MTV as \"one of rap's most unique figures in recent memory\". Danny is an unconventional hip-hop artist who employs multiple flows and cadences, thus the moniker “The Hybrid”. His style varies from low pitched gravelly tones to a manic, high-pitched squawk. His lyrics often deal with the truth of living in Detroit: poverty, drug abuse, desperate circumstances, etc.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid"]}, {"n": 270, "title": "Autopoiética", "artist": "Mon Laferte", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/743749-autopoietica_163454.jpg", "aoty_url": "https://www.albumoftheyear.org/album/743749-mon-laferte-autopoietica.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "a0087f36-55b1-4394-8708-58e6d248f46b", "yt_id": "7nXBiCEYZu0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Norma Monserrat Bustamante Laferte (born 2 May 1983) better known as Mon Laferte, is a Chilean-Mexican musician, singer, composer, and painter. Her musical style is diverse, spanning different genres such as pop, rock, bolero, cumbia, and salsa, showcasing her versatility and creativity. Throughout the 2010s, she gained widespread recognition for her melodramatic style and \"captivating stage persona\".\n\nWith over 1.5 million digital records sold in Latin America between albums and singles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 271, "title": "SCRAPYARD II", "artist": "Quadeca", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/773688-scrapyard-ii_164515.jpg", "aoty_url": "https://www.albumoftheyear.org/album/773688-quadeca-scrapyard-ii.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "b069dbc6-1dd8-49c0-8238-53a5bf8cc94b", "yt_id": "B-o6TyJkod8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Benjamin Fernando Barajas Lasky (born October 2, 2000), better known by his stage name Quadeca (formerly QuadecaX8), is an American singer, songwriter, rapper, and record producer. Lasky began on the Internet by uploading rap songs, music videos, comedy sketches, and video game gameplay to his YouTube channel.\n\nQuadeca deviated from his YouTube career to focus on his music career, releasing four mixtapes before the albums Voice Memos in 2019, From Me to You in 2021, and I Didn't Mean to Haunt You in 2022.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid"]}, {"n": 272, "title": "1989 (Taylor's Version)", "artist": "Taylor Swift", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/722921-1989-taylors-version_0212.jpg", "aoty_url": "https://www.albumoftheyear.org/album/722921-taylor-swift-1989-taylors-version.php", "aoty_critic_score": 86, "aoty_user_score": 71, "mbid": "1c4770b3-b7a3-4d44-a7a9-8e2dbb74b85a", "yt_id": "reYlYUB_jUM", "rym": null, "genres": [], "desc_lfm_album": "1989 (Taylor's Version) is the fourth re-recorded album by Taylor Swift, released on October 27, 2023, through Republic Records. It revisits her 2014 pop breakthrough 1989, part of Swift's effort to reclaim ownership of her master recordings following the 2019 dispute with Scooter Braun and Big Machine Records. A vibrant, 1980s-inspired synth-pop record, 1989 (Taylor's Version) features re-recordings of the original album's 16 deluxe-edition tracks and five unreleased \"From the Vault\" songs. The album also includes extended versions with \"Sweeter than Fiction\" and the Kendrick Lamar remix of \"Bad Blood\". Critics praised the re-recording for its refined production, richer vocals, .", "desc_lfm_artist": "Taylor Alison Swift is an American singer-songwriter. Her discography spans multiple genres, and her narrative songwriting, which is often inspired by her personal life, has received widespread media coverage and critical praise.\n\nSwift rose to mainstream prominence with her sophomore studio album, Fearless (2008), a country pop record with crossover appeal. Aided by the top-five singles “Love Story” and “You Belong with Me”, Fearless was certified Diamond by the Recording Industry Recording Industry Association of America (RIAA).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "armandwave"]}, {"n": 273, "title": "Me chama de gato que eu sou sua", "artist": "Ana Frango Elétrico", "year": 2023, "cover": "https://ia801506.us.archive.org/22/items/mbid-238b3f21-bed2-408a-bad1-c1f85a13ccdc/mbid-238b3f21-bed2-408a-bad1-c1f85a13ccdc-37034298522.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "374fec8d-7202-45a3-a2d4-74f3f75308af", "yt_id": "4ZN8z5AVlQI", "rym": "https://rateyourmusic.com/release/album/ana-frango-eletrico/me-chama-de-gato-que-eu-sou-sua", "genres": ["baroque pop", "mpb", "jazz", "jazz-funk", "funk", "boogie"], "desc_lfm_album": "Me Chama de Gato Que Eu Sou Sua is the third studio album by Brazilian singer-songwriter Ana Frango Elétrico, released on October 20, 2023, via Risco. The album starts from an attentive listening to Brazilian musical production between the 70s and 80s, pointing to the work of industry veterans, mainly characters who worked behind the scenes, but at no point does it leave aside poetic vulnerability. These are compositions that highlight the strength of feelings, strengthen bonds and reverberate beyond any technical quality. .", "desc_lfm_artist": "Ana Faria Fainguelernt, known professionally as Ana Frango Elétrico, is a Brazilian singer, songwriter, painter and poet.\n\nBorn to a plastic artist father and a psychologist mother, Ana began studying music at the age of six and, at seven, they already knew how to read sheet music and played classical piano in recitals. At the age of ten, Ana passed the entrance test at the Villa Lobos music school, which encouraged them to study music in more depth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "verygooood"]}, {"n": 274, "title": "SAVED!", "artist": "Kristin Hayter", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/731532-saved_1005.jpg", "aoty_url": "https://www.albumoftheyear.org/album/731532-kristin-hayter-saved.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": null, "yt_id": "URqRlBz0LNA", "rym": null, "genres": [], "desc_lfm_album": "SAVED! is an apocalyptic revelation on the complex, sometimes ugly, always nonlinear process of healing. Herein, Reverend Kristin Michael Hayter documents an earnest attempt to achieve salvation through the tenets of charismatic Christianity, focusing on the Pentecostal-Holiness Movement, which dictate that one’s closeness to God is demonstrated through transcendental personal experience. Sonically and thematically, the record is both a logical conclusion to and a significant departure from Hayter’s previous work as Lingua Ignota. Mirroring her personal evolution away from pain, she sheds the moniker that made her successful for its unflinching expression of lived trauma and instead builds herself anew, .", "desc_lfm_artist": "Kristin Hayter is an experimental musician from the United States, and the artist behind Reverend Kristin Michael Hayter and Lingua Ignota. \n\nBefore beginning either of these projects, she released Sound Art and Electroacoustic compositions via Soundcloud and her website, although all of these have since been taken down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 275, "title": "Census Designated", "artist": "Jane Remover", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/731948-census-designated_0005.jpg", "aoty_url": "https://www.albumoftheyear.org/album/731948-jane-remover-census-designated.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "650abe5d-5766-4825-a49c-f68ae6405a26", "yt_id": "eJkzC50mAFE", "rym": "https://rateyourmusic.com/release/album/jane-remover/census-designated", "genres": ["alternative rock", "noise rock", "indie rock", "shoegaze", "dream pop", "post-rock"], "desc_lfm_album": "Census Designated is the second album by American producer and singer-songwriter Jane Remover, released via deadAir records on October 20th, 2023. The album was preceded by the release of its lead single, \"Lips\", on August 23, 2023, and was announced on the same day. Initial ideas for Census Designated were written and recorded just weeks after Frailty’s release, but took 18 months to perfect. During their first trip across America, Jane collected ambience and experience that texturized the embryo of Census Designated. Jane says that a central inspiration for the new music came from an extremely dangerous drive in blizzard .", "desc_lfm_artist": "Jane Remover is an American singer, songwriter, and producer from New Jersey based in Chicago, IL. They make electronic-infused pop, hip-hop, and rock music. They're also known for pioneering the genre dariacore under their side-project leroy  (a.k.a. c0ncernn). \n\nJane Remover's interest in music production stems back as far as 2011, inspired by dubstep producers like Skrillex, Kill The Noise, and Virtual Riot. They would later go on to produce different styles of EDM in the mid-2010s, citing Porter Robinson as their biggest influence.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Rocky_stereo"]}, {"n": 276, "title": "Lahai", "artist": "Sampha", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/732985-lahai_1210.jpg", "aoty_url": "https://www.albumoftheyear.org/album/732985-sampha-lahai.php", "aoty_critic_score": 87, "aoty_user_score": 85, "mbid": "b745c43d-3abf-48a3-8caf-81c25d40d100", "yt_id": "WyXFfKYbtQU", "rym": "https://rateyourmusic.com/release/album/sampha/lahai", "genres": [], "desc_lfm_album": "Lahai is the second studio album by English musician Sampha, released on 20 October 2023 by Young, marking his first release in over six years. The album title comes from Sampha's paternal grandfather's first name, which is also Sampha's own middle name. The album features contributions from Yaeji, Léa Sen, Sheila Maurice Grey, Ibeyi, Morgan Simpson, Yussef Dayes, Laura Groves and Kwake Bass. .", "desc_lfm_artist": "Sampha's artful and emotive mix of pop, R&B, and electronic music isn't easily categorizable, and is further distinguished by a heartfelt vocal style that tends to sound as if it's on the brink of choking back tears. The artist established himself as a valued remixer and studio collaborator sought by emergent underground talents and mainstream stars alike, including SBTRKT, Jessie Ware, Drake, Beyoncé, and Kanye West. Process (2017), his full-length debut, went Top Ten in his native U.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu"]}, {"n": 277, "title": "Crazymad, For Me", "artist": "CMAT", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/676154-crazymad-for-me_0319.jpg", "aoty_url": "https://www.albumoftheyear.org/album/676154-cmat-crazymad-for-me.php", "aoty_critic_score": 85, "aoty_user_score": 75, "mbid": "fd636b76-7d71-4125-9c37-71557578d2e5", "yt_id": "Uf3_YtxZYw8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ciara Mary-Alice Thompson (born 23 February 1996), known professionally as CMAT, is an Irish singer, songwriter, and musician. Her debut album,  If My Wife New I'd Be Dead, was released in February 2022 and entered the Irish Album Charts at number one. Her sophomore album, Crazymad, For Me, was released on October 13th, 2023. Her third album, EURO-COUNTRY, was released on August 29th, 2025.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu"]}, {"n": 278, "title": "Something to Give Each Other", "artist": "Troye Sivan", "year": 2023, "cover": "https://i.discogs.com/a4ZaWxgM_ftmedqN-8H3qXtjn4LrPvl6W0JT0W0adus/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTMyOTI4/NDI5LTE3Mzc2NDk0/ODItNDk2MS5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/702898-troye-sivan-something-to-give-each-other.php", "aoty_critic_score": 83, "aoty_user_score": 75, "mbid": "cbf8fc77-e2f0-4e73-9740-19cd6c0624a4", "yt_id": "ZhGl8McrOHo", "rym": null, "genres": [], "desc_lfm_album": "Something To Give Each Other is the third studio album by Australian singer Troye Sivan, released on October 13, 2023, through EMI Music Australia and Capitol Records, as Sivan's first album in five years, following 2018's Bloom. The album was preceded by the singles \"Rush\", and \"Got Me Started\", from the lyrics of which the album's title derives. A third single, \"One of Your Girls\", was released concurrently with the album. .", "desc_lfm_artist": "Troye Sivan Mellet is an Australian singer, actor and former YouTuber. As a YouTube personality, Sivan uploaded video blogs regularly and, as of 2021, has over 7.3 million subscribers and over 1.3 billion total views. After gaining popularity as a singer on YouTube and in Australian talent competitions, Sivan signed with EMI Australia in 2013 and released his third EP, TRXYE (2014), which peaked at number five on the US Billboard 200. Its lead single, \"Happy Little Pill\", reached number ten on Australian music charts.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "paqueradejere"]}, {"n": 279, "title": "4D Country", "artist": "Geese", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/740306-4d-country_003039.jpg", "aoty_url": "https://www.albumoftheyear.org/album/740306-geese-4d-country.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "3e64f190-c47e-4b10-a844-0bb0d45475a6", "yt_id": "2o6NFWXOwqw", "rym": null, "genres": [], "desc_lfm_album": "4D Country is an EP by American indie rock band Geese. It serves as the follow up to the bands' sophomore album 3D Country. It was announced with the release of their track ”Jesse“ that had been played for at least 2 years prior to it’s release at live shows and on radio stations' social media platforms as an unnamed track until they played on Rolling Stone and the name was revealed to be ”Jesse.“ The EP continues very similar ideas from 3D Country by modelling the music and lyricism of a cowboy taking psychedelics. However, this time around it .", "desc_lfm_artist": "Geese is an American indie rock band formed in 2016 in Brooklyn, New York, United States. \n\nAs a project between friends to build a home studio out of a basement. Their songs are born from the same ambition: make music by any means necessary. They began recording together with sneakers as mic stands and blankets draped over the amps, all within the afternoon following a school day, up until they ran the risk of noise complaints. \n\nOn a practical level", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 280, "title": "Burning Desire", "artist": "MIKE", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/757313-burning-desire_0811.jpg", "aoty_url": "https://www.albumoftheyear.org/album/757313-mike-burning-desire.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "634bfb20-799d-4f6c-91e1-79c973d5cae5", "yt_id": "W8Y35Tnro_M", "rym": "https://rateyourmusic.com/release/album/mike/burning-desire", "genres": [], "desc_lfm_album": "Burning Desire is the sixth studio album by American rapper Mike. It was released on Friday the 13, October 2023, through 10k and features guest appearances by Earl Sweatshirt, Klein, Lila Ramani of Crumb, and Larry June, amongst others. It was released alongside a short horror film of the same name, uploaded to his YT channel. .", "desc_lfm_artist": "There are multiple artists using this name:\n\n1. MIKE (born Michael Jordan Bonema on October 13th, 1998) is a rapper originally from New Jersey but currently based out of New York City. He usually drops his projects on either of the solstices (June 21st or December 21st) each year. Also known as dj blackpower (MIKE when rapping dj blackpower when producing.)\n\n2. MIKE is a punk rock band from Stockholm, Sweden.\n\nMIKE started in January 2006 by Joel, Fredrik, Viktor and Jesper.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 281, "title": "Javelin", "artist": "Sufjan Stevens", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/724073-javelin_0908.jpg", "aoty_url": "https://www.albumoftheyear.org/album/724073-sufjan-stevens-javelin.php", "aoty_critic_score": 88, "aoty_user_score": 87, "mbid": "56dba069-d0a1-4353-b786-db6fc8269139", "yt_id": "LqLflZ3EOQ0", "rym": "https://rateyourmusic.com/release/album/sufjan-stevens/javelin", "genres": ["indie rock", "indie folk", "Rock", "Electronic", "Alternative Rock"], "desc_lfm_album": "Javelin is the tenth studio album by American musician Sufjan Stevens. It was released on October 6, 2023, through Asthmatic Kitty. Stevens created the record mostly by himself in his home studio with contributions by several friends, i  pioneers (along with the Prodigy, Fatboy Slim, the Crystal Method, and other acts) in bringing the big beat genre to the forefront of pop culture. After attracting Virgin Records, the duo achieved further success with second album Dig Your Own Hole (1997), which topped the UK charts. In the UK, they have had six No. 1 albums and 13 top-20 singles, including two chart-toppers.", "desc_mb_album": "", "desc_mb_artist": "Originally named \"The Dust Brothers\" in honor of the [artist:91d471a1-7639-4a70-baa4-a9e063fb4e83|US production duo], later renamed following an objection by the latter.", "heard_by": ["Frikomid", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 294, "title": "everything is alive", "artist": "Slowdive", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/683917-everything-is-alive_1442.jpg", "aoty_url": "https://www.albumoftheyear.org/album/683917-slowdive-everything-is-alive.php", "aoty_critic_score": 82, "aoty_user_score": 76, "mbid": "0070ec11-d0ef-4df2-9cf8-f8a10f083f27", "yt_id": "Zpkymhh70U4", "rym": null, "genres": [], "desc_lfm_album": "The fifth album from shoegaze giants Slowdive contains the duality of a familiar internal language mixed with the exaltation of new beginnings. everything is alive is transportive, searching and aglow, the work of a classic band continuing to pitch its unmistakable voice to the future. Six years after the group’s monumental self-titled album, everything is alive finds Slowdive—vocalists and guitarists Rachel Goswell and Neil Halstead, guitarist Christian Savill, bassist Nick Chaplin, and drummer Simon Scott—locating evermore contours of its immersive, elemental sound. The new record began with Halstead in the role of writer and producer, working on demos at home. .", "desc_lfm_artist": "Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK  songs in live shows and included two, Terrordactyl and Buy A Snake, on their first full-length album, These Are Lights.\n\nTheir full-length may be downloaded free at the official website, www.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 298, "title": "Enola Gay", "artist": "Asia Menor", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/726616-enola-gay_1644.jpg", "aoty_url": "https://www.albumoftheyear.org/album/726616-asia-menor-enola-gay.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "b68ae33a-d260-4146-8dc4-c53b94fb578a", "yt_id": "zSgS9WrBIwo", "rym": "https://rateyourmusic.com/release/album/asia-menor/enola-gay", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Asia Menor es una banda formada en Temuco en 2018. Iniciada por Jorge S. (Voz principal y guitarra) y Diego S. (Guitarras y sintetizadores), a la que después se incorporan Cristóbal M. (Baterías y percusiones) y Anibal V. (Bajo).\n\nCon la idea de no tocar en vivo, comienzan a esbozar sus primeras composiciones bajo la influencia del post-punk contemporáneo, objetivo desviado ya que pronto se popularizan y comienzan a presentarse a menudo en instancias locales y en otras ciudades como Santiago y Chillán bajo el nombre Enola Gay.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Rocky_stereo", "alberto_gu", "sdecandelario"]}, {"n": 299, "title": "Today I Laid Down", "artist": "bl4ck m4rket c4rt", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/759007-today-i-laid-down_2029.jpg", "aoty_url": "https://www.albumoftheyear.org/album/759007-bl4ck-m4rket-c4rt-today-i-laid-down.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "1831b408-ab9d-4638-8d7c-7f758fabbd4d", "yt_id": "Ye1KV9rm3jY", "rym": "https://rateyourmusic.com/release/album/bl4ck-m4rket-c4rt/today-i-laid-down", "genres": [], "desc_lfm_album": "THE LAST NOTES OF KAI WESENER A Rolling Stone-style article by Hunter S. Thompson (as imagined) There are some people who drift through life unnoticed, slipping between the cracks of ordinary existence like ghosts. And then there are the ones who burn. The ones who refuse to go unnoticed, who carve themselves into the walls of history with the sharp edge of their talent and the raw force of their passion. Kai Wesener was one of the latter. Born in Fremont, California, on May 1, 2006, Kai came screaming into the world like a meteor on fire. From the very .", "desc_lfm_artist": "bl4ck m4rket c4rt was the shoegaze project of Fremont-based artist Kai Otto Wesener (May 1st 2006 - October 30th 2023)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Rocky_stereo", "paqueradejere"]}, {"n": 300, "title": "STRUGGLER", "artist": "Genesis Owusu", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/667738-struggler_1533.jpg", "aoty_url": "https://www.albumoftheyear.org/album/667738-genesis-owusu-struggler.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "6563575a-43a0-4119-8078-b403230a5b72", "yt_id": "bdYtpO1uXpo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Kofi Owusu-Ansah (born 1998), known as Genesis Owusu, is a Ghanaian-Australian singer from Ngambri/Canberra.  He was born in Ghana and moved to Australia at the age of 2. He is the brother of Citizen Kay. His music builds on soul, funk, rap  and pop to create a unique sound. Owusu's debut studio album,  Smiling with No Teeth, was released on 5 March 2021. 60 hours of music was recorded during sessions for this album. Then, songs that conveyed a specific narrative were chosen to be featured on the album.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "paqueradejere", "sdecandelario"]}, {"n": 301, "title": "Ooh Rap I Ya", "artist": "George Clanton", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/504409-ooh-rap-i-ya_2125.jpg", "aoty_url": "https://www.albumoftheyear.org/album/504409-george-clanton-ooh-rap-i-ya.php", "aoty_critic_score": 77, "aoty_user_score": 80, "mbid": "ee5dfe0f-4cc4-41f2-ac5e-ab85b9b44ded", "yt_id": "ksk5mthTR_c", "rym": "https://rateyourmusic.com/release/album/george-clanton/ooh-rap-i-ya", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Formerly known as Mirror Kisses, and also known under the moniker ESPRIT 空想, George Clanton has decided to finally go by his own name and merge the two personas into one project, combining the vocal and New Wave/Chillwave elements from Mirror Kisses with the ethereal, hazy and lo-fi Vaporwave elements of ESPRIT 空想, which results in an absolutely beautiful new sound altogether. On his 2015 album, 100% Electronica, Clanton's warm and glistening synths glide over immensely satisfyingly punchy percussion", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "sdecandelario", "verygooood"]}, {"n": 302, "title": "Se Bueno", "artist": "TURQUOISEDEATH", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/697914-se-bueno_0439.jpg", "aoty_url": "https://www.albumoftheyear.org/album/697914-turquoisedeath-se-bueno.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "2cd9b8d7-0c59-4f80-bd0f-38d1522c3b77", "yt_id": "PadJz4o_jUM", "rym": null, "genres": [], "desc_lfm_album": "Write your own story. I am infinitely grateful for all the support and love my music has received. It all tells me that there are other people in the world like me who crave this kind of music! My attempt won't be the best but it’s a start at uniting some of the best (and my favorite) genres in the world! I would like to thank Ellis, for literally being there from the beginning and lying to me about how my music was good so that I kept going. Thanks to Longinus Records, VMR, , Seb, Cyber, Zenith, Aph, Ezra, .", "desc_lfm_artist": "i make electronic music, sometimes i put way too much reverb and delay", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 303, "title": "The Ballad of Darren", "artist": "Blur", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/668150-the-ballad-of-darren_1157.jpg", "aoty_url": "https://www.albumoftheyear.org/album/668150-blur-the-ballad-of-darren.php", "aoty_critic_score": 82, "aoty_user_score": 72, "mbid": "27cafe53-6ee8-4be7-bdb8-6e28b9a0856b", "yt_id": "hIPKo1XkFF0", "rym": null, "genres": [], "desc_lfm_album": "The Ballad of Darren is the ninth studio album by English alternative rock band Blur. It was released on 21 July 2023 and is is their first studio album in over eight years since The Magic Whip (2015). In June 2021, frontman Damon Albarn first hinted at new music from Blur and Gorillaz, ahead of his second solo studio release The Nearer The Fountain, More Pure The Stream Flows. At the time, he was in talks with drummer Dave Rowntree but plans had not come to fruition yet. On 14 November 2022, bassist Alex James spoke on the possibility of .", "desc_lfm_artist": "Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995).", "desc_mb_album": "", "desc_mb_artist": "Changed their name from ''[http://musicbrainz.org/show/artist/?artistid=79827|Seymour]'' in 1990 in order to secure a record deal.", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 304, "title": "Oppenheimer (Original Motion Picture Soundtrack)", "artist": "Ludwig Göransson", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/702455-oppenheimer-original-motion-picture-soundtrack_0929.jpg", "aoty_url": "https://www.albumoftheyear.org/album/702455-ludwig-goransson-oppenheimer-original-motion-picture-soundtrack.php", "aoty_critic_score": 70, "aoty_user_score": 84, "mbid": "81246011-8a76-419d-a570-26e3dc2b44e7", "yt_id": "5R2wjfLevjo", "rym": null, "genres": [], "desc_lfm_album": "Following their collaboration on the score for 2020’s Tenet, visionary director-writer Christopher Nolan and experimental composer Ludwig Göransson reunite for Nolan’s follow-up project—Oppenheimer, the explosive biopic accounting for the creation of the atom bomb. Nolan has a tendency to collaborate with the same people on different projects, everyone from producers and writers to cast members and composers. For the longest time, composer Hans Zimmer was one of these people, scoring nearly every single one of Nolan’s films since 2005’s Batman Begins, either by himself or in collaboration with another composer. Tenet was the first film that broke their unofficial tradition, .", "desc_lfm_artist": "Ludwig Emil Tomas Göransson (born September 1, 1984) is a Swedish composer, conductor, and record producer. He has scored films such as Fruitvale Station, the Rocky franchise entries Creed and Creed II, Venom, and Tenet. He also composed the new fanfare for Warner Bros. Pictures, as well as the fanfare for the Star Wars brand logo. For his work on the 2018 superhero film Black Panther, he won the Grammy Award for Best Score Soundtrack for Visual Media and the Academy Award for Best Original Score", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 305, "title": "Grave Robbing", "artist": "leroy", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/708675-grave-robbing_2134.jpg", "aoty_url": "https://www.albumoftheyear.org/album/708675-leroy-grave-robbing.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": "925e176d-8904-41df-b00f-4e1ac71d7d57", "yt_id": "YT1k1xdGaEY", "rym": "https://rateyourmusic.com/release/album/leroy/grave-robbing", "genres": [], "desc_lfm_album": "SoundCloud description reads: ----This should explain everything. Remember where you came from. Understand why it's gone. Her spirit is angry Back into the grave she goes---- Originally, Dariacore 3 was supposed to be the last leroy album until jane popped up with an NTS Radio set. She released grave robbing on SoundCloud right after the set ended. .", "desc_lfm_artist": "There are 7 artists known as Leroy:\n\n1. The EDM side project of American artist Jane Remover, also (unofficially) known as c0ncernn. Under this alias, Remover coined the genre Dariacore with her 2021 album of the same name as well as its 2 sequels. After the release of Grave Robbing in 2023, the project was supposedly retired until 2025.\n\n2. An American artist, whose music is featured in television shows such as Scrubs and Arrested Development\n\n3.", "desc_mb_album": "", "desc_mb_artist": "Leroy Anderson (1908-1975) was one of the pre-eminent composers of \"classical pops\" music. Though best known for \"Sleigh Ride\" (originally a pure instrumental) and \"Syncopated Clock\" (used as theme music for the CBS \"Late Show\" and Jeopardy), he wrote many others just as deserving of attention which are still widely played in pops concerts.\n\nNote that although his first name is spelled normally, it seems to be universally pronounced le-ROY. For more information, check out the official web page at http://www.leroy-anderson.com/ .", "heard_by": ["EliasJ72"]}, {"n": 306, "title": "SCARING THE HOES: DLC PACK", "artist": "JPEGMAFIA & Danny Brown", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/701169-scaring-the-hoes-dlc-pack_1612.jpg", "aoty_url": "https://www.albumoftheyear.org/album/701169-danny-brown-jpegmafia-scaring-the-hoes-dlc-pack.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "97f81612-5d23-4954-99a3-5d1bd795a271", "yt_id": "eI79Jo5zPLU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "A collaboration between rapper and producer JPEGMAFIA and rapper Danny Brown. \n\nT c_lfm_album": "I Inside the Old Year Dying is the tenth studio album by English singer-songwriter and musician PJ Harvey, released on 7 July 2023 through Partisan Records. It is her first album of new material since The Hope Six Demolition Project (2016), and she served as producer alongside Flood and John Parish. The lead single, \"A Child's Question, August\", was released on 26 April 2023. Harvey began sharing photographs of herself in the studio recording the album in February 2022.In an April 2022 interview with The Observer, she confirmed that a new album would be released in 2023. In June 2022, .", "desc_lfm_artist": "Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 309, "title": "Speak Now (Taylor's Version)", "artist": "Taylor Swift", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/661201-speak-now-taylors-version_2355.jpg", "aoty_url": "https://www.albumoftheyear.org/album/661201-taylor-swift-speak-now-taylors-version.php", "aoty_critic_score": 80, "aoty_user_score": 76, "mbid": "0441b1b2-de57-4a9a-b007-1f6e159921d5", "yt_id": "GrN2kXN2D0I", "rym": null, "genres": [], "desc_lfm_album": "Speak Now (Taylor's Version) is the third re-recorded album by Taylor Swift, released on July 7, 2023, via Republic Records. It is a re-recording of Swift's third studio album, Speak Now. The re-recording is a part of Swift's counteraction to her 2019 masters dispute. The album was announced on May 5, 2023, at the first Nashville show of her ongoing concert tour, the Eras Tour. The 22-track Speak Now (Taylor's Version) was solely written by Swift. It includes re-recorded versions of 16 songs from the deluxe edition of Speak Now and six previously unreleased \"From the Vault\" songs. Swift and .", "desc_lfm_artist": "Taylor Alison Swift is an American singer-songwriter. Her discography spans multiple genres, and her narrative songwriting, which is often inspired by her personal life, has received widespread media coverage and critical praise.\n\nSwift rose to mainstream prominence with her sophomore studio album, Fearless (2008), a country pop record with crossover appeal. Aided by the top-five singles “Love Story” and “You Belong with Me”, Fearless was certified Diamond by the Recording Industry Recording Industry Association of America (RIAA).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 310, "title": "My Back Was a Bridge for You to Cross", "artist": "ANOHNI and the Johnsons", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/666988-my-back-was-a-bridge-for-you-to-cross_0930.jpg", "aoty_url": "https://www.albumoftheyear.org/album/666988-anohni-and-the-johnsons-my-back-was-a-bridge-for-you-to-cross.php", "aoty_critic_score": 84, "aoty_user_score": 80, "mbid": "7f44b345-d444-493f-bc91-bdee7da5826d", "yt_id": "IJBwPIls_Go", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Anohni and The Johnsons (previously known as Antony and the Johnsons) are a Mercury Prize-winning music act from New York City, New York, United States. The band is fronted by Anohni (f.k.a. Antony) who was born in 1971. \n\nDuring the mid 90s Anohni started solo; after originally producing songs with Blacklips Performance Cult and other late-night cabarets she had a number of songs to work with. In 1995 she assembled a backing group—the self-styled Antony and the Johnsons—and began to focus on the musical side of her performances.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "paqueradejere"]}, {"n": 311, "title": "Chaos For The Fly", "artist": "Grian Chatten", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/660210-chaos-for-the-fly_1314.jpg", "aoty_url": "https://www.albumoftheyear.org/album/660210-grian-chatten-chaos-for-the-fly.php", "aoty_critic_score": 83, "aoty_user_score": 75, "mbid": "bf93b54c-7243-4d7d-b3e0-fd4929279fa9", "yt_id": "lU79fE_zelU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Grian Chatten (born 19 July 1995 in Barrow-in-Furness, England, but raised in Dublin, Ireland) is best known as the lead singer and frontman of Irish post-punk / alternative rock band, Fontaines D.C. April 2023 saw the release of his debut solo single, 'The Score'. A full-length album, Chaos for the Fly, followed in June of the same year.\n\nChatten was born in England to an English mother and an Irish father, but the family moved to Dublin, Ireland, when Grian was just a month old.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 312, "title": "The Beggar", "artist": "Swans", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/346560-the-beggar_210225.jpg", "aoty_url": "https://www.albumoftheyear.org/album/346560-swans-the-beggar.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "a1160c18-1860-41ed-a13e-15b9a3bc7c2f", "yt_id": "en1Tf4PwcWo", "rym": "https://rateyourmusic.com/release/album/swans/the-beggar", "genres": [], "desc_lfm_album": "The Beggar is the sixteenth studio album by American experimental rock band Swans. It was released on June 23, 2023, through Young God Records. The announcement of the album coincided with the release of its lead single, \"Paradise Is Mine\", as well as the announcement of a North American tour. The Beggar was preceded and funded by the acoustic demo album \"Is There Really a Mind?\" (2022). Acoustic renditions of many of the album's then-unfinished tracks, primarily recorded by band leader Michael Gira alone at his home studio, appeared on the demo album Is There Really a Mind? which was .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 313, "title": "3D Country", "artist": "Geese", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/631106-3d-country_0119.jpg", "aoty_url": "https://www.albumoftheyear.org/album/631106-geese-3d-country.php", "aoty_critic_score": 81, "aoty_user_score": 84, "mbid": "c0a0a417-6aac-4a75-b34a-62f7c150fef4", "yt_id": "RTN4Sa3g_w4", "rym": "https://rateyourmusic.com/release/album/geese/3d-country", "genres": [], "desc_lfm_album": "3D Country is the third studio album by American indie rock band Geese, released on June 23, 2023, through Partisan Records and Play It Again Sam. Produced by James Ford, the album was preceded by the singles \"Cowboy Nudes\", \"Mysterious Love\", \"3D Country\", and \"I See Myself\", and received favorable reviews from critics. It is the band's final album to feature founding guitarist Foster Hudson, who departed from the band in December 2023 to focus on his academic studies. A follow-up EP, 4D Country, was released in October 2023 featuring four additional tracks from the album's recording sessions. .", "desc_lfm_artist": "Geese is an American indie rock band formed in 2016 in Brooklyn, New York, United States. \n\nAs a project between friends to build a home studio out of a basement. Their songs are born from the same ambition: make music by any means necessary. They began recording together with sneakers as mic stands and blankets draped over the amps, all within the afternoon following a school day, up until they ran the risk of noise complaints. \n\nOn a practical level", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU"]}, {"n": 314, "title": "SISTERHOOD", "artist": "Lucy Bedroque", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/690030-sisterhood_0044.jpg", "aoty_url": "https://www.albumoftheyear.org/album/690030-lucy-bedroque-sisterhood.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "bef8f6e0-0278-41f4-8a88-45be3d0175b2", "yt_id": "oewiNMKxbZA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Jeremiah Mark (born May 7th 2006 in New York), professionally known as Lucy Bedroque (formerly lostrushi) is a Zambian-American singer and producer based in LA. He's primarily known for his Nintendo DS and fairy-inspired sound.\n\nHe mainly draws inspiration from japanese culture such as anime for his visuals and the japanese visual kei rock band Malice Mizer which he sampled on the song \"INFINITUDE // UROBOROS\".\n\nIn 2021 he and fellow artists yuke", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 315, "title": "PetroDragonic Apocalypse; or, Dawn of Eternal Night: An Annihilation of Planet Earth and the Beginning of Merciless Damnation", "artist": "King Gizzard & The Lizard Wizard", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/661860-petrodragonic-apocalypse_0837.jpg", "aoty_url": "https://www.albumoftheyear.org/album/661860-king-gizzard-the-lizard-wizard-petrodragonic-apocalypse-or-dawn-of-eternal-night.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "381a758e-82bf-403f-85ea-b4f97ed1e0b7", "yt_id": "tfAzMhuflXE", "rym": null, "genr rvanes", "artist": "Jason Isbell", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2023/613967-weathervanes.jpg", "aoty_url": "https://www.albumoftheyear.org/album/613967-jason-isbell-weathervanes.php", "aoty_critic_score": 80, "aoty_user_score": 76, "mbid": "930e72ce-e852-4ab6-91c8-db4cf26c0e2c", "yt_id": "iOVRVXVp2Yw", "rym": null, "genres": ["Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Jason Isbell is an American alt-country singer /songwriter /guitarist from Muscle Shoals, Alabama. He also records as Jason Isbell and the 400 Unit. \n\nBest known for his years with the Drive-By Truckers where he played with his then wife, bassist Shonna Tucker. Isbell - who joined the Truckers in 2001 - left the band in early 2007 around the same time as his divorce from Tucker was finalized. \n\nIn addition to being a gifted songwriter, Isbell is regarded as an exceptional guitar player.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 318, "title": "Fountain Baby", "artist": "Amaarae", "year": 2023, "cover": "https://i.discogs.com/u5WJ4na0MHgprIKBmpkrpm8Woj94SGl_alBiv30wx7Y/rs:fit/g:sm/q:90/h:543/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTI4MjAw/MTA2LTE2OTQxMzMx/NzYtNTAwMS5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/628815-amaarae-fountain-baby.php", "aoty_critic_score": 87, "aoty_user_score": 80, "mbid": "b3b5da6a-74e4-4478-8acf-bdcbcaa8f9df", "yt_id": "kxi9q08WFfc", "rym": "https://rateyourmusic.com/release/album/amaarae/fountain-baby", "genres": ["Pop"], "desc_lfm_album": "Fountain Baby is the second studio album by Ghanaian-American singer, songwriter, producer and engineer, Amaarae. The album was released on 9th June, 2023, by Interscope Records. Fountain Baby has been presented with two singles: \"Reckless & Sweet\" and \"Co-Star\". .", "desc_lfm_artist": "Ama Serwah Genfi (born July 4, 1994), known professionally as Amaarae, is a Ghanaian-American singer, songwriter, producer, and engineer known for her work around representation and gender in music. She is known for her fusion of pop, R&B, Afrobeats, and alté, as well as her fluid representation of gender and sexuality.\n\nAma Serwah Genfi was born in New York and raised between Atlanta and Accra to Ghanaian parents Ama Bawuah and Kwadwo Boateng Genfi.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 319, "title": "Stick Season (We’ll All Be Here Forever)", "artist": "Noah Kahan", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/681547-stick-season-well-all-be-here-forever_0731.jpg", "aoty_url": "https://www.albumoftheyear.org/album/681547-noah-kahan-stick-season-well-all-be-here-forever.php", "aoty_critic_score": 40, "aoty_user_score": 83, "mbid": "14fc4370-9b90-411b-a02e-6c6d5a8799fc", "yt_id": "JKrDdsgXuso", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Noah Kahan (born January 1, 1997) is an American singer-songwriter of folk-infused pop who signed to Republic Records in 2017. Kahan released his first single, \"Young Blood\" in January 2017 and released four other singles over the course of 2017. His fans are known as \"busyheads\". Kahan made his television debut in 2018 on The Late Show with Stephen Colbert performing the single \"Hurt Somebody\". Kahan released his debut EP carrying the same name in January 2018", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 320, "title": "Formal Growth in the Desert", "artist": "Protomartyr", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/621655-formal-growth-in-the-desert_0945.jpg", "aoty_url": "https://www.albumoftheyear.org/album/621655-protomartyr-formal-growth-in-the-desert.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "42b10a39-6d99-494e-8d65-60e3683dd725", "yt_id": "mX95dDaO1VE", "rym": null, "genres": [], "desc_lfm_album": "Formal Growth in the Desert is the sixth studio album by American post-punk band Protomartyr. Since their 2012 debut, Protomartyr have mastered the art of evoking place: the grinding Midwest humility of their hometown, as well as the x-rayed elucidation of America that comes with their vantage. The group’s sixth album was recorded at Sonic Ranch in Tornillo, TX with producer Jake Aron. “The desert is more of a metaphor or symbol,” singer Joe Casey says, “of emotional deserts, or a place or time that seems to lack life.” The “growth” came from a period of colossal transition for Casey, .", "desc_lfm_artist": "Detroit post-punk quartet Protomartyr formed in 2010, slowly bubbling up out of a few bands in a tightly knit music scene. Guitarist Greg Ahee, bassist Scott Davidson, and drummer Alex Leonard started the caustic punk band Butt Babies in 2008, playing mostly dive bars and basements and eventually getting together a practice space in a large industrial warehouse. Ahee was working at the time as a doorman at Detroit's Gem Theater and struck up a conversation with co-worker Joe Casey about music and local friends Tyvek.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere", "sdecandelario"]}, {"n": 321, "title": "Beloved! Paradise! Jazz!?", "artist": "McKinley Dixon", "year": 2023, "cover": "https://dn721904.ca.archive.org/0/items/mbid-606e4923-5630-4d6e-a3db-bea6fc669225/mbid-606e4923-5630-4d6e-a3db-bea6fc669225-35127891698.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "bf43b220-639f-43af-875b-1d173cfd65b7", "yt_id": "Z9VvZpeemO0", "rym": "https://rateyourmusic.com/release/album/mckinley-dixon/beloved-paradise-jazz", "genres": ["hip hop", "Jazz", "Hip-Hop"], "desc_lfm_album": "Beloved! Paradise! Jazz!? is the fourth studio album from American musician McKinley Dixon. Released on June 2, 2023, it is a jazz rap and conscious hip-hop album. On November 30, 2022, the album's first single, \"Sun, I Rise\", featuring Angélica Garcia was released. The album's second single, \"Tyler, Forever\", a tribute to a friend who passed away, was released on January 17, 2023. On March 7, the third single, \"Run, Run, Run\" was released. On April 26, the album's fourth single, title track \"Beloved! Paradise! Jazz!?\" was released. The album's fifth single, \"Dedicated to Tar Feather\" featuring Anjimile was released .", "desc_lfm_artist": "McKinley Dixon (born October 28, 1995) is an American rapper and singer from Richmond, Virginia.\n\nHis first album, “Who Taught You to Hate Yourself?”, was released in 2016.\n\nIn 2023, Dixon would release his second and most popular studio album, “Beloved! Paradise! Jazz!?” which received critical acclaim for its lyricism and storytelling.\n\nIn June 2025, Dixon released the next album called “Magic, Alive!”", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 322, "title": "Shadow Kingdom", "artist": "Bob Dylan", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/646196-shadow-kingdom_0409.jpg", "aoty_url": "https://www.albumoftheyear.org/album/646196-bob-dylan-shadow-kingdom.php", "aoty_critic_score": 82, "aoty_user_score": 70, "mbid": "6b074aba-bbfb-42be-8079-b434d5d9712f", "yt_id": "hCc2SczzqWE", "rym": null, "genres": [], "desc_lfm_album": "Shadow Kingdom is the 40th studio album and second soundtrack album by Bob Dylan, released on June 2, 2023, through Columbia Records. It is Dylan's first album of new studio recordings since his 2020 album Rough and Rowdy Ways. The songs were recorded at Village Recorder in West Los Angeles in early 2021 to accompany Alma Har'el's film Shadow Kingdom: The Early Songs of Bob Dylan, which was shot later. It consists of new recordings of 13 songs from the first half of Dylan's career plus a new instrumental song titled \"Sierra's Theme\". .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": []}, {"n": 323, "title": "But Here We Are", "artist": "Foo Fighters", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/650225-but-here-we-are_0834.jpg", "aoty_url": "https://www.albumoftheyear.org/album/650225-foo-fighters-but-here-we-are.php", "aoty_critic_score": 86, "aoty_user_score": 78, "mbid": "b8b9df75-b781-4363-9ec1-2520a4445a09", "yt_id": "7Uc4ZnNFK40", "rym": null, "genres": ["alternative rock"], "desc_lfm_album": "FOO FIGHTERS, the Rock And Roll Hall Of Famers' 11th album, \"But Here We Are\", out June 2 on Roswell/RCA. A brutally honest and emotionally raw response to everything FOO FIGHTERS endured over the last year, \"But Here We Are\" is a testament to the healing powers of music, friendship and family. Produced by Greg Kurstin and FOO FIGHTERS, \"But Here We Are\" is in nearly equal measure the eleventh FOO FIGHTERS album and the first chapter of the band's new life. Sonically channeling the naiveté of FOO FIGHTERS' 1995 debut, informed by decades of maturity and depth, \"But Here .", "desc_lfm_artist": "Foo Fighters is an American rock band formed in Seattle in 1994. The group began as a solo project by former Nirvana drummer Dave Grohl and later developed into a full band. The lineup has included vocalist and guitarist Grohl, bassist Nate Mendel, guitarists Pat Smear and Chris Shiflett, keyboardist Rami Jaffee, and drummer Ilan Rubin. Former members have included guitarist Franz Stahl and drummers William Goldsmith, Taylor Hawkins, and Josh Freese.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 324, "title": "The Girl Is Crying in Her Latte", "artist": "Sparks", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/598519-the-girl-is-crying-in-her-latte_1600.jpg", "aoty_url": "https://www.albumoftheyear.org/album/598519-sparks-the-girl-is-crying-in-her-latte.php", "aoty_critic_score": 83, "aoty_user_score": 63, "mbid": "888c2db2-1f11-4a89-99f8-2169dfe2b725", "yt_id": "UTAxPhxADo0", "rym": null, "genres": [], "desc_lfm_album": "The Girl Is Crying in Her Latte is the 25th studio album by American rock group Sparks, released through Island Records on May 26, 2023, their first release through the label since 1976. It was preceded by the release of two singles, and received acclaim from critics. The duo toured the world until July 2023 in support of the album, the biggest headlining tour of their career. .", "desc_lfm_artist": "Sparks is an American rock and pop music band formed in Los Angeles in 1970 by brothers Ron Mael (keyboards) and Russell Mael (vocals), initially under the name Halfnelson. Best known for their quirky approach to song writing, Sparks' music is often accompanied by cutting and acerbic lyrics, and an idiosyncratic stage presence, typified in the contrast between Russell's wide-eyed hyperactive frontman antics and Ron's sedentary scowling.\n\nThe band's long career has seen them successfully adopt many different musical genres; including glam pop", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere", "sdecandelario"]}, {"n": 325, "title": "Drive Home", "artist": "Portraits Of Tracy", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/608282-drive-home_0432.jpg", "aoty_url": "https://www.albumoftheyear.org/album/608282-portraits-of-tracy-drive-home.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "143fc60c-1022-4d6b-b545-2b9a664c5ac9", "yt_id": "BnvBVFveTiM", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "What’s impressive about Portraits of Tracy, a 21-year-old singer from Baton Rouge, Louisiana, is how she’s already made waves with songs like “En Garde.” Tracy Amare, who also goes by the name Portraits of Tracy, has been releasing music on SoundCloud and Spotify since she was 15. On “En Garde,” a teaser for her third upcoming album Drive Home, her talents as both a rapper and producer are shown in spaces. Highlighted by a ghastly and celestial ambiance", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 326, "title": "Everyone's Crushed", "artist": "Water From Your Eyes", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/618407-everyones-crushed_1026.jpg", "aoty_url": "https://www.albumoftheyear.org/album/618407-water-from-your-eyes-everyones-crushed.php", "aoty_critic_score": 82, "aoty_user_score": 71, "mbid": "082363d7-2028-434f-b77b-ce956585ed99", "yt_id": "-Uscja_gfJY", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Water From Your Eyes from Brooklyn, NY, United States, is the collaborative synthpop project of Rachel Brown (Thanks for Coming) and Nate Amos (This is Lorelei). The group's clear-eyed approach to dance music combines austerity, satire, abrasion and charm. Since 2016 (and as of July 2024) the duo released seven studio albums, four EPs and many singles.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "sdecandelario"]}, {"n": 327, "title": "Seven Psalms", "artist": "Paul Simon", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/645789-seven-psalms_1014.jpg", "aoty_url": "https://www.albumoftheyear.org/album/645789-paul-simon-seven-psalms.php", "aoty_critic_score": 82, "aoty_user_score": 71, "mbid": "fed97b51-2553-4573-8a55-8af5ffd7aebc", "yt_id": "6gY6XEpI2dc", "rym": null, "genres": [], "desc_lfm_album": "Seven Psalms is the fifteenth solo studio album by Paul Simon. It was released on May 19, 2023, through Owl Records and Legacy Recordings. The album was conceived as a seven-part piece meant to be listened to in its entirety, and is a completely acoustic performance. It's Simon's first album since In The Blue Light (2018), and his first of new material since Stranger to Stranger (2016). Guests on the album include Wynton Marsalis and Simon's wife Edie Brickell. .", "desc_lfm_artist": "Paul Frederic Simon (born October 13, 1941) is an American singer-songwriter. One of the most celebrated artists of the twentieth century, Simon's career has spanned six decades. Born in New Jersey, Simon grew up in the borough of Queens in New York City and developed an interest in rock music in his teens.\n\nHe began performing with his schoolfriend Art Garfunkel in 1956; together the two came to prominence in the 1960s as Simon & Garfunkel. The duo's blend of folk and rock music in hits like \"The Sound of Silence\", \"Mrs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 328, "title": "Live at Electric Lady", "artist": "Clairo", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/664190-live-at-electric-lady_1429.jpg", "aoty_url": "https://www.albumoftheyear.org/album/664190-clairo-live-at-electric-lady.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": "98947d87-2df5-4b7c-acc4-8a7e2eb1e561", "yt_id": "7BrzBz0fKX0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Claire Elizabeth Cottrill (born August 18, 1998), known professionally as Clairo, is an American singer-songwriter. She began sharing music online at age 13.\n\nClairo gained widespread attention following the viral success of the music video for her lo-fi single \"Pretty Girl\" in 2017. She subsequently signed with Fader Label and released her debut EP \"Diary 001\" in 2018. Her first studio album, \"Immunity\" (2019), included the singles \"Bags\" and \"Sofia,\" with the latter becoming her first entry on the Billboard Hot 100.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo"]}, {"n": 329, "title": "Everything Harmony", "artist": "The Lemon Twigs", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/608938-everything-harmony_0155.jpg", "aoty_url": "https://www.albumoftheyear.org/album/608938-the-lemon-twigs-everything-harmony.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "07c05371-f3fb-49e7-aa0e-2884e8571c3e", "yt_id": "vrsO5Au5AkE", "rym": "https://rateyourmusic.com/release/album/the-lemon-twigs/everything-harmony", "genres": [], "desc_lfm_album": "Everything Harmony is the fourth studio album by the American rock band The Lemon Twigs, released on May 5, 2023. It was self-produced by the band and received positive reviews from music critics. The record was said to have been constructed around several ballads written by Brian. In an interview Michael commented, \"Brian had composed these haunting melodies, and it felt appropriate to write lyrics that were delicate and revealing.\" .", "desc_lfm_artist": "The Lemon Twigs are an American pop/rock band from Long Island, New York, United States, fronted by brothers Brian D’Addario and Michael D’Addario. They both write and perform, and are joined for live performance by alternating instrumentalists Reza Matin (drums, guitar, vocals) and Danny Ayala (keys, bass, guitar, drums, vocals).\n\n\nThe Times characterized The Lemon Twigs as \"a modern-day band combining the melodic, harmony-rich soft rock of Wings and Supertramp", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 330, "title": "Maps", "artist": "billy woods & Kenny Segal", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/635457-maps_1012.jpg", "aoty_url": "https://www.albumoftheyear.org/album/635457-billy-woods-kenny-segal-maps.php", "aoty_critic_score": 86, "aoty_user_score": 83, "mbid": "e340bafd-dffb-43ae-8ed2-a6476ef4fecf", "yt_id": "prX3U-h6eP0", "rym": null, "genres": [], "desc_lfm_album": "Maps is the new album from NYC rapper billy woods and LA producer Kenny Segal, their first full collaboration since 2019’s Hiding Places. Four years after that landmark record, the duo have reunited with a vengeance. Maps is a story of the road, or roads, taken and untaken; of living the dream and dreaming of another life. It is an album about trying to find your way home, after making your home wherever you lay your head. “Kenny and I made more songs together before Hiding Places than we did after,” woods says. “I think we only collaborated once over .", "desc_lfm_artist": "", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "verygooood"]}, {"n": 331, "title": "Live at Electric Lady", "artist": "Denzel Curry", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/660064-live-at-electric-lady_0807.jpg", "aoty_url": "https://www.albumoftheyear.org/album/660064-denzel-curry-live-at-electric-lady.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "40ebfb3d-9531-487f-a4ca-94f7af8f2fd2", "yt_id": "spziRF3tMn0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Denzel Rae Don Curry (born February 16, 1995) is an American rapper raised in Carol City, Florida. Curry started rapping while in sixth grade and on September 24, 2011, at age 16, released his first mixtape, titled King Remembered Underground Tape 1991–1995. Following the release of Curry's first mixtape, he became a member of SpaceGhostPurrp's hip-hop collective, Raider Klan, and frequent collaborator of Miami hip-hop group Metro Zu.\n\nCurry left Raider Klan in 2013", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 332, "title": "That! Feels Good!", "artist": "Jessie Ware", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/601301-that-feels-good_1254-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/601301-jessie-ware-that-feels-good.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "cebbae42-8612-4c33-9d1c-ac1319794ec4", "yt_id": "jx6w-1V8KD4", "rym": "https://rateyourmusic.com/release/album/jessie-ware/that-feels-good", "genres": ["Pop"], "desc_lfm_album": "That! Feels Good! is the fifth studio album by British singer Jessie Ware, released on 28 April, 2023. The album follows her critically-acclaimed fourth studio album, What's Your Pleasure?. It features the singles Free Yourself, Pearls and Begin Again. The album was announced on 9 February, 2023 with the release of the second single, Pearls. .", "desc_lfm_artist": "Jessica Lois Ware (born 15 October 1984) is an English singer-songwriter and podcaster. Her debut studio album Devotion (2012) peaked at number five on the UK Albums Chart and produced the single \"Wildest Moments\". Her follow-up record, Tough Love (2014), reached number nine in the United Kingdom. In October 2017, Ware released her third studio album, Glasshouse, by Island Records. Ware and her mother present a food podcast called Table Manners. Her fourth album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "paqueradejere", "verygooood"]}, {"n": 333, "title": "Calico", "artist": "Ryan Beatty", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/627830-calico_1734.jpg", "aoty_url": "ht  like a musician,” Wednesday’s Karly Hartzman tells Apple Music of Rat Saw God, her North Carolina rock outfit’s fifth LP. “I've had the idea of the sound I wanted since I started playing six years ago, but it took me until Twin Plagues to kind of arrive there. I think I finally did what I've imagined for a long time with Rat Saw God.” What Hartzman has been chasing until now is a braiding together of what she loves most about shoegaze (the total volume, the sheets of guitar) and .", "desc_lfm_artist": "There is more than one artist with this name, including:\n\n1) Wednesday are an American shoegaze band from Asheville, NC led by singer and guitarist Karly Hartzman.\n2) Wednesday were a Canadian band active during the 60s/70s known for \"Last Kiss\".\n3) Wednesday were a German-English rock band active from 1975-1980.\n4) Wednesday was the Swedish entry in the 2003 Junior Eurovision competition. \n5) Wednesday are also an instrumental rock band from Bangkok.", "desc_mb_album": "", "desc_mb_artist": "All songwriting credits under this name should be linked to [https://musicbrainz.org/artist/239a6be5-3018-4bc9-9385-bbaf2c688b24|the individual].", "heard_by": ["Frikomid", "Lonsonxd", "armandwave", "sdecandelario"]}, {"n": 337, "title": "With A Hammer", "artist": "Yaeji", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/592685-with-a-hammer-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/592685-yaeji-with-a-hammer.php", "aoty_critic_score": 82, "aoty_user_score": 70, "mbid": "75cf3936-f661-4dc5-8796-d768949457b8", "yt_id": "WoIojSU6w5Q", "rym": null, "genres": [], "desc_lfm_album": "With a Hammer is the debut studio album by Korean-American producer and DJ, Yaeji. It was released on April 7, 2023 through XL Recordings. With a Hammer was composed across a two-year period in New York, Seoul, and London, beginning shortly after the release of WHAT WE DREW 우리가 그려왔던 and during the lockdowns of the Coronavirus pandemic. It is a diaristic ode to self-exploration; the feeling of confronting one’s own emotions, and the transformation that is possible when we’re brave enough to do so. In this case, Yaeji examines her relationship to anger. It is a departure from her .", "desc_lfm_artist": "Kathy Yaeji Lee (born August 6, 1993 in New York City, U.S.), also known as Yaeji, is a Korean-American singer/producer of electronic deep house music, with whispered vocals in Korean and English. \n\nYaeji was born in Flushing, Queens as a single child in a Korean family. Growing up, she moved from New York to Atlanta when she was 5, and then to South Korea in the third grade. Yaeji grew up in Seoul, South Korea, and eventually moved back to the United States to study conceptual art", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 338, "title": "Blondshell", "artist": "Blondshell", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/598702-blondshell_1511.jpg", "aoty_url": "https://www.albumoftheyear.org/album/598702-blondshell-blondshell.php", "aoty_critic_score": 82, "aoty_user_score": 74, "mbid": "66393333-3e8a-4a18-ade5-007934ec1ad4", "yt_id": "oMufqxs64bw", "rym": null, "genres": [], "desc_lfm_album": "Blondshell, Blondshell’s debut studio album, was released on April 7, 2023 via Partisan Records. It was produced by Yves Rothman. The album was announced on January 24, 2023 along with the release of the fifth single, “Joiner”. The album also includes the singles “Olympus”, “Kiss City”, “Sepsis”, and \"Veronica Mars”. The album reached number 88 on the US Top Current Album Sales chart. A deluxe version of the album was released on October 6, 2023. .", "desc_lfm_artist": "Blondshell is an indie rock project by American musician Sabrina Teitelbaum, based in Los Angeles, California. Following an early pop-leaning career under the name BAUM, Teitelbaum began writing more rock-centric music during the COVID-19 pandemic and debuted as Blondshell in June 2022 with the single \"Olympus\".  This was followed by the singles \"Kiss City\" in July and \"Sepsis\" in August. Teitelbaum signed to Partisan Records in December 2022 and simultaneously released another single, \"Veronica Mars\" followed by \"Joiner\" in January 2023.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 339, "title": "the record", "artist": "boygenius", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/593242-the-record_1201.jpg", "aoty_url": "https://www.albumoftheyear.org/album/593242-boygenius-the-record.php", "aoty_critic_score": 88, "aoty_user_score": 78, "mbid": "1339f18d-220a-4405-8ae9-e52993b1ef70", "yt_id": "aZW64KCsIag", "rym": null, "genres": ["folk", "indie rock", "indie folk"], "desc_lfm_album": "the record is the debut album by the American indie supergroup boygenius, which consists of Lucy Dacus, Julien Baker, and Phoebe Bridgers. It was released on March 31, 2023, via Interscope Records as a follow-up to their self-titled EP that was released in 2018. Three lead singles, “$20”, “ Emily, I’m Sorry” and “True Blue” were released on January 18, 2023. A fourth single, \"Not Strong Enough\", was released on March 1, 2023, along with a music video directed by boygenius. The Record received critical acclaim and was awarded perfect scores by the likes of DIY, NME, and Rolling Stone. .", "desc_lfm_artist": "Grammy-winning American singer-songwriters Julien Baker, Phoebe Bridgers and Lucy Dacus record together as boygenius. Their first EP, the eponymous boygenius, was released in November 2018. On July 3, 2020, a demo EP titled boygenius (demos) was released on Bandcamp and was available for 24 hours only. The EP consisted of the June 5, 2018 demos of \"Bite The Hand\", \"Me & My Dog\", and \"Stay Down\".\n\n“When we met, Lucy and Phoebe and I were in similar places in our lives and our musical endeavours", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 340, "tit
