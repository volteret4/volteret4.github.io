m.jpg", "aoty_url": "https://www.albumoftheyear.org/album/570717-andy-shauf-norm.php", "aoty_critic_score": 80, "aoty_user_score": 70, "mbid": "69f23696-ea48-4b37-9984-c889b2a028b6", "yt_id": "em1BCEeWfIY", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Andy Shauf is a Canadian singer-songwriter from Regina, Saskatchewan. He plays several instruments, including clarinet.\n\nKnown for honest, self-reflective songs as well as captivating lyrical works of fiction and an intimate live show, Shauf is considered one of the most intriguing emerging songwriters around. \n\nHis release, The Bearer of Bad News, explores themes of uncertainty, curiosity and spirituality. “I think spirituality is a part of life whether you are religious or not, even if you’re just superstitious.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 357, "title": "Raven", "artist": "Kelela", "year": 2023, "cover": "https://cdn2.albumoftheyear.org/600x0/album/571223-raven.jpg", "aoty_url": "https://www.albumoftheyear.org/album/571223-kelela-raven.php", "aoty_critic_score": 81, "aoty_user_score": 79, "mbid": "ac94c394-60af-44dd-be4e-8d8fae38ba74", "yt_id": "qc5m70lB9MI", "rym": "https://rateyourmusic.com/release/album/kelela/raven", "genres": ["contemporary r&b"], "desc_lfm_album": "Raven is the second studio album by American singer-songwriter Kelela, released on February 10, 2023. In a press release, she said Raven began as a reaction to feeling alone as a black femme working within dance music, and describes the album as an affirmation of that perspective. Raven was supported by the singles \"Washed Away\", \"Happy Ending\", \"On the Run\" and \"Enough for Love\". .", "desc_lfm_artist": "Kelela Mizanekristos (Amharic: ከለላ ሚዛነክርስቶስ, käläla mizanäkərəsətosə; born June 4, 1983) is an American singer. \n\nA second-generation Ethiopian American and an only child, Mizanekristos was born in Washington, D.C., on June 4, 1983. Growing up in Gaithersburg, Maryland, she fm_artist": "Margo Rae Price (born April 15, 1983) is an American country singer-songwriter based in Nashville, Tennessee. The Fader has called her \"country's next star.\" Her debut solo album Midwest Farmer's Daughter was released on Third Man Records on March 25, 2016. The album was recorded at Sun Studio in Memphis, Tennessee, and was engineered by Matt Ross-Spang. The album was recorded in three days. On tour, she is backed by her band the Pricetags.\n\nPrice grew up in the small town of Aledo", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 366, "title": "結束バンド [Kessoku Band]", "artist": "結束バンド [kessoku band]", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/567793-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/567793--kessoku-band--kessoku-band.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": null, "yt_id": "BTmcXqoSDz0", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 367, "title": "Beware of the Monkey", "artist": "MIKE", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/558448-beware-of-the-monkey.jpg", "aoty_url": "https://www.albumoftheyear.org/album/558448-mike-beware-of-the-monkey.php", "aoty_critic_score": 81, "aoty_user_score": 82, "mbid": "3024bbe8-0d0a-44f4-878b-dd3d6f53851b", "yt_id": "l_W1tDcmJBw", "rym": null, "genres": [], "desc_lfm_album": "MIKE’s 2022 album ‘Beware of the Monkey’, his second full length album to not release during the annual summer solstice (June 21st-June 22nd), instead sharing its release date with War in my Pen which both released during the winter solstice (December 21st). The title came from a Chinese horoscope that MIKE saw in a Chinese restaurant and interpreted as a warning about the future. In a livestream prior to the album’s release, he explained that he is a tiger in the Chinese horoscope, and that tigers are cautioned to Beware of the Monkey. MIKE'S BANDCAMP: https://mikelikesrap.bandcamp.com/ COVER ARTWORK: Bianca Fields .", "desc_lfm_artist": "There are multiple artists using this name:\n\n1. MIKE (born Michael Jordan Bonema on October 13th, 1998) is a rapper originally from New Jersey but currently based out of New York City. He usually drops his projects on either of the solstices (June 21st or December 21st) each year. Also known as dj blackpower (MIKE when rapping dj blackpower when producing.)\n\n2. MIKE is a punk rock band from Stockholm, Sweden.\n\nMIKE started in January 2006 by Joel, Fredrik, Viktor and Jesper.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Rocky_stereo"]}, {"n": 368, "title": "卵 [Tamago]", "artist": "betcover!!", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/583833-.jpg", "aoty_url": "https://www.albumoftheyear.org/album/583833-betcover--tamago.php", "aoty_critic_score": 72, "aoty_user_score": 81, "mbid": null, "yt_id": "V0BRL91Q4yk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "betcover!! is the musical project of Yanase Jiro, based in Tokyo, Japan.\n\nCurrent lineup: Yanase Jiro (Vocals, Guitar) Hidaka Riki (Guitar)  Shirase Tsukasa (Keyboard) Yoshida Hayato (Bass)  Umi Ogimi (Drums)  Matsumaru Kei (Saxophone) \n\nOfficial Website\nBandcamp", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 369, "title": "모​호​함 속의 너 Nebulous You", "artist": "Della Zyr", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/582507--nebulous-you.jpg", "aoty_url": "https://www.albumoftheyear.org/album/582507-della-zyr--nebulous-you.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": null, "yt_id": "WLGkACCKZdY", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Della Zyr from Korea, is a musician who composes music with touches of ether and is influenced by shoegaze. Prior to her debut, she uploaded various covers of songs such as 'Protector' and 'Dagger' , eventually leaving grade school to make a full leap into the genre. In 2011, he released his debut mixtape", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 385, "title": "The Car", "artist": "Arctic Monkeys", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/505321-the-car.jpg", "aoty_url": "https://www.albumoftheyear.org/album/505321-arctic-monkeys-the-car.php", "aoty_critic_score": 80, "aoty_user_score": 64, "mbid": "249d7049-7d56-497b-abfe-464e3c535daf", "yt_id": "KQsrIxyoJdE", "rym": null, "genres": [], "desc_lfm_album": "The Car is the seventh studio album by English rock band Arctic Monkeys, released on 21 October 2022 by Domino Recording Company. It was written by band frontman Alex Turner in his Los Angeles home. It was produced in Suffolk, Paris and London by frequent Arctic Monkeys collaborator James Ford, alongside frequent guest musicians Tom Rowley, Loren Humphrey and Tyler Parkford. It was arranged by Bridget Samuels and Turner. Drummer Matt Helders took the picture on the album cover, which depicts a white car in an empty car park. Its title refers to said cover and the abundance of references .", "desc_lfm_artist": "Arctic Monkeys are an alternative rock band formed in Sheffield, South Yorkshire, England in 2002 after meeting at Stocksbridge High School. The band consists of Alex Turner (vocals, guitar, piano), Jamie Cook (guitar), Nick O'Malley (backing vocals, bass) and Matt Helders (drums, vocals). Founding bassist Andy Nicholson left in 2006.\n\nThey are one of the first bands to come to public attention via the Internet via MySpace, despite none of them having an account.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 386, "title": "Stumpwork", "artist": "Dry Cleaning", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/515034-stumpwork.jpg", "aoty_url": "https://www.albumoftheyear.org/album/515034-dry-cleaning-stumpwork.php", "aoty_critic_score": 83, "aoty_user_score": 69, "mbid": "e158aa01-e752-4d4b-9cfb-69335efd54d3", "yt_id": "PD3KhCTk4dU", "rym": "https://rateyourmusic.com/release/album/dry-cleaning/stumpwork", "genres": [], "desc_lfm_album": "Stumpwork is the British post-punk band Dry Cleaning’s second album. It was released on October 21, 2022 via 4AD. The singles were “Don’t Press Me”, “Anna Calls From The Arctic”, “Gary Ashby” and “No Decent Shoes For Rain”. As with their debut album, New Long Leg, the album was recorded at Rockfield Studios in Wales and was produced by John Parish. .", "desc_lfm_artist": "Dry Cleaning are an English post-punk band formed in South London in 2017. The group consists of vocalist Florence Shaw, guitarist Tom Dowse, bassist Lewis Maynard, and drummer Nick Buxton. Noted for their distinctive blend of motorik riffs, angular guitar work, and Shaw’s spoken-word vocal delivery, Dry Cleaning quickly gained attention for their unconventional lyrics, dry wit, and minimalist approach.\n\nAfter initially coming together as longtime friends experimenting with instrumentals", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 387, "title": "hugo", "artist": "Loyle Carner", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/538310-hugo-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/538310-loyle-carner-hugo.php", "aoty_critic_score": 83, "aoty_user_score": 79, "mbid": "e2915062-5748-4cef-bece-1f2ec699ef59", "yt_id": "uQacKc5mxMI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Loyle Carner, born Benjamin Gerard Coyle-Larner, is an acclaimed English hip hop musician from South London. He is known for his introspective, confessional, and poetic style of rap, often incorporating jazz-infused production. His music delves into themes of personal identity, family, grief, politics, and his experiences with ADHD and dyslexia.\n\nKey aspects of Loyle Carner's career and artistry:\n\nMusical Style: His sound is often described as \"languid\" and \"introspective", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 388, "title": "Midnights", "artist": "Taylor Swift", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/541510-midnights-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/541510-taylor-swift-midnights.php", "aoty_critic_score": 82, "aoty_user_score": 64, "mbid": "0dcc84fb-c592-46e9-ba92-a52bb44dd553", "yt_id": "JvfM-OW2Rkg", "rym": "https://rateyourmusic.com/release/album/taylor-swift/midnights/", "genres": [], "desc_lfm_album": "Midnights is the tenth studio album by American singer-songwriter Taylor Swift, released on October 21, 2022, through Republic Records. Announced at the 2022 MTV Video Music Awards, the album marks Swift's first body of new work since her ninth studio album, evermore. Swift wrote and produced Midnights with Jack Antonoff and described the album as a \"journey through terrors and sweet dreams\" that describes thirteen sleepless nights of her life. Following the surprise release and negligible promotion of her previous studio albums, Swift returned to her traditional album roll-out with Midnights. She unveiled the track list through a TikTok series .", "desc_lfm_artist": "Taylor Alison Swift is an American singer-songwriter. Her discography spans multiple genres, and her narrative songwriting, which is often inspired by her personal life, has received widespread media coverage and critical praise.\n\nSwift rose to mainstream prominence with her sophomore studio album, Fearless (2008), a country pop record with crossover appeal. Aided by the top-five singles “Love Story” and “You Belong with Me”, Fearless was certified Diamond by the Recording Industry Recording Industry Association of America (RIAA).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Rocky_stereo"]}, {"n": 389, "title": "YTI⅃AƎЯ", "artist": "Bill Callahan" d Canadian dream pop band formed in Prince Edward Island, Canada in 2011.\n\nReverb-drenched and bittersweet, Alvvays members Molly Rankin  (daughter of the late John Morris Rankin of popular Canadian Celtic folk band The Rankin Family) and Kerri MacLellan were childhood friends, who played music together while growing up in Cape Breton, Nova Scotia, Canada in the 1990s and 2000s. Rankin and MacLellan moved to Prince Edward Island for college.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "sdecandelario"]}, {"n": 391, "title": "Anywhere But Here", "artist": "Sorry", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/525004-anywhere-but-here.jpg", "aoty_url": "https://www.albumoftheyear.org/album/525004-sorry-anywhere-but-here.php", "aoty_critic_score": 81, "aoty_user_score": 73, "mbid": "d7b4a804-05d9-4d27-86bf-9c4f399277dd", "yt_id": "rNaBYq1-Tqs", "rym": "https://rateyourmusic.com/release/album/sorry/anywhere-but-here", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are at least five bands / artists named Sorry.\n\n1. Sorry are an alternative rock band from London, United Kingdom, formerly known as Fish. The band is the result of the collaborations of Asha Lorenz and Louis O’Brien. As Sorry, they started releasing singles in 2017 and put out two albums of demo recordings from their vaults (in 2017 and 2018)  before finally releasing their début full length, 925 in 2020. Here's their Bandcamp: https://sorrybanduk.bandcamp.com.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "sdecandelario"]}, {"n": 392, "title": "Ice, Death, Planets, Lungs, Mushrooms and Lava", "artist": "King Gizzard & The Lizard Wizard", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/542687-ice-death-planets-lungs-mushrooms-and-lava.jpg", "aoty_url": "https://www.albumoftheyear.org/album/542687-king-gizzard-the-lizard-wizard-ice-death-planets-lungs-mushrooms-and-lava.php", r moved back to London as a teenager. He grew up reading Donald Goines.\n\nAs a child, Allen was nicknamed \"Rome Streetz\", as he often roamed intercity New York.\n\nIn 2021, Allen signed to Westside Gunn's Griselda Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 395, "title": "Cool It Down", "artist": "Yeah Yeah Yeahs", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/510615-cool-it-down.jpg", "aoty_url": "https://www.albumoftheyear.org/album/510615-yeah-yeah-yeahs-cool-it-down.php", "aoty_critic_score": 80, "aoty_user_score": 74, "mbid": "4d49427b-f9d9-46f6-9922-5e9499433880", "yt_id": "ckM_TklU_AQ", "rym": null, "genres": [], "desc_lfm_album": "Cool It Down is the fifth studio album by American indie rock band Yeah Yeah Yeahs, released on September 30, 2022, through Secretly Canadian. It marks the group's first album since 2013's Mosquito and their first release through Secretly Canadian. .", "desc_lfm_artist": "Yeah Yeah Yeahs is an American alternative rock band formed in New York City in 2000. The group is composed of vocalist Karen O, guitarist Nick Zinner, and drummer Brian Chase. The band has recorded five studio albums; originally signed to independent Touch and Go Records, their first four albums were released by major record label Interscope. The first, Fever to Tell, was released in 2003. The second, Show Your Bones, was released in 2006 and was named the second best album of the year by NME.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "paqueradejere", "sdecandelario"]}, {"n": 396, "title": "The Bible", "artist": "Lambchop", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/515654-the-bible.jpg", "aoty_url": "https://www.albumoftheyear.org/album/515654-lambchop-the-bible.php", "aoty_critic_score": 80, "aoty_user_score": 71, "mbid": "b17eba4e-b0f2-4004-99ce-520fbc6654cf", "yt_id": "XTOdPhJSszA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist":  is the tenth studio album by Icelandic singer-musician Björk. It was officially released on September 30, 2022 through One Little Independent Records. The word 'fossora' derives from Latin meaning “hole digger”, representing Björk’s intent to dig up and re-discover her roots, giving them new meanings. Some of the album’s themes are indeed Björk’s family, her home country Iceland, love, and the idea of belonging to a place. Björk worked on the album during her stay in Iceland over the course of 5 years, and the COVID-19 pandemic and quarantine/lockdown helped her to cement her vision. In an interview with .", "desc_lfm_artist": "Björk Guðmundsdóttir (born 21 November 1965), known mononymously as Björk, is an Icelandic singer, songwriter, composer, record producer, and actress. Recognised for her distinctive voice, three-octave vocal range, and unconventional public image, she has developed an eclectic musical style over a career spanning five decades, incorporating elements of electronic, pop, dance, trip hop, jazz, and avant-garde music. She is widely regarded as an influential figure in electronic and experimental music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared"]}, {"n": 399, "title": "Weather Alive", "artist": "Beth Orton", "year": 2022, "cover": "https://dn710108.ca.archive.org/0/items/mbid-56c0654d-3f42-47fa-b18e-b2a03997286c/mbid-56c0654d-3f42-47fa-b18e-b2a03997286c-43939816069.jpg", "aoty_url": "https://www.albumoftheyear.org/album/510166-beth-orton-weather-alive.php", "aoty_critic_score": 81, "aoty_user_score": 74, "mbid": "b33cc23b-1fcd-483e-b379-a0282c9219a8", "yt_id": "JkSBgl8278E", "rym": null, "genres": ["folk rock"], "desc_lfm_album": "Weather Alive is the eighth studio album by English singer-songwriter Beth Orton. The album was released on 23 September 2022 by Partisan Records. Orton began work on Weather Alive after buying a used upright piano from a dealer at Camden Market in London for £300 (US$350) and creating songs by playing notes around the instrument. In an interview with The New York Times, Orton said of that creation process: \"No matter where you touch (the piano), it just has these resonances Little ghosts of other chords just keep ringing out and you're like, \"Oh, that speaks of another melody, and .", "desc_lfm_artist": "Beth Orton (born Elizabeth Caroline Orton, 14 December 1970, in East Dereham, Norfolk) is a BRIT Award–winning English singer-songwriter, known for her 'folktronica' sound, which mixes elements of folk and electronica. She initially came to notice for her collaborations with William Orbit and the Chemical Brothers in the mid-1990s. However, these were not Orton's first recordings as she had released a solo album, Superpinkymandy, in 1993. Since the album was only released in Japan, it went largely unnoticed by international audiences.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 400, "title": "God Save the Animals", "artist": "Alex G", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/515833-god-save-the-animals-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/515833-alex-g-god-save-the-animals.php", "aoty_critic_score": 83, "aoty_user_score": 76, "mbid": "26e50192-3b06-4556-952c-36d86c4253e3", "yt_id": "Ki-nW4oBfnw", "rym": "https://rateyourmusic.com/release/album/alex-g/god-save-the-animals", "genres": [], "desc_lfm_album": "“God Save the Animals” is the ninth studio album by American musician Alex G, released on September 23, 2022, by Domino Recording Company. It was produced by Alex G and Unknown Mortal Orchestra bass guitarist Jacob Portrait and recorded at various studios in Philadelphia and the northeast United States. It was promoted by four singles including \"Blessing\" and \"Runner\". It received acclaim from critics, appearing on various lists of 2022's best albums, and charted on the US Billboard 200 as well as in New Zealand and Scotland. .", "desc_lfm_artist": "Alex Giannascoli, better known by his stage name Alex G (formerly (Sandy) Alex G), is a multi-instrumentalist based in  Philadelphia, Pa. He attended Haverford High School where he served as a member of The Skin Cells (2006-2015) along with Sam and Colin Acchione.\n\nUnder his own name of Alex G, he started his career with DIY self-releases on Bandcamp and began building up an audience with his label debut, DSU (2014), released on Orchid Tapes to critical acclaim from various publications.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 401, "title": "Paraglow", "artist": "파란노을 [Parannoul]", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/549365-paraglow-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/549365-parannoul-paraglow.php", "aoty_critic_score": 74, "aoty_user_score": 81, "mbid": null, "yt_id": "l_VhZqJG1s0", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["verygooood"]}, {"n": 402, "title": "Hold the Girl", "artist": "Rina Sawayama", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/504375-hold-the-girl-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/504375-rina-sawayama-hold-the-girl.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "b0563b67-ad04-4276-817a-abffd188a8d9", "yt_id": "ikkfuGeAfYg", "rym": null, "genres": [], "desc_lfm_album": "Hold the Girl is the second studio album by Japanese-British singer Rina Sawayama. It was released on September 16, 2022 by Dirty Hit. The lead single from the album, entitled \"This Hell\", was released on May 18, 2022. The album, recorded between 2020 and 2021, features production from collaborators including Paul Epworth, Clarence Clarity, Stuart Price and Marcus Andersson. Clarence Clarity also produced much of Sawayama's debut album Sawayama (2020). .", "desc_lfm_artist": "Rina Sawayama (born 16 August 1990 in Niigata, Japan) is a Japanese-British London-based singer, songwriter, producer, model, and actress. Born and raised in Japan until moving to the UK at the age of 5, Rina would go on to study politics at Cambridge University. At university, she decided to pursue both modeling and her love for singing. She would go on to experiment in a hip hop group before deciding to pursue her interest in R&B and pop music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "armandwave"]}, {"n": 403, "title": "Autofiction", "artist": "Suede", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/507619-autofiction-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/507619-suede-autofiction.php", "aoty_critic_score": 81, "aoty_user_score": 75, "mbid": "6b52f005-c1ed-48fc-a914-21f7a598ad7e", "yt_id": "BU1xjEtDnBU", "rym": null, "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Suede, known as The London Suede in the United States, is an English rock band formed in London in 1989 by singer Brett Anderson, guitarist Justine Frischmann, and bassist Mat Osman. Drawing on glam rock and post-punk influences, the band gained early attention from the British music press and were labelled \"The Best New Band in Britain\" by Melody Maker in 1992. Their debut album, \"Suede\" (1993), reached number one on the UK Albums Chart, becoming the fastest-selling debut album in nearly a decade.", "desc_mb_album": "", "desc_mb_artist": "The band name, '''suede''', all song names and opus names have been consistently printed in lower case (before the release of Bloodsports)\r\n\r\nIn the USA, many of '''suede'''’s records were released under the “[https://musicbrainz.org/artist/a55c2f1b-3f3f-4d6a-aa30-5e186dbadce6/releases?filter.artist_credit_id=680351|the london suede]” artist name, due to a trademark‐related lawsuit.", "heard_by": []}, {"n": 404, "title": "Expert In A Dying Field", "artist": "The Beths", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/514703-expert-in-a-dying-field.jpg", "aoty_url": "https://www.albumoftheyear.org/album/514703-the-beths-expert-in-a-dying-field.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "5efba732-477d-4dbd-9389-db7441ddf233", "yt_id": "uYjuHVq_Kns", "rym": null, "genres": [], "desc_lfm_album": "Expert in a Dying Field is the New Zealand-based indie band The Beths’ third studio album, which was released on September 16, 2022. Its singles were “Expert in a Dying Field”, “Silence Is Golden” and “Knees Deep”. .", "desc_lfm_artist": "The Beths are a New Zealand indie rock/pop band, originally from Auckland, New Zealand that combines energized guitar riffs, melodic hooks, and harmonized backing vocals in their impulsive indie rock. Lead vocalist and guitarist Elizabeth Stokes met guitarist Jonathan Pearce and bassist Benjamin Sinclair while they were all in bands in high school. While playing underground gigs around Auckland, they befriended drummer Tristan Deck, who joined the group in 2019.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 405, "title": "April Mixtape 2", "artist": "Snow Strippers", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/547958-april-mixtape-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/547958-snow-strippers-april-mixtape-2.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "568a9ece-9067-425a-9b99-8e7981cb44b7", "yt_id": "0tgIrKqla8M", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Snow Strippers are an electronic music duo formed by Graham Perez and Tatiana Schwaninger based out of Detroit, Michigan. They released their debut project \"The Snow Strippers\" on their own label NiceBassBro on June 30th, 2022. Graham Perez is also Surf Gang affiliate DeliverTheCrush, where he has produced for the likes of SoFaygo, Yung Fazo and Safe Sin.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 406, "title": "I Love You Jennifer B", "artist": "Jockstrap", "year": 2022, "cover": "https://dn721606.ca.archive.org/0/items/mbid-8abb9383-4302-4134-8351-dc0c31bb85c7/mbid-8abb9383-4302-4134-8351-dc0c31bb85c7-34456352360.jpg", "aoty_url": "https://www.albumoftheyear.org/album/514732-jockstrap-i-love-you-jennifer-b.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "722e378e-a922-436a-b3ad-2419b27f971b", "yt_id": "YW05mNIiVps", "rym": "https://rateyourmusic.com/release/album/jockstrap/i-love-you-jennifer-b", "genres": ["electro", "synth-pop", "techno", "indie pop"], "desc_lfm_album": "I Love You Jennifer B is the debut studio album by British experimental pop band Jockstrap. It was released on September 9th, 2022 through Rough Trade Records and received critical acclaim. It debuted and peaked at number 57 in the UK Albums Chart. .", "desc_lfm_artist": "There is more than one artist with this name, including: \n1)  Jockstrap is a British electronic music duo comprising Georgia Ellery and Taylor Skye. \n2) Jockstrap is a Norwegian emopunk band from Oslo. \n3) Jockstrap was a British hardcore punk band from Liverpool. \n4) JockStrap is a Canadian noise/punk band from Toronto. \n\n1) Jockstrap is a British electronic music duo based in London. The duo's instigators  Georgia Ellery and Taylor Skye launched their 2018 debut mini-album Love is the Key to the City", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "armandwave", "verygooood"]}, {"n": 407, "title": "As Above, So Below", "artist": "Sampa the Great", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/520206-as-above-so-below.jpg", "aoty_url": "https://www.albumoftheyear.org/album/520206-sampa-the-great-as-above-so-below.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "97bc9081-881a-49ea-8004-d66955c3a55c", "yt_id": "dDubhAKSeB0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Sampa Tembo, known professionally as Sampa the Great, is a Zambian-born Australia-based rapper and songwriter. Her debut solo album, The Return, peaked at No. 12 on the ARIA Albums Chart. At the ARIA Music Awards of 2019 she won Best Hip Hop Release for her second single, \"Final Form\". In the following year she won the same category for The Return, as well as Best Female Artist and Best Independent Release.\n\nSampa Tembo was born in 1993 in Zambia and was raised there and in Botswana, as the middle of five children.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 408, "title": "Natural Brown Prom Queen", "artist": "Sudan Archives", "year": 2022, "cover": "https://ia601407.us.archive.org/35/items/mbid-cc5d852f-27fa-44dc-8b37-4530f6415aaa/mbid-cc5d852f-27fa-44dc-8b37-4530f6415aaa-33520807990.jpg", "aoty_url": "https://www.albumoftheyear.org/album/520463-sudan-archives-natural-brown-prom-queen.php", "aoty_critic_score": 82, "aoty_user_score": 80, "mbid": "b7cf92f5-a814-4e4c-9906-97a2af67f357", "yt_id": "7qDYWf753ok", "rym": "https://rateyourmusic.com/release/album/sudan-archives/natural-brown-prom-queen", "genres": ["art pop", "contemporary r&b", "hip hop", "experimental hip hop", "pop rap", "alternative r&b"], "desc_lfm_album": "Natural Brown Prom Queen is the second studio album by Sudan Archives, released on September 9, 2022. .", "desc_lfm_artist": "Brittney Denise Parks, better known as Sudan Archives, is a California-based violinist and vocalist, who writes, plays, and produces her own music. Drawing inspiration from the Sudanese fiddle, she is self-taught on the violin, and her unique songs also fold in elements of R&B, and experimental electronic music. \n\nParks grew up in Cincinnati, Ohio, US, where she \"messed around with instruments in the house\" and took up violin in the fourth grade, eventually teaching herself how to play the instrument by ear.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 409, "title": "MOTOMAMI +", "artist": "ROSALÍA", "year": 2022, "cover": "https://i.discogs.com/ncbqufQs_O3EjwVjMqyp5UAXeviiOj7TEKmTzHXs0oo/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTIyNTQ1/NDgyLTE3MzUyMzQ2/NTEtNTM5Ni5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/544033-rosalia-motomami.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "f455f658-dd55-4790-8cd3-99c7c273018a", "yt_id": "3pOM6up7uyw", "rym": null, "genres": [], "desc_lfm_album": "\"MOTOMAMI +\" is the deluxe edition of ROSALÍA's third studio album \"MOTOMAMI\". It was released on September 9th, 2022; following the release of the single \"DESPECHÁ\" while she was on tour promoting the album. It features previously unreleased tracks, it brings the total tracklist to 24 songs. .", "desc_lfm_artist": "Rosalia Vila Tobella, known mononymously as ROSALÍA is a Spanish singer and songwriter. Born and raised in the outskirts of Barcelona, she has been described as an \"untypical pop star\" due to her genre-bending musical styles. After being enthralled by Spanish folk music at age 13, she studied musicology at Catalonia College of Music while also performing at musical bars and weddings. She completed her studies with honors by virtue of her collaborative cover album with Raül Refree, Los Ángeles and the baccalaureate project El Mal Querer.", "desc_mb_album": "", "desc_mb_artist": "“ROSALÍA” and the titles from ''El Mal Querer'' are intended to be all uppercase, as [https://community.metabrainz.org/t/capitalization-issues-with-rosalia/403514/8|confirmed by her management and label].", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 410, "title": "The Forever Story", "artist": "JID", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/321056-the-forever-story-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/321056-jid-the-forever-story.php", "aoty_critic_score": 82, "aoty_user_score": 90, "mbid": "9817edbb-b1a1-419d-afab-b0ee3f214550", "yt_id": "ovQkVCCZ4VA", "rym": "https://rateyourmusic.com/release/album/jid/the-forever-story", "genres": ["Hip-Hop"], "desc_lfm_album": "The Forever Story is JID’s third studio album, following his critically-acclaimed 2018 sophomore album DiCaprio 2 and serves as the prequel to his debut 2017 album, The Never Story. JID first gave word of this project on August 27, 2019 in a series of tweets hinting to October as a release for new music. He said that he was “depressed,” leading him to want to drop some new music. After about two and a half years of obscurity regarding the project, “Surround Sound” was released on January 14, 2022, where he collaborated with fellow Atlanta artists 21 Savage and Baby Tate. .", "desc_lfm_artist": "Destin Route (b. October 31, 1990), better known by the stage name JID, is an American rapper from Zone 6, Atlanta, Georgia. He describes himself as “a soft-spoken but intricate lyricist with a cocky side.” His stage name originates from “jittery,” his grandmother’s nickname for him due to his sporadic behavior as a child.\n\nHe first appeared on the Atlanta hip-hop scene with his debut EP, DiCaprio, in 2015. Growing up, JID's first connection with music was through his parents' collection of classic funk and soul LPs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 411, "title": "PRE PLEASURE", "artist": "Julia Jacklin", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/503405-pre-pleasure.jpg", "aoty_url": "https://www.albumoftheyear.org/album/503405-julia-jacklin-pre-pleasure.php", "aoty_critic_score": 83, "aoty_user_score": 77, "mbid": "fe36198d-c1e6-4b63-8170-2541d8c28550", "yt_id": "4D6buHQYhUI", "rym": null, "genres": [], "desc_lfm_album": "PRE PLEASURE is the Australian singer-songwriter Julia Jacklin’s third studio album released on August 26, 2022 via Polyvinyl Records. Julia Jacklin recorded the album in Montreal, Canada after finishing up a world tour supporting her 2019 album Crushing. The album’s singles were “Lydia Wears A Cross”, “I Was Neon”, “Love, Try Not To Let Go” and “Be Careful With Yourself”. The album hit #25 on the Canadian Album Sales chart, #22 on the Top Current Album Sales chart, #25 on the Top Album Sales chart, #5 on the Heartseekers chart and #9 on the Vinyl Album chart. .", "desc_lfm_artist": "Julia Jacklin (born 30 August 1990) is an Australian singer-songwriter based in Sydney. Her seamless meld of dreamy indie pop and confessional alt-country invokes names like Angel Olsen, Sharon Van Etten, and Caitlin Rose, Julia Jacklin was raised in a family of educators in the Blue Mountains of New South Wales. Upon discovering Britney Spears at the age of ten, and eventually Avril Lavigne and Evanescence in high school, Jacklin decided to shift her focus from a future social work to a career in music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 412, "title": "All of Us Flames", "artist": "Ezra Furman", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/503427-all-of-us-flames.jpg", "aoty_url": "https://www.albumoftheyear.org/album/503427-ezra-furman-all-of-us-flames.php", "aoty_critic_score": 81, "aoty_user_score": 72, "mbid": "3eb80414-3aa5-40cb-b132-3b0612c2c8c3", "yt_id": "sqUTcb368kM", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ezra Furman is a singer and songwriter from Chicago, Illinois. It is difficult to peg her as part of a single musical genre because she loves to experiment with different styles of songwriting. Suffice it to say that Ezra makes up songs and plays them on her acoustic guitar with ferocious energy and gut wrenching sincerity. Her music is derivative of, but never completely part of, a number of musical genres: rock, blues, punk, folk and pop are some prime examples.", "desc_mb_album": "", "desc_mb_artist": "'''Gender''': female\n'''Pronouns''': She / They\n'''Sexuality''': bisexual", "heard_by": []}, {"n": 413, "title": "Everything I Know About Love", "artist": "Laufey", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/529980-everything-i-know-about-love.jpg", "aoty_url": "https://www.albumoftheyear.org/album/529980-laufey-everything-i-know-about-love.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "53dab9a8-4fc7-45f9-b667-79da8bb85a71", "yt_id": "fhxWHyPXDd4", "rym": "https://rateyourmusic.com/release/album/laufey/everything-i-know-about-love", "genres": [], "desc_lfm_album": "Everything I Know About Love is the debut album by Icelandic-Chinese artist Laufey, and was released on August 26, 2022 by Laufey and AWAL. Featuring the singles, \"Everything I Know About Love\" and \"Fragile\", the album follows her debut EP, Typical of Me, and a string of standalone singles. “It’s about dealing with growing-up. It’s also very ‘hopeless romantic'. All the songs are based on my personal experiences in the past years, but the way I write about them is like fiction. A lot of these things that we go through in life are a little difficult or bleak, and .", "desc_lfm_artist": "Laufey Lín Bing Jónsdóttir is an Icelandic singer-songwriter. She spent much of her childhood traveling between Reykjavík and Washington, DC, where she learned to speak English with barely a trace of an accent. Inspired in part by her mother, a classical violinist, she took up piano and cello early on, but it was her father’s collection of Ella Fitzgerald and Billie Holiday albums that spoke to her on a deeper level.\n\n“I’m definitely very influenced by composers like Ravel and Chopin", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 414, "title": "Heartmind", "artist": "Cass McCombs", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/512808-heartmind.jpg", "aoty_url": "https://www.albumoftheyear.org/album/512808-cass-mccombs-heartmind.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "2a9f76f5-d336-43e3-ab36-17f84baad835", "yt_id": "fgF8LSZA-b4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Cass McCombs (born in Concord, California in 1977) is an American singer-songwriter and performer.\n\nAn enigmatic folk nomad, McCombs is a quintessentially American artist; \"he's quietly become one of (the country's) finest chroniclers of fringe characters, a writer of heart-rending love songs and psychedelic odes to the natural world, a teller of tall-tales with a sense of humor dry as desert wood, and that rare folksinger who actually sings about the folk.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 415, "title": "Cheat Codes", "artist": "Black Thought & Danger Mouse", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/293442-cheat-codes.jpg", "aoty_url": "https://www.albumoftheyear.org/album/293442-black-thought-danger-mouse-cheat-codes.php", "aoty_critic_score": 84, "aoty_user_score": 86, "mbid": null, "yt_id": "Rx3p3d0drTE", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 416, "title": "heartpacing", "artist": "jaydes", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/551729-heartpacing.jpg", "aoty_url": "https://www.albumoftheyear.org/album/551729-jaydes-heartpacing.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "93d5ccdc-391d-461c-b993-c9db719754f1", "yt_id": "uLR-t16OKN8", "rym": null, "genres": [], "desc_lfm_album": "heartpacing is a studio EP by American recording artist jaydes. It was released on August 14, 2022. The EP contains 9 tracks and features from Rich Amiri and Riovaz. .", "desc_lfm_artist": "Jayden Yen Dumont, better known by his stage name Jaydes (formerly Evvls), is an American rapper, producer, and songwriter from Pompano Beach, Florida. Born on February 24, 2006, he grew up with a passion for music and started producing beats and writing songs at a young age.\n\nJaydes first gained attention in the music industry for his work with notable artists such as 800pts and Glumboy. His unique sound, which blends elements of hip-hop, R&B, and electronic music", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 417, "title": "God's Country", "artist": "Chat Pile", "year": 2022, "cover": "https://dn710109.ca.archive.org/0/items/mbid-79517f7a-3219-4b44-8b9b-312f97c49fdd/mbid-79517f7a-3219-4b44-8b9b-312f97c49fdd-33185469465.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "dc5482e8-24e5-4f23-b982-3070060f22ae", "yt_id": "E0YQ2F_ejnY", "rym": "https://rateyourmusic.com/release/album/chat-pile/gods-country", "genres": ["noise rock", "post-punk", "metal", "post-hardcore", "industrial metal", "pigfuck"], "desc_lfm_album": "God's Country is the debut studio album by American sludge metal band Chat Pile. The album was released on July 29, 2022 through The Flenser Records. The album peaked at No. 21 on the Apple Music Chart and was tagged as a \"Best New Music\" album by Pitchfork. .", "desc_lfm_artist": "Chat Pile is a sludgy noise rock band from Oklahoma, formed in February of 2019. The band members are Raygun Busch (vocals), Luther Manhole (Guitars), Stin (Bass), and Captain Ron (Drums).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 418, "title": "RENAISSANCE", "artist": "Beyoncé", "year": 2022, "cover": "https://ia801506.us.archive.org/22/items/mbid-dfb0eb62-e729-4fc3-b198-c50283d9ed17/mbid-dfb0eb62-e729-4fc3-b198-c50283d9ed17-33083332053.jpg", "aoty_url": "https://www.albumoftheyear.org/album/515536-beyonce-renaissance.php", "aoty_critic_score": 87, "aoty_user_score": 85, "mbid": "2c385052-5083-43a2-b1e5-36566d2ae3c0", "yt_id": "zPtbxFjZgLc", "rym": null, "genres": ["r&b", "contemporary r&b", "dance-pop", "house", "hip house", "afro house"], "desc_lfm_album": "RENAISSANCE is the seventh studio album by Beyoncé, released on July 29, 2022, via Parkwood Entertainment and Columbia Records. It is her first solo studio release since Lemonade and serves as the first installment of a trilogy project. Beam, Grace Jones and Tems appear as guest vocalists. Beyoncé conceived and recorded Renaissance during the COVID-19 pandemic, seeking to inspire joy and escapism in listeners who had experienced isolation and to celebrate a club era in which marginalized people sought liberation through dance music. With its songs seamlessly arranged like a DJ mix, the album blends post-1970s Black dance music styles .", "desc_lfm_artist": "Beyoncé Giselle Knowles-Carter  (born September 4, 1981 in Houston, Texas, USA) is an American singer, songwriter, businesswoman, and actress. Beyoncé performed in various singing and dancing competitions as a child and rose to fame in the late 1990s as the lead singer of Destiny's Child, one of the best-selling girl groups of all time. Beyoncé herself is the best-selling black female musician of all time and second best-selling female artist of all time, behind only Madonna.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "alberto_gu"]}, {"n": 419, "title": "アイランド [Island]", "artist": "明日の叙景 [Asunojokei]", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/530027-island.jpg", "aoty_url": "https://www.albumoftheyear.org/album/530027--asunojokei--island.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": null, "yt_id": "9oja9xbDxTo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "明日の叙景 (Asunojokei, \"Scenery of Tomorrow\") is a Japanese post-black metal/blackgaze band formed in Taitō in 2014.\n\nThe band was formed by vocalist Daiki Nuno, guitarist Kei Toriki, bassist Takuya Seki and drummer Saitō in Taitō City in 2014. A few months after the group's formation they released a two-track demo which can be downloaded for free at the band's Bandcamp profile.\n\nIn 2016, the group released their first EP A Bird in the Fault independently.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 420, "title": "Guitar Songs", "artist": "Billie Eilish", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/527956-guitar-songs.jpg", "aoty_url": "https://www.albumoftheyear.org/album/527956-billie-eilish-guitar-songs.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "9e29849f-8da8-4e3c-8287-9d86dda6fbf3", "yt_id": "D7qvIjSXbgo", "rym": null, "genres": [], "desc_lfm_album": "Guitar Songs is the second EP by American singer-songwriter Billie Eilish, released on July 21, 2022, through Darkroom and Interscope Records. The project's release came as a surprise, a decision that she made because she wanted to share new music to her fans as soon as she could. The EP contains two tracks that she considered including for her third one but decided not to due to the lyrics' immediacy. .", "desc_lfm_artist": "Billie Eilish Pirate Baird O'Connell (born December 18, 2001), known professionally as Billie Eilish, is a Grammy and Academy Award-winning American singer and songwriter signed to Darkroom/Interscope Records.\n\nBorn and raised in Los Angeles, Eilish grew up in a household of actors and musicians and was homeschooled along with her brother Finneas O'Connell. At the age of eight, she joined the Los Angeles Children's Choir, developing the soulful vocals that would later appear on her early singles.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84"]}, {"n": 421, "title": "There Will Be No Super-Slave", "artist": "Ghais Guevara", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/499894-there-will-be-no-super-slave.jpg", "aoty_url": "https://www.albumoftheyear.org/album/499894-ghais-guevara-there-will-be-no-super-slave.php", "aoty_critic_score": 79, "aoty_user_score": 81, "mbid": "2bbadf3c-7f71-4e27-9a5a-ea8ad95c0c57", "yt_id": "y-HohwKn3b8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ghais Guevara (born Jaja Gha'is Robinson on October 9th, 2000) is a rapper and producer based in Philadelphia, Pennsylvania. He formerly went by the name Jaja00.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 422, "title": "the now now and never", "artist": "what is your name?", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/542242-the-now-now-and-never.jpg", "aoty_url": "https://www.albumoftheyear.org/album/542242-what-is-your-name-the-now-now-and-never.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "1d097b4e-a75e-413e-833d-14d2273d8314", "yt_id": "4QhcxRS1kI8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "what is your name? is a shoegaze project made by the same person as the breakcore project 2 0 2 1, from Toronto, Canada", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo"]}, {"n": 423, "title": "Hellfire", "artist": "black midi", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/502843-hellfire_090504.jpg", "aoty_url": "https://www.albumoftheyear.org/album/502843-black-midi-hellfire.php", "aoty_critic_score": 82, "aoty_user_score": 87, "mbid": "d9ca78a8-e6d1-442c-bad1-4e5f26542111", "yt_id": "Efmq_uXt1Rk", "rym": "https://rateyourmusic.com/release/album/black-midi/hellfire", "genres": [], "desc_lfm_album": "\"Hellfire\" is the third and final studio album by English rock/post-punk band black midi, released on 15 July 2022 through Rough Trade Records. Produced by Marta Salogni, who had previously worked with the band in recording the song \"John L\" from their second studio album, the album was preceded by the singles \"Welcome to Hell\", \"Eat Men Eat\", and “Sugar/Tzu”. \"Hellfire\" was written while the band was isolating in London, with singer Geordie Greep calling \"Hellfire\" \"an epic action film if \"Cavalcade\" was a drama\". He described the characters depicted in the album as being \"scumbag. Almost everything I write .", "desc_lfm_artist": "black midi was an English experimental rock band from London comprising Morgan Simpson (drums), Cameron Picton (bass/vocals), and Geordie Greep (guitar/vocals). Between 2017 and 2020, the band also included guitarist Matt Kwasniewski-Kelvin. \n\nThey began gaining popularity through touring across Europe, their breakthrough into the U.S. and a number of videos of live performances being posted online. In early 2019, the band released two singles along", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "sdecandelario"]}, {"n": 424, "title": "Hostile Architecture", "artist": "Ashenspire", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/526216-hostile-architecture.jpg", "aoty_url": "https://www.albumoftheyear.org/album/526216-ashenspire-hostile-architecture.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "8b61e906-e2b0-464c-8b3c-316c1d86e907", "yt_id": "e9v8Pk_baEU", "rym": "https://rateyourmusic.com/release/album/ashenspire/hostile-architecture", "genres": ["Metal"], "desc_lfm_album": "‘HOSTILE ARCHITECTURE is a sonic exploration of the ways that subjects under late capitalism are constrained and set in motion via the various structures that uphold stratification and oppression in urban contexts. It is inspired by brutalist, postmodern and utilitarian architectural structures that are found throughout post-industrial cities, hauntological in nature, being designed to provide for the populace through affordable housing but ultimately cost-cutting exercises and unfit for purpose. The term hostile architecture refers to design elements in social spaces that deter the public from using the object for means unintended by the designer, e.g. anti-homeless spikes, which the album .", "desc_lfm_artist": "Ashenspire is a progressive black metal / black theatrical metal from Glasgow, UK.\nAlasdair Dunn - Drums, Sprechgesang\nFraser Gordon - Guitars\nJames Johnson - Violin\nScott McLean - Bass", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 425, "title": "Sound of the Morning", "artist": "Katy J Pearson", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/487872-sound-of-the-morning.jpg", "aoty_url": "https://www.albumoftheyear.org/album/487872-katy-j-pearson-sound-of-the-morning.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "ec10bd7c-1058-4cad-8557-594bfde82d24", "yt_id": "GRA1BT6zsP8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Katy J Pearson is a British singer-songwriter based in Bristol. \n\nBiography\n\nBristol-based singer/songwriter Katy J Pearson lends her radiant, high-tremolo vocals to country-tinged, 1970s-influenced songs that often share an affectionate, breezy feel. Her debut album, Return, appeared in 2020. Two years later, Sound of the Morning found her diversifying her sound with grittier input from Speedy Wunderground founder Dan Carey on select tracks.\n\nHailing from Gloucestershire", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 426, "title": "Cave World", "artist": "Viagra Boys", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/495835-cave-world.jpg", "aoty_url": "https://www.albumoftheyear.org/album/495835-viagra-boys-cave-world.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "bed07eb0-f5b6-4e42-b6b8-c2416b86cbfc", "yt_id": "nzVTxAZrwdQ", "rym": "https://rateyourmusic.com/release/album/viagra-boys/cave-world", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Viagra Boys is a Swedish post-punk band formed in Stockholm in 2015. The group consists of lead singer Sebastian Murphy, guitarist Linus Hillborg, keyboardist Elias Jungqvist, bassist Henrik \"Benke\" Höckert, drummer Tor Sjödén, and saxophonist Oskar Carls. Their lyrics often employ satire and dark humor to critique hypermasculinity and far-right conspiracy theories.\n\nFull Wikipedia article: https://en.wikipedia.org/wiki/Viagra_Boys\n\nStudio albums\nStreet Worms (2018)\nWelfare Jazz (2021)\nCave World (2022)\nViagr Aboys (2025)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu", "paqueradejere", "sdecandelario"]}, {"n": 427, "title": "MUNA", "artist": "MUNA", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/481628-muna.jpg", "aoty_url": "https://www.albumoftheyear.org/album/481628-muna-muna.php", "aoty_critic_score": 83, "aoty_user_score": 74, "mbid": "ba73f52e-18db-4010-bb67-719ee1062da1", "yt_id": "ISlZNU6WWFo", "rym": null, "genres": [], "desc_lfm_album": "There is more than one album with this name, including: 1) MUNA is the self-titled, third studio album by American indie pop band MUNA. It was released on June 24th, 2022 by Saddest Factory Records, Phoebe Bridgers' record label. It was preceded by the singles 'Silk Chiffon' featuring Bridgers, 'Anything But Me', 'Kind of Girl', and 'Home by Now'. 2) Muna is the self-titled album by Italian garage rock band Muna. It was released on 24 June 2022. .", "desc_lfm_artist": "MUNA is a dark pop band based in Los Angeles, CA blending the brooding sensuality of R&B, rhythms of funk, and audacity of synthpop with raw, unbridled lyricism. MUNA was founded by Katie Gavin (she/they), Josette Maskin (she/they), and  Naomi McPherson (they/them). They hope their songs lend themselves both to the euphoric dancefoor and emo bedroom solitude.\n\nThe trio has released three albums together. Their first album, About U, was released on February 3", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 428, "title": "Sometimes, Forever", "artist": "Soccer Mommy", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/485059-sometimes-forever.jpg", "aoty_url": "https://www.albumoftheyear.org/album/485059-soccer-mommy-sometimes-forever.php", "aoty_critic_score": 81, "aoty_user_score": 75, "mbid": "87df703b-d824-4766-b0b1-961674db2430", "yt_id": "CS6tsf4ljNU", "rym": null, "genres": [], "desc_lfm_album": "\"Sometimes, Forever\" is the third studio album by American singer-songwriter Soccer Mommy. It was released under Loma Vista Recordings on June 24, 2022 supported by the singles \"Shotgun\", \"Unholy Affliction\", \"Bones\", and \"newdemo\". American experimental electronic music producer Daniel Lopatin, better known as his recording alias Oneohtrix Point Never, produced the album. The album reached number 137 on the US Billboard Top 200 chart. It also charted at number 95 on the UK Albums chart, number 14 on the Scottish Albums chart, number 7 on the Australian Hitseekers Albums chart and number 32 on the Australian Digital Albums chart. .", "desc_lfm_artist": "Sophie Allison, better known by her stage name Soccer Mommy, is an American singer-songwriter and musician from Nashville, Tennessee.\nAllison was born in Switzerland and grew up in Nashville, Tennessee. She attended Nashville School of the Arts, a speciality high school where she studied guitar and played in the swing band.\nShe first picked up a guitar at age six, which prompted her to start making music. She began posting home-recorded songs to Bandcamp as Soccer Mommy in 2015", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere"]}, {"n": 429, "title": "Bad Therapists", "artist": "Willy Rodriguez", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/646709-bad-therapists_2112.jpg", "aoty_url": "https://www.albumoftheyear.org/album/646709-willy-rodriguez-bad-therapists.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": null, "yt_id": "Fu0b9nUe3So", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 430, "title": "Neon White OST 1 - The Wicked Heart", "artist": "Machine Girl", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/515789-neon-white-ost-1-the-wicked-heart_143925.jpg", "aoty_url": "https://www.albumoftheyear.org/album/515789-machine-girl-neon-white-ost-1-the-wicked-heart.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": null, "yt_id": "EHULqZ1umUo", "rym": null, "genres": ["Electronic", "Punk"], "desc_lfm_album": "", "desc_lfm_artist": "Machine Girl is an American electronic music project created in 2012 by Matt Stephenson on Long Island, New York. In 2015, the project became a duo, with Stephenson recruiting percussionist Sean Kelly to play live drums. The project derives its name from the 2008 Japanese film The Machine Girl and has occasionally incorporated samples from the film into their work, notably in their 2014 debut studio album, WLFGRL.\n\nMachine Girl, as described by its creator, is a genre-defying musical project characterized as \"fucked-up electronic punk\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 431, "title": "Ctrl (Deluxe)", "artist": "SZA", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/512775-ctrl-deluxe.jpg", "aoty_url": "https://www.albumoftheyear.org/album/512775-sza-ctrl-deluxe.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": null, "yt_id": "uWC1Ub5QwfU", "rym": null, "genres": [], "desc_lfm_album": "\"Ctrl (Deluxe)\" is the deluxe version to the debut studio album \"Ctrl \" by American singer and songwriter SZA, and features guest appearances from Kendrick Lamar, Travis Scott, Isaiah Rashad and James Fauntleroy. The deluxe album was released on June 9, 2022, exactly 5 years after the initial release of \"Ctrl\", and features 7 bonus tracks. \"Ctrl\" received widespread critical acclaim upon its release, with many praising SZA's distinctive and soulful voice, as well as her introspective and confessional lyrics. The album was praised for its honesty and vulnerability, and for its exploration of themes such as love, heartbreak, and .", "desc_lfm_artist": "Solána Imani Rowe, known professionally as SZA, is an American singer and songwriter. She was born in St. Louis, Missouri but raised in Maplewood, New Jersey. She self-released her debut EP, See.SZA.Run in October 2012. \n\nIn April 2013, SZA released her S EP to good critical reviews— in July of that same year, it was announced she was signed to Top Dawg Entertainment and began working on her Z EP, which would eventually become a full-fledged album. Z was released in April 2014.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 432, "title": "Big Time", "artist": "Angel Olsen", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/487215-big-time.jpg", "aoty_url": "https://www.albumoftheyear.org/album/487215-angel-olsen-big-time.php", "aoty_critic_score": 85, "aoty_user_score": 78, "mbid": "c66ca7b3-aad2-41e9-9826-b2675fe21545", "yt_id": "rQKM108fhJI", "rym": "https://rateyourmusic.com/release/album/angel-olsen/big-time", "genres": [], "desc_lfm_album": "Big Time is the sixth full-length studio album by American singer-songwriter Angel Olsen, released on June 3rd 2022 by Jagjaguwar. According to the album’s announcement, Big Time was written during a period of time when Olsen was coming out as queer. “Some experiences just make you feel as though you’re 5 years old, no matter how wise or adult you think you are,” Olsen said in a statement about coming out to her parents around that time. “Finally, at the ripe age of 34, I was free to be me.” Both of her parents died just before she began recording .", "desc_lfm_artist": "Angel Olsen (born January 22, 1987) is an American singer-songwriter and musician from St. Louis, Missouri[4][5] who currently lives in Asheville, North Carolina. She has recorded and toured as a backing singer with Bonnie 'Prince' Billy & The Cairo Gang, before embarking on her own career. \n\nTo date, Olsen has released six studio albums:  Half Way Home (2012), Burn Your Fire for No Witness (2014), My Woman (2016), All Mirrors (2019), Whole New Mess (2020) and Big Time (2022).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 433, "title": "Heart Under", "artist": "Just Mustard", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/473415-heart-under.jpg", "aoty_url": "https://www.albumoftheyear.org/album/473415-just-mustard-heart-under.php", "aoty_critic_score": 85, "aoty_user_score": 75, "mbid": "e2169093-28bf-45dc-b490-95321a5833d3", "yt_id": "g9wMS0mTSn0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Comprised of vocalist Katie Ball, guitarists David Noonan (also backing vocals) and Mete Kalyon, bassist Rob Clarke and drummer Shane Maguire, Just Mustard have been steadily building a reputation as one of Ireland’s most thrilling new bands – live and on record – since forming in 2016.\nThe Dundalk band’s heady blend of noise, trip hop and electronic influenced music earned their debut album ‘Wednesday’ huge acclaim in their native Ireland in 2018 – including a Choice Music Prize nomination for Irish Album of the Year.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Rocky_stereo", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 434, "title": "Cruel Country", "artist": "Wilco", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/498904-cruel-country.jpg", "aoty_url": "https://www.albumoftheyear.org/album/498904-wilco-cruel-country.php", "aoty_critic_score": 80, "aoty_user_score": 69, "mbid": "e03fbefb-4b8f-4c14-974d-5e93d8a71f8c", "yt_id": "STLCrfx3N_0", "rym": null, "genres": [], "desc_lfm_album": "Cruel Country is the twelfth studio album by Wilco, released on May 27, 2022. It features twenty-one songs written by frontman Jeff Tweedy. The double album consists primarily of live takes recorded at The Loft, the band's recording studio in Chicago. The sessions included all six Wilco members together in The Loft for the first time since The Whole Love (2011). With minimal overdubbing, Tweedy compared their recording approach on Cruel Country to that which they last employed on Sky Blue Sky (2007). The album sees the band fully embracing their country music leanings. In a letter published upon the .", "desc_lfm_artist": "Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 435, "title": "Silly Love Songs For Unfortunate Breakups", "artist": "Willy Rodriguez", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/514347-silly-love-songs-for-unfortunate-breakups.jpg", "aoty_url": "https://www.albumoftheyear.org/album/514347-willy-rodriguez-silly-love-songs-for-unfortunate-breakups.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": null, "yt_id": "SMl9IAdXNi8", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 436, "title": "Dariacore 3​.​.​. At least I think that's what it's called?", "artist": "leroy", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/507474-dariacore-3-at-least-i-think-thats-what-its-called.jpg", "aoty_url": "https://www.albumoftheyear.org/album/507474-leroy-dariacore-3-at-least-i-think-thats-what-its-called.php", "aoty_critic_score": 82, "aoty_user_ can singer-songwriter from the Bronx, New York, after they had moved to New Orleans in 2007.\n\nAfter leaving home at an early age to travel the country, Segarra eventually settled in New Orleans where they began to perform and record with a revolving cast of musicians.  They released two records (2008's It Don't Mean I Don't Love You and 2010's Young Blood Blues) mostly consisting of delicate folk and country songs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 470, "title": "Once Twice Melody", "artist": "Beach House", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/435719-once-twice-melody.jpg", "aoty_url": "https://www.albumoftheyear.org/album/435719-beach-house-once-twice-melody.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "0609eab3-6dc1-4cd7-b1c3-d5c87a5c2133", "yt_id": "mGVq-3Kye48", "rym": "https://rateyourmusic.com/release/album/beach-house/once-twice-melody/", "genres": [], "desc_lfm_album": "\"Once Twice Melody\" is the eighth studio album by Beach House. It was released in four chapters starting November 10, 2021, with the entire album being released in full on February 18, 2022, through Sub Pop Records. A follow-up of their seventh studio album 7 (2018), they began recording the album in 2018 at their home studio, Apple Orchard Studio, in Baltimore, with additional recording taking place at Pachyderm Studio, United Studio and Village Recorders until July 2021. It is the first album to be produced soley and entirely by the band. The album was mostly mixed by Alan Moulder .", "desc_lfm_artist": "Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "alberto_gu", "paqueradejere"]}, {"n": 471, "title": "Lucifer on the Sofa", "artist": "Spoon", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/431199-lucifer-on-the-sofa.jpg", "aoty_url": "https://www.albumoftheyear.org/album/431199-spoon-lucifer-on-the-sofa.php", "aoty_critic_score": 82, "aoty_user_score": 74, "mbid": "0ea1a9de-547e-4317-a747-f7b2ffb54274", "yt_id": "U4wjQljPxkg", "rym": null, "genres": [], "desc_lfm_album": "Lucifer on the Sofa is the tenth studio album by Spoon, released on February 11, 2022, through Matador Records. Recording sessions began in late 2019 and took place in studios between Austin, Texas, and Los Angeles, California. They primarily recorded the album with Mark Rankin, with Justin Raisen and Dave Fridmann, the latter of whom co-produced the band's previous two albums, each producing one song. Recording sessions continued until March 2020 but had to be postponed after the COVID-19 pandemic began severely impacting the United States. After completing the album in 2021, the band released the album's lead single, \"The .", "desc_lfm_artist": "Spoon is an American indie rock band from Austin, Texas. The band was formed in late 1993 by lead singer/guitarist Britt Daniel and drummer Jim Eno. Current members also include: Eric Harvey (keyboard, guitar, percussion, backing vocals) and Rob Pope (bass, backing vocals - replaced Joshua Zarbo in 2007).\nAfter releasing their debut LP Telephono on Matador Records, the band signed with Elektra in 1998, but the contract was dropped soon after the band released A Series of Sneaks.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "armandwave", "sdecandelario"]}, {"n": 472, "title": "Dragon New Warm Mountain I Believe In You", "artist": "Big Thief", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/435870-dragon-new-warm-mountain-i-believe-in-you-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/435870-big-thief-dragon-new-warm-mountain-i-believe-in-you.php", "aoty_critic_score": 86, "aoty_user_score": 86, "mbid": "d705a3ed-be7a-459c-ac74-58cddaf98576", "yt_id": "5xi0K83fnnA", "rym": null, "genres": [], "desc_lfm_album": "Like its title suggests, Dragon New Warm Mountain I Believe in You continues Big Thief’s shift away from their tense, early music toward something folkier and more cosmically inviting. They’ve always had an interest in Americana, but their touchpoints are warmer now: A sweetly sawing fiddle Spud Infinity , a front-porch lullaby Dried Roses, the wonder of a walk in the woods Promise Is a Pendulum , or comfort of a kitchen where the radio’s on and food sizzles in the pan Red Moon. Adrianne Lenker’s voice still conveys a natural reticence—she doesn’t want to believe it’s all as beautiful .", "desc_lfm_artist": "Big Thief is an American indie rock band with folk roots. The band is based in Brooklyn, New York, and comprises Adrianne Lenker, Buck Meek, and James Krivchenia.\nBig Thief's music, rooted in the songs of Adrianne Lenker, paints in vivid tones \"the process of harnessing pain, loss, and love, while simultaneously letting go, looking into your own eyes through someone else's, and being okay with the inevitability of death,\" says Adrianne.\n\n Masterpiece", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 473, "title": "Pompeii", "artist": "Cate Le Bon", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/424944-pompeii.jpg", "aoty_url": "https://www.albumoftheyear.org/album/424944-cate-le-bon-pompeii.php", "aoty_critic_score": 83, "aoty_user_score": 71, "mbid": "6aa59603-9427-4519-926d-f62fdf145447", "yt_id": "-xLGHpcRINA", "rym": null, "genres": [], "desc_lfm_album": "Pompeii is the sixth studio album by Cate Le Bon. It was released on February 4, 2022. .", "desc_lfm_artist": "Cate Le Bon (born Cate Timothy on 4 March 1983) is a Welsh singer-songwriter, now based in Los Angeles. She sings in both English and Welsh. She has released seven solo albums, three EPs and a number of singles. Le Bon is also known for her collaborations with among others Manic Street Preachers, Neon Neon, and Matt Davies.\n\nLe Bon is singled out by critics for her \"beautiful, haunting voice\". She described writing and performing music as \"important to me, it's just an expression and sometimes it's not necessary to moralise it\".", "desc_mb_album": "", "desc_mb_artist": "IPI code '''00548526231''' for '''''CATE LE BON'''''\r\nIPI code '''00548526133''' for '''''CATE TIMOTHY'''''", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 474, "title": "Ants From Up There", "artist": "Black Country, New Road", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/424961-ants-from-up-there.jpg", "aoty_url": "https://www.albumoftheyear.org/album/424961-black-country-new-road-ants-from-up-there.php", "aoty_critic_score": 88, "aoty_user_score": 90, "mbid": "d622ed70-ccc3-4658-8a0a-b7a2d577c28d", "yt_id": "MIJjiW_aAFQ", "rym": "https://rateyourmusic.com/release/album/black-country-new-road/ants-from-up-there-1", "genres": [], "desc_lfm_album": "Ants From Up There is the second studio album by British rock band Black Country, New Road, released on 4 February 2022 on Ninja Tune. Recorded at Chale Abbey on the Isle of Wight, the album was produced by the band's live sound engineer Sergio Maschetzko, and is the final album to feature lead vocalist and guitarist Isaac Wood, who announced his departure from the band on 31 January 2022, four days prior to the album's release. Written during COVID-19 lockdowns and road-tested during brief touring stints in support of their debut album \"For the first time\", the album was .", "desc_lfm_artist": "Black Country, New Road (commonly abbreviated to BCNR or BC,NR) is an adian singer-songwriter The Weeknd that was released on the 7th of January, 2022 by XO and Republic Records. The album was preceded by the lead single Take My Breath, which peaked at number six on the US Billboard Hot 100. Intended to serve as a direct follow-up to his fourth studio album After Hours, Dawn FM features guest appearances from Jim Carrey, Tyler, the Creator and Lil Wayne. The album, which is primarily produced by the Weeknd, features additional contributions from Max Martin, Oscar Holter, Swedish House Mafia, Quincy Jones, and Oneohtrix .", "desc_lfm_artist": "Abel Makkonen Tesfaye, popularly known as The Weeknd (born February 16, 1990 in Toronto, Ontario, Canada), is a Canadian R&B/hip-hop musician, singer-songwriter and record producer. He chose his stage name in tribute to when he was 17 years old, when, along with his friend La Mar Taylor, he dropped out of high school, took his mattress, and \"left one weekend and never came home\". However, his estranged former producer Jeremy Rose claims the name was his idea.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 482, "title": "Mann Beisst Hund", "artist": "OG Keemo", "year": 2022, "cover": "https://cdn2.albumoftheyear.org/600x0/album/454709-mann-beisst-hund.jpg", "aoty_url": "https://www.albumoftheyear.org/album/454709-og-keemo-mann-beisst-hund.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "ec879320-d2d0-4331-a9ca-fb3fed5c59a6", "yt_id": "Urm1wxex9u4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Karim Joel Martin was born in Mainz to a Sudanese father. After his parents separated, he first moved to Bayreuth with his mother and younger sister. He later lived in Heidelberg, Mannheim and again in Mainz before finally settling in Mannheim.\n\nWith his friends Funkvater Frank, Biño, Inu and Mo, he founded the Zonkeymobb group and published his first
