org/600x0/album/336438-promises.jpg", "aoty_url": "https://www.albumoftheyear.org/album/336438-floating-points-pharoah-sanders-the-london-symphony-orchestra-promises.php", "aoty_critic_score": 88, "aoty_user_score": 86, "mbid": "970f689d-1778-4953-b3ed-48d057625724", "yt_id": "Mn8x0QbN4f8", "rym": null, "genres": [], "desc_lfm_album": "Promises is a studio album by Floating Points, Pharoah Sanders and the London Symphony Orchestra. It was released on March 26, 2021, through the New York label Luaka Bop. Sam Shepherd, a British DJ, musician and producer, has produced numerous projects in the field of electronic music under the name Floating Points. The previous Floating Points album, Crush, was released in 2019. For Pharoah Sanders, Promises was the only studio album he released in over a decade, before his death the next year. Sanders became aware of Shepherd's work in 2015 when he was impressed by the debut Floating Points .", "desc_lfm_artist": "Floating Points, Pharoah Sanders and The London Symphony Orchestra recorded and released the album Promises together in 2021 on Luaka Bop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 576, "title": "HARAM", "artist": "Armand Hammer & The Alchemist", "year": 2021, "cover": "https://i.discogs.com/cru6rT0aPbB8CKx1fMSsh7bsRLGgQtmVAB8khvrGfx4/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE4MDg0/Njc5LTE2MTcyMjYx/NDktNjkzNi5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/339255-armand-hammer-the-alchemist-haram.php", "aoty_critic_score": 82, "aoty_user_score": 80, "mbid": "a51b1ed7-ca58-4fbb-8f8f-59d008a4eb76", "yt_id": "Fb_MR_o7lEM", "rym": null, "genres": [], "desc_lfm_album": "Haram is a collaborative album from New York rap duo Armand Hammer (made up of billy woods and E L U C I D) and legendary Los Angeles producer The Alchemist. The project boasts features from KAYANA, FIELDED, Earl Sweatshirt, Curly Castro, Amani, and Quelle Chris. The entire album is produced solely by The Alchemist, with the exception of “God’s Feet,” which is co-produced with Earl Sweatshirt. In the Islamic religion, “Haram” is a term used to refer to any act that is forbidden by Allah and is one of five Islamic commandments. With their unmatched penchant for stirring imagery .", "desc_lfm_artist": "Armand Hammer & The Alchemist is the collaborative project of American, New York-based rap duo Armand Hammer (comprising Billy Woods and E L U C I D) and veteran producer The Alchemist. Known for pushing boundaries in underground hip hop, the trio first linked up in 2021 with the critically acclaimed Haram, a record that fused dense lyricism with unsettling, cinematic production. A second collaborative album, entitled Mercy, followed in late 2025.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "alberto_gu"]}, {"n": 577, "title": "Chemtrails Over the Country Club", "artist": "Lana Del Rey", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/173800-chemtrails-over-the-country-club-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/173800-lana-del-rey-chemtrails-over-the-country-club.php", "aoty_critic_score": 80, "aoty_user_score": 76, "mbid": "1effa9a2-d412-4866-8a39-3717c9f6bf63", "yt_id": "m66OgdDjR9s", "rym": null, "genres": [], "desc_lfm_album": "Chemtrails Over the Country Club is the seventh studio album by American singer-songwriter Lana Del Rey, released on March 19, 2021, by Interscope and Polydor Records. It is described as a folk, country folk and Americana record. According to Del Rey, the album is about her friends and family. Other themes featured on the album are themes of escapism, love, heartbreak and nostalgia, while encompassing her usual references to Americana, alongside emotions of disillusionment. The album features collaborations with Nikki Lane, Weyes Blood and Zella Day. .", "desc_lfm_artist": "Elizabeth Woolridge Grant (born June 21, 1985), known professionally as Lana Del Rey, is an American singer-songwriter. Her music often explores themes of romance and nostalgia, with references to popular culture and mid-20th century Americana. She has received multiple awards, including an MTV Video Music Award, three MTV Europe Music Awards, two Brit Awards, two Billboard Women in Music awards, and a Satellite Award, along with nominations for eleven Grammy Awards and a Golden Globe Award.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "armandwave"]}, {"n": 578, "title": "Flock", "artist": "Jane Weaver", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/290221-flock.jpg", "aoty_url": "https://www.albumoftheyear.org/album/290221-jane-weaver-flock.php", "aoty_critic_score": 82, "aoty_user_score": 71, "mbid": "8b80c0bb-407a-4d37-ac1e-294c044f0849", "yt_id": "m5z43YRwnns", "rym": null, "genres": [], "desc_lfm_album": "Flock is the eleventh album by English musician Jane Weaver. It was released on 5 March 2021 by Fire Records. Inspired by Lebanese torch songs, 1980s Russian Aerobics records and Australian punk, the album incorporates a pop-leaning production in comparison to Weaver's previous works. Upon release, the album was met with critical acclaim, with praise towards its experimental sound. .", "desc_lfm_artist": "Jane Weaver (born 1972 in Liverpool) is an English singer, songwriter and guitarist. Currently residing in Marple, Stockport (a part of Greater Manchester), she is married to DJ and co-founder of Twisted Nerve Records Andy Votel. She has worked alongside Elbow, Doves, Andy Votel and Badly Drawn Boy.\n\nIn 1989 Weaver started out fronting Indie rock band Kill Laura who signed to Polydor Records and released two EPs until the departure of their a&r Man.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 579, "title": "Smiling With No Teeth", "artist": "Genesis Owusu", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/304735-smiling-with-no-teeth.jpg", "aoty_url": "https://www.albumoftheyear.org/album/304735-genesis-owusu-smiling-with-no-teeth.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "726088d8-342d-49fc-ad5c-2f545b842a25", "yt_id": "by_kC63dhko", "rym": "https://rateyourmusic.com/release/album/genesis-owusu/smiling-with-no-teeth", "genres": [], "desc_lfm_album": "Smiling with No Teeth is the debut studio album by Australian musician Genesis Owusu, released on 5 March 2021 through Ourness. The album features a guest appearance from Kirin J. Callinan and production from Callinan, Andrew Klippel, Dave Hammer, Harvey Sutherland, Joe LaPorta, and Matt Corby. Preceded by five singles—\"Don't Need You\", \"Whip Cracker\", \"The Other Black Dog\", \"Gold Chains\", and \"Drown\" (featuring Kirin J. Callinan)—Smiling with No Teeth debuted at number 27 on the ARIA Albums Chart. At the 2021 ARIA Music Awards, the album won Album of the Year, Best Hip-Hop Release, and Best Independent Release while Andrew .", "desc_lfm_artist": "Kofi Owusu-Ansah (born 1998), known as Genesis Owusu, is a Ghanaian-Australian singer from Ngambri/Canberra.  He was born in Ghana and moved to Australia at the age of 2. He is the brother of Citizen Kay. His music builds on soul, funk, rap  and pop to create a unique sound. Owusu's debut studio album,  Smiling with No Teeth, was released on 5 March 2021. 60 hours of music was recorded during sessions for this album. Then, songs that conveyed a specific narrative were chosen to be featured on the album.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 580, "title": "As Days Get Dark", "artist": "Arab Strap", "year": 2021, "cover": "https://cdn2.albumoftheyear.org/600x0/album/306862-as-days-get-dark.jpg", "aoty_url": "https://www.albumofthe artists recording as The Chicks:\n\n1. The Chicks is the new name adopted in June 2020 by the band formerly known as Dixie Chicks, a massively succesful American country music group that had crossed to other genres. \n\n2. The Chicks were a New Zealand duo consisting of the sisters Suzanne and Judy Donaldson. They had a stream of pop hits in in their country between 1965 and 1970. Suzanne married Bruce Lynch and records as Suzanne Lynch. They are the parents of Andy Lynch from the New Zealand band Zed.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 634, "title": "Beyond the Pale", "artist": "JARV IS...", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/220308-beyond-the-pale.jpg", "aoty_url": "https://www.albumoftheyear.org/album/220308-jarv-is-beyond-the-pale.php", "aoty_critic_score": 82, "aoty_user_score": 67, "mbid": "08c35f0c-8dd3-42b2-b199-0919d3c1d8a0", "yt_id": "75wFi5IizQc", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "JARV IS... is a six-piece band formed by lead singer and songwriter Jarvis Cocker in 2017/18. Initially formed as a live act the band began releasing music in 2019. Their debut album Beyond The Pale was released in July 2020 and was preceded by physical singles for Must I Evolve? and House Music All Night Long. The album marked a major return for Cocker after a decade of projects such as a reunion of his seminal group Pulp (2011-2013), and a collaborative concept LP (Room 29) with Chilly Gonzales (2017).", "desc_mb_album": "", "desc_mb_artist": "The ellipsis at the end of the band's name is [https://www.independent.co.uk/arts-entertainment/music/jarvis-cocker-coronavirus-lockdown-new-album-beyond-the-pale-a9628961.html|intentional].", "heard_by": ["armandwave"]}, {"n": 635, "title": "Ultimate Success Today", "artist": "Protomartyr", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/223185-ultimate-success-today.jpg", "aoty_url": "https://www.albumoftheyear.org/album/223185-protomartyr-ultimate-success-today.php", "aoty_critic_score": 80, "aoty_user_score": 75, "mbid": "16b0d4f1-5541-489d-b30c-a68598768e0e", "yt_id": "ZU0_NOQOb_s", "rym": "https://rateyourmusic.com/release/album/protomartyr/ultimate-success-today", "genres": [], "desc_lfm_album": "Ultimate Success Today is the fifth studio album by American post-punk band Protomartyr. Thematically inspired by lead singer Joe Casey's mid-life crisis in the wake of the band's debut being reissued, the album - conceived as a \"valediction\" of the band's first decade together - was recorded in 2019 at Dreamland Recording Studios in Hurley, New York with the help of producer David Tolomei. The sessions saw the band playing and recording as a single unit, even to the extent of following similar daily routines. It also notably features collaborations with a number of guest musicians such as Jemeel Moondoc .", "desc_lfm_artist": "Detroit post-punk quartet Protomartyr formed in 2010, slowly bubbling up out of a few bands in a tightly knit music scene. Guitarist Greg Ahee, bassist Scott Davidson, and drummer Alex Leonard started the caustic punk band Butt Babies in 2008, playing mostly dive bars and basements and eventually getting together a practice space in a large industrial warehouse. Ahee was working at the time as a doorman at Detroit's Gem Theater and struck up a conversation with co-worker Joe Casey about music and local friends Tyvek.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 636, "title": "Lianne La Havas", "artist": "Lianne La Havas", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/238662-lianne-la-havas-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/238662-lianne-la-havas-lianne-la-havas.php", "aoty_critic_score": 81, "aoty_user_score": 83, "mbid": "e58e9147-0d9b-4dab-95f2-ae134542ea26", "yt_id": "EyYCiVvRrhM", "rym": "https://rateyourmusic.com/release/album/lianne-la-havas/lianne-la-havas", "genres": ["Pop"], "desc_lfm_album": "Lianne La Havas is the self-titled third studio album by English singer Lianne La Havas. The album was released on 17 July 2020. Released after a five-year hiatus and written following La Havas' break-up, the album was inspired by the life cycle of nature and its ability to thrive, go away, and come back stronger. Recording of the album took place between October 2019 and December 2019, with sessions taking place in London, Bath and New York. The album's production was handled by La Havas along with long-term collaborator Matt Hales, co-producers Beni Giles, Sam Crowe and guest co-producer Mura .", "desc_lfm_artist": "Lianne Charlotte Barnes a.k.a. Lianne La Havas (born August 23, 1989, in London, England) is an English folk, soul, singer-songwriter and multi-instrumentalist. \n\nLa Havas was born in London, England to a Greek father and Jamaican mother. She was raised in Tooting and Streatham, spending the majority of her time with her grandparents, following her parents' separation as a child. La Havas' cites her parents' diverse musical tastes as having the biggest influence on her music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "verygooood"]}, {"n": 637, "title": "Miles", "artist": "Blu & Exile", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/243924-miles.jpg", "aoty_url": "https://www.albumoftheyear.org/album/243924-blu-exile-miles.php", "aoty_critic_score": 86, "aoty_user_score": 83, "mbid": "6c035087-8023-4b47-8b35-f246433ee4f0", "yt_id": "GrLtJheS_V0", "rym": "https://rateyourmusic.com/release/album/blu-and-exile/miles", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Blu is definitely a leader in the new school of Los Angeles emcees. His presence is undeniable, while his music captivates audiences regardless of race, class, and gender. His delivery flows flawlessly, while his content reflects the joy and pain of working class youth everywhere. Exile is a producer, DJ and occasional emcee previously known for being a member of the duo Emanon, along with Aloe Blacc. His style of production is known for its \"laid back soulful vibes\" and is influenced by such producers as J Dilla and Madlib.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["verygooood"]}, {"n": 638, "title": "RePorpoised Phantasies", "artist": "Machine Girl", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/260039-reporpoised-phantasies.jpg", "aoty_url": "https://www.albumoftheyear.org/album/260039-machine-girl-reporpoised-phantasies.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "0dc54a24-3336-4bd7-bab1-ff0849e77e3b", "yt_id": "fdYG_pFzsJc", "rym": null, "genres": ["Electronic", "Punk"], "desc_lfm_album": "RePorpoised Phantasies is the first EP made by the experimental duo Machine Girl. This EP, compared to their previous works, is more melodic and smooth, and is composed of old demos from The Ugly Art era. .", "desc_lfm_artist": "Machine Girl is an American electronic music project created in 2012 by Matt Stephenson on Long Island, New York. In 2015, the project became a duo, with Stephenson recruiting percussionist Sean Kelly to play live drums. The project derives its name from the 2008 Japanese film The Machine Girl and has occasionally incorporated samples from the film into their work, notably in their 2014 debut studio album, WLFGRL.\n\nMachine Girl, as described by its creator, is a genre-defying musical project characterized as \"fucked-up electronic punk\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Rocky_stereo", "sdecandelario"]}, {"n": 639, "title": "Kitchen Sink", "artist": "Nadine Shah", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/212592-kitchen-sink.jpg", "aoty_url": "https://www.albumoftheyear.org/album/212592-nadine-shah-kitchen-sink.php", "aoty_critic_score": 81, "aoty_user_score": 69, "mbid": "7e67fa25-e35a-4eea-b8d8-83630ee8a98e", "yt_id": "r9qTgHtr-YE", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Nadine Shah is a British-born vocalist/pianist from a small town called Whitburn, UK.\n\nShah's parentage is Norwegian and Pakistani.\n\nSites: SoundCloud, Twitter, Facebook, Instagram and NadineShah.co.UK (official)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 640, "title": "What's Your Pleasure?", "artist": "Jessie Ware", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/218956-whats-your-pleasure.jpg", "aoty_url": "https://www.albumoftheyear.org/album/218956-jessie-ware-whats-your-pleasure.php", "aoty_critic_score": 84, "aoty_user_score": 86, "mbid": "38d0e2a3-06a0-4c2e-ac5d-faf1b2d7e563", "yt_id": "qS_o7XpnEqA", "rym": "https://rateyourmusic.com/release/album/jessie-ware/whats-your-pleasure", "genres": ["Pop"], "desc_lfm_album": "What's Your Pleasure? is the fourth studio album by English singer-songwriter Jessie Ware, released on June 26, 2020, via PMR Records and Virgin EMI Records. Ware described the album as a \"two-year labour of love\", further citing the album as her visions of \"escapism groove\". The twelve tracks on What's Your Pleasure? move away from her usual \"melancholy\" sound in her previous releases, to focus on disco, hi-NRG and house. A reissue subtitled What's Your Pleasure? (The Platinum Pleasure Edition), was released on June 11, 2021 and preceded by the singles \"Please\" and \"Hot n Heavy\". .", "desc_lfm_artist": "Jessica Lois Ware (born 15 October 1984) is an English singer-songwriter and podcaster. Her debut studio album Devotion (2012) peaked at number five on the UK Albums Chart and produced the single \"Wildest Moments\". Her follow-up record, Tough Love (2014), reached number nine in the United Kingdom. In October 2017, Ware released her third studio album, Glasshouse, by Island Records. Ware and her mother present a food podcast called Table Manners. Her fourth album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 641, "title": "Women in Music, Pt. III", "artist": "HAIM", "year": 2020, "cover": "https://dn721601.ca.archive.org/0/items/mbid-39802ac4-9c05-4864-a13e-79a31c2c2e51/mbid-39802ac4-9c05-4864-a13e-79a31c2c2e51-26566820603.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "73b8f504-93e5-483d-918d-1006ca3a315c", "yt_id": "V_eJU6X3_jQ", "rym": null, "genres": ["pop rock", "indie rock", "soft rock", "indie pop"], "desc_lfm_album": "", "desc_lfm_artist": "HAIM (pronounced HY-am, meaning \"life\" in Hebrew) is an American pop rock band from Los Angeles. The band consists of three sisters: Este Haim (bass guitar and vocals), Danielle Haim (lead vocals, guitar, and drums), and Alana Haim (guitars, keyboards, and vocals). In addition to their primary instruments, each member is proficient in several others. The group's pop sound on their studio work stands in contrast to the more rock-based music of their live shows.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84"]}, {"n": 642, "title": "Dark Angels", "artist": "SpaceGhostPurrp", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/778893-dark-angels_095626.jpg", "aoty_url": "https://www.albumoftheyear.org/album/778893-spaceghostpurrp-dark-angels.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "d362fe31-ff26-44b0-88be-6427a94e5661", "yt_id": "z81o2Zx6cSo", "rym": "https://rateyourmusic.com/release/album/spaceghostpurrp/dark-angels", "genres": [], "desc_lfm_album": "THIS IS THE THIRD AND FINAL REVISION OF SPACEGHOSTPURRP'S 2015 EP \"Dark Angel Project.\" Album release date: 11 January 2015 .", "desc_lfm_artist": "Markese Money Rolle (born April 1, 1991), known as SpaceGhostPurrp, is an American rapper and record producer from Miami, Florida. He is known for his distinctive, experimental production and sometimes aggressive lyrical style, as well as his controversial public persona. He is the founder of the collectives Raider Klan, Terror Gang, BMB Deathrow, VODECi, and Al Kaeda. Over the course of his career, he has released a large catalog of projects and collaborated with many well-known artists.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 643, "title": "Rough and Rowdy Ways", "artist": "Bob Dylan", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2020/239686-rough-and-rowdy-ways.jpg", "aoty_url": "https://www.albumoftheyear.org/album/239686-bob-dylan-rough-and-rowdy-ways.php", "aoty_critic_score": 89, "aoty_user_score": 74, "mbid": "43b12592-d808-44de-a5df-ebd7c6b2b75c", "yt_id": "3NbQkyvbw18", "rym": "https://rateyourmusic.com/release/album/bob-dylan/rough-and-rowdy-ways", "genres": [], "desc_lfm_album": "Rough and Rowdy Ways is the 39th studio album by Bob Dylan, released on June 19, 2020, through Columbia Records. It's Dylan's first album of original songs since his 2012 album Tempest, following a trilogy of albums that covered traditional pop standards. Rough and Rowdy Ways is his first new material since 2012's Tempest and arrives during a global pandemic and the righteous struggle for racial and economic justice. These ten songs revel in forms that have been Dylan's métier since the '60s: blues, country, folk, rockabilly, gospel, etc. Its three pre-release singles -- \"Murder Most Foul,\" \"I Contain Multitudes,\" .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave"]}, {"n": 644, "title": "Homegrown", "artist": "Neil Young", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/242252-homegrown.jpg", "aoty_url": "https://www.albumoftheyear.org/album/242252-neil-young-homegrown.php", "aoty_critic_score": 83, "aoty_user_score": 73, "mbid": "de8c4624-9d37-416b-b87c-7711bd6c1743", "yt_id": "b1OEzK61pUg", "rym": null, "genres": [], "desc_lfm_album": "Homegrown is a studio album by Neil Young, released on June 19, 2020 via Reprise Records. It was recorded during 1974–75 and remained unreleased for decades. .", "desc_lfm_artist": "Neil Percival Young (born November 12, 1945) is a Canadian singer, guitarist, songwriter, and social activist who is widely regarded as one of the most influential musicians of his generation, particularly as Neil Young & Crazy Horse. Young was born in Toronto, but he moved to the family home of Winnipeg as a child, which is where his music career began. Young began performing as a solo artist in Canada in 1960, before moving to California in 1966, where he co-founded the band Buffalo Springfield along with Stephen Stills and Richie Furay.", "desc_mb_album": "", "desc_mb_artist": "... has a gigography at [http://www.sugarmtn.org].", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 645, "title": "Little Dominiques Nosebleed", "artist": "The Koreatown Oddity", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/253803-little-dominiques-nosebleed.jpg", "aoty_url": "https://www.albumoftheyear.org/album/253803-the-koreatown-oddity-little-dominiques-nosebleed.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "0ab50be1-dc77-42d4-b670-ee0a0add3da6", "yt_id": "5NJfi30g_pM", "rym": "https://rateyourmusic.com/release/album/the-koreatown-oddity/little-dominiques-nosebleed", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "He is a modern polymath, free of the fleeting trends and identity crises of countless dreamers flooding Los Angeles in search of redemption and reinvention. Dominique Purdy, who beneath his iconic wolf mask becomes The Koreatown Oddity, inhabits a liminal space between the primal and the present, alternating serene passages with feral beats.  His productions are chapters in an ongoing saga, a narrative of instinct and experience, and an homage to his roots and influences brewing under the smog canopy and concrete jungle of LA’s Koreatown.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 646, "title": "Punisher", "artist": "Phoebe Bridgers", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/231192-punisher-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/231192-phoebe-bridgers-punisher.php", "aoty_critic_score": 88, "aoty_user_score": 86, "mbid": "cf75fd5a-ca84-4371-94d7-27410360f06b", "yt_id": "82Eq76ChX5U", "rym": "https://rateyourmusic.com/release/album/phoebe-bridgers/punisher", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Punisher is the second studio album by Phoebe Bridgers. It was released on June 18, 2020, through record label Dead Oceans. .", "desc_lfm_artist": "Phoebe Lucille Bridgers (born August 17, 1994) is an American indie musician from Pasadena, California. Best known for her work as a solo singer-songwriter, she is also known for being part of the musical groups boygenius (with Julien Baker and Lucy Dacus) and Better Oblivion Community Center (with Conor Oberst). Bridgers made her solo debut with the studio album Stranger in the Alps (2017), followed by Punisher (2020) which earned Bridgers widespread critical acclaim and four Grammy Award nominations, including Best New Artist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 647, "title": "RTJ4", "artist": "Run The Jewels", "year": 2020, "cover": "https://ia801900.us.archive.org/29/items/mbid-e669bdc6-f37c-4055-a04f-b6ef91bc60ec/mbid-e669bdc6-f37c-4055-a04f-b6ef91bc60ec-26376869696.jpg", "aoty_url": "https://www.albumoftheyear.org/album/133007-run-the-jewels-rtj4.php", "aoty_critic_score": 89, "aoty_user_score": 84, "mbid": "46dc2b09-a6b1-4271-bf1d-01f3b3b95c23", "yt_id": "g9tgxB2GbO4", "rym": "https://rateyourmusic.com/release/album/run-the-jewels/rtj4/", "genres": ["hip hop", "hardcore hip hop", "political hip hop"], "desc_lfm_album": "RTJ4 (also called Run the Jewels 4 is the fourth studio album by American hip hop duo Run the Jewels. It was released digitally through their own Jewel Runners imprint via RBC and BMG on June 3, 2020, two days earlier than scheduled, with physical editions slated for release in September 2020. As with their previous albums, a download of the album is available for free through their website, with the option of paying for it via other digital providers. .", "desc_lfm_artist": "Run the Jewels is an American hip-hop duo that consists of emcee/producer El-P and emcee Killer Mike.\n\nIn 2012, El-P produced Killer Mike's critically acclaimed album R.A.P. Music. The following week, Killer Mike appeared on the track \"Tougher Colder Killer\", from El-P's album Cancer 4 Cure. \n\nBoth won the acclaim of media and fans across the globe and led to 2012′s legendary, hugely successful “Into The Wild” tour. One year later, the duo return to satisfy fan demand", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 648, "title": "Alfredo", "artist": "Freddie Gibbs & The Alchemist", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/246426-alfredo-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/246426-freddie-gibbs-the-alchemist-alfredo.php", "aoty_critic_score": 86, "aoty_user_score": 84, "mbid": "13615d5f-c913-4f48-afc7-6f56c8313fd5", "yt_id": "6ylAvz0eaZ0", "rym": null, "genres": [], "desc_lfm_album": "After reaching out to fellow artist Curren$y in order to craft the 2018 album Fetti, rapper Freddie Gibbs and legendary producer The Alchemist have teamed up for their first official collaborative project, titled Alfredo, with the LP’s name being a play on both of their names. The name also continues The Alchemist’s long-running trend of food-related album titles. Gibbs has been teasing the collaboration since almost ten years, but only on May 27, 2020 the announce became official, as he posted a short trailer up on his Twitter profile: https://twitter.com/FreddieGibbs/status/1265705608415637504?t=kTlgOnbPEz3gVZZsiOoh_g&s=19 At the same time, the track “1985” was released as .", "desc_lfm_artist": "Freddie Gibbs & The Alchemist are a rapper–producer duo celebrated for their sharp lyricism and cinematic, sample-driven production. They first teamed up in 2018 on the collaborative project Fetti (with Curren$y), before breaking through as a duo with the Grammy-nominated Alfredo (2020).\n\nIn 2025, they returned with Alfredo 2, released through ESGN and ALC Records r, Mays was the lead singer of Memphis-based hardcore punk band Copwatch. During his involvement with the band, he began experimenting with hip hop music, eventually leaving grade school to make a full leap into the genre. In 2011, he released his debut mixtape", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 651, "title": "græ", "artist": "Moses Sumney", "year": 2020, "cover": "https://i.discogs.com/FkXlh5l8FdudFN6z35RGJ7Ob5ORCgcxgdx0tkV_m0D4/rs:fit/g:sm/q:90/h:597/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE1MzAw/MjA3LTE1ODk0Njkx/MTYtMzg3Mi5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/192026-moses-sumney-grae.php", "aoty_critic_score": 87, "aoty_user_score": 79, "mbid": "1c50740c-1acb-4bd8-bf54-fc6a6dc859cb", "yt_id": "AeMaNFTMH54", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Moses Sumney (born 19 May 1990) is a Los Angeles-based singer and songwriter. \n\nBorn in California, Sumney was raised by pastor parents, and moved with his family back to Ghana at the age of 10. He described his childhood as \"Americanized\" by this age and had difficulty adjusting to the culture of Ghana, especially the rural nature of his new environment. There he grew up on a goat farm in Accra and commuted by public bus to school. His family returned to Southern California when Sumney was 16, settling in Riverside.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 652, "title": "A Steady Drip, Drip, Drip", "artist": "Sparks", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/210960-a-steady-drip-drip-drip-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/210960-sparks-a-steady-drip-drip-drip.php", "aoty_critic_score": 81, "aoty_user_score": 68, "mbid": "3504831c-ae6d-49b9-b11f-edac773820f6", "yt_id": "JgDXKNGHk08", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Sparks is an American rock and pop music band formed in Los Angeles in 1970 by brothers Ron Mael (keyboards) and Russell Mael (vocals), initially under the name Halfnelson. Best known for their quirky approach to song writing, Sparks' music is often accompanied by cutting and acerbic lyrics, and an idiosyncratic stage presence, typified in the contrast between Russell's wide-eyed hyperactive frontman antics and Ron's sedentary scowling.\n\nThe band's long career has seen them successfully adopt many different musical genres; including glam pop", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 653, "title": "Set My Heart On Fire Immediately", "artist": "Perfume Genius", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/218227-set-my-heart-on-fire-immediately.jpg", "aoty_url": "https://www.albumoftheyear.org/album/218227-perfume-genius-set-my-heart-on-fire-immediately.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "cbf252c7-bb3f-484f-825e-fc2a42b55849", "yt_id": "vAoWMJTClqo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Perfume Genius is the alias of singer-songwriter Mike Hadreas. Born in Des Moines, Iowa,  Mike moved to Seattle when he was 6. Growing up, Hadreas was the only openly gay student at his school, and he received death threats that were ignored by the school administration. He dropped out of high school during his senior year. Two years after dropping out, he was attacked by several young men in his neighborhood. He moved to Williamsburg, Brooklyn, and worked as a doorman for a club in the East Village.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "armandwave", "sdecandelario"]}, {"n": 654, "title": "how i’m feeling now", "artist": "Charli XCX", "year": 2020, "cover": "https://dn710209.ca.archive.org/0/items/mbid-494b2117-deda-4b63-abce-2f7565cabdd3/mbid-494b2117-deda-4b63-abce-2f7565cabdd3-26275533148.jpg", "aoty_url": null, "aoty_critic_score": n , "desc_lfm_album": "\"Good Souls Better Angels\" is the 14th studio album by American singer-songwriter Lucinda Williams, released on 24 April 2020 by Highway 20 Records and Thirty Tigers. Williams' fourth album since she launched her own record label and took full control of her process of recording and releasing music, the album was cut mostly live in the studio with her road band -- Stuart Mathis on guitar, David Sutton on bass, and Butch Norton on drums. The track \"Man Without a Soul\", a critique of US President Donald Trump, earned Williams a Grammy Award nomination for Best American Roots Song, while .", "desc_lfm_artist": "Lucinda Williams (born January 26, 1953) is an American rock, folk, and alt-country songwriter and singer. A three-time Grammy Award winner, she was named \"America's best songwriter\" by TIME magazine in 2002.\n\nWilliams has garnered considerable critical acclaim but her commercial success has been moderate. She has a reputation as a perfectionist and as a slow worker when it comes to recording; six years passed between the release of her second and third albums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 658, "title": "Instrumental Relics", "artist": "Clams Casino", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/235328-instrumental-relics-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/235328-clams-casino-instrumental-relics.php", "aoty_critic_score": 85, "aoty_user_score": 83, "mbid": "a87a26f4-bed8-46b3-a7b7-838d9abfac81", "yt_id": "KPWVdro4MXs", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Clams Casino is the pseudonym of New Jersey resident Michael Volpe, who has shot from relative obscurity to production sensation thanks to a handful of blistering tracks. Edging into the limelight after passing tunes to Soulja Boy and Bay Area superstar Lil B, his originality has resonated with more than just rap fans. Clams hasn’t confined his songwriting to rap music alone, and listening to his productions you can hear a keen sense of harmony", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["verygooood"]}, {"n": 659, "title": "SAWAYAMA", "artist": "Rina Sawayama", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/208344-sawayama.jpg", "aoty_url": "https://www.albumoftheyear.org/album/208344-rina-sawayama-sawayama.php", "aoty_critic_score": 85, "aoty_user_score": 83, "mbid": "972644cd-431d-4001-8913-0b59b975cfbc", "yt_id": "A2urtFRvOak", "rym": "https://rateyourmusic.com/release/album/rina-sawayama/sawayama", "genres": [], "desc_lfm_album": "Sawayama (stylised in all caps) is the debut studio album by Japanese-British singer-songwriter Rina Sawayama, released on April 17, 2020 by the independent record label Dirty Hit. A follow up to her self-released debut EP Rina (2017), it received widespread acclaim from music critics, specifically towards the wide variety of music genres used, as well as its Y2K nostalgia and \"intelligent\" nature. Described by Sawayama herself as being \"about family and identity\", she lyrically explores personal experiences from both her childhood and adulthood. Sawayama was primarily produced by Clarence Clarity and written by Sawayama, with additional work from musicians such .", "desc_lfm_artist": "Rina Sawayama (born 16 August 1990 in Niigata, Japan) is a Japanese-British London-based singer, songwriter, producer, model, and actress. Born and raised in Japan until moving to the UK at the age of 5, Rina would go on to study politics at Cambridge University. At university, she decided to pursue both modeling and her love for singing. She would go on to experiment in a hip hop group before deciding to pursue her interest in R&B and pop music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "armandwave", "verygooood"]}, {"n": 660, "title": "Pray for Paris", "artist": "Westside Gunn", "year": 2020, "cover": "https://i.discogs.com/4ITcw8odgc4nNrirGanEHvVd_GSsVG5Gmvc1JmSB8JY/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTI0NzEx/MDQ3LTE3MDY1ODc5/NTMtMTQwMi5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/211321-westside-gunn-pray-for-paris.php", "aoty_critic_score": 76, "aoty_user_score": 81, "mbid": "b75a3e17-5648-4f9d-9e94-3b1b97a8bf57", "yt_id": "OXw_P4vtQFA", "rym": "https://rateyourmusic.com/release/album/westside-gunn/pray-for-paris", "genres": [], "desc_lfm_album": "Pray for Paris is the third studio album by American rapper Westside Gunn. It was released on April 17, 2020 via Griselda Records. The album was produced by Daringer, Beat Butcha, the Alchemist, DJ Muggs, and DJ Premier. It features guest appearances from Benny the Butcher, Conway the Machine, Joey Badass, Tyler, the Creator, Boldy James, Freddie Gibbs, Roc Marciano, Wale, Joyce Wrice, Billie Essco, Keisha Plum, and Cartier Williams. The album debuted at number 67 on the Billboard 200. Westside Gunn announced he was recording a project called Pray for Paris after having attended Virgil Abloh's Off-White Paris fashion .", "desc_lfm_artist": "Alvin Lamar Worthy (born July 27, 1982), known professionally as Westside Gunn, is an American rapper. He is the paternal half-brother of fellow rapper Conway The Machine, with whom he forms the duo Hall N Nash, and the cousin of fellow Buffalo native rapper Benny the Butcher. In 2014, he founded the record label Griselda Records, as well as clothing brand Fashion Rebels.\n\nIn 2016, he released his first commercial album, Flygod. On March 3, 2017, Griselda Records signed a deal with Eminem's Shady Records", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "verygooood"]}, {"n": 661, "title": "Fetch the Bolt Cutters", "artist": "Fiona Apple", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/224348-fetch-the-bolt-cutters_082853.jpg", "aoty_url": "https://www.albumoftheyear.org/album/224348-fiona-apple-fetch-the-bolt-cutters.php", "aoty_critic_score": 93, "aoty_user_score": 86, "mbid": "882db6d8-e28b-46ba-8a30-277e86fbddf7", "yt_id": "qONNetp6rZQ", "rym": "https://rateyourmusic.com/release/album/fiona-apple/fetch-the-bolt-cutters", "genres": [], "desc_lfm_album": "Fetch the Bolt Cutters is the fifth studio album by American singer-songwriter Fiona Apple. It was released on April 17, 2020, Apple's first release since The Idler Wheel... in 2012. The album was recorded from 2015 to 2020, largely at Apple's home in Venice Beach. It was produced and performed by Apple alongside Amy Aileen Wood, Sebastian Steinberg and Davíd Garza; recording consisted of long, often-improvised takes with unconventional percussive sounds. GarageBand was used for much of this recording, and Apple credited the album's unedited vocals and long takes to her lack of expertise with the program. The album explores .", "desc_lfm_artist": "Fiona Apple McAfee-Maggart (born September 13, 1977) is an American singer-songwriter. She is known for her songwriting and has released five albums between 1996 and 2020, all of which reached the top 20 on the U.S. Billboard 200 chart. As of 2021, she has sold over 15 million records worldwide. Apple has received several awards, including three Grammy Awards, two MTV Video Music Awards, and a Billboard Music Video Award.\n\nApple is the youngest daughter of actor Brandon Maggart and was born in New York City.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 662, "title": "The New Abnormal", "artist": "The Strokes", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/203601-the-new-abnormal-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/203601-the-strokes-the-new-abnormal.php", "aoty_critic_score": 75, "aoty_user_score": 86, "mbid": "43ca5aa6-92de-47e9-8f0b-9112e4881426", "yt_id": "jhfDq06ghfU", "rym": "https://rateyourmusic.com/release/album/the-strokes/the-new-abnormal", "genres": [], "desc_lfm_album": "\"The New Abnormal\" is the sixth studio album by American rock band The Strokes. It was released on April 10, 2020, through Cult and RCA Records. It comes nearly seven years after March 2013’s Comedown Machine, although the band had reunited briefly to release a three-track EP titled \"Future Present Past\" in June 2016. The album title \"The New Abnormal\" is a reference to the present age of environmental disaster. “There were these huge fires in Los Angeles,” Julian about their time recording. “A lot of houses burned down but Shangri-La survived, by some miracle. That’s where the name of .", "desc_lfm_artist": "The Strokes is an American indie rock band, known for their distinctive sound and cultural impact, particularly in the early 2000s.\n\nMembers\nJulian Casablancas (vocals), Nick Valensi (guitar), Albert Hammond Jr. (guitar), Nikolai Fraiture (bass), and Fabrizio Moretti (drums)\n\nFormation\nThe founding process of The Strokes was a serendipitous convergence of childhood connections and a shared musical vision. Julian Casablancas, Fabrizio Moretti, and Nick Valensi, childhood friends with varying musical experiences, came together in the late '90s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 663, "title": "Song For Our Daughter", "artist": "Laura Marling", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/230158-song-for-our-daughter-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/230158-laura-marling-song-for-our-daughter.php", "aoty_critic_score": 88, "aoty_user_score": 81, "mbid": "95335b28-967c-49a2-bbc1-952c9fd0fb58", "yt_id": "18ycqaWuDdE", "rym": null, "genres": [], "desc_lfm_album": "Song for Our Daughter is the seventh studio album by British singer-songwriter Laura Marling, released on April 10, 2020. It was co-produced by Marling with longtime collaborator Ethan Johns. The album's title is figurative, with Marling writing to a fictional daughter. .", "desc_lfm_artist": "Laura Marling (born 1st February 1990) is a folk singer/songwriter/guitarist from Eversley, United Kingdom.\n\nShe began playing the guitar at the age of five, first being taught the blues by her father in front of the family fire, and has been enthralled by the songs and lyrics of the likes of Neil Young, Bob Dylan, James Taylor and John Mayall ever since. It’s not just the “golden-oldies” that Laura admires; she also harbours a rather deep love for alt.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "verygooood"]}, {"n": 664, "title": "It Is What It Is", "artist": "Thundercat", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/208221-it-is-what-it-is-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/208221-thundercat-it-is-what-it-is.php", "aoty_critic_score": 80, "aoty_user_score": 75, "mbid": "9ffdc0f1-6683-44f1-9194-a247ecb9b297", "yt_id": "golqr78Q0OY", "rym": "https://rateyourmusic.com/release/album/thundercat/it-is-what-it-is", "genres": [], "desc_lfm_album": "It Is What It Is is the fourth studio album by Thundercat, released through Brainfeeder on April 3, 2020. It was executive produced by the lead artist alongside Flying Lotus, and features guest appearances from the likes of Louis Cole, Steve Lacy, Steve Arrington, Childish Gambino, Ty Dolla Sign, Lil B, Kamasi Washington, BadBadNotGood, and Zack Fox. .", "desc_lfm_artist": "Stephen Lee Bruner, stage name Thundercat (b. October 19 1984, Los Angeles, CA, USA) is a virtuoso bassist, composer, producer and singer. Born into a family of musicians, he and his brother were part of legendary thrash punks Suicidal Tendencies (since 16 years of age) - Bruner has collaborated with many, including jams with Snoop Dogg, Kendrick Lamar, Mac Miller and Stanley Clarke. \n\n“I do believe that hip-hop can be the new jazz, and I’m helping create that”, Bruner said in an interview to Bass Player, in 2008.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Rocky_stereo", "sdecandelario", "verygooood"]}, {"n": 665, "title": "Heaven to a Tortured Mind", "artist": "Yves Tumor", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/216268-heaven-to-a-tortured-mind.jpg", "aoty_url": "https://www.albumoftheyear.org/album/216268-yves-tumor-heaven-to-a-tortured-mind.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "448bf766-1101-4554-9b23-2d3b254a984d", "yt_id": "NJp6psm8mFg", "rym": "https://rateyourmusic.com/release/album/yves-tumor/heaven-to-a-tortured-mind", "genres": [], "desc_lfm_album": "Heaven to a Tortured Mind is the fourth studio album by American musician Yves Tumor, released on April 3, 2020, via Warp Records. The album received widespread critical acclaim, with an average score of 88 on Metacritic, indicating \"universal acclaim\". Critics praised its psychedelic soul sound and considered it a defining work by Yves Tumor. They commended the album's coherence, conciseness and artistic ambition, describing it as a gratifying and intense record that showcases Yves Tumor as a significant figure in contemporary music. Heaven to a Tortured Mind was announced with the release of the single \"Gospel for a New .", "desc_lfm_artist": "Yves Tumor is a moniker of an experimental musician Sean Lee Bowie, born in Miami, Florida and currently based in Turin, Italy.\n\nThey are known for their unique approach to blending different genres together (ambient, art pop, rock, synth-punk, electronic), creating a psychedelic atmosphere with an add-on of various instruments.\nThey have put out music under various pseudonyms, like Teams, bekelé berhanu, rajel ali and  shanti (producer name)\n\nTo date, they have released five studio albums and one compilation album:", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 666, "title": "Future Nostalgia", "artist": "Dua Lipa", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/195881-future-nostalgia-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/195881-dua-lipa-future-nostalgia.php", "aoty_critic_score": 86, "aoty_user_score": 81, "mbid": "aa366795-92d7-4d67-91fa-6741f82a4858", "yt_id": "xUSvOFztulY", "rym": "https://rateyourmusic.com/release/album/dua-lipa/future-nostalgia", "genres": ["synth-pop", "electropop", "disco", "dance-pop", "nu disco", "funktronica"], "desc_lfm_album": "Future Nostalgia is the second studio album by English singer-songwriter, Dua Lipa. It was released on March 27th, 2020 by Warner Records. Lipa began working on the album in early 2018, enlisting writers and producers such as Jeff Bhasker, Ian Kirkpatrick, Stuart Price, The Monsters and the Strangerz and others in order to create a pop record with a \"nostalgic\" and electronic feel. Three singles and one promotional single were released from the album. \"Don't Start Now\" was released as the album's lead single on November 1st, 2019. The song attained both critical and commercial success, becoming her seventh top .", "desc_lfm_artist": "Dua Lipa (born 22 August 1995) is an English, Albanian, and Kosovar singer, songwriter and actress. She began her career as a model before signing with Warner Bros. Records in 2014. Her self-titled debut studio album was released in 2017 and peaked at number three on the UK Albums Chart. The album included the singles \"Be the One\", \"IDGAF\", and the UK number-one single \"New Rules\". In 2018, she received Brit Awards for British Female Solo Artist and British Breakthrough Act.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 667, "title": "Saint Cloud", "artist": "Waxahatchee", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/209583-saint-cloud_111753.jpg", "aoty_url": "https://www.albumoftheyear.org/album/209583-waxahatchee-saint-cloud.php", "aoty_critic_score": 83, "aoty_user_score": 75, "mbid": "38b46e05-894f-432a-97cb-a3a1219c14bd", "yt_id": "-zT4u17Tn_o", "rym": null, "genres": [], "desc_lfm_album": "Saint Cloud is the fifth studio album by Waxahatchee, released on March 27, 2020. It was recorded with producer Brad Cook across two studios, Sonic Ranch in Tornillo, Texas and Long Pond in Stuyvesant, New York over the summer of 2019. .", "desc_lfm_artist": "Waxahatchee is a solo project of American singer and guitarist Katie Crutchfield (born in 1989) of P.S. Eliot and Bad Banana.\n\nWaxahatchee, named after Waxahatchee Creek in Alabama where Crutchfield grew up, began in 2010 during the breakup of P.S. Eliot. Crutchfield released her first music as Waxahatchee as a split cassette with Chris Clavin on Plan-It-X Records. Her bedroom-recorded debut album, American Weekend, was released on Don Giovanni Records in 2012.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84"]}, {"n": 668, "title": "High Risk Behaviour", "artist": "The Chats", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/213547-high-risk-behaviour.jpg", "aoty_url": "https://www.albumoftheyear.org/album/213547-the-chats-high-risk-behaviour.php", "aoty_critic_score": 80, "aoty_user_score": 69, "mbid": "fc633179-1534-44c5-a1ca-e8f770010938", "yt_id": "vzTVuQwhKDw", "rym": "https://rateyourmusic.com/release/album/the-chats/high-risk-behaviour", "genres": [], "desc_lfm_album": "High Risk Behaviour is the debut studio album by the Australian punk rock band the Chats, released through Bargain Bin Records on 27 March 2020. It is the group's first full-length release following the release of two EPs, The Chats (2016) and Get This in Ya!! (2017). The release of the album was preceded by five singles: \"Do What I Want\", \"Pub Feed\", \"Identity Theft\", \"The Clap\", and \"Dine N Dash\". .", "desc_lfm_artist": "The Chats is an Australian punk rock band from Sunshine Coast, Queensland, Australia. The current line up consists of Eamon Sandwith (vocals, bass), Josh Hardy  (guitar), and Matt Boggis (drums). Initially formed in 2016, they gained popularity after the song Smoko became a viral sensation. To date, they have released two EPs, The Chats and Get This In Ya, and two full length albums, High Risk Behaviour and GET FUCKED. \n\nOriginal guitarist Josh Price left the band December 2020 for personal reasons.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario"]}, {"n": 669, "title": "Reasonable Drought", "artist": "Stove God Cook$ & Roc Marciano", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/227437-reasonable-drought.jpg", "aoty_url": "https://www.albumoftheyear.org/album/227437-stove-god-cook-roc-marciano-reasonable-drought.php", "aoty_critic_score": 86, "aoty_user_score": 80, "mbid": null, "yt_id": "0cRWZa5stek", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 670, "title": "The Night Chancers", "artist": "Baxter Dury", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/192942-the-night-chancers.jpg", "aoty_url": "https://www.albumoftheyear.org/album/192942-baxter-dury-the-night-chancers.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "19550850-59d4-4bf2-a3ae-ae99987f9f64", "yt_id": "W-7-sddliMo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Baxter Dury (born 18 December 1971 in Buckinghamshire, United Kingdom), son of the late Ian Dury, is a British indie rock singer-songwriter, who released his debut EP, the Oscar Brown EP, in 2001. As of October 2025 he has eight solo studio albums to his name. The first one was Len Parrot's Memorial Lift (2002). The most recent one was Allbarone (2025).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 671, "title": "After Hours", "artist": "The Weeknd", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/208717-after-hours-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/208717-the-weeknd-after-hours.php", "aoty_critic_score": 79, "aoty_user_score": 82, "mbid": "78570bea-2a26-467c-a3db-c52723ceb394", "yt_id": "Egb1nB18Ojg", "rym": "https://rateyourmusic.com/release/album/the-weeknd/after-hours", "genres": [], "desc_lfm_album": "After Hours is the fourth studio album by Canadian singer The Weeknd, released on March 20, 2020, via XO and Republic Records. Thematically, the album explores loneliness, self-loathing and escapism. The standard edition of After Hours has no features, but the remixes edition contains guest appearances from Chromatics and Lil Uzi Vert. The album was supported by four singles: \"Heartless\", \"Blinding Lights\", \"In Your Eyes\" and \"Save Your Tears\". The title track was released as a promotional single. In March 2020, After Hours broke the record for the most global pre-adds in Apple Music history, with over 1.02 million users. .", "desc_lfm_artist": "Abel Makkonen Tesfaye, popularly known as The Weeknd (born February 16, 1990 in Toronto, Ontario, Canada), is a Canadian R&B/hip-hop musician, singer-songwriter and record producer. He chose his stage name in tribute to when he was 17 years old, when, along with his friend La Mar Taylor, he dropped out of high school, took his mattress, and \"left one weekend and never came home\". However, his estranged former producer Jeremy Rose claims the name was his idea.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 672, "title": "demo three", "artist": "life", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/273889-demo-three.jpg", "aoty_url": "https://www.albumoftheyear.org/album/273889-life-demo-three.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": "59eb22a1-8efe-4958-8179-556d89196e32", "yt_id": "ScN5Fl244SY", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Numerous artists have used the name Life, including: \n\n1. LIFE (life) - emotive hardcore/blackened screamo solo project of Damián Ojeda (see also Sadness)\nhttps://life9.bandcamp.com/\n\n2. LIFE - British Post-Punk band formally known as The Neat. Their debut single \"I Wanna Forget\" was released on 21st October 2013 via Birthday Records. LIFE are anchored by their hometown, Hull, UK; the geography, history and community has always been the inspiration behind their creativity and on their third LP", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 673, "title": "Underneath", "artist": "Code Orange", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/206415-underneath.jpg", "aoty_url": "https://www.albumoftheyear.org/album/206415-code-orange-underneath.php", "aoty_critic_score": 85, "aoty_user_score": 77, "mbid": "b047b25c-d99b-47d2-ad08-6f15ce21be5e", "yt_id": "ybBzQsMfFvs", "rym": "https://rateyourmusic.com/release/album/code-orange/underneath", "genres": [], "desc_lfm_album": "Underneath is the fourth studio album by American metal band Code Orange, released on 13 March 2020. Underneath was met with critical acclaim. At Metacritic, which assigns a normalized rating out of 100 to reviews from mainstream publications, the album received an average score of 92, which indicates \"universal acclaim\", based on eight reviews. .", "desc_lfm_artist": "Code Orange (formerly Code Orange Kids) is an American metalcore band that formed in Pittsburgh, Pennsylvania, United States in 2008. The band consists of guitarist, keyboardist and backing vocalist Er 015, she signed to 4AD releasing her album Half Free in the same year and the follow up  In A Poem Unlimited in 2018.\n\nhttp://usgirls.bandcamp.com/\nhttp://yousgirls.blogspot.com.es/", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 676, "title": "Suddenly", "artist": "Caribou", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x0/album/196349-suddenly.jpg", "aoty_url": "https://www.albumoftheyear.org/album/196349-caribou-suddenly.php", "aoty_critic_score": 84, "aoty_user_score": 75, "mbid": "975b39ae-77fa-4b6e-b1fc-e981b4c62f1c", "yt_id": "UF9hrn9ZU-w", "rym": null, "genres": [], "desc_lfm_album": "Suddenly is the tenth studio album by Canadian musician Dan Snaith, released under the moniker Caribou by Merge Records and City Slang on February 28, 2020. It is Snaith's fifth album as Caribou, and his first since Our Love. Snaith had approximately 900 \"draft ideas\" for the album that he cut down to 12 complete tracks. The album's themes include the nature and constant evolution of relationships with family and friends. Snaith named the album Suddenly because of his daughter's \"obsession with the word\". .", "desc_lfm_artist": "There is more than one artist with this name, including: \n1) Caribou is Canadian Dan Snaith (b. 1978); \n2) Caribou was a French band active in the 1970s; \n3) Caribou is a New Zealand band from Dunedin/Ōtepoti.  \n\n1) Caribou is Canadian Dan Snaith (born Daniel Victor Snaith on 29 March 1978), who formerly recorded under the moniker Manitoba. Known for altering his sound with each subsequent release, he incorporates electronic psychedelia, krautrock rhythms, and breakbeat drums and creates a swirling, lush, musical panorama.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 677, "title": "color theory", "artist": "Soccer Mommy", "year": 2020, "cover": "https://cdn2.albumoftheyear.org/600x , ["industrial metal", 1], ["pigfuck", 1], ["hip house", 1], ["afro house", 1], ["slowcore", 1], ["ethereal wave", 1], ["dark ambient", 1], ["punk rock", 1], ["grime", 1], ["alternative", 1], ["screamo", 1], ["hard rock", 1], ["arena rock", 1], ["aor", 1], ["glam metal", 1], ["pop soul", 1], ["glitch pop", 1], ["emo pop", 1], ["bitpop", 1], ["trance", 1], ["drum and bass", 1], ["breakbeat", 1], ["atmospheric drum and bass", 1], ["harsh noise", 1], ["plunderphonics", 1], ["podcasts", 1], ["ambient pop", 1], ["country", 1], ["art punk", 1], ["country pop", 1], ["rock and roll", 1], ["classic rock", 1], ["heartland rock", 1], ["alternative folk", 1], ["soft rock", 1], ["political hip hop", 1], ["deconstructed club", 1], ["disco", 1], ["nu disco", 1], ["funktronica", 1]];
let filter = 'all';

function isHeard(a) {
  if (selectedUser) return a.heard_by.includes(selectedUser);
  return a.heard_by.length > 0;
}

const imgObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && e.target.dataset.src) {
      e.target.src = e.target.dataset.src;
      e.target.removeAttribute('data-src');
      imgObs.unobserve(e.target);
    }
  });
}, {rootMargin:'200px'});

function buildGenreList() {
  const list = document.getElementById('genre-list');
  list.innerHTML = '';
  GENRE_OPTS.forEach(([genre, count]) => {
    const div = document.createElement('div');
    div.className = 'genre-item';
    const id = 'g-'+genre.replace(/[^a-z0-9]/g,'_');
    div.innerHTML = '<input type="checkbox" id="'+id+'" value="'+genre+'" onchange="toggleGenre(\''+genre+'\',this.checked)"><label for="'+id+'">'+genre+'<span>'+count+'</span></label>';
    list.appendChild(div);
  });
}

function toggleGenreDD() {
  const dd  = document.getElementById('genre-dd');
  const btn = document.getElementById('genre-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  btn.classList.toggle('active', open || selectedGenres.size > 0);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 200) + 'px';
  }
}

function toggleGenre(g, checked) {
  if (checked) selectedGenres.add(g); else selectedGenres.delete(g);
  const badge = document.getElementById('genre-badge');
  const btn   = document.getElementById('genre-btn');
  if (selectedGenres.size>0) { badge.textContent=selectedGenres.size; badge.style.display=''; btn.classList.add('active'); }
  else { badge.style.display='none'; btn.classList.remove('active'); }
  applyFilters();
}

function clearGenres() {
  selectedGenres.clear();
  document.querySelectorAll('#genre-list input').forEach(i=>i.checked=false);
  document.getElementById('genre-badge').style.display='none';
  document.getElementById('genre-btn').classList.remove('active');
  applyFilters();
}

function toggleDecDD() {
  const dd  = document.getElementById('dec-dd');
  const btn = document.getElementById('dec-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = r.left + 'px';
  }
}

function buildUserList() {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  const allDiv = document.createElement('div');
  allDiv.className = 'user-item' + (!selectedUser ? ' active' : '');
  allDiv.innerHTML = '<span class="u-dot"></span>All users';
  allDiv.onclick = () => setUser(null);
  list.appendChild(allDiv);
  USERS.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item' + (selectedUser===u ? ' active' : '');
    const n = ALBUMS.filter(a=>a.heard_by.includes(u)).length;
    div.innerHTML = '<span class="u-dot"></span>'+u+'<span style="color:var(--muted);font-size:.58rem;margin-left:auto">'+n+'</span>';
    div.onclick = () => setUser(u);
    list.appendChild(div);
  });
}

function toggleUserDD() {
  const dd  = document.getElementById('user-dd');
  const btn = document.getElementById('user-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 164) + 'px';
  }
}

function setUser(u) {
  selectedUser = u;
  document.getElementById('user-btn-label').textContent = u || 'All users';
  document.getElementById('user-dd').classList.remove('open');
  buildUserList();
  document.querySelectorAll('.card').forEach(card => {
    const n = parseInt(card.dataset.num);
    const a = ALBUMS.find(x=>x.n===n);
    if (!a) return;
    const heard = isHeard(a);
    card.dataset.heard = heard ? '1' : '0';
    card.classList.toggle('heard-user',  heard);
    card.classList.toggle('unheard-user', !heard);
  });
  applyFilters();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.genre-wrap')) document.getElementById('genre-dd').classList.remove('open');
  if (!e.target.closest('.user-wrap'))  document.getElementById('user-dd').classList.remove('open');
  if (!e.target.closest('.dec-wrap'))   document.getElementById('dec-dd').classList.remove('open');
});

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  ALBUMS.forEach(a => {
    const card = document.createElement('div');
    const heard = isHeard(a);
    card.className = 'card ' + (heard ? 'heard-user' : 'unheard-user');
    card.dataset.artist = (a.artist||'').toLowerCase();
    card.dataset.title  = (a.title||'').toLowerCase();
    card.dataset.genres = (a.genres||[]).join(',');
    card.dataset.heard  = heard ? '1' : '0';
    card.dataset.num    = a.n;
    const img = document.createElement('img');
    img.dataset.src = a.cover || COVER_PH;
    img.src = COVER_PH;
    img.alt = a.n;
    img.onerror = function(){ this.onerror=null; this.src=COVER_PH; };
    card.appendChild(img);
    const cs = a.aoty_critic_score != null ? '<span class="card-score c">'+a.aoty_critic_score+'</span>' : '';
    const us = a.aoty_user_score   != null ? '<span class="card-score u">'+a.aoty_user_score+'</span>'   : '';
    card.insertAdjacentHTML('beforeend',
      '<div class="card-overlay">'
      +'<div class="card-scores">'+cs+us+'</div>'
      +'<div class="card-title">'+a.title+'</div>'
      +'<div class="card-artist">'+a.artist+(a.year?' · '+a.year:'')+'</div>'
      +'</div>');
    card.addEventListener('click', () => openPanel(a, card));
    grid.appendChild(card);
  });
  document.querySelectorAll('img[data-src]').forEach(img=>imgObs.observe(img));
  applyFilters();
}

const _isMobile = () => window.matchMedia('(max-width:600px)').matches;

function closePanel() {
  document.getElementById('panel').classList.remove('panel-open');
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));

  cardEl.classList.add('active-card');
  if (_isMobile()) document.getElementById('panel').classList.add('panel-open');

  const coverWrap = document.getElementById('panel-cover-wrap');
  coverWrap.style.display='';
  document.getElementById('p-cover').src = a.cover || COVER_PH;
  document.getElementById('p-cover').onerror = function(){ this.src=COVER_PH; };

  const cs = a.aoty_critic_score != null ? '<span class="panel-score c">'+a.aoty_critic_score+' critic</span>' : '';
  const us = a.aoty_user_score   != null ? '<span class="panel-score u">'+a.aoty_user_score+' user</span>'     : '';
  document.getElementById('p-scores').innerHTML = cs + us;

  const links = [];
  if (a.aoty_url) links.push('<a class="panel-link aoty" href="'+a.aoty_url+'" target="_blank">AOTY</a>');
  if (a.rym)      links.push('<a class="panel-link rym"  href="'+a.rym+'"      target="_blank">RYM</a>');
  if (a.mbid)     links.push('<a class="panel-link"      href="https://musicbrainz.org/release-group/'+a.mbid+'" target="_blank">MusicBrainz</a>');
  if (a.yt_id)    links.push('<a class="panel-link yt"   href="https://youtu.be/'+a.yt_id+'" target="_blank">YouTube</a>');

  let ytBlock = '';
  if (a.yt_id) {
    ytBlock = '<iframe src="https://www.youtube.com/embed/'+a.yt_id+'" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
  } else {
    const q = encodeURIComponent(a.artist+' '+a.title+' full album');
    ytBlock = '<div class="panel-yt-placeholder"><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a></div>';
  }

  const genreTags = (a.genres||[]).map(g=>'<span class="panel-genre-tag">'+g+'</span>').join('');
  const heardLine = a.heard_by.length>0 ? '<div class="panel-heard-by">Heard by <b>'+a.heard_by.join(', ')+'</b></div>' : '';

  const descSrcs = [
    {key:'desc_lfm_album',  cls:'lfm',    lbl:'💿 Album · Last.fm'},
    {key:'desc_lfm_artist', cls:'artist',  lbl:'🎤 Artist · Last.fm'},
    {key:'desc_mb_album',   cls:'mb',      lbl:'💿 Album · MusicBrainz'},
    {key:'desc_mb_artist',  cls:'mb artist',lbl:'🎤 Artist · MusicBrainz'},
  ];
  const descBlocks = descSrcs.filter(s=>a[s.key]&&a[s.key].length>40)
    .map(s=>'<div class="desc-block"><div class="desc-source-label '+s.cls+'">'+s.lbl+'</div><div class="desc-source-text">'+a[s.key]+'</div></div>').join('');
  const bioHtml = descBlocks || '<span style="color:var(--muted);font-style:italic">No info available.</span>';

  document.getElementById('panel-body').innerHTML =
    '<div class="panel-title">'+a.title+'</div>'
    +'<div class="panel-artist">'+a.artist+'</div>'
    +'<div class="panel-year">'+(a.year||'')+'</div>'
    +(genreTags?'<div class="panel-genres">'+genreTags+'</div>':'')
    +heardLine
    +'<div class="panel-links">'+links.join('')+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">Listen on YouTube</div>'
    +'<div class="panel-yt-wrap">'+ytBlock+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">About</div>'
    +'<div class="panel-bio" id="p-bio">'+bioHtml+'</div>';
}

function setFilter(f) {
  filter=f;
  ['all','heard','unheard'].forEach(x => {
    const btn=document.getElementById('btn-'+x); if(!btn) return;
    btn.classList.toggle('active',x===f);
    if(x==='unheard') {
      btn.style.borderColor=f==='unheard'?'var(--pending)':'';
      btn.style.color=f==='unheard'?'var(--pending)':'';
      btn.style.background=f==='unheard'?'rgba(255,71,71,.06)':'';
    }
  });
  applyFilters();
}

function applyFilters() {
  const q=document.getElementById('search').value.toLowerCase().trim();
  let vis=0,visH=0;
  document.querySelectorAll('.card').forEach(c => {
    const mf=filter==='all'||(filter==='heard'&&c.dataset.heard==='1')||(filter==='unheard'&&c.dataset.heard==='0');
    const ms=!q||c.dataset.title.includes(q)||c.dataset.artist.includes(q);
    const cg=c.dataset.genres?c.dataset.genres.split(','):[];
    const mg=selectedGenres.size===0||[...selectedGenres].some(g=>cg.includes(g));
    const show=mf&&ms&&mg;
    c.classList.toggle('hidden',!show);
    if(show){vis++;if(c.dataset.heard==='1')visH++;}
  });
  document.getElementById('vis-count').textContent=vis;
  const uLabel = selectedUser ? ' ('+selectedUser+')' : '';
  document.getElementById('vis-heard').textContent=visH+' heard'+uLabel;
  document.getElementById('empty').style.display=vis===0?'block':'none';
}

buildGenreList(); buildUserList(); buildGrid();
try{const sv=localStorage.getItem('grid-cols-aoty');const dv=_isMobile()?3:10;const v=sv?Math.min(20,Math.max(3,parseInt(sv))):dv;document.getElementById('grid-slider').value=v;setGridSize(v);}catch(e){setGridSize(_isMobile()?3:10);}
setTimeout(()=>{
  if(!_isMobile()){const first=document.querySelector('.card:not(.hidden)');if(first){const a=ALBUMS.find(x=>x.n===parseInt(first.dataset.num));if(a)openPanel(a,first);}}
},100);</script>
