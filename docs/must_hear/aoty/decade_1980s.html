literary and unconventional lyrics, and innovative use of dance and visual performance. Her work has influenced a wide range of artists across genres.\n\nBush began writing songs at the age of 11 and was later signed to EMI Records after David Gilmour of Pink Floyd helped fund a professional demo recording.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 90, "title": "½ Mensch", "artist": "Einstürzende Neubauten", "year": 1985, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53828-halber-mensch.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53828-einsturzende-neubauten--12-mensch.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "7ebcef25-ee4d-3921-bf04-c489e60d6e9c", "yt_id": "mR6tPkkhmzo", "rym": "https://rateyourmusic.com/release/album/einsturzende-neubauten/-mensch-4/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Einstürzende Neubauten is an ever-changing musical entity, originally formed in Berlin, Germany, on the 1st April 1980. Neubauten were initially seen as part of the culminating phase of first-wave industrial bands, filling the space left when Throbbing Gristle terminated their mission. Neubauten's early output fit the term \"industrial\" well, as it (ab)used the sounds of machinery, metal-on-metal, construction-site equipment, and treated tape loops, creating harsh soundscapes and rhythmic textures reminiscent of krautrock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd"]}, {"n": 91, "title": "The Head on the Door", "artist": "The Cure", "year": 1985, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4389-the-head-on-the-door_181631.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4389-the-cure-the-head-on-the-door.php", "aoty_critic_score": 75, "aoty_user_score": 83, "mbid": "cf5d6187-e43b-3848-ba51-8ec1df3d97e3", "yt_id": "OX0Dg7jJ9_Q", "rym": "https://rateyourmusic.com/release/album/the-cure/the-head-on-the-door", "genres": ["alternative rock", "art pop", "post-punk", "new wave", "synth-pop", "gothic rock"], "desc_lfm_album": "The Head on the Door is the sixth studio album by British band The Cure, released in 1985. The album features the return of Simon Gallup and the official re-induction of Porl Thompson as a band member (he made a small contribution to The Top, but wasn't an official band member until the album's tour). This is also the first Cure album with drummer Boris Williams, who had previously worked with the Thompson Twins. Special guest Ron Howe from Fools Dance plays a saxophone solo on the track \"A Night Like This\". On the 2007/08 4Tour The Cure played \"In .", "desc_lfm_artist": "The Cure are an English gothic rock band formed in Crawley in 1976 by Robert Smith (vocals, guitar) and Lol Tolhurst (drums). The band’s current lineup consists of Smith, Simon Gallup (bass), Roger O'Donnell (keyboards), Perry Bamonte (guitar and keyboards), Jason Cooper (drums), and Reeves Gabrels (guitar). Smith has been the sole constant member throughout the group’s history, while Gallup has appeared on all but two of the band’s studio albums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 92, "title": "Steve McQueen", "artist": "Prefab Sprout", "year": 1985, "cover": "https://ia601609.us.archive.org/8/items/mbid-a4f2d077-6232-43f7-bf17-cd38a5af56cd/mbid-a4f2d077-6232-43f7-bf17-cd38a5af56cd-23447021060.png", "aoty_url": "https://www.albumoftheyear.org/album/7910-prefab-sprout-steve-mcqueen.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "7cd79fc6-5c15-3aa7-85af-87ea206712ca", "yt_id": "dlFyqniT34U", "rym": "https://rateyourmusic.com/release/album/prefab-sprout/steve-mcqueen", "genres": ["pop rock", "punk", "synth-pop", "indie rock", "indie pop", "sophisti-pop"], "desc_lfm_album": "Steve McQueen is the second studio album by the English pop band Prefab Sprout, released in June 1985 by Kitchenware Records. Produced by Thomas Dolby, the album is widely regarded as the band's masterpiece and a defining release of the sophisticated pop genre. It built upon the promise of their debut, Swoon, replacing that record's jagged complexity with a lush, spacious soundscape that perfectly complemented Paddy McAloon's intricate songwriting. Due to legal conflicts with the estate of the late American actor Steve McQueen, the album was released in the United States under the title Two Wheels Good. Despite the title .", "desc_lfm_artist": "Prefab Sprout are an English pop band from Witton Gilbert, County Durham formed in 1976, who rose to fame during the 1980s. Though critically acclaimed, and considered by many to have released some of the best pop albums of the decade, the band never matched this acclaim with commercial success. The band's best known lineup comprised Paddy McAloon (vocals, guitar, keyboard), Wendy Smith (vocals, guitar, keyboard), Martin McAloon (bass), and Neil Conti (drums).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 93, "title": "Low‐Life", "artist": "New Order", "year": 1985, "cover": "https://dn721605.ca.archive.org/0/items/mbid-91365640-4a8e-44e2-bb1f-8fa3a5c37e0e/mbid-91365640-4a8e-44e2-bb1f-8fa3a5c37e0e-26939406726.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "69be20bc-189f-3e40-8486-6fba8459f6a0", "yt_id": "-VFWqLmVWx4", "rym": null, "genres": ["new wave", "alternative dance"], "desc_lfm_album": "", "desc_lfm_artist": "New Order is an English new wave/synthpop band which formed in 1980 in Salford, England, United Kingdom by the three remaining members of Joy Division. The band's classic lineup consists of Bernard Sumner (vocals, guitar, keyboards), Peter Hook (bass, electronic percussion), Gillian Gilbert (keyboards, guitar) and Stephen Morris (drums, keyboards). The group effectively disbanded in 1993 but reformed in 1998. Gilbert left in 2001 to look after her and Morris' children and was replaced by guitarist/keyboardist Phil Cunningham.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 94, "title": "Brothers in Arms", "artist": "Dire Straits", "year": 1985, "cover": "https://dn710908.ca.archive.org/0/items/mbid-c27a8c40-d884-4bf7-9067-d6571bef9752/mbid-c27a8c40-d884-4bf7-9067-d6571bef9752-11579652111.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7626-dire-straits-brothers-in-arms.php", "aoty_critic_score": 89, "aoty_user_score": 80, "mbid": "b02f651e-32a1-30ae-bc23-070b59170278", "yt_id": "ZtdRdgHkUsU", "rym": "https://rateyourmusic.com/release/album/dire-straits/brothers-in-arms", "genres": ["blues rock", "country rock", "classic rock", "pop rock", "heartland rock", "soft rock"], "desc_lfm_album": "Brothers in Arms is the fifth studio album by British rock band Dire Straits, released in 1985. The first half of the album is a development of their unique brand of arena rock which had evolved in their music since the 1980 album Making Movies, while the second half consists of more folk-influenced material. The whole album maintains the original Dire Straits' bluesy and laid back guitar-based sound whilst retaining a more lavish and bombastic production and overall sound. It is the band's best selling album. Brothers in Arms was one of the first albums to be directed at the .", "desc_lfm_artist": "Dire Straits were a British rock band formed in London in 1977 by Mark Knopfler (lead vocals and lead guitar), David Knopfler (rhythm guitar and backing vocals), John Illsley (bass guitar and backing vocals), and Pick Withers (drums and percussion). They were active from 1977 to 1988 and again from 1990 to 1995.\n\nTheir first single, \"Sultans of Swing\", from their 1978 self-titled debut album, reached the top ten in the UK and US charts. It was followed by a series of hit singles including \"Romeo and Juliet\" (1981)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 95, "title": "Around The World In A Day", "artist": "Prince", "year": 1985, "cover": "https://dn711002.ca.archive.org/0/items/mbid-94068129-8090-3ded-88a2-70793bf66ba4/mbid-94068129-8090-3ded-88a2-70793bf66ba4-20319961464.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "10b61b06-5cd5-39ef-976e-aba8bc4fb51d", "yt_id": "344YP-esDoA", "rym": "https://rateyourmusic.com/release/album/prince-and-the-revolution/around-the-world-in-a-day-18", "genres": ["psychedelic rock", "pop rock", "psychedelic pop", "funk", "neo-psychedelia", "minneapolis sound"], "desc_lfm_album": "The seventh studio album by Prince and his second with backing band The Revolution. Released on April 22, 1985, by Paisley Park Records and Warner Bros. Records. Two of its four singles reached the top 10 of the Billboard Hot 100: \"Raspberry Beret\" and \"Pop Life\", and was certified double platinum. .", "desc_lfm_artist": "Prince Rogers Nelson (June 7, 1958 – April 21, 2016), more commonly known mononymously as Prince, was an American singer-songwriter, musician, and record producer. The recipient of numerous awards and nominations, he is widely regarded as one of the greatest musicians of his generation. He was known for his flamboyant, androgynous persona; his wide vocal range, which included a far-reaching falsetto and high-pitched screams; and his skill as a multi-instrumentalist, often preferring to play all or most of the instruments on his recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "armandwave"]}, {"n": 96, "title": "Strawberry Switchblade", "artist": "Strawberry Switchblade", "year": 1985, "cover": "https://cdn2.albumoftheyear.org/600x0/album/71162-strawberry-switchblade.jpg", "aoty_url": "https://www.albumoftheyear.org/album/71162-strawberry-switchblade-strawberry-switchblade.php", "aoty_critic_score": 86, "aoty_user_score": 81, "mbid": "89fddb8f-a1a3-3044-beed-abc3f75cc52a", "yt_id": "wFNr3_6Mi5A", "rym": "https://rateyourmusic.com/release/album/strawberry-switchblade/strawberry-switchblade", "genres": [], "desc_lfm_album": "Strawberry Switchblade is the first and only (self titled) studio album by Strawberry Switchblade released on April 5th, 1985. The album featured the following singles: Since Yesterday (reached #5; UK Charts), Let Her Go (reached #59; UK Charts), and Who Knows What Love Is? (reached #84; UK Charts). The album had ended up reaching lowly at #25 in UK Charts. The album was also successful in Japan, reaching #39 in Japanese Charts and holding a place in charts for up to 6 weeks. .", "desc_lfm_artist": "Strawberry Switchblade was a new wave duo from Glasgow, Scotland, UK, formed in 1981 by Rose McDowall and Jill Bryson.\n\nBonded during the Glasgow punk scene of the late 1970s, first as friends, then as bandmates. With their distinctive style (garish colours, polka-dots and a slight geisha influence) already intact they formed Strawberry Switchblade (named after a never-released Orange Juice song and quickly aborted fanzine) in the early 80s. After signing to Warners they moved to London, and released the single Trees And Flowers in June 1983.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 97, "title": "Songs From the Big Chair", "artist": "Tears for Fears", "year": 1985, "cover": "https://dn710701.ca.archive.org/0/items/mbid-9aefc6dd-216a-4271-ada1-d9cf67956f39/mbid-9aefc6dd-216a-4271-ada1-d9cf67956f39-19682986993.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7627-tears-for-fears-songs-from-the-big-chair.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "475946e9-4b00-3f7c-9bd7-c11f55740262", "yt_id": "eroNADQ_mL8", "rym": "https://rateyourmusic.com/release/album/tears-for-fears/songs-from-the-big-chair/", "genres": ["pop rock", "progressive pop", "new wave", "synth-pop"], "desc_lfm_album": "Songs from the Big Chair is the second studio album by the British rock/pop band Tears for Fears, released on 25 February 1985 by Phonogram Records. The album peaked at number two in the UK and number one in the US and Canada. It spawned the international hit singles \"Mothers Talk\", \"Shout\", \"Everybody Wants to Rule the World\", \"Head over Heels\", and \"I Believe\". It remains their best-selling album to date. Curt Smith explains the album's title, March 1985: \"The title was my idea. It's a bit perverse but then you've got to understand our sense of humour. The 'Big .", "desc_lfm_artist": "Tears for Fears are an English pop rock band formed in Bath, England, in 1981 by Roland Orzabal and Curt Smith. Founded after the dissolution of their first band, the mod-influenced Graduate, Tears for Fears were associated with the new wave synthesizer bands of the early 1980s, and attained international chart success.\n\nThe band's debut album, The Hurting (1983), reached number one on the UK Albums Chart, and their first three hit singles – \"Mad World\", \"Change\", and \"Pale Shelter\" – all reached the top five in the UK Singles Chart.", "desc_mb_album": "FIXME: Of the releases from the pre-re-release era, some editions have 9 tracks, some have 8 tracks -- with 2 songs on track 7 --, and some have 8 tracks as well, but track 7 is in fact only 1 song . A lot of clean-up needs to be done here, i'm afraid.", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 98, "title": "Meat Is Murder", "artist": "The Smiths", "year": 1985, "cover": "https://dn711000.ca.archive.org/0/items/mbid-7db8a368-ca76-343f-a6dd-f6ad604f630b/mbid-7db8a368-ca76-343f-a6dd-f6ad604f630b-25290697827.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5637-the-smiths-meat-is-murder.php", "aoty_critic_score": 68, "aoty_user_score": 80, "mbid": "0d56a04c-045a-37db-bcc3-6c7099e94f16", "yt_id": "eQTc4GolJt4", "rym": "https://rateyourmusic.com/release/album/the-smiths/meat-is-murder", "genres": ["post-punk", "indie rock", "indie pop", "jangle pop"], "desc_lfm_album": "Meat Is Murder is the second studio album by the British Jangle Pop band The Smiths. It was released in February 1985 and became the band's sole number one album in the UK charts during the band's lifetime, staying on the chart for 13 weeks. It reached number 110 in the US. In 2003, the album was ranked number 295 on Rolling Stone magazine's list of the \"500 greatest albums of all time\". Meat is Murder is also included in the book \"1001 Albums You Must Hear Before You Die\" (2006). The album's title is shared with the final album .", "desc_lfm_artist": "The Smiths were an English rock band formed in Manchester in 1982, composed of Morrissey (vocals), Johnny Marr (guitar), Andy Rourke (bass), and Mike Joyce (drums). Morrissey and Marr formed the band's songwriting partnership. The Smiths are regarded as one of the most important acts to emerge from 1980s British independent music.\n\nThe Smiths signed to the independent label Rough Trade Records in 1983 and released their debut album, The Smiths, in 1984.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 99, "title": "Hatful of Hollow", "artist": "The Smiths", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5643-hatful-of-hollow-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5643-the-smiths-hatful-of-hollow.php", "aoty_critic_score": 92, "aoty_user_score": 88, "mbid": "f81500a3-d01a-30e7-8ec9-75f672e9a775", "yt_id": "CJSVRnvPzDc", "rym": null, "genres": ["alternative rock", "post-punk", "indie rock", "indie pop", "jangle pop"], "desc_lfm_album": "Hatful of Hollow is a compilation album by the English rock band The Smiths, featuring BBC Radio 1 studio recordings and two contemporary singles with their B-sides. It was released on 12 November 1984 by the band's British record company, Rough Trade, just months after the band's debut, The Smiths. The album reached No. 7 on the UK Albums Chart and stayed on the chart for 46 weeks. Eventually, on 9 November 1993, it was also released by their American label, Sire Records, which had initially declined to release the album. Sire instead released Louder Than Bombs in the US .", "desc_lfm_artist": "The Smiths were an English rock band formed in Manchester in 1982, composed of Morrissey (vocals), Johnny Marr (guitar), Andy Rourke (bass), and Mike Joyce (drums). Morrissey and Marr formed the band's songwriting partnership. The Smiths are regarded as one of the most important acts to emerge from 1980s British independent music.\n\nThe Smiths signed to the independent label Rough Trade Records in 1983 and released their debut album, The Smiths, in 1984.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 100, "title": "Treasure", "artist": "Cocteau Twins", "year": 1984, "cover": "https://dn711305.ca.archive.org/0/items/mbid-bc6dee20-448c-387d-8eb4-a7cb737ae1b7/mbid-bc6dee20-448c-387d-8eb4-a7cb737ae1b7-23441368012.png", "aoty_url": "https://www.albumoftheyear.org/album/6490-cocteau-twins-treasure.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "e0023081-c755-377d-9bbf-fd7551d5d14c", "yt_id": "gF8fnsyjCoI", "rym": "https://rateyourmusic.com/release/album/cocteau-twins/treasure", "genres": ["post-punk", "shoegaze", "dream pop", "ethereal wave", "rock"], "desc_lfm_album": "Treasure is the third studio album by Scottish alternative rock band Cocteau Twins. It was released on 1 November 1984 by 4AD. With this album, the band settled on what would, from then on, be their primary lineup: vocalist Elizabeth Fraser, guitarist Robin Guthrie and bass guitarist Simon Raymonde. This new lineup also coincided with the development of the ethereal sound associated with the band's music. .", "desc_lfm_artist": "Cocteau Twins was a Scottish rock band active from 1979 to 1997. The group was formed in Grangemouth, Scotland, by Robin Guthrie (guitar, drum machine) and Will Heggie (bass), with Elizabeth Fraser (vocals) joining in 1981. In 1983, Heggie was replaced by multi-instrumentalist Simon Raymonde, completing the lineup most associated with the band’s career. Cocteau Twins became known for their ethereal, heavily layered sound and Fraser’s distinctive soprano vocal style, often featuring lyrics that avoid conventional language.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 101, "title": "Let It Be", "artist": "The Replacements", "year": 1984, "cover": "https://dn711000.ca.archive.org/0/items/mbid-ce39c6c2-0829-3ce6-8378-199345285912/mbid-ce39c6c2-0829-3ce6-8378-199345285912-25274216003.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4225-the-replacements-let-it-be.php", "aoty_critic_score": 100, "aoty_user_score": 83, "mbid": "2c644807-3b5d-39d4-8c65-dec603bf3f3a", "yt_id": "VpN5e5i32Ys", "rym": "https://rateyourmusic.com/release/album/the-replacements/let-it-be", "genres": ["alternative rock", "garage rock", "post-punk", "punk", "indie rock", "power pop"], "desc_lfm_album": "Let It Be is the third studio album by American rock band The Replacements. It was released on October 2, 1984 by Twin/Tone Records. A post-punk album with coming-of-age themes, Let It Be was recorded by the band after they had grown tired of playing loud and fast exclusively as on their 1983 Hootenanny album; the group decided to write songs that were, according to vocalist Paul Westerberg, \"a little more sincere.\" Let It Be was well received by music critics and later ranked among the greatest albums of the 1980s by AllMusic and Rolling Stone magazine.Now considered a classic, .", "desc_lfm_artist": "The Replacements was an American alternative rock band that formed in Minneapolis, Minnesota in 1979. The band originally started off as a hardcore punk outfit but began to incorporate folk and power pop influences in their sound. They become one of the leaders of the early alt-folk set and one of the flagship bands of the American   post-punk scene in the 80s, being a major influence on 90s alternative rock as well.  \n\nThe band's best known lineup consisted of Paul Westerberg (vocals", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 102, "title": "Powerslave", "artist": "Iron Maiden", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12159-powerslave_045556.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12159-iron-maiden-powerslave.php", "aoty_critic_score": 80, "aoty_user_score": 86, "mbid": "60a20bc8-acac-3cbb-99f9-ce458317233a", "yt_id": "5cpxvDKHtQI", "rym": "https://rateyourmusic.com/release/album/iron-maiden/powerslave/", "genres": [], "desc_lfm_album": "Powerslave is the fifth studio album by the British heavy metal band Iron Maiden, released on September 3, 1984 on EMI in Europe and its sister label Capitol Records in the US (it was re-released by Sanctuary/Columbia Records in the US in 2002). It is notable for its Egyptian theme displayed in the album art, as well in the title track's musical style. It contains a musical re-telling of Samuel Taylor Coleridge's \"Rime of the Ancient Mariner\", which uses pieces of the original poem as lyrics, and was, for a long time, the longest Iron Maiden song at a length .", "desc_lfm_artist": "Iron Maiden is an English heavy metal band formed in Leyton, East London, in 1975 by bassist and primary songwriter Steve Harris. Although the lineup changed several times in the early years, it has remained stable for most of the band’s history with Harris, lead vocalist Bruce Dickinson, drummer Nicko McBrain, and guitarists Dave Murray, Adrian Smith, and Janick Gers.\n\nAs pioneers of the new wave of British heavy metal movement, Iron Maiden achieved", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 103, "title": "Stop Making Sense", "artist": "Talking Heads", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6504-stop-making-sense.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6504-talking-heads-stop-making-sense.php", "aoty_critic_score": 84, "aoty_user_score": 93, "mbid": "2b85ba4e-53bf-4473-87f5-59d0b53020ad", "yt_id": "SSeb4m1R0a0", "rym": "https://rateyourmusic.com/release/album/talking-heads/stop-making-sense-5", "genres": ["pop rock", "latin", "new wave", "synth-pop"], "desc_lfm_album": "Stop Making Sense is 1984 album by Talking Heads, the soundtrack to the film of the same name. The album features only nine of the songs from the movie, many of them heavily edited. The album spent over two years (118 weeks) on the Billboard 200 chart. Byrne's intention was not to make a traditional soundtrack album, but to have it be a separate experience. Limited pressings of the original LP version featured a full color picture book wrapped around the album jacket. Regular versions had many of the pictures and captions on the album's inner sleeve. In 1999, to .", "desc_lfm_artist": "Talking Heads were an American rock band formed in New York City in 1975. The group consisted of vocalist and guitarist David Byrne, drummer Chris Frantz, bassist Tina Weymouth, and guitarist and keyboardist Jerry Harrison. The band is often associated with the development of new wave music, combining elements of punk rock, art rock, funk, and world music with a distinctive visual and artistic style.\n\nDavid Byrne, Chris Frantz, and Tina Weymouth met while studying at the Rhode Island School of Design", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 104, "title": "Arvo Pärt: Tabula Rasa", "artist": "Gidon Kremer", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/51487-tabula-rasa.jpg", "aoty_url": "https://www.albumoftheyear.org/album/51487-gidon-kremer-arvo-part-tabula-rasa.php", "aoty_critic_score": 95, "aoty_user_score": 84, "mbid": null, "yt_id": "SMN9h85DrFM", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Gidon Markowitsch Kremer was born on 27th of February 1947 in Riga, Latvia to German-Jewish parents. He has established a worldwide reputation as one of the most original and compelling classical artists of his generation, praised for his high degree of individualism, his rejection of the well-trodden paths of interpretation, and his search for new possibilities.\n\nKremer began studying music at the age of four with his father and grandfather, who were both distinguished, professional violinists.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 105, "title": "The Pearl", "artist": "Harold Budd/Brian Eno with Daniel Lanois", "year": 1984, "cover": "https://dn710605.ca.archive.org/0/items/mbid-2600797a-f28f-4c23-bcb3-1dcbc14ad5a1/mbid-2600797a-f28f-4c23-bcb3-1dcbc14ad5a1-5945514863.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "6c364112-e9fb-373c-9f1d-364b427f64c3", "yt_id": "Ig5u2PA46FA", "rym": null, "genres": ["experimental rock"], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 106, "title": "Ride The Lightning", "artist": "Metallica", "year": 1984, "cover": "https://dn710304.ca.archive.org/0/items/mbid-589ff96d-0be8-3f82-bdd2-299592e51b40/mbid-589ff96d-0be8-3f82-bdd2-299592e51b40-41578959727.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4223-metallica-ride-the-lightning.php", "aoty_critic_score": 92, "aoty_user_score": 89, "mbid": "0da580f2-6768-498f-af9d-2becaddf15e0", "yt_id": "H0XGswUuZU0", "rym": null, "genres": ["heavy metal", "metal", "thrash metal"], "desc_lfm_album": "\"Ride the Lightning\" is the second studio album by the American heavy metal band Metallica, released on July 27, 1984, by Megaforce Records. The album was recorded over a three-week period with producer Flemming Rasmussen at Sweet Silence Studios in Copenhagen, Denmark. Its cover art, conceived by the band, depicts an electric chair struck by lightning emerging from the band’s logo. The album title was inspired by a phrase from Stephen King’s novel \"The Stand,\" referring to execution by electric chair. While primarily a thrash metal album, \"Ride the Lightning\" features a broader musical approach than Metallica’s debut, \"Kill 'Em .", "desc_lfm_artist": "Metallica is an American heavy metal band formed in Los Angeles in 1981 by James Hetfield and Lars Ulrich and later based in San Francisco. Known for fast tempos, complex instrumentals and aggressive musicianship, the group became one of the founding big four bands of thrash metal alongside Megadeth, Anthrax and Slayer. The current lineup consists of Hetfield, Ulrich, Kirk Hammett and Robert Trujillo. Former members include Dave Mustaine, Ron McGovney, Cliff Burton and Jason Newsted.", "desc_mb_album": "", "desc_mb_artist": "'''Attention!''' The album known sometimes as ''The Black Album'' is already in this database, it is correctly named simply ''[http://musicbrainz.org/release-group/e8f70201-8899-3f0c-9e07-5d6495bc8046.html|Metallica]''. This is because ''The Black Album'' is only a fan-composed name. Please do not add it or rename it.\r\n\r\nBoth the infamous ''Garage Days'' (in the EPs section) and ''[http://musicbrainz.org/release-group/49371adc-871d-38f6-bb60-fd9e5af6795f.html|S&M]'' (in the Live section) are also here, they're just a bit scattered. \r\n\r\nMetallica has been selling Official/Live concert recordings on [http://www.livemetallica.com] since 2004-03-02.  Please add a \"X can be purchased for download at Y\" relationship if you add one of these releases.  For a list of which shows have already been a", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 107, "title": "Diamond Life", "artist": "Sade", "year": 1984, "cover": "https://dn720701.ca.archive.org/0/items/mbid-98063a3f-563e-3b9e-be19-af33da0fef52/mbid-98063a3f-563e-3b9e-be19-af33da0fef52-8211603614.jpg", "aoty_url": "https://www.albumoftheyear.org/album/20106-sade-diamond-life.php", "aoty_critic_score": 92, "aoty_user_score": 88, "mbid": "af2a0c41-e612-3232-949d-bdca340c407c", "yt_id": "OPgmQc3OkFs", "rym": "https://rateyourmusic.com/release/album/sade/diamond-life", "genres": ["soul", "jazz", "smooth soul", "pop soul", "sophisti-pop", "quiet storm"], "desc_lfm_album": "Diamond Life is the debut studio album by English band Sade, released in the United Kingdom on July 16, 1984 by Epic Records, and in the United States on February 27, 1985 by Portrait Records. After studying fashion design, and later modelling, Sade Adu began backup-singing with British band Pride. During this time Adu and three of the original members of \"Pride\"—Paul Anthony Cook, Paul Denman and Stuart Matthewman—left the group to form their own band called Sade. After various demos and performances, Sade received interest from record labels and signed to Epic. Recording for the album began in 1983 .", "desc_lfm_artist": "Sade (pronounced shah-day) is an English band formed in London in 1982, named after their lead singer, Sade Adu. Their music features elements of soul, quiet storm, smooth jazz and sophisti-pop. All of their albums, including compilations and a live album, have charted in the US Top Ten.\n\nThree of their members were originally from Hull in the East Riding of Yorkshire. Sade was formed in 1982, when members of Latin soul band Pride — Sade Adu, (real name Helen Folasade Adu - born 16 January 1959 in Ibadan", "desc_mb_album": "", "desc_mb_artist": "Formed out of the ashes of jazz group ''Pride'', this band had critical and commercial success with the album '''Diamond Life''' and several singles. From 1984, the record deal was solely in the name of '''Helen Folasade Adu''', the charismatic singer, but her backing band remained intact for several releases.", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 108, "title": "Structures From Silence", "artist": "Steve Roach", "year": 1984, "cover": "https://dn711104.ca.archive.org/0/items/mbid-5a869f89-2188-4d11-b07e-e69678f6cfc1/mbid-5a869f89-2188-4d11-b07e-e69678f6cfc1-38055897875.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "88b07bcb-9337-3ca5-9245-760a84b10996", "yt_id": "MzUf5mXP4ZQ", "rym": "https://rateyourmusic.com/release/album/steve-roach/structures-from-silence", "genres": ["space ambient", "electronic"], "desc_lfm_album": "Structures from Silence is the third studio album by Steve Roach, released in 1984. It was recorded at Timeroom, a recording studio in Culver City, California. .", "desc_lfm_artist": "Steve Roach (born February 16, 1955, in La Mesa, California, USA) is an American ambient musician and composer. Originally a Motocross racer, at the age of 20, Roach taught himself to play the synthesizer after being inspired by the music of Tangerine Dream, Klaus Schulze, and Vangelis. His debut album Now appeared in 1982, followed by Structures from Silence in 1984; in 1988, he released his acclaimed Quiet Music series, along with what has been described by critics as his masterpiece: the double-album Dreamtime Return.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "paqueradejere"]}, {"n": 109, "title": "Double Nickels on the Dime", "artist": "Minutemen", "year": 1984, "cover": "https://dn721804.ca.archive.org/0/items/mbid-e7e28af9-2f2e-46c9-a08f-5e6215054a5e/mbid-e7e28af9-2f2e-46c9-a08f-5e6215054a5e-35983126748.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6334-minutemen-double-nickels-on-the-dime.php", "aoty_critic_score": 88, "aoty_user_score": 83, "mbid": "0bcb9f3e-e341-3ed5-ac5b-8ed5e17f9a7e", "yt_id": "hDKzcjyUzdI", "rym": "https://rateyourmusic.com/release/album/minutemen/double-nickels-on-the-dime/", "genres": ["alternative rock", "post-punk", "art punk", "punk", "hardcore punk", "post-hardcore"], "desc_lfm_album": "Double Nickels on the Dime is the third studio album by American punk trio Minutemen, released on the Californian independent record label SST Records in 1984. A double album containing 45 songs, Double Nickels on the Dime combines elements of punk rock, funk, country, spoken word and jazz, and references a variety of themes, from the Vietnam War and racism in America, to working class experience and linguistics. After recording new material, the band each selected songs for different sides of the double album, with the fourth side named \"Chaff\". Several songs on Double Nickels on the Dime were outsourced .", "desc_lfm_artist": "The Minutemen was an American punk rock trio which formed in 1980 in San Pedro, California, United States. The band comprised guitarist/vocalist D Boon and his childhood friend, bassist/vocalist Mike Watt, along with a former high school classmate on drums, George Hurley.\n\nThe group played funk influenced punk rock music in the early 1980s, never finding (or even seeking) much mainstream success but influencing many subsequent musicians. The group ended when Boon died in an automobile accident in Arizona in December 1985.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 110, "title": "Zen Arcade", "artist": "Husker Du", "year": 1984, "cover": "https://dn721606.ca.archive.org/0/items/mbid-e4da20c7-5507-4c21-a5ec-38ef8e7fedd9/mbid-e4da20c7-5507-4c21-a5ec-38ef8e7fedd9-37200598279.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "ce6f4b2d-a51a-35ac-992f-3657e7c531d5", "yt_id": "HualcSACLI4", "rym": "https://rateyourmusic.com/release/album/husker-du/zen-arcade", "genres": ["alternative rock", "psychedelic", "punk", "hardcore punk", "indie rock", "post-hardcore"], "desc_lfm_album": "", "desc_lfm_artist": "Hüsker Dü was an American punk rock band formed in Minneapolis-St. Paul, Minnesota in 1979. The band's continual members were guitarist Bob Mould, bassist Greg Norton, and drummer Grant Hart. Hüsker Dü never achieved mainstream success, but attained an influence far larger than their modest sales figures would indicate. Following a series of successful albums, including Zen Arcade (1984) and New Day Rising (1985), the band signed to Warner Bros.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 111, "title": "Purple Rain", "artist": "Prince and The Revolution", "year": 1984, "cover": "https://dn721603.ca.archive.org/0/items/mbid-7f5ab932-6dc9-4bf3-a127-cb4fe2abeb62/mbid-7f5ab932-6dc9-4bf3-a127-cb4fe2abeb62-39157761364.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6376-prince-and-the-revolution-purple-rain.php", "aoty_critic_score": 96, "aoty_user_score": 91, "mbid": "b93a7c47-a6d4-33f2-9034-53fdd991f4ba", "yt_id": "81jraQDTJJk", "rym": null, "genres": ["pop rock", "r&b", "funk", "contemporary r&b", "dance-pop", "dance-rock"], "desc_lfm_album": "", "desc_lfm_artist": "Prince formed The Revolution in Minneapolis, Minnesota in 1979 as his backing band for his first concert tour. The original lineup consisted of Gayle Chapman on keyboards, André Cymone on bass, Dez Dickerson on guitar, Doctor Fink on keyboards and Bobby Z. on drums & percussion.\n\nThe band went nameless for almost three years while supporting Prince live and appearing in his music videos. Chapman and Cymone left in the early 1980's and were replaced by Lisa Coleman on keyboards and Brownmark on bass.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 112, "title": "Born in the U.S.A.", "artist": "Bruce Springsteen", "year": 1984, "cover": "https://dn710703.ca.archive.org/0/items/mbid-25f0fa1b-ae04-479a-a182-18a655ff6040/mbid-25f0fa1b-ae04-479a-a182-18a655ff6040-22071692146.png", "aoty_url": "https://www.albumoftheyear.org/album/5607-bruce-springsteen-born-in-the-usa.php", "aoty_critic_score": 97, "aoty_user_score": 83, "mbid": "3c39a076-8e52-38f2-8076-260d0672fb23", "yt_id": "tRx212PUa4g", "rym": "https://rateyourmusic.com/release/album/bruce-springsteen/born-in-the-u_s_a", "genres": ["folk rock", "garage rock", "classic rock", "pop rock", "heartland rock", "aor"], "desc_lfm_album": "Born in the U.S.A. is the seventh studio album by rock singer-songwriter Bruce Springsteen, released on June 4, 1984. Often considered his most popular and commercial triumph, it saw Springsteen (in contrast to his previous album, the critical favorite Nebraska) experimenting with anthemic arrangements and a 1980s production incorporating a radio-friendly sound that was embraced warmly by both critics and the audience. Springsteen also delivered a new look to his public – he was reintroduced as a tougher and muscular rock star after two years of running and bodybuilding. These efforts and innovative strategies resulted in Springsteen's peak of commercial .", "desc_lfm_artist": "Bruce Frederick Joseph Springsteen (born September 23, 1949) is an American rock singer, songwriter, and guitarist. Nicknamed \"the Boss\", he has released 21 studio albums during a career spanning six decades, most of which feature his backing band, the E Street Band. Springsteen is a pioneer of heartland rock, a genre combining mainstream rock music with poetic and socially conscious lyrics that feature narratives primarily concerning working class American life.", "desc_mb_album": "", "desc_mb_artist": "You will find the most comprehensive information about '''Bruce Springsteen''' at '''''[http://brucebase.wikidot.com/|BruceBase Wiki]''''' and '''''[http://www.springsteenlyrics.com|SpringsteenLyrics.com]'''''\n\nThe '''''versioning''''' information for '''''studio recordings''''' is taken from the '''[http://brucebase.wikidot.com/stats:on-the-tracks|A studio guide to Bruce Springsteen]''' on the different '''''On The Tracks - recording sessions information''''' pages.", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 113, "title": "Songs From Suicide Bridge", "artist": "David Kauffman / Eric Caboor", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2015/32889-songs-from-suicide-bridge.jpg", "aoty_url": "https://www.albumoftheyear.org/album/32889-david-kauffman-eric-caboor-songs-from-suicide-bridge.php", "aoty_critic_score": 77, "aoty_user_score": 87, "mbid": null, "yt_id": "4r74e1mzdzg", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["armandwave"]}, {"n": 114, "title": "Legend: The Best of Bob Marley and the Wailers", "artist": "Bob Marley & The Wailers", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/37232-legend.jpg", "aoty_url": "https://www.albumoftheyear.org/album/37232-bob-marley-and-the-wailers-legend-the-best-of-bob-marley-and-the-wailers.php", "aoty_critic_score": 98, "aoty_user_score": 90, "mbid": "1a4c52cd-483a-347c-93f9-4d512767c7ba", "yt_id": "c5Ye4TI_qL8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Bob Marley and the Wailers (previously known as The Wailers, and prior to that The Wailing Rudeboys, The Wailing Wailers and The Teenagers) were a Jamaican ska, rocksteady and reggae band. The founding members, in 1963, were Bob Marley (Robert Nesta Marley), Peter Tosh (Hubert Winston McIntosh), and Bunny Wailer (Neville Livingston).\n\nDuring 1970 and 1971, Wailer, Marley and Tosh worked with renowned reggae producers Leslie Kong and Lee \"Scratch\" Perry.", "desc_mb_album": "", "desc_mb_artist": "Releases under \"Bob Marley & The Wailers\" belong here, '''no matter the band lineup'''.  \r\n\r\nReleases under \"The Wailing Wailers\", \"The Wailers\", or \"Marley, Tosh, Livingston & Associates\" belong under [http://musicbrainz.org/artist/c9e99d40-4a2c-4ca7-ac5b-e842264ee271.html|\"The Wailing Wailers\"], '''unless''' the track or release was produced by Lee \"Scratch\" Perry, in which case it ought to be listed here, not there.\r\n\r\nReleases by The Wailers Band after Bob Marley's death belong under [http://musicbrainz.org/artist/1e46801d-c27b-4f07-a50d-51597a26df60.html|\"The Wailers Band\"].\r\n\r\nSolo releases by [http://musicbrainz.org/artist/ed2ac1e9-d51d-4eff-a2c2-85e81abd6360.html|Bob Marley], [http://musicbrainz.org/artist/7db6aae5-6644-4513-9bfc-ca2e79d4469c.html|Peter Tosh], or [http://musicbrain", "heard_by": ["MaxtorUwU", "alberto_gu", "armandwave"]}, {"n": 115, "title": "Reckoning", "artist": "R.E.M.", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6102-reckoning_214935.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6102-rem-reckoning.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "eec55734-1387-3aa3-af3d-ff0ae8083806", "yt_id": "PBPZc_NCX3Q", "rym": "https://rateyourmusic.com/release/album/r_e_m/reckoning", "genres": ["alternative rock", "indie rock", "jangle pop"], "desc_lfm_album": "Reckoning is the second album by the American alternative rock band R.E.M., released in 1984 by I.R.S. Records. Produced by Mitch Easter and Don Dixon, the album was recorded at Reflection Sound Studio in Charlotte, North Carolina over 16 days in December 1983 and January 1984. Dixon and Easter intended to capture the sound of R.E.M.'s live performances, and used binaural recording on several tracks. Singer Michael Stipe dealt with darker subject matter in his lyrics, and water imagery is a recurring theme on the record. Released to critical acclaim, Reckoning reached number 27 in the United States—where it was .", "desc_lfm_artist": "R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming.", "desc_mb_album": "", "desc_mb_artist": "Has a gigography and other dates at [http://www.remtimeline.com]", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 116, "title": "The Smiths", "artist": "Smiths", "year": 1984, "cover": "https://dn721605.ca.archive.org/0/items/mbid-0299e566-f951-440f-bb63-8d6608aff482/mbid-0299e566-f951-440f-bb63-8d6608aff482-6126735758.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "91811b68-aa6e-35b3-a5e1-6a2733eb6ae9", "yt_id": "93ag_2sxmPE", "rym": null, "genres": ["alternative rock", "indie rock", "indie pop", "jangle pop"], "desc_lfm_album": "", "desc_lfm_artist": "Incorrect tag for The Smiths. Keep stats clean by fixing your ID3 tags, or leave auto-correction on. Don't cheat the artist of plays and listeners...", "desc_mb_album": "Some versions include ''This Charming Man'', some don't.", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 117, "title": "Defenders of the Faith", "artist": "Judas Priest", "year": 1984, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22382-defenders-of-the-faith.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22382-judas-priest-defenders-of-the-faith.php", "aoty_critic_score": 73, "aoty_user_score": 82, "mbid": "a00ff762-f474-39f0-9fa2-b5e24db7fd97", "yt_id": "Jkt-aCNjPPY", "rym": "https://rateyourmusic.com/release/album/judas-priest/defenders-of-the-faith", "genres": [], "desc_lfm_album": "Defenders of the Faith is the ninth studio album by British heavy metal band Judas Priest. Three tracks were released as singles: \"Freewheel Burning\", \"Some Heads Are Gonna Roll\" and \"Love Bites\". The album was certified Platinum by the RIAA. .", "desc_lfm_artist": "Judas Priest is an English heavy metal band formed in Birmingham in 1969. They have sold over 50 million albums and are considered a significant influence within the heavy metal genre. The band has been associated with the new wave of British heavy metal movement and has influenced various metal subgenres, including speed metal, thrash metal, and power metal, as well as aspects of the hard rock and glam metal scenes of the 1980s. Despite producing innovative music in the latter half of the 1970s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario"]}, {"n": 118, "title": "Timely!!", "artist": "杏里 [Anri]", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/130785-timely_173308.jpg", "aoty_url": "https://www.albumoftheyear.org/album/130785--anri-timely.php", "aoty_critic_score": 88, "aoty_user_score": null, "mbid": null, "yt_id": "fp2psphgAK4", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["Lonsonxd", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 119, "title": "Clics Modernos", "artist": "Charly García", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/102226-clics-modernos-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/102226-charly-garcia-clics-modernos.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": "33eaf398-1164-32e3-9055-3bcbff8f3b12", "yt_id": "f_A_wgu5YD4", "rym": null, "genres": [], "desc_lfm_album": "Clics Modernos is the second studio album by Argentine singer and multi-instrumentalist Charly García, published on November 5, 1983 by the company SG Discos, with the participation of Pedro Aznar, with whom he had already worked together in Serú Girán, as well as with sound engineer Joe Blaney. Considered by some to be the best fruit of his career, it includes references to the Argentine civic-military dictatorship that existed until shortly before the album's release, with lyrics characterized by their sarcastic and humorous tone. It was a decisive work to consolidate the modern trends that would mark the profile of .", "desc_lfm_artist": "One of the most important rock and pop musicians in Latin America, Carlos Alberto García Moreno, better known as Charly García is a keyboardist, guitarist and singer-songwriter, born in Buenos Aires, Argentina in 1951. \n\nA former member of the legendary bands Sui Generis (1972-1975), Porsuigieco (1976), La Máquina de Hacer Pájaros (1977-1978) and Serú Girán (1978-1982), García has behind him a 40-year musical career that includes these bands -and his solo work- that carries on to this day.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 120, "title": "Vigilante", "artist": "Willie Colón & Héctor Lavoe", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0
