nventional language.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 122, "title": "Swordfishtrombones", "artist": "Tom Waits", "year": 1983, "cover": "https://dn710204.ca.archive.org/0/items/mbid-96e3f43d-3f48-44a0-9f74-5d90d887c114/mbid-96e3f43d-3f48-44a0-9f74-5d90d887c114-35993860707.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5896-tom-waits-swordfishtrombones.php", "aoty_critic_score": 95, "aoty_user_score": 83, "mbid": "c791b365-0400-3926-be67-d1d9c71fc37e", "yt_id": "vaTSQzYIR3U", "rym": "https://rateyourmusic.com/release/album/tom-waits/swordfishtrombones", "genres": ["experimental rock", "blues rock", "alternative rock", "blues", "jazz rock", "jazz"], "desc_lfm_album": "Swordfishtrombones is an album by American singer-songwriter Tom Waits, released in September 1983. It was the first album that Waits produced himself and is marked as such by a sense of artistic freedom that would increasingly characterize his later work. Stylistically different from his previous LPs, Swordfishtrombones moves away from the piano and string orchestra arrangements of the late seventies replacing them instead with unusual instrumentation and a somewhat more abstract songwriting approach. Swordfishtrombones peaked at #164 on Billboard's Pop Albums and Billboard 200 albums chart. In 1989, Spin Magazine named Swordfishtrombones the second greatest album of all time. .", "desc_lfm_artist": "Tom Waits (born Thomas Alan Waits, in Pomona, California, on December 7, 1949) is a prolific American singer, songwriter, composer, and actor.\n\nHe started his career in the early 1970s as a singer in spit 'n' sawdust bars. Initially, he was deeply influenced by the beat generation, novelists like Jack Kerouac and William S. Burroughs, and poets like Allen Ginsberg and Charles Bukowski.  Waits is often compared to Charles Bukowski, being similar both in content and lifestyle", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 123, "title": "Hi, How Are You", "artist": "Daniel Johnston", "year": 1983, "cover": "https://dn710602.ca.archive.org/0/items/mbid-ba13ed1d-39a3-3416-8b0c-a8cfd38c322c/mbid-ba13ed1d-39a3-3416-8b0c-a8cfd38c322c-21533247440.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "22a18813-ca1b-3458-9e9f-a147d8ac5314", "yt_id": "AW2cmIIomac", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Daniel Johnston (born Daniel Dale Johnston in Sacramento, CA, on 22 January 1961; died in Waller, TX, on 10 September 2019) was an American singer-songwriter and visual artist regarded as a significant figure in outsider, lo-fi, and alternative music scenes. Most of his work consisted of cassettes recorded alone in his home, and his music was frequently cited for its \"pure\" and \"childlike\" qualities. His music has been acclaimed by many artists including David Bowie, Sonic Youth, and Simpsons creator Matt Groening.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 124, "title": "Script of the Bridge", "artist": "The Chameleons", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11992-script-of-the-bridge-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11992-the-chameleons-script-of-the-bridge.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "800508e1-5174-3f58-9fb5-35f469b677ed", "yt_id": "AJn2XAnKQfw", "rym": "https://rateyourmusic.com/release/album/the-chameleons/script-of-the-bridge/", "genres": [], "desc_lfm_album": "The Chameleons' debut album came out in 1983 and is one of the seminal post-punk records. Three singles were released from the album: \"Up the Down Escalator\", \"As High as You Can Go\" and \"A Person Isn't Safe Anywhere These Days\". \"Don't Fall\" was additionally released as a promo single in France. .", "desc_lfm_artist": "The Chameleons (called The Chameleons UK on some American releases) is a post-punk band that formed in Middleton, Greater Manchester, England, UK in 1981. They consisted of singer and bassist Mark Burgess, guitarist Reg Smithies, guitarist Dave Fielding, and drummer John Lever.\n\nThe band initially released three studio albums in the 1980s, to solid critical acclaim. After their third release, Strange Times, in 1987 they abruptly disbanded following the sudden death of band manager Tony Fletcher.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 125, "title": "Kill 'Em All", "artist": "Metallica", "year": 1983, "cover": "https://dn710707.ca.archive.org/0/items/mbid-0d099294-ec29-4d0b-821d-202a32c85a14/mbid-0d099294-ec29-4d0b-821d-202a32c85a14-25181401889.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5558-metallica-kill-em-all.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "f44f4f73-a714-31a1-a4b8-bfcaaf311f50", "yt_id": "Iu5RT-3Kk08", "rym": "https://rateyourmusic.com/release/album/metallica/kill-em-all", "genres": ["hard rock", "heavy metal", "metal", "thrash metal", "speed metal"], "desc_lfm_album": "\"Kill 'Em All\" is the debut album by the American heavy metal band Metallica, released on July 25, 1983, through the independent label Megaforce Records. After forming in 1981, Metallica initially played in local clubs in Los Angeles and recorded several demo tapes to attract attention from promoters. The band later relocated to San Francisco to recruit bassist Cliff Burton. Their 1982 demo \"No Life ’til Leather\" caught the attention of Megaforce Records founder Jon Zazula, who signed the group and provided a budget of $15,000 (equivalent to $48,835.49 in 2025) for recording. The album was recorded in May 1983 .", "desc_lfm_artist": "Metallica is an American heavy metal band formed in Los Angeles in 1981 by James Hetfield and Lars Ulrich and later based in San Francisco. Known for fast tempos, complex instrumentals and aggressive musicianship, the group became one of the founding big four bands of thrash metal alongside Megadeth, Anthrax and Slayer. The current lineup consists of Hetfield, Ulrich, Kirk Hammett and Robert Trujillo. Former members include Dave Mustaine, Ron McGovney, Cliff Burton and Jason Newsted.", "desc_mb_album": "", "desc_mb_artist": "'''Attention!''' The album known sometimes as ''The Black Album'' is already in this database, it is correctly named simply ''[http://musicbrainz.org/release-group/e8f70201-8899-3f0c-9e07-5d6495bc8046.html|Metallica]''. This is because ''The Black Album'' is only a fan-composed name. Please do not add it or rename it.\r\n\r\nBoth the infamous ''Garage Days'' (in the EPs section) and ''[http://musicbrainz.org/release-group/49371adc-871d-38f6-bb60-fd9e5af6795f.html|S&M]'' (in the Live section) are also here, they're just a bit scattered. \r\n\r\nMetallica has been selling Official/Live concert recordings on [http://www.livemetallica.com] since 2004-03-02.  Please add a \"X can be purchased for download at Y\" relationship if you add one of these releases.  For a list of which shows have already been a", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 126, "title": "Suicidal Tendencies", "artist": "Suicidal Tendencies", "year": 1983, "cover": "https://dn710906.ca.archive.org/0/items/mbid-8a59e142-c96f-4e66-ac78-b65679811421/mbid-8a59e142-c96f-4e66-ac78-b65679811421-26006542659.png", "aoty_url": "https://www.albumoftheyear.org/album/56092-suicidal-tendencies-suicidal-tendencies.php", "aoty_critic_score": 70, "aoty_user_score": 81, "mbid": "81308511-4b3d-36e8-8cee-c4f2209f97e6", "yt_id": "9cOMWuqKzM0", "rym": "https://rateyourmusic.com/release/album/suicidal-tendencies/suicidal-tendencies", "genres": ["punk", "punk rock", "hardcore punk", "skate punk", "rock"], "desc_lfm_album": "Released 1983, Suicidal Tendencies is the self titled debut album by Mike \"Cyco Miko\" Muir lead metal band Suicidal Tendencies. .", "desc_lfm_artist": "Suicidal Tendencies is an American hardcore band formed in 1980 in Venice, California, by vocalist Mike Muir, who is the only remaining original member of the band. They are often credited as one of the originators of crossover thrash. The current lineup includes Muir, guitarists Dean Pleasants and Ben Weinman, bassist Tye Trujillo and drummer Greyson Nekrutman. Notable musicians who have contributed to the band's studio or live activities include guitarists Rocky George and Mike Clark", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 127, "title": "Apollo: Atmospheres & Soundtracks", "artist": "Brian Eno", "year": 1983, "cover": "https://ia801009.us.archive.org/32/items/mbid-4eb3c757-cdd7-4e05-928b-3da135aaf40a/mbid-4eb3c757-cdd7-4e05-928b-3da135aaf40a-5478192277.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "03fe7fe6-2d96-3b40-816d-885b5118107e", "yt_id": "jTvlcsSKtF0", "rym": null, "genres": ["space ambient"], "desc_lfm_album": "", "desc_lfm_artist": "Brian Peter George Eno (b. 15 May 1948) is an English musician, record producer, visual artist, and theorist best known for his pioneering work in ambient music and contributions to rock, pop, and electronica. A self-described \"non-musician\", Eno has helped introduce unique conceptual approaches and recording techniques to contemporary music. He has been described as one of popular music's most influential and innovative figures.\n\nBorn in Suffolk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "paqueradejere"]}, {"n": 128, "title": "Speaking in Tongues", "artist": "Talking Heads", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5861-speaking-in-tongues_154839.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5861-talking-heads-speaking-in-tongues.php", "aoty_critic_score": 86, "aoty_user_score": 87, "mbid": "8a7a9db3-f87b-37d5-96a6-67485a8792e6", "yt_id": "T1gHnr5HBck", "rym": "https://rateyourmusic.com/release/album/talking-heads/speaking-in-tongues", "genres": [], "desc_lfm_album": "\"Speaking in Tongues\" is the fifth studio album by American rock band Talking Heads, released on June 1, 1983, by Sire Records. After their split with producer Brian Eno and a short hiatus, which allowed the individual members to pursue side projects, recording began in 1982. It became the band's commercial breakthrough and produced the band's sole US top-ten hit, \"Burning Down the House\". The album's tour was documented in Jonathan Demme's 1984 film Stop Making Sense, which generated a live album of the same name. The album also crossed over to the dance charts, where it peaked at number .", "desc_lfm_artist": "Talking Heads were an American rock band formed in New York City in 1975. The group consisted of vocalist and guitarist David Byrne, drummer Chris Frantz, bassist Tina Weymouth, and guitarist and keyboardist Jerry Harrison. The band is often associated with the development of new wave music, combining elements of punk rock, art rock, funk, and world music with a distinctive visual and artistic style.\n\nDavid Byrne, Chris Frantz, and Tina Weymouth met while studying at the Rhode Island School of Design", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 129, "title": "浮遊空間 [Fuyū-kūkan]", "artist": "亜蘭知子 [Tomoko Aran]", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/113551-fuyuu-kuukan.jpg", "aoty_url": "https://www.albumoftheyear.org/album/113551--tomoko-aran--fuy-kkan.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": null, "yt_id": "7qe1IioF4Ls", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 130, "title": "Holy Diver", "artist": "Dio", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/25306-holy-diver_152101.jpg", "aoty_url": "https://www.albumoftheyear.org/album/25306-dio-holy-diver.php", "aoty_critic_score": 77, "aoty_user_score": 83, "mbid": "4e7b34de-0d87-356a-a3da-b21f769b7d4d", "yt_id": "f_T8v8imSV4", "rym": "https://rateyourmusic.com/release/album/dio/holy-diver/", "genres": [], "desc_lfm_album": "Holy Diver is American heavy metal band Dio's debut album. It was given rave reviews, and is considered a classic in the world of metal. History Released on May 25, 1983, it has been hailed by critics as Dio's best work and a classic staple in the heavy metal genre.The album was eventually certified Gold in the US on September 12, 1984 and Platinum on March 21, 1989. The original vinyl release had a photo-montage LP-liner. The album was remastered and re-released by Rock Candy Records in 2005. The only notable addition to the original album is an audio interview .", "desc_lfm_artist": "Dio was an American heavy metal band formed in 1982 and led by vocalist Ronnie James Dio. Dio left Black Sabbath with intentions to form a new band with fellow former Black Sabbath drummer Vinny Appice. The name Dio was chosen because it made sense from a commercial standpoint, as the name was already well known at that time. The band released ten studio albums and had numerous lineup changes over the years, with Dio himself being the only constant member.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 131, "title": "Piece of Mind", "artist": "Iron Maiden", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12158-piece-of-mind_045748.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12158-iron-maiden-piece-of-mind.php", "aoty_critic_score": 76, "aoty_user_score": 81, "mbid": "169361b5-af6f-34ca-b8f2-13605a7f9691", "yt_id": "WwHrqjFrFI8", "rym": "https://rateyourmusic.com/release/album/iron-maiden/piece-of-mind", "genres": [], "desc_lfm_album": "Piece of Mind is the fourth studio album by British heavy metal band Iron Maiden. It was originally released in 1983 (see 1983 in music) on EMI, and on Capitol in the US; it was reissued later on Sanctuary/Columbia Records. It was the first album to feature drummer Nicko McBrain, who had recently left the Paris-based band Trust. \"The Trooper\" remains as one of the most popular songs in the band's history, and has been included in the set list of all of the band's concert tours since the album's release. During the Blaze Bayley era, it was used as .", "desc_lfm_artist": "Iron Maiden is an English heavy metal band formed in Leyton, East London, in 1975 by bassist and primary songwriter Steve Harris. Although the lineup changed several times in the early years, it has remained stable for most of the band’s history with Harris, lead vocalist Bruce Dickinson, drummer Nicko McBrain, and guitarists Dave Murray, Adrian Smith, and Janick Gers.\n\nAs pioneers of the new wave of British heavy metal movement, Iron Maiden achieved", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 132, "title": "Power, Corruption & Lies", "artist": "New Order", "year": 1983, "cover": "https://dn711304.ca.archive.org/0/items/mbid-2cc43c63-46ca-48ae-aeed-74bb06034657/mbid-2cc43c63-46ca-48ae-aeed-74bb06034657-19203523471.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5331-new-order-power-corruption-lies.php", "aoty_critic_score": 83, "aoty_user_score": 83, "mbid": "16cc9dfc-594d-3fb9-b789-3e1bfcb6f9f8", "yt_id": "gG9fEaITgCk", "rym": "https://rateyourmusic.com/release/album/new-order/power-corruption-and-lies-25/", "genres": ["post-punk", "new wave", "synth-pop", "rock", "electronic"], "desc_lfm_album": "Power, Corruption & Lies is the second studio album by English rock band New Order, released on 2 May 1983 by Factory Records. The album features more electronic tracks than their 1981 debut Movement, with heavier use of synthesizers. The album was met with widespread acclaim, and has been included in music industry lists of the greatest albums of the 1980s and of all time. The cover artwork was by Peter Saville, and in 2010 it was one of ten classic album covers from British artists commemorated on a UK postage stamp issued by the Royal Mail. .", "desc_lfm_artist": "New Order is an English new wave/synthpop band which formed in 1980 in Salford, England, United Kingdom by the three remaining members of Joy Division. The band's classic lineup consists of Bernard Sumner (vocals, guitar, keyboards), Peter Hook (bass, electronic percussion), Gillian Gilbert (keyboards, guitar) and Stephen Morris (drums, keyboards). The group effectively disbanded in 1993 but reformed in 1998. Gilbert left in 2001 to look after her and Morris' children and was replaced by guitarist/keyboardist Phil Cunningham.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 133, "title": "Violent Femmes", "artist": "Violent Femmes", "year": 1982, "cover": "https://dn711002.ca.archive.org/0/items/mbid-47db7a62-72b5-458d-9877-efd463a13f32/mbid-47db7a62-72b5-458d-9877-efd463a13f32-12976739273.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6384-violent-femmes-violent-femmes.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "616a1d80-83d0-3234-bf71-fe3de8109f99", "yt_id": "JE-dqW4uBEE", "rym": "https://rateyourmusic.com/release/album/violent-femmes/violent-femmes", "genres": ["folk rock", "alternative rock", "post-punk", "new wave", "indie rock", "folk punk"], "desc_lfm_album": "Violent Femmes is the debut album by Violent Femmes. Mostly recorded in July 1982, the album was released by Slash Records on vinyl and on cassette in April 1983, and on CD in 1987 with two extra tracks \"Ugly\" and \"Gimme the Car\". In 2002, Rhino Records remastered the album, filled out the disc's length with demos, and added another disc of live tracks and a radio interview for a 20th anniversary special edition, with liner notes by Michael Azerrad. Violent Femmes is the band's most successful album to date and went platinum eight years after its release. Slant Magazine .", "desc_lfm_artist": "Violent Femmes is an American alternative rock band, formed in Milwaukee, Wisconsin, United States in 1980. The band originally consisted of Gordon Gano (vocals, guitar), Brian Ritchie (bass), and Victor DeLorenzo (drums), with Guy Hoffman replacing DeLorenzo following his departure starting in 1993 and up until his return in 2002. The band split in early 2009, their last recording being a cover of the Gnarls Barkley song \"Crazy\", a response to Gnarls Barkley's cover of the Femmes song \"Gone Daddy Gone\" released the previous year.", "desc_mb_album": "Australian (?) release data: '''Date:''' 2002 - '''Label:''' Rhino - '''Cat#:''' 8122782422 - '''Barcode:''' 9325583016059 - '''Format:''' 2xCD", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 134, "title": "Murmur", "artist": "R.E.M.", "year": 1983, "cover": "https://dn710703.ca.archive.org/0/items/mbid-2a880c98-e963-363e-857c-8f8c5a963eb9/mbid-2a880c98-e963-363e-857c-8f8c5a963eb9-24587105982.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6101-rem-murmur.php", "aoty_critic_score": 94, "aoty_user_score": 82, "mbid": "de790d3d-a35c-364c-a8fb-adfb73084a45", "yt_id": "YyMBckBuhqI", "rym": "https://rateyourmusic.com/release/album/r_e_m/murmur", "genres": ["alternative rock", "post-punk", "jangle pop", "rock"], "desc_lfm_album": "The debut album from Athens, Georgia band R.E.M., Murmur was an immediate underground smash, with \"Radio Free Europe\" topping the college radio charts and \"Catapult\" following it into the top 10. The album is considered a key release in the revival of underground guitar rock and the transition from post-punk and new wave to alternative rock. Murmur is the debut album by the American alternative rock band R.E.M., released in 1983 on I.R.S. Records. Murmur drew critical acclaim upon its release for its sound, defined by singer Michael Stipe's cryptic lyrics, guitarist Peter Buck's jangly guitar style, and bassist Mike .", "desc_lfm_artist": "R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming.", "desc_mb_album": "", "desc_mb_artist": "Has a gigography and other dates at [http://www.remtimeline.com]", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 135, "title": "Out of Step", "artist": "Minor Threat", "year": 1983, "cover": "https://dn711103.ca.archive.org/0/items/mbid-507bb61e-c7fa-3dd5-ba2d-d6f0f6e2f792/mbid-507bb61e-c7fa-3dd5-ba2d-d6f0f6e2f792-6010164584.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6374-minor-threat-out-of-step.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "db4d417f-8295-3843-829d-2b8c0b649517", "yt_id": "eLP8lOcxjPQ", "rym": "https://rateyourmusic.com/release/ep/minor-threat/out-of-step", "genres": ["punk", "hardcore punk", "rock"], "desc_lfm_album": "", "desc_lfm_artist": "Minor Threat was an American hardcore punk band formed in Washington DC in 1980. Short-lived but very influential, critics have called the band and their work \"iconic,\" and have noted that their \"groundbreaking\" music \"has held up better than [that of] most of their contemporaries.\" Minor Threat is credited with unintentionally starting the \"straight edge movement\" from a handful of song lyrics.\n\nThey and fellow Washington DC residents Bad Brains set the standard for many hardcore punk bands in the 1980s and 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "armandwave", "sdecandelario"]}, {"n": 136, "title": "The Hurting", "artist": "Tears for Fears", "year": 1983, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10598-the-hurting_162306.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10598-tears-for-fears-the-hurting.php", "aoty_critic_score": 75, "aoty_user_score": 82, "mbid": "6901aa79-3c37-32eb-8bd2-4061049b40c5", "yt_id": "4PiJKje2lwg", "rym": "https://rateyourmusic.com/release/album/tears-for-fears/the-hurting/", "genres": [], "desc_lfm_album": "The Hurting is the debut album by the British new wave band Tears for Fears. It was released on 7 March 1983, and peaked at no. 1 on the UK Album Chart. The album was certified Gold by the BPI within three weeks of release, and reached Platinum status in January 1985. The album contains Tears For Fears' first three hit singles – \"Mad World\", \"Change\", and \"Pale Shelter\" – all of which reached the Top 5 in the UK. It also contains a new version of the band's first single, \"Suffer The Children\", which had originally been released in .", "desc_lfm_artist": "Tears for Fears are an English pop rock band formed in Bath, England, in 1981 by Roland Orzabal and Curt Smith. Founded after the dissolution of their first band, the mod-influenced Graduate, Tears for Fears were associated with the new wave synthesizer bands of the early 1980s, and attained international chart success.\n\nThe band's debut album, The Hurting (1983), reached number one on the UK Albums Chart, and their first three hit singles – \"Mad World\", \"Change\", and \"Pale Shelter\" – all reached the top five in the UK Singles Chart.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "verygooood"]}, {"n": 137, "title": "War", "artist": "U2", "year": 1983, "cover": "https://dn710103.ca.archive.org/0/items/mbid-3583fbc9-a597-35d3-a415-6bd0cfa34acc/mbid-3583fbc9-a597-35d3-a415-6bd0cfa34acc-1920414273.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4438-u2-war.php", "aoty_critic_score": 88, "aoty_user_score": 80, "mbid": "c6b36664-7e60-3b3e-a24d-d096c67a11e9", "yt_id": "nGWZYA4gwFc", "rym": "https://rateyourmusic.com/release/album/u2/war", "genres": ["alternative rock", "pop rock", "post-punk"], "desc_lfm_album": "War is the third studio album by Irish rock band U2, released on February 28, 1983 (1983-02-28). The album has come to be regarded as U2's first overtly political album, in part because of songs like \"Sunday Bloody Sunday\", \"New Year's Day\", as well as the title, which stems from the band's perception of the world at the time; Bono stated that \"war seemed to be the motif for 1982.\" While the central themes of their earlier albums Boy and October focused on adolescence and spirituality, respectively, War focused on both the physical aspects of warfare, and the emotional aftereffects. .", "desc_lfm_artist": "U2 are an Irish rock band formed in Dublin in 1976. The group comprises Paul \"Bono\" Hewson (lead vocals and rhythm guitar), David \"the Edge\" Evans (lead guitar, keyboards, and backing vocals), Adam Clayton (bass guitar), and Larry Mullen Jr. (drums and percussion). Initially rooted in post-punk, U2's musical style has evolved throughout their career, yet has maintained an anthemic quality built on Bono's expressive vocals and the Edge's chiming, effects-based guitar sounds.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 138, "title": "Thriller", "artist": "Michael Jackson", "year": 1981, "cover": "https://dn710605.ca.archive.org/0/items/mbid-e1b94ba6-c63c-4c2d-8928-9d1a525b7000/mbid-e1b94ba6-c63c-4c2d-8928-9d1a525b7000-22018478497.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6266-michael-jackson-thriller.php", "aoty_critic_score": 97, "aoty_user_score": 90, "mbid": "f32fab67-77dd-3937-addc-9062e28e4c37", "yt_id": "8KWf_-ofYgI", "rym": "https://rateyourmusic.com/release/album/michael-jackson/thriller/", "genres": ["r&b", "funk", "synth funk", "disco", "contemporary r&b", "pop soul"], "desc_lfm_album": "Thriller is the sixth studio album by American recording artist Michael Jackson. The album was released on November 30, 1982 by Epic Records as the follow-up to Jackson's critically and commercially successful 1979 album Off the Wall. Thriller explores similar genres to those of Off The Wall, including funk, disco, soul, soft rock, jazz and pop. However, Thriller's lyrics deal with generally darker themes, including paranoia and the supernatural. It is also the best-selling album of all time. With a production budget of $750,000, recording sessions took place between April and November 1982 at Westlake Recording Studios in Los Angeles, .", "desc_lfm_artist": "Michael Joseph Jackson (August 29, 1958 – June 25, 2009) was an American singer, songwriter, dancer, and philanthropist. Known as the \"King of Pop,\" he is widely recognized as one of the most influential figures in popular music during the 20th century. His career spanned more than four decades, during which he broke racial barriers in the music industry and became a global icon. Jackson popularized street dance moves such as the moonwalk, the robot", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 139, "title": "A Kiss in the Dreamhouse", "artist": "Siouxsie and the Banshees", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11982-a-kiss-in-the-dreamhouse_125751.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11982-siouxsie-and-the-banshees-a-kiss-in-the-dreamhouse.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "7b0c2e7b-c1f2-3914-8418-b92c0cb9f5d0", "yt_id": "9kx_yPYzEFc", "rym": null, "genres": [], "desc_lfm_album": "A Kiss in the Dreamhouse is the fifth studio album released by Siouxsie & the Banshees and was issued by Polydor Records in the UK in 1982. The album belongs to what critics and fans refer to as the Banshees' \"experimental\" phase, as it contains chimes, strings, synthesizers, and many vocal overdubs. The album was written, produced, and arranged by the band. Both a critical and commercial success, it peaked on the UK albums chart at number eleven. The Banshees claimed it to be their personal best, until the release of Peepshow in 1988. The album is also notable for .", "desc_lfm_artist": "Siouxsie and the Banshees was an influential English post-punk band which formed during 1976 in London. Initially associated with the British punk rock scene, the band quickly evolved to create, \"A form of post-punk discord full of daring rhythmic and sonic experimentation.\" The Times would also cite Siouxsie and the Banshees as, \"One of the most audacious and uncompromising musical adventurers of the post-punk era.\" After their split in the year 1996", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 140, "title": "Plastic Surgery Disasters", "artist": "Dead Kennedys", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7688-plastic-surgery-disasters_141911.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7688-dead-kennedys-plastic-surgery-disasters.php", "aoty_critic_score": 83, "aoty_user_score": 88, "mbid": "2194eb90-cedd-3c60-b93f-392bba3b588b", "yt_id": "WLZkeNjWgD8", "rym": "https://rateyourmusic.com/release/album/dead-kennedys/plastic-surgery-disasters", "genres": ["punk", "hardcore punk", "rock"], "desc_lfm_album": "Plastic Surgery Disasters is the second full-length album released by punk rock band Dead Kennedys. Recorded in San Francisco during June 1982, it was produced by the band and punk record producer Thom Wilson, with Geza X getting a \"special thanks\" underneath the DK's/Wilson credit for additional production. (DK's guitarist East Bay Ray redundantly added his own name to the production credits on Manifesto reissues of the album.) The album is darker and more hardcore-influenced than their debut album Fresh Fruit for Rotting Vegetables as a result of the band trying to expand on the sound and mood they had .", "desc_lfm_artist": "Dead Kennedys are an American punk rock band formed in San Francisco, California, in 1978. The band played a central role in shaping the American punk scene during its initial eight-year period.\n\nThe original lineup included lead guitarist East Bay Ray, bassist Klaus Flouride, lead vocalist Jello Biafra, drummer Ted, and rhythm guitarist 6025. 6025 left the band in 1979, and Ted departed in 1980 after the recording of their debut album, \"Fresh Fruit for Rotting Vegetables\" (1980).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 141, "title": "1999", "artist": "Prince", "year": 1982, "cover": "https://dn710204.ca.archive.org/0/items/mbid-ab9aa125-6f26-4145-879c-f0c05ff6ac60/mbid-ab9aa125-6f26-4145-879c-f0c05ff6ac60-16637994690.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6686-prince-1999.php", "aoty_critic_score": 92, "aoty_user_score": 86, "mbid": "561be5b7-a39c-3866-859d-d86f30816ae7", "yt_id": "4BQx0p1nVzg", "rym": "https://rateyourmusic.com/release/album/prince/1999", "genres": ["pop rock", "new wave", "funk", "synth-pop", "synth funk", "disco"], "desc_lfm_album": "1999 is the fifth album by Prince, released on October 27, 1982. It was his first top ten album on the Billboard 200 charts in the United States (peaking at number 9) and became the fifth best-selling album of 1983. 1999 was Prince's breakthrough album, but his next album Purple Rain would become his most successful. According to the Rolling Stone Album Guide, \"1999 may be Prince's most influential album: Its synth-and-drum machine-heavy arrangements codified the 'Minneapolis sound' that loomed over mid-'80s R&B and pop, not to mention the next two decades' worth of electro, house, and techno.\" In 2003, .", "desc_lfm_artist": "Prince Rogers Nelson (June 7, 1958 – April 21, 2016), more commonly known mononymously as Prince, was an American singer-songwriter, musician, and record producer. The recipient of numerous awards and nominations, he is widely regarded as one of the greatest musicians of his generation. He was known for his flamboyant, androgynous persona; his wide vocal range, which included a far-reaching falsetto and high-pitched screams; and his skill as a multi-instrumentalist, often preferring to play all or most of the instruments on his recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 142, "title": "Nebraska", "artist": "Bruce Springsteen", "year": 1982, "cover": "https://dn710701.ca.archive.org/0/items/mbid-093c881d-0c72-4e7d-b6da-16b2e51f2b64/mbid-093c881d-0c72-4e7d-b6da-16b2e51f2b64-1798738745.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5806-bruce-springsteen-nebraska.php", "aoty_critic_score": 81, "aoty_user_score": 84, "mbid": "324aee0c-36ec-35c1-9c93-b67a1d428037", "yt_id": "hCpL_ImsiDo", "rym": "https://rateyourmusic.com/release/album/bruce-springsteen/nebraska", "genres": ["folk rock", "folk", "contemporary folk", "rock", "folk, world, & country"], "desc_lfm_album": "Nebraska is the sixth studio album by Bruce Springsteen, released on September 30, 1982, by Columbia Records. Sparsely recorded on a 4-track cassette tape Portastudio 144, the songs on Nebraska were originally intended as demos of songs to be recorded with the E Street Band. However, Springsteen ultimately decided to release the demos himself. .", "desc_lfm_artist": "Bruce Frederick Joseph Springsteen (born September 23, 1949) is an American rock singer, songwriter, and guitarist. Nicknamed \"the Boss\", he has released 21 studio albums during a career spanning six decades, most of which feature his backing band, the E Street Band. Springsteen is a pioneer of heartland rock, a genre combining mainstream rock music with poetic and socially conscious lyrics that feature narratives primarily concerning working class American life.", "desc_mb_album": "", "desc_mb_artist": "You will find the most comprehensive information about '''Bruce Springsteen''' at '''''[http://brucebase.wikidot.com/|BruceBase Wiki]''''' and '''''[http://www.springsteenlyrics.com|SpringsteenLyrics.com]'''''\n\nThe '''''versioning''''' information for '''''studio recordings''''' is taken from the '''[http://brucebase.wikidot.com/stats:on-the-tracks|A studio guide to Bruce Springsteen]''' on the different '''''On The Tracks - recording sessions information''''' pages.", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 143, "title": "Love Over Gold", "artist": "Dire Straits", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15842-love-over-gold_182916.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15842-dire-straits-love-over-gold.php", "aoty_critic_score": 87, "aoty_user_score": 81, "mbid": "935dde7e-8390-39fa-8e0d-1350db96bc3f", "yt_id": "v2m4IaFfg4I", "rym": "https://rateyourmusic.com/release/album/dire-straits/love-over-gold", "genres": [], "desc_lfm_album": "Love over Gold is the fourth album by British rock band Dire Straits, released in 1982. Due to its lengthy atmospheric instrumental passages, it has been cited as the band's only album that resembles progressive rock, although not quite achieving it. Love over Gold sold 4.4 million copies in Europe and reached the gold status, in the U.S., only in 1986. It was remastered and released with the rest of the Dire Straits catalog in 1996 for most of the world on Vertigo Records outside the US and in 2000 in the United States. It is also the last album .", "desc_lfm_artist": "Dire Straits were a British rock band formed in London in 1977 by Mark Knopfler (lead vocals and lead guitar), David Knopfler (rhythm guitar and backing vocals), John Illsley (bass guitar and backing vocals), and Pick Withers (drums and percussion). They were active from 1977 to 1988 and again from 1990 to 1995.\n\nTheir first single, \"Sultans of Swing\", from their 1978 self-titled debut album, reached the top ten in the UK and US charts. It was followed by a series of hit singles including \"Romeo and Juliet\" (1981)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "armandwave"]}, {"n": 144, "title": "The Dreaming", "artist": "Kate Bush", "year": 1982, "cover": "https://dn710702.ca.archive.org/0/items/mbid-4f28a86b-86e9-358e-8cec-22018fd18000/mbid-4f28a86b-86e9-358e-8cec-22018fd18000-3779820454.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19413-kate-bush-the-dreaming.php", "aoty_critic_score": 81, "aoty_user_score": 88, "mbid": "d28777fc-f135-3394-a033-eafb9ebcffb4", "yt_id": "JWy8nONlh_Q", "rym": "https://rateyourmusic.com/release/album/kate-bush/the-dreaming", "genres": ["art rock", "pop rock", "art pop", "progressive pop", "soft rock", "rock"], "desc_lfm_album": "The Dreaming is the fourth studio album by the English singer Kate Bush, released on September 13, 1982 via EMI Records. Recorded over two years, the album was produced entirely by Bush and is often characterised as her most uncommercial and experimental release. The Dreaming peaked at No. 3 on the UK album chart and has been certified Silver by the BPI, but initially sold less than its predecessors and was met with mixed critical reception. Five singles from the album were released, including the UK No. 11 \"Sat in Your Lap\" and the title track. The critical standing of the album .", "desc_lfm_artist": "Catherine Bush (born 30 July 1958) is an English singer, songwriter, musician, dancer, and record producer. She is known for her eclectic musical style, literary and unconventional lyrics, and innovative use of dance and visual performance. Her work has influenced a wide range of artists across genres.\n\nBush began writing songs at the age of 11 and was later signed to EMI Records after David Gilmour of Pink Floyd helped fund a professional demo recording.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84"]}, {"n": 145, "title": "Screaming for Vengeance", "artist": "Judas Priest", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22383-screaming-for-vengeance_022425.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22383-judas-priest-screaming-for-vengeance.php", "aoty_critic_score": 72, "aoty_user_score": 81, "mbid": "40f3885e-7158-3154-826d-676f2b79c6fb", "yt_id": "poMjVcx68ec", "rym": "https://rateyourmusic.com/release/album/judas-priest/screaming-for-vengeance", "genres": [], "desc_lfm_album": "Screaming for Vengeance is the 8th studio album by British heavy metal band Judas Priest. The album featured a much more mainstream sound than previous albums. The album was recorded at Ibiza Sound Studios, Ibiza, Spain and mixed at Beejay Recording Studios and Bayshore Recording Studios in Florida. It was first released on July 17, 1982. A re-mastered CD was released in May 2001. The album reached #11 in the UK and #17 on Billboard 200 Pop Albums and made Judas Priest much more popular than they were after their British Steel album. It went Gold (RIAA) on October 29, .", "desc_lfm_artist": "Judas Priest is an English heavy metal band formed in Birmingham in 1969. They have sold over 50 million albums and are considered a significant influence within the heavy metal genre. The band has been associated with the new wave of British heavy metal movement and has influenced various metal subgenres, including speed metal, thrash metal, and power metal, as well as aspects of the hard rock and glam metal scenes of the 1980s. Despite producing innovative music in the latter half of the 1970s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 146, "title": "Eye in the Sky", "artist": "The Alan Parsons Project", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/42145-eye-in-the-sky-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/42145-the-alan-parsons-project-eye-in-the-sky.php", "aoty_critic_score": 93, "aoty_user_score": 82, "mbid": "c9137ca5-26bd-3374-bebc-a813fbfe9c4f", "yt_id": "j6Tz3LlrgTA", "rym": "https://rateyourmusic.com/release/album/the-alan-parsons-project/eye-in-the-sky", "genres": [], "desc_lfm_album": "\"Eye in the Sky\" is a 1982 album by \"The Alan Parsons Project\". Songs on this album are in a number of different styles, from cool and funky to lyrical and heavily orchestrated. The sleeve was green with an image of the \"Eye of Horus\", which was gold-foil stamped for early pressings of the LP. Variously reported as the band's best-selling album, although others claim that \"Ammonia Avenue\" gets this honor. Vocal performers were Eric Woolfson, David Paton, Chris Rainbow, Lenny Zakatek, Elmer Gantry and Colin Blunstone. \"Eye in the Sky\" contained the Project's greatest hit, the title track, which .", "desc_lfm_artist": "The Alan Parsons Project was a British rock group active from 1975 until 1990, founded by Alan Parsons and Eric Woolfson both from London, England. The group is based on a number of regular group members such as Stuart Elliot and Ian Bairnson, complemented with varying lead vocals such as Colin Blunstone (the Zombies), Chris Rainbow and Gary Brooker (Procol Harum).  The group is well known for its concept albums, which cover themes such as Edgar Allan Poe, Gaudi, and Freud.", "desc_mb_album": "", "desc_mb_artist": "Please note that '''The Time Machine''', '''On Air''' and '''Try Anything Once''' are not by '''The Alan Parsons Project''', and should be filed under the '''[https://musicbrainz.org/artist/9774cfd1-8862-42bd-919e-156c31f079b4|Alan Parsons]''' artist (the new name of the project after Eric Woolfson's departure).\n\nThe Alan Parsons Project was a studio-only group, and ''never'' performed live. Live recordings should be filed under either '''[https://musicbrainz.org/artist/9774cfd1-8862-42bd-919e-156c31f079b4|Alan Parsons]''' or '''[https://musicbrainz.org/artist/a6b68de3-ba6d-4280-b08f-52fb4fa002af|The Alan Parsons Live Project]'''.\n\nThe Album '''Live in Colombia''' is filed under '''[https://musicbrainz.org/artist/54b81bc2-7634-4e3e-bf9c-68936d4c5668|The Alan Parsons Symphonic Project]'''", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 147, "title": "Mint Jams", "artist": "Casiopea", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/87064-mint-jams.jpg", "aoty_url": "https://www.albumoftheyear.org/album/87064-casiopea-mint-jams.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "12dcc366-1eed-39e1-8fbc-5a827c77a7d3", "yt_id": "6GEI3PpXEAo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Casiopea/カシオペア are a Japanese jazz fusion band that was formed in 1976 by guitarist Issei Noro and bassist Tetsuo Sakurai. In 1977, keyboardist Minoru Mukaiya and drummer Takashi Sasaki joined the group. The group debuted with the album Casiopea in 1979, and 30 albums or more have since been released. In 1980, the drummer seat is replaced by 神保彰/Akira Jimbo.\n\nThe album Eyes of the Mind was released in the United States in 1981. They then released the album Mint Jams in 1982", "desc_mb_album": "", "desc_mb_artist": "The group was called CASIOPEA from 1979 to 2012. In 2012, the group renamed itself to CASIOPEA 3rd to reflect the changed composition of the band.", "heard_by": []}, {"n": 148, "title": "Rio", "artist": "Duran Duran", "year": 1982, "cover": "https://dn711103.ca.archive.org/0/items/mbid-cc94b244-c5d7-4c9f-823d-38b7cb74e048/mbid-cc94b244-c5d7-4c9f-823d-38b7cb74e048-15908224527.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6493-duran-duran-rio.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "3c638420-8208-3c01-b723-f061b10e3f3a", "yt_id": "ktIgy-LWwVM", "rym": "https://rateyourmusic.com/release/album/duran-duran/rio", "genres": ["new wave", "synth-pop", "trance", "new romantic"], "desc_lfm_album": "Rio is an album by Duran Duran, originally released worldwide on 10 May 1982, but re-released in November 1982 in the United States. It reached #2 in the UK and #1 in Australia. The album went gold in the US on 1 March 1983, and platinum on 26 April 1983, eventually reaching double platinum status. It peaked at number six on the Billboard 200 album chart in the US on March 12, 1983, and remained on the chart for 129 weeks. The first song to be recorded for Rio was \"My Own Way\", written and recorded in October 1981, and .", "desc_lfm_artist": "Duran Duran (named after a character in Roger Vadim's sci-fi classic, Barbarella) is an electronic  pop rock band that was part of the New Wave movement of the 80s and 90s. Duran Duran have sold over 100 million records, making them one of the world's best-selling music artists. They achieved 30 top 40 singles in the UK Singles Chart (14 of them top 10) and 21 top 40 singles in the US Billboard Hot 100. The band have won numerous awards throughout their career: two Brit Awards including the 2004 award for Outstanding Contribution to Music", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84",
