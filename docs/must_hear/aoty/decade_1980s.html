6-iron-maiden-the-number-of-the-beast.php", "aoty_critic_score": 88, "aoty_user_score": 85, "mbid": "4ebfe175-e7ed-34cd-8e91-67c7e4a53579", "yt_id": "gdAZjep01Ss", "rym": "https://rateyourmusic.com/release/album/iron-maiden/the-number-of-the-beast", "genres": ["heavy metal", "metal", "nwobhm", "rock"], "desc_lfm_album": "The Number of the Beast is the third studio album by British heavy metal band Iron Maiden. The album was released on March 29, 1982 through EMI. This was the debut of vocalist Bruce Dickinson in Iron Maiden. Number of the Beast has been cited as one of the most influential heavy metal albums of all-time, and is widely acknowledged as one of the best and most iconic albums of the genre. The Number of the Beast also cemented Iron Maiden as one of \"the biggest metal bands on the planet\". Of all the songs in the album, \"The Number .", "desc_lfm_artist": "Iron Maiden is an English heavy metal band formed in Leyton, East London, in 1975 by bassist and primary songwriter Steve Harris. Although the lineup changed several times in the early years, it has remained stable for most of the band’s history with Harris, lead vocalist Bruce Dickinson, drummer Nicko McBrain, and guitarists Dave Murray, Adrian Smith, and Janick Gers.\n\nAs pioneers of the new wave of British heavy metal movement, Iron Maiden achieved", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 152, "title": "On Land", "artist": "Brian Eno", "year": 1982, "cover": "https://dn711109.ca.archive.org/0/items/mbid-566a7f79-1aa6-4359-a106-a8a1a2c6d71b/mbid-566a7f79-1aa6-4359-a106-a8a1a2c6d71b-2013332527.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "dc8ebaf6-2524-3c62-9c11-9155fa460f42", "yt_id": "wHWgd7pQHRY", "rym": "https://rateyourmusic.com/release/album/brian-eno/ambient-4-on-land", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Brian Peter George Eno (b. 15 May 1948) is an English musician, record producer, visual artist, and theorist best known for his pioneering work in ambient music and contributions to rock, pop, and electronica. A self-described \"non-musician\", Eno has helped introduce unique conceptual approaches and recording techniques to contemporary music. He has been described as one of popular music's most influential and innovative figures.\n\nBorn in Suffolk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "paqueradejere"]}, {"n": 153, "title": "Walk Among Us", "artist": "Misfits", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19971-walk-among-us-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19971-misfits-walk-among-us.php", "aoty_critic_score": 91, "aoty_user_score": 80, "mbid": "f0a28cfc-0f99-3513-8720-005643bfd95e", "yt_id": "Zi4xKBfL3hY", "rym": "https://rateyourmusic.com/release/album/misfits/walk-among-us/", "genres": ["punk", "punk rock", "hardcore punk", "horror punk", "rock"], "desc_lfm_album": "Walk Among Us is the eighth release from the American horror punk band The Misfits. The band's first full-length album to be released (although it was actually the 3rd to be recorded, after Static Age and 12 Hits from Hell), it was originally co-released by Ruby and Slash Records as JRR804 in March 1982. It was the product of a January 1982 recording session at Quad Teck in Los Angeles, California in which Glenn Danzig, for the most part, remixed previously recorded songs, overdubbing additional guitar tracks. Danzig also recorded new vocals for \"Vampira\" and mixed for the first time .", "desc_lfm_artist": "The Misfits are an American punk rock band formed in Lodi, New Jersey in 1977. Often recognized as the progenitors of the horror punk subgenre, blending punk and other musical influences with horror film themes and imagery. The group was founded in 1977 in Lodi, New Jersey, by vocalist, songwriter and keyboardist Glenn Danzig, and drummer Manny Martínez. Jerry Only joined on bass guitar shortly after. Over the next six years, membership would change frequently with Danzig and Only the only consistent members.", "desc_mb_album": "", "desc_mb_artist": "Not to be confused with the original name used by the all girl punk-rockers, \"The Go-Go's\".", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 154, "title": "Glassworks", "artist": "Philip Glass", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/23531-glassworks-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/23531-philip-glass-glassworks.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "e05203e6-5344-3fac-91d7-cc403832a247", "yt_id": "6Stu7h7Qup8", "rym": "https://rateyourmusic.com/release/album/philip-glass/glassworks/", "genres": [], "desc_lfm_album": "In 1982 Philip Glass became the first composer since Aaron Copland to join the CBS Masterworks label. Glass had formed the Philip Glass Ensemble in 1968, but it wasn't until his opera Einstein on the Beach (1976) that he achieved great critical and popular success. His first album for Masterworks, Glassworks, tripled all sales projections, pleasing audiences, critics and Glass himself. \"Glassworks was my debut record on CBS. This music was written for the recording studio, though a number of the pieces soon found their way into the Ensemble repertory. A six-\"movement\" work, Glassworks was intended to introduce my music .", "desc_lfm_artist": "Philip Glass (born January 31, 1937) is an American composer. He is widely regarded as one of the most influential musicians of the late 20th century. Glass's work has been described as minimal music, having similar qualities to other \"minimalist\" composers such as La Monte Young, Steve Reich, and Terry Riley. Glass describes himself as a composer of \"music with repetitive structures\", which he has helped evolve stylistically.\n\nGlass founded the Philip Glass Ensemble, with which he still performs on keyboards.", "desc_mb_album": "", "desc_mb_artist": "Nominated for 2007 Film Composer of the Year in the World Soundtrack Academy awards.", "heard_by": ["EliasJ72", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 155, "title": "Bad Brains", "artist": "Bad Brains", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7680-bad-brains_125714.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7680-bad-brains-bad-brains.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "458f4bdf-ffbe-3643-977a-73e80d3d7b08", "yt_id": "Ga5ZbMMZ6Hk", "rym": "https://rateyourmusic.com/release/album/bad-brains/bad-brains/", "genres": ["punk", "hardcore punk", "reggae"], "desc_lfm_album": "Bad Brains (also known as The Yellow Tape or Attitude: The ROIR Sessions) is the debut studio album recorded by American Hardcore Punk band Bad Brains. Recorded in 1981 and released on the cassette-only label ROIR on February 5, 1982, many fans refer to it as \"The Yellow Tape\" because of its yellow packaging, much in the way that The Beatles' self-titled record is often called \"The White Album\". Though Bad Brains had recorded the 16 song Black Dots album in 1979 and the 5-song Omega Sessions EP in 1980, the ROIR cassette was the band's first release of anything .", "desc_lfm_artist": "Bad Brains is a punk rock band formed in Washington, D.C., USA in 1977. The band is regarded as one of the pioneers of hardcore punk, though band members have objected to the term to describe their music. They are also an adept reggae band, while later recordings featured elements of other genres like funk, heavy metal, hip-hop and soul. Bad Brains are followers of the Rastafari movement.\n\nOriginally formed as a jazz fusion ensemble under the name Mind Power", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 156, "title": "For You", "artist": "山下達郎 [Tatsuro Yamashita]", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/78837-for-you-3.jpg", "aoty_url": "https://www.albumoftheyear.org/album/78837--tatsuro-yamashita-for-you.php", "aoty_critic_score": 89, "aoty_user_score": null, "mbid": null, "yt_id": "dZ6tSggYWW4", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["EliasJ72", "paqueradejere"]}, {"n": 157, "title": "Wave Notation 1: Music for Nine Post Cards", "artist": "吉村弘 [Hiroshi Yoshimura]", "year": 1982, "cover": "https://cdn2.albumoftheyear.org/600x0/album/148750-wave-notation-1-music-for-nine-post-cards_030829.jpg", "aoty_url": "https://www.albumoftheyear.org/album/148750--hiroshi-yoshimura-wave-notation-1-music-for-nine-post-cards.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": null, "yt_id": "2FfbAzR5Y0A", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 158, "title": "In God We Trust, Inc.", "artist": "Dead Kennedys", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/36808-in-god-we-trust-inc.jpg", "aoty_url": "https://www.albumoftheyear.org/album/36808-dead-kennedys-in-god-we-trust-inc.php", "aoty_critic_score": 67, "aoty_user_score": 81, "mbid": "bfcb0e6b-186e-38fa-bf29-d48ce799a645", "yt_id": "efgNZptpH3A", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Dead Kennedys are an American punk rock band formed in San Francisco, California, in 1978. The band played a central role in shaping the American punk scene during its initial eight-year period.\n\nThe original lineup included lead guitarist East Bay Ray, bassist Klaus Flouride, lead vocalist Jello Biafra, drummer Ted, and rhythm guitarist 6025. 6025 left the band in 1979, and Ted departed in 1980 after the recording of their debut album, \"Fresh Fruit for Rotting Vegetables\" (1980).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 159, "title": "Youth Of America", "artist": "Wipers", "year": 1981, "cover": "https://dn711202.ca.archive.org/0/items/mbid-c1723bb1-7050-407b-b9fc-6763e6b43897/mbid-c1723bb1-7050-407b-b9fc-6763e6b43897-44530385011.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "6f0dbdca-67c5-3334-93ab-0b5acd31e7fd", "yt_id": "glcaCqRr2bY", "rym": null, "genres": ["post-punk", "punk", "rock"], "desc_lfm_album": "Youth of America is the second studio album by American punk rock band Wipers. It was released in 1981 by record label Park Avenue. .", "desc_lfm_artist": "Wipers was an American punk rock band which formed in Portland, Oregon, United States in 1977 by guitarist Greg Sage, drummer Sam Henry and bassist Dave Koupal. Perhaps best known for the iconic early 80s album Is This Real?, Wipers were one of the earliest American purveyors of the genre, and the group's tight song structure and use of heavy distortion has been hailed as extremely influential by numerous critics and musicians (including Nirvana, who covered several of their songs)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 160, "title": "Diary of a Madman", "artist": "Ozzy Osbourne", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18391-diary-of-a-madman_035634.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18391-ozzy-osbourne-diary-of-a-madman.php", "aoty_critic_score": 75, "aoty_user_score": 81, "mbid": "5e8dc90d-610e-3d85-8884-a1449d74e6cc", "yt_id": "tNiOknXgFHM", "rym": "https://rateyourmusic.com/release/album/ozzy-osbourne/diary-of-a-madman", "genres": [], "desc_lfm_album": "Diary of a Madman is an album by Ozzy Osbourne. It was released on November 7, 1981, and re-issued on August 22, 1995. An altered version appeared in 2002. This is the last album with Randy Rhoads before his death in 1982. Although bassist Rudy Sarzo and drummer Tommy Aldridge are credited in the liner notes and pictured on the inner sleeve, it was bassist Bob Daisley and drummer Lee Kerslake who performed all bass and drum parts on the original release. They were not given credit for their contributions. According to a 2005 interview with Daisley, even though Don .", "desc_lfm_artist": "Ozzy Osbourne (born John Michael Osbourne in Marston Green, Warwickshire, on 3 December 1948; died 22 July 2025) was an English singer, songwriter, and media personality remembered as the lead vocalist of the heavy metal band Black Sabbath, during which period he adopted the nickname \"Prince of Darkness\". On 5 July 2025, Osbourne performed his final show at the \"Back to the Beginning\" concert event. \n\nHe was inducted into the Rock and Roll Hall of Fame as a member of Black Sabbath in 2006 and as a solo artist in 2024.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario"]}, {"n": 161, "title": "The Ascension", "artist": "Glenn Branca", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/27236-the-ascension_045539.jpg", "aoty_url": "https://www.albumoftheyear.org/album/27236-glenn-branca-the-ascension.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "72ecced1-276c-3e53-afa1-fb898f8381d7", "yt_id": "JeYMC8g6pZ4", "rym": "https://rateyourmusic.com/release/album/glenn-branca/the-ascension/", "genres": ["no wave"], "desc_lfm_album": "The Ascension is the debut studio album by American no wave musician Glenn Branca, released in 1981 by 99 Records. The album experiments with resonances generated by alternate tunings for multiple electric guitars. It sold 10,000 copies and received acclaim from music critics. Branca wanted to explore the resonances generated when guitar strings tuned to the same note were played at high volumes. He assembled the Ascension Band with four electric guitarists, one bassist, and one drummer. The group included guitarist Lee Ranaldo, who later joined alternative rock band Sonic Youth. The group's bass player knew the owner and engineers .", "desc_lfm_artist": "Glenn Branca (Harrisburg, Pennsylvania, October 6, 1948 - May 13, 2018) was an American avant-garde composer and guitarist known for his use of volume, alternative guitar tunings, repetition, droning, and the harmonic series. Branca received a 2009 Foundation for Contemporary Arts Grants to Artists Award.\n\nBranca studied theater at Emerson College in Boston in the early 1970s. While there, he began experimenting with sound as the founder of an experimental theater group called Bastard Theater.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "sdecandelario"]}, {"n": 162, "title": "Discipline", "artist": "King Crimson", "year": 1981, "cover": "https://dn721908.ca.archive.org/0/items/mbid-f856c4fd-68b6-4edf-a6c2-742e8992f601/mbid-f856c4fd-68b6-4edf-a6c2-742e8992f601-10474809452.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6481-king-crimson-discipline.php", "aoty_critic_score": 87, "aoty_user_score": 84, "mbid": "d498c31d-3b72-3748-a142-df0bf774a920", "yt_id": "LOBvIGBlUvc", "rym": "https://rateyourmusic.com/release/album/king-crimson/discipline", "genres": ["art rock", "progressive rock", "new wave"], "desc_lfm_album": "Discipline is the eighth studio album by English progressive rock band King Crimson, released on 22 September 1981 by E.G. Records in the United Kingdom and by Warner Bros. Records in the United States. This album was King Crimson's first album following a seven-year hiatus. Only band co-founder and guitarist Robert Fripp and drummer Bill Bruford remained from the previous incarnation. They were joined by two American musicians: guitarist, vocalist and lyricist Adrian Belew and bassist and backing vocalist Tony Levin. The album featured a more streamlined, new wave influenced sound. Discipline has been described as art rock, progressive rock, .", "desc_lfm_artist": "King Crimson are an English progressive rock band formed in London in 1968 by Robert Fripp, Michael Giles, Greg Lake, Ian McDonald and Peter Sinfield. Guitarist and leader Fripp has remained the only constant member throughout the band's long history. The band drew inspiration from a wide variety of music, incorporating elements of classical, jazz, folk, heavy metal, gamelan, blues, industrial, electronic, and experimental music. They also exerted a strong influence on the early 1970s progressive rock movement", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 163, "title": "First Light", "artist": "Makoto Matsushita", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/145006-first-light_005912.jpg", "aoty_url": "https://www.albumoftheyear.org/album/145006-makoto-matsushita-first-light.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": null, "yt_id": "o1rclw8Rugs", "rym": "https://rateyourmusic.com/release/album/makoto-matsushita/first-light", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Makoto Matsushita (松下誠) is a Japanese multi-instrumentalist, composer, producer, lyricist and vocalist. He was a member of fusion group AB'S. Born November 16, 1955.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 164, "title": "Deceit", "artist": "This Heat", "year": 1981, "cover": "https://ia800801.us.archive.org/24/items/mbid-fa6ee78b-1677-4135-ac80-2a1c8855fc99/mbid-fa6ee78b-1677-4135-ac80-2a1c8855fc99-38073454853.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6380-this-heat-deceit.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "db33265e-8494-32f1-8892-4fa0add9cf16", "yt_id": "hWlJJpiZ_98", "rym": "https://rateyourmusic.com/release/album/this-heat/deceit", "genres": ["experimental rock", "avant-garde", "avant-prog", "art rock", "post-punk", "avant-folk"], "desc_lfm_album": "\"Deceit\" is the second and most widely-acclaimed album by This Heat. Its recording began in early 1981 in the band's Cold Storage studio. The central theme of the album is the impending destruction of the world by nuclear war. Charles Hayward explained in a later interview, \"We had a firm belief that we were going to die, and the record was made on those terms.… The whole thing was designed to express this sort of fear, angst, which the group was all about really.\" The album was intentionally given a violent, chaotic sound that proved to be an enourmous influence .", "desc_lfm_artist": "This Heat was an experimental British rock band widely considered a link between avant-prog and such later experimental genres as post-punk, post-rock, and noise-rock. They were formed in late-1975 in Brixton, London, United Kingdom by multi-instrumentalists Charles Bullen (guitar, clarinet, viola, vocals, tapes), Charles Hayward (percussion, keyboards, vocals, tapes) and Gareth Williams (keyboard, guitar, bass, vocals, tapes). Their music touched on numerous different styles and genres", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 165, "title": "Never Too Much", "artist": "Luther Vandross", "year": 1981, "cover": "https://dn721608.ca.archive.org/0/items/mbid-a7d77a77-b723-4912-98b9-1fa1c756db4c/mbid-a7d77a77-b723-4912-98b9-1fa1c756db4c-33771619702.jpg", "aoty_url": "https://www.albumoftheyear.org/album/35309-luther-vandross-never-too-much.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "6e49186d-ce5c-3686-86cd-021f0ce1eda3", "yt_id": "o6vCn2sBbBE", "rym": "https://rateyourmusic.com/release/album/luther-vandross/never-too-much-1", "genres": ["soul", "disco", "contemporary r&b", "boogie"], "desc_lfm_album": "Luther Vandross' \"Never Too Much\" is his first solo project. It was released in 1979 and the title track skyrocketed up the R&B charts. Although Vandross had sang back up for some of the music industries giants, his voice became popular after singing TV commercial jingles. He sang lead in a band called Change and even appeared on Sesame Street. His debut project shot him to superstardom in what seemed like over night... but this velvety voice had been around for a while. His following projects, such as Any Love, Busy Body, Forever For Always For Love, Give Me A .", "desc_lfm_artist": "Luther Vandross Jr. (April 20, 1951 – July 1, 2005) was an American singer, songwriter and record producer. Throughout his career, Vandross was an in-demand background vocalist for several different artists including Todd Rundgren, Judy Collins, Chaka Khan, Bette Midler, Diana Ross, David Bowie, Ben E. King, and Donna Summer. He later became a lead singer of the group Change, which released its gold-certified debut album, The Glow of Love, in 1980 on Warner/RFC Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 166, "title": "Time", "artist": "Electric Light Orchestra", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29647-time_145212.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29647-electric-light-orchestra-time.php", "aoty_critic_score": 50, "aoty_user_score": 83, "mbid": "dc020487-5f78-3d97-b06e-5f7a3dbb2265", "yt_id": "yxBZhHE-R7M", "rym": null, "genres": [], "desc_lfm_album": "Time is the ninth studio album by English rock band Electric Light Orchestra (credited as ELO), released 2 July 1981 on Jet Records. It is a concept album about a man from the 1980s who is taken to the year 2095, where he is confronted by the dichotomy between technological advancement and a longing for past romance. The record topped the UK Albums Chart for two weeks and has since attracted a cult following, particularly among retro-futurist enthusiasts. Time is a work of synth-pop that combines elements from 1950s music, new wave, reggae, rockabilly, the Beatles, Phil Spector and the .", "desc_lfm_artist": "The Electric Light Orchestra, or ELO, was an English symphonic rock band which formed in Birmingham, Warwickshire in 1970. The band was formed by Jeff Lynne (vocals, guitar, multiple instruments), Roy Wood (multiple instruments, vocals), Richard Tandy (keyboards, vocals) and Bev Bevan (drums). Lynne, Wood and Bevan were former members of the psychedelic rock band The Move. The band's lineup would fluctuate throughout its original incarnation, although Lynne, Tandy and Bevan would remain constant members.", "desc_mb_album": "", "desc_mb_artist": "'''Group members over the years'''\r\n\r\n'''First Line Up'''\r\nJeff Lynne, Roy Wood, Bev Bevan, Steve Woolam, Bill Hunt\r\n\r\n'''Second Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Michael De Albuquerque, Wilf Gibson, Colin Walker, Mike Edwards\r\n\r\n'''Third Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Hugh McDowell, Melvyn Gale\r\n\r\n'''Fourth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan, Kelly Groucutt, Mik Kaminski, Louis Clark, Dave Morgan\r\n\r\n'''Fifth Line Up'''\r\nJeff Lynne, Richard Tandy, Bev Bevan", "heard_by": ["Frikomid", "Lonsonxd"]}, {"n": 167, "title": "Bella Donna", "artist": "Stevie Nicks", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/21435-bella-donna_190114.jpg", "aoty_url": "https://www.albumoftheyear.org/album/21435-stevie-nicks-bella-donna.php", "aoty_critic_score": 75, "aoty_user_score": 81, "mbid": "87c584fc-02a5-34f8-a492-85c20de4835d", "yt_id": "K2jFx5pVS0s", "rym": null, "genres": [], "desc_lfm_album": "Bella Donna is the debut solo studio album by American singer and songwriter Stevie Nicks. Released on July 27, 1981, the album reached number one on the US Billboard 200 in September of that year. Bella Donna was awarded platinum status by the Recording Industry Association of America (RIAA) on October 7, 1981, less than three months after its release, and in 1990 was certified quadruple-platinum for four million copies shipped. Bella Donna spent nearly three years on the Billboard 200 from July 1981 to June 1984. .", "desc_lfm_artist": "Stephanie Lynn \"Stevie\" Nicks (born May 26, 1948)[1] is an American singer, songwriter, and producer known for her work with the band Fleetwood Mac and as a solo artist.\n\nAfter starting her career as a duo with her then-boyfriend Lindsey Buckingham, releasing the album Buckingham Nicks to little success, Nicks joined Fleetwood Mac in 1975, helping the band to become one of the best-selling music acts of all time with over 120 million records sold worldwide.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 168, "title": "Only a Lad", "artist": "Oingo Boingo", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/81741-only-a-lad-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/81741-oingo-boingo-only-a-lad.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "9685e26f-efe1-3da0-80d4-059f3e787223", "yt_id": "Js4yGcgO6hk", "rym": "https://rateyourmusic.com/release/album/oingo-boingo/only-a-lad", "genres": [], "desc_lfm_album": "Only a Lad is the debut studio album by American new wave band Oingo Boingo, released in 1981 by A&M Records, following their self-titled EP. The album's musical arrangements, by vocalist Danny Elfman and guitarist Steve Bartek, completed the group's evolution into a new wave rock band. Only a Lad features complex and frequently changing time signatures and keys, often incorporating harmonies borrowed from jazz and 20th-century classical music. Lyrics Elfman claimed that many of the songs were inspired by newspaper articles he had read at the time and were \"written as in-your-face facetious jabs\". \"Little Girls\" courted controversy for .", "desc_lfm_artist": "Richard Elfman founded the theatrical troupe The Mystic Knights of the Oingo Boingo. In 1978 the remnants of the Mystic Knights formed together under lead singer Danny Elfman as the band Oingo Boingo. The hyperkinetic ska-flavored New Wave band is characterized by their manic live performances and eclectic range of songs; Elfman and the band performed for a remarkable twenty years.\n\nThe band from Los Angeles, California, USA, a pared-down version of the theatrical troupe The Mystic Knights of the Oingo Boingo", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 169, "title": "Juju", "artist": "Siouxsie and the Banshees", "year": 1981, "cover": "https://dn711000.ca.archive.org/0/items/mbid-3d8e6ee7-b4f9-4dc6-bb7a-2ea5e53d5d01/mbid-3d8e6ee7-b4f9-4dc6-bb7a-2ea5e53d5d01-7976593755.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11981-siouxsie-and-the-banshees-juju.php", "aoty_critic_score": 84, "aoty_user_score": 85, "mbid": "844bfb05-2b51-35e2-8063-1c8e6746c781", "yt_id": "n_bXdEA6nSM", "rym": null, "genres": ["post-punk", "new wave", "gothic rock"], "desc_lfm_album": "Juju is the fourth album by the British post-punk band Siouxsie & the Banshees. After a slightly electronic bent made on a few tracks of their last album, the Banshees returned to a more guitar-based sound for Juju, due to the now-official new Banshees guitarist, John McGeoch. Released by Polydor Records in 1981, this album also featured prominently, for the first time, the intricate percussion work of band member Budgie. Juju was remastered as a single-disc digipack in May 2006. .", "desc_lfm_artist": "Siouxsie and the Banshees was an influential English post-punk band which formed during 1976 in London. Initially associated with the British punk rock scene, the band quickly evolved to create, \"A form of post-punk discord full of daring rhythmic and sonic experimentation.\" The Times would also cite Siouxsie and the Banshees as, \"One of the most audacious and uncompromising musical adventurers of the post-punk era.\" After their split in the year 1996", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 170, "title": "Minor Threat", "artist": "Minor Threat", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/40558-minor-threat.jpg", "aoty_url": "https://www.albumoftheyear.org/album/40558-minor-threat-minor-threat.php", "aoty_critic_score": 100, "aoty_user_score": 81, "mbid": "2d91b2eb-ea73-32bf-ac1b-5a803c7b4684", "yt_id": "4lH9EV_Urxk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Minor Threat was an American hardcore punk band formed in Washington DC in 1980. Short-lived but very influential, critics have called the band and their work \"iconic,\" and have noted that their \"groundbreaking\" music \"has held up better than [that of] most of their contemporaries.\" Minor Threat is credited with unintentionally starting the \"straight edge movement\" from a handful of song lyrics.\n\nThey and fellow Washington DC residents Bad Brains set the standard for many hardcore punk bands in the 1980s and 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 171, "title": "Nightclubbing", "artist": "Grace Jones", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10750-nightclubbing-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10750-grace-jones-nightclubbing.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "8a0fff99-479d-3fe3-849f-0ddc8d22d304", "yt_id": "Dbg-tqV-yik", "rym": "https://rateyourmusic.com/release/album/grace-jones/nightclubbing", "genres": ["art pop", "dub", "new wave", "funk", "disco"], "desc_lfm_album": "Nightclubbing is the fifth studio album by Grace Jones, released in 1981. It is the second of three post-disco albums that Jones made at Compass Point Studios in the Bahamas and became Jones' commercial breakthrough and also formed the basis of her groundbreaking concept tour A One Man Show. It claimed the number one slot on NME Album of the Year. The lead-off single for the album was \"Demolition Man\" written by Sting for Jones and also included on The Police's album Ghost in the Machine later in the year. The second single \"Pull Up to the Bumper\" was a .", "desc_lfm_artist": "Grace Jones (born Beverly Grace Jones on May 19, 1948, in Spanish Town, Jamaica) is a model, singer and actress.\n\nRaised in Syracuse, New York, she found success in the 70s as a model, working in New York and Paris (where she shared an apartment with Jerry Hall and Jessica Lange), before rising to public prominence as a singer and personality.\n\nJones secured a record deal with Island Records, which resulted in a string of club hits. The three disco albums she recorded - Portfolio (1977)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "armandwave"]}, {"n": 172, "title": "Computerwelt", "artist": "Kraftwerk", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6432-computer-world-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6432-kraftwerk-computerwelt.php", "aoty_critic_score": 75, "aoty_user_score": 83, "mbid": "2e58b620-cf80-3b07-a5bc-edabd69ba285", "yt_id": "RVMG39Q77Cw", "rym": "https://rateyourmusic.com/release/album/kraftwerk/computerwelt/", "genres": ["avant-garde", "electro", "experimental electronic", "synth-pop"], "desc_lfm_album": "", "desc_lfm_artist": "Kraftwerk (\"power plant\" in English) are an electronic band founded in 1970 in Düsseldorf, Germany. They pioneered electronic music in the 70s and are considered the most important and influential band of their genre, often described as \"the godfathers of electronic music\". Kraftwerk's sound is minimalistic and strictly electronic; it combines driving, repetitive rhythms with catchy melodies and vocals usually sung through a vocoder. The current line-up consists of Ralf Hütter (the only original member)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere"]}, {"n": 173, "title": "Faith", "artist": "The Cure", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4392-faith_105058.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4392-the-cure-faith.php", "aoty_critic_score": 65, "aoty_user_score": 80, "mbid": "ce2dda01-88b9-3134-8c35-065897e9cbb2", "yt_id": "fShNf-NdJx4", "rym": "https://rateyourmusic.com/release/album/the-cure/faith", "genres": [], "desc_lfm_album": "The Cure's 1981 album Faith is the group's third release. This album has a darker tone compared to earlier works by the band and can be said to be a \"gateway\" album between the minimalistic post-punkness of Three Imaginary Boys & Seventeen Seconds and the wall of sound synth-goth of Pornography. .", "desc_lfm_artist": "The Cure are an English gothic rock band formed in Crawley in 1976 by Robert Smith (vocals, guitar) and Lol Tolhurst (drums). The band’s current lineup consists of Smith, Simon Gallup (bass), Roger O'Donnell (keyboards), Perry Bamonte (guitar and keyboards), Jason Cooper (drums), and Reeves Gabrels (guitar). Smith has been the sole constant member throughout the group’s history, while Gallup has appeared on all but two of the band’s studio albums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 174, "title": "THE RAINBOW GOBLINS", "artist": "高中正義 [Masayoshi Takanaka]", "year": 1981, "cover": "https://cdn2.albumoftheyear.org/600x0/album/87061-the-rainbow-goblins-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/87061-masayoshi-takanaka-the-rainbow-goblins.php", "aoty_critic_score": 89, "aoty_user_score": null, "mbid": null, "yt_id": "eaPT0dQgS9E", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["Nubis84"]}, {"n": 175, "title": "Moving Pictures", "artist": "Rush", "year": 1981, "cover": "https://ia903107.us.archive.org/15/items/mbid-fecf8eef-cbb6-49b3-bc7d-b2912766cacc/mbid-fecf8eef-cbb6-49b3-bc7d-b2912766cacc-24125653750.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12948-rush-moving-pictures.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "40e30dc1-55ac-33e1-85d3-1f1508140bfc", "yt_id": "iAIxUvd8gWo", "rym": "https://rateyourmusic.com/release/album/rush/moving-pictures", "genres": ["hard rock", "progressive rock"], "desc_lfm_album": "Moving Pictures is the eighth studio album by Canadian rock band Rush, released in 1981. The album was recorded and mixed at Le Studio, Morin Heights, Quebec. A classic rock album, Moving Pictures became the band's biggest selling album in the U.S., hitting #3, and remains the band's most popular studio recording to date (certified quadruple-platinum with four million copies sold on January 27, 1995). Following the formula of their previous album, Permanent Waves, Moving Pictures follows a more radio-friendly format and includes the hit single \"Tom Sawyer\", as well as radio standards \"Red Barchetta\" and \"Limelight\". Moving Pictures was .", "desc_lfm_artist": "Rush is a Canadian rock band formed in Toronto in 1968. The original lineup consisted of guitarist Alex Lifeson, drummer John Rutsey, and bassist and vocalist Jeff Jones, who was soon replaced by Geddy Lee. Over the next six years, the band underwent several lineup changes before establishing its classic power trio with the addition of Neil Peart in July 1974, replacing Rutsey shortly after the release of their self-titled debut album. This lineup of Lifeson, Lee, and Peart remained stable until 2015, when Peart retired from music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 176, "title": "Gaucho", "artist": "Steely Dan", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/16984-gaucho.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16984-steely-dan-gaucho.php", "aoty_critic_score": 86, "aoty_user_score": 82, "mbid": "953426ac-0f78-3845-a968-87140cb6db17", "yt_id": "tEMnug2-VjM", "rym": "https://rateyourmusic.com/release/album/steely-dan/gaucho", "genres": ["pop rock", "jazz rock", "yacht rock"], "desc_lfm_album": "Gaucho is the seventh studio album by the American jazz rock band Steely Dan, released on November 21, 1980 by MCA Records. The sessions for Gaucho represent the band's typical penchant for studio perfectionism and obsessive recording technique. To record the album, the band used at least 42 different musicians, spent over a year in the studio, and far exceeded the original monetary advance given by the record label. During the two-year span in which the album was recorded, the band was plagued by a number of creative, personal and professional problems. MCA, Warner Bros. and Steely Dan had a .", "desc_lfm_artist": "Steely Dan is an American jazz rock band which formed in 1972. The band was formed by Donald Fagen (vocals, keyboards) and Walter Becker (guitar, bass), who met in 1967 while both attended Bard College in Annandale-on-Hudson, New York, and began a songwriting partnership shortly thereafter.\n\nTheir music is characterized by dark, witty lyrical narratives, obscure lyrical allusions and complex, jazz-influenced instrumentation and chord sequences, overlying more ordinary popular song structures.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 177, "title": "In the Flat Field", "artist": "Bauhaus", "year": 1980, "cover": "https://lastfm.freetls.fastly.net/i/u/300x300/125ce21f5d1c47eb9b96071faf806c41.png", "aoty_url": "https://www.albumoftheyear.org/album/15923-bauhaus-in-the-flat-field.php", "aoty_critic_score": 83, "aoty_user_score": 81, "mbid": "0fc9f4c7-ee00-39ec-a767-4574823c2064", "yt_id": "CTYntCRHpUM", "rym": "https://rateyourmusic.com/release/album/bauhaus/in-the-flat-field/", "genres": [], "desc_lfm_album": "In The Flat Field is the debut studio album by English gothic rock band Bauhaus. It was recorded on 4 December 1979 at BBC Maida Vale Studios, London and in June–July 1980 at Southern Studios, London, England. In The Flat Field was released on 1 October 1980 by record label 4AD. It is considered one of the first gothic rock records. Following a 30-date tour, Bauhaus set out to Southern Studios in London to record their first album. As the band had a clear conception of what they wanted the record to sound like, they opted to produce it themselves. .", "desc_lfm_artist": "Bauhaus were an English rock band formed in Northampton in 1978. Known for their dark image and atmospheric sound, they are considered pioneers of gothic rock, while also incorporating elements of dub, glam rock, psychedelia, and funk. The band consisted of Daniel Ash (guitar, saxophone), Peter Murphy (vocals, occasional instruments), Kevin Haskins (drums), and David J (bass).\n\nOriginally named Bauhaus 1919 after the founding year of the German art school Bauhaus, the group shortened their name within a year of formation.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 178, "title": "Super Trouper", "artist": "ABBA", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/20969-super-trouper_215001.jpg", "aoty_url": "https://www.albumoftheyear.org/album/20969-abba-super-trouper.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "24944755-2f68-3778-974e-f572a9e30108", "yt_id": "BshxCIjNEjY", "rym": "https://rateyourmusic.com/release/album/abba/super-trouper", "genres": [], "desc_lfm_album": "Super Trouper is the seventh studio album by the Swedish pop group ABBA, released on 3 November 1980. It features the No.1 singles \"The Winner Takes It All\" and \"Super Trouper\". The album became the biggest-selling album of 1980 in the UK. Overview Led by the international hit \"The Winner Takes It All\", Super Trouper was the group's sixth chart-topping album in the UK. It was also the best-selling album in Britain for 1980. Super Trouper was first released on CD in 1983 by Polar Music International, in the early 1980s by Polydor, and in the late 1980s by Atlantic .", "desc_lfm_artist": "ABBA were a Swedish pop group formed in Stockholm in  1972 by Agnetha Fältskog, Björn Ulvaeus, Benny Andersson, and Anni-Frid Lyngstad. The group's name is an acronym of the first letters of their first names. They became one of the most commercially successful acts in the history of popular music, topping the charts worldwide from 1974 to 1982. ABBA won the Eurovision Song Contest 1974 at The Dome in Brighton, UK, giving Sweden its first triumph in the contest. They are the most successful group to have taken part in the competition.", "desc_mb_album": "", "desc_mb_artist": "Swedish group. Most of the songs were written by Benny Andersson and Björn Ulvaeus, and sometimes Stig Anderson.\n\nThere have been 7 known masters of the original studio recordings:\n    1. Original releases (1974–1981)\n    2. CD releases (1982–1992)\n    3. ABBA Gold and Thank You for the Music Box Set (1992–1994), remastered by Michael B. Tretow\n    4. Remastered releases (1997), remastered by Jon Astley and Tim Young.\n    5. Remastered releases (2001), when Jon Astley revisited his earlier remasters, and fixed some errors.\n    6. Remastered releases (2005), made by Henrik Jonsson. Featured on “The Complete Studio Recordings” and “The Albums” box sets.\n    7. Remastered releases (2005–), feature on the Deluxe albums. Some of these albums use the same remasters as the previous two box sets, ", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "sdecandelario"]}, {"n": 179, "title": "The River", "artist": "Bruce Springsteen", "year": 1980, "cover": "https://dn721905.ca.archive.org/0/items/mbid-a294c8e9-e67c-4ca4-9de9-2303e9531a67/mbid-a294c8e9-e67c-4ca4-9de9-2303e9531a67-36940570982.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5805-bruce-springsteen-the-river.php", "aoty_critic_score": 94, "aoty_user_score": 81, "mbid": "81a69727-30b8-4517-b642-96c5f446822b", "yt_id": "klVu1sf6HO4", "rym": "https://rateyourmusic.com/release/album/bruce-springsteen/the-river", "genres": [], "desc_lfm_album": "The River is the fifth studio album by Bruce Springsteen. It was released on October 17, 1980, by Columbia Records. Springsteen's only double album, The River was produced by Jon Landau, Springsteen, and bandmate Steven Van Zandt. The album was Springsteen's first to go #1 on the Billboard 200 and spent four weeks at the top of chart. \"The River\" was nominated for Best Rock Vocal Performance at the 1982 Grammy Awards. .", "desc_lfm_artist": "Bruce Frederick Joseph Springsteen (born September 23, 1949) is an American rock singer, songwriter, and guitarist. Nicknamed \"the Boss\", he has released 21 studio albums during a career spanning six decades, most of which feature his backing band, the E Street Band. Springsteen is a pioneer of heartland rock, a genre combining mainstream rock music with poetic and socially conscious lyrics that feature narratives primarily concerning working class American life.", "desc_mb_album": "", "desc_mb_artist": "You will find the most comprehensive information about '''Bruce Springsteen''' at '''''[http://brucebase.wikidot.com/|BruceBase Wiki]''''' and '''''[http://www.springsteenlyrics.com|SpringsteenLyrics.com]'''''\n\nThe '''''versioning''''' information for '''''studio recordings''''' is taken from the '''[http://brucebase.wikidot.com/stats:on-the-tracks|A studio guide to Bruce Springsteen]''' on the different '''''On The Tracks - recording sessions information''''' pages.", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 180, "title": "Making Movies "aoty_critic_score": 97, "aoty_user_score": 90, "mbid": "f6b1b900-6108-32f0-abbd-2855af9151eb", "yt_id": "w6T_X7MXg40", "rym": "https://rateyourmusic.com/release/album/talking-heads/remain-in-light", "genres": ["experimental rock", "art rock", "post-punk", "new wave", "funk", "afrobeat"], "desc_lfm_album": "Remain in Light is the fourth studio album by American new wave band Talking Heads, released on October 8, 1980, on Sire Records. It was recorded at Compass Point Studios in the Bahamas and Sigma Sound Studios in Philadelphia between July and August 1980 and was produced by the quartet's long-time collaborator Brian Eno. Following the release of Fear of Music in 1979, Talking Heads and Eno sought to make an album that would dispel notions of the group as a mere vehicle for frontman and chief lyricist David Byrne. Drawing on the influence of Nigerian musician Fela Kuti, the .", "desc_lfm_artist": "Talking Heads were an American rock band formed in New York City in 1975. The group consisted of vocalist and guitarist David Byrne, drummer Chris Frantz, bassist Tina Weymouth, and guitarist and keyboardist Jerry Harrison. The band is often associated with the development of new wave music, combining elements of punk rock, art rock, funk, and world music with a distinctive visual and artistic style.\n\nDavid Byrne, Chris Frantz, and Tina Weymouth met while studying at the Rhode Island School of Design", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 182, "title": "Dirty Mind", "artist": "Prince", "year": 1980, "cover": "https://dn721808.ca.archive.org/0/items/mbid-2fede38a-62ed-4da4-93b2-3a2fdf58f4f9/mbid-2fede38a-62ed-4da4-93b2-3a2fdf58f4f9-38882189816.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6509-prince-dirty-mind.php", "aoty_critic_score": 97, "aoty_user_score": 82, "mbid": "4f19b946-6ecb-3801-9248-cc44e9e9a284", "yt_id": "zquw0bn8puE", "rym": "https://rateyourmusic.com/release/album/prince/dirty-mind/", "genres": ["pop rock", "new wave", "funk", "disco", "contemporary r&b", "dance-pop"], "desc_lfm_album": "Dirty Mind is the third studio album by American musician Prince, released October 8, 1980 on Warner Bros. Records in the United States. Produced, arranged, and composed primarily by Prince, it contains prominently sexual lyrics and incorporates musical elements of funk, dance, and rock music. The album debuted at number 63 on the U.S. Billboard 200 chart, and it earned widespread acclaim from music critics. On June 6, 1984, it was certified gold in sales by the Recording Industry Association of America. Pitchfork Media ranked Dirty Mind number 87 on its list of the Top 100 Albums of the 1980s. .", "desc_lfm_artist": "Prince Rogers Nelson (June 7, 1958 – April 21, 2016), more commonly known mononymously as Prince, was an American singer-songwriter, musician, and record producer. The recipient of numerous awards and nominations, he is widely regarded as one of the greatest musicians of his generation. He was known for his flamboyant, androgynous persona; his wide vocal range, which included a far-reaching falsetto and high-pitched screams; and his skill as a multi-instrumentalist, often preferring to play all or most of the instruments on his recordings.", "desc_mb_album": "https://princevault.com/index.php?title=Album:_Dirty_Mind", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu", "armandwave"]}, {"n": 183, "title": "Hotter Than July", "artist": "Stevie Wonder", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/16983-hotter-than-july_043556.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16983-stevie-wonder-hotter-than-july.php", "aoty_critic_score": 88, "aoty_user_score": 80, "mbid": "6fbde199-c971-3d4f-a8df-ca13a998e3c7", "yt_id": "cgQ8OqUuc34", "rym": "https://rateyourmusic.com/release/album/stevie-wonder/hotter-than-july", "genres": ["soul", "r&b", "funk", "disco", "contemporary r&b", "reggae-pop"], "desc_lfm_album": "Hotter than July is the nineteenth studio album by American recording artist Stevie Wonder, released on Motown's Tamla label on September 29, 1980. .", "desc_lfm_artist": "Stevie Wonder is the stage name of Stevland Hardaway Morris (b. Stevland Hardaway Judkins, 13 May 1950 in Saginaw, MI, USA - a.k.a. Little Stevie Wonder), a singer, multi-instrumentalist, composer,  record producer and activist.  He débuted, as Little Stevie Wonder, with the single \"I Call It Pretty Music but the Old People Call It the Blues\" (1961, Tamla Motown) and his latest album is \"A Time To Love\" (Oct 2005, Motown)\n\nStevland lost his eyesight shortly after birth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 184, "title": "Scary Monsters… and Super Creeps", "artist": "David Bowie", "year": 1980, "cover": "https://dn710706.ca.archive.org/0/items/mbid-104f475e-1761-4228-b9e4-ed46d086848a/mbid-104f475e-1761-4228-b9e4-ed46d086848a-3791440379.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "bb13cb45-254c-3a61-89a5-15d22a97e6d6", "yt_id": "vWTQ3vshLNY", "rym": null, "genres": ["experimental rock", "art rock", "pop rock", "art pop", "post-punk", "new wave"], "desc_lfm_album": "", "desc_lfm_artist": "David Robert Jones (8 January 1947 – 10 January 2016), known professionally as David Bowie, was an English singer-songwriter and actor. A leading figure in the music industry, he is regarded as one of the most influential musicians of the 20th century. Bowie was acclaimed by critics and musicians, particularly for his innovative work during the 1970s. His career was marked by reinvention and visual presentation, and his music and stagecraft had a significant impact on popular music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 185, "title": "Blizzard of Ozz", "artist": "Ozzy Osbourne", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18392-blizzard-of-ozz_035727.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18392-ozzy-osbourne-blizzard-of-ozz.php", "aoty_critic_score": 72, "aoty_user_score": 81, "mbid": "1c318024-66cc-32f5-8e06-b06dc511b42c", "yt_id": "NZdGTdP3DhE", "rym": "https://rateyourmusic.com/release/album/ozzy-osbourne/blizzard-of-ozz", "genres": [], "desc_lfm_album": "Blizzard of Ozz is a heavy metal album by Ozzy Osbourne, recorded in Surrey, U.K. and released on September 20, 1980 in the UK and on January 15, 1981 in the US. This is Osbourne's first solo album and one of the two studio albums he recorded before guitarist Randy Rhoads' death in March 1982. The tracks \"Crazy Train\" and \"Mr. Crowley\" were released as singles. The former peaked at #9 on the Mainstream Rock Charts and has remained a staple of pop, hard-rock, and classic-rock radio for more than 25 years; it remains Ozzy's most recognizable song. Blizzard of .", "desc_lfm_artist": "Ozzy Osbourne (born John Michael Osbourne in Marston Green, Warwickshire, on 3 December 1948; died 22 July 2025) was an English singer, songwriter, and media personality remembered as the lead vocalist of the heavy metal band Black Sabbath, during which period he adopted the nickname \"Prince of Darkness\". On 5 July 2025, Osbourne performed his final show at the \"Back to the Beginning\" concert event. \n\nHe was inducted into the Rock and Roll Hall of Fame as a member of Black Sabbath in 2006 and as a solo artist in 2024.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 186, "title": "Black Sea", "artist": "XTC", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/27569-black-sea.jpg", "aoty_url": "https://www.albumoftheyear.org/album/27569-xtc-black-sea.php", "aoty_critic_score": 86, "aoty_user_score": 83, "mbid": "3219729b-5773-3d4f-a32c-99144d6680be", "yt_id": "fqXS7rek1Bk", "rym": "https://rateyourmusic.com/release/album/xtc/black-sea", "genres": [], "desc_lfm_album": "XTC's fourth album, released 12 September 1980 on Virgin Records and produced by Steve Lillywhite. It is the follow-up to the previous year's Drums and Wires, building upon its focus on guitars and expansive-sounding drums, but with more economical arrangements written with the band's subsequent concert performances in mind, avoiding overdubs unless they could be performed live. .", "desc_lfm_artist": "XTC were an English post-punk band formed in Swindon, England in 1972, led by Andy Partridge (guitars, vocals) and  Colin Moulding (bass, vocals). Active between the late 1970s and the mid 2000s, XTC's music ranged from jerky new wave/punk riffs to lushly-arranged progressive pop. They also drew heavily from vintage pop rock and psychedelia from the 1960s, genres which they began to explore more deeply after creating The Dukes of Stratosphear side-project.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 187, "title": "Never for Ever", "artist": "Kate Bush", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19412-never-for-ever_010857.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19412-kate-bush-never-for-ever.php", "aoty_critic_score": 72, "aoty_user_score": 85, "mbid": "b3c5541a-e1d0-354f-b6c8-565c37dde332", "yt_id": "C-p9K_Ieloo", "rym": "https://rateyourmusic.com/release/album/kate-bush/never-for-ever", "genres": [], "desc_lfm_album": "Never for Ever is the third studio album by English singer Kate Bush. Released in September 1980, it was Bush's first No. 1 album and was also the first album by a British female solo artist to top the UK Albums Chart, as well as being the first album by any female solo artist to enter the chart at No. 1. It has since been certified Gold by the BPI. It features the UK Top 20 singles \"Breathing\", \"Army Dreamers\" and \"Babooshka\", the latter being one of Bush's biggest hits. Bush co-produced the album with Jon Kelly. .", "desc_lfm_artist": "Catherine Bush (born 30 July 1958) is an English singer, songwriter, musician, dancer, and record producer. She is known for her eclectic musical style, literary and unconventional lyrics, and innovative use of dance and visual performance. Her work has influenced a wide range of artists across genres.\n\nBush began writing songs at the age of 11 and was later signed to EMI Records after David Gilmour of Pink Floyd helped fund a professional demo recording.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "armandwave"]}, {"n": 188, "title": "Fresh Fruit for Rotting Vegetables", "artist": "Dead Kennedys", "year": 1980, "cover": "https://dn710307.ca.archive.org/0/items/mbid-33d6956e-3fb0-3a6b-8a47-cc2f3be2b183/mbid-33d6956e-3fb0-3a6b-8a47-cc2f3be2b183-20681910422.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6916-dead-kennedys-fresh-fruit-for-rotting-vegetables.php", "aoty_critic_score": 88, "aoty_user_score": 85, "mbid": "3495fca0-ce60-3342-93f2-23fd525d8069", "yt_id": "L8zhNb8ANe8", "rym": "https://rateyourmusic.com/release/album/dead-kennedys/fresh-fruit-for-rotting-vegetables", "genres": ["punk", "hardcore punk"], "desc_lfm_album": "Fresh Fruit for Rotting Vegetables is the debut album by the hardcore punk band Dead Kennedys, released initially on Cherry Red Records in the UK in 1980 and eventually through Faulty Products in the US (later by the DK's own Alternative Tentacles label). The best selling and generally the most critically acclaimed album by the Dead Kennedys, Fresh Fruit for Rotting Vegetables has become a major staple of American punk. Lead vocalist Jello Biafra's strong political statements on songs such as \"California Über Alles\" and \"When Ya Get Drafted\", launched the Dead Kennedys into the political arena. Musically, Fresh Fruit .", "desc_lfm_artist": "Dead Kennedys are an American punk rock band formed in San Francisco, California, in 1978. The band played a central role in shaping the American punk scene during its initial eight-year period.\n\nThe original lineup included lead guitarist East Bay Ray, bassist Klaus Flouride, lead vocalist Jello Biafra, drummer Ted, and rhythm guitarist 6025. 6025 left the band in 1979, and Ted departed in 1980 after the recording of their debut album, \"Fresh Fruit for Rotting Vegetables\" (1980).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 189, "title": "Kaleidoscope", "artist": "Siouxsie and the Banshees", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11980-kaleidoscope_221409.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11980-siouxsie-and-the-banshees-kaleidoscope.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "179b14ab-25c6-3b3b-bb03-1e894e475a1d", "yt_id": "O6Swl5WNr14", "rym": null, "genres": [], "desc_lfm_album": "Recorded at Surrey Sound, The Coach House and Polydor between January and May 1980. Produced by Nigel Gray, Siouxsie And The Banshees. ℗ 1980 Polydor Ltd. (U.K.) After 'Join Hands', guitarist John McKay and drummer Kenny Morris departed the Banshees, leaving the band at a crossroads. Siouxsie Sioux and Steven Severin elected to soldier on with ex-Slits drummer Budgie and two guitarists, ex-Sex Pistol Steve Jones and John McGeoch of Magazine as guest Banshees. Despite the personnel upheaval, the result is a surprisingly strong record: Kaleidoscope. While a number of the songs here are still dark-hued and feature bleak lyrics, .", "desc_lfm_artist": "Siouxsie and the Banshees was an influential English post-punk band which formed during 1976 in London. Initially associated with the British punk rock scene, the band quickly evolved to create, \"A form of post-punk discord full of daring rhythmic and sonic experimentation.\" The Times would also cite Siouxsie and the Banshees as, \"One of the most audacious and uncompromising musical adventurers of the post-punk era.\" After their split in the year 1996", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 190, "title": "Closer", "artist": "Joy Division", "year": 1980, "cover": "https://dn710709.ca.archive.org/0/items/mbid-ee50be9b-85c9-3f3c-a851-e198731ae2ff/mbid-ee50be9b-85c9-3f3c-a851-e198731ae2ff-2568714507.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4218-joy-division-closer.php", "aoty_critic_score": 94, "aoty_user_score": 87, "mbid": "852f9715-24b3-37d5-b8a5-456f5e19b41e", "yt_id": "94eBRzLGYYs", "rym": "https://rateyourmusic.com/release/album/joy-division/closer", "genres": ["post-punk", "new wave", "gothic rock", "rock"], "desc_lfm_album": "Closer is the second and final studio album by English rock band Joy Division, released on 18 July 1980 by Factory Records. Produced by Martin Hannett, it was released two months after the suicide of the band's lead singer and lyricist Ian Curtis. The album reached No. 6 on the UK Albums Chart, peaked at No. 3 in New Zealand in September 1981, and No. 2 in Greece during August 2020. Closer was also named NME Album of the Year. It was remastered and re-released in 2007. Today, Closer is widely recognized as a seminal release of the post-punk era. .", "desc_lfm_artist": "Joy Division was an English post-punk band formed in 1976 in Salford, Greater Manchester, United Kingdom. Originally named Warsaw, the band consisted of Ian Curtis (vocals and occasional guitar), Bernard Sumner (guitar and keyboards), Peter Hook (bass guitar and backing vocals) and Stephen Morris (drums and percussion). The band dissolved in May 1980 after the suicide of its lead singer, Ian Curtis. Much of their popularity/reputation arguably resulted from frequent playings on air by iconic DJ John Peel", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 191, "title": "Uprising", "artist": "Bob Marley & The Wailers", "year": 1980, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18233-uprising_145234.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18233-bob-marley-and-the-wailers-uprising.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "6dd29c00-7539-319d-98e0-b2f07e861497", "yt_id": "LKf9hDNm9Nc", "rym": null, "genres": ["reggae", "roots reggae"], "desc_lfm_album": "Uprising is a 1980 reggae album by Bob Marley & The Wailers. As Marley died the following year, Uprising was to become the final studio album to be released during his lifetime. This album is one of Marley's most directly religious, with nearly every song addressing his Rastafarian beliefs, culminating in the acoustic folk classic, \"Redemption Song\". Uprising peaked at #41 on Billboard's (North America) Black Albums chart, and #45 on the Pop Albums chart. \"Could You Be Loved\" was #6 and #56 respectively on the Club Play Singles and Black Singles charts. The album fared better in the UK .", "desc_lfm_artist": "Bob Marley and the Wailers (previously known as The Wailers, and prior to that The Wailing Rudeboys, The Wailing Wailers and The Teenagers) were a Jamaican ska, rocksteady and reggae band. The founding members, in 1963, were Bob Marley (Robert Nesta Marley), Peter Tosh (Hubert Winston McIntosh), and Bunny Wailer (Neville Livingston).\n\nDuring 1970 and 1971, Wailer, Marley and Tosh worked with renowned reggae producers Leslie Kong and Lee \"Scratch\" Perry.", "desc_mb_album": "", "desc_mb_artist": "Releases under \"Bob Marley & The Wailers\" belong here, '''no matter the band lineup'''.  \r\n\r\nReleases under \"The Wailing Wailers\", \"The Wailers\", or \"Marley, Tosh, Livingston & Associates\" belon function isHeard(a) {
  if (selectedUser) return a.heard_by.includes(selectedUser);
  return a.heard_by.length > 0;
}

const imgObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && e.target.dataset.src) {
      e.target.src = e.target.dataset.src;
      e.target.removeAttribute('data-src');
      imgObs.unobserve(e.target);
    }
  });
}, {rootMargin:'200px'});

function buildGenreList() {
  const list = document.getElementById('genre-list');
  list.innerHTML = '';
  GENRE_OPTS.forEach(([genre, count]) => {
    const div = document.createElement('div');
    div.className = 'genre-item';
    const id = 'g-'+genre.replace(/[^a-z0-9]/g,'_');
    div.innerHTML = '<input type="checkbox" id="'+id+'" value="'+genre+'" onchange="toggleGenre(\''+genre+'\',this.checked)"><label for="'+id+'">'+genre+'<span>'+count+'</span></label>';
    list.appendChild(div);
  });
}

function toggleGenreDD() {
  const dd  = document.getElementById('genre-dd');
  const btn = document.getElementById('genre-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  btn.classList.toggle('active', open || selectedGenres.size > 0);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 200) + 'px';
  }
}

function toggleGenre(g, checked) {
  if (checked) selectedGenres.add(g); else selectedGenres.delete(g);
  const badge = document.getElementById('genre-badge');
  const btn   = document.getElementById('genre-btn');
  if (selectedGenres.size>0) { badge.textContent=selectedGenres.size; badge.style.display=''; btn.classList.add('active'); }
  else { badge.style.display='none'; btn.classList.remove('active'); }
  applyFilters();
}

function clearGenres() {
  selectedGenres.clear();
  document.querySelectorAll('#genre-list input').forEach(i=>i.checked=false);
  document.getElementById('genre-badge').style.display='none';
  document.getElementById('genre-btn').classList.remove('active');
  applyFilters();
}

function toggleDecDD() {
  const dd  = document.getElementById('dec-dd');
  const btn = document.getElementById('dec-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = r.left + 'px';
  }
}

function buildUserList() {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  const allDiv = document.createElement('div');
  allDiv.className = 'user-item' + (!selectedUser ? ' active' : '');
  allDiv.innerHTML = '<span class="u-dot"></span>All users';
  allDiv.onclick = () => setUser(null);
  list.appendChild(allDiv);
  USERS.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item' + (selectedUser===u ? ' active' : '');
    const n = ALBUMS.filter(a=>a.heard_by.includes(u)).length;
    div.innerHTML = '<span class="u-dot"></span>'+u+'<span style="color:var(--muted);font-size:.58rem;margin-left:auto">'+n+'</span>';
    div.onclick = () => setUser(u);
    list.appendChild(div);
  });
}

function toggleUserDD() {
  const dd  = document.getElementById('user-dd');
  const btn = document.getElementById('user-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 164) + 'px';
  }
}

function setUser(u) {
  selectedUser = u;
  document.getElementById('user-btn-label').textContent = u || 'All users';
  document.getElementById('user-dd').classList.remove('open');
  buildUserList();
  document.querySelectorAll('.card').forEach(card => {
    const n = parseInt(card.dataset.num);
    const a = ALBUMS.find(x=>x.n===n);
    if (!a) return;
    const heard = isHeard(a);
    card.dataset.heard = heard ? '1' : '0';
    card.classList.toggle('heard-user',  heard);
    card.classList.toggle('unheard-user', !heard);
  });
  applyFilters();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.genre-wrap')) document.getElementById('genre-dd').classList.remove('open');
  if (!e.target.closest('.user-wrap'))  document.getElementById('user-dd').classList.remove('open');
  if (!e.target.closest('.dec-wrap'))   document.getElementById('dec-dd').classList.remove('open');
});

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  ALBUMS.forEach(a => {
    const card = document.createElement('div');
    const heard = isHeard(a);
    card.className = 'card ' + (heard ? 'heard-user' : 'unheard-user');
    card.dataset.artist = (a.artist||'').toLowerCase();
    card.dataset.title  = (a.title||'').toLowerCase();
    card.dataset.genres = (a.genres||[]).join(',');
    card.dataset.heard  = heard ? '1' : '0';
    card.dataset.num    = a.n;
    const img = document.createElement('img');
    img.dataset.src = a.cover || COVER_PH;
    img.src = COVER_PH;
    img.alt = a.n;
    img.onerror = function(){ this.onerror=null; this.src=COVER_PH; };
    card.appendChild(img);
    const cs = a.aoty_critic_score != null ? '<span class="card-score c">'+a.aoty_critic_score+'</span>' : '';
    const us = a.aoty_user_score   != null ? '<span class="card-score u">'+a.aoty_user_score+'</span>'   : '';
    card.insertAdjacentHTML('beforeend',
      '<div class="card-overlay">'
      +'<div class="card-scores">'+cs+us+'</div>'
      +'<div class="card-title">'+a.title+'</div>'
      +'<div class="card-artist">'+a.artist+(a.year?' · '+a.year:'')+'</div>'
      +'</div>');
    card.addEventListener('click', () => openPanel(a, card));
    grid.appendChild(card);
  });
  document.querySelectorAll('img[data-src]').forEach(img=>imgObs.observe(img));
  applyFilters();
}

const _isMobile = () => window.matchMedia('(max-width:600px)').matches;

function closePanel() {
  document.getElementById('panel').classList.remove('panel-open');
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
}

function setGridSize(val) {
  document.getElementById('grid-label').textContent = val + '×';
  document.getElementById('grid').style.gridTemplateColumns = 'repeat('+val+',1fr)';
  try { localStorage.setItem('grid-cols-aoty', val); } catch(e) {}
}

function openPanel(a, cardEl) {
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
  cardEl.classList.add('active-card');
  if (_isMobile()) document.getElementById('panel').classList.add('panel-open');

  const coverWrap = document.getElementById('panel-cover-wrap');
  coverWrap.style.display='';
  document.getElementById('p-cover').src = a.cover || COVER_PH;
  document.getElementById('p-cover').onerror = function(){ this.src=COVER_PH; };

  const cs = a.aoty_critic_score != null ? '<span class="panel-score c">'+a.aoty_critic_score+' critic</span>' : '';
  const us = a.aoty_user_score   != null ? '<span class="panel-score u">'+a.aoty_user_score+' user</span>'     : '';
  document.getElementById('p-scores').innerHTML = cs + us;

  const links = [];
  if (a.aoty_url) links.push('<a class="panel-link aoty" href="'+a.aoty_url+'" target="_blank">AOTY</a>');
  if (a.rym)      links.push('<a class="panel-link rym"  href="'+a.rym+'"      target="_blank">RYM</a>');
  if (a.mbid)     links.push('<a class="panel-link"      href="https://musicbrainz.org/release-group/'+a.mbid+'" target="_blank">MusicBrainz</a>');
  if (a.yt_id)    links.push('<a class="panel-link yt"   href="https://youtu.be/'+a.yt_id+'" target="_blank">YouTube</a>');

  let ytBlock = '';
  if (a.yt_id) {
    ytBlock = '<iframe src="https://www.youtube.com/embed/'+a.yt_id+'" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
  } else {
    const q = encodeURIComponent(a.artist+' '+a.title+' full album');
    ytBlock = '<div class="panel-yt-placeholder"><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a></div>';
  }

  const genreTags = (a.genres||[]).map(g=>'<span class="panel-genre-tag">'+g+'</span>').join('');
  const heardLine = a.heard_by.length>0 ? '<div class="panel-heard-by">Heard by <b>'+a.heard_by.join(', ')+'</b></div>' : '';

  const descSrcs = [
    {key:'desc_lfm_album',  cls:'lfm',    lbl:'💿 Album · Last.fm'},
    {key:'desc_lfm_artist', cls:'artist',  lbl:'🎤 Artist · Last.fm'},
    {key:'desc_mb_album',   cls:'mb',      lbl:'💿 Album · MusicBrainz'},
    {key:'desc_mb_artist',  cls:'mb artist',lbl:'🎤 Artist · MusicBrainz'},
  ];
  const descBlocks = descSrcs.filter(s=>a[s.key]&&a[s.key].length>40)
    .map(s=>'<div class="desc-block"><div class="desc-source-label '+s.cls+'">'+s.lbl+'</div><div class="desc-source-text">'+a[s.key]+'</div></div>').join('');
  const bioHtml = descBlocks || '<span style="color:var(--muted);font-style:italic">No info available.</span>';

  document.getElementById('panel-body').innerHTML =
    '<div class="panel-title">'+a.title+'</div>'
    +'<div class="panel-artist">'+a.artist+'</div>'
    +'<div class="panel-year">'+(a.year||'')+'</div>'
    +(genreTags?'<div class="panel-genres">'+genreTags+'</div>':'')
    +heardLine
    +'<div class="panel-links">'+links.join('')+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">Listen on YouTube</div>'
    +'<div class="panel-yt-wrap">'+ytBlock+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">About</div>'
    +'<div class="panel-bio" id="p-bio">'+bioHtml+'</div>';
}

function setFilter(f) {
  filter=f;
  ['all','heard','unheard'].forEach(x => {
    const btn=document.getElementById('btn-'+x); if(!btn) return;
    btn.classList.toggle('active',x===f);
    if(x==='unheard') {
      btn.style.borderColor=f==='unheard'?'var(--pending)':'';
      btn.style.color=f==='unheard'?'var(--pending)':'';
      btn.style.background=f==='unheard'?'rgba(255,71,71,.06)':'';
    }
  });
  applyFilters();
}

function applyFilters() {
  const q=document.getElementById('search').value.toLowerCase().trim();
  let vis=0,visH=0;
  document.querySelectorAll('.card').forEach(c => {
    const mf=filter==='all'||(filter==='heard'&&c.dataset.heard==='1')||(filter==='unheard'&&c.dataset.heard==='0');
    const ms=!q||c.dataset.title.includes(q)||c.dataset.artist.includes(q);
    const cg=c.dataset.genres?c.dataset.genres.split(','):[];
    const mg=selectedGenres.size===0||[...selectedGenres].some(g=>cg.includes(g));
    const show=mf&&ms&&mg;
    c.classList.toggle('hidden',!show);
    if(show){vis++;if(c.dataset.heard==='1')visH++;}
  });
  document.getElementById('vis-count').textContent=vis;
  const uLabel = selectedUser ? ' ('+selectedUser+')' : '';
  document.getElementById('vis-heard').textContent=visH+' heard'+uLabel;
  document.getElementById('empty').style.display=vis===0?'block':'none';
}

buildGenreList(); buildUserList(); buildGrid();
try{const sv=localStorage.getItem('grid-cols-aoty');const dv=_isMobile()?3:10;const v=sv?Math.min(20,Math.max(3,parseInt(sv))):dv;document.getElementById('grid-slider').value=v;setGridSize(v);}catch(e){setGridSize(_isMobile()?3:10);}
setTimeout(()=>{
  if(!_isMobile()){const first=document.querySelector('.card:not(.hidden)');if(first){const a=ALBUMS.find(x=>x.n===parseInt(first.dataset.num));if(a)openPanel(a,first);}}
},100);</script>
