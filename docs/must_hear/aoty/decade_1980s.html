 5, 1988, by Elektra Records. Produced by David Kershenbaum, the album is noted for its sparse, acoustic arrangements and socially conscious lyrics, which stood in stark contrast to the synthesized pop and glam metal dominating the charts at the time. The album's commercial breakthrough is famously attributed to Chapman's impromptu performance at the Nelson Mandela 70th Birthday Tribute concert in June 1988. After Stevie Wonder suffered equipment failure, Chapman took the stage alone with her guitar during prime time, captivating a global audience. Following .", "desc_lfm_artist": "Tracy Chapman (born March 30, 1964) is an American singer-songwriter. She was signed to Elektra Records by Bob Krasnow in 1987. In 1988, she released her self-titled debut album, which became a commercial success, aided by her performance at the Nelson Mandela 70th Birthday Tribute concert, and was certified 6× platinum by the Recording Industry Association of America. The album received six Grammy Award nominations, including one for Album of the Year", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave", "verygooood"]}, {"n": 39, "title": "Surfer Rosa", "artist": "Pixies", "year": 1988, "cover": "https://dn710300.ca.archive.org/0/items/mbid-e78fc156-e0be-4e1a-a668-9338356dfe29/mbid-e78fc156-e0be-4e1a-a668-9338356dfe29-3350498477.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4224-pixies-surfer-rosa.php", "aoty_critic_score": 99, "aoty_user_score": 81, "mbid": "74e36cbc-a747-3ebf-a60e-51e656c87741", "yt_id": "X4bYyoeS7Eg", "rym": "https://rateyourmusic.com/release/album/pixies/surfer-rosa", "genres": ["alternative rock", "indie rock", "nsfw cover art"], "desc_lfm_album": "Surfer Rosa is the first full-length album by the American alternative rock band Pixies, released in March 1988 on the British independent record label 4AD. The album's unusual and offbeat subject matter includes references to mutilation and voyeurism; this is augmented by experimental recording, low-fidelity production and a distinctive drum sound. Surfer Rosa contains many of the elements present in the Pixies' earlier output, including Spanish lyrics and references to Puerto Rico. Because of 4AD's independent status, distribution in the United States was handled by British label Rough Trade Records; however, it failed to chart in either the UK or .", "desc_lfm_artist": "Pixies is an American alternative rock band which formed in Boston, Massachusetts, United States in 1986. The band consists of Charles (Black Francis) Thompson IV (vocals, guitar; also known as ''Frank Black''), Joey Santiago (lead guitar),   David Lovering (drums) and Emma Richardson (bass, vocals). Until 2013, the band also featured  Kim Deal on bass and vocals. From 2016 until 2024 the band also featured Paz Lechantin on bass and vocals.   The band officially split in 1993  and reunited in 2004.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 40, "title": "You’re Living All Over Me", "artist": "Dinosaur", "year": 1987, "cover": "https://dn711109.ca.archive.org/0/items/mbid-d1bb95a6-0190-459e-a29d-ef979374e087/mbid-d1bb95a6-0190-459e-a29d-ef979374e087-4828813307.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "40f8a16c-568b-3b94-9682-863c4dc7ab66", "yt_id": "9lN8we7ErgA", "rym": "https://rateyourmusic.com/release/album/dinosaur/youre-living-all-over-me", "genres": ["alternative rock", "hard rock", "indie rock"], "desc_lfm_album": "", "desc_lfm_artist": "There are at least five artists called Dinosaur.\n\n1. Dinosaur is an acclaimed jazz (or 'jazz-meets-synthpop') group from the United Kingdom, led by trumpeter and composer Laura Jurd and featuring keyboardist Elliot Galvin, bassist Conor Chaplin and drummer Corrie Dick. They are signed with British label Edition Records and released three albums thusfar: Together, As One (2016), Wonder Trail (2018) and To The Earth (2020). Dinosaur toured extensively and performed at the world's most prestigious jazz fesivals", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 41, "title": "Nightfall", "artist": "Candlemass", "year": 1987, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7093-nightfall_024409.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7093-candlemass-nightfall.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "00c46fc1-c5a8-377c-867c-d4b6b223d150", "yt_id": "YA8YcyMLJQk", "rym": "https://rateyourmusic.com/release/album/candlemass/nightfall", "genres": [], "desc_lfm_album": "Nightfall is the second studio album by the Swedish doom metal band Candlemass, released on 9 November 1987 through Axis Records. After being dropped from the label Black Dragon Records, Candlemass were the first band signed to Axis. The group had a new line-up from their previous album including vocalist Messiah Marcolin, whose decisions became instrumental during the production and release stages of the album. After being dropped from Black Dragon Records due to the disappointing sales of their previous album Epicus Doomicus Metallicus (1986), Candlemass became the first band signed to David Constable's British label Axis Records. Constable had .", "desc_lfm_artist": "Candlemass is a Swedish epic doom metal band established in Stockholm in 1984 by bassist, songwriter and bandleader Leif Edling and drummer Matz Ekström. The band had a defining influence on doom metal, and the genre itself is named after their debut album Epicus Doomicus Metallicus. Along with Pentagram, Saint Vitus and Trouble, Candlemass has been referred to as one of the \"big four of doom metal\".\n\nAfter releasing five full-length albums and touring extensively throughout the 19 ark wave"], "desc_lfm_album": "Children Of God is the fifth studio album by American post-punk band Swans. The album marks a change in direction from Swans' early work. More tracks utilize acoustic guitars and more melodic vocals. The lyrics also focus more prominently on religious themes. Personnel Michael Gira – vocals, keyboards, acoustic guitar, album cover concept and design, production Jarboe – vocals, backing vocals, piano, keyboards N. Westberg – electric guitar, acoustic guitar Algis Kizys – bass Theodore Parsons – drums, percussion Additional personnel Simon Fraser – flute on \"In My Garden\" Audrey Riley – cello on \"Like a Drug (Sha La La .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 45, "title": "Darklands", "artist": "The Jesus and Mary Chain", "year": 1987, "cover": "https://dn710105.ca.archive.org/0/items/mbid-4de19412-a5ac-4b94-b809-de96c8b9fadf/mbid-4de19412-a5ac-4b94-b809-de96c8b9fadf-25448726992.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5129-the-jesus-and-mary-chain-darklands.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "cda63ecb-5777-37e2-8aa6-32f5c93e0f9f", "yt_id": "oU6xYM2nfnM", "rym": "https://rateyourmusic.com/release/album/the-jesus-and-mary-chain/darklands", "genres": ["alternative rock", "post-punk", "indie rock"], "desc_lfm_album": "Darklands is the second album by Scottish alternative rock band The Jesus and Mary Chain. Recorded in Wessex Studios, Southern Studios, Livingston Studios (all London) and released August, 31. 1987 from the label Blanco y Negro. Unlike their previous album, drum machines were used in place of drummer Bobby Gillespie, who had left to pursue a successful career as the frontman with Primal Scream. The album marks a turning point in the band's music, going from the savage noise-pop of Psychocandy, to a more melodic indie/alternative sound. Gillespie and Primal Scream later recorded a cover of the album's title track. .", "desc_lfm_artist": "The Jesus and Mary Chain is a chaotic, noisy post-punk quartet formed in Scotland, blending the Beach Boys' sunny pop with the Velvet Underground's black-leather cool. Brothers Jim Reid and William Reid, from East Kilbride, Glasgow, Scotland were the primary songwriters. \"The JAMC\" released a constant string of albums, singles and EPs until their demise in 1998. Having influenced many post-punk and noise rock bands, the group finally reunited in 2007.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 46, "title": "Music for the Masses", "artist": "Depeche Mode", "year": 1987, "cover": "https://dn711101.ca.archive.org/0/items/mbid-8d059e75-d9bb-4d90-97a9-1cb6ed7472c6/mbid-8d059e75-d9bb-4d90-97a9-1cb6ed7472c6-9552817368.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5348-depeche-mode-music-for-the-masses.php", "aoty_critic_score": 78, "aoty_user_score": 82, "mbid": "e59021bd-1710-3c13-9449-b78560039592", "yt_id": "TKHxp6VwwGY", "rym": "https://rateyourmusic.com/release/album/depeche-mode/music-for-the-masses", "genres": ["pop rock", "jazz", "industrial", "synth-pop", "trance", "house"], "desc_lfm_album": "Music for the Masses is the sixth studio album by Depeche Mode. Released by Mute Records on September 28, 1987, it provided the band with success in the United States for the first time since Some Great Reward, and the new styles of music that appeared on the album and its predecessor Black Celebration formed the foundation for their breakthrough effort, Violator. These three are widely considered to be the band's peak in both lyrical and musical sense, attributed to Gore's maturing songcraft and Wilder's synthesized orchestrations. It was supported by the For the Masses tour, which made up for .", "desc_lfm_artist": "Depeche Mode is an English synthpop band formed in Basildon, Essex in 1980. The original lineup included Dave Gahan, Martin Gore, Andy Fletcher, and Vince Clarke. The current lineup consists of Gahan and Gore.\n\nWith Clarke as their primary songwriter, Depeche Mode released their debut album \"Speak & Spell\" in 1981 during the British new wave movement. Clarke left the band at the end of 1981 and later formed the groups Yazoo and Erasure. Following his departure", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 47, "title": "Songs About Fucking", "artist": "Big Black", "year": 1987, "cover": "https://dn710600.ca.archive.org/0/items/mbid-3a305ccf-b31e-347c-b139-9968282836e7/mbid-3a305ccf-b31e-347c-b139-9968282836e7-1500962865.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5989-big-black-songs-about-fucking.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "fcaabc32-5f03-3ade-b2cf-68c8c9615b6a", "yt_id": null, "rym": "https://rateyourmusic.com/release/album/big-black/songs-about-fucking", "genres": ["noise rock", "post-hardcore", "industrial rock", "pigfuck", "nsfw cover art"], "desc_lfm_album": "Released on September 10, 1987, \"Songs About Fucking\" is the second LP by the post-hardcore/noise rock band Big Black. It placed 54th on Pitchfork Media's 'Top 100 Albums of the 1980s'. Included was covers of Kraftwerk's \"The Model\" and Cheap Trick's \"He's a Whore\". The band had already decided to split up before the album was recorded, prompted by guitarist Santiago Durango's decision to enroll in Law School, and the band's desire to quit while at their peak. References / tributes include Jason Lescalleet's \"Songs About Nothing\", The Copyrights and the Dopamines' \"Songs About Fucking Up\", and Kid606's \"Songs About .", "desc_lfm_artist": "Big Black was an independent noise rock band founded in Evanston, Illinois, United States, that was active between 1982 and 1987. They were headed by singer, lyricist, guitarist, and co-songwriter Steve Albini. They have been classified as post-hardcore/noise rock, and were a formative influence on industrial rock, but the band members have always described the band as solidly punk rock; in the notes for Pigpile, a live recording of their final London performance, Albini explicitly describes Big Black as punk.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "sdecandelario"]}, {"n": 48, "title": "Document", "artist": "R.E.M.", "year": 1987, "cover": "https://ia601902.us.archive.org/1/items/mbid-89148313-06fe-4b73-bd7c-df7a93cd3405/mbid-89148313-06fe-4b73-bd7c-df7a93cd3405-3884037236.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6105-rem-document.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "137385b2-b4cc-385e-9d59-781e7674f5bc", "yt_id": "0-OL_9YB2fA", "rym": "https://rateyourmusic.com/release/album/r_e_m/document", "genres": ["alternative rock", "pop rock", "jangle pop"], "desc_lfm_album": "Document was R.E.M.'s first album co-produced by Scott Litt and the band, a collaboration that continued through Green, Out of Time, Automatic for the People, Monster, and New Adventures in Hi-Fi. The album's clear production and muscular rock riffs helped to move the band towards mainstream success and built on the work done by Don Gehman, who had produced their previous album Lifes Rich Pageant. This release not only launched \"The One I Love,\" R.E.M.'s first Top 10 hit on the Billboard Hot 100 (it reached number nine), but also gave them their first platinum album. \"Exhuming McCarthy\" makes an .", "desc_lfm_artist": "R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming.", "desc_mb_album": "", "desc_mb_artist": "Has a gigography and other dates at [http://www.remtimeline.com]", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 49, "title": "Bad", "artist": "Michael Jackson", "year": 1987, "cover": "https://dn711105.ca.archive.org/0/items/mbid-60b529f1-f99b-499f-9b3d-e96f9971039e/mbid-60b529f1-f99b-499f-9b3d-e96f9971039e-17067123637.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10686-michael-jackson-bad.php", "aoty_critic_score": 88, "aoty_user_score": 86, "mbid": "a5711a77-42d1-3f4c-830c-e27a96f0800f", "yt_id": "ncvBut6QMPo", "rym": "https://rateyourmusic.com/release/album/michael-jackson/bad", "genres": ["pop rock", "synth funk", "ballad", "contemporary r&b", "pop soul", "dance-pop"], "desc_lfm_album": "\"Bad\" is the seventh studio album by American singer Michael Jackson, released on August 31, 1987, by Epic Records. The album was produced over a three-year period from 1985 to 1987 and marked Jackson’s third and final collaboration with producer Quincy Jones. A dance-pop and R&B release, it reflected increased artistic control by Jackson, who composed and co-produced all but two of its tracks. Its themes include celebrity, romance, world peace, and self-improvement, and it features guest appearances by Siedah Garrett and Stevie Wonder. Following the commercial success of \"Thriller\" (1982), expectations for the album were high. Jackson adopted a .", "desc_lfm_artist": "Michael Joseph Jackson (August 29, 1958 – June 25, 2009) was an American singer, songwriter, dancer, and philanthropist. Known as the \"King of Pop,\" he is widely recognized as one of the most influential figures in popular music during the 20th century. His career spanned more than four decades, during which he broke racial barriers in the music industry and became a global icon. Jackson popularized street dance moves such as the moonwalk, the robot", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 50, "title": "Substance 1987", "artist": "New Order", "year": 1987, "cover": "https://ia800304.us.archive.org/5/items/mbid-e1c35112-c20f-48ea-86c4-9c1345a257f3/mbid-e1c35112-c20f-48ea-86c4-9c1345a257f3-32933842207.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "95f78ba6-4cdb-3c88-972a-4ef3220f7ad1", "yt_id": "9-NFosnfd2c", "rym": null, "genres": ["alternative rock", "post-punk", "new wave", "synth-pop", "alternative dance", "dance-pop"], "desc_lfm_album": "Substance is a 1987 double compilation album by New Order, consisting of all of the band's singles at that point in their 12-inch versions, together with their respective B-side tracks. The then newly-released non-album single \"True Faith\" is also featured, along with its B-side \"1963\". The collection was released on vinyl, double CD, double cassette and Digital Audio Tape. While Substance presents a sizeable collection of singles, there are many omissions and differences to be found from the original single releases: * The versions of \"Temptation\" and \"Confusion\" were re-recorded in 1987 especially for Substance and the original versions do .", "desc_lfm_artist": "New Order are an English new wave/synthpop band which formed in 1980 in Salford, England, United Kingdom by the three remaining members of Joy Division. The band's classic lineup consists of Bernard Sumner (vocals, guitar, keyboards), Peter Hook (bass, electronic percussion), Gillian Gilbert (keyboards, guitar) and Stephen Morris (drums, keyboards). The group effectively disbanded in 1993 but reformed in 1998. Gilbert left in 2001 to look after her and Morris' children and was replaced by guitarist/keyboardist Phil Cunningham.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 51, "title": "Within the Realm of a Dying Sun", "artist": "Dead Can Dance", "year": 1987, "cover": "https://cdn2.albumoftheyear.org/600x0/album/36662-within-the-realm-of-a-dying-sun_201957.jpg", "aoty_url": "https://www.albumoftheyear.org/album/36662-dead-can-dance-within-the-realm-of-a-dying-sun.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "e1d35c40-2649-3f92-b4da-ff8572d6daa2", "yt_id": "nOrEU9MVFXw", "rym": "https://rateyourmusic.com/release/album/dead-can-dance/within-the-realm-of-a-dying-sun/", "genres": ["modern classical", "gothic rock", "ethereal wave", "dark ambient", "neoclassical dark wave", "gothic"], "desc_lfm_album": "Within the Realm of a Dying Sun is the third album recorded by Dead Can Dance, the duo composed of Lisa Gerrard and Brendan Perry, in 1987. The cover's photograph was taken in Paris, at the Père-Lachaise cemetery. It features the grave of the politician Raspail. Lisa Gerrard's vocals feature prominently in the second half of the album, and her singing style often has mellifluous Oriental overtones, especially on the track titled “Cantara.” Track listing 1. \"Anywhere Out of the World\" – 5:08 2. \"Windfall\" – 3:30 3. \"In the Wake of Adversity\" – 4:14 4. \"Xavier\" – 6:16 5. .", "desc_lfm_artist": "Dead Can Dance is a British-Australian musical project formed in 1981 in Melbourne by Lisa Gerrard and Brendan Perry. The band relocated to London, England, in May 1982. Australian music historian Ian McFarlane described Dead Can Dance's style as \"constructed soundscapes of mesmerizing grandeur and solemn beauty; African polyrhythms, Gaelic folk, Gregorian chant, Middle Eastern mantras, and art rock.\"\n\nHaving disbanded in 1998, they reunited briefly in 2005 for a world tour and reformed in 2011", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 52, "title": "Paid In Full", "artist": "Eric B. & Rakim", "year": 1987, "cover": "https://dn721900.ca.archive.org/0/items/mbid-5f1825ad-2e72-37a3-a5ed-4f8c3ba08035/mbid-5f1825ad-2e72-37a3-a5ed-4f8c3ba08035-21043627171.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6478-eric-b-rakim-paid-in-full.php", "aoty_critic_score": 100, "aoty_user_score": 80, "mbid": "6dd9c023-1c11-4f2d-b858-5ea382d77bfd", "yt_id": "E7t8eoA_1jQ", "rym": "https://rateyourmusic.com/release/album/eric-b-and-rakim/paid-in-full", "genres": ["hip hop"], "desc_lfm_album": "Paid in Full is credited as a benchmark album of golden age hip hop. Rakim's rapping, which pioneered the use of internal rhymes in hip hop, set a higher standard of lyricism in the genre and served as a template for future rappers. The album's heavy sampling by Eric B. became influential in hip hop production. The record has sold over a million copies and the Recording Industry Association of America (RIAA) certified it platinum in 1995. In 2003, the album was ranked number 228 on Rolling Stone magazine's list of the 500 greatest albums of all time. .", "desc_lfm_artist": "Eric B. & Rakim was a hip-hop duo from New York City, New York, United States composed of DJ Eric Barrier (born November 8, 1965) and MC Rakim (born William Michael Griffin Jr.). The duo went on to release 4 studio albums with their 1987, Paid in Full being regarded as one the most influential albums in Hip Hop. In 1988, they released their second album titled, Follow The Leader. They later continued to release two more albums in 1990, Let the Rhythm Hit 'Em and in 1992", "desc_mb_albu  experimental noise distinguished them from other underground bands of the 1980s. Their signing to DGC in 1990 was unusual in the creative freedom given in the contract, and proved that it was possible to remain true to an independent ethic while on a major label.\r\nSee also [http://musicbrainz.org/show/artist/?artistid=58284|Ciccone Youth].", "heard_by": ["Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 54, "title": "Kiss Me, Kiss Me, Kiss Me", "artist": "The Cure", "year": 1987, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4388-kiss-me-kiss-me-kiss-me_081424.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4388-the-cure-kiss-me-kiss-me-kiss-me.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "ab132c83-097a-33f0-b557-edd6b6ce1c7d", "yt_id": "rZAaEaU4fGA", "rym": null, "genres": [], "desc_lfm_album": "\"Kiss Me, Kiss Me, Kiss Me\" is the seventh studio album by British alternative rock band The Cure. Released in 1987, this album helped put The Cure into the American mainstream, becoming their first album to reach the Billboard Top 40. Though a double album, it was released as a single CD, and single cassettes. A limited vinyl edition came with an extra 6 track 12\" (orange vinyl, featuring the songs \"\"Sugar Girl\", \"Snow In Summer\", \"Icing Sugar\", \"A Japanese Dream\", \"Breathe\" and \"A Chain Of Flowers\"). One track, \"Hey You!!!\", was removed from the original CD release (due to .", "desc_lfm_artist": "The Cure are an English gothic rock band formed in Crawley in 1976 by Robert Smith (vocals, guitar) and Lol Tolhurst (drums). The band’s current lineup consists of Smith, Simon Gallup (bass), Roger O'Donnell (keyboards), Perry Bamonte (guitar and keyboards), Jason Cooper (drums), and Reeves Gabrels (guitar). Smith has been the sole constant member throughout the group’s history, while Gallup has appeared on all but two of the band’s studio albums.", "desc , more commonly known mononymously as Prince, was an American singer-songwriter, musician, and record producer. The recipient of numerous awards and nominations, he is widely regarded as one of the greatest musicians of his generation. He was known for his flamboyant, androgynous persona; his wide vocal range, which included a far-reaching falsetto and high-pitched screams; and his skill as a multi-instrumentalist, often preferring to play all or most of the instruments on his recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 59, "title": "Louder Than Bombs", "artist": "The Smiths", "year": 1987, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5644-louder-than-bombs-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5644-the-smiths-louder-than-bombs.php", "aoty_critic_score": 89, "aoty_user_score": 86, "mbid": "329a3607-9b56-351c-84e7-c6f8f19d8056", "yt_id": "VDru3gQWaOI", "rym": null, "genres": [], "desc_lfm_album": "Louder Than Bombs is the third compilation album by English rock band The Smiths, released as a double album on March 30, 1987 by their American record company, Sire Records. It peaked at number 62 on the US Billboard 200 album chart. Popular demand prompted their British record company, Rough Trade, to issue the album domestically as well. Upon its release in the UK in May 1987, it reached No. 38 on the British charts. In 2003, the album was ranked No. 365 on Rolling Stone magazine's list of The 500 Greatest Albums of All Time, and ranked No. 369 .", "desc_lfm_artist": "The Smiths were an English rock band formed in Manchester in 1982, composed of Morrissey (vocals), Johnny Marr (guitar), Andy Rourke (bass), and Mike Joyce (drums). Morrissey and Marr formed the band's songwriting partnership. The Smiths are regarded as one of the most important acts to emerge from 1980s British independent music.\n\nThe Smiths signed to the independent label Rough Trade Records in 1983 and released their debut album, The Smit ing -- but upon reflection is very happy with the way the album turned out. This album has a very \"Beatlesque\" feel to it. Often cited as XTC's best album. Initially released with \"Mermaid Smiled\" in the UK, but then new pressings had \"Dear God\" added after it became a minor hit on alternative charts Despite all that in November 22, 2010 Ape Records re-issued Skylarking on remastered 45RPM .", "desc_lfm_artist": "XTC were an English post-punk band formed in Swindon, England in 1972, led by Andy Partridge (guitars, vocals) and  Colin Moulding (bass, vocals). Active between the late 1970s and the mid 2000s, XTC's music ranged from jerky new wave/punk riffs to lushly-arranged progressive pop. They also drew heavily from vintage pop rock and psychedelia from the 1960s, genres which they began to explore more deeply after creating The Dukes of Stratosphear side-project.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "verygooood"]}, {"n": 63, "title": "Reign in Blood", "artist": "Slayer", "year": 1986, "cover": "https://dn720608.ca.archive.org/0/items/mbid-f09a3d0b-5760-41e5-bd62-1e7403b27522/mbid-f09a3d0b-5760-41e5-bd62-1e7403b27522-26676279934.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5586-slayer-reign-in-blood.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "dbf1b3c0-1efb-4e5f-9fe1-4c42b144aa24", "yt_id": "nlPHYNG6ZF4", "rym": "https://rateyourmusic.com/release/album/slayer/reign-in-blood", "genres": ["heavy metal", "metal", "death metal", "thrash metal"], "desc_lfm_album": "\"Reign in Blood\" is the third studio album by American thrash metal band Slayer, released on October 20, 1986, by Def Jam Recordings. It marked the band's first collaboration with producer Rick Rubin, whose contributions influenced the evolution of their sound. The album's release was delayed due to controversy surrounding the opening track, \"Angel of Death,\" which references Josef Mengele and describes human experimentation wave/synthpop band which formed in 1980 in Salford, England, United Kingdom by the three remaining members of Joy Division. The band's classic lineup consists of Bernard Sumner (vocals, guitar, keyboards), Peter Hook (bass, electronic percussion), Gillian Gilbert (keyboards, guitar) and Stephen Morris (drums, keyboards). The group effectively disbanded in 1993 but reformed in 1998. Gilbert left in 2001 to look after her and Morris' children and was replaced by guitarist/keyboardist Phil Cunningham.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 65, "title": "Somewhere in Time", "artist": "Iron Maiden", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12160-somewhere-in-time_045515.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12160-iron-maiden-somewhere-in-time.php", "aoty_critic_score": 74, "aoty_user_score": 84, "mbid": "a5fe4d2d-3aab-3e86-91ad-22a3fe16c4f2", "yt_id": "TxlxLLky0_Y", "rym": "https://rateyourmusic.com/release/album/iron-maiden/somewhere-in-time", "genres": [], "desc_lfm_album": "Somewhere in Time is the sixth studio album by British heavy metal band Iron Maiden, released on 29 September 1986 on EMI in Europe and its sister label Capitol Records in the US (it was re-released by Sanctuary/Columbia Records in the US in 2002). The studio follow-up to the hugely successful Powerslave/Live After Death pair, it was the first Iron Maiden album to feature guitar synthesizers. Bruce Dickinson's song material was refused in favour of the songs of guitarist Adrian Smith, who wrote the bulk of the songs identified with the album (including the singles \"Wasted Years\" and \"Stranger in .", "desc_lfm_artist": "Iron Maiden is an English heavy metal band formed in Leyton, East London, in 1975 by bassist and primary songwriter Steve Harris. Although the lineup changed several times in the early years, it has remained stable for most of the band’s history with Harris, lead vocalist Bruce Dickinson, drummer Nicko McBrain, and guitarists Dave Murray, Adrian Smith, and Janick Gers.\n\nAs pioneers of the new wave of British heavy metal movement, Iron Maiden achieved", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "Rocky_stereo", "sdecandelario"]}, {"n": 66, "title": "Peace Sells… but Who’s Buying?", "artist": "Megadeth", "year": 1986, "cover": "https://ia601909.us.archive.org/15/items/mbid-585946c1-b920-4257-8ec8-cbdb5ac9e2f5/mbid-585946c1-b920-4257-8ec8-cbdb5ac9e2f5-42308428639.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "4eea6bcc-3226-3c0d-a71d-af682a0a1dd8", "yt_id": "hGg8T1B_HMk", "rym": "https://rateyourmusic.com/release/album/megadeth/peace-sells-but-whos-buying", "genres": ["heavy metal", "metal", "thrash metal", "speed metal", "rock"], "desc_lfm_album": "", "desc_lfm_artist": "Megadeth is an American thrash metal band formed in Los Angeles in 1983 by vocalist and guitarist Dave Mustaine. The group is known for complex guitar work and precise musicianship and is regarded as one of the big four bands of American thrash metal along with Slayer, Anthrax and Metallica. Its music features fast rhythm sections, dual lead guitars and lyrics addressing topics such as war, politics, religion, mortality and personal relationships.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "sdecandelario"]}, {"n": 67, "title": "Graceland", "artist": "Paul Simon", "year": 1986, "cover": "https://ia801709.us.archive.org/9/items/mbid-95718634-fc1e-3ccc-b0cf-a9df519230e9/mbid-95718634-fc1e-3ccc-b0cf-a9df519230e9-4133831535.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6511-paul-simon-graceland.php", "aoty_critic_score": 100, "aoty_user_score": 83, "mbid": "19847822-1430-3380-9cf1-bc45545b34ac", "yt_id": "eL2fMjSA-rs", "rym": "https://rateyourmusic.com/release/album/paul-simon/graceland.p", "genres": ["folk rock", "folk", "pop rock", "funk", "afrobeat", "zydeco"], "desc_lfm_album": "Graceland is an album released by Paul Simon in 1986. It was a hit in the UK topping the charts at #1. It also reached #3 in the US. The album won the Album of the Year Grammy award, while the title song won the Record of the Year Grammy award, for 1986 and 1987 respectively. In 2006, the album was added to the United States National Recording Registry, along with another 24 significant recordings that year. Coming at a time when Simon's musical career was at something of a low ebb following the disappointing public response to Hearts and .", "desc_lfm_artist": "Paul Frederic Simon (born October 13, 1941) is an American singer-songwriter. One of the most celebrated artists of the twentieth century, Simon's career has spanned six decades. Born in New Jersey, Simon grew up in the borough of Queens in New York City and developed an interest in rock music in his teens.\n\nHe began performing with his schoolfriend Art Garfunkel in 1956; together the two came to prominence in the 1960s as Simon & Garfunkel. The duo's blend of folk and rock music in hits like \"The Sound of Silence\", \"Mrs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 68, "title": "Lifes Rich Pageant", "artist": "R.E.M.", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6104-lifes-rich-pageant_170351.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6104-rem-lifes-rich-pageant.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "8b6b2628-7bd4-3fed-9d65-cf4e5dc45939", "yt_id": "IfVvgQb6MC8", "rym": "https://rateyourmusic.com/release/album/r_e_m/lifes-rich-pageant", "genres": [], "desc_lfm_album": "Lifes Rich Pageant is the fourth studio album by the American alternative rock band R.E.M., released in 1986. R.E.M. chose Don Gehman to produce the album, which was recorded at John Mellencamp's Belmont Mall Studios in Belmont, Indiana. .", "desc_lfm_artist": "R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming.", "desc_mb_album": "", "desc_mb_artist": "Has a gigography and other dates at [http://www.remtimeline.com]", "heard_by": ["armandwave"]}, {"n": 69, "title": "True Blue", "artist": "Madonna", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6370-true-blue-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6370-madonna-true-blue.php", "aoty_critic_score": 81, "aoty_user_score": 80, "mbid": "fb22db33-78c8-3dd9-abb5-9f17745147fc", "yt_id": "ci8CnWnNhJw", "rym": "https://rateyourmusic.com/release/album/madonna/true-blue", "genres": [], "desc_lfm_album": "True Blue is the third studio album by Madonna, released on June 30, 1986, by Sire Records. She co-wrote and produced the entire album with Stephen Bray and Patrick Leonard. True Blue deals with her visions of love, work, dreams as well as disappointments, and was inspired by her then husband Sean Penn, to whom Madonna dedicated the album. Musically, the songs on the album took a different direction from her previous endeavours, incorporating classical music in order to engage an older audience who had been skeptical of her music. .", "desc_lfm_artist": "Madonna Louise Ciccone (/tʃɪˈkoʊni/ chih-KOH-nee; born 16 August 1958) is an American singer, songwriter, record producer, and actress. Known as the \"Queen of Pop\", she is recognised for her continual reinvention and versatility in music, songwriting, and visual presentation. Her work frequently incorporates social, political, sexual, and religious themes, generating both critical acclaim and controversy. Madonna is considered a significant cultural", "desc_mb_album": "", "desc_mb_artist": "If you're looking for ''Greatest Hits Vol. 2'' or something similar, it is already listed under the correct name ''[https://musicbrainz.org/release-group/a0aa8b0a-5e10-3627-afde-7235b86042f6|GHV2]''. \r\nPlease '''do not''' add it again.\r\n\r\nRelease labels according to date: (all releases should follow this*)\r\nWMG parent (1982-2009) as Sire (1982–1995), Maverick (1992–2004), Warner Bros. (2004–2010), Live Nation Artists (2009-)\n\n-------\n\nBorn in Bay City, Michigan, USA, as Madonna Louise Ciccone, Madonna had the extra middle name Veronica added in childhood as confirmation of her family's Catholicism.\r\nHer music career took off in the early 1980's under the performance name [http://musicbrainz.org/artist/79239441-bfd5-4981-a70c-55c3f15c1287.html|Madonna].\r\n\r\nIt is believed her legal name has ", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 70, "title": "The Queen Is Dead", "artist": "The Smiths", "year": 1986, "cover": "https://dn711008.ca.archive.org/0/items/mbid-2bad7aba-7253-4de2-b807-435be9343ae1/mbid-2bad7aba-7253-4de2-b807-435be9343ae1-44378094626.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4217-the-smiths-the-queen-is-dead.php", "aoty_critic_score": 100, "aoty_user_score": 88, "mbid": "d8dde278-482c-3cc8-a530-fea70476f3a5", "yt_id": "D5cZ-oLVJzY", "rym": "https://rateyourmusic.com/release/album/the-smiths/the-queen-is-dead", "genres": ["alternative rock", "post-punk", "indie rock", "indie pop", "jangle pop", "neo-acoustic"], "desc_lfm_album": "The Queen Is Dead is the third studio album by the English rock band The Smiths. It was released on 16 June 1986 in the United Kingdom by Rough Trade Records and released in the United States on 23 June 1986 through Sire Records. The album reached number two on the UK album chart, maintaining a chart residency for 22 weeks, number 70 on the Billboard 200, and was certified Gold by the RIAA in late 1990. It has sold consistently well ever since. Guitarist Johnny Marr wrote several songs that would later appear on The Queen Is Dead while .", "desc_lfm_artist": "The Smiths were an English rock band formed in Manchester in 1982, composed of Morrissey (vocals), Johnny Marr (guitar), Andy Rourke (bass), and Mike Joyce (drums). Morrissey and Marr formed the band's songwriting partnership. The Smiths are regarded as one of the most important acts to emerge from 1980s British independent music.\n\nThe Smiths signed to the independent label Rough Trade Records in 1983 and released their debut album, The Smiths, in 1984.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 71, "title": "Epicus Doomicus Metallicus", "artist": "Candlemass", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7092-epicus-doomicus-metallicus_174305.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7092-candlemass-epicus-doomicus-metallicus.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "7d42c10a-5cc7-3af4-89c6-5234e452e6d0", "yt_id": "Plat5P6h6W0", "rym": "https://rateyourmusic.com/release/album/candlemass/epicus-doomicus-metallicus/", "genres": ["heavy metal", "doom metal", "metal", "traditional doom metal", "epic doom metal"], "desc_lfm_album": "Epicus Doomicus Metallicus is the debut album of the Swedish doom metal band Candlemass. It was released June 10, 1986 on Black Dragon Records. On its release, the album had a significantly different sound than other European heavy metal bands of the time, because of their use of operatic vocals mixed over slow and heavy guitar riffs. The album did not sell well on its initial release, which led to the group being dropped from the label during the same year. Since then, the album has been re-issued in several different formats. The album title Epicus Doomicus Metallicus is a .", "desc_lfm_artist": "Candlemass is a Swedish epic doom metal band established in Stockholm in 1984 by bassist, songwriter and bandleader Leif Edling and drummer Matz Ekström. The band had a defining influence on doom metal, and the genre itself is named after their debut album Epicus Doomicus Metallicus. Along with Pentagram, Saint Vitus and Trouble, Candlemass has been referred to as one of the \"big four of doom metal\".\n\nAfter releasing five full-length albums and touring extensively throughout the 1980s and early 1990s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 72, "title": "So", "artist": "Peter Gabriel", "year": 1986, "cover": "https://dn710909.ca.archive.org/0/items/mbid-be7b4f45-f19b-37ab-aa87-64501e75ffe8/mbid-be7b4f45-f19b-37ab-aa87-64501e75ffe8-7963930056.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7632-peter-gabriel-so.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "be3cc3e7-bdb0-3c13-a60b-a985b30eb603", "yt_id": "MeRmMz0_zJc", "rym": "https://rateyourmusic.com/release/album/peter-gabriel/so", "genres": ["art rock", "classic rock", "pop rock", "progressive rock", "art pop", "synth-pop"], "desc_lfm_album": "So is the fifth studio album (and seventh album overall) by British rock musician Peter Gabriel, released in 1986. Many of its songs reflect a more conventional pop-writing style and became radio hits, others still retain Gabriel's dark, brooding sense of experimentalism. It is Peter Gabriel's second album produced by Canadian artist Daniel Lanois. The previous year, the two of them had worked together on Birdy. Lanois had been previously known for his ambient collaborations with Brian Eno as well as producing U2 since 1984. As he had with the soundtrack to the film Birdy, Lanois brought many of his .", "desc_lfm_artist": "Peter Brian Gabriel (born 13 February 1950) is an English musician, singer, songwriter, record producer, and activist. He rose to fame as the original lead singer of the progressive rock band Genesis. After leaving Genesis in 1975, he launched a successful solo career with \"Solsbury Hill\" as his first single. His fifth studio album, So (1986), is his best-selling release and is certified triple platinum in the UK and five times platinum in the US.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 73, "title": "Atomizer", "artist": "Big Black", "year": 1986, "cover": "https://dn721207.ca.archive.org/0/items/mbid-ed007f01-f804-39bc-b980-09ac36dd5f73/mbid-ed007f01-f804-39bc-b980-09ac36dd5f73-23448744321.png", "aoty_url": "https://www.albumoftheyear.org/album/5990-big-black-atomizer.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "94e3e968-4a8d-3d2f-9538-b96c0bfa2a06", "yt_id": "bEH75l-I8Ok", "rym": "https://rateyourmusic.com/release/album/big-black/atomizer", "genres": ["noise rock", "post-punk", "punk rock", "indie rock", "post-hardcore"], "desc_lfm_album": "It is their debut full-length album as all previous releases are EPs. The LP is accompanied by liner notes that explain the stories behind many of the songs. The album reached number 197 in the Billboard Hot 200 chart. The album cover is inspired by the Warner Bros. Cartoons art of animator Chuck Jones. The most popular song on the album and possibly by Big Black, \"Kerosene\", has a shaky guitar line that gives it an odd appeal and a slower rhythm than most Big Black songs. It discusses being bored and then as a result wanting to be set .", "desc_lfm_artist": "Big Black was an independent noise rock band founded in Evanston, Illinois, United States, that was active between 1982 and 1987. They were headed by singer, lyricist, guitarist, and co-songwriter Steve Albini. They have been classified as post-hardcore/noise rock, and were a formative influence on industrial rock, but the band members have always described the band as solidly punk rock; in the notes for Pigpile, a live recording of their final London performance, Albini explicitly describes Big Black as punk.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 74, "title": "EVOL", "artist": "Sonic Youth", "year": 1986, "cover": "https://dn721902.ca.archive.org/0/items/mbid-2cb6b37e-0d9a-45bf-ad33-549f9129eb34/mbid-2cb6b37e-0d9a-45bf-ad33-549f9129eb34-28344581306.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6427-sonic-youth-evol.php", "aoty_critic_score": 88, "aoty_user_score": 81, "mbid": "77641c44-b2d6-3cfb-a82c-37bbec30abfd", "yt_id": "DSqQ7Bc9PlQ", "rym": "https://rateyourmusic.com/release/album/sonic-youth/evol", "genres": ["experimental rock", "alternative rock", "art rock", "noise rock", "no wave", "gothic rock"], "desc_lfm_album": "EVOL is the third studio album by American alternative rock band Sonic Youth, released in 1986 on SST Records. The album cover features a picture of Lung Leg, a still taken from Submit to Me, a film by Richard Kern. The album is notable for being the first with new drummer Steve Shelley, replacing Bob Bert, and for showing signs of the band transitioning away from their noise-rock past and toward a greater rock sensibility. It was the first album by the band released on the SST label. By 1986, label founder Greg Ginn was anxious for SST to move .", "desc_lfm_artist": "Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups", "desc_mb_album": "", "desc_mb_artist": "Sonic Youth were a four-piece band from New York. Emerging from the no-wave movement, their experimental noise distinguished them from other underground bands of the 1980s. Their signing to DGC in 1990 was unusual in the creative freedom given in the contract, and proved that it was possible to remain true to an independent ethic while on a major label.\r\nSee also [http://musicbrainz.org/show/artist/?artistid=58284|Ciccone Youth].", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 75, "title": "Tinderbox", "artist": "Siouxsie and the Banshees", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11984-tinderbox-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11984-siouxsie-and-the-banshees-tinderbox.php", "aoty_critic_score": 80, "aoty_user_score": 85, "mbid": "9575d8eb-3d5f-4028-af88-0492e17b4898", "yt_id": "UoP35qcymLE", "rym": null, "genres": [], "desc_lfm_album": "Tinderbox is the seventh studio album released by the English post-punk band Siouxsie & the Banshees. It was the first effort with new guitarist John Valentine Carruthers. Sounds magazine praised the album at its release. Kevin Murphy wrote, \"Tinderbox romps and swoons with all the majesty of Dreamhouse\", and added, \"it's a refreshing slant on the Banshees' disturbing perspective and restores their vivid shades to pop's pale palette.\" .", "desc_lfm_artist": "Siouxsie and the Banshees was an influential English post-punk band which formed during 1976 in London. Initially associated with the British punk rock scene, the band quickly evolved to create, \"A form of post-punk discord full of daring rhythmic and sonic experimentation.\" The Times would also cite Siouxsie and the Banshees as, \"One of the most audacious and uncompromising musical adventurers of the post-punk era.\" After their split in the year 1996", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "armandwave", "sdecandelario"]}, {"n": 76, "title": "Parade (Music From the Motion Picture Under the Cherry Moon)", "artist": "Prince and The Revolution", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14221-parade-music-from-the-motion-picture-under-the-cherry-moon_212830.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14221-prince-and-the-revolution-parade-music-from-the-motion-picture-under-the-cherry-moon.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "8c20e5ba-1418-393e-a946-b6525fa3a94a", "yt_id": "_WmPeLOLDnA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Prince formed The Revolution in Minneapolis, Minnesota in 1979 as his backing band for his first concert tour. The original lineup consisted of Gayle Chapman on keyboards, André Cymone on bass, Dez Dickerson on guitar, Doctor Fink on keyboards and Bobby Z. on drums & percussion.\n\nThe band went nameless for almost three years while supporting Prince live and appearing in his music videos. Chapman and Cymone left in the early 1980's and were replaced by Lisa Coleman on keyboards and Brownmark on bass.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84"]}, {"n": 77, "title": "Black Celebration", "artist": "Depeche Mode", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5349-black-celebration_080253.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5349-depeche-mode-black-celebration.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "b9c6879f-3a34-3aa0-a68f-73ced2608f7a", "yt_id": "WWr4jaGOmPY", "rym": "https://rateyourmusic.com/release/album/depeche-mode/black-celebration-41/", "genres": [], "desc_lfm_album": "Black Celebration is the fifth studio album by English electronic music band Depeche Mode, released on March 17, 1986 by Mute Records. The album further cemented the darkening sound that was initially hinted towards on their albums Construction Time Again and Some Great Reward. Black Celebration has been cited as one of the most influential albums of the 1980s. To promote the album, the band embarked on the Black Celebration Tour. .", "desc_lfm_artist": "Depeche Mode is an English synthpop band formed in Basildon, Essex in 1980. The original lineup included Dave Gahan, Martin Gore, Andy Fletcher, and Vince Clarke. The current lineup consists of Gahan and Gore.\n\nWith Clarke as their primary songwriter, Depeche Mode released their debut album \"Speak & Spell\" in 1981 during the British new wave movement. Clarke left the band at the end of 1981 and later formed the groups Yazoo and Erasure. Following his departure", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "armandwave"]}, {"n": 78, "title": "Master of Puppets", "artist": "Metallica", "year": 1986, "cover": "https://dn710703.ca.archive.org/0/items/mbid-fed37cfc-2a6d-4569-9ac0-501a7c7598eb/mbid-fed37cfc-2a6d-4569-9ac0-501a7c7598eb-2545774439.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4222-metallica-master-of-puppets.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "3d00fb45-f8ab-3436-a8e1-b4bfc4d66913", "yt_id": "K6LA7v1PApU", "rym": "https://rateyourmusic.com/release/album/metallica/master-of-puppets", "genres": ["hard rock", "heavy metal", "metal", "progressive metal", "thrash metal", "speed metal"], "desc_lfm_album": "\"Master of Puppets\" is the third studio album by the American heavy metal band Metallica, released on March 3, 1986, by Elektra Records. It was recorded at Sweet Silence Studios in Copenhagen, Denmark, with producer Flemming Rasmussen and is the band’s final album to feature bassist Cliff Burton, who died on September 27, 1986, when the group’s tour bus crashed near Dörarp, Sweden, during the album’s supporting tour. The cover artwork, designed by Metallica and Peter Mensch and painted by Don Brautigam, depicts a cemetery of white crosses controlled by unseen hands emerging from a red, clouded sky, illuminated by .", "desc_lfm_artist": "Metallica is an American heavy metal band formed in Los Angeles in 1981 by James Hetfield and Lars Ulrich and later based in San Francisco. Known for fast tempos, complex instrumentals and aggressive musicianship, the group became one of the founding big four bands of thrash metal alongside Megadeth, Anthrax and Slayer. The current lineup consists of Hetfield, Ulrich, Kirk Hammett and Robert Trujillo. Former members include Dave Mustaine, Ron McGovney, Cliff Burton and Jason Newsted.", "desc_mb_album": "", "desc_mb_artist": "'''Attention!''' The album known sometimes as ''The Black Album'' is already in this database, it is correctly named simply ''[http://musicbrainz.org/release-group/e8f70201-8899-3f0c-9e07-5d6495bc8046.html|Metallica]''. This is because ''The Black Album'' is only a fan-composed name. Please do not add it or rename it.\r\n\r\nBoth the infamous ''Garage Days'' (in the EPs section) and ''[http://musicbrainz.org/release-group/49371adc-871d-38f6-bb60-fd9e5af6795f.html|S&M]'' (in the Live section) are also here, they're just a bit scattered. \r\n\r\nMetallica has been selling Official/Live concert recordings on [http://www.livemetallica.com] since 2004-03-02.  Please add a \"X can be purchased for download at Y\" relationship if you add one of these releases.  For a list of which shows have already been a", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 79, "title": "The Colour of Spring", "artist": "Talk Talk", "year": 1986, "cover": "https://ia801407.us.archive.org/10/items/mbid-e673b9e5-31a2-4bbf-bcff-5e380695b511/mbid-e673b9e5-31a2-4bbf-bcff-5e380695b511-33477101762.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6513-talk-talk-the-colour-of-spring.php", "aoty_critic_score": 63, "aoty_user_score": 81, "mbid": "072ec17c-aa60-3070-99ab-fce9e9009d97", "yt_id": "wuSZjGn2AKE", "rym of the 1980s and contemporary music. Containing autobiographical themes, a majority of the album's lyrics came as .", "desc_lfm_artist": "Janet Damita Jo Jackson (born May 16, 1966) is an American singer, songwriter, actress, and dancer. She is recognized for her contributions to pop music, including socially conscious and provocative themes in her recordings, as well as her choreography and stage performances. Her work has been influential in the development of MTV and has contributed to breaking gender and racial barriers in the music industry. Jackson’s lyrics often address social issues and personal experiences, appealing to a broad youth audience.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 81, "title": "Horse Rotorvator", "artist": "Coil", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6517-horse-rotorvator.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6517-coil-horse-rotorvator.php", "aoty_critic_score": 98, "aoty_user_score": 81, "mbid": "5f97fb53-a2f4-35ec-83d8-6d990d94007b", "yt_id": "RNE18YuDjoE", "rym": "https://rateyourmusic.com/release/album/coil/horse-rotorvator/", "genres": ["industrial", "avant-garde pop", "post-industrial", "electronic"], "desc_lfm_album": "Horse Rotorvator is the second studio album by English experimental music group Coil. Horse Rotorvator was initially released in the UK in 1986 by Force & Form and was manufactured by K.422, a Some Bizzare Records side label. In the USA, the album was released by Relativity Records. The album was first reissued on CD in 1988. The album title was inspired by a dream of Balance's in which the Four Horsemen of the Apocalypse slit the throats of their horses and assembled their jawbones into a device large enough to \"plough up the waiting world.\" The cover photograph was .", "desc_lfm_artist": "Coil (1982–2004) was initially established in London in 1983 as an experimental solo outlet for ex-Psychic TV member John Balance, and became a full-fledged experimental sonic manipulation unit a year later following the arrival of keyboardist / programmer Peter Christopherson (Sleazy), a founder of Psychic TV as well as a member of Throbbing Gristle. After debuting with the 17-minute ritual recording How to Destroy Angels, Balance and Sleazy recruited the aid of Possession’s Stephen Thrower, J.", "desc_mb_album": "", "desc_mb_artist": "Also performs as: [artist:a956d00f-3f58-4576-83b7-7415bf58df4b|Black Light District], [artist:3f183292-f1af-40b5-8195-725003ed3cdc|ELpH], and [artist:2269ab04-c82a-4a30-a908-a100b61f9940|Time Machines]", "heard_by": ["Frikomid", "alberto_gu"]}, {"n": 82, "title": "World Of Echo", "artist": "Arthur Russell", "year": 1986, "cover": "https://dn710901.ca.archive.org/0/items/mbid-a8c0921c-1fc5-31b3-99e6-4cbe676aea18/mbid-a8c0921c-1fc5-31b3-99e6-4cbe676aea18-14023274587.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "2ab0cdf7-fe0c-307c-b87a-a956a4d626e3", "yt_id": "XLPvft-p6Gw", "rym": "https://rateyourmusic.com/release/album/arthur-russell/world-of-echo", "genres": ["folk", "avant-folk", "dance", "ambient pop", "experimental", "instrumental"], "desc_lfm_album": "World of Echo is the only full-length non-collaborative studio album recorded, released and compiled by Arthur Russell during his lifetime. It was released in 1986 on Upside Records in the United States and on Rough Trade Records in the United Kingdom. Departing from his dance music recordings of the time, it instead features Russell solo on cello with added electronics and production effects, including echo, reverb, and distortion. Audika Records issued a remastered limited edition CD on 27 October 2004 which included bonus tracks and a DVD with footage by Phill Niblock. They subsequently issued another CD on 11 January .", "desc_lfm_artist": "Arthur Russell (May 21 1951 - April 4, 1992) was a prodigious talent. Classically trained on cello while growing up in Oskaloosa, USA, Arthur studied with Ali Akbar Khan in San Francisco in the early 1970's. \n\nDuring this period he also collaborated with Allen Ginsberg, accompanying him on cello while Ginsberg read or sang. Russell also spent time in a Buddhist commune in California; he left when they decided to collectivize his cello.\n\nBy the mid-1970's Russell relocated to New York City, where he studied at The Manhattan School of Music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "armandwave"]}, {"n": 83, "title": "Green", "artist": "吉村弘 [Hiroshi Yoshimura]", "year": 1986, "cover": "https://cdn2.albumoftheyear.org/600x0/album/91138-green-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/91138--hiroshi-yoshimura-green.php", "aoty_critic_score": 74, "aoty_user_score": 81, "mbid": null, "yt_id": "Jx7CyMZVhHY", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 84, "title": "Promise", "artist": "Sade", "year": 1985, "cover": "https://cdn2.albumoftheyear.org/600x0/album/40581-promise_190351.jpg", "aoty_url": "https://www.albumoftheyear.org/album/40581-sade-promise.php", "aoty_critic_score": 80, "aoty_user_score": 88, "mbid": "d49bd610-a10e-3f14-8bd0-0121f7f20a4d", "yt_id": "96up_TZCNSQ", "rym": "https://rateyourmusic.com/release/album/sade/promise", "genres": [], "desc_lfm_album": "\"Promise\" is the second studio album by English band Sade, released in the United Kingdom on 4 November 1985 by Epic Records and in the United States on 15 November 1985 by Portrait Records. Recording for the album began in February and lasted until August 1985. The band co-produced the album with the same team of producers they worked with on their debut album, Diamond Life, including Robin Millar, Mike Pela and Ben Rogan. The album's title comes from a letter from Sade Adu's father where he refers to the \"promise of hope\" to recover from cancer. The album was .", "desc_lfm_artist": "Sade (pronounced shah-day) is an English band formed in London in 1982, named after their lead singer, Sade Adu. Their music features elements of soul, quiet storm, smooth jazz and sophisti-pop. All of their albums, including compilations and a live album, have charted in the US Top Ten.\n\nThree of their members were originally from Hull in the East Riding of Yorkshire. Sade was formed in 1982, when members of Latin soul band Pride — Sade Adu, (real name Helen Folasade Adu - born 16 January 1959 in Ibadan", "desc_mb_album": "", "desc_mb_artist": "Formed out of the ashes of jazz group ''Pride'', this band had critical and commercial success with the album '''Diamond Life''' and several singles. From 1984, the record deal was solely in the name of '''Helen Folasade Adu''', the charismatic singer, but her backing band remained intact for several releases.", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "verygooood"]}, {"n": 85, "title": "Dead Man's Party", "artist": "Oingo Boingo", "year": 1985, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53804-dead-mans-party_101537.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53804-oingo-boingo-dead-mans-party.php", "aoty_critic_score": 60, "aoty_user_score": 84, "mbid": "a045bf77-a7fc-3225-be1e-b83f4989aea9", "yt_id": "GXciMC0ju8w", "rym": "https://rateyourmusic.com/release/album/oingo-boingo/dead-mans-party", "genres": [], "desc_lfm_album": "Returning after a two-year recording hiatus (during which bandleader Danny Elfman recorded a solo album), Oingo Boingo forsook the excesses of smart-aleck humor and quirky production that had led critics almost universally to dismiss the band's first four albums. The sound is still maybe just a bit too uptight and over-determined, but the horn charts are more focused and sophisticated, and Elfman has matured considerably as a lyricist. Alongside such typically oddball fare as the title track and a surprise hit song called \"Weird Science\" are the faintly paranoid \"Just Another Day\" and the frankly romantic \"Stay,\" as well as .", "desc_lfm_artist": "Richard Elfman founded the theatrical troupe The Mystic Knights of the Oingo Boingo. In 1978 the remnants of the Mystic Knights formed together under lead singer Danny Elfman as the band Oingo Boingo. The hyperkinetic ska-flavored New Wave band is characterized by their manic live performances and eclectic range of songs; Elfman and the band performed for a remarkable twenty years.\n\nThe band from Los Angeles, California, USA, a pared-down version of the theatrical troupe The Mystic Knights of the Oingo Boingo", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 86, "title": "Rain Dogs", "artist": "Tom Waits", "year": 1985, "cover": "https://dn710601.ca.archive.org/0/items/mbid-81f978e7-6f49-3d51-9243-a131a4edc259/mbid-81f978e7-6f49-3d51-9243-a131a4edc259-9875457393.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4220-tom-waits-rain-dogs.php", "aoty_critic_score": 99, "aoty_user_score": 85, "mbid": "fb25a883-2270-3ec4-8c62-85c7ed857e6f", "yt_id": "DfvASyLcKs4", "rym": "https://rateyourmusic.com/release/album/tom-waits/rain-dogs", "genres": ["experimental rock", "avant-garde", "blues rock", "alternative rock", "blues"], "desc_lfm_album": "Rain Dogs is the 9th album by American singer-songwriter Tom Waits, released in September 1985 on Island Records. A loose concept album about \"the urban dispossessed\" of New York City, Rain Dogs is generally considered the middle album of a trilogy that includes Swordfishtrombones and Franks Wild Years. The album, which includes appearances by guitarists Keith Richards and Marc Ribot, is noted for its broad spectrum of musical styles and genres, described by Rolling Stone as merging \"Kurt Weill, pre-rock integrity from old dirty blues, the elegiac melancholy of New Orleans funeral brass, into a singularly idiosyncratic American style.\" The .", "desc_lfm_artist": "Tom Waits (born Thomas Alan Waits, in Pomona, California, on December 7, 1949) is a prolific American singer, songwriter, composer, and actor.\n\nHe started his career in the early 1970s as a singer in spit 'n' sawdust bars. Initially, he was deeply influenced by the beat generation, novelists like Jack Kerouac and William S. Burroughs, and poets like Allen Ginsberg and Charles Bukowski.  Waits is often compared to Charles Bukowski, being similar both in content and lifestyle", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 87, "title": "This Nation’s Saving Grace", "artist": "The Fall", "year": 1985, "cover": "https://dn710903.ca.archive.org/0/items/mbid-c1512f97-f680-488b-a19c-d56722cf08a3/mbid-c1512f97-f680-488b-a19c-d56722cf08a3-26628361714.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e163ed54-842b-3114-9e98-a2d376029abd", "yt_id": "tBc5OyAYlyo", "rym": null, "genres": ["experimental rock", "post-punk", "rock"], "desc_lfm_album": "", "desc_lfm_artist": "Famously described by John Peel as being \"always different, always the same\", The Fall was formed in Manchester, England in 1976 during the Punk era although their style quickly evolved into something more idiosyncratic.\n \nThe one permanent fixture amidst the Fall's ever-changing line-up was Mark E. Smith (1957 – 2018). Smith's lyrics are free, unboxed and unpredictable, touching on an extremely wide range of subjects and places, and caring little for being tied down to easily digestible messages.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 88, "title": "Tim", "artist": "Replacements", "year": 1985, "cover": "https://dn710706.ca.archive.org/0/items/mbid-e3adae32-66d6-4255-92b3-fb5bceaf3b2c/mbid-e3adae32-66d6-4255-92b3-fb5bceaf3b2c-44
