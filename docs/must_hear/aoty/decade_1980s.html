<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOTY Must Hear — 1980s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/images/discount.png" />
<script defer src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;
  --accent:#e8ff47;--heard:#e8ff47;--pending:#ff4747;
  --text:#e0e0e0;--muted:#555;--gap:6px;
  --panel:390px;--header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{
  position:fixed;top:0;left:0;right:var(--panel);height:var(--header-h);z-index:100;
  background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:0 18px;display:flex;align-items:center;gap:12px;
}
.back-link{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.dec-wrap{position:relative}
.dec-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);
  color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.dec-btn:hover{background:rgba(232,255,71,.12)}
.dec-dropdown{
  display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:160px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.dec-dropdown.open{display:block}
.dec-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.dec-item{display:block;padding:6px 14px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);text-decoration:none;transition:background .1s}
.dec-item:hover{background:var(--surface)}
.dec-item.active{color:var(--accent)}
.controls{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0}
.filter-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.search-box{
  font-family:'DM Mono',monospace;font-size:.62rem;padding:4px 9px;
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);width:130px;outline:none;transition:border-color .15s;
}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.genre-wrap{position:relative}
.genre-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.genre-btn:hover,.genre-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.genre-btn .badge{background:var(--accent);color:#000;border-radius:10px;padding:1px 5px;font-size:.52rem;font-weight:700}
.genre-dropdown{
  display:none;position:fixed;
  background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:200px;max-height:320px;overflow-y:auto;padding:4px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.genre-dropdown.open{display:block}
.genre-dh{
  padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:3px;
  display:flex;justify-content:space-between;
}
.genre-clear{color:var(--pending);cursor:pointer}
.genre-item{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;transition:background .1s}
.genre-item:hover{background:var(--surface)}
.genre-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.genre-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);cursor:pointer;flex:1;display:flex;justify-content:space-between}
.genre-item label span{color:var(--muted);font-size:.56rem}
.user-wrap{position:relative}
.user-btn{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.user-btn:hover{background:rgba(232,255,71,.12)}
.user-btn .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.user-dropdown{display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;z-index:9999;min-width:164px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.user-dropdown.open{display:block}
.user-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.user-item{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;transition:background .1s;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text)}
.user-item:hover{background:var(--surface)}
.user-item.active{color:var(--accent)}
.user-item .u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.user-item.active .u-dot{background:var(--accent)}
#main{margin-top:var(--header-h);margin-right:var(--panel);padding:14px 18px 60px;position:relative;z-index:0}
.count-bar{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px;display:flex;gap:14px}
.count-bar b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.05);z-index:10}
.card.hidden{display:none}
.card.active-card{outline:2px solid var(--accent);outline-offset:2px;z-index:11}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.heard-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3;background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,0) 55%);
  opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px;z-index:2;
}
.card:hover .card-overlay{opacity:1}
.card-scores{display:flex;gap:3px;margin-bottom:2px}
.card-score{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;padding:1px 4px;border-radius:2px}
.card-score.c{background:rgba(108,184,250,.2);color:#6cb8fa}
.card-score.u{background:rgba(191,143,255,.2);color:#bf8fff}
.card-title{font-size:.56rem;font-weight:500;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{font-size:.52rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3}
.card.heard-user::before{background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card.unheard-user::before{background:var(--pending);box-shadow:0 0 5px var(--pending)}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panel);
  background:#0c0c0c;border-left:1px solid var(--border);
  z-index:50;display:flex;flex-direction:column;overflow:hidden;
}
.panel-topbar{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 15px;flex-shrink:0}
.panel-topbar-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel-cover{width:100%;aspect-ratio:1;flex-shrink:0;position:relative;background:var(--surface);max-height:200px;overflow:hidden}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-scores{display:flex;gap:6px;position:absolute;bottom:8px;left:8px}
.panel-score{padding:3px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700}
.panel-score.c{background:rgba(0,0,0,.7);color:#6cb8fa;border:1px solid #6cb8fa44}
.panel-score.u{background:rgba(0,0,0,.7);color:#bf8fff;border:1px solid #bf8fff44}
.panel-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.panel-empty-icon{font-size:2rem;opacity:.3}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);line-height:1.05;margin-bottom:2px}
.panel-artist{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.panel-year{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.panel-genre-tag{font-family:'DM Mono',monospace;font-size:.56rem;padding:2px 6px;border-radius:2px;background:rgba(232,255,71,.07);border:1px solid rgba(232,255,71,.18);color:rgba(232,255,71,.65)}
.panel-heard-by{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:9px}
.panel-heard-by b{color:var(--heard)}
.panel-divider{height:1px;background:var(--border);margin:9px 0}
.panel-section-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.panel-bio{font-size:.72rem;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-bio::-webkit-scrollbar{width:3px}
.panel-bio::-webkit-scrollbar-thumb{background:var(--border)}
.desc-block{margin-bottom:9px}
.desc-source-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.desc-source-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.desc-source-label.lfm{color:#d51007}.desc-source-label.mb{color:#ba478f}.desc-source-label.artist{color:#6a9fb5}
.desc-source-text{font-size:.7rem;color:#aaa;line-height:1.55}
.panel-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.panel-link{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}
.panel-link.aoty{border-color:#e87c2e;color:#e87c2e}
.panel-link.aoty:hover{background:rgba(232,124,46,.08)}
.panel-link.yt{border-color:#f00;color:#f00}
.panel-link.yt:hover{background:rgba(255,0,0,.08)}
.panel-link.rym{border-color:#5baadb;color:#5baadb}
.panel-link.rym:hover{background:rgba(91,170,219,.08)}
.panel-yt-wrap{margin-top:11px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.panel-yt-wrap iframe{display:block;width:100%;height:145px;border:none}
.panel-yt-placeholder{height:60px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.panel-close-btn{display:none;position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.18)}
.grid-sizer{display:flex;align-items:center;gap:5px}
.grid-sizer span{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);min-width:24px;text-align:right}
#grid-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#grid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
#grid-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#empty{display:none;text-align:center;padding:50px 0;font-family:'DM Mono',monospace;color:var(--muted);font-size:.7rem}
@media(max-width:600px){
  :root{--header-h:50px}
  header{right:0;height:auto;min-height:var(--header-h);flex-wrap:wrap;padding:8px 12px;gap:6px 10px;overflow:visible}
  #main{margin-right:0;padding:10px 10px 60px}
  #panel{inset:0;width:100%;border-left:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  #panel.panel-open{transform:translateY(0)}
  .panel-close-btn{display:flex}
  .controls{flex:0 0 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:5px;padding:5px 0 2px;border-top:1px solid var(--border);scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .dec-wrap{display:none}
}</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">←</a>

      1980s &#x25BE;
    </button>
  </div>
  <div class="controls">
    <button class="filter-btn active" id="btn-all"     onclick="setFilter('all')">All</button>

    <button class="filter-btn"        id="btn-unheard" onclick="setFilter('unheard')">Unheard</button>
    <input class="search-box" id="search" placeholder="Search..." oninput="applyFilters()">
    <div class="genre-wrap">
      <button class="genre-btn" id="genre-btn" onclick="toggleGenreDD()">
        Genre <span class="badge" id="genre-badge" style="display:none">0</span> &#x25BE;
      </button>

        <span class="u-name" id="user-btn-label">All users</span> &#x25BE;
      </button>

    <div class="grid-sizer">
      <span id="grid-label">10×</span>
      <input type="range" id="grid-slider" min="3" max="20" value="10" step="1" oninput="setGridSize(this.value)">
    </div>
  </div>
</header>
<main id="main">
  <div class="count-bar">
    <span>Showing <b id="vis-count">196</b> of 196</span>
    <span><b id="vis-heard">0</b> heard</span>
  </div>
  <div id="grid"></div>
  <div id="empty">No albums match your filters.</div>
</main>
<aside id="panel">
  <button class="panel-close-btn" onclick="closePanel()" aria-label="Close">&#x2715;</button>

    <span class="panel-topbar-label">Album detail</span>
  </div>
  <div id="panel-cover-wrap" class="panel-cover" style="display:none">
    <img id="p-cover" src="" alt="">
    <div class="panel-scores" id="p-scores"></div>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="panel-empty"><div class="panel-empty-icon">◉</div>Click an album</div>
  </div>
</aside>
<div class="dec-dropdown" id="dec-dd">
  <div class="dec-dh">Jump to decade</div>
  <a class="dec-item" href="decade_1950s.html">1950s</a><a class="dec-item" href="decade_1960s.html">1960s</a><a class="dec-item" href="decade_1970s.html">1970s</a><a class="dec-item active" href="decade_1980s.html">1980s</a><a class="dec-item" href="decade_1990s.html">1990s</a><a class="dec-item" href="decade_2000s.html">2000s</a><a class="dec-item" href="decade_2010s.html">2010s</a><a class="dec-item" href="decade_2020s.html">2020s</a>
</div>

  <div class="genre-dh">Filter by genre <span class="genre-clear" onclick="clearGenres()">clear</span></div>
  <div id="genre-list"></div>
</div>
<div class="user-dropdown" id="user-dd">
  <div class="user-dh">View as user</div>
  <div id="user-list"></div>
</div>
<script>
const ALBUMS = [{"n": 1, "title": "Streetcleaner", "artist": "Godflesh", "year": 1989, "cover": "https://i.discogs.com/ebwVUIIsYgk8rvgQGQo5f-byj9IMdhSs4fWnWOhk2M8/rs:fit/g:sm/q:90/h:596/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTI1MTY4/NC0xMzQyNjcyNzU1/LTUyNzcuanBlZw.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/28397-godflesh-streetcleaner.php", "aoty_critic_score": 91, "aoty_user_score": 80, "mbid": "2c784b05-145c-43f2-aca2-7ce3f4e6daf5", "yt_id": "HfN7OR5q_xw", "rym": "https://rateyourmusic.com/release/album/godflesh/streetcleaner", "genres": ["metal", "industrial metal"], "desc_lfm_album": "Streetcleaner is the debut studio album by English industrial metal band Godflesh. It was released on 13 November 1989 through Earache Records and was reissued with a second disc of previously unreleased material on 21 June 2010. The album is widely acclaimed by critics and is often cited as a landmark release in industrial metal; though not the genre's first release, Streetcleaner helped define what industrial metal would become. Recorded in three distinct sessions and partially refined from pre-Godflesh demos, Streetcleaner is a weighty, bleak album that blends heavy metal with industrial music by means of production-emphasised bass, distorted guitar .", "desc_lfm_artist": "Godflesh is an industrial metal band from Birmingham, England, formed in 1988 by Justin Karl Broadrick (guitar, vocals, and programming) and G. C. Green (bass). They are highly regarded as one of the founders of industrial metal. The group disbanded in 2002 but reformed in 2010, appearing in few festivals and starting to produce a new studio album.\n\nIn 1988, Broadrick contacted Green about reforming Fall of Because, who fell apart in 1987. Justin decided to take over on guitars", "desc_mb_album": "", "desc_mb_artist": "Godflesh were disbanded from 2002 until their reunion show at Hellfest in 2010. During that time, Justin Broadrick focused on his other project, [artist:ae69d81f-552d-4013-8dfc-4778d8f38742|Jesu].", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 2, "title": "Wrong", "artist": "NoMeansNo", "year": 1989, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53554-wrong.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53554-nomeansno-wrong.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "f7b134c8-26a3-3e4c-8fc7-7ecdde9228c1", "yt_id": "ek6XvCPpo4s", "rym": "https://rateyourmusic.com/release/album/nomeansno/wrong", "genres": [], "desc_lfm_album": "Wrong is the fourth full-length album by Canadian punk rock band NoMeansNo. It was released in 1989 through Alternative Tentacles record label. Wrong was described by drummer John Wright as the band's \"most popular album by a country mile\". When asked to speculate as to the reasons why Wrong enjoyed such relative success, John Wright attributed it to the mainstream success of Nirvana and the rising popularity of alternative music: \"The kind of music we were playing, and then Nirvana before they got popular, and that kind of alternative...Punk rock was getting to that point where a lot of bands .", "desc_lfm_artist": "NoMeansNo is a punk band originally from Victoria, British Columbia, Canada and now located in Vancouver, British Columbia.\n\nThe band have never had, or have ever seemed to pursue, strong mainstream success, but they do have a devoted underground following in North America and Europe. They tour fairly often on both continents and maintain a dedicated fan base.\n\nThe band was formed in 1979 by brothers Rob Wright (bass guitar and vocals) and John Wright (drum set, keyboards and vocals).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "sdecandelario"]}, {"n": 3, "title": "Pretty Hate Machine", "artist": "Nine Inch Nails", "year": 1989, "cover": "https://dn720700.ca.archive.org/0/items/mbid-60a04a88-3956-49f5-9d0f-b2603be9f612/mbid-60a04a88-3956-49f5-9d0f-b2603be9f612-8270653258.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5556-nine-inch-nails-pretty-hate-machine.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "fcb872a2-7ef9-3ed0-bd4a-7c55c78179b6", "yt_id": "rPD9kQt09n4", "rym": "https://rateyourmusic.com/release/album/nine-inch-nails/pretty-hate-machine", "genres": ["alternative rock", "industrial", "synth-pop", "industrial rock", "electro-industrial", "ebm"], "desc_lfm_album": "Pretty Hate Machine (also known as Halo 2) is the first studio album by Nine Inch Nails. It was released on October 20, 1989 by TVT Records in the US, and on October 12, 1991 in the UK, and was a huge success. The first single off of the album, Down In It, was released on September 27, 1989. It received radio airplay for the aforementioned single as well as subsequent singles Head Like A Hole and Sin. The former also serves as a companion remix album of sorts to Pretty Hate Machine. Working nights at Right Track Studio as .", "desc_lfm_artist": "Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated", "desc_mb_album": "", "desc_mb_artist": "Please note the following about Nine Inch Nails releases:\n\n    * Certain tracks frequently included on Nine Inch Nails bootlegs are not actually Nine Inch Nails tracks; however they do feature Trent on vocals. These include:\n        * [http://musicbrainz.org/track/9f249bf3-af50-43b6-a820-b52091ca757d.html|1000 Homo DJs - Supernaut (Trent Reznor vocal version)] (studio)\n        * [http://musicbrainz.org/track/8440e3d4-d78e-49e7-9cf6-14e87ba53a8b.html|Tori Amos - Past The Mission] (studio)\n and was later signed to EMI Records after David Gilmour of Pink Floyd helped fund a professional demo recording.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere"]}, {"n": 5, "title": "Hats", "artist": "The Blue Nile", "year": 1989, "cover": "https://cdn2.albumoftheyear.org/600x0/album/54336-hats-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/54336-the-blue-nile-hats.php", "aoty_critic_score": 86, "aoty_user_score": 85, "mbid": "231b6ff2-b493-3f73-947e-4dc9b42c3fe0", "yt_id": "H4R4hAA6wGc", "rym": "https://rateyourmusic.com/release/album/the-blue-nile/hats/", "genres": ["sophisti-pop"], "desc_lfm_album": "Hats is the second studio album by Scottish band the Blue Nile, originally released on 16 October 1989 on Linn Records and A&M Records. -- After a prolonged delay in which an entire album's worth of work was scrapped, the Blue Nile released Hats to rave reviews, including a rare five-star rating from Q magazine. It also became the band's most successful album, reaching number 12 on the UK album charts and spawning three singles: \"The Downtown Lights\", \"Headlights on the Parade\", and \"Saturday Night\". .", "desc_lfm_artist": "The Blue Nile is an alternative/pop band from Glasgow, Scotland, known for their perfectionist work ethic and long gaps between releases. \n\nThe music of The Blue Nile is built heavily on synthesizers and electronic instrumentation and percussion, although later works have featured acoustic guitar more prominently. Despite the \"coldness\" often associated with the use of such electronic instruments, The Blue Nile has managed to create music that is deeply emotional", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 6, "title": "Rhythm Nation 1814", "artist": "Janet Jackson", "year": 1989, "cover": "https://dn711100.ca.archive.org/0/items/mbid-03f47647-35d3-3a64-832b-ff9846a154af/mbid-03f47647-35d3-3a64-832b-ff9846a154af-3890720100.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10657-janet-rhythm-nation-1814.php", "aoty_critic_score": 83, "aoty_user_score": 86, "mbid": "20aaac17-e4e8-373c-99cc-211321b82832", "yt_id": "j97ziHtk0rQ", "rym": "https://rateyourmusic.com/release/album/janet-jackson/rhythm-nation-1814", "genres": ["r&b", "synth-pop", "contemporary r&b", "hip hop", "new jack swing"], "desc_lfm_album": "Janet Jackson's Rhythm Nation 1814 (commonly referred to as Rhythm Nation) is the fourth studio album by American singer Janet Jackson, released on September 19, 1989, by A&M Records. Although label executives wanted material similar to her previous album, Control (1986), Jackson insisted on creating a concept album addressing social issues. Collaborating with songwriters and record producers Jimmy Jam and Terry Lewis, she drew inspiration from various tragedies reported through news media, exploring racism, poverty, and substance abuse, in addition to themes of romance. Although its primary concept was met with mixed reactions, its composition received critical acclaim. Jackson came .", "desc_lfm_artist": "Janet Damita Jo Jackson (born May 16, 1966) is an American singer, songwriter, actress, and dancer. She is recognized for her contributions to pop music, including socially conscious and provocative themes in her recordings, as well as her choreography and stage performances. Her work has been influential in the development of MTV and has contributed to breaking gender and racial barriers in the music industry. Jackson’s lyrics often address social issues and personal experiences, appealing to a broad youth audience.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 7, "title": "Floating Into the Night", "artist": "Julee Cruise", "year": 1989, "cover": "https://dn711306.ca.archive.org/0/items/mbid-653617f7-c764-4f52-a4ba-e6a130a6c87d/mbid-653617f7-c764-4f52-a4ba-e6a130a6c87d-5409164245.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "2eaf4eef-f6bb-3fff-a4e2-79d639bde1d0", "yt_id": "lYXSrXNpABQ", "rym": "https://rateyourmusic.com/release/album/julee-cruise/floating-into-the-night", "genres": ["jazz pop", "dream pop", "ethereal wave", "ambient pop", "dark jazz", "lounge"], "desc_lfm_album": "Floating into the Night is the debut studio album by American singer Julee Cruise. It was released on September 12, 1989 on Warner Bros. Records, and features compositions and production by Angelo Badalamenti and film director David Lynch. Songs from the album were featured in Lynch's projects Blue Velvet (1986), Industrial Symphony No. 1 (1990), and Twin Peaks (1990–91). Filmmaker David Lynch and composer Angelo Badalamenti's collaboration with Cruise first came about during the scoring for Lynch's 1986 film Blue Velvet, in which a key scene was intended to feature This Mortal Coil's version of \"Song to the Siren\" by .", "desc_lfm_artist": "Julee Cruise (born in Creston, Iowa, on 1 December 1956; died 9 June 2022) was an American pop singer and actress. She was a frequent collaborator with composer Angelo Badalamenti and director David Lynch, who produced and wrote the lyrics for most of her songs.\n\nCruise studied French horn at Drake University and performed as a singer and actress in New York, where she also worked as a talent scout for Angelo Badalamenti. In 1985, Badalamenti was composing the score for David Lynch's Blue Velvet", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 8, "title": "13 Songs", "artist": "Fugazi", "year": 1990, "cover": "https://ia801206.us.archive.org/32/items/mbid-5f692216-1932-4cfa-ad6e-0e3c2304579f/mbid-5f692216-1932-4cfa-ad6e-0e3c2304579f-3323637378.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7005-fugazi-13-songs.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "e65e574d-6129-3798-84d9-5952876ad210", "yt_id": "B2RyoRG2vs8", "rym": null, "genres": ["post-hardcore"], "desc_lfm_album": "13 Songs is a compilation album by the American post-hardcore band Fugazi. It was released on September 1, 1989 by Dischord Records. The album consists of all the songs from the band's first two EPs, Fugazi and Margin Walker. The EPs compiled were Fugazi (1988), which was recorded at Inner Ear Studios in June 1988 with Ted Niceley & Don Zientara, and Margin Walker (1989), which was recorded in December 1988 at Southern Studios in London with John Loder handling production duties. This album is their most successful release to date. .", "desc_lfm_artist": "Fugazi was an American post-hardcore band formed in Washington, D.C., in 1986. The band consists of guitarists and vocalists Ian MacKaye and Guy Picciotto, bassist Joe Lally, and drummer Brendan Canty. They are noted for their style-transcending music, DIY ethical stance, manner of business practice and contempt for the music industry.\n\nSince its inception, Fugazi has been self-managed and have released almost all their material through Dischord Records, an independent label founded by MacKaye and partner Jeff Nelson in 1980.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 9, "title": "Paul’s Boutique", "artist": "Beastie Boys", "year": 1989, "cover": "https://dn711003.ca.archive.org/0/items/mbid-c4944da6-84d6-498a-9aaa-94687305c8c2/mbid-c4944da6-84d6-498a-9aaa-94687305c8c2-1190824139.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "b534aa01-d621-31ba-9278-38a500e3cdca", "yt_id": "x2TP7tNQPwk", "rym": "https://rateyourmusic.com/release/album/beastie-boys/pauls-boutique", "genres": ["hip hop", "experimental hip hop", "plunderphonics", "east coast hip hop"], "desc_lfm_album": "Paul's Boutique is the second studio album by American hip hop group Beastie Boys, released on July 25, 1989 on Capitol Records. Featuring production by the Dust Brothers, the recording sessions for the album took place at Mario G's Studio in Los Angeles and The Opium Den in Brooklyn, New York from 1988 to 1989, after which the recordings underwent mixing at the Manhattan-based Record Plant Studios. Paul's Boutique was initially considered a commercial failure by the executives at Capitol Records, as its sales did not match that of the group's previous record, Licensed to Ill, and the label eventually .", "desc_lfm_artist": "Beastie Boys were an American hip-hop trio from New York City, United States: Brooklyn and Manhattan. Originally formed as a four-piece hardcore punk band, The Young Aborigines, in 1978 by Michael Diamond (vocals), John Berry (guitar; died May 2016), Adam Yauch (bass) and Kate Schellenbach (drums), for the majority of its career the group consisted of Mike D (real name Michael Diamond),  Ad-Rock (Adam Horovitz) and, until his death in May 2012, MCA (Adam Yauch).", "desc_mb_album": "Paul's Boutique Samples and References List (fan site): http://paulsboutique.info/", "desc_mb_artist": "", "heard_by": ["armandwave", "paqueradejere", "sdecandelario"]}, {"n": 10, "title": "The Real Thing", "artist": "Faith No More", "year": 1989, "cover": "https://ia801605.us.archive.org/5/items/mbid-94ec8033-848c-39fe-ab63-fa49ec24a9e5/mbid-94ec8033-848c-39fe-ab63-fa49ec24a9e5-2618499061.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5091-faith-no-more-the-real-thing.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "1ba7c980-4882-31fb-9918-12791f59d303", "yt_id": "TebRt1gFVhs", "rym": "https://rateyourmusic.com/release/album/faith-no-more/the-real-thing/", "genres": ["alternative rock", "hard rock", "alternative metal", "funk metal", "rap metal"], "desc_lfm_album": "The Real Thing is the third studio album by American rock quintet Faith No More, first released through Slash Records on June 20, 1989. It was the first release by the band not to feature vocalist Chuck Mosely; instead the album featured Mike Patton from the experimental rock band Mr. Bungle. On this album, Faith No More advanced their sound range combining heavy metal, progressive rock, hip hop, funk, jazz, and soul. Although released in mid 1989, The Real Thing didn't enter the Billboard 200 until February 1990, after the release of the second single from the album, \"Epic\", and .", "desc_lfm_artist": "Faith No More was an American rock band from San Francisco, California, formed in 1979. Before September 1983, the band performed under the names Sharp Young Men and later Faith No Man. Bassist Billy Gould, keyboardist and rhythm guitarist Roddy Bottum, and drummer Mike Bordin were the longest-tenured members of the band, having been involved since its inception. The band underwent several lineup changes over the years. The final lineup consisted of Gould, Bordin, Bottum, lead guitarist Jon Hudson, and vocalist and lyricist Mike Patton.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 11, "title": "Altars of Madness", "artist": "Morbid Angel", "year": 1989, "cover": "https://cdn2.albumoftheyear.org/600x0/album/24062-altars-of-madness-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/24062-morbid-angel-altars-of-madness.php", "aoty_critic_score": 72, "aoty_user_score": 82, "mbid": "e5be441e-53ec-376a-b261-426e8f06e144", "yt_id": "Gc0lUok4mdc", "rym": "https://rateyourmusic.com/release/album/morbid-angel/altars-of-madness", "genres": ["metal", "death metal", "old school death metal"], "desc_lfm_album": "Altars of Madness is Morbid Angel's debut album and is a milestone in the history of death metal. The remastered version (released in 2003) includes several remixed versions of songs from the album. 2006 saw a dual-disc release with the 2003 remaster on the audio side and 'Live Madness 89' recorded at Nottingham Rock City on the 14th of November 1989 on the DVD side. In the album's liner notes, the band dedicates the album to the underground and to speed, death, and black metal fans everywhere. The cover artwork represents the different moods of humans. Comments and Reviews \"That .", "desc_lfm_artist": "Morbid Angel is a death metal band assembled in Tampa, Florida, United States in 1983. They, along with bands like Death, Obituary and Deicide, were crucial in the development of the death metal genre and its standards. Since the band's formation, the band's leader has been guitarist Trey Azagthoth. The band released their first four albums with David Vincent on vocals/bass and Pete Sandoval on drums, before Vincent was replaced by Steve Tucker for the three following albums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 12, "title": "The Stone Roses", "artist": "The Stone Roses", "year": 1989, "cover": "https://dn721807.ca.archive.org/0/items/mbid-966d143c-d0f4-46fc-a265-e7394b04a7b9/mbid-966d143c-d0f4-46fc-a265-e7394b04a7b9-28642859817.png", "aoty_url": "https://www.albumoftheyear.org/album/4227-the-stone-roses-the-stone-roses.php", "aoty_critic_score": 82, "aoty_user_score": 86, "mbid": "88b86fe0-26f5-3949-817a-8082145e704d", "yt_id": "P_9PU0Si4b0", "rym": "https://rateyourmusic.com/release/album/the-stone-roses/the-stone-roses/", "genres": ["psychedelic", "indie rock", "neo-psychedelia", "jangle pop", "britpop", "c86"], "desc_lfm_album": "The Stone Roses LP was recorded between June 1988 and Febuary 1989 by the Stone Roses with producer John Leckie. It was then released on the 13th of March 1989 on the Silvertone music label. The artwork for the album was inspired by American artist Jackson Pollock. The album was then released in the United States on the 2nd of May 1989, following a release in Australia in December that year. The album has since seen various re-releases, in September 1991, then in 1999 for the 10 year anniversary edition and just recently it was announced their would be a .", "desc_lfm_artist": "The Stone Roses was an English rock band formed in Manchester in 1983. They were one of the pioneering groups of the Madchester movement in the late 1980s and early 1990s. The band's classic and most prominent lineup consisted of vocalist Ian Brown, guitarist John Squire, bassist Mani, and drummer Reni.\n\nThe Stone Roses released their eponymous debut album in 1989. The album was a breakthrough success for the band, receiving widespread critical acclaim, and is regarded by many as one of the greatest British albums ever recorded.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 13, "title": "Disintegration", "artist": "The Cure", "year": 1989, "cover": "https://dn711200.ca.archive.org/0/items/mbid-11af85e2-c272-4c59-a902-47f75141dc97/mbid-11af85e2-c272-4c59-a902-47f75141dc97-7244606349.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4387-the-cure-disintegration.php", "aoty_critic_score": 85, "aoty_user_score": 91, "mbid": "494bf606-d2f7-36d0-8340-eadad8601d2b", "yt_id": "JOb5f-TG6iI", "rym": "https://rateyourmusic.com/release/album/the-cure/disintegration", "genres": ["alternative rock", "art rock", "post-punk", "new wave", "gothic rock", "dream pop"], "desc_lfm_album": "Disintegration is the eighth studio album by English alternative rock band The Cure, released on May 1, 1989. The record marks a return to the gloomy gothic rock style and introspective lyrics the band had established in the early 1980s, and is one of three quintessential Cure albums performed in entirety on the band's double live album, Trilogy. Stephen Thomas Erlewine of Allmusic  hired producer Gil Norton. Along with Surfer Rosa, Doolittle is considered the band's strongest work. Doolittle has continued to sell consistently well over time, and in 1995 was certified gold by the Recording Industry Association of America. The album has been cited as inspirational by many alternative artists, while numerous music publications have ranked .", "desc_lfm_artist": "Pixies is an American alternative rock band which formed in Boston, Massachusetts, United States in 1986. The band consists of Charles (Black Francis) Thompson IV (vocals, guitar; also known as ''Frank Black''), Joey Santiago (lead guitar),   David Lovering (drums) and Emma Richardson (bass, vocals). Until 2013, the band also featured  Kim Deal on bass and vocals. From 2016 until 2024 the band also featured Paz Lechantin on bass and vocals.   The band officially split in 1993  and reunited in 2004.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 16, "title": "Beneath The Remains", "artist": "Sepultura", "year": 1989, "cover": "https://dn711103.ca.archive.org/0/items/mbid-79763a53-2a74-321f-a16a-879b6685b021/mbid-79763a53-2a74-321f-a16a-879b6685b021-16355810642.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "6d9c2a90-603d-34b5-b855-dd20e61971b7", "yt_id": "auICQadr124", "rym": null, "genres": ["heavy metal", "metal", "death metal", "thrash metal", "rock"], "desc_lfm_album": "Beneath the Remains is the third studio album and major label debut by Brazilian thrash metal band Sepultura, released on April 7, 1989. It was their first release by Roadrunner Records. Overview: Beneath the Remains had improved production and songwriting compared to the band's previous albums. In the time, it would be acclaimed as a classic in the thrash metal genre. According to vocalist Max Cavalera, Sepultura had \"really found style\" on that album. Cover art: This was their first album to feature a Michael Whelan cover art. There was a bit of controversy surrounding the cover art used for .", "desc_lfm_artist": "Sepultura (Portuguese word for \"Grave\") is a Brazilian metal band from Belo Horizonte. Formed in 1984 by brothers Max and Igor Cavalera, the band was a major force in the groove metal, thrash metal, and death metal genres during the late 1980s and early 1990s, with their later experiments drawing influence from alternative metal, world music, nu metal, hardcore punk, and industrial metal. Sepultura has also been credited as one of the second wave of thrash metal acts from the late 1980s and early-to-mid 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 17, "title": "Like a Prayer", "artist": "Madonna", "year": 1989, "cover": "https://dn710303.ca.archive.org/0/items/mbid-1d0b790a-ff42-3a40-afef-d439f279412e/mbid-1d0b790a-ff42-3a40-afef-d439f279412e-3748806166.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6371-madonna-like-a-prayer.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "1f75a8df-176c-3d23-8f1f-b0c8935682ec", "yt_id": "ilottRbDnGY", "rym": "https://rateyourmusic.com/release/album/madonna/like-a-prayer", "genres": ["pop rock", "dance", "synth-pop", "dance-pop", "club"], "desc_lfm_album": "Like a Prayer is the fourth studio album by America singer-songwriter Madonna, released on March 21, 1989 by Sire Records. The RIAA certified it Gold, Platinum & Double Platinum on May 23rd 1989 & Quadruple Platinum on July 16th 1997, recognizing four million shipments in the U.S. - making it her seventh best-selling album there. Worldwide, it has sold more than fifteen million copies. Like a Prayer incorporates rock, dance, pop, soul, and funk elements into the album. Rolling Stone magazine hailed it \"as close to art as pop music gets\". It was recorded in 1988 with collaborators Patrick Leonard .", "desc_lfm_artist": "Madonna Louise Ciccone (/tʃɪˈkoʊni/ chih-KOH-nee; born 16 August 1958) is an American singer, songwriter, record producer, and actress. Known as the \"Queen of Pop\", she is recognised for her continual reinvention and versatility in music, songwriting, and visual presentation. Her work frequently incorporates social, political, sexual, and religious themes, generating both critical acclaim and controversy. Madonna is considered a significant cultural", "desc_mb_album": "", "desc_mb_artist": "If you're looking for ''Greatest Hits Vol. 2'' or something similar, it is already listed under the correct name ''[https://musicbrainz.org/release-group/a0aa8b0a-5e10-3627-afde-7235b86042f6|GHV2]''. \r\nPlease '''do not''' add it again.\r\n\r\nRelease labels according to date: (all releases should follow this*)\r\nWMG parent (1982-2009) as Sire (1982–1995), Maverick (1992–2004), Warner Bros. (2004–2010), Live Nation Artists (2009-)\n\n-------\n\nBorn in Bay City, Michigan, USA, as Madonna Louise Ciccone, Madonna had the extra middle name Veronica added in childhood as confirmation of her family's Catholicism.\r\nHer music career took off in the early 1980's under the performance name [http://musicbrainz.org/artist/79239441-bfd5-4981-a70c-55c3f15c1287.html|Madonna].\r\n\r\nIt is believed her legal name has ", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 18, "title": "3 Feet High and Rising", "artist": "De La Soul", "year": 1989, "cover": "https://dn710704.ca.archive.org/0/items/mbid-21662373-c274-451d-a37b-32f0ab1439b6/mbid-21662373-c274-451d-a37b-32f0ab1439b6-24983921456.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6378-de-la-soul-3-feet-high-and-rising.php", "aoty_critic_score": 95, "aoty_user_score": 85, "mbid": "5243f39c-c344-3989-a0f6-2a2f75a9d827", "yt_id": "yJj-gwsqEJw", "rym": "https://rateyourmusic.com/release/album/de-la-soul/3-feet-high-and-rising", "genres": ["hip hop", "jazz rap", "conscious hip hop", "boom bap", "turntablism", "abstract hip hop"], "desc_lfm_album": "3 Feet High and Rising is the debut studio album by De La Soul, released on March 3, 1989 via Tommy Boy Records. It marked the first of three full-length collaborations with producer Prince Paul. .", "desc_lfm_artist": "De La Soul is an American hip-hop group formed in 1988 in the Amityville area of Long Island, New York. They are best known for their eclectic sampling, quirky lyrics, and their contributions to the evolution of the jazz rap and alternative hip-hop subgenres. The members are Posdnuos, Maseo, and Trugoy (until his death in 2023). The three formed the group in high school and caught the attention of producer Prince Paul with a demo tape of the song \"Plug Tunin'\".", "desc_mb_album": "", "desc_mb_artist": "Please don’t add the album [http://musicbrainz.org/release-group/4aebff62-baae-4017-a9e4-12cbbc4ecc7b|“First Serve”] here. It is already there with the correct Artist [http://musicbrainz.org/artist/a904f60a-b8d2-4ed5-90b5-569bf28d1a80|“First Serve”].", "heard_by": ["EliasJ72", "Nubis84", "alberto_gu", "verygooood"]}, {"n": 19, "title": "Technique", "artist": "New Order", "year": 1989, "cover": "https://dn710905.ca.archive.org/0/items/mbid-01681b1d-3068-3689-b879-efefde1f7b3b/mbid-01681b1d-3068-3689-b879-efefde1f7b3b-2546509254.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6602-new-order-technique.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "a0902fc4-e3d9-3b2b-bc94-cd4d0e59db29", "yt_id": "QBziNQAm85U", "rym": "https://rateyourmusic.com/release/album/new-order/technique", "genres": ["new wave", "synth-pop", "alternative dance", "dance-rock"], "desc_lfm_album": "Technique is the fifth studio album by English rock band New Order. Released on 30 January 1989 by Factory Records, the album was partly recorded on the island of Ibiza, and incorporates Balearic beat and acid house influences into the group's dance-rock sound. The album was influenced by the then growing acid scene, and Sumner's experiences at Shoom in London. It was also New Order's final studio album to be released under Factory Records (though not their final Factory release, that being the following year's \"World in Motion\"); the label would declare bankruptcy in 1992 following a severe financial downturn .", "desc_lfm_artist": "New Order is an English new wave/synthpop band which formed in 1980 in Salford, England, United Kingdom by the three remaining members of Joy Division. The band's classic lineup consists of Bernard Sumner (vocals, guitar, keyboards), Peter Hook (bass, electronic percussion), Gillian Gilbert (keyboards, guitar) and Stephen Morris (drums, keyboards). The group effectively disbanded in 1993 but reformed in 1998. Gilbert left in 2001 to look after her and Morris' children and was replaced by guitarist/keyboardist Phil Cunningham.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 20, "title": "Fugazi", "artist": "Fugazi", "year": 1988, "cover": "https://cdn2.albumoftheyear.org/600x0/album/65422-fugazi-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/65422-fugazi-fugazi.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "5be01c92-bb45-326c-9634-badf08f9ad7f", "yt_id": "d06_Yl-mHE0", "rym": null, "genres": ["post-hardcore"], "desc_lfm_album": "", "desc_lfm_artist": "Fugazi was an American post-hardcore band formed in Washington, D.C., in 1986. The band consists of guitarists and vocalists Ian MacKaye and Guy Picciotto, bassist Joe Lally, and drummer Brendan Canty. They are noted for their style-transcending music, DIY ethical stance, manner of business practice and contempt for the music industry.\n\nSince its inception, Fugazi has been self-managed and have released almost all their material through Dischord Records, an independent label founded by MacKaye and partner Jeff Nelson in 1980.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 21, "title": "Leprosy", "artist": "Death", "year": 1988, "cover": "https://ia802909.us.archive.org/29/items/mbid-c719049a-c3ce-47ae-b4a0-d3e36bf186ce/mbid-c719049a-c3ce-47ae-b4a0-d3e36bf186ce-15736289077.png", "aoty_url": "https://www.albumoftheyear.org/album/38696-death-leprosy.php", "aoty_critic_score": 72, "aoty_user_score": 84, "mbid": "e4f11dc7-ed0c-4fb2-bdf7-b1a6240bd167", "yt_id": "5zQhJNsWBWY", "rym": "https://rateyourmusic.com/release/album/death/leprosy", "genres": ["metal", "death metal"], "desc_lfm_album": "Leprosy is the second album by death metal band Death, released in 1988. Notably different in tone and quality from the 1987 debut, it is the first example of Scott Burns' work heard on many of the death metal and grindcore albums of that era. The cover is featured in Metal: A Headbanger's Journey. The title track \"Leprosy\" was covered by the blackened death metal band Akercocke on their 2007 album Antichrist. Dutch melodic death metal band Callenish Circle covered \"Pull the Plug\" as a bonus on their Flesh Power Dominion album. In a Death Metal special by the German .", "desc_lfm_artist": "There are multiple artists sharing the name Death; \n\n1) A pioneering death metal band from Altamonte Springs, Florida, U.S. \n2) A protopunk band from Detroit, Michigan, U.S. \n3) A horrorcore rapper from New Orleans, Louisiana, U.S. \n4) A hard techno producer from Germany. \n\n1)  Death was an American death metal band formed in Altamonte Springs, Florida in 1984 by guitarist and vocalist Chuck Schuldiner. Death is considered to be among the most influential", "desc_mb_album": "", "desc_mb_artist": "The band was originally started as [http://musicbrainz.org/show/artist/relationships.html?artistid=602427|Mantas] in 1983 and changed its name to Death a year later.", "heard_by": ["Lonsonxd", "MaxtorUwU", "sdecandelario", "verygooood"]}, {"n": 22, "title": "Bug", "artist": "Dinosaur Jr.", "year": 1988, "cover": "https://dn710703.ca.archive.org/0/items/mbid-211993a5-fbcc-4cac-a598-934f39f56f28/mbid-211993a5-fbcc-4cac-a598-934f39f56f28-3323362465.jpg", "aoty_url": "https://www.albumoftheyear.org/album/380-dinosaur-jr-bug.php", "aoty_critic_score": 73, "aoty_user_score": 80, "mbid": "b45028e5-c9d9-34cf-9d2f-0e90ce500c9a", "yt_id": "z45yWIXipy8", "rym": null, "genres": ["alternative rock", "noise rock", "indie rock", "noise pop", "grunge"], "desc_lfm_album": "\"Bug\" is the third studio album by American alternative rock band Dinosaur Jr., released in October 1988 through SST Records. Blast First and Au Go Go Records released the album in the United Kingdom and Australia, respectively. It was the last Dinosaur Jr. album with original bassist Lou Barlow until Beyond in 2007. \"Bug\" is included in the book 1001 Albums You Must Hear Before You Die. Beats Per Minute ranked it the 41st best album of the 1980s. Despite it being a favorite of many Dinosaur Jr. fans, J Mascis has said it is his least favorite Dinosaur Jr. .", "desc_lfm_artist": "Dinosaur Jr. is an American alternative rock band which formed in 1983 in Amherst, Massachusetts. The band was formed by J Mascis (guitar and vocals) and his high school classmate Lou Barlow (bass guitar), following the break-up of their hardcore punk band Deep Wound. Shortly afterwards, Murph (Emmett Patrick Murphy, drums) joined them. \n\nThe band was originally called \"Dinosaur\", but changed its name following the release of its debut album Dinosaur in 1985", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 23, "title": "Daydream Nation", "artist": "Sonic Youth", "year": 1988, "cover": "https://dn711201.ca.archive.org/0/items/mbid-a86ac377-20ae-4a8a-94a7-e8e44a309b00/mbid-a86ac377-20ae-4a8a-94a7-e8e44a309b00-12153262285.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4221-sonic-youth-daydream-nation.php", "aoty_critic_score": 92, "aoty_user_score": 85, "mbid": "24769a99-8189-3d8c-947e-dbc8574dad5c", "yt_id": "PVwJMOtfJbU", "rym": "https://rateyourmusic.com/release/album/sonic-youth/daydream-nation", "genres": ["alternative rock", "noise rock", "no wave", "indie rock"], "desc_lfm_album": "Daydream Nation is the fifth full-length studio album and first double album by American alternative rock band Sonic Youth, released on October 18, 1988. The band recorded the album between July and August 1988 at Greene St. Recording in New York City, and it was released by Enigma Records as a double album. After Daydream Nation was released, it received widespread acclaim from critics and earned Sonic Youth a major label deal. The album was ranked high in critics' year-end lists of 1988's best records, being voted second in The Village Voice's annual Pazz & Jop poll. Daydream Nation has .", "desc_lfm_artist": "Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups", "desc_mb_album": "", "desc_mb_artist": "Sonic Youth were a four-piece band from New York. Emerging from the no-wave movement, their experimental noise distinguished them from other underground bands of the 1980s. Their signing to DGC in 1990 was unusual in the creative freedom given in the contract, and proved that it was possible to remain true to an independent ethic while on a major label.\r\nSee also [http://musicbrainz.org/show/artist/?artistid=58284|Ciccone Youth].", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 24, "title": "Introspective", "artist": "Pet Shop Boys", "year": 1988, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7159-introspective-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7159-pet-shop-boys-introspective.php", "aoty_critic_score": 75, "aoty_user_score": 83, "mbid": "ea12e774-af8c-324d-b6d0-096282a6712a", "yt_id": "AQnkxlK-kLU", "rym": "https://rateyourmusic.com/release/album/pet-shop-boys/introspective-6/", "genres": [], "desc_lfm_album": "Introspective is the fourth album, the third of entirely new music, by the UK electronic music group Pet Shop Boys. It was first released on October 11, 1988 and is the Pet Shop Boys' best-selling album, selling over 4.5 million copies worldwide. It is so named because \"all the songs, although it's a dance album, are introspective\". Perhaps the biggest changes in Pet Shop Boys' sound evident on this album are an increasing attention to orchestration using real orchestras, particularly so on the Trevor Horn-produced \"Left to my own devices,\" which took months to produce. The album was also unusual .", "desc_lfm_artist": "Pet Shop Boys is a British synthpop/dance music duo, consisting of Neil Tennant and Chris Lowe and were formed in London, UK in 1981.\n\nPost-modern ironists cloaked behind a veil of buoyantly melodic and lushly romantic synth pop confections, Pet Shop Boys offer wry yet strangely affecting cultural commentary communicated by the Morse code of synth washes and drum machine rhythms. After first emerging in the mid-'80s with \"West End Girls\" and \"Opportunities (Let's Make Lots of Money)", "desc_mb_album": "", "desc_mb_artist": "Pet Shop Boys Commentary: Interpretations and Analyses of Every Song Written or Performed by Chris Lowe and Neil Tennant \r\nby Wayne Studer, Ph.D. @ [http://www.geowayne.com/psbhtml.htm]  \r\n\r\nPet Shop Boys at dead of night: Visit [http://psb-atdeadofnight.net/] for lyrics to more than 300 songs, many MIDI files, news, pictures and much more.", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 25, "title": "Blood Fire Death", "artist": "Bathory", "year": 1988, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33251-blood-fire-death_063344.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33251-bathory-blood-fire-death.php", "aoty_critic_score": 70, "aoty_user_score": 83, "mbid": "ea110d40-17d2-39d9-8c12-2eb5257b8d11", "yt_id": "DCXVpj7uRes", "rym": "https://rateyourmusic.com/release/album/bathory/blood-fire-death-2/", "genres": [], "desc_lfm_album": "Blood Fire Death is the fourth album by the Swedish band Bathory. It continued the band's transition towards more epic songwriting, and includes some of the first Viking metal recordings. The lyrics to The Golden Walls of Heaven and Dies Irae are acrostics: the first letters of each line form phrases, namely \"SATAN\" (repeated 8 times) and \"CHRIST THE BASTARD SON OF HEAVEN,\" respectively. The lyrics to For All Those Who Died were taken from a poem by Erica Jong, first published in her book Witches (1981). The 1999 and 2004 re-issue of the album In The Nightside Eclipse by .", "desc_lfm_artist": "Bathory was a Swedish black metal band formed in Vällingby in 1983 and named after the infamous Hungarian countess Elizabeth Báthory. The band's frontman and main songwriter was Quorthon (Tomas Forsberg). Bathory's first four albums were \"the blueprint for Scandinavian black metal\". The band departed from this style on their fifth album, Hammerheart (1990), which is often cited as the first Viking metal album. Bathory continued in the Viking metal style throughout the 1990s and early 2000s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 26, "title": "Lincoln", "artist": "They Might Be Giants", "year": 1988, "cover": "https://dn710707.ca.archive.org/0/items/mbid-3ff2bdd4-cdac-425c-a5db-e38e9ccd3bca/mbid-3ff2bdd4-cdac-425c-a5db-e38e9ccd3bca-44047034505.png", "aoty_url": "https://www.albumoftheyear.org/album/6521-they-might-be-giants-lincoln.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "715a2093-aab9-3cbe-bc15-0925533e59df", "yt_id": "YUHuqb-nSi4", "rym": "https://rateyourmusic.com/release/album/they-might-be-giants/lincoln", "genres": ["alternative rock", "pop rock", "comedy rock"], "desc_lfm_album": "Lincoln is the second studio album by the band They Might Be Giants. It was released by Bar/None in 1988. The album is named after John Linnell and John Flansburgh's boyhood home of Lincoln, Massachusetts. Lincoln maintains the range of musical styles present on the previous album, They Might Be Giants, and lyrically attempts to merge word play into narrative songs. Lyrical themes are broadened with the inclusion of songs detailing troubled romantic relationships (\"Ana Ng\", \"They'll Need a Crane\", \"I've Got a Match\"), and songs that verge on social or political satire (\"Purple Toupee\", \"Kiss Me, Son of God\"), .", "desc_lfm_artist": "They Might Be Giants (TMBG) is an American alternative rock band formed in 1982 in Brooklyn, New York, United States by John Flansburgh (vocals, guitar) and John Linnell (vocals, keyboards, accordion, bass clarinet). During TMBG's early years Flansburgh and Linnell were frequently accompanied by a drum machine. In the early nineties, TMBG became a full band. Currently, the members of TMBG are Flansburgh, Linnell, Marty Beller, Dan Miller, and Danny Weinkauf.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 27, "title": "Tender Prey", "artist": "Nick Cave", "year": 1988, "cover": "https://ia801300.us.archive.org/18/items/mbid-07aee6a3-f985-4d8d-af75-23a2f81a842c/mbid-07aee6a3-f985-4d8d-af75-23a2f81a842c-8820126179.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "52356383-49dd-378e-bcb4-ff44625f695c", "yt_id": "QGbEdVaJJVs", "rym": "https://rateyourmusic.com/release/album/nick-cave-and-the-bad-seeds/tender-prey/reviews/21", "genres": ["alternative rock", "blues", "post-punk", "gothic rock", "garage punk", "gothic country"], "desc_lfm_album": "", "desc_lfm_artist": "Nicholas Edward Cave AO (born 22 September 1957) is an Australian singer, songwriter, author, screenwriter, composer and occasional actor, best known for fronting the rock band Nick Cave & the Bad Seeds. Cave's music is generally characterized by his baritone voice, emotional intensity, a wide variety of influences and lyrical obsessions with death, religion, love and violence.\n\nBorn and raised in rural Victoria, Cave studied art before fronting The Birthday Party, one of Melbourne's leading post-punk bands, in the late 1970s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 28, "title": "Blue Bell Knoll", "artist": "Cocteau Twins", "year": 1988, "cover": "https://dn710203.ca.archive.org/0/items/mbid-d76d1a51-7880-4681-acff-e2d054ae275e/mbid-d76d1a51-7880-4681-acff-e2d054ae275e-43778735778.png", "aoty_url": "https://www.albumoftheyear.org/album/6515-cocteau-twins-blue-bell-knoll.php", "aoty_critic_score": 76, "aoty_user_score": 83, "mbid": "33260535-22d6-36b5-a636-f0c012e2f5a4", "yt_id": "ZpqaNjtaU6o", "rym": "https://rateyourmusic.com/release/album/cocteau-twins/blue-bell-knoll", "genres": ["alternative rock", "indie rock", "trance", "shoegaze", "dream pop", "ethereal wave"], "desc_lfm_album": "Blue Bell Knoll (1988) is the fifth album by Scottish band Cocteau Twins. This was the first LP by the Twins to receive major-label distribution in the USA, as it was originally licensed by Capitol Records from 4AD for North American release. After a period of being out of print while 4AD reclaimed the American distribution rights for their back catalog, this (along with much of the band's 4AD material) was remastered by Robin Guthrie and re-issued in 2003. The album shares its name with a peak in southern Utah, Bluebell Knoll. Blue Bell Knoll was listed by Pitchfork Media .", "desc_lfm_artist": "Cocteau Twins was a Scottish rock band active from 1979 to 1997. The group was formed in Grangemouth, Scotland, by Robin Guthrie (guitar, drum machine) and Will Heggie (bass), with Elizabeth Fraser (vocals) joining in 1981. In 1983, Heggie was replaced by multi-instrumentalist Simon Raymonde, completing the lineup most associated with the band’s career. Cocteau Twins became known for their ethereal, heavily layered sound and Fraser’s distinctive soprano vocal style, often featuring lyrics that avoid conventional language.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 29, "title": "Spirit Of Eden", "artist": "Talk Talk", "year": 1988, "cover": "https://dn710608.ca.archive.org/0/items/mbid-f95a4d58-aeaa-4e5c-b198-5e2145020d61/mbid-f95a4d58-aeaa-4e5c-b198-5e2145020d61-25342309824.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6430-talk-talk-spirit-of-eden.php", "aoty_critic_score": 87, "aoty_user_score": 86, "mbid": "fd29e2cd-9bd7-32c6-adf9-ce80ab1cadfc", "yt_id": "HSfGvuiFOWI", "rym": "https://rateyourmusic.com/release/album/talk-talk/spirit-of-eden", "genres": ["experimental rock", "art rock", "jazz", "chamber pop", "post-rock", "ambient pop"], "desc_lfm_album": "Spirit of Eden is the fourth album by the English New wave band Talk Talk, released in 1988 on Parlophone records. The album found neither critical acclaim nor commercial success on release but has since become a cult favourite. The songs were mostly written by vocalist Mark Hollis and producer Tim Friese-Greene and the album was compiled from a lengthy recording process at London's Wessex Studios between 1987 and 1988. Often working in darkness, the band recorded many hours of improvised performances which were heavily edited and re-arranged into an album in mostly digital format. The songs contain elements of .", "desc_lfm_artist": "Talk Talk were an English band formed in 1981 by Mark Hollis (vocals, guitar, piano), Lee Harris (drums), Paul Webb (bass), and Simon Brenner (keyboards). The band initially performed as a synth-pop group, and their first two albums, \"The Party's Over\" (1982) and \"It's My Life\" (1984), reached the top 40 in the UK and produced international singles including \"Talk Talk\", \"Today\", \"It's My Life\", and \"Such a Shame\".\n\nThe band's third album, \"The Colour of Spring\" (1986)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 30, "title": "…And Justice for All", "artist": "Metallica", "year": 1988, "cover": "https://ia903205.us.archive.org/4/items/mbid-da53e497-8c61-4d4a-a29b-a5b53d86ccb7/mbid-da53e497-8c61-4d4a-a29b-a5b53d86ccb7-7476858115.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "67553e23-8dad-3792-b6f2-8fedd5650ff3", "yt_id": "QnXOSUQ5HJY", "rym": null, "genres": ["hard rock", "heavy metal", "metal", "progressive metal", "thrash metal", "speed metal"], "desc_lfm_album": "…And Justice for All is the fourth studio album by American heavy metal band Metallica. Elektra Records released the album on August 25, 1988. This is the first Metallica studio album to feature bassist Jason Newsted, since it is the first after the tragic death of the group's former bassist Cliff Burton. The album's dark subject material, featuring references to nuclear apocalypse, injustice in the law system, limited freedom, war, insanity and hate, is accompanied by the most complex song structures to this date in Metallica's discography. The album is also noted for its near lack of bass guitar and .", "desc_lfm_artist": "Metallica is an American heavy metal band formed in Los Angeles in 1981 by James Hetfield and Lars Ulrich and later based in San Francisco. Known for fast tempos, complex instrumentals and aggressive musicianship, the group became one of the founding big four bands of thrash metal alongside Megadeth, Anthrax and Slayer. The current lineup consists of Hetfield, Ulrich, Kirk Hammett and Robert Trujillo. Former members include Dave Mustaine, Ron McGovney, Cliff Burton and Jason Newsted.", "desc_mb_album": "", "desc_mb_artist": "'''Attention!''' The album known sometimes as ''The Black Album'' is already in this database, it is correctly named simply ''[http://musicbrainz.org/release-group/e8f70201-8899-3f0c-9e07-5d6495bc8046.html|Metallica]''. This is because ''The Black Album'' is only a fan-composed name. Please do not add it or rename it.\r\n\r\nBoth the infamous ''Garage Days'' (in the EPs section) and ''[http://musicbrainz.org/release-group/49371adc-871d-38f6-bb60-fd9e5af6795f.html|S&M]'' (in the Live section) are also here, they're just a bit scattered. \r\n\r\nMetallica has been selling Official/Live concert recordings on [http://www.livemetallica.com] since 2004-03-02.  Please add a \"X can be purchased for download at Y\" relationship if you add one of these releases.  For a list of which shows have already been a", "heard_by": ["BipolarMuzik", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 31, "title": "you made me realise", "artist": "my bloody valentine", "year": 1988, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5842-you-made-me-realise-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5842-my-bloody-valentine-you-made-me-realise.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "d76912e5-b648-32a5-b521-384be78266d5", "yt_id": "3OvXL9R7Ifs", "rym": null, "genres": [], "desc_lfm_album": "You Made Me Realise is the third extended play by alternative rock band My Bloody Valentine, released on 8 August 1988 through Creation Records. It was their first record for Creation. The EP marked a change in direction for the band, where they adopted a noisier sound. Peter Kember, then of Spacemen 3, recalled seeing the band play \"You Made Me Realise\" at a live performance at the Roadmender in Northampton in 1988, after My Bloody Valentine had supported the Pixies on the latter's first European tour: \"They’d transformed. I don’t know quite what had happened, but sometimes bands hit .", "desc_lfm_artist": "my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 32, "title": "Straight Outta Compton", "artist": "N.W.A", "year": 1988, "cover": "https://dn710307.ca.archive.org/0/items/mbid-d930166c-e5b6-420d-8177-e62f351f6859/mbid-d930166c-e5b6-420d-8177-e62f351f6859-5658377319.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "fed1608d-80b7-38d2-aeb8-c6357f0d4c23", "yt_id": "Vgs2kPKvdAM", "rym": "https://rateyourmusic.com/release/album/n_w_a/straight-outta-compton", "genres": ["hip hop", "west coast hip hop", "gangsta rap"], "desc_lfm_album": "Straight Outta Compton is the debut studio album by American hip hop group N.W.A, released August 8, 1988 on group member Eazy-E's record label Ruthless Records. Its title refers to the group's native town, Compton, California. Production for the album was handled by Dr. Dre, with DJ Yella giving co-production. The album has been viewed as the pioneering record of gangsta rap; with its ever-present profanity and violent lyrics, it helped to give birth to this then-new sub-genre of hip hop. It has been considered groundbreaking by music writers and has had an enormous impact on the evolution of West .", "desc_lfm_artist": "N.W.A (abbreviation for Niggaz Wit Attitudes) was an American hip hop group from Compton, California, United States widely considered one of the seminal acts of the gangsta rap sub-genre, sometimes credited as the most important group in the history of hip hop. Active from 1986 to 1991, the rap group endured controversy due to the explicit nature of their lyrics, and was subsequently banned from many mainstream U.S. radio stations. In spite of this, the group has sold over 10 million CD units in the U.S. alone.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 33, "title": "Follow the Leader", "artist": "Eric B. & Rakim", "year": 1988, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7559-follow-the-leader.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7559-eric-b-rakim-follow-the-leader.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "4a398278-4b78-4955-80b1-863efdb36d2e", "yt_id": "95gP3m-uBHA", "rym": "https://rateyourmusic.com/release/album/eric-b-and-rakim/follow-the-leader", "genres": ["electro", "hip hop"], "desc_lfm_album": "Follow the Leader is the second studio album by Eric B. & Rakim, released on July 26, 1988. It was recorded at Power Play Studios (New York City) and produced by the duo themselves. .", "desc_lfm_artist": "Eric B. & Rakim was a hip-hop duo from New York City, New York, United States composed of DJ Eric Barrier (born November 8, 1965) and MC Rakim (born William Michael Griffin Jr.). The duo went on to release 4 studio albums with their 1987, Paid in Full being regarded as one the most influential albums in Hip Hop. In 1988, they released their second album titled, Follow The Leader. They later continued to release two more albums in 1990, Let the Rhythm Hit 'Em and in 1992", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 34, "title": "South of Heaven", "artist": "Slayer", "year": 1988, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12599-south-of-heaven.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12599-slayer-south-of-heaven.php", "aoty_critic_score": 65, "aoty_user_score": 80, "mbid": "74292121-e345-3f10-85ae-013f4e5a8cae", "yt_id": "b8vpLV9iN_E", "rym": "https://rateyourmusic.com/release/album/slayer/south-of-heaven", "genres": [], "desc_lfm_album": "South of Heaven is the fourth studio album by the American thrash metal band Slayer. Released on July 5, 1988, the album was the band's second collaboration with record producer Rick Rubin, whose production skills on Slayer's previous album Reign in Blood had helped the band's sound evolve. South of Heaven was Slayer's second album to enter the Billboard 200, and its last to be released by Def Jam Recordings, although the album became an American Recordings album after Rick Rubin ended his partnership with Russell Simmons. It was one of only two Def Jam titles to be distributed by .", "desc_lfm_artist": "Slayer is an American thrash metal band from Huntington Park, California, formed in 1981 by Kerry King, Jeff Hanneman, Dave Lombardo, and Tom Araya. The band became known for a fast and aggressive style that placed it among the big four of thrash metal alongside Metallica, Megadeth, and Anthrax. The lineup later included Paul Bostaph on drums and Gary Holt on guitar; Holt initially joined as a touring member in 2011 and became a permanent member following Hanneman’s death in 2013. Drummer Jon Dette is a former member.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 35, "title": "It Takes a Nation of Millions to Hold Us Back", "artist": "Public Enemy", "year": 1988, "cover": "https://dn711107.ca.archive.org/0/items/mbid-4ef7fe79-3002-4779-9aa4-3430ae0ce6be/mbid-4ef7fe79-3002-4779-9aa4-3430ae0ce6be-9705281248.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6331-public-enemy-it-takes-a-nation-of-millions-to-hold-us-back.php", "aoty_critic_score": 99, "aoty_user_score": 87, "mbid": "01921d99-9d15-3fce-8734-46e58327cfb7", "yt_id": "UexhiKFCAAM", "rym": "https://rateyourmusic.com/release/album/public-enemy/it-takes-a-nation-of-millions-to-hold-us-back/", "genres": ["hip hop", "experimental hip hop", "east coast hip hop", "conscious hip hop", "hardcore hip hop", "political hip hop"], "desc_lfm_album": "It Takes a Nation of Millions to Hold Us Back is the second studio album by American hip hop group Public Enemy, released in April 1988 by Def Jam Recordings. Public Enemy set out to make the hip hop equivalent to Marvin Gaye's What's Going On, an album noted for its strong social commentary. Recording sessions took place during 1987 at Chung King Studios, Greene St. Recording, and Sabella Studios in New York City. Noting the enthusiastic response toward their live shows, Public Enemy intended with Nation of Millions to make the music of a faster tempo than the previous .", "desc_lfm_artist": "Public Enemy are an American hip hop group formed by Chuck D and Flavor Flav in Long Island, New York, in 1985. The group rose to prominence for their political messages including subjects such as American racism and the American media. Their debut album, Yo! Bum Rush the Show, was released in 1987 to critical acclaim, and their second album, It Takes a Nation of Millions to Hold Us Back (1988), was the first hip hop album to top The Village Voice's Pazz & Jop critics' poll.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 36, "title": "Stronger Than Pride", "artist": "Sade", "year": 1988, "cover": "https://cdn2.albumoftheyear.org/600x0/album/45359-stronger-than-pride_190333.jpg", "aoty_url": "https://www.albumoftheyear.org/album/45359-sade-stronger-than-pride.php", "aoty_cr
