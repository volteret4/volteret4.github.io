<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOTY Must Hear — 1960s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/images/discount.png" />
<script defer src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;
  --accent:#e8ff47;--heard:#e8ff47;--pending:#ff4747;
  --text:#e0e0e0;--muted:#555;--gap:6px;
  --panel:390px;--header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{
  position:fixed;top:0;left:0;right:var(--panel);height:var(--header-h);z-index:100;
  background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:0 18px;display:flex;align-items:center;gap:12px;
}
.back-link{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.dec-wrap{position:relative}
.dec-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);
  color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.dec-btn:hover{background:rgba(232,255,71,.12)}
.dec-dropdown{
  display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:160px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.dec-dropdown.open{display:block}
.dec-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.dec-item{display:block;padding:6px 14px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);text-decoration:none;transition:background .1s}
.dec-item:hover{background:var(--surface)}
.dec-item.active{color:var(--accent)}
.controls{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0}
.filter-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.search-box{
  font-family:'DM Mono',monospace;font-size:.62rem;padding:4px 9px;
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);width:130px;outline:none;transition:border-color .15s;
}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.genre-wrap{position:relative}
.genre-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.genre-btn:hover,.genre-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.genre-btn .badge{background:var(--accent);color:#000;border-radius:10px;padding:1px 5px;font-size:.52rem;font-weight:700}
.genre-dropdown{
  display:none;position:fixed;
  background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:200px;max-height:320px;overflow-y:auto;padding:4px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.genre-dropdown.open{display:block}
.genre-dh{
  padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:3px;
  display:flex;justify-content:space-between;
}
.genre-clear{color:var(--pending);cursor:pointer}
.genre-item{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;transition:background .1s}
.genre-item:hover{background:var(--surface)}
.genre-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.genre-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);cursor:pointer;flex:1;display:flex;justify-content:space-between}
.genre-item label span{color:var(--muted);font-size:.56rem}
.user-wrap{position:relative}
.user-btn{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.user-btn:hover{background:rgba(232,255,71,.12)}
.user-btn .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.user-dropdown{display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;z-index:9999;min-width:164px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.user-dropdown.open{display:block}
.user-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.user-item{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;transition:background .1s;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text)}
.user-item:hover{background:var(--surface)}
.user-item.active{color:var(--accent)}
.user-item .u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.user-item.active .u-dot{background:var(--accent)}
#main{margin-top:var(--header-h);margin-right:var(--panel);padding:14px 18px 60px;position:relative;z-index:0}
.count-bar{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px;display:flex;gap:14px}
.count-bar b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.05);z-index:10}
.card.hidden{display:none}
.card.active-card{outline:2px solid var(--accent);outline-offset:2px;z-index:11}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.heard-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3;background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,0) 55%);
  opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px;z-index:2;
}
.card:hover .card-overlay{opacity:1}
.card-scores{display:flex;gap:3px;margin-bottom:2px}
.card-score{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;padding:1px 4px;border-radius:2px}
.card-score.c{background:rgba(108,184,250,.2);color:#6cb8fa}
.card-score.u{background:rgba(191,143,255,.2);color:#bf8fff}
.card-title{font-size:.56rem;font-weight:500;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{font-size:.52rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3}
.card.heard-user::before{background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card.unheard-user::before{background:var(--pending);box-shadow:0 0 5px var(--pending)}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panel);
  background:#0c0c0c;border-left:1px solid var(--border);
  z-index:50;display:flex;flex-direction:column;overflow:hidden;
}
.panel-topbar{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 15px;flex-shrink:0}
.panel-topbar-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel-cover{width:100%;aspect-ratio:1;flex-shrink:0;position:relative;background:var(--surface);max-height:200px;overflow:hidden}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-scores{display:flex;gap:6px;position:absolute;bottom:8px;left:8px}
.panel-score{padding:3px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700}
.panel-score.c{background:rgba(0,0,0,.7);color:#6cb8fa;border:1px solid #6cb8fa44}
.panel-score.u{background:rgba(0,0,0,.7);color:#bf8fff;border:1px solid #bf8fff44}
.panel-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.panel-empty-icon{font-size:2rem;opacity:.3}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);line-height:1.05;margin-bottom:2px}
.panel-artist{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.panel-year{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.panel-genre-tag{font-family:'DM Mono',monospace;font-size:.56rem;padding:2px 6px;border-radius:2px;background:rgba(232,255,71,.07);border:1px solid rgba(232,255,71,.18);color:rgba(232,255,71,.65)}
.panel-heard-by{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:9px}
.panel-heard-by b{color:var(--heard)}
.panel-divider{height:1px;background:var(--border);margin:9px 0}
.panel-section-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.panel-bio{font-size:.72rem;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-bio::-webkit-scrollbar{width:3px}
.panel-bio::-webkit-scrollbar-thumb{background:var(--border)}
.desc-block{margin-bottom:9px}
.desc-source-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.desc-source-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.desc-source-label.lfm{color:#d51007}.desc-source-label.mb{color:#ba478f}.desc-source-label.artist{color:#6a9fb5}
.desc-source-text{font-size:.7rem;color:#aaa;line-height:1.55}
.panel-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.panel-link{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}
.panel-link.aoty{border-color:#e87c2e;color:#e87c2e}
.panel-link.aoty:hover{background:rgba(232,124,46,.08)}
.panel-link.yt{border-color:#f00;color:#f00}
.panel-link.yt:hover{background:rgba(255,0,0,.08)}
.panel-link.rym{border-color:#5baadb;color:#5baadb}
.panel-link.rym:hover{background:rgba(91,170,219,.08)}
.panel-yt-wrap{margin-top:11px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.panel-yt-wrap iframe{display:block;width:100%;height:145px;border:none}
.panel-yt-placeholder{height:60px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.panel-close-btn{display:none;position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.18)}
.grid-sizer{display:flex;align-items:center;gap:5px}
.grid-sizer span{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);min-width:24px;text-align:right}
#grid-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#grid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
#grid-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#empty{display:none;text-align:center;padding:50px 0;font-family:'DM Mono',monospace;color:var(--muted);font-size:.7rem}
@media(max-width:600px){
  :root{--header-h:50px}
  header{right:0;height:auto;min-height:var(--header-h);flex-wrap:wrap;padding:8px 12px;gap:6px 10px;overflow:visible}
  #main{margin-right:0;padding:10px 10px 60px}
  #panel{inset:0;width:100%;border-left:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  #panel.panel-open{transform:translateY(0)}
  .panel-close-btn{display:flex}
  .controls{flex:0 0 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:5px;padding:5px 0 2px;border-top:1px solid var(--border);scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .dec-wrap{display:none}
}</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">←</a>
  <span class="header-title">AOTY Must Hear</span>
  <div class="dec-wrap">
    <button class="dec-btn" id="dec-btn" onclick="toggleDecDD()">
      1960s &#x25BE;
    </button>
  </div>
  <div class="controls">
    <button class="filter-btn active" id="btn-all"     onclick="setFilter('all')">All</button>
    <button class="filter-btn"        id="btn-heard"   onclick="setFilter('heard')">Heard</button>
    <button class="filter-btn"        id="btn-unheard" onclick="setFilter('unheard')">Unheard</button>
    <input class="search-box" id="search" placeholder="Search..." oninput="applyFilters()">
    <div class="genre-wrap">
      <button class="genre-btn" id="genre-btn" onclick="toggleGenreDD()">
        Genre <span class="badge" id="genre-badge" style="display:none">0</span> &#x25BE;
      </button>
    </div>
    <div class="user-wrap">
      <button class="user-btn" id="user-btn" onclick="toggleUserDD()">
        <span class="u-name" id="user-btn-label">All users</span> &#x25BE;
      </button>
    </div>
    <div class="grid-sizer">
      <span id="grid-label">10×</span>
      <input type="range" id="grid-slider" min="3" max="20" value="10" step="1" oninput="setGridSize(this.value)">
    </div>
  </div>
</header>
<main id="main">
  <div class="count-bar">
    <span>Showing <b id="vis-count">99</b> of 99</span>
    <span><b id="vis-heard">0</b> heard</span>
  </div>
  <div id="grid"></div>
  <div id="empty">No albums match your filters.</div>
</main>
<aside id="panel">
  <button class="panel-close-btn" onclick="closePanel()" aria-label="Close">&#x2715;</button>
  <div class="panel-topbar">
    <span class="panel-topbar-label">Album detail</span>
  </div>
  <div id="panel-cover-wrap" class="panel-cover" style="display:none">
    <img id="p-cover" src="" alt="">
    <div class="panel-scores" id="p-scores"></div>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="panel-empty"><div class="panel-empty-icon">◉</div>Click an album</div>
  </div>
</aside>
<div class="dec-dropdown" id="dec-dd">
  <div class="dec-dh">Jump to decade</div>
  <a class="dec-item" href="decade_1950s.html">1950s</a><a class="dec-item active" href="decade_1960s.html">1960s</a><a class="dec-item" href="decade_1970s.html">1970s</a><a class="dec-item" href="decade_1980s.html">1980s</a><a class="dec-item" href="decade_1990s.html">1990s</a><a class="dec-item" href="decade_2000s.html">2000s</a><a class="dec-item" href="decade_2010s.html">2010s</a><a class="dec-item" href="decade_2020s.html">2020s</a>
</div>
<div class="genre-dropdown" id="genre-dd">
  <div class="genre-dh">Filter by genre <span class="genre-clear" onclick="clearGenres()">clear</span></div>
  <div id="genre-list"></div>
</div>
<div class="user-dropdown" id="user-dd">
  <div class="user-dh">View as user</div>
  <div id="user-list"></div>
</div>

-it-bleed.php", "aoty_critic_score": 98, "aoty_user_score": 82, "mbid": "784c0edd-0f37-33a2-9ca5-dff87b4f999c", "yt_id": "LV_e7OANALo", "rym": "https://rateyourmusic.com/release/album/rolling-stones/let-it-bleed-1", "genres": ["blues rock", "classic rock", "hard rock", "blues", "country blues"], "desc_lfm_album": "Let It Bleed is an album by English rock band The Rolling Stones, released in December 1969. The follow up to Beggars Banquet (1968), it appeared shortly after the band's 1969 American Tour. History Although they had begun the recording of \"You Can't Always Get What You Want\" in March 1968, before Beggars Banquet had been released, recording for Let It Bleed began in earnest in February 1969 and would continue sporadically until November. Brian Jones performs on only two tracks, the autoharp on \"You Got the Silver\" and percussion on \"Midnight Rambler\". His replacement Mick Taylor also plays on .", "desc_lfm_artist": "The Rolling Stones are an English rock band formed in London in 1962. Active for six decades, they are one of the most popular and enduring bands of the rock era. In the early 1960s, the Rolling Stones pioneered the gritty, rhythmically driven sound that came to define hard rock. Their first stable line-up consisted of vocalist Mick Jagger, multi-instrumentalist Brian Jones, guitarist Keith Richards, bassist Bill Wyman, and drummer Charlie Watts. During their formative years", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 3, "title": "Willy and the Poor Boys", "artist": "Creedence Clearwater Revival", "year": 1969, "cover": "https://dn711108.ca.archive.org/0/items/mbid-8283a0d4-cdbc-4e6c-9f50-03c74235afb2/mbid-8283a0d4-cdbc-4e6c-9f50-03c74235afb2-26542194387.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6059-creedence-clearwater-revival-willy-and-the-poor-boys.php", "aoty_critic_score": 100, "aoty_user_score": 81, "mbid": "5fdea541-32fc-3b17-b7c4-50b40f65203d", n (1969). This progress helped create a work that became more widely acclaimed and influential than .", "desc_lfm_artist": "Led Zeppelin were an English rock band formed in London in 1968. The group consisted of Robert Plant on vocals, Jimmy Page on guitar, John Paul Jones on bass and keyboards, and John Bonham on drums. Known for a heavy, guitar-based sound that drew from blues and folk traditions, they are widely regarded as a major influence on the development of hard rock and heavy metal. They became one of the best-selling music artists in history and helped shape album-oriented rock and stadium rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 7, "title": "Arthur (or The Decline and Fall of the British Empire)", "artist": "The Kinks", "year": 1969, "cover": "https://dn711105.ca.archive.org/0/items/mbid-a42ad36f-f1e0-3cfa-94f9-6b594a07dc00/mbid-a42ad36f-f1e0-3cfa-94f9-6b594a07dc00-19208380936.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "cd27ba91-162e-3d8a-8042-9451b84aa78e", "yt_id": "qG3JyuAUE2E", "rym": "https://rateyourmusic.com/release/album/the-kinks/arthur-or-the-decline-and-fall-of-the-british-empire", "genres": ["classic rock", "pop rock", "baroque pop", "psychedelic pop", "rock opera"], "desc_lfm_album": "", "desc_lfm_artist": "The Kinks (1963–1996; 2018-present) are an English pop-rock group that came out of the British R&B scene of the early 1960s. Formed in Muswell Hill, Middlesex, by brothers Ray Davies and Dave Davies in 1964 and categorised in the United States as a \"British Invasion\" band, the Kinks are recognised as one of the most important and influential rock groups of the era. In 1990, their first year of eligibility, the original four members were inducted into the Rock & Roll Hall of Fame.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 8, "title": "Hot Rats", "artist": "Frank Zappa", "year": 1969, "cover": "https://dn710302.ca.archive.org/0/items/mbid-6327a725-8554-4900-a268-bdba3cb03169/mbid-6327a725-8554-4900-a268-bdba3cb03169-11263298625.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8330-frank-zappa-hot-rats.php", "aoty_critic_score": 90, "aoty_user_score": 88, "mbid": "3f974fbd-9db8-3dff-9466-b9ae6fd9146c", "yt_id": "RdU4FHH4FnE", "rym": "https://rateyourmusic.com/release/album/frank-zappa/hot-rats", "genres": ["classic rock", "jazz rock", "progressive rock", "jazz", "jazz fusion"], "desc_lfm_album": "Hot Rats is the second solo album by Frank Zappa. It was released in October 1969. The album consists of six songs, five of which are instrumental (the song \"Willie the Pimp\" features a short vocal by Captain Beefheart). It was Zappa's first recording project after the dissolution of the original Mothers of Invention. Because it focuses on long instrumental jazz-like compositions with extensive soloing, the music sounds very different than earlier Zappa albums which featured short songs with satirical vocal performances. It features none of the Mothers, save Ian Underwood, who was also the primary collaborator and sideman. In .", "desc_lfm_artist": "Frank Vincent Zappa (December 21, 1940 – December 4, 1993) was an American composer, songwriter, guitarist, conductor, actor, satirist, filmmaker, and activist. Over a career spanning more than 30 years, he produced a wide range of music, including rock, pop, jazz, jazz fusion, orchestral, and musique concrète. He released more than 60 albums both with his band the Mothers of Invention and as a solo artist, often producing them himself. His work is noted for experimentation, improvisation, musical virtuosity, and satire of American culture.", "desc_mb_album": "", "desc_mb_artist": "[https://musicbrainz.org/artist/fe98e268-4ddd-441b-95a0-b219375f9ae4|The Mothers of Invention] have their own entry. Please do not add releases by the Mothers to this artist.", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 9, "title": "In the Court of the Crimson King", "artist": "King Crimson", "year": 1969, "cover": "https://dn710709.ca.archive.org/0/items/mbid-99b00db1-1b1f-3b58-9bce-e3428ded3ee7/mbid-99b00db1-1b1f-3b58-9bce-e3428ded3ee7-2985712197.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5929-king-crimson-in-the-court-of-the-crimson-king.php", "aoty_critic_score": 90, "aoty_user_score": 92, "mbid": "a50636b5-5233-3329-a7f3-dba3d0e00ef7", "yt_id": "0ju5LRTMFLw", "rym": "https://rateyourmusic.com/release/album/king-crimson/in-the-court-of-the-crimson-king-89", "genres": ["art rock", "progressive rock"], "desc_lfm_album": "\"In the Court of the Crimson King\" (subtitled \"An Observation by King Crimson\") is the debut studio album by English progressive rock band King Crimson, released on 10 October 1969 by Island Records. It is often regarded as one of the first true progressive rock albums, combining rock influences with elements of jazz, classical, and symphonic music. The album explores themes such as the devastating effects of war and conflict, societal alienation and disillusionment, the perceived futility of human efforts against powerful and corrupt forces, and unchecked authority and leadership. The album was King Crimson's most commercially successful release and .", "desc_lfm_artist": "King Crimson are an English progressive rock band formed in London in 1968 by Robert Fripp, Michael Giles, Greg Lake, Ian McDonald and Peter Sinfield. Guitarist and leader Fripp has remained the only constant member throughout the band's long history. The band drew inspiration from a wide variety of music, incorporating elements of classical, jazz, folk, heavy metal, gamelan, blues, industrial, electronic, and experimental music. They also exer Brown Album, in the spirit of the Beatles' The Beatles. Released in 1969, it's a follow up to their debut alblum \"Music from Big Pink\". The Band peaked at #9 on Billboard's Pop Albums chart. In 2000, it recharted on Billboard's Internet Albums chart, peaking at #10. The singles \"Rag Mama Rag\" and \"Up on Cripple Creek\" peaked on the Pop Singles chart at #57 and #25 respectively. The album includes many of The Band's best-known and critically acclaimed songs, .", "desc_lfm_artist": "The Band was a Canadian rock band formed in Toronto, Ontario in 1967. The original members were Robbie Robertson (guitar, piano, drums, harmonica), Richard Manuel (piano, harmonica, drums, saxophone, organ, slide guitar), Garth Hudson (organ, piano, clavinet, accordion, synthesizer, saxophone), Rick Danko (bass guitar, violin, trombone, guitar), and Levon Helm (drums, mandolin, guitar, bass guitar, harmonica). \n\nThe members of The Band first worked together as The Hawks, the backing band of rockabilly singer Ronnie Hawkins from 1959 until 1963.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 12, "title": "I Got Dem Ol' Kozmic Blues Again Mama!", "artist": "Janis Joplin", "year": 1969, "cover": "https://cdn2.albumoftheyear.org/600x0/album/26784-i-got-dem-ol-kozmic-blues-again-mama_014619.jpg", "aoty_url": "https://www.albumoftheyear.org/album/26784-janis-joplin-i-got-dem-ol-kozmic-blues-again-mama.php", "aoty_critic_score": 72, "aoty_user_score": 83, "mbid": "6906dd24-1425-3f07-97df-aa8791d27265", "yt_id": "HINw382TSQ4", "rym": "https://rateyourmusic.com/release/album/janis-joplin/i-got-dem-ol-kozmic-blues-again-mama", "genres": [], "desc_lfm_album": "I Got Dem Ol' Kozmic Blues Again Mama! is the debut solo studio album by American singer-songwriter Janis Joplin, released on September 11, 1969. It was the first album which Joplin recorded after leaving her former band, Big Brother and the Holding Company, and the only solo album released during her lifetime. .", "desc_lfm_artist": "Janis Joplin (born 19 January 1943 in Port Arthur, Texas, United States, died 4 October 1970 in Los Angeles, California) was an American singer, songwriter, composer and painter. Originally the lead singer for the blues rock band Big Brother & The Holding Company, Joplin left the band in late 1968 for a solo career. She released two solo albums, I Got Dem Ol' Kozmic Blues Again Mama! (1969) and Pearl (1971), the latter released after her death. During her solo career, she was backed by the Kozmic Blues Band and later, the Full Tilt Boogie Band.", "desc_mb_album": "", "desc_mb_artist": "Janis' first two albums '''Big Brother & the Holding Company''' and '''Cheap Thrills''' can be found under '''[http://musicbrainz.org/artist/3cf5a3be-25ef-4408-98fe-e66fee536be1.html|Big Brother & the Holding Company]'''.", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave"]}, {"n": 13, "title": "Townes Van Zandt", "artist": "Townes Van Zandt", "year": 1969, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53168-townes-van-zandt.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53168-townes-van-zandt-townes-van-zandt.php", "aoty_critic_score": 70, "aoty_user_score": 86, "mbid": "4801bedb-ca04-3aef-a520-798b799778d1", "yt_id": "3hrfjSaW8TQ", "rym": "https://rateyourmusic.com/release/album/townes-van-zandt/townes-van-zandt", "genres": ["folk", "country rock", "blues", "country"], "desc_lfm_album": "Townes Van Zandt is the third release by country singer/songwriter Townes Van Zandt, released in 1969. The cover photograph was taken by Sol Mednick. All tracks composed by Townes Van Zandt. .", "desc_lfm_artist": "John Townes Van Zandt (March 7, 1944 – January 1, 1997), better known as Townes Van Zandt, was a critically acclaimed American songwriter and singer. Much of Van Zandt’s musical canon--songs such as \"Pancho and Lefty\", \"For the Sake of the Song\", \"Tecumseh Valley\", \"Rex's Blues\", and \"To Live is to Fly\"--are widely considered masterpieces of American folk music. His musical style is often described as melancholy in sound and delivery with rich and poetic lyrics.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 14, "title": "Santana", "artist": "Santana", "year": 1969, "cover": "https://i.discogs.com/_m5kIshyIsuT9OuQn_soL7pgKjxpHJSLrSiRtIpLyDI/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTczNzIy/NC0xMzc0MDc1NTU3/LTI3MjUuanBlZw.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/15590-santana-santana.php", "aoty_critic_score": 83, "aoty_user_score": 83, "mbid": "2439a921-a574-4f89-9c61-edfa614048b9", "yt_id": "75AqlxxX-kY", "rym": "https://rateyourmusic.com/release/album/santana/santana", "genres": [], "desc_lfm_album": "Santana is the debut studio album by American Latin rock band Santana, released on August 22, 1969, by Columbia Records. Over half of the album's length is composed of instrumental music, recorded by what was originally a purely free-form jam band. At the suggestion of manager Bill Graham, the band took to writing more conventional songs for more impact, but managed to retain the essence of improvisation in the music. The album was destined to be a major release, given a boost by the band's performance at the Woodstock Festival earlier that August. The album's first single, \"Jingo\", was only .", "desc_lfm_artist": "Santana is an American rock band formed in San Francisco, California, in 1966 by Mexican-born guitarist Carlos Santana. The band has undergone numerous changes in its recording and performing line-ups, with Carlos Santana as the sole consistent member. After signing with Columbia Records, Santana gained widespread attention following their performance at the Woodstock Festival in 1969 and released the albums \"Santana\" (1969), \"Abraxas\" (1970), and \"Santana III\" (1971) with the group's classic line-up", "desc_mb_album": "", "desc_mb_artist": "Note that only releases by the '''band''' Santana are listed here. Solo releases are listed under the separate artist [http://www.musicbrainz.org/artist/f7fda030-0ba1-42e9-a385-3deebc939bc9.html|Carlos Santana].\r\n\r\nThe official discography of Santana can be found at http://www.santana.com/Sights-And-Sounds-Discography/ and a timeline at http://www.rockonthenet.com/artists-s/santana.htm", "heard_by": ["Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 15, "title": "Green River", "artist": "Creedence Clearwater Revival", "year": 1969, "cover": "https://dn710908.ca.archive.org/0/items/mbid-d10154a4-dbee-4c55-bb1c-9afc18831ec1/mbid-d10154a4-dbee-4c55-bb1c-9afc18831ec1-1239154081.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6058-creedence-clearwater-revival-green-river.php", "aoty_critic_score": 97, "aoty_user_score": 80, "mbid": "6c08878c-d6a1-37b6-84c3-9566748545c1", "yt_id": "w0VI1zByJ3s", "rym": "https://rateyourmusic.com/release/album/creedence-clearwater-revival/green-river", "genres": ["blues rock", "folk rock", "classic rock", "roots rock", "southern rock", "swamp rock"], "desc_lfm_album": "Released in 1969, this was the third album by the original Creedence Clearwater Revival line up, and what a choogling rockin stew it is! The big single was \"Bad Moon Rising\" but there's more to this offering than their most famous 7inch. The opening, title, track is classic Creedence. Deceptively simple riff hung on a solid rhythm section, was later ripped off by The Hollies for their \"Long Cool Woman in a Black Dress\". \"Wrote a Song for Everyone\" comes of like The Band with a strange lurching rhythm giving it a funeral feel. The rest of the album rocks .", "desc_lfm_artist": "Creedence Clearwater Revival (often referred to as Creedence or CCR) was an American rock band active in the late 1960s and early 1970s which consisted of lead vocalist, lead guitarist, and primary songwriter John Fogerty, his brother rhythm guitarist Tom Fogerty, bassist Stu Cook, and drummer Doug Clifford.\n\nThese members played together since 1959, first as The Blue Velvets, then as The Golliwogs. Their musical style encompassed the roots rock, swamp rock, and blues rock genres.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 16, "title": "In a Silent Way", "artist": "Miles Davis", "year": 1969, "cover": "https://dn721808.ca.archive.org/0/items/mbid-47873c43-4337-4d3b-9bf2-959f85a7cec1/mbid-47873c43-4337-4d3b-9bf2-959f85a7cec1-23109799066.png", "aoty_url": "https://www.albumoftheyear.org/album/7025-miles-davis-in-a-silent-way.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "7d0a9612-7636-34fe-84d9-445c8df9c0f3", "yt_id": "YHesqaMhh34", "rym": "https://rateyourmusic.com/release/album/miles-davis/in-a-silent-way", "genres": ["jazz", "avant-garde jazz", "jazz fusion", "modal jazz", "post-bop"], "desc_lfm_album": "In a Silent Way is a studio album by American jazz musician Miles Davis, released July 30, 1969 on Columbia Records. Produced by Teo Macero, the album was recorded in one session date on February 18, 1969 at CBS 30th Street Studio B in New York City. Incorporating elements of classical sonata form, Macero edited and arranged Davis's recordings from the session to produce the album. Marking the beginning of his \"electric\" period, In a Silent Way has been regarded by music writers as Davis's first fusion recording, following a stylistic shift toward the genre in his previous records and .", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "paqueradejere"]}, {"n": 17, "title": "Happy Sad", "artist": "Tim Buckley", "year": 1969, "cover": "https://dn711208.ca.archive.org/0/items/mbid-30438d95-b851-45da-ab0c-1de75ec7502e/mbid-30438d95-b851-45da-ab0c-1de75ec7502e-11263223430.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10779-tim-buckley-happy-sad.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "50701e2b-a074-380e-82aa-cfb21421dbb4", "yt_id": "I144JSYtRw4", "rym": "https://rateyourmusic.com/release/album/tim-buckley/happy-sad", "genres": ["jazz rock", "psychedelic folk", "jazz", "rock", "folk, world, & country"], "desc_lfm_album": "Happy Sad is the third album by singer-songwriter Tim Buckley, released in 1969. It was recorded at Elektra Sound Recorders in Los Angeles, California. It marked the beginning of Buckley's experimental period, as it incorporated elements of jazz that he had never used before. Many of the songs here represent a departure from the binary form that dominated much of his previous work. The sound of the album is characterized by David Friedman's vibraphone, an instrument which gives the album a more relaxed tone than Buckley's earlier work. The songs are much longer than on previous releases and this style .", "desc_lfm_artist": "Timothy Charles Buckley III (February 14, 1947 – June 29, 1975) was an experimental vocalist and performer who incorporated jazz, psychedelia, funk, soul, and avant-garde rock, in a short career spanning the late 1960s and early 1970s, ending with his death at age 28 from an alcohol-heroin overdose.\n\nBuckley often regarded his tenor voice as an instrument, a talent most noticeable on his albums Happy Sad, Lorca, and Starsailor. His first marriage was to Mary Guibert, with whom he had a child, musician Jeff Buckley.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 18, "title": "Five Leaves Left", "artist": "Nick Drake", "year": 1969, "cover": "https://dn710600.ca.archive.org/0/items/mbid-3c0db05c-3b02-3be0-bab6-c4b233de21da/mbid-3c0db05c-3b02-3be0-bab6-c4b233de21da-43451413021.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6068-nick-drake-five-leaves-left.php", "aoty_critic_score": 98, "aoty_user_score": 87, "mbid": "b9c4fc17-0dc5-3aa5-b1b9-08e1446e5bea", "yt_id": "G8SmkwS82u4", "rym": "https://rateyourmusic.com/release/album/nick-drake/five-leaves-left", "genres": ["folk rock", "folk", "chamber folk", "contemporary folk", "british folk rock"], "desc_lfm_album": "Five Leaves Left is the debut studio album by English folk musician Nick Drake. It was recorded between 1968 and 1969 and released in 1969 by record label Island. Among his various backing musicians, Drake was accompanied by Richard Thompson, at that time with Fairport Convention and Danny Thompson of The Pentangle. Robert Kirby, a friend of Drake's from his youth, arranged the string instruments for several tracks while Harry Robinson arranged the strings for \"River Man\". The title of the album is said to be a reference to the old Rizla cigarette papers packet, which used to contain a .", "desc_lfm_artist": "Nick Drake (Nicholas Rodney Drake, Yangon, Myanmar, June 19, 1948 - Tanworth-in-Arden, Warwickshire, England, November 25, 1974) was an English folk singer known for his gentle, enigmatic songs and his virtuosic right-hand finger picking technique.\n\nAlthough he recorded only three albums, critics and fellow musicians hold his work in very high esteem. Drake failed to find a wide audience during his lifetime and had a strong aversion to performing. Since his death, however, Drake's music has gained a significant cult following.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 19, "title": "Hot Buttered Soul", "artist": "Isaac Hayes", "year": 1969, "cover": "https://dn711002.ca.archive.org/0/items/mbid-6b7fb2e0-98c1-4aea-8b1b-5b121ab579c9/mbid-6b7fb2e0-98c1-4aea-8b1b-5b121ab579c9-15064271357.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6689-isaac-hayes-hot-buttered-soul.php", "aoty_critic_score": 93, "aoty_user_score": 88, "mbid": "e76d4f75-f09b-3f5b-aca9-44ac4489e58d", "yt_id": "dVCMyOaIKI0", "rym": "https://rateyourmusic.com/release/album/isaac-hayes/hot-buttered-soul", "genres": ["soul", "jazz", "jazz-funk", "funk", "disco", "progressive soul"], "desc_lfm_album": "Hot Buttered Soul is the second studio album by American soul musician Isaac Hayes. Released on September 23, 1969, it is recognized as a landmark in soul music. .", "desc_lfm_artist": "Isaac Lee Hayes (August 20, 1942 – August 10, 2008) was a trailblazing soul singer, songwriter, composer, musician, producer, and actor whose groundbreaking contributions left an indelible mark on music and culture. Born in Covington, Tennessee, Hayes was raised by his grandparents in Memphis after the loss of his parents. From an early age, he showcased musical talent, singing in church choirs and mastering instruments such as the piano and saxophone.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84"]}, {"n": 20, "title": "Crosby, Stills & Nash", "artist": "Crosby, Stills & Nash", "year": 1969, "cover": "https://ia800102.us.archive.org/31/items/mbid-8e770a65-a599-4501-8c36-84314600aa6b/mbid-8e770a65-a599-4501-8c36-84314600aa6b-11553414596.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7027-crosby-stills-nash-crosby-stills-nash.php", "aoty_critic_score": 97, "aoty_user_score": 80, "mbid": "a2735d5f-27c0-3176-85df-e77f669dcca1", "yt_id": "Hm0sishe02U", "rym": "https://rateyourmusic.com/release/album/crosby__stills_and_nash/crosby__stills_and_nash", "genres": ["folk rock", "pop rock", "contemporary folk", "psychedelic folk", "soft rock"], "desc_lfm_album": "Crosby, Stills & Nash is the debut album by Crosby, Stills & Nash, released in 1969. A landmark in folk rock and soft rock, the album introduced the trio’s signature harmonies and sophisticated songwriting, setting the stage for the rise of the Laurel Canyon sound. Featuring classics like Suite: Judy Blue Eyes, Marrakesh Express, and Helplessly Hoping, the record blends introspective lyrics with intricate acoustic arrangements. The chemistry between David Crosby, Stephen Stills, and Graham Nash proved to be groundbreaking, influencing countless artists in the singer-songwriter tradition. The album was both a critical and commercial success, solidifying CSN as one .", "desc_lfm_artist": "Crosby, Stills & Nash was a pioneering folk/rock supergroup formed by David Crosby, Stephen Stills and Graham Nash - refugees from three 1960s bands: The Byrds, Buffalo Springfield, and The Hollies. The band is primarily known for their three-part vocal harmonies. They are strongly associated with the 1969 Woodstock Festival. They are commonly referred to by their initials CSN.\n\nThe trio's first eponymous album was released in May 1969 and was an immediate hit", "desc_mb_album": "", "desc_mb_artist": "See also [http://musicbrainz.org/artist/46a782ea-4308-476b-abd1-a91b197f3037|Crosby, Stills, Nash & Young].", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 21, "title": "Everybody Knows This Is Nowhere", "artist": "Neil Young with Crazy Horse", "year": 1969, "cover": "https://ia800201.us.archive.org/8/items/mbid-41cbba2c-4e25-468d-8d8f-8a584d7fd701/mbid-41cbba2c-4e25-468d-8d8f-8a584d7fd701-6187784066.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "f61603ab-ef6b-386b-a5e0-aaefc00543f1", "yt_id": "jREf47BPe5w", "rym": "https://rateyourmusic.com/release/album/neil-young-with-crazy-horse/everybody-knows-this-is-nowhere", "genres": ["folk rock", "country rock", "classic rock", "hard rock", "country"], "desc_lfm_album": "Everybody Knows This Is Nowhere is the second studio album by the Canadian singer Neil Young, released in May 1969 on Reprise Records. His first with his longtime backing band Crazy Horse, it peaked at number 34 on the US Billboard 200 during a ninety-eight week chart stay in August 1970 and has been certified platinum by the RIAA. .", "desc_lfm_artist": "", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 22, "title": "Stand!", "artist": "Sly and the Family Stone", "year": 1969, "cover": "https://dn711200.ca.archive.org/0/items/mbid-3e517042-0af2-45b0-bdbb-aae20ae1bec8/mbid-3e517042-0af2-45b0-bdbb-aae20ae1bec8-15170398619.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "86871123-60e4-30a5-aae3-36e810e0964b", "yt_id": "GpUfuG8f4c4", "rym": "https://rateyourmusic.com/release/album/sly-and-the-family-stone/stand", "genres": ["psychedelic rock", "psychedelic", "soul", "psychedelic soul", "funk"], "desc_lfm_album": "", "desc_lfm_artist": "Sly & the Family Stone were an important and influential American band from Oakland, California. Active from 1966 until 1975, the band was pivotal in the development of soul, funk and psychedelia. Headed by singer, songwriter, record producer, and multi-instrumentalist Sly Stone, and containing several of his family members and friends, the band was the first major American rock band to have an integrated lineup in both race and gender.\n\nBrothers", "desc_mb_album": "", "desc_mb_artist": "The 1975 album \"High on You\" was credited to \"Sly Stone\" and can be found in MB at http://musicbrainz.org/album/619cba8a-5d27-4546-9fa1-beb5ea7bcb15.html", "heard_by": []}, {"n": 23, "title": "Clouds", "artist": "Joni Mitchell", "year": 1969, "cover": "https://dn711300.ca.archive.org/0/items/mbid-d5685777-7ef1-4a44-a05e-c316cb8fb002/mbid-d5685777-7ef1-4a44-a05e-c316cb8fb002-7428087736.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6085-joni-mitchell-clouds.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "e0f5f627-ce00-3ed1-a3d4-8e19440b7acf", "yt_id": "J48BpiPLHtA", "rym": "https://rateyourmusic.com/release/album/joni-mitchell/clouds", "genres": ["folk rock", "folk", "contemporary folk", "folk pop"], "desc_lfm_album": "Clouds is a stark stunner, a great leap forward for Joni Mitchell. Vocals here are more forthright and assured than on her debut and exhibit a remarkable level of subtle expressiveness. Guitar alone is used in accompaniment, and the variety of playing approaches and sounds gotten here is most impressive. \"The Fiddle and the Drum,\" a protest song that imaginatively compares the Vietnam-era warmongering U.S. government to a bitter friend, dispenses with instrumental accompaniment altogether. The sketches presented of lovers by turns depressive (\"Tin Angel\"), roguish (\"That Song About the Midway\"), and faithless (\"The Gallery\") are vividly memorable. Forthright lyrics .", "desc_lfm_artist": "Roberta Joan Mitchell (née Anderson; born November 7, 1943) is a Canadian and American singer-songwriter, multi-instrumentalist, and painter. She gained recognition in the 1960s folk music scene for her personal lyrics and distinctive compositions, which later incorporated elements from various genres including pop, jazz, and rock. Over her career, she has received multiple awards, including eleven Grammy Awards, and was inducted into the Rock and Roll Hall of Fame in 1997.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 24, "title": "Karma", "artist": "Pharoah Sanders", "year": 1969, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14416-karma_021626.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14416-pharoah-sanders-karma.php", "aoty_critic_score": 93, "aoty_user_score": 89, "mbid": "22f978cb-26e6-3757-a13a-347970574eec", "yt_id": "2t88stnbP0g", "rym": "https://rateyourmusic.com/release/album/pharoah-sanders/karma/", "genres": ["avant-garde jazz", "free jazz", "spiritual jazz"], "desc_lfm_album": "John Coltrane left behind a legacy of experimental and extremely spiritual work whose timeless quality still reverberates today. After his untimely death many poseurs came out to stake their claim as the next Coltrane. Many tried and many failed. Then in 1969 a former sideman of Coltrane's, Pharoah Sanders, stepped out from the shadow of his mentor and recorded Karma, which bore the soul of Coltrane's musical and spiritual passion. Karma was released four years after his first record as a leader, Pharoah's First (1965). While working with Coltrane, Sanders began to develop an aggressive tone that ripped into an .", "desc_lfm_artist": "Pharoah Sanders (1940-2022) was a U.S. jazz saxophonist.\n\nSanders was born on 13th October 1940 in Little Rock, Arkansas, under the name Farrell Sanders. He began his professional career playing tenor saxophone in Oakland, California.\n\nSanders moved to New York City in 1962. He received his nickname \"Pharoah\" from Sun Ra, with whom Sanders performed. He came to prominence playing with John Coltrane's band starting in 1965, as Coltrane began experimenting with the music which would soon become known as avant-garde jazz.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 25, "title": "Uncle Meat", "artist": "The Mothers of Invention", "year": 1969, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12789-uncle-meat.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12789-the-mothers-of-invention-uncle-meat.php", "aoty_critic_score": 95, "aoty_user_score": 81, "mbid": "cf8759d6-02e4-3ca3-ad10-2a58b5bfb13f", "yt_id": "cK8D60ORnvE", "rym": "https://rateyourmusic.com/release/album/the-mothers-of-invention/uncle-meat", "genres": ["experimental rock", "avant-garde", "avant-prog", "alternative rock", "psychedelic", "jazz"], "desc_lfm_album": "", "desc_lfm_artist": "The Mothers of Invention was an American band active from 1966 to 1969. Throughout, their output was primarily directed by composer and guitarist, Frank Zappa (1940–1993). Their albums combined a broad span of genres and utilised diverse instrumentation. Their lyrics were generally humorous, with frequent style-parodies of contemporary Pop music (with doo-wop love ballads endlessly lampooned), bountiful surreal imagery, cartoonish vocals and oblique, satirical protest songs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 26, "title": "Songs From a Room", "artist": "Leonard Cohen", "year": 1969, "cover": "https://dn710808.ca.archive.org/0/items/mbid-2c9640f1-43fb-4fe5-a494-d394fa637622/mbid-2c9640f1-43fb-4fe5-a494-d394fa637622-16612177357.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "0c0d5696-5d29-3809-8b79-4bf1320f0353", "yt_id": "9AZ1mg-1U0M", "rym": "https://rateyourmusic.com/release/album/leonard-cohen/songs-from-a-room", "genres": ["folk rock", "folk", "contemporary folk", "baroque pop", "blues", "country"], "desc_lfm_album": "Songs from a Room is the second album by Canadian musician Leonard Cohen, released in 1969. It reached #63 on the US Billboard 200 and #2 on the UK charts. Cohen reportedly said he chose producer Bob Johnston to achieve the spartan sound he considered appropriate for his songs, after the disputes he had with John Simon during the mixing sessions of Songs of Leonard Cohen. The album also features some prominent (if strictly ornamental) jaw harp. The album's sound is thus closer to the archetype (or stereotype) of an \"early\" Leonard Cohen record. Among uncredited sessions musicians it is .", "desc_lfm_artist": "Leonard Norman Cohen (September 21, 1934 – November 7, 2016) was a Canadian songwriter  poet, singer, and novelist. His work explored religion, politics, isolation, sexuality, and romantic relationships. Cohen was inducted into the Canadian Music Hall of Fame, the Canadian Songwriters Hall of Fame, and the Rock and Roll Hall of Fame. He was invested as a Companion of the Order of Canada, the nation's highest civilian honour. In 2011, Cohen received one of the Prince of Asturias Awards for literature and the ninth Glenn Gould Prize.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave"]}, {"n": 27, "title": "Dusty in Memphis", "artist": "Dusty Springfield", "year": 1969, "cover": "https://dn711005.ca.archive.org/0/items/mbid-e80f0213-a747-4d14-b5ce-114519e2f00d/mbid-e80f0213-a747-4d14-b5ce-114519e2f00d-8215823884.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7015-dusty-springfield-dusty-in-memphis.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "aac8700b-8f62-30fc-ac2a-23b6cb37e3c3", "yt_id": "pdgWLxqZkC4", "rym": "https://rateyourmusic.com/release/album/dusty-springfield/dusty-in-memphis", "genres": ["blue-eyed soul", "pop rock", "soul", "pop soul", "southern soul", "rock"], "desc_lfm_album": "Dusty in Memphis is the fifth studio album by English singer Dusty Springfield, released on 31 March 1969 in the United States by Atlantic Records and by Philips Records internationally. Springfield worked on the album with a team of musicians and producers that included Jerry Wexler, Arif Mardin, Tom Dowd, conductor Gene Orloff, backing vocalists the Sweet Inspirations, bassist Tommy Cogbill, and guitarist Reggie Young. Initial sessions were recorded at American Sound Studio in Memphis, while Springfield's final vocals and the album's orchestral parts were recorded at Atlantic Records' New York City studios. Dusty in Memphis sold poorly upon its .", "desc_lfm_artist": "Mary Isobel Catherine Bernadette O'Brien OBE (16 April 1939 – 2 March 1999), better known by her stage name Dusty Springfield, was an English singer. With her distinctive mezzo-soprano voice, she was a popular singer of blue-eyed soul, pop and dramatic ballads, with French chanson, country, and jazz also in her repertoire. During her 1960s peak, she ranked among the most successful British female performers on both sides of the Atlantic. Her image–marked by a peroxide blonde bouffant/beehive hairstyle", "desc_mb_album": "", "desc_mb_artist": "Born: Mary Isabel Catherine Bernadette O'Brien in Hampstead, London, England\n\nPaul Howes is the foremost authority on Dusty Springfield's professional accomplishments and will hopefully one day lend his pen to this site. His book \"The Complete Dusty Springfield\" is the ultimate resource for Dusty's fans and those who wish to learn from her recorded legacy, and he dutifully runs the fanzine \"The Dusty Springfield Bulletin\" from the U.K. A few Dusty biographies exist, the most respected would likely be Lucy O'Brien's, while Vicki Wickham and Penny Valentine penned a more personal, though controversial, account. Dusty tribute sites are a valuable resource as well: do a web search under (you guessed it) \"Dusty Springfield tribute sites\". Hopefully one day soon these comments of mine will be re", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 28, "title": "Scott 3", "artist": "Scott Walker", "year": 1969, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9008-scott-3.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9008-scott-walker-scott-3.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "8aa07274-9614-3e32-9d59-79bb22a87162", "yt_id": "W5GO49AsWHo", "rym": "https://rateyourmusic.com/release/album/scott-walker/scott-3", "genres": [], "desc_lfm_album": "Scott 3 is the third solo album by singer songwriter Scott Walker. Upon release in 1969, it met with slower sales than his previous albums, as pop audiences struggled to keep pace with Walker's increasingly experimental approach. The dense lush string arrangements by Wally Stott seemed to evoke a Vegas-style lounge crooner atmosphere, but one tinted with surreal drones and touches of dissonance. Since its release, it has been regarded by many of Walker's fans as a favourite. The title of the compilation Fire Escape in the Sky: The Godlike Genius of Scott Walker is taken from the lyrics of .", "desc_lfm_artist": "Scott Walker (Noel Scott Engel, January 9, 1943 - March 22, 2019) was an American-born singer-songwriter, composer and record producer. He is noted for his distinctive baritone voice and for the unorthodox career path which took him from 1960s pop icon to 21st century avant-garde musician.\n\nOriginally coming to fame in the mid-1960s singing orchestral pop ballads as the frontman of The Walker Brothers, Walker went on to a solo career balancing a light", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 29, "title": "Gal Costa", "artist": "Gal Costa", "year": 1969, "cover": "https://cdn2.albumoftheyear.org/600x0/album/47758-gal-costa_151642.jpg", "aoty_url": "https://www.albumoftheyear.org/album/47758-gal-costa-gal-costa.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "2df16c69-a343-3c95-a9a9-c9a7c9db2bb7", "yt_id": "ORNtKbL43X4", "rym": "https://rateyourmusic.com/release/album/gal-costa/gal-costa", "genres": ["avant-garde", "psychedelic rock", "mpb", "latin"], "desc_lfm_album": "Gal Costa is the debut studio album by Brazilian singer Gal Costa, released in March 1969. First solo album by the Bahian singer and recorded in 1968, the album was \"held\" by Philips after Caetano and Gil's arrest by the repressive apparatus of the military dictatorship that ruled Brazil at the time, and was only released in the early 1969, being considered the record that closed Tropicália. The singer had already participated in two previous collective releases: Domingo, in the company of Caetano Veloso, and Tropicalia ou Panis et Circencis, a landmark of the Tropicalista movement. Different from the bossa-nova .", "desc_lfm_artist": "Maria da Graça Costa Penna Burgos (26 September 1945, Salvador, Brazil — 9 November 2022, São Paulo, Brazil), best known as Gal Costa, was a popular Brazilian MPB singer and musician, regarded by many as Brazil's greatest female singer of all time. Also known as \"Musa da Tropicália\" (Muse of Tropicália), she was one of the most diverse singers in Brazil, moving across all musical genres and being elected as the greatest voice in Brazilian music by Rolling Stone, as well as one of the 10 greatest singers in the world by Time.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave"]}, {"n": 30, "title": "The Velvet Underground", "artist": "The Velvet Underground", "year": 1969, "cover": "https://dn710904.ca.archive.org/0/items/mbid-fa20fff8-98c0-41a0-a60f-9c7cbafeb876/mbid-fa20fff8-98c0-41a0-a60f-9c7cbafeb876-23110856945.png", "aoty_url": "https://www.albumoftheyear.org/album/6360-the-velvet-underground-the-velvet-underground.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "a616dcf5-7a1f-3afe-a53b-27281c2bf75e", "yt_id": "O4rbTBKRedE", "rym": "https://rateyourmusic.com/release/album/the-velvet-underground/the-velvet-underground", "genres": ["experimental rock", "folk rock", "art rock", "proto-punk", "classic rock", "pop rock"], "desc_lfm_album": "Upon first release, the Velvet Underground's self-titled third album must have surprised their fans nearly as much as their first two albums shocked the few mainstream music fans who heard them. After testing the limits of how musically and thematically challenging rock could be on Velvet Underground & Nico and White Light/White Heat, this 1969 release sounded spare, quiet, and contemplative, as if the previous albums documented some manic, speed-fueled party and this was the subdued morning after. (The album's relative calm has often been attributed to the departure of the band's most committed avant-gardist, John Cale, in the fall .", "desc_lfm_artist": "The Velvet Underground was an American experimental rock band formed in New York City in 1964. It originally comprised singer and guitarist Lou Reed, Welsh multi-instrumentalist John Cale, guitarist Sterling Morrison, and drummer Angus MacLise. In 1965 MacLise was replaced by Moe Tucker, who played on most of the band's recordings. Though their integration of rock and the avant-garde resulted in little commercial success, they became one of the most influential bands in rock, underground, experimental, and alternative music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 31, "title": "Led Zeppelin", "artist": "Led Zeppelin", "year": 1969, "cover": "https://ia800404.us.archive.org/10/items/mbid-3df3b60f-d6e1-3af9-913f-0014e73650ee/mbid-3df3b60f-d6e1-3af9-913f-0014e73650ee-7207589209.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4521-led-zeppelin-led-zeppelin.php", "aoty_critic_score": 98, "aoty_user_score": 84, "mbid": "0f18ec88-aa87-38a9-8a65-f03d81763560", "yt_id": "LKbDC3lNVPQ", "rym": "https://rateyourmusic.com/release/album/led-zeppelin/led-zeppelin", "genres": ["blues rock", "classic rock", "hard rock", "blues", "arena rock", "british blues"], "desc_lfm_album": "Led Zeppelin is the debut album of English rock band Led Zeppelin. It was recorded in October 1968 at Olympic Studios in London and released on Atlantic Records on 12 January 1969. The album featured integral contributions from each of the group's four musicians and established Led Zeppelin's fusion of blues and rock. Led Zeppelin also created a large and devoted following for the band, with their unique heavy metal sound endearing them to a section of the counterculture on both sides of the Atlantic. Although the album initially received negative reviews, it was commercially very successful and has now .", "desc_lfm_artist": "Led Zeppelin were an English rock band formed in London in 1968. The group consisted of Robert Plant on vocals, Jimmy Page on guitar, John Paul Jones on bass and keyboards, and John Bonham on drums. Known for a heavy, guitar-based sound that drew from blues and folk traditions, they are widely regarded as a major influence on the development of hard rock and heavy metal. They became one of the best-selling music artists in history and helped shape album-oriented rock and stadium rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 32, "title": "Astral Weeks", "artist": "Van Morrison", "year": 1968, "cover": "https://dn710003.ca.archive.org/0/items/mbid-311506a5-a48f-4800-9765-e22a50bdc423/mbid-311506a5-a48f-4800-9765-e22a50bdc423-39901548592.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5715-van-morrison-astral-weeks.php", "aoty_critic_score": 100, "aoty_user_score": 82, "mbid": "7d568f14-d86e-3584-97d0-c1824599de04", "yt_id": "rUyqCXlfWaE", "rym": "https://rateyourmusic.com/release/album/van-morrison/astral-weeks", "genres": ["blues rock", "folk rock", "chamber folk", "blue-eyed soul", "progressive folk"], "desc_lfm_album": "Original Release Date: November 1968 Van Morrison - rhythm guitar, keyboard, saxophone, vocal; Jay Berliner - guitar; Barry Kornfeld - guitar on \"The Way Young Lovers Do\"; Richard Davis - bass; Connie Kay - drums; John Payne - flute, soprano saxophone; Warren Smith, Jr. - percussion, vibraphone; Producer: Lewis Merenstein .", "desc_lfm_artist": "Sir George Ivan \"Van\" Morrison, OBE (generally known as Van Morrison or Van The Man) (born 31 August 1945) is a Grammy Award-winning artist from Belfast, Northern Ireland. He's a singer, songwriter, author, poet, and multi-instrumentalist, who has been a professional musician since 1958. He plays a variety of instruments, including the guitar, harmonica, keyboards, drums, and saxophone. Featuring his characteristic growl - a unique mix of folk, blues", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 33, "title": "The Beatles", "artist": "The Beatles", "year": 1968, "cover": "https://dn711101.ca.archive.org/0/items/mbid-034e0c73-c2df-328b-861c-3db28217aeed/mbid-034e0c73-c2df-328b-861c-3db28217aeed-4924862361.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4100-the-beatles-the-beatles.php", "aoty_critic_score": 96, "aoty_user_score": 88, "mbid": "055be730-dcad-31bf-b550-45ba9c202aa3", "yt_id": "0ArlUSVDQIw", "rym": "https://rateyourmusic.com/release/album/the-beatles/the-beatles-20", "genres": ["blues rock", "folk rock", "art rock", "hard rock", "pop rock", "psychedelic"], "desc_lfm_album": "The Beatles is the ninth official British album and the fifteenth American album by The Beatles, a double album released in 1968. It is commonly known as The White Album as it has no graphics or text other than the band’s name (and, on the early LP and CD releases, a serial number) on its plain white sleeve. The album was the first the Beatles undertook following the death of their manager, Brian Epstein, and the first released by their own record label, Apple. Originally entitled A Doll’s House, the title was changed when the British progressive rock band Family .", "desc_lfm_artist": "The Beatles were an English rock band formed in Liverpool, Lancashire in 1960. With the line-up comprising John Lennon, Paul McCartney,  George Harrison, and Ringo Starr, they are regarded as the most popular and influential band of all time. The group were integral to the development of 1960s counterculture and popular music's recognition as an art form. Rooted in skiffle, beat and 1950s rock and roll, their sound incorporated elements of classical", "desc_mb_album": "", "desc_mb_artist": "* [series:255a357a-909a-4437-9b7a-bfbb8 amenting the passing of old-fashioned English traditions. The record is widely considered one .", "desc_lfm_artist": "The Kinks (1963–1996; 2018-present) are an English pop-rock group that came out of the British R&B scene of the early 1960s. Formed in Muswell Hill, Middlesex, by brothers Ray Davies and Dave Davies in 1964 and categorised in the United States as a \"British Invasion\" band, the Kinks are recognised as one of the most important and influential rock groups of the era. In 1990, their first year of eligibility, the original four members were inducted into the Rock & Roll Hall of Fame.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave"]}, {"n": 35, "title": "Electric Ladyland", "artist": "The Jimi Hendrix Experience", "year": 1968, "cover": "https://dn710002.ca.archive.org/0/items/mbid-d7eb4cf2-ad75-4b3f-b311-a0f6144b7ece/mbid-d7eb4cf2-ad75-4b3f-b311-a0f6144b7ece-38560883654.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5706-the-jimi-hendrix-experience-electric-ladyland.php", "aoty_critic_score": 100, "aoty_user_score": 91, "mbid": "47ba2d59-5544-34a4-b108-dc08c0956298", "yt_id": "nDeog4iLbi0", "rym": "https://rateyourmusic.com/release/album/the-jimi-hendrix-experience/electric-ladyland", "genres": ["blues rock", "psychedelic rock", "acid rock", "classic rock", "hard rock", "blues"], "desc_lfm_album": "Electric Ladyland is the third and final album of new material by the Jimi Hendrix Experience, released in October 1968 on Reprise Records. It is the only Hendrix studio album professionally produced under his supervision. It topped the Billboard 200 album chart for two weeks in November 1968. Released as a double album, Electric Ladyland is a cross-section of Hendrix's wide range of musical talent. It includes examples of several genres and styles of music: the psychedelic \"Burning of the Midnight Lamp\", previously a U.K. single in the summer of 1967; the extended blues jam \"Voodoo Chile\"; the New Orleans-style .", "desc_lfm_artist": "", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 36, "title": "Marble Index", "artist": "Nico", "year": 1968, "cover": "https://dn711302.ca.archive.org/0/items/mbid-33a1e553-8f02-4845-8aab-083498a26500/mbid-33a1e553-8f02-4845-8aab-083498a26500-10054173348.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3050773a-bf29-4fa7-84c8-6f975c3c24b4", "yt_id": "iEFp7kR5K-A", "rym": "https://rateyourmusic.com/release/album/nico/the-marble-index", "genres": ["folk rock", "folk"], "desc_lfm_album": "", "desc_lfm_artist": "Nico (16 October 1938 – 18 July 1988) was a German model, actress, singer, and songwriter. She was born Christa Päffgen in Cologne, Germany.\nNico started a successful career as a model in Berlin and Paris, studied acting at Lee Strasberg's New York Actor Studio. She then became part of the Swinging London scene, and had a short relationship with The Rolling Stones' Brian Jones and she recorded her first record in London in 1965, the single I'm Not Saying/The Last Mile", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 37, "title": "Tropicália ou Panis et Circencis", "artist": "Various Artists", "year": 1968, "cover": "https://cdn2.albumoftheyear.org/600x0/album/61506-tropicalia-ou-panis-et-circencis_033528.jpg", "aoty_url": "https://www.albumoftheyear.org/album/61506-various-artists-tropicalia-ou-panis-et-circencis.php", "aoty_critic_score": 100, "aoty_user_score": 86, "mbid": "f8630f31-cff7-3a7d-a67a-053bf5b869dd", "yt_id": "lVRAwikyyXo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Warning! Deleting this artist may remove other artists and scrobbles from your library - please handle this with caution!\n\nNote: You can view albums tagged as 'Various Artists' in your library here. \n\nThe term Variou ": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 39, "title": "Aretha Now", "artist": "Aretha Franklin", "year": 1968, "cover": "https://cdn2.albumoftheyear.org/600x0/album/57529-aretha-now.jpg", "aoty_url": "https://www.albumoftheyear.org/album/57529-aretha-franklin-aretha-now.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "b26d1ec6-2500-3ecf-9528-7bc5a360efbe", "yt_id": "XRVMhZX5Z10", "rym": "https://rateyourmusic.com/release/album/aretha-franklin/aretha-now", "genres": ["soul", "jazz blues", "southern soul"], "desc_lfm_album": "Aretha Now is the thirteenth studio album by American singer Aretha Franklin, released on June 14, 1968, by Atlantic Records. The album is gold-certified and reached No. 3 on Billboard's albums pop chart. The album was rated the 133rd best album of the 1960s by Pitchfork. In 1990s, this recording was reissued on CD through Rhino Records. .", "desc_lfm_artist": "Aretha Franklin (March 25, 1942 - August 16, 2018) was a Memphis, Tennessee born and Detroit, Michigan reared American iconic gospel, soul, and R&B singer, songwriter and pianist. Many have called her \"The Queen Of Soul\" and \"Lady Soul\".\n\nShe is renowned for her soul and R&B recordings (on many, of which, she accompanied herself on keyboards and piano, a skill she learned at an early age, learning to play by ear, according to lifetime friend Smokey Robinson) but was also adept at jazz, rock, blues, pop, and gospel.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 40, "title": "Os Mutantes", "artist": "Os Mutantes", "year": 1968, "cover": "https://dn711301.ca.archive.org/0/items/mbid-e72cd86d-8168-42fb-8749-b11c543091e6/mbid-e72cd86d-8168-42fb-8749-b11c543091e6-11262982992.jpg", "aoty_url": "https://www.albumoftheyear.org/album/32860-os-mutantes-os-mutantes.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "f3578417-4c90-3891-a2c c artists of all time, having sold more than 90 million records worldwide. Although primarily remembered as a country music icon, his genre-spanning songs and sound embraced rock and roll, rockabilly, blues, folk, and gospel.\n\nCash was known for his deep, calm bass-baritone voice, the", "desc_mb_album": "", "desc_mb_artist": "If somebody is missing ''American II'', this is essentially the album [https://musicbrainz.org/release-group/9a8b2078-54db-34f2-bf5d-8dc42df3d896|Unchained], which is released between ''American Recordings'' and ''American III: Solitary Man''.\n\n'''Note:''' After signing with Mercury in 1986, Cash re-recorded many songs he had previously released on Columbia.  Please exercise caution in merging.", "heard_by": []}, {"n": 42, "title": "Odessey and Oracle", "artist": "The Zombies", "year": 1968, "cover": "https://dn711307.ca.archive.org/0/items/mbid-890a5412-c8b9-4926-a334-7d1765fd61a4/mbid-890a5412-c8b9-4926-a334-7d1765fd61a4-5761393796.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6014-the-zombies-odessey-and-oracle.php", "aoty_critic_score": 93, "aoty_user_score": 84, "mbid": "9a4a9ebf-f4f7-3dba-9b80-0b274cbc80f9", "yt_id": "goDxhJl1UJE", "rym": "https://rateyourmusic.com/release/album/the-zombies/odessey-and-oracle-32", "genres": ["baroque pop", "psychedelic pop"], "desc_lfm_album": "Odessey and Oracle is a psychedelic rock / baroque pop album released in 1968. The famous misspelling of \"odyssey\" in the title was the result of a mistake by the designer of the LP cover. The band tried to cover this up at the time of release by claiming the misspelling was intentional. .", "desc_lfm_artist": "The Zombies is an English rock band formed in 1962 in St Albans and led by keyboardist and vocalist Rod Argent and vocalist Colin Blunstone.\n\nThe group scored British and American hits in 1964 with \"She's Not There\". In the US, two further singles—\"Tell Her No\" in 1965 and \"Time of the Season\" in 1968—were also successful. Their 1968
