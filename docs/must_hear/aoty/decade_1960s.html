r into the public consciousness.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 44, "title": "The United States of America", "artist": "The United States of America", "year": 1968, "cover": "https://dn721807.ca.archive.org/0/items/mbid-eb81fc07-40b6-3f05-8acc-c33832c6d39b/mbid-eb81fc07-40b6-3f05-8acc-c33832c6d39b-34790836023.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53170-the-united-states-of-america-the-united-states-of-america.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "374ef16c-489b-3a3a-91f6-820827807469", "yt_id": "rjeZq3LAUJQ", "rym": "https://rateyourmusic.com/release/album/the-united-states-of-america/the-united-states-of-america", "genres": ["experimental rock", "avant-garde", "psychedelic rock", "art rock", "psychedelic", "electronic rock"], "desc_lfm_album": "The United States of America is the debut and only album by American psychedelic rock band the United States of America. It was produced by David Rubinson and released on March 6th, 1968 by Columbia Records. Being the only release by the United States of America when they were still together, the record received positive reviews on its release, charting at 181 on the Billboard 200. It has been re-issued several times and continues to receive critical acclaim, even decades after its original launch. Composer Joseph Byrd has stated that his aesthetic aims for the band and album were to .", "desc_lfm_artist": "The United States of America was an American psychedelic and experimental rock band which existed from 1967–1968 in Los Angeles. Their recordings are an example of early use of electronic music in rock and roll.\n\nA registered Communist starts a band called The United States of America and lands a major label record deal before playing a single live gig? Only in the Sixties. After studying with avant-garde legend John Cage in New York City, composer Joseph Byrd moved to Los Angeles in 1967 and decided to form a psychedelic rock band.", "desc_mb_album": "", "desc_mb_artist": "The band that gave 3-string, 2-string and no-string guitars a face (or three).", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "armandwave", "verygooood"]}, {"n": 45, "title": "White Light/White Heat", "artist": "The Velvet Underground", "year": 1968, "cover": "https://dn710804.ca.archive.org/0/items/mbid-3603f98f-0dce-3cbd-8bde-2f294225aa2e/mbid-3603f98f-0dce-3cbd-8bde-2f294225aa2e-8015457006.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6359-the-velvet-underground-white-lightwhite-heat.php", "aoty_critic_score": 100, "aoty_user_score": 83, "mbid": "fc0885e0-0284-3f9d-81ee-17c5e7196346", "yt_id": "AJy0LP8iYPg", "rym": "https://rateyourmusic.com/release/album/the-velvet-underground/white-light-white-heat", "genres": ["experimental rock", "avant-garde", "acid rock", "art rock", "noise rock", "proto-punk"], "desc_lfm_album": "The world of pop music was hardly ready for The Velvet Underground's first album when it appeared in the spring of 1967, but while The Velvet Underground and Nico sounded like an open challenge to conventional notions of what rock music could sound like (or what it could discuss), 1968's White Light/White Heat was a no-holds-barred frontal assault on cultural and aesthetic propriety. Recorded without the input of either Nico or Andy Warhol, White Light/White Heat was the purest and rawest document of the key Velvets lineup of Lou Reed, John Cale, Sterling Morrison, and Maureen Tucker, capturing the group .", "desc_lfm_artist": "The Velvet Underground was an American experimental rock band formed in New York City in 1964. It originally comprised singer and guitarist Lou Reed, Welsh multi-instrumentalist John Cale, guitarist Sterling Morrison, and drummer Angus MacLise. In 1965 MacLise was replaced by Moe Tucker, who played on most of the band's recordings. Though their integration of rock and the avant-garde resulted in little commercial success, they became one of the most influential bands in rock, underground, experimental, and alternative music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 46, "title": "Lady Soul", "artist": "Aretha Franklin", "year": 1968, "cover": "https://dn721904.ca.archive.org/0/items/mbid-5c9b9213-c85c-43fd-8522-de03df8e0b1d/mbid-5c9b9213-c85c-43fd-8522-de03df8e0b1d-15463598991.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6685-aretha-franklin-lady-soul.php", "aoty_critic_score": 100, "aoty_user_score": 84, "mbid": "05571372-5b11-39b7-89c5-1c02589a27c8", "yt_id": "K7s4h88BeOo", "rym": "https://rateyourmusic.com/release/album/aretha-franklin/lady-soul", "genres": ["classic rock", "blues", "soul", "deep soul", "southern soul"], "desc_lfm_album": "Despite the presence of the sweetened (and great) single \"A Natural Woman,\" Aretha Franklin's third Atlantic album is even more elegantly gritty than its two predecessors. She finds liberation in James Brown's \"Money Won't Change You\" and a revved-up take on Ray Charles's \"Come Back Baby\" much as she had in \"Respect\" and \"Think\" earlier, while Eric Clapton's guitar on \"Good to Me As I Am to You\" stings as much as her rueful, resigned delivery. --Rickey Wright .", "desc_lfm_artist": "Aretha Franklin (March 25, 1942 - August 16, 2018) was a Memphis, Tennessee born and Detroit, Michigan reared American iconic gospel, soul, and R&B singer, songwriter and pianist. Many have called her \"The Queen Of Soul\" and \"Lady Soul\".\n\nShe is renowned for her soul and R&B recordings (on many, of which, she accompanied herself on keyboards and piano, a skill she learned at an early age, learning to play by ear, according to lifetime friend Smokey Robinson) but was also adept at jazz, rock, blues, pop, and gospel.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 47, "title": "Songs of Leonard Cohen", "artist": "Leonard Cohen", "year": 1967, "cover": "https://dn711209.ca.archive.org/0/items/mbid-2fc159df-d05b-44f6-9659-51136c3ba66b/mbid-2fc159df-d05b-44f6-9659-51136c3ba66b-2144230905.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6079-leonard-cohen-songs-of-leonard-cohen.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "34291a49-8df9-304e-bd39-16b11d829d5f", "yt_id": "gBz3DsF1N7s", "rym": "https://rateyourmusic.com/release/album/leonard-cohen/songs-of-leonard-cohen", "genres": ["folk rock", "folk", "chamber folk", "contemporary folk", "baroque pop", "blues"], "desc_lfm_album": "Songs of Leonard Cohen is the debut album of Canadian musician Leonard Cohen. It foreshadowed the future path of his career, with less success in the United States and far better in Europe, reaching #83 on the Billboard chart but achieving gold status only in 1989, while it reached #13 in UK and spent nearly a year and a half in the UK album charts. Cohen's lonely and emotional songs were informed by his literate approach, part and parcel to a burgeoning singer/songwriter movement in popular music. Seen by later critics as a reaction against the psychedelic band-oriented styles (as .", "desc_lfm_artist": "Leonard Norman Cohen (September 21, 1934 – November 7, 2016) was a Canadian songwriter  poet, singer, and novelist. His work explored religion, politics, isolation, sexuality, and romantic relationships. Cohen was inducted into the Canadian Music Hall of Fame, the Canadian Songwriters Hall of Fame, and the Rock and Roll Hall of Fame. He was invested as a Companion of the Order of Canada, the nation's highest civilian honour. In 2011, Cohen received one of the Prince of Asturias Awards for literature and the ninth Glenn Gould Prize.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 48, "title": ": 60, "title": "The Doors", "artist": "The Doors", "year": 1967, "cover": "https://dn710303.ca.archive.org/0/items/mbid-476a7266-c53c-4ad7-8f69-a6cd3bcf97f0/mbid-476a7266-c53c-4ad7-8f69-a6cd3bcf97f0-10078311235.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4876-the-doors-the-doors.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "8ebffd15-06c3-3b88-a761-ec18c5513287", "yt_id": "H7Rol3vkqms", "rym": "https://rateyourmusic.com/release/album/the-doors/the-doors-21", "genres": ["blues rock", "psychedelic rock", "alternative rock", "acid rock", "classic rock", "psychedelic"], "desc_lfm_album": "\"The Doors\" is the debut studio album by the American rock band the Doors, released on January 4, 1967, by Elektra Records. It was recorded during August and September 1966 at Sunset Sound Recorders in Hollywood, California, with Paul A. Rothchild as producer. The album includes the full-length version of the band's breakthrough single \"Light My Fire\" and the extended closing track \"The End\", which features a spoken word section that references the Oedipus myth. The band developed much of the album's material throughout 1966, performing it at various venues, most notably the Whisky a Go Go. Recording began shortly .", "desc_lfm_artist": "The Doors was an American rock band formed in Los Angeles in 1965, consisting of vocalist Jim Morrison, keyboardist Ray Manzarek, guitarist Robby Krieger, and drummer John Densmore. The band became known for its distinctive sound, Morrison’s lyrical style and vocal delivery, and the group’s association with the 1960s counterculture. They also attracted attention for Morrison’s stage behavior and various legal controversies.\n\nThe band took its name from the title of Aldous Huxley's book \"The Doors of Perception\"", "desc_mb_album": "", "desc_mb_artist": "Deprecated ISNI: [http://www.isni.org/0000000115160232|0000 0001 1516 0232]", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_st More Can I Say\" (Horace Ott/Made Brown, Jr.) – 2:48 4. \"Lilac Wine\" (James Shelton) – 4:13 5. \"That's All I Ask\" (Horace Ott) – 2:28 6. \"Break Down And Let It All Out\" (Van McCoy) – 2:37 7. \"Why Keep On Breaking My Heart\" (Bennie Benjamin/Sol Marcus) – 2:34 8. \"Wild Is the Wind\" (Dimitri Tiomkin/Ned Washington) – 6:56 9. \"Black Is the Color of My True Love's Hair\" (traditional) – 3:24 10. \"If I Should Lose .", "desc_lfm_artist": "Eunice Kathleen Waymon (21 February 1933 – 21 April 2003), better known by her stage name Nina Simone, was an American singer, pianist, arranger, and civil rights activist widely associated with jazz music. Simone aspired to become a classical pianist while working in a broad range of styles including classical, jazz, blues, soul, folk, rhythm and blues, gospel, and pop.\n\nSimone was born Eunice Kathleen Waymon on 21st February 1933 in Tryon, North Carolina, USA, one of eight children.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 63, "title": "Revolver", "artist": "The Beatles", "year": 1966, "cover": "https://dn721800.ca.archive.org/0/items/mbid-b2807172-c20a-4aed-a4f2-02c57ce03b6d/mbid-b2807172-c20a-4aed-a4f2-02c57ce03b6d-39706846519.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4092-the-beatles-revolver.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "72d15666-99a7-321e-b1f3-a3f8c09dff9f", "yt_id": "HmZ2tHu-jVg", "rym": "https://rateyourmusic.com/release/album/the-beatles/revolver", "genres": ["psychedelic rock", "pop rock", "psychedelic pop", "psychedelic", "beat music"], "desc_lfm_album": "Revolver is the seventh studio album by English rock band the Beatles, released on 5 August 1966 on the Parlophone label and produced by George Martin. Many of the tracks on Revolver feature an electric guitar-rock sound that contrasts with their previous LP, the folk rock inspired Rubber Soul (1965). In Britain, the fourteen tracks from Revolver were released to radio stations throughout July 1966, \"building anticipation for what would clearly be a radical new phase in the group's recording career\". It reached number one on both the British chart and American chart and stayed at the top spot for .", "desc_lfm_artist": "The Beatles were an English rock band formed in Liverpool, Lancashire in 1960. With the line-up comprising John Lennon, Paul McCartney,  George Harrison, and Ringo Starr, they are regarded as the most popular and influential band of all time. The group were integral to the development of 1960s counterculture and popular music's recognition as an art form. Rooted in skiffle, beat and 1950s rock and roll, their sound incorporated elements of classical", "desc_mb_album": "", "desc_mb_artist": "* [series:255a357a-909a-4437-9b7a-bfbb814bde77|Core catalogue (worldwide discography standardization)]\n    * [series:bb6b768c-7bf7-456b-a771-629280fed164|UK discography]\n    * [series:384fa008-cccd-4198-8502-379a8e4814e7|US discography]\n    * [series:19c78789-e350-43a7-b992-f8e4ef6a14b3|Canadian discography]\n\nThe official name of “The White Album” is [release-group:055be730-dcad-31bf-b550-45ba9c202aa3|''The Beatles'']; please do not add incorrectly titled releases to the database!\n\nPlease do not re-add individual mono remaster releases to their individual release groups. The mono remasters were never released separately, and are all already in the database as 13 mediums of the release [release-group:a5550169-ec99-45b1-827b-2d79c0c0fbb8|''The Beatles in Mono''].", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 64, "title": "Meditations", "artist": "John Coltrane", "year": 1966, "cover": "https://cdn2.albumoftheyear.org/600x0/album/56500-meditations_174535.jpg", "aoty_url": "https://www.albumoftheyear.org/album/56500-john-coltrane-meditations.php", "aoty_critic_score": 85, "aoty_user_score": 83, "mbid": "550090da-a050-3e18-9ace-af7d07089d7b", "yt_id": "TuzfMR-7v1I", "rym": "https://rateyourmusic.com/release/album/john-coltrane/meditations", "genres": [], "desc_lfm_album": "Meditations is a 1966 album by John Coltrane. The album was considered the \"spiritual follow-up to A Love Supreme.\" It features Coltrane and Pharoah Sanders as soloists, both playing tenor saxophones. This was the last Coltrane recording to feature his classic quartet lineup of himself, bassist Jimmy Garrison, drummer Elvin Jones and pianist McCoy Tyner (augmented here as a sextet with Sanders and second drummer Rashied Ali), as both Jones and Tyner would quit the band by early 1966. Sanders, Ali, Garrison and Coltrane's wife Alice would comprise his next group. Alternative versions of tracks 2–5 had been recorded in .", "desc_lfm_artist": "John William Coltrane (Hamlet, North Carolina, September 23, 1926  – Huntington, New York, July 17, 1967) was an American jazz  saxophonist and composer.\n\nAmerican jazz great John Coltrane emerged in the 1950s, playing tenor and soprano sax with Dizzy Gillespie, Miles Davis and Thelonious Monk. A leader of \"hard bop\", in the 1960s he led his own groups and changed the face of jazz with experimentation and improvisation, his later recordings reflecting his belief that music was a form of spiritual expression.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 65, "title": "Blonde on Blonde", "artist": "Bob Dylan", "year": 1966, "cover": "https://ia800101.us.archive.org/20/items/mbid-1b051a10-7268-3773-a9ba-660765056ae3/mbid-1b051a10-7268-3773-a9ba-660765056ae3-7332847005.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5605-bob-dylan-blonde-on-blonde.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "329fb554-2a81-3d8a-8e22-ec2c66810019", "yt_id": "fm-po_FUmvM", "rym": "https://rateyourmusic.com/release/album/bob-dylan/blonde-on-blonde", "genres": ["blues rock", "folk rock", "folk", "country rock", "rock and roll", "rock"], "desc_lfm_album": "Blonde on Blonde is singer-songwriter Bob Dylan's seventh studio album, released in 1966 by Columbia Records. It is believed to be the first significant double album in rock music, its length forcing it to two LPs, although some digital reissues fit the album on one compact disc. It is notable for injecting Dylan's brand of blues rock, fully established on Highway 61 Revisited, with a more eclectic sound and even more surreal lyrics. Despite its uncompromising nature, it has come to be regarded as one of Dylan's greatest achievements, and \"one of the greatest rock & roll albums ever made\". .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 66, "title": "Pet Sounds", "artist": "The Beach Boys", "year": 1966, "cover": "https://dn721909.ca.archive.org/0/items/mbid-05b2f6c8-f9fd-4499-bd70-6f7d629a9cd4/mbid-05b2f6c8-f9fd-4499-bd70-6f7d629a9cd4-7129384393.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4963-the-beach-boys-pet-sounds.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "fdd96703-7b21-365e-bdea-38029fbeb84e", "yt_id": "3y44BJgkdZs", "rym": "https://rateyourmusic.com/release/album/the-beach-boys/pet-sounds", "genres": ["art rock", "classic rock", "pop rock", "baroque pop", "psychedelic pop", "psychedelic"], "desc_lfm_album": "Pet Sounds is the eleventh studio album by American rock band the Beach Boys, released on May 16, 1966. It initially met with a lukewarm critical and commercial response in the United States, peaking at number 10 in the Billboard 200, a significantly lower placement than the band's preceding albums. In the United Kingdom, the album was hailed by its music press and was an immediate commercial success, peaking at number 2 in the UK Top 40 Albums Chart and remaining among the top ten positions for six months. Pet Sounds has subsequently gathered worldwide acclaim from critics and musicians .", "desc_lfm_artist": "The Beach Boys are an American rock band formed in Hawthorne, California, in 1961. The original lineup included brothers Brian, Dennis, and Carl Wilson, their cousin Mike Love, and their friend Al Jardine. Known for their vocal harmonies and lyrics often centered on youth culture, the band drew influence from older pop vocal groups, 1950s rock and roll, and rhythm and blues. Under Brian Wilson's leadership, their music sometimes incorporated elements of classical and jazz, as well as experimental recording techniques.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "verygooood"]}, {"n": 67, "title": "Speak No Evil", "artist": "Wayne Shorter", "year": 1966, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33319-speak-no-evil-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33319-wayne-shorter-speak-no-evil.php", "aoty_critic_score": 100, "aoty_user_score": 83, "mbid": "eae0c18f-f2fd-3b97-8631-3f682a2f3957", "yt_id": "wbgsd-Y1mHA", "rym": "https://rateyourmusic.com/release/album/wayne-shorter/speak-no-evil", "genres": [], "desc_lfm_album": "Speak No Evil is the sixth album by Wayne Shorter, recorded on December 24th,1964 at the Van Gelder Studio, Englewood Cliffs, and released from Blue Note in 1966. The music combines elements of hard bop and modal jazz. The cover shows Wayne Shorter's first wife, Teruka (Irene) Nakagami, whom he met in 1961. Murray Horwitz stated in 2001 that \"Speak No Evil is sort of a consolidation of Wayne Shorter's compositional excellence. It's so thorough and consistent and wide-ranging. It's almost a manifesto for his ideas. Those ideas were now 40 years ago, but they're still fresh today.\" Personnel Freddie .", "desc_lfm_artist": "Wayne Shorter (August 25, 1933 – March 2, 2023) was an American jazz saxophonist and composer. Shorter came to prominence in the late 1950s as a member of, and eventually primary composer for, Art Blakey's Jazz Messengers. In the 1960s, he joined Miles Davis's Second Great Quintet, and then co-founded the jazz fusion band Weather Report. He has recorded over 20 albums as a bandleader.\n\nShorter was born in Newark, New Jersey, and attended Newark Arts High School.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Rocky_stereo", "verygooood"]}, {"n": 68, "title": "Ascension [Edition I]", "artist": "John Coltrane", "year": 1966, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15752-ascension_120205.jpg", "aoty_url": "https: um in the UK. It was also released .", "desc_lfm_artist": "Paul Simon and Art Garfunkel was an American folk rock duo, songwriters, and singers known collectively as Simon & Garfunkel. They formed the group Tom and Jerry in 1957 in Queens, New York, and had their first taste of success with the minor hit \"Hey Schoolgirl\". As Simon and Garfunkel, the duo rose to fame in 1965 backed by the hit single \"The Sound of Silence\". Their music was featured in the landmark film The Graduate, propelling them further into the public consciousness.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 70, "title": "Rubber Soul", "artist": "The Beatles", "year": 1965, "cover": "https://dn710303.ca.archive.org/0/items/mbid-d1092e74-6412-4bc6-a91c-bc3588b764f9/mbid-d1092e74-6412-4bc6-a91c-bc3588b764f9-10323265186.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4093-the-beatles-rubber-soul.php", "aoty_critic_score": 100, "aoty_user_score": 85, "mbid": "dca03435-8adb-30a5-ba82-5a162267ff38", "yt_id": "kfSQkZuIx84", "rym": "https://rateyourmusic.com/release/album/the-beatles/rubber-soul", "genres": ["folk rock", "pop rock", "psychedelic", "folk pop", "british rhythm & blues", "britpop"], "desc_lfm_album": "Rubber Soul is the sixth studio album by the English rock band the Beatles. It was released on 3 December 1965 in the United Kingdom on EMI's Parlophone label, alongside the non-album double A-side single \"Day Tripper\" / \"We Can Work It Out\". The original North American release, issued by Capitol Records, included ten of the fourteen songs and two tracks that had been withheld from the band's Help! (1965) album. Rubber Soul received positive critical response and achieved commercial success, topping sales charts in both Britain and the United States. Recording sessions took place in London over a four-week .", "desc_lfm_artist": "The Beatles were an English rock band formed in Liverpool, Lancashire in 1960. With the line-up comprising John Lennon, Paul McCartney,  George Harrison, and Ringo Starr, they are regarded as the most popular and influential band of all time. The group were integral to the development of 1960s counterculture and popular music's recognition as an art form. Rooted in skiffle, beat and 1950s rock and roll, their sound incorporated elements of classical", "desc_mb_album": "", "desc_mb_artist": "* [series:255a357a-909a-4437-9b7a-bfbb814bde77|Core catalogue (worldwide discography standardization)]\n    * [series:bb6b768c-7bf7-456b-a771-629280fed164|UK discography]\n    * [series:384fa008-cccd-4198-8502-379a8e4814e7|US discography]\n    * [series:19c78789-e350-43a7-b992-f8e4ef6a14b3|Canadian discography]\n\nThe official name of “The White Album” is [release-group:055be730-dcad-31bf-b550-45ba9c202aa3|''The Beatles'']; please do not add incorrectly titled releases to the database!\n\nPlease do not re-add individual mono remaster releases to their individual release groups. The mono remasters were never released separately, and are all already in the database as 13 mediums of the release [release-group:a5550169-ec99-45b1-827b-2d79c0c0fbb8|''The Beatles in Mono''].", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 71, "title": "Jackson C. Frank", "artist": "Jackson C. Frank", "year": 1965, "cover": "https://cdn2.albumoftheyear.org/600x0/album/30917-jackson-c-frank.jpg", "aoty_url": "https://www.albumoftheyear.org/album/30917-jackson-c-frank-jackson-c-frank.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "2d7b621f-7243-353f-86fd-100ff54d071d", "yt_id": "EaE2DWk5Hyk", "rym": "https://rateyourmusic.com/release/album/jackson-c-frank/jackson-c-frank", "genres": [], "desc_lfm_album": "Jackson C. Frank is the debut album by Jackson C. Frank, released in December 1965 by Columbia (EMI). It was the only studio album he released before his death. The album was produced in 1965 by Paul Simon in London, and both Al Stewart and Art Garfunkel attended the recording. The album features Frank on guitar and vocals with Simon and Stewart providing an occasional second guitar. Frank was reportedly so nervous that in order to play and sing, he had to have screens around him. The album was recorded in less than three hours in London at CBS Studios. .", "desc_lfm_artist": "Jackson Carey Frank (Buffalo, New York, March 2, 1943 – Great Barrington, Massachusetts, March 3, 1999) was an American folk singer-songwriter and guitarist. Although he released only one official album in his lifetime and never achieved much commercial success, he is reported to have influenced several better-known singer-songwriters such as Paul Simon and Nick Drake.\n\nWhen Jackson Frank was eleven years old, a furnace exploded at his school, sending", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "verygooood"]}, {"n": 72, "title": "A Charlie Brown Christmas", "artist": "Vince Guaraldi", "year": 1965, "cover": "https://cdn2.albumoftheyear.org/600x0/album/25286-a-charlie-brown-christmas-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/25286-vince-guaraldi-a-charlie-brown-christmas.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "b6b1c43f-71be-4865-8472-3a55a1d9fb9b", "yt_id": "PZtrgRejwG0", "rym": "https://rateyourmusic.com/release/album/vince-guaraldi/a-charlie-brown-christmas/", "genres": [], "desc_lfm_album": "A Charlie Brown Christmas is the eighth studio album by American jazz pianist Vince Guaraldi (later credited to the Vince Guaraldi Trio). The album was released in December 1965 in the U.S. by Fantasy Records and was Guaraldi's final studio album for the label. It is the soundtrack to the Christmas television special of the same name. Guaraldi was contacted by television producer Lee Mendelson to compose music for a documentary on the comic strip Peanuts and its creator, Charles M. Schulz. Although the special went unaired, these selections were released in 1964 as Jazz Impressions of A Boy Named .", "desc_lfm_artist": "Vincent Anthony \"Vince\" Guaraldi (July 17, 1928 - February 6, 1976) was an Italian-American musician and composer. Primarily a pianist, known for his breezy and playful improvisational voicings, Guaraldi cultivated his own innovative brand of jazz music. As primary tunesmith for a number of animated adaptations of the comic strip Peanuts, his influence on young potential jazz listeners was vast. Notably, his soundtrack album to the special of the same name, A Charlie Brown Christmas (1965), is regarded as one of the greatest Christmas albums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 73, "title": "Pastel Blues", "artist": "Nina Simone", "year": 1965, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12523-pastel-blues-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12523-nina-simone-pastel-blues.php", "aoty_critic_score": 82, "aoty_user_score": 87, "mbid": "1b3233e2-15ed-344e-bc8e-6630455db87f", "yt_id": "AbisPR1JpqU", "rym": "https://rateyourmusic.com/release/album/nina-simone/pastel-blues", "genres": ["blues", "soul", "jazz", "soul jazz", "vocal jazz", "soul blues"], "desc_lfm_album": "Pastel Blues is the eighth studio album by legendary American singer and pianist Nina Simone, released in 1965 through Philips Records. The album stands as one of her most emotionally charged works, blending jazz, blues, gospel, and folk influences to create a deeply expressive and raw listening experience. Background and Creation By the mid-1960s, Nina Simone had already established herself as one of the most powerful voices in music, both artistically and politically. While her other albums from this period, such as I Put a Spell on You (1965), leaned more towards pop and orchestral arrangements, Pastel Blues is stripped .", "desc_lfm_artist": "Eunice Kathleen Waymon (21 February 1933 – 21 April 2003), better known by her stage name Nina Simone, was an American singer, pianist, arranger, and civil rights activist widely associated with jazz music. Simone aspired to become a classical pianist while working in a broad range of styles including classical, jazz, blues, soul, folk, rhythm and blues, gospel, and pop.\n\nSimone was born Eunice Kathleen Waymon on 21st February 1933 in Tryon, North Carolina, USA, one of eight children.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 74, "title": "Otis Blue / Otis Redding Sings Soul", "artist": "Otis Redding", "year": 1965, "cover": "https://ia600709.us.archive.org/5/items/mbid-193c2998-cd3c-4981-93e3-203c07c8618b/mbid-193c2998-cd3c-4981-93e3-203c07c8618b-5547472895.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7028-otis-redding-otis-blue-otis-redding-sings-soul.php", "aoty_critic_score": 100, "aoty_user_score": 84, "mbid": "2c8fd4f3-1523-3604-97dd-18ba222e2f3b", "yt_id": "IuZ94SA4vi4", "rym": "https://rateyourmusic.com/release/album/otis-redding/otis-blue-otis-redding-sings-soul", "genres": ["blues", "soul", "r&b", "deep soul", "southern soul", "funk / soul"], "desc_lfm_album": "", "desc_lfm_artist": "Otis Ray Redding Jr. (September 9, 1941 – December 10, 1967) was an American singer, songwriter, record producer, arranger, and talent scout. He is considered one of the greatest singers in the history of American popular music and a seminal artist in soul music and rhythm and blues. Redding's style of singing gained inspiration from the gospel music that preceded the genre. His singing style influenced many other soul artists of the 1960s. During his lifetime, his recordings were produced by Stax Records, based in Memphis, Tennessee.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "paqueradejere", "verygooood"]}, {"n": 75, "title": "Highway 61 Revisited", "artist": "Bob Dylan", "year": 1965, "cover": "https://dn710804.ca.archive.org/0/items/mbid-d61a2bd9-81ac-4023-bd22-1c884d4a176c/mbid-d61a2bd9-81ac-4023-bd22-1c884d4a176c-13700705404.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5604-bob-dylan-highway-61-revisited.php", "aoty_critic_score": 100, "aoty_user_score": 89, "mbid": "fb48b1dc-412f-36aa-8820-1023c08c46c6", "yt_id": "IwOfCgkyEj0", "rym": "https://rateyourmusic.com/release/album/bob-dylan/highway-61-revisited", "genres": ["blues rock", "folk rock", "folk", "classic rock", "contemporary folk", "rock"], "desc_lfm_album": "Highway 61 Revisited is Bob Dylan's sixth studio album, released in 1965 by Columbia Records. It is Dylan's first album to be recorded entirely with a full rock band, after he experimented with the approach on half of Bringing It All Back Home. It is commonly tagged as documenting the \"angry young man\" period in Dylan's career, in-between the playfulness of its surrounding albums; many of the songs on Highway 61 are of an accusatory nature and feature rough, loud takes. Featuring hits and concert staples such as \"Like a Rolling Stone\", \"Desolation Row\", and \"Ballad of a Thin Man\", .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "Bob Dylan also performed ''police car'' on this album.\r\n----\r\nAlso part of the 10-cd box set ''The Bob Dylan 60's Collection'', catalog number ''88697 51773 2'', with these discs:\r\n\r\n[http://musicbrainz.org/release/4b5db958-0948-4151-8e1f-2d5b8cc35975.html|Bob Dylan] ([http://musicbrain ut a Spell on You is the sixth studio album by American singer, pianist, and activist Nina Simone, released in 1965 through Philips Records. This album marked a shift toward a more orchestral and polished sound, blending jazz, blues, and pop influences while showcasing Simone’s powerful, emotive vocals. Background and Creation By the mid-1960s, Nina Simone had already established herself as one of the most compelling voices in music, known for her genre-defying style and socially conscious lyrics. Unlike some of her other albums of the period, which leaned into jazz and folk influences, I Put a Spell on .", "desc_lfm_artist": "Eunice Kathleen Waymon (21 February 1933 – 21 April 2003), better known by her stage name Nina Simone, was an American singer, pianist, arranger, and civil rights activist widely associated with jazz music. Simone aspired to become a classical pianist while working in a broad range of styles including classical, jazz, blues, soul, folk, rhythm and blues, gospel, and pop.\n\nSimone was born Eunice Kathleen Waymon on 21st February 1933 in Tryon, North Carolina, USA, one of eight children.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 77, "title": "Maiden Voyage", "artist": "Herbie Hancock", "year": 1965, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14417-maiden-voyage.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14417-herbie-hancock-maiden-voyage.php", "aoty_critic_score": 93, "aoty_user_score": 81, "mbid": "c5e5e8ad-dc89-319e-8b2d-b3ff5e59fcea", "yt_id": "l4WWKnGBWIc", "rym": "https://rateyourmusic.com/release/album/herbie-hancock/maiden-voyage", "genres": ["jazz", "hard bop", "modal jazz"], "desc_lfm_album": "Maiden Voyage is the fifth album led by jazz musician Herbie Hancock, and was recorded by Rudy Van Gelder on March 17, 1965, for Blue Note Records. It was issued as BLP 4195 and BST 84195. Featuring Hancock with tenor saxophonist George Coleman, trumpeter Freddie Hubbard, bassist Ron Carter and drummer Tony Williams, it is a concept album aimed at creating an oceanic atmosphere. As such, many of the track titles refer to marine biology or the sea, and the musicians develop the concept through their use of space. The album was presented with the Grammy Hall of Fame Award .", "desc_lfm_artist": "Herbert Jeffrey Hancock (born April 12, 1940) is a jazz  pianist and composer from Chicago, Illinois, United States. Hancock is one of jazz music's most important and influential pianists and composers. He embraced elements of rock, funk, and soul while adopting freer stylistic elements from jazz.\n\nAs part of Miles Davis' \"second great quintet\" Hancock helped redefine the role of a jazz rhythm section, and was later one of the first jazz musicians to embrace synthesizers and Jazz funk.", "desc_mb_album": "", "desc_mb_artist": "''Herbert Jeffrey Hancock'', born in Chicago, IL, USA, is without doubt the most well known, controversial and influential of all jazz pianists.\r\nSoon noticed by and involved with ''Miles Davis'', Mr ''Hancock'' almost stormed the hardbop ''Blue Note'' 60's with a number of legendary sessions, from his (nearly) first record ''Takin' Off'', to ''The Prisoner''.\r\nRecording with the new ''Mile's'' cats, he then took an important turn (around the time of ''Head Hunters''), experimenting and mixing genres, thus drifting from his previous fan base expectations.\r\nWhile the hardbop's crowd thought he was completely lost for the cause, he then took a radical U-turn, with the all-stars-all-jazz ''V.S.O.P.''\r\nHe has since recorded and experimented in a lot of directions, exploring \"sound textures\" an", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave", "paqueradejere", "verygooood"]}, {"n": 78, "title": "Bringing It All Back Home", "artist": "Bob Dylan", "year": 1965, "cover": "https://dn721309.ca.archive.org/0/items/mbid-67e7ab93-d5c1-442f-b8c0-dbfad52e2d34/mbid-67e7ab93-d5c1-442f-b8c0-dbfad52e2d34-1602290298.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5603-bob-dylan-bringing-it-all-back-home.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "6cadda7c-fbd0-3b19-9546-56915e3305d8", "yt_id": "HNI-RQKA-cg", "rym": "https://rateyourmusic.com/release/album/bob-dylan/bringing-it-all-back-home", "genres": ["folk rock", "folk"], "desc_lfm_album": "Bringing It All Back Home is Bob Dylan's fifth studio album, released in 1965 by Columbia Records. The album is divided into an electric and an acoustic side. On side one of the original LP, Dylan is backed by an electric rock and roll band - a move that further alienated him from some of his former peers in the folk song community. Likewise, on the acoustic second side of the album, he distanced himself from the protest songs with which he had become closely identified (such as \"Blowin' in the Wind\" and \"A Hard Rain's a-Gonna Fall\"), as his .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 79, "title": "A Love Supreme", "artist": "John Coltrane", "year": 1965, "cover": "https://dn710708.ca.archive.org/0/items/mbid-38ad8234-305a-4c5d-8286-c55fb5c0392a/mbid-38ad8234-305a-4c5d-8286-c55fb5c0392a-12686384195.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6650-john-coltrane-a-love-supreme.php", "aoty_critic_score": 100, "aoty_user_score": 90, "mbid": "77cf47ba-58cd-3f3d-a5f9-79bf89860421", "yt_id": "ll3CMgiUPuU", "rym": "https://rateyourmusic.com/release/album/john-coltrane/a-love-supreme", "genres": ["jazz", "free jazz", "spiritual jazz", "hard bop", "modal jazz", "post-bop"], "desc_lfm_album": "A Love Supreme is an album by jazz saxophonist and composer John Coltrane, recorded in a single session on December 9, 1964, at Van Gelder Studio in Englewood Cliffs, New Jersey. The album was released by Impulse! Records in January 1965 (A-77). Often described as Coltrane’s „definitive tone poem“, A Love Supreme has become one of his best-selling recordings and is widely regarded as a landmark in jazz, celebrated for its spiritual depth, compositional innovation, and lasting influence on the genre. Composition: A Love Supreme is a four-part suite: ‚Acknowledgement‘, ‚Resolution‘, ‚Pursuance‘, and ‚Psalm‘, with Coltrane on tenor saxophone throughout. .", "desc_lfm_artist": "John William Coltrane (Hamlet, North Carolina, September 23, 1926  – Huntington, New York, July 17, 1967) was an American jazz  saxophonist and composer.\n\nAmerican jazz great John Coltrane emerged in the 1950s, playing tenor and soprano sax with Dizzy Gillespie, Miles Davis and Thelonious Monk. A leader of \"hard bop\", in the 1960s he led his own groups and changed the face of jazz with experimentation and improvisation, his later recordings reflecting his belief that music was a form of spiritual expression.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 80, "title": "Out to Lunch!", "artist": "Eric Dolphy", "year": 1964, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14183-out-to-lunch_144522.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14183-eric-dolphy-out-to-lunch.php", "aoty_critic_score": 100, "aoty_user_score": 80, "mbid": "bc6c2573-bc7d-346a-8880-0e34b8fb7e50", "yt_id": "zRekHkcS2X0", "rym": null, "genres": ["avant-garde", "jazz", "avant-garde jazz"], "desc_lfm_album": "Out to Lunch! is a 1964 album by jazz multi-instrumentalist Eric Dolphy. His only recording on Blue Note as leader, it was originally issued as BLP 4163 and BST 84163. It is generally considered one of the finest albums issued by the label, as well as one of the high points in 1960s avant-garde jazz and in Dolphy's oeuvre. The album cover was designed by Reid Miles, and features an image of a shop door with a \"Will Be Back\" sign displaying a clock with seven hands. Personnel: Eric Dolphy – bass clarinet (1 & 2), flute (3), alto saxophone .", "desc_lfm_artist": "Eric Allan Dolphy (June 20, 1928 – June 29, 1964) was a jazz musician who played alto saxophone, flute and bass clarinet and was educated at Los Angeles City College. Dolphy was the first important bass clarinet soloist in jazz, and one of the first viable flute soloists in jazz. On early recordings, he occasionally played traditional B-flat clarinet. His unique and individual style utilized wide intervals, speech-like effects and exotic scales.", "desc_mb_album": "", "desc_mb_artist": "= Editor README =\n\nDolphy's corner of the database is currently undergoing an extensive cleanup effort.\nMore information here: https://wiki.musicbrainz.org/Jazz/Dolphy\n\n== Annotation ==\n\n''Eric Allan Dolphy'' is simply the most important jazz multi-instrumentist ever, if such \"rankings\" should apply in music.\nAt ease in any formations, from ''Chico Hamilton'' to ''Ornette Coleman'', ''Dolphy'' featured, empowered and blew ahead each and every important session of the first half of the 60's.\nTaking the right channel on ''Free Jazz'' as morning sessions, leading ''John Coltrane'' to new grounds in the afternoon, messing extensively with ''Charles Mingus'' formations as a pause, he still found time to gig nightly at the ''Five Spot'' in historical sets with ''Mal Waldron'' and the regretted  ", "heard_by": ["GabredMared", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 81, "title": "Getz / Gilberto", "artist": "Stan Getz / João Gilberto featuring Antônio Carlos Jobim", "year": 1964, "cover": "https://dn710700.ca.archive.org/0/items/mbid-3dbe8250-a4e4-4bc4-a32c-db0e3a88375d/mbid-3dbe8250-a4e4-4bc4-a32c-db0e3a88375d-3742799884.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "b248d212-aace-3c3e-a23d-e13aaac1f87a", "yt_id": "UJJKDzqVpvE", "rym": "https://rateyourmusic.com/release/album/stan-getz-and-joao-gilberto-featuring-antonio-carlos-jobim/getz-gilberto", "genres": ["jazz", "cool jazz", "bossa nova", "latin jazz", "samba-jazz", "samba-canção"], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 82, "title": "The Times They Are A-Changin'", "artist": "Bob Dylan", "year": 1964, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5677-the-times-they-are-a-changin_211703.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5677-bob-dylan-the-times-they-are-a-changin.php", "aoty_critic_score": 82, "aoty_user_score": 83, "mbid": "846f8032-9a85-3f4f-b7f5-28c86573d044", "yt_id": "14lM7T-wjjM", "rym": "https://rateyourmusic.com/release/album/bob-dylan/the-times-they-are-a-changin", "genres": [], "desc_lfm_album": "The Times They Are a-Changin' is singer-songwriter Bob Dylan's third studio album, released in January 1964 by Columbia Records. Produced by Tom Wilson, it is the singer-songwriter's first collection to feature only original compositions. The album consists mostly of stark, sparsely-arranged story songs concerning issues such as racism, poverty, and social change. The title track is one of Dylan's most famous; many felt that it captured the spirit of social and political upheaval that characterized the 1960s. Some critics and fans were not quite as taken with the album as a whole, relative to his previous work, for its lack .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 83, "title": "Mingus Mingus Mingus Mingus Mingus", "artist": "Charles Mingus", "year": 1964, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6659-mingus-mingus-mingus-mingus-mingus.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6659-charles-mingus-mingus-mingus-mingus-mingus-mingus.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "48848da6-67a2-3e36-bb11-3e9fa18c1d9b", "yt_id": "9AMI1ZnmTks", "rym": "https://rateyourmusic.com/release/album/charles-mingus/mingus-mingus-mingus-mingus-mingus", "genres": ["jazz"], "desc_lfm_album": "Alto Saxophone – Charles Mariano* (tracks: 2, 3) Alto Saxophone, Flute – Eric Dolphy (tracks: 1, 4 to 8) Art Direction – Hollis King Baritone Saxophone, Soprano Saxophone, Flute – Jerome Richardson Bass – Charlie Mingus* Design – Jason Claiborne Drums – Dannie Richmond (tracks: 2, 3), Walter Perkins (tracks: 1, 4 to 8) Engineer – Bob Simpson Guitar – Jay Berliner (tracks: 2, 3) Mastered By – Erick Labson Narrator – Charlie Mingus* (tracks: 8) Oboe – Dick Hafer (tracks: 2, 3) Photography By – Joe Alper Piano – Charlie Mingus* (tracks: 2, 3), Jaki Byard Producer – Bob .", "desc_lfm_artist": "Charles Mingus (22nd April 1922 – 5th January 1979) was an American jazz bassist, composer, bandleader, and occasional pianist from Los Angeles. He was also known for his activism against racial injustice.\n\nMingus' legacy is notable: he is ranked among the finest composers and performers in jazz, and recorded many highly regarded albums. Dozens of musicians passed through his bands and later went on to impressive careers. His songs - though melodic and distinctive - are not often recorded by later musicians", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 84, "title": "Samba esquema novo", "artist": "Jorge Ben", "year": 1963, "cover": "https://ia601906.us.archive.org/7/items/mbid-f244c760-f055-4099-9b80-70cef5ef1f74/mbid-f244c760-f055-4099-9b80-70cef5ef1f74-1276068220.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "35393330-4347-36ed-bf94-44da38344282", "yt_id": "gLBHwkfOoqM", "rym": "https://rateyourmusic.com/release/album/jorge-ben/samba-esquema-novo", "genres": ["jazz", "bossa nova", "samba"], "desc_lfm_album": "Samba Esquema Novo is the debut studio album by Brazilian musician Jorge Ben, released on January 10, 1963, via Philips Records. It features the Brazilian samba jazz group Meirelles e os Copa 5 as a support band. Samba Esquema Novo is on the list of the 100 best albums of Brazilian music in 15th position. At the time of its release, critics from the newspaper O Estado de S. Paulo believed that the album would quickly disappear from stores, just like the 78 rotations previously released by him. .", "desc_lfm_artist": "Jorge Duílio Lima Menezes (born in Rio de Janeiro, RJ, Brazil, on March 22, 1939), better known as Jorge Ben or Jorge Ben Jor, is a Brazilian multi-instrumentalist, singer, and songwriter. In 2008, Rolling Stone Brazil named him the 5th greatest artist in the history of Brazilian music. He was also included in the magazine’s 2012 list of the 30 Greatest Brazilian Icons of Guitar and Acoustic Guitar.\n\nHis characteristic style includes various elements such as rock", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 85, "title": "John Coltrane and Johnny Hartman", "artist": "John Coltrane & Johnny Hartman", "year": 1963, "cover": "https://cdn2.albumoftheyear.org/600x0/album/59028-john-coltrane-johnny-hartman_171223.jpg", "aoty_url": "https://www.albumoftheyear.org/album/59028-john-coltrane-johnny-hartman-john-coltrane-and-johnny-hartman.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "6324bb2f-8ff2-31f1-990d-cc6afc2d6614", "yt_id": "eR3tmL8uUu0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "John Coltrane and Johnny Hartman is a studio album released by Impulse! Records in mid-1963 (A-40). It remains the only recording on which Coltrane featured a vocalist as leader, and it was later inducted into the Grammy Hall of Fame in 2013.\n\nAlthough Coltrane and Hartman are sometimes said to have known each other from Dizzy Gillespie’s band in the late 1940s, their tenures did not overlap. They may have shared a bill at the Apollo Theater in 1950.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Rocky_stereo", "armandwave"]}, {"n": 86, "title": "The Black Saint and the Sinner Lady", "artist": "Charles Mingus", "year": 1963, "cover": "https://dn710706.ca.archive.org/0/items/mbid-0d9f09ba-9e32-3d63-822a-a67935dc05d4/mbid-0d9f09ba-9e32-3d63-822a-a67935dc05d4-8878785226.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6660-charles-mingus-the-black-saint-and-the-sinner-lady.php", "aoty_critic_score": 96, "aoty_user_score": 92, "mbid": "48070ee2-1865-3b11-ba36-360b1453a37a", "yt_id": "0VlOigfm-ww", "rym": "https://rateyourmusic.com/release/album/mingus/the-black-saint-and-the-sinner-lady", "genres": ["jazz", "avant-garde jazz", "third stream"], "desc_lfm_album": "The Black Saint and the Sinner Lady is a studio album by Charles Mingus, released on Impulse! Records in 1963. The album consists of a single continuous composition—partially written as a ballet—divided into four tracks and six movements. .", "desc_lfm_artist": "Charles Mingus (22nd April 1922 – 5th January 1979) was an American jazz bassist, composer, bandleader, and occasional pianist from Los Angeles. He was also known for his activism against racial injustice.\n\nMingus' legacy is notable: he is ranked among the finest composers and performers in jazz, and recorded many highly regarded albums. Dozens of musicians passed through his bands and later went on to impressive careers. His songs - though melodic and distinctive - are not often recorded by later musicians", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 87, "title": "The Freewheelin’ Bob Dylan", "artist": "Bob Dylan", "year": 1963, "cover": "https://ia600703.us.archive.org/4/items/mbid-942be4b0-12a2-4264-93a3-b45fa94c95c0/mbid-942be4b0-12a2-4264-93a3-b45fa94c95c0-7332887586.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "169b62aa-c3a5-3ed9-bed1-cc47c4bc51ad", "yt_id": "KJBbX0jzM2c", "rym": "https://rateyourmusic.com/release/album/bob-dylan/the-freewheelin-bob-dylan-19", "genres": ["folk rock", "folk", "contemporary folk", "blues"], "desc_lfm_album": "", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p ", "yt_id": "1IN1TdLlITA", "rym": null, "genres": [], "desc_lfm_album": "Duke Ellington & John Coltrane is a collaborative jazz album released in January 1963 by Impulse! Records (A-30). The project paired Ellington with Coltrane in a small-group setting rather than Ellington’s customary big band format. During the early 1960s, Ellington recorded similar collaborations with artists such as Count Basie, Louis Armstrong, Coleman Hawkins, Max Roach, and Charles Mingus. The album (recorded September 26, 1962) features a quartet format—saxophone, piano, bass, and drums—with rhythm sections drawn from the musicians’ respective bands. Different combinations were used across the sessions. One quartet, with Ellington, Coltrane, Elvin Jones, and Jimmy Garrison, recorded ‘Take the .", "desc_lfm_artist": "Duke Ellington and John Coltrane collaborated in 1962 to record the album 'Duke Ellington & John Coltrane'.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 90, "title": "Undercurrent", "artist": "Bill Evans & Jim Hall", "year": 1962, "cover": "https://cdn2.albumoftheyear.org/600x0/album/85229-undercurrent_175035.jpg", "aoty_url": "https://www.albumoftheyear.org/album/85229-bill-evans-jim-hall-undercurrent.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "cf24f192-7cfc-3413-a80d-390b523dfbca", "yt_id": "EIly8muXwb8", "rym": null, "genres": [], "desc_lfm_album": "1988 liner notes for first CD issue Perhaps the most notable difference between the ways musicians and \"fans\" listen to jazz lies in the attention musicians pay to interaction. Jazzmen hear not only a soloist but an entire group playing together: the subtle difference between lackluster and brilliant performances. This is why musicians go into raptures over, say, the playing of bassist Sam Jones or pianist Hugh Lawson–raptures fans reserve for recognized \"stars.\" Indeed, one frequently-discussed weakness of the current jazz scene is its relative lack of stable personnel, for normally even the most talented musicians need months or years .", "desc_lfm_artist": "Bill Evans (piano) and Jim Hall (guitar) formed a jazz duo on two albums: Undercurrent (1962) and Intermodulation (1966).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "armandwave", "verygooood"]}, {"n": 91, "title": "Waltz for Debby", "artist": "Bill Evans", "year": 1962, "cover": "https://cdn2.albumoftheyear.org/600x0/album/58213-waltz-for-debby_092118.jpg", "aoty_url": "https://www.albumoftheyear.org/album/58213-bill-evans-waltz-for-debby.php", "aoty_critic_score": 100, "aoty_user_score": 86, "mbid": "392e7fcf-5ae9-37f6-b8c9-57901cfbee1f", "yt_id": "gk4D7N0pzGs", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are at least three artists with this name: a jazz pianist, a jazz saxophonist and a banjo player.\n\n1.) Bill Evans (born William John Evans; 16th August 1929-15th September 1980) was one of the most famous jazz pianists of the twentieth century. Along with McCoy Tyner and Oscar Peterson, he was the force behind the biggest evolution in jazz piano since Art Tatum and Bud Powell. \n\nHis use of impressionistic harmony, his inventive interpretation of traditional jazz repertoire", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 92, "title": "Olé Coltrane", "artist": "John Coltrane", "year": 1961, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53181-ole-coltrane_164534.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53181-john-coltrane-ole-coltrane.php", "aoty_critic_score": 70, "aoty_user_score": 81, "mbid": "9ba035a7-3f7c-3d96-9e07-0e0d45af41af", "yt_id": "wr5BotYA3U8", "rym": "https://rateyourmusic.com/release/album/john-coltrane/ole-coltrane", "genres": ["jazz", "avant-garde jazz", "free jazz", "cool jazz", "hard bop", "modal jazz"], "desc_lfm function isHeard(a) {
  if (selectedUser) return a.heard_by.includes(selectedUser);
  return a.heard_by.length > 0;
}

const imgObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && e.target.dataset.src) {
      e.target.src = e.target.dataset.src;
      e.target.removeAttribute('data-src');
      imgObs.unobserve(e.target);

function buildGenreList() {
  const list = document.getElementById('genre-list');
  list.innerHTML = '';
  GENRE_OPTS.forEach(([genre, count]) => {
    const div = document.createElement('div');
    div.className = 'genre-item';
    const id = 'g-'+genre.replace(/[^a-z0-9]/g,'_');
    div.innerHTML = '<input type="checkbox" id="'+id+'" value="'+genre+'" onchange="toggleGenre(\''+genre+'\',this.checked)"><label for="'+id+'">'+genre+'<span>'+count+'</span></label>';
    list.appendChild(div);
  });
}

function toggleGenreDD() {
  const dd  = document.getElementById('genre-dd');
  const btn = document.getElementById('genre-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  btn.classList.toggle('active', open || selectedGenres.size > 0);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 200) + 'px';
  }
}

function toggleGenre(g, checked) {
  if (checked) selectedGenres.add(g); else selectedGenres.delete(g);
  const badge = document.getElementById('genre-badge');
  const btn   = document.getElementById('genre-btn');
  if (selectedGenres.size>0) { badge.textContent=selectedGenres.size; badge.style.display=''; btn.classList.add('active'); }
  else { badge.style.display='none'; btn.classList.remove('active'); }
  applyFilters();
}

function clearGenres() {
  selectedGenres.clear();
  document.querySelectorAll('#genre-list input').forEach(i=>i.checked=false);
  document.getElementById('genre-badge').style.display='none';
  document.getElementById('genre-btn').classList.remove('active');
  applyFilters();
}

function toggleDecDD() {
  const dd  = document.getElementById('dec-dd');
  const btn = document.getElementById('dec-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = r.left + 'px';
  }
}

function buildUserList() {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  const allDiv = document.createElement('div');
  allDiv.className = 'user-item' + (!selectedUser ? ' active' : '');
  allDiv.innerHTML = '<span class="u-dot"></span>All users';
  allDiv.onclick = () => setUser(null);
  list.appendChild(allDiv);
  USERS.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item' + (selectedUser===u ? ' active' : '');
    const n = ALBUMS.filter(a=>a.heard_by.includes(u)).length;
    div.innerHTML = '<span class="u-dot"></span>'+u+'<span style="color:var(--muted);font-size:.58rem;margin-left:auto">'+n+'</span>';
    div.onclick = () => setUser(u);
    list.appendChild(div);
  });
}

function toggleUserDD() {
  const dd  = document.getElementById('user-dd');
  const btn = document.getElementById('user-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 164) + 'px';
  }
}

function setUser(u) {
  selectedUser = u;
  document.getElementById('user-btn-label').textContent = u || 'All users';
  document.getElementById('user-dd').classList.remove('open');
  buildUserList();
  document.querySelectorAll('.card').forEach(card => {
    const n = parseInt(card.dataset.num);
    const a = ALBUMS.find(x=>x.n===n);
    if (!a) return;
    const heard = isHeard(a);
    card.dataset.heard = heard ? '1' : '0';
    card.classList.toggle('heard-user',  heard);
    card.classList.toggle('unheard-user', !heard);
  });
  applyFilters();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.genre-wrap')) document.getElementById('genre-dd').classList.remove('open');
  if (!e.target.closest('.user-wrap'))  document.getElementById('user-dd').classList.remove('open');
  if (!e.target.closest('.dec-wrap'))   document.getElementById('dec-dd').classList.remove('open');
});

  ALBUMS.forEach(a => {
    const card = document.createElement('div');
    const heard = isHeard(a);
    card.className = 'card ' + (heard ? 'heard-user' : 'unheard-user');
    card.dataset.artist = (a.artist||'').toLowerCase();
    card.dataset.title  = (a.title||'').toLowerCase();
    card.dataset.genres = (a.genres||[]).join(',');
    card.dataset.heard  = heard ? '1' : '0';
    card.dataset.num    = a.n;
    const img = document.createElement('img');
    img.dataset.src = a.cover || COVER_PH;
    img.src = COVER_PH;
    img.alt = a.n;
    img.onerror = function(){ this.onerror=null; this.src=COVER_PH; };
    card.appendChild(img);
    const cs = a.aoty_critic_score != null ? '<span class="card-score c">'+a.aoty_critic_score+'</span>' : '';
    const us = a.aoty_user_score   != null ? '<span class="card-score u">'+a.aoty_user_score+'</span>'   : '';
    card.insertAdjacentHTML('beforeend',
      '<div class="card-overlay">'
      +'<div class="card-scores">'+cs+us+'</div>'
      +'<div class="card-title">'+a.title+'</div>'
      +'<div class="card-artist">'+a.artist+(a.year?' · '+a.year:'')+'</div>'
      +'</div>');
    card.addEventListener('click', () => openPanel(a, card));
    grid.appendChild(card);
  });
  document.querySelectorAll('img[data-src]').forEach(img=>imgObs.observe(img));
  applyFilters();
}

const _isMobile = () => window.matchMedia('(max-width:600px)').matches;

function closePanel() {
  document.getElementById('panel').classList.remove('panel-open');
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
}

function setGridSize(val) {
  document.getElementById('grid-label').textContent = val + '×';
  document.getElementById('grid').style.gridTemplateColumns = 'repeat('+val+',1fr)';
  try { localStorage.setItem('grid-cols-aoty', val); } catch(e) {}
}

function openPanel(a, cardEl) {
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
  cardEl.classList.add('active-card');
  if (_isMobile()) document.getElementById('panel').classList.add('panel-open');

  const coverWrap = document.getElementById('panel-cover-wrap');
  coverWrap.style.display='';
  document.getElementById('p-cover').src = a.cover || COVER_PH;
  document.getElementById('p-cover').onerror = function(){ this.src=COVER_PH; };

  const cs = a.aoty_critic_score != null ? '<span class="panel-score c">'+a.aoty_critic_score+' critic</span>' : '';
  const us = a.aoty_user_score   != null ? '<span class="panel-score u">'+a.aoty_user_score+' user</span>'     : '';
  document.getElementById('p-scores').innerHTML = cs + us;

  const links = [];
  if (a.aoty_url) links.push('<a class="panel-link aoty" href="'+a.aoty_url+'" target="_blank">AOTY</a>');
  if (a.rym)      links.push('<a class="panel-link rym"  href="'+a.rym+'"      target="_blank">RYM</a>');
  if (a.mbid)     links.push('<a class="panel-link"      href="https://musicbrainz.org/release-group/'+a.mbid+'" target="_blank">MusicBrainz</a>');
  if (a.yt_id)    links.push('<a class="panel-link yt"   href="https://youtu.be/'+a.yt_id+'" target="_blank">YouTube</a>');

  let ytBlock = '';
  if (a.yt_id) {
    ytBlock = '<iframe src="https://www.youtube.com/embed/'+a.yt_id+'" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
  } else {
    const q = encodeURIComponent(a.artist+' '+a.title+' full album');
    ytBlock = '<div class="panel-yt-placeholder"><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a></div>';
  }

  const genreTags = (a.genres||[]).map(g=>'<span class="panel-genre-tag">'+g+'</span>').join('');
  const heardLine = a.heard_by.length>0 ? '<div class="panel-heard-by">Heard by <b>'+a.heard_by.join(', ')+'</b></div>' : '';

  const descSrcs = [
    {key:'desc_lfm_album',  cls:'lfm',    lbl:'💿 Album · Last.fm'},
    {key:'desc_lfm_artist', cls:'artist',  lbl:'🎤 Artist · Last.fm'},
    {key:'desc_mb_album',   cls:'mb',      lbl:'💿 Album · MusicBrainz'},
    {key:'desc_mb_artist',  cls:'mb artist',lbl:'🎤 Artist · MusicBrainz'},
  ];
  const descBlocks = descSrcs.filter(s=>a[s.key]&&a[s.key].length>40)
    .map(s=>'<div class="desc-block"><div class="desc-source-label '+s.cls+'">'+s.lbl+'</div><div class="desc-source-text">'+a[s.key]+'</div></div>').join('');
  const bioHtml = descBlocks || '<span style="color:var(--muted);font-style:italic">No info available.</span>';

  document.getElementById('panel-body').innerHTML =
    '<div class="panel-title">'+a.title+'</div>'
    +'<div class="panel-artist">'+a.artist+'</div>'
    +'<div class="panel-year">'+(a.year||'')+'</div>'
    +(genreTags?'<div class="panel-genres">'+genreTags+'</div>':'')
    +heardLine
    +'<div class="panel-links">'+links.join('')+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">Listen on YouTube</div>'
    +'<div class="panel-yt-wrap">'+ytBlock+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">About</div>'
    +'<div class="panel-bio" id="p-bio">'+bioHtml+'</div>';
}

function setFilter(f) {
  filter=f;
  ['all','heard','unheard'].forEach(x => {
    const btn=document.getElementById('btn-'+x); if(!btn) return;
    btn.classList.toggle('active',x===f);
    if(x==='unheard') {
      btn.style.borderColor=f==='unheard'?'var(--pending)':'';
      btn.style.color=f==='unheard'?'var(--pending)':'';
      btn.style.background=f==='unheard'?'rgba(255,71,71,.06)':'';
    }
  });
  applyFilters();
}

function applyFilters() {
  const q=document.getElementById('search').value.toLowerCase().trim();
  let vis=0,visH=0;
  document.querySelectorAll('.card').forEach(c => {
    const mf=filter==='all'||(filter==='heard'&&c.dataset.heard==='1')||(filter==='unheard'&&c.dataset.heard==='0');
    const ms=!q||c.dataset.title.includes(q)||c.dataset.artist.includes(q);
    const cg=c.dataset.genres?c.dataset.genres.split(','):[];
    const mg=selectedGenres.size===0||[...selectedGenres].some(g=>cg.includes(g));
    const show=mf&&ms&&mg;
    c.classList.toggle('hidden',!show);
    if(show){vis++;if(c.dataset.heard==='1')visH++;}
  });
  document.getElementById('vis-count').textContent=vis;
  const uLabel = selectedUser ? ' ('+selectedUser+')' : '';
  document.getElementById('vis-heard').textContent=visH+' heard'+uLabel;
  document.getElementById('empty').style.display=vis===0?'block':'none';
}

buildGenreList(); buildUserList(); buildGrid();
try{const sv=localStorage.getItem('grid-cols-aoty');const dv=_isMobile()?3:10;const v=sv?Math.min(20,Math.max(3,parseInt(sv))):dv;document.getElementById('grid-slider').value=v;setGridSize(v);}catch(e){setGridSize(_isMobile()?3:10);}
setTimeout(()=>{
  if(!_isMobile()){const first=document.querySelector('.card:not(.hidden)');if(first){const a=ALBUMS.find(x=>x.n===parseInt(first.dataset.num));if(a)openPanel(a,first);}}
},100);</script>
