<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOTY Must Hear — 1950s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/images/discount.png" />
<script defer src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;
  --accent:#e8ff47;--heard:#e8ff47;--pending:#ff4747;
  --text:#e0e0e0;--muted:#555;--gap:6px;
  --panel:390px;--header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{
  position:fixed;top:0;left:0;right:var(--panel);height:var(--header-h);z-index:100;
  background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:0 18px;display:flex;align-items:center;gap:12px;
}
.back-link{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.dec-wrap{position:relative}
.dec-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);
  color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.dec-btn:hover{background:rgba(232,255,71,.12)}
.dec-dropdown{
  display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:160px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.dec-dropdown.open{display:block}
.dec-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.dec-item{display:block;padding:6px 14px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);text-decoration:none;transition:background .1s}
.dec-item:hover{background:var(--surface)}
.dec-item.active{color:var(--accent)}
.controls{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0}
.filter-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.search-box{
  font-family:'DM Mono',monospace;font-size:.62rem;padding:4px 9px;
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);width:130px;outline:none;transition:border-color .15s;
}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.genre-wrap{position:relative}
.genre-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.genre-btn:hover,.genre-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.genre-btn .badge{background:var(--accent);color:#000;border-radius:10px;padding:1px 5px;font-size:.52rem;font-weight:700}
.genre-dropdown{
  display:none;position:fixed;
  background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:200px;max-height:320px;overflow-y:auto;padding:4px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.genre-dropdown.open{display:block}
.genre-dh{
  padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:3px;
  display:flex;justify-content:space-between;
}
.genre-clear{color:var(--pending);cursor:pointer}
.genre-item{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;transition:background .1s}
.genre-item:hover{background:var(--surface)}
.genre-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.genre-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);cursor:pointer;flex:1;display:flex;justify-content:space-between}
.genre-item label span{color:var(--muted);font-size:.56rem}
.user-wrap{position:relative}
.user-btn{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.user-btn:hover{background:rgba(232,255,71,.12)}
.user-btn .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.user-dropdown{display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;z-index:9999;min-width:164px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.user-dropdown.open{display:block}
.user-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.user-item{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;transition:background .1s;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text)}
.user-item:hover{background:var(--surface)}
.user-item.active{color:var(--accent)}
.user-item .u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.user-item.active .u-dot{background:var(--accent)}
#main{margin-top:var(--header-h);margin-right:var(--panel);padding:14px 18px 60px;position:relative;z-index:0}
.count-bar{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px;display:flex;gap:14px}
.count-bar b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.05);z-index:10}
.card.hidden{display:none}
.card.active-card{outline:2px solid var(--accent);outline-offset:2px;z-index:11}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.heard-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3;background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,0) 55%);
  opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px;z-index:2;
}
.card:hover .card-overlay{opacity:1}
.card-scores{display:flex;gap:3px;margin-bottom:2px}
.card-score{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;padding:1px 4px;border-radius:2px}
.card-score.c{background:rgba(108,184,250,.2);color:#6cb8fa}
.card-score.u{background:rgba(191,143,255,.2);color:#bf8fff}
.card-title{font-size:.56rem;font-weight:500;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{font-size:.52rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3}
.card.heard-user::before{background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card.unheard-user::before{background:var(--pending);box-shadow:0 0 5px var(--pending)}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panel);
  background:#0c0c0c;border-left:1px solid var(--border);
  z-index:50;display:flex;flex-direction:column;overflow:hidden;
}
.panel-topbar{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 15px;flex-shrink:0}
.panel-topbar-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel-cover{width:100%;aspect-ratio:1;flex-shrink:0;position:relative;background:var(--surface);max-height:200px;overflow:hidden}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-scores{display:flex;gap:6px;position:absolute;bottom:8px;left:8px}
.panel-score{padding:3px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700}
.panel-score.c{background:rgba(0,0,0,.7);color:#6cb8fa;border:1px solid #6cb8fa44}
.panel-score.u{background:rgba(0,0,0,.7);color:#bf8fff;border:1px solid #bf8fff44}
.panel-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.panel-empty-icon{font-size:2rem;opacity:.3}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);line-height:1.05;margin-bottom:2px}
.panel-artist{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.panel-year{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.panel-genre-tag{font-family:'DM Mono',monospace;font-size:.56rem;padding:2px 6px;border-radius:2px;background:rgba(232,255,71,.07);border:1px solid rgba(232,255,71,.18);color:rgba(232,255,71,.65)}
.panel-heard-by{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:9px}
.panel-heard-by b{color:var(--heard)}
.panel-divider{height:1px;background:var(--border);margin:9px 0}
.panel-section-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.panel-bio{font-size:.72rem;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-bio::-webkit-scrollbar{width:3px}
.panel-bio::-webkit-scrollbar-thumb{background:var(--border)}
.desc-block{margin-bottom:9px}
.desc-source-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.desc-source-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.desc-source-label.lfm{color:#d51007}.desc-source-label.mb{color:#ba478f}.desc-source-label.artist{color:#6a9fb5}
.desc-source-text{font-size:.7rem;color:#aaa;line-height:1.55}
.panel-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.panel-link{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}
.panel-link.aoty{border-color:#e87c2e;color:#e87c2e}
.panel-link.aoty:hover{background:rgba(232,124,46,.08)}
.panel-link.yt{border-color:#f00;color:#f00}
.panel-link.yt:hover{background:rgba(255,0,0,.08)}
.panel-link.rym{border-color:#5baadb;color:#5baadb}
.panel-link.rym:hover{background:rgba(91,170,219,.08)}
.panel-yt-wrap{margin-top:11px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.panel-yt-wrap iframe{display:block;width:100%;height:145px;border:none}
.panel-yt-placeholder{height:60px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.panel-close-btn{display:none;position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.18)}
.grid-sizer{display:flex;align-items:center;gap:5px}
.grid-sizer span{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);min-width:24px;text-align:right}
#grid-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#grid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
#grid-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#empty{display:none;text-align:center;padding:50px 0;font-family:'DM Mono',monospace;color:var(--muted);font-size:.7rem}
@media(max-width:600px){
  :root{--header-h:50px}
  header{right:0;height:auto;min-height:var(--header-h);flex-wrap:wrap;padding:8px 12px;gap:6px 10px;overflow:visible}
  #main{margin-right:0;padding:10px 10px 60px}
  #panel{inset:0;width:100%;border-left:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  #panel.panel-open{transform:translateY(0)}
  .panel-close-btn{display:flex}
  .controls{flex:0 0 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:5px;padding:5px 0 2px;border-top:1px solid var(--border);scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .dec-wrap{display:none}
}</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">←</a>
  <span class="header-title">AOTY Must Hear</span>
  <div class="dec-wrap">
    <button class="dec-btn" id="dec-btn" onclick="toggleDecDD()">
      1950s &#x25BE;
    </button>
  </div>
  <div class="controls">
    <button class="filter-btn active" id="btn-all"     onclick="setFilter('all')">All</button>
    <button class="filter-btn"        id="btn-heard"   onclick="setFilter('heard')">Heard</button>
    <button class="filter-btn"        id="btn-unheard" onclick="setFilter('unheard')">Unheard</button>
    <input class="search-box" id="search" placeholder="Search..." oninput="applyFilters()">
    <div class="genre-wrap">
      <button class="genre-btn" id="genre-btn" onclick="toggleGenreDD()">
        Genre <span class="badge" id="genre-badge" style="display:none">0</span> &#x25BE;
      </button>
    </div>
    <div class="user-wrap">
      <button class="user-btn" id="user-btn" onclick="toggleUserDD()">
        <span class="u-name" id="user-btn-label">All users</span> &#x25BE;
      </button>
    </div>
    <div class="grid-sizer">
      <span id="grid-label">10×</span>
      <input type="range" id="grid-slider" min="3" max="20" value="10" step="1" oninput="setGridSize(this.value)">
    </div>
  </div>
</header>
<main id="main">
  <div class="count-bar">
    <span>Showing <b id="vis-count">18</b> of 18</span>
    <span><b id="vis-heard">0</b> heard</span>
  </div>
  <div id="grid"></div>
  <div id="empty">No albums match your filters.</div>
</main>
<aside id="panel">
  <button class="panel-close-btn" onclick="closePanel()" aria-label="Close">&#x2715;</button>
  <div class="panel-topbar">
    <span class="panel-topbar-label">Album detail</span>
  </div>
  <div id="panel-cover-wrap" class="panel-cover" style="display:none">
    <img id="p-cover" src="" alt="">
    <div class="panel-scores" id="p-scores"></div>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="panel-empty"><div class="panel-empty-icon">◉</div>Click an album</div>
  </div>
</aside>
<div class="dec-dropdown" id="dec-dd">
  <div class="dec-dh">Jump to decade</div>
  <a class="dec-item active" href="decade_1950s.html">1950s</a><a class="dec-item" href="decade_1960s.html">1960s</a><a class="dec-item" href="decade_1970s.html">1970s</a><a class="dec-item" href="decade_1980s.html">1980s</a><a class="dec-item" href="decade_1990s.html">1990s</a><a class="dec-item" href="decade_2000s.html">2000s</a><a class="dec-item" href="decade_2010s.html">2010s</a><a class="dec-item" href="decade_2020s.html">2020s</a>
</div>
<div class="genre-dropdown" id="genre-dd">
  <div class="genre-dh">Filter by genre <span class="genre-clear" onclick="clearGenres()">clear</span></div>
  <div id="genre-list"></div>
</div>
<div class="user-dropdown" id="user-dd">
  <div class="user-dh">View as user</div>
  <div id="user-list"></div>
</div>
<script>
const ALBUMS = [{"n": 1, "title": "Time Out", "artist": "Dave Brubeck", "year": 1959, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12732-time-out.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12732-dave-brubeck-time-out.php", "aoty_critic_score": 87, "aoty_user_score": 84, "mbid": "59c053ab-7f39-4be0-9198-df7e3aaa6e78", "yt_id": "NoL8zEZT4qQ", "rym": null, "genres": ["jazz", "cool jazz"], "desc_lfm_album": "Dave Brubeck's defining masterpiece, Time Out is one of the most rhythmically innovative albums in jazz history, the first to consciously explore time signatures outside of the standard 4/4 beat or 3/4 waltz time. It was a risky move -- Brubeck's record company wasn't keen on releasing such an arty project, and many critics initially roasted him for tampering with jazz's rhythmic foundation. But for once, public taste was more advanced than that of the critics. Buoyed by a hit single in altoist Paul Desmond's ubiquitous \"Take Five,\" Time Out became an unexpectedly huge success, and still ranks as one .", "desc_lfm_artist": "David Warren Brubeck (born December 6, 1920 in Concord, California - December 5, 2012) was an American jazz pianist who has written a number of jazz standards, including \"In Your Own Sweet Way\" and \"The Duke\". He was probably best known for \"Take Five\", written by saxophone player Paul Desmond, who was the saxophonist in The Dave Brubeck Quartet. Due to the immense popularity of his work, Brubeck had won multiple awards such as a lifetime achievement award from the Grammys in 1996", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 2, "title": "Workin' With The Miles Davis Quintet", "artist": "Miles Davis", "year": 1959, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19097-workin-with-the-miles-davis-quintet-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19097-miles-davis-workin-with-the-miles-davis-quintet.php", "aoty_critic_score": 100, "aoty_user_score": 80, "mbid": "4279baa0-5203-384a-8702-b3838bf6ec78", "yt_id": "GeEqtiTKhDo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave"]}, {"n": 3, "title": "The Shape of Jazz to Come", "artist": "Ornette Coleman", "year": 1959, "cover": "https://ia801308.us.archive.org/19/items/mbid-c4a1b794-7bb5-411a-a876-7af045cf6f22/mbid-c4a1b794-7bb5-411a-a876-7af045cf6f22-12407949899.jpg", "aoty_url": "https://www.albumoftheyear.org/album/13346-ornette-coleman-the-shape-of-jazz-to-come.php", "aoty_critic_score": 100, "aoty_user_score": 82, "mbid": "5879cfca-e1d0-3ef4-8014-3b284832ed18", "yt_id": "kcslwKxCTR0", "rym": "https://rateyourmusic.com/release/album/ornette-coleman/the-shape-of-jazz-to-come-4", "genres": ["jazz"], "desc_lfm_album": "Ornette Coleman's Atlantic debut, The Shape of Jazz to Come, was a watershed event in the genesis of avant-garde jazz, profoundly steering its future course and throwing down a gauntlet that some still haven't come to grips with. The record shattered traditional concepts of harmony in jazz, getting rid of not only the piano player but the whole idea of concretely outlined chord changes. The pieces here follow almost no predetermined harmonic structure, which allows Coleman and partner Don Cherry an unprecedented freedom to take the melodies of their solo lines wherever they felt like going in the moment, regardless .", "desc_lfm_artist": "Ornette Coleman (March 9, 1930 - June 11, 2015) was an American jazz saxophonist, violinist, trumpeter, and composer. He was one of the founders and major innovators of the 1960s free jazz movement and one of the most notable figures in jazz history.\n\nColeman was born in 1930 in Fort Worth, Texas where he participated in his high school band until being dismissed for improvising during \"The Washington Post\" march. He began performing rhythm and blues and bebop, initially on tenor saxophone.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 4, "title": "Mingus Ah Um", "artist": "Charles Mingus", "year": 1959, "cover": "https://dn710609.ca.archive.org/0/items/mbid-f9754b8f-15ae-45bf-9cc4-603e925fee04/mbid-f9754b8f-15ae-45bf-9cc4-603e925fee04-1241372363.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6655-charles-mingus-mingus-ah-um.php", "aoty_critic_score": 100, "aoty_user_score": 86, "mbid": "48ec720b-2fc2-35dd-8130-5b186c4abcbc", "yt_id": "Q97zbRuEkmM", "rym": "https://rateyourmusic.com/release/album/charles-mingus/mingus-ah-um-11", "genres": ["jazz", "hard bop", "post-bop"], "desc_lfm_album": "Mingus Ah Um is a studio album by American jazz musician Charles Mingus which was released in October 1959 by Columbia Records. It was his first album recorded for Columbia. The cover features a painting by S. Neil Fujita. The title is a corruption of an imaginary Latin declension. It is common for Latin students to memorize Latin adjectives by first saying the masculine nominative (usually ending in \"-us\"), then the feminine nominative (\"-a\"), and finally the neuter nominative singular (\"-um\") —implying a transformation of his name, Mingus, Minga, Mingum. The album was inducted into the Grammy Hall of Fame .", "desc_lfm_artist": "Charles Mingus (22nd April 1922 – 5th January 1979) was an American jazz bassist, composer, bandleader, and occasional pianist from Los Angeles. He was also known for his activism against racial injustice.\n\nMingus' legacy is notable: he is ranked among the finest composers and performers in jazz, and recorded many highly regarded albums. Dozens of musicians passed through his bands and later went on to impressive careers. His songs - though melodic and distinctive - are not often recorded by later musicians", "desc_mb_album": "One of the two ''Mingus'' albums from the short lived 59 ''Columbia'' period (the other one being ''Mingus Dynasty''), it's arguably ''Mingus'' greatest achievement at splicing in one release high quality music, guts, and mainstream \"acccessibility\".\nWith smash titles like ''Goodbye Pork Pie Hat'' (an elegy for the recently passed ''Prez''), or the censored ''Fables of Faubus'' (look ''Orval Faubus''), and with the usual \"''Mingus'' trained\" strong line-up in excellent form, it's an excellent beginner's choice and an absolute obligation for anybody serious and not serious at music.\n\nBuyers will likely find late reissues containing three additional tracks, and featuring the nine original tracks in '''unedited form'''.\nThese who can afford it will probably go for the bargain and buy the 3 cd", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 5, "title": "Gunfighter Ballads and Trail Songs", "artist": "Marty Robbins", "year": 1959, "cover": "https://ia601405.us.archive.org/3/items/mbid-186454fd-b135-3265-9378-56fc9e9bd986/mbid-186454fd-b135-3265-9378-56fc9e9bd986-7723010518.jpg", "aoty_url": "https://www.albumoftheyear.org/album/44404-marty-robbins-gunfighter-ballads-and-trail-songs.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "81e9ea0b-e334-35b3-9d10-f9a5f8bea5ae", "yt_id": "okuR3ZQyzjc", "rym": "https://rateyourmusic.com/release/album/marty-robbins/gunfighter-ballads-and-trail-songs/", "genres": ["country", "tejano", "traditional country"], "desc_lfm_album": "Gunfighter Ballads and Trail Songs is an album released by Marty Robbins on the Columbia Records label in September 1959, peaking at #6 on the U.S. pop albums chart. It was recorded in a single eight-hour session on April 7, 1959, and was certified Gold by the RIAA in 1965 and Platinum in 1986. It is perhaps best known for Robbins' most successful single, \"El Paso\", a major hit on both the country and pop music charts. It reached #1 in both charts at the start of 1960 and won the Grammy Award for Best Country & Western Recording the .", "desc_lfm_artist": "Martin David Robinson (September 26, 1925 – December 8, 1982), known professionally as Marty Robbins, was an American singer, songwriter, actor, multi-instrumentalist, and NASCAR racing driver. Robbins was one of the most popular and successful country and western singers for most of his nearly four-decade career, which spanned from the late 1940s to the early 1980s.\n\nBorn in Glendale, Arizona, Robbins taught himself guitar while serving in the United States Navy during World War II", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Nubis84", "armandwave"]}, {"n": 6, "title": "Kind of Blue", "artist": "Miles Davis", "year": 1959, "cover": "https://dn710907.ca.archive.org/0/items/mbid-e7ba3cb7-a074-45ee-870f-3baeb6d3e8bf/mbid-e7ba3cb7-a074-45ee-870f-3baeb6d3e8bf-12708426541.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6040-miles-davis-kind-of-blue.php", "aoty_critic_score": 100, "aoty_user_score": 91, "mbid": "8e8a594f-2175-38c7-a871-abb68ec363e7", "yt_id": "vDqULFUg6CY", "rym": "https://rateyourmusic.com/release/album/miles-davis/kind-of-blue", "genres": ["jazz", "cool jazz", "hard bop", "modal jazz", "post-bop"], "desc_lfm_album": "Kind of Blue is a studio album by American jazz trumpeter, composer, and bandleader Miles Davis. It was recorded on March 2 and April 22, 1959, at Columbia's 30th Street Studio in New York City, and released on August 17 of that year by Columbia Records. For the recording, Miles Davis led a sextet featuring saxophonists John Coltrane and Cannonball Adderley, pianist Bill Evans, bassist Paul Chambers, and drummer Jimmy Cobb, with new band pianist Wynton Kelly appearing on one track – \"Freddie Freeloader\" – in place of Bill Evans. Influenced in part by Bill Evans, who had joined the .", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 7, "title": "Chega de saudade", "artist": "João Gilberto", "year": 1959, "cover": "https://dn710903.ca.archive.org/0/items/mbid-835940cc-3a91-4c5a-910a-ff5306ae6287/mbid-835940cc-3a91-4c5a-910a-ff5306ae6287-4937144983.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "9e4072b4-11c3-3fe6-be4f-4a607bbb94f9", "yt_id": "Ezu4J1exOTI", "rym": "https://rateyourmusic.com/release/album/joao-gilberto/chega-de-saudade", "genres": ["jazz", "latin", "bossa nova"], "desc_lfm_album": "", "desc_lfm_artist": "João Gilberto (João Gilberto Prado Pereira de Oliveira, Juazeiro, Bahia, Brazil, June 10, 1931 - July 6, 2019) was a Brazilian singer, acoustic guitarist and ocasional songwriter, considered one of the creators of bossa nova with Antônio Carlos Jobim and Vinícius de Moraes. One of his most famous nicknames is \"Pai da Bossa Nova\" (Father of Bossa Nova).\n\nA self-taught guitarist and singer, Gilberto moved to Rio de Janeiro in 1950 and joined the vocal group Garotos da Lua (\"The Boys of the Moon\") as their lead singer.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "verygooood"]}, {"n": 8, "title": "Little Girl Blue", "artist": "Nina Simone", "year": 1959, "cover": "https://cdn2.albumoftheyear.org/600x0/album/26226-little-girl-blue_104907.jpg", "aoty_url": "https://www.albumoftheyear.org/album/26226-nina-simone-little-girl-blue.php", "aoty_critic_score": 70, "aoty_user_score": 82, "mbid": "eb5f5415-fcd1-4ca0-b0be-4080cb315a98", "yt_id": "197tv8tUxiE", "rym": "https://rateyourmusic.com/release/album/nina-simone/little-girl-blue", "genres": [], "desc_lfm_album": "Little Girl Blue (also known as Jazz As Played in an Exclusive Side Street Club) is the debut album by jazz singer, pianist and songwriter Nina Simone, released by Bethlehem Records. Simone was in her mid-20s at the time, and still aspiring to be a classical concert pianist. She immediately sold the rights for the songs on this album to Bethlehem for $3,000 (US$25,446 in 2017 dollars), with the deal eventually costing her royalty profits of more than a million dollars. Simone was dissatisfied by the lack of effort the record company took in promoting her, and after this album .", "desc_lfm_artist": "Eunice Kathleen Waymon (21 February 1933 – 21 April 2003), better known by her stage name Nina Simone, was an American singer, pianist, arranger, and civil rights activist widely associated with jazz music. Simone aspired to become a classical pianist while working in a broad range of styles including classical, jazz, blues, soul, folk, rhythm and blues, gospel, and pop.\n\nSimone was born Eunice Kathleen Waymon on 21st February 1933 in Tryon, North Carolina, USA, one of eight children.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 9, "title": "Art Blakey and the Jazz Messengers [Moanin']", "artist": "Art Blakey & The Jazz Messengers", "year": 1959, "cover": "https://cdn2.albumoftheyear.org/600x0/album/43247-moanin_192941.jpg", "aoty_url": "https://www.albumoftheyear.org/album/43247-art-blakey-the-jazz-messengers-art-blakey-and-the-jazz-messengers-moanin.php", "aoty_critic_score": 100, "aoty_user_score": 86, "mbid": null, "yt_id": "Swz0IfJBtSw", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Art Blakey and Horace Silver formed the Jazz Messengers in 1955 and co-led it. When Silver dropped out in the group's first year the group name was changed to Art Blakey & The Jazz Messengers.  Wayne Shorter was a long-standing member of the group, joining after the departure of Benny Golson, while other young musicians like Curtis Fuller, Donald Byrd, James 'Blood' Ulmer,Jymie Merritt, Hank Mobley, Freddie Hubbard, Lee Morgan, Bobby Timmons and Wynton Marsalis would come and go.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 10, "title": "Milestones", "artist": "Miles Davis", "year": 1958, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19094-milestones_051646.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19094-miles-davis-milestones.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "1e7f438c-bc77-3544-9ccd-d1a0959e33f1", "yt_id": "0kDPlFtUjpA", "rym": "https://rateyourmusic.com/release/album/miles-davis/milestones", "genres": [], "desc_lfm_album": "Milestones is an album recorded in February and March 1958 by Miles Davis. It is renowned for including Miles' first forays into the developing modal jazz experiments, as noticed on the piece \"Milestones\" (not to be confused with \"Miles\", recorded by Davis in 1948), which would be followed to its logical conclusion on Kind of Blue. It was also the last time the rhythm section of Jones, Garland and Chambers would ever play with Miles on record. Coltrane's return to Davis’s group in 1958 coincided with the “modal phase” albums: Milestones and Kind of Blue (1959) are both considered essential .", "desc_lfm_artist": "Miles Davis (Miles Dewey Davis III, Alton, Illinois, May 26, 1926 – Santa Monica, California, September 28, 1991) was an American trumpeter, bandleader and composer.\n\nWidely considered one of the most influential musicians of the 20th century, Miles Davis was, with his musical groups, at the forefront of several major developments in jazz music, including bebop, cool jazz, hard bop, modal jazz, and jazz fusion. Many well-known musicians rose to prominence as members of Davis' ensembles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "verygooood"]}, {"n": 11, "title": "Somethin' Else", "artist": "Cannonball Adderley", "year": 1958, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18303-somethin-else.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18303-cannonball-adderley-somethin-else.php", "aoty_critic_score": 100, "aoty_user_score": 82, "mbid": "495c22f5-90b3-3e87-8be1-2c55aef3ed82", "yt_id": "mLPW93VIVgs", "rym": "https://rateyourmusic.com/release/album/cannonball-adderley/somethin-else/", "genres": [], "desc_lfm_album": "Somethin' Else is regarded as a landmark album in the hard bop and cool styles. This critically-acclaimed LP is notable for the presence and prominent contributions of Miles Davis, in one of his few recording dates for Blue Note Records. Many critics and jazz fans consider Somethin' Else to be among the greatest jazz albums of all time. CD reissues include a bonus track, variously titled \"Bangoon\" or (originally, and incorrectly) \"Allison's Uncle\". That song is a Hank Jones composition, more hard bop in orientation than the rest of the record. It features a paradigmatic solo by Blakey (he can .", "desc_lfm_artist": "Julian Edwin \"Cannonball\" Adderley (September 15, 1928 – August 8, 1975) was a jazz alto saxophonist of the hard bop era of the 1950s and 1960s.\n\nAdderley is remembered for his 1966 single \"Mercy Mercy Mercy\", a crossover hit on the pop charts, and for his work with trumpeter Miles Davis, including on the epochal album Kind of Blue (1959). He was the brother of jazz cornetist Nat Adderley, a longtime member of his band.\n\nThe name 'Canonball' is supposed to have originated from his being nicknamed 'cannibal' in his youth", "desc_mb_album": "", "desc_mb_artist": "== Biography ==\r\n\r\n''Cannonball'' ranks in the few legendary saxophonist of the 50's-60's era.\r\nAfter playing on some of the best [http://musicbrainz.org/artist/561d854a-6a28-4aa7-8c99-323e6ce46c2a.html|''Miles Davis''] albums ([http://musicbrainz.org/album/7d7ebace-0e5a-43c2-bd6d-18b5f35bed0b.html|''Kind of Blue'']...), he moved to his own formations, including top partners like [http://musicbrainz.org/artist/ef05197e-aacb-4dbf-9cc4-2a9abee82f03.html|''Bobby Timmons''], [http://musicbrainz.org/artist/1789de4d-0f0c-4db9-b850-a823b945c883.html|''Sam Jones''], [http://musicbrainz.org/artist/2968722f-03d8-4e2f-88bc-f9975f147503.html|''Yusef Lateef''], or his brother [http://musicbrainz.org/artist/a9e79d89-f90b-4cef-943e-68151336a430.html|''Nat''].\r\nExperimenting with new sounds at the dawn of", "heard_by": ["Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 12, "title": "Blue Train", "artist": "John Coltrane", "year": 1958, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6645-blue-train_200129.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6645-john-coltrane-blue-train.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": "c63baaaa-10c0-4b86-ad7e-1f39d7e2eccc", "yt_id": "UdN38PDzNBs", "rym": "https://rateyourmusic.com/release/album/john-coltrane/blue-train/", "genres": [], "desc_lfm_album": "Blue Train is a studio album by John Coltrane which was release const USERS  = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"];
const GENRE_OPTS = [["jazz", 8], ["cool jazz", 5], ["hard bop", 3], ["post-bop", 2], ["country", 1], ["tejano", 1], ["traditional country", 1], ["modal jazz", 1], ["latin", 1], ["bossa nova", 1], ["bebop", 1]];
let filter = 'all';
let selectedGenres = new Set();
let selectedUser   = null;
const COVER_PH = 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22250%22%20height=%22250%22%20viewBox=%220%200%20250%20250%22%3E%3Crect%20width=%22250%22%20height=%22250%22%20fill=%22%23111%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%2260%22%20fill=%22none%22%20stroke=%22%23333%22%20stroke-width=%222%22/%3E%3C/svg%3E';

function isHeard(a) {
  if (selectedUser) return a.heard_by.includes(selectedUser);
  return a.heard_by.length > 0;
}

const imgObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && e.target.dataset.src) {
      e.target.src = e.target.dataset.src;
      e.target.removeAttribute('data-src');
      imgObs.unobserve(e.target);
    }
  });
}, {rootMargin:'200px'});

function buildGenreList() {
  const list = document.getElementById('genre-list');
  list.innerHTML = '';
  GENRE_OPTS.forEach(([genre, count]) => {
    const div = document.createElement('div');
    div.className = 'genre-item';
    const id = 'g-'+genre.replace(/[^a-z0-9]/g,'_');
    div.innerHTML = '<input type="checkbox" id="'+id+'" value="'+genre+'" onchange="toggleGenre(\''+genre+'\',this.checked)"><label for="'+id+'">'+genre+'<span>'+count+'</span></label>';
    list.appendChild(div);
  });
}

function toggleGenreDD() {
  const dd  = document.getElementById('genre-dd');
  const btn = document.getElementById('genre-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  btn.classList.toggle('active', open || selectedGenres.size > 0);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 200) + 'px';
  }
}

function toggleGenre(g, checked) {
  if (checked) selectedGenres.add(g); else selectedGenres.delete(g);
  const badge = document.getElementById('genre-badge');
  const btn   = document.getElementById('genre-btn');
  if (selectedGenres.size>0) { badge.textContent=selectedGenres.size; badge.style.display=''; btn.classList.add('active'); }
  else { badge.style.display='none'; btn.classList.remove('active'); }
  applyFilters();
}

function clearGenres() {
  selectedGenres.clear();
  document.querySelectorAll('#genre-list input').forEach(i=>i.checked=false);
  document.getElementById('genre-badge').style.display='none';
  document.getElementById('genre-btn').classList.remove('active');
  applyFilters();
}

function toggleDecDD() {
  const dd  = document.getElementById('dec-dd');
  const btn = document.getElementById('dec-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = r.left + 'px';
  }
}

function buildUserList() {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  const allDiv = document.createElement('div');
  allDiv.className = 'user-item' + (!selectedUser ? ' active' : '');
  allDiv.innerHTML = '<span class="u-dot"></span>All users';
  allDiv.onclick = () => setUser(null);
  list.appendChild(allDiv);
  USERS.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item' + (selectedUser===u ? ' active' : '');
    const n = ALBUMS.filter(a=>a.heard_by.includes(u)).length;
    div.innerHTML = '<span class="u-dot"></span>'+u+'<span style="color:var(--muted);font-size:.58rem;margin-left:auto">'+n+'</span>';
    div.onclick = () => setUser(u);
    list.appendChild(div);
  });
}

function toggleUserDD() {
  const dd  = document.getElementById('user-dd');
  const btn = document.getElementById('user-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 164) + 'px';
  }
}

function setUser(u) {
  selectedUser = u;
  document.getElementById('user-btn-label').textContent = u || 'All users';
  document.getElementById('user-dd').classList.remove('open');
  buildUserList();
  document.querySelectorAll('.card').forEach(card => {
    const n = parseInt(card.dataset.num);
    const a = ALBUMS.find(x=>x.n===n);
    if (!a) return;
    const heard = isHeard(a);
    card.dataset.heard = heard ? '1' : '0';
    card.classList.toggle('heard-user',  heard);
    card.classList.toggle('unheard-user', !heard);
  });
  applyFilters();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.genre-wrap')) document.getElementById('genre-dd').classList.remove('open');
  if (!e.target.closest('.user-wrap'))  document.getElementById('user-dd').classList.remove('open');
  if (!e.target.closest('.dec-wrap'))   document.getElementById('dec-dd').classList.remove('open');
});

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  ALBUMS.forEach(a => {
    const card = document.createElement('div');
    const heard = isHeard(a);
    card.className = 'card ' + (heard ? 'heard-user' : 'unheard-user');
    card.dataset.artist = (a.artist||'').toLowerCase();
    card.dataset.title  = (a.title||'').toLowerCase();
    card.dataset.genres = (a.genres||[]).join(',');
    card.dataset.heard  = heard ? '1' : '0';
    card.dataset.num    = a.n;
    const img = document.createElement('img');
    img.dataset.src = a.cover || COVER_PH;
    img.src = COVER_PH;
    img.alt = a.n;
    img.onerror = function(){ this.onerror=null; this.src=COVER_PH; };
    card.appendChild(img);
    const cs = a.aoty_critic_score != null ? '<span class="card-score c">'+a.aoty_critic_score+'</span>' : '';
    const us = a.aoty_user_score   != null ? '<span class="card-score u">'+a.aoty_user_score+'</span>'   : '';
    card.insertAdjacentHTML('beforeend',
      '<div class="card-overlay">'
      +'<div class="card-scores">'+cs+us+'</div>'
      +'<div class="card-title">'+a.title+'</div>'
      +'<div class="card-artist">'+a.artist+(a.year?' · '+a.year:'')+'</div>'
      +'</div>');
    card.addEventListener('click', () => openPanel(a, card));
    grid.appendChild(card);
  });
  document.querySelectorAll('img[data-src]').forEach(img=>imgObs.observe(img));
  applyFilters();
}

const _isMobile = () => window.matchMedia('(max-width:600px)').matches;

function closePanel() {
  document.getElementById('panel').classList.remove('panel-open');
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
}

function setGridSize(val) {
  document.getElementById('grid-label').textContent = val + '×';
  document.getElementById('grid').style.gridTemplateColumns = 'repeat('+val+',1fr)';
  try { localStorage.setItem('grid-cols-aoty', val); } catch(e) {}
}

function openPanel(a, cardEl) {
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
  cardEl.classList.add('active-card');
  if (_isMobile()) document.getElementById('panel').classList.add('panel-open');

  const coverWrap = document.getElementById('panel-cover-wrap');
  coverWrap.style.display='';
  document.getElementById('p-cover').src = a.cover || COVER_PH;
  document.getElementById('p-cover').onerror = function(){ this.src=COVER_PH; };

  const cs = a.aoty_critic_score != null ? '<span class="panel-score c">'+a.aoty_critic_score+' critic</span>' : '';
  const us = a.aoty_user_score   != null ? '<span class="panel-score u">'+a.aoty_user_score+' user</span>'     : '';
  document.getElementById('p-scores').innerHTML = cs + us;

  const links = [];
  if (a.aoty_url) links.push('<a class="panel-link aoty" href="'+a.aoty_url+'" target="_blank">AOTY</a>');
  if (a.rym)      links.push('<a class="panel-link rym"  href="'+a.rym+'"      target="_blank">RYM</a>');
  if (a.mbid)     links.push('<a class="panel-link"      href="https://musicbrainz.org/release-group/'+a.mbid+'" target="_blank">MusicBrainz</a>');
  if (a.yt_id)    links.push('<a class="panel-link yt"   href="https://youtu.be/'+a.yt_id+'" target="_blank">YouTube</a>');

  let ytBlock = '';
  if (a.yt_id) {
    ytBlock = '<iframe src="https://www.youtube.com/embed/'+a.yt_id+'" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
  } else {
    const q = encodeURIComponent(a.artist+' '+a.title+' full album');
    ytBlock = '<div class="panel-yt-placeholder"><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a></div>';
  }

  const genreTags = (a.genres||[]).map(g=>'<span class="panel-genre-tag">'+g+'</span>').join('');
  const heardLine = a.heard_by.length>0 ? '<div class="panel-heard-by">Heard by <b>'+a.heard_by.join(', ')+'</b></div>' : '';

  const descSrcs = [
    {key:'desc_lfm_album',  cls:'lfm',    lbl:'💿 Album · Last.fm'},
    {key:'desc_lfm_artist', cls:'artist',  lbl:'🎤 Artist · Last.fm'},
    {key:'desc_mb_album',   cls:'mb',      lbl:'💿 Album · MusicBrainz'},
    {key:'desc_mb_artist',  cls:'mb artist',lbl:'🎤 Artist · MusicBrainz'},
  ];
  const descBlocks = descSrcs.filter(s=>a[s.key]&&a[s.key].length>40)
    .map(s=>'<div class="desc-block"><div class="desc-source-label '+s.cls+'">'+s.lbl+'</div><div class="desc-source-text">'+a[s.key]+'</div></div>').join('');
  const bioHtml = descBlocks || '<span style="color:var(--muted);font-style:italic">No info available.</span>';

  document.getElementById('panel-body').innerHTML =
    '<div class="panel-title">'+a.title+'</div>'
    +'<div class="panel-artist">'+a.artist+'</div>'
    +'<div class="panel-year">'+(a.year||'')+'</div>'
    +(genreTags?'<div class="panel-genres">'+genreTags+'</div>':'')
    +heardLine
    +'<div class="panel-links">'+links.join('')+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">Listen on YouTube</div>'
    +'<div class="panel-yt-wrap">'+ytBlock+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">About</div>'
    +'<div class="panel-bio" id="p-bio">'+bioHtml+'</div>';
}

function setFilter(f) {
  filter=f;
  ['all','heard','unheard'].forEach(x => {
    const btn=document.getElementById('btn-'+x); if(!btn) return;
    btn.classList.toggle('active',x===f);
    if(x==='unheard') {
      btn.style.borderColor=f==='unheard'?'var(--pending)':'';
      btn.style.color=f==='unheard'?'var(--pending)':'';
      btn.style.background=f==='unheard'?'rgba(255,71,71,.06)':'';
    }
  });
  applyFilters();
}

function applyFilters() {
  const q=document.getElementById('search').value.toLowerCase().trim();
  let vis=0,visH=0;
  document.querySelectorAll('.card').forEach(c => {
    const mf=filter==='all'||(filter==='heard'&&c.dataset.heard==='1')||(filter==='unheard'&&c.dataset.heard==='0');
    const ms=!q||c.dataset.title.includes(q)||c.dataset.artist.includes(q);
    const cg=c.dataset.genres?c.dataset.genres.split(','):[];
    const mg=selectedGenres.size===0||[...selectedGenres].some(g=>cg.includes(g));
    const show=mf&&ms&&mg;
    c.classList.toggle('hidden',!show);
    if(show){vis++;if(c.dataset.heard==='1')visH++;}
  });
  document.getElementById('vis-count').textContent=vis;
  const uLabel = selectedUser ? ' ('+selectedUser+')' : '';
  document.getElementById('vis-heard').textContent=visH+' heard'+uLabel;
  document.getElementById('empty').style.display=vis===0?'block':'none';
}
