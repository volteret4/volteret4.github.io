roduced by the band and British record producer Ken Nelson, except for one track, \"High Speed\", which was produced by Chris Allison. Parachutes spawned the singles \"Shiver\", \"Yellow\", \"Trouble\" and \"Don't Panic\", with the latter being a limited release in Europe. \"Sparks\" gained notability during the 2020s after going viral on video platform TikTok as well. The album was also supported by the Parachutes Tour, which saw the band performing 131 shows .", "desc_lfm_artist": "Coldplay is a British alternative rock and britpop band formed in London in 1997. They consist of vocalist and pianist Chris Martin, guitarist Jonny Buckland, bassist Guy Berryman, drummer Will Champion and creative director Phil Harvey. They met at University College London and began playing music together from 1996 to 1998, initially calling themselves Starfish. Coldplay's music incorporates elements of soft rock, pop rock, piano rock, and post-britpop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 497, "title": "White Pony", "artist": "Deftones", "year": 2000, "cover": "https://dn721900.ca.archive.org/0/items/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679-18321083736.png", "aoty_url": "https://www.albumoftheyear.org/album/2214-deftones-white-pony.php", "aoty_critic_score": 72, "aoty_user_score": 88, "mbid": "a7d33e96-8e09-3aff-8629-44812a1b8489", "yt_id": "v1npHeOskdQ", "rym": "https://rateyourmusic.com/release/album/deftones/white-pony", "genres": ["metal", "post-hardcore", "shoegaze", "alternative metal", "post-metal", "nu metal"], "desc_lfm_album": "White Pony is the third studio album by American alternative metal band Deftones, released on June 20, 2000, through Maverick Records. It was produced by Terry Date, who produced the band's first two albums, Adrenaline and Around the Fur. Recording sessions took place between August and December 1999 at Larrabee Sound Studios in West Hollywood and The Plant Recording Studios in Sausalito, California. The album marked a significant growth in the band's sound, incorporating influences from post-hardcore, trip-hop, shoegaze, progressive rock, and post-rock into the alternative metal sound which they had become known for. White Pony was also the first .", "desc_lfm_artist": "Deftones is an American metal band from Sacramento, California, formed in 1988, consisting of Chino Moreno (lead vocals and guitar), Stephen Carpenter (guitar), Frank Delgado (keyboards and turntables), and Abe Cunningham (drums and percussion). Vega (formerly of Quicksand) took on bass duties from mid-2009 to ca. 2021 in substitution for Chi Cheng, who was seriously injured in an automobile accident in Santa Clara, California on November 4, 2008.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 498, "title": "The Moon & Antarctica", "artist": "Modest Mouse", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/581-the-moon-antarctica_153941.jpg", "aoty_url": "https://www.albumoftheyear.org/album/581-modest-mouse-the-moon-antarctica.php", "aoty_critic_score": 81, "aoty_user_score": 86, "mbid": "a8e26959-b3b2-3440-a74a-0dc06cd6310d", "yt_id": "V-ZVcL1k6Gg", "rym": "https://rateyourmusic.com/release/album/modest-mouse/the-moon-and-antarctica", "genres": ["Alternative Rock"], "desc_lfm_album": "The Moon & Antarctica is the third full-length album by American indie rock band Modest Mouse, first released by Epic Records on June 13, 2000. The album was the band’s first release on a major label and was released on both compact disc and vinyl LP. The album peaked at number 120 on the U.S. Billboard 200 albums chart. It was praised by critics and fans alike for its in-depth discussion of dense subject matter, as well as frontman Isaac Brock’s clever and introspective lyrics. The Moon & Antarctica was also hailed for being an expansion of the band’s unique .", "desc_lfm_artist": "Modest Mouse is an American alternative rock band which formed in 1993 in Issaquah, Washington, United States. The band's original lineup consisted of guitarist Isaac Brock, drummer Jeremiah Green and bassist Eric Judy. Since being signed to Sony's Epic Records in 2000, Modest Mouse has attained significant popular success with songs such as \"Float On\" and \"Dashboard.\"\n\nThe band's current configuration is Isaac Brock (vocals, guitar), Tom Peloso (strings, horns, bass, keyboards), Jim Fairchild (guitar), and Eric Judy (bass)).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 499, "title": "The Unseen", "artist": "Quasimoto", "year": 2000, "cover": "https://dn710008.ca.archive.org/0/items/mbid-e696c5a3-5efa-40b3-9886-25fef200951b/mbid-e696c5a3-5efa-40b3-9886-25fef200951b-38927398439.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7943-quasimoto-the-unseen.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": "c3a6dd79-a28d-3280-931c-42a0c6ac9b42", "yt_id": "nWqNXuQCaWo", "rym": "https://rateyourmusic.com/release/album/quasimoto/the-unseen", "genres": ["alternative hip hop", "hip hop", "jazz rap", "Jazz"], "desc_lfm_album": "The Unseen is the debut studio album by Quasimoto, a hip-hop duo composed of Madlib and his animated alter ego Lord Quas. It was released under Stones Throw Records on June 13, 2000. It was re-released in 2005 as a deluxe edition with a bonus CD containing the instrumental version of the album. Madlib took mushrooms for a month while creating the album. It was co-mixed by Kut Masta Kurt and Peanut Butter Wolf. The cover was designed by Jeff Jank. The song \"Low Class Conspiracy\" was on the soundtrack for the video game Tony Hawk's Underground. Nathan Rabin of .", "desc_lfm_artist": "Quasimoto is an alter ego of Madlib. Quasimoto first came to life on Madlib's personal beat tapes in the producer's early years in Oxnard CA, circa mid/late 1990s, in recordings that were meant for his own personal listening. \n\nAfter Madlib began working with Stones Throw Records, he was convinced to release Quasimoto, first as a featured MC on Peanut Butter Wolf's \"Styles Crews Flows Beats\" 1998. Finally, Madlib put out Quasimoto's debut solo album - The Unseen - in 2000.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere"]}, {"n": 500, "title": "Fantastic, Vol. 2", "artist": "Slum Village", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8671-fantastic-vol-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8671-slum-village-fantastic-vol-2.php", "aoty_critic_score": 73, "aoty_user_score": 83, "mbid": "b0c9b8ff-81b4-3507-a3af-844191a9c724", "yt_id": "UD-Y50DPanI", "rym": "https://rateyourmusic.com/release/album/slum-village/fantastic-vol-2", "genres": [], "desc_lfm_album": "\"Fantastic, Vol. 2\" (also referred to as \"Fantastic Volume II\") is the second album by American hip-hop group Slum Village, released on June 13, 2000. During the time of its release, the group was still composed of its earliest members T3, Baatin and J Dilla. The album was initially completed in 1998 for A&M Records shortly before the label became obsolete, leaving Slum Village in limbo for over a year. During this period, however, the group's producer Jay Dee greatly increased his profile through work with artists such as Common, Busta Rhymes, Erykah Badu and A Tribe Called Quest. At .", "desc_lfm_artist": "When Slum Village emerged in the late 1990s, the highly regarded Detroit trio of T3, Baatin and Jay Dee made a startling admission: their group was a liquid association with members coming and going during the group's evolution. True to their word, Slum Village has already gone through a number of line-up changes.  \n\nRapper-producer Jay Dee left after the group's first national album, 2000's Fantastic, Vol. 2 (Barak) and rhymer Elzhi was added to the mix for 2002's Trinity (Past, Present And Future)   (Barak/Capitol).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "armandwave", "verygooood"]}, {"n": 501, "title": "Rated R", "artist": "Queens of the Stone Age", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/rated-r-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1291-queens-of-the-stone-age-rated-r.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "7818bb84-ed80-3488-9f50-f9bf4347e372", "yt_id": "j4o7BlWmqK0", "rym": "https://rateyourmusic.com/release/album/queens-of-the-stone-age/rated-r", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Rated R is a 2000 album by Queens of the Stone Age, containing the first appearance of former Screaming Trees vocalist Mark Lanegan, and the first significant appearance of Nick Oliveri, on a Queens of the Stone Age record. Oliveri appeared briefly on the band's previous album (Queens of the Stone Age) in a voice sample. Los Angeles based drummer Gene Trautmann plays on tracks 1, 6, 7, and 9. .", "desc_lfm_artist": "Queens of the Stone Age is a rock band from Palm Desert, California, United States. The band is frequently labeled stoner rock, although they reject the label. They developed a style of riff-oriented, heavy music which the band's founder and mastermind Josh Homme described as \"robot rock\", saying that he \"wanted to create a heavy sound based on a solid jam, just pound it into your head\". Since then, their sound has evolved to incorporate a variety of different styles and influences.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 502, "title": "Dead as Dreams", "artist": "Weakling", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/58999-dead-as-dreams.jpg", "aoty_url": "https://www.albumoftheyear.org/album/58999-weakling-dead-as-dreams.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "6af3648a-aecd-3826-8a94-9a373a1b88f9", "yt_id": "mnjH-ZYe59c", "rym": "https://rateyourmusic.com/release/album/weakling/dead-as-dreams", "genres": ["Metal"], "desc_lfm_album": "Weakling's debut album; Dead As Dreams would be released somewhere in 1999. The same year, Weakling, as a band, disbanded. But Dead As Dreams wouldn't be released conventionally as an album. This version of Dead As Dreams was originally released independently by the band as a demo CD and cassette before being released and distributed by the tUMULt label somewhere in 2000. Dead As Dreams was recorded in December 1998, a year after they'd formed and a year before disbandment. Recorded at Louder Studios in the San Francisco area, Dead As Dreams consists of only five tracks and has a .", "desc_lfm_artist": "Grim, trance-like black metal from San Francisco. Features a member of genius instrumental math-metallers and Drag City recording artists, The Fucking Champs as well as The Gault and Asunder. - tUMULt Records\n\nThe band had one long play, 'Dead as Dreams' released by Tumult in 2000 (a year after it was recorded) and two demos, both released in 1998 and (both) with no vocals.\n\nBand leader John Gossard's latest band, Dispirit, is also a black metal band in somewhat similar style to Weakling, but with more doom metal influence.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 503, "title": "The Sophtware Slump", "artist": "Grandaddy", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/598-the-sophtware-slump_181442.jpg", "aoty_url": "https://www.albumoftheyear.org/album/598-grandaddy-the-sophtware-slump.php", "aoty_critic_score": 87, "aoty_user_score": 81, "mbid": "1feb6a47-2725-3f26-9762-3dc0ecffe4de", "yt_id": "c_IhRAwzk40", "rym": "https://rateyourmusic.com/release/album/grandaddy/the-sophtware-slump", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "The Sophtware Slump is the second studio album by American indie rock band Grandaddy. It was released on 29 May 2000. It is seen by some as a concept album about problems concerning modern technology in society. The album was released to critical acclaim. Being their second album, the title is a reference to a sophomore slump, a term given to an artist's second album which is seen to fail to live up to the first album. The album was reissued in 2011 with a second disc of bonus material containing B-sides, EP tracks, outtakes, and demos. The album was .", "desc_lfm_artist": "Grandaddy is an American rock band formed in Modesto, California in 1992 by singer/guitarist/keyboardist Jason Lytle, bassist Kevin Garcia, and drummer Aaron Burtch; although a noisy, lo-fi approach characterized early recordings like 1994's Complex Party Come Along Theories, with the 1995 additions of guitarist Jim Fairchild and keyboardist Tim Dryden the group's sound expanded exponentially over the course of subsequent efforts including the unreleased Don't Sock the Tryer and the 1996 EP A Pretty Mess by This One Band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 504, "title": "Fevers And Mirrors", "artist": "Bright Eyes", "year": 2000, "cover": "https://dn721606.ca.archive.org/0/items/mbid-64c2b3d0-f2ff-4e2f-9dad-4c926bb00a10/mbid-64c2b3d0-f2ff-4e2f-9dad-4c926bb00a10-26393498490.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e32bd271-a151-3813-981e-818583799a4c", "yt_id": "k5q62HKoLgM", "rym": null, "genres": ["indie rock", "alternative country"], "desc_lfm_album": "Fevers and Mirrors is the third album by the Nebraskan indie folk band Bright Eyes, recorded in 1999 and released on May 29, 2000. It was the 32nd release of the Omaha, Nebraska-based record label Saddle Creek Records. The album begins with a recording of a little boy reading Mitchell Is Moving, a book by Marjorie Weinman Sharmat. \"An Attempt to Tip the Scales\" includes what is ostensibly an interview with the band's frontman, Conor Oberst. However, Oberst has admitted that the interview was something of a joke, intended to poke fun at the dark tone of the album. Conor's .", "desc_lfm_artist": "Bright Eyes is an indie rock band consisting of American singer, guitarist, and songwriter Conor Oberst, multi-instrumentalist/producer Mike Mogis, keyboard/trumpet player Nate Walcott, and a rotating lineup of collaborators drawn primarily from Omaha, Nebraska, United States's indie music scene.  Having been deeply influenced early on by singer-songwriters David Dondero and Simon Joyner, Conor Oberst has been recording music since the age of 13. He released his first three albums at the ages of 13", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 505, "title": "The Marshall Mathers LP", "artist": "Eminem", "year": 2000, "cover": "https://dn720706.ca.archive.org/0/items/mbid-e13db7c6-7291-45bc-9ce9-3a4f9c9b5f55/mbid-e13db7c6-7291-45bc-9ce9-3a4f9c9b5f55-37454953221.jpg", "aoty_url": "https://www.albumoftheyear.org/album/964-eminem-the-marshall-mathers-lp.php", "aoty_critic_score": 73, "aoty_user_score": 84, "mbid": "b0fa91c8-0996-38f1-ab84-797f58d7c4eb", "yt_id": "0NmsogZClfM", "rym": "https://rateyourmusic.com/release/album/eminem/the-marshall-mathers-lp-6", "genres": ["hip hop", "pop rap", "hardcore hip hop", "horrorcore", "Pop"], "desc_lfm_album": "The Marshall Mathers LP is the third studio album by American rapper Eminem, released on May 23, 2000, by Aftermath Entertainment and Interscope Records. The album was produced mostly by Dr. Dre and Eminem, along with The 45 King, the Bass Brothers, and Mel-Man. Recorded over a two-month period in several studios around Detroit, the album features more introspective lyricism, including Eminem's thoughts on his rise from rags to riches, the criticism of his music, and his estrangement from his family and wife. A transgressive work, it incorporates horrorcore and hardcore hip-hop, while also featuring satirical songs. Featured appearances include .", "desc_lfm_artist": "Marshall Bruce Mathers III (born October 17, 1972 in St. Joseph, MO), known professionally as Eminem (stylized as EMINƎM), is an American rapper, songwriter, and record producer. He is credited with popularizing hip-hop in Middle America and is regarded as one of the greatest rappers of all time. His success is considered to have broken racial barriers to the acceptance of white rappers in popular music. While much of his transgressive work during the late 1990s and early 2000s made him a controversial figure", "desc_mb_album": "", "desc_mb_artist": "Please don't add \"Relapse: Refill\" as extra release group. It is part of the \"Relapse\" release group.", "heard_by": ["BipolarMuzik", "EliasJ72", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 506, "title": "Deltron 3030", "artist": "Deltron 3030", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8331-deltron-3030.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8331-deltron-3030-deltron-3030.php", "aoty_critic_score": 82, "aoty_user_score": 88, "mbid": "a55be3b5-1d86-317a-ac22-49655313bae0", "yt_id": "u9HQ0pbHcCw", "rym": "https://rateyourmusic.com/release/album/deltron-3030/deltron-3030", "genres": [], "desc_lfm_album": "Deltron 3030 is the debut album by the hip hop supergroup of the same name: rapper Del the Funky Homosapien, producer Dan the Automator, and DJ Kid Koala. It was released on May 23, 2000 by 75 Ark. The album was reissued on July 1, 2008 with 3 bonus remixes. The album's cover features a photograph of the Perisphere, a structure constructed for the 1939 New York World's Fair. It is a rap opera concept album set in a dystopian year 3030. The album's story casts Del in the role of Deltron Zero, a disillusioned mech soldier and interplanetary computer .", "desc_lfm_artist": "Deltron 3030 is an alternative hip-hop trio composed of producer Dan the Automator (as the Cantankerous Captain Aptos), rapper Del the Funky Homosapien (as Deltron Zero/Deltron Osiris), and DJ Kid Koala (as Skiznod the Boy Wonder). They also collaborate with a variety of other musicians under many futuristic pseudonyms.\n\nThe group's debut album Deltron 3030, released on May 23, 2000, is a concept album set in the year 3030 that tells of the dualistic", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 507, "title": "White Pepper", "artist": "Ween", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1565-white-pepper_091148.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1565-ween-white-pepper.php", "aoty_critic_score": 71, "aoty_user_score": 82, "mbid": "a078c388-e048-3768-bd4b-6ce24575dbb4", "yt_id": "HqgdNrGDo78", "rym": "https://rateyourmusic.com/release/album/ween/white-pepper", "genres": [], "desc_lfm_album": "White Pepper is the seventh studio album by American alternative rock band Ween, released on May 2, 2000. \"Even If You Don't\" and \"Stay Forever\" were realesed as singles, it is usually described as one of the more polished ween albums, meaning little to no silly or fun tracks.Despite this, the album was well recieved and marked as the most accessible Ween album. White Pepper peaked at 121 in the US Billboard 200. .", "desc_lfm_artist": "Ween is an American rock band from New Hope, Pennsylvania, formed in 1984 by Aaron Freeman and Mickey Melchiondo, who perform under the stage names Gene Ween and Dean Ween. The band is commonly categorized as alternative rock and is noted for a highly eclectic musical style drawing on influences including funk, psychedelia, soul, country, gospel, progressive rock, R&B, heavy metal, and punk rock.\n\nFrom their formation through 1989, Ween self-released several cassette-only recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 508, "title": "Figure 8", "artist": "Elliott Smith", "year": 2000, "cover": "https://dn710605.ca.archive.org/0/items/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae-18782213344.png", "aoty_url": "https://www.albumoftheyear.org/album/601-elliott-smith-figure-8.php", "aoty_critic_score": 73, "aoty_user_score": 87, "mbid": "2fd75c21-7a92-3bcc-b045-d5bab5c36d11", "yt_id": "B6sYRE65QIc", "rym": "https://rateyourmusic.com/release/album/elliott-smith/figure-8", "genres": ["folk rock", "chamber pop", "indie rock", "indie folk", "indie pop", "rock"], "desc_lfm_album": "Figure 8 is the fifth studio album by American singer-songwriter Elliott Smith. Released by DreamWorks Records on April 18, 2000, it became Smith's second release on a major label and the last album he would complete before his death. It was recorded at Sunset Sound in Hollywood, Sonora Studios in Los Angeles, Capitol Studios in Hollywood, and Abbey Road Studios in London (\"Stupidity Tries\", \"In the Lost and Found (Honky Bach)\" and \"Pretty Mary K\"). The album was also released on double vinyl 12\" on Bong Load Custom Records, and later rereleased by Plain Records in 2008. It is also .", "desc_lfm_artist": "Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create voca Lonnie Rashid Lynn, Jr. (born March 13, 1972 in Chicago, Illinois), better known by his stage name Common (previously Common Sense), is a Grammy award winning rapper, author and actor known for lyrics that focus on love and spirituality. Many people describe him as being a conscious hip hop artist who makes songs that send a message. He debuted in 1992 with the album Can I Borrow a Dollar? and maintained a significant underground following into the late 90s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 511, "title": "Pop", "artist": "Gas", "year": 2000, "cover": "https://dn711109.ca.archive.org/0/items/mbid-d002bee1-1a00-4087-af11-6dbf5cc8c2e0/mbid-d002bee1-1a00-4087-af11-6dbf5cc8c2e0-12463284461.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "8994e44b-0604-3091-a39c-0c2698920786", "yt_id": "NB7lTEEji08", "rym": null, "genres": ["modern classical"], "desc_lfm_album": "\"I had an image in my mind of a gaseous and nebulous sound, of an exhilarating streaming music which literally flows over, which has no beginning or end, no hard edges, only softness. My association was this music drifting through the coppice of a misty wood in vast sound spheres, a very elegiac sound repeated over and over in the far distance, held together by an invisible bass drum that comes marching by somewhere hidden in the woods, coming closer and fading away again. It was an acid experience, basically. It's drug music.\" -Wolfgang Voigt .", "desc_lfm_artist": "Several artists have released recordings under the name of Gas: two electronic music composers, Wolfgang Voigt and Mat Jarvis, furthermore a Japanese hardcore band, a rock band from Germany, and lastly an industrial band from Sweden.\n\n1) GAS is the project of Wolfgang Voigt of Kompakt Records, Cologne, who created hypnotic, bass-driven ambient/minimal techno on the German label Mille Plateaux.  Says Voigt of his music:  '(This is) music without beginning and without end", "desc enres": [], "desc_lfm_album": "The Noise Made by People is the debut studio album by English indie electronic band Broadcast. It was released on 20 March 2000 by Warp. Broadcast recorded the album for over two years, opting to produce it themselves after being dissatisfied with the results of earlier recording sessions helmed by external engineers. The album is a captivating blend of psychedelic pop, electronic, and dream pop elements. Broadcast's unique sound, characterized by nostalgic yet futuristic textures, is fully realized on The Noise Made by People. The band's ability to seamlessly merge vintage analog synths with contemporary electronic production techniques creates a .", "desc_lfm_artist": "Broadcast was a British ambient pop band formed in 1995 in Birmingham, England. The band's style explored 1960s influences like psychedelic pop and early electronic music through indie neo-psychedelia, heavily influenced by both the 1960s American psychedelic group The United States of America and the BBC Radiophonic Workshop, using many of the same electronic effects and atmospheres. Their music fell under the style of British first wave post-rock -adjacent retrofuturistic acts like Stereolab and Pram.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 514, "title": "He Has Left Us Alone But Shafts of Light Sometimes Grace the Corner of Our Rooms…", "artist": "Thee Silver Mt. Zion Memorial Orchestra", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14247-he-has-left-us-alone-but-shafts-of-light-sometimes-grace-the-corner-of-our-rooms_132736.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14247-thee-silver-mt-zion-memorial-orchestra-he-has-left-us-alone-but-shafts-of-light-sometimes-grace-the-corner-of-our-rooms.php", "aoty_critic_score": 83, "aoty_user_score": 84, "mbid": null, "yt_id": "H6puxDp57Lw", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 515, "title": "And Then Nothing Turned Itself Inside-Out", "artist": "Yo La Tengo", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/and-then-nothing-turned-itself-inside-out-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/357-yo-la-tengo-and-then-nothing-turned-itself-inside-out.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": "509d3727-ba34-3490-9921-21f4ab3b52cc", "yt_id": "eMbny_Q7m5s", "rym": "https://rateyourmusic.com/release/album/yo-la-tengo/and-then-nothing-turned-itself-inside-out/", "genres": [], "desc_lfm_album": "And Then Nothing Turned Itself Inside-Out is the ninth studio album by American indie rock band Yo La Tengo, released on February 22, 2000, by Matador Records. The album was recorded at Alex the Great in Nashville, Tennessee, and mixed at the Big House in Manhattan, New York City. The album was produced by Roger Moutenot. The title of the album is likely derived from a Sun Ra quote: \"...At first there was nothing...then nothing turned itself inside-out and became something\". The album artwork is made up of photographs by surrealist photographer and Yale professor Gregory Crewdson. .", "desc_lfm_artist": "Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "armandwave", "verygooood"]}, {"n": 516, "title": "Supreme Clientele", "artist": "Ghostface Killah", "year": 2000, "cover": "https://dn710604.ca.archive.org/0/items/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90-955219996.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1137-ghostface-killah-supreme-clientele.php", "aoty_critic_score": 81, "aoty_user_score": 86, "mbid": "e54744e2-7646-304d-abb8-2952671da3bb", "yt_id": "QZfdJx8Z1yw", "rym": "https://rateyourmusic.com/release/album/ghostface-killah/supreme-clientele", "genres": ["hip hop", "east coast hip hop", "boom bap", "hardcore hip hop", "abstract hip hop"], "desc_lfm_album": "Supreme Clientele is the second studio album of American rapper and Wu-Tang Clan member Ghostface Killah, released February 8, 2000 on Epic Records. The album showcases Ghostface's signature up-tempo, stream-of-consciousness rhyme style, and features guest appearances from Cappadonna, GZA, Masta Killa, Method Man, Raekwon, Redman, RZA, U-God, and others. If features members of what would become affiliates Theodore Unit and T.M.F. Supreme Clientele contains a large amount of production from group member RZA, who also re-worked and remixed beats from other producers involved, as a means to create a unified and cohesive sound for the album. Supreme Clientele debuted at .", "desc_lfm_artist": "Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 517, "title": "Voodoo", "artist": "D’Angelo", "year": 2000, "cover": "https://dn710902.ca.archive.org/0/items/mbid-7dbf3ed6-7927-3f ss)).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo"]}, {"n": 519, "title": "The Lioness", "artist": "Songs: Ohia", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6114-the-lioness.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6114-songs-ohia-the-lioness.php", "aoty_critic_score": 71, "aoty_user_score": 83, "mbid": "06162ecb-7f0e-3dcc-8391-aa3aadbbb330", "yt_id": "bvFsL8L5YUM", "rym": "https://rateyourmusic.com/release/album/songs-ohia/the-lioness", "genres": ["Rock"], "desc_lfm_album": "The Lioness is the fourth regular album by Songs: Ohia. It was recorded by Andrew Miller at Chem 19 Studios in Glasgow, Scotland with Alasdair Roberts, Geof Comings and members of Arab Strap, and released by Secretly Canadian on January 17, 2000. .", "desc_lfm_artist": "Songs: Ohia was largely a solo project for singer-songwriter Jason Molina (December 30, 1973 – March 16, 2013). Critics and fans alike have found considerable difficulty in trying to define the band's sound, usually settling on more general labels such as indie rock and folk-rock. Most are quick to draw comparisons to Neil Young and Will Oldham, (the latter of which Molina has collaborated with, alongside Alasdair Roberts, as the Amalgamated Sons of Rest).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 520, "title": "I Have a Special Plan for This World", "artist": "Current 93", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/102001-i-have-a-special-plan-for-this-world-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/102001-current-93-i-have-a-special-plan-for-this-world.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "e9d40f4e-6833-388c-bf56-7538f5c1dc15", "yt_id": "lxZpEFJhO6k", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Current 93 is an eclectic British music group, working since the early 1980s in experimental-based musical forms. The band was founded in London, UK in 1982 by David Tibet (né David Michael Bunting, renamed 'Tibet' by Genesis P-Orridge sometime prior to forming the group).\n\nTibet has been the only constant in the group, though Steven Stapleton (of Nurse With Wound) has appeared on nearly every Current 93 release. Michael Cashmore has also been a constant contributor since Thunder Perfect Mind.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["verygooood"]}];

let selectedGenres = new Set();
let selectedUser   = null;
const COVER_PH = 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22250%22%20height=%22250%22%20viewBox=%220%200%20250%20250%22%3E%3Crect%20width=%22250%22%20height=%22250%22%20fill=%22%23111%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%2260%22%20fill=%22none%22%20stroke=%22%23333%22%20stroke-width=%222%22/%3E%3C/svg%3E';

function isHeard(a) {
  if (selectedUser) return a.heard_by.includes(selectedUser);
  return a.heard_by.length > 0;
}

const imgObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting && e.target.dataset.src) {
      e.target.src = e.target.dataset.src;
      e.target.removeAttribute('data-src');
      imgObs.unobserve(e.target);
    }
  });
}, {rootMargin:'200px'});

function buildGenreList() {
  const list = document.getElementById('genre-list');
  list.innerHTML = '';
  GENRE_OPTS.forEach(([genre, count]) => {
    const div = document.createElement('div');
    div.className = 'genre-item';
    const id = 'g-'+genre.replace(/[^a-z0-9]/g,'_');
    div.innerHTML = '<input type="checkbox" id="'+id+'" value="'+genre+'" onchange="toggleGenre(\''+genre+'\',this.checked)"><label for="'+id+'">'+genre+'<span>'+count+'</span></label>';
    list.appendChild(div);
  });
}

function toggleGenreDD() {
  const dd  = document.getElementById('genre-dd');
  const btn = document.getElementById('genre-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  btn.classList.toggle('active', open || selectedGenres.size > 0);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 200) + 'px';
  }
}

function toggleGenre(g, checked) {
  if (checked) selectedGenres.add(g); else selectedGenres.delete(g);
  const badge = document.getElementById('genre-badge');
  const btn   = document.getElementById('genre-btn');
  if (selectedGenres.size>0) { badge.textContent=selectedGenres.size; badge.style.display=''; btn.classList.add('active'); }
  else { badge.style.display='none'; btn.classList.remove('active'); }
  applyFilters();
}

function clearGenres() {
  selectedGenres.clear();
  document.querySelectorAll('#genre-list input').forEach(i=>i.checked=false);
  document.getElementById('genre-badge').style.display='none';
  document.getElementById('genre-btn').classList.remove('active');
  applyFilters();
}

function toggleDecDD() {
  const dd  = document.getElementById('dec-dd');
  const btn = document.getElementById('dec-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = r.left + 'px';
  }
}

function buildUserList() {
  const list = document.getElementById('user-list');
  list.innerHTML = '';
  const allDiv = document.createElement('div');
  allDiv.className = 'user-item' + (!selectedUser ? ' active' : '');
  allDiv.innerHTML = '<span class="u-dot"></span>All users';
  allDiv.onclick = () => setUser(null);
  list.appendChild(allDiv);
  USERS.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item' + (selectedUser===u ? ' active' : '');
    const n = ALBUMS.filter(a=>a.heard_by.includes(u)).length;
    div.innerHTML = '<span class="u-dot"></span>'+u+'<span style="color:var(--muted);font-size:.58rem;margin-left:auto">'+n+'</span>';
    div.onclick = () => setUser(u);
    list.appendChild(div);
  });
}

function toggleUserDD() {
  const dd  = document.getElementById('user-dd');
  const btn = document.getElementById('user-btn');
  const open = !dd.classList.contains('open');
  dd.classList.toggle('open', open);
  if (open) {
    const r = btn.getBoundingClientRect();
    dd.style.top  = (r.bottom + 4) + 'px';
    dd.style.left = Math.max(4, r.right - 164) + 'px';
  }
}

function setUser(u) {
  selectedUser = u;
  document.getElementById('user-btn-label').textContent = u || 'All users';
  document.getElementById('user-dd').classList.remove('open');
  buildUserList();
  document.querySelectorAll('.card').forEach(card => {
    const n = parseInt(card.dataset.num);
    const a = ALBUMS.find(x=>x.n===n);
    if (!a) return;
    const heard = isHeard(a);
    card.dataset.heard = heard ? '1' : '0';
    card.classList.toggle('heard-user',  heard);
    card.classList.toggle('unheard-user', !heard);
  });
  applyFilters();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.genre-wrap')) document.getElementById('genre-dd').classList.remove('open');
  if (!e.target.closest('.user-wrap'))  document.getElementById('user-dd').classList.remove('open');
  if (!e.target.closest('.dec-wrap'))   document.getElementById('dec-dd').classList.remove('open');
});

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML='';
  ALBUMS.forEach(a => {
    const card = document.createElement('div');
    const heard = isHeard(a);
    card.className = 'card ' + (heard ? 'heard-user' : 'unheard-user');
    card.dataset.artist = (a.artist||'').toLowerCase();
    card.dataset.title  = (a.title||'').toLowerCase();
    card.dataset.genres = (a.genres||[]).join(',');
    card.dataset.heard  = heard ? '1' : '0';
    card.dataset.num    = a.n;
    const img = document.createElement('img');
    img.dataset.src = a.cover || COVER_PH;
    img.src = COVER_PH;
    img.alt = a.n;
    img.onerror = function(){ this.onerror=null; this.src=COVER_PH; };
    card.appendChild(img);
    const cs = a.aoty_critic_score != null ? '<span class="card-score c">'+a.aoty_critic_score+'</span>' : '';
    const us = a.aoty_user_score   != null ? '<span class="card-score u">'+a.aoty_user_score+'</span>'   : '';
    card.insertAdjacentHTML('beforeend',
      '<div class="card-overlay">'
      +'<div class="card-scores">'+cs+us+'</div>'
      +'<div class="card-title">'+a.title+'</div>'
      +'<div class="card-artist">'+a.artist+(a.year?' · '+a.year:'')+'</div>'
      +'</div>');
    card.addEventListener('click', () => openPanel(a, card));
    grid.appendChild(card);
  });
  document.querySelectorAll('img[data-src]').forEach(img=>imgObs.observe(img));
  applyFilters();
}

const _isMobile = () => window.matchMedia('(max-width:600px)').matches;

function closePanel() {
  document.getElementById('panel').classList.remove('panel-open');
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
}

function setGridSize(val) {
  document.getElementById('grid-label').textContent = val + '×';
  document.getElementById('grid').style.gridTemplateColumns = 'repeat('+val+',1fr)';
  try { localStorage.setItem('grid-cols-aoty', val); } catch(e) {}
}

function openPanel(a, cardEl) {
  document.querySelectorAll('.card.active-card').forEach(c=>c.classList.remove('active-card'));
  cardEl.classList.add('active-card');
  if (_isMobile()) document.getElementById('panel').classList.add('panel-open');

  const coverWrap = document.getElementById('panel-cover-wrap');
  coverWrap.style.display='';
  document.getElementById('p-cover').src = a.cover || COVER_PH;
  document.getElementById('p-cover').onerror = function(){ this.src=COVER_PH; };

  const cs = a.aoty_critic_score != null ? '<span class="panel-score c">'+a.aoty_critic_score+' critic</span>' : '';
  const us = a.aoty_user_score   != null ? '<span class="panel-score u">'+a.aoty_user_score+' user</span>'     : '';
  document.getElementById('p-scores').innerHTML = cs + us;

  const links = [];
  if (a.aoty_url) links.push('<a class="panel-link aoty" href="'+a.aoty_url+'" target="_blank">AOTY</a>');
  if (a.rym)      links.push('<a class="panel-link rym"  href="'+a.rym+'"      target="_blank">RYM</a>');
  if (a.mbid)     links.push('<a class="panel-link"      href="https://musicbrainz.org/release-group/'+a.mbid+'" target="_blank">MusicBrainz</a>');
  if (a.yt_id)    links.push('<a class="panel-link yt"   href="https://youtu.be/'+a.yt_id+'" target="_blank">YouTube</a>');

  let ytBlock = '';
  if (a.yt_id) {
    ytBlock = '<iframe src="https://www.youtube.com/embed/'+a.yt_id+'" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
  } else {
    const q = encodeURIComponent(a.artist+' '+a.title+' full album');
    ytBlock = '<div class="panel-yt-placeholder"><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a></div>';
  }

  const genreTags = (a.genres||[]).map(g=>'<span class="panel-genre-tag">'+g+'</span>').join('');
  const heardLine = a.heard_by.length>0 ? '<div class="panel-heard-by">Heard by <b>'+a.heard_by.join(', ')+'</b></div>' : '';

  const descSrcs = [
    {key:'desc_lfm_album',  cls:'lfm',    lbl:'💿 Album · Last.fm'},
    {key:'desc_lfm_artist', cls:'artist',  lbl:'🎤 Artist · Last.fm'},
    {key:'desc_mb_album',   cls:'mb',      lbl:'💿 Album · MusicBrainz'},
    {key:'desc_mb_artist',  cls:'mb artist',lbl:'🎤 Artist · MusicBrainz'},
  ];
  const descBlocks = descSrcs.filter(s=>a[s.key]&&a[s.key].length>40)
    .map(s=>'<div class="desc-block"><div class="desc-source-label '+s.cls+'">'+s.lbl+'</div><div class="desc-source-text">'+a[s.key]+'</div></div>').join('');
  const bioHtml = descBlocks || '<span style="color:var(--muted);font-style:italic">No info available.</span>';

  document.getElementById('panel-body').innerHTML =
    '<div class="panel-title">'+a.title+'</div>'
    +'<div class="panel-artist">'+a.artist+'</div>'
    +'<div class="panel-year">'+(a.year||'')+'</div>'
    +(genreTags?'<div class="panel-genres">'+genreTags+'</div>':'')
    +heardLine
    +'<div class="panel-links">'+links.join('')+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">Listen on YouTube</div>'
    +'<div class="panel-yt-wrap">'+ytBlock+'</div>'
    +'<div class="panel-divider"></div>'
    +'<div class="panel-section-label">About</div>'
    +'<div class="panel-bio" id="p-bio">'+bioHtml+'</div>';
}

function setFilter(f) {
  filter=f;
  ['all','heard','unheard'].forEach(x => {
    const btn=document.getElementById('btn-'+x); if(!btn) return;
    btn.classList.toggle('active',x===f);
    if(x==='unheard') {
      btn.style.borderColor=f==='unheard'?'var(--pending)':'';
      btn.style.color=f==='unheard'?'var(--pending)':'';
      btn.style.background=f==='unheard'?'rgba(255,71,71,.06)':'';
    }
  });
  applyFilters();
}

function applyFilters() {
  const q=document.getElementById('search').value.toLowerCase().trim();
  let vis=0,visH=0;
  document.querySelectorAll('.card').forEach(c => {
    const mf=filter==='all'||(filter==='heard'&&c.dataset.heard==='1')||(filter==='unheard'&&c.dataset.heard==='0');
    const ms=!q||c.dataset.title.includes(q)||c.dataset.artist.includes(q);
    const cg=c.dataset.genres?c.dataset.genres.split(','):[];
    const mg=selectedGenres.size===0||[...selectedGenres].some(g=>cg.includes(g));
    const show=mf&&ms&&mg;
    c.classList.toggle('hidden',!show);
    if(show){vis++;if(c.dataset.heard==='1')visH++;}
  });
  document.getElementById('vis-count').textContent=vis;
  const uLabel = selectedUser ? ' ('+selectedUser+')' : '';
  document.getElementById('vis-heard').textContent=visH+' heard'+uLabel;
  document.getElementById('empty').style.display=vis===0?'block':'none';
}

buildGenreList(); buildUserList(); buildGrid();
try{const sv=localStorage.getItem('grid-cols-aoty');const dv=_isMobile()?3:10;const v=sv?Math.min(20,Math.max(3,parseInt(sv))):dv;document.getElementById('grid-slider').value=v;setGridSize(v);}catch(e){setGridSize(_isMobile()?3:10);}
setTimeout(()=>{
  if(!_isMobile()){const first=document.querySelector('.card:not(.hidden)');if(first){const a=ALBUMS.find(x=>x.n===parseInt(first.dataset.num));if(a)openPanel(a,first);}}
},100);</script>
</body>
</html>
