yer was a band based in Brooklyn, New York. The band was formed in 2006 and consisted of three core members, Chris Keating, Ira Wolf Tuton, and Anand Wilder. They first came to attention after appearing at the SXSW festival in early 2007. Their debut album All Hour Cymbals was released in October 2007. Yeasayer described their music as \"Middle Eastern-psych-snap-gospel\". Live performances often include psychedelic visuals.\n\nYeasayer released their second studio album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere", "sdecandelario"]}, {"n": 118, "title": "In Rainbows", "artist": "Radiohead", "year": 2007, "cover": "https://dn710801.ca.archive.org/0/items/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30-6689244510.jpg", "aoty_url": "https://www.albumoftheyear.org/album/363-radiohead-in-rainbows.php", "aoty_critic_score": 87, "aoty_user_score": 93, "mbid": "6e335887-60ba-38f0-95af-fae7774336bf", "yt_id": "Al1o33CRXsU", "rym": "https://rateyourmusic.com/release/album/radiohead/in-rainbows/", "genres": ["alternative rock", "art rock", "krautrock", "art pop", "indie rock", "dream pop"], "desc_lfm_album": "In Rainbows is the seventh studio album by the English alternative rock band Radiohead. It was first released on October 10, 2007 as a digital download that customers could order for whatever price they saw fit, followed by a standard CD release in most countries during the last week of 2007. The album was released in North America on January 1, 2008. In Rainbows was Radiohead's first release after the end of their contract with EMI and the end of the longest gap between studio albums in their career. \"In Rainbows\" was recorded in London, Somerset, Wiltshire, and Oxfordshire with .", "desc_lfm_artist": "Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock.", "desc_mb_album": "", "desc_mb_artist": "Formed in Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 119, "title": "Comicopera", "artist": "Robert Wyatt", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/comicopera.jpg", "aoty_url": "https://www.albumoftheyear.org/album/411-robert-wyatt-comicopera.php", "aoty_critic_score": 81, "aoty_user_score": 70, "mbid": "7f98ef36-84c9-3e12-bb93-33197e5637af", "yt_id": "kc3o2Hb7wL4", "rym": "https://rateyourmusic.com/release/album/robert-wyatt/comicopera", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Robert Wyatt, born Robert Ellidge, in Bristol, UK on 28 January 1945, is an English musician, and a former member of the influential Canterbury scene band Soft Machine.\n\nAs a teenager, he lived with his parents in a fourteen-room Georgian guest-house, Wellington House, in Lydden near Canterbury. Here he was taught the drums by visiting American jazz drummer George Niedorf.\n\nIn 1962, Wyatt and Niedorf moved to Majorca where they stayed with the poet Robert Graves.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 120, "title": "Night Falls Over Kortedala", "artist": "Jens Lekman", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/night-falls-over-kortedala.jpg", "aoty_url": "https://www.albumoftheyear.org/album/907-jens-lekman-night-falls-over-kortedala.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "57c5901d-f140-34ba-a64b-414c1f9347f3", "yt_id": "X2rDNEvcPrE", "rym": "https://rateyourmusic.com/release/album/jens-lekman/night-falls-over-kortedala", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Jens Martin Lekman (born February 6, 1981 in Angered, Sweden) is a Swedish musician. He has released four albums and several EPs since 2003. His music can be described as guitar-based pop with heavy use of samples and strings, with lyrics that are often witty, romantic, and lachrymose. His work is often compared to that of Stephin Merritt of the The Magnetic Fields, Jonathan Richman and Morrissey.\n\nLekman recorded and released much of his material privately from 2000 to 2003 on CD-R.", "desc_mb_album": "", "desc_mb_artist": "1. [https://www.rogersandega.lima-city.de/lekman-disco.doc|Discography] (DL, .doc, de/en)\n2. [https://web.archive.org/web/20060218220916/http://www.secretlycanadian.com/jenslekman/dept.htm|Downloads (official)] for a couple of non-release tracks (2004-11 - 2005-01) (latest working snapshot, 2006)", "heard_by": ["Frikomid", "Nubis84", "alberto_gu"]}, {"n": 121, "title": "The Shepherd's Dog", "artist": "Iron & Wine", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-shepherds-dog.jpg", "aoty_url": "https://www.albumoftheyear.org/album/421-iron-wine-the-shepherds-dog.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "2b701e39-8a06-3ec0-bb30-f1cb1f291d1f", "yt_id": "kw_dCRhWeTw", "rym": null, "genres": [], "desc_lfm_album": "The Shepherd's Dog is the third full-length studio album by Iron & Wine, released on September 25, 2007. If bought at select retailers or if pre-ordered through Sub Pop, the album comes with a bonus disc featuring two unreleased tracks. \"Boy with a Coin\" is the first single and was released on July 10, 2007 via Sub Pop, including the single edit of the song along with two other tracks. The album debuted at number 24 on the U.S. Billboard 200 chart, selling about 32,000 copies in its first week. In 2008, \"Flightless Bird, American Mouth\" was used in the .", "desc_lfm_artist": "Iron & Wine is the stage and recording name of folk rock singer and composer Sam Beam (born July 26, 1974). He currently resides in Dripping Springs, Texas, outside Austin.  He  has released six studio albums, several EPs and singles, as well as a few download-only releases, which include a live album (a recording of his 2005 Bonnaroo performance). The name Iron & Wine is taken from a dietary supplement named \"Beef Iron & Wine\" that he found in a general store.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 122, "title": "White Chalk", "artist": "PJ Harvey", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/white-chalk.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1397-pj-harvey-white-chalk.php", "aoty_critic_score": 79, "aoty_user_score": 80, "mbid": "4e08e36d-59f2-3352-aa7c-4c55e4b20e14", "yt_id": "5YKbcWQNtE0", "rym": "https://rateyourmusic.com/release/album/pj-harvey/white-chalk", "genres": [], "desc_lfm_album": "White Chalk is the seventh studio album by English singer-songwriter and musician PJ Harvey, released on September 24, 2007, through Island Records. Work on the album started in 2006, with producer Flood and John Parish, who also worked on her To Bring You My Love and Is This Desire? albums. Other collaborators on White Chalk are Eric Drew Feldman and Jim White from Dirty Three. The first single released from White Chalk was \"When Under Ether\" on 17 September 2007 on digital download and 7\" vinyl. A second single, \"The Piano,\" was released on 26 November 2007. A third, \"The .", "desc_lfm_artist": "Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 123, "title": "Let's Stay Friends", "artist": "Les Savy Fav", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/lets-stay-friends.jpg", "aoty_url": "https://www.albumoftheyear.org/album/406-les-savy-fav-lets-stay-friends.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "c7d1e9b1-4387-3b4f-a306-cb09c5f7c549", "yt_id": "whBakC3VEcM", "rym": "https://rateyourmusic.com/release/album/les-savy-fav/lets-stay-friends", "genres": [], "desc_lfm_album": "released 2007 It is the band first album with second guitar player Andrew Reuland, who joined in 2006. The song ''Raging in the Plague Age'' is featured video game Grand Theft Auto 4 .", "desc_lfm_artist": "Les Savy Fav is an indie rock band which formed in Providence, Rhode Island, United States in 1995, where the members were attending the Rhode Island School of Design. The band moved to Brooklyn, New York shortly after graduating. The band consists of Tim Harrington (vocals), Seth Jabour (guitar), Andrew Reuland (guitar), Syd Butler (bass) and Harrison Haynes (drums).\n\nThe band has released five albums: \"3/5\" (1997), \"The Cat and the Cobra\" (1999), \"Go Forth\" (2001), \"Let's Stay Friends\" (2007) and \"Root for Ruin\" (2010).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 124, "title": "The Cleansing", "artist": "Suicide Silence", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/17199-the-cleansing.jpg", "aoty_url": "https://www.albumoftheyear.org/album/17199-suicide-silence-the-cleansing.php", "aoty_critic_score": 63, "aoty_user_score": 80, "mbid": "ed3e9829-5b91-3b46-9eaf-8747e3577e41", "yt_id": "msM_4uznjAg", "rym": "https://rateyourmusic.com/release/album/suicide-silence/the-cleansing", "genres": [], "desc_lfm_album": "The Cleansing is the debut album by the American deathcore band Suicide Silence. The album was released on September 18, 2007 through Century Media Records. Upon its release it debuted at #94 on the Billboard Top 200, selling 7,250 copies within the first week, and became one of the best-selling debut albums in Century Media history. The record was also released on vinyl format, with a limited pressing of 2,000 copies. Music videos have been released for the songs \"Unanswered\", \"The Price of Beauty\" and \"Bludgeoned to Death\". The music video for \"The Price of Beauty\" was banned from the .", "desc_lfm_artist": "Suicide Silence is an American deathcore band from Riverside, California. The band was established in 2002, and has released six studio albums, three EPs, and nineteen music videos. They were awarded the Revolver Golden God award for \"Best New Talent\" in 2009. The group currently consists of guitarists Chris Garza and Mark Heylmun, bassist Dan Kenny, vocalist Hernan \"Eddie\" Hermida and drummer Ernie Iniguez.\n\nHistory\nFormation, demos and self-titled debut EP (2002–2006)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 125, "title": "Colors", "artist": "Between the Buried and Me", "year": 2007, "cover": "https://dn721905.ca.archive.org/0/items/mbid-e1ca8464-3477-4568-b4e3-88aaa08b38d1/mbid-e1ca8464-3477-4568-b4e3-88aaa08b38d1-15533985949.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29577-between-the-buried-and-me-colors.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "97c06f4a-0206-3547-b5f4-c44be9334bc1", "yt_id": "iKspTicj-2w", "rym": "https://rateyourmusic.com/release/album/between-the-buried-and-me/colors/", "genres": ["progressive metal", "death metal", "metalcore", "Metal"], "desc_lfm_album": "Colors is the fourth studio album by the band Between the Buried and Me, released on September 18, 2007. Described by the band as \"adult contemporary progressive death metal\", the album runs together as a 64-minute epic split up into 8 tracks. In its first week it sold approximately 12,600 copies, reaching 57th on the Billboard 200--the first time the band cracked the top 100 on that list. Mike Portnoy of Dream Theater recently named Colors his album of the year, whilst Ultimate-Guitar.com also named it Album of the Year in their annual This Year in Metal. On the inside .", "desc_lfm_artist": "Between the Buried and Me is a progressive metal band from Raleigh, North Carolina, comprised of former members of metalcore acts Prayer For Cleansing and Glass Casket. They have recorded eleven albums in addition to a covers album and an EP. Their style is diverse, with influences ranging from thrash, death metal, jazz, math rock and melodic hardcore, to progressive or experimental artists such as Dream Theater, Mike Patton, King Crimson, Queen, and The Mars Volta.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 126, "title": "Graduation", "artist": "Kanye West", "year": 2007, "cover": "https://dn710008.ca.archive.org/0/items/mbid-08e0cab1-e95c-4b33-8ed3-1337d934fb7f/mbid-08e0cab1-e95c-4b33-8ed3-1337d934fb7f-24202595971.png", "aoty_url": "https://www.albumoftheyear.org/album/435-kanye-west-graduation.php", "aoty_critic_score": 77, "aoty_user_score": 86, "mbid": "d44c50ad-61fd-3fce-95fc-27024d7f1d30", "yt_id": "WwYbTxOZF0k", "rym": "https://rateyourmusic.com/release/album/kanye-west/graduation", "genres": ["electropop", "alternative hip hop", "hip hop", "east coast hip hop", "pop rap"], "desc_lfm_album": "Graduation is the third studio album by American rapper Kanye West, released on September 11th, 2007, by Def Jam Recordings and Roc-A-Fella Records. The album marked a turning point in West's career, as he moved away from the soul-sample-heavy production of his earlier work and embraced a more electronic, stadium-ready sound inspired by house music, indie rock, and the aesthetics of arena tours. Recording sessions for Graduation took place between 2005 and 2007 at various studios in New York City and Los Angeles. West took full control over the production direction, crafting a more futuristic, synth-heavy sound, while also collaborating .", "desc_lfm_artist": "Ye, born Kanye Omari West on June 8, 1977, is an American rapper, singer, songwriter, record producer, and fashion designer. He is one of the most prominent figures in hip hop, known for his diverse musical style and polarizing cultural and political commentary. After dropping out of college to pursue a career in music, West began producing for regional artists in the Chicago area. As an in-house producer for Roc-A-Fella Records, he co-produced albums including Jay-Z's The Blueprint (2001) before signing with the label as a recording artist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 127, "title": "Strawberry Jam", "artist": "Animal Collective", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/305-strawberry-jam_171247.jpg", "aoty_url": "https://www.albumoftheyear.org/album/305-animal-collective-strawberry-jam.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "89e4f726-2b6f-3f15-992e-b52105f53899", "yt_id": "OogYQ59B76I", "rym": "https://rateyourmusic.com/release/album/animal-collective/strawberry-jam", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Strawberry Jam is the seventh studio album by Baltimore based band Animal Collective. It was released on September 11, 2007, and is the band's first release for Domino Records. The title and track listing were revealed by band member Geologist on the Collected Animals message board on May 16, 2007. The press response to Strawberry Jam was mostly positive, with some lauding its unique sound as a large step forward in the band's evolution. The album charted on the Billboard Top 200, debuting and peaking at #72. Strawberry Jam was released on iTunes with an exclusive live version of \"Cuckoo .", "desc_lfm_artist": "Animal Collective are an American experimental pop band formed in Baltimore, Maryland in 1999. The group consists of David Portner (Avey Tare), Noah Lennox (Panda Bear), Brian Weitz (Geologist), and Josh Dibb (Deakin). Their music blends a wide range of styles, including psychedelia, freak folk, noise, and electronica, incorporating elements such as loops, drones, sampling, vocal harmonies, and sound collage. The band is known for its distinctive approach to experimental rock and pop music.", "desc_mb_album": "", "desc_mb_artist": "=== Don't add these albums here: ===\r\n[https://musicbrainz.org/artist/22568c9d-8ef3-4224-b994-8e0658e1082a|Avey Tare] and [https://musicbrainz.org/artist/fd3c3f9f-a471-498e-ab3a-940ac20b6bbd|Panda Bear] — [https://musicbrainz.org/release-group/b15e243c-8279-3b5b-b773-fca282c8ce54|Spirit They’re Gone Spirit They’ve Vanished]\r\n[https://musicbrainz.org/artist/22568c9d-8ef3-4224-b994-8e0658e1082a|Avey Tare], [https://musicbrainz.org/artist/fd3c3f9f-a471-498e-ab3a-940ac20b6bbd|Panda Bear] & [https://musicbrainz.org/artist/c836703d-f5e2-4e54-92c3-1792ef4d0d6f|Geologist] — [https://musicbrainz.org/release-group/8b0d9da7-df54-3f0f-acb1-568186b9891a|Danse Manatee]\r\n[https://musicbrainz.org/artist/1bd864ba-34a1-4d34-8922-559e58838a60|Campfire Songs] — [https://musicbrainz.org/release-group/7f1a5f85-", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 128, "title": "None Shall Pass", "artist": "Aesop Rock", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/none-shall-pass.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1395-aesop-rock-none-shall-pass.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "9c879c63-606d-375f-aaf7-3618d94655b5", "yt_id": "nSRgmXF5VeE", "rym": "https://rateyourmusic.com/release/album/aesop-rock/none-shall-pass", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Aesop Rock (born Ian Bavitz on June 5, 1976) is an alternative hip hop artist/producer from Long Island, New York, United States. He has released 12 albums: \"Music for Earthworms\" (1997), \"Float\" (1999), \"Labor Days\" (2001), \"Bazooka Tooth\" (2003),  \"None Shall Pass\" (2007), \"Skelethon\" (2012), \"The Impossible Kid\" (2016),  \"Spirit World Field Guide\" (2020), \"Garbology\" (2021), \"Integrated Tech Solutions\" (2023), \"Black Hole Superette\" (2025), and \"I Heard It's A Mess There Too\" (2025).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 129, "title": "Lady's Bridge", "artist": "Richard Hawley", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8389-ladys-bridge.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8389-richard-hawley-ladys-bridge.php", "aoty_critic_score": 82, "aoty_user_score": 75, "mbid": "57090660-82ac-3042-b06e-e5e669aaecd1", "yt_id": "R76vMj96z_A", "rym": "https://rateyourmusic.com/release/album/richard-hawley/ladys-bridge/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Richard Hawley (born Richard Willis Hawley, 17 January 1967, Sheffield, United Kingdom) is a critically-acclaimed guitarist, singer, songwriter and producer. Hawley initially found success as a member of Britpop band Longpigs in the 1990's, and formerly Treebound Story. When a drug-filled torpor after an extensive tour of America brought the band to the brink of extinction in 1997, Hawley was asked to play with Pulp by his close friend and Pulp frontman Jarvis Cocker.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 130, "title": "Below the Heavens", "artist": "Blu & Exile", "year": 2007, "cover": "https://ia800109.us.archive.org/20/items/mbid-6fca2b00-b332-311b-9dbe-ed76b9c861e9/mbid-6fca2b00-b332-311b-9dbe-ed76b9c861e9-4920076651.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4986-blu-exile-below-the-heavens.php", "aoty_critic_score": 74, "aoty_user_score": 86, "mbid": "173986f9-4de4-3cc8-b8d3-cf274fbaf7b5", "yt_id": "NJfsnbhejn8", "rym": "https://rateyourmusic.com/release/album/blu-and-exile/below-the-heavens", "genres": ["hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "Blu is definitely a leader in the new school of Los Angeles emcees. His presence is undeniable, while his music captivates audiences regardless of race, class, and gender. His delivery flows flawlessly, while his content reflects the joy and pain of working class youth everywhere. Exile is a producer, DJ and occasional emcee previously known for being a member of the duo Emanon, along with Aloe Blacc. His style of production is known for its \"laid back soulful vibes\" and is influenced by such producers as J Dilla and Madlib.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 131, "title": "Kala", "artist": "M.I.A.", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/kala-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/409-mia-kala.php", "aoty_critic_score": 86, "aoty_user_score": 81, "mbid": "44261ea6-06cf-3fd3-a05c-42dee49c295a", "yt_id": "w-itOhPuOSU", "rym": "https://rateyourmusic.com/release/album/m_i_a/kala", "genres": [], "desc_lfm_album": "Kala is the second studio album by M.I.A. and it was released by XL Recordings on 2007. The album ranges from dance music to alternative hip hop and makes extensive use of world music, particularly South Asian music such as that of the urumee, a drum used in gaana music native to Tamil Nadu, India. It reached number 18 on the Billboard 200 chart, 172 places higher than Arular, and topped the magazine's Top Electronic Albums chart. In the United Kingdom it reached number 39 on the UK Albums Chart, 59 places higher than her debut album. Kala has spawned .", "desc_lfm_artist": "Mathangi Arulpragasam (born 18 July 1975), known professionally as M.I.A. (an initialism for both \"Missing in action\" and \"Missing in Acton\"), is a British singer, rapper, songwriter, record producer, and activist. Her music combines elements of alternative, dance, electronic, hip hop and world music with electronic instruments and samples. \n\nBorn in London to Sri Lankan Tamil parents, M.I.A. and her family moved to Jaffna in northern Sri Lanka when she was six months old.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Nubis84", "alberto_gu", "armandwave", "verygooood"]}, {"n": 132, "title": "The Stage Names", "artist": "Okkervil River", "year": 2007, "cover": "https://dn721902.ca.archive.org/0/items/mbid-c7a2198b-27fb-47e1-b54c-ee9af258e067/mbid-c7a2198b-27fb-47e1-b54c-ee9af258e067-26400682378.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1148-okkervil-river-the-stage-names.php", "aoty_critic_score": 81, "aoty_user_score": 80, "mbid": "71220045-0ca9-3c02-b567-36f65b753062", "yt_id": "7RrKpqfDOek", "rym": null, "genres": ["indie rock"], "desc_lfm_album": "The Stage Names is the fourth full-length studio album by American alt-country band Okkervil River, released on August 7, 2007. The album was recorded in Austin, Texas, with longtime Okkervil producer Brian Beattie, and with mixing from Spoon drummer and producer Jim Eno. Like other Okkervil River albums, the accompanying artwork is the work of artist William Schaff. The cover refers to a line from Unless It's Kicks. The record was also released as a limited-edition 2-CD set that included a second disc of solo acoustic demos. A newly recorded version of Love to a Monster, which appeared in rough .", "desc_lfm_artist": "Okkervil River is an indie/folk rock band from Austin, Texas USA.  Formed in 1998, the band takes its name from a short story by Russian author Tatyana Tolstaya. The band currently consists of Will Sheff (vocals, guitar), Will Graefe (guitar), Sarah K. Pedinotti (keyboards), Benjamin Lazar Davis (bass) and Cully Symington (drums).\n\nThe band self-released their first album, Stars Too Small to Use, which led them to the South by Southwest music festival.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 133, "title": "Souvenirs D'Un Autre Monde", "artist": "Alcest", "year": 2007, "cover": "https://dn710302.ca.archive.org/0/items/mbid-b546e8f5-9ade-4c7a-9ac3-ddf4c3946d77/mbid-b546e8f5-9ade-4c7a-9ac3-ddf4c3946d77-18065869436.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "bd1d028d-fa98-3fe6-b61c-18a0a990cb7e", "yt_id": "HiuFNyUZ9VI", "rym": null, "genres": ["shoegaze", "post-metal", "blackgaze"], "desc_lfm_album": "Souvenirs d'un autre monde (/suv(ə)niʀ dœ̃ otʀ mɔ̃d/, French for Memories of Another World) is the first full-length album by Alcest, released in August 2007. The album differs greatly from Alcest's earlier work, as its sound is similar to post-rock and shoegaze with very little black metal incorporated at all. Line-up Neige — vocals, all instruments, composition, lyrics, recording Session Audrey Sylvain — guest vocals on « Sur l'autre rive je t'attendrai » Staff Rachel Robinson — cover pictureFursy Teyssier — layoutFursy Teyssier, Neige — other picturesMK — production .", "desc_lfm_artist": "Alcest (/al.sɛst/) is a French blackgaze act formed in Bagnols-sur-Cèze, Occitanie in 2000 by multi-instrumentalist Neige (Stéphane Paut).\n\nIt was originally conceived as a solo project, though it would eventually take on the form of a full band as Aegnor (now known as La Sale Famine de Valfunde) and Argoth, with whom Neige played in Peste Noire, joined the fray and released a four-track demo entitled Tristesse hivernale in 2001. This demo was a more straightforward black metal affair, much different from what would happen next.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 134, "title": "Ga Ga Ga Ga Ga", "artist": "Spoon", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/418-ga-ga-ga-ga-ga_005230.jpg", "aoty_url": "https://www.albumoftheyear.org/album/418-spoon-ga-ga-ga-ga-ga.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "9fe3ccc2-9649-3ac3-bc7f-a82d9b6ee815", "yt_id": "Eo_NK_JDWYc", "rym": null, "genres": [], "desc_lfm_album": "Ga Ga Ga Ga Ga is the sixth studio album by Spoon. It was released on Merge Records on July 10, 2007. It received critical acclaim and appeared on several year-end album lists. The album debuted at number 10 on the U.S. Billboard 200 and at number 1 on the Billboard Top Independent Albums, selling 46,000 copies in its first week. By January 2010, the album had sold 318,000 copies in the United States. It was supported by two singles; \"The Underdog\" and \"Don't You Evah\". The album's title is the former title for the song \"The Ghost of You .", "desc_lfm_artist": "Spoon is an American indie rock band from Austin, Texas. The band was formed in late 1993 by lead singer/guitarist Britt Daniel and drummer Jim Eno. Current members also include: Eric Harvey (keyboard, guitar, percussion, backing vocals) and Rob Pope (bass, backing vocals - replaced Joshua Zarbo in 2007).\nAfter releasing their debut LP Telephono on Matador Records, the band signed with Elektra in 1998, but the contract was dropped soon after the band released A Series of Sneaks.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 135, "title": "†", "artist": "Justice", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/cross.jpg", "aoty_url": "https://www.albumoftheyear.org/album/972-justice-.php", "aoty_critic_score": 78, "aoty_user_score": 84, "mbid": null, "yt_id": "716ZRDeac-s", "rym": null, "genres": [], "desc_lfm_album": "Cross (stylized as †; titled Justice on digital platforms) is the debut studio album by French electronic music duo Justice. It was first released digitally on June 11, 2007, and later on June 18 through Ed Banger Records and Because Music in most countries and Vice Records in the United States. Recorded during 2005 and 2006 in Paris, Cross was composed as an \"opera-disco\" album. It features many samples and \"microsamples\" throughout, with about 400 albums being used as sampled material. The song \"D.A.N.C.E.\" is a tribute to Michael Jackson. French musician Mehdi Pinson appears on \"DVNO\", and vocalist Uffie .", "desc_lfm_artist": "Justice is a French electronic music duo consisting of Gaspard Augé and Xavier de Rosnay. They are known for incorporating strong rock and disco influences into their music and image.\n\nThe band's debut album Cross was released in June 2007 to critical acclaim. The album was later nominated for a Grammy Award for Best Electronic/Dance Album and came in at number 15 on Pitchfork's \"Top 50 Albums of 2007\" and number 18 on Blender's \"25 Best Albums of 2007\" list.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 136, "title": "For Emma, Forever Ago", "artist": "Bon Iver", "year": 2007, "cover": "https://ia801906.us.archive.org/19/items/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51-11344065108.jpg", "aoty_url": "https://www.albumoftheyear.org/album/804-bon-iver-for-emma-forever-ago.php", "aoty_critic_score": 84, "aoty_user_score": 87, "mbid": "187935b5-a0a4-3e6f-9684-48b67a5190a1", "yt_id": "AaUQ6ToaPqw", "rym": "https://rateyourmusic.com/release/album/bon-iver/for-emma-forever-ago/reviews/1", "genres": ["folk rock", "folk", "contemporary folk", "baroque pop", "country", "indie folk"], "desc_lfm_album": "For Emma, Forever Ago is the debut album from Wisconsin band Bon Iver. It was self-released in 2007 and received wider release on the Jagjaguwar label in February 2008 (and on the 4AD label in the UK in May 2008). The album was widely acclaimed, receiving spots on critics' end-of-the-year lists, as well as several awards. Following the break-up of his previous band DeYarmond Edison, Justin Vernon, suffering from mononucleosis, secluded himself in a cabin in Medford, Wisconsin for three months planning to \"hibernate.\" Three months of solitude resulted in the creation of For Emma, Forever Ago. \"All of his .", "desc_lfm_artist": "Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 137, "title": "Desire", "artist": "Pharoahe Monch", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7234-desire.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7234-pharoahe-monch-desire.php", "aoty_critic_score": 87, "aoty_user_score": 79, "mbid": "4f8cf641-5b84-34b3-b5bf-50552ab39009", "yt_id": "Hb_P4UXabz4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Monch released three albums as part of the rap duo, Organized Konfusion with partner Prince Po: The self-titled Organized Konfusion, Stress: The Extinction Agenda, and The Equinox. The duo handled a large amount of production on these albums themselves. All albums received positive critical reviews, but moderate sales. As a result, the duo split up after recording their final album The Equinox in 1997. Prince Poetry has since denied the possibility of an Organized Konfusion reunion.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 138, "title": "Boxer", "artist": "National", "year": 2007, "cover": "https://dn711109.ca.archive.org/0/items/mbid-1401fb2a-e032-448f-82bd-79bf6e6c121b/mbid-1401fb2a-e032-448f-82bd-79bf6e6c121b-36604813086.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "9facb475-4c5f-369b-9b93-1280e6669090", "yt_id": "zP6FAhP9uEg", "rym": "https://rateyourmusic.com/release/album/the-national/boxer", "genres": ["post-punk", "chamber pop", "indie rock", "post-punk revival"], "desc_lfm_album": "", "desc_lfm_artist": "http://www.myspace.com/nationalbr\nNational is an experimental electronic duo Agnaldo Mori (teclados e efeitos) and Glauco Félix (teclados, guitarra, DJ efeitos) from Sao Paulo, Brazil. They work with all kinds of homemade experimentations with music. With many different instruments, lots of keyboards and synthesizers, guitars, pianos, computers, sequencers, samplers and voice effects, they produce an unclassifiable and eclectic electronic sound. They are extremely eccentric and they do everything themselves", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 139, "title": "Mirrored", "artist": "Battles", "year": 2007, "cover": "https://ia801504.us.archive.org/33/items/mbid-c8f9075f-65b3-4a9b-b0df-2b4f2f210d79/mbid-c8f9075f-65b3-4a9b-b0df-2b4f2f210d79-32502834641.jpg", "aoty_url": "https://www.albumoftheyear.org/album/412-battles-mirrored.php", "aoty_critic_score": 82, "aoty_user_score": 80, "mbid": "4fb19c93-dc39-3f09-9859-a4a4de2cfa85", "yt_id": "Ta7Y8I6-sN4", "rym": "https://rateyourmusic.com/release/album/battles/mirrored", "genres": ["experimental rock", "indie rock", "post-rock", "math rock"], "desc_lfm_album": "Mirrored is the critically acclaimed debut full-length album by U.S. math rock group Battles. It was released on May 14, 2007 in the United Kingdom, and on May 22, 2007 in the United States. This is the first time the band has incorporated vocals into their songs, as the previous EPs were completely instrumental (aside from beatboxing on the tracks \"Dance\" and \"Fantasy\"). .", "desc_lfm_artist": "Battles are an American experimental rock band founded in New York City in 2002 and now consisting of John Stanier (of Tomahawk and The Mark of Cain, formerly of Helmet) on drums, and guitarist/keyboardist Ian Williams (formerly of Don Caballero and Storm & Stress) on guitars and keyboards. Until 2010 they were joined by Tyondai Braxton (son of avant-garde jazz composer and multi-instrumentalist Anthony Braxton) on vocals, keyboards and guitar, who departed the band amicably in order to concentrate on his solo career.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 140, "title": "Weighing Souls With Sand", "artist": "The Angelic Process", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/40890-weighing-souls-with-sand.jpg", "aoty_url": "https://www.albumoftheyear.org/album/40890-the-angelic-process-weighing-souls-with-sand.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "c7d8228d-9cda-3a75-87ae-3365ec965cbf", "yt_id": "G9ZiU7ahZso", "rym": "https://rateyourmusic.com/release/album/the-angelic-process/weighing-souls-with-sand/", "genres": ["Metal", "Alternative Rock"], "desc_lfm_album": "\"Weighing Souls with Sand\" was the third and the last album released by ambient drone metal/shoegaze husband-and-wife band The Angelic Process following the 2006 re-release of \"Coma Waering\". The story line of the album continues where \"Coma Waering\" left off. Following that album's tale of a man lapsing into a coma and eventually dying, \"Weighing Souls with Sand\" concerns the emotionally devastating struggle of said man's widow in the aftermath of her husband's death, a tale that ends with her taking her own life. .", "desc_lfm_artist": "The Angelic Process was an American drone metal duo formed in 1999 in Georgia. Initially a solo project by Kris Angylus (Kristopher Fairchild), the band became a husband-and-wife collaboration when Monica Dragynfly (Monica Henson) joined on bass and backing vocals in 2005. Pioneers of the ambient drone metal subgenre, The Angelic Process forged a distinctive sound that fused layered guitar drone, shoegaze textures, and complex time signatures with haunting dual vocals.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 141, "title": "New Moon", "artist": "Elliott Smith", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/414-new-moon_104832.jpg", "aoty_url": "https://www.albumoftheyear.org/album/414-elliott-smith-new-moon.php", "aoty_critic_score": 83, "aoty_user_score": 85, "mbid": "313a9a34-e1f2-39d7-a17d-8fa69fac4fa6", "yt_id": "tdoBT_4PArg", "rym": null, "genres": [], "desc_lfm_album": "New Moon is a posthumous compilation album by Elliott Smith, released on May 8, 2007. It contains twenty-four previously unreleased songs, most recorded between 1994 and 1997 during the sessions for Smith's albums Elliott Smith and Either/Or. In August 2006, an \"excited\" employee at Kill Rock Stars made a post on the label's official website stating that an extended version of Either/Or would be released in 2006 to commemorate the record's tenth anniversary. This information was quickly pulled from the website, as the album was in very early planning stages. Eventually, Kill Rock Stars announced that Either/Or: Extended Edition (as .", "desc_lfm_artist": "Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario"]}, {"n": 142, "title": "The Reminder", "artist": "Feist", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-reminder-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/433-feist-the-reminder.php", "aoty_critic_score": 79, "aoty_user_score": 81, "mbid": "4ead9018-fbb8-3e24-9094-bff7adce5f33", "yt_id": "ltYq-jalYm0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There is more than one artist with this name, including: \n1) Feist is Canadian singer and songwriter Leslie Feist; \n2) Feist was a British drum 'n' bass artist active during the 1990s. \n\n1) Feist is Canadian singer and songwriter Leslie Feist (born in Amherst, Nova Scotia, on 13 February 1976) who performs as a solo artist and also as a member of Broken Social Scene. Because her father is American, Feist has dual Canadian-U.S. citizenship. \nRaised in Regina and Calgary", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "paqueradejere"]}, {"n": 143, "title": "Favourite Worst Nightmare", "artist": "Arctic Monkeys", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/352-favourite-worst-nightmare_160418.jpg", "aoty_url": "https://www.albumoftheyear.org/album/352-arctic-monkeys-favourite-worst-nightmare.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "f113fa38-7908-3ec9-8145-d2455e78a8b2", "yt_id": "XRubr417e6k", "rym": "https://rateyourmusic.com/release/album/arctic-monkeys/favourite-worst-nightmare", "genres": [], "desc_lfm_album": "Favourite Worst Nightmare is the second studio album by Sheffield indie rock band Arctic Monkeys. It was first released in Japan on 18 April 2007 before being released around the world. Recorded in East London's Miloco Studios with producers James Ford and Mike Crossey, the album was preceded by the release of new single \"Brianstorm\" on 16 April 2007. In its first week following release the album sold over 220,000 copies, emulating Whatever People Say I Am, That's What I'm Not in going straight to number one in the UK Albums Chart, albeit selling 100,000 copies fewer than their record-breaking .", "desc_lfm_artist": "Arctic Monkeys are an alternative rock band formed in Sheffield, South Yorkshire, England in 2002 after meeting at Stocksbridge High School. The band consists of Alex Turner (vocals, guitar, piano), Jamie Cook (guitar), Nick O'Malley (backing vocals, bass) and Matt Helders (drums, vocals). Founding bassist Andy Nicholson left in 2006.\n\nThey are one of the first bands to come to public attention via the Internet via MySpace, despite none of them having an account.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 144, "title": "Fear of a Blank Planet", "artist": "Porcupine Tree", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8996-fear-of-a-blank-planet.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8996-porcupine-tree-fear-of-a-blank-planet.php", "aoty_critic_score": 80, "aoty_user_score": 85, "mbid": "bca73156-8f32-3e56-8d83-2fb537b8fb6e", "yt_id": "jKM5dampSOQ", "rym": "https://rateyourmusic.com/release/album/porcupine-tree/fear-of-a-blank-planet", "genres": ["Metal", "Rock"], "desc_lfm_album": "Fear of a Blank Planet (also Transmission 6.1) is the ninth studio album by British progressive rock band Porcupine Tree which was released on April 16, 2007 in the UK and Europe, and on April 24, 2007 in the United States. Steven Wilson has mentioned that the album's title is a direct reference to the 1990's Public Enemy album, Fear of a Black Planet. He explained that race relations were a major issue when it was released and he sees \"coming to terms with information technology and...the 21st century\" as a modern issue. The album was written in Tel Aviv .", "desc_lfm_artist": "Porcupine Tree is a British progressive rock band formed in Hemel Hempstead, Hertfordshire, United Kingdom in 1987. During the course of the band's history, it has at times incorporated psychedelic rock, alternative, ambient, electronic, and, most recently, metal and post-rock into its unique style of progressive rock. Since 2010, mainstay Steven Wilson has concentrated on his solo work. On November 1st, 2021, the band announced a new album and tour in the formation Gavin Harrison, Steven Wilson, and Richard Barbieri (without Colin Edwin).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 145, "title": "Da Drought 3", "artist": "Lil Wayne", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1146-da-drought-3_025820.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1146-lil-wayne-da-drought-3.php", "aoty_critic_score": 85, "aoty_user_score": 84, "mbid": "ed900bf5-cd10-4b5a-be2d-4e78ccab1612", "yt_id": "SWe7cpcVrwE", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Did you mean: Lil' Wayne\n\nDwayne Michael Carter, Jr. (born September 27, 1982 in New Orleans, Louisiana), better known by his stage name Lil Wayne, is an American rapper. Formerly a member of the rap group the Hot Boys, he joined the Cash Money Records collective as a teenager. Get It How U Live, released in 1997, was Lil Wayne's first album with Hot Boys, and Tha Block is Hot, his solo debut, came out in 1999.\nAfter gaining fame with two other albums in the early 2000s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 146, "title": "And Their Refinement of the Decline", "artist": "Stars of the Lid", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/424-and-their-refinement-of-the-decline_165052.jpg", "aoty_url": "https://www.albumoftheyear.org/album/424-stars-of-the-lid-and-their-refinement-of-the-decline.php", "aoty_critic_score": 87, "aoty_user_score": 84, "mbid": "dd0cae7b-5bf2-3db1-b028-87472215400a", "yt_id": "c4E6RO4muLU", "rym": "https://rateyourmusic.com/release/album/stars-of-the-lid/and-their-refinement-of-the-decline", "genres": ["drone"], "desc_lfm_album": "", "desc_lfm_artist": "Stars of the Lid was an American band specializing in drone-based ambient music. They list among their influences minimalist and electronic composers such as Arvo Pärt, Zbigniew Preisner, Gavin Bryars, and Henryk Górecki, as well as Talk Talk (both bands have tracks named \"Taphead\"), post-rock artists Labradford, and ambient innovator Brian Eno. Their music largely consists of beatless soundscapes, composed of droning, effects-treated guitars along with piano", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 147, "title": "セカンド♥ [Second♥]", "artist": "ミドリ [Midori]", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/25966-second.jpg", "aoty_url": "https://www.albumoftheyear.org/album/25966-midori--second.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": null, "yt_id": "7Pdyr0v5jkY", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 148, "title": "From Here We Go Sublime", "artist": "The Field", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/402-from-here-we-go-sublime_002442.jpg", "aoty_url": "https://www.albumoftheyear.org/album/402-the-field-from-here-we-go-sublime.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "71ad4e21-a614-3ac7-99b1-031dfd06c669", "yt_id": "GeJEKCZLbTE", "rym": "https://rateyourmusic.com/release/album/the-field/from-here-we-go-sublime", "genres": ["techno", "minimal techno", "tech house", "microhouse", "Electronic"], "desc_lfm_album": "", "desc_lfm_artist": "Multiple artists have released music under the name of The Field, the most widely known being Swedish minimal techno producer Axel Willner. Others include a British rock band and a Norwegian pop/jazz band.\n\n1. Stockholm, Sweden\nThe Field (real name Axel Willner) has released six full-length albums on Kompakt since 2005, in addition to a handful of EPs, 12-inches, and remixes for many other artists. His unique blend of mesmerizing ambience and propulsive techno incorporates microsamples of pop songs from artists like The Four Tops", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 149, "title": "Person Pitch", "artist": "Panda Bear", "year": 2007, "cover": "https://dn710606.ca.archive.org/0/items/mbid-d40165ac-a2c9-4ab7-9844-b643106a5a9b/mbid-d40165ac-a2c9-4ab7-9844-b643106a5a9b-13817952025.jpg", "aoty_url": "https://www.albumoftheyear.org/album/404-panda-bear-person-pitch.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "2dd67771-d6af-3bb3-9f71-5ee241c095cd", "yt_id": "ggKdy2n_DXA", "rym": "https://rateyourmusic.com/release/album/panda-bear/person-pitch", "genres": ["psychedelic pop", "progressive pop", "sunshine pop", "neo-psychedelia", "plunderphonics", "ambient pop"], "desc_lfm_album": "Person Pitch is the third solo album released by American recording artist Panda Bear (Noah Lennox), released on March 20, 2007. Largely composed using a pair of Roland SP-303 samplers, Person Pitch was a stylistic leap from Lennox's previous album, the primarily acoustic Young Prayer (2004). He described the album as \"kind of sugary ... super dubby and old sounding\" songs inspired by his recent marriage and fatherhood. The album was met with universal critical acclaim, and later ranked among various \"top 10 albums of the 2000s\" lists. It is noted for influencing a wide range of subsequent indie music, .", "desc_lfm_artist": "Panda Bear is American musician Noah Lennox (born Noah Benjamin Lennox on 17 July 1978), a founding member of experimental pop band Animal Collective and member of Jane.\n\nLennox grew up in the Roland Park section of Baltimore, Maryland. As a child, he played sports, and studied piano and cello. He later sang tenor in his high school chamber choir. After graduation, he attended Boston University but dropped out in 2000 and moved to New York where he dedicated himself to his music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 150, "title": "Armchair Apocrypha", "artist": "Andrew Bird", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/armchair-apocrypha-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1111-andrew-bird-armchair-apocrypha.php", "aoty_critic_score": 81, "aoty_user_score": 80, "mbid": "496c5117-b89d-31e2-87ce-00b8fc96d341", "yt_id": "7K8lVfnzByY", "rym": "https://rateyourmusic.com/release/album/andrew-bird/armchair-apocrypha-2", "genres": [], "desc_lfm_album": "Armchair Apocrypha is American singer-songwriter Andrew Bird's fourth studio album and his third post-Bowl of Fire album. The album features more electric guitars, a change from the more acoustic-oriented Eggs, though the songs are similar in character if slightly more straightforward. \"Simple X\" is a track started by collaborator Dosh, who supplied the drum track on the final version, with Bird adding lyrics. The track \"Imitosis\" is an expansion of the song \"I\" (also called \"Capital I\" live) on his 2003 album Weather Systems. The song \"Darkmatter\" is also a rehash of the song \"Sweetbreads\", which can be found on .", "desc_lfm_artist": "Andrew Bird (born July 11, 1973) is an American musician. He was born in Lake Bluff, Illinois but currently resides in the Los Angeles area. Bird is a singer, a violinist and, since 2004, a guitarist. He is also an accomplished whistler.\n\nHis early work, which echoed gypsy jazz and traditional folk, has led into his current sound, which mixes rock with more broad compositions. His years of solo song-craft have now enabled him to produce a sound that is uniquely his own.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 151, "title": "I'll Sleep When You're Dead", "artist": "El-P", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/ill-sleep-when-youre-dead.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1539-el-p-ill-sleep-when-youre-dead.php", "aoty_critic_score": 78, "aoty_user_score": 84, "mbid": "3ed2b00b-5023-3f49-b025-5b78a2f04aef", "yt_id": "gc7RxSfxnqY", "rym": "https://rateyourmusic.com/release/album/el-p/ill-sleep-when-youre-dead/", "genres": ["Hip-Hop"], "desc_lfm_album": "I'll Sleep When You're Dead is the second full-length studio album by New York hip hop artist El-P, released on his own Definitive Jux label on March 20, 2007. The album comes almost a full five years after his critically acclaimed debut solo album, Fantastic Damage. The album's first single, the Trent Reznor-featuring \"Flyentology\", was released as a digital download via the iTunes Store on February 20, 2007. The song \"EMG\" appears as the B-side, and an animated video was made by the Adult Swim team. A video was also shot for \"Smithereens\", featuring images of torture and imprisonment reminiscent .", "desc_lfm_artist": "El-P is an abbreviation of El-Producto, both pseudonyms of New York City, NY, USA, underground hip-hop producer / rapper Jaime Meline (b. 2 Mar 1975).\n\nAs a member of Company Flow, he honed his production skills alongside DJ Mr. Len and Bigg Jus. His unique style helped Company Flow gain critical, then popular success, culminating in 1997 with Funcrusher Plus. Eventual differences between the group & label Rawkus, lead to El-P & Len leaving the label in 2000.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 152, "title": "ぶっ生き返す [Bu-ikikaesu]", "artist": "マキシマム ザ ホルモン [MAXIMUM THE HORMONE]", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/69125--bu-ikikaesu_181244.jpg", "aoty_url": "https://www.albumoftheyear.org/album/69125--maximum-the-hormone--bu-ikikaesu.php", "aoty_critic_score": 50, "aoty_user_score": 82, "mbid": null, "yt_id": "lX9-O4RjP0A", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 153, "title": "Sound of Silver", "artist": "LCD Soundsystem", "year": 2007, "cover": "https://dn710805.ca.archive.org/0/items/mbid-7461ca27-65e8-4106-a75e-de068dc3a619/mbid-7461ca27-65e8-4106-a75e-de068dc3a619-38184302649.jpg", "aoty_url": "https://www.albumoftheyear.org/album/410-lcd-soundsystem-sound-of-silver.php", "aoty_critic_score": 86, "aoty_user_score": 88, "mbid": "5cbcdd9f-4b7d-3b3c-b9f2-6b0e75971157", "yt_id": "4kPyjUMmCL4", "rym": "https://rateyourmusic.com/release/album/lcd-soundsystem/sound-of-silver", "genres": ["alternative rock", "dance-punk", "alternative dance", "indietronica", "post-punk revival", "new rave"], "desc_lfm_album": "Sound of Silver is the second studio album by American rock band LCD Soundsystem. The album was released jointly through DFA and Capitol Records in the United States and EMI elsewhere, first on March 12, 2007, in the United Kingdom. Sound of Silver was produced by the DFA and recorded during 2006 at Long View Farm in North Brookfield, Massachusetts and DFA Studios in New York, New York. Upon release, Sound of Silver received acclaim from music critics, and it was later nominated for the Grammy Award for Best Electronic/Dance Album at the 50th Annual Grammy Awards. .", "desc_lfm_artist": "LCD Soundsystem is the musical project of producer James Murphy, co-founder of dance-punk label DFA Records. Formed in 2001 in New York City, New York, United States, the music of LCD Soundsystem can also be described as a mix of alternative dance and post punk, along with elements of disco and other styles. \n\nDuring the band's final years, Murphy was accompanied by Al Doyle (guitar, percussion -- also of Hot Chip), Tyler Pope (!!! / Out Hud) (bass), Nancy Whang (keyboards) and Pat Mahoney (drums).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 154, "title": "Neon Bible", "artist": "Arcade Fire", "year": 2007, "cover": "https://ia801606.us.archive.org/14/items/mbid-e9d5f43f-826f-3a52-8890-084d0863d687/mbid-e9d5f43f-826f-3a52-8890-084d0863d687-2096303717.jpg", "aoty_url": "https://www.albumoftheyear.org/album/407-arcade-fire-neon-bible.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "c091b282-aa91-3bc0-9c95-938db1f1f930", "yt_id": "6ytCFlojTf0", "rym": "https://rateyourmusic.com/release/album/arcade-fire/neon-bible", "genres": ["alternative rock", "art rock", "chamber pop", "indie rock", "post-punk revival", "rock"], "desc_lfm_album": "Neon Bible is the second album by Canadian indie rock band Arcade Fire, released in March 2007 on Merge Records. Originally announced on December 16, 2006 through the band's website, the majority of the album was recorded in a church that the band bought and renovated. Neon Bible became Arcade Fire's highest charting album at the time, debuting on the Billboard 200 at number two, selling 92,000 copies in its first week and more than 400,000 to date. Being released within a month of similarly successful releases by The Shins (Wincing the Night Away) and Modest Mouse (We Were Dead .", "desc_lfm_artist": "Arcade Fire is a Canadian indie rock band formed in Montreal, Quebec, Canada in 2001. The band consists of Win Butler (vocals, guitar, piano), Régine Chassagne (vocals, accordion, keyboards, hurdy gurdy, drums), Richard Reed Parry (bass, guitar), Tim Kingsbury (bass), and Jeremy Gara (drums). Montreal percussionist Dane Mills performed on the EP and in early live shows.  Will Butler (keyboards, guitar) left the band in 2022 to focus on his solo career. The touring band includes horn players and violinists.", "desc_mb_album": "", "desc_mb_artist": "Please do not submit a mod to rename this group to \"The Arcade Fire.\" The issue has been [http://musicbrainz.org/mod/search/results.html?automod=&mod_type=1&moderator_id=63118&voter_type=0&voter_id=63118&artist_type=3&artist_id=164813&orderby=desc&minid=&maxid=&isreset=0|raised and voted down] multiple times.\r\n&nbsp;&nbsp;&nbsp;&nbsp;-ojnkpjg", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 155, "title": "Tones of Town", "artist": "Field Music", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/tones-of-town.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1399-field-music-tones-of-town.php", "aoty_critic_score": 81, "aoty_user_score": 75, "mbid": "06e56903-3abd-3f0f-ab35-68977098a8b6", "yt_id": "7U9FXRfHucA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Field Music is a band from Sunderland in north-east England led by brothers David and Peter Brewis. Commonly described as making \"experimental pop\" music, they have released eight 'proper' albums: Field Music (2005), Tones of Town (2007), Field Music (Measure) (2010), Plumb (2012),  Commontime (2016), Open Here (2018),  Making A New World (2020), and Flat White Moon (2021). A ninth album, Limits of Language, was released on 11 October 2024.\n\nThey have also released a compilation of B-sides (Write Your Own History", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 156, "title": "Hissing Fauna, Are You The Destroyer?", "artist": "of Montreal", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/hissing-fauna-are-you-the-destroyer-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/430-of-montreal-hissing-fauna-are-you-the-destroyer.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "4eacd95b-675a-3c6b-9d83-5d9360719f37", "yt_id": "XV4msjRe1wk", "rym": null, "genres": [], "desc_lfm_album": "Hissing Fauna, Are You the Destroyer? is the eighth album from indie pop band of Montreal. It was released January 23, 2007. The album was written, performed, and recorded by Kevin Barnes, with assistance from friends and family: prominent Elephant Six members Bryan Poole, Jamey Huggins and Heather McIntosh, as well as Barnes' wife Nina Twin, and daughter Alabee Blonde. Credits also feature Georgie Fruit, a glam rock alter-ego of Barnes. Barnes has described the album as a concept album, detailing his transformation from Kevin Barnes into Georgie Fruit. The transformation takes place during \"The Past Is a Grotesque Animal,\" .", "desc_lfm_artist": "of Montreal is an American indie pop band formed in Athens, Georgia, United States in 1997. The band is fronted by Kevin Barnes, who writes, composes, and plays most of the music for their albums.\n\nThey were among the second wave of groups to emerge from The Elephant 6 Recording Company and the group had a style that is typical of many Elephant 6 bands due to their interest in combining musical experimentation with the basic tenets of pop i.e. catchy melodies and sing-along choruses.", "desc_mb_album": "", "desc_mb_artist": "N.B. 'of Montreal' is the correct capitalization - the band name is usually spelt with the lower case.", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 157, "title": "Wincing The Night Away", "artist": "The Shins", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/wincing-the-night-away-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/528-the-shins-wincing-the-night-away.php", "aoty_critic_score": 80, "aoty_user_score": 78, "mbid": "0f3ab0c9-c607-36a5-8102-b238eb08b357", "yt_id": "XoMAbmZw3mI", "rym": null, "genres": [], "desc_lfm_album": "Wincing the Night Away is a Grammy-nominated album by indie rock group The Shins. It was released by Sub Pop Records on January 23, 2007. It is the band's third album, and the final under their contract with Sub Pop. The album was recorded in James Mercer's basement studio, Phil Ek’s home in Seattle, and in Oregon City with veteran producer Joe Chiccarelli (Beck, U2). (Source: http://en.wikipedia.org/wiki/Wincing_the_Night_Away) .", "desc_lfm_artist": "The Shins is an American alternative rock band centered around James Mercer.\n\nThe band formed in 1997, in Albuquerque, New Mexico, United States as a side project of Mercer (previously of Blue Roof Dinner) and drummer Jesse Sandoval, who were both members of Flake Music. The band's original lineup was Mercer (vocals, guitar), Sandoval (drums), Marty Crandall (keyboards) and Dave Hernandez (bass). Neil Langford replaced Hernandez in 1998. Hernandez returned to the band in 2003, as Langford had left the band in 2001.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 158, "title": "Watching from a Distance", "artist": "Warning", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/117475-watching-from-a-distance.jpg", "aoty_ur
