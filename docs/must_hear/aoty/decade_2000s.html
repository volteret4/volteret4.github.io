_lfm_artist": "Natural Snow Buildings is a duo from Vitré, France, consisting of artists Mehdi Ameziane and Solange Gularte. They play music which can be classified as experimental,  psychedelic folk with drone elements and ambient influences. Formed in 1997, they have released numerous albums, many of them in extremely limited quantities. \n\nBoth members of Natural Snow Buildings record as solo artists: Mehdi Ameziane as TwinSisterMoon and Solange Gularte as Isengrind.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "paqueradejere"]}, {"n": 160, "title": "Hell Hath No Fury", "artist": "Clipse", "year": 2006, "cover": "https://dn721903.ca.archive.org/0/items/mbid-ebf053c4-758b-4aa8-81eb-11b8bb55c6cf/mbid-ebf053c4-758b-4aa8-81eb-11b8bb55c6cf-42331702924.jpg", "aoty_url": "https://www.albumoftheyear.org/album/444-clipse-hell-hath-no-fury.php", "aoty_critic_score": 85, "aoty_user_score": 86, "mbid": "e0c24b92-5192-35a7-ae44-bc9759b36a86", "yt_id": "h2DihwLVAbU", "rym": "https://rateyourmusic.com/release/album/clipse/hell-hath-no-fury", "genres": ["hip hop", "experimental hip hop", "gangsta rap", "southern hip hop", "Hip-Hop"], "desc_lfm_album": "Hell Hath No Fury is the third studio album by hip hop duo Clipse. The album was released on November 28, 2006 in the United States by Re-Up, Star Trak and Jive. Recording sessions for the album took place over a period of several years, and suffered numerous delays prior to release. Production was handled by The Neptunes. .", "desc_lfm_artist": "Clipse are a critically acclaimed hip hop duo that formed in Virginia Beach, Virginia in 1992.  They announced the end of their career together at a live show in 2010 and remained firm on this stance, up until 2024 when Pharrell announced a new album with them.\nThe duo is made up of brothers Gene \"No Malice\" Thornton and Terrence \"Pusha T\" Thornton, who is also currently signed to Kanye West's G.O.O.D Music label. They met Pharrell of the producing duo The Neptunes", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "alberto_gu"]}, {"n": 161, "title": "Orphans: Brawlers, Bawlers & Bastards", "artist": "Tom Waits", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/orphans-brawlers-bawlers-bastards.jpg", "aoty_url": "https://www.albumoftheyear.org/album/443-tom-waits-orphans-brawlers-bawlers-bastards.php", "aoty_critic_score": 89, "aoty_user_score": 82, "mbid": "6163d607-3443-3062-b6a1-0a2e0790dff5", "yt_id": "vgFk92lNxVs", "rym": "https://rateyourmusic.com/release/album/tom-waits/orphans-brawlers-bawlers-and-bastards", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Tom Waits (born Thomas Alan Waits, in Pomona, California, on December 7, 1949) is a prolific American singer, songwriter, composer, and actor.\n\nHe started his career in the early 1970s as a singer in spit 'n' sawdust bars. Initially, he was deeply influenced by the beat generation, novelists like Jack Kerouac and William S. Burroughs, and poets like Allen Ginsberg and Charles Bukowski.  Waits is often compared to Charles Bukowski, being similar both in content and lifestyle", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 162, "title": "The Devil and God Are Raging Inside Me", "artist": "Brand New", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5122-the-devil-and-god-are-raging-inside-me-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5122-brand-new-the-devil-and-god-are-raging-inside-me.php", "aoty_critic_score": 79, "aoty_user_score": 87, "mbid": "1be8a707-2fe2-3a79-ae44-332cec741ad6", "yt_id": "cjPyvoLXPs4", "rym": "https://rateyourmusic.com/release/album/brand-new/the-devil-and-god-are-raging-inside-me/", "genres": ["Punk", "Alternative Rock"], "desc_lfm_album": "The Devil and God Are Raging Inside Me is the third studio album by American rock band Brand New. It was released on November 21, 2006, through Interscope Records, making it their major label debut. Recorded from 2005-2006 in studios on Long Island and Massachusetts with producer Mike Sapone, the album arose following the online leaking of several unfinished demos that were meant to be early blueprints of an upcoming record. Two singles from the album were released – \"Sowing Season\" on November 21, 2006, and \"Jesus Christ\" on April 30, 2007. The album peaked at #31 on the Billboard .", "desc_lfm_artist": "There are two artists with this name\n1. A popular rock band\n2. A funk group\n\n1. Brand New is an American rock band that formed in 2000 in Merrick, New York. The band consists of Jesse Lacey (lead vocalist/guitarist/lyricist), Vincent Accardi (guitarist/lyricist),Garrett Tierney (bassist), Brian Lane (drummer), and Derrick Sherman (guitarist/keyboardist).\n\nFormation (2000-2001)\n\nPrior to Brand New's official formation, in the late 1990s Jesse Lacey", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 163, "title": "As Daylight Dies", "artist": "Killswitch Engage", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/26289-as-daylight-dies.jpg", "aoty_url": "https://www.albumoftheyear.org/album/26289-killswitch-engage-as-daylight-dies.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "eeb3218d-10ae-3875-8b3a-ce282697d419", "yt_id": "W064GlWrSQ4", "rym": "https://rateyourmusic.com/release/album/killswitch-engage/as-daylight-dies", "genres": [], "desc_lfm_album": "As Daylight Dies is the fourth studio album by American metalcore band Killswitch Engage. It was released on November 21, 2006 through Roadrunner Records. It was produced by Adam Dutkiewicz and Joel Stroetzel. It peaked at number 32 on the Billboard 200, selling up to 60,000 copies within its first week. It also peaked within the Rock, Hard Rock, and Digital Albums Charts. The album was certified Gold by the RIAA on June 30, 2009, which was on the same date of the release of its successor, Killswitch Engage. It has since gone on to sell more than 500,000 copies .", "desc_lfm_artist": "Killswitch Engage is an American metalcore band from Westfield, Massachusetts, formed in 1999 after the disbanding of Overcast and Aftershock. Killswitch Engage's current lineup consists of vocalist Jesse Leach, guitarists Joel Stroetzel and Adam Dutkiewicz, bassist Mike D'Antonio, and drummer Justin Foley (formerly in Blood Has Been Shed). The band has released nine studio albums and three live performance albums. Their ninth studio album, This Consequence, was released on February 21st, 2025.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 164, "title": "Ys", "artist": "Joanna Newsom", "year": 2006, "cover": "https://dn711106.ca.archive.org/0/items/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16-9262812691.jpg", "aoty_url": "https://www.albumoftheyear.org/album/438-joanna-newsom-ys.php", "aoty_critic_score": 86, "aoty_user_score": 89, "mbid": "34315f68-08a5-3637-8da7-deaad8f45514", "yt_id": "cJ1yFhjRnNc", "rym": "https://rateyourmusic.com/release/album/joanna-newsom/ys", "genres": ["avant-garde", "folk", "alternative rock", "chamber folk", "baroque pop", "country"], "desc_lfm_album": "Ys is the second studio album by American musician Joanna Newsom. It was released by Drag City on November 6, 2006. The album was produced by Newsom and Van Dyke Parks, recorded by Steve Albini, mixed by Jim O'Rourke, with accompanying orchestral arrangements by Van Dyke Parks. It features guest vocals from Bill Callahan and Emily Newsom. The vocals and harp were recorded at The Village Recording Studio in Los Angeles in December 2005, with the orchestration being recorded between May and June 2006 at the Entourage Studios in Los Angeles. The album consists of five tracks with song durations .", "desc_lfm_artist": "Joanna Caroline Newsom is an American singer, songwriter, musician and actress. Born and raised in Northern California, Newsom was classically trained on the harp in her youth and began her musical career as a keyboardist in the San Francisco-based indie band The Pleased.\n\nAfter recording and self-releasing two EPs in 2002, Newsom was signed to the independent label Drag City. Her debut album, The Milk-Eyed Mender, was released in 2004 to critical acclaim and garnered Newsom an underground following.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "sdecandelario"]}, {"n": 165, "title": "Jarvis", "artist": "Jarvis Cocker", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/453-jarvis_135931.jpg", "aoty_url": "https://www.albumoftheyear.org/album/453-jarvis-cocker-jarvis.php", "aoty_critic_score": 81, "aoty_user_score": 75, "mbid": "8f4857ed-2ca3-4931-b5ca-04556ea5160f", "yt_id": "ozYaTzUT2pk", "rym": null, "genres": [], "desc_lfm_album": "Jarvis (also known as The Jarvis Cocker Record) is the debut solo album by Pulp vocalist and musician Jarvis Cocker, released in the UK on November 13, 2006. Jarvis' First Solo Album Follows on from his Controversial Online Only Single 'running the World', which was First Unleashed on the Public Via Myspace.com/Jarvspace To Coincide with the First Anniversary of Live-8. .", "desc_lfm_artist": "Jarvis Branson Cocker (born on September 19 1963, in Sheffield, United Kingdom) is an English songwriter and rock musician, best known for fronting the britpop band Pulp. \n\nPulp disbanded in 2002 (although they have reformed on a number occasions since), but Cocker has been busy. In 2003, he re-emerged to promote a new album A Heavy Nite With... for his new band, Relaxed Muscle. 2005 then brought Cocker briefly back into the limelight with his contribution to the soundtrack for Harry Potter and the Goblet of Fire.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 166, "title": "Saturday Night Wrist", "artist": "Deftones", "year": 2006, "cover": "https://i.discogs.com/FOPXMzuK4Tei8DWQiYIw5eRgayLb2gTu17OWRtcgUPo/rs:fit/g:sm/q:90/h:595/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTM0MDI3/MjQtMTQ0NTQ0NTc3/OC03MTEwLmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/2212-deftones-saturday-night-wrist.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "82be2ea8-9c50-3024-a1be-cf35c2e5fd69", "yt_id": "qmjk36eSyXk", "rym": "https://rateyourmusic.com/release/album/deftones/saturday-night-wrist", "genres": [], "desc_lfm_album": "Saturday Night Wrist is the fifth studio album by the American alternative metal band Deftones. It was released on Maverick Records on October 31, 2006. Despite early contributions that were later scrapped, Saturday Night Wrist marks the departure of mainstay Deftones producer Terry Date. The band's fifth album was the product of an arduous and stressful creative process lasting roughly two years and straining relationships within Deftones. Complicating matters, and inspiring many of the album's songs, were frontman Chino Moreno's drug addictions and the crumbling of his marriage. The outcome, however, would be an album met with critical praise. This .", "desc_lfm_artist": "Deftones is an American metal band from Sacramento, California, formed in 1988, consisting of Chino Moreno (lead vocals and guitar), Stephen Carpenter (guitar), Frank Delgado (keyboards and turntables), and Abe Cunningham (drums and percussion). Vega (formerly of Quicksand) took on bass duties from mid-2009 to ca. 2021 in substitution for Chi Cheng, who was seriously injured in an automobile accident in Santa Clara, California on November 4, 2008.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 167, "title": "Back to Black", "artist": "Amy Winehouse", "year": 2006, "cover": "https://dn710903.ca.archive.org/0/items/mbid-ccf4da26-ea82-462f-b753-88bb976fd40e/mbid-ccf4da26-ea82-462f-b753-88bb976fd40e-36926439244.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1171-amy-winehouse-back-to-black.php", "aoty_critic_score": 82, "aoty_user_score": 87, "mbid": "6eac2e57-ee50-36f8-b0c4-c4c847a2c098", "yt_id": "t2TKqJ2FXGM", "rym": "https://rateyourmusic.com/release/album/amy-winehouse/back-to-black", "genres": ["soul", "jazz pop", "r&b", "contemporary jazz", "pop soul", "brill building"], "desc_lfm_album": "Back to Black is the second and final studio album by English singer-songwriter Amy Winehouse, released on October 27, 2006 by Island Records. Winehouse predominantly based the album on her tumultuous relationship with then-ex-boyfriend and future husband Blake Fielder-Civil, who temporarily left her to pursue his previous ex-girlfriend. Their short-lived separation spurred her to create an album that explores themes of guilt, grief, infidelity, heartbreak and trauma in a relationship. Influenced by the pop and soul music of 1960s girl groups, Winehouse collaborated with producers Salaam Remi and Mark Ronson, along with Sharon Jones' band The Dap-Kings, to assist her .", "desc_lfm_artist": "Amy Jade Winehouse was an English singer and songwriter. She was known for her deep, expressive contralto vocals and her eclectic mix of musical genres, including soul, rhythm and blues, reggae and jazz.\n\nA member of the National Youth Jazz Orchestra during her youth, Winehouse signed to Simon Fuller's 19 Management in 2002 and soon recorded a number of songs before signing a publishing deal with EMI. She also formed a working relationship with producer Salaam Remi through these record publishers.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 168, "title": "No Heroes", "artist": "Converge", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/no-heroes-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4321-converge-no-heroes.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "8b6e4596-796f-3097-96ee-dc6de9908f36", "yt_id": "u6vRMfU9EQs", "rym": "https://rateyourmusic.com/release/album/converge/no-heroes", "genres": [], "desc_lfm_album": "No Heroes is the sixth album by Converge. The album was released on October 24, 2006, on Epitaph Records. By January 11, 2007, it had sold 17,000 copies in the U.S. It peaked at number 151 in the Billboard 200. It topped the Top Heatseekers chart and reached number 13 in the Independent Albums listings. It was named the number 1 album of 2006 in Sputnikmusic's staff \"Best of 2006\" list. \"These days, cowards outnumber the heroes, and the begging souls outweigh the calloused hands of the hardest of workers. Both in life and in art, the lack of passion .", "desc_lfm_artist": "Converge is an American band, formed in February of 1990 in Salem, Massachusetts, United States. Playing a blend of hardcore punk and extreme metal, this pioneer outfit helped define a lot of the rudiments of the fast-burgeoning metalcore and mathcore genres formed by vocalist Jacob Bannon and guitarist Kurt Ballou in Salem, Massachusetts in 1990. During the recording of their seminal fourth album Jane Doe, the group became a four-piece with the departure of guitarist Aaron Dalbec and the addition of bassist Nate Newton and drummer Ben Koller.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 169, "title": "The Black Parade", "artist": "My Chemical Romance", "year": 2006, "cover": "https://dn721908.ca.archive.org/0/items/mbid-3b36b9f9-8f3b-46a1-9c07-ef61a21d238a/mbid-3b36b9f9-8f3b-46a1-9c07-ef61a21d238a-27881510702.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5527-my-chemical-romance-the-black-parade.php", "aoty_critic_score": 75, "aoty_user_score": 89, "mbid": "bcba43e7-2f72-3b60-b234-577e77fd2d9e", "yt_id": "3FWCAsZ6AUI", "rym": "https://rateyourmusic.com/release/album/my-chemical-romance/the-black-parade", "genres": ["alternative rock", "pop rock", "rock opera", "punk", "pop punk", "emo"], "desc_lfm_album": "The Black Parade is the third studio album by My Chemical Romance. Released on October 24, 2006 through Reprise Records, it was produced by Rob Cavallo, known for having produced multiple albums for Goo Goo Dolls and Green Day. It is a rock opera centering on a dying character with cancer known as \"The Patient\". The album tells the story of his apparent death, experiences in the afterlife, and subsequent reflection on his life. Four singles were released from the album: \"Welcome to the Black Parade\", \"Famous Last Words\", \"I Don't Love You\", and \"Teenagers\". The Black Parade has received .", "desc_lfm_artist": "My Chemical Romance is an American rock band from New Jersey, United States formed in 2001. The band consists of lead vocalist Gerard Way, guitarists Ray Toro, Frank Iero and bassist Mikey Way. Shortly after forming, the band signed to Eyeball Records and released their debut album I Brought You My Bullets, You Brought Me Your Love in 2002. They signed with Reprise Records the next year and released their major label debut Three Cheers for Sweet Revenge", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 170, "title": "45:33", "artist": "LCD Soundsystem", "year": 2007, "cover": "https://dn710909.ca.archive.org/0/items/mbid-52a6f83d-da94-431e-ba83-b60842204a80/mbid-52a6f83d-da94-431e-ba83-b60842204a80-8677214568.jpg", "aoty_url": "https://www.albumoftheyear.org/album/413-lcd-soundsystem-4533.php", "aoty_critic_score": 83, "aoty_user_score": 79, "mbid": "6d02e9fe-d8e1-3017-8203-1d783d8d9720", "yt_id": "WoVO2HKwfbg", "rym": "https://rateyourmusic.com/release/album/lcd-soundsystem/45_33-4", "genres": ["electro", "dance-punk", "disco", "breaks"], "desc_lfm_album": "", "desc_lfm_artist": "LCD Soundsystem is the musical project of producer James Murphy, co-founder of dance-punk label DFA Records. Formed in 2001 in New York City, New York, United States, the music of LCD Soundsystem can also be described as a mix of alternative dance and post punk, along with elements of disco and other styles. \n\nDuring the band's final years, Murphy was accompanied by Al Doyle (guitar, percussion -- also of Hot Chip), Tyler Pope (!!! / Out Hud) (bass), Nancy Whang (keyboards) and Pat Mahoney (drums).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 171, "title": "Harmony in Ultraviolet", "artist": "Tim Hecker", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/472-harmony-in-ultraviolet_122934.jpg", "aoty_url": "https://www.albumoftheyear.org/album/472-tim-hecker-harmony-in-ultraviolet.php", "aoty_critic_score": 86, "aoty_user_score": 85, "mbid": "c7d3f746-73a7-3159-b3cd-5df644e46072", "yt_id": "qse2KT65ZcE", "rym": "https://rateyourmusic.com/release/album/tim-hecker/harmony-in-ultraviolet", "genres": ["drone", "microsound", "Metal", "Electronic"], "desc_lfm_album": "Harmony in Ultraviolet is the fourth studio album by Canadian experimental musician Tim Hecker, released on October 16, 2006 on Kranky. .", "desc_lfm_artist": "Tim Hecker is an electronic musician and sound artist based in Los Angeles, United States and Montreal, Canada. Hecker initially recorded under the moniker Jetone, but has become known internationally for recordings released under his own name, such as Harmony in Ultraviolet (2006) and Ravedeath, 1972 (2011). He has released eight albums and a number of EPs in addition to collaborations with artists such as Ben Frost, Daniel Lopatin, and Aidan Baker. His latest album No Highs was released on 7 April 2023.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "armandwave", "paqueradejere", "verygooood"]}, {"n": 172, "title": "Boys and Girls in America", "artist": "The Hold Steady", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/boys-and-girls-in-america.jpg", "aoty_url": "https://www.albumoftheyear.org/album/308-the-hold-steady-boys-and-girls-in-america.php", "aoty_critic_score": 84, "aoty_user_score": 78, "mbid": "dd147445-877c-381b-ac14-f060cbf871fa", "yt_id": "m-hc2ZqJcfk", "rym": "https://rateyourmusic.com/release/album/the-hold-steady/boys-and-girls-in-america", "genres": ["Rock", "Punk", "Alternative Rock"], "desc_lfm_album": "", "desc_lfm_artist": "The Hold Steady is an American rock band based in Brooklyn formed by vocalist/guitarist Craig Finn (ex-Lifter Puller) in 2004. Wanting to capture the sound of bands such as The Replacements and The Grifters, Finn recruited guitarist Tad Kubler (also ex-Lifter Puller), drummer Judd Counsell, and bassist Galen Polivka. In 2005 the band grew to include Franz Nicolay (of The World/Inferno Friendship Society) on keyboards and Bobby Drake took over on drums following Counsell's departure.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 173, "title": "The Crane Wife", "artist": "The Decemberists", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-crane-wife-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/441-the-decemberists-the-crane-wife.php", "aoty_critic_score": 79, "aoty_user_score": 83, "mbid": "3958580d-8271-3cd2-90d4-c027515941dc", "yt_id": "HrEoiiF0obM", "rym": "https://rateyourmusic.com/release/album/the-decemberists/the-crane-wife", "genres": [], "desc_lfm_album": "The Crane Wife is an album by The Decemberists, released in 2006. It was produced by Tucker Martine and Chris Walla, and is the band's first album on the Capitol Records label. The album was inspired by a Japanese folk tale, and centers on two song cycles, The Crane Wife and The Island, the latter of which was inspired by William Shakespeare's The Tempest. National Public Radio listeners voted The Crane Wife the best album of 2006. The album cover was made by Portland artist Carson Ellis, long-time girlfriend (and now wife) of Colin Meloy, who has created artwork for .", "desc_lfm_artist": "The Decemberists is an American alternative rock band which formed in 2000 in Portland, Oregon, United States. The band currently consists of Colin Meloy (vocals, guitar), Chris Funk (guitar, mandolin, dulcimer, pedal steel guitar), Jenny Conlee (organ, piano, accordion), Nate Query (electric bass, acoustic bass, cello) and John Moen (drums). Notable former members include Rachel Blumberg (drums, vocals) and Jesse Emerson (bass).\n\nNamed both in reference", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 174, "title": "The Letting Go", "artist": "Bonnie 'Prince' Billy", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-letting-go.jpg", "aoty_url": "https://www.albumoftheyear.org/album/466-bonnie-prince-billy-the-letting-go.php", "aoty_critic_score": 80, "aoty_user_score": 79, "mbid": "72fdb56c-08b4-3052-8c30-1bafa64f7a5a", "yt_id": "FDMY9KLokns", "rym": "https://rateyourmusic.com/release/album/bonnie-prince-billy/the-letting-go", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Will Oldham (born 15 January 1970, Louisville, Kentucky) is an American singer-songwriter, actor, and musician. His music is often (perhaps inappropriately) placed under the genre of \"alt-country\". Oldham has recorded under many names, including Palace, Palace Music, Palace Brothers, and Bonnie Billy. He often plays and records with other musicians, including David Pajo and his brothers Ned and Paul Oldham, but is generally the chief creator of the music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 175, "title": "Lupe Fiasco's Food & Liquor", "artist": "Lupe Fiasco", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2375-food-liquor_103938.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2375-lupe-fiasco-food-liquor.php", "aoty_critic_score": 84, "aoty_user_score": 87, "mbid": "3d19dd5c-9a0e-35c4-aeb8-c64ea898f1b6", "yt_id": "EGsdA9lSV2U", "rym": "https://rateyourmusic.com/release/album/lupe-fiasco/lupe-fiascos-food-and-liquor", "genres": ["Hip-Hop"], "desc_lfm_album": "Lupe Fiasco's Food & Liquor (commonly referred to as Food & Liquor) is the debut studio album by American rapper Lupe Fiasco, released on September 19, 2006, on 1st & 15th Entertainment and Atlantic Records. The album features production from The Neptunes, Kanye West, Mike Shinoda, Craig Kallman, Prolyfic, Needlz, Soundtrakk, and Brandon Howard. Jay-Z, Chill, and Fiasco himself are credited as the executive producers for the album. Songs on the record discuss poverty, Islam, terrorism, racism, and individuality. Originally, the album was reported to have debuted at number 12 on the Billboard 200; however, due to incomplete Nielsen SoundScan .", "desc_lfm_artist": "Wasalu Muhammad Jaco (born February 16, 1982 in Chicago, Illinois), better known by his stage name Lupe Fiasco, is a Grammy Award-winning American hip-hop artist and producer. He first became known to the mainstream hip-hop community in 2005 when he appeared on Kanye West's album Late Registration on the track \"Touch the Sky.\" In 2006 Lupe released his debut album, Lupe Fiasco's Food & Liquor on Atlantic Records, and in December 2007 he released his second full length album, Lupe Fiasco's The Cool  .", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 176, "title": "I Am Not Afraid of You and I Will Beat Your Ass", "artist": "Yo La Tengo", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/i-am-not-afraid-of-you-and-i-will-beat-your-ass.jpg", "aoty_url": "https://www.albumoftheyear.org/album/355-yo-la-tengo-i-am-not-afraid-of-you-and-i-will-beat-your-ass.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "fc558b94-1a6c-382e-9182-7f351125fc3b", "yt_id": "3ngROr7CZ8c", "rym": null, "genres": [], "desc_lfm_album": "I Am Not Afraid of You and I Will Beat Your Ass is the eleventh full-length album by American indie rock band Yo La Tengo, released on September 12, 2006 by record label Matador. The title of the album is rumored to be a (paraphrased) quote by NBA player Tim Thomas. Sitting on the bench together during a game, Thomas was caught on tape by the MSG Network in a profane exchange with fellow Knick, point guard Stephon Marbury. Thomas yelled at Marbury, \"Everyone in this organization is afraid of you, but I'm not, and I will beat your ass\". .", "desc_lfm_artist": "Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 177, "title": "Blood Mountain", "artist": "Mastodon", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/940-blood-mountain_224528.jpg", "aoty_url": "https://www.albumoftheyear.org/album/940-mastodon-blood-mountain.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "8f2bde3a-8af2-3049-833b-b490ce78ae1c", "yt_id": "4W3JLsuA2yA", "rym": "https://rateyourmusic.com/release/album/mastodon/blood-mountain", "genres": ["Metal", "Rock"], "desc_lfm_album": "Blood Mountain is the third full-length studio album by metal band Mastodon. The recording of the album finished in April, 2006 and it was released on September 11 in the UK and September 12, 2006 in North America. Like Mastodon's previous studio work Leviathan, Blood Mountain is a concept album. According to bassist Troy Sanders, \"It's about climbing up a mountain and the different things that can happen to you when you're stranded on a mountain, in the woods, and you're lost. You're starving, hallucinating, running into strange creatures. You're being hunted. It's about that whole struggle.\" The album includes .", "desc_lfm_artist": "Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 178, "title": "Amputechture", "artist": "The Mars Volta", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/amputechture-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1247-the-mars-volta-amputechture.php", "aoty_critic_score": 66, "aoty_user_score": 80, "mbid": "f350f811-0030-3aa3-9b49-69d8be151aa0", "yt_id": "o3l16a0TTGA", "rym": "https://rateyourmusic.com/release/album/the-mars-volta/amputechture", "genres": [], "desc_lfm_album": "Amputechture is the third full length studio album by The Mars Volta released on September 12, 2006. The album debuted at #9 on the Billboard Top 200 selling over 59,000 copies in its opening week. The album was recorded in Los Angeles, CA, El Paso, TX and Melbourne, Australia in late 2005 and early 2006. It was produced by Omar Rodriguez-Lopez and mixed by Rich Costey. Red Hot Chili Peppers guitarist John Frusciante plays on all tracks apart from \"Asilos Magdalena\". Although most of Amputechture was newly recorded, the band also incorporated older material into some of the album's tracks. .", "desc_lfm_artist": "The Mars Volta is an American progressive rock band from El Paso, Texas, formed in 2001. The band's only constant members are Omar Rodríguez-López (guitar, producer, direction) and Cedric Bixler-Zavala (vocals, lyrics), whose partnership forms the core of the band. The band's current line-up also includes founding member Eva Gardner (bass), Omar's brother Marcel Rodríguez-López (keyboards, synths, percussion), Linda-Philomène Tsoungui (drums) and Leo Genovese (keyboards, saxophone).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 179, "title": "The Air Force", "artist": "Xiu Xiu", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-air-force.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1386-xiu-xiu-the-air-force.php", "aoty_critic_score": 75, "aoty_user_score": 81, "mbid": "57e7926e-fa29-3b9f-9fb1-b57a788c4a93", "yt_id": "vSx4Zme1me4", "rym": "https://rateyourmusic.com/release/album/xiu-xiu/the-air-force", "genres": [], "desc_lfm_album": "The Air Force is the fifth album by Xiu Xiu. It was released on September 12, 2006, and is produced by Greg Saunier of Deerhoof, who also performs on the album with band members Caralee McElroy and Jamie Stewart. The album was produced by Greg Saunier of Deerhoof, and released on 5 Rue Christine in September 2006. Stewart said that the year was \"one of the first not dominated by personal tragedies\" and that the album is about \"making other people feel bad\" instead of feeling bad oneself. Its major themes are \"guilt and sex as opposed to sorrow and .", "desc_lfm_artist": "Xiu Xiu (pronounced \"shoo shoo\") is an American experimental group, formed in 2002 in San Jose, California by original members Jamie Stewart, Lauren Andrews, Yvonne Chen, and Cory McCulloch. Currently, the line-up consists of Jamie Stewart (the only constant member since formation), Angela Seo, a  of recording took place. The album is the first to feature both Taylor and vocalist and guitarist Daniel Rossen, and received critical acclaim upon its release; significantly increasing the band's exposure. An EP, Friend, was released the following year featuring material recorded mostly during the same sessions. Following the release of Horn of Plenty in 2004, Grizzly .", "desc_lfm_artist": "Grizzly Bear is an American indie rock band formed in Brooklyn, New York in 2002. Their music uses melody and ambience in conjunction with hazy-eyed choruses, whistles, piano, banjo, and several woodwind instruments.\n\nGrizzly Bear was originally the solo project of Edward Droste (vocals/guitar), who recorded his debut album Horn of Plenty at home.  The record was originally meant for his friends, but it eventually circulated and got a proper release in 2004, this time with the help of Christopher Bear (drums/vocals).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "sdecandelario"]}, {"n": 183, "title": "Modern Times", "artist": "Bob Dylan", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/modern-times.jpg", "aoty_url": "https://www.albumoftheyear.org/album/439-bob-dylan-modern-times.php", "aoty_critic_score": 86, "aoty_user_score": 76, "mbid": "d300b74b-02b4-33e3-998e-e4405e8e6580", "yt_id": "0RPkJeziNyI", "rym": "https://rateyourmusic.com/release/album/bob-dylan/modern-times", "genres": [], "desc_lfm_album": "Modern Times is Bob Dylan's 32nd studio album, released on August 29, 2006 by Sony BMG. The album was Dylan's third straight (following Time out of Mind and \"Love and Theft\") to be met with nearly universal praise from fans and critics. It continued its predecessors' tendencies toward blues, rockabilly and pre-rock balladry, and was self-produced by Dylan under the pseudonym \"Jack Frost\". Along with the acclaim, the album sparked some debate over its uncredited use of choruses and arrangements from older songs, as well as many lyrical lines taken from the work of 19th century poet Henry Timrod. Modern .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["MaxtorUwU"]}, {"n": 184, "title": "Game Theory", "artist": "The Roots", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2722-game-theory_200029.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2722-the-roots-game-theory.php", "aoty_critic_score": 81, "aoty_user_score": 85, "mbid": "28f24dc6-8fd8-3635-a1cb-5a394fcf542d", "yt_id": "w_6SE58Il20", "rym": "https://rateyourmusic.com/release/album/the-roots/game-theory", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album "yt_id": "356lnkqzdZo", "rym": "https://rateyourmusic.com/release/album/j-dilla/the-shining", "genres": [], "desc_lfm_album": "The Shining is the title of the second official solo album from late Hip Hop producer and rapper J Dilla, who died February 10, 2006. The Shining was incomplete at the time of J Dilla's passing and was posthumously completed. Discounting the instrumental album Donuts, The Shining was the first full-length solo release by J Dilla (featuring vocals) since Welcome 2 Detroit five years earlier, and as such was highly anticipated. It was released on August 22, 2006 through BBE Records. An instrumental version of the album followed its release shortly afterward. In the works for many years under working .", "desc_lfm_artist": "J Dilla was born James Dewitt Yancey on February 7, 1974 in Detroit, Michigan, to Maureen and Beverly Yancey. From the onset, music was intrinsic to Jay's life. His mother Maureen was an accomplished singer and lover of classical music and opera. His father Beverly was a gifted vocalist and bass player fond of vocal harmonies and jazz, who played professionally for 25 years before taking a job at Ford. A two-year-old Jay would gurgle along in perfect pitch to the sound of his father practicing on his upright bass until it lulled him to sleep.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Rocky_stereo", "armandwave", "paqueradejere", "verygooood"]}, {"n": 187, "title": "Ashes Against the Grain", "artist": "Agalloch", "year": 2006, "cover": "https://dn721806.ca.archive.org/0/items/mbid-1dd278bb-11ca-32ee-8ba5-711ddaf871a1/mbid-1dd278bb-11ca-32ee-8ba5-711ddaf871a1-1122863191.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15697-agalloch-ashes-against-the-grain.php", "aoty_critic_score": 93, "aoty_user_score": 86, "mbid": "37859bb9-e60d-340c-83bd-1bc48ccdafb9", "yt_id": "B1x8q64NXxA", "rym": "https://rateyourmusic.com/release/album/agalloch/ashes-against-the-grain", "genres": ["doom metal", "post-metal", "black metal", "atmospheric black metal", "dark folk", "folk metal"], "desc_lfm_album": "Ashes Against the Grain is an album by American metal band Agalloch under the Brooklyn, New York-based label, The End Records. It is Agalloch's third full-length release, four years after the critically acclaimed The Mantle. Before the release, the track \"Falling Snow\" was made available in its entirety on the label's website and on the band's MySpace page. Reports indicate a version of the album was leaked on the web in May 2006. A pre-release review in the July 2006 issue of Toronto-based Exclaim! magazine described the new album as a \"departure and an extension\" from the band's previous work: .", "desc_lfm_artist": "Agalloch is an American folk doom metal band formed in Portland, Oregon, United States in 1995.\n\nAfter two demo releases in the late 1990’s the band released three full-length albums: Pale Folklore (1999), The Mantle (2002), and Ashes Against the Grain (2006). “The Mantle” has since been heralded as a classic for having been one of the first albums to combine elements from black metal, neo-folk, progressive rock, post-rock, and ambient music. The influence of this record can be heard in the music of multiple “post-black metal” bands.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 188, "title": "Dronevil -Final-", "artist": "Boris", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/63360-dronevil-final-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/63360-boris-dronevil-final.php", "aoty_critic_score": 80, "aoty_user_score": 89, "mbid": "11431e95-21ff-3d3f-85c6-04381e5e26be", "yt_id": "ZB51taDpPZg", "rym": null, "genres": ["Metal"], "desc_lfm_album": "This is the remastered Japanese release version of the album Dronevil, which was originally released in 2005 in the US, on double vinyl with a different artwork. Only 1000 copies of the original version were sold. Though the two sides can be heard separately, the original intention is for both to be played simultaneously. .", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 189, "title": "Carnavas", "artist": "Silversun Pickups", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/carnavas.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5284-silversun-pickups-carnavas.php", "aoty_critic_score": 66, "aoty_user_score": 81, "mbid": "4eb68c5b-dc3f-3a1d-bcc1-9ade293f7627", "yt_id": "RbqirvcuID8", "rym": "https://rateyourmusic.com/release/album/silversun-pickups/carnavas", "genres": [], "desc_lfm_album": "Carnavas is Silversun Pickups' first full-length studio album. It was released on July 26, 2006. The title is an homage to Aubert's Greek heritage. Some suppliers were also given copies of The Tripwire Session: Live In Chicago, a four track EP. As of the Billboard 200 dated June 30, 2007, it has sold 183,864 copies. The album generated two successful singles on the US Modern Rock chart. Lazy Eye hit #5 and Well Thought Out Twinkles hit #9, the first one in 2007 and the following peaked at #9 in 2008. The song Well Thought Out Twinkles is part of .", "desc_lfm_artist": "Silversun Pickups is an American alternative rock band which formed in Los Angeles, California, United States in 2000. The band members are friends who had played together previously or in mutual friends' bands. \n\nThe name Silversun Pickups refers to a liquor store across the road L.A. rock-scene hang Silverlake Lounge. One of the band’s friends would often arrive at the store late at night to buy liquor, and would be as such making the \"Silversun Pickup\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 190, "title": "Alright, Still", "artist": "Lily Allen", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/alright-still-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/452-lily-allen-alright-still.php", "aoty_critic_score": 77, "aoty_user_score": 80, "mbid": "06e9ba8d-6920-3a47-aa3a-6fa63224ef3f", "yt_id": "OBddC_4T3yQ", "rym": "https://rateyourmusic.com/release/album/lily-allen/alright-still", "genres": [], "desc_lfm_album": "Alright, Still is the debut studio album by English singer Lily Allen. It was released on July 13th, 2006 by Regal Recordings. After being rejected by several record labels, Allen signed to London Records, who eventually lost interest in her, leading her to meet production duo Future Cut and sign to Regal Recordings. Recording for the album began in 2004 with sessions between Allen and Future Cut. and Allen's work garnered publicity on the Internet as she posted demos to her Myspace account before they were officially released. Allen later travelled to the United States to work with Greg Kurstin .", "desc_lfm_artist": "Lily Rose Beatrice Allen (born 2 May 1985), known professionally as Lily Allen, is an English singer/songwriter, hailing from London, United Kingdom. Allen left school when she was 15 and concentrated on improving her performing and compositional skills. She started her musical career in 2002 by signing to London Records. In 2005, she made some of her recordings public on Myspace and the publicity resulted in airplay on BBC Radio 1 and a contract with Regal Recordings.", "desc_mb_album": "", "desc_m now with a little more polish, TV on the Radio's second album (and Interscope debut), Return to Cookie Mountain, is their most satisfying work since they exploded onto the scene with Young Liars. More than some of their indie rock peers, TV on the Radio seems comfortable on a major label. They've always been a band with a big, unapologetically ambitious sound, and on Return to Cookie Mountain, they give that sound room to breathe with a lush, expansive production. The sonic depth throughout the album is a sharp contrast with the density of their .", "desc_lfm_artist": "TV on the Radio is an American indie rock band formed in 2001 in Brooklyn, New York.\n\nThe group has released several EPs including their debut Young Liars (2003), and five studio albums: Desperate Youth, Blood Thirsty Babes (2004), Return to Cookie Mountain (2006), Dear Science (2008), Nine Types of Light (2011), and Seeds (2014).\n\nFor most of the band's existence, the core TV on the Radio lineup has been Tunde Adebimpe (vocals/loops),  David Andrew Sitek (guitars/keyboards/loops)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "paqueradejere", "verygooood"]}, {"n": 194, "title": "Black Holes and Revelations", "artist": "Muse", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/black-holes-and-revelations-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2565-muse-black-holes-and-revelations.php", "aoty_critic_score": 76, "aoty_user_score": 81, "mbid": "af2e8e23-e9c3-4e67-8ad8-66387c5898fd", "yt_id": "EjRg-T4WF1w", "rym": null, "genres": [], "desc_lfm_album": "Black Holes and Revelations is the fourth studio album by English alternative rock band Muse, released on 3 July 2006. Recording was split between New York and France, and it was the first time Muse had taken a more active role in the album's production. The album was a change in style from Muse's previous albums, and the band cited influences that included Queen, Millionaire, Sly and the Family Stone, Depeche Mode, Franz Ferdinand and music from southern Italy. The album has political and sci-fi undertones, with the lyrics covering topics as varied as political corruption, alien invasion, New World .", "desc_lfm_artist": "Muse is an English rock band from Teignmouth, Devon, formed in 1994. The band consists of Matt Bellamy (lead vocals, guitar, keyboards), Chris Wolstenholme (bass guitar, backing vocals), and Dominic Howard (drums, percussion).\n\nMuse released their debut album, \"Showbiz,\" in 1999, which featured Bellamy's falsetto and a melancholic alternative rock style. Their second album, \"Origin of Symmetry\" (2001), incorporated wider instrumentation and classical influences and contributed to their reputation for energetic live performances.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 195, "title": "Begin to Hope", "artist": "Regina Spektor", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/begin-to-hope.jpg", "aoty_url": "https://www.albumoftheyear.org/album/374-regina-spektor-begin-to-hope.php", "aoty_critic_score": 76, "aoty_user_score": 80, "mbid": "473691ea-841e-3427-9fa4-63f64fd048ce", "yt_id": "UaIg8TK8Xfg", "rym": "https://rateyourmusic.com/release/album/regina-spektor/begin-to-hope", "genres": [], "desc_lfm_album": "Begin to Hope is the fourth album by American singer-songwriter, Regina Spektor. It was released June 13, 2006. The album debuted at number 70 on the Billboard 200, but due to the popularity of the single \"Fidelity\", it peaked at number 20 and was labeled a \"pace setter\" by Billboard. Rolling Stone magazine named it the 21st-best album of 2006. The album was certified Gold by the RIAA for shipments to U.S. retailers of 500,000 units. .", "desc_lfm_artist": "Regina Ilyinichna Spektor is a Russian–born American singer, songwriter and pianist.\n\nAfter self-releasing her first three records and gaining popularity in New York City's independent music scenes, particularly the anti-folk scene centered on New York City's East Village, Spektor signed with Sire Records in 2004 and began achieving greater mainstream recognition. After giving her third album a major label re-release, Sire released Spektor's fourth album, Begin to Hope, which achieved a Gold certification by the RIAA.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "armandwave"]}, {"n": 196, "title": "Citrus", "artist": "Asobi Seksu", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1009-citrus_014555.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1009-asobi-seksu-citrus.php", "aoty_critic_score": 79, "aoty_user_score": 81, "mbid": "066fe83f-0921-3189-b076-28ae83478a8a", "yt_id": "TZaMtOTVZV8", "rym": "https://rateyourmusic.com/release/album/asobi-seksu/citrus", "genres": ["indie rock", "shoegaze"], "desc_lfm_album": "Citrus is the second studio album by New York-based band Asobi Seksu (Japanese slang for \"casual sex\"). It was released on May 30, 2006 through Friendly Fire recordings. The song \"Thursday\" was featured in episode 1 of season 2 of Skins, while Nefi + Girly features on the Series 3 character trailers and episode 1 credit sequence. .", "desc_lfm_artist": "Asobi Seksu was a dream pop band which formed in 2004 in New York City, New York, United States. The band consisted of Yuki Chikudate (vocals, keyboards), James Hanna (guitar, vocals), Billy Pavone (bass) and Larry Gorman (drums). The band's name in Japanese consists of two words, \"asobi\" meaning \"play\" or \"for fun\", and \"sekkusu\" the Japanese transliterated word for \"sex\".\n\nTheir sound has been said to draw influence from the shoegazing movement of the late 1980s to early 1990s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "sdecandelario", "verygooood"]}, ral countries.\n\nTo date, the band has released five studio albums, one EP and one box set.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 201, "title": "Late Orchestration", "artist": "Kanye West", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29229-late-orchestration-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29229-kanye-west-late-orchestration.php", "aoty_critic_score": 70, "aoty_user_score": 85, "mbid": "0c95909c-4d34-37c0-910c-911106f7bb90", "yt_id": "hzD9maUc46s", "rym": null, "genres": [], "desc_lfm_album": "Late Orchestration is the first live album by American musician and producer Kanye West, released on April 24, 2006. The album was recorded on September 21, 2005 in front of a live audience of 300 invited guests at Abbey Road Studios in London, England, with West backed by a seventeen-piece all-female string orchestra. The concert features selections from West's first and second albums, The College Dropout and Late Registration. The album artwork features West's mascot the Dropout Bear crossing the Abbey Road crosswalk, paying homage to The Beatles' famed 1969 album Abbey Road. The album received critical acclaim for West's .", "desc_lfm_artist": "Ye, born Kanye Omari West on June 8, 1977, is an American rapper, singer, songwriter, record producer, and fashion designer. He is one of the most prominent figures in hip hop, known for his diverse musical style and polarizing cultural and political commentary. After dropping out of college to pursue a career in music, West began producing for regional artists in the Chicago area. As an in-house producer for Roc-A-Fella Records, he co-produced albums including Jay-Z's The Blueprint (2001) before signing with the label as a recording artist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "alberto_gu"]}, {"n": 202, "title": "Chosen Lords erican neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 204, "title": "Fishscale", "artist": "Ghostface Killah", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/445-fishscale_171603.jpg", "aoty_url": "https://www.albumoftheyear.org/album/445-ghostface-killah-fishscale.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "67de538c-a1e0-39d0-91dd-c9d29e72e06c", "yt_id": "s8n7nYA8CIM", "rym": "https://rateyourmusic.com/release/album/ghostface-killah/fishscale", "genres": ["Hip-Hop"], "desc_lfm_album": "Fishscale is the fifth studio album by American rapper and Wu-Tang Clan member Ghostface Killah, released March 28, 2006, on Def Jam in the United States. The album features guest appearances from every member of the Wu-Tang Clan, as well as Ghostface Killah's Theodore Unit. It also features producers such as MF Doom, Pete Rock, J Dilla, and Just Blaze, among others. The album follows an organized crime theme, and is named after a term for uncut cocaine. Fishscale sold nearly 110,000 units in its first week of release, and debuted at number four on the Billboard 200, and number .", "desc_lfm_artist": "Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 adian indie rock group The New Pornographers.\n\nCase moved around often as a child, spending the largest part of her youth in Tacoma, Washington. She left her parents at age 15 and three years later she started playing drums for several bands around the Northwest's punk rock scene.", "desc_mb_album": "", "desc_mb_artist": "Early Neko Case releases can be found under [artist:4763e116-5ba5-4ad2-b2b6-95c3179e6904|Neko Case & Her Boyfriends]", "heard_by": ["Frikomid", "alberto_gu", "armandwave"]}, {"n": 207, "title": "Destroyer's Rubies", "artist": "Destroyer", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/destroyers-rubies-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/313-destroyer-destroyers-rubies.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "bd207646-7cc8-3d4e-ae55-cc11b1804827", "yt_id": "2KDtJjzJWS0", "rym": "https://rateyourmusic.com/release/album/destroyer/destroyers-rubies", "genres": ["Alternative Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Destroyer is a Canadian indie rock band from Vancouver, British Columbia fronted by singer-songwriter Dan Bejar and formed in 1995. Destroyer songs are characterized by abstract, poetic lyrics and idiosyncratic vocals. The band's discography draws on a variety of musical influences, resulting in albums that can sound markedly distinct from one another; in Bejar's words, \"That's kind of my goal: to start from scratch every time.\"\n\n1996–2001\nWe'll Build Them a Golden Bridge, Destroyer's 1996 debut, is made up of sixteen lo-fi home-recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 208, "title": "Silent Shout", "artist": "The Knife", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/silent-shout-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/448-the-knife-silent-shout.php", "aoty_critic_score": 79, "aoty_user_score": 81, "mbid": "02c05025-e031-30a0-afee-d92cea9d79dd", "yt_id": "SDdVVPOcLhM", "rym": "https://rateyourmusic.com/release/album/the-knife/silent-shout/", "genres": ["electro", "synth-pop", "electropop", "techno", "Electronic"], "desc_lfm_album": "", "desc_lfm_artist": "The Knife was an electronic duo from Gothenburg, Sweden formed in 1999. The band consisted of siblings Karin Dreijer (formerly of Honey is Cool, now Fever Ray) and Olof Dreijer (Oni Ayhun) - who also run their own record company, Rabid Records. Their lyrics were often political and left-leaning, involving strong critique of capitalism, colonialism and discrimination, and expressing support for causes including but not limited to queer rights, feminism and gender politics.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 209, "title": "Donuts", "artist": "J Dilla", "year": 2006, "cover": "https://dn711205.ca.archive.org/0/items/mbid-ea7093bb-3727-4feb-8925-90cdc88e3f96/mbid-ea7093bb-3727-4feb-8925-90cdc88e3f96-24308770860.jpg", "aoty_url": "https://www.albumoftheyear.org/album/456-j-dilla-donuts.php", "aoty_critic_score": 84, "aoty_user_score": 89, "mbid": "6b78c33a-64c4-3472-99e9-be45a392acb4", "yt_id": "5nO7IA1DeeI", "rym": "https://rateyourmusic.com/release/album/j-dilla/donuts", "genres": ["hip hop", "instrumental hip hop", "Jazz", "Hip-Hop"], "desc_lfm_album": "Donuts was made on a hospital bed and in a home studio on a stripped-down setup with a stack of vinyl. Released on its maker's 32nd birthday three days before he passed away, the album has a resonance deeper than anyone could've hoped for or even imagined. Some who were close to Dilla have said that there are hidden messages in the samples, track titles, and who knows where else. On Metacritic, Donuts received \"universal acclaim\" from critics based on an aggregate score of 84/100 from fifteen reviews. .", "desc_lfm_artist": "J Dilla was born James Dewitt Yancey on February 7, 1974 in Detroit, Michigan, to Maureen and Beverly Yancey. From the onset, music was intrinsic to Jay's life. His mother Maureen was an accomplished singer and lover of classical music and opera. His father Beverly was a gifted vocalist and bass player fond of vocal harmonies and jazz, who played professionally for 25 years before taking a job at Ford. A two-year-old Jay would gurgle along in perfect pitch to the sound of his father practicing on his upright bass until it lulled him to sleep.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 210, "title": "The Greatest", "artist": "Cat Power", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-greatest.jpg", "aoty_url": "https://www.albumoftheyear.org/album/455-cat-power-the-greatest.php", "aoty_critic_score": 80, "aoty_user_score": 76, "mbid": "1d09530d-2a86-3495-9de1-6636e5f8a0f1", "yt_id": "_qpDc82HO3s", "rym": "https://rateyourmusic.com/release/album/cat-power/the-greatest", "genres": [], "desc_lfm_album": "The Greatest is the seventh studio album by indie rock artist Chan Marshall, a.k.a Cat Power; released in January 20, 2006 on Matador Records. It is her first album to feature no cover songs. .", "desc_lfm_artist": "Cat Power is an American singer, songwriter, musician, actress, and model. Charlyn Marie Marshall (also known as Chan, pronounced \"Shawn\")  was born in Atlanta, Georgia, U.S. on 21 January 1972. Cat Power was originally the name of Marshall's first band, but has become her stage name as a solo artist.\n\nAfter dropping out of high school, Marshall started performing under the name Cat Power, while in Atlanta, backed by musicians Glen Thrasher, Mark Moore, and others.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 211, "title": "A Piece of Strange", "artist": "CunninLynguists", "year": 2006, "cover": "https://i.discogs.com/leucJc4b-6yZqycpr8f4npKLFRR-uBGEj3D8WdtqBX8/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTY0MzEy/Ny0xMzQ3OTg2NDQ0/LTQ3MzYuanBlZw.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/15410-cunninlynguists-a-piece-of-strange.php", "aoty_critic_score": 80, "aoty_user_score": 87, "mbid": "0e662dc0-605f-3a95-9004-4246f6b24210", "yt_id": "QO53tTmU42k", "rym": "https://rateyourmusic.com/release/album/cunninlynguists/a-piece-of-strange/", "genres": [], "desc_lfm_album": "A Piece of Strange is the third studio album by CunninLynguists. It was released January 24, 2006, by The LA Underground, a record label based in New Mexico. The “high-concept record” tells the \"tale of the pathway to and from sin\". The album was produced entirely by Kno, and vocals are by Kno, Deacon the Villain and Natti, who joined the group prior to the recording of the album. Featured guest vocalists include Cee-Lo Green, Immortal Technique, and Tonedeff. Deacon and Kno have both cited the album's importance to their careers in interviews, with Kno calling it a \"turning point\" .", "desc_lfm_artist": "CunninLynguists are a hip hop trio from Lexington, Kentucky and Atlanta, Georgia, the United States. The group currently consists of Deacon the Villain, Kno, and Natti. The name is a portmanteau of the words cunning and linguist, and is also a play on the word cunnilingus.\n\nThere has never been an anomaly in hip-hop quite like the southern trio CunninLynguists. Sampling genres from psych-rock to blues, New Romantic to polka, they have been musically compared to UGK and Atmosphere in the same breath.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "alberto_gu", "armandwave"]}, {"n": 212, "title": "Whatever People Say I Am, That's What I'm Not", "artist": "Arctic Monkeys", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/351-whatever-people-say-i-am-thats-what-im-not_165249.jpg", "aoty_url": "https://www.albumoftheyear.org/album/351-arctic-monkeys-whatever-people-say-i-am-thats-what-im-not.php", "aoty_critic_score": 83, "aoty_user_score": 85, "mbid": "6c9c4985-3628-3070-b956-b538f30c9bea", "yt_id": "tqY7W5Ysclk", "rym": "https://rateyourmusic.com/release/album/arctic-monkeys/whatever-people-say-i-am-thats-what-im-not", "genres": ["Punk", "Alternative Rock"], "desc_lfm_album": "Whatever People Say I Am, That's What I'm Not is the debut album by Sheffield band Arctic Monkeys, released on January 23, 2006. The album became the fastest-selling debut album in the UK since Definitely Maybe by Oasis. The album sold over 360,000 copies in its first week, but lost the title in November 2007 to Leona Lewis's album Spirit. It has since gone quadruple platinum in the UK and won the 2006 Mercury Prize. The album includes both tracks from the band's original EP, Five Minutes with Arctic Monkeys, as well as their first two singles and UK Number .", "desc_lfm_artist": "Arctic Monkeys are an alternative rock band formed in Sheffield, South Yorkshire, England in 2002 after meeting at Stocksbridge High School. The band consists of Alex Turner (vocals, guitar, piano), Jamie Cook (guitar), Nick O'Malley (backing vocals, bass) and Matt Helders (drums, vocals). Founding bassist Andy Nicholson left in 2006.\n\nThey are one of the first bands to come to public attention via the Internet via MySpace, despite none of them having an account.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 213, "title": "Colour Green", "artist": "Sibylle Baier", "year": 2006, "cover": "https://cdn2.albumoftheyear.org/600x0/album/26658-colour-green.jpg", "aoty_url": "https://www.albumoftheyear.org/album/26658-sibylle-baier-colour-green.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "a6d9dc68-9bc3-3898-a528-0f2cd844d9f3", "yt_ wU"]}, {"n": 215, "title": "Tha Carter II", "artist": "Lil Wayne", "year": 2005, "cover": "https://dn711107.ca.archive.org/0/items/mbid-cdd4ba80-b911-4942-916f-b984dac07f16/mbid-cdd4ba80-b911-4942-916f-b984dac07f16-17183697894.jpg", "aoty_url": "https://www.albumoftheyear.org/album/889-lil-wayne-tha-carter-ii.php", "aoty_critic_score": 79, "aoty_user_score": 82, "mbid": "d97d9f3b-3dc1-3330-a240-b84b74e62044", "yt_id": "yGZ6sdapLz0", "rym": "https://rateyourmusic.com/release/album/lil-wayne/tha-carter-ii", "genres": ["hip hop", "dirty south", "southern hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "Did you mean: Lil' Wayne\n\nDwayne Michael Carter, Jr. (born September 27, 1982 in New Orleans, Louisiana), better known by his stage name Lil Wayne, is an American rapper. Formerly a member of the rap group the Hot Boys, he joined the Cash Money Records collective as a teenager. Get It How U Live, released in 1997, was Lil Wayne's first album with Hot Boys, and Tha Block is Hot, his solo debut, came out in 1999.\nAfter gaining fame with two other albums in the early 2000s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu"]}, {"n": 216, "title": "The Ape of Naples", "artist": "Coil", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29436-the-ape-of-naples_174502.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29436-coil-the-ape-of-naples.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "994c7f15-416f-3f7e-b8bd-55127589c0fe", "yt_id": "INMo0sj9AMw", "rym": "https://rateyourmusic.com/release/album/coil/the-ape-of-naples/", "genres": [], "desc_lfm_album": "As the last album recorded during John Balance's lifetime, The Ape of Naples serves as a final statement and summation of the band's multi-faceted career. The album is more of a \"classic\"-sounding Coil album (in the vein of Love's Secret Domain and Musick to Play in the Dark, Vol. 1) than more recent outings (such as ANS, Constant Shallowness Leads to Evil, or Astral Disaster). Ape is made up of recording sessions that date back to the mid-'90s, recordings done for Trent Reznor's nothing label, and more recent works that were still getting worked out in a live environment (\"Triple .", "desc_lfm_artist": "Coil (1982–2004) was initially established in London in 1983 as an experimental solo outlet for ex-Psychic TV member John Balance, and became a full-fledged experimental sonic manipulation unit a year later following the arrival of keyboardist / programmer Peter Christopherson (Sleazy), a founder of Psychic TV as well as a member of Throbbing Gristle. After debuting with the 17-minute ritual recording How to Destroy Angels, Balance and Sleazy recruited the aid of Possession’s Stephen Thrower, J.", "desc_mb_album": "", "desc_mb_artist": "Also performs as: [artist:a956d00f-3f58-4576-83b7-7415bf58df4b|Black Light District], [artist:3f183292-f1af-40b5-8195-725003ed3cdc|ELpH], and [artist:2269ab04-c82a-4a30-a908-a100b61f9940|Time Machines]", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 217, "title": "Hypnotize", "artist": "System of a Down", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5388-hypnotize_191444.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5388-system-of-a-down-hypnotize.php", "aoty_critic_score": 76, "aoty_user_score": 81, "mbid": "72035143-d6ec-308b-8ee5-070b8703902a", "yt_id": "RuA_l8XnbFc", "rym": "https://rateyourmusic.com/release/album/system-of-a-down/hypnotize", "genres": [], "desc_lfm_album": "Hypnotize is the fifth album by System of a Down and the second half of the Mezmerize/Hypnotize double album before their hiatus. It was released on November 22, 2005, six months after the release of companion album Mezmerize. The album was released on both CD and DualDisc; the latter contains behind-the-scenes footage showing the making of Mezmerize and Hypnotize, the music videos for the songs \"B.Y.O.B.\" and \"Question!\", and the entire album in enhanced stereo (LPCM at 16-bit/48KHz versus the CD standard of 16-bit/44.1KHz). The album case was printed with soy inks on recycled paper. Inside the booklet the words, .", "desc_lfm_artist": "System of a Down is an Armenian-American heavy metal band formed in Glendale, California, in 1994. Since 1997, the lineup has consisted of Serj Tankian (lead vocals, keyboards), Daron Malakian (guitar, vocals), and Shavo Odadjian (bass, backing vocals), along with drummer John Dolmayan, who replaced original drummer Andy Khachaturian.\n\nThe band achieved commercial success with five studio albums, three of which debuted at number one on the US Billboard 200.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 218, "title": "Pink", "artist": "Boris", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/470-pink_015704.jpg", "aoty_url": "https://www.albumoftheyear.org/album/470-boris-pink.php", "aoty_critic_score": 81, "aoty_user_score": 87, "mbid": "6c8b3082-65a6-367c-b35f-140ede4ac855", "yt_id": "mOHpkFUASyk", "rym": "https://rateyourmusic.com/release/album/boris/pink/", "genres": ["Metal"], "desc_lfm_album": "Pink is an album by Japanese band Boris, released in 2005 on Diwphalanx Records in Japan and subsequently reissued in the US on Southern Lord. The album received very favourable reviews, largely for taking a more melodic and accessible direction than the band's previous work. A music video was also shot for the title track, but was limited to less than 100 copies on DVD. It was later included in the limited CD+DVD Southern Lord version of the album 'Smile'. .", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "Lonsonxd", "MaxtorUwU", "alberto_gu", "sdecandelario"]}, {"n": 219, "title": "Those Once Loyal", "artist": "Bolt Thrower", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/59799-those-once-loyal.jpg", "aoty_url": "https://www.albumoftheyear.org/album/59799-bolt-thrower-those-once-loyal.php", "aoty_critic_score": 70, "aoty_user_score": 85, "mbid": "180923eb-59de-331e-a724-77ec6b4abe2c", "yt_id": "qFmE9cvHECc", "rym": "https://rateyourmusic.com/release/album/bolt-thrower/those-once-loyal", "genres": ["Metal", "Punk"], "desc_lfm_album": "\"Those Once Loyal\" is the eighth and final studio album by British death metal band Bolt Thrower, released on 11 November 2005 by Metal Blade Records. It was recorded with producer Andy Faulkner at Sable Rose Studios in Coventry, England. The album marked the return of vocalist Karl Willetts, who rejoined the band in November 2004, making it the first Bolt Thrower release to feature him since \"Mercenary\" (1998). Musically, \"Those Once Loyal\" continues Bolt Thrower’s melodic, groove-based death metal style, with comparatively tighter song structures and arrangements and a more refined production than some of the band’s earlier releases. .", "desc_lfm_artist": "Bolt Thrower were a British death metal band from Coventry, England. The band formed in 1986 and released their debut album in 1988 through Vinyl Solution. They later signed to Earache Records, where they became one of the label’s more commercially successful acts, before moving to Metal Blade Records for their final releases. Over the course of their career, the band experienced several lineup changes and toured extensively in Europe, the United States, and Australia.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 220, "title": "Modal Soul", "artist": "Nujabes", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/23658-modal-soul_094228.jpg", "aoty_url": "https://www.albumoftheyear.org/album/23658-nujabes-modal-soul.php", "aoty_critic_score": 89, "aoty_user_score": null, "mbid": "bd62a5df-6643-3aef-b129-9d4e6e296022", "yt_id": "8iP3J8jFYdM", "rym": "https://rateyourmusic.com/release/album/nujabes/modal-soul", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "Modal Soul is Nujabes' second album, released on November 11, 2005. It comes after what was a highly successful 2004 for Nujabes, notably producing both the opener and closer for the wildly popular anime Samurai Champloo. Modal Soul is a combination of hip-hop and jazz, and while the hip-hop influences still exist, most noticeably in the feature department, the album is more jazz-focused than its predecessor. The cast of features is largely unchanged from Metaphorical Music, but there are new ones. Terry Callier and Nujabes come together for a re-imagining of Callier's popular \"Ordinary Joe,\" rapper Apani B delivers appreciative .", "desc_lfm_artist": "Jun Seba (瀬葉淳) (February 7, 1974 - February 26, 2010) was a Japanese hip-hop music producer who recorded under the name Nujabes (new-jah-behz; which is simply his real name spelled backwards). His music is known for a strong cool jazz influence, frequently using samples from artists like Miles Davis and Yusef Lateef.\n\nHe was also an owner of \"tribe\", a record store in Shibuya, Tokyo, and led indie record label Hyde-Out Productions. He released two albums in Japan, Metaphorical Music in 2003 and Modal Soul in 2005.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Maxto ual performance. Her work has influenced a wide range of artists across genres.\n\nBush began writing songs at the age of 11 and was later signed to EMI Records after David Gilmour of Pink Floyd helped fund a professional demo recording.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "armandwave"]}, {"n": 223, "title": "Lullabies in a Glass Wilderness", "artist": "Lalleshwari", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/149192-lullabies-in-a-glass-wilderness.jpg", "aoty_url": "https://www.albumoftheyear.org/album/149192-lalleshwari-lullabies-in-a-glass-wilderness.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "f8e4471f-31c5-31d8-b63a-953dc5f83da4", "yt_id": "I1Pce-KrnLA", "rym": "https://rateyourmusic.com/release/album/lalleshwari/lullabies-in-a-glass-wilderness", "genres": [], "desc_lfm_album": "in 2005 katiejane garside self-released a collection of 4 track home recordings entitled 'lullabies in a glass wilderness', under the pseudonym 'lalleshwari'. these tracks were recorded intermittently over six years. \"this is my work, its a fingerprint, i've been barricaded into a room but managed to slip it out through a crack under the door, it's a message in a bottle caught in returning currents, a child on a desert island discovering these footprints are her own, its ingrown and corrupt with a terrifying impermanence and therefore safely beyond a critique, it asks everybody's else's opinion whilst ignoring its own .", "desc_lfm_artist": "A vocalist and lyricist with an ardent cult following, Katie Jane Garside (born July 8, 1968) fronted the band Daisy Chainsaw and sang guest vocals for Test Dept.. She reappeared in the late 90s as the lead singer of Queen Adreena, an independent rock band from London.\n\nIn 2005 she released a solo album, entitled 'Lullabies In A Glass Wilderness' under the pseudonym 'Lalleshwari'. This was initially made available on her website as a CD/DVD pack, limited to 300 copies, the first 100 being signed and numbered by KatieJane.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 224, "title": "Feels", "artist": "Animal Collective", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/306-feels_101057.jpg", "aoty_url": "https://www.albumoftheyear.org/album/306-animal-collective-feels.php", "aoty_critic_score": 81, "aoty_user_score": 84, "mbid": "5438d2fd-1499-3daa-9f85-091a497d270b", "yt_id": "ldQ-cvW0OcI", "rym": "https://rateyourmusic.com/release/album/animal-collective/feels/", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Feels is the sixth studio album by Baltimore-based band Animal Collective, released in 2005 by FatCat Records. The album was chosen as one of Amazon.com's Top 100 Editor's Picks of 2005. Initial copies contained a bonus disc of live material. Recording Feels is known for its interesting guitar sounds, which were obtained in part by the unique tuning the band used. Geologist explained how they created and used this tuning on the Collected Animals message board: \"All the songs on Feels are tuned to our friends piano which was out of tune to begin with. Dave and I made loops .", "desc_lfm_artist": "Animal Collective are an American experimental pop band formed in Baltimore, Maryland in 1999. The group consists of David Portner (Avey Tare), Noah Lennox (Panda Bear), Brian Weitz (Geologist), and Josh Dibb (Deakin). Their music blends a wide range of styles, including psychedelia, freak folk, noise, and electronica, incorporating elements such as loops, drones, sampling, vocal harmonies, and sound collage. The band is known for its distinctive approach to experimental rock and pop music.", "desc_mb_album": "", "desc_mb_artist": "=== Don't add these albums here: ===\r\n[https://musicbrainz.org/artist/22568c9d-8ef3-4224-b994-8e0658e1082a|Avey Tare] and [https://musicbrainz.org/artist/fd3c3f9f-a471-498e-ab3a-940ac20b6bbd|Panda Bear] — [https://musicbrainz.or re-headphase.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7209-boards-of-canada-the-campfire-headphase.php", "aoty_critic_score": 78, "aoty_user_score": 83, "mbid": "401bc572-414c-3cb2-b2b8-fbef17eb9ab0", "yt_id": "fHWAeBDvYog", "rym": "https://rateyourmusic.com/release/album/boards-of-canada/the-campfire-headphase", "genres": ["Electronic"], "desc_lfm_album": "The Campfire Headphase is the third full-length album by Boards of Canada, the release makes use of lo-fi acoustics and reduces the focus on synthesization featured on previous records – “a deliberate thing” in response to “people saying that we're a formulaic band that you could kind of describe in a couple of sentences.” Michael Sandison, one of the two member of the band says about the album: “we were picturing this character losing his mind at the campfire and compressing weeks of events into a few hours, in that time-stretching way that acid fucks with your perception.” .", "desc_lfm_artist": "Boards of Canada is an electronic music duo from Edinburgh, Scotland, UK, formed in 1985 and comprised of brothers Mike Sandison (born 1 June 1970) and Marcus Eoin (born 21 July 1971). They have released a number of works, most notably the studio albums Music Has the Right to Children (1998), Geogaddi (2002), and The Campfire Headphase (2005) on the pioneering electronic music label Warp. Their fourth album Tomorrow's Harvest was released in June 2013.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 227, "title": "The Runners Four", "artist": "Deerhoof", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-runners-four.jpg", "aoty_url": "https://www.albumoftheyear.org/album/489-deerhoof-the-runners-four.php", "aoty_critic_score": 81, "aoty_user_score": 77, "mbid": "f3c2a934-4122-323c-820e-be582d7dde96", "yt_id": "9VS5TYeqtOs", "rym": null, "genre
