"artist": "Alexisonfire", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8600-alexisonfire.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8600-alexisonfire-alexisonfire.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "9b436264-ebcc-3287-86e9-1d9a119a8306", "yt_id": "cBRMxMFgKps", "rym": "https://rateyourmusic.com/release/album/alexisonfire/alexisonfire", "genres": [], "desc_lfm_album": "Debut album of Alexisonfire, released in 2002. Highly acclaimed and listed on NME's \"20 Emo Albums That Have Resolutely Stood The Test Of Time\" list. .", "desc_lfm_artist": "Alexisonfire is a post-hardcore band from St. Catharines, Ontario, Canada. Their music is characterized by turbulent and explosive dynamics with intricate guitar melodies. Consisting of five friends, they formed in late 2001 as the result of a three-band break up.\n\nThe band’s name is inspired by a lactating contortionist stripper named Alexis Fire. This caused problems when she discovered that they were using her website name (alexisonfire.com) as their band name, and threatened to sue.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU"]}, {"n": 385, "title": "( )", "artist": "Sigur Rós", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/565--_122228.jpg", "aoty_url": "https://www.albumoftheyear.org/album/565-sigur-ros--.php", "aoty_critic_score": 79, "aoty_user_score": 86, "mbid": "2854e284-8c90-4c73-a997-f16246571b7f", "yt_id": "XqKKaadbJl4", "rym": "https://rateyourmusic.com/release/album/sigur-ros/-", "genres": [], "desc_lfm_album": "It doesn't have any other official name than ( ), so the name of this album can be pronounced in several ways. The members of Sigur Rós usually refer to it in Icelandic as \"Svigaplatan\" (\"The Bracket Album\"). In the credits of the movie \"Heima\" it is referred to as \"The Untitled Album\". Fans have referred to it as \"Parentheses\" or \"Brackets\". This album's vocals are recorded in \"Vonlenska\" (\"Hopelandic\"), which consists of meaningless syllables and resembles scat singing. The \"language\" is named after Von, the first song that featured it. Most of the syllable-strings sung by vocalist Jón Þór .", "desc_lfm_artist": "Sigur Rós is an Icelandic post-rock band. The name is derived from the name of lead vocalist Jónsi Birgisson's little sister, Sigurrós. They hail from the same creative and vibrant Icelandic music scene as múm and Amiina. They released their first-ever foray into film-making with their tour documentary, Heima in late 2007. \n\nJón Þór Birgisson (Jónsi), Georg Hólm, and Ágúst Ævar Gunnarsson formed the group in Reykjavík, Iceland in August 1994.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 386, "title": "Out of Season", "artist": "Beth Gibbons & Rustin Man", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4832-out-of-season_063039.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4832-beth-gibbons-rustin-man-out-of-season.php", "aoty_critic_score": 79, "aoty_user_score": 83, "mbid": "20c64f88-7893-3ff1-8ec2-ff53ac7fcf33", "yt_id": "ABbZcx6zE5o", "rym": null, "genres": [], "desc_lfm_album": "Out of Season is an album by Portishead frontwoman Beth Gibbons and former Talk Talk bassist Paul Webb (under the pseudonym Rustin Man). It was released in 2002 in the United Kingdom and in 2003 in the U.S. Out of Season is largely a folk album with jazz leanings, with Gibbons and Webb drawing more directly on the influences of Nina Simone, Billie Holiday, and Nick Drake, at which Portishead's work in trip-hop only hinted. Out of Season also features contributions from Gibbon's fellow Portishead bandmate Adrian Utley. The first track of the album, Mysteries, appears on the original soundtrack .", "desc_lfm_artist": "Portishead singer Beth Gibbons & Rustin Man, aka Paul Webb of Talk Talk fame, produce music that's best described as quiet, acoustic folk and jazz balladry which showcases Gibbons's versatile voice. They have released one album, Out of Season, which spawned two music videos: \"Tom the Model\" and \"Mysteries\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "armandwave"]}, {"n": 387, "title": "Original Pirate Material", "artist": "Streets", "year": 2002, "cover": "https://dn711001.ca.archive.org/0/items/mbid-b989ceea-ade1-4b7b-917d-dee0fdb62f92/mbid-b989ceea-ade1-4b7b-917d-dee0fdb62f92-4784108032.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e701a954-0fd7-3789-83cb-03b5a28783b7", "yt_id": "ob9ui9ocdVY", "rym": "https://rateyourmusic.com/release/album/the-streets/original-pirate-material", "genres": ["hip hop", "house", "uk garage", "garage house"], "desc_lfm_album": "", "desc_lfm_artist": "Streets is a rock band that Kansas vocalist Steve Walsh formed in the 80s. They released two albums for Atlantic Records starting with 1983's 1st, and 1985's Crimes In Mind. The former featured the hit If Love Should Go, but both albums didn't do very well in the sales market, and Atlantic dropped them in 1985. Wounded Bird Records reissued both the band's albums on CD in 2002.\n\n(Not to be confused with hip-hop act The Streets.)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 388, "title": "You Forgot It in People", "artist": "Broken Social Scene", "year": 2002, "cover": "https://dn711301.ca.archive.org/0/items/mbid-f461c619-5c8e-4263-8dbb-2c005d6d25fb/mbid-f461c619-5c8e-4263-8dbb-2c005d6d25fb-34299338672.jpg", "aoty_url": "https://www.albumoftheyear.org/album/548-broken-social-scene-you-forgot-it-in-people.php", "aoty_critic_score": 87, "aoty_user_score": 86, "mbid": "65731979-ad24-3497-8c8b-541be4aa2fae", "yt_id": "V6BLuIm872I", "rym": "https://rateyourmusic.com/release/album/broken-social-scene/you-forgot-it-in-people", "genres": ["indie rock", "post-rock", "Alternative Rock"], "desc_lfm_album": "You Forgot It in People is a 2002 album by Broken Social Scene. It won the Alternative Album of the Year Juno Award in 2003. It followed Feel Good Lost, and was the band's commercial and artistic breakthrough. Many of the songs that didn't make it onto the album were featured in a B-sides compilation titled Bee Hives released in 2004. You Forgot It in People features intricate, experimental production techniques and a large number of instruments coinciding with the band's vastly expanded size. Music videos were made for a number of tracks, including singles \"Stars and Sons\", \"Almost Crimes\", .", "desc_lfm_artist": "Broken Social Scene are a Canadian indie rock collective formed in 1999 in Toronto, Ontario. The band's core members were Kevin Drew and Brendan Canning. This duo recorded and released the band's ambient debut album Feel Good Lost, in 2001, with contributions from Ohad Benchetrit (also known as Years), Evan Cranley, Leslie Feist, Justin Peroff, Bill Priddle, and Charles Spearin. All of these musicians would emerge as key members of Broken Social Scene in future endeavors.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 389, "title": "Sea Change", "artist": "Beck", "year": 2002, "cover": "https://dn710605.ca.archive.org/0/items/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006-990718896.jpg", "aoty_url": "https://www.albumoftheyear.org/album/568-beck-sea-change.php", "aoty_critic_score": 81, "aoty_user_score": 79, "mbid": "5f84e8b9-b8e5-3fbf-b514-0192a62d88b6", "yt_id": "JB2CvfMY6SM", "rym": "https://rateyourmusic.com/release/album/beck/sea-change", "genres": ["folk rock", "alternative rock", "contemporary folk", "chamber pop", "indie rock", "alternative country"], "desc_lfm_album": "Beck has always been known for his ever-changing moods -- particularly since they often arrived one after another on one album, sometimes within one song -- yet the shift between the neon glitz of Midnite Vultures and the lush, somber Sea Change is startling, and not just because it finds him in full-on singer/songwriter mode, abandoning all of the postmodern pranksterism of its predecessor. What's startling about Sea Change is how it brings everything that's run beneath the surface of Beck's music to the forefront, as if he's unafraid to not just reveal emotions, but to elliptically examine them in .", "desc_lfm_artist": "Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 390, "title": "In Absentia", "artist": "Porcupine Tree", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8994-in-absentia.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8994-porcupine-tree-in-absentia.php", "aoty_critic_score": 67, "aoty_user_score": 80, "mbid": "94cfdc4c-5eb5-3b62-9dbe-8e051528c6e5", "yt_id": "U8sfqB0J7i4", "rym": "https://rateyourmusic.com/release/album/porcupine-tree/in-absentia", "genres": ["Metal", "Rock"], "desc_lfm_album": "In Absentia is the seventh studio album by British progressive rock band Porcupine Tree, first released on September 24, 2002. It was their first release on a major record label, Lava Records. Though never announced as such by the members of the band, many consider In Absentia to be a concept album. It is said to be an investigation of the causes of insanity and serial killing told through the story of man from childhood through marriage, as many of the songs can demonstrate. Steven Wilson is always tight-lipped about the meanings of his lyrics largely because (especially on this .", "desc_lfm_artist": "Porcupine Tree is a British progressive rock band formed in Hemel Hempstead, Hertfordshire, United Kingdom in 1987. During the course of the band's history, it has at times incorporated psychedelic rock, alternative, ambient, electronic, and, most recently, metal and post-rock into its unique style of progressive rock. Since 2010, mainstay Steven Wilson has concentrated on his solo work. On November 1st, 2021, the band announced a new album and tour in the formation Gavin Harrison, Steven Wilson, and Richard Barbieri (without Colin Edwin).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 391, "title": "The Lost Tapes", "artist": "Nas", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6835-the-lost-tapes-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6835-nas-the-lost-tapes.php", "aoty_critic_score": 81, "aoty_user_score": 84, "mbid": "3fa2d5fc-0a60-3282-81a6-e2f19fad9e0d", "yt_id": "NRFNwzeKOq4", "rym": "https://rateyourmusic.com/release/album/nas/the-lost-tapes", "genres": [], "desc_lfm_album": "The Lost Tapes is a compilation album by American rapper Nas. It was released on September 23, 2002, by Ill Will Records and Columbia Records. The album compiles previously unreleased tracks that were discarded from recording sessions for Nas' previous studio albums, I Am... and Stillmatic. .", "desc_lfm_artist": "Nasir bin Olu Dara Jones, more commonly known as Nas (formerly Nasty Nas and Escobar), born September 14, 1973 in Crown Heights, Brooklyn, New York, is a prominent American MC. The son of jazz musician Olu Dara, he was raised in the infamous Queensbridge housing projects in Queensbridge, New York. According to the Nasty Songfacts, as a teenager rapper, Nasir  first went by the nickname Kid Wave before adopting his more commonly known alias of Nasty Nas.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "alberto_gu"]}, {"n": 392, "title": "Oceanic", "artist": "ISIS", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/oceanic-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1754-isis-oceanic.php", "aoty_critic_score": 97, "aoty_user_score": 84, "mbid": "2426e089-b3e2-3513-b43e-f1b73fb54e60", "yt_id": "bCSUBnTiGCo", "rym": null, "genres": ["Metal"], "desc_lfm_album": "Oceanic is the second full-length album by American post-metal band Isis, released on September 16, 2002 by Ipecac Recordings. > Concept The album reintroduces the water and female themes of past releases the Red Sea and Celestial through a story: A man at the brink of emotional numbness finds a female counterpart who completes him (\"The Beginning and the End\"). However, he soon finds that she has had a long-term incestuous relationship (\"False Light\", \"Weight\") with her brother (\"Hym\", \"The Other\"). This drives him to lose all hope, and he commits suicide through drowning (\"from sinking sands, he stepped into .", "desc_lfm_artist": "There are at least eight artists that have used the name Isis:\n\n1. Isis was a Los Angeles, CA based band that started in Boston, MA in 1997. They borrowed from and helped to evolve a sound pioneered by the likes of Neurosis and Godflesh, creating heavy music consisting primarily of lengthy songs that focus on repetition and evolution of structure and texture. As such, their music encompasses a considerable range of genres. Some of these include sludge metal", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 393, nd began playing music together from 1996 to 1998, initially calling themselves Starfish. Coldplay's music incorporates elements of soft rock, pop rock, piano rock, and post-britpop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 396, "title": "Turn on the Bright Lights", "artist": "Interpol", "year": 2002, "cover": "https://dn711202.ca.archive.org/0/items/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30-2981501643.jpg", "aoty_url": "https://www.albumoftheyear.org/album/578-interpol-turn-on-the-bright-lights.php", "aoty_critic_score": 82, "aoty_user_score": 87, "mbid": "e7227840-5ef2-3813-af26-15dab34e1a51", "yt_id": "3QiQZj6cfDM", "rym": null, "genres": ["alternative rock", "post-punk", "indie rock", "post-punk revival", "rock", "Punk"], "desc_lfm_album": "Turn On the Bright Lights is the debut album of New York City rock band Interpol. It was released in 2002 on Matador Records to a great deal of critical acclaim and sold exceptionally well for an indie release; it has sold 499,000 copies in the U.S. so far. It was also ranked highly on the yearly lists of many music critics, and has to date sold 86,000 in the UK despite only charting as high as #101. Musically, many have pointed out the similarities between Turn On the Bright Lights and the bands Joy Division and The Chameleons. \"PDA\", .", "desc_lfm_artist": "Interpol is an American post-punk band formed in Manhattan, New York, in 1997. They played an important part in the post-punk revival of the 2000s. The band consists of Paul Banks (vocals and guitar), Sam Fogarino (drums), and Daniel Kessler (guitar and backing vocals).\n\nThe band's sound is generally a mix of staccato bass and rhythmic, harmonized guitar, with a snare heavy mix, drawing comparisons to post-punk bands such as Joy Division and The Chameleons.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 397, "title": "Lord Willin'", "artist": "Clipse", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/lord-willin-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/906-clipse-lord-willin.php", "aoty_critic_score": 69, "aoty_user_score": 81, "mbid": "ac47c9e0-0da3-398d-b883-4d55527dccfc", "yt_id": "3kMXMGixvtI", "rym": "https://rateyourmusic.com/release/album/clipse/lord-willin", "genres": [], "desc_lfm_album": "Lord Willin' is the debut studio album by hip hop duo Clipse. The album was released on August 20, 2002 in the United States by Arista Records and Star Trak Entertainment. Recording sessions took place over a year, beginning in 2001. Production was handled by The Neptunes. Following the shelving of their original debut studio album Exclusive Audio Footage by Elektra Records, long-time friends and collaborators The Neptunes signed the duo onto their record label Star Trak Entertainment. The Neptunes would go on to handle the production on Lord Willin', with Pharrell Williams featuring on 6 different tracks, including the .", "desc_lfm_artist": "Clipse are a critically acclaimed hip hop duo that formed in Virginia Beach, Virginia in 1992.  They announced the end of their career together at a live show in 2010 and remained firm on this stance, up until 2024 when Pharrell announced a new album with them.\nThe duo is made up of brothers Gene \"No Malice\" Thornton and Terrence \"Pusha T\" Thornton, who is also currently signed to Kanye West's G.O.O.D Music label. They met Pharrell of the producing duo The Neptunes", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 398, "title": "Lifted or The Story Is in the Soil, Keep Your Ear to the Ground", "artist": "Bright Eyes", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1280-lifted-or-the-story-is-in-the-soil-keep-your-ear-to-the-ground_222039.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1280-bright-eyes-lifted-or-the-story-is-in-the-soil-keep-your-ear-to-the-ground.php", "aoty_critic_score": 81, "aoty_user_score": 85, "mbid": "f41575e3-376a-3c8f-9063-51ae2c9df181", "yt_id": "dMzwYG04s4Q", "rym": "https://rateyourmusic.com/release/album/bright-eyes/lifted-or-the-story-is-in-the-soil-keep-your-ear-to-the-ground", "genres": [], "desc_lfm_album": "Lifted or The Story Is in the Soil, Keep Your Ear to the Ground is the fourth studio album by Bright Eyes and the 46th release of Saddle Creek Records. Lifted was the band's first album to reach The Billboard 200, spending one week at No. 161. .", "desc_lfm_artist": "Bright Eyes is an indie rock band consisting of American singer, guitarist, and songwriter Conor Oberst, multi-instrumentalist/producer Mike Mogis, keyboard/trumpet player Nate Walcott, and a rotating lineup of collaborators drawn primarily from Omaha, Nebraska, United States's indie music scene.  Having been deeply influenced early on by singer-songwriters David Dondero and Simon Joyner, Conor Oberst has been recording music since the age of 13. He released his first three albums at the ages of 13", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu", "sdecandelario"]}, {"n": 399, "title": "The Mantle", "artist": "Agalloch", "year": 2002, "cover": "https://dn721505.ca.archive.org/0/items/mbid-a590708e-1907-47ee-814b-8a3745d7b6fc/mbid-a590708e-1907-47ee-814b-8a3745d7b6fc-1122743860.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15700-agalloch-the-mantle.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "eb035963-5a91-3e7e-b54e-186e4cd1234a", "yt_id": "INgo0xmYBeg", "rym": "https://rateyourmusic.com/release/album/agalloch/the-mantle/", "genres": ["doom metal", "post-metal", "black metal", "atmospheric black metal", "dark folk", "folk metal"], "desc_lfm_album": "The Mantle is Agalloch's second full-length album. It was recorded between November 2001 and April 2002, and released by The End Records in August of 2002. \"Trudging Through Deep Snow\" sample created by Aaron Sholes and Neta Smollack. The cover art is a picture of the Thompson Elk sculpture in Portland, Oregon. .", "desc_lfm_artist": "Agalloch is an American folk doom metal band formed in Portland, Oregon, United States in 1995.\n\nAfter two demo releases in the late 1990’s the band released three full-length albums: Pale Folklore (1999), The Mantle (2002), and Ashes Against the Grain (2006). “The Mantle” has since been heralded as a classic for having been one of the first albums to combine elements from black metal, neo-folk, progressive rock, post-rock, and ambient music. The influence of this record can be heard in the music of multiple “post-black metal” bands.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 400, "title": "Nothing", "artist": "Meshuggah", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8286-nothing.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8286-meshuggah-nothing.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "aaf90df0-eec3-3d55-83fd-67b9cf034eb4", "yt_id": "umWGqu2rHR8", "rym": "https://rateyourmusic.com/release/album/meshuggah/nothing-1", "genres": ["Metal"], "desc_lfm_album": "Nothing is the fourth album by Swedish metal band Meshuggah, originally released in 2002. The album entered the Billboard 200 chart at number 165, slightly higher than the band's following effort, Catch Thirtythree. A last-minute decision to join 2002's Ozzfest tour forced the band to mix the album in two days and to master it in one. It was re-mastered for a new re-release with re-recorded guitars in 2006. The songs on this album consist of slower tempos and a heavy focus on groove instead of the thrash metal stylings of previous albums. This stylistic change led to mixed reviews .", "desc_lfm_artist": "Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 401, "title": "From Filthy Tongue of Gods and Griots", "artist": "Dalek", "year": 2002, "cover": "https://dn710605.ca.archive.org/0/items/mbid-0231d42a-d91e-4348-9c3d-0e9fa2a24cb0/mbid-0231d42a-d91e-4348-9c3d-0e9fa2a24cb0-41570312026.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "4c2adca6-aadc-36cc-8a6d-c53a9da4dd4d", "yt_id": "Md602DMa2oU", "rym": null, "genres": ["avant-garde", "psychedelic", "experimental hip hop", "abstract hip hop", "industrial hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "This is an incorrect tag for Dälek. If this non-artist appears in your tags, please fix them.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 402, "title": "Songs About Leaving", "artist": "Carissa's Wierd", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/25872-songs-about-leaving_144811.jpg", "aoty_url": "https://www.albumoftheyear.org/album/25872-carissas-wierd-songs-about-leaving.php", "aoty_critic_score": 77, "aoty_user_score": 88, "mbid": "b8e69326-6882-3821-95ee-7609d9398ffd", "yt_id": "v4j4xk_MM3c", "rym": "https://rateyourmusic.com/release/album/carissas-wierd/songs-about-leaving/", "genres": ["Punk", "Alternative Rock"], "desc_lfm_album": "‘Songs about leaving’ is the third and final album released by Arizona rock/slowcore band Carissa’s wierd before their disbandment in November of 2003. It was released on August 6th, 2002 and rereleased in 2010 with ‘Hardly Art’ It features Mat Brooke as the primary vocalist however Jenn Champion supports with backing vocals and has notable main vocals on songs “So You Wanna Be a Superhero” and “Sofisticated Fuck Princesses Please Leave Me Alone” Songs about leaving stays true to its name with almost every track about a failed relationship, leaving a family or implied suicide and many consider it to .", "desc_lfm_artist": "Carissa's Wierd was an American indie rock band which formed in Seattle, Washington, United States in 1995.\n\nMat Brooke and Jenn Champion formed Carissa's Wierd out of Seattle in 1995, and released three albums before their 2003 breakup. Their plaintive, melancholy,  beautiful music won over many who were exposed to it. The band's lineup changed throughout the band's existence.  Mainstays in the band included violinist Sarah Standard, drummer (and later bassist) Ben Bridwell", "desc_mb_album": "", "desc_mb_artist": "The \"Wierd\" in the band's name is deliberately misspelled", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 403, "title": "Yoshimi Battles the Pink Robots", "artist": "The Flaming Lips", "year": 2002, "cover": "https://dn710707.ca.archive.org/0/items/mbid-5ee8b734-e29a-36d9-9913-3319e21b5444/mbid-5ee8b734-e29a-36d9-9913-3319e21b5444-2572175401.jpg", "aoty_url": "https://www.albumoftheyear.org/album/563-the-flaming-lips-yoshimi-battles-the-pink-robots.php", "aoty_critic_score": 85, "aoty_user_score": 85, "mbid": "54b1ad4e-7e86-308d-b053-a0843f6abbdb", "yt_id": "eITvHa3YB2E", "rym": "https://rateyourmusic.com/release/album/the-flaming-lips/yoshimi-battles-the-pink-robots", "genres": ["experimental rock", "alternative rock", "psychedelic pop", "neo-psychedelia", "dream pop", "space rock revival"], "desc_lfm_album": "Yoshimi Battles the Pink Robots is the tenth studio album by The Flaming Lips, released by Warner Bros. Records on July 16, 2002, in the United Kingdom and the following day in the United States. It is characterized by electronic-influenced, psychedelic-tinged indie rock compositions. It has been certified Gold by the RIAA. Yoshimi was well-received critically and commercially, helping the band break into the mainstream. The album was adapted into a musical in 2012. It was announced in March 2007 that the album is to be made into a Broadway musical by The West Wing creator Aaron Sorkin and director .", "desc_lfm_artist": "The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 404, "title": "Worship and Tribute", "artist": "Glassjaw", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11756-worship-and-tribute.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11756-glassjaw-worship-and-tribute.php", "aoty_critic_score": 70, "aoty_user_score": 83, "mbid": "bdfbb4f6-b25a-387c-bc42-05d11459c6e1", "yt_id": "odNEq-0BIiQ", "rym": "https://rateyourmusic.com/release/album/glassjaw/worship-and-tribute", "genres": ["Metal", "Punk"], "desc_lfm_album": "Worship and Tribute is the second studio album by Long Island, New York post-hardcore band Glassjaw. It marked their first release with Warner Bros. Records after an unpleasant split with Roadrunner Records. It was released on July 9, 2002. As with their first full-length album, Worship and Tribute was produced by Ross Robinson and mixed and engineered by Mike Fraser. .", "desc_lfm_artist": "Long Island, NY-based post-hardcore band Glassjaw was formed by singer Daryl Palumbo and guitarist Justin Beck in 1994, longtime friends who began collaborating as teens.  They recorded some demos before releasing the EP \"Kiss Kiss Bang Bang\" in 1997, and recorded their first full length album \"Everything You Ever Wanted To Know About Silence\" in 2000 on Roadrunner Records.  The record brought the band out of Long Island and into the hands of a dedicated grass-roots following.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 405, "title": "The Used", "artist": "The Used", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12513-the-used_130802.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12513-the-used-the-used.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "2c578537-d479-3345-a1cd-2bd424619ce7", "yt_id": "9gkM9bLoB3k", "rym": "https://rateyourmusic.com/release/album/the-used/the-used", "genres": [], "desc_lfm_album": "The Used is the debut full-length studio album by the eponymous American rock band the Used It was released on June 25th, 2002 through Reprise Records. The Used was recorded at Foxy Studios in Marina del Rey, California with Feldmann as the producer. The group recorded piano parts in London at Olympic Studios. Feldmann acted as an engineer with assistance from Mark Blewett and Donny Campion. Feldmann contributed backing vocals to \"Bulimic\" and \"Greener with the Scenery\", the latter of which also included additional backing vocals from Carmen Daye. String arrangements on \"Greener with the Scenery\" and \"On My Own\" .", "desc_lfm_artist": "The Used is an American alternative rock band from Orem, Utah. Their sound has been classified under many sub-genres of rock. They signed with Reprise Records in late 2001 and rose to fame in June 2002 after releasing their debut self-titled album, The Used. Soon after a CD/DVD package named \"Maybe Memories\" was released, containing unheard demos and a \"behind the scenes\" story of the band/band's past. They followed up with their second album, In Love And Death, in September 2004 and their third album, Lies For The Liars, in May 2007.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "sdecandelario"]}, {"n": 406, "title": "DEEP RIVER", "artist": "宇多田ヒカル [Hikaru Utada]", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/64243-deep-river-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/64243--hikaru-utada-deep-river.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": null, "yt_id": "jI5N4dStkv0", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "alberto_gu"]}, {"n": 407, "title": "The Fire This Time", "artist": "Various Artists", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/565393-the-fire-this-time.jpg", "aoty_url": "https://www.albumoftheyear.org/album/565393-various-artists-the-fire-this-time.php", "aoty_critic_score": 90, "aoty_user_score": 88, "mbid": "4ecdc652-982b-3281-b85d-eac47f1f2893", "yt_id": "omnWhDAd5q4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Warning! Deleting this artist may remove other artists and scrobbles from your library - please handle this with caution!\n\nNote: You can view albums tagged as 'Various Artists' in your library here. \n\nThe term Various Artists is used in the recording industry to designate releases featuring contributions from multiple performers. It commonly appears on compilation albums or collaborative recordings where no single artist attribution applies. On digital platforms such as Last.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 408, "title": "Details", "artist": "Frou Frou", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/70835-details_084339.jpg", "aoty_url": "https://www.albumoftheyear.org/album/70835-frou-frou-details.php", "aoty_critic_score": 64, "aoty_user_score": 86, "mbid": "47e0eed4-509c-39db-9424-a7f0a405a096", "yt_id": "oet5L-gqctk", "rym": "https://rateyourmusic.com/release/album/frou-frou/details", "genres": ["Electronic", "Alternative Rock"], "desc_lfm_album": "Details is the debut and only studio album by British electronic duo Frou Frou. It was released on June 4, 2002 by MCA Records in the United States and by Island Records internationally. The album blends electronic, trip-hop, and pop influences, showcasing Imogen Heap’s ethereal vocals and Guy Sigsworth’s intricate production. .", "desc_lfm_artist": "Frou Frou are an electronic music duo formed in England with two members: Imogen Heap and Guy Sigsworth, active from 2002 to 2003. The duo reformed in 2018 and released a live recording of \"Guitar Song\" on April 19, 2019. \n\nFrou Frou created an impressive brand of vocal-driven, electronic pop. After the British duo had been collaborating for years without a record deal, the group's debut, Details, was completed for American release on MCA Records in 2002.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 409, "title": "The Private Press", "artist": "DJ Shadow", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8109-the-private-press.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8109-dj-shadow-the-private-press.php", "aoty_critic_score": 81, "aoty_user_score": 76, "mbid": "c6881bae-1bce-3e06-bb3d-e57c2670e16c", "yt_id": "SVS2OYK4r3o", "rym": "https://rateyourmusic.com/release/album/dj-shadow/the-private-press", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Joshua Paul Davis (born June 29, 1972), known professionally as DJ Shadow, is an American DJ and record producer. He first gained attention with his debut studio album \"Endtroducing.....\" (1996), noted for its extensive use of samples and layered production. He was also a member of the band UNKLE from 1996 to 1999.\n\nDJ Shadow began experimenting with a four-track recorder while in high school in Davis, California, and started his career as a disc jockey for the University of California, Davis, campus radio station KDVS.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 410, "title": "Remission", "artist": "Mastodon", "year": 2002, "cover": "https://dn710803.ca.archive.org/0/items/mbid-35ecfce3-cae6-337c-9d86-eda5c2e3d99b/mbid-35ecfce3-cae6-337c-9d86-eda5c2e3d99b-11567442830.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11484-mastodon-remission.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "a87adcfd-8c65-3455-869b-25066046ebec", "yt_id": "39j-jvK9Mx4", "rym": "https://rateyourmusic.com/release/album/mastodon/remission", "genres": ["heavy metal", "progressive metal", "sludge metal"], "desc_lfm_album": "Remission is the full-length debut album by American heavy metal band Mastodon. It was released on May 28, 2002 via Relapse Records and was re-released on October 21, 2003. Most of the songs were written long before the album was recorded. \"Workhorse\" premiered live in Memphis in July 2001. \"Trampled Under Hoof,\" \"Trilobite,\" \"Where Strides The Behemoth,\" \"Crusher Destroyer,\" and \"Mother Puncher\" were all played on a WMFU radio show on August 7, 2001, and \"Trainwreck\" was written while Eric Saner was still in the band. At the beginning of \"Crusher Destroyer\" is the roar of the Tyrannosaurus rex from .", "desc_lfm_artist": "Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 411, "title": "The Eminem Show", "artist": "Eminem", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-eminem-show-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1292-eminem-the-eminem-show.php", "aoty_critic_score": 75, "aoty_user_score": 82, "mbid": "e9585ed4-d148-3711-bbee-55a97b58325a", "yt_id": "o88BRjsi-Zw", "rym": "https://rateyourmusic.com/release/album/eminem/the-eminem-show", "genres": ["hip hop", "conscious hip hop", "pop rap", "hardcore hip hop", "political hip hop"], "desc_lfm_album": "The Eminem Show is the fourth studio album by American rapper Eminem. After it had originally scheduled for release on June 4, 2002, the album was released on May 26, 2002, by Aftermath Entertainment, Shady Records, and Interscope Records due to pirating and bootlegging of it. The album saw Eminem take a substantially more predominant production role; most of it was self-produced, with his longtime collaborator Jeff Bass, and Dr. Dre being the album's executive producers. It features guest appearances from Obie Trice, D12, Dr. Dre, Nate Dogg, Dina Rae, and Eminem's daughter Hailie Jade Scott-Mathers. The album incorporates a .", "desc_lfm_artist": "Marshall Bruce Mathers III (born October 17, 1972 in St. Joseph, MO), known professionally as Eminem (stylized as EMINƎM), is an American rapper, songwriter, and record producer. He is credited with popularizing hip-hop in Middle America and is regarded as one of the greatest rappers of all time. His success is considered to have broken racial barriers to the acceptance of white rappers in popular music. While much of his transgressive work during the late 1990s and early 2000s made him a controversial figure", "desc_mb_album": "", "desc_mb_artist": "Please don't add \"Relapse: Refill\" as extra release group. It is part of the \"Relapse\" release group.", "heard_by": ["EliasJ72", "GabredMared", "Nubis84", "alberto_gu", "verygooood"]}, {"n": 412, "title": "Nada Como um Dia Após o Outro Dia", "artist": "Racionais MC's", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/36683-nada-como-um-dia-apos-o-outro-dia-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/36683-racionais-mcs-nada-como-um-dia-apos-o-outro-dia.php", "aoty_critic_score": 70, "aoty_user_score": 88, "mbid": "9918722b-0c0b-3a38-9781-0f7cdd31b229", "yt_id": "Vay6oMVSiWQ", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Racionais MC's is a hip hop group based in  São Paulo, Brazil. Mano Brown (Pedro Paulo Soares Pereira), Ice Blue (Paulo Eduardo Salvador), Edy Rock (Edvaldo Pereira Alves) and DJ KL Jay (Kleber Geraldo Lelis Simões) formed the group in 1988. Each member hails from the ring of favelas (slums) around São Paulo locally called the periferia. Their lyrics combine themes of social justice with gangster imagery, a far cry from the idyllic breeziness typically associated with Brazilian music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 413, "title": "Fantastic Damage", "artist": "El-P", "year": 2002, "cover": "https://dn710306.ca.archive.org/0/items/mbid-0351db35-0a3b-4268-96c4-a5c9549bf571/mbid-0351db35-0a3b-4268-96c4-a5c9549bf571-1674481996.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1540-el-p-fantastic-damage.php", "aoty_critic_score": 89, "aoty_user_score": 85, "mbid": "844b149a-80dc-34b2-beaf-021f56fe0459", "yt_id": "jksPtFY1Yyc", "rym": "https://rateyourmusic.com/release/album/el-p/fantastic-damage", "genres": ["alternative hip hop", "hip hop", "Hip-Hop"], "desc_lfm_album": "\"Fantastic Damage\" is the first proper full-length solo album by New York rapper and producer El-P, released on his own Definitive Jux label on May 14, 2002. The tracks \"Fantastic Damage\", \"Deep Space 9mm\", and \"The Nang, the Front, the Bush and the Shit\" were featured in the El-P-scored graffiti film \"Bomb the System\". An instrumental version of the album, \"Fandam Plus: Instrumentals, Remixes, Lyrics & Video\", was released on 1 October 2002. This double disc release included all the instrumentals of \"Fantastic Damage\" on its first disc and three remixes, the \"Fantastic Damage\" lyrics, and video footage on its .", "desc_lfm_artist": "El-P is an abbreviation of El-Producto, both pseudonyms of New York City, NY, USA, underground hip-hop producer / rapper Jaime Meline (b. 2 Mar 1975).\n\nAs a member of Company Flow, he honed his production skills alongside DJ Mr. Len and Bigg Jus. His unique style helped Company Flow gain critical, then popular success, culminating in 1997 with Funcrusher Plus. Eventual differences between the group & label Rawkus, lead to El-P & Len leaving the label in 2000.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 414, "title": "Blood Money", "artist": "Tom Waits", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/blood-money.jpg", "aoty_url": "https://www.albumoftheyear.org/album/562-tom-waits-blood-money.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "63377d20-38df-30ae-b1bc-6808b9e05482", "yt_id": "ZhqH0cifq6M", "rym": "https://rateyourmusic.com/release/album/tom-waits/blood-money", "genres": [], "desc_lfm_album": "Tom Waits has said: \"I like a beautiful song that tells you terrible things. We all like bad news out of a pretty mouth.\" When it comes to the material on Blood Money, I don't know if I can call Waits' mouth pretty, but he certainly offers plenty of bad news in a very attractive, compelling way. Released simultaneously with Alice, a recording of songs written in 1990, Blood Money is a set of 13 songs written by Waits and Kathleen Brennan in collaboration with dramatist Robert Wilson. The project was a loose adaptation of the play Woyzeck, originally written .", "desc_lfm_artist": "Tom Waits (born Thomas Alan Waits, in Pomona, California, on December 7, 1949) is a prolific American singer, songwriter, composer, and actor.\n\nHe started his career in the early 1970s as a singer in spit 'n' sawdust bars. Initially, he was deeply influenced by the beat generation, novelists like Jack Kerouac and William S. Burroughs, and poets like Allen Ginsberg and Charles Bukowski.  Waits is often compared to Charles Bukowski, being similar both in content and lifestyle", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 415, "title": "Heavy Rocks", "artist": "Boris", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/85239-heavy-rocks-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/85239-boris-heavy-rocks.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "bef114d7-678a-454d-87fe-765310e27493", "yt_id": "4MvoN_rWMBk", "rym": "https://rateyourmusic.com/release/album/boris/heavy-rocks-1", "genres": ["Metal"], "desc_lfm_album": "There are 3 albums by Boris named 'Heavy Rocks'. 2002, 2011 and 2022. Heavy Rocks is the fourth album by Japanese metal band Boris. It was released by Quattro/UK Discs Project in limited quantity in 2002. The album was recorded and mixed at Bazooka Studio, from July to September 2001. It was mastered at Peace Music, January 2002. In 2011, Boris released another album called Heavy Rocks featuring the same cover style in purple. It has its own page at last.fm - Heavy Rocks (2011). For proper tagging and scrobling purposes use Heavy Rocks name for the 2002 album, and .", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared"]}, {"n": 416, "title": "Hold Your Horse Is", "artist": "Hella", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/32600-hold-your-horse-is.jpg", "aoty_url": "https://www.albumoftheyear.org/album/32600-hella-hold-your-horse-is.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "2114ac23-67bc-39ba-b476-f1affc42c30d", "yt_id": "bWqLiy9TLdg", "rym": "https://rateyourmusic.com/release/album/hella/hold-your-horse-is", "genres": ["Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Hella began in 2001 in Sacramento, USA as a two member band consisting of Zach Hill and Spencer Seim writing technically intricate music of a highly spastic nature -  playing a blend of math rock and noise rock. On early albums, the band forged their classic sound, playing minimally arranged, abrasive instrumentals that still retain an idiosyncratic sense of melody.\n\nIn 2005, the band expanded their live band by adding Dan Elkan on vocals, rhythm guitar, and synth and Jonathan Hischke on bass guitar.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "sdecandelario"]}, {"n": 417, "title": "In Search of...", "artist": "N*E*R*D", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/17317-in-search-of-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/17317-nerd-in-search-of.php", "aoty_critic_score": 75, "aoty_user_score": 82, "mbid": "bd47b812-3e40-3d5c-927e-4ef236a7ea27", "yt_id": "tVLgZXHUKh4", "rym": null, "genres": [], "desc_lfm_album": "\"In Search Of...\" is the debut studio album by American funk rock band N.E.R.D., composed of Pharrell Williams, Chad Hugo, and Shay Haley. It was first released on August 6, 2001, in Europe, where fellow Neptunes-produced project Wanderland by Kelis had been better received. Like Kelis' early work, In Search of... juxtaposes hip hop and rock influences, blending genres in a way that defied easy categorization. The album’s title is a reference to the 1970s television series In Search of..., hosted by Leonard Nimoy. The original 2001 version of In Search of..., commonly referred to as the “electronic version,” features .", "desc_lfm_artist": "N*E*R*D are an alternative rock/funk/rap group which formed in Virginia Beach, Virginia, United States in 2001. The group consists of lead singer Pharrell Williams (vocals, keys, guitar), Chad Hugo (guitar, bass) and Shay Haley (drums).\n\nWilliams and Hugo are also known as the Grammy-winning production duo The Neptunes.\n\nN*E*R*D's sound is a blend of rock, hip-hop, and R&B.  N*E*R*D stands for \"No-one Ever Really Dies\".\n\nWilliams and Hugo originally recorded the band's debut album, In Search Of.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "paqueradejere"]}, {"n": 418, "title": "Didn't It Rain", "artist": "Songs: Ohia", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/didnt-it-rain-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/555-songs-ohia-didnt-it-rain.php", "aoty_critic_score": 88, "aoty_user_score": 84, "mbid": "fd435442-6808-3d84-a7fa-093d5d2004d5", "yt_id": "G2WaZFz-QPc", "rym": "https://rateyourmusic.com/release/album/songs-ohia/didnt-it-rain", "genres": ["Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Songs: Ohia was largely a solo project for singer-songwriter Jason Molina (December 30, 1973 – March 16, 2013). Critics and fans alike have found considerable difficulty in trying to define the band's sound, usually settling on more general labels such as indie rock and folk-rock. Most are quick to draw comparisons to Neil Young and Will Oldham, (the latter of which Molina has collaborated with, alongside Alasdair Roberts, as the Amalgamated Sons of Rest).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 419, "title": "Full Moon", "artist": "Brandy", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6354-full-moon.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6354-brandy-full-moon.php", "aoty_critic_score": 63, "aoty_user_score": 84, "mbid": "46dbdd71-f6bc-3675-9691-ea6a8accfac1", "yt_id": "ExY2SCXkLGM", "rym": "https://rateyourmusic.com/release/album/brandy/full-moon", "genres": [], "desc_lfm_album": "Full Moon is the third studio album by American R&B recording artist Brandy. It was released by Atlantic Records on March 5, 2002. The album was recorded primarily during the summer and fall of 2001 at The Hit Factory in Miami, amid a three-year musical hiatus following the success of her multi-platinum previous studio album Never Say Never (1998) and the finale of her highly successful television sitcom Moesha in May 2001. As with Never Say Never, Brandy collaborated with producer Rodney Jerkins and his Darkchild production and songwriting team on the majority of the album's composition, while additional work .", "desc_lfm_artist": "Brandy Rayana Norwood, known professionally by the mononym Brandy, is an American singer, songwriter, record producer, actress and model. She is known for her distinctive sound, characterized by her peculiar timbre, voice-layering, and intricate riffs, which has earned her the title of \"the Vocal Bible\". Her work has earned her numerous awards and accolades, including a Grammy Award and an American Music Award.\n\nBorn in McComb, Mississippi, Norwood was raised in Carson, California, beginning her career as a backing vocalist for teen groups.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 420, "title": "Source Tags & Codes", "artist": "...And You Will Know Us By the Trail of Dead", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/source-tags-codes.jpg", "aoty_url": "https://www.albumoftheyear.org/album/556-and-you-will-know-us-by-the-trail-of-dead-source-tags-codes.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "b2ed93f0-9b35-3d86-ac20-0c57272d86fc", "yt_id": "kNf54L5uFZI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "...And You Will Know Us by the Trail of Dead are an alternative rock band which formed in 1994 in Austin, Texas, United States. The band currently consists of Conrad Keely (vocals, guitar, drums), Jason Reece (vocals, guitar, drums), Autry Fulbright II (bass) and Jamie Miller (drums, guitar). As of 2018, the band has released nine albums: \"...And You Will Know Us by the Trail of Dead\" (1998), \"Madonna\" (1999), \"Source Tags & Codes\" (2002), \"Worlds Apart\" (2005)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 421, "title": "Knife Play", "artist": "Xiu Xiu", "year": 2002, "cover": "https://dn711308.ca.archive.org/0/items/mbid-9ebfb95a-0e15-4682-83b2-24740311dc0e/mbid-9ebfb95a-0e15-4682-83b2-24740311dc0e-16161873179.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1390-xiu-xiu-knife-play.php", "aoty_critic_score": 79, "aoty_user_score": 81, "mbid": "b092e33d-b8d5-3f7b-8b37-3b15b0bf60c9", "yt_id": "ooJJ684dnUA", "rym": "https://rateyourmusic.com/release/album/xiu-xiu/knife-play", "genres": ["experimental rock", "art rock", "post-punk", "synth-pop", "minimal synth"], "desc_lfm_album": "Knife Play is the debut studio album by Xiu Xiu, released on February 19, 2002. A sticker on the cover of the album reads \"When my mom died I listened to Henry Cowell, Joy Division, Detroit techno, the Smiths, Takemitsu, Sabbath, Gamelan, 'Black Angels' and Cecil Taylor\". The title is a reference to knife play. Noted themes include familial dysfunction, violence and despair; \"Hives Hives\" is a cover of the IBOPA song \"Hives\" that references AIDS and HIV, and \"Dr. Troll\" is about a young transgender girl who teaches a class of preschoolers. \"Suha\" is about the titular 25-year old .", "desc_lfm_artist": "Xiu Xiu (pronounced \"shoo shoo\") is an American experimental group, formed in 2002 in San Jose, California by original members Jamie Stewart, Lauren Andrews, Yvonne Chen, and Cory McCulloch. Currently, the line-up consists of Jamie Stewart (the only constant member since formation), Angela Seo, and David Kendrick. Stewart and Seo reside in Germany, while Kendrick is a touring member, playing drums for the group.\n\nOver the life of the band, their music has taken influence from noise", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84"]}, {"n": 422, "title": "All Hail West Texas", "artist": "The Mountain Goats", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/all-hail-west-texas.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4299-the-mountain-goats-all-hail-west-texas.php", "aoty_critic_score": 85, "aoty_user_score": 83, "mbid": "1d4f8940-bfb3-3a14-a358-820aa16ec415", "yt_id": "y5mhIHW-bL4", "rym": "https://rateyourmusic.com/release/album/the-mountain-goats/all-hail-west-texas/", "genres": ["Alternative Rock"], "desc_lfm_album": "All Hail West Texas is an album by The Mountain Goats. After the slight increase in production values on 2000's The Coroner's Gambit, All Hail West Texas is the last Mountain Goats album on which all the songs were recorded on John Darnielle's trademark Panasonic RX-FT500 boombox. The album is loosely a concept album, with the cover stating that the album consists of \"fourteen songs about seven people, two houses, a motorcycle, and a locked treatment facility for adolescent boys\". Many of the songs explicitly reference places in Texas, and evoke a lifestyle ethos born of the vast expanses of .", "desc_lfm_artist": "The Mountain Goats are an American folk rock band formed in Claremont, California, in 1991, by singer-songwriter John Darnielle. The band is currently based in Chapel Hill, North Carolina. For many years, the sole member of the Mountain Goats was Darnielle, despite the plural moniker. The Mountain Goats are, for all practical purposes, the endlessly clever and prolific John Darnielle and whatever musicians he surrounds himself with, which means that while the soundscape may change from project to project", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 423, "title": "Geogaddi", "artist": "Boards Of Canada", "year": 2002, "cover": "https://ia800301.us.archive.org/20/items/mbid-5da8e677-bec2-471f-82ec-5b51133cd0c7/mbid-5da8e677-bec2-471f-82ec-5b51133cd0c7-35875388138.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1139-boards-of-canada-geogaddi.php", "aoty_critic_score": 84, "aoty_user_score": 87, "mbid": "8183834a-6c8a-39ef-a7bc-a82f79b929e9", "yt_id": "vDkHR80rNtw", "rym": null, "genres": ["avant-garde", "psychedelic", "idm", "hauntology", "electronic"], "desc_lfm_album": "Geogaddi is the second album released by Boards of Canada, presenting a darker sound than its predecessor filled with references to numerology, Branch Davidianism and the Bible. Backmasking was also used in the album, leading to accusations of subliminal messaging. The album was well received as a “very accomplished album packed with great music,” cementing their status as “an individual voice in electronic music.” Michael Sandison has described the album as \"a record for some sort of trial-by-fire, a claustrophobic, twisting journey that takes you into some pretty dark experiences before you reach the open air again. It has a .", "desc_lfm_artist": "Boards of Canada is an electronic music duo from Edinburgh, Scotland, UK, formed in 1985 and comprised of brothers Mike Sandison (born 1 June 1970) and Marcus Eoin (born 21 July 1971). They have released a number of works, most notably the studio albums Music Has the Right to Children (1998), Geogaddi (2002), and The Campfire Headphase (2005) on the pioneering electronic music label Warp. Their fourth album Tomorrow's Harvest was released in June 2013.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 424, "title": "Still", "artist": "Nine Inch Nails", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/85032-still_092923.jpg", "aoty_url": "https://www.albumoftheyear.org/album/85032-nine-inch-nails-still.php", "aoty_critic_score": 85, "aoty_user_score": 83, "mbid": "69fbf512-9d79-4ce4-8526-a09e85fbee15", "yt_id": "OWJWajOs-UQ", "rym": "https://rateyourmusic.com/release/album/nine-inch-nails/still", "genres": [], "desc_lfm_album": "Still (also known as Halo 17 CD2 or And All That Could Have Been: Still), released on January 22, 2002, is both an individual Nine Inch Nails release and the second disc of the deluxe edition of And All That Could Have Been. It contains original songs as well as stripped down versions of old songs. The old songs are done in the manner of similar ones performed at the The CRC Sessions. Trent Reznor explained the concept behind the album in a Q&A lifted from a press sheet: \"We did a radio show in Chicago where we did such .", "desc_lfm_artist": "Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated", "desc_mb_album": "", "desc_mb_artist": "Please note the following about Nine Inch Nails releases:\n\n    * Certain tracks frequently included on Nine Inch Nails bootlegs are not actually Nine Inch Nails tracks; however they do feature Trent on vocals. These include:\n        * [http://musicbrainz.org/track/9f249bf3-af50-43b6-a820-b52091ca757d.html|1000 Homo DJs - Supernaut (Trent Reznor vocal version)] (studio)\n        * [http://musicbrainz.org/track/8440e3d4-d78e-49e7-9cf6-14e87ba53a8b.html|Tori Amos - Past The Mission] (studio)\n        * [http://musicbrainz.org/track/8ee4f9e3-6ff2-436d-bcb2-4f87dde6c0ae.html|David Bowie - Hallo Spaceboy] (live, vocal duet; played with Bowie's band on stage)\n        * [http://musicbrainz.org/track/c9a1f57b-a18d-4ede-bb91-cba7b6765890.html|David Bowie - Warszawa] (live, vocal duet, played with Bowi", "heard_by": ["Frikomid", "Lonsonxd", "armandwave", "sdecandelario"]}, {"n": 425, "title": "The Disintegration Loops", "artist": "William Basinski", "year": 2003, "cover": "https://dn710705.ca.archive.org/0/items/mbid-9b5def6c-4cda-443a-92ef-e045385ccbea/mbid-9b5def6c-4cda-443a-92ef-e045385ccbea-18814299194.jpg", "aoty_url": "https://www.albumoftheyear.org/album/882-william-basinski-the-disintegration-loops.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "29560694-e850-385b-8cee-8d3b41c2bd1c", "yt_id": "youbYihRl-o", "rym": "https://rateyourmusic.com/release/album/william-basinski/the-disintegration-loops/", "genres": ["modern classical", "tape music"], "desc_lfm_album": "Loops is based on Basinski's attempts to salvage earlier recordings made on magnetic tape, by transferring them into digital format; however, the tape had physically deteriorated to the point that, as it passed by the read/write head, the ferrite detached from the plastic backing and fell off. Basinski has alleged that he finished the project the morning of the September 11 attacks on the World Trade Center in New York City, and sat on the roof of his apartment building in Brooklyn with friends listening to the project as the WTC towers collapsed. .", "desc_lfm_artist": "William Basinski (Houston, 1958), a New York-based classically-trained clarinetist and saxophonist, specializes in compositions for loops and drones. He began experimenting with compositions for piano and tape that created a melancholy ambience via looped and overdubbed melodies with Variations - A Movement in Chrome Primitive (1980), released on Variations - A Movement in Chrome Primitive (Durtro, 2002 - Die Stadt, 2004), and A Red Score in Tile (1979), released on A Red Score in Tile (3 Poplars, 2003).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 426, "title": "Stillmatic", "artist": "Nas", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7270-stillmatic-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7270-nas-stillmatic.php", "aoty_critic_score": 74, "aoty_user_score": 81, "mbid": "f6893893-e58c-3224-83d9-fe30c3938cd1", "yt_id": "j9UbmsVXAHE", "rym": null, "genres": [], "desc_lfm_album": "Stillmatic is the fifth studio album by American rapper Nas, released on December 18, 2001 by Ill Will and Columbia Records. Nas' lyrics address topics such as ghetto life, American politics, and his feud with rapper Jay-Z. Stillmatic was a commercial and critical success and helped re-establish Nas' career, following a period of critical disappointment with his previous album Nastradamus (released in 1999). .......... .", "desc_lfm_artist": "Nasir bin Olu Dara Jones, more commonly known as Nas (formerly Nasty Nas and Escobar), born September 14, 1973 in Crown Heights, Brooklyn, New York, is a prominent American MC. The son of jazz musician Olu Dara, he was raised in the infamous Queensbridge housing projects in Queensbridge, New York. According to the Nasty Songfacts, as a teenager rapper, Nasir  first went by the nickname Kid Wave before adopting his more commonly known alias of Nasty Nas.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 427, "title": "I Might Be Wrong: Live Recordings", "artist": "Radiohead", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/i-might-be-wrong-live-recordings-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4962-radiohead-i-might-be-wrong-live-recordings.php", "aoty_critic_score": 71, "aoty_user_score": 83, "mbid": "e404b349-7cef-398f-ac5e-ce06737341d1", "yt_id": "eYYfuqDTvC0", "rym": null, "genres": [], "desc_lfm_album": "I Might Be Wrong: Live Recordings is a 2001 live album by English rock band Radiohead. It consists of live performances of eight songs recorded on a tour of Europe and North America, including seven songs from their albums Kid A and Amnesiac. The final track, \"True Love Waits\", would not be released on a studio album until 2016's A Moon Shaped Pool; unlike the studio version, it is performed here on acoustic guitar by Thom Yorke. It was the only release, apart from their studio albums and bonus material from the The King of Limbs sessions, that the band .", "desc_lfm_artist": "Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock.", "desc_mb_album": "", "desc_mb_artist": "Formed in Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["armandwave"]}, {"n": 428, "title": "The Tired Sounds Of", "artist": "Stars Of The Lid", "year": 2001, "cover": "https://dn711100.ca.archive.org/0/items/mbid-d2accc2f-60eb-44f9-9e3a-59a24501606f/mbid-d2accc2f-60eb-44f9-9e3a-59a24501606f-4084222837.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "02e510c3-7aff-39ea-8bb9-45780a390868", "yt_id": "WbVeb-sbSHY", "rym": null, "genres": ["drone", "electronic", "ambient"], "desc_lfm_album": "", "desc_lfm_artist": "Stars of the Lid was an American band specializing in drone-based ambient music. They list among their influences minimalist and electronic composers such as Arvo Pärt, Zbigniew Preisner, Gavin Bryars, and Henryk Górecki, as well as Talk Talk (both bands have tracks named \"Taphead\"), post-rock artists Labradford, and ambient innovator Brian Eno. Their music largely consists of beatless soundscapes, composed of droning, effects-treated guitars along with piano", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 429, "title": "Change", "artist": "The Dismemberment Plan", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/change.jpg", "aoty_url": "https://www.albumoftheyear.org/album/976-the-dismemberment-plan-change.php", "aoty_critic_score": 82, "aoty_user_score": 83, "mbid": "253d9d94-9177-420f-ac07-5532e630a698", "yt_id": "4rcWQeoNno0", "rym": "https://rateyourmusic.com/release/album/the-dismemberment-plan/change", "genres": [], "desc_lfm_album": "Change is an album by The Dismemberment Plan. It was released on October 23, 2001 on DeSoto Records. It was recorded by J. Robbins at Inner Ear Studios in Arlington, Virginia and it was mixed by Chad Clark. Compared to The Dismemberment Plan's previous album Emergency & I, Change is more somber musically, with more introspective lyrics. Lead singer Travis Morrison has called the album his \"night album,\" saying in an interview with Stylus Magazine: “I think late-night records tend to have much more carefully modulated dynamics, they tend, whatever the dynamics are they’re not trying to beat you over .", "desc_lfm_artist": "The Dismemberment Plan was an American post-hardcore band formed in Washington, D.C., United States on January 1, 1993. Also known as \"The D-Plan\" or \"The Plan,\" the band's name comes from a stray phrase uttered by the insurance salesman in the popular comedy Groundhog Day. The band members included Eric Axelson (bass), Jason Caddell (guitar), Joe Easley (drums) and Travis Morrison (vocals and guitar). Axelson, Caddell, Morrison and original drummer Steve Cummings formed the band after attending Lake Braddock Secondary School together in Burke", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 430, "title": "Morning View", "artist": "Incubus", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15496-morning-view_131956.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15496-incubus-morning-view.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "21387993-64d6-3d59-bd7f-d93cbdcb0f48", "yt_id": "CjrQ-XMtRPY", "rym": null, "genres": [], "desc_lfm_album": "\"Morning View\" is the fourth studio album by the American rock band Incubus, released on 23 October 2001 through Epic and Immortal Records. A companion DVD, \"The Morning View Sessions\", followed on 29 May 2002. The album continued the band’s stylistic shift away from nu metal, incorporating a range of softer and heavier alternative rock elements. It was the final Incubus studio album to feature bassist Alex Katunich, who departed the band in 2003. Supported by the singles \"Wish You Were Here\" and \"Nice to Know You\", \"Morning View\" received generally positive critical reception and was certified double platinum, becoming .", "desc_lfm_artist": "There are multiple artists using this name:\n\n1. Incubus is an American alternative rock band formed in 1991 and based in Calabasas, California. The lineup has included Brandon Boyd (vocals, percussion), Mike Einziger (guitar), Nicole Row (bass), Jose Pasillas II (drums), and DJ Chris Kilmore (turntables). Former members include Gavin Koppel (turntables), Alex Katunich, also known as Dirk Lance (bass), and Ben Kenney (bass). The band’s name was selected", "desc_mb_album": "", "desc_mb_artist": "Please do not add the track \"Turning Japanese\" as a work by Incubus. See http://incubus-online-view.com/iframe/songindex.php for a list of legitimate and misidentified tracks.", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 431, "title": "drukQs", "artist": "Aphex Twin", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4344-drukqs_211928.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4344-aphex-twin-drukqs.php", "aoty_critic_score": 64, "aoty_user_score": 85, "mbid": "87f1a316-510f-36c3-9f2c-38230b0e56e0", "yt_id": "u3UhZfJElek", "rym": null, "genres": [], "desc_lfm_album": "Drukqs (stylised as drukQs) is the fifth studio album by Aphex Twin, a pseudonym used by British electronic musician Richard D. James. The album is a double album and peaked at number 22 on the UK Albums Chart, selling 11,476 copies in its first week of release. It was released to divided reception, with many critics dismissing it relative to his earlier work. It would be James' final album under the Aphex Twin moniker until the release of 2014's \"Syro\". Drukqs contains tracks dating back \"seven or eight years\", according to James. The LP is a double album featuring roughly .", "desc_lfm_artist": "Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 432, "title": "呼吸 (Kokyuu)", "artist": "Lily Chou-Chou", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/211956-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/211956-lily-chou-chou--kokyuu.php", "aoty_critic_score": 100, "aoty_user_score": 87, "mbid": null, "yt_id": "Pfyd6GzKFBs", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Lily Chou-Chou (リリイ・シュシュ) is a fictional artist created for the film All About Lily Chou-Chou, with vocals by Salyu. Though saturated with her presence, by way of the soundtrack and movie plot, she remains almost entirely unseen throughout the film. Her persona and popularity are based on the massively popular Chinese singer 王菲 (Faye Wong). Her album, Breathe (Kokyuu), came in the form of the film's OST, with music/production by Takeshi Kobayashi, and singing performed by Salyu.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 433, "title": "The Argument", "artist": "Fugazi", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1144-the-argument_143131.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1144-fugazi-the-argument.php", "aoty_critic_score": 85, "aoty_user_score": 84, "mbid": "7b1cb5fb-7ba5-3472-a687-1cb8f2d896e7", "yt_id": "yFyzhyBA7To", "rym": "https://rateyourmusic.com/release/album/fugazi/the-argument", "genres": [], "desc_lfm_album": "The Argument is the sixth and most recent studio album from Fugazi released on October 16, 2001, through Dischord Records. It was recorded at Don Zientara's Inner Ear Studios in Arlington, VA and the Dischord House between January and April 2001. It was the band's last release (simultaneously with the Furniture EP) before going on hiatus in 2003. The Argument saw Fugazi continue to expand upon the more experimental art punk leanings of Red Medicine and End Hits while also heavily incorporating other instruments, such as piano and cello into their sound.The album also featured the first extensive contributions from .", "desc_lfm_artist": "Fugazi was an American post-hardcore band formed in Washington, D.C., in 1986. The band consists of guitarists and vocalists Ian MacKaye and Guy Picciotto, bassist Joe Lally, and drummer Brendan Canty. They are noted for their style-transcending music, DIY ethical stance, manner of business practice and contempt for the music industry.\n\nSince its inception, Fugazi has been self-managed and have released almost all their material through Dischord Records, an independent label founded by MacKaye and partner Jeff Nelson in 1980.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "sdecandelario"]}, {"n": 434, "title": "\"Born Into Trouble as the Sparks Fly Upward\"", "artist": "Thee Silver Mt. Zion Memorial Orchestra", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14340-born-into-trouble-as-the-sparks-fly-upward.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14340-thee-silver-mt-zion-memorial-orchestra-born-into-trouble-as-the-sparks-fly-upward.php", "aoty_critic_score": 85, "aoty_user_sc
