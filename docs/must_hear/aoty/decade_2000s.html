<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOTY Must Hear — 2000s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/images/discount.png" />
<script defer src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;
  --accent:#e8ff47;--heard:#e8ff47;--pending:#ff4747;
  --text:#e0e0e0;--muted:#555;--gap:6px;
  --panel:390px;--header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{
  position:fixed;top:0;left:0;right:var(--panel);height:var(--header-h);z-index:100;
  background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:0 18px;display:flex;align-items:center;gap:12px;
}
.back-link{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.dec-wrap{position:relative}
.dec-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);
  color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.dec-btn:hover{background:rgba(232,255,71,.12)}
.dec-dropdown{
  display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:160px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.dec-dropdown.open{display:block}
.dec-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.dec-item{display:block;padding:6px 14px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);text-decoration:none;transition:background .1s}
.dec-item:hover{background:var(--surface)}
.dec-item.active{color:var(--accent)}
.controls{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0}
.filter-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.search-box{
  font-family:'DM Mono',monospace;font-size:.62rem;padding:4px 9px;
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);width:130px;outline:none;transition:border-color .15s;
}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.genre-wrap{position:relative}
.genre-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.genre-btn:hover,.genre-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.genre-btn .badge{background:var(--accent);color:#000;border-radius:10px;padding:1px 5px;font-size:.52rem;font-weight:700}
.genre-dropdown{
  display:none;position:fixed;
  background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:200px;max-height:320px;overflow-y:auto;padding:4px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.genre-dropdown.open{display:block}
.genre-dh{
  padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:3px;
  display:flex;justify-content:space-between;
}
.genre-clear{color:var(--pending);cursor:pointer}
.genre-item{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;transition:background .1s}
.genre-item:hover{background:var(--surface)}
.genre-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.genre-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);cursor:pointer;flex:1;display:flex;justify-content:space-between}
.genre-item label span{color:var(--muted);font-size:.56rem}
.user-wrap{position:relative}
.user-btn{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.user-btn:hover{background:rgba(232,255,71,.12)}
.user-btn .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.user-dropdown{display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;z-index:9999;min-width:164px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.user-dropdown.open{display:block}
.user-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.user-item{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;transition:background .1s;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text)}
.user-item:hover{background:var(--surface)}
.user-item.active{color:var(--accent)}
.user-item .u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.user-item.active .u-dot{background:var(--accent)}
#main{margin-top:var(--header-h);margin-right:var(--panel);padding:14px 18px 60px;position:relative;z-index:0}
.count-bar{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px;display:flex;gap:14px}
.count-bar b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.05);z-index:10}
.card.hidden{display:none}
.card.active-card{outline:2px solid var(--accent);outline-offset:2px;z-index:11}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.heard-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3;background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,0) 55%);
  opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px;z-index:2;
}
.card:hover .card-overlay{opacity:1}
.card-scores{display:flex;gap:3px;margin-bottom:2px}
.card-score{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;padding:1px 4px;border-radius:2px}
.card-score.c{background:rgba(108,184,250,.2);color:#6cb8fa}
.card-score.u{background:rgba(191,143,255,.2);color:#bf8fff}
.card-title{font-size:.56rem;font-weight:500;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{font-size:.52rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3}
.card.heard-user::before{background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card.unheard-user::before{background:var(--pending);box-shadow:0 0 5px var(--pending)}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panel);
  background:#0c0c0c;border-left:1px solid var(--border);
  z-index:50;display:flex;flex-direction:column;overflow:hidden;
}
.panel-topbar{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 15px;flex-shrink:0}
.panel-topbar-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel-cover{width:100%;aspect-ratio:1;flex-shrink:0;position:relative;background:var(--surface);max-height:200px;overflow:hidden}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-scores{display:flex;gap:6px;position:absolute;bottom:8px;left:8px}
.panel-score{padding:3px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700}
.panel-score.c{background:rgba(0,0,0,.7);color:#6cb8fa;border:1px solid #6cb8fa44}
.panel-score.u{background:rgba(0,0,0,.7);color:#bf8fff;border:1px solid #bf8fff44}
.panel-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.panel-empty-icon{font-size:2rem;opacity:.3}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);line-height:1.05;margin-bottom:2px}
.panel-artist{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.panel-year{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.panel-genre-tag{font-family:'DM Mono',monospace;font-size:.56rem;padding:2px 6px;border-radius:2px;background:rgba(232,255,71,.07);border:1px solid rgba(232,255,71,.18);color:rgba(232,255,71,.65)}
.panel-heard-by{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:9px}
.panel-heard-by b{color:var(--heard)}
.panel-divider{height:1px;background:var(--border);margin:9px 0}
.panel-section-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.panel-bio{font-size:.72rem;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-bio::-webkit-scrollbar{width:3px}
.panel-bio::-webkit-scrollbar-thumb{background:var(--border)}
.desc-block{margin-bottom:9px}
.desc-source-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.desc-source-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.desc-source-label.lfm{color:#d51007}.desc-source-label.mb{color:#ba478f}.desc-source-label.artist{color:#6a9fb5}
.desc-source-text{font-size:.7rem;color:#aaa;line-height:1.55}
.panel-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.panel-link{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}
.panel-link.aoty{border-color:#e87c2e;color:#e87c2e}
.panel-link.aoty:hover{background:rgba(232,124,46,.08)}
.panel-link.yt{border-color:#f00;color:#f00}
.panel-link.yt:hover{background:rgba(255,0,0,.08)}
.panel-link.rym{border-color:#5baadb;color:#5baadb}
.panel-link.rym:hover{background:rgba(91,170,219,.08)}
.panel-yt-wrap{margin-top:11px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.panel-yt-wrap iframe{display:block;width:100%;height:145px;border:none}
.panel-yt-placeholder{height:60px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.panel-close-btn{display:none;position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.18)}
.grid-sizer{display:flex;align-items:center;gap:5px}
.grid-sizer span{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);min-width:24px;text-align:right}
#grid-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#grid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
#grid-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#empty{display:none;text-align:center;padding:50px 0;font-family:'DM Mono',monospace;color:var(--muted);font-size:.7rem}
@media(max-width:600px){
  :root{--header-h:50px}
  header{right:0;height:auto;min-height:var(--header-h);flex-wrap:wrap;padding:8px 12px;gap:6px 10px;overflow:visible}
  #main{margin-right:0;padding:10px 10px 60px}
  #panel{inset:0;width:100%;border-left:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  #panel.panel-open{transform:translateY(0)}
  .panel-close-btn{display:flex}
  .controls{flex:0 0 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:5px;padding:5px 0 2px;border-top:1px solid var(--border);scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .dec-wrap{display:none}
}</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">←</a>
  <span class="header-title">AOTY Must Hear</span>

    <button class="dec-btn" id="dec-btn" onclick="toggleDecDD()">
      2000s &#x25BE;

  </div>

    <button class="filter-btn active" id="btn-all"     onclick="setFilter('all')">All</button>

    <button class="filter-btn"        id="btn-unheard" onclick="setFilter('unheard')">Unheard</button>

      <button class="genre-btn" id="genre-btn" onclick="toggleGenreDD()">
        Genre <span class="badge" id="genre-badge" style="display:none">0</span> &#x25BE;

        <span class="u-name" id="user-btn-label">All users</span> &#x25BE;
      </button>

    <div class="grid-sizer">
      <span id="grid-label">10×</span>
      <input type="range" id="grid-slider" min="3" max="20" value="10" step="1" oninput="setGridSize(this.value)">
    </div>
  </div>
</header>
<main id="main">
  <div class="count-bar">
    <span>Showing <b id="vis-count">520</b> of 520</span>
    <span><b id="vis-heard">0</b> heard</span>
  </div>
  <div id="grid"></div>
  <div id="empty">No albums match your filters.</div>
</main>
<aside id="panel">
  <button class="panel-close-btn" onclick="closePanel()" aria-label="Close">&#x2715;</button>
  <div class="panel-topbar">
    <span class="panel-topbar-label">Album detail</span>
  </div>
  <div id="panel-cover-wrap" class="panel-cover" style="display:none">
    <img id="p-cover" src="" alt="">
    <div class="panel-scores" id="p-scores"></div>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="panel-empty"><div class="panel-empty-icon">◉</div>Click an album</div>
  </div>
</aside>
<div class="dec-dropdown" id="dec-dd">
  <div class="dec-dh">Jump to decade</div>
  <a class="dec-item" href="decade_1950s.html">1950s</a><a class="dec-item" href="decade_1960s.html">1960s</a><a class="dec-item" href="decade_1970s.html">1970s</a><a class="dec-item" href="decade_1980s.html">1980s</a><a class="dec-item" href="decade_1990s.html">1990s</a><a class="dec-item active" href="decade_2000s.html">2000s</a><a class="dec-item" href="decade_2010s.html">2010s</a><a class="dec-item" href="decade_2020s.html">2020s</a>
</div>

  <div class="genre-dh">Filter by genre <span class="genre-clear" onclick="clearGenres()">clear</span></div>
  <div id="genre-list"></div>
</div>
<div class="user-dropdown" id="user-dd">
  <div class="user-dh">View as user</div>
  <div id="user-list"></div>
</div>

const ALBUMS = [{"n": 1, "title": "6 Kiss", "artist": "Lil B", "year": 2009, "cover": "https://lastfm.freetls.fastly.net/i/u/300x300/3a96df2bdec347498e936f46c8a8c712.png", "aoty_url": "https://www.albumoftheyear.org/album/57866-lil-b-6-kiss.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "190fd5a4-663f-41ab-875e-cbf0936af617", "yt_id": "jqKCq8S9MuY", "rym": null, "genres": [], "desc_lfm_album": "On December 22, 2009, Lil B released his second digital album, 6 Kiss. Over the years, the album has received acclaim from listeners & critics, becoming a hip-hop cult classic. TYBG .", "desc_lfm_artist": "Brandon \"Lil B\" McCartney (born August 17, 1989 and also known as The BasedGod, Lil Boss, Based Lord, Captain 66, Based Legend, The #1 Bitch, Tiny Pants Mobsta, Masterchef and Pretty Bitch) is a rapper/author/producer/composer/director/soothsayer from Berkeley, CA. He has been rapping since age 16 with hip hop group The Pack and leading a successful solo career, garnering popularity through the use of social media websites. He created many MySpace pages in order to upload all of his music and recorded over 1,500 tracks as of July 2010.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84", "Rocky_stereo", "alberto_gu"]}, {"n": 2, "title": "Fall Be Kind", "artist": "Animal Collective", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/fall-be-kind-ep.jpg", "aoty_url": "https://www.albumoftheyear.org/album/948-animal-collective-fall-be-kind-ep.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "57f5f41f-a442-4b82-83f0-99bf5f3e7504", "yt_id": "YoXFmo50YBI", "rym": null, "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Fall Be Kind is an EP by Animal Collective, released digitally in MP3 and WAV formats on November 23, 2009, and as both a CD and 12\" vinyl in the UK on December 14, 2009, and in the US on December 15, 2009. Some stores in Australia and New Zealand began selling it more than a week earlier, due to the band's touring presence there at the time. On November 18, 2009, Domino Records accidentally sent pre-ordered CDs of Fall Be Kind to customers before the actual release date, resulting in a lossless digital version leaking, in its entirety, onto .", "desc_lfm_artist": "Animal Collective are an American experimental pop band formed in Baltimore, Maryland in 1999. The group consists of David Portner (Avey Tare), Noah Lennox (Panda Bear), Brian Weitz (Geologist), and Josh Dibb (Deakin). Their music blends a wide range of styles, including psychedelia, freak folk, noise, and electronica, incorporating elements such as loops, drones, sampling, vocal harmonies, and sound collage. The band is known for its distinctive approach to experimental rock and pop music.", "desc_mb_album": "", "desc_mb_artist": "=== Don't add these albums here: ===\r\n[https://musicbrainz.org/artist/22568c9d-8ef3-4224-b994-8e0658e1082a|Avey Tare] and [https://musicbrainz.org/artist/fd3c3f9f-a471-498e-ab3a-940ac20b6bbd|Panda Bear] — [https://musicbrainz.org/release-group/b15e243c-8279-3b5b-b773-fca282c8ce54|Spirit They’re Gone Spirit They’ve Vanished]\r\n[https://musicbrainz.org/artist/22568c9d-8ef3-4224-b994-8e0658e1082a|Avey Tare], [https://musicbrainz.org/artist/fd3c3f9f-a471-498e-ab3a-940ac20b6bbd|Panda Bear] & [https://musicbrainz.org/artist/c836703d-f5e2-4e54-92c3-1792ef4d0d6f|Geologist] — [https://musicbrainz.org/release-group/8b0d9da7-df54-3f0f-acb1-568186b9891a|Danse Manatee]\r\n[https://musicbrainz.org/artist/1bd864ba-34a1-4d34-8922-559e58838a60|Campfire Songs] — [https://musicbrainz.org/release-group/7f1a5f85-", "heard_by": ["MaxtorUwU"]}, {"n": 3, "title": "For Long Tomorrow", "artist": "toe", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/32597-for-long-tomorrow_202608.jpg", "aoty_url": "https://www.albumoftheyear.org/album/32597-toe-for-long-tomorrow.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "3a2e4685-550f-4b00-a233-4a7ac2957072", "yt_id": "3ZkkVHMfuD4", "rym": "https://rateyourmusic.com/release/album/toe/for-long-tomorrow", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "The second full-length album released by Japanese math rock band toe. Released December 9, 2009. The album consists of 13 songs, with the shortest song being 39 seconds long, and the longest being 7 minutes and 5 seconds long. .", "desc_lfm_artist": "There are three groups with the name Toe:\n\n1. toe (Japanese band) is a Japanese math-rock / post-rock / instrumental  music group.\n\n2. Toe (American band) is a Chicago post-rock music group.\n\n3. Toe (English band) is a experimental/noise rock band from Ipswich.\n\njapanese band : http://www.toe.st/\n\ntoe is a Japanese music group that formed in 2000. Although mentioned in many post-rock circles, their song structure and dynamics are similar to many popular math rock artists.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 4, "title": "The Fame Monster", "artist": "Lady Gaga", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-fame-monster-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1038-lady-gaga-the-fame-monster.php", "aoty_critic_score": 73, "aoty_user_score": 84, "mbid": "20b4c8b3-e922-44a3-90e8-fa00acad8ed4", "yt_id": "E_5z6d3bcQU", "rym": null, "genres": ["pop rock", "synth-pop", "electropop", "europop", "dance-pop", "electro house"], "desc_lfm_album": "The Fame Monster is the second album by American recording artist Lady Gaga. It was released on November 18, 2009, by Interscope Records. Initially planned to be included on a re-release of her 2008 album The Fame, Gaga announced that the eight tracks would be included on a standalone release, saying that she thought the re-release was too expensive and that the albums were each conceptually different, describing them as yin and yang respectively. A Super Deluxe edition of The Fame Monster including The Fame and additional merchandise, including a lock of her wig, was released on December 15, 2009. .", "desc_lfm_artist": "Stefani Joanne Angelina Germanotta, known professionally as Lady Gaga, (born March 28, 1986 in New York, NY) is an American singer, songwriter and actress. She is known for her image reinventions and musical versatility. Gaga began performing as a teenager, singing at open mic nights and acting in school plays. She studied at Collaborative Arts Project 21, through the New York University Tisch School of the Arts, before dropping out to pursue a career in music.", "desc_mb_album": "This release group is only for releases that ''do not'' include The Fame. Please use [https://musicbrainz.org/release-group/e5495719-b3ad-3eea-a533-fb70af43c23d|The Fame] for those \"deluxe\" releases.", "desc_mb_artist": "", "heard_by": ["GabredMared"]}, {"n": 5, "title": "The Fame Monster (Deluxe Edition)", "artist": "Lady Gaga", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/278384-the-fame-monster-deluxe-edition.jpg", "aoty_url": "https://www.albumoftheyear.org/album/278384-lady-gaga-the-fame-monster-deluxe-edition.php", "aoty_critic_score": 83, "aoty_user_score": null, "mbid": null, "yt_id": "_34er9ChVOA", "rym": null, "genres": [], "desc_lfm_album": "The deluxe edition of The Fame Monster is a reissue of Lady Gaga's debut studio album, The Fame. It is a double album featuring the 8 new songs on the first disc and The Fame on the second disc. Initially planned solely as a deluxe edition reissue of The Fame, Interscope later decided to release the eight new songs as a standalone EP in some territories. The decision was also because Gaga believed the re-release was too expensive and that the albums were conceptually different, describing them as yin and yang. It was released on November 18, 2009, through Interscope .", "desc_lfm_artist": "Stefani Joanne Angelina Germanotta, known professionally as Lady Gaga, (born March 28, 1986 in New York, NY) is an American singer, songwriter and actress. She is known for her image reinventions and musical versatility. Gaga began performing as a teenager, singing at open mic nights and acting in school plays. She studied at Collaborative Arts Project 21, through the New York University Tisch School of the Arts, before dropping out to pursue a career in music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared"]}, {"n": 6, "title": "Them Crooked Vultures", "artist": "Them Crooked Vultures", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/them-crooked-vultures.jpg", "aoty_url": "https://www.albumoftheyear.org/album/958-them-crooked-vultures-them-crooked-vultures.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "c433d46d-e1d1-4053-922c-f542c43b6e67", "yt_id": "e4uCvr5xPr4", "rym": null, "genres": [], "desc_lfm_album": "Them Crooked Vultures was released by Interscope Records in the United States, and Sony/BMG internationally. On the 21st of October radio personality Alan Cross announced the lead single for Them Crooked Vultures debut album to be \"New Fang\" which premiered on October 26. The single will be released on November 2 worldwide as a free download. Iconvision subsequently announced that the album will be released on the 17th of November, 2009. The 2009 Tour will be titled Deserve the Future Tour and the UK leg sold out in just under 12 minutes, making it one of the quickest sold tours .", "desc_lfm_artist": "Them Crooked Vultures is a hard rock supergroup that formed in Los Angeles, California in 2009. Comprising drummer Dave Grohl (Foo Fighters, Nirvana), vocalist and guitarist Josh Homme (Queens of the Stone Age, Kyuss,  Eagles of Death Metal) and bassist and keyboardist John Paul Jones (Led Zeppelin), the band also features Alain Johannes (What Is This?, Eleven, Queens of the Stone Age) as a live rhythm guitarist and bassist. The band's self-titled debut album was released on November 16, 2009 in the UK and November 17, 2009 in the US.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 7, "title": "Live at Reading", "artist": "Nirvana", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1208-live-at-reading_003500.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1208-nirvana-live-at-reading.php", "aoty_critic_score": 89, "aoty_user_score": 88, "mbid": "48f5d526-0fa6-4ca6-ac59-9b2cf9ef464f", "yt_id": "pLn7z9OLLLg", "rym": null, "genres": [], "desc_lfm_album": "On August 30, 1992, Nirvana performed a critically acclaimed set at the Reading Festival. The setlist is made up mostly of Nevermind-era songs, with some Bleach-era tracks, three songs from the then-unreleased In Utero and two covers. The performance was released in album-form on November 3, 2009. Nirvana's appearance at the 1992 Reading Festival was the band's second performance at the annual music festival and their first since the success of their second album Nevermind had elevated them to the position of what Pitchfork called the \"biggest\" rock band in the world. It was also their final concert in the .", "desc_lfm_artist": "There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s.", "desc_mb_album": "", "desc_mb_artist": "Nirvana is a band whose shows and session recordings have been widely bootlegged as unofficial videos, CDs and raw WAV/FLAC files and mp3s. Details of these releases have been added to Musicbrainz where the sources have been confirmed. \r\n----\r\nDate and venue information current with information from the Nirvana LiveGuide (July 12, 2007 Update).\r\nDate and venue information current with information from the LiveNirvana (August 3, 2007 Update).\r\nBootlegs known to exist current with LiveNirvana (August 3, 2007 Update).", "heard_by": []}, {"n": 8, "title": "Bleach", "artist": "Nirvana", "year": 1989, "cover": "https://dn721606.ca.archive.org/0/items/mbid-adab3feb-1822-4d27-a997-db7d6c9688c0/mbid-adab3feb-1822-4d27-a997-db7d6c9688c0-26212361129.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "f1afec0b-26dd-3db5-9aa1-c91229a74a24", "yt_id": "TMbEsPB0ib4", "rym": "https://rateyourmusic.com/release/album/nirvana/bleach", "genres": ["alternative rock", "noise rock", "hardcore punk", "indie rock", "grunge", "sludge metal"], "desc_lfm_album": "Bleach is the debut album by the American grunge band Nirvana. It was released on June 15, 1989 through the independent record label Sub Pop. Bleach originally sold a mere 30,000 copies, but following the enormous success of the band's second album, Nevermind (1991), fans discovered Nirvana's obscure debut. It has since been certified platinum by the Recording Industry Association of America, making it one of only two albums released on Sub Pop to have received platinum certification. The main sessions for Bleach took place at Reciprocal Recording Studios in Seattle, Washington, with local producer Jack Endino manning the board. .", "desc_lfm_artist": "There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s.", "desc_mb_album": "Total production costs for recording the album: $606.17.\r\n\r\nThe releases with catalog DAMP114 came in several versions:\r\n· Black vinyl in a black/silver sleeve. \r\n· Blue vinyl in a black/silver sleeve. \r\n· Blue vinyl in a black/blue sleeve. \r\n· Blue vinyl in a blue/silver sleeve. \r\n· Purple vinyl in a purple/silver sleeve. \r\n· Red vinyl in a black/silver sleeve. \r\n· Red vinyl in a red/silver sleeve. \r\n· Red vinyl in an orange/silver sleeve. \r\n· Yellow vinyl in a black/silver sleeve. \r\n· Yellow vinyl in a black/yellow sleeve. \r\n\r\nThe Russian SP34b and the Saudi Arabian EN-4563 releases were counterfeits.\r\n\r\nThe Japanese cassette release did not have a catalog number.\r\n\r\nSP34 + SP73 was a limited edition swirled vinyl packaged with the with Sliver single.\r\n\r\nFor more info on vinyl version se", "desc_mb_artist": "Nirvana is a band whose shows and session recordings have been widely bootlegged as unofficial videos, CDs and raw WAV/FLAC files and mp3s. Details of these releases have been added to Musicbrainz where the sources have been confirmed. \r\n----\r\nDate and venue information current with information from the Nirvana LiveGuide (July 12, 2007 Update).\r\nDate and venue information current with information from the LiveNirvana (August 3, 2007 Update).\r\nBootlegs known to exist current with LiveNirvana (August 3, 2007 Update).", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 9, "title": "Tarot Sport", "artist": "Fuck Buttons", "year": 2009, "cover": "https://dn710801.ca.archive.org/0/items/mbid-6c582ec5-7f69-3903-bee2-95f0c01d8f7d/mbid-6c582ec5-7f69-3903-bee2-95f0c01d8f7d-4825853607.jpg", "aoty_url": "https://www.albumoftheyear.org/album/277-fuck-buttons-tarot-sport.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "ae8add31-2b86-4757-adbf-9c1b34e0635b", "yt_id": null, "rym": "https://rateyourmusic.com/release/album/fuck-buttons/tarot-sport", "genres": ["Metal", "Rock", "Electronic"], "desc_lfm_album": "", "desc_lfm_artist": "Fuck Buttons was Andrew Hung and Benjamin John Power (also known as Blanck Mass), a two-piece experimental group based in London, England, UK.\n\nFormed in late 2004 and signed to ATP Recordings, releasing the Bright Tomorrow b/w \"Little Bloody Shoulder\" 7\" single during the fall of 2007. They released their first album Street Horrrsing in 2008 and received widespread acclaim. \n\nTheir second album Tarot Sport was released in 2009. \"The album Tarot Sport is one of unbound possibility and lucid cohesion; a cerebral pilgrimage that refines", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 10, "title": "Axe To Fall", "artist": "Converge", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/axe-to-fall-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1113-converge-axe-to-fall.php", "aoty_critic_score": 81, "aoty_user_score": 86, "mbid": "5d95ce08-dc0b-450a-9730-611515f668fa", "yt_id": "mIJB-9xeyq8", "rym": null, "genres": [], "desc_lfm_album": "Axe to Fall is the seventh studio album released by American band Converge. It was released on October 20, 2009 through Epitaph Records and was released later on in the year through Deathwish Inc. as a vinyl record. It is their most commercially successful to date, peaking at number 74 in the Billboard 200. The album was produced by guitarist Kurt Ballou, who previously produced Converge's Jane Doe (2001), You Fail Me (2004) and No Heroes (2006), and features artwork created by lead singer Jacob Bannon. Axe to Fall is a collaborative album, which features a large number of guest .", "desc_lfm_artist": "Converge is an American band, formed in February of 1990 in Salem, Massachusetts, United States. Playing a blend of hardcore punk and extreme metal, this pioneer outfit helped define a lot of the rudiments of the fast-burgeoning metalcore and mathcore genres formed by vocalist Jacob Bannon and guitarist Kurt Ballou in Salem, Massachusetts in 1990. During the recording of their seminal fourth album Jane Doe, the group became a four-piece with the departure of guitarist Aaron Dalbec and the addition of bassist Nate Newton and drummer Ben Koller.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 11, "title": "brand new eyes", "artist": "Paramore", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/brand-new-eyes-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1103-paramore-brand-new-eyes.php", "aoty_critic_score": 74, "aoty_user_score": 83, "mbid": "cd706457-8b16-4809-a61a-cdba1b281d39", "yt_id": "Ikp6xmihLk8", "rym": null, "genres": [], "desc_lfm_album": "Brand New Eyes (stylized in lowercase) is the third studio album by American alternative rock band Paramore, released through Fueled by Ramen on September 29, 2009, in the United States and Canada. The album was produced by Rob Cavallo and recorded in Hidden Hills, California from January to March, 2009.It topped the charts in many countries across the world including Australia, New Zealand, Ireland and the United Kingdom, making it the band's most successful album to date. .", "desc_lfm_artist": "Paramore is a rock band formed in Franklin, Tennessee, United States in 2003. The band currently consists of Hayley Williams (vocals, keyboard), Taylor York (guitar) and Zac Farro (drums). They have released six studio albums: All We Know Is Falling, RIOT!, Brand New Eyes, their first Billboard 200 chart topper Paramore, After Laughter and their grammy winning sixth studio album This is Why .\n\nParamore, as a quartet, released their debut studio album, All We Know Is Falling, in 2005.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 12, "title": "You Will Never Know Why", "artist": "Sweet Trip", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/32590-you-will-never-know-why.jpg", "aoty_url": "https://www.albumoftheyear.org/album/32590-sweet-trip-you-will-never-know-why.php", "aoty_critic_score": 80, "aoty_user_score": 86, "mbid": "243b849d-2e2f-4002-babd-6d11c6ca088d", "yt_id": "MSq0gOJ9AGA", "rym": "https://rateyourmusic.com/release/album/sweet-trip/you-will-never-know-why", "genres": ["Electronic", "Pop", "Alternative Rock"], "desc_lfm_album": "“You Will Never Know Why” is the 3rd album from glitch pop/shoegaze duo Sweet Trip, released on September 28, 2009. The album marks a departure from the dense, glitchy, IDM-influenced soundscapes of its predecessor, Velocity : Design : Comfort, in favor of a mellow sound inspired by indie pop and dream pop. Rob states that the title “You Will Never Know Why”, for him, means “You will never know why things happen to you”. .", "desc_lfm_artist": "Sweet Trip was an American glitch pop and experimental rock band from San Francisco, California. The band consisted of Roberto Burgos and Valerie Cooper. Roberto met former band member Viet Le at a high school talent show sign up and the two went on to form the band in 1993. Past members include Valerie Cooper (guitar and vocals, 1993-2022), Viet Le (drums and bass, 1993-2000), Aaron Porter (bass, 1998-2009), and Rob Uytingco (drums, 2000-03). The band is known well for their fusion of shoegaze, idm, electronica, ambient and indie pop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 13, "title": "Hatred for Mankind", "artist": "Dragged Into Sunlight", "year": 2009, "cover": "https://i.discogs.com/KxtZ-E8RUL7Xu4BVSRhnKpXlyNw1P4ZEC0TM0mszlo8/rs:fit/g:sm/q:90/h:597/w:599/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTMyMTM4/NDItMTM1MTU5ODg5/NC05NzcxLmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/16485-dragged-into-sunlight-hatred-for-mankind.php", "aoty_critic_score": 75, "aoty_user_score": 83, "mbid": "e667d128-e045-4dd1-b915-c0460dcb86a8", "yt_id": "QGOPIJdvPDE", "rym": "https://rateyourmusic.com/release/album/dragged-into-sunlight/hatred-for-mankind", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The elusive Dragged Into Sunlight are a UK extreme metal act, with a collective of members, of whom some have maintained their involvement with profiled acts throughout the preceding decade.\n\nThe band have carved a unique sound established in 2006 and an underground following akin to a vast spread of bands active in the late 90s extreme, doom, death, black metal and harsh noise genres. Dragged Into Sunlight cite no specific influence other than the depression, isolation, abuse and calculated violence abundant in contemporary society.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 14, "title": "Album", "artist": "Girls", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/album.jpg", "aoty_url": "https://www.albumoftheyear.org/album/875-girls-album.php", "aoty_critic_score": 80, "aoty_user_score": 79, "mbid": "badaf397-4cf1-4087-9f74-0a83b6180fa1", "yt_id": "6Yc6yMwe72U", "rym": "https://rateyourmusic.com/release/album/girls/album", "genres": [], "desc_lfm_album": "Album is the debut album by the band Girls. It was released September 22, 2009 on True Panther Sounds. .", "desc_lfm_artist": "There are at least six artists which have used the name Girls: 1) an indie rock band from the US;\n2) a girl group from Brazil; 3) a rock band from Japan; 4) a synthpop group from Sweden; 5) a punk band from the US; and 6) a four-woman krautrock group from Germany.\n\n1) Girls was an A id Named Cudi (2008). Production for the album took place during 2007 to 2009 and was handled by several record producers, including Cudi, Kanye West, Emile Haynie, Plain Pat, No I.D., Dot da Genius, and Jeff Bhasker, among others. Man on the Moon: The End of Day spawned three singles–\"Day 'n' Nite\", \"Make Her Say\" and \"Pursuit of Happiness\"–that attained chart success, including the .", "desc_lfm_artist": "Scott Ramon Seguro Mescudi (born January 30, 1984 in Shaker Heights, Ohio, United States), better known by his stage name Kid Cudi, is a Grammy award nominated rapper, singer and actor who first gained attention after the release of his debut mixtape A Kid Named Cudi which he released in 2008 in collaboration with New York street wear brand 10.Deep. The mixtape caught the attention of Kanye West and led to Cudi's signing to the G.O.O.D. Music Label.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 17, "title": "Keep an Eye on the Sky", "artist": "Big Star", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7564-keep-an-eye-on-the-sky.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7564-big-star-keep-an-eye-on-the-sky.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "06720298-079b-499b-a9a7-9960e789351a", "yt_id": "NnEzkeaopmA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Big Star were an American power pop band formed in Memphis, Tennessee, in 1971 by Alex Chilton (1950 – 2010), Chris Bell (1951 – 1978), Jody Stephens and Andy Hummel (1951 - 2010). The group broke up in 1974. By the 1980s, they were recognised as one of rock music's classic groups. After the death of Chris Bell in 1978 and the deaths of both Alex Chilton and Andy Hummel in 2010, Jody Stephens is the last surviving original member of the group.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 18, "title": "Popular Songs", "artist": "Yo La Tengo", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/popular-songs.jpg", "aoty_url": "https://www.albumoftheyear.org/album/190-yo-la-tengo-popular-songs.php", "aoty_critic_score": 80, "aoty_user_score": 74, "mbid": "dc8f2c39-c180-4fb5-b4f4-f5ae771b33ff", "yt_id": "SmpelduRY3I", "rym": null, "genres": [], "desc_lfm_album": "Popular Songs is the twelfth full-length album by Hoboken-based rock band Yo La Tengo, released digitally, on CD, and double LP on September 8, 2009. It is their 7th album released on Matador and the eighth album to be given Matador's Buy Early Get Now treatment. It comes along with a vinyl LP featuring Yo La Tengo’s Original Score from the Motion Picture Adventureland. Five videos were made by director John McSwain to accompanying one song from the album each. In the weeks leading up to the release of the album, a new video was posted on Matador's various \"partner .", "desc_lfm_artist": "Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 19, "title": "Two Dancers", "artist": "Wild Beasts", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/two-dancers.jpg", "aoty_url": "https://www.albumoftheyear.org/album/260-wild-beasts-two-dancers.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "02cfef8f-1d10-49b5-976d-dcbe5376e8b0", "yt_id": "hipwY-zVufQ", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Wild Beasts was an indie rock band from Kendal, United Kingdom now based in London, UK. Wild Beasts were formed in 2002 in the north western England town of Kendal, by Queen Katherine School students Hayden Thorpe (vocals) and Ben Little (guitar). They originally performed under the name of Fauve, the French term for \"wild beast\". In January 2004, schoolmate Chris Talbot (drummer) joined, and they changed the band's name to Wild Beasts. The following year another student, Tom Fleming (bass), became a full-time member of the band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 20, "title": "Only Built 4 Cuban Linx... Pt. II", "artist": "Raekwon", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/only-built-4-cuban-linx-pt-ii.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1104-raekwon-only-built-4-cuban-linx-pt-ii.php", "aoty_critic_score": 86, "aoty_user_score": 81, "mbid": "f1459996-e174-43b4-a871-f72a9fca3dc6", "yt_id": "A5lZw4hmA30", "rym": null, "genres": [], "desc_lfm_album": "1 Return of the North Star (featuring Popa Wu) 2 House of Flying Daggers (featuring Inspectah Deck, Ghostface Killah, Method Man) 3 Sonny's Missing 4 Pyrex Vision 5 Cold Outside (featuring Ghostface Killah, Suga Bang) 6 Black Mozart (featuring RZA, Inspectah Deck) 7 Gihad (featuring Ghostface Killah) 8 New Wu (featuring Ghostface Killah, Method Man) 9 Penitentiary (featuring Ghostface Killah) 10 Baggin Crack 11 Surgical Gloves 12 Broken Safety (featuring Jadakiss, Styles P) 13 Canal Street 14 Ason Jones 15 Have Mercy (featuring Beanie Sigel, Blue Raspberry) 16 10 Bricks (featuring Cappadonna, Ghostface Killah) 17 Fat Lady Sings 18 Catalina .", "desc_lfm_artist": "Corey Woods (born January 12, 1970), a.k.a. Raekwon (/ɹeɪˈkwɒn/), is an American rapper, one of the nine Wu-Tang Clan  members. Raekwon joined Wu-Tang Clan, a hip hop group based in Staten Island, New York in 1992. When the time came for him to release his first solo album, Only Built 4 Cuban Linx... (1995), hip-hop, once again, underwent a momentous transformation. The album moves from track to track like a film moves from scene to scene. With its invigorating instrumentals and dramatic lyrical tales", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 21, "title": "Seek Magic", "artist": "Memory Tapes", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/seek-magic.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1030-memory-tapes-seek-magic.php", "aoty_critic_score": 81, "aoty_user_score": 77, "mbid": "1343b264-36ff-483c-800a-5c508131a8e9", "yt_id": "Fo0vgFhRjRs", "rym": "https://rateyourmusic.com/release/album/memory-tapes/seek-magic", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Memory Tapes is a recording alias of New Jersey-based Dayve Hawk. Memory Tapes' first LP, Seek Magic was released in September 2009, through the label Sincerly Yours, and in the UK on Something In Construction.\nHe also has released tracks under the names Memory Cassette and Weird Tapes.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 22, "title": "Wind's Poem", "artist": "Mount Eerie", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/280-winds-poem_004255.jpg", "aoty_url": "https://www.albumoftheyear.org/album/280-mount-eerie-winds-poem.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "b61fff72-135b-4177-b051-0c4885352d30", "yt_id": "MPuZUpbppEs", "rym": "https://rateyourmusic.com/release/album/mount-eerie/winds-poem", "genres": [], "desc_lfm_album": "Wind's Poem is the name of the fourth full-length album by Mount Eerie. It is largely inspired by black metal, and showcases Phil Elvrum in his \"relatively newfound affinity for Xasthur and other lynchpins of the unholy genre.\" .", "desc_lfm_artist": "Mount Eerie represents the latest evolution of Phil Elverum's musical vision.  Formerly known as The Microphones, Elverum began Mount Eerie in 2003,  maintaining his previous project's subtle, lo-fi, and lyrically dense fuzz-folk aesthetic.  \n\nElverum explained this change in an 2003 interview with Discorder, asserting that \"Mount Eerie is a new project. The Microphones was completed, or at least at a good stopping point. I did it because I am ready for new things. I am new.\"", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu"]}, {"n": 23, "title": "xx", "artist": "The xx", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/279-xx_215335.jpg", "aoty_url": "https://www.albumoftheyear.org/album/279-the-xx-xx.php", "aoty_critic_score": 84, "aoty_user_score": 77, "mbid": "23355caf-a543-4b5f-80fe-449101868fc1", "yt_id": "NHeplawA0Mo", "rym": "https://rateyourmusic.com/release/album/the-xx/xx", "genres": [], "desc_lfm_album": "xx is the debut album by English indie pop band the xx. After they signed a contract with XL Recordings, the band recorded the album from December 2008 to February 2009 at the label's in-house studio in London. Audio engineer Rodaidh McDonald worked with the xx during the recording sessions and strived to reproduce the intimate, unembellished quality of their demos. The band's Jamie Smith produced xx on his laptop and created electronic beats for the songs, which he then mixed in a detailed process with McDonald. .", "desc_lfm_artist": "The xx are an English alternative rock band from Wandsworth, London, formed in 2005. The band consists of  Romy Madley Croft (guitar, vocals), Oliver Sim (bass guitar, vocals), Jamie Smith, also known as Jamie xx (beats, MPC, record production), and formerly Baria Qureshi (keyboard, guitar). The band is known for the distinct and minimalist sound that blends indie rock, indie electronic, indie pop, dream pop and electro-rock and the dual vocalist setup of both Madley Croft and Sim.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 24, "title": "Masked ber one for two consecutive weeks. So far it has spent sixty-five consecutive weeks within the top forty and thirty-three of those inside the top ten. It also peaked .", "desc_lfm_artist": "This is an incorrect tag for the band Florence + The Machine. Songs scrobbled to this incorrect tag will automatically redirect to the correct tag if Autocorrection is turned on. However, it is recommended that you change your ID3 tags to the correct artist name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario", "verygooood"]}, {"n": 26, "title": "Travels with Myself and Another", "artist": "Future of the Left", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/travels-with-myself-and-another.jpg", "aoty_url": "https://www.albumoftheyear.org/album/207-future-of-the-left-travels-with-myself-and-another.php", "aoty_critic_score": 81, "aoty_user_score": 79, "mbid": "2cbdd61f-8d61-357e-a4ef-c4396d90347b", "yt_id": "cc5blabxh0c", "rym": null, "genres": [], "desc_lfm_album": "Second studio album from Future Of The Left. The physical release was 22nd of June 2009, but fans who pre-ordered on the band's website were given access download the album from early May. Unfortunately some of the mp3s had typos in the track names, leading to incorrect stats and associations on last.fm. The correct track list is: 1. Arming Eritrea 2. Chin Music 3. The Hope That House Built 4. Throwing Bricks At Trains 5. I Am Civil Service 6. Land Of My Formers 7. You Need Satan More Than He Needs You 8. That Damned Fly 9. Stand By .", "desc_lfm_artist": "Future of the Left is an alternative rock band formed in 2005 in Cardiff, Wales. The current line-up is Andrew Falkous (aka Falco) (vocals, guitar, keyboards), Julia Ruzicka (bass) and Jack Egglestone (drums).  Their signature style combines minimalist guitar or synth riffs with Falco's darkly satirical lyrics delivered with ferocious energy; but many songs also contain strong melodies, varied Dn5WdKqmK9s", "rym": "https://rateyourmusic.com/release/album/grizzly-bear/veckatimest", "genres": [], "desc_lfm_album": "Veckatimest is the third full-length studio album by American indie rock band Grizzly Bear, released on May 26, 2009, on Warp Records. The album is named after a small island in Dukes County, Massachusetts. Veckatimest debuted at #8 on the US Billboard 200, selling 33,000 copies in its first week of release. It sold around 220,000 copies until September 2012. The recording of Veckatimest began in the summer of 2008 at Allaire Studios in the Catskill Mountains of upstate New York. Regarding the writing process, Ed Droste states: Nico Muhly collaborated with Grizzly Bear on this album. In the interim .", "desc_lfm_artist": "Grizzly Bear is an American indie rock band formed in Brooklyn, New York in 2002. Their music uses melody and ambience in conjunction with hazy-eyed choruses, whistles, piano, banjo, and several woodwind instruments.\n\nGrizzly Bear was originally the solo project of Edward Droste (vocals/guitar), who recorded his debut album Horn of Plenty at home.  The record was originally meant for his friends, but it eventually circulated and got a proper release in 2004, this time with the help of Christopher Bear (drums/vocals).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 32, "title": "Monoliths and Dimensions", "artist": "Sunn O)))", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/183-monoliths-and-dimensions_133225.jpg", "aoty_url": "https://www.albumoftheyear.org/album/183-sunn-o-monoliths-and-dimensions.php", "aoty_critic_score": 85, "aoty_user_score": 79, "mbid": "2c33e8a0-b2be-3224-8748-92e1d8ea948e", "yt_id": "5WpehZ3dSxM", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Sunn O))) (pronounced \"sun\") is an American drone metal band from Seattle, Washington, that formed in 1998. The band is known for an extremely heavy sound that blends diverse genres including drone, black metal, dark ambient, and noise rock, and for very loud live performances. Supported by a varying cast of collaborators, the band was formed by two core members: Stephen O'Malley (also of Khanate and Burning Witch) and Greg Anderson (of Goatsnake and Engine Kid).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 33, "title": "Wolfgang Amadeus Phoenix", "artist": "Phoenix", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/wolfgang-amadeus-phoenix-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/151-phoenix-wolfgang-amadeus-phoenix.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "32304f6e-5b80-3818-a66b-47f09efff0d9", "yt_id": "Du33pGGWfC0", "rym": "https://rateyourmusic.com/release/album/phoenix/wolfgang-amadeus-phoenix", "genres": [], "desc_lfm_album": "Wolfgang Amadeus Phoenix is the fourth studio album by French indie pop band Phoenix, released 25th of May 2009 by V2 Records. It was produced by Phoenix themselves and Philippe Zdar (mixing and drums on \"Fences\"). While the band had already been enjoying a moderate underground following, this was the start of their exposure to the mainstream. The album spawned 3 successful singles: \"1901\", \"Lisztomania\" and \"Lasso\". The album won the Grammy Award for Best Alternative Music Album on 31 January 2010. It is Phoenix's most successful release to date. .", "desc_lfm_artist": "There have been several artists that have used the name Phoenix, the two best known are an alternative rock band from France and a folk rock band from Romania.\n\n1) Phoenix The French band comprises Thomas Mars (vocals), Deck D'Arcy (bass), Christian Mazzalai (guitar) and Laurent Brancowitz (guitar), who started playing music as kids in a suburb of Versailles during the same cultural period that produced late-'90s bands such as Air,Mellow and Daft Punk. The band's lineup has no permanent drummer or keyboardist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 34, "title": "Journal For Plague Lovers", "artist": "Manic Street Preachers", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/journal-for-plague-lovers.jpg", "aoty_url": "https://www.albumoftheyear.org/album/158-manic-street-preachers-journal-for-plague-lovers.php", "aoty_critic_score": 80, "aoty_user_score": 77, "mbid": "fa48a83d-3a94-4dcb-b537-d04692259d7e", "yt_id": "Yt8Wqkkspv8", "rym": null, "genres": ["Rock", "Punk", "Alternative Rock"], "desc_lfm_album": "Journal for Plague Lovers is the ninth studio album by Manic Street Preachers, released on May 18, 2009, by record label Columbia. Recorded between October 2008 and February 2009 and produced by Steve Albini and Dave Eringa, it features exclusively posthumously published lyrics by Richey Edwards, who disappeared on 1 February 1995 and was presumed deceased in 2008. It is the only Manic Street Preachers album in which the lyrics for every song were written solely by Edwards. .", "desc_lfm_artist": "Manic Street Preachers are an alternative rock band from Blackwood, Wales, formed in 1986. Often referred to as \"the Manics\", they are James Dean Bradfield (vocals, guitars), Nicky Wire (bass, occasional vocals) and Sean Moore (drums, backing vocals, occasional trumpet). The band were originally a quartet: lyricist and rhythm guitarist Richey Edwards mysteriously vanished on 1 February 1995. He was declared presumed deceased in November 2008.\n\nThe Manics released their debut album Generation Terrorists in 1992.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 35, "title": "Yesterday and Today", "artist": "The Field", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/yesterday-and-today.jpg", "aoty_url": "https://www.albumoftheyear.org/album/168-the-field-yeste ary 2009, Japandroids signed to Unfamiliar Records for the release of their debut LP Post-Nothing, deciding to continue on temporarily.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 39, "title": "Sometimes I Wish We Were An Eagle", "artist": "Bill Callahan", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/sometimes-i-wish-we-were-an-eagle.jpg", "aoty_url": "https://www.albumoftheyear.org/album/105-bill-callahan-sometimes-i-wish-we-were-an-eagle.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "67caf928-e13e-35fb-9faf-2777c007d59f", "yt_id": "ry01mrtQJhI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Bill Callahan (born 1966), also known as Smog and (Smog), is an American singer-songwriter born in Silver Spring, Maryland. Callahan began working in the lo-fi genre of underground rock, with home-made tape-albums recorded on four track tape recorders. Later he began releasing albums with the label Drag City, to which he remains signed today.\n\nCallahan started out as a highly experimental artist, using substandard instruments and recording equipment.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 40, "title": "Crack the Skye", "artist": "Mastodon", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22-crack-the-skye_032943.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22-mastodon-crack-the-skye.php", "aoty_critic_score": 81, "aoty_user_score": 87, "mbid": "defcc444-7255-320d-bf21-888eb4d53ff9", "yt_id": "b1Ls5O6ap8Y", "rym": "https://rateyourmusic.com/release/album/mastodon/crack-the-skye", "genres": ["Metal", "Rock"], "desc_lfm_album": "Crack the Skye is the fourth studio album by American progressive metal band Mastodon, released on March 24, 2009 through Reprise Records. It features seven tracks and runs at 50 minutes and 6 seconds. The album debuted at number 11 on the Billboard 200, selling 41,000 copies in its first week. In Australia, the album debuted at number 19. It had sold 200,000 copies in the US as of September 2010, making it one of their highest selling albums to date. According to an interview on the DVD The Making of Crack the Skye, this album represents the element of .", "desc_lfm_artist": "Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 41, "title": "Born Like This", "artist": "MF DOOM", "year": 2009, "cover": "https://cdn2.albumoftheyear.org/600x0/album/born-like-this-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/83-mf-doom-born-like-this.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "c748987e-7cb5-3880-b246-d20af2b136f3", "yt_id": "UyN1MOAhfyo", "rym": null, "genres": [], "desc_lfm_album": "BORN LIKE THIS is the sixth and final solo studio album by British-American rapper/producer MF DOOM. It was released under the pseudonym DOOM on March 24, 2009 through Lex Records. It debuted at number 52 on the Billboard 200 chart, having sold 10,895 copies as of March 29, 2009. In addition to tracks produced by MF DOOM, the album includes production by frequent collaborator Madlib, as well as J Dilla. The album title is borrowed from Charles Bukowski's poem \"Dinosauria, We\", which employs it as a cadence. The track \"Cellz\" opens with a sampled recording of Bukowski reading the poem. .", "desc_lfm_artist": "Daniel Dumil 25th, 2008, Decaydance Records released a mixtape titled Welcome to the New Administration on Pete Wentz's viral campaign, Citizens For Our Betterment. .", "desc_lfm_artist": "Fall Out Boy is a pop punk band formed in 2001 in Wilmette, Illinois after good friends Joe Trohman and Pete Wentz met high schooler Patrick Stump. Stump originally auditioned as a drummer, but soon became the lead singer. The following year, the band debuted with a self-released demo and followed it up with the May 28, 2002 release of Split EP, which featured Project Rocket, on Uprising Records. The group released a mini-LP, Evening Out With Your Girlfriend, also on Uprising Records, in 2003.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 55, "title": "ランプ幻想 [Lamp Phantasma]", "artist": "Lamp", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/230484-lamp-genso.jpg", "aoty_url": "https://www.albumoftheyear.org/album/230484-lamp--lamp-phantasma.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": null, "yt_id": "shmd-WlaJzU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There is more than one artist with the name Lamp.\n\n1. Lamp  (ランプ)  are a Japanese band formed in 2000. There are three members:\n\nTaiyo Someya (染谷大陽; born 13 November 1979) - guitar, synthesizer, vibraphone\nYusuke Nagai (永井祐介; born 22 July 1980) – vocals, guitar, bass, keyboard\nKaori Sakakibara  (榊原香保里; born 17 November 1979) – vocals, flute, accordion\n\nFormation\nSomeya started playing guitar in middle school. In the folk club during high school", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 56, "title": "Sugar Mountain: Live at Canterbury House 1968", "artist": "Neil Young", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/857-sugar-mountain-live-at-canterbury-house-1968_053534.jpg", "aoty_url": "https://www.albumoftheyear.org/album/857-neil-young-sugar-mountain-live-at-canterbury-house-1968.php", "aoty_cri
