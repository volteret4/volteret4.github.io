se and the Mask was released on October 11, 2005 by Epitaph in the United States. It was also released by Lex Records in the United Kingdom on October 17, 2005, with different cover art.\n\nIt was", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 229, "title": "Z", "artist": "My Morning Jacket", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/z-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/478-my-morning-jacket-z.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "3e3d75c0-48a4-3def-8dc3-b417b2d6e5e7", "yt_id": "Z6LLb3lf9zs", "rym": null, "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Z is the fourth studio album by psychedelic rock band My Morning Jacket. This collection features a much spacier and more polished sound than previous releases, making heavy use of synthesizers throughout and incorporating reggae and dub influences. The heavy reverb that was a defining characteristic of the band's prior recordings is largely absent. The songs on the album are more focused and shorter in length compared to the band's previous albums. A double-live album, Okonokos, was recorded at the end of the Z Tour and was released on September 26, 2006; it features live versions of eight of Z's .", "desc_lfm_artist": "My Morning Jacket is an American indie rock band formed in 1998 in Louisville, Kentucky, United States. The band consists of Jim James (vocals, guitar), Carl Broemel (guitar), \"Two Tone\" Tommy Blankenship (bass), Bo Koster (keyboards) and Patrick Hallahan (drums). The band is best known for their reverb-soaked sound and their enthusiastic live shows. My Morning Jacket is signed with ATO Records. The band's style is a blend of alternative, alt country, folk rock and psychedelic rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario"]}, {"n": 230, "title": "Broken Social Scene", "artist": "Broken Social Scene", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/broken-social-scene-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/491-broken-social-scene-broken-social-scene.php", "aoty_critic_score": 77, "aoty_user_score": 83, "mbid": "16b2e095-9c48-30a3-9c10-227e717c6456", "yt_id": "U7lGxNx7SWQ", "rym": "https://rateyourmusic.com/release/album/broken-social-scene/broken-social-scene", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Broken Social Scene are a Canadian indie rock collective formed in 1999 in Toronto, Ontario. The band's core members were Kevin Drew and Brendan Canning. This duo recorded and released the band's ambient debut album Feel Good Lost, in 2001, with contributions from Ohad Benchetrit (also known as Years), Evan Cranley, Leslie Feist, Justin Peroff, Bill Priddle, and Charles Spearin. All of these musicians would emerge as key members of Broken Social Scene in future endeavors.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 231, "title": "Extraordinary Machine", "artist": "Fiona Apple", "year": 2005, "cover": "https://ia803401.us.archive.org/18/items/mbid-cb05981e-89ba-44ce-9184-ce625fc0d2aa/mbid-cb05981e-89ba-44ce-9184-ce625fc0d2aa-31396612442.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1277-fiona-apple-extraordinary-machine.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "81c98a74-56ba-355e-8d63-83e12a63dace", "yt_id": "WQk0xTwZumo", "rym": "https://rateyourmusic.com/release/album/fiona-apple/extraordinary-machine", "genres": ["pop rock", "baroque pop", "indie rock", "alternative pop"], "desc_lfm_album": "Extraordinary Machine is the third studio album by Fiona Apple, released on October 4, 2005, through Epic Records. Produced by Jon Brion, it was expected to be released in 2003 but was delayed several times by the record label without explanation, leading to speculation that a dispute had arisen over its commercial appeal. The controversy surrounding the album and leaked recordings of the Jon Brion sessions were the subject of substantial press attention, as well as a highly publicized fan-led campaign to see the album officially released. In collaboration with producers Mike Elizondo and Brian Kehew, Apple re-recorded the album .", "desc_lfm_artist": "Fiona Apple McAfee-Maggart (born September 13, 1977) is an American singer-songwriter. She is known for her songwriting and has released five albums between 1996 and 2020, all of which reached the top 20 on the U.S. Billboard 200 chart. As of 2021, she has sold over 15 million records worldwide. Apple has received several awards, including three Grammy Awards, two MTV Video Music Awards, and a Billboard Music Video Award.\n\nApple is the youngest daughter of actor Brandon Maggart and was born in New York City.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "armandwave"]}, {"n": 232, "title": "Apologies To The Queen Mary", "artist": "Wolf Parade", "year": 2005, "cover": "https://dn711008.ca.archive.org/0/items/mbid-03f7f036-31b2-34a2-96cc-7e33f2c55ccf/mbid-03f7f036-31b2-34a2-96cc-7e33f2c55ccf-9822085962.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "d147f6f8-1ca1-3df0-acd9-3c81808f2822", "yt_id": "VKmixRYUFBE", "rym": "https://rateyourmusic.com/release/album/wolf-parade/apologies-to-the-queen-mary.p", "genres": ["indie rock"], "desc_lfm_album": "Apologies to the Queen Mary is the highly-acclaimed first full-length album by Wolf Parade. It was released on September 27, 2005. .", "desc_lfm_artist": "Wolf Parade is an indie rock band from Victoria, British Columbia, based in Montreal, QC. The band went on indefinite hiatus in 2011, but announced its return to recording and performing in January 2016. Wolf Parade was formed when Spencer Krug (also Sunset Rubdown, Frog Eyes, Moonface and Swan Lake) was offered a gig supporting Arcade Fire. He called Dan Boeckner (formerly of notable B.C. band Atlas Strategic, now also part of Handsome Furs) and they wrote songs with a drum machine before calling Arlen Thompson to play drums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 233, "title": "From Mars to Sirius", "artist": "Gojira", "year": 2005, "cover": "https://dn710603.ca.archive.org/0/items/mbid-a430ab40-b6ad-3add-98fe-276d5251a42b/mbid-a430ab40-b6ad-3add-98fe-276d5251a42b-22928954741.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9481-gojira-from-mars-to-sirius.php", "aoty_critic_score": 71, "aoty_user_score": 88, "mbid": "c64e38e7-ea8d-3cda-ba62-1f4b9f899419", "yt_id": "z70ch7cE8ak", "rym": "https://rateyourmusic.com/release/album/gojira/from-mars-to-sirius", "genres": ["heavy metal", "progressive metal", "death metal", "Metal"], "desc_lfm_album": "From Mars to Sirius is the third studio album by the French progressive death metal band Gojira. A concept album, From Mars to Sirius relates the resurrection of a dead planet through an interplanetary quest, tackling environmental issues as well as broader themes of life, death, and rebirth. Explaining the meaning behind the album title, Joe Duplantier said in an interview that \"In some cultures, Mars symbolizes war and Sirius peace. I'm simplifying! It is a journey of a state of war, even if in France we are preserved, but it can be a war within us, in our flesh, .", "desc_lfm_artist": "There are multiple artists called Gojira;\n\n1) Gojira is a metal band from Bayonne, France. Their lyrics focus on life, ecology, and spiritual themes. They were formed in 1996 by brothers Joe Duplantier (vocals and lead guitar) and Mario Duplantier (drums), Christian Andreu (guitar) and Alexandre Cornillon (bass guitar). Cornillon left the band in 2001 and Jean-Michel Labadie became their bass player. Genres that they have been associated with over their career include death metal, progressive metal, thrash metal and groove metal.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 234, "title": "Takk...", "artist": "Sigur Rós", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/takk-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3596-sigur-ros-takk.php", "aoty_critic_score": 83, "aoty_user_score": 86, "mbid": "47d8e9e2-dc13-3d94-afee-1f8c38cec091", "yt_id": "_GozH0kZcDs", "rym": "https://rateyourmusic.com/release/album/sigur-ros/takk", "genres": [], "desc_lfm_album": "Takk... (Icelandic for Thanks...) is the fourth full-length studio album by the Icelandic band Sigur Rós. The first singles, \"Glósóli\" and \"Sæglópur\", were released on August 15, 2005 and August 16, 2005 respectively, the former worldwide and the latter only in the United States. The single \"Hoppípolla\" was released in the UK on 28 November 2005 and entered the singles chart at #35 on 4 December. Upon its re-release in May 2006 it reached #24 in the UK chart. .", "desc_lfm_artist": "Sigur Rós is an Icelandic post-rock band. The name is derived from the name of lead vocalist Jónsi Birgisson's little sister, Sigurrós. They hail from the same creative and vibrant Icelandic music scene as múm and Amiina. They released their first-ever foray into film-making with their tour documentary, Heima in late 2007. \n\nJón Þór Birgisson (Jónsi), Georg Hólm, and Ágúst Ævar Gunnarsson formed the group in Reykjavík, Iceland in August 1994.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 235, "title": "The Minstrel Show", "artist": "Little Brother", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10876-the-minstrel-show_013433.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10876-little-brother-the-minstrel-show.php", "aoty_critic_score": 79, "aoty_user_score": 88, "mbid": "44c8f2cb-6082-3021-8da8-f12ace7c3c98", "yt_id": "vLReIhRgVS8", "rym": "https://rateyourmusic.com/release/album/little-brother/the-minstrel-show-2", "genres": ["Hip-Hop"], "desc_lfm_album": "The Minstrel Show is the second studio album by hip hop trio, Little Brother. It followed the critical success of their 2003 debut, The Listening. The album was highly anticipated and touted as a probable breakthrough for the group, even before its release. The title is a reference to the minstrel shows that were popular in America during the 19th century. .", "desc_lfm_artist": "Little Brother was a hip-hop group from Durham, North Carolina, USA that consisted of rappers Phonte and Rapper Big Pooh, and DJ/producer 9th Wonder (from 2001 to 2007).\n\nLittle Brother was formed in Durham, NC, at North Carolina Central University in 1998. The group began as a trio, featuring members Phonte (Phonte Coleman), Big Pooh (Thomas Jones), and producer 9th Wonder (Pat Douthit). They are founding members of the North Carolina hip-hop collective called The Justus League, under the umbrella music group The Hall of Justus.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "alberto_gu"]}, {"n": 236, "title": "Chaos and Creation in the Backyard", "artist": "Paul McCartney", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7211-chaos-and-creation-in-the-backyard.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7211-paul-mccartney-chaos-and-creation-in-the-backyard.php", "aoty_critic_score": 74, "aoty_user_score": 81, "mbid": "a12b1e53-3426-3510-866e-0650e98d5894", "yt_id": "9elQeVfrLOo", "rym": "https://rateyourmusic.com/release/album/paul-mccartney/chaos-and-creation-in-the-backyard", "genres": ["soft rock"], "desc_lfm_album": "Chaos and Creation in the Backyard is an album by Paul McCartney released in 2005. A long time in the making, the set was produced by Radiohead and Beck collaborator Nigel Godrich at George Martin's suggestion. McCartney plays almost all of the instruments similar to his 1970 album McCartney and the 1980 McCartney II. In addition, Chaos And Creation In The Backyard marks the first time since 1984's Give My Regards to Broad Street that McCartney was not involved in producing one of his studio albums. Chaos and Creation in the Backyard was McCartney's last rock album release for longtime .", "desc_lfm_artist": "Sir James Paul McCartney CH MBE (born 18 June 1942) is an English singer, songwriter, musician, and record and film producer who gained worldwide fame as co-lead vocalist and bassist for the Beatles. His songwriting partnership with John Lennon remains the most successful in history. After the group disbanded in 1970, he pursued a solo career and formed the band Wings with his first wife, Linda, and Denny Laine.\n\nA self-taught musician, McCartney is proficient on bass, guitar, keyboards, and drums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 237, "title": "the book about my idle plot on a vague anxiety", "artist": "toe", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29174-the-book-about-my-idle-plot-on-a-vague-anxiety.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29174-toe-the-book-about-my-idle-plot-on-a-vague-anxiety.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "ba24af71-9a64-4e8f-b3a5-ffb8c5fd9f40", "yt_id": "0tf598iQ0l4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are three groups with the name Toe:\n\n1. toe (Japanese band) is a Japanese math-rock / post-rock / instrumental  music group.\n\n2. Toe (American band) is a Chicago post-rock music group.\n\n3. Toe (English band) is a experimental/noise rock band from Ipswich.\n\njapanese band : http://www.toe.st/\n\ntoe is a Japanese music group that formed in 2000. Although mentioned in many post-rock circles, their song structure and dynamics are similar to many popular math rock artists.", "desc_mb_album": "", "desc_mb_ar t.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 239, "title": "Plans", "artist": "Death Cab for Cutie", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1367-plans_053240.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1367-death-cab-for-cutie-plans.php", "aoty_critic_score": 64, "aoty_user_score": 80, "mbid": "bc7630eb-521a-3312-a281-adfb8c5aac7d", "yt_id": "G7f4K3aVMrk", "rym": null, "genres": [], "desc_lfm_album": "Plans is the fifth studio album by American indie rock band Death Cab for Cutie, released on August 30, 2005. Drummer Jason McGerr noted the continuity between this album and their previous one, stating: if Transatlanticism was an inhale, Plans is the exhale.\" In 2006, a DVD was released titled Directions, an anthology of 11 short films all inspired by tracks of Plans. .", "desc_lfm_artist": "Death Cab for Cutie is an American indie rock band formed in Bellingham, Washington in 1997. The band consists of Ben Gibbard (vocals, guitar, piano), Nicholas Harmer (bass), Jason McGerr (drums), Dave Depper (guitar) and Zac Rae (keyboards).\n\nDeath Cab began as a solo project of Ben Gibbard, now the band's vocalist and guitarist. Gibbard took the band name from the satirical song Death Cab for Cutie, performed by The Bonzo Dog Band in The Beatles' 1967 experimental film Magical Mystery Tour.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 240, "title": "Ghost Reveries", "artist": "Opeth", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2325-ghost-reveries_021502.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2325-opeth-ghost-reveries.php", "aoty_critic_score": 89, "aoty_user_score": 88, "mbid": "00f78b7d-bd0a-356a-aec4-925e529023f8", "yt_id": "tXlZjJM6u8A", "rym": "https://rateyourmusic.com/release/album/opeth/ghost-reveries", "genres": ["Metal", "Rock"], "desc_lfm_album": "Ghost Reveries is the eighth full-length studio album release of progressive death metal band Opeth. It is their first album with their new record label, Roadrunner Records. It is also the first album by Opeth to include Per Wiberg as a \"permanent\" member, although Wiberg contributed keyboard work to Opeth's live performances starting around the time of Deliverance. As well, this is the last album by the band featuring long-time guitarist Peter Lindgren and drummer Martin Lopez. Ghost Reveries was recorded at Fascination Street Studios, which are located in Örebro, Sweden. The album's artwork is by Travis Smith, who has .", "desc_lfm_artist": "Opeth is a Swedish progressive metal band from Stockholm, formed in 1990. The band incorporates elements of folk, blues, classical, and jazz into its compositions, alongside influences from death metal, particularly in their early works. Their music often includes acoustic guitar passages, Mellotron use, death growls, and dynamic shifts.\n\nOpeth has experienced several lineup changes, with every original member eventually replaced. Mikael Åkerfeldt", "desc_mb_album": "", "desc_mb_artist": "The band logo was created by [https://musicbrainz.org/artist/0bf74085-4006-4a1e-b0c9-a3a3b504e7a2|Timo Ketola].", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 241, "title": "Twin Cinema", "artist": "The New Pornographers", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/twin-cinema-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/488-the-new-pornographers-twin-cinema.php", "aoty_critic_score": 81, "aoty_user_score": 79, "mbid": "5b36f019-6c92-32e0-be67-433e125859d1", "yt_id": "95RYOMk40ho", "rym": "https://rateyourmusic.com/release/album/the-new-pornographers/twin-cinema", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The New Pornographers is a Canadian indie rock group formed in 1997 in Vancouver, British Columbia. Their sound is influenced by that of such power pop bands as The Cars and Cheap Trick, but they use much more sophisticated rhythms and chord changes. Although it was widely reported that the New Pornographers got their name from a pamphlet put out by televangelist Jimmy Swaggart condemning rock ‘n’ roll as “the new pornography,” Carl Newman has stated that he came up with the name after watching Shohei Imamura's The Pornographers (1966).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 242, "title": "Doppelgänger", "artist": "The Fall of Troy", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/38107-doppelganger.jpg", "aoty_url": "https://www.albumoftheyear.org/album/38107-the-fall-of-troy-doppelganger.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "e325bc4c-c164-3b13-8cfa-81bb3d22f786", "yt_id": "vn-DPa7OvUc", "rym": "https://rateyourmusic.com/release/album/the-fall-of-troy/doppelganger", "genres": [], "desc_lfm_album": "Doppelgänger is the second full-length album from Mukilteo, Washington's The Fall of Troy, which followed up the band's bootlegged Ghostship demos from 2004 as well as their self-titled LP from 2003. Four of the songs (\"I Just Got This Symphony Goin'\", \"F.C.P.R.E.M.I.X.\", \"Mouths Like Sidewinder Missiles\", \"Whacko Jacko Steals the Elephant Man's Bones\") were re-recorded versions of tracks from the self-titled album, hence the name Doppelgänger. \"Macaulay McCulkin\" was taken from the Ghostship EP. .", "desc_lfm_artist": "The Fall of Troy is a post-hardcore trio formed in 2002 in Mukilteo, Washington, United States. The lineup consists of Thomas Erak (guitar, vocals), Tim Ward (bass, vocals), and Andrew Forsman (drums). Tim Ward left the band in 2007 and was replaced by Frank Ene.\n\nOn February 26, 2010, Thomas announced that the band were parting ways following their upcoming \"The Marked Men of 2010\" tour. Between 2010 and 2013, he formed Just Like Vinyl and joined Chiodos. Andrew Forsman also joined The Monday Mornings, and Frank Black joined Chineke.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 243, "title": "Shinola, Vol. 1", "artist": "Ween", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1567-shinola-vol-1_111557.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1567-ween-shinola-vol-1.php", "aoty_critic_score": 79, "aoty_user_score": 80, "mbid": "9dce315f-0e42-3f23-aecc-68ae7ac1b2a8", "yt_id": "BOBkm6g_nuc", "rym": null, "genres": [], "desc_lfm_album": "Shinola, Vol. 1 is an odds-and-ends compilation album by Ween, released on July 19, 2005 on Chocodog Records. The tracks on Shinola were made by remixing and editing various demo recordings from previous recording sessions. In some cases, new material was recorded and added to the songs. Nearly two decades later, there are no known plans for a Shinola, Vol. 2. .", "desc_lfm_artist": "Ween is an American rock band from New Hope, Pennsylvania, formed in 1984 by Aaron Freeman and Mickey Melchiondo, who perform under the stage names Gene Ween and Dean Ween. The band is commonly categorized as alternative rock and is noted for a highly eclectic musical style drawing on influences including funk, psychedelia, soul, country, gospel, progressive rock, R&B, heavy metal, and punk rock.\n\nFrom their formation through 1989, Ween self-released several cassette-only recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave"]}, {"n": 244, "title": "Speak for Yourself", "artist": "Imogen Heap", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7666-speak-for-yourself_132951.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7666-imogen-heap-speak-for-yourself.php", "aoty_critic_score": 67, "aoty_user_score": 86, "mbid": "a100260d-0576-372f-a07b-4b22db1a77e2", "yt_id": "E_fh7AeTIlo", "rym": "https://rateyourmusic.com/release/album/imogen-heap/speak-for-yourself", "genres": [], "desc_lfm_album": "Speak for Yourself is the second solo album by British singer Imogen Heap, following her collaborative effort with Guy Sigsworth as Frou Frou. It was released on July 18, 2005 in the UK, on November 1, 2005 in the USA, Canada and Mexico, and re-released through White Rabbit Recordings in the UK on April 17, 2006. The album was written, produced, arranged, and funded by Heap, without the backing of a record label, and features guest appearances from Jeff Beck, who does a guitar solo on \"Goodnight and Go\", and Heap's boyfriend, Richie Mills, who argues with her on \"The .", "desc_lfm_artist": "Imogen Heap (born December 9, 1977, in Havering, Outer London) is a British singer-songwriter / electronica artist. She is known for her work as part of the musical duo Frou Frou from 2002-3, and for her solo albums, which she writes, produces, and mixes. She has released a series of solo albums including Ellipse (in 2009), a North American chart success that earned Heap two Grammy nominations and won her the Best Engineered Album (Non-Classical) award.", "desc_mb_album": "", "desc_mb_artist": "Singer-songwriter Imogen Heap could hardly have enjoyed a more prestigious live debut - performing four songs, backed by friends Acacia, between sets by the Who and Eric Clapton at the 1996 Prince's Trust Concert in London's Hyde Park. She grew up playing music from an early age, and by the time of her eleventh birthday had begun to write her own songs. A graduate of the Brit School in Croydon, as well as being a talented writer Heap is also adept at a number of musical instruments, including cello, clarinet, piano, harpsichord and percussion. Her first demo tapes began to circulate in February 1996, and within months she had been signed to Almo Records by Jerry Moss, business partner of Herb Alpert. Her first reviews predictably compared her to Alanis Morissette, though in truth the major", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 245, "title": "Illinois", "artist": "Sufjan Stevens", "year": 2005, "cover": "https://dn710206.ca.archive.org/0/items/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1-26865127077.jpg", "aoty_url": "https://www.albumoftheyear.org/album/477-sufjan-stevens-illinoise.php", "aoty_critic_score": 92, "aoty_user_score": 91, "mbid": "1fb75447-c513-38c4-ad8f-1bfc441aa74c", "yt_id": "ovIh2WVhbPs", "rym": "https://rateyourmusic.com/release/album/sufjan-stevens/illinois", "genres": ["folk rock", "chamber folk", "baroque pop", "chamber pop", "indie rock", "indie folk"], "desc_lfm_album": "Illinois (or \"Sufjan Stevens Invites You To: Come On Feel The Illinoise\") is the second album in the so-called 50 States Project, which later turned out to be a stunt. The album focuses on Illinois and includes some things from Sufjan’s past as well. The artwork for the album originally included Superman but was eventually replaced (or, on some albums, flat-out removed). Contrary to popular belief, this is not because DC Comics filed a cease and desist. Rather, Asthmatic Kitty’s lawyers advised against this copyright infringement and a sticker of balloons was placed over it. They had also made other .", "desc_lfm_artist": "Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 246, "title": "Octavarium", "artist": "Dream Theater", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33595-octavarium.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33595-dream-theater-octavarium.php", "aoty_critic_score": 70, "aoty_user_score": 81, "mbid": "5a52d5f9-9173-3d88-bc27-569e333f9207", "yt_id": "E4Z9zm97PZM", "rym": null, "genres": [], "desc_lfm_album": "Octavarium is the eighth full-length Dream Theater studio album, released on June 7, 2005 It holds the distinction of being the last album ever recorded at The Hit Factory in New York City. According to the DVD Documentary in Score, John Petrucci considered this album to be the band's best work to that point. Songs Octavarium follows a pattern started in Dream Theater's sixth studio album, Six Degrees of Inner Turbulence, which had six songs (and also the word \"six\" in the title). The next album, Train of Thought, was the band's seventh studio album and contained 7 tracks. Octavarium, .", "desc_lfm_artist": "Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy.", "desc_mb_album": "", "desc_mb_artist": "Sites with lists of bootlegs: [http://www.ytsecollection.com/|Ytsecollection], [http://www.hf.rim.or.jp/~junya/dtboots/dtboots.html|The Sphere] and [http://dt.qrayg.com/bootlegs/|qDT].", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 247, "title": "Fijación Oral, Vol. 1", "artist": "Shakira", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8217-fijacion-oral-vol-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8217-shakira-fijacion-oral-vol-1.php", "aoty_critic_score": 67, "aoty_user_score": 82, "mbid": "7e66c980-29da-3290-ac9f-75c2d4aa98ec", "yt_id": "q3fJ3q3ZYXA", "rym": null, "genres": [], "desc_lfm_album": "Fijación Oral, Vol. 1 is the sixth studio album by Colombian singer and songwriter Shakira. It was released on 3 June 2005 by Epic Records. After attaining international success in 2001 with her first English record, Laundry Service, Shakira wanted to release a fifth Spanish-language project as its followup. In the vein of her earlier work, Fijación Oral, Vol. 1 is a Latin pop album. Shakira enlisted Rick Rubin as executive producer, also working with Gustavo Cerati, Lester Mendez, Luis Fernando Ochoa and Jose \"Gocho\" Torres. .", "desc_lfm_artist": "Shakira Isabel Mebarak Ripoll is a Colombian singer. Born and raised in Barranquilla, She made her recording debut with Sony Music Colombia at the age of 13. Following the commercial failure of her first two albums, Magia (1991) and Peligro (1993), she rose to prominence in Hispanic countries with her next albums, Pies Descalzos (1995) and Dónde Están los Ladrones? (1998). She entered the English-language market with her fifth album, Laundry Service (2001), which sold over 13 million copies worldwide.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "alberto_gu", "verygooood"]}, {"n": 248, "title": "Bang Bang Rock & Roll", "artist": "Art Brut", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/469-bang-bang-rock-roll_034925.jpg", "aoty_url": "https://www.albumoftheyear.org/album/469-art-brut-bang-bang-rock-roll.php", "aoty_critic_score": 80, "aoty_user_score": 73, "mbid": "02525917-fe51-3d52-9b42-9faefb352b3e", "yt_id": "wzOZTFaS-jw", "rym": "https://rateyourmusic.com/release/album/art-brut/bang-bang-rock-and-roll", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Art Brut is an alternative rock band which formed in London, England in 2003. The current line-up consists of Eddie Argos (vocals), Ian Catskilkin (guitar), Friederike \"Freddy\" Feedback (bass), Toby Macfarlaine (guitar) and Stephen Gilchrist (drums).\nVocalist Eddie Argos (an ex-goth obsessed with Jonathan Richman and Vincent Van Gogh) had previously been in a band, The Art Goblins, in his hometown of Bournemouth. Their stage show would see him “playing a vacuum cleaner” and escaping from a sack.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 249, "title": "The Woods", "artist": "Sleater-Kinney", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-woods.jpg", "aoty_url": "https://www.albumoftheyear.org/album/486-sleater-kinney-the-woods.php", "aoty_critic_score": 85, "aoty_user_score": 84, "mbid": "b7d0d3f5-8980-32c6-995d-db6f8226f1ca", "yt_id": "xXuw2iC5Ino", "rym": "https://rateyourmusic.com/release/album/sleater-kinney/the-woods", "genres": ["Rock", "Punk", "Alternative Rock"], "desc_lfm_album": "The Woods is the seventh studio album by American indie rock band Sleater-Kinney. It was released in 2005 on Sub Pop. The album was produced by Dave Fridmann and recorded from November 2004 to December 2004 at Tarbox Road Studios in Cassadaga, New York. The album received widespread critical acclaim. .", "desc_lfm_artist": "Sleater-Kinney (/ˌsleɪtərˈkɪniː/ SLAY-tər-KIN-ee) is an American indie rock band formed in Olympia, Washington, in 1994. The band's current lineup features vocalists/guitarists Corin Tucker and Carrie Brownstein, following the departure of longtime drummer Janet Weiss. Sleater-Kinney came out of the riot grrrl movement, formed from the ashes of the bands Heavens to Betsy and Excuse 17. Today they are recognized as a key part in the American indie rock scene.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "sdecandelario"]}, {"n": 250, "title": "Be", "artist": "Common", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6844-be-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6844-common-be.php", "aoty_critic_score": 82, "aoty_user_score": 89, "mbid": "93b891c9-4fc4-3085-960e-5da4c7fe8113", "yt_id": "Teyg8fbx0wY", "rym": "https://rateyourmusic.com/release/album/common/be", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "Be is the sixth studio album by American rapper Common. It was released on May 24, 2005, by Geffen Records and GOOD Music. The album was primarily produced by rapper Kanye West, with additional production from frequent collaborator J Dilla. It debuted at number two on the US Billboard 200, with first-week sales of 185,000 copies in the United States. The album is Common's second album to sell over 500,000 copies (over 800,000 copies sold), becoming a certified gold by the Recording Industry Association of America (RIAA). Be was also a critical success, receiving acclaim and accolades from several critics .", "desc_lfm_artist": "Lonnie Rashid Lynn, Jr. (born March 13, 1972 in Chicago, Illinois), better known by his stage name Common (previously Common Sense), is a Grammy award winning rapper, author and actor known for lyrics that focus on love and spirituality. Many people describe him as being a conscious hip hop artist who makes songs that send a message. He debuted in 1992 with the album Can I Borrow a Dollar? and maintained a significant underground following into the late 90s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 251, "title": "The Moon Is a Dead World", "artist": "Gospel", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/16193-the-moon-is-a-dead-world.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16193-gospel-the-moon-is-a-dead-world.php", "aoty_critic_score": 74, "aoty_user_score": 84, "mbid": "cec11e5b-be46-3eb7-82f0-bffee37307f4", "yt_id": "Zx6IZmjhLjw", "rym": "https://rateyourmusic.com/release/album/gospel/the-moon-is-a-dead-world/", "genres": ["Rock", "Punk"], "desc_lfm_album": "", "desc_lfm_artist": "Gospel is an American post-hardcore band formed in Brooklyn, New York in 2003. The band comprises Adam Dooling, Sean Miller, Vincent Roseboom and Jon Pastir.  Their sound mixes the atmosphere of psychedelia, structural sensibilities and instrumentation of Genesis-esque progressive rock, and primal aggression/desperation of hardcore/screamo.\n\nTheir debut full-length on Level Plane was released on May 10, 2005, entitled The Moon Is a Dead World. \n\nIn late December", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 252, "title": "Mezmerize", "artist": "System Of A Down", "year": 2005, "cover": "https://dn710901.ca.archive.org/0/items/mbid-e167cb33-7bf0-46bd-9f80-eb4d9dcfb61d/mbid-e167cb33-7bf0-46bd-9f80-eb4d9dcfb61d-21165068600.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "8d18c070-adea-353f-a089-cbd2543342dd", "yt_id": "Ws8sMtt8VK0", "rym": null, "genres": ["metal", "alternative metal", "avant-garde metal", "reissue label release without rebranding the interior"], "desc_lfm_album": "Mezmerize is the fourth album by System of a Down and the first half of the Mezmerize/Hypnotize double album. It was released on May 17, 2005, six months before Hypnotize. Despite the time difference between releases, the album actually takes its name from the lyrics in the song Hypnotize; Mezmerize and Hypnotize were recorded within the same time frame. The album features guitarist Daron Malakian sharing most of the vocal work with vocalist Serj Tankian, splitting the vocals at least halfway on most of the tracks. The album debuted at number one in at least twelve countries, including the US .", "desc_lfm_artist": "System of a Down is an Armenian-American heavy metal band formed in Glendale, California, in 1994. Since 1997, the lineup has consisted of Serj Tankian (lead vocals, keyboards), Daron Malakian (guitar, vocals), and Shavo Odadjian (bass, backing vocals), along with drummer John Dolmayan, who replaced original drummer Andy Khachaturian.\n\nThe band achieved commercial success with five studio albums, three of which debuted at number one on the US Billboard 200.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "verygooood"]}, {"n": 253, "title": "Demon Days", "artist": "Gorillaz", "year": 2005, "cover": "https://dn720606.ca.archive.org/0/items/mbid-2968b394-7ca8-3b6a-a3ec-a0239adb01c9/mbid-2968b394-7ca8-3b6a-a3ec-a0239adb01c9-4436715369.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1353-gorillaz-demon-days.php", "aoty_critic_score": 79, "aoty_user_score": 86, "mbid": "f959a46a-a136-3134-9412-6572b23fad95", "yt_id": "QylI7_zJb_E", "rym": "https://rateyourmusic.com/release/album/gorillaz/demon-days", "genres": ["alternative rock", "art pop", "trip hop", "alternative hip hop", "hip hop", "alternative dance"], "desc_lfm_album": "Demon Days is the second studio album and a concept album by Gorillaz, released on 23 May 2005 in the United Kingdom and on 24 May in the United States. The album is produced by Damon Albarn and Danger Mouse and features contributions from De La Soul, Neneh Cherry, Martina Topley-Bird, Roots Manuva, MF DOOM, Ike Turner, Bootie Brown of the Pharcyde, Shaun Ryder, Dennis Hopper, the London Community Gospel Choir and the San Fernando Valley Youth Chorus. Demon Days entered the UK charts at #1 and the U.S. charts at #6, outperforming the band's 2001 debut, Gorillaz. The album .", "desc_lfm_artist": "Gorillaz is a British virtual band created in 1998 by musician Damon Albarn and artist Jamie Hewlett. The band currently consists of four animated members: Murdoc Niccals (bass guitar) who formed the band, 2-D (lead vocals, keyboards), Noodle (guitar, vocals) and Russel Hobbs (drums and percussion). Their fictional universe is explored through animated music videos, interviews and animated shorts. In reality, Albarn is the only permanent musical contributor and often collaborates with other musicians.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 254, "title": "Gimme Fiction", "artist": "Spoon", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/gimme-fiction-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/485-spoon-gimme-fiction.php", "aoty_critic_score": 81, "aoty_user_score": 79, "mbid": "c7a0fc4d-b6a0-3a43-9e25-4052e4fe33b2", "yt_id": "vJj5PhM0biY", "rym": null, "genres": [], "desc_lfm_album": "ARTIST: SPOON TITLE: Gimme Fiction RECORD LABEL: Merge REVIEW BY: Michael Delgado The always experimental, often exceptional, Spoon return with their 5th album, GIMME FICTION. Whether upbeat or downbeat, the songs have the rhythm of a metronome, like a funky two-step shuffle, back and forth and back and forth. It’s a comfortable pattern to lose yourself in when blanketed by a variety of instruments and sound effects. A bed Spoon fans are familiar with. Although, the bed may feel too snug, this time out. The simple, radio-friendly songs may sound bland compared to offerings from the band’s past, but tracks .", "desc_lfm_artist": "Spoon is an American indie rock band from Austin, Texas. The band was formed in late 1993 by lead singer/guitarist Britt Daniel and drummer Jim Eno. Current members also include: Eric Harvey (keyboard, guitar, percussion, backing vocals) and Rob Pope (bass, backing vocals - replaced Joshua Zarbo in 2007).\nAfter releasing their debut LP Telephono on Matador Records, the band signed with Elektra in 1998, but the contract was dropped soon after the band released A Series of Sneaks.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 255, "title": "With Teeth", "artist": "Nine Inch Nails", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5555-with-teeth_092641.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5555-nine-inch-nails-with-teeth.php", "aoty_critic_score": 67, "aoty_user_score": 80, "mbid": "10224fb3-a861-3247-9eab-81b7b0fbb0d4", "yt_id": "UIdGArAgrCo", "rym": "https://rateyourmusic.com/release/album/nine-inch-nails/with-teeth", "genres": [], "desc_lfm_album": "With Teeth (also known as Halo 19 or WITH_TEETH]) is the fifth full-length studio album by Nine Inch Nails, released on May 3, 2005. It spawned three singles (The Hand That Feeds, Only and Every Day Is Exactly The Same), four tour legs, and much celebration for Trent Reznor's sobriety. According to a statement on nin.com, Reznor stated that producer Rick Rubin was Reznor's \"mentor\" and \"source of inspiration\" throughout the planning and writing process of the album. Reznor was also heavily inspired by the use of more analog electronic effects and instruments, specifically tape delay and modular synthesizers, stating .", "desc_lfm_artist": "Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated", "desc_mb_album": "", "desc_mb_artist": "Please note the following about Nine Inch Nails releases:\n\n    * Certain tracks frequently included on Nine Inch Nails bootlegs are not actually Nine Inch Nails tracks; however they do feature Trent on vocals. These include:\n        * [http://musicbrainz.org/track/9f249bf3-af50-43b6-a820-b52091ca757d.html|1000 Homo DJs - Supernaut (Trent Reznor vocal version)] (studio)\n        * [http://musicbrainz.org/track/8440e3d4-d78e-49e7-9cf6-14e87ba53a8b.html|Tori Amos - Past The Mission] (studio)\n        * [http://musicbrainz.org/track/8ee4f9e3-6ff2-436d-bcb2-4f87dde6c0ae.html|David Bowie - Hallo Spaceboy] (live, vocal duet; played with Bowie's band on stage)\n        * [http://musicbrainz.org/track/c9a1f57b-a18d-4ede-bb91-cba7b6765890.html|David Bowie - Warszawa] (live, vocal duet, played with Bowi", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 256, "title": "Robyn", "artist": "Robyn", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/763-robyn_121929.jpg", "aoty_url": "https://www.albumoftheyear.org/album/763-robyn-robyn.php", "aoty_critic_score": 86, "aoty_user_score": 79, "mbid": "8ba74d8f-46af-399d-ba00-6f0584dee8ad", "yt_id": "vitil9qMN6A", "rym": "https://rateyourmusic.com/release/album/robyn/robyn-1/", "genres": [], "desc_lfm_album": "Robyn is the fourth studio album by Swedish recording artist Robyn. It was released on 27 April 2005 by Konichiwa Records. The album represented a change in Robyn's musical style, and featured pop and electronic dance music; inspirations were electronic duo The Knife and rock band Teddybears. It also marks Robyn's first album release on her own record label, Konichiwa Records, which she founded in 2005. The album debuted at number one on the Swedish Albums Chart in 2005, becoming Robyn's first-ever number-one album on the chart. It was released Internationally in 2007, two years after it was originally released. .", "desc_lfm_artist": "Robyn is the stage name of the Swedish pop singer-songwriter Robin Miriam Carlsson (born 12 June 1979 in Stockholm, Sweden). She is best known for her critically acclaimed electropop music, her impressive live shows and the hits \"With Every Heartbeat\" (#1 UK) and \"Dancing On My Own\" (#8 UK, #1 Sweden). In 2011, the single \"Dancing On My Own\" was nominated at Grammy Awards for the category Best Dance Recording. She is the owner of Konichiwa Records, through which she releases her music, including Robyn and Body Talk.", "desc_mb_album": "", "desc_mb_artist": "Swedish pop singer and songwriter, living in Stockholm.\r\nShe had a hit outside of Europe with a song called \"Show Me Love\" in 1997. This is not to be confused with a different song of the same title by [http://musicbrainz.org/artist/37a0943e-9638-48fe-9a56-7192d7efbbed|Robin S].", "heard_by": ["Frikomid", "MaxtorUwU", "sdecandelario"]}, {"n": 257, "title": "The Sunset Tree", "artist": "Mountain Goats", "year": 2005, "cover": "https://dn711106.ca.archive.org/0/items/mbid-da425314-ecc7-4db3-a296-90942f172b18/mbid-da425314-ecc7-4db3-a296-90942f172b18-28511522132.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "7797081a-94b6-3a9b-b103-fc215b85d46a", "yt_id": "20TryVspOfY", "rym": "https://rateyourmusic.com/release/album/the-mountain-goats/the-sunset-tree-5", "genres": ["folk rock", "chamber folk", "chamber pop", "indie rock", "indie folk"], "desc_lfm_album": "", "desc_lfm_artist": "Incorrect tag for The Mountain Goats. Keep stats clean by fixing your ID3 tags, or leave auto-correction on. Don't cheat the artist of plays and listeners...", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "paqueradejere"]}, {"n": 258, "title": "Blinking Lights And Other Revelations", "artist": "Eels", "year": 2005, "cover": "https://dn710305.ca.archive.org/0/items/mbid-6c6156f9-38a0-3183-85e8-df6432517dca/mbid-6c6156f9-38a0-3183-85e8-df6432517dca-4207186910.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3c809945-d185-3227-b3b9-e4e039bf99ed", "yt_id": "Jws0FNODaTw", "rym": "https://rateyourmusic.com/release/album/eels/blinking-lights-and-other-revelations/reviews/6", "genres": ["alternative rock", "indie pop"], "desc_lfm_album": "", "desc_lfm_artist": "Eels (often typeset as eels or EELS) is an American rock band, formed in Los Angeles, California, in 1991 by singer/songwriter and multi-instrumentalist Mark Oliver Everett, known by the stage name E. Band members have changed over the years, both in the studio and on stage, making Everett the only official member for most of the band's work. Eels' music is often filled with themes of family, death, and unrequited love. Since 1996, Eels has released fourteen studio albums, seven of which charted in the Billboard 200.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 259, "title": "Akuma No Uta", "artist": "Boris", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/492413-akuma-no-uta.jpg", "aoty_url": "https://www.albumoftheyear.org/album/492413-boris-akuma-no-uta.php", "aoty_critic_score": 82, "aoty_user_score": 86, "mbid": "7c1b4907-9d93-4cb5-b357-e9a451f28c34", "yt_id": "muUYo9qfPSA", "rym": null, "genres": [], "desc_lfm_album": "Akuma no Uta (hiragana: あくまのうた) is the fifth full-length album by Japanese band Boris, the name meaning \"The Devil's Song\". This album stands out as a combination of all the genres, stylings, and sounds of their previous works, yet maintains a mostly 70s rock sound with a bit of sludge, punk, drone, and post-rock. Originally released in 2003 on Diwphalanx Records with minimalistic artwork, it was re-issued in 2005 on Southern Lord Records with the cover of the LP, which was limited to 500 copies. The album cover of the US CD/Japan LP is a direct tribute to the cover .", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared"]}, {"n": 260, "title": "Alligator", "artist": "The National", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/alligator-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/322-the-national-alligator.php", "aoty_critic_score": 78, "aoty_user_score": 80, "mbid": "8bebb379-ac9e-3283-b230-a2d3deae7346", "yt_id": "P1BjndTZvQY", "rym": "https://rateyourmusic.com/release/album/the-national/alligator", "genres": ["Rock", "Punk", "Alternative Rock"], "desc_lfm_album": "Alligator is the third album by Brooklyn-based indie rock band The National, released in April 2005. The album brought The National critical acclaim and led them to headline a tour, with opening act Clap Your Hands Say Yeah. The album was on many year-end top 10 lists, including Uncut and Planet Sound, both of which ranked it as the number two album of 2005. Pitchfork Media and NME ranked Alligator as a top album of the 2000s. Alligator has sold over 200,000 copies worldwide. .", "desc_lfm_artist": "The National is an American indie rock band formed in Brooklyn, New York in 1999, by friends from Cincinnati, Ohio. The band's lyrics are written and sung by Matt Berninger in a distinctive, deep baritone. The rest of the band is composed of two pairs of brothers: Aaron Dessner (guitar, bass, keyboards), Bryce Dessner (guitar), Scott Devendorf (bass, guitar) and Bryan Devendorf (drums). \n\nTheir self-titled debut album\"The National\" (Brassland 2001) was recorded and released before they had played even a single show.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 261, "title": "The Emancipation of Mimi", "artist": "Mariah Carey", "year": 2005, "cover": "https://dn721800.ca.archive.org/0/items/mbid-8a2ad1ee-618c-4824-9090-39075cc41297/mbid-8a2ad1ee-618c-4824-9090-39075cc41297-39749365635.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12435-mariah-carey-the-emancipation-of-mimi.php", "aoty_critic_score": 63, "aoty_user_score": 81, "mbid": "2391debf-38aa-3a90-888e-51f857131e98", "yt_id": "BpcORYC6jPE", "rym": "https://rateyourmusic.com/release/album/mariah-carey/the-emancipation-of-mimi", "genres": ["r&b", "contemporary r&b", "pop soul", "dance-pop", "pop rap"], "desc_lfm_album": "The Emancipation of Mimi is the tenth studio album by American singer Mariah Carey, released on April 12, 2005, through Island Records. Following a period of career turbulence, the album marked a major comeback, reestablishing Carey as one of the most dominant voices in R&B and pop music. With a sound rooted in R&B, hip-hop soul, and pop, The Emancipation of Mimi became the best-selling album of 2005 in the U.S. and one of the defining records of her career. Background and Creation After the mixed reception of her previous albums, Carey sought to craft a project that reflected her .", "desc_lfm_artist": "Mariah Carey (born March 27, 1969) is an American singer, songwriter, record producer, author and actress. She is known for her five-octave vocal range, melismatic singing style, and use of the whistle register. In 2023, Rolling Stone ranked her as the fifth-greatest singer of all time.\n\nCarey rose to prominence with her self-titled debut album in 1990 and became the first artist to have their first five singles reach number one on the US Billboard Hot 100, from \"Vision of Love\" through \"Emotions\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84"]}, {"n": 262, "title": "Beauty and the Beat", "artist": "Edan", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/beauty-and-the-beat.jpg", "aoty_url": "https://www.albumoftheyear.org/album/495-edan-beauty-and-the-beat.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "ea9ac011-9745-3e59-8b2f-d80ed3f1e5b0", "yt_id": "8DK8TkP0DzM", "rym": "https://rateyourmusic.com/release/album/edan/beauty-and-the-beat-1", "genres": ["Rock", "Hip-Hop"], "desc_lfm_album": "", "desc_lfm_artist": "Edan (born Edan Portnoy) is an independent emcee, DJ and producer based in Boston, USA. He is a former member of the band Fiber 2001 and is known for his eclectic mix of classic mid-80s till early 90s hip-hop with 60s rock, funk and other styles. His mix-tape \"Sound of the Funky Drummer\" collects hip hop tracks sampling James Brown's \"Funky Drummer\", which has been called the most-sampled record of all time. In 2005 he released the album Beauty and the Beat", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 263, "title": "Deadwing", "artist": "Porcupine Tree", "year": 2005, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8995-deadwing.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8995-porcupine-tree-deadwing.php", "aoty_critic_score": 71, "aoty_user_score": 83, "mbid": "cdebdda3-f478-367c-92d2-3d592323cd91", "yt_id": "rdvVoU7kW5Y", "rym": "https://rateyourmusic.com/release/album/porcupine-tree/deadwing", "genres": ["Metal", "Rock"], "desc_lfm_album": "Deadwing is the eighth studio album by British progressive rock band Porcupine Tree, first released on March 28, 2005. It quickly became the band's best selling album to date (though was later surpassed by Fear of a Blank Planet). The album is based on a screenplay written by Steven Wilson and Mike Bennion, and is essentially a ghost story. Given its narrative, most fans have dubbed this a concept album. Wilson has expressed the intention to eventually have this film script made into a movie. The album includes collaborations with King Crimson's Adrian Belew (who plays guitar solos on tracks .", "desc_lfm_artist": "Porcupine Tree is a British progressive rock band formed in Hemel Hempstead, Hertfordshire, United Kingdom in 1987. During the course of the band's history, it has at times incorporated psychedelic rock, alternative, ambient, electronic, and, most recently, metal and post-rock into its unique style of progressive rock. Since 2010, mainstay Steven Wilson has concentrated on his solo work. On November 1st, 2021, the band announced a new album and tour in the formation Gavin Harrison, Steven Wilson, and Richard Barbieri (without Colin Edwin).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 264, "title": "Arular", "artist": "M.I.A.", "year": 2005, "cover": "https://ia600505.us.archive.org/3/items/mbid-35515550-6500-4268-9bba-98db9d52a6bd/mbid-35515550-6500-4268-9bba-98db9d52a6bd-18944633156.jpg", "aoty_url": "https://www.albumoftheyear.org/album/481-mia-arular.php", "aoty_critic_score": 86, "aoty_user_score": 82, "mbid": "32d38e25-27e8-45bc-b79b-931f5a609546", "yt_id": "VzjLrkCG-cg", "rym": "https://rateyourmusic.com/release/album/m_i_a/arular", "genres": ["dance", "hip hop", "alternative dance", "breakbeat", "uk garage"], "desc_lfm_album": "Ever since her 2004 self-released mixtape—the acclaimed Piracy Funds Terrorism Volume 1—M.I.A. has been an unabashedly political artist. So perhaps it’s not surprising that the British Sri Lankan artist’s 2005 debut, Arular, takes its title from the code name her Eelam Tamil activist father Arul Pragasam was using during the Sri Lankan civil war. As M.I.A.—who was born Mathangi “Maya” Arulpragasam—explained at the time, she’d named the album Arular in the hopes that her largely absent dad would see his moniker on a pop record and reach out (a desire which would eventually become reality). But the album is still .", "desc_lfm_artist": "Mathangi Arulpragasam (born 18 July 1975), known professionally as M.I.A. (an initialism for both \"Missing in action\" and \"Missing in Acton\"), is a British singer, rapper, songwriter, record producer, and activist. Her music combines elements of alternative, dance, electronic, hip hop and world music with electronic instruments and samples. \n\nBorn in London to Sri Lankan Tamil parents, M.I.A. and her family moved to Jaffna in northern Sri Lanka when she was six months old.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik"]}, {"n": 265, "title": "Picaresque", "artist": "Decemberists", "year": 2005, "cover": "https://ia800207.us.archive.org/25/items/mbid-42ef4aa7-a493-4ba8-be55-b66e73cc4c3d/mbid-42ef4aa7-a493-4ba8-be55-b66e73cc4c3d-44188352098.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "83809016-521d-3b0b-8685-7d0e554fdcb7", "yt_id": "3uhL1npXgTI", "rym": null, "genres": ["folk rock", "indie rock", "indie folk"], "desc_lfm_album": "", "desc_lfm_artist": "Incorrect tag for The Decemberists. Keep stats clean by fixing your ID3 tags, or leave auto-correction on. Don't cheat the artist of plays and listeners...", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 266, "title": "Rossz csillag alatt született", "artist": "Venetian Snares", "year": 2005, "cover": "https://dn710700.ca.archive.org/0/items/mbid-e80bfc5b-e880-4509-91bf-089c9b7d7839/mbid-e80bfc5b-e880-4509-91bf-089c9b7d7839-2573781324.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e01c7844-8189-38a3-8a45-af2bcf480531", "yt_id": "H28YlOrnTaA", "rym": "https://rateyourmusic.com/release/album/venetian-snares/rossz-csillag-alatt-szuletett/", "genres": ["modern classical", "breakcore", "drill and bass"], "desc_lfm_album": "Rossz Csillag Alatt Született (Hungarian pronunciation: ) is a 2005 album by breakcore artist Venetian Snares, released on the Planet Mu label. Inspired by an earlier journey of Aaron Funk's to Hungary, the album title and all of the track names are in Hungarian; Rossz csillag alatt született translates to \"Born Under a Bad Star\". Stylistically, the album consists of classical strings and trumpets combined with chaotic breakbeats. It is arguably Funk's most cr
