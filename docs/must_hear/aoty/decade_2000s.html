for her contributions to music and fashion. Her awards include two Grammy Awards, four Brit Awards, and eighteen ARIA Music Awards. She is regarded as the highest-selling Australian female recording artist, with estimated global sales exceeding 80 million records. In 2024, Time included her in its annual list of the 100 most influential people in the world.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 437, "title": "Let It Come Down", "artist": "Spiritualized", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/let-it-come-down.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1047-spiritualized-let-it-come-down.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "8d64439f-5e8f-374b-a993-629f000258a2", "yt_id": "b_Idip0kllU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Spiritualized are an English rock band formed in 1990 in Rugby, Warwickshire, United Kingdom by Jason Pierce, who often goes by the alias J. Spaceman, after the spectacular demise of the Spacemen 3 outfit. The membership of Spiritualized changes from album to album, with Pierce being the only constant factor.\n\nThe first Spiritualized release was a space rock-esque cover of Any Way That You Want Me in 1990, a record which heralded the official split of Spacemen 3 following contractual wrangles over the band's name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "paqueradejere"]}, {"n": 438, "title": "The Olatunji Concert: The Last Live Recording", "artist": "John Coltrane", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/61604-the-olatunji-concert-the-last-live-recording.jpg", "aoty_url": "https://www.albumoftheyear.org/album/61604-john-coltrane-the-olatunji-concert-the-last-live-recording.php", "aoty_critic_score": 90, "aoty_user_score": 88, "mbid": "772ed231-470d-3fac-a550-30fa95b037c6", "yt_id": "YDiKea1r7sw", "rym": null, "genres": [], "desc_lfm_album": "The Olatunji Concert: The Last Live Recording is the Impulse! Records-released final live recording of saxophonist John Coltrane, recorded April 23, 1967, at the Olatunji Center of African Culture in New York and released on Compact Disc in 2001. The album consists of two songs—\"Ogunde\", which Coltrane also recorded for his final approved album, Expression, and an especially free-form \"My Favorite Things\", which Coltrane had performed live regularly since 1960. The recording was made for broadcast on Billy Taylor's local radio station, WLIB. The Olatunji Concert was not Coltrane's last show, but rather, his penultimate—he would play once more on .", "desc_lfm_artist": "John William Coltrane (Hamlet, North Carolina, September 23, 1926  – Huntington, New York, July 17, 1967) was an American jazz  saxophonist and composer.\n\nAmerican jazz great John Coltrane emerged in the 1950s, playing tenor and soprano sax with Dizzy Gillespie, Miles Davis and Thelonious Monk. A leader of \"hard bop\", in the 1960s he led his own groups and changed the face of jazz with experimentation and improvisation, his later recordings reflecting his belief that music was a form of spiritual expression.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 439, "title": "Yankee Hotel Foxtrot", "artist": "Wilco", "year": 2002, "cover": "https://dn721605.ca.archive.org/0/items/mbid-3102eca5-d5f1-47e6-a2ac-1d29257b1a6f/mbid-3102eca5-d5f1-47e6-a2ac-1d29257b1a6f-35248832894.jpg", "aoty_url": "https://www.albumoftheyear.org/album/345-wilco-yankee-hotel-foxtrot.php", "aoty_critic_score": 91, "aoty_user_score": 86, "mbid": "95f2ba4b-2dd9-38d1-8158-a416a391489c", "yt_id": "3RQcPC8KY_g", "rym": "https://rateyourmusic.com/release/album/wilco/yankee-hotel-foxtrot", "genres": ["country rock", "alternative rock", "art rock", "country", "indie rock"], "desc_lfm_album": "Yankee Hotel Foxtrot is the fourth album by Chicago-based rock band Wilco. The album was completed in 2001, but Reprise Records, a Warner Music Group label, refused to release it. Wilco acquired the rights to the album when they left the label. In September 2001, Wilco streamed the entire album for free on their website. Wilco signed with Nonesuch Records (another Warner label) in November of that year, and the album was officially released on April 23, 2002. Yankee Hotel Foxtrot was a critical and commercial success, and is their best selling album, with over 500,000 copies sold in the .", "desc_lfm_artist": "Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 440, "title": "Labor Days", "artist": "Aesop Rock", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8061-labor-days.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8061-aesop-rock-labor-days.php", "aoty_critic_score": 81, "aoty_user_score": 84, "mbid": "43f0606f-38ce-3d7c-891b-3e089cc150e0", "yt_id": "qKbuTaHWQ7M", "rym": "https://rateyourmusic.com/release/album/aesop-rock/labor-days", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Aesop Rock (born Ian Bavitz on June 5, 1976) is an alternative hip hop artist/producer from Long Island, New York, United States. He has released 12 albums: \"Music for Earthworms\" (1997), \"Float\" (1999), \"Labor Days\" (2001), \"Bazooka Tooth\" (2003),  \"None Shall Pass\" (2007), \"Skelethon\" (2012), \"The Impossible Kid\" (2016),  \"Spirit World Field Guide\" (2020), \"Garbology\" (2021), \"Integrated Tech Solutions\" (2023), \"Black Hole Superette\" (2025), and \"I Heard It's A Mess There Too\" (2025).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 441, "title": "The Glow Pt. 2", "artist": "The Microphones", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-glow-pt-2-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/570-the-microphones-the-glow-pt-2.php", "aoty_critic_score": 93, "aoty_user_score": 91, "mbid": "f478fad9-a746-3625-9f14-bc4a74918c0e", "yt_id": "9Sgq8l1m9W0", "rym": null, "genres": [], "desc_lfm_album": "The Glow Pt. 2 is the third studio album by American indie folk and indie rock project the Microphones. It was released on September 11, 2001, through K Records and later through P.W. Elverum & Sun, Ltd. Recording was done on analog equipment at Dub Narcotic, Olympia, Washington, from May 2000 to March 2001. The album takes influences from numerous music genres such as black metal, ambient and avant-garde, as well as non-musical sources like the American drama television show Twin Peaks and primary member Phil Elverum's relationship to Khaela Maricich. Elverum was responsible for the album's production in its .", "desc_lfm_artist": "The Microphones was the solo project of American musician Phil Elverum from 1996 to 2003, with comebacks in 2007 and 2019 to 2022 respectively, Its sound is best described as lo-fi \"fuzz folk,\" including drum-crashing, bass-thrashing sonic freakouts, strummy classical guitar love songs, angelic vocal choirs, and almost-whispered vocals over harmoniums and bell kits.\n\nIn 2004, Elverum abandoned the \"Microphones\" name to begin recording as Mount Eerie", "desc_mb_album": "", "desc_mb_artist": "Regarding capitalization of name and titles, please see following:\nhttps://musicbrainz.org/edit/67109745\nhttps://musi ntains a wide array of political and non-political themes, such as mass incarceration, the CIA, the .", "desc_lfm_artist": "System of a Down is an Armenian-American heavy metal band formed in Glendale, California, in 1994. Since 1997, the lineup has consisted of Serj Tankian (lead vocals, keyboards), Daron Malakian (guitar, vocals), and Shavo Odadjian (bass, backing vocals), along with drummer John Dolmayan, who replaced original drummer Andy Khachaturian.\n\nThe band achieved commercial success with five studio albums, three of which debuted at number one on the US Billboard 200.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "verygooood"]}, {"n": 444, "title": "Jane Doe", "artist": "Converge", "year": 2001, "cover": "https://dn721607.ca.archive.org/0/items/mbid-c0c80905-b460-4385-b84d-b068eb14bf5a/mbid-c0c80905-b460-4385-b84d-b068eb14bf5a-7979568810.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4323-converge-jane-doe.php", "aoty_critic_score": 92, "aoty_user_score": 88, "mbid": "f56e3b38-c620-32f4-9845-2e2115f5e96f", "yt_id": "gU1bdx8nwZk", "rym": "https://rateyourmusic.com/release/album/converge/jane-doe/", "genres": ["hardcore punk", "metalcore", "mathcore"], "desc_lfm_album": "\"Jane Doe\" is the fourth full-length studio album by American Metalcore band Converge. The album is often considered Converge's masterpiece, and has been frequently described as one of the greatest metal/hardcore albums of all time by publications such as Rolling Stone, Decibel, and NPR Music. According to vocalist/lyricist Jacob Bannon, \"the album's lyrical themes were born out of a dissolving relationship and the emotional fallout from that experience\" In January 2007, Decibel magazine certified the album number 35 in the \"Decibel Hall of Fame\", and later named it the best album of the '00s. J. Bennett writes that \"Jane Doe .", "desc_lfm_artist": "Converge is an American band, formed in February of 1990 in Salem, Massachusetts, United States. Playing a blend of hardcore punk and extreme metal, this pioneer outfit helped define a lot of the rudiments of the fast-burgeoning metalcore and mathcore genres formed by vocalist Jacob Bannon and guitarist Kurt Ballou in Salem, Massachusetts in 1990. During the recording of their seminal fourth album Jane Doe, the group became a four-piece with the departure of guitarist Aaron Dalbec and the addition of bassist Nate Newton and drummer Ben Koller.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 445, "title": "Melody A.M.", "artist": "Röyksopp", "year": 2001, "cover": "https://dn710308.ca.archive.org/0/items/mbid-ac1afa8d-1a86-4435-9714-0a5e808e4c83/mbid-ac1afa8d-1a86-4435-9714-0a5e808e4c83-1284390639.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4575-royksopp-melody-am.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "95d72e72-55b2-3408-8d76-cce7abad3836", "yt_id": "bmatItacEvM", "rym": "https://rateyourmusic.com/release/album/royksopp/melody-a_m/", "genres": ["electronic"], "desc_lfm_album": "Melody A.M. is the debut album of Norwegian duo Röyksopp. Songs from this album have been used in television adverts and computer games, Remind Me is currently featured in an advertisement for GEICO Insurance in one of their popular 'Caveman' ads, Eple was licensed by Apple and used as the introduction music for the Mac OS X v10.3 Setup Assistant. A remix of Poor Leno was featured in the SSX 3 soundtrack. .", "desc_lfm_artist": "Röyksopp is a Norwegian electronic music duo formed in 1998 in Tromsø and currently based in Bergen. The band consists of Torbjørn Brundtland and Svein Berge, both being songwriters, producers and remixers. They usually rely on the use of other vocalists for their songs and occasionally they perform the vocal parts. The Norwegian word \"røyksopp\" means puffball fungus (literally \"smoke mushroom\"), but the band has stated in interviews that they are actually referring to the mushroom cloud created by atomic bombs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 446, "title": "Iowa", "artist": "Slipknot", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6446-iowa_172757.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6446-slipknot-iowa.php", "aoty_critic_score": 66, "aoty_user_score": 82, "mbid": "082c68eb-d993-36cf-9b32-6663cba2d052", "yt_id": "RHnQFbFSczI", "rym": "https://rateyourmusic.com/release/album/slipknot/iowa", "genres": [], "desc_lfm_album": "Iowa is the second album by American metal band Slipknot. Released by Roadrunner Records on August 28, 2001, it was produced by Ross Robinson and Slipknot. The title derives from the band's home state, Iowa, which members have stated is one of their biggest sources of inspiration. With much anticipation for the band's second album following on the success of their 1999 self-titled debut (Slipknot), pressures on the band were high. Their relationships with each other suffered and was later described as the darkest time of their career. It was also the first time that guitarist Jim Root had been .", "desc_lfm_artist": "Slipknot is an American heavy metal band formed in Des Moines, Iowa, in 1995 by percussionist Shawn \" Clown\" Crahan, vocalist/percussionist Anders Colsefni, and bassist Paul Gray. After several lineup changes in its early years, the band settled on a nine-member lineup for more than a decade, consisting of  Crahan, Gray, Joey Jordison, Craig \"133\" Jones, Mick Thomson, Corey Taylor, Sid Wilson, Chris Fehn, and Jim Root. Slipknot is known for its distinctive visual presentation, aggressive musical style, and intense live performances.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 447, "title": "Vespertine", "artist": "Björk", "year": 2001, "cover": "https://dn721303.ca.archive.org/0/items/mbid-441e153d-6ce6-3a75-aa4e-65f63b88d14f/mbid-441e153d-6ce6-3a75-aa4e-65f63b88d14f-3487982154.jpg", "aoty_url": "https://www.albumoftheyear.org/album/979-bjork-vespertine.php", "aoty_critic_score": 85, "aoty_user_score": 93, "mbid": "271faeb3-fdd1-3ebb-80aa-97b3116e9341", "yt_id": "UDK3qB4_Brc", "rym": "https://rateyourmusic.com/release/album/bjork/vespertine", "genres": ["chamber folk", "art pop", "idm", "ambient pop", "glitch pop", "folktronica"], "desc_lfm_album": "Vespertine is the fourth studio album by Icelandic recording artist Björk. It was released on 27 August 2001 in the United Kingdom by One Little Indian Records and in the United States by Elektra Entertainment. Production on the album began during the filming of Dancer in the Dark, which was characterized by conflict between her and director Lars von Trier. The sound of \"Vespertine\" reflected Björk's newly found interest in the music of artists such as Opiate and Console, who were also enlisted as producers. .", "desc_lfm_artist": "Björk Guðmundsdóttir (born 21 November 1965), known mononymously as Björk, is an Icelandic singer, songwriter, composer, record producer, and actress. Recognised for her distinctive voice, three-octave vocal range, and unconventional public image, she has developed an eclectic musical style over a career spanning five decades, incorporating elements of electronic, pop, dance, trip hop, jazz, and avant-garde music. She is widely regarded as an influential figure in electronic and experimental music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 448, "title": "Sonic Excess in its Purest Form", "artist": "Crowbar", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/ s Southern Gothic vision guided Sparklehorse. Drummer and multi-instrumentalist Scott Minor was a frequent collaborator.\n\nBefore his suicide in March 2010, Linkous", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 450, "title": "\"Bath\"", "artist": "maudlin of the Well", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22189-bath.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22189-maudlin-of-the-well-bath.php", "aoty_critic_score": 100, "aoty_user_score": 83, "mbid": "49f93bd1-ac78-3c52-8422-0002da31e0c3", "yt_id": "etD9Lh0u1DA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "maudlin of the Well is an American progressive rock band from Boston, Massachusetts who formed in 1996 and disbanded in 2003, revived in 2008. Their music contained elements from many different genres including death metal, doom metal, indie rock, and new age. They released three full-length albums before disbanding: 1999's My Fruit PsychoBells... A Seed Combustible and 2001's Bath and Leaving Your Body Map. These last two albums were considered companion albums.", "desc_mb_album": "", "desc_mb_artist": "Changed name to [http://musicbrainz.org/artist/3979eee5-c72a-4b0a-9191-a0243881250a.html|Kayo Dot] in 2003.\r\n\r\nOn July 27, 2008, in a [[http://www.myspace.com/maudlinofthewell/blog/418746210|post]] on the band's MySpace page , they stated that some fan donated enough money tho make another album. The album titled [[http://musicbrainz.org/release-group/369859c9-2fad-31ab-aa3e-2a0506e5653e|Part the Second]] was released on May 14, 2009.", "heard_by": ["Lonsonxd", "MaxtorUwU"]}, {"n": 451, "title": "Is This It", "artist": "The Strokes", "year": 2001, "cover": "https://dn710004.ca.archive.org/0/items/mbid-5fd728bf-f69a-4c45-b68a-4fb30898bb00/mbid-5fd728bf-f69a-4c45-b68a-4fb30898bb00-39829937702.jpg", "aoty_url": "https://www.albumoftheyear.org/album/576-the-strokes-is-this-it.php", "aoty_critic_score": 85, "aoty_user_score": 88, "mbid": "efea26d1-a016-30f6-b8e2-bc8c02336b0a", "yt_id": "0a5Wnuxe5x4", "rym": "https://rateyourmusic.com/release/album/the-strokes/is-this-it-9", "genres": ["alternative rock", "garage rock", "indie rock", "garage rock revival", "post-punk revival"], "desc_lfm_album": "Is This It is the debut album by the American alternative rock band The Strokes, released in 2001. The Strokes were the first band to break into the mainstream as part of the turn-of-the-millennium garage rock revival trend. Hyped by the music press for their melodic pop-influenced garage rock sound on both sides of the Atlantic, The Strokes' auspicious debut garnered them critical and popular attention. Moreover, Is This It's more famous songs \"The Modern Age\", \"Last Nite\", \"Hard to Explain\" and \"Someday\" won the band much respect and helped the album reach number two in the United Kingdom and .", "desc_lfm_artist": "The Strokes is an American indie rock band, known for their distinctive sound and cultural impact, particularly in the early 2000s.\n\nMembers\nJulian Casablancas (vocals), Nick Valensi (guitar), Albert Hammond Jr. (guitar), Nikolai Fraiture (bass), and Fabrizio Moretti (drums)\n\nFormation\nThe founding process of The Strokes was a serendipitous convergence of childhood connections and a shared musical vision. Julian Casablancas, Fabrizio Moretti, and Nick Valensi, childhood friends with varying musical experiences, came together in the late '90s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 452, "title": "Prowler in the Yard", "artist": "Pig Destroyer", "year": 2001, "cover": "https://i.discogs.com/JvdeyupVGe28wl0Hiw72HbJbLaK55C6w09qTMPRPhdA/rs:fit/g:sm/q:90/h:597/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YW
