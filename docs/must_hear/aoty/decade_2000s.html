sing, singing and guitar playing accompanied by Anthony Koutsos (also an ex-member of RHP) on drums, and Geoff Stanfield on bass. Tim Mooney also played drums with Sun Kil Moon until his death in June 2012. The band is named after Korean bantamweight boxer Sung-Kil Moon.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 328, "title": "Room on Fire", "artist": "The Strokes", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/room-on-fire-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/586-the-strokes-room-on-fire.php", "aoty_critic_score": 86, "aoty_user_score": 84, "mbid": "1e9db573-5671-301f-87fc-846a605fe35b", "yt_id": "kaYk6pQd-Fk", "rym": "https://rateyourmusic.com/release/album/the-strokes/room-on-fire", "genres": [], "desc_lfm_album": "Room on Fire is the second studio album by American indie rock band The Strokes. Released in October 2003, it follows 2001's Is This It and includes three singles: \"12:51\", \"Reptilia\", and \"The End Has No End.\" Grammy-winning producer Nigel Godrich was initially in charge of production, but The Strokes felt he made the songs seem \"soulless\". The band went back to work with Is This It producer Gordon Raphael. The album features a slightly smoother sound than its predecessor. The bass guitar is less present except for several moments when it becomes the focal point of the song. The .", "desc_lfm_artist": "The Strokes is an American indie rock band, known for their distinctive sound and cultural impact, particularly in the early 2000s.\n\nMembers\nJulian Casablancas (vocals), Nick Valensi (guitar), Albert Hammond Jr. (guitar), Nikolai Fraiture (bass), and Fabrizio Moretti (drums)\n\nFormation\nThe founding process of The Strokes was a serendipitous convergence of childhood connections and a shared musical vision. Julian Casablancas, Fabrizio Moretti, and Nick Valensi, childhood friends with varying musical experiences, came together in the late '90s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 329, "title": "Chutes Too Narrow", "artist": "The Shins", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/chutes-too-narrow.jpg", "aoty_url": "https://www.albumoftheyear.org/album/525-the-shins-chutes-too-narrow.php", "aoty_critic_score": 86, "aoty_user_score": 79, "mbid": "d4194792-dc49-3065-acae-22c809379262", "yt_id": "rIWAATJNWLM", "rym": "https://rateyourmusic.com/release/album/the-shins/chutes-too-narrow", "genres": [], "desc_lfm_album": "Chutes Too Narrow is The Shins' 2003 follow-up to their debut album, Oh, Inverted World. The album title comes from a lyric in the song \"Young Pilgrims.\" The album was generally well received by critics, garnering an overall score of 88/100 on Metacritic. According to Nielsen SoundScan, they have sold over 393,001 copies to date. Chutes Too Narrow features cleaner production standards than the \"lo-fi\" Oh, Inverted World. This is largely due to the album's being mixed by producer Phil Ek, who has also worked with Built to Spill and Modest Mouse. Chutes Too Narrow also departs from the band's .", "desc_lfm_artist": "The Shins is an American alternative rock band centered around James Mercer.\n\nThe band formed in 1997, in Albuquerque, New Mexico, United States as a side project of Mercer (previously of Blue Roof Dinner) and drummer Jesse Sandoval, who were both members of Flake Music. The band's original lineup was Mercer (vocals, guitar), Sandoval (drums), Marty Crandall (keyboards) and Dave Hernandez (bass). Neil Langford replaced Hernandez in 1998. Hernandez returned to the band in 2003, as Langford had left the band in 2001.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "sdecandelario"]}, {"n": 330, "title": "Who Will Cut Our Hair When We're Gone?", "artist": "The Unicorns", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/who-will-cut-our-hair-when-were-gone.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4045-the-unicorns-who-will-cut-our-hair-when-were-gone.php", "aoty_critic_score": 79, "aoty_user_score": 82, "mbid": "78825696-29f8-3b33-abcf-29f56bf1ae5d", "yt_id": "1cMdM24kiZ0", "rym": "https://rateyourmusic.com/release/album/the-unicorns/who-will-cut-our-hair-when-were-gone", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Montreal-based Unicorns was originally formed in December 2000 by Nick Thorburn (stage name Nick \"Neil\" Diamonds, as well as a host of other aliases) and Alden Penner (stage name, Alden Ginger; Elvis Presley's fiancée when he died was Ginger Alden). They were later joined by drummer Jamie Thompson (stage name J'aime Tambeur) and Max Groadie (\"the American Roadie, né Bill Horwood\").\n\nThe band self-released their debut album Unicorns Are People Too in March 2003 through their own record label Caterpillars of the Community", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 331, "title": "Choirs of the Eye", "artist": "Kayo Dot", "year": 2003, "cover": "https://dn710205.ca.archive.org/0/items/mbid-c4b9edef-429b-459c-bd62-7b79ed63fa21/mbid-c4b9edef-429b-459c-bd62-7b79ed63fa21-43394976609.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9995-kayo-dot-choirs-of-the-eye.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "06ae0024-2bef-36ff-ad38-a5d2604e0771", "yt_id": "l9zuKR3_quw", "rym": "https://rateyourmusic.com/release/album/kayo-dot/choirs-of-the-eye.p", "genres": ["experimental rock", "avant-garde", "post-metal", "black metal", "avant-garde metal"], "desc_lfm_album": "Choirs of the Eye is the debut studio album by Kayo Dot, released on Tzadik Records in 2003. Choirs of the Eye has lengthy, mostly instrumental, through-composed tracks that combine elements of experimental metal, post-rock, art rock, jazz, and modern composition. .", "desc_lfm_artist": "Kayo Dot is an avant-rock group originally from Boston, Massachusetts, United States (now based in Brooklyn, New York) that was formed in 2003 by Toby Driver after the disband of maudlin of the Well. They released their debut album Choirs of the Eye on John Zorn's Tzadik label that year.\n\nIts lineup is constantly changing, but has consisted of Toby Driver, Ron Varod, Mia Matsumiya, Keith Abrams, Tim Byrnes, David Bodie, Dan Means and Terran Olson.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "MaxtorUwU", "verygooood"]}, {"n": 332, "title": "Streetcore", "artist": "Joe Strummer & The Mescaleros", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10581-streetcore.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10581-joe-strummer-the-mescaleros-streetcore.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "56d7dcc5-2c78-3518-b8c2-b7964a758144", "yt_id": "J9jIroq_I9c", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Joe Strummer & The Mescaleros were an English band formed by Joe Strummer in 1999 that went on to make three albums prior to Strummer's untimely death in 2002. Many of the members of the Mescaleros were gifted multi-instrumentalists. The original line-up consisted of Strummer on vocals and guitar, Antony Genn on guitar, Scott Shields on bass, Martin Slattery on keyboards and guitar (as well as flute and saxophone on select songs), Pablo Cook on various percussion instruments, and Smiley (aka Steve Barnard) on drums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 333, "title": "Frank", "artist": "Amy Winehouse", "year": 2003, "cover": "https://dn721909.ca.archive.org/0/items/mbid-7db94d19-b548-44eb-bade-585fea2806ce/mbid-7db94d19-b548-44eb-bade-585fea2806ce-37030503493.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1489-amy-winehouse-frank.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "9a9d41e9-2080-3293-8676-9e26f44a05b1", "yt_id": "IZDwsy-a2F4", "rym": "https://rateyourmusic.com/release/album/amy-winehouse/frank", "genres": ["jazz", "hip hop", "funk / soul"], "desc_lfm_album": "Frank is the debut studio album by Amy Winehouse. It was released on October 20, 2003 by Island Records. Production for the album took place during 2002 to 2003 and was handled by Winehouse, Salaam Remi, Commissioner Gordon, Jimmy Hogarth and Matt Rowe. Its title alludes to the nature and tone of Winehouse's lyrics on the album, as well as one of her influences, Frank Sinatra. Upon its release, Frank received generally positive reviews from most music critics and earned Winehouse several accolades, including an Ivor Novello Award. The album has sold over one million copies in the United Kingdom .", "desc_lfm_artist": "Amy Jade Winehouse was an English singer and songwriter. She was known for her deep, expressive contralto vocals and her eclectic mix of musical genres, including soul, rhythm and blues, reggae and jazz.\n\nA member of the National Youth Jazz Orchestra during her youth, Winehouse signed to Simon Fuller's 19 Management in 2002 and soon recorded a number of songs before signing a publishing deal with EMI. She also formed a working relationship with producer Salaam Remi through these record publishers.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 334, "title": "Transatlanticism", "artist": "Death Cab for Cutie", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/transatlanticism-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1282-death-cab-for-cutie-transatlanticism.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "f48c46e8-8178-3e74-b60f-72b677ebcb96", "yt_id": "aUB-DDOgg0Q", "rym": "https://rateyourmusic.com/release/album/death-cab-for-cutie/transatlanticism", "genres": [], "desc_lfm_album": "Transatlanticism is the fourth studio album by American indie rock band Death Cab for Cutie, released October 7, 2003 on Barsuk Records. Prior to the album's release, Ben Gibbard stated: \"...unlike The Photo Album, I feel like this record is definitely more like a proper album. We’ve tried to construct it with transitions of songs going in and out of each other, and I think it's a little bit more expansive than the last record.\" The album peaked at number 97 on the Billboard 200 Album Chart. The album has been certified Gold in the U.S. It is available on .", "desc_lfm_artist": "Death Cab for Cutie is an American indie rock band formed in Bellingham, Washington in 1997. The band consists of Ben Gibbard (vocals, guitar, piano), Nicholas Harmer (bass), Jason McGerr (drums), Dave Depper (guitar) and Zac Rae (keyboards).\n\nDeath Cab began as a solo project of Ben Gibbard, now the band's vocalist and guitarist. Gibbard took the band name from the satirical song Death Cab for Cutie, performed by The Bonzo Dog Band in The Beatles' 1967 experimental film Magical Mystery Tour.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "paqueradejere"]}, {"n": 335, "title": "The Tenth Sub Level of Suicide", "artist": "Leviathan", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/107659-the-tenth-sub-level-of-suicide_143845.jpg", "aoty_url": "https://www.albumoftheyear.org/album/107659-leviathan-the-tenth-sub-level-of-suicide.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "c26c71b9-7c0b-3269-83fd-b8166c7f8318", "yt_id": "VvENeQoloew", "rym": "https://rateyourmusic.com/release/album/leviathan/the-tenth-sub-level-of-suicide", "genres": [], "desc_lfm_album": "The Tenth Sub Level of Suicide is the debut studio album by American black metal musical act Leviathan. It was recorded entirely on a Tascam four-track tape recorder using a Line 6 Pod in mainman Wrest's home, and was released in September 29, 2003 from Seattle, Washington-based underground record label, Moribund Cult. \"It's about different phases/levels of contemplation towards an action. The act of self-extermination\", says Wrest. \"All the lyrics, for the exception of 'track' two, are about suicide, in one form or another.\" .", "desc_lfm_artist": "There are multiple artists using this name.\n\n1. Leviathan is the black metal project of American artist Jef Whitehead, aka 'Wrest'. He began the project in 1998. Though he was originally based in San Francisco, California, he later moved and is now located in Portland, Oregon. Leviathan was put on hold in October 2007 due to a legal dispute with the record label. Wrest brought the project back in January 2008 to release Massive Conspiracy Against All Life.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["verygooood"]}, {"n": 336, "title": "Speakerboxxx/The Love Below", "artist": "OutKast", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/speakerboxxxthe-love-below-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/551-outkast-speakerboxxxthe-love-below.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": null, "yt_id": "RTg2IqSy8xY", "rym": null, "genres": [], "desc_lfm_album": "Speakerboxxx/The Love Below is the fifth studio album by American hip-hop duo OutKast, released September 23, 2003 on LaFace Records in the United States. Issued as a double album, its playtime of more than two hours is distributed over solo albums from each of the group's members. Speakerboxxx is the solo project of Big Boi, performing tracks that are rooted in Southern hip-hop, while The Love Below, the solo project of André 3000, covers musical styles such as soul, pop, funk, and jazz. Speakerboxxx/The Love Below received general acclaim from most music critics, earning praise for the consistency of Big .", "desc_lfm_artist": "OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 337, "title": "Thirteenth Step", "artist": "A Perfect Circle", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5079-thirteenth-step.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5079-a-perfect-circle-thirteenth-step.php", "aoty_critic_score": 73, "aoty_user_score": 80, "mbid": "03c95acb-e1a4-3d73-aa80-4243a0ca3f27", "yt_id": "52K46T5pCUk", "rym": null, "genres": [], "desc_lfm_album": "Thirteenth Step is the second studio album by the American rock band A Perfect Circle. The album was released as a compact disc on September 16, 2003. The album was a success, reaching the #2 position on the Billboard charts in its premiere week, selling over 231,000 copies. The RIAA certified it as gold on November 4, 2003 and as platinum on March 24, 2006. The first single from the album was \"Weak and Powerless\", followed by \"The Outsider\" and \"Blue\". The tracks have their remixed versions on a 2004 remix album aMotion. It has been speculated that the title .", "desc_lfm_artist": "A Perfect Circle is an American alternative rock band formed in Los Angeles, California in 1999 by guitarist Billy Howerdel and Tool vocalist Maynard James Keenan. A Perfect Circle has released four studio albums, the first three during the early 2000s: Mer de Noms, their debut album in 2000, and followed up by Thirteenth Step in 2003; then in 2004, Emotive—an album of radically re-worked cover songs. Shortly after Emotive's release, the band went on hiatus; Keenan returned to Tool and started up solo work under the band name Puscifer", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 338, "title": "Vaudeville Villain", "artist": "Viktor Vaughn", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7931-vaudeville-villain.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7931-viktor-vaughn-vaudeville-villain.php", "aoty_critic_score": 92, "aoty_user_score": 87, "mbid": "c9c53dc7-fe1a-35ba-84e3-bb66e8318ee9", "yt_id": "VgWBMa5v930", "rym": "https://rateyourmusic.com/release/album/viktor-vaughn/vaudeville-villain", "genres": [], "desc_lfm_album": "Vaudeville Villain is the third studio album by MF DOOM. Here he takes his supervillain persona and expands on the concept as his alter-ego Viktor Vaughn, going into topics varying from shifty drug deals to girl issues. Characteristic of his rapping style, he brings plenty of punchlines and clever wordplay to compliment his stream-of consciousness delivery style, making you hang on his every word. The production uses weird drum, jazz and electronic beats to complement his oddball style. .", "desc_lfm_artist": "Alter ego of rapper Daniel Dumile. Other alter egos include MF DOOM, Metal Fingers, DOOM and King Geedorah.\n\nThe name Viktor Vaughn comes from Victor Von Doom, the real name of Fantastic Four arch-enemy Dr. Doom. \n\nDoom stated, in the song 'Doom on Vik': \"Vik is more cutting edge, whatever the new stuff is or these new MC's are doing. But he still appreciates the old school art of rhyming. So there's still a level of sincerity to Viktors stuff, but it's still younger and newer", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 339, "title": "Absolution", "artist": "Muse", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/absolution-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1231-muse-absolution.php", "aoty_critic_score": 79, "aoty_user_score": 82, "mbid": "6f151223-f3a3-3e57-810f-598f7897006c", "yt_id": "vSNpacuOAGs", "rym": null, "genres": [], "desc_lfm_album": "\"Absolution\" is the third studio album by English alternative rock band Muse. It was released on September 21, 2003 in the UK and on March 23, 2004 in the U.S. by Taste Music Limited. The album yielded the band's first big American hits - \"Time Is Running Out\" and \"Hysteria\", the former becoming their first UK Top 10 single. Recently it was voted the 21st best British album ever. The band spent much of 2002 recording Absolution with producer Rich Costey. The album was recorded in studios in both Los Angeles and London. Bellamy said that the band made a .", "desc_lfm_artist": "Muse is an English rock band from Teignmouth, Devon, formed in 1994. The band consists of Matt Bellamy (lead vocals, guitar, keyboards), Chris Wolstenholme (bass guitar, backing vocals), and Dominic Howard (drums, percussion).\n\nMuse released their debut album, \"Showbiz,\" in 1999, which featured Bellamy's falsetto and a melancholic alternative rock style. Their second album, \"Origin of Symmetry\" (2001), incorporated wider instrumentation and classical influences and contributed to their reputation for energetic live performances.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 340, "title": "It Still Moves", "artist": "My Morning Jacket", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/it-still-moves-3.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1361-my-morning-jacket-it-still-moves.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "edc79edc-6c02-33c2-be16-d410ff2c5c5f", "yt_id": "2xbVokrLutc", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "My Morning Jacket is an American indie rock band formed in 1998 in Louisville, Kentucky, United States. The band consists of Jim James (vocals, guitar), Carl Broemel (guitar), \"Two Tone\" Tommy Blankenship (bass), Bo Koster (keyboards) and Patrick Hallahan (drums). The band is best known for their reverb-soaked sound and their enthusiastic live shows. My Morning Jacket is signed with ATO Records. The band's style is a blend of alternative, alt country, folk rock and psychedelic rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 341, "title": "Everything Goes Numb", "artist": "Streetlight Manifesto", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8360-everything-goes-numb.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8360-streetlight-manifesto-everything-goes-numb.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "24deab6d-9374-34df-b413-3a14eadad293", "yt_id": "bNq_SpKih2I", "rym": "https://rateyourmusic.com/release/album/streetlight-manifesto/everything-goes-numb", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Streetlight Manifesto is a post-third wave ska punk band from New Brunswick, New Jersey, under the creative leadership of singer/guitarist Tomas Kalnoky. Since forming in 2002, the band has released four full-length albums.\n\nSeveral of Streetlight's members were already well known among the New Jersey ska community for their roles in past ska bands from that area, most notably Catch 22's Tomas Kalnoky, James Egan, Mike Soprano, and Josh Ansley, as well as One Cool Guy's Stuart Karmatz, Pete Sibilia, Dan Ross, and Chris Paszik.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 342, "title": "Metaphorical Music", "artist": "Nujabes", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/24883-metaphorical-music_094254.jpg", "aoty_url": "https://www.albumoftheyear.org/album/24883-nujabes-metaphorical-music.php", "aoty_critic_score": 90, "aoty_user_score": 90, "mbid": "2e52bd6a-53e6-325c-925b-19eaa449db44", "yt_id": "7xZY8VJHqU4", "rym": "https://rateyourmusic.com/release/album/nujabes/metaphorical-music", "genres": [], "desc_lfm_album": "Metaphorical Music is Nujabes' first solo album. It offers a combination of hip hop and jazz, and features artists like Shing02 (known for \"Battlecry\" off the Samurai Champloo soundtrack), Substantial, Five Deez, and Cise Starr (of CYNE). Despite the fact that the album has contributing vocals from several artists, it is roughly classified as an instrumental hip hop album. Metaphorical Music received universal acclaim from fans of Nujabes and critics, with many claiming the album is a masterpiece and a groundbreaking and highly influential work in the hip hop genre. .", "desc_lfm_artist": "Jun Seba (瀬葉淳) (February 7, 1974 - February 26, 2010) was a Japanese hip-hop music producer who recorded under the name Nujabes (new-jah-behz; which is simply his real name spelled backwards). His music is known for a strong cool jazz influence, frequently using samples from artists like Miles Davis and Yusef Lateef.\n\nHe was also an owner of \"tribe\", a record store in Shibuya, Tokyo, and led indie record label Hyde-Out Productions. He released two albums in Japan, Metaphorical Music in 2003 and Modal Soul in 2005.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "verygooood"]}, {"n": 343, "title": "Quebec", "artist": "Ween", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/quebec-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1566-ween-quebec.php", "aoty_critic_score": 67, "aoty_user_score": 86, "mbid": "d51d3947-55f5-3672-8d30-23755dda3cdf", "yt_id": "hkX2QATlgbo", "rym": "https://rateyourmusic.com/release/album/ween/quebec", "genres": [], "desc_lfm_album": "Quebec is the eighth album by American alternative rock band Ween, released on August 5, 2003 on Sanctuary Records. It was the first album released after the band's contract with Elektra expired, and marked its return to independent labels. The album on a whole is comparable to Chocolate and Cheese or their first album GodWeenSatan: The Oneness in that not one single mood or theme can describe it, unlike their \"country record\" 12 Golden Country Greats, their \"nautically-themed\" The Mollusk, their Beatle-esque \"pop\" album White Pepper, the dark and murky The Pod and the cheerful and druggy Pure Guava .", "desc_lfm_artist": "Ween is an American rock band from New Hope, Pennsylvania, formed in 1984 by Aaron Freeman and Mickey Melchiondo, who perform under the stage names Gene Ween and Dean Ween. The band is commonly categorized as alternative rock and is noted for a highly eclectic musical style drawing on influences including funk, psychedelia, soul, country, gospel, progressive rock, R&B, heavy metal, and punk rock.\n\nFrom their formation through 1989, Ween self-released several cassette-only recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 344, "title": "Boy in da Corner", "artist": "Dizzee Rascal", "year": 2003, "cover": "https://dn710605.ca.archive.org/0/items/mbid-ba41a7ba-1033-4e5f-bdf8-1a55551d0802/mbid-ba41a7ba-1033-4e5f-bdf8-1a55551d0802-1491885865.jpg", "aoty_url": "https://www.albumoftheyear.org/album/504-dizzee-rascal-boy-in-da-corner.php", "aoty_critic_score": 89, "aoty_user_score": 80, "mbid": "01ac6115-0ea4-346d-b022-5bcde31c6264", "yt_id": "UlAvh1GpVKw", "rym": "https://rateyourmusic.com/release/album/dizzee-rascal/boy-in-da-corner/", "genres": ["hip hop", "grime"], "desc_lfm_album": "The electrifying debut album of rapper/producer Dizzee Rascal, released 21 July 2003. One of the most critically acclaimed albums of 2003, Boy in da Corner has since been credited as instrumental in the development of Grime - as well as being one of the first albums in the genre to enjoy international commercial success. The record's departure from the sensibilities of slower-tempo UK Garage (popular in sound system culture at the time) culminated in an all-round more aggressive, raw and gritty sound. The production on the record is hard and unapologetic in nature, characterised by sparse electronic beats and flourishes .", "desc_lfm_artist": "Dylan Mills, known professionally as Dizzee Rascal (born September 18th, 1984), is a grime solo artist, formerly a Roll Deep crew member, who emerged from the UK Garage music scene. His music was a blend of garage MCing, conventional rap, grime and ragga, with some more eclectic samples.\n\nDizzee began MCing on pirate radio and at raves at fifteen, but since his mainstream success he has distanced himself from the fledgling scene. Rascal grew up in the East End of London in south Bow in a council estate", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "alberto_gu", "armandwave"]}, {"n": 345, "title": "Phantom Power", "artist": "Super Furry Animals", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1362-phantom-power_190731.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1362-super-furry-animals-phantom-power.php", "aoty_critic_score": 81, "aoty_user_score": 78, "mbid": "b3d9a0cc-1637-30f9-995a-0832e83eca62", "yt_id": "muG2kKpPZ7I", "rym": "https://rateyourmusic.com/release/album/super-furry-animals/phantom-power", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Super Furry Animals is a Welsh rock band formed in Cardiff in 1993. The group’s long-term lineup consists of Gruff Rhys (lead vocals, guitar), Huw Bunford (lead guitar, vocals), Guto Pryce (bass guitar), Cian Ciaran (keyboards, synthesizers, electronics, occasional guitar, vocals), and Dafydd Ieuan (drums, vocals). An earlier version of the band featured actor Rhys Ifans as lead vocalist.\n\nThe band emerged as part of a wave of Welsh music in the 1990s", "desc_mb_album": "", "desc_mb_artist": "SFA Album Art by Pete Fowler: http://www.monsterism.net\r\nPrevious Label: http://www.creation-records.com/\r\nRadio 2 Documentary About Previous Label: http://www.poptones.co.uk/news/2004/06/15/creation.htm\r\nBand-Owned Label: http://www.placidcasual.com/\r\n\r\nFree Downloads:\r\n\r\nThe hidden track from Guerilla, The Citizens' Band - http://www.superfurry.com/1999guerilla.asp\r\nThe single from Mwng, Ysbeidiau Heulog - http://www.mwng.co.uk/mp3.htm\r\nThe Slow Life EP - http://www.placidcasual.com/slowlife/slowlifeeng.htm", "heard_by": ["MaxtorUwU", "sdecandelario"]}, {"n": 346, "title": "Silent Hill 3 (Original Soundtracks)", "artist": "山岡晃 [Akira Yamaoka]", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/85995-silent-hill-3-ost-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/85995--akira-yamaoka-silent-hill-3-original-soundtracks.php", "aoty_critic_score": 89, "aoty_user_score": null, "mbid": null, "yt_id": "h9iTHmXfEmQ", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo"]}, {"n": 347, "title": "Michigan", "artist": "Sufjan Stevens", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/greetings-from-michigan-the-great-lakes-state-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/997-sufjan-stevens-michigan.php", "aoty_critic_score": 87, "aoty_user_score": 84, "mbid": "704a628d-949d-3799-b56c-6eb171901d81", "yt_id": "UsZTQjsqiXI", "rym": "https://rateyourmusic.com/release/album/sufjan-stevens/michigan", "genres": [], "desc_lfm_album": "Sufjan Stevens, Asthmatic Kitty, and Soundsfamilyre announce Sufjan’s third full-length album, a collection of songs for his birth-state, Michigan, “The Great Lake State.” Composed as a geographical tone poem, Michigan follows a metaphysical expedition through the idiosyncrasies of middle America. Drawing from personal anecdote, regional history, and state heritage, Stevens mixes social and political grievances with songs about snowmobiles, Henry Ford, the Detroit race riots, and love. The songs on Michigan resonate with a range of sources-Vince Guaraldi, Terry Riley, and Nick Drake as accompanied by Stereolab and The Sea & Cake-in executing Stevens’ peculiar palette that is simultaneously rock .", "desc_lfm_artist": "Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 348, "title": "De‐Loused in the Comatorium", "artist": "The Mars Volta", "year": 2003, "cover": "https://dn710301.ca.archive.org/0/items/mbid-78d49ab6-02fc-4542-8b3d-abdcb8838cb0/mbid-78d49ab6-02fc-4542-8b3d-abdcb8838cb0-18721181872.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1244-the-mars-volta-de-loused-in-the-comatorium.php", "aoty_critic_score": 77, "aoty_user_score": 85, "mbid": "605124dd-0f2a-382b-a8ba-720658c1fe45", "yt_id": "8l7Ix-LfSBA", "rym": null, "genres": ["experimental rock", "alternative rock", "progressive rock", "post-hardcore", "alternative punk", "melodic metalcore"], "desc_lfm_album": "", "desc_lfm_artist": "The Mars Volta is an American progressive rock band from El Paso, Texas, formed in 2001. The band's only constant members are Omar Rodríguez-López (guitar, producer, direction) and Cedric Bixler-Zavala (vocals, lyrics), whose partnership forms the core of the band. The band's current line-up also includes founding member Eva Gardner (bass), Omar's brother Marcel Rodríguez-López (keyboards, synths, percussion), Linda-Philomène Tsoungui (drums) and Leo Genovese (keyboards, saxophone).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 349, "title": "Shades Of Blue: Madlib Invades Blue Note", "artist": "Madlib", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/16876-shades-of-blue.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16876-madlib-shades-of-blue.php", "aoty_critic_score": 82, "aoty_user_score": 83, "mbid": "ce569c5b-b67b-3e0c-b4c0-04d916d13891", "yt_id": "PXzJPgAxxMQ", "rym": null, "genres": [], "desc_lfm_album": "The idea for Shades of Blue: Madlib invades Blue Note was generated by the esteemed jazz imprint and Stones Throw Records head, Peanut Butter Wolf, both of whom were inspired by Madlib's YNQ project. Shades of Blue isn't just a Blue Note cover album, it's a re-imagination of the Blue Note culture. Madlib draws from the label's music catalog, of course, but also its influence through the years, its history as a prestigious jazz house, the iconography associated with the label and its import on its own. Madlib covers some of his favorite songs from the Blue Note collection, which .", "desc_lfm_artist": "Otis Jackson Jr. (born October 24, 1973), known professionally as Madlib, is an American DJ, music producer, multi-instrumentalist, and rapper. One of the most prolific and critically acclaimed hip-hop producers of the 2000s, he is widely known for his collaborations with MF DOOM  (as Madvillain), J Dilla (as Jaylib), and Freddie Gibbs  (as MadGibbs). Madlib has described himself as a \"DJ first, producer second, and MC last.\"\n\nMadlib was born in Oxnard, California to musician parents Otis Jackson, Sr.", "desc_mb_album": "", "desc_mb_artist": "below, under \"also performs as\" you'll only find solo personas. For a full list of Madlib’s projects (including pseudo-groups and actual collaborations with other people) I created [https://musicbrainz.org/collection/cce77b91-61e8-44fb-8047-56d3390393c8|this collection] so you don't have to click through all relationships.", "heard_by": ["MaxtorUwU", "alberto_gu", "armandwave", "verygooood"]}, {"n": 350, "title": "Happy Songs for Happy People", "artist": "Mogwai", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/happy-songs-for-happy-people-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1947-mogwai-happy-songs-for-happy-people.php", "aoty_critic_score": 81, "aoty_user_score": 80, "mbid": "8a26df58-c36a-3c4b-a507-2a526f57cbd2", "yt_id": "sokJspsDsC8", "rym": "https://rateyourmusic.com/release/album/mogwai/happy-songs-for-happy-people", "genres": [], "desc_lfm_album": "Happy Songs for Happy People is the fourth full-length studio album by Mogwai. It represents a further evolution of Mogwai's toned down, more electronic sound: all songs are based on electric guitars and live drums, but synthesizers are used frequently and often take the main stage on this album, with strings and piano also making the occasional appearance. The songs on the album are subdued, with the only exceptions being the towering \"Ratts of the Capital,\" and the closer \"Stop Coming to My House\". Mogwai's usual vocalist Stuart Braithwaite does not sing on this album at all. Barry Burns (\"Hunted .", "desc_lfm_artist": "Mogwai is a Scottish post-rock/instrumental band from Glasgow formed in 1995. \nThey compose lengthy, mostly instrumental guitar-based pieces in the style of post-rock, usually focused around the elaboration of a single theme, and are known traditionally for their quiet/loud dynamic, defined bass riffs, and an eminent ambient sound, sometimes dark and sometimes grand. Although frequently referred to as post-rock, the band have revealed in interviews that they despise this categorization", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 351, "title": "Deja Entendu", "artist": "Brand New", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/deja-entendu-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5123-brand-new-deja-entendu.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "6917ec0c-3d53-3835-bd9d-d079d70c1ce0", "yt_id": "xW6oPmwQf_8", "rym": null, "genres": [], "desc_lfm_album": "Deja Entendu is the second studio album by American rock band Brand New, released on June 17, 2003 through Triple Crown Records and Razor & Tie. It was widely praised for showing the band's maturation from their debut Your Favorite Weapon. The album's title is French for \"already heard\". Two singles and videos were released from the album: \"The Quiet Things That No One Ever Knows\" and \"Sic Transit Gloria...Glory Fades\". .", "desc_lfm_artist": "There are two artists with this name\n1. A popular rock band\n2. A funk group\n\n1. Brand New is an American rock band that formed in 2000 in Merrick, New York. The band consists of Jesse Lacey (lead vocalist/guitarist/lyricist), Vincent Accardi (guitarist/lyricist),Garrett Tierney (bassist), Brian Lane (drummer), and Derrick Sherman (guitarist/keyboardist).\n\nFormation (2000-2001)\n\nPrior to Brand New's official formation, in the late 1990s Jesse Lacey", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario"]}, {"n": 352, "title": "Take Me to Your Leader", "artist": "King Geedorah", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7935-take-me-to-your-leader-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7935-king-geedorah-take-me-to-your-leader.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "a22e4ba1-a880-35ab-9228-ec93acb0c038", "yt_id": "6u-JL-nNgJo", "rym": "https://rateyourmusic.com/release/album/king-geedorah/take-me-to-your-leader", "genres": [], "desc_lfm_album": "Take Me to Your Leader is the second studio album by British-American rapper MF DOOM, released under the alias King Geedorah via Big Dada on June 17, 2003. King Geedorah is the alias DOOM used as part of the underground super group Monsta Island Czars. The album features guest appearances from MF Grimm (as Jet Jaguar) as well as other MIC members. The character is based on the three-headed King Ghidorah, a fictional monster who appears as Godzilla's enemy in the Godzilla films. Mark Martelli of Pitchfork wrote that Take Me to Your Leader \"will excite you in a way .", "desc_lfm_artist": "King Geedorah was an MF DOOM side project. A concept album drawing on samples from sources as obvious as Godzilla movies (specifically \"Kaijū Daisensō,\" titled \"Invasion of Astro-Monster\" for English release) to those as obscure as the closing theme from the original  Gatchaman  anime. Other notable samples include one from Just-Ice's song \"This Girl Is A Slut\" which appears in the song \"The Fine Print\" and the original Dark Shadows theme song (which appears in two tracks)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 353, "title": "Life Is Killing Me", "artist": "Type O Negative", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/28683-life-is-killing-me.jpg", "aoty_url": "https://www.albumoftheyear.org/album/28683-type-o-negative-life-is-killing-me.php", "aoty_critic_score": 60, "aoty_user_score": 80, "mbid": "7f393d4b-bdbc-3b98-96cc-d52addd866d9", "yt_id": "949Kl2yXWhU", "rym": "https://rateyourmusic.com/release/album/type-o-negative/life-is-killing-me", "genres": [], "desc_lfm_album": "Life Is Killing Me is the sixth studio album by gothic metal band Type O Negative. It was released on June 17, 2003, and was their final studio album released through record label Roadrunner Records. The album's title and content refers primarily to frontman Peter Steele's dissatisfied life outlook and experiences with mental illness at the time of writing and production, with lyrics concerning relationship problems and the illness and death of his parents. The album reached No. 39 on the US Billboard 200 chart, selling 27,000 copies in its first week, and received positive reviews from music critics, who .", "desc_lfm_artist": "Type O Negative was a gothic metal / doom metal band formed in Brooklyn, New York, US in 1990. They are well known for their dry, morbid and ironic sense of humor and their often slow and brooding music. \"The Drab Four\" (the nickname Type O Negative gave themselves) always succeeded in keeping their own unique style, mixing melodic, classic rock 'n' roll with slow, doom-like vibes, and down-tuned heavy metal guitar riffs with dark soundscapes. They were also known for doom metal riffs", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Rocky_stereo", "sdecandelario"]}, {"n": 354, "title": "Velocity Design Comfort", "artist": "Sweet Trip", "year": 2003, "cover": "https://i.discogs.com/27BrxX8y8kjwBx-Tc3JY104L5PpSJskb_VrqZbm5Ngs/rs:fit/g:sm/q:90/h:590/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTIxMzE1/ODIwLTE2MzkyNjE0/NTAtNjI0NC5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/32588-sweet-trip-velocity-design-comfort.php", "aoty_critic_score": 85, "aoty_user_score": 88, "mbid": "a2262a54-b93a-3711-a868-32939624fef5", "yt_id": "fZlNt05dCX8", "rym": null, "genres": ["leftfield", "shoegaze", "idm", "glitch", "rock", "pop"], "desc_lfm_album": "", "desc_lfm_artist": "Sweet Trip was an American glitch pop and experimental rock band from San Francisco, California. The band consisted of Roberto Burgos and Valerie Cooper. Roberto met former band member Viet Le at a high school talent show sign up and the two went on to form the band in 1993. Past members include Valerie Cooper (guitar and vocals, 1993-2022), Viet Le (drums and bass, 1993-2000), Aaron Porter (bass, 1998-2009), and Rob Uytingco (drums, 2000-03). The band is known well for their fusion of shoegaze, idm, electronica, ambient and indie pop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 355, "title": "Translating the Name", "artist": "Saosin", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/88588-translating-the-name.jpg", "aoty_url": "https://www.albumoftheyear.org/album/88588-saosin-translating-the-name.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "ee4b2905-97c9-3b52-8b67-3cc9accf091e", "yt_id": "NJSoFbkZ0_U", "rym": null, "genres": [], "desc_lfm_album": "Translating the Name is the debut EP by American rock band Saosin, released on June 17, 2003 through Death Do Us Part. The album was released before Anthony Green departed the band to form the rock band Circa Survive (though Green would later return on Saosin's 2016 album, Along the Shadow). It is also the band's only release to feature bass guitarist Zack Kennedy, as well as the only release to not feature drummer Alex Rodriguez. Guitarist Beau Burchell stated that Rodriguez intended to track the drums for Translating the Name but had a prior commitment with his former band .", "desc_lfm_artist": "Saosin is a post-hardcore band from Newport Beach, California, USA who originally formed during 2003 and partly consists of former members of the band Open Hand.\n\nThey have released three EPs--  Translating the Name (2003),  Saosin EP (2005; also known as the \"Warped Tour EP\" / \"Black EP\", distributed on the The Vans Warped Tour), and  The Grey EP--  and three studio albums-- Saosin (2006),  In Search of Solid Ground (2009). and  Along the Shadow (2016).", "desc_mb_album": "", "desc_mb_artist": "== Songs typically tagged wrong as Saosin songs ==\r\n- '''I've Been Dying to Reach You''' by [http://musicbrainz.org/artist/eba4c290-2ce6-42c9-affd-5b1ffab84a8f.html|Anthony Green]\r\n- '''Plays Pretty for Baby''' by [http://musicbrainz.org/artist/21f1b21f-b286-4a45-8944-694b82f08b5a.html|Zolof the Rock and Roll Destroyer]\r\n- '''Plays Ugly for Daddy''' by [http://musicbrainz.org/show/artist/?artistid=187002|High and Driving]\r\n- '''Show me yo' Bootyhole''' by B2C\r\n\r\nBefore adding non-album tracks, check the [http://www.saosin.forumsunlimited.com/index.php?showtopic=10627|Saosin Fan Board Discography]. Thanks.", "heard_by": []}, {"n": 356, "title": "Hail to the Thief", "artist": "Radiohead", "year": 2003, "cover": "https://dn710705.ca.archive.org/0/items/mbid-6c7b17d1-a5bc-3ca9-902e-dc1a58fe16d8/mbid-6c7b17d1-a5bc-3ca9-902e-dc1a58fe16d8-24700269230.jpg", "aoty_url": "https://www.albumoftheyear.org/album/367-radiohead-hail-to-the-thief.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "5c14fd50-a2f1-3672-9537-b0dad91bea2f", "yt_id": "2w6kHS_IRrE", "rym": "https://rateyourmusic.com/release/album/radiohead/hail-to-the-thief", "genres": ["rock", "electronic"], "desc_lfm_album": "Hail to the Thief (subtitled The Gloaming, written as Hail to the Thief, (or, The Gloaming.) in the album booklet) is the sixth studio album by English rock band Radiohead, released on 9 June 2003 in the United Kingdom and 10 June 2003, in the United States. It debuted at number one in the UK and at number three in the United States. After two Radiohead albums that featured heavily processed vocals, less guitar, and strong influence from experimental electronica and jazz, Hail to the Thief was seen as a return to alternative rock, drawing its sound from every era .", "desc_lfm_artist": "Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock.", "desc_mb_album": "", "desc_mb_artist": "Formed in Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "armandwave", "verygooood"]}, {"n": 357, "title": "あくまのうた [Akuma no uta]", "artist": "Boris", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/akuma-no-uta-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/881-boris--akuma-no-uta.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": null, "yt_id": "muUYo9qfPSA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 358, "title": "The Decline of British Sea Power", "artist": "Sea Power", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-decline-of-british-sea-power-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/552-sea-power-the-decline-of-british-sea-power.php", "aoty_critic_score": 83, "aoty_user_score": 76, "mbid": "cc24d8c1-c004-3aac-8866-2952847992dd", "yt_id": "L5iI0zBvvPM", "rym": null, "genres": [], "desc_lfm_album": "The Decline of British Sea Power is the debut studio album by British rock band Sea Power, formerly known as British Sea Power. The album has a blend of indie, post-punk and post-rock. .", "desc_lfm_artist": "Sea Power, formerly known as British Sea Power, are an indie rock band from the UK. They released their first album, \"The Decline of British Sea Power,\" in 2003. Their latest album, \"Everything Was Forever,\" the first under the Sea Power moniker, will be released in February 2022.\n\nIn 2020, they won a BAFTA for their soundtrack to the computer game Disco Elysium.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid"]}, {"n": 359, "title": "Rounds", "artist": "Four Tet", "year": 2003, "cover": "https://dn710304.ca.archive.org/0/items/mbid-b7ddf571-7339-4689-bb94-032cf8da2e3b/mbid-b7ddf571-7339-4689-bb94-032cf8da2e3b-3334620181.jpg", "aoty_url": "https://www.albumoftheyear.org/album/943-four-tet-rounds.php", "aoty_critic_score": 88, "aoty_user_score": 82, "mbid": "cf688036-4ffa-36f5-ab81-9c7efecf63cd", "yt_id": "CWTAOwgTbu4", "rym": "https://rateyourmusic.com/release/album/four-tet/rounds", "genres": ["leftfield", "trip hop", "idm", "folktronica"], "desc_lfm_album": "Rounds is the third album by Four Tet. It was released on 5 May 2003 in the United Kingdom; the United States release came the next day. Two singles were released from the album - \"She Moves She\" which featured a sample from The Neptune Collection by The Entourage Music And Theater Ensemble and \"As Serious as Your Life\"), as well as one EP, My Angel Rocks Back and Forth. The latter features remixes of the title track by Isambard Khroustaliov and electronica duo Icarus, two new Four Tet tracks, and a DVD of all of Four Tet's music videos .", "desc_lfm_artist": "Four Tet is the name used by Kieran Hebden (born 1977 in Putney, London, UK) for his experimental  electronic music-oriented solo efforts, to differentiate from his work with post-rock band Fridge.\n\nHebden's solo work typically utilises samples lifted from various sources including hip-hop, electronica, techno, jazz, and folk mixed with his own guitar playing. Four Tet shares some stylistic similarities with other musicians, such as Prefuse 73, who use computer editing techniques that give the music a staccato, cut-up feel.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 360, "title": "Dopesmoker", "artist": "Sleep", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/17581-dopesmoker.jpg", "aoty_url": "https://www.albumoftheyear.org/album/17581-sleep-dopesmoker.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "481b2458-b722-47af-88fd-80e9496afe28", "yt_id": "Br3-VcGi4a8", "rym": "https://rateyourmusic.com/release/album/sleep/dopesmoker-11/", "genres": [], "desc_lfm_album": "Dopesmoker is an album by the stoner/doom metal band Sleep. Consisting of a single song an hour and three minutes long, it was originally recorded in 1996, but due to legal issues the album was trimmed down about ten mintutes. It was then released in 1999 as Jerusalem after being separated into six separate tracks. The full 63:31 track was not released until 2003, along with a live version of the song \"Sonic Titan.\" In 2012, record label Southern Lord remastered and re-released the album with new artwork, as well as adding a live version of the song \"Holy Mountain\" .", "desc_lfm_artist": "There are several artists titled Sleep;\n\n1) Sleep is an American doom metal power trio from San Jose, California. The band earned critical and record label attention early in its career. Critic Eduardo Rivadavia describes them as \"perhaps the ultimate stoner rock band\" and notes they exerted a strong influence on heavy metal in the 1990s. However, conflict with its record company contributed to Sleep's breakup by the end of the decade. The band reformed in 2009 and has played sporadic live dates internationally since.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "sdecandelario"]}, {"n": 361, "title": "Damnation", "artist": "Opeth", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29837-damnation.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29837-opeth-damnation.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "2864ec02-5e6a-36d8-9960-ccd959b9a618", "yt_id": "W9ukH21ut-I", "rym": "https://rateyourmusic.com/release/album/opeth/damnation", "genres": [], "desc_lfm_album": "Damnation is Opeth's seventh full-length studio album, released in April 22, 2003, following the band's previous album Deliverance the year before. The album was a radical departure from their typical death metal sound and into the much softer, 1970s progressive rock genre. The album was critically acclaimed and boosted their popularity, leading to the release of Lamentations on DVD in 2004. It was Opeth's first album to reach the Billboard Top 200, with a peak at #192. It also charted #14 on the Top Independent Albums chart. Windowpane was the album's single and has a music video for it, which .", "desc_lfm_artist": "Opeth is a Swedish progressive metal band from Stockholm, formed in 1990. The band incorporates elements of folk, blues, classical, and jazz into its compositions, alongside influences from death metal, particularly in their early works. Their music often includes acoustic guitar passages, Mellotron use, death growls, and dynamic shifts.\n\nOpeth has experienced several lineup changes, with every original member eventually replaced. Mikael Åkerfeldt", "desc_mb_album": "", "desc_mb_artist": "The band logo was created by [https://musicbrainz.org/artist/0bf74085-4006-4a1e-b0c9-a3a3b504e7a2|Timo Ketola].", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 362, "title": "Dead Cities, Red Seas & Lost Ghosts", "artist": "M83", "year": 2003, "cover": "https://dn721404.ca.archive.org/0/items/mbid-acf5c10a-1705-41aa-b6f7-d3143d53ca07/mbid-acf5c10a-1705-41aa-b6f7-d3143d53ca07-1485500706.jpg", "aoty_url": "https://www.albumoftheyear.org/album/519-m83-dead-cities-red-seas-lost-ghosts.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "528afc2e-39d4-3e78-bb88-40aeb08bd122", "yt_id": "maePAGN5NFA", "rym": "https://rateyourmusic.com/release/album/m83/dead-cities-red-seas-and-lost-ghosts", "genres": ["leftfield", "shoegaze"], "desc_lfm_album": "Dead Cities, Red Seas & Lost Ghosts is the second studio album by the French electronic group M83. The album was first released in Europe on 14 April 2003, then in North America on 27 July 2004. The cover art is the photograph Snow Angels by Justine Kurland. This album was founding member Nicolas Fromageau's last album with the band. .", "desc_lfm_artist": "M83 is a French-American electronic music project formed in Antibes, Alpes-Maritimes in 2001 and currently based in Los Angeles, United States. The band's primary member is vocalist, songwriter, multi-instrumentalist and record producer Anthony Gonzalez. The band was initially formed as a duo also with Nicolas Fromageau; it has released eight albums and three soundtracks, including the Grammy Award-nominated Hurry Up, We're Dreaming.\n\nGonzalez and Fromageau parted ways shortly after touring their second album Dead Cities", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "paqueradejere", "verygooood"]}, {"n": 363, "title": "そよ風アパートメント201 [Soyokaze Apartment Room 201]", "artist": "Lamp", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/369540-soyokaze-apartment-room-201.jpg", "aoty_url": "https://www.albumoftheyear.org/album/369540-lamp-201-soyokaze-apartment-room-201.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": null, "yt_id": "1w5pQHsRYvk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There is more than one artist with the name Lamp.\n\n1. Lamp  (ランプ)  are a Japanese band formed in 2000. There are three members:\n\nTaiyo Someya (染谷大陽; born 13 November 1979) - guitar, synthesizer, vibraphone\nYusuke Nagai (永井祐介; born 22 July 1980) – vocals, guitar, bass, keyboard\nKaori Sakakibara  (榊原香保里; born 17 November 1979) – vocals, flute, accordion\n\nFormation\nSomeya started playing guitar in middle school. In the folk club during high school", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 364, "title": "Elephant", "artist": "The White Stripes", "year": 2003, "cover": "https://ia600204.us.archive.org/29/items/mbid-9bf86596-1ef0-4bd4-8f5e-bb205a77b075/mbid-9bf86596-1ef0-4bd4-8f5e-bb205a77b075-4817243161.jpg", "aoty_url": "https://www.albumoftheyear.org/album/532-the-white-stripes-elephant.php", "aoty_critic_score": 81, "aoty_user_score": 82, "mbid": "d85b9684-4277-3565-b89b-115c8b4b7fd3", "yt_id": "D_QLxj8jCF0", "rym": "https://rateyourmusic.com/release/album/the-white-stripes/elephant", "genres": ["blues rock", "alternative rock", "garage rock", "indie rock", "punk blues", "garage rock revival"], "desc_lfm_album": "\"Elephant\" is the fourth album by the American alternative rock band The White Stripes. Released on April 1, 2003 on V2 Records, the album marks the band's major label debut. Despite this change, Heather Phares of Allmusic believed the album \"sounds even more pissed-off, paranoid, and stunning than its predecessor…Darker and more difficult than White Blood Cells.\" The record garnered much critical acclaim upon its release, and went on to win a Grammy for Best Alternative Music Album in 2004. Elephant\" is a strong, deep album showcasing Jack White at the top of his game. He rocks every guitar style .", "desc_lfm_artist": "The White Stripes were an American rock duo formed in Detroit, Michigan, in 1997. The group consisted of Jack White (guitar, keyboards, piano, vocals) and Meg White (drums, percussion, vocals). They were a leading group of 2000s indie rock and the decade's garage rock revival.\n\nBeginning in the late 1990s, the White Stripes sought success within the Detroit music scene, releasing six singles and two albums. They first found commercial success with their acclaimed third album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 365, "title": "Meteora", "artist": "Linkin Park", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2044-meteora_222003.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2044-linkin-park-meteora.php", "aoty_critic_score": 67, "aoty_user_score": 84, "mbid": "09474d62-17dd-3a4f-98fb-04c65f38a479", "yt_id": "yfoUZl7Y8TU", "rym": "https://rateyourmusic.com/release/album/linkin-park/meteora", "genres": [], "desc_lfm_album": "Meteora is the second studio album by American rock band Linkin Park, released on March 25th, 2003. Following the collaboration album Reanimation which featured remixes of their debut album Hybrid Theory. Linkin Park released singles from Meteora for over a year, including \"Somewhere I Belong\", \"Faint\", \"Lying from You\", \"From the Inside\", \"Breaking the Habit\" and \"Numb\". It is the most successful album in the history of the Modern Rock Tracks chart, a chart that specializes in radio play of alternative rock songs. \"Numb\" was the biggest song of the year on the chart. The album has sold over 5 .", "desc_lfm_artist": "Linkin Park is an American alternative rock band from Agoura Hills, California. The band's current lineup comprises of vocalist/rhythm guitarist/keyboardist Mike Shinoda, lead guitarist Brad Delson, bassist Dave Farrell, DJ/turntablist Joe Hahn, drummer Colin Brittain, and lead vocalist Emily Armstrong. Shinoda, Delson, Farrell and Hahn are founding members. Vocalists Mark Wakefield, Chester Bennington & drummer Rob Bourdon are former members of the band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 366, "title": "Radio Amor", "artist": "Tim Hecker", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/radio-amor.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2336-tim-hecker-radio-amor.php", "aoty_critic_score": 81, "aoty_user_score": 85, "mbid": "9ae653f8-e791-3480-b442-08d7f6deacfe", "yt_id": "FfetTQDrEzA", "rym": "https://rateyourmusic.com/release/album/tim-hecker/radio-amor", "genres": [], "desc_lfm_album": "It was January, 1996 on the Caribbean coast of Honduras. The musician in question was looking to catch a ride with a local vessel to the neighboring islands. There was one shrimping vessel in port that day, and its captain Jimmy willing to take disheveled hippies on board. He spoke some fragmented English, the boat set sail that evening. This album is dedicated to the idea of Jimmy the high-wire shrimper. Misplaced nautical charts, trade winds, shortwave miscommunication, midnight whispers, amorxxx. Alien8 Recordings reissued Radio Amor in 2007 (originally released on Mille Plateaux in 2002) in order to maintain the .", "desc_lfm_artist": "Tim Hecker is an electronic musician and sound artist based in Los Angeles, United States and Montreal, Canada. Hecker initially recorded under the moniker Jetone, but has become known internationally for recordings released under his own name, such as Harmony in Ultraviolet (2006) and Ravedeath, 1972 (2011). He has released eight albums and a number of EPs in addition to collaborations with artists such as Ben Frost, Daniel Lopatin, and Aidan Baker. His latest album No Highs was released on 7 April 2023.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 367, "title": "The Magnolia Electric Co.", "artist": "Songs: Ohia", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/536-magnolia-electric-co_121402.jpg", "aoty_url": "https://www.albumoftheyear.org/album/536-songs-ohia-magnolia-electric-co.php", "aoty_critic_score": 83, "aoty_user_score": 89, "mbid": "135d0421-2a60-36ca-97a1-c3f91203b74c", "yt_id": "2OyCZ15xA1o", "rym": null, "genres": [], "desc_lfm_album": "Magnolia Electric Co. is the seventh regular and final album by Songs: Ohia. It was recorded by Steve Albini at Electrical Audio in Chicago and released by Secretly Canadian on March 4, 2003. It received critical acclaim according to Metacritic (with a composite rating of 85, ranking 24th among best albums of 2003).Delusions of Adequacy called it \"a watershed album, an artistic breakthrough, and the first album to fully realize Molina's potential.\"Allmusic was more reticent in its wording, claiming that \"Magnolia Electric Co. may not be the best Songs: Ohia album, but it is certainly the most approachable. It has .", "desc_lfm_artist": "Songs: Ohia was largely a solo project for singer-songwriter Jason Molina (December 30, 1973 – March 16, 2013). Critics and fans alike have found considerable difficulty in trying to define the band's sound, usually settling on more general labels such as indie rock and folk-rock. Most are quick to draw comparisons to Neil Young and Will Oldham, (the latter of which Molina has collaborated with, alongside Alasdair Roberts, as the Amalgamated Sons of Rest).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "armandwave", "sdecandelario"]}, {"n": 368, "title": "Wonderful Rainbow", "artist": "Lightning Bolt", "year": 2003, "cover": "https://dn711206.ca.archive.org/0/items/mbid-f626b8d5-67a6-4bc7-82cd-4a0c24c8ed5d/mbid-f626b8d5-67a6-4bc7-82cd-4a0c24c8ed5d-11799177283.jpg", "aoty_url": "https://www.albumoftheyear.org/album/904-lightning-bolt-wonderful-rainbow.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "8eecdf24-c5a4-3d74-8a81-80b59cd8e7aa", "yt_id": "EP_E36j-TMQ", "rym": "https://rateyourmusic.com/release/album/lightning-bolt/wonderful-rainbow", "genres": ["noise rock", "math rock", "brutal prog", "rock"], "desc_lfm_album": "", "desc_lfm_artist": "Lightning Bolt is a noise rock duo which formed in 1994 in Providence, Rhode Island, United States. The band consists of Brian Chippendale (drums, vocals) and Brian Gibson (bass). The band also originally included Hisham Bharoocha (vocals, guitar), who left the band in 1996 to join Black Dice. The band has released 8 albums: Lightning Bolt (1999), Ride the Skies (2001), Wonderful Rainbow (2003), Hypermagic Mountain (2005), Earthly Delights (2009), Oblivion Hunter (2012), Fantasy Empire (2015) and Sonic Citadel (2019).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 369, "title": "Lesser Matters", "artist": "The Radio Dept.", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7969-lesser-matters.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7969-the-radio-dept-lesser-matters.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "38befbbe-1168-3fec-9a25-dadf3beaadaa", "yt_id": "7iVXEMyQnpA", "rym": "https://rateyourmusic.com/release/album/the-radio-dept/lesser-matters", "genres": [], "desc_lfm_album": "Lesser Matters is the 2003 debut of Swedish dream pop group The Radio Dept. It ranked number nine on list, Give Up and the group themselves, have experienced a sudden almost startling rising success. They’ve deftly shaken-up America like a gentle, buzzing electrical storm, sending out wonderfully harmonic, wake up world tones from seemingly everyone’s stereos. Originally created as a by mail, almost pen pal style, side project, in only a few short months people have embraced and clamored for this wonderfully grand, unique blend of intelligent electronic music and emotional indie pop. By teaming .", "desc_lfm_artist": "The Postal Service was an American indie electropop band which formed in Seattle, Washington in 2001. The group consisted of  Ben Gibbard (vocals, guitar, keyboards), Jimmy Tamborello (production, programming, synthesizers) and Jenny Lewis (vocals, guitar). The band released one album \"Give Up\" in 2003 and were active until 2005. The band reunited in 2013 for a reunion tour before permanently disbanding that August.\n\nThe band started life as a side project for singer Ben Gibbard of Death Cab For Cutie and producer Jimmy Tamborello of Dntel", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 372, "title": "A Promise", "artist": "Xiu Xiu", "year": 2003, "cover": "https://dn721900.ca.archive.org/0/items/mbid-1390777e-bf06-48e4-a879-6bbc5ef63e7c/mbid-1390777e-bf06-48e4-a879-6bbc5ef63e7c-39827272338.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1389-xiu-xiu-a-promise.php", "aoty_critic_score": 83, "aoty_user_score": 84, "mbid": "301e16b6-b33e-3a72-8f52-794996e08599", "yt_id": "dqcHwFNyfXA", "rym": "https://rateyourmusic.com/release/album/xiu-xiu/a-promise", "genres": ["industrial"], "desc_lfm_album": "A Promise is Xiu Xiu's second LP, and was released 18 Feb. 2003 on 5 Rue Christine. It continued the experimental harshness, unsettling weirdness, and viscerally powerful sound that created a(n) famous/infamous reputation for Jamie Stewart, the band's central member and singer, that had followed him from his debut, Knife Play. This record is a more polished effort than the debut was. Production levels are higher, more instruments are used, and the sound is just more clean overall. Stewart's voice, while it still reaches uniquely disquieting and powerful tones with sheer force and drama, is a bit more controlled this .", "desc_lfm_artist": "Xiu Xiu (pronounced \"shoo shoo\") is an American experimental group, formed in 2002 in San Jose, California by original members Jamie Stewart, Lauren Andrews, Yvonne Chen, and Cory McCulloch. Currently, the line-up consists of Jamie Stewart (the only constant member since formation), Angela Seo, and David Kendrick. Stewart and Seo reside in Germany, while Kendrick is a touring member, playing drums for the group.\n\nOver the life of the band, their music has taken influence from noise", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 373, "title": "You Are Free", "artist": "Cat Power", "year": 2003, "cover": "https://dn710302.ca.archive.org/0/items/mbid-81505ed6-1ad0-4e45-8f48-662fecfa7a75/mbid-81505ed6-1ad0-4e45-8f48-662fecfa7a75-3816099541.jpg", "aoty_url": "https://www.albumoftheyear.org/album/975-cat-power-you-are-free.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "b24234fc-1afd-34df-9c42-92cb51cc0a36", "yt_id": "IiEjkh1pzfY", "rym": "https://rateyourmusic.com/release/album/cat-power/you-are-free/reviews/7", "genres": ["indie rock"], "desc_lfm_album": "", "desc_lfm_artist": "Cat Power is an American singer, songwriter, musician, actress, and model. Charlyn Marie Marshall (also known as Chan, pronounced \"Shawn\")  was born in Atlanta, Georgia, U.S. on 21 January 1972. Cat Power was originally the name of Marshall's first band, but has become her stage name as a solo artist.\n\nAfter dropping ou the most popular artists of alternative rap's second wave. Anticipated nearly as much as it was delayed, the proper studio follow-up, Phrenology, finally appeared in late 2002, after much perfectionist tinkering by the band — so much that the liner notes include recording dates (covering a span of two years) and, sometimes, histories for the individual tracks. Coffeehouse music programmers beware: Phrenology is not Things Fall Apart redux; it's a challenging, hugely ambitious opus that's by turns brilliant and bewildering, as it strains to push the very sound of hip-hop .", "desc_lfm_artist": "The Roots, also known as The Legendary Roots Crew, The Square Roots and The Foundation, is an influential, Grammy winning hip hop group based out of Philadelphia, Pennsylvania, famed for a heavily jazzy sound and live instrumentation. Inspired by the \"hip-hop band\" concept pioneered by Stetsasonic, the Roots themselves have garnered critical acclaim and influenced later hip-hop and R&B acts.\n\nThe Roots' original lineup included Black Thought (MC vocals) and Ahmir \"?uestlove\" Thompson (drums)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84", "paqueradejere"]}, {"n": 376, "title": "Steal This Album!", "artist": "System of a Down", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/steal-this-album-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5386-system-of-a-down-steal-this-album.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "3351730c-7853-38f3-8d56-1bf627de4523", "yt_id": "FSx4dColwDo", "rym": "https://rateyourmusic.com/release/album/system-of-a-down/steal-this-album", "genres": [], "desc_lfm_album": "\"Steal This Album!\" is the third studio album by the American heavy metal band System of a Down, released on November 26, 2002, by American Recordings and Columbia Records. The album was produced by Rick Rubin and Daron Malakian and peaked at number 15 on the US Billboard 200. Background In early 2002, medium-quality MP3s of the album were leaked online under the name \"Toxicity II\". The band expressed disappointment that fans were hearing unfinished material and worked to release a completed, higher-quality version of the album, which became \"Steal This Album!\". Although it was often described in the media .", "desc_lfm_artist": "System of a Down is an Armenian-American heavy metal band formed in Glendale, California, in 1994. Since 1997, the lineup has consisted of Serj Tankian (lead vocals, keyboards), Daron Malakian (guitar, vocals), and Shavo Odadjian (bass, backing vocals), along with drummer John Dolmayan, who replaced original drummer Andy Khachaturian.\n\nThe band achieved commercial success with five studio albums, three of which debuted at number one on the US Billboard 200.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU"]}, {"n": 377, "title": "Siempre es hoy", "artist": "Gustavo Cerati", "year": 2002, "cover": "https://cdn2.albumoftheyear.org/600x0/album/59721-siempre-es-hoy_170556.jpg", "aoty_url": "https://www.albumoftheyear.org/album/59721-gustavo-cerati-siempre-es-hoy.php", "aoty_critic_score": 70, "aoty_user_score": 85, "mbid": "d842d6c8-f645-38b4-835e-24cc2f10911d", "yt_id": "KB34LLZ0yu8", "rym": "https://rateyourmusic.com/release/album/gustavo-cerati/siempre-es-hoy", "genres": [], "desc_lfm_album": "Siempre Es Hoy is the third album by Argentine rock musician Gustavo Cerati. The album was advertised as \"Cerati's Rock Album\", however, it has a more of an electronic style than rock. Music critics were pleased with Siempre Es Hoy, giving it ratings ranging from 4 to 5 stars. Some of the songs were remixed for the 2003 album, Reversiones: Siempre Es Hoy. These songs were remixed by several guest musicians including Leandro Fresco, Bostich from Nortec Collective, Miranda!, Kinky and DJ Orange, all to various electronic-music styles. .", "desc_lfm_artist": "Gustavo Adrián Cerati  highly successful 2001 album, Blackwater Park. It was recorded between July 22 and September 4, 2002 (see 2002 in music), at the same time as Damnation, which was released the following year. The two albums contrast starkly with one another, as Deliverance is considered to be one of the band's heaviest albums, whereas Damnation experimented with a much mellower progressive rock-influenced sound. Deliverance and Damnation were originally intended to be released as a double album, but the band eventually decided against this and released them separately, approximately six months apart from .", "desc_lfm_artist": "Opeth is a Swedish progressive metal band from Stockholm, formed in 1990. The band incorporates elements of folk, blues, classical, and jazz into its compositions, alongside influences from death metal, particularly in their early works. Their music often includes acoustic guitar passages, Mellotron use, death growls, and dynamic shifts.\n\nOpeth has experienced several lineup changes, with every original member eventually replaced. Mikael Åkerfeldt", "desc_mb_album": "", "desc_mb_artist": "The band logo was created by [https://musicbrainz.org/artist/0bf74085-4006-4a1e-b0c9-a3a3b504e7a2|Timo Ketola].", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 381, "title": "Tallahassee", "artist": "Mountain Goats", "year": 2003, "cover": "https://dn720607.ca.archive.org/0/items/mbid-d2a314ab-986e-40af-8cab-04806ab68ce9/mbid-d2a314ab-986e-40af-8cab-04806ab68ce9-7927220552.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a093d8b4-acde-33a4-bc8c-19a710b667a0", "yt_id": "3J66gvC0Vz8", "rym": "https://rateyourmusic.com/release/album/the-mountain-goats/tallahassee/reviews/3", "genres": ["folk rock", "indie rock", "indie folk"], "desc_lfm_album": "", "desc_lfm_artist": "Incorrect tag for The Mountain Goats. Keep stats clean by fixing your ID3 tags, or leave auto-correction on. Don't cheat the artis
