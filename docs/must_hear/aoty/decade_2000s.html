ctress, dancer, and model. She was recognized for her contributions to contemporary R&B, pop, and hip hop, earning titles such as the \"Princess of R&B\" and \"Queen of Urban Pop\". Her awards and nominations include three American Music Awards, two MTV Video Music Awards, and five Grammy Award nominations.\n\nBorn in Brooklyn and raised in Detroit, Aaliyah first gained", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 455, "title": "White Blood Cells", "artist": "The White Stripes", "year": 2001, "cover": "https://ia601901.us.archive.org/33/items/mbid-4e817a8b-fe02-35e7-a7c5-e5878431a469/mbid-4e817a8b-fe02-35e7-a7c5-e5878431a469-2976471178.jpg", "aoty_url": "https://www.albumoftheyear.org/album/531-the-white-stripes-white-blood-cells.php", "aoty_critic_score": 87, "aoty_user_score": 81, "mbid": "c5a0411f-374e-360d-9364-3ddec3007162", "yt_id": "fNDWo0y87IM", "rym": "https://rateyourmusic.com/release/album/the-white-stripes/white-blood-cells", "genres": ["blues rock", "alternative rock", "indie rock", "punk blues", "garage rock revival", "rock"], "desc_lfm_album": "White Blood Cells is the third album by American garage rock band The White Stripes, released in 2001. Considered the band's commercial breakthrough, White Blood Cells peaked at number 61 on the Billboard 200, going Gold and selling over 500,000 units. The album also reached number 55 in the United Kingdom, being bolstered in both territories by the Fell in Love with a Girl single and its Lego-animation music video. Stylus magazine rated it the fifteenth greatest album of 2000-2005 while Pitchfork Media ranked it ninth on their list of the top 100 albums from 2000-2004. The album was dedicated .", "desc_lfm_artist": "The White Stripes were an American rock duo formed in Detroit, Michigan, in 1997. The group consisted of Jack White (guitar, keyboards, piano, vocals) and Meg White (drums, percussion, vocals). They were a leading group of 2000s indie rock and the decade's garage rock revival.\n\nBeginning in the late 1990s, the White Stripes sought success within the Detroit music scene, releasing six singles and two albums. They first found commercial success with their acclaimed third album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 456, "title": "Endless Summer", "artist": "Fennesz", "year": 2001, "cover": "https://dn711101.ca.archive.org/0/items/mbid-b24e6ef3-1471-4eb9-9be8-ed82ef004829/mbid-b24e6ef3-1471-4eb9-9be8-ed82ef004829-35178866487.jpg", "aoty_url": "https://www.albumoftheyear.org/album/571-fennesz-endless-summer.php", "aoty_critic_score": 93, "aoty_user_score": 80, "mbid": "18a6ec4a-8ea4-3af6-ad6a-fb0d8f5ede94", "yt_id": "skygudx8Rrs", "rym": "https://rateyourmusic.com/release/album/fennesz/endless-summer", "genres": ["glitch"], "desc_lfm_album": "", "desc_lfm_artist": "Christian Fennesz (born 25 December 1962) is an Austrian guitarist and electronic music producer based in Vienna, Austria, often credited on albums simply as Fennesz.\n\nChristian Fennesz's trademark sound combines guitar playing with digital techniques like granular synthesis to make multilayered compositions that blend melody and conventional musical instruments with harsh, irregular glitch-influenced sounds and washes of white noise.. This style has been described as \"Rock meets PowerBook\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "verygooood"]}, {"n": 457, "title": "The Texas-Jerusalem Crossroads", "artist": "Lift to Experience", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/68219-the-texas-jerusalem-crossroads_030929.jpg", "aoty_url": "https://www.albumoftheyear.org/album/68219-lift-to-experience-the-texas-jerusalem-crossroads.php", "aoty_critic_score": 69, "aoty_user_score": 88, "mbid": "008e02ac-c1ec-32e1-ab1a-62851dd185b9", "yt_id": "FbBPve8A6yI", "rym": "https://rateyourmusic.com/release/album/lift-to-experience/the-texas-jerusalem-crossroads", "genres": [], "desc_lfm_album": "The Texas-Jerusalem Crossroads is the debut studio album from Denton, Texas-based indie rock trio Lift to Experience. The double album was released on June 26, 2001, and is thus far the only full-length recording from the band. A concept album about the Second Coming of Jesus Christ that \"casts Texas as the Promised Land,\" it was produced by guitarist/vocalist Josh T. Pearson, and mixing was handled by Simon Raymonde and Robin Guthrie, both of Cocteau Twins fame. The album was released on Guthrie and Raymonde's record label Bella Union. Receiving very little attention upon release, the album gradually found an .", "desc_lfm_artist": "Lift to Experience is a band from Denton, Texas, United States that formed in 1996 with vocalist and guitarist Josh T. Pearson, drummer Andy Young and bassist Josh Browning.\n\nWhen the band performed at the SXSW festival in 2000, they impressed Simon Raymonde and Robin Guthrie so much that the duo decided to sign the band to their record label, Bella Union, that same day.\n\nLift to Experience's characteristic sound comes from a solo guitar with heavy effects pedals and a modified Leslie speaker.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 458, "title": "Amnesiac", "artist": "Radiohead", "year": 2001, "cover": "https://dn710709.ca.archive.org/0/items/mbid-910c1006-887c-3044-b13c-34f906f15ea7/mbid-910c1006-887c-3044-b13c-34f906f15ea7-2336491200.jpg", "aoty_url": "https://www.albumoftheyear.org/album/368-radiohead-amnesiac.php", "aoty_critic_score": 79, "aoty_user_score": 80, "mbid": "bca9280e-28b4-327f-8fe0-fd918579e486", "yt_id": "LwE4LNP8zsI", "rym": "https://rateyourmusic.com/release/album/radiohead/amnesiac", "genres": ["experimental rock", "alternative rock", "art rock", "jazz rock", "leftfield"], "desc_lfm_album": "Amnesiac is the fifth studio album by the English alternative rock band Radiohead. It was released on 4 June 2001 in the United Kingdom and on 5 June 2001 in the United States and Canada, debuting at #1 on the UK charts and #2 on the Billboard Top 200. Seen as the furthest departure yet from the rock style and heart-on-sleeve songwriting of the band's early career, Amnesiac nevertheless has more audible guitar than its direct predecessor Kid A, and unlike that album, it spun off several singles. Like Kid A, it synthesizes influences of electronic music, ambient music, classical .", "desc_lfm_artist": "Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock.", "desc_mb_album": "", "desc_mb_artist": "Formed in Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 459, "title": "The Cold Vein", "artist": "Cannibal Ox", "year": 2001, "cover": "https://dn710700.ca.archive.org/0/items/mbid-8548f375-b87f-4eaf-a23f-d43499b6d0c9/mbid-8548f375-b87f-4eaf-a23f-d43499b6d0c9-2433687929.jpg", "aoty_url": "https://www.albumoftheyear.org/album/908-cannibal-ox-the-cold-vein.php", "aoty_critic_score": 86, "aoty_user_score": 84, "mbid": "3c06ec78-508f-3282-876d-a029794bab85", "yt_id": "kekROxOTHSM", "rym": "https://rateyourmusic.com/release/album/cannibal-ox/the-cold-vein", "genres": ["hip hop", "east coast hip hop", "underground hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "Cannibal Ox is a New York hip-hop duo made up of Vast Aire and Vordul Mega, with El-P, the founder of the Definitive Jux label, handling the lion's share of production. Their first record,The Cold Vein, has been heralded as a major turning point in both hip-hop production and lyrical organization.  Several notable guests appear on the album, including C-Rayz Walz, L.I.F.E. Long, Alaska (of Hangar 18), Cryptic One and El-P himself, while Vordul's baritone and Vast's nasal-y styles connect the eclectic project together.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 460, "title": "Miss E... So Addictive", "artist": "Missy Elliott", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/miss-e-so-addictive-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/996-missy-elliott-miss-e-so-addictive.php", "aoty_critic_score": 82, "aoty_user_score": 78, "mbid": "9e4f5c7a-0bec-3c68-bd21-d368145f34e3", "yt_id": "FPoKiGQzbSQ", "rym": null, "genres": [], "desc_lfm_album": "Miss E… So Addictive is the third studio album by American rapper, Missy \"Misdemeanor\" Elliott. The album spawned the club and R&B/hip-hop hits \"One Minute Man\", featuring Ludacris and Trina, and \"Get Ur Freak On\", as well as the international club hit \"4 My People\" and the less commercially successful single \"Take Away\". The album garnered two Grammy Awards for \"Get Ur Freak On\" and the non-single \"Scream a.k.a. Itchin'\" for Best Rap Solo Performance and Best Female Rap Solo Performance, respectively. The album was certified Platinum by the RIAA. .", "desc_lfm_artist": "Melissa Arnette Elliott (born July 1, 1971 in  Portsmouth, Virginia), better known by her stage name Missy \"Misdemeanor\" Elliott, is an American Grammy Award winning rapper, singer, producer, actress and former member of the R&B group Sista. With sales of over seven million in the United States alone she is the only female rapper to have six albums certified platinum by the RIAA and has worked extensively as a producer for many other artists along with her childhood friend Timbaland.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "MaxtorUwU", "Nubis84"]}, {"n": 461, "title": "Lateralus", "artist": "TOOL", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/lateralus-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4126-tool-lateralus.php", "aoty_critic_score": 75, "aoty_user_score": 88, "mbid": "02f79295-21e1-34cc-82f2-63219eec4f0a", "yt_id": "UI7XXkOt0ic", "rym": null, "genres": [], "desc_lfm_album": "\"Lateralus\" is the third studio album by the American rock band Tool. It was released on May 15, 2001, through Volcano Entertainment. Recording took place at Cello Studios in Hollywood and at The Hook, Big Empty Space, and The Lodge in North Hollywood between October 2000 and January 2001. David Bottrill, who had also produced the band's previous releases \"Ænima\" and \"Salival\", co-produced the album with the band. \"Lateralus\" remains the last Tool album produced by Bottrill. The album debuted at number one on the Billboard 200 chart, selling over 555,200 copies in its first week. It was certified triple .", "desc_lfm_artist": "Tool is an American alternative metal/progressive metal band from Los Angeles. Formed in 1990, the group's line-up includes vocalist Maynard James Keenan, guitarist Adam Jones and drummer Danny Carey. Justin Chancellor has been the band's bassist since 1995, replacing their original bassist Paul D'Amour. Tool has won four Grammy Awards, performed worldwide tours, and produced albums topping the charts in several countries.\n\nTo date, the band has released five studio albums, one EP and one box set.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 462, "title": "cLOUDDEAD", "artist": "cLOUDDEAD", "year": 2001, "cover": "https://ia801703.us.archive.org/11/items/mbid-45655edf-8e66-30dc-9211-984d801ab78f/mbid-45655edf-8e66-30dc-9211-984d801ab78f-13677215276.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8794-clouddead-clouddead.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "05756130-3427-372e-95e9-6f80846e9430", "yt_id": "XRLOlMftMMQ", "rym": "https://rateyourmusic.com/release/album/clouddead/clouddead-1", "genres": ["alternative hip hop", "experimental hip hop", "abstract hip hop", "cloud rap"], "desc_lfm_album": "", "desc_lfm_artist": "cLOUDDEAD was an experimental hip-hop group from Cincinnati, Ohio, United States, consisting of musicians Doseone (Adam Drucker), Why? (Yoni Wolf), and Odd Nosdam (David Madson). Generally Drucker and Wolf provide the group's vocals while Madson produces the music. Occasionally Madson's vocals can be heard, while Drucker and Wolf provide music, especially for the group's second album.\n\nThe group's name comes from a nonsensical knock-knock joke Drucker's sister told him when she was 6 years old. The joke runs like this:", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Rocky_stereo"]}, {"n": 463, "title": "Confield", "artist": "Autechre", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/confield-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1512-autechre-confield.php", "aoty_critic_score": 72, "aoty_user_score": 82, "mbid": "b28324fc-00d4-3bc6-bc94-90218c377517", "yt_id": "ikRwIH9tjKM", "rym": "https://rateyourmusic.com/release/album/autechre/confield", "genres": [], "desc_lfm_album": "With Confield, Sean Booth and Rob Brown largely abandoned the warm ambient sounds of their earlier works such as Amber and Tri Repetae in favour of the more chaotic feel that they had been pursuing with LP5, EP7, and Peel Session. Confield saw the experimental use of computer programs to form the basis of songs instead of stand-alone synthesizers. According to Booth, \"Most of Confield came out of experiments with Max that weren't really applicable in a club environment.\" One of the more controversial aspects of the album's production was, like EP7, the use of generative sequences for certain aspects .", "desc_lfm_artist": "Autechre (/ɔːˈtɛkər/) is the English electronic/IDM duo of Rob Brown and Sean Booth, signed with Warp Records.\n\nMuch of Autechre's music has a strong focus on complex rhythm and driving percussion, and more recently, on meticulous sequencing. Later work has been notably experimental and abstract, in contrast to the more club-friendly and conventional early 1990s releases.\n\nBooth and Brown formed the group in 1987 while they were both living in Rochdale, United Kingdom.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 464, "title": "Leaves Turn Inside You", "artist": "Unwound", "year": 2001, "cover": "https://dn710002.ca.archive.org/0/items/mbid-3b1b7509-7bff-4a95-9ee8-f5e050cf102e/mbid-3b1b7509-7bff-4a95-9ee8-f5e050cf102e-27704658731.jpg", "aoty_url": "https://www.albumoftheyear.org/album/573-unwound-leaves-turn-inside-you.php", "aoty_critic_score": 93, "aoty_user_score": 88, "mbid": "75a65e18-da84-345d-a30e-4a7e1b605a22", "yt_id": "1l4Bd3LFAJg", "rym": "https://rateyourmusic.com/release/album/unwound/leaves-turn-inside-you", "genres": ["alternative rock", "noise rock", "indie rock", "post-hardcore", "post-rock", "math rock"], "desc_lfm_album": "Leaves Turn Inside You is the seventh and final studio album by the American post-hardcore band Unwound, released on April 17, 2001 by Kill Rock Stars. The album received high acclaim from several music critics. Unlike previous Unwound albums, Leaves Turn Inside You was recorded in 2000 by the band members at their own built studio, MagRecOne (\"Magnetic Recording One\"), in Olympia, Washington. As singer and guitarist Justin Trosper explains, \"Every record, we tried to raise the bar to some degree by asking, 'What can we do to make this better?' Usually that was just increasing the amount of time .", "desc_lfm_artist": "Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 465, "title": "No More Shall We Part", "artist": "Nick Cave & The Bad Seeds", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1373-no-more-shall-we-part_230113.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1373-nick-cave-the-bad-seeds-no-more-shall-we-part.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "82c9fedb-4475-378b-b850-6e119d6b1828", "yt_id": "NZlpbVu6S_k", "rym": "https://rateyourmusic.com/release/album/nick-cave-and-the-bad-seeds/no-more-shall-we-part", "genres": [], "desc_lfm_album": "No More Shall We Part is the eleventh studio album by Nick Cave and the Bad Seeds, released on 2 April 2001 in the UK (and 10 April in the US). The record, which was well received critically, came after a 4-year gap from recording, following the much acclaimed album The Boatman's Call and subsequent 'Best Of' album. Nick Cave had to overcome heavy heroin and alcohol addictions in 1999–2000 before starting work on the album. It featured guest appearances by Kate & Anna McGarrigle and was met with mostly positive reviews. At Metacritic, which assigns a normalised rating out .", "desc_lfm_artist": "Nick Cave & the Bad Seeds is an Australian post-punk band formed in Melbourne in 1983 by vocalist Nick Cave, multi-instrumentalist Mick Harvey and guitarist Blixa Bargeld. The band has featured international personnel throughout its career and has released a lengthy series of studio albums and completed numerous international tours. \n\nThe band presently consists of Cave, violinist and multi-instrumentalist Warren Ellis, bassist Martyn P. Casey (all from Australia)", "desc_mb_album": "", "desc_mb_artist": "Some releases are credited to \"Nick Cave & the Bad Seeds\" others are \"Nick Cave and the Bad Seeds.\" This is intentional on the part of the editors and matches the various releases. If you need to group them or normalize them in your own collection, use the %albumartistsort% variable (or something like \"$if2(%albumartistsort%,%albumartist%,%artistsort%,%artist%)\") in your tagger.\r\n\r\nDo not make arbitrary edits to the artist credits unless you can prove that your edit matches the release.", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave"]}, {"n": 466, "title": "Mutter", "artist": "Rammstein", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14843-mutter_103438.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14843-rammstein-mutter.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "833a9e1a-62c0-32f6-ab47-7797c4d83b07", "yt_id": "r-RVD6oOVuU", "rym": "https://rateyourmusic.com/release/album/rammstein/mutter/", "genres": [], "desc_lfm_album": "Mutter (German for \"Mother\") is the German industrial metal band Rammstein's third album. It was released on 2 April 2001. It is often considered a \"modern metal classic.\" All tracks written by Rammstein. 1.\"Mein Herz brennt\" (\"My heart burns\") – 4:40 2. \"Links 2 3 4\" (\"Left 2-3-4\") – 3:44 3. \"Sonne\" (\"Sun\") – 4:32 4. \"Ich will\" (\"I want\") – 3:37 5. \"Feuer frei!\" (\"Open fire!\" or \"Fire at will\") – 3:08 6. \"Mutter\" (\"Mother\") – 4:29 7. \"Spieluhr\" (\"Music-box\") (feat. Khira Li) – 4:46 8. \"Zwitter\" (\"Hermaphrodite\") – 4:17 9. \"Rein, raus\" (\"In, out\") – 3:11 10. \"Adios\" .", "desc_lfm_artist": "Rammstein is a German Neue Deutsche Härte band formed in Berlin in 1994. The group’s lineup—consisting of Till Lindemann (lead vocals), Richard Kruspe (lead guitar), Paul Landers (rhythm guitar), Oliver Riedel (bass), Christoph Schneider (drums), and Christian \"Flake\" Lorenz (keyboards)—has remained unchanged throughout their career. Their songwriting process typically involves Lindemann composing and performing lyrics to instrumental arrangements written by the rest of the band.", "desc_mb_album": "", "desc_mb_artist": "Style issues:\r\n[http://musicbrainz.org/show/edit/?editid=8315084|Discussion of the spelling of ''Links 2-3-4''].", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 467, "title": "How I Loved You", "artist": "Angels of Light", "year": 2001, "cover": "https://dn710706.ca.archive.org/0/items/mbid-ef815648-0f20-4445-b1e9-99617e7e3098/mbid-ef815648-0f20-4445-b1e9-99617e7e3098-1983413993.jpg", "aoty_url": "https://www.albumoftheyear.org/album/27665-angels-of-light-how-i-loved-you.php", "aoty_critic_score": 72, "aoty_user_score": 83, "mbid": "b7a7b9f0-6cd6-31e5-bfa2-863873da6ca4", "yt_id": "pXHTgeP4uKo", "rym": "https://rateyourmusic.com/release/album/the-angels-of-light/how-i-loved-you", "genres": ["folk rock", "folk", "gothic country"], "desc_lfm_album": "", "desc_lfm_artist": "Angels of Light are an experimental group that was formed circa 1998 by singer/guitarist Michael Gira after he disbanded Swans, the group he'd founded in 1982. The band has marked a distinctly different style for Gira since he left Swans, most noticeably being musically more melodic and less brutal than his previous efforts. The Angels of Light include many New York City collaborators, including Dana Schechter of Bee and Flower, Kid Congo Powers of The Cramps", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 468, "title": "Twilight", "artist": "bôa", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/120670-twilight.jpg", "aoty_url": "https://www.albumoftheyear.org/album/120670-boa-twilight.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "38174604-0631-381b-a67b-5ce30e498505", "yt_id": "-LZC40nptX4", "rym": null, "genres": [], "desc_lfm_album": "Twilight is a reissue of bôa's debut studio album from 1998, The Race of a Thousand Camels released in 2001. The first track, \"Duvet\", became popular after being used as the opening theme song of anime series Serial Experiments Lain. .", "desc_lfm_artist": "bôa is a British alternative rock band formed in London in 1993 by drummer Ed Herten, keyboard player Paul Turrell, and guitarist/vocalist Steve Rodgers. Bôa's current lineup consists of Jasmine Rodgers (vocals), Steve Rodgers (vocals & guitar), Alex Caird (bass), and Lee Sullivan (drums & piano). The band progressed from a funk band to a rock band over the years. They produced two major albums, Twilight in 2001 and Get There in 2005. The band was", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 469, "title": "Blackwater Park", "artist": "Opeth", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4125-blackwater-park_183049.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4125-opeth-blackwater-park.php", "aoty_critic_score": 85, "aoty_user_score": 89, "mbid": "1f4a9f6f-9621-3e46-977d-8503e8386768", "yt_id": "bl0QVeD-KJg", "rym": "https://rateyourmusic.com/release/album/opeth/blackwater-park/", "genres": [], "desc_lfm_album": "Blackwater Park is the fifth full-length studio album from the Swedish progressive death metal band Opeth. It was originally released on February 27, 2001 under Music For Nations and Koch Records. The album is a further continuation of the styles explored on Still Life, incorporating and further expanding on the band's signature sound, which features the merger of death metal, progressive metal and folk music elements. The album is named after the German progressive rock band of the same name. Blackwater Park was the first Opeth album to be produced by Porcupine Tree's Steven Wilson, who also provided backing vocals .", "desc_lfm_artist": "Opeth is a Swedish progressive metal band from Stockholm, formed in 1990. The band incorporates elements of folk, blues, classical, and jazz into its compositions, alongside influences from death metal, particularly in their early works. Their music often includes acoustic guitar passages, Mellotron use, death growls, and dynamic shifts.\n\nOpeth has experienced several lineup changes, with every original member eventually replaced. Mikael Åkerfeldt", "desc_mb_album": "", "desc_mb_artist": "The band logo was created by [https://musicbrainz.org/artist/0bf74085-4006-4a1e-b0c9-a3a3b504e7a2|Timo Ketola].", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 470, "title": "Discovery", "artist": "Daft Punk", "year": 2001, "cover": "https://dn721806.ca.archive.org/0/items/mbid-6cd30d99-4923-4d5e-8e51-9d87506976f1/mbid-6cd30d99-4923-4d5e-8e51-9d87506976f1-43702618964.jpg", "aoty_url": "https://www.albumoftheyear.org/album/582-daft-punk-discovery.php", "aoty_critic_score": 80, "aoty_user_score": 91, "mbid": "48117b90-a16e-34ca-a514-19c702df1158", "yt_id": "A2VpR8HahKc", "rym": "https://rateyourmusic.com/release/album/daft-punk/discovery", "genres": ["electro", "electronic rock", "dance", "progressive house", "dance-pop", "house"], "desc_lfm_album": "Discovery is the second studio album by the French house duo Daft Punk, released in March 2001. It marks a shift in the sound from Chicago house, which they were previously known for, to disco, post-disco and synthpop-inspired house. The album provided itself as a soundtrack to the anime film Interstella 5555: The 5tory of the 5ecret 5tar 5ystem, which was a collaboration between the creators of the album, Leiji Matsumoto, and Toei Animation. All of the music videos for the tracks on the album are segments of the film. Interstella 5555 follows a story of a kidnapped extraterrestrial band. .", "desc_lfm_artist": "Daft Punk was a multi Grammy Award-winning electronic music duo formed in 1993 in Paris, France, and separated in early 2021, consisting of French musicians Thomas Bangalter (born 3 January 1975) and Guy-Manuel de Homem-Christo (born 8 February 1974). The band is considered one of the most successful electronic music collaborations of all time, both in album sales and in critical acclaim. \n\nDaft Punk reached significant popularity in the late 90s house movement in France, along with other artists such as Air, Cassius, and Dimitri From Paris.", "desc_mb_album": "All or some editions of ''Discovery'' included the ''Daft Card'' to access the ''Daft Club'', which was a web service that featured some extra digital tracks (mainly remixes) to be downloaded.\nNow, the service is closed, and these tracks are available directly on  [https://musicbrainz.org/release-group/1fd2e0fe-90f6-35ca-92c0-d816ab3bb79c|''Daft Club''].", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 471, "title": "Mista Don't Play: Everythangs Workin", "artist": "Project Pat", "year": 2001, "cover": "https://cdn2.albumoftheyear.org/600x0/album/40791-mista-dont-play-everythangs-workin.jpg", "aoty_url": "https://www.albumoftheyear.org/album/40791-project-pat-mista-dont-play-everythangs-workin.php", "aoty_critic_score": 71, "aoty_user_score": 82, "mbid": "b152bfee-6f34-3dbb-bed7-8c4657f1172b", "yt_id": "yhMIG-zelr4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Patrick Stephen Houston (born February 9, 1973), better known by his stage name Project Pat, is an American hip hop artist from  Memphis, Tennessee, USA. He is the elder brother of rapper Juicy J. \n\nAlthough not an official member, he had collaborated with Three 6 Mafia, and all of his albums have been produced by members of the group. His first recording appearances were on Three 6 Mafia releases from 1991. After serving time in prison on various charges in the mid-1990s, he released his first solo album, Ghetty Green in 1999.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 472, "title": "Things We Lost In The Fire", "artist": "Low", "year": 2001, "cover": "https://dn710709.ca.archive.org/0/items/mbid-39bfbf4d-bcab-4107-bbe8-755a2ea568f1/mbid-39bfbf4d-bcab-4107-bbe8-755a2ea568f1-2960156447.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "71a852c2-60b8-3bea-9e4c-373b1069be28", "yt_id": "3tMfwdCuim4", "rym": null, "genres": ["alternative rock", "indie rock", "slowcore"], "desc_lfm_album": "Things We Lost in the Fire is a 2001 album by Low, their fifth full-length release. In 2006, the album was performed live in its entirety as part of the All Tomorrow's Parties-curated Don't Look Back series. Engineered by Steve Albini at Electrical Audio in Chicago. Some overseas editions of the album contain the additional tracks \"Overhead\" and \"Don't Carry It All\", which were B-sides of the \"Dinosaur Act\" single, and were also published later on the 2004 box set of rarities, A Lifetime of Temporary Relief: 10 Years of B-Sides and Rarities. These two tracks were also included on .", "desc_lfm_artist": "There are at least seven artists with this name:\n1) Low is an American indie rock/slowcore band from Duluth.\n2) Low is a German industrial punk rock band from Berlin.\n3)  Low is a Danish rapper.\n4) Low is a Spanish hip hop artist.\n5)  low is a doujin artist.\n6) Low (White Leaves)is a Japanese artist.\n7) Low is a member of CLOSER.\n\n1)  Low was a slowcore band formed in Duluth, Minnesota, United States in 1993, by Alan Sparhawk (guitar and vocals), Mimi Parker (drums and vocals) and original bassist John Nichols (bass guitar).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 473, "title": "flood", "artist": "Boris", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19021-flood_204102.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19021-boris-flood.php", "aoty_critic_score": 80, "aoty_user_score": 89, "mbid": "321c2496-642f-35f0-9493-9f27a0c63223", "yt_id": "ZB51taDpPZg", "rym": null, "genres": [], "desc_lfm_album": "Flood is the third studio album by Japanese experimental band Boris, released on December 15, 2000. It consists of a single 70-minute title-track that is broken into four movements. While Flood did not receive many reviews upon release, it has become a cult classic among fans, prompting the band to play it in its entirety every night of their 2013 US-based \"Residency Tour\". The album marked a change in musical direction; it features less of the abrasive sound heard on Absolutego and Amplifier Worship, and incorporated minimalism and progressive rock elements. Flood I is when the rain starts. The looping .", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Rocky_stereo"]}, {"n": 474, "title": "Another Sunny Day", "artist": "honeydip", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/897568-another-sunny-day_145657.jpg", "aoty_url": "https://www.albumoftheyear.org/album/897568-honeydip-another-sunny-day.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": "caf5ead1-1147-47f7-90b5-91804d6c3b36", "yt_id": "_LWqB_3M-qA", "rym": "https://rateyourmusic.com/release/album/honeydip/another-sunny-day", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "honeydip is an underground Japanese alternative rock band that first formed in 1996. They are known for their rich, atmospheric sound which generally has a shoegaze-center to it. honeydip changed their name to Sugarcoat in late 2002, but eventually ended up splitting all together in 2004 due to personal reasons with 2 of the members Ichihara Eiji and Masato Hayashi. Their official statement about splitting up can be found here, Some of the members of honeydip/Sugarcoat went on to form The Tron.", "desc_mb_album": "", "desc_mb_artist": "Ended in 2009, announced a comeback in 2024 with the tagline \"honeydip is not dead\".", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo"]}, {"n": 475, "title": "Dance Tonight! Revolution Tomorrow!", "artist": "Orchid", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/114272-dance-tonight-revolution-tomorrow.jpg", "aoty_url": "https://www.albumoftheyear.org/album/114272-orchid-dance-tonight-revolution-tomorrow.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "69a9530b-f662-3c77-bb74-1118f972cff3", "yt_id": "ToGzfPpu4P8", "rym": "https://rateyourmusic.com/release/album/orchid/dance-tonight-revolution-tomorrow", "genres": ["Punk"], "desc_lfm_album": "Dance Tonight! Revolution Tomorrow! is the second studio album by Emoviolence band Orchid, released on December 4th, 2000 under Ebullition Records. Ebullition was known for signing early pioneers of Screamo and emoviolence, such as Portraits of Past and Reversal of Man. Dance Tonight! Revolution Tomorrow! was recorded at God City Studios in December of 1999, a studio that Converge guitarist Kurt Ballou established in 1998. The album shifts away from the raw, dark, and extreme Powerviolence derived sound orchid had previously established with their debut album Chaos Is Me and completely flips it over it's head. With cleaner production and .", "desc_lfm_artist": "There are at least 11 artists called Orchid:\n1. A screamo/emoviolence band from Amherst, Massachusetts;\n2. A doom metal band from San Francisco, California;\n3. Helix Tears and Bloodhounds singer/rappper, https://soundcloud.com/0rch_id;\n4. An pop band from Poznan, Poland;\n5. A rock band from Halifax, Nova Scotia;\n6. An alias of Alexander Tooth;\n7. A \"post-prog\" band from Chapel Hill, North Carolina;\n8. A progressive metal/mathcore band from Bangalore, India (renamed to Maneating Orchid);", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 476, "title": "Since I Left You", "artist": "The Avalanches", "year": 2000, "cover": "https://dn710202.ca.archive.org/0/items/mbid-0fbb1443-86b4-4fd5-829a-4620386e1ff7/mbid-0fbb1443-86b4-4fd5-829a-4620386e1ff7-28243512694.jpg", "aoty_url": "https://www.albumoftheyear.org/album/572-the-avalanches-since-i-left-you.php", "aoty_critic_score": 85, "aoty_user_score": 89, "mbid": "28438e4f-3710-459f-a332-a1eba9dd1f26", "yt_id": "OyUBL2-Qifk", "rym": "https://rateyourmusic.com/release/album/the-avalanches/since-i-left-you/", "genres": ["art pop", "dance", "electronica", "alternative dance", "plunderphonics", "sampledelia"], "desc_lfm_album": "Since I Left You is the debut studio album by Australian electronic dance music group The Avalanches, which was released on 27 November 2000. Produced by The Avalanches' members Robbie Chater and Darren Seltmann (under the pseudonym Bobbydazzler), it was issued on Modular Recordings. The album was created in two separate near-identical studios by Chater and Seltmann, passing audio mixes of records they sampled. The album contains about 3500 vinyl samples of various genres of music. As it was not originally intended for international release, the duo did not worry about copyright restrictions nor attempt to keep track of which .", "desc_lfm_artist": "There are two artists who go by The Avalanches:\n\n1. The Avalanches are an electronic music collective from Melbourne, Australia. The band is known for the use of eclectic sampling, having created their debut album, Since I Left You (2000), entirely out of over 3,500 samples of obscure records, movies, and television shows. This is famously demonstrated on their hit single \"Frontier Psychiatrist\".\n\nBefore this, they were a hip-hop group with the single album, Rock City and the EP, El Producto.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 477, "title": "In a Beautiful Place Out in the Country", "artist": "Boards of Canada", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11144-in-a-beautiful-place-out-in-the-country.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11144-boards-of-canada-in-a-beautiful-place-out-in-the-country.php", "aoty_critic_score": 74, "aoty_user_score": 82, "mbid": "c73833e3-384c-36fd-97a2-762a858dbff4", "yt_id": "BkFzSaAx4tI", "rym": null, "genres": ["idm"], "desc_lfm_album": "In a Beautiful Place out in the Country is an EP by Boards of Canada. Encompassing four tracks culled from the same recording sessions from which Boards of Canada would later produce Geogaddi, the EP tends to favor a darker, more pastoral, and even elegiac atmosphere than its predecessor Music Has the Right to Children. Although musically the EP is no great stylistic departure for the group, In a Beautiful Place out in the Country does represent a significant change in tone and subject matter. Of particular note are the references in the music and album art reflecting an interest .", "desc_lfm_artist": "Boards of Canada is an electronic music duo from Edinburgh, Scotland, UK, formed in 1985 and comprised of brothers Mike Sandison (born 1 June 1970) and Marcus Eoin (born 21 July 1971). They have released a number of works, most notably the studio albums Music Has the Right to Children (1998), Geogaddi (2002), and The Campfire Headphase (2005) on the pioneering electronic music label Warp. Their fourth album Tomorrow's Harvest was released in June 2013.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 478, "title": "Mama’s Gun", "artist": "Erykah Badu", "year": 2000, "cover": "https://dn711202.ca.archive.org/0/items/mbid-b6b5b654-5c60-4520-b099-4a50d33e2bd0/mbid-b6b5b654-5c60-4520-b099-4a50d33e2bd0-882556108.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "25bdfd28-72ca-3d1f-88fc-dcf67df91720", "yt_id": "-NiR-9VUArY", "rym": "https://rateyourmusic.com/release/album/erykah-badu/mamas-gun", "genres": ["jazz", "r&b", "contemporary r&b", "hip hop", "neo soul"], "desc_lfm_album": "", "desc_lfm_artist": "Erykah Badu (born Erica Abi Wright on February 26, 1971 in Dallas, Texas) is an American R'n'B/neo-soul artist whose work crosses over into jazz. \n\nShe is best known for her singles You Got Me her collaboration with The Roots, as well as her own songs Tyrone, Love of My Life, On & On, Bag Lady, The Healer,  Honey and Soldier. Her lyrics are highly personal urban philosophy which throw emotional challenges in the face of the listener. She weaves unusual musical influences together creating a rich texture of sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave"]}, {"n": 479, "title": "Ghost Tropic", "artist": "Songs: Ohia", "year": 2000, "cover": "https://dn710703.ca.archive.org/0/items/mbid-1410098b-da04-4123-ae3f-8f61670ecf49/mbid-1410098b-da04-4123-ae3f-8f61670ecf49-25341755472.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6115-songs-ohia-ghost-tropic.php", "aoty_critic_score": 75, "aoty_user_score": 84, "mbid": "fb5b046f-e950-3248-8b2c-36ebf63d85e5", "yt_id": "Z4-IT5C8HbI", "rym": "https://rateyourmusic.com/release/album/songs-ohia/ghost-tropic", "genres": ["contemporary folk", "indie rock", "slowcore", "Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Songs: Ohia was largely a solo project for singer-songwriter Jason Molina (December 30, 1973 – March 16, 2013). Critics and fans alike have found considerable difficulty in trying to define the band's sound, usually settling on more general labels such as indie rock and folk-rock. Most are quick to draw comparisons to Neil Young and Will Oldham, (the latter of which Molina has collaborated with, alongside Alasdair Roberts, as the Amalgamated Sons of Rest).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave"]}, {"n": 480, "title": "Lovers Rock", "artist": "Sade", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22068-lovers-rock_200715.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22068-sade-lovers-rock.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "d4ec7e03-61fa-3aec-8f3c-fbcda6d3c552", "yt_id": "CkaLfNLOzBA", "rym": "https://rateyourmusic.com/release/album/sade/lovers-rock", "genres": [], "desc_lfm_album": "Lovers Rock is the fifth studio album by English band Sade, released on November 13, 2000 through Epic Records. The album was titled after a style of reggae music known as lovers rock, noted for its romantic sound and content, which frontwoman Sade Adu listened to in her youth. Lovers Rock was seen as a departure from the band's previous use of jazz elements, opting instead for a wider use of musical elements from soul music, R&B, soft rock, folk music, dub, reggae, neo soul and lovers rock. The album's production has been characterised as spare, with simple arrangements and .", "desc_lfm_artist": "Sade (pronounced shah-day) is an English band formed in London in 1982, named after their lead singer, Sade Adu. Their music features elements of soul, quiet storm, smooth jazz and sophisti-pop. All of their albums, including compilations and a live album, have charted in the US Top Ten.\n\nThree of their members were originally from Hull in the East Riding of Yorkshire. Sade was formed in 1982, when members of Latin soul band Pride — Sade Adu, (real name Helen Folasade Adu - born 16 January 1959 in Ibadan", "desc_mb_album": "", "desc_mb_artist": "Formed out of the ashes of jazz group ''Pride'', this band had critical and commercial success with the album '''Diamond Life''' and several singles. From 1984, the record deal was solely in the name of '''Helen Folasade Adu''', the charismatic singer, but her backing band remained intact for several releases.", "heard_by": ["BipolarMuzik", "MaxtorUwU", "Rocky_stereo", "armandwave"]}, {"n": 481, "title": "Stankonia", "artist": "OutKast", "year": 2000, "cover": "https://dn711301.ca.archive.org/0/items/mbid-296f8a54-eff7-3c6a-9857-164c05479c09/mbid-296f8a54-eff7-3c6a-9857-164c05479c09-24569780625.jpg", "aoty_url": "https://www.albumoftheyear.org/album/579-outkast-stankonia.php", "aoty_critic_score": 91, "aoty_user_score": 88, "mbid": "00d2cd53-21c9-3738-b683-56847b7b0040", "yt_id": "w-5HHVuQmvg", "rym": "https://rateyourmusic.com/release/album/outkast/stankonia", "genres": ["drum and bass", "techno", "alternative hip hop", "hip hop", "dirty south", "southern hip hop"], "desc_lfm_album": "Stankonia is the fourth studio album by American hip hop duo OutKast, released October 31, 2000 on La Face Records. The album debuted at number 2 on the U.S. Billboard 200 chart, selling over 530,000 copies the first week. Stankonia received universal acclaim from most music critics, based on an aggregate score of 95/100 from Metacritic. It received rave reviews from publications such as USA Today and the Los Angeles Times. It was also voted as the best album of the year in The Village Voice Pazz & Jop critics' poll. In 2003, the album was ranked number 359 on .", "desc_lfm_artist": "OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 482, "title": "Stories From the City, Stories From the Sea", "artist": "PJ Harvey", "year": 2000, "cover": "https://dn711000.ca.archive.org/0/items/mbid-8eb9a94f-f10c-342d-bde6-0c86d7f76172/mbid-8eb9a94f-f10c-342d-bde6-0c86d7f76172-25753083087.jpg", "aoty_url": "https://www.albumoftheyear.org/album/942-pj-harvey-stories-from-the-city-stories-from-the-sea.php", "aoty_critic_score": 77, "aoty_user_score": 85, "mbid": "71641af7-d122-326a-b0bb-f76a8d09810c", "yt_id": "-gvrA-zyY-0", "rym": "https://rateyourmusic.com/release/album/pj-harvey/stories-from-the-city-stories-from-the-sea", "genres": ["folk rock", "alternative rock", "art rock", "indie rock"], "desc_lfm_album": "Stories from the City, Stories from the Sea is the fifth studio album by English alternative rock musician PJ Harvey, released on 23 October 2000 by Island Records. Recorded from March to April 2000, it contains themes of love that are tied into Harvey's affection for New York City. The album became the second major commercial success of her recording career, following her successful breakthrough \"To Bring You My Love\". Upon its release, the album received acclaim from most music critics and earned Harvey several accolades, including the 2001 Mercury Prize. It spent 17 weeks on the UK Albums Chart .", "desc_lfm_artist": "Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 483, "title": "Hybrid Theory", "artist": "Linkin Park", "year": 2000, "cover": "https://ia801505.us.archive.org/24/items/mbid-69b7b91a-43fc-483f-b8cf-22cdc8f69079/mbid-69b7b91a-43fc-483f-b8cf-22cdc8f69079-17352139218.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2045-linkin-park-hybrid-theory.php", "aoty_critic_score": 77, "aoty_user_score": 83, "mbid": "b5b4bb4b-8ba5-3acf-88cb-4cae2699d8da", "yt_id": "D2ts2GWOSv8", "rym": "https://rateyourmusic.com/release/album/linkin-park/hybrid-theory", "genres": ["alternative rock", "alternative metal", "nu metal", "alternative punk", "rap metal", "rap rock"], "desc_lfm_album": "Hybrid Theory is the debut album by the American rock band Linkin Park, released on October 24th, 2000 through Warner Bros. Records. The album was a huge commercial success, selling over 10 million units in the United States alone and peaking at number two on the Billboard 200 while also reaching high positions on other charts worldwide, despite receiving mixed reviews from publications. It has also sold 24 million copies worldwide as of 2009, including over 10 million in the U.S. which makes it the band's best-selling album, the second best-selling album of the 21st century so far, and the .", "desc_lfm_artist": "Linkin Park is an American alternative rock band from Agoura Hills, California. The band's current lineup comprises of vocalist/rhythm guitarist/keyboardist Mike Shinoda, lead guitarist Brad Delson, bassist Dave Farrell, DJ/turntablist Joe Hahn, drummer Colin Brittain, and lead vocalist Emily Armstrong. Shinoda, Delson, Farrell and Hahn are founding members. Vocalists Mark Wakefield, Chester Bennington & drummer Rob Bourdon are former members of the band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 484, "title": "Lift Yr. Skinny Fists Like Antennas to Heaven!", "artist": "Godspeed You Black Emperor!", "year": 2000, "cover": "https://e.snmc.io/i/600/w/b2a34b3ec4b4d17cba562a0cbaf0e6e8/5662600", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3822abb6-ca53-3ae1-a4ec-7718cb321e9b", "yt_id": "PZwQeZh6rP0", "rym": "https://rateyourmusic.com/release/album/godspeed-you-black-emperor/lift-yr-skinny-fists-like-antennas-to-heaven/", "genres": ["drone", "post-rock"], "desc_lfm_album": "", "desc_lfm_artist": "Godspeed You! Black Emperor (formerly punctuated Godspeed You Black Emperor!; abbreviated to GYBE) is a Canadian post-rock band formed in 1994 and based in Montreal, Quebec. One of the first musical acts to publish their albums through the Constellation Records label, they have since released three studio albums and one EP.\n\nThe nine-piece group is well-known for working on a near-orchestral scale, utilizing such techniques as wide dynamic ranges", "desc_mb_album": "= Movements =\r\n== Storm – 22:32 ==\r\n         1. \"Lift Yr. Skinny Fists, Like Antennas to Heaven...\" – 6:15\r\n         2. \"Gathering Storm/Il pleut à mourir &#91;+Clatters Like Worry &#93;\" – 11:10\r\n         3. \"'Welcome to Barco AM/PM...' [L.A.X.; 5/14/00]\" – 1:15\r\n         4. \"Cancer Towers on Holy Road Hi-Way\" – 3:52\r\n== Static – 22:35 ==\r\n         1. \"Terrible Canyons of Static\" – 3:34\r\n         2. \"Atomic Clock.\" – 1:09\r\n         3. \"Chart #3\" – 2:39\r\n         4. \"World Police and Friendly Fire\" – 9:48\r\n         5. \"[...+The Buildings They Are Sleeping Now]\" – 5:25\r\n== Sleep – 23:17 ==\r\n         1. \"Murray Ostril: '...They Don't Sleep Anymore on the Beach...'\" – 1:10\r\n         2. \"Monheim\" – 12:14\r\n         3. \"Broken Windows, Locks of Love Pt. III.\" – 9:53\r\n== Antennas to Heaven – 18:5", "desc_mb_artist": "", "heard_by": []}, {"n": 485, "title": "Kid A", "artist": "Radiohead", "year": 2000, "cover": "https://dn710905.ca.archive.org/0/items/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5-29475045164.png", "aoty_url": "https://www.albumoftheyear.org/album/366-radiohead-kid-a.php", "aoty_critic_score": 81, "aoty_user_score": 91, "mbid": "e75c0549-ad55-39e3-8025-c72c5d4a3c5d", "yt_id": "NUnXxh5U25Y", "rym": "https://rateyourmusic.com/release/album/radiohead/kid-a", "genres": ["experimental rock", "avant-garde", "alternative rock", "art rock", "electronica", "post-rock"], "desc_lfm_album": "Kid A is the fourth studio album by the English rock band Radiohead, released on 2 October 2000 by Parlophone. On the verge of a breakdown after promoting Radiohead's 1997 album OK Computer, songwriter Thom Yorke envisioned a radical change in direction. Radiohead replaced their rock sound with synthesisers, drum machines, the ondes Martenot, string orchestras and brass instruments, incorporating influences from genres such as electronic music, krautrock, jazz, and 20th-century classical music. They recorded Kid A with OK Computer producer Nigel Godrich in Paris, Copenhagen, Gloucestershire and their hometown Oxford, England. The sessions produced over 20 tracks; Radiohead saved .", "desc_lfm_artist": "Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock.", "desc_mb_album": "", "desc_mb_artist": "Formed in Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 486, "title": "It Was Hot, We Stayed in the Water", "artist": "The Microphones", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/it-was-hot-we-stayed-in-the-water-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1071-the-microphones-it-was-hot-we-stayed-in-the-water.php", "aoty_critic_score": 83, "aoty_user_score": 81, "mbid": "2cbcc27b-5480-3bb1-b45a-e698616930d9", "yt_id": "SdzmkbauGIg", "rym": "https://rateyourmusic.com/release/album/the-microphones/it-was-hot-we-stayed-in-the-water", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Microphones was the solo project of American musician Phil Elverum from 1996 to 2003, with comebacks in 2007 and 2019 to 2022 respectively, Its sound is best described as lo-fi \"fuzz folk,\" including drum-crashing, bass-thrashing sonic freakouts, strummy classical guitar love songs, angelic vocal choirs, and almost-whispered vocals over harmoniums and bell kits.\n\nIn 2004, Elverum abandoned the \"Microphones\" name to begin recording as Mount Eerie", "desc_mb_album": "", "desc_mb_artist": "Regarding capitalization of name and titles, please see following:\nhttps://musicbrainz.org/edit/67109745\nhttps://musicbrainz.org/edit/131923778\nhttps://pwelverumandsun.bandcamp.com/\nhttps://www.pwelverumandsun.com/collections/by-the-microphones", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave"]}, {"n": 487, "title": "Dopethrone", "artist": "Electric Wizard", "year": 2000, "cover": "https://dn710302.ca.archive.org/0/items/mbid-aec7ca73-36ff-41aa-9ad1-57b2d4cc41bb/mbid-aec7ca73-36ff-41aa-9ad1-57b2d4cc41bb-10614867040.png", "aoty_url": "https://www.albumoftheyear.org/album/4058-electric-wizard-dopethrone.php", "aoty_critic_score": 83, "aoty_user_score": 88, "mbid": "5ebf4f0a-61ba-3829-9d0c-0a0e5ad8897e", "yt_id": "eaMbKZPBruU", "rym": "https://rateyourmusic.com/release/album/electric-wizard/dopethrone", "genres": ["doom metal", "stoner rock", "rock", "Metal", "Rock"], "desc_lfm_album": "Dopethrone is the third studio album by English doom metal band Electric Wizard. It was released on 28 November 2000 through Rise Above Records and re-released by the same label in 2004 and 2007 with an extra song. Jus Oborn late spoke about the development of Dopethrone as being part of trilogy with Come My Fanatics…, and Supercoven, noting that he looked upon these albums with fondness and that \"With those albums, I believe we really found our mark as a band. When we did our first album, none of us had ever been into the studio before – and .", "desc_lfm_artist": "Electric Wizard is a band from Dorset, UK. They have a distinct, yet traditional doom metal sound that incorporates stoner and sludge traits, with lyrics typically involving the occult, witchcraft, H.P. Lovecraft, horror films and marijuana. During 2003, founding members Tim Bagshaw and Mark Greening left to form the band Ramesses, leaving guitarist/vocalist Jus Oborn the only remaining founding member.\n\nThe oblivion and ecstasy of crushing doom and high grade marijuana", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 488, "title": "Music", "artist": "Madonna", "year": 2000, "cover": "https://dn710705.ca.archive.org/0/items/mbid-2b06eb8e-236c-3efe-a4dc-3a83802d90a9/mbid-2b06eb8e-236c-3efe-a4dc-3a83802d90a9-9752299103.png", "aoty_url": "https://www.albumoftheyear.org/album/4082-madonna-music.php", "aoty_critic_score": 73, "aoty_user_score": 80, "mbid": "0a0808d5-8f78-382f-87af-f9d6fedf3f68", "yt_id": "ZlpluMUSsHg", "rym": null, "genres": ["electro", "synth-pop", "electropop", "disco", "dance-pop", "house"], "desc_lfm_album": "Music is the eighth studio album by Madonna, released on September 18, 2000, via Maverick and Warner Bros. Records. Following the success of her previous album Ray of Light, she intended to embark on a tour. However, her record company encouraged her to return to the studio and record new music before going on the road. Her collaboration with French producer Mirwais resulted in a more experimental direction for the album, with additional production from William Orbit. Music incorporates many different genres into its overall dance-pop and electronica vibe, with influences from funk, house, rock, country and folk. Elaborating a .", "desc_lfm_artist": "Madonna Louise Ciccone (/tʃɪˈkoʊni/ chih-KOH-nee; born 16 August 1958) is an American singer, songwriter, record producer, and actress. Known as the \"Queen of Pop\", she is recognised for her continual reinvention and versatility in music, songwriting, and visual presentation. Her work frequently incorporates social, political, sexual, and religious themes, generating both critical acclaim and controversy. Madonna is considered a significant cultural", "desc_mb_album": "", "desc_mb_artist": "If you're looking for ''Greatest Hits Vol. 2'' or something similar, it is already listed under the correct name ''[https://musicbrainz.org/release-group/a0aa8b0a-5e10-3627-afde-7235b86042f6|GHV2]''. \r\nPlease '''do not''' add it again.\r\n\r\nRelease labels according to date: (all releases should follow this*)\r\nWMG parent (1982-2009) as Sire (1982–1995), Maverick (1992–2004), Warner Bros. (2004–2010), Live Nation Artists (2009-)\n\n-------\n\nBorn in Bay City, Michigan, USA, as Madonna Louise Ciccone, Madonna had the extra middle name Veronica added in childhood as confirmation of her family's Catholicism.\r\nHer music career took off in the early 1980's under the performance name [http://musicbrainz.org/artist/79239441-bfd5-4981-a70c-55c3f15c1287.html|Madonna].\r\n\r\nIt is believed her legal name has ", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "alberto_gu"]}, {"n": 489, "title": "Selmasongs", "artist": "Björk", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5799-selmasongs_211351.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5799-bjork-selmasongs.php", "aoty_critic_score": 73, "aoty_user_score": 81, "mbid": "14a8c576-44af-36a1-b896-81901705b5b0", "yt_id": "YYPbUJSLyW4", "rym": null, "genres": [], "desc_lfm_album": "Selmasongs is the first soundtrack album by Icelandic musician Björk. It was released on September 18, 2000, by One Little Indian Records to promote and accompany the film Dancer in the Dark. In the film, Björk starred as Selma Ježková, a Czech immigrant who has moved to the United States. The album features classical arrangements, as well as melodies and beats composed of sounds from mundane objects, such as factory machines and trains. .", "desc_lfm_artist": "Björk Guðmundsdóttir (born 21 November 1965), known mononymously as Björk, is an Icelandic singer, songwriter, composer, record producer, and actress. Recognised for her distinctive voice, three-octave vocal range, and unconventional public image, she has developed an eclectic musical style over a career spanning five decades, incorporating elements of electronic, pop, dance, trip hop, jazz, and avant-garde music. She is widely regarded as an influential figure in electronic and experimental music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "armandwave", "verygooood"]}, {"n": 490, "title": "Relationship of Command", "artist": "At the Drive-In", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/relationship-of-command-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1165-at-the-drive-in-relationship-of-command.php", "aoty_critic_score": 85, "aoty_user_score": 86, "mbid": "b7f5ed97-bb72-31fb-acd8-4bad86d95a58", "yt_id": "4Uc0uYIU_gE", "rym": "https://rateyourmusic.com/release/album/at-the-drive-in/relationship-of-command", "genres": ["Punk"], "desc_lfm_album": "Relationship of Command is the third studio album by American post-hardcore band At the Drive-In, released on September 12, 2000. The album combines an aggressive edge with a melodic drive, harmonious, emotive vocals, and surreal lyrics. While it continues in the alternative style of At the Drive-In's previous albums, Relationship of Command is seen as a more well-rounded album than its predecessors. Initially received positively by critics, the album is now seen not only as one of the most influential post-hardcore albums of the 2000s, but also as one of the most accomplished recent works in the wider rock spectrum. .", "desc_lfm_artist": "At the Drive-In was an American post-hardcore band from El Paso, Texas, formed in 1994. The band most recently consisted of Cedric Bixler-Zavala (vocals), Omar Rodríguez-López (guitar, vocals), Paul Hinojos (bass), Tony Hajjar (drums) and Keeley Davis (guitar, vocals). After several early line-up changes, the band solidified into a five-piece, consisting of Bixler-Zavala, Rodríguez-López, Jim Ward, Hinojos and Hajjar. At the Drive-In released three studio albums and five EPs before breaking up in 2001.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 491, "title": "Felt Mountain", "artist": "Goldfrapp", "year": 2000, "cover": "https://dn710906.ca.archive.org/0/items/mbid-d5b80206-c691-400d-95d7-830311451af9/mbid-d5b80206-c691-400d-95d7-830311451af9-2919147114.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4061-goldfrapp-felt-mountain.php", "aoty_critic_score": 73, "aoty_user_score": 81, "mbid": "4999b316-bacf-3bf9-9cf9-07c4ebae470a", "yt_id": "iKAsuvwDP_Q", "rym": "https://rateyourmusic.com/release/album/goldfrapp/felt-mountain", "genres": ["baroque pop", "art pop", "chamber pop", "trip hop", "ambient pop", "alternative pop"], "desc_lfm_album": "Felt Mountain is the debut album by English electronic duo Goldfrapp. It was released by Mute Records on 11 September 2000 in the United Kingdom. The album features Alison Goldfrapp's synthesized vocals in cinematic scope, and takes influence from a variety of music styles such as 1960s pop, cabaret, folk, and electronica. Felt Mountain was a top seventy-five album in Goldfrapp's native United Kingdom, and was certified gold in October 2001. It was generally well received by music critics, and it was described as \"simultaneously smarmy and seductive, yet elegant and graceful\". In 2001, the album was shortlisted for the .", "desc_lfm_artist": "Goldfrapp are an English electronic band from London, formed in 1999 which consists of Alison Goldfrapp (vocals, synthesizer) and Will Gregory (synthesizer). Despite favourable reviews and a short-listing for the Mercury Prize, the début studio album Felt Mountain did not chart highly. Goldfrapp's second album Black Cherry, which incorporated glam rock and synthpop sounds, was released in 2003. The album influenced the same dance-oriented sound of their third album Supernature.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "verygooood"]}, {"n": 492, "title": "Contemporary Movement", "artist": "Duster", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33176-contemporary-movement_151449.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33176-duster-contemporary-movement.php", "aoty_critic_score": 81, "aoty_user_score": 82, "mbid": "2d5973bd-e7e0-37aa-9108-31b6d92f8dff", "yt_id": "xZzMvWqFtV0", "rym": "https://rateyourmusic.com/release/album/duster/contemporary-movement", "genres": ["Alternative Rock"], "desc_lfm_album": "Contemporary Movement is the second studio album by American slowcore band Duster. The album was released in August 22nd, 2000 on Up Records. The album's cover art depicts the parking structures at the Seattle–Tacoma International Airport. The same airport is shown in the visualizers made by the Numero Group. Unlike Duster's previous album Stratosphere, all three band members were involved in the making of Contemporary Movement. .", "desc_lfm_artist": "Duster is a American slowcore band from San Jose, California formed in 1996 with an initial lineup of Clay Parton and Canaan Amber, former members of bands Calm and Mohinder. They are known for their unique lo-fi sound, recording their music onto cassette decks and similar equipment at their home studio nicknamed Low Earth Orbit.\n\nThe duo released two demo tapes in the same year as their formation, Christmas Dust and On The Dodge. In 1997, they released their debut 7\" EP Transmission, Flux via Up Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 493, "title": "Spirit They're Gone, Spirit They've Vanished", "artist": "Animal Collective", "year": 2000, "cover": "https://cdn2.albumoftheyear.org/600x0/album/312-spirit-theyre-gone-spirit-theyve-vanished_171510.jpg", "aoty_url": "https://www.albumoftheyear.org/album/312-animal-collective-spirit-theyre-gone-spirit-theyve-vanished.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "b15e243c-8279-3b5b-b773-fca282c8ce54", "yt_id": "J_pyaRPzZ3A", "rym": null, "genres": [], "desc_lfm_album": "Spirit They're Gone, Spirit They've Vanished is the first collaborative studio album by Avey Tare (David Portner) and Panda Bear (Noah Lennox), released in August 2000. It was later retroactively classified as the debut album by experimental pop band Animal Collective. The album was first released as a CD on the band's own Animal label (now known as Paw Tracks) with only 2000 copies produced. It was reissued as a double CD along with Danse Manatee in 2003 on FatCat Records, and later on limited edition vinyl through FatCat. Both UK and US pressings used DMM mastering. All of the .", "desc_lfm_artist": "Animal Collective are an American experimental pop band formed in Baltimore, Maryland in 1999. The group consists
