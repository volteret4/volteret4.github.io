hp", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": null, "yt_id": "41H3QNGbyo4", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "ASIAN KUNG-FU GENERATION (アジアン・カンフー・ジェネレーション Ajian Kanfuu Jenereeshon) is a Japanese alternative/indie rock band formed in Yokohama in 1996.\n\nMembers:\nVocals & Guitar: 後藤正文 (Masafumi Gotoh)\nGuitar & Vocals: 喜多建介 (Kensuke Kita)\nBass & Vocals: 山田貴洋 (Takahiro Yamada)\nDrums: 伊地知潔 (Kiyoshi Ijichi)\n\n\nHistory:\n\nStarting out as a college band, Asian Kung-Fu Generation released a series of independent EPs featuring lyrics mostly sung in English.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 284, "title": "From a Basement on the Hill", "artist": "Elliott Smith", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/510-from-a-basement-on-the-hill_105253.jpg", "aoty_url": "https://www.albumoftheyear.org/album/510-elliott-smith-from-a-basement-on-the-hill.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": "73c74665-e920-3bf1-bfcf-27d2fd7b9c09", "yt_id": "SNNPtsZPSWU", "rym": "https://rateyourmusic.com/release/album/elliott-smith/from-a-basement-on-the-hill", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "From a Basement on the Hill is the sixth and final studio album by American singer-songwriter Elliott Smith. Recorded from 2000 to 2003, and faced with multiple delays due to Smith's personal problems that resulted in his death, it was released posthumously on October 18, 2004, through Anti- and Domino, almost a year after his death. The album was initially planned as a double album, and was incomplete at the time of Smith's death. Many of the songs Smith intended for the album remained unfinished, in some cases lacking only vocals. Smith's family hired his former producer Rob Schnapf and .", "desc_lfm_artist": "Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "verygooood"]}, {"n": 285, "title": "Panopticon", "artist": "Isis", "year": 2004, "cover": "https://dn721906.ca.archive.org/0/items/mbid-e27dc788-3911-4785-b39c-abed4ee2d1cc/mbid-e27dc788-3911-4785-b39c-abed4ee2d1cc-6396978283.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1753-isis-panopticon.php", "aoty_critic_score": 84, "aoty_user_score": 85, "mbid": "4d0ec287-514f-32bc-8939-2705f49ca44c", "yt_id": "C7dX90MmITg", "rym": "https://rateyourmusic.com/release/album/isis/panopticon", "genres": ["alternative rock", "post-rock", "alternative metal", "atmospheric sludge metal", "post-metal", "sludge metal"], "desc_lfm_album": "Writing for the record began in September 2003, soon after Isis had relocated from Boston to Los Angeles. According to guitarist Mike Gallagher, “we started working on ideas for songs and sounds as individuals, in pairs or as a whole group until we were able to shape the ideas into songs that we were all happy with and could stand behind”. Whilst some tracks originated from \"little jams\" the band would do at sound check, the majority of the album was created in time dedicated to writing new material. Gallagher adds that “musically speaking, Panopticon came out a couple of .", "desc_lfm_artist": "There are at least eight artists that have used the name Isis:\n\n1. Isis was a Los Angeles, CA based band that started in Boston, MA in 1997. They borrowed from and helped to evolve a sound pioneered by the likes of Neurosis and Godflesh, creating heavy music consisting primarily of lengthy songs that focus on repetition and evolution of structure and texture. As such, their music encompasses a considerable range of genres. Some of these include sludge metal", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 286, "title": "Terrifyer", "artist": "Pig Destroyer", "year": 2004, "cover": "https://i.discogs.com/hZNBphI8iWo4iDhxb3ki476Ej6atYg0L5pAZVilGuC0/rs:fit/g:sm/q:90/h:596/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE4ODIz/ODkxLTE2NzQwNjU0/NTgtNTc2Ny5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/24476-pig-destroyer-terrifyer.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "4d186339-63d5-3acd-9147-6027c2a7df23", "yt_id": "gJVW4qnKeFo", "rym": "https://rateyourmusic.com/release/album/pig-destroyer/terrifyer", "genres": ["Metal", "Punk"], "desc_lfm_album": "Released in 2004. Recorded at ‘Brians House’ and Visceralsound, Bethesda, MD between August 2002 and July 2004. Engineered, Produced & mastered by Scott Hull. Cover art by Chris Taylor Executively produced by Matthew F. Jacobson Design by Jonathan Canady & JR Hayes. Guitar solo on ‘Towering Flesh’ by Matthew Mills. Backup vocals on ‘Crawl Of Time’ by Richard ‘Grindfather’ Johnson. Deathgrowl and vocals on ‘Lost Cause’ by Katherine Katz. ‘Scott Hull abuses ESP Guitars, Vader Cabinets, In Tune picks, Randall Amps, Sunn amps and Marshall amps. Brian Harvey abuses Axis drum pedals.’ Almost all versions include footnote: ‘TO BE PLAYED .", "desc_lfm_artist": "Pig Destroyer is a popular grindcore band based in Virginia, USA first formed in 1997. Pig Destroyer have pushed the boundaries of the grind genre and gained a large following. Their unique sound is notable for its absence of bass guitar on their studio albums.\n\nThe band was formed in 1997 by vocalist J.R. Hayes (former vocalist Enemy Soil) in 1997, guitarist Scott Hull (Agoraphobic Nosebleed, Anal Cunt, Japanese Torture Comedy Hour, and more), and drummer John Evans.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "sdecandelario"]}, {"n": 287, "title": "SMiLE", "artist": "Brian Wilson", "year": 2004, "cover": "https://ia600509.us.archive.org/35/items/mbid-b7b2aa52-2189-486a-aa6f-de095ddfd019/mbid-b7b2aa52-2189-486a-aa6f-de095ddfd019-1602455849.jpg", "aoty_url": "https://www.albumoftheyear.org/album/501-brian-wilson-smile.php", "aoty_critic_score": 92, "aoty_user_score": 80, "mbid": "7eea3a40-7c24-34f9-aa48-958edb5145c5", "yt_id": "VS4sKZMkJOQ", "rym": null, "genres": ["psychedelic rock", "classic rock", "pop rock", "chamber pop"], "desc_lfm_album": "Smile (also referred to as Brian Wilson Presents Smile) is the fifth studio album by Brian Wilson, released on September 28, 2004. The project was originally conceived in 1966 as Smile, a concept album recorded by The Beach Boys written in collaboration between Wilson and lyricist Van Dyke Parks. It was intended to succeed the group's 11th studio album Pet Sounds and was based on the engineering methods of their single \"Good Vibrations\". Many years after the project was shelved due to personal and technical difficulties with recording, Wilson chose to revisit the material with Parks as a specially arranged .", "desc_lfm_artist": "Brian Douglas Wilson (June 20, 1942, Inglewood, California, United States - June 11, 2025, Beverly Hills, California, United States) was an American singer-songwriter, producer, and musician, best known for being the principal songwriter and co-lead singer for The Beach Boys, co-founded with brothers Carl and Dennis. Once known for his iconic head voice and falsetto, much of Brian's most well-known work is tinged with melancholy and existentialism.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "armandwave"]}, {"n": 288, "title": "Anniemal", "artist": "Annie", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/897-anniemal_220632.jpg", "aoty_url": "https://www.albumoftheyear.org/album/897-annie-anniemal.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "a2a25310-5f2d-3906-b930-9aaf4b8f915e", "yt_id": "RqwuuWYNFJk", "rym": "https://rateyourmusic.com/release/album/annie/anniemal/", "genres": [], "desc_lfm_album": "Anniemal is the debut album by Norwegian singer Annie. It was first released by 679 Recordings in September 2004. Annie began recording music in 1999 with her boyfriend, Tore Kroknes, who died in 2001. She returned to recording later that year, collaborating with Richard X, Röyksopp, and Timo Kaukolampi. The album was mainly recorded between 2001 and 2004. Four singles were released from the album: \"Chewing Gum\", \"Heartbeat\", \"Happy Without You\" and \"Always Too Late\". Upon the albums release it was successful in her native Norway, peaking at No.6 on the Norwegian Album Charts. Though it was not heavily promoted, .", "desc_lfm_artist": "Annie is the stage name of the Norwegian pop artist Anne Lilia Berge Strand (born 21 November 1977 in Trondheim). She currently resides in Berlin. Her debut album, Anniemal, was released in 2004. The name originally was an idea of her late boyfriend Tore Kroknes, who produced her 1999 single \"Greatest Hit\". Annie worked with Timo Kaukolampi (ex-Op:l Bastards), as well as Richard X, who produced and co-write the single \"Chewing Gum\" and the Geri Halliwell diss \"Me Plus One\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "sdecandelario"]}, {"n": 289, "title": "Antics", "artist": "Interpol", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/522-antics_203515.jpg", "aoty_url": "https://www.albumoftheyear.org/album/522-interpol-antics.php", "aoty_critic_score": 78, "aoty_user_score": 81, "mbid": "bc7740e1-02c9-3ab7-9869-0e0c79acf941", "yt_id": "atDw4l46TJY", "rym": "https://rateyourmusic.com/release/album/interpol/antics", "genres": [], "desc_lfm_album": "Antics is the second album by New York City-based band Interpol, released in 2004 selling 488,000 copies in the U.S. and over 100,000 in the UK. Although more confident than its predecessor, Turn on the Bright Lights, it largely repeats the same formula of sparse arrangement driven by bass throb and strong drums, with powerful, evocative lyrics sung in a resonant, somber voice by vocalist Paul Banks and intricate guitar lines, reminiscent of The Chameleons. Musically speaking, the general tone of this record is remarkably brighter than its darker predecessor. It made the top 10 list of several music critics .", "desc_lfm_artist": "Interpol is an American post-punk band formed in Manhattan, New York, in 1997. They played an important part in the post-punk revival of the 2000s. The band consists of Paul Banks (vocals and guitar), Sam Fogarino (drums), and Daniel Kessler (guitar and backing vocals).\n\nThe band's sound is generally a mix of staccato bass and rhythmic, harmonized guitar, with a snare heavy mix, drawing comparisons to post-punk bands such as Joy Division and The Chameleons.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 290, "title": "Reise, Reise", "artist": "Rammstein", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33874-reise-reise_224506.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33874-rammstein-reise-reise.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "ea9bf147-abbd-39df-b927-46fc945a5140", "yt_id": "N94S9u0kTLA", "rym": "https://rateyourmusic.com/release/album/rammstein/reise-reise", "genres": [], "desc_lfm_album": "Reise, Reise (Low German language (literally): \"Journey, Journey\", traditional wake-up call on ships, derived from engl. \"to rise\") is Neue Deutsche Härte band Rammstein's fourth studio album. It was released on 27 September 2004 in Germany and followed shortly by its release across Europe. It was released in North America on 16 November 2004. It was in the top ten in several European charts and a number one hit in Germany, Austria, Switzerland, Iceland, Finland, Estonia and Mexico. As of February 2006, the album has shipped 1.5 million copies globally. As used in \"Reise, Reise aufstehen! Kommt hoch nach alter .", "desc_lfm_artist": "Rammstein is a German Neue Deutsche Härte band formed in Berlin in 1994. The group’s lineup—consisting of Till Lindemann (lead vocals), Richard Kruspe (lead guitar), Paul Landers (rhythm guitar), Oliver Riedel (bass), Christoph Schneider (drums), and Christian \"Flake\" Lorenz (keyboards)—has remained unchanged throughout their career. Their songwriting process typically involves Lindemann composing and performing lyrics to instrumental arrangements written by the rest of the band.", "desc_mb_album": "", "desc_mb_artist": "Style issues:\r\n[http://musicbrainz.org/show/edit/?editid=8315084|Discussion of the spelling of ''Links 2-3-4''].", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 291, "title": "Samurai Champloo Music Record: Impression", "artist": "Force Of Nature / Nujabes / Fat Jon", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/154261-samurai-champloo-music-record-impression.jpg", "aoty_url": "https://www.albumoftheyear.org/album/154261-force-of-nature-nujabes-fat-jon-samurai-champloo-music-record-impression.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": "e8c3e38f-de01-30e4-af7c-5eabc68d3471", "yt_id": "hosW9TTC3G0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Please correct your tags according to the release of Impression on http://discogs.com.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "sdecandelario"]}, {"n": 292, "title": "Last Exit", "artist": "Junior Boys", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/last-exit.jpg", "aoty_url": "https://www.albumoftheyear.org/album/507-junior-boys-last-exit.php", "aoty_critic_score": 84, "aoty_user_score": 76, "mbid": "0f9fdb50-bc15-3659-82ea-09c85be777d6", "yt_id": "Ro0UfcASa2s", "rym": "https://rateyourmusic.com/release/album/junior-boys/last-exit/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "A Hamilton, Ontario-based electronic pop group, Junior Boys began as a duo with its duties split between Jeremy Greenspan and Johnny Dark. Influenced by a number of music sectors — including arty synthpop, minimal techno, uk garage, and contemporary hip-hop — they made a demo with no positive results. Dark opted to leave the group, but former Warp employee Nick Kilroy eventually heard the songs and became interested enough to begin his KIN label with Junior Boys as its first artist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave"]}, {"n": 293, "title": "You Fail Me", "artist": "Converge", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4322-you-fail-me_003710.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4322-converge-you-fail-me.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "2b5ed727-a499-3b2c-ae17-3daeac886d14", "yt_id": "CeWDfSFcwf4", "rym": "https://rateyourmusic.com/release/album/converge/you-fail-me-6", "genres": ["Metal", "Punk"], "desc_lfm_album": "You Fail Me is an album by Massachusetts, USA, band Converge, released on September 20, 2004. It is their first release on Epitaph Records, previously being signed to Equal Vision Records. The record was the band's first to chart commercially, reaching a high of 171st place in the Billboard 200. It also charted at number 12 in the Top Heatseekers chart and number 16 in the Independent Albums listings. .", "desc_lfm_artist": "Converge is an American band, formed in February of 1990 in Salem, Massachusetts, United States. Playing a blend of hardcore punk and extreme metal, this pioneer outfit helped define a lot of the rudiments of the fast-burgeoning metalcore and mathcore genres formed by vocalist Jacob Bannon and guitarist Kurt Ballou in Salem, Massachusetts in 1990. During the recording of their seminal fourth album Jane Doe, the group became a four-piece with the departure of guitarist Aaron Dalbec and the addition of bassist Nate Newton and drummer Ben Koller.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 294, "title": "Abattoir Blues / The Lyre of Orpheus", "artist": "Nick Cave & the Bad Seeds", "year": 2004, "cover": "https://dn721206.ca.archive.org/0/items/mbid-9c672e25-d735-4fc8-a258-afe81640086a/mbid-9c672e25-d735-4fc8-a258-afe81640086a-42531538540.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "f0ffb9ec-fcb5-3e03-9a1b-3f018472d831", "yt_id": "2bYtFBJajI0", "rym": null, "genres": ["blues rock", "alternative rock", "gothic rock", "indie rock", "gospel", "rock"], "desc_lfm_album": "The album was produced by Nick Launay at Studio Ferber in Paris in March–April 2004 and Nick Cave used The Bad Seeds line up of Mick Harvey, Thomas Wydler, Martyn Casey, Conway Savage, Jim Sclavunos, Warren Ellis, and James Johnston. It was the first album by the group for which Blixa Bargeld did not perform – English guitarist and organist Johnston, of the group Gallon Drunk, replaced Bargeld. Cave decided to split drumming duties for the two parts, with Sclavunos on Abattoir Blues and Wydler on The Lyre of Orpheus. According to Launay, the whole album was completed in twelve .", "desc_lfm_artist": "Nick Cave & the Bad Seeds is an Australian post-punk band formed in Melbourne in 1983 by vocalist Nick Cave, multi-instrumentalist Mick Harvey and guitarist Blixa Bargeld. The band has featured international personnel throughout its career and has released a lengthy series of studio albums and completed numerous international tours. \n\nThe band presently consists of Cave, violinist and multi-instrumentalist Warren Ellis, bassist Martyn P. Casey (all from Australia)", "desc_mb_album": "", "desc_mb_artist": "Some releases are credited to \"Nick Cave & the Bad Seeds\" others are \"Nick Cave and the Bad Seeds.\" This is intentional on the part of the editors and matches the various releases. If you need to group them or normalize them in your own collection, use the %albumartistsort% variable (or something like \"$if2(%albumartistsort%,%albumartist%,%artistsort%,%artist%)\") in your tagger.\r\n\r\nDo not make arbitrary edits to the artist credits unless you can prove that your edit matches the release.", "heard_by": ["Frikomid", "armandwave"]}, {"n": 295, "title": "Funeral", "artist": "Arcade Fire", "year": 2004, "cover": "https://dn711006.ca.archive.org/0/items/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1-31589070944.jpg", "aoty_url": "https://www.albumoftheyear.org/album/506-arcade-fire-funeral.php", "aoty_critic_score": 90, "aoty_user_score": 87, "mbid": "05affa96-5959-32da-8d75-1c9eb985ca59", "yt_id": "qg7XMMAuCJo", "rym": "https://rateyourmusic.com/release/album/arcade-fire/funeral-5", "genres": ["art rock", "baroque pop", "art pop", "chamber pop", "indie rock", "alternative punk"], "desc_lfm_album": "Funeral is the debut full-length album by Canadian indie rock band Arcade Fire, released on September 14, 2004 in North America by Merge Records and on February 28, 2005 in Europe by Rough Trade Records. It was given its title because several band members had recently lost members of their families: Régine Chassagne's grandmother died in June 2003, Win and William Butler's grandfather (swing musician Alvino Rey) in March 2004, and Richard Reed Parry's aunt in April 2004. Preliminary recordings for Funeral were made during the course of a week in August 2003 at the Hotel2Tango in Montreal, Quebec, and .", "desc_lfm_artist": "Arcade Fire is a Canadian indie rock band formed in Montreal, Quebec, Canada in 2001. The band consists of Win Butler (vocals, guitar, piano), Régine Chassagne (vocals, accordion, keyboards, hurdy gurdy, drums), Richard Reed Parry (bass, guitar), Tim Kingsbury (bass), and Jeremy Gara (drums). Montreal percussionist Dane Mills performed on the EP and in early live shows.  Will Butler (keyboards, guitar) left the band in 2022 to focus on his solo career. The touring band includes horn players and violinists.", "desc_mb_album": "", "desc_mb_artist": "Please do not submit a mod to rename this group to \"The Arcade Fire.\" The issue has been [http://musicbrainz.org/mod/search/results.html?automod=&mod_type=1&moderator_id=63118&voter_type=0&voter_id=63118&artist_type=3&artist_id=164813&orderby=desc&minid=&maxid=&isreset=0|raised and voted down] multiple times.\r\n&nbsp;&nbsp;&nbsp;&nbsp;-ojnkpjg", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 296, "title": "Showtime", "artist": "Dizzee Rascal", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/showtime.jpg", "aoty_url": "https://www.albumoftheyear.org/album/517-dizzee-rascal-showtime.php", "aoty_critic_score": 82, "aoty_user_score": 72, "mbid": "3955be9d-97de-3d05-8564-bd45359c1c1e", "yt_id": "8OXda9sSFfM", "rym": "https://rateyourmusic.com/release/album/dizzee-rascal/showtime-2", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Dylan Mills, known professionally as Dizzee Rascal (born September 18th, 1984), is a grime solo artist, formerly a Roll Deep crew member, who emerged from the UK Garage music scene. His music was a blend of garage MCing, conventional rap, grime and ragga, with some more eclectic samples.\n\nDizzee began MCing on pirate radio and at raves at fifteen, but since his mainstream success he has distanced himself from the fledgling scene. Rascal grew up in the East End of London in south Bow in a council estate", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 297, "title": "Thunder Lightning Strike", "artist": "Go Team", "year": 2004, "cover": "https://dn710109.ca.archive.org/0/items/mbid-45cd0da4-b9e7-3bf0-95d9-1c81a3be2db2/mbid-45cd0da4-b9e7-3bf0-95d9-1c81a3be2db2-30846793596.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "370f0e88-abf3-3a22-a7cd-9cb0c3ebdc61", "yt_id": "HVAy_PhMdxo", "rym": null, "genres": ["electro", "indie rock", "leftfield", "alternative hip hop", "alternative dance", "indietronica"], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 298, "title": "Leviathan", "artist": "Mastodon", "year": 2004, "cover": "https://dn710904.ca.archive.org/0/items/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0-25054292616.png", "aoty_url": "https://www.albumoftheyear.org/album/939-mastodon-leviathan.php", "aoty_critic_score": 95, "aoty_user_score": 85, "mbid": "7902c486-f670-3336-9850-b4112079d9e6", "yt_id": "4Kp0LxKTZhk", "rym": "https://rateyourmusic.com/release/album/mastodon/leviathan", "genres": ["heavy metal", "doom metal", "progressive metal", "sludge metal", "rock", "Metal"], "desc_lfm_album": "Leviathan is the sophomore full-length studio album by American metal band Mastodon. It was released on August 31, 2004 via Relapse Records. Leviathan was conceived as a concept album based on Herman Melville's 1851 novel Moby-Dick; or, the Whale, with the tracks \"Iron Tusk\", \"Blood and Thunder\" and \"Seabeast\" released as singles. Magazines Revolver, Kerrang! and Terrorizer awarded the record with \"Album of the Year\" in 2004. Leviathan was also released with an audio DVD in a limited edition set with a black and gold slipcase. The album brought Mastodon great critical acclaim and, thanks to the ensuing tour, a .", "desc_lfm_artist": "Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 299, "title": "Ashes of the Wake", "artist": "Lamb of God", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9601-ashes-of-the-wake_053906.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9601-lamb-of-god-ashes-of-the-wake.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "6a44f03b-e1b1-359e-9c3e-3b7821b4e186", "yt_id": "BsnqTipaPN0", "rym": "https://rateyourmusic.com/release/album/lamb-of-god/ashes-of-the-wake", "genres": [], "desc_lfm_album": "Ashes of the Wake is the fourth studio album by American heavy metal band Lamb of God, released in 2004. The album debuted at number 27 on the Billboard 200, selling 35,000 copies in its first-week and was rated by Guitar World as the 49th greatest Guitar Album of all Time. The album is more political than their previous work, aimed at the war in Iraq, with songs such as \"Ashes of the Wake\" (which includes snippets of former staff sergeant and former Marine Jimmy Massey in an interview after his return from the Iraq War), \"Now You've Got Something .", "desc_lfm_artist": "Lamb of God is an American groove metal band, originally formed under the name Burn the Priest.\n\nThe roots of Lamb of God were planted in the year 1990, when Mark Morton, Chris Adler and John Campbell were friends at Virginia Commonwealth University. The trio began playing at Adler's house in Richmond weathering chilly conditions. \"There was no heat in the house,\" recalls Campbell. \"We would hang around the kerosene heaters, get really drunk and write metal songs. Fumes and Black Label beer were definitely what fueled our early days.\"", "desc_mb_album": "", "desc_mb_artist": "The former name of this band was [http://musicbrainz.org/artist/b27c15ef-b146-41f4-b1ac-c8ac50713e8e.html|Burn the Priest], please do not merge the two.", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 300, "title": "Medúlla", "artist": "Björk", "year": 2004, "cover": "https://dn711307.ca.archive.org/0/items/mbid-6f01bec9-ae3e-3b75-a667-49931ad038bd/mbid-6f01bec9-ae3e-3b75-a667-49931ad038bd-2713386747.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2644-bjork-medulla.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "4b2ee53c-6527-30e5-940c-c426a7a6f618", "yt_id": "hDAgXJAxUNQ", "rym": "https://rateyourmusic.com/release/album/bjork/medulla", "genres": ["art pop", "avant-garde pop", "leftfield", "idm", "beatboxing", "central asian throat singing"], "desc_lfm_album": "Medúlla is the fifth studio album by Icelandic recording artist Björk. It was released on 30 August 2004 in the United Kingdom by One Little Indian Records and in the United States by Elektra Entertainment. After the release of her electronic–influenced previous album Vespertine (2001), Björk intended to make an album almost entirely a cappella constructed with human vocals. For the project, she collaborated with vocal artists such as Mike Patton of rock band Faith No More, beatboxers Rahzel and Dokaka, as well as Inuit throat singer Tanya Tagaq. The album's title derives from the Latin word for \"marrow\". .", "desc_lfm_artist": "Björk Guðmundsdóttir (born 21 November 1965), known mononymously as Björk, is an Icelandic singer, songwriter, composer, record producer, and actress. Recognised for her distinctive voice, three-octave vocal range, and unconventional public image, she has developed an eclectic musical style over a career spanning five decades, incorporating elements of electronic, pop, dance, trip hop, jazz, and avant-garde music. She is widely regarded as an influential figure in electronic and experimental music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "sdecandelario"]}, {"n": 301, "title": "Soviet Kitsch", "artist": "Regina Spektor", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/375-soviet-kitsch_002243.jpg", "aoty_url": "https://www.albumoftheyear.org/album/375-regina-spektor-soviet-kitsch.php", "aoty_critic_score": 71, "aoty_user_score": 82, "mbid": "5f5e3973-417c-3e12-908c-97ff27336d5f", "yt_id": "gaekynvO5FA", "rym": "https://rateyourmusic.com/release/album/regina-spektor/soviet-kitsch-3/", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "Soviet Kitsch is the third studio album and major-label debut by American singer-songwriter Regina Spektor. It was released on May 2, 2003, via Shoplifter Records. The title is drawn from Milan Kundera's expression for the vacuous aesthetics of Stalinist-style communism, a theme in his book The Unbearable Lightness of Being. .", "desc_lfm_artist": "Regina Ilyinichna Spektor is a Russian–born American singer, songwriter and pianist.\n\nAfter self-releasing her first three records and gaining popularity in New York City's independent music scenes, particularly the anti-folk scene centered on New York City's East Village, Spektor signed with Sire Records in 2004 and began achieving greater mainstream recognition. After giving her third album a major label re-release, Sire released Spektor's fourth album, Begin to Hope, which achieved a Gold certification by the RIAA.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik"]}, {"n": 302, "title": "Epitaph", "artist": "Necrophagist", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/16122-epitaph_221253.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16122-necrophagist-epitaph.php", "aoty_critic_score": 80, "aoty_user_score": 86, "mbid": "f8432d63-411b-36a8-94f4-01c7bf11bcab", "yt_id": "TilRtvLqktA", "rym": "https://rateyourmusic.com/release/album/necrophagist/epitaph", "genres": ["Metal"], "desc_lfm_album": "Epitaph is the second studio album by German technical death metal band Necrophagist released by Relapse Records on August 3, 2004. In contrast to Onset of Putrefaction, guitarist and vocalist Muhammed Suiçmez recorded the album alongside a group of live musicians. Artwork for the album was done by Sascha Ehrich (Fragments of Unbecoming). .", "desc_lfm_artist": "Necrophagist was founded in early 1992 in Karlsruhe, Germany to integrate the fury of grinding, fast death metal with technical music. In April 2008, Necrophagist announced that Romain Goulon would be joining the band as their new drummer, replacing Minnemann, who would still be working with Muhammed Suiçmez on a side project. The band is writing a new, yet untitled album. Muhammed Suiçmez stated that the band would be using seven-string guitars on the album.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU"]}, {"n": 303, "title": "Miss Machine", "artist": "The Dillinger Escape Plan", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1649-miss-machine.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1649-the-dillinger-escape-plan-miss-machine.php", "aoty_critic_score": 76, "aoty_user_score": 84, "mbid": "60089b39-412b-326c-afc7-aaa47113d84f", "yt_id": "glnWYWJftTQ", "rym": "https://rateyourmusic.com/release/album/the-dillinger-escape-plan/miss-machine", "genres": ["Metal"], "desc_lfm_album": "", "desc_lfm_artist": "The Dillinger Escape Plan is a hardcore band from Morris Plains, New Jersey, United States. The group originated in 1997 after the disbanding of Arcane, a hardcore punk trio consisting of Ben Weinman, Dimitri Minakakis, and Chris Pennie. The band performs a fast-tempo, technically proficient style of heavy music popularly known as mathcore. The band recorded their second EP with Relapse Records in 1998 entitled Under the Running Board. A year later", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 304, "title": "Samurai Champloo Music Record: Departure", "artist": "Nujabes / Fat Jon", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/69107-samurai-champloo-music-record-departure-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/69107-nujabes-fat-jon-samurai-champloo-music-record-departure.php", "aoty_critic_score": 88, "aoty_user_score": null, "mbid": "109bed29-720c-3a93-88ae-af83a464e5ed", "yt_id": "0rorvMqc52w", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["sdecandelario"]}, {"n": 305, "title": "A Ghost Is Born", "artist": "Wilco", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/346-a-ghost-is-born_190526.jpg", "aoty_url": "https://www.albumoftheyear.org/album/346-wilco-a-ghost-is-born.php", "aoty_critic_score": 77, "aoty_user_score": 80, "mbid": "355ed2eb-2b61-335c-b3e4-10ca26a17c88", "yt_id": "cpAw672ys7Y", "rym": "https://rateyourmusic.com/release/album/wilco/a-ghost-is-born", "genres": [], "desc_lfm_album": "A Ghost Is Born is the fifth studio album by Chicago-based alternative rock band Wilco. Released on June 22, 2004, it features singer Jeff Tweedy on lead guitar more than any previous Wilco album. The band streamed the album online for free, and offered a five song EP to purchasers. Tweedy entered a rehab clinic shortly before the release of the album, delaying its release by two weeks. It also shortened its promotional tour. Despite this, A Ghost Is Born's opening week was the best sales week for the band at the time and the album was met with good .", "desc_lfm_artist": "Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84"]}, {"n": 306, "title": "They're Only Chasing Safety", "artist": "Underoath", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/21005-theyre-only-chasing-safety.jpg", "aoty_url": "https://www.albumoftheyear.org/album/21005-underoath-theyre-only-chasing-safety.php", "aoty_critic_score": 50, "aoty_user_score": 80, "mbid": "e296304f-5d67-381f-a482-676d711f2482", "yt_id": "MXHikpA5COo", "rym": "https://rateyourmusic.com/release/album/underoath/theyre-only-chasing-safety", "genres": [], "desc_lfm_album": "They're Only Chasing Safety is the fourth studio album by American post-hardcore band Underoath. It was released on June 15, 2004, through Solid State Records. .", "desc_lfm_artist": "Underoath (occasionally typeset as underOATH or UNDERØATH) is an American band originally formed on November 30, 1997 in Ocala, Florida, but later relocated to Tampa, Florida, which was home to some of their newer members. \n\nDuring the band's early years, when they were fronted by former vocalist Dallas Taylor, Underoath displayed a heavier style than their later, more well-known work, incorporating disparate influences from death and black metal.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 307, "title": "Three Cheers for Sweet Revenge", "artist": "My Chemical Romance", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5528-three-cheers-for-sweet-revenge_201340.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5528-my-chemical-romance-three-cheers-for-sweet-revenge.php", "aoty_critic_score": 77, "aoty_user_score": 87, "mbid": "1d563513-87dc-308f-8bac-418fab4054cf", "yt_id": "A4FTbGiB1rQ", "rym": "https://rateyourmusic.com/release/album/my-chemical-romance/three-cheers-for-sweet-revenge", "genres": [], "desc_lfm_album": "Three Cheers for Sweet Revenge is the second studio album by American rock band My Chemical Romance, released on June 8, 2004, by Reprise Records. Produced by Howard Benson, the album marked a significant departure from the raw, gritty sound of their 2002 debut I Brought You My Bullets, You Brought Me Your Love, showcasing a more polished blend of punk, pop, and post-hardcore that would propel the band to international stardom. Recorded at O'Henry Sound Studios in Burbank, California, the album is the first to feature rhythm guitarist Frank Iero on all tracks, as he had joined the band .", "desc_lfm_artist": "My Chemical Romance is an American rock band from New Jersey, United States formed in 2001. The band consists of lead vocalist Gerard Way, guitarists Ray Toro, Frank Iero and bassist Mikey Way. Shortly after forming, the band signed to Eyeball Records and released their debut album I Brought You My Bullets, You Brought Me Your Love in 2002. They signed with Reprise Records the next year and released their major label debut Three Cheers for Sweet Revenge", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 308, "title": "A Grand Don’t Come for Free", "artist": "The Streets", "year": 2004, "cover": "https://dn710808.ca.archive.org/0/items/mbid-e932edc4-33ba-4039-a1f0-81b1958ef898/mbid-e932edc4-33ba-4039-a1f0-81b1958ef898-23663859541.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "606032a2-ec19-32ca-a7c9-17a32dea72ae", "yt_id": "QIKqw-pTiJ0", "rym": null, "genres": ["breaks", "hip hop", "uk garage", "electronic"], "desc_lfm_album": "", "desc_lfm_artist": "There are two artists with this name:\n1. A British rapper\n2. A Finnish rock band\n\n1. Mike Skinner (born November 27, 1978), more commonly known by his stage name The Streets, is a rapper from Birmingham, England. He was born in Barnet in North London and that's where his accent, sometimes called 'Mockney' by the press, comes from. You can hear his actual accent on the start of 'Fake Streets Hats' from his album The Hardest Way To Make An Easy Living recorded in 2006.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 309, "title": "Rejoicing in the Hands", "artist": "Devendra Banhart", "year": 2004, "cover": "https://dn710608.ca.archive.org/0/items/mbid-56bc5f48-6084-3557-a0a1-e8651937b1e2/mbid-56bc5f48-6084-3557-a0a1-e8651937b1e2-2044417974.jpg", "aoty_url": "https://www.albumoftheyear.org/album/509-devendra-banhart-rejoicing-in-the-hands.php", "aoty_critic_score": 82, "aoty_user_score": 75, "mbid": "964fe50c-8bb3-3086-98ac-88f92cbec56a", "yt_id": "xoxBSa1YPCw", "rym": null, "genres": ["folk rock", "folk", "indie rock"], "desc_lfm_album": "Rejoicing in The Hands is the second LP from Devendra Banhart, released on May 4 2004 on Young God records. It marked Banhart's first rise into the indie listening community as he became a poster boy for the so-called Freak Folk scene, with this release and his soon-to-follow \"Golden Apples of The Sun\" compilation; apart from these associations, it was evidently the first time he had access to better production equipment, so he made his first great-sounding artistic statement, easily eclipsing his relatively scatter-shot debut. The record was critically lauded, with many elite publications comparing him to past \"oddly-voiced\" musical .", "desc_lfm_artist": "Devendra Obi Banhart (born May 30, 1981) is a Venezuelan American singer-songwriter and visual artist. Banhart was born in Houston, Texas and was raised by his mother in Venezuela, until he moved to California as a teenager. His first few records were released on the Young God Records label from New York City.  His most recent CD was released by Nonesuch. He is one of the most popular artists to come out of the \"New Weird America\" movement, which includes performers such as Faun Fables", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "alberto_gu", "armandwave"]}, {"n": 310, "title": "Sung Tongs", "artist": "Animal Collective", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/307-sung-tongs_040249.jpg", "aoty_url": "https://www.albumoftheyear.org/album/307-animal-collective-sung-tongs.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "264f585d-9a28-37b7-88b3-d8e090b4d2e7", "yt_id": "FMPWllOnRjQ", "rym": "https://rateyourmusic.com/release/album/animal-collective/sung-tongs/", "genres": [], "desc_lfm_album": "Sung Tongs is the fifth album by Baltimore-based band Animal Collective, released on May 3, 2004 by Fat Cat Records. Despite the name 'Animal Collective' attached to this album, only two of the band's four members play on it: Avey Tare (David Portner) and Panda Bear (Noah Lennox). As a result, Sung Tongs is a more stripped-down affair than other Animal Collective releases. On the album, Portner and Lennox both utilize acoustic guitars and tribal-like drums; the electric guitar, an important element in the Collective's previous album, Here Comes the Indian, is nowhere to be found. This sound brought the .", "desc_lfm_artist": "Animal Collective are an American experimental pop band formed in Baltimore, Maryland in 1999. The group consists of David Portner (Avey Tare), Noah Lennox (Panda Bear), Brian Weitz (Geologist), and Josh Dibb (Deakin). Their music blends a wide range of styles, including psychedelia, freak folk, noise, and electronica, incorporating elements such as loops, drones, sampling, vocal harmonies, and sound collage. The band is known for its distinctive approach to experimental rock and pop music.", "desc_mb_album": "", "desc_mb_artist": "=== Don't add these albums here: ===\r\n[https://musicbrainz.org/artist/22568c9d-8ef3-4224-b994-8e0658e1082a|Avey Tare] and [https://musicbrainz.org/artist/fd3c3f9f-a471-498e-ab3a-940ac20b6bbd|Panda Bear] — [https://musicbrainz.org/release-group/b15e243c-8279-3b5b-b773-fca282c8ce54|Spirit They’re Gone Spirit They’ve Vanished]\r\n[https://musicbrainz.org/artist/22568c9d-8ef3-4224-b994-8e0658e1082a|Avey Tare], [https://musicbrainz.org/artist/fd3c3f9f-a471-498e-ab3a-940ac20b6bbd|Panda Bear] & [https://musicbrainz.org/artist/c836703d-f5e2-4e54-92c3-1792ef4d0d6f|Geologist] — [https://musicbrainz.org/release-group/8b0d9da7-df54-3f0f-acb1-568186b9891a|Danse Manatee]\r\n[https://musicbrainz.org/artist/1bd864ba-34a1-4d34-8922-559e58838a60|Campfire Songs] — [https://musicbrainz.org/release-group/7f1a5f85-", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 311, "title": "Van Lear Rose", "artist": "Loretta Lynn", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/van-lear-rose.jpg", "aoty_url": "https://www.albumoftheyear.org/album/502-loretta-lynn-van-lear-rose.php", "aoty_critic_score": 88, "aoty_user_score": 79, "mbid": "ed7ea6bf-cda9-35cc-95ee-907279b0266e", "yt_id": "nLObzOzJsWQ", "rym": "https://rateyourmusic.com/release/album/loretta-lynn/van-lear-rose", "genres": [], "desc_lfm_album": "Van Lear Rose is a Grammy Award-winning album by Loretta Lynn, released in 2004 and produced by Jack White, of The White Stripes and The Raconteurs. The album was initially intended as a musical experiment, blending the styles of country singer-songwriter Lynn and producer White, who wrote one track, sings a duet with Lynn, and performs on the whole album as a musician. At the time of the album's release, Lynn was 69 and White was 28. The title refers to Lynn's origins as the daughter of a miner working the Van Lear coal mines. The album peaked at number .", "desc_lfm_artist": "Loretta Lynn (April 14, 1932 - October 4, 2022) was an American country singer who was the leading country female vocalist during much of the 1960s and 1970s. In the 1970s she became one of the most famous women in all of America and frequently made \"most admired women\" polls alongside first ladies and world leaders.\n\nLynn was born in Butcher Hollow, Van Lear, Kentucky in 1932. According to  Songfacts, Loretta Lynn's superstar Country career started in 1960 when she recorded \" I'm a Honky Tonk Girl \" as her debut single.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 312, "title": "Good News For People Who Love Bad News", "artist": "Modest Mouse", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/515-good-news-for-people-who-love-bad-news_185818.jpg", "aoty_url": "https://www.albumoftheyear.org/album/515-modest-mouse-good-news-for-people-who-love-bad-news.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "65b47520-2e58-3bc2-a755-34ff35f23ad5", "yt_id": "s1AjJslkL0o", "rym": null, "genres": [], "desc_lfm_album": "Good News for People Who Love Bad News is the fourth full-length album recorded by American alternative rock band Modest Mouse. The album was released by Epic Records on April 6, 2004 on both CD and 180g/m² vinyl record. It was rereleased on DualDisc on October 11, 2005. The first two singles from the album were \"Float On\" and \"Ocean Breathes Salty,\" both of which debuted on American radio stations in the first half of 2004. The vinyl and DualDisc editions of the album also contain the B-side \"I've Got It All (Most)\". On the vinyl edition, the track is .", "desc_lfm_artist": "Modest Mouse is an American alternative rock band which formed in 1993 in Issaquah, Washington, United States. The band's original lineup consisted of guitarist Isaac Brock, drummer Jeremiah Green and bassist Eric Judy. Since being signed to Sony's Epic Records in 2000, Modest Mouse has attained significant popular success with songs such as \"Float On\" and \"Dashboard.\"\n\nThe band's current configuration is Isaac Brock (vocals, guitar), Tom Peloso (strings, horns, bass, keyboards), Jim Fairchild (guitar), and Eric Judy (bass)).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 313, "title": "Madvillainy", "artist": "Madvillain", "year": 2004, "cover": "https://dn710700.ca.archive.org/0/items/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708-28231687719.jpg", "aoty_url": "https://www.albumoftheyear.org/album/503-madvillain-madvillainy.php", "aoty_critic_score": 89, "aoty_user_score": 92, "mbid": "ab570ccb-b06b-3746-8147-4903163ba895", "yt_id": "zQ0yXh_ADlQ", "rym": "https://rateyourmusic.com/release/album/madvillain/madvillainy", "genres": ["alternative hip hop", "hip hop", "experimental hip hop", "instrumental hip hop", "jazz rap", "abstract hip hop"], "desc_lfm_album": "Madvillainy is the legendary collaboration between rapper MF DOOM and producer Madlib under the group name Madvillain. It is considered one of the greatest hip-hop albums ever. It was released on March 23, 2004, on Stones Throw Records. The album was recorded between 2002 and 2004. Madlib created most of the instrumentals during a trip to Brazil in his hotel room using minimal amounts of equipment: a Boss SP-303 sampler, a turntable, and a tape deck. Fourteen months before the album was released, an unfinished demo version was stolen and leaked onto the internet. Frustrated, the duo stopped working on .", "desc_lfm_artist": "Madvillain was an American hip-hop duo consisting of two MCs and producers, MF DOOM and Madlib. Their debut album Madvillainy was met with wide critical acclaim for its unique approach. Their short songs, obscure lyrics and sparse choruses made for a sound that was generally unfriendly to commercial radio, but was lauded as a key aspect of their identity as an underground act.\n\nIn 2006, Madvillain was featured on Stones Throw Records and Adult Swim's DVD/CD Chrome Children with a new song and live performance.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 314, "title": "The Milk-Eyed Mender", "artist": "Joanna Newsom", "year": 2004, "cover": "https://dn710209.ca.archive.org/0/items/mbid-9fea3e11-77a6-446e-b4c9-1e713e8a39dc/mbid-9fea3e11-77a6-446e-b4c9-1e713e8a39dc-37214814521.jpg", "aoty_url": "https://www.albumoftheyear.org/album/521-joanna-newsom-the-milk-eyed-mender.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": "8a5e2b8e-c2f9-3751-976c-12f8de17bff8", "yt_id": "j5zH5nl_JrM", "rym": "https://rateyourmusic.com/release/album/joanna-newsom/the-milk-eyed-mender/lists/12", "genres": ["avant-garde", "folk rock", "folk", "contemporary folk"], "desc_lfm_album": "The Milk-Eyed Mender is the debut album by American singer-songwriter Joanna Newsom, released on March 23 2004 on the Drag City label. Joanna Newsom wrote all the songs on the album except for \"Three Little Babes\", a traditional Appalachian song. According to the liner notes, Joanna plays \"a Lyon & Healy style 15 harp, a wurlitzer electric piano, a harpsichord, and piano.\" A bandmate in San Francisco band The Pleased, Noah Georgeson, produced and recorded the album, as well as contributing guitar to two tracks and backing vocals to one. Cover art embroidery is by Emily Prince and photographs are .", "desc_lfm_artist": "Joanna Caroline Newsom is an American singer, songwriter, musician and actress. Born and raised in Northern California, Newsom was classically trained on the harp in her youth and began her musical career as a keyboardist in the San Francisco-based indie band The Pleased.\n\nAfter recording and self-releasing two EPs in 2002, Newsom was signed to the independent label Drag City. Her debut album, The Milk-Eyed Mender, was released in 2004 to critical acclaim and garnered Newsom an underground following.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 315, "title": "Seven Swans", "artist": "Sufjan Stevens", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/499-seven-swans_202659.jpg", "aoty_url": "https://www.albumoftheyear.org/album/499-sufjan-stevens-seven-swans.php", "aoty_critic_score": 78, "aoty_user_score": 81, "mbid": "9c034a12-db0e-3bc1-b3ed-e74e7ffa92b1", "yt_id": "frLadZvfZTs", "rym": "https://rateyourmusic.com/release/album/sufjan-stevens/seven-swans", "genres": [], "desc_lfm_album": "Seven Swans is a folk rock music album by Sufjan Stevens. It includes songs about Abraham and Christ's Transfiguration, among many others. The album is softer and sparser than other albums by Stevens, relying more heavily on his trademark banjo and melodious voice. Seven Swans was received well by critics. The Guardian called it \"a record of remarkable delicacy\" and Spin magazine said it sounded \"like Elliott Smith after ten years of Sunday school\". The album was released on compact disc and vinyl LP; the vinyl was released by Burnt Toast Vinyl. Biblical allusions Many of the songs on Seven .", "desc_lfm_artist": "Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 316, "title": "Fabulous Muscles", "artist": "Xiu Xiu", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/fabulous-muscles-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1388-xiu-xiu-fabulous-muscles.php", "aoty_critic_score": 79, "aoty_user_score": 84, "mbid": "adef573b-8b6d-3fe8-be5c-c2792bf3042a", "yt_id": "7VT-Zr-QPDo", "rym": "https://rateyourmusic.com/release/album/xiu-xiu/fabulous-muscles", "genres": [], "desc_lfm_album": "Fabulous Muscles is the third album by Xiu Xiu, released on February 17, 2004 on 5 Rue Christine. The album marked a change in the band's sound, as the album was considered to be more accessible than Xiu Xiu's previous two albums. Fabulous Muscles has received mostly positive reviews. The album was recorded in Oakland and Seattle and was produced by band member Cory McCulloch. The album's cover features frontman Jamie Stewart nuzzling a toy kitten. On recording the album, Stewart said: \"I think on Fabulous Muscles we really tried to write a pop record just because... We were on .", "desc_lfm_artist": "Xiu Xiu (pronounced \"shoo shoo\") is an American experimental group, formed in 2002 in San Jose, California by original members Jamie Stewart, Lauren Andrews, Yvonne Chen, and Cory McCulloch. Currently, the line-up consists of Jamie Stewart (the only constant member since formation), Angela Seo, and David Kendrick. Stewart and Seo reside in Germany, while Kendrick is a touring member, playing drums for the group.\n\nOver the life of the band, their music has taken influence from noise", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 317, "title": "恋人へ [For Lovers]", "artist": "Lamp", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/121191--for-lovers_204659.jpg", "aoty_url": "https://www.albumoftheyear.org/album/121191-lamp--for-lovers.php", "aoty_critic_score": 86, "aoty_user_score": null, "mbid": null, "yt_id": "LESPPz2HVhI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There is more than one artist with the name Lamp.\n\n1. Lamp  (ランプ)  are a Japanese band formed in 2000. There are three members:\n\nTaiyo Someya (染谷大陽; born 13 November 1979) - guitar, synthesizer, vibraphone\nYusuke Nagai (永井祐介; born 22 July 1980) – vocals, guitar, bass, keyboard\nKaori Sakakibara  (榊原香保里; born 17 November 1979) – vocals, flute, accordion\n\nFormation\nSomeya started playing guitar in middle school. In the folk club during high school", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 318, "title": "The College Dropout", "artist": "Kanye West", "year": 2004, "cover": "https://dn721904.ca.archive.org/0/items/mbid-99a96bf6-8166-3b7c-97ed-ea525f13ec65/mbid-99a96bf6-8166-3b7c-97ed-ea525f13ec65-34245157344.jpg", "aoty_url": "https://www.albumoftheyear.org/album/508-kanye-west-the-college-dropout.php", "aoty_critic_score": 81, "aoty_user_score": 91, "mbid": "8a01217e-6947-3927-a39b-6691104694f1", "yt_id": "OTZzjAU0Kg0", "rym": "https://rateyourmusic.com/release/album/kanye-west/the-college-dropout", "genres": ["hip hop", "neo soul", "conscious hip hop", "pop rap", "chipmunk soul", "Hip-Hop"], "desc_lfm_album": "\"The College Dropout\" is the debut studio album by American rapper Kanye West. It was released on February 10, 2004, through Roc-A-Fella Records and Def Jam Recordings. Prior to its release, West had gained recognition as a producer for artists such as Jay-Z and Talib Kweli, though he encountered resistance within the music industry to being accepted as a recording artist. After signing with Roc-A-Fella Records, he recorded the album over several years, beginning in 1999. Production on \"The College Dropout\" was primarily handled by West and reflects his early production style, often described as \"chipmunk soul\", characterized by sped-up .", "desc_lfm_artist": "Ye, born Kanye Omari West on June 8, 1977, is an American rapper, singer, songwriter, record producer, and fashion designer. He is one of the most prominent figures in hip hop, known for his diverse musical style and polarizing cultural and political commentary. After dropping out of college to pursue a career in music, West began producing for regional artists in the Chicago area. As an in-house producer for Roc-A-Fella Records, he co-produced albums including Jay-Z's The Blueprint (2001) before signing with the label as a recording artist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 319, "title": "Franz Ferdinand", "artist": "Franz Ferdinand", "year": 2004, "cover": "https://dn721802.ca.archive.org/0/items/mbid-c70124b2-ac47-4589-8141-cc791f808c8f/mbid-c70124b2-ac47-4589-8141-cc791f808c8f-33786493235.jpg", "aoty_url": "https://www.albumoftheyear.org/album/516-franz-ferdinand-franz-ferdinand.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "c145ca26-2556-3780-828f-82729de51f7b", "yt_id": "y1Uo7qiDrao", "rym": "https://rateyourmusic.com/release/album/franz-ferdinand/franz-ferdinand", "genres": ["art rock", "new wave", "dance-punk", "indie rock", "alternative punk", "post-punk revival"], "desc_lfm_album": "Franz Ferdinand is the debut album by Scottish alternative rock band Franz Ferdinand, released February 9, 2004. It entered the United Kingdom album charts at number three in February 2004 and contains three UK top ten singles: \"Take Me Out\", \"This Fire\" (on the download chart) and \"The Dark of the Matinée\" (often referred to simply as \"Matinée\"). The album won the 2004 Mercury Music Prize, and has sold over 3.6 million copies worldwide since its release. .", "desc_lfm_artist": "Franz Ferdinand is a Scottish alternative rock  band that formed in Glasgow, Scotland, in 2002 and played an important part in the post-punk revival of the 2000s. The band consisted of Alex Kapranos (lead vocals and guitar), Bob Hardy (bass guitar), Nick McCarthy (rhythm guitar, keyboards and backing vocals) and Paul Thomson (drums, percussion and backing vocals) until 2016 when McCarthy left them. The next year  Julian Corrie (keyboards, synthesiser, guitar and backing vocals) and Dino Bardot (guitar and backing vocals) joined the band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 320, "title": "Talkie Walkie", "artist": "Air", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/884-talkie-walkie_160946.jpg", "aoty_url": "https://www.albumoftheyear.org/album/884-air-talkie-walkie.php", "aoty_critic_score": 76, "aoty_user_score": 80, "mbid": "c636f6e8-0fe6-3470-b5af-b31a0ebed0bb", "yt_id": "8FZGMpun6_Y", "rym": null, "genres": [], "desc_lfm_album": "Talkie Walkie is the fourth full-length album by Air, released on January 27, 2004. The album was possibly named after the song \"Le Talkie Walkie\" by Serge Gainsbourg, a known influence of the duo. The track \"Alone in Kyoto\" was featured on the soundtrack to the 2004 film Lost in Translation. This album has been released with the Copy Control protection system in some regions. .", "desc_lfm_artist": "There are at least five artists with this name:\n1. A popular electronic music duo from France\n2. A jazz trio from the United States\n3. A noise rock band from Japan\n4. An alias of ambient musician Pete Namlook\n5. A pop group from the Philippines \n\n1) The French band Air is a duo consisting of Nicolas Godin and Jean-Benoit Dunckel. They went to school in Versailles, (Lycée Jules Ferry) before forming the band in 1995 . Their critically acclaimed first album Premiers Symptômes was followed by the release of Moon Safari", "desc_mb_album": "", "desc_mb_artist": "If you are thinking of changing the capitalization of the artist name, please refer to [http://web.archive.org/web/20120211124424/http://www.ravemagazine.com.au/content/view/8209/30/|this page]. Specifically: \r\n\r\nMyth #1: Air is an acronym for Amour, Imagination, Rêve (French for Love, Imagination, Dream).\r\n\r\n“No. Someone made that up, but it was a really nice thing to do. I wish I could have that idea.”", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 321, "title": "渋星 [Shibuboshi]", "artist": "渋さ知らズ [Shibusashirazu]", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/157368-shibuboshi-.jpg", "aoty_url": "https://www.albumoftheyear.org/album/157368--shibusashirazu--shibuboshi.php", "aoty_critic_score": 87, "aoty_user_score": null, "mbid": null, "yt_id": "xx_WwAHKBnI", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 322, "title": "The Winter Ray", "artist": "Natural Snow Buildings", "year": 2004, "cover": "https://cdn2.albumoftheyear.org/600x0/album/74206-the-winter-ray_074638.jpg", "aoty_url": "https://www.albumoftheyear.org/album/74206-natural-snow-buildings-the-winter-ray.php", "aoty_critic_score": 89, "aoty_user_score": null, "mbid": "e6cb792c-a4fa-42ec-b361-45ade1c85518", "yt_id": "GglSGAjAhzA", "rym": "https://rateyourmusic.com/release/album/natural-snow-buildings/the-winter-ray", "genres": ["Metal", "Rock"], "desc_lfm_album": "Self-released in 2004 by Natural Snow Buildings, a French duo consisting of Mehdi Ameziane and Solange Gularte, on CD in a limited release (rumoured to be 15 copies) packaged in a blue paper envelope and containing a photograph as a cover unique to the copy. .", "desc_lfm_artist": "Natural Snow Buildings is a duo from Vitré, France, consisting of artists Mehdi Ameziane and Solange Gularte. They play music which can be classified as experimental,  psychedelic folk with drone elements and ambient influences. Formed in 1997, they have released numerous albums, many of them in extremely limited quantities. \n\nBoth members of Natural Snow Buildings record as solo artists: Mehdi Ameziane as TwinSisterMoon and Solange Gularte as Isengrind.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 323, "title": "Boris at Last -Feedbacker-", "artist": "Boris", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7873-boris-at-last-feedbacker-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7873-boris-boris-at-last-feedbacker.php", "aoty_critic_score": 89, "aoty_user_score": 88, "mbid": "58bb1463-4e62-32d6-b368-81ebc91de975", "yt_id": "-y-nv3l7KO4", "rym": "https://rateyourmusic.com/release/album/boris/boris-at-last-feedbacker-/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared"]}, {"n": 324, "title": "Let It Be... Naked", "artist": "The Beatles", "year": 2003, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18875-let-it-be-naked.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18875-the-beatles-let-it-be-naked.php", "aoty_critic_score": 77, "aot
