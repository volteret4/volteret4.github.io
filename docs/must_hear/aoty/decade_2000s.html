cterized by its heavy use of Auto-Tune, stripped-down electronic beats, and prominent drum programming from the .", "desc_lfm_artist": "Ye, born Kanye Omari West on June 8, 1977, is an American rapper, singer, songwriter, record producer, and fashion designer. He is one of the most prominent figures in hip hop, known for his diverse musical style and polarizing cultural and political commentary. After dropping out of college to pursue a career in music, West began producing for regional artists in the Chicago area. As an in-house producer for Roc-A-Fella Records, he co-produced albums including Jay-Z's The Blueprint (2001) before signing with the label as a recording artist.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Rocky_stereo", "alberto_gu", "armandwave"]}, {"n": 58, "title": "Welcome to Mali", "artist": "Amadou & Mariam", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/welcome-to-mali.jpg", "aoty_url": "https://www.albumoftheyear.org/album/731-amadou-mariam-welcome-to-mali.php", "aoty_critic_score": 84, "aoty_user_score": 74, "mbid": "b85ccfb0-631e-3ad0-b86f-a2f9e41bc3bc", "yt_id": "Lc-thspLT1U", "rym": "https://rateyourmusic.com/release/album/amadou-and-mariam/welcome-to-mali", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Amadou & Mariam was a musical duo from Mali, composed of the couple Mariam Doumbia (vocals) (born in Mali's capital Bamako 15 April 1958) and Amadou Bagayoko (guitar and vocals) (born in Bamako 24 October 1954; died 4 April 2025). The pair, known as \"the blind couple from Mali\" met at Mali's Institute for the Young Blind, and found they shared an interest in music.\n \nThe duo produced music that mixed traditional Mali sound with rock guitars, Syrian violins, Cuban trumpets, Egyptian ney, Colombian trombones, Indian tablas and Dogon percussion.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "armandwave"]}, {"n": 59, "title": "Somewhere at the Bottom of the River Between Vega and Altair", "artist": "La Dispute", "year": 2008, "cover": "https://dn710001.ca.archive.org/0/items/mbid-6c91ff0c-d946-49c4-b4cc-d24b51da9ada/mbid-6c91ff0c-d946-49c4-b4cc-d24b51da9ada-38786027640.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14380-la-dispute-somewhere-at-the-bottom-of-the-river-between-vega-and-altair.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "ab152f07-4fb8-3068-951d-47720622ac6d", "yt_id": "ESWuv5x7vsA", "rym": "https://rateyourmusic.com/release/album/la-dispute/somewhere-at-the-bottom-of-the-river-between-vega-and-altair", "genres": ["progressive rock", "spoken word", "punk", "post-hardcore", "post-rock", "emo"], "desc_lfm_album": "Somewhere at the Bottom of the River Between Vega and Altair is La Dispute's debut album. Supported by three release shows, it was released on November 11, 2008, simultaneously along with Here, Hear II. through No Sleep Records on both CD and vinyl. The album's title is derived from an Asian folktale, which the album's lyrics loosely follow. The release received positive reviews from notable critics and maintains a legacy in the post-hardcore scene. .", "desc_lfm_artist": "La Dispute is an American post-hardcore band from Grand Rapids, Michigan, formed in 2004. The current lineup is vocalist Jordan Dreyer, drummer Brad Vander Lugt, guitarist Chad Morgan-Sterenberg, guitarist Corey Stroffolino and bass guitarist Adam Vass. With a firm passion for the concept of music and art as a medium for making new friends, La Dispute makes music that is both artistically, technically, and emotionally engaging in hopes of establishing legitimate connections with any and all interested people", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario"]}, {"n": 60, "title": "The Renaissance", "artist": "Q-Tip", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/866-the-renaissance_193805.jpg", "aoty_url": "https://www.albumoftheyear.org/album/866-q-tip-the-renaissance.php", "aoty_critic_score": 81, "aoty_user_score": 82, "mbid": "d2d0a1a8-aafc-3f92-93b9-a327f23590cb", "yt_id": "RgX5ZLO-2ks", "rym": "https://rateyourmusic.com/release/album/q-tip/the-renaissance", "genres": [], "desc_lfm_album": "The Renaissance is the second studio album by Q-Tip, released on November 4, 2008, via Universal Motown Records. The follow-up to his solo debut album, Amplified (1999), it was recorded after Q-Tip's Kamaal the Abstract (2009) was initially shelved in 2002 by his former label Arista Records and his proposed effort Open was shelved by Universal Motown, both deemed commercially inadequate by the labels.The Renaissance was produced primarily by Q-Tip and features guest contributions by D'Angelo, Norah Jones, Amanda Diva, and Raphael Saadiq. .", "desc_lfm_artist": "Kamaal Ibn John Fareed (born Jonathan William Davis, April 10, 1970 in Harlem, New York), also known by his stage names Q-Tip, Kamaal the Abstract and The Abstract Poetic, is an American Grammy Award winning rapper, actor, producer and the former leader of the group A Tribe Called Quest. He converted to Islam in the mid-1990s and changed his name to Kamaal Ibn John Fareed. He later moved to Jamaica, Queens, New York as a child. As referenced in the song \"Check the Rhime\", he mostly resided at Linden Boulevard.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 61, "title": "Dawn", "artist": "Mount Eerie", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/dawn.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4916-mount-eerie-dawn.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "e362057e-1345-3ad9-8bd6-f1c51fd2fc76", "yt_id": "She6PZSYLS8", "rym": null, "genres": [], "desc_lfm_album": "Dawn is the third full-length album by Mount Eerie. It was officially released 1 November 2008 on P. W. Elverum & Sun. The songs were all written by Phil Elverum during the winter of 2002–03, which he spent alone in a cabin in a remote part of Norway. The album was released on CD concurrently with an 144-page hardcover book and 16 color photo cards. The book includes Elverum's journal entries and drawings from his Norway trip. The book is bound in paper that gives the feeling of wood. The album was also released as just an LP packaged with .", "desc_lfm_artist": "Mount Eerie represents the latest evolution of Phil Elverum's musical vision.  Formerly known as The Microphones, Elverum began Mount Eerie in 2003,  maintaining his previous project's subtle, lo-fi, and lyrically dense fuzz-folk aesthetic.  \n\nElverum explained this change in an 2003 interview with Discorder, asserting that \"Mount Eerie is a new project. The Microphones was completed, or at least at a good stopping point. I did it because I am ready for new things. I am new.\"", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Rocky_stereo", "armandwave"]}, {"n": 62, "title": "Love Is Overtaking Me", "artist": "Arthur Russell", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/love-is-overtaking-me-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/829-arthur-russell-love-is-overtaking-me.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "f08d9681-9870-35ca-adcc-6a830f9650f9", "yt_id": "RMbM8nW-u6k", "rym": null, "genres": [], "desc_lfm_album": "Love Is Overtaking Me is a posthumous album By Arthur Russell comprised of 21 demos and home recordings of unreleased pop, folk and country songs from Arthur’s vast catalogue. Compiled from over eight hours of material,the record reaches back further to Russell’s first compositions from the early `70s and spans forward to his very last recordings, made at home in 1991. Chris Taylor of Grizzly Bear contributed mixing, restoration and editing to the album, whose tracks were selected by Audika’s Steve Knutson, Ernie Brooks and Russell’s companion, Tom Lee. Several songs feature prominently in Matt Wolf’s film ‘Wild Combination: A .", "desc_lfm_artist": "Arthur Russell (May 21 1951 - April 4, 1992) was a prodigious talent. Classically trained on cello while growing up in Oskaloosa, USA, Arthur studied with Ali Akbar Khan in San Francisco in the early 1970's. \n\nDuring this period he also collaborated with Allen Ginsberg, accompanying him on cello while Ginsberg read or sang. Russell also spent time in a Buddhist commune in California; he left when they decided to collectivize his cello.\n\nBy the mid-1970's Russell relocated to New York City, where he studied at The Manhattan School of Music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 63, "title": "We are Beautiful, We Are Doomed", "artist": "Los Campesinos!", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/867-we-are-beautiful-we-are-doomed_004951.jpg", "aoty_url": "https://www.albumoftheyear.org/album/867-los-campesinos-we-are-beautiful-we-are-doomed.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "51b0a8b7-ef01-3c4f-bd45-fe6d023f796b", "yt_id": "_03u73W7KWQ", "rym": null, "genres": [], "desc_lfm_album": "We Are Beautiful, We Are Doomed is the second full-length record from Cardiff-based seven-piece Los Campesinos!. It was released in the UK on 27 October 2008 on Wichita Recordings & Limited to 5000 copies Only Worldwide. It came only thirty-three weeks after debut album Hold on Now, Youngster... and contains ten completely new tracks, none of which will be released as singles. The album was recorded over an eleven-day recording session with John Goodmanson in his Seattle studio during June 2008.[ The title of the song \"Between an Erupting Earth and an Exploding Sky\" is a reference to a line .", "desc_lfm_artist": "Los Campesinos! is an alternative rock band which formed in Cardiff, Wales, United Kingdom in 2006. The band's current lineup consists of Gareth Paisley (vocals, keyboards), Kim Paisley (vocals, keyboards), Tom Bromley (guitar, vocals, keyboards), Neil Turner (guitar), Rob Taylor (vocals, guitar, keyboards, glockenspiel, percussion), Matt Fidler (bass) and Jason Adelina (drums). The band has released seven albums since their formation: Hold On Now, Youngster.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 64, "title": "The Way of All Flesh", "artist": "Gojira", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9482-the-way-of-all-flesh_174732.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9482-gojira-the-way-of-all-flesh.php", "aoty_critic_score": 77, "aoty_user_score": 87, "mbid": "3f702793-d03a-3eff-9870-4759bda52e0f", "yt_id": "Kf4eR4FVKzE", "rym": "https://rateyourmusic.com/release/album/gojira/the-way-of-all-flesh", "genres": ["Metal"], "desc_lfm_album": "", "desc_lfm_artist": "There are multiple artists called Gojira;\n\n1) Gojira is a metal band from Bayonne, France. Their lyrics focus on life, ecology, and spiritual themes. They were formed in 1996 by brothers Joe Duplantier (vocals and lead guitar) and Mario Duplantier (drums), Christian Andreu (guitar) and Alexandre Cornillon (bass guitar). Cornillon left the band in 2001 and Jean-Michel Labadie became their bass player. Genres that they have been associated with over their career include death metal, progressive metal, thrash metal and groove metal.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 65, "title": "Lost Wisdom", "artist": "Mount Eerie", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/611-lost-wisdom_022943.jpg", "aoty_url": "https://www.albumoftheyear.org/album/611-mount-eerie-lost-wisdom.php", "aoty_critic_score": 76, "aoty_user_score": 80, "mbid": "0047f33d-d5d9-3092-947b-254a0fa06391", "yt_id": "vXGhZuMJPGI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Mount Eerie represents the latest evolution of Phil Elverum's musical vision.  Formerly known as The Microphones, Elverum began Mount Eerie in 2003,  maintaining his previous project's subtle, lo-fi, and lyrically dense fuzz-folk aesthetic.  \n\nElverum explained this change in an 2003 interview with Discorder, asserting that \"Mount Eerie is a new project. The Microphones was completed, or at least at a good stopping point. I did it because I am ready for new things. I am new.\"", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 66, "title": "The Bootleg Series Vol. 8: Tell Tale Signs", "artist": "Bob Dylan", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/661-the-bootleg-series-vol-8-tell-tale-signs_205603.jpg", "aoty_url": "https://www.albumoftheyear.org/album/661-bob-dylan-the-bootleg-series-vol-8-tell-tale-signs.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "68b2468f-c4d5-31f4-ac97-4829f7f90bb7", "yt_id": "WygoALvZonw", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": []}, {"n": 67, "title": "The Chemistry of Common Life", "artist": "Fucked Up", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-chemistry-of-common-life-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/728-fucked-up-the-chemistry-of-common-life.php", "aoty_critic_score": 82, "aoty_user_score": 78, "mbid": "74d943d8-077c-33c8-b518-7f9f9524416c", "yt_id": "GfczdTa-rrA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Fucked Up is a hardcore punk band from Toronto, Ontario, Canada.\n\nThe band formed and played their first shows in early 2001. The initial practicing lineup consisted of 10,000 Marbles (Guitar), Concentration Camp (Vocals), and Mustard Gas (Bass Guitar). Just prior to recording their demo tape, Concentration Camp moved to guitar and vocal duties were taken over by Pink Eyes (also known as Mr. Damian). Drums are played by Mr. Jo (also credited as G. Beat or J. Falco) and Young Governor was added as a third guitarist in 2007.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 68, "title": "Shogun", "artist": "Trivium", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9793-shogun.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9793-trivium-shogun.php", "aoty_critic_score": 65, "aoty_user_score": 83, "mbid": "2803e437-51cc-305e-a8fe-2daba8901eac", "yt_id": "ZktF0Vmtadc", "rym": "https://rateyourmusic.com/release/album/trivium/shogun", "genres": [], "desc_lfm_album": "Shogun (将軍) is the fourth studio album by American metal band Trivium. The album was released worldwide on various dates between September 23 and October 1, 2008 through Roadrunner Records. It is their last release to feature founding drummer Travis Smith. Work on the album is noted to have begun with producer Nick Raskulinecz in October 2007, with the band stating that they chose not to work with Jason Suecof again as they wanted to explore new ideas. Shogun largely features a continuation of the thrash metal style featured on The Crusade, however, it also marks the return of Matt .", "desc_lfm_artist": "Trivium is a heavy metal band which formed in Orlando, Florida, United States in 1999. The band currently consists of Matt Heafy (vocals, guitar), Corey Beaulieu (guitar), Paolo Gregoletto (bass) and Alex Rüdinger (drums). Heafy is the band's only remaining original member. \n\nTrivium crosses multiple heavy metal genres such as thrash metal, alternative metal, groove metal, and heavy metal. Their style has evolved over the years from their earliest work on Ember to Inferno right through to In Waves.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 69, "title": "Dear Science", "artist": "TV on the Radio", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/dear-science.jpg", "aoty_url": "https://www.albumoftheyear.org/album/828-tv-on-the-radio-dear-science.php", "aoty_critic_score": 87, "aoty_user_score": 80, "mbid": "572aeb84-6e76-3dc6-aea0-bf37ae6584c6", "yt_id": "M1m3CNE6AGQ", "rym": null, "genres": ["Punk", "Alternative Rock"], "desc_lfm_album": "Dear Science (often referred to as Dear Science,) is the fourth studio album from New York based band TV on the Radio. It was released via Interscope Records in the US, and licenced through 4AD in Europe and all remaining territories. Despite the marketed release date of September 23, the album was released to the American iTunes Store for download on September 16. The album is also available as a vinyl LP with a free mp3 download coupon. Critical response: Dear Science was named the best album of 2008 by Rolling Stone, The Guardian, Spin Magazine, Consequence of Sound, MTV, .", "desc_lfm_artist": "TV on the Radio is an American indie rock band formed in 2001 in Brooklyn, New York.\n\nThe group has released several EPs including their debut Young Liars (2003), and five studio albums: Desperate Youth, Blood Thirsty Babes (2004), Return to Cookie Mountain (2006), Dear Science (2008), Nine Types of Light (2011), and Seeds (2014).\n\nFor most of the band's existence, the core TV on the Radio lineup has been Tunde Adebimpe (vocals/loops),  David Andrew Sitek (guitars/keyboards/loops)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 70, "title": "Tigers Jaw", "artist": "Tigers Jaw", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/45572-tigers-jaw.jpg", "aoty_url": "https://www.albumoftheyear.org/album/45572-tigers-jaw-tigers-jaw.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "30592107-aa2f-4d82-a7f3-d0653ab91b80", "yt_id": "LeRLFUuH5Lw", "rym": "https://rateyourmusic.com/release/album/tigers-jaw/tigers-jaw", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Tigers Jaw are an American indie rock band from Scranton, Pennsylvania that formed in 2005. The band is currently comprised of vocalist/guitarist Ben Walsh and vocalist/keyboardist Brianna Collins. The band's name is a reference to a song by lo-fi band The Microphones. Tigers Jaw originally consisted of Walsh, Collins, drummer Mike May, vocalist/guitarist Adam McIlwee and bassist Dennis Mishko. May stayed with the band for only a few months, never recording any material with them; and was replaced by Pat Brier the same year.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 71, "title": "Two Airships / Exploder Falls", "artist": "Candy Claws", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/135431-two-airships-exploder-falls-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/135431-candy-claws-two-airships-exploder-falls.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "d7e6d0f3-8940-496b-ae0b-58589babd075", "yt_id": "SPawwyUF9do", "rym": "https://rateyourmusic.com/release/album/candy-claws/two-airships-exploder-falls", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "CC lives and records in Fort Collins, CO. Members include Ryan Hover, Karen McCormick, and Hank Bertholf.\n\nTheir debut album \"In The Dream Of The Sea Life\" struck the hearts and ears of internet music dorks, and they have been riding a residual wave of praise since. Their sound and their aesthetic is familiar and unique; they smoosh Pet Sounds harmonies through Animal Collective gurgle and approach the aftermath with naivety and wonder. Their music is both classic and totally modern.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Rocky_stereo"]}, {"n": 72, "title": "Microcastle", "artist": "Deerhunter", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/801-microcastle_200935.jpg", "aoty_url": "https://www.albumoftheyear.org/album/801-deerhunter-microcastle.php", "aoty_critic_score": 83, "aoty_user_score": 81, "mbid": "9437340a-d0a1-37a1-a7d9-6c308d3db215", "yt_id": "U4V2GHw3jls", "rym": null, "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Bradford Cox wrote in his blog: ...Our next album is going to be called \"Microcastle\" and we are experimenting with the concept of transposing all these things in this micro format. Imagine a castle with tons of rotted-out little rooms, each containing their own acoustics, etc. I refuse to record the next album in a building that does not at least look like a castle or a haunted mansion. I want to be surrounded by dust and cobwebs. I want the snares to sound haunted. I want the electronics and tubes to glow and hiss in near darkness. Yeah. I .", "desc_lfm_artist": "Deerhunter is an American indie rock band formed in 2001 in Atlanta, Georgia, United States. The band consists of Bradford Cox (vocals, guitar, piano), Moses Archuleta (drums, synths), Lockett Pundt (guitar, organ, vocals), and Josh McKay (bass, vocals).\n\nThe group began with the ambition of fusing the lulling hypnotic states induced by ambient and minimalist music with the klang and propulsion of garage rock. The band has weathered chaotic line-up changes and the death of a member.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 73, "title": "Her Abiding Memory", "artist": "Pitcher56", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/380201-her-abiding-memory.jpg", "aoty_url": "https://www.albumoftheyear.org/album/380201-pitcher56-her-abiding-memory.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "7ce99814-5bc3-40a7-ba95-454c19d7cb57", "yt_id": "AbWsTuq2S5Q", "rym": "https://rateyourmusic.com/release/album/pitcher56/her-abiding-memory", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Pitcher56 is a Japanese Whisper and Shibuya-kei band from the early 2000’s. Over their short career, they were signed to multiple different record labels. Their discography contains a variety of covers and original works. The three members of the group: Hiroyuki Morita (guitar, bass, drums, and programming), Manabu Takano (guitar and vocals), and Yuki Nakano (vocals) are all doctors today. They released their most popular album “Her Abiding Memory” while in medical school.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo"]}, {"n": 74, "title": "Midtown 120 Blues", "artist": "DJ Sprinkles", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/16474-midtown-120-blues_151614.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16474-dj-sprinkles-midtown-120-blues.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "85b3eb3c-b712-3ab8-b602-b4a561e69f38", "yt_id": "_OqQSfdC0Zo", "rym": "https://rateyourmusic.com/release/album/dj-sprinkles/midtown-120-blues", "genres": ["deep house", "Electronic"], "desc_lfm_album": "Midtown 120 Blues is a 2008 deep house album by Terre Thaemlitz under the name DJ Sprinkles.Midtown 120 Blues is widely regarded as an exemplary contemporary deep house album. Resident Advisor, who named it their #1 album of 2009, called it \"a classic in the deep house canon.\" Pitchfork Media's Andrew Gaerig gave the 2014 Comatonse reissue \"Best New Reissue,\" saying that \"at its best, Midtown 120 Blues simultaneously acts as a corrective to house's ahistorical narrative and reminds us just how potent and beautiful New York deep house can be.\" .", "desc_lfm_artist": "Dj Sprinkles aka Terre Thaemlitz is an award winning multi-media producer, writer, public speaker, educator, audio remixer, DJ and owner of the Comatonse Recordings record label. Her work critically combines themes of identity politics - including gender, sexuality, class, linguistics, ethnicity and race - with an ongoing critique of the socio-economics of commercial media production. This diversity of themes is matched by Thaemlitz’ wide range of production styles", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere"]}, {"n": 75, "title": "Harps and Angels", "artist": "Randy Newman", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/760-harps-and-angels_024252.jpg", "aoty_url": "https://www.albumoftheyear.org/album/760-randy-newman-harps-and-angels.php", "aoty_critic_score": 84, "aoty_user_score": 75, "mbid": "f39d30d8-cc09-38a7-b18b-25246aaf9226", "yt_id": "K8qtSoGdotI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Randall Stuart \"Randy\" Newman (born November 28, 1943) is a singer/songwriter, arranger, composer, and pianist who is notable for his mordant (and often satirical) pop songs and for his many film scores.\n\nNewman is noted for his practice of writing lyrics from the perspective of a character far removed from Newman's own biography. For example, the 1972 song \"Sail Away\" is written as a slave trader's sales pitch to attract slaves, while the narrator of \"Political Science\" is a U.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 76, "title": "Persona 4 Original Soundtrack", "artist": "目黒将司 [Shoji Meguro]", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/69280-persona-4-original-soundtrack_181411.jpg", "aoty_url": "https://www.albumoftheyear.org/album/69280--shoji-meguro-persona-4-original-soundtrack.php", "aoty_critic_score": 91, "aoty_user_score": null, "mbid": null, "yt_id": "i5L0MXqhgzI", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 77, "title": "Stay Positive", "artist": "The Hold Steady", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/stay-positive.jpg", "aoty_url": "https://www.albumoftheyear.org/album/826-the-hold-steady-stay-positive.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "02f4b425-cc0a-3d07-9c5c-d082570f2904", "yt_id": "UWSwYByHH8g", "rym": "https://rateyourmusic.com/release/album/the-hold-steady/stay-positive", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Hold Steady is an American rock band based in Brooklyn formed by vocalist/guitarist Craig Finn (ex-Lifter Puller) in 2004. Wanting to capture the sound of bands such as The Replacements and The Grifters, Finn recruited guitarist Tad Kubler (also ex-Lifter Puller), drummer Judd Counsell, and bassist Galen Polivka. In 2005 the band grew to include Franz Nicolay (of The World/Inferno Friendship Society) on keyboards and Bobby Drake took over on drums following Counsell's departure.", "de op 40 in several countries.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 80, "title": "Lookout Mountain, Lookout Sea", "artist": "Silver Jews", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/775-lookout-mountain-lookout-sea_034050.jpg", "aoty_url": "https://www.albumoftheyear.org/album/775-silver-jews-lookout-mountain-lookout-sea.php", "aoty_critic_score": 80, "aoty_user_score": 75, "mbid": "77c2ee00-3335-3e3d-a1fe-c46ad149f272", "yt_id": "JKZ1bqltshE", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Silver Jews were an American indie rock band formed in Hoboken, New Jersey, in 1989. The band's earliest incarnation was the college band Ectoslavia, formed by future Pavement founders Bob Nastanovich, Stephen Malkmus and frontman David Berman at the University of Virginia in 1985. An exercise in joyous noise, the band disbanded after graduation and the three friends moved to New York to take up various jobs - Nastanovich, a bus driver, and Berman and Malkmus, art museum security guards.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 81, "title": "Viva la Vida or Death and All His Friends", "artist": "Coldplay", "year": 2008, "cover": "https://dn710708.ca.archive.org/0/items/mbid-be065ef0-a90e-3ce4-a18d-9a45ec7c611b/mbid-be065ef0-a90e-3ce4-a18d-9a45ec7c611b-39198351005.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a1084754-8bb5-3ebc-bbd2-6a27d48e798a", "yt_id": "jkUkN30fnqU", "rym": null, "genres": ["alternative rock", "pop rock", "art pop", "piano rock", "britpop", "alternative punk"], "desc_lfm_album": "Viva la Vida or Death and All His Friends is the fourth studio album by British band Coldplay, released on June 12, 2008 on the Parlophone label. The album was named after a Spanish phrase that best translates into English as \"Long live life\". Lyrically, the album contains references to love, life, death and war. Recording sessions for the album took place from June 2007 to April 2008 and featured production by Jon Hopkins, Rik Simpson, Markus Dravs and Brian Eno. The album was Coldplay's first to be produced by Eno, and also their first album to not be produced .", "desc_lfm_artist": "Coldplay is a British alternative rock and britpop band formed in London in 1997. They consist of vocalist and pianist Chris Martin, guitarist Jonny Buckland, bassist Guy Berryman, drummer Will Champion and creative director Phil Harvey. They met at University College London and began playing music together from 1996 to 1998, initially calling themselves Starfish. Coldplay's music incorporates elements of soft rock, pop rock, piano rock, and post-britpop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 82, "title": "Dragging a Dead Deer up a Hill", "artist": "Grouper", "year": 2008, "cover": "https://dn710909.ca.archive.org/0/items/mbid-a3e18cac-ac05-4417-bd21-e2060b817ce9/mbid-a3e18cac-ac05-4417-bd21-e2060b817ce9-14755753554.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "abcc21e4-16fc-31a3-864b-4d69ae81e2b4", "yt_id": "d8g2uw4K7Ks", "rym": null, "genres": ["psychedelic folk", "drone", "shoegaze", "dream pop", "ethereal wave", "ambient pop"], "desc_lfm_album": "Dragging a Dead Deer Up a Hill is the fifth studio album by American musician Liz Harris under the stage name Grouper. It was released on June 10, 2008 on Type Records. The album was later reissued alongside Grouper's The Man Who Died in His Boat in 2013 by Kranky. The cover photograph is of Liz Harris as a child; the photograph was taken by her mother. .", "desc_lfm_artist": "Grouper is the solo project of American musician, artist and producer Liz Harris (born July 15, 1980). She has released material on her own label and other independent labels since 2005. Grouper released the critically acclaimed Dragging a Dead Deer Up a Hill in 2008, followed by six more records, including a two-part album, A I A, and the piano-led album Ruins. Her twelfth album, Shade, was released in 2021.\n\nHarris was born July 15, 1980, in Northern California and grew up around the San Francisco Bay area.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Rocky_stereo", "armandwave", "paqueradejere", "verygooood"]}, {"n": 83, "title": "Los Angeles", "artist": "Flying Lotus", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/los-angeles-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/690-flying-lotus-los-angeles.php", "aoty_critic_score": 79, "aoty_user_score": 81, "mbid": "83b3e9f2-0080-3d98-b75f-afc09e834118", "yt_id": "gDO1ksMixzE", "rym": "https://rateyourmusic.com/release/album/flying-lotus/los-angeles", "genres": ["idm", "instrumental hip hop", "wonky", "Electronic"], "desc_lfm_album": "Los Angeles is an album by Flying Lotus, released on June 10, 2008, on Warp Records. The cover was designed by Timothy Saccenti. .", "desc_lfm_artist": "Regarded upon his 2006 arrival as a promising beatmaker looming in the shadows of J Dilla, Madlib, and Dabrye, Steven Ellison -- known as Flying Lotus -- nullified all comparisons only two years later with Los Angeles. On that album, his first of five for the Warp label, Ellison distilled a uniquely crisp, spasmodic, and heady sound with elements of hip-hop, avant-garde jazz, IDM, and dubstep. While the abovementioned producers fueled Ellison, he", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "armandwave", "paqueradejere", "verygooood"]}, {"n": 84, "title": "Fleet Foxes", "artist": "Fleet Foxes", "year": 2008, "cover": "https://i.discogs.com/RKhfiLLqjrylqyHfkGDMmaK4rT_Ba5M_eHrYYM5BBro/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTEzNTk5/MjctMTYyODYwNjgw/MS0xMzIwLmpwZWc.jpeg", "aoty_url": "https://www.albumo genres": [], "desc_lfm_album": "Watershed is the ninth full-length studio album by the Swedish progressive death metal band Opeth. Published by Roadrunner Records, the album was first released digitally on the European iTunes Stores on May 19, 2008, and released physically on May 30, 2008 in continental Europe, June 2, 2008 in the United Kingdom, and June 3, 2008 in North America to universal acclaim. The album was recorded at Fascination Street Studios in Örebro, Sweden between November 1, 2007 and December 13, 2007. Watershed is the first studio album by Opeth to feature drummer Martin Axenrot and guitarist Fredrik Åkesson. The artwork for .", "desc_lfm_artist": "Opeth is a Swedish progressive metal band from Stockholm, formed in 1990. The band incorporates elements of folk, blues, classical, and jazz into its compositions, alongside influences from death metal, particularly in their early works. Their music often includes acoustic guitar passages, Mellotron use, death growls, and dynamic shifts.\n\nOpeth has experienced several lineup changes, with every original member eventually replaced. Mikael Åkerfeldt", "desc_mb_album": "", "desc_mb_artist": "The band logo was created by [https://musicbrainz.org/artist/0bf74085-4006-4a1e-b0c9-a3a3b504e7a2|Timo Ketola].", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 86, "title": "22 Dreams", "artist": "Paul Weller", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22-dreams.jpg", "aoty_url": "https://www.albumoftheyear.org/album/739-paul-weller-22-dreams.php", "aoty_critic_score": 82, "aoty_user_score": 69, "mbid": "3c6e7927-3ba5-3449-9f2e-e38bbdcfa3a4", "yt_id": "KObNG4B_yuo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Paul Weller (born 25 May 1958) is an English singer / songwriter and leader of two successful bands: The Jam and The Style Council. In England, he is recognized as something of a national institution yet, because much of his songwriting is rooted in English culture, he has remained essentially a national, rather than an international, star.  \n\nWellers 17th studio album \"66\" is set to be released on 24 May 2024. The title is a reference to his 66th birthday, just a day after the release.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 87, "title": "What Does It All Mean? 1983-2006 Retrospective", "artist": "Steinski", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/what-does-it-all-mean-1983-2006-retrospective.jpg", "aoty_url": "https://www.albumoftheyear.org/album/859-steinski-what-does-it-all-mean-1983-2006-retrospective.php", "aoty_critic_score": 83, "aoty_user_score": 79, "mbid": "fe57d15d-29ca-3163-9aff-e4f34f5411a4", "yt_id": "qP7cP4XncNM", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Steinski is Steve Stein, a Hip-Hop producer who achieved notoriety along with Doug DiFranco (Double Dee) in the early 1980's for a series of sample-based collages known as the Lessons, which are still well-regarded today as early underground Hip-Hop classics. Although they never had a hit record, they proved highly influential for subsequent artists such as Coldcut, DJ Shadow, Cut Chemist, the Avalanches, and Girl Talk.\n\nIn 1983, Tommy Boy Records held a promotional contest, in which entrants were asked to remix the single Play That Beat, Mr.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 88, "title": "Songs in A&E", "artist": "Spiritualized", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/642-songs-in-ae_164236.jpg", "aoty_url": "https://www.albumoftheyear.org/album/642-spiritualized-songs-in-ae.php", "aoty_critic_score": 81, "aoty_user_score": 75, "mbid": "f0cc53b6-9e96-30e4-b803-ddc3c42988df", "yt_id": "sahTwMbY4gM", "rym": null, "genres": [], "desc_lfm_album": "Songs in A&E is the sixth studio album by English rock band Spiritualized and is their first since 2003's Amazing Grace. It was released on 26 May 2008 in the UK on Sanctuary Records and on 27 May in the USA on Fontana Records. It was released on standard CD worldwide, as well as a limited edition book (with further artwork) and double 12\" vinyl in the UK. The album's first single was \"Soul on Fire,\" released on 19 May 2008 in the UK.Frontman Jason Pierce has said that the album is \"the work of The Devil...with a little guidance .", "desc_lfm_artist": "Spiritualized are an English rock band formed in 1990 in Rugby, Warwickshire, United Kingdom by Jason Pierce, who often goes by the alias J. Spaceman, after the spectacular demise of the Spacemen 3 outfit. The membership of Spiritualized changes from album to album, with Pierce being the only constant factor.\n\nThe first Spiritualized release was a space rock-esque cover of Any Way That You Want Me in 1990, a record which heralded the official split of Spacemen 3 following contractual wrangles over the band's name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "paqueradejere"]}, {"n": 89, "title": "あらためまして、はじめまして、ミドリです。 [Aratamemashite, hajimemashite, Midori desu.]", "artist": "ミドリ [Midori]", "year": 2008, "cover": "", "aoty_url": "https://www.albumoftheyear.org/album/25609-midori--aratamemashite-hajimemashite-midori-desu.php", "aoty_critic_score": 80, "aoty_user_score": 86, "mbid": null, "yt_id": "aNNHMvT201E", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 90, "title": "Nouns", "artist": "No Age", "year": 2008, "cover": "https://dn710004.ca.archive.org/0/items/mbid-e7864871-036f-471a-b86d-8862adcb6f61/mbid-e7864871-036f-471a-b86d-8862adcb6f61-38033404291.png", "aoty_url": "https://www.albumoftheyear.org/album/790-no-age-nouns.php", "aoty_critic_score": 80, "aoty_user_score": 77, "mbid": "a6a476d1-caa7-3641-b8a6-597c4b06886c", "yt_id": "BCA9-edwBrY", "rym": "https://rateyourmusic.com/release/album/no-age/nouns", "genres": ["noise rock", "indie rock"], "desc_lfm_album": "", "desc_lfm_artist": "No Age are an American alternative rock duo from Los Angeles, California formed in December, 2005. The band consists of Randy Randall (guitar) and Dean Spunt (vocals, drums). Formed from the ashes of Wives, No Age purvey a stripped essential take on pop delivered via a clearly defined punk-rock aesthetic, taking noise, energy and melody in equal measure. Reminiscent at various junctures of the likes of early Black Dice, The Ramones, and My Bloody Valentine, Weirdo Rippers documents a fast developing band hitting their stride.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario"]}, {"n": 91, "title": "Santogold", "artist": "Santigold", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/santigold-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/776-santigold-santogold.php", "aoty_critic_score": 73, "aoty_user_score": 81, "mbid": "7f97b291-3e30-3ff4-b7fb-b9e7ff4539fd", "yt_id": "5bHXRX9iWTg", "rym": null, "genres": [], "desc_lfm_album": "Santogold is the debut studio album by American artist Santigold (real name Santi White, who performed under the moniker Santogold at the time of the album's release). The album was released on April 29, 2008 in the United States and May 12 in the United Kingdom, on Downtown Records and Atlantic Records, respectively. Blending a variety of musical genres ranging from new wave to alternative rock and reggae, the album was very well received by critics upon release and was noted for its \"cross-genre confidence\". It earned multiple spots on 'top albums of the year' lists from major music periodicals .", "desc_lfm_artist": "Santigold (born Santi White on September 25, 1976) is a musician, songwriter and producer from Philadelphia, Pennsylvania, USA who formerly went under the stage name Santogold. She is perhaps best known for the song L.E.S. Artistes which became a hit in the UK and on American alternative radio. \n\nIn February 2009, she officially changed her stage name to Santigold as a result of infomercial jeweller Santo Gold threatening legal action against White and her label Downtown Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 92, "title": "Third", "artist": "Portishead", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/745-third_124859.jpg", "aoty_url": "https://www.albumoftheyear.org/album/745-portishead-third.php", "aoty_critic_score": 85, "aoty_user_score": 86, "mbid": "163339ab-813b-3d29-bba8-e1d5acf63cab", "yt_id": "LiVCbD_c5yc", "rym": "https://rateyourmusic.com/release/album/portishead/third", "genres": ["Electronic"], "desc_lfm_album": "Third is the third studio album by the English band Portishead. It was released on April 28, 2008 in the United Kingdom by Island Records and a day later in the United States by Mercury Records. Portishead's first studio album in eleven years, Third moved away from the trip hop style they had popularised, incorporating influences such as krautrock, surf rock, doo wop and the film soundtracks of John Carpenter. .", "desc_lfm_artist": "Portishead is an English band formed in 1991 in Bristol. Portishead are named after Portishead, Somerset, eight miles west of Bristol, along the coast. The band comprises vocalist Beth Gibbons, producer Geoff Barrow and musician Adrian Utley.\n\nPortishead's debut album, Dummy (1994), fused hip hop production with an atmospheric, cinematic style reminiscent of spy film soundtracks. The album was met with commercial and critical acclaim, quickly becoming a landmark album in the emerging trip hop genre.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 93, "title": "Flight of the Conchords", "artist": "Flight of the Conchords", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/flight-of-the-conchords.jpg", "aoty_url": "https://www.albumoftheyear.org/album/774-flight-of-the-conchords-flight-of-the-conchords.php", "aoty_critic_score": 81, "aoty_user_score": 80, "mbid": "bfcb5a88-9c37-30a8-b8d4-a90c644a8aa0", "yt_id": "9jLDZjMF3tk", "rym": "https://rateyourmusic.com/release/album/flight-of-the-conchords/flight-of-the-conchords", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Flight of the Conchords is a Grammy award-winning folk/pop/comedy duo composed of Bret McKenzie formerly of The Black Seeds, Video Kid, and The Wellington International Ukulele Orchestra fame and Jemaine Clement formerly of The Humourbeasts, who met in 1998 while studying film and theatre in Wellington, New Zealand.  Billing themselves as \"New Zealand's fourth most popular guitar-based digi-bongo acapella-rap-funk-comedy folk duo\", the group uses a combination of witty banter and acoustic guitars to work the audience.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 94, "title": "The Midnight Organ Fight", "artist": "Frightened Rabbit", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-midnight-organ-fight-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/672-frightened-rabbit-the-midnight-organ-fight.php", "aoty_critic_score": 81, "aoty_user_score": 82, "mbid": "4bf978f8-0408-37f0-961f-a492bad0159c", "yt_id": "OJNFwGdh4iE", "rym": "https://rateyourmusic.com/release/album/frightened-rabbit/the-midnight-organ-fight", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "The Midnight Organ Fight is the second studio album by Scottish indie rock band Frightened Rabbit, released April 15, 2008, on Fat Cat Records. Vocalist/guitarist Scott Hutchison describes the album as being \"quite relationshippy\" and \"a lot more intense\" than its predecessor Sing the Greys. Following the album's completion, it took a month for Hutchison to be able to listen to it. Lyrically, Hutchison states that \"most of the lyrics are pretty direct\" and that the album \"almost spells out what’s happened.\" However, Scott states that he tries \"to leave the door open and the metaphors vague enough, so that .", "desc_lfm_artist": "Frightened Rabbit was an indie rock band which formed in 2003 in Glasgow, Scotland. The band consisted of Scott Hutchison (b. 20 November 1981, d. 9 May 2018),  Billy Kennedy (guitar, keyboards), Grant Hutchison (drums, vocals), and Andy Monaghan (guitar, keyboards). The band has released five albums: \"Sing the Greys\" (2006), \"The Midnight Organ Fight\" (2008), \"The Winter of Mixed Drinks\" (2010), \"Pedestrian Verse\" (2013) and \"Painting of a Panic Attack\" (2016).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 95, "title": "The Airing of Grievances", "artist": "Titus Andronicus", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/845-the-airing-of-grievances_005032.jpg", "aoty_url": "https://www.albumoftheyear.org/album/845-titus-andronicus-the-airing-of-grievances.php", "aoty_critic_score": 82, "aoty_user_score": 77, "mbid": "86f7620f-2bf3-38fe-b345-94ff2a8c5314", "yt_id": "a9M87fvrp9Y", "rym": null, "genres": ["Punk", "Alternative Rock"], "desc_lfm_album": "The Airing of Grievances is the first studio album by American punk rock band Titus Andronicus. The album combines elements of punk rock, shoegaze, and lo-fi music. .", "desc_lfm_artist": "Titus Andronicus are an American indie punk band formed in Glen Rock, New Jersey in 2005. They consist of Patrick Stickles (vocals, guitar), Julian Veronesi (bass), Liam Betson (guitar) and Eric Harm (drums). The band takes its name from the Shakespeare play Titus Andronicus. Titus Andronicus is known for their energetic folk/punk/indie sound (tinted with hints of New Jersey rock and early rock 'n' roll) and their use of lo-fi production.\n\nTheir debut album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario"]}, {"n": 96, "title": "Dig, Lazarus, Dig!!!", "artist": "Nick Cave & The Bad Seeds", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/799-dig-lazarus-dig_095433.jpg", "aoty_url": "https://www.albumoftheyear.org/album/799-nick-cave-the-bad-seeds-dig-lazarus-dig.php", "aoty_critic_score": 84, "aoty_user_score": 75, "mbid": "3e63aa06-0538-3680-8d11-800f5950b9b3", "yt_id": "Ua_DeAqfbZI", "rym": null, "genres": [], "desc_lfm_album": "Dig, Lazarus, Dig!!! is the fourteenth studio album by Australian alternative rock band Nick Cave & the Bad Seeds. The album was recorded in June and July 2007 at The State of the Ark Studios in Richmond, London and mixed by Nick Launay at British Grove Studios in Chiswick, and was released on 3 March 2008. It would also be the last album to feature founding member Mick Harvey, who left the Bad Seeds in 2009, and the second without founding member Blixa Bargeld. Dig features the same personnel as the Abattoir Blues/The Lyre of Orpheus double album. It is .", "desc_lfm_artist": "Nick Cave & the Bad Seeds is an Australian post-punk band formed in Melbourne in 1983 by vocalist Nick Cave, multi-instrumentalist Mick Harvey and guitarist Blixa Bargeld. The band has featured international personnel throughout its career and has released a lengthy series of studio albums and completed numerous international tours. \n\nThe band presently consists of Cave, violinist and multi-instrumentalist Warren Ellis, bassist Martyn P. Casey (all from Australia)", "desc_mb_album": "", "desc_mb_artist": "Some releases are credited to \"Nick Cave & the Bad Seeds\" others are \"Nick Cave and the Bad Seeds.\" This is intentional on the part of the editors and matches the various releases. If you need to group them or normalize them in your own collection, use the %albumartistsort% variable (or something like \"$if2(%albumartistsort%,%albumartist%,%artistsort%,%artist%)\") in your tagger.\r\n\r\nDo not make arbitrary edits to the artist credits unless you can prove that your edit matches the release.", "heard_by": ["armandwave"]}, {"n": 97, "title": "Sun Giant", "artist": "Fleet Foxes", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2523-sun-giant_210155.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2523-fleet-foxes-sun-giant.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "5d48f82c-08c5-3df9-814c-2a4f8c1ad554", "yt_id": "IFK5JFcAJwQ", "rym": null, "genres": [], "desc_lfm_album": "Sun Giant is an EP by Seattle-based band Fleet Foxes, released on April 8, 2008, on Bella Union and Sub Pop. The EP was named the #1 album of the year by Pitchfork in conjunction with their debut LP, Fleet Foxes. While the EP was released prior to their debut album, Fleet Foxes, the songs on Sun Giant were recorded after those that feature on their full-length album. The band stated that the EP was pressed so that they had something to sell on tour, and clarified that the music was not indicative of their ambitions. Sun Giant was in .", "desc_lfm_artist": "Fleet Foxes is an American indie folk band formed in Seattle, Washington in 2006. The band consists of Robin Pecknold (vocals, guitar), Skyler Skjelset (guitar, mandolin, backing vocals), Casey Wescott (keyboards, mandolin, backing vocals), Christian Wargo (bass, guitar, backing vocals) and Morgan Henderson (upright bass, guitar, woodwinds, violin, percussion, saxophone).\n\nLed by singer-songwriter Robin Pecknold, the band came to prominence in 2008 with the release of their second EP Sun Giant and their debut album Fleet Foxes on Sub Pop.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "sdecandelario"]}, {"n": 98, "title": "Stainless Style", "artist": "Neon Neon", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/stainless-style-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/741-neon-neon-stainless-style.php", "aoty_critic_score": 80, "aoty_user_score": 71, "mbid": "2157f739-3749-4440-a5ed-a36a75ff7bdf", "yt_id": "cz-6MH9ZoBg", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Neon Neon is a collaboration between the artists Boom Bip and Gruff Rhys. They first worked together on Boom Bip's Blue Eyed in the Red Room album, released in 2005. Their debut album, Stainless Style was released on March 18th, 2008 through Lex Records. Their first single Trick for Treat is also out, and can be heard on their myspace page.\n\nThe album \"Stainless Style\" was nominated for the 2008 Mercury Prize.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 99, "title": "Crystal Castles", "artist": "Crystal Castles", "year": 2008, "cover": "https://dn710809.ca.archive.org/0/items/mbid-d662c650-497e-406a-8d05-11016fadcfbe/mbid-d662c650-497e-406a-8d05-11016fadcfbe-26552368891.jpg", "aoty_url": "https://www.albumoftheyear.org/album/809-crystal-castles-crystal-castles.php", "aoty_critic_score": 72, "aoty_user_score": 81, "mbid": "9477d99c-1df7-4ae7-b08d-a2484c8e80f4", "yt_id": "DuoTdnq_OqE", "rym": "https://rateyourmusic.com/release/album/crystal-castles/crystal-castles/", "genres": ["electro", "electropop", "euro house", "alternative pop", "electroclash", "bitpop"], "desc_lfm_album": "Crystal Castles is the debut studio album by Canadian electronic music duo Crystal Castles; at the time of its release, the group consisted of producer Ethan Kath and singer Alice Glass. The two met each other in 2004 and both had an interest in noise music acts like AIDS Wolf & The Sick Lipstick. This inspired the two to start a project that made noise music, but instead of guitars, they would use electronic sounds made with a circuit-bent Atari 5200, which led multiple journalists to describe their genre of music as a chiptune style they did not intend it .", "desc_lfm_artist": "Crystal Castles was an experimental /  electronic band which formed in 2003 in Toronto, Ontario, Canada and last consisted of Ethan Kath and vocalist Edith Frances. Alice Glass served as the lead vocalist for the group since its foundation until 2014.\n\nThey are named after the lyrics \"The fate of the world is safe in Crystal Castles\" and \"Crystal Castles, the source of all power\" both from the theme song for She-Ra's fortress. They are known for their melancholic lo-fi sound and their explosive live shows.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 100, "title": "The Seldom Seen Kid", "artist": "Elbow", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/the-seldom-seen-kid.jpg", "aoty_url": "https://www.albumoftheyear.org/album/742-elbow-the-seldom-seen-kid.php", "aoty_critic_score": 82, "aoty_user_score": 79, "mbid": "e7750214-a944-370f-a68e-99e63cda4758", "yt_id": "b5Wgwfcj0Sg", "rym": "https://rateyourmusic.com/release/album/elbow/the-seldom-seen-kid", "genres": [], "desc_lfm_album": "The Seldom Seen Kid is the fourth studio album by the indie rock band Elbow. It was released by Fiction Records on March 17, 2008 in the United Kingdom, and was released by Geffen Records on April 22, 2008 in the United States. The album was recorded at Blueprint Studios in Manchester, and is the first Elbow album to be entirely self-produced, mixed and recorded without any outside help. The bulk of the record was written and performed by the band, besides a guest appearance from singer-songwriter Richard Hawley who contributes to guest vocals, lead guitar and co-songwriting on The .", "desc_lfm_artist": "Elbow is an alternative rock band that got started in Bury, Greater Manchester, United Kingdom in 1990. Formed when its members were in sixth-form college, the group consists of Guy Garvey (vocals, guitar), Mark Potter (guitar, vocals), Pete Turner (bass), Craig Potter (keyboards) and Richard Jupp (drums). Over the band's twenty plus year career, it has released eight studio albums and four EPs while also having over five top 40 singles in the U.K. alone.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave", "sdecandelario"]}, {"n": 101, "title": "ObZen", "artist": "Meshuggah", "year": 2008, "cover": "https://i.discogs.com/7rukxz_VyAmR9dY5bi98r1ZFu7RF_L1GIq2MjV2EwbI/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTI2MDgx/OTItMTI5Mjk1MDA1/My5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/8290-meshuggah-obzen.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": "bc3c02ea-5837-32ab-9c65-f60125458187", "yt_id": "BNv6mk2Zc24", "rym": null, "genres": [], "desc_lfm_album": "obZen is the sixth album by Swedish metal band Meshuggah. It was released in Europe on March 7, 2008, and in North America on March 11, 2008, through Nuclear Blast. Tomas Haake made his return as the studio drummer for the record after the Drumkit from Hell drum software was used on Catch Thirtythree. The release of the album was followed by their first world tour. A video was filmed for a shorter version of the song \"Bleed\". .", "desc_lfm_artist": "Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 102, "title": "New Amerykah Part One (4th World War)", "artist": "Erykah Badu", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/754-new-amerykah-part-one-4th-world-war_125848.jpg", "aoty_url": "https://www.albumoftheyear.org/album/754-erykah-badu-new-amerykah-part-one-4th-world-war.php", "aoty_critic_score": 84, "aoty_user_score": 77, "mbid": "c418cb3c-047e-32c1-b899-54cbce4be8e8", "yt_id": "n25vseUQdK8", "rym": null, "genres": [], "desc_lfm_album": "New Amerykah Part One (4th World War) is Erykah Badu's fifth studio album. It features 10 tracks, including Honey as a hidden one. Honey, The Healer and Soldier are singles from this album, although only Honey has a music video. A sequel to this album, New Amerykah Part Two (Return of the Ankh), has been released on March 30th, 2010. .", "desc_lfm_artist": "Erykah Badu (born Erica Abi Wright on February 26, 1971 in Dallas, Texas) is an American R'n'B/neo-soul artist whose work crosses over into jazz. \n\nShe is best known for her singles You Got Me her collaboration with The Roots, as well as her own songs Tyrone, Love of My Life, On & On, Bag Lady, The Healer,  Honey and Soldier. Her lyrics are highly personal urban philosophy which throw emotional challenges in the face of the listener. She weaves unusual musical influences together creating a rich texture of sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "alberto_gu"]}, {"n": 103, "title": "Vampire Weekend", "artist": "Vampire Weekend", "year": 2008, "cover": "https://dn721905.ca.archive.org/0/items/mbid-1884d632-23db-4a5a-bc0e-f57fa0f27405/mbid-1884d632-23db-4a5a-bc0e-f57fa0f27405-15448813956.jpg", "aoty_url": "https://www.albumoftheyear.org/album/805-vampire-weekend-vampire-weekend.php", "aoty_critic_score": 82, "aoty_user_score": 80, "mbid": "44878c8d-4b85-3d7b-9ed2-143b9fbb9169", "yt_id": "l3yXnBiidzM", "rym": "https://rateyourmusic.com/release/album/vampire-weekend/vampire-weekend/", "genres": ["indie rock"], "desc_lfm_album": "Vampire Weekend is the debut album by American indie rock band Vampire Weekend, released January 2008 on XL Recordings. The album was produced by band member Rostam Batmanglij, with mixing assistance from Jeff Curtin and Shane Stoneback. In the United States, the album sold over 27,000 copies in the first week of its release, debuting at number 17 on the Billboard 200 and as of 20 January 2010, has sold nearly half a million copies. In the album's 11th week in the UK chart, it peaked at number 15. The album also reached number 37 in Australia. The album's distinctive .", "desc_lfm_artist": "Vampire Weekend is an American indie rock band formed in February 2006 in New York, New York, United States. The band consists of Ezra Koenig (vocals, guitar), Chris Baio (bass) and Christopher Tomson (drums). Rostam Batmanglij has left the band in early 2016 to begin solo career, but will continue to collaborate with Ezra. The band has released four albums: \"Vampire Weekend\" (2008), \"Contra\" (2010)\",\"Modern Vampires of the City\" (2013) and \"Father of the Bride\" (2019).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 104, "title": "Deathconsciousness", "artist": "Have A Nice Life", "year": 2008, "cover": "https://dn710809.ca.archive.org/0/items/mbid-a3631ea6-ac2f-43a9-86d8-6bb1ff541459/mbid-a3631ea6-ac2f-43a9-86d8-6bb1ff541459-24884483825.jpg", "aoty_url": "https://www.albumoftheyear.org/album/13444-have-a-nice-life-deathconsciousness.php", "aoty_critic_score": 90, "aoty_user_score": 91, "mbid": "bb449522-eefd-3d7e-b712-b2cf7e9de0b1", "yt_id": "9Pp9DC56hh8", "rym": null, "genres": ["drone", "post-punk", "gothic rock", "shoegaze", "post-rock", "doomgaze"], "desc_lfm_album": "Deathconsciousness is the debut studio album by Connecticut rock duo Have a Nice Life, formed by Dan Barrett and Tim Macuga, released on January 24, 2008, via Enemies List Home Recordings. Recorded independently by the two band members on a budget of less than $1,000, and spending from 2002 - 2007 (5 years) writing the songs. Deathconsciousness was released as a double album; the first disc is entitled \"The Plow That Broke the Plains\" and the second is entitled \"The Future\". The original cover art features a darkened version of the painting \"The Death of Marat\", painted by Jacques-Louis David .", "desc_lfm_artist": "Have a Nice Life is an American post-punk / shoegaze duo from Middletown, Connecticut, formed in 2000 by Dan Barrett and Tim Macuga. The project is known for blending gothic rock, industrial, ambient, and drone elements into an atmospheric and emotionally intense sound.\n\nBarrett is also known for his solo project Giles Corey and the now-defunct band In Pieces, while Macuga has been involved with black metal project Nahvalr and Western Massachusetts hardcore band The Danger Strangers.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 105, "title": "Super Mario Galaxy: Original Soundtrack", "artist": "Mario Galaxy Orchestra", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/146715-super-mario-galaxy-original-soundtrack.jpg", "aoty_url": "https://www.albumoftheyear.org/album/146715-mario-galaxy-orchestra-super-mario-galaxy-original-soundtrack.php", "aoty_critic_score": 91, "aoty_user_score": null, "mbid": "fcdeb0b8-5a30-4e68-b18a-a43cb51049ec", "yt_id": "Vc4LkBGjJRo", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Mario Galaxy Orchestra is a group of approximately 50 or so members organized by Super Mario Galaxy sound team to record the 28 orchestral tracks composed for the game.  With music composed by Koji Kondo and Mahito Yokota, the adventurous score was recorded in late August 2007.\n\nKondo often asked much of the orchestra, such as playing at strange tempos in order to best sync with Mario's natural movements or incorporating sound effects into the orchestra scores themselves.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 106, "title": "MASS OF THE FERMENTING DREGS", "artist": "MASS OF THE FERMENTING DREGS", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/26006-mass-of-the-fermenting-dregs.jpg", "aoty_url": "https://www.albumoftheyear.org/album/26006-mass-of-the-fermenting-dregs-mass-of-the-fermenting-dregs.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "aeeba3c1-b0bd-3376-9787-04b1e80b6f85", "yt_id": "G4CKmzBf5Cs", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "MASS OF THE FERMENTING DREGS (マス オブ ザ ファーメンティング ドレッグス) is an alternative rock trio formed in Kobe, Japan in 2002, later reforming in 2015. They are also popularly known by a shortened form of their name, Masu Dore (マスドレ). They are known for a tightly arranged, guitar-driven style, melodic pop vocals and a high-energy stage presence at their live events. They were signed to the Japanese indie rock record label AVOCADO Records from the release of their self-titled EP in January 2008.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "verygooood"]}, {"n": 107, "title": "Do You Like Rock Music?", "artist": "Sea Power", "year": 2008, "cover": "https://cdn2.albumoftheyear.org/600x0/album/817-do-you-like-rock-music_235655.jpg", "aoty_url": "https://www.albumoftheyear.org/album/817-sea-power-do-you-like-rock-music.php", "aoty_critic_score": 82, "aoty_user_score": 79, "mbid": "5814908e-70e8-3aee-b8c4-076803bfee3a", "yt_id": "w2n-7K0Ef6Y", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Sea Power, formerly known as British Sea Power, are an indie rock band from the UK. They released their first album, \"The Decline of British Sea Power,\" in 2003. Their latest album, \"Everything Was Forever,\" the first under the Sea Power moniker, will be released in February 2022.\n\nIn 2020, they won a BAFTA for their soundtrack to the computer game Disco Elysium.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 108, "title": "Il était une forêt...", "artist": "Gris", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10018-il-etait-une-foret_190624.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10018-gris-il-etait-une-foret.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "6aae5c44-8a6b-391e-ac80-9460b2f07f27", "yt_id": "WS0l0o45IUw", "rym": "https://rateyourmusic.com/release/album/gris/il-etait-une-foret", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "There are at least four different artists under this name:\n\n1) Gris is a black metal band from Quebec, Canada, formerly known as Niflheim. \"Gris\" means \"grey\" in French. They have released two full-length albums to date: \"Il était une forêt...\" in 2007 and \"À l'Âme Enflammée, l'Äme Constellée...\" in 2013.\n\n2) Gris is a German rapper.\n\n3) Gris is a Finnish band making jazz related music. \n\n4) Gris is an alternative rock band from Argentina.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 109, "title": "Lupe Fiasco's The Cool", "artist": "Lupe Fiasco", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/668-lupe-fiascos-the-cool_181020.jpg", "aoty_url": "https://www.albumoftheyear.org/album/668-lupe-fiasco-lupe-fiascos-the-cool.php", "aoty_critic_score": 74, "aoty_user_score": 81, "mbid": "67a252dd-6f32-3b25-bfe8-2eb5dc7177c8", "yt_id": "WPYCTgoerx8", "rym": "https://rateyourmusic.com/release/album/lupe-fiasco/lupe-fiascos-the-cool", "genres": [], "desc_lfm_album": "Lupe Fiasco's The Cool, commonly referred to as simply The Cool, is the critically acclaimed second studio album by Chicago hip hop artist Lupe Fiasco, released on December 18, 2007 in the United States. The Cool is a loose concept album, based on a song and its titular character from his debut album Food & Liquor of the same name. The album features production from Soundtrakk, Unkle, Patrick Stump and Chris & Drop, among others. Guest appearances include GemStones, Snoop Dogg, and Matthew Santos. The album debuted at #15, moved a spot up to #14 on the Billboard 200 in .", "desc_lfm_artist": "Wasalu Muhammad Jaco (born February 16, 1982 in Chicago, Illinois), better known by his stage name Lupe Fiasco, is a Grammy Award-winning American hip-hop artist and producer. He first became known to the mainstream hip-hop community in 2005 when he appeared on Kanye West's album Late Registration on the track \"Touch the Sky.\" In 2006 Lupe released his debut album, Lupe Fiasco's Food & Liquor on Atlantic Records, and in December 2007 he released his second full length album, Lupe Fiasco's The Cool  .", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo"]}, {"n": 110, "title": "Alive 2007", "artist": "Daft Punk", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2780-alive-2007_200602.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2780-daft-punk-alive-2007.php", "aoty_critic_score": 75, "aoty_user_score": 92, "mbid": "4bac3d70-deea-3d80-85c4-8be9f90558e6", "yt_id": "84JTYVNoBKw", "rym": "https://rateyourmusic.com/release/album/daft-punk/alive-2007/", "genres": [], "desc_lfm_album": "Alive 2007 is a live album by Daft Punk, first released on November 19, 2007. It is the second album recorded live by the duo, following Alive 1997. Alive 2007 features their performance at Bercy in Paris from June 14, 2007. The physical release in North America was delayed to December 4 due to production issues, but the album became available as a digital download on November 20, 2007. A special edition of the album was released that includes the encore from the Alive 2007 tour on a second disc. It also includes a 50-page book containing photographs from the .", "desc_lfm_artist": "Daft Punk was a multi Grammy Award-winning electronic music duo formed in 1993 in Paris, France, and separated in early 2021, consisting of French musicians Thomas Bangalter (born 3 January 1975) and Guy-Manuel de Homem-Christo (born 8 February 1974). The band is considered one of the most successful electronic music collaborations of all time, both in album sales and in critical acclaim. \n\nDaft Punk reached significant popularity in the late 90s house movement in France, along with other artists such as Air, Cassius, and Dimitri From Paris.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 111, "title": "Ire Works", "artist": "The Dillinger Escape Plan", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/417-ire-works_144214.jpg", "aoty_url": "https://www.albumoftheyear.org/album/417-the-dillinger-escape-plan-ire-works.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "1608b4bf-4909-3a7a-b318-f3b045a090f6", "yt_id": "xJc29xnuJ-8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Dillinger Escape Plan is a hardcore band from Morris Plains, New Jersey, United States. The group originated in 1997 after the disbanding of Arcane, a hardcore punk trio consisting of Ben Weinman, Dimitri Minakakis, and Chris Pennie. The band performs a fast-tempo, technically proficient style of heavy music popularly known as mathcore. The band recorded their second EP with Relapse Records in 1998 entitled Under the Running Board. A year later", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 112, "title": "Untrue", "artist": "Burial", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/403-untrue_030405.jpg", "aoty_url": "https://www.albumoftheyear.org/album/403-burial-untrue.php", "aoty_critic_score": 92, "aoty_user_score": 85, "mbid": "fddedc4f-7a2e-3d7d-9ec5-1705c416f3f4", "yt_id": "GrChfkWDq9o", "rym": "https://rateyourmusic.com/release/album/burial/untrue-5/", "genres": ["dubstep", "future garage", "hauntology", "Electronic"], "desc_lfm_album": "Untrue is the second album by the formerly-anonymous-but-now-unmasked dubstep producer known as Burial. It was released on November 4th, 2007 as a 13-track Digipack CD and a nine-track 2xLP from which some of the beatless pieces were edited. The album received a large amount of praise from many publications: It was named the best album of 2007 by Sputnikmusic, the 2nd best by The Wire, the 8th by Tiny Mix Tapes, and 10th by Pitchfork Media. It is also the second highest rated album of 2007 according to the review averaging website, Metacritic. .", "desc_lfm_artist": "William Emmanuel Bevan, known by his recording alias Burial, is a British electronic musician from South London. Initially remaining anonymous, Burial became the first artist signed to Kode9's electronic label Hyperdub in 2005. He won acclaim the following year for his self-titled debut album, an influential release in the UK's dubstep scene which showcased a dark, emotive take on UK rave music styles such as UK garage and 2-step; it was named the album of the year by The Wire.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 113, "title": "American Gangster", "artist": "JAY-Z", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/american-gangster-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/981-jay-z-american-gangster.php", "aoty_critic_score": 82, "aoty_user_score": 76, "mbid": "4632d7ca-8813-303b-b85d-c1125cb05671", "yt_id": "BCwrGMJObcg", "rym": null, "genres": [], "desc_lfm_album": "American Gangster is the tenth studio album by American hip hop rapper Jay-Z. It was released on November 6, 2007 in the United States via the record labels Island Def Jam and Roc-A-Fella. American Gangster is Jay-Z's first concept album, which was inspired by the film of the same name. The album features production from Diddy & The Hitmen, Just Blaze, and The Neptunes, among others. Guest appearances include Beanie Sigel, Lil Wayne, and Nas. Jay-Z released a cappella version of the album on his birthday, December 4, 2007. Music critics praised American Gangster, and noted that Jay-Z was trying .", "desc_lfm_artist": "Brooklyn, New York, native Shawn Corey Carter (born December 4, 1969), known professionally as JAY-Z, is an American rapper, businessman, and record executive. He is known for his widely lauded body of work, rooted in East Coast hip-hop and characterized by lyricism that frequently incorporates wordplay, double entendres, and themes of personal advancement and success. In 2023, he was named the greatest rapper of all time by Billboard and Vibe. As of 2025, he is reported to be the wealthiest musician, with an estimated net worth of $2.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 114, "title": "Rock Dream", "artist": "Boris With Merzbow", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/149338-rock-dream_110209.jpg", "aoty_url": "https://www.albumoftheyear.org/album/149338-boris-with-merzbow-rock-dream.php", "aoty_critic_score": 80, "aoty_user_score": 92, "mbid": "55b1383d-7138-39ff-a617-1131ff78d85c", "yt_id": "6xpecYmqE7w", "rym": null, "genres": [], "desc_lfm_album": "\"Rock Dream\" is the fourth major collaboration between Boris and Merzbow and their second live album together. The album is a recording of their performance at Earthdom in Tokyo on November 18, 2006. .", "desc_lfm_artist": "Collaboration between Japanese experimental band Boris and Japanese noise pioneer Merzbow.\n\nSo far they've released five full-lengths and one extended play. In February 2011, their sixth collaborative work, \"Klatter\", was released on vinyl by Daymare Recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 115, "title": "Blackout", "artist": "Britney Spears", "year": 2007, "cover": "https://dn710805.ca.archive.org/0/items/mbid-39b6426d-0377-4b44-965e-707a4e495645/mbid-39b6426d-0377-4b44-965e-707a4e495645-25606302291.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1427-britney-spears-blackout.php", "aoty_critic_score": 63, "aoty_user_score": 83, "mbid": "0b8e14e1-d44d-3770-8617-5c6137a444a8", "yt_id": "PPzKPlugNsU", "rym": "https://rateyourmusic.com/release/album/britney-spears/blackout", "genres": ["electropop", "contemporary r&b", "europop", "euro house", "dance-pop", "electroclash"], "desc_lfm_album": "Blackout is the fifth studio album by American singer Britney Spears, released on October 25, 2007, through Jive Records. Created during a period of intense media scrutiny and personal turbulence, the album represents Spears' most radical artistic statement—a cohesive fusion of dance-pop, electropop, and synth-heavy production that would fundamentally influence the direction of mainstream pop music. Spears served as executive producer, collaborating with a new generation of producers including Danja, Bloodshy & Avant, and The Neptunes, who crafted a sonically adventurous landscape defined by distorted vocals, heavy synthesizers, and relentless club-ready beats that embraced digital manipulation as an artistic choice .", "desc_lfm_artist": "Britney Jean Spears  (born December 2, 1981 in McComb, Mississippi) is an American singer, songwriter, dancer and writer. She is credited with influencing the revival of teen pop during the late 1990s and early 2000s, for which she is referred to as the \"Princess of Pop\". Regarded as a pop icon, Spears has sold nearly 150 million records worldwide, including over 70 million solely in the United States, making her one of the world's best-selling music artists.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "alberto_gu"]}, {"n": 116, "title": "Raising Sand", "artist": "Robert Plant and Alison Krauss", "year": 2007, "cover": "https://cdn2.albumoftheyear.org/600x0/album/raising-sand.jpg", "aoty_url": "https://www.albumoftheyear.org/album/405-robert-plant-and-alison-krauss-raising-sand.php", "aoty_critic_score": 82, "aoty_user_score": 73, "mbid": "28129af8-25e1-36e6-a0f1-e8f0fa5779cf", "yt_id": "oPggeBUVZmI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Robert Plant and Alison Krauss met at a tribute concert to Leadbelly.\n\nThe two decided to collaborate, and recorded an album called Raising Sand.  Recorded in Nashville, and produced by T-Bone Burnett, features the legendary singers doing lesser-known material from various folk, country and blues songwriters including he Everly Brothers, Townes Van Zandt, Gene Clark, Tom Waits, Doc Watson, Little Milton Campbell and Mel Tillis.\n\nRaising Sand was released during October 2007", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 117, "title": "All Hour Cymbals", "artist": "Yeasayer", "year": 2007, "cover": "https://dn721801.ca.archive.org/0/items/mbid-80d9a49b-286d-4183-b03a-421aba5b9062/mbid-80d9a49b-286d-4183-b03a-421aba5b9062-35000536854.jpg", "aoty_url": "https://www.albumoftheyear.org/album/476-yeasayer-all-hour-cymbals.php", "aoty_critic_score": 85, "aoty_user_score": 77, "mbid": "df4fac03-3cf5-337c-adcb-c32aed6a0898", "yt_id": "zMB8__gMxX4", "rym": "https://rateyourmusic.com/release/album/yeasayer/all-hour-cymbals", "genres": ["experimental rock", "pop rock", "psychedelic folk", "indie rock", "neo-psychedelia", "post-rock"], "desc_lfm_album": "All Hour Cymbals is the debut studio album by Brooklyn-based experimental rock group Yeasayer. It was released by We Are Free on 23 October 2007, and 24 March 2008 in the UK. The album received positive reviews from publications and websites such as Entertainment Weekly, NME, Pitchfork Media, and Spin. The music review online magazine Pitchfork Media placed All Hour Cymbals' at number 197 on their list of top 200 albums of the 2000s .", "desc_lfm_artist": "Yeasa
