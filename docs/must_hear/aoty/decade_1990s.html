<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AOTY Must Hear — 1990s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" href="/images/discount.png" />
<script defer src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--border:#1e1e1e;
  --accent:#e8ff47;--heard:#e8ff47;--pending:#ff4747;
  --text:#e0e0e0;--muted:#555;--gap:6px;
  --panel:390px;--header-h:58px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
header{
  position:fixed;top:0;left:0;right:var(--panel);height:var(--header-h);z-index:100;
  background:rgba(10,10,10,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:0 18px;display:flex;align-items:center;gap:12px;
}
.back-link{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.header-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.dec-wrap{position:relative}
.dec-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);
  color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.dec-btn:hover{background:rgba(232,255,71,.12)}
.dec-dropdown{
  display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:160px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.dec-dropdown.open{display:block}
.dec-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.dec-item{display:block;padding:6px 14px;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text);text-decoration:none;transition:background .1s}
.dec-item:hover{background:var(--surface)}
.dec-item.active{color:var(--accent)}
.controls{display:flex;align-items:center;gap:7px;margin-left:auto;flex-shrink:0}
.filter-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;
}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.search-box{
  font-family:'DM Mono',monospace;font-size:.62rem;padding:4px 9px;
  background:var(--surface);border:1px solid var(--border);border-radius:3px;
  color:var(--text);width:130px;outline:none;transition:border-color .15s;
}
.search-box:focus{border-color:var(--accent)}
.search-box::placeholder{color:var(--muted)}
.genre-wrap{position:relative}
.genre-btn{
  font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;
  padding:4px 9px;border-radius:3px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px;
}
.genre-btn:hover,.genre-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,.06)}
.genre-btn .badge{background:var(--accent);color:#000;border-radius:10px;padding:1px 5px;font-size:.52rem;font-weight:700}
.genre-dropdown{
  display:none;position:fixed;
  background:#161616;border:1px solid var(--border);border-radius:4px;
  z-index:9999;min-width:200px;max-height:320px;overflow-y:auto;padding:4px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.6);
}
.genre-dropdown.open{display:block}
.genre-dh{
  padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--border);margin-bottom:3px;
  display:flex;justify-content:space-between;
}
.genre-clear{color:var(--pending);cursor:pointer}
.genre-item{display:flex;align-items:center;gap:7px;padding:4px 10px;cursor:pointer;transition:background .1s}
.genre-item:hover{background:var(--surface)}
.genre-item input{accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.genre-item label{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--text);cursor:pointer;flex:1;display:flex;justify-content:space-between}
.genre-item label span{color:var(--muted);font-size:.56rem}
.user-wrap{position:relative}
.user-btn{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid var(--accent);background:rgba(232,255,71,.06);color:var(--accent);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.user-btn:hover{background:rgba(232,255,71,.12)}
.user-btn .u-name{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.user-dropdown{display:none;position:fixed;background:#161616;border:1px solid var(--border);border-radius:4px;z-index:9999;min-width:164px;padding:4px 0;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.user-dropdown.open{display:block}
.user-dh{padding:5px 10px 4px;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:3px}
.user-item{display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;transition:background .1s;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--text)}
.user-item:hover{background:var(--surface)}
.user-item.active{color:var(--accent)}
.user-item .u-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--border)}
.user-item.active .u-dot{background:var(--accent)}
#main{margin-top:var(--header-h);margin-right:var(--panel);padding:14px 18px 60px;position:relative;z-index:0}
.count-bar{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px;display:flex;gap:14px}
.count-bar b{color:var(--text)}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap)}
.card{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:scale(1.05);z-index:10}
.card.hidden{display:none}
.card.active-card{outline:2px solid var(--accent);outline-offset:2px;z-index:11}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:var(--surface)}
.heard-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3;background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,0) 55%);
  opacity:0;transition:opacity .18s;display:flex;flex-direction:column;justify-content:flex-end;
  padding:6px;z-index:2;
}
.card:hover .card-overlay{opacity:1}
.card-scores{display:flex;gap:3px;margin-bottom:2px}
.card-score{font-family:'DM Mono',monospace;font-size:.58rem;font-weight:700;padding:1px 4px;border-radius:2px}
.card-score.c{background:rgba(108,184,250,.2);color:#6cb8fa}
.card-score.u{background:rgba(191,143,255,.2);color:#bf8fff}
.card-title{font-size:.56rem;font-weight:500;color:#fff;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-artist{font-size:.52rem;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card::before{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;z-index:3}
.card.heard-user::before{background:var(--heard);box-shadow:0 0 5px var(--heard)}
.card.unheard-user::before{background:var(--pending);box-shadow:0 0 5px var(--pending)}
#panel{
  position:fixed;top:0;right:0;bottom:0;width:var(--panel);
  background:#0c0c0c;border-left:1px solid var(--border);
  z-index:50;display:flex;flex-direction:column;overflow:hidden;
}
.panel-topbar{height:var(--header-h);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 15px;flex-shrink:0}
.panel-topbar-label{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.panel-cover{width:100%;aspect-ratio:1;flex-shrink:0;position:relative;background:var(--surface);max-height:200px;overflow:hidden}
.panel-cover img{width:100%;height:100%;object-fit:cover;display:block}
.panel-scores{display:flex;gap:6px;position:absolute;bottom:8px;left:8px}
.panel-score{padding:3px 8px;border-radius:3px;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700}
.panel-score.c{background:rgba(0,0,0,.7);color:#6cb8fa;border:1px solid #6cb8fa44}
.panel-score.u{background:rgba(0,0,0,.7);color:#bf8fff;border:1px solid #bf8fff44}
.panel-body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-body::-webkit-scrollbar{width:3px}
.panel-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);text-align:center}
.panel-empty-icon{font-size:2rem;opacity:.3}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.04em;color:var(--text);line-height:1.05;margin-bottom:2px}
.panel-artist{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.panel-year{font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted);margin-bottom:10px}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.panel-genre-tag{font-family:'DM Mono',monospace;font-size:.56rem;padding:2px 6px;border-radius:2px;background:rgba(232,255,71,.07);border:1px solid rgba(232,255,71,.18);color:rgba(232,255,71,.65)}
.panel-heard-by{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);margin-bottom:9px}
.panel-heard-by b{color:var(--heard)}
.panel-divider{height:1px;background:var(--border);margin:9px 0}
.panel-section-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.panel-bio{font-size:.72rem;color:#aaa;line-height:1.6;max-height:120px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.panel-bio::-webkit-scrollbar{width:3px}
.panel-bio::-webkit-scrollbar-thumb{background:var(--border)}
.desc-block{margin-bottom:9px}
.desc-source-label{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.desc-source-label::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.desc-source-label.lfm{color:#d51007}.desc-source-label.mb{color:#ba478f}.desc-source-label.artist{color:#6a9fb5}
.desc-source-text{font-size:.7rem;color:#aaa;line-height:1.55}
.panel-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.panel-link{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-decoration:none;transition:all .15s}
.panel-link:hover{border-color:var(--accent);color:var(--accent)}
.panel-link.aoty{border-color:#e87c2e;color:#e87c2e}
.panel-link.aoty:hover{background:rgba(232,124,46,.08)}
.panel-link.yt{border-color:#f00;color:#f00}
.panel-link.yt:hover{background:rgba(255,0,0,.08)}
.panel-link.rym{border-color:#5baadb;color:#5baadb}
.panel-link.rym:hover{background:rgba(91,170,219,.08)}
.panel-yt-wrap{margin-top:11px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.panel-yt-wrap iframe{display:block;width:100%;height:145px;border:none}
.panel-yt-placeholder{height:60px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}
.panel-close-btn{display:none;position:absolute;top:13px;right:13px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;align-items:center;justify-content:center;z-index:10;transition:background .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.18)}
.grid-sizer{display:flex;align-items:center;gap:5px}
.grid-sizer span{font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);min-width:24px;text-align:right}
#grid-slider{-webkit-appearance:none;appearance:none;width:70px;height:3px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
#grid-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent);cursor:pointer}
#grid-slider::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
#empty{display:none;text-align:center;padding:50px 0;font-family:'DM Mono',monospace;color:var(--muted);font-size:.7rem}
@media(max-width:600px){
  :root{--header-h:50px}
  header{right:0;height:auto;min-height:var(--header-h);flex-wrap:wrap;padding:8px 12px;gap:6px 10px;overflow:visible}
  #main{margin-right:0;padding:10px 10px 60px}
  #panel{inset:0;width:100%;border-left:none;transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  #panel.panel-open{transform:translateY(0)}
  .panel-close-btn{display:flex}
  .controls{flex:0 0 100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;gap:5px;padding:5px 0 2px;border-top:1px solid var(--border);scrollbar-width:none}
  .controls::-webkit-scrollbar{display:none}
  .dec-wrap{display:none}
}</style>
</head>
<body>
<header>
  <a href="index.html" class="back-link">←</a>
  <span class="header-title">AOTY Must Hear</span>
  <div class="dec-wrap">
    <button class="dec-btn" id="dec-btn" onclick="toggleDecDD()">
      1990s &#x25BE;
    </button>
  </div>
  <div class="controls">
    <button class="filter-btn active" id="btn-all"     onclick="setFilter('all')">All</button>

    <button class="filter-btn"        id="btn-unheard" onclick="setFilter('unheard')">Unheard</button>
    <input class="search-box" id="search" placeholder="Search..." oninput="applyFilters()">
    <div class="genre-wrap">
      <button class="genre-btn" id="genre-btn" onclick="toggleGenreDD()">
        Genre <span class="badge" id="genre-badge" style="display:none">0</span> &#x25BE;

      <button class="user-btn" id="user-btn" onclick="toggleUserDD()">
        <span class="u-name" id="user-btn-label">All users</span> &#x25BE;
      </button>
    </div>
    <div class="grid-sizer">
      <span id="grid-label">10×</span>
      <input type="range" id="grid-slider" min="3" max="20" value="10" step="1" oninput="setGridSize(this.value)">
    </div>
  </div>
</header>
<main id="main">
  <div class="count-bar">
    <span>Showing <b id="vis-count">432</b> of 432</span>
    <span><b id="vis-heard">0</b> heard</span>
  </div>
  <div id="grid"></div>
  <div id="empty">No albums match your filters.</div>
</main>
<aside id="panel">
  <button class="panel-close-btn" onclick="closePanel()" aria-label="Close">&#x2715;</button>
  <div class="panel-topbar">
    <span class="panel-topbar-label">Album detail</span>
  </div>
  <div id="panel-cover-wrap" class="panel-cover" style="display:none">
    <img id="p-cover" src="" alt="">
    <div class="panel-scores" id="p-scores"></div>
  </div>
  <div class="panel-body" id="panel-body">
    <div class="panel-empty"><div class="panel-empty-icon">◉</div>Click an album</div>
  </div>
</aside>
<div class="dec-dropdown" id="dec-dd">
  <div class="dec-dh">Jump to decade</div>
  <a class="dec-item" href="decade_1950s.html">1950s</a><a class="dec-item" href="decade_1960s.html">1960s</a><a class="dec-item" href="decade_1970s.html">1970s</a><a class="dec-item" href="decade_1980s.html">1980s</a><a class="dec-item active" href="decade_1990s.html">1990s</a><a class="dec-item" href="decade_2000s.html">2000s</a><a class="dec-item" href="decade_2010s.html">2010s</a><a class="dec-item" href="decade_2020s.html">2020s</a>
</div>
<div class="genre-dropdown" id="genre-dd">
  <div class="genre-dh">Filter by genre <span class="genre-clear" onclick="clearGenres()">clear</span></div>
  <div id="genre-list"></div>
</div>
<div class="user-dropdown" id="user-dd">
  <div class="user-dh">View as user</div>
  <div id="user-list"></div>
</div>
<script>
const ALBUMS = [{"n": 1, "title": "Vision Creation Newsun", "artist": "Boredoms", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1141-vision-creation-newsun_162301.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1141-boredoms-vision-creation-newsun.php", "aoty_critic_score": 77, "aoty_user_score": 86, "mbid": "0626bb5e-f69d-30a2-a42c-12593a4d4878", "yt_id": "lFsnPQ6JoQA", "rym": "https://rateyourmusic.com/release/album/boredoms/vision-creation-newsun/", "genres": ["leftfield", "post-rock", "Rock"], "desc_lfm_album": "Vision Creation Newsun finds Boredoms moving even further away from the random noise that marked their early output and settling into a loose, jam-oriented aesthetic. The first two tracks (no song titles here, only symbols) find Boredoms further investigating pounding tribal rock with propulsive drumming, energetic guitar work, and vocal chants. The overall feel bears some similarity to Super æ, with tracks that draw from Krautrock and psychedelia, but Vision Creation Newsun adds a folk element, including softer instrumental textures like hand percussion, lengthy cymbal washes, and acoustic guitars. Some passages even flirt with new age, as they weave bird .", "desc_lfm_artist": "Boredoms (sometimes known as V∞redoms) is a psychedelic/ noise rock group from Osaka, Japan. The band was officially formed in 1986, although some date the band to bedroom tape experiments from 1982. \nIn a career spanning around 30 years the group has undergone multiple changes in line-up, sound and philosophy. Beginning as a dada ‘no-core’ noise-punk outfit, transmuting into psychedelic krautrockers, their more recent records have been largely based around repetitive minimalism", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 2, "title": "HAPPY BIVOUAC", "artist": "the pillows", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/69832-happy-bivouac.jpg", "aoty_url": "https://www.albumoftheyear.org/album/69832-the-pillows-happy-bivouac.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": "e81bfe4f-9558-3acd-b6e5-62745c800ac6", "yt_id": "WYGgvL3Cc9s", "rym": null, "genres": [], "desc_lfm_album": "Released on December 2nd, 1999, \"Happy Bivouac on the Hillari Step\" (better known as \"Happy Bivouac\") is the eighth album by the Pillows. Several songs from this album as well as from \"Runners High\" and \"Little Busters\" were used in the 2001 OVA \"FLCL\". .", "desc_lfm_artist": "There are at least 2 known bands with this name:\n1. An alternative rock band from Japan\n2. An alternative rock band from Slovakia\n\n1. the pillows (ザ・ピロウズ) were an alternative rock band from Hokkaidō, Japan, best known outside Japan for their contributions to the soundtrack of the anime series FLCL (Fooly Cooly). \nTheir final lineup consisted of vocalist and guitarist 山中さわお (Sawao Yamanaka), lead guitarist 真鍋吉明 (Yoshiaki Manabe), and drummer 佐藤シンイチロウ (Shinichiro Sato.)", "desc_mb_album": "", "desc_mb_artist": "Yes, it's supposed to be lower case.\r\n\r\nthe pillows are perhaps most known in the US for providing much of the soundtrack to the anime ''FLCL'' (aka ''Fooly Cooly'', ''フリクリ'', ''Furi Kuri'').", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 3, "title": "Halfway to a Threeway", "artist": "Jim O'Rourke", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7885-halfway-to-a-threeway-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7885-jim-orourke-halfway-to-a-threeway.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "1a1bc15a-63f5-375f-a0c7-ac7297c79a64", "yt_id": "8LeaT2SMM88", "rym": null, "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "", "desc_lfm_artist": "American indie rock and avant-garde musician, composer and producer Jim O'Rourke (born January 18, 1969, in Chicago) has been a key component in the increasing overlap of the American and European experimental music avant-garde, working in everything from jazz and u Hold Your Own Hand and Remember That Depth Is the Greatest of Heights and If You Know Where You Stand, Then You Know Where to Land and If You Fall It Won’t Matter, Cuz You’ll Know That You’re Right", "artist": "Fiona Apple", "year": 1999, "cover": "https://dn721609.ca.archive.org/0/items/mbid-e1f7b079-46d7-4ca3-b878-d6ed6a0d34b2/mbid-e1f7b079-46d7-4ca3-b878-d6ed6a0d34b2-40607758295.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3d3ff0b9-5858-33f3-9d67-8ba5977899a8", "yt_id": "ZVkuVOH0MhQ", "rym": null, "genres": ["pop rock", "jazz rock", "soft rock", "piano rock", "alternative pop", "rock"], "desc_lfm_album": "", "desc_lfm_artist": "Fiona Apple McAfee-Maggart (born September 13, 1977) is an American singer-songwriter. She is known for her songwriting and has released five albums between 1996 and 2020, all of which reached the top 20 on the U.S. Billboard 200 chart. As of 2021, she has sold over 15 million records worldwide. Apple has received several awards, including three Grammy Awards, two MTV Video Music Awards, and a Billboard Music Video Award.\n\nApple is the youngest daughter of actor Brandon Maggart and was born in New York City.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik"]}, {"n": 7, "title": "The Battle of Los Angeles", "artist": "Rage Against the Machine", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7007-the-battle-of-los-angeles_144525.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7007-rage-against-the-machine-the-battle-of-los-angeles.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "25e72bf4-09fc-3e66-9d31-9247d91b4819", "yt_id": "sWmog0Ue4Wo", "rym": "https://rateyourmusic.com/release/album/rage-against-the-machine/the-battle-of-los-angeles", "genres": ["Metal", "Hip-Hop"], "desc_lfm_album": "\"The Battle of Los Angeles\" is the third and final studio album by American rock band Rage Against the Machine, released by Epic Records on November 2, 1999. At the 43rd Annual Grammy Awards, the album was nominated for Best Rock Album, and the song \"Guerrilla Radio\" received the award for Best Hard Rock Performance. In year-end rankings, both Time and Rolling Stone listed the album among their top releases of 1999. The album was certified double platinum by the Recording Industry Association of America, indicating sales of at least two million units in the United States. It was the .", "desc_lfm_artist": "Rage Against the Machine was an American rock band from Los Angeles, California. Formed in 1991, the group consisted of vocalist Zack de la Rocha, bassist and backing vocalist Tim Commerford, guitarist Tom Morello, and drummer Brad Wilk. Their songs express revolutionary left-wing political views. As of 2010, they had sold over 16 million records worldwide. In 2023, the band was inducted into the Rock and Roll Hall of Fame.\n\nRage Against the Machine released its eponymous debut album in 1992 to commercial and critical success", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 8, "title": "We Are the Romans", "artist": "Botch", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8422-we-are-the-romans-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8422-botch-we-are-the-romans.php", "aoty_critic_score": 88, "aoty_user_score": 84, "mbid": "3984e26f-6f28-3d27-8b9d-06441e9db67f", "yt_id": "brqZ6jZiOFE", "rym": "https://rateyourmusic.com/release/album/botch/we-are-the-romans", "genres": ["Metal", "Punk"], "desc_lfm_album": "We Are the Romans is the second and final studio album by American metalcore band Botch. It was originally released in November 1999 through Hydra Head Records, and a remastered two disc edition was later released on September 11, 2007. A Hydra Head repressing of the vinyl was released on October 25, 2011. The repress sold out on pre-order in under 20 minutes. In 1999, Botch recorded some live demos with Matt Bayles for their second studio album and follow up to American Nervoso. Two months later, Botch returned to Litho Studios with Bayles to record what would become We .", "desc_lfm_artist": "With polyrhythmic guitar stylings, raw vocals, progressive song structures, and a unique sound, Botch were a driving force in the  metalcore scene from 1993 until their break-up in 2002, particularly influential to the creation and rise of the mathcore subgenre. \n\nIn May 1998, the four-piece from Tacoma, USA released their first album, American Nervoso.\n\nOn November 30, 1999, Hydra Head released Botch's We Are The Romans. Since its initial release, bands have been influenced by its style, creating, to many, what is now called mathcore.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario"]}, {"n": 9, "title": "Emergency and I", "artist": "Dismemberment Plan", "year": 1999, "cover": "https://dn721905.ca.archive.org/0/items/mbid-97b7d2fb-adb8-40f8-9310-5192b3687bd8/mbid-97b7d2fb-adb8-40f8-9310-5192b3687bd8-43531509005.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "0bdaa1db-86ed-392d-b4c0-366fc8d00b93", "yt_id": "RmU1W8Yc4BI", "rym": "https://rateyourmusic.com/release/album/the-dismemberment-plan/emergency-and-i", "genres": ["indie rock"], "desc_lfm_album": "", "desc_lfm_artist": "Incorrect tag for The Dismemberment Plan. Keep stats clean by fixing your ID3 tags, or leave auto-correction on. Don't cheat the artist of plays and listeners...", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 10, "title": "Metropolis Pt. 2: Scenes from a Memory", "artist": "Dream Theater", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33587-metropolis-pt-2-scenes-from-a-memory.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33587-dream-theater-metropolis-pt-2-scenes-from-a-memory.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "d8ae7015-d78b-307e-bcde-5b0dd1e61528", "yt_id": "ZUplgIbGaWY", "rym": null, "genres": ["Metal", "Rock"], "desc_lfm_album": "Metropolis Pt. 2: Scenes from a Memory is the fifth studio album by American progressive metal band Dream Theater, released in 1999. It is a concept album that deals with the story of a man named Nicholas and the discovery of his past life, which involves love, murder, and infidelity as Victoria Page. It was recorded at BearTracks Studios in New York, where the band had previously recorded their second album Images and Words. The album is the sequel to “Metropolis Pt. 1: The Miracle and the Sleeper”, a song previously featured on Images and Words. Critical and commercial reaction .", "desc_lfm_artist": "Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy.", "desc_mb_album": "", "desc_mb_artist": "Sites with lists of bootlegs: [http://www.ytsecollection.com/|Ytsecollection], [http://www.hf.rim.or.jp/~junya/dtboots/dtboots.html|The Sphere] and [http://dt.qrayg.com/bootlegs/|qDT].", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 11, "title": "Internal Affairs", "artist": "Pharoahe Monch", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/internal-affairs.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4919-pharoahe-monch-internal-affairs.php", "aoty_critic_score": 87, "aoty_user_score": 83, "mbid": "06a2cba6-a077-3273-8add-e3845a391b4a", "yt_id": "KPiT9qDL7xw", "rym": "https://rateyourmusic.com/release/album/pharoahe-monch/internal-affairs", "genres": ["Hip-Hop"], "desc_lfm_album": "After the split from Organized Konfusion, Pharoahe Monch released \"Internal Affairs\", which met with lukewarm acceptance by music critics. The more underground music headz adored Monch's style, flow and wit, preferring his music over that of many of the day's higher selling rap artists. Pharoahe's latest release, \"Desire\", shows an evolution in his approach to and usage of music; he plays random tricks with his flow, stretching or condensing as needed to properly blaze whatever track is playing at the time. At one point on the album, Pharoahe even sings a little... how many rap artists today can boast that? .", "desc_lfm_artist": "Monch released three albums as part of the rap duo, Organized Konfusion with partner Prince Po: The self-titled Organized Konfusion, Stress: The Extinction Agenda, and The Equinox. The duo handled a large amount of production on these albums themselves. All albums received positive critical reviews, but moderate sales. As a result, the duo split up after recording their final album The Equinox in 1997. Prince Poetry has since denied the possibility of an Organized Konfusion reunion.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 12, "title": "Operation: Doomsday", "artist": "MF DOOM", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7933-operation-doomsday_130615.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7933-mf-doom-operation-doomsday.php", "aoty_critic_score": 72, "aoty_user_score": 84, "mbid": "66f1ac02-2eb6-31dc-ab33-6eaa603f41cd", "yt_id": "p7REodOKz_Q", "rym": "https://rateyourmusic.com/release/album/mf-doom/operation-doomsday", "genres": ["hip hop", "Hip-Hop"], "desc_lfm_album": "\"Operation: Doomsday\" is the debut studio album by British-American rapper MF Doom, released on 19 October 1999 through Fondle ’Em Records. It was his first solo release under the MF Doom name, following his earlier work as Zev Love X in the group KMD. The album was reissued in 2001 by Sub Verse Records with a slightly revised track listing. \"Operation: Doomsday\" is frequently cited as a significant release in the development of independent hip-hop, noted for its production style, use of samples, and the establishment of Doom’s masked supervillain persona. A deluxe remastered edition was released on 24 October .", "desc_lfm_artist": "Daniel Dumile (born Dumile Daniel Thompson; July 13, 1971 – October 31, 2020), known professionally as MF Doom or simply Doom, was a British-American rapper, songwriter, and record producer. He was known for his complex lyrical style, extensive use of internal rhyme, and a stage persona centered on a masked supervillain character. Dumile became a prominent figure in underground and alternative hip hop during the 2000s.\n\nDumile was born in London and raised in Long Beach, New York.", "desc_mb_album": "", "desc_mb_artist": "Artist insists his name be written/spelled in 'all caps' - \"Just remember all caps when you spell the man's name\"\r\n\r\nPreviously had an official webpage at http://www.mfdoomsite.com/. The domain was parked as of 2008-09-15", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 13, "title": "Still Life", "artist": "Opeth", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4164-still-life_212616.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4164-opeth-still-life.php", "aoty_critic_score": 85, "aoty_user_score": 87, "mbid": "b2896060-c317-32d7-9224-d530ce503871", "yt_id": "0azsKCi3DmM", "rym": "https://rateyourmusic.com/release/album/opeth/still-life/", "genres": ["Metal", "Rock"], "desc_lfm_album": "Still Life is the fourth studio album from the Swedish progressive death metal band Opeth. Still Life was recorded at Maestro Musik and at Fredman Studios from 15 April to 29 May 1999. The album was produced and engineered by Opeth, sound setting and additional engineering were made by Fredrik Nordström ng producer duties, the group recorded a self-titled album at Private Studios in Urbana, Illinois. The album's sound is a throwback to early Joan of Arc, a band which Kinsella previously played drums in. American Football focused on the interaction between two guitars after listening .", "desc_lfm_artist": "American Football are an American midwest emo band from Urbana, Illinois, originally active from 1997 to 2000.\nThe band was formed by guitarist and singer Mike Kinsella (formerly of Cap'n Jazz,  The One Up Downstairs, Joan of Arc, Owls and currently of Owen) and drummer Steve Lamos (formerly of The One Up Downstairs and currently of The Geese), and also included guitar player Steve Holmes.\n\nThe band had few live performances and disbanded less than a year after releasing their self-titled album; still", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 22, "title": "69 Love Songs", "artist": "The Magnetic Fields", "year": 1999, "cover": "https://dn710705.ca.archive.org/0/items/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d-7440735207.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1234-the-magnetic-fields-69-love-songs.php", "aoty_critic_score": 91, "aoty_user_score": 82, "mbid": "5dfac852-1aed-35b2-93b6-e8f9c93fe521", "yt_id": "5VO4R98Ti6I", "rym": "https://rateyourmusic.com/release/album/the-magnetic-fields/69-love-songs", "genres": ["synth-pop", "chamber pop", "indie folk", "indie pop", "twee pop", "Alternative Rock"], "desc_lfm_album": "", "desc_lfm_artist": "The Magnetic Fields is an American indie pop band that formed in Boston, MA in 1988 by Stephin Merritt. Albums released under the name \"The Magnetic Fields\" often consist of synth-pop music in a 1980s style underlying clever lyrics which are usually heavily ironic. While synth-pop often forms the foundatio m/release/album/mr-bungle/california-1/", "genres": ["Metal", "Rock"], "desc_lfm_album": "California is the third album by the innovative experimental rock band Mr Bungle, released on the 13th July 1999. The styles that are present in this album include surf, thrash metal, doo-wop, rockabilly, circus, kecak, balladry and eastern music amongst many others, which is typical of Mr Bungle's genre-hopping madness. Many people are of the opinion that it is by far the band's most accessible, and 'normal' album. Rolling Stone has put this in various \"essential albums\" lists. It was supposed to be released on June 8, 1999; but Warner Bros. chose instead to release the similarly-titled Californication by the .", "desc_lfm_artist": "Mr. Bungle are an experimental rock group from Eureka, California, United States. The band was formed in 1985 while the members were still in high school and was named after a children educational film. Mr. Bungle released four demo tapes in the mid to late 1980s before being signed to Warner Bros. Records and releasing three full-length studio albums between 1991 and 1999. The band toured in 2000 to support their last album but as of 2004 were considered disbanded.", "desc_mb_album": "", "desc_mb_artist": "The Swedish 90's comedy show \"Varan-TV\" featured music by Mr. Bungle; Specifically the song \"Chemical Marriage\" from the album Disco Volante.", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "paqueradejere", "sdecandelario"]}, {"n": 26, "title": "Slipknot", "artist": "Slipknot", "year": 1999, "cover": "https://dn721605.ca.archive.org/0/items/mbid-f2210d5c-8da6-3e53-936b-1d08d58cdac0/mbid-f2210d5c-8da6-3e53-936b-1d08d58cdac0-38019029641.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6445-slipknot-slipknot.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "5140eef4-5b5d-309c-a3aa-5c5da107b1da", "yt_id": "uT0dCaP6nsA", "rym": "https://rateyourmusic.com/release/album/slipknot/slipknot", "genres": ["punk", "heavy metal", "metal", "alternative metal", "nu metal", "death metal"], "desc_lfm_album": "DISCLAIMER: The Last.fm tracklist is 1989 EP by the Connecticut hardcore punk band called Slipknot. Slipknot is the debut studio album by American alternative metal band Slipknot. It was released on June 29th, 1999, through Roadrunner Records, following a demo containing a few of the songs which had been released in 1998, and was reissued in December 1999 with a slightly altered track listing and mastering as the result of a lawsuit. It was the first release by the band to be produced by Ross Robinson, who sought to refine Slipknot's sound rather than alter the group's musical direction. The .", "desc_lfm_artist": "Slipknot is an American heavy metal band formed in Des Moines, Iowa, in 1995 by percussionist Shawn \" Clown\" Crahan, vocalist/percussionist Anders Colsefni, and bassist Paul Gray. After several lineup changes in its early years, the band settled on a nine-member lineup for more than a decade, consisting of  Crahan, Gray, Joey Jordison, Craig \"133\" Jones, Mick Thomson, Corey Taylor, Sid Wilson, Chris Fehn, and Jim Root. Slipknot is known for its distinctive visual presentation, aggressive musical style, and intense live performances.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 27, "title": "Bocanada", "artist": "Gustavo Cerati", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/52990-bocanada-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/52990-gustavo-cerati-bocanada.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "22d84dc0-84cb-3934-8aa6-4af8fa6671f8", "yt_id": "IMw21ADHgJI", "rym": "https://rateyourmusic.com/release/album/gustavo-cerati/bocanada", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Bocanada is the second solo album by Argentinian rock musician Gustavo Cerati, considered by critics and fans as a highlight in his career and one of his best albums. His first album release after the breakup of Soda Stereo, Cerati had, during this time, been working with Plan V and Ocio, two bands oriented towards electronic music. \"Raíz\" was the album's first cut played in radio stations, \"Puente\" being the first music video to be released; \"Bocanada\" had the most music videos produced of any Cerati album to date. \"Bocanada is a fundamental album in the history of Iberoamerican Rock, .", "desc_lfm_artist": "Gustavo Adrián Cerati Clarke, (Buenos Aires - Argentina: August 11th, 1959 --- September 4th, 2014: Buenos Aires - Argentina) better known as Gustavo Cerati was an Argentinean guitarist, producer, occasional bass player, dj, lyricist, and vocalist. During the 1980's and until the mid-1990's he was the visible leader of Soda Stereo, -arguably one of Latin America's most important rock bands. \n\nCerati was in a coma for over four years, after suffering a stroke on May 15", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 28, "title": "Surrender", "artist": "The Chemical Brothers", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/surrender-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4925-the-chemical-brothers-surrender.php", "aoty_critic_score": 81, "aoty_user_score": 82, "mbid": "22ca85ec-ee39-3895-aef9-dee5d5c2f4d6", "yt_id": "XhWxL1wIBIM", "rym": "https://rateyourmusic.com/release/album/the-chemical-brothers/surrender", "genres": [], "desc_lfm_album": "Surrender is the third album from The Chemical Brothers and was released on June 22, 1999. It features Noel Gallagher (ex Oasis), Hope Sandoval (Mazzy Star) and Bernard Sumner (New Order) as guest vocalists. Leeds band The Sunshine Underground took their name from the sixth track on the album. It was certified 2x Platinum by the BPI on September 30, 2005. The song 'Asleep from Day' was used in a commercial for the French airline Air France. .", "desc_lfm_artist": "The Chemical Brothers is an English electronic music duo formed by Tom Rowlands and Ed Simons in Manchester in 1989. They were pioneers (along with the Prodigy, Fatboy Slim, the Crystal Method, and other acts) in bringing the big beat genre to the forefront of pop culture. After attracting Virgin Records, the duo achieved further success with second album Dig Your Own Hole (1997), which topped the UK charts. In the UK, they have had six No. 1 albums and 13 top-20 singles, including two chart-toppers.", "desc_mb_album": "", "desc_mb_artist": "Originally named \"The Dust Brothers\" in honor of the [artist:91d471a1-7639-4a70-baa4-a9e063fb4e83|US production duo], later renamed following an objection by the latter.", "heard_by": ["BipolarMuzik", "Frikomid", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 29, "title": "Chaos Is Me", "artist": "Orchid", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/116827-chaos-is-me.jpg", "aoty_url": "https://www.albumoftheyear.org/album/116827-orchid-chaos-is-me.php", "aoty_critic_score": 85, "aoty_user_score": 82, "mbid": "206828c3-0026-31db-8412-655a831f4af2", "yt_id": "rDDCp82cZK4", "rym": "https://rateyourmusic.com/release/album/orchid/chaos-is-me", "genres": ["Punk"], "desc_lfm_album": "Chaos Is Me is the debut studio album by American emoviolence band Orchid. It was released in 1999 through Ebullition Records. Chaos Is Me heralded the change of the guard for extreme music, and brought both Amherst, Massachusetts and Hampshire College to the forefront of the scene's attention. The album was produced by Kurt Ballou at God City Studios in Spring 1999. .", "desc_lfm_artist": "There are at least 11 artists called Orchid:\n1. A screamo/emoviolence band from Amherst, Massachusetts;\n2. A doom metal band from San Francisco, California;\n3. Helix Tears and Bloodhounds singer/rappper, https://soundcloud.com/0rch_id;\n4. An pop band from Poznan, Poland;\n5. A rock band from Halifax, Nova Scotia;\n6. An alias of Alexander Tooth;\n7. A \"post-prog\" band from Chapel Hill, North Carolina;\n8. A progressive metal/mathcore band from Bangalore, India (renamed to Maneating Orchid);", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "paqueradejere", "sdecandelario"]}, {"n": 30, "title": "Ágætis byrjun", "artist": "Sigur Rós", "year": 1999, "cover": "https://dn711103.ca.archive.org/0/items/mbid-344183d6-7aae-3b68-b2cc-b24f9ca79bbf/mbid-344183d6-7aae-3b68-b2cc-b24f9ca79bbf-8210434349.jpg", "aoty_url": "https://www.albumoftheyear.org/album/580-sigur-ros-gtis-byrjun.php", "aoty_critic_score": 85, "aoty_user_score": 88, "mbid": "62b427b8-1c52-34e7-b250-da2aa3e44860", "yt_id": "Wof1dSX-G2o", "rym": "https://rateyourmusic.com/release/album/sigur-ros/agaetis-byrjun", "genres": ["experimental rock", "alternative rock", "chamber pop", "dream pop", "slowcore", "post-rock"], "desc_lfm_album": "Ágætis byrjun is Sigur Rós' second LP, originally released by Smekkleysa in 1999, receiving later worldwide distribution from Fat Cat in May of 2001. This album began a hype storm for the previously unheard band, earning endorsements from many critics and musicians, famously including Thom Yorke's glowing approval. It is generally considered their best-liked album, and it appeared on many critics' \"best of 2000 / 2001\" record lists. The album's title came from a friend hearing the first song they had written for the album, which would become the title track. After hearing the song, he said it was \"a .", "desc_lfm_artist": "Sigur Rós is an Icelandic post-rock band. The name is derived from the name of lead vocalist Jónsi Birgisson's little sister, Sigurrós. They hail from the same creative and vibrant Icelandic music scene as múm and Amiina. They released their first-ever foray into film-making with their tour documentary, Heima in late 2007. \n\nJón Þór Birgisson (Jónsi), Georg Hólm, and Ágúst Ævar Gunnarsson formed the group in Reykjavík, Iceland in August 1994.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "Rocky_stereo", "armandwave", "paqueradejere", "verygooood"]}, {"n": 31, "title": "Synkronized", "artist": "Jamiroquai", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/20243-synkronized_213640.jpg", "aoty_url": "https://www.albumoftheyear.org/album/20243-jamiroquai-synkronized.php", "aoty_critic_score": 66, "aoty_user_score": 80, "mbid": "f1049013-bcdc-337e-8506-c0e84afe1b0c", "yt_id": "ULhDmWpKlus", "rym": null, "genres": [], "desc_lfm_album": "Synkronized is the fourth studio album released by British funk/acid jazz band Jamiroquai. It was released on 8 June 1999 on Work Group in the United States and on 14 June 1999 in the United Kingdom under S2 Records. The album contains funk, acid jazz and disco elements .", "desc_lfm_artist": "Jamiroquai are an English acid jazz and funk band formed in London in 1992. The group is led by vocalist Jay Kay, who has remained the sole consistent member throughout multiple lineup changes. They initially became associated with the London acid jazz movement of the early 1990s and later incorporated influences from rock, disco, electronic music, and Latin styles. Their lyrics have frequently focused on social and environmental themes.\n\nJamiroquai first recorded under Acid Jazz Records before signing with Sony", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "sdecandelario", "verygooood"]}, {"n": 32, "title": "Stereo Type A", "artist": "Cibo Matto", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/40365-stereo-type-a_132849.jpg", "aoty_url": "https://www.albumoftheyear.org/album/40365-cibo-matto-stereo-type-a.php", "aoty_critic_score": 68, "aoty_user_score": 83, "mbid": null, "yt_id": "Vg0S-bsqnYY", "rym": "https://rateyourmusic.com/release/album/cibo-matto/stereo-type-a", "genres": [], "desc_lfm_album": "Stereo Type A (also tagged as Stereotype A and stylised as STEREO ★ TYPE A) is the second studio album by Cibo Matto released in 1999. As the group disbanded in 2001, it was their last studio album prior to their 2011 reunion. The album peaked at number 171 on the Billboard 200, and also reached the top spot of CMJ's College charts. While having a strong focus on atmospheric and ambient sounds and melody (particularly in \"Moonchild\"), Stereo Type A also contains a broad range of styles, reaching into hip hop territory on \"Sci-Fi Wasabi\" (with additional vocals by .", "desc_lfm_artist": "Cibo Matto were a New York City-based band formed by two Japanese women, Miho Hatori and Yuka Honda in 1994. They sample and mix trip-hop and rock in their music. The group also stands out amongst other such artists for their particularly strong use of Latin and South American music. Cibo Matto is an Italian phrase that means \"crazy food\".\n\nAfter working together in the noise rock band Leitoh Lychee, Miho Hatori and Yuka Honda formed Cibo Matto around 1994.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Rocky_stereo"]}, {"n": 33, "title": "The Soft Bulletin", "artist": "The Flaming Lips", "year": 1999, "cover": "https://dn721501.ca.archive.org/0/items/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa-23592292976.png", "aoty_url": "https://www.albumoftheyear.org/album/926-the-flaming-lips-the-soft-bulletin.php", "aoty_critic_score": 91, "aoty_user_score": 85, "mbid": "1a021034-95d1-3a2d-bdca-73b25e455e49", "yt_id": "MBH-169OHNg", "rym": "https://rateyourmusic.com/release/album/the-flaming-lips/the-soft-bulletin", "genres": ["alternative rock", "psychedelic pop", "art pop", "chamber pop", "indie rock", "neo-psychedelia"], "desc_lfm_album": "The Soft Bulletin is the ninth album released by The Flaming Lips on May 17, 1999 in the UK, with a US release following on June 22, 1999. It was released to wide critical acclaim and hailed by critics as a departure from their previous guitar-heavy alternative rock sound, into a more layered and intricately arranged work. The album was considered to mark a change in the course for the band, with more traditional catchy melodies and accessible-sounding music (their previous album, 1997's Zaireeka, was a quadruple album of experimental sounds meant to be played on four separate stereo systems .", "desc_lfm_artist": "The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 34, "title": "ファンファーレ [Fanfare]", "artist": "advantage Lucy", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/129898-fanfare.jpg", "aoty_url": "https://www.albumoftheyear.org/album/129898-advantage-lucy--fanfare.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": null, "yt_id": "IHM6eXfP-gY", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "advantage Lucy is a Japanese indie pop/neo-acoustic band. They play songs influenced by 80s janglepop, Swedish pop, and pretty much anything else that makes people feel good. Presently comprising vocalist Aiko and guitarist Yoshiharu Ishizaka, the group was formed in 1995 as a four piece, named Lucy Van Pelt after the Peanuts character of the same name. A fixture on the indies scene, Lucy Van Pelt released several records on the God's Pop Records imprint", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 35, "title": "Mule Variations", "artist": "Tom Waits", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/mule-variations.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4047-tom-waits-mule-variations.php", "aoty_critic_score": 79, "aoty_user_score": 83, "mbid": "be821a7a-4a19-3062-9ca6-8d07a658bc10", "yt_id": "c_OkcVLBB9A", "rym": "https://rateyourmusic.com/release/album/tom-waits/mule-variations", "genres": ["Rock", "Jazz"], "desc_lfm_album": "The thirteenth studio album by Tom Waits, released 6 years after Black Rider, on April 16, 1999, to widespread critical acclaim. Mule Variations won a Grammy Award for Best Contemporary Folk Album and was nominated for Best Male Rock Performance for the track \"Hold On\". It has sold more than 500,000 copies worldwide. .", "desc_lfm_artist": "Tom Waits (born Thomas Alan Waits, in Pomona, California, on December 7, 1949) is a prolific American singer, songwriter, composer, and actor.\n\nHe started his career in the early 1970s as a singer in spit 'n' sawdust bars. Initially, he was deeply influenced by the beat generation, novelists like Jack Kerouac and William S. Burroughs, and poets like Allen Ginsberg and Charles Bukowski.  Waits is often compared to Charles Bukowski, being similar both in content and lifestyle", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 36, "title": "Come on Die Young", "artist": "Mogwai", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/come-on-die-young.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1949-mogwai-come-on-die-young.php", "aoty_critic_score": 74, "aoty_user_score": 80, "mbid": "68b9f75b-34b5-3228-9972-82efea767eca", "yt_id": "bQ47bGtCTao", "rym": null, "genres": [], "desc_lfm_album": "Come on Die Young (also known as CODY), is the second full-length studio album by the Scottish Instrumental rock band Mogwai, released on 29 March 1999 by Chemikal Underground. It is somewhat different from the rest of Mogwai's work because of its reserved tone. The album's second track, \"Cody\" is much more like a traditional pop song than most of the band's repertoire. Still slow and meandering, it features an uncharacteristically distinct melody, slide guitar and relatively prominent vocals. Much of Come on Die Young consists of slow, quiet, drum-driven tracks containing tense, feedback-laden crescendos and occasionally ambient textures. Near .", "desc_lfm_artist": "Mogwai is a Scottish post-rock/instrumental band from Glasgow formed in 1995. \nThey compose lengthy, mostly instrumental guitar-based pieces in the style of post-rock, usually focused around the elaboration of a single theme, and are known traditionally for their quiet/loud dynamic, defined bass riffs, and an eminent ambient sound, sometimes dark and sometimes grand. Although frequently referred to as post-rock, the band have revealed in interviews that they despise this categorization", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 37, "title": "Slow Riot for New Zerø Kanada E.P.", "artist": "Godspeed You! Black Emperor", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5950-slow-riot-for-new-zero-kanada-ep_141502.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5950-godspeed-you-black-emperor-slow-riot-for-new-zero-kanada-ep.php", "aoty_critic_score": 87, "aoty_user_score": 90, "mbid": "7a474ed2-8f4a-3295-8943-68818da3af3e", "yt_id": "_tQ15eKnT4w", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Godspeed You! Black Emperor (formerly punctuated Godspeed You Black Emperor! and abbreviated to GY!BE, GYBE or Godspeed) is a Canadian post-rock band based in Montreal, Quebec. \n\nFormed in 1994 in Montreal, Canada, the band has been highly influential within the post-rock genre. Working with orchestrated arrangements, the nine-piece group created tracks with wide dynamic ranges, a highly evocative use of instrumentation and sounds and uncompromising long form compositions.", "desc_mb_album": "", "desc_mb_artist": "Up to the release of “'''[https://musicbrainz.org/release-group/fc3cf08c-3273-3af3-84ed-ab9782a72505|Yanqui U.X.O.]'''”, GYBE placed the exclamation mark at the end of their name. It was then moved to match the [https://en.wikipedia.org/wiki/God_Speed_You!_Black_Emperor|film] they had taken their name from.\r\n----\r\n    * “''&#91;Yanqui U.X.O.&#93; marks the first release by the group after slightly altering their name (moving the exclamation mark from the \"emperor\" to the \"you\")''” -- [https://en.wikipedia.org/wiki/Yanqui_U.X.O.|Wikipedia]\r\n    * “''In the beginning of their career, they were known as \"Godspeed You Black Emperor!\", but the name was later changed to have the exclamation point after the word \"You\".''” [https://www.urbandictionary.com/define.php?term=godspeed+you+black+emperor", "heard_by": []}, {"n": 38, "title": "Windowlicker", "artist": "Aphex Twin", "year": 1999, "cover": "https://i.discogs.com/a03QIxsTeY7K54iG-eGA-7WDOsNoMTAJRwdCqIlbp9M/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTM2NjYt/MTQ3MzQ4Nzc5My03/MDA0LmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/4038-aphex-twin-windowlicker.php", "aoty_critic_score": 88, "aoty_user_score": 83, "mbid": "3c4072b9-a844-3d49-ac5f-72b06bf79dea", "yt_id": "EjejOvjH6Gc", "rym": null, "genres": [], "desc_lfm_album": "Windowlicker is a song by electronic musician Aphex Twin, released on 22 March 1999 as a single by Warp Records. The artwork for the single was created by Chris Cunningham, with additional work by The Designers Republic. Cunningham also directed the song's music video, which was nominated for the Brit Award for Best British Video. The song peaked at number 16 on the UK Singles Chart, and was later voted by fans as Warp Records' most popular song for its 2009 Warp20 compilation. Pitchfork included the song at number 12 on their list Top 200 Tracks of the 90s. \"Windowlicker\" .", "desc_lfm_artist": "Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 39, "title": "13", "artist": "Blur", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/3951-13_204749.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3951-blur-13.php", "aoty_critic_score": 80, "aoty_user_score": 85, "mbid": "307e8da2-8e8b-3bde-9324-5162501166d1", "yt_id": "rc6oIaej4L0", "rym": "https://rateyourmusic.com/release/album/blur/13", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "13 is the sixth album by English alternative rock band Blur, released in March 1999. The album reached number one in the UK Albums Chart and number 80 in the US Billboard 200. 13 spawned three hit singles: Tender, Coffee & TV and No Distance Left to Run. Recording history: 13 sees the band moving further away from their Britpop past into more cerebral and denser musical territory. Some of the songs, however, are evocative of songs from their previous efforts, such as Bugman, Coffee & TV, 1992 and Optigan 1. Much of the album was inspired by Damon Albarn's .", "desc_lfm_artist": "Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995).", "desc_mb_album": "", "desc_mb_artist": "Changed their name from ''[http://musicbrainz.org/show/artist/?artistid=79827|Seymour]'' in 1990 in order to secure a record deal.", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 40, "title": "First Love", "artist": "宇多田ヒカル [Hikaru Utada]", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/64227-first-love_102725.jpg", "aoty_url": "https://www.albumoftheyear.org/album/64227--hikaru-utada-first-love.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": null, "yt_id": "o1sUaVJUeB0", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU"]}, {"n": 41, "title": "Summerteeth", "artist": "Wilco", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/summerteeth-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/348-wilco-summerteeth.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "bb7b90b8-bdb5-455c-9c8e-f87aeaf5d156", "yt_id": "-XRLxtmGzxk", "rym": "https://rateyourmusic.com/release/album/wilco/summerteeth", "genres": ["alternative rock", "pop rock", "chamber pop", "indie rock", "Rock", "Alternative Rock"], "desc_lfm_album": "Summerteeth is the third studio album by Chicago alternative rock band Wilco. Released through Reprise Records on March 9, 1999, the album was heavily influenced lyrically by twentieth century literature, as well as singer Jeff Tweedy's marital problems. Unlike previous albums, Summerteeth was heavily overdubbed in the studio with Pro Tools. Tweedy and Jay Bennett created most of the album in the studio, a contrast to the band's previous albums, which were rehearsed live and recorded almost at once. Despite critical acclaim from numerous outlets, including Allmusic, The Chicago Tribune, and The Village Voice, Summerteeth sold approximately 200,000 copies—a modest .", "desc_lfm_artist": "Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 42, "title": "Underground Vol. 1 (1991-1994)", "artist": "Three 6 Mafia", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/71518-underground-vol-1-1991-1994_145924.jpg", "aoty_url": "https://www.albumoftheyear.org/album/71518-three-6-mafia-underground-vol-1-1991-1994.php", "aoty_critic_score": 70, "aoty_user_score": 87, "mbid": null, "yt_id": "qN5zYPEenes", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Three 6 Mafia is an American   hip hop group from Memphis, Tennessee. Originally called \"Backyard Posse,\" the group has included many members, including Gangsta Blac, Gangsta Boo, La' Chat, Koopsta Knicca, Lord Infamous, Playa Fly and Crunchy Black. The group now consists of only Juicy J and DJ Paul, who also serve as in-house producers. Project Pat was signed to their label, Hypnotize Minds, along with Lil' Wyte, prior to it going defunct in 2012.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 43, "title": "Eureka", "artist": "Jim O’Rourke", "year": 1999, "cover": "https://dn710009.ca.archive.org/0/items/mbid-5e585f90-33fe-4ba9-b1bd-22cb845a4b8c/mbid-5e585f90-33fe-4ba9-b1bd-22cb845a4b8c-31440735447.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e459ba30-68aa-36a1-b367-04db87a29842", "yt_id": "VOc_0KwoRw8", "rym": null, "genres": ["art pop", "jazz pop", "chamber pop"], "desc_lfm_album": "", "desc_lfm_artist": "Jim O’Rourke (born January 18, 1969) is an American musician, composer, and producer whose work spans experimental rock, electronic music, and contemporary classical composition. He first became known in the early 1990s as a member of the Chicago-based band Gastr del Sol, contributing to their experimental and post-rock sound.\n\nO’Rourke has released a number of solo albums that explore a wide range of styles. Early works include Bad Timing (1997)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 44, "title": "無罪モラトリアム [Innocence Moratorium]", "artist": "椎名林檎 [Ringo Sheena]", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/68512-muzai-moratorium.jpg", "aoty_url": "https://www.albumoftheyear.org/album/68512--ringo-sheena--innocence-moratorium.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": null, "yt_id": "4tlUwgtgdZA", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 45, "title": "Things Fall Apart", "artist": "The Roots", "year": 1999, "cover": "https://ia600605.us.archive.org/25/items/mbid-45b0cfa6-826c-4736-9c74-f0b73ec14bc7/mbid-45b0cfa6-826c-4736-9c74-f0b73ec14bc7-28128122695.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4165-the-roots-things-fall-apart.php", "aoty_critic_score": 84, "aoty_user_score": 88, "mbid": "8f341430-85b9-3a66-875f-ed1202868393", "yt_id": "F0Pa27i42i0", "rym": "https://rateyourmusic.com/release/album/the-roots/things-fall-apart", "genres": ["alternative hip hop", "hip hop", "neo soul", "jazz rap", "Jazz", "Hip-Hop"], "desc_lfm_album": "Things Fall Apart is the fourth studio album by American hip hop band the Roots, released on February 23, 1999, by MCA Records. Recording sessions for the album took place at Electric Lady during 1997 to 1998, coinciding with recording for other projects of the Soulquarians collective. According to Spin magazine, the album became a landmark moment for the Roots and the collective, as it \"swelled the Roots clique into a movement-style posse\". The album has been considered by music writers as the Roots' breakthrough album, earning praise from major publications and critics, while becoming the group's first record to .", "desc_lfm_artist": "The Roots, also known as The Legendary Roots Crew, The Square Roots and The Foundation, is an influential, Grammy winning hip hop group based out of Philadelphia, Pennsylvania, famed for a heavily jazzy sound and live instrumentation. Inspired by the \"hip-hop band\" concept pioneered by Stetsasonic, the Roots themselves have garnered critical acclaim and influenced later hip-hop and R&B acts.\n\nThe Roots' original lineup included Black Thought (MC vocals) and Ahmir \"?uestlove\" Thompson (drums)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "verygooood"]}, {"n": 46, "title": "Clarity", "artist": "Jimmy Eat World", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8354-clarity.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8354-jimmy-eat-world-clarity.php", "aoty_critic_score": 83, "aoty_user_score": 84, "mbid": "4a12c3a5-5a5e-3e6f-aee9-1cfb2137da4c", "yt_id": "eJ96wkcGOpo", "rym": "https://rateyourmusic.com/release/album/jimmy-eat-world/clarity", "genres": ["Punk", "Alternative Rock"], "desc_lfm_album": "Clarity is the third studio album by American rock band Jimmy Eat World. It was released on February 23, 1999, through Capitol Records, with which Jimmy Eat World clashed several times while recording their second studio album Static Prevails (1996). The band recorded a follow-up with producer Mark Trombino in May and June 1998, and were free to make it however they wanted without interference from Capitol. The recording sessions began at Sound City in Van Nuys, California, before moving to Clear Lake Audio in North Hollywood, California. Clarity, which is described as an emo, pop punk, and punk rock .", "desc_lfm_artist": "Jimmy Eat World is an alternative rock band formed in Mesa, Arizona, United States, in 1993. The band is composed of lead guitarist/lead vocalist Jim Adkins, drummer Zach Lind, rhythm guitarist/vocalist Tom Linton, and bassist Rick Burch. Jimmy Eat World has released ten studio albums, the last nine featuring the current lineup.\n\nThe four-piece's commercial breakthrough came with the successful release of several singles from the album Bleed American (2001).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "sdecandelario"]}, {"n": 47, "title": "Keep It Like A Secret", "artist": "Built To Spill", "year": 1998, "cover": "https://dn711100.ca.archive.org/0/items/mbid-4eac7bfa-5248-4d9c-9114-87d97d7fea31/mbid-4eac7bfa-5248-4d9c-9114-87d97d7fea31-27142893724.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "db8ddfee-1069-3a49-9e36-ef195ce1ab4a", "yt_id": "qFZSXc6wH0A", "rym": null, "genres": ["alternative rock", "indie rock", "alternative punk"], "desc_lfm_album": "\"Keep It Like a Secret\" is the fourth studio album by the indie rock band Built to Spill, released in 1999. Produced by Phil Ek, the album showcases the band's signature sound characterized by intricate guitar work, introspective lyrics, and a mix of indie rock, alternative rock, and lo-fi influences. The album takes on a more short-form and straightforward approach compared to its predecessor \"Perfect From Now On\", owing to frontman Doug Martsch feeling burnt out after the lengthier tracks on that album. .", "desc_lfm_artist": "Built to Spill is an American alternative rock band based in Boise, Idaho, United States. The band is best known for its catchy guitar hooks and the unique voice of frontman Doug Martsch.\n\nFormer Treepeople frontman Doug Martsch formed Built to Spill in 1992 with Brett Netson and Ralf Youtz as the band's original members. In an interview with Spin magazine, Martsch stated that he intended to change the band's lineup for every album, with Martsch being the only permanent member.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 48, "title": "I See a Darkness", "artist": "Bonnie 'Prince' Billy", "year": 1999, "cover": "https://dn720800.ca.archive.org/0/items/mbid-c9557957-1e60-3aae-ac7d-7177feffe2d2/mbid-c9557957-1e60-3aae-ac7d-7177feffe2d2-8323303553.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2604-bonnie-prince-billy-i-see-a-darkness.php", "aoty_critic_score": 86, "aoty_user_score": 82, "mbid": "ed247591-9a60-3d95-906c-2d1eae52639b", "yt_id": "FC8aItkko2k", "rym": "https://rateyourmusic.com/release/album/bonnie-prince-billy/i-see-a-darkness", "genres": ["country folk", "indie folk", "Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Will Oldham (born 15 January 1970, Louisville, Kentucky) is an American singer-songwriter, actor, and musician. His music is often (perhaps inappropriately) placed under the genre of \"alt-country\". Oldham has recorded under many names, including Palace, Palace Music, Palace Brothers, and Bonnie Billy. He often plays and records with other musicians, including David Pajo and his brothers Ned and Paul Oldham, but is generally the chief creator of the music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 49, "title": "Paysage d'Hiver", "artist": "Paysage d'Hiver", "year": 1999, "cover": "https://cdn2.albumoftheyear.org/600x0/album/74682-paysage-dhiver-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/74682-paysage-dhiver-paysage-dhiver.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": "9a07aebf-a9d5-37b3-8207-d001cf815972", "yt_id": "ftJpAjEI9F8", "rym": "https://rateyourmusic.com/release/album/paysage-dhiver/paysage-dhiver", "genres": ["Metal", "Electronic"], "desc_lfm_album": "", "desc_lfm_artist": "Paysage d'Hiver is a one-man atmospheric black metal / dark ambient band from Berne, Switzerland, formed in 1997. The sole member is Tobias Möckl aka \"Wintherr\", also of Darkspace. The name Paysage d'Hiver is French and translates to \"Winter Landscape\"; the songs' lyrics talk overall about winter, darkness, and out of body experiences. Wintherr has cited the Burzum albums \"Hvis lyset tar oss\" and \"Filosofem\", among others, as an inspiration for his music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 50, "title": "Amplifier Worship", "artist": "Boris", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/13399-amplifier-worship_002946.jpg", "aoty_url": "https://www.albumoftheyear.org/album/13399-boris-amplifier-worship.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "8b81ade4-21d9-30ba-b04f-94cc3adbfed2", "yt_id": "BD_9ZaUlFx0", "rym": "https://rateyourmusic.com/release/album/boris/amplifier-worship", "genres": ["Metal"], "desc_lfm_album": "Amplifier Worship is experimental band Boris's second album, released under labels Mangrove and Southern Lord on November 26, 1998. Takeshi takes over lead vocals marking the first album with lead Takeshi vocals (along with bass and various electronics). Wata does guitar, effects and electronics; Atsuo does vocals (lead on the song \"Huge\"), drums, cymbal and electronic drums. \"Vomitself\" was written and laid down separately at Sound Square while the other four songs were recorded at Sound Crew. According to Japanese production company FoodUnited, videos were shot for \"Hama\" and \"Kuruimizu\" but were not released to the public. .", "desc_lfm_artist": "There are at least two different artists using the name Boris.\n\n1. a Japanese experimental metal band\n2. a Dutch pop/soul singer\n\n1. Boris is a Japanese experimental    metal band formed in Tokyo in 1992.  The band's original lineup consisted of lead vocalist Atsuo, bassist/rhythm guitarist Takeshi, lead guitarist Wata, and drummer Nagata.  After Nagata's departure in 1996, Atsuo took over drums and the lineup has remained consistent to this day.  Boris draw influence from a huge variety of styles including", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU"]}, {"n": 51, "title": "Chaosphere", "artist": "Meshuggah", "year": 1998, "cover": "https://dn710604.ca.archive.org/0/items/mbid-772ad8a8-f3fe-3a06-8d82-d6d529b5a785/mbid-772ad8a8-f3fe-3a06-8d82-d6d529b5a785-7846820494.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8285-meshuggah-chaosphere.php", "aoty_critic_score": 83, "aoty_user_score": 83, "mbid": "460c2238-8fa3-37c1-9f81-cac6ff902bbc", "yt_id": "dOlezV7TOnA", "rym": "https://rateyourmusic.com/release/album/meshuggah/chaosphere", "genres": ["heavy metal", "math rock", "alternative metal", "progressive metal", "death metal", "groove metal"], "desc_lfm_album": "Chaosphere is the third studio album by Swedish extreme metal band Meshuggah. It was released on 9 November 1998 by Nuclear Blast, and is the only studio album to feature bassist Gustaf Hielm. Chaosphere's sound shows the band toning down some of the thrash style of their previous releases in favor of the technical, polyrhythmic, groove-oriented sound they would continue to explore on subsequent albums. A video was made for \"New Millennium Cyanide Christ\". Jens Kidman – vocals Fredrik Thordendal – lead guitar, keyboards Mårten Hagström – rhythm guitar Gustaf Hielm – bass Tomas Haake – drums, vocals (tracks 6–7, .", "desc_lfm_artist": "Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU"]}, {"n": 52, "title": "Roseland NYC Live", "artist": "Portishead", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6963-roseland-nyc-live_142347.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6963-portishead-roseland-nyc-live.php", "aoty_critic_score": 73, "aoty_user_score": 92, "mbid": "ce61f4a8-db95-3608-93de-53f9ecb1b8d2", "yt_id": "qj3QPx089g4", "rym": null, "genres": [], "desc_lfm_album": "Roseland NYC Live is a live album by English band Portishead, released on November 2, 1998 by Go! Beat. A PAL format VHS video was released the same year, with a DVD version following four years later. Although the New York Philharmonic is credited as appearing in the video, none of the musicians are members of the Philharmonic, nor is the Philharmonic credited in the audio album. .", "desc_lfm_artist": "Portishead is an English band formed in 1991 in Bristol. Portishead are named after Portishead, Somerset, eight miles west of Bristol, along the coast. The band comprises vocalist Beth Gibbons, producer Geoff Barrow and musician Adrian Utley.\n\nPortishead's debut album, Dummy (1994), fused hip hop production with an atmospheric, cinematic style reminiscent of spy film soundtracks. The album was met with commercial and critical acclaim, quickly becoming a landmark album in the emerging trip hop genre.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Nubis84", "armandwave", "paqueradejere"]}, {"n": 53, "title": "The Masterplan", "artist": "Oasis", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29964-the-masterplan_221512.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29964-oasis-the-masterplan.php", "aoty_critic_score": 75, "aoty_user_score": 83, "mbid": "3d79dc76-7b02-3510-b12b-5061f459f8ac", "yt_id": "jFMtTIh1zjM", "rym": null, "genres": [], "desc_lfm_album": "\"The Masterplan\" is a compilation album by the English rock band Oasis, released on 2 November 1998 by Creation Records. It was the band’s final release through the label and consists of B-sides that had not previously appeared on an album. The album was initially intended for release in regions such as the United States and Japan, where the tracks had only been available on imported European singles. \"The Masterplan\" reached number 2 in the UK, where it was certified platinum, and number 51 in the United States. It also reached the Top 20 in various international charts and sold .", "desc_lfm_artist": "Oasis are an English rock band formed in Manchester in 1991. The original lineup consisted of Liam Gallagher on lead vocals, Paul \"Bonehead\" Arthurs on guitar, Paul \"Guigsy\" McGuigan on bass guitar, and Tony McCarroll on drums. Liam’s older brother Noel Gallagher joined later as lead guitarist and vocalist, becoming the group’s main songwriter and de facto leader. Oasis are regarded as one of the most successful and influential bands of the Britpop movement.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 54, "title": "The Shape of Punk to Come", "artist": "Refused", "year": 1998, "cover": "https://dn710207.ca.archive.org/0/items/mbid-c5bb1efa-34f4
