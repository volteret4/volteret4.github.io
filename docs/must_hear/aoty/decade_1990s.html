n-the-aeroplane-over-the-sea", "genres": ["folk rock", "alternative rock", "indie rock", "noise pop", "indie folk", "brass band"], "desc_lfm_album": "In the Aeroplane Over the Sea is the second and final studio album by the American indie rock band Neutral Milk Hotel. It was released in the United States on February 10, 1998 on Merge Records and May 1998 on Blue Rose Records in the United Kingdom. Jeff Mangum moved from Athens, Georgia to Denver, Colorado to prepare the bulk of the album's material with producer Robert Schneider, this time at Schneider's newly created Pet Sounds Studio at the home of Jim McIntyre. The album was the sixth-best-selling vinyl album in 2008. NME named it the 98th greatest album of .", "desc_lfm_artist": "Neutral Milk Hotel was an American alternative rock band formed by singer, guitarist, and songwriter Jeff Mangum in 1989 in Ruston, Louisiana. On the band's full-length albums, Mangum played with a number of other musicians, notably Jeremy Barnes (drums), Scott Spillane (horns), Julian Koster (musical saw/banjo/accordion/bass guitar) and producer-instrumentalist Robert Schneider. Neutral Milk Hotel were one of the original members of the Elephant Six Collective, based in Athens, Georgia.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 91, "title": "downward is heavenward", "artist": "Hum", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/30342-downward-is-heavenward-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/30342-hum-downward-is-heavenward.php", "aoty_critic_score": 87, "aoty_user_score": 84, "mbid": "f1afe4a3-5d81-3112-a048-999ad80db702", "yt_id": "HsNyU0kkJaM", "rym": null, "genres": [], "desc_lfm_album": "Downward Is Heavenward is the fourth studio album by the Champaign, Illinois alternative rock band Hum. Downward Is Heavenward was recorded in 1997, and first released on January 27, 1998, by RCA Records. Some websites such as AllMusic list it as being a 1997 album rather than a 1998 album, presumably because all versions of the album bear a 1997 copyright date. The title of the album appears as a lyric in \"Afternoon with the Axolotls\". Despite selling fewer copies than its predecessor You'd Prefer an Astronaut, the album was critically acclaimed. .", "desc_lfm_artist": "Hum is an American alternative rock and post-hardcore band formed in 1989 in Champaign, Illinois; the band performed a mix between both genres obtaining a characteristic heaviness that would define them for the rest of their career (this sound is also known today as Heavy Alternative). The band went through member changes until 1993, finally settling with Matt Talbot (vocals, guitar), Tim Lash (guitar), Jeff Dimpsey (bass) and Bryan St. Pere (drums) until their split in 2000.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "verygooood"]}, {"n": 92, "title": "Sonic R", "artist": "Richard Jacques", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/91322-sonic-r_025159.jpg", "aoty_url": "https://www.albumoftheyear.org/album/91322-richard-jacques-sonic-r.php", "aoty_critic_score": 88, "aoty_user_score": null, "mbid": "7e540d36-a81a-4327-ae4b-5402e35858c3", "yt_id": "GPchUs1SVJ8", "rym": null, "genres": [], "desc_lfm_album": "This soundtrack contains music from the video game, Sonic R. The music was composed by Richard Jaques and the vocals are done by singer TJ Davis. .", "desc_lfm_artist": "Classically trained with an extensive music repertoire in orchestral, electronica, jazz and other contemporary music genres, Richard Jacques is a multiple award-winning composer of music for video games, film and television. \n\n\nHe is internationally recognized as one of the A-list composers in the video games industry, recently described by PLAY Magazine (US) as “One of the truly distinctive game music composers in the industry today.” A leader", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 93, "title": "Swans Are Dead", "artist": "Swans", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/35287-swans-are-dead_053543.jpg", "aoty_url": "https://www.albumoftheyear.org/album/35287-swans-swans-are-dead.php", "aoty_critic_score": 79, "aoty_user_score": 91, "mbid": "2ea72a55-4fb8-39d3-9bd9-5ad738460a0e", "yt_id": "ioDdTP6p_9I", "rym": "https://rateyourmusic.com/release/album/swans/swans-are-dead", "genres": [], "desc_lfm_album": "Swans Are Dead is New York experimental rock band Swans' 7th live album, capturing the band's final tour before their first breakup. The first disc was mostly taken from their March 13, 1997 show at Paradiso in Amsterdam, Netherlands, recorded by Dutch public broadcaster VPRO. The second disc was taken from their 1995 shows in Norway. .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84", "sdecandelario"]}, {"n": 94, "title": "Moon Safari", "artist": "Air", "year": 1998, "cover": "https://dn710301.ca.archive.org/0/items/mbid-793d98c5-b54f-407c-ba79-788a1d7f685a/mbid-793d98c5-b54f-407c-ba79-788a1d7f685a-2484782079.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4022-air-moon-safari.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "b0bf2b77-b8cf-32f6-8893-9741d757b400", "yt_id": "3XTV6pkQne0", "rym": "https://rateyourmusic.com/release/album/air/moon-safari", "genres": ["electronica", "ambient pop", "Electronic"], "desc_lfm_album": "Moon Safari is the first full-length studio album by the French band Air, released in 1998. The album is considered a classic of the chillout genre. It scored hits with the tracks \"Sexy Boy\", \"Kelly Watch the Stars\" and \"All I Need\" (which features vocals by Beth Hirsch). Moon Safari debuted at number five in the UK album charts mainly due to almost universally glowing reviews by the British music press and the success of the single \"Sexy Boy\". On April 14, 2008 Virgin Records released a reissue of Moon Safari to mark the album's 10-year anniversary. The limited edition .", "desc_lfm_artist": "There are at least five artists with this name:\n1. A popular electronic music duo from France\n2. A jazz trio from the United States\n3. A noise rock band from Japan\n4. An alias of ambient musician Pete Namlook\n5. A pop group from the Philippines \n\n1) The French band Air is a duo consisting of Nicolas Godin and Jean-Benoit Dunckel. They went to school in Versailles, (Lycée Jules Ferry) before forming the band in 1995 . Their critically acclaimed first album Premiers Symptômes was followed by the release of Moon Safari", "desc_mb_album": "", "desc_mb_artist": "If you are thinking of changing the capitalization of the artist name, please refer to [http://web.archive.org/web/20120211124424/http://www.ravemagazine.com.au/content/view/8209/30/|this page]. Specifically: \r\n\r\nMyth #1: Air is an acronym for Amour, Imagination, Rêve (French for Love, Imagination, Dream).\r\n\r\n“No. Someone made that up, but it was a really nice thing to do. I wish I could have that idea.”", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 95, "title": "Analphabetapolothology", "artist": "Cap'n Jazz", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/71857-analphabetapolothology.jpg", "aoty_url": "https://www.albumoftheyear.org/album/71857-capn-jazz-analphabetapolothology.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "141cf5a3-857c-387d-a99c-2937dc21b1bb", "yt_id": "nORsgLzS61s", "rym": null, "genres": [], "desc_lfm_album": "Analphabetapolothology is a Cap'n Jazz retrospective which compiles (almost all) the band's complete recorded works: Shmap'n Shmazz, early singles, material from split releases, compilation tracks, unreleased demos and outtakes and several tracks from their farewell performance in Chicago. .", "desc_lfm_artist": "Cap'n Jazz was an American emo band formed in 1989 in Chicago, Illinois, United States. The band consisted of Tim Kinsella (vocals), Victor Villarreal (guitar, vocals), Davey von Bohlen (guitar, vocals), Samuel Zurick (bass) and Mike Kinsella (drums).\n\nThe band recorded several singles for independent labels in the early 90's as well as contributing to several compilations. In 1995, they released their only full-length album, \"Burritos, Inspiration Point", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 96, "title": "Sobrevivendo no Inferno", "artist": "Racionais MC's", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/54733-sobrevivendo-no-inferno_203839.jpg", "aoty_url": "https://www.albumoftheyear.org/album/54733-racionais-mcs-sobrevivendo-no-inferno.php", "aoty_critic_score": 50, "aoty_user_score": 89, "mbid": "cf4383c2-30e2-38bd-be61-83bc32fe5f2a", "yt_id": "fVQ3YYnic2o", "rym": null, "genres": ["Hip-Hop"], "desc_lfm_album": "In English, translated as \"Surviving in Hell\", is the fourth studio album of the Brazilian rap group Racionais MC's, released in December 1997. The album reached the mark of 1,500,000 copies sold, despite having been released by an independent record label. Sobrevivendo no Inferno was ranked 14th on the 100 Greatest Brazilian music albums of Rolling Stone magazine. .", "desc_lfm_artist": "Racionais MC's is a hip hop group based in  São Paulo, Brazil. Mano Brown (Pedro Paulo Soares Pereira), Ice Blue (Paulo Eduardo Salvador), Edy Rock (Edvaldo Pereira Alves) and DJ KL Jay (Kleber Geraldo Lelis Simões) formed the group in 1988. Each member hails from the ring of favelas (slums) around São Paulo locally called the periferia. Their lyrics combine themes of social justice with gangster imagery, a far cry from the idyllic breeziness typically associated with Brazilian music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 97, "title": "The Lonesome Crowded West", "artist": "Modest Mouse", "year": 1998, "cover": "https://dn710703.ca.archive.org/0/items/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f-33419350946.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4041-modest-mouse-the-lonesome-crowded-west.php", "aoty_critic_score": 88, "aoty_user_score": 88, "mbid": "041884b1-1ac5-3c8b-93cc-ac928c78c4a0", "yt_id": "G33AcZzZ0pM", "rym": "https://rateyourmusic.com/release/album/modest-mouse/the-lonesome-crowded-west-4", "genres": ["alternative rock", "indie rock", "post-hardcore", "midwest emo", "Alternative Rock"], "desc_lfm_album": "The Lonesome Crowded West is the third album recorded by American indie rock band Modest Mouse (the second released, but Sad Sappy Sucker was recorded before The Lonesome Crowded West and This Is a Long Drive for Someone with Nothing to Think About). The album was released on Up Records on November 18, 1997, on both compact disc and vinyl LP. Many consider the album to be one of the best indie rock albums of the 90s: Pitchfork Media ranked it #29 in their list 100 Greatest Albums of the 1990s, and the song \"Trailer Trash\" number 63 in their .", "desc_lfm_artist": "Modest Mouse is an American alternative rock band which formed in 1993 in Issaquah, Washington, United States. The band's original lineup consisted of guitarist Isaac Brock, drummer Jeremiah Green and bassist Eric Judy. Since being signed to Sony's Epic Records in 2000, Modest Mouse has attained significant popular success with songs such as \"Float On\" and \"Dashboard.\"\n\nThe band's current configuration is Isaac Brock (vocals, guitar), Tom Peloso (strings, horns, bass, keyboards), Jim Fairchild (guitar), and Eric Judy (bass)).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 98, "title": "Legend of the Way of the Sword: BERSERK Original Soundtrack", "artist": "平沢進 [Susumu Hirasawa]", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/159624-legendary-wind-sword-berserk-original-soundtrack.jpg", "aoty_url": "https://www.albumoftheyear.org/album/159624-susumu-hirasawa-legend-of-the-way-of-the-sword-berserk-original-soundtrack.php", "aoty_critic_score": 85, "aoty_user_score": null, "mbid": null, "yt_id": "UDgkHB-s82U", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 99, "title": "Around the Fur", "artist": "Deftones", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4490-around-the-fur_061125.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4490-deftones-around-the-fur.php", "aoty_critic_score": 72, "aoty_user_score": 84, "mbid": "6f935b80-160f-3787-97d6-a4ce342cf8c5", "yt_id": "T0Ojq_jGXTI", "rym": "https://rateyourmusic.com/release/album/deftones/around-the-fur", "genres": ["Metal", "Alternative Rock"], "desc_lfm_album": "Around the Fur is Deftones' second major label album, released in 1997. The songs \"My Own Summer (Shove It)\" and \"Be Quiet and Drive (Far Away)\" were both released as singles with accompanying videos. The album was certified gold by the RIAA in June 1999, and was eventually certified platinum in 2011. Around the Fur has been described as alternative metal, nu metal, post-hardcore, and alternative rock. Guitarist Stephen Carpenter has since reflected, \"We didn't really pay much attention to that. I remember when these subgenre names didn't exist. It was just metal. So I don't think we made a .", "desc_lfm_artist": "Deftones is an American metal band from Sacramento, California, formed in 1988, consisting of Chino Moreno (lead vocals and guitar), Stephen Carpenter (guitar), Frank Delgado (keyboards and turntables), and Abe Cunningham (drums and percussion). Vega (formerly of Quicksand) took on bass duties from mid-2009 to ca. 2021 in substitution for Chi Cheng, who was seriously injured in an automobile accident in Santa Clara, California on November 4, 2008.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 100, "title": "Impossible Princess", "artist": "Kylie Minogue", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/13861-impossible-princess-3.jpg", "aoty_url": "https://www.albumoftheyear.org/album/13861-kylie-minogue-impossible-princess.php", "aoty_critic_score": 67, "aoty_user_score": 84, "mbid": "c58894f6-ff01-3bbd-afa5-4eb54aec6dab", "yt_id": "7ho9dF40HY8", "rym": "https://rateyourmusic.com/release/album/kylie-minogue/impossible-princess/", "genres": ["Electronic", "Pop"], "desc_lfm_album": "\"Impossible Princess\" is the sixth studio album by Australian recording artist Kylie Minogue. It was released on November 1, 1997 by BMG Records in Japan, on January 12, 1998 by Mushroom Records in Australia and on March 23, 1998 by Deconstruction Records in Europe to varied critical reviews. This album was not avaliable in the U.S. until after her North American breakthrough several years later. The album includes the hits \"Some Kind Of Bliss\", \"Did It Again\", \"Breathe\" and \"Cowboy Style.\" This album was produced by Dave Ball, Ingo Vauk, Brothers in Rhythm, Manic Street Preachers and Rob Dougan. Many .", "desc_lfm_artist": "Kylie Ann Minogue (born 28 May 1968) is an Australian singer, songwriter, and actress. Often referred to as the Princess of Pop, she has been recognized for her contributions to music and fashion. Her awards include two Grammy Awards, four Brit Awards, and eighteen ARIA Music Awards. She is regarded as the highest-selling Australian female recording artist, with estimated global sales exceeding 80 million records. In 2024, Time included her in its annual list of the 100 most influential people in the world.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared"]}, {"n": 101, "title": "Young Team", "artist": "Mogwai", "year": 1997, "cover": "https://dn720305.ca.archive.org/0/items/mbid-fe0dfba6-4868-3ede-a3f6-f6f6d7f5fb27/mbid-fe0dfba6-4868-3ede-a3f6-f6f6d7f5fb27-8197918956.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1950-mogwai-mogwai-young-team.php", "aoty_critic_score": 81, "aoty_user_score": 81, "mbid": "8cc9da13-a1b3-3865-9587-a46f7599982f", "yt_id": "du4JbfK5okA", "rym": null, "genres": ["noise rock", "post-rock", "rock", "Alternative Rock"], "desc_lfm_album": "Mogwai Young Team (also known as Young Team) is the debut studio album by Scottish post-rock band Mogwai. Mogwai Young Team was recorded in Summer 1997 at MCM Studios (now known as Gargleblast Studios) in Hamilton, Scotland, and was produced by Paul Savage and Andy Miller. It is largely instrumental, with one notable exception (\"R U Still in 2 It\", which features vocals from Aidan Moffat of Arab Strap), although many songs feature recordings of various individuals speaking, whether over the phone (\"Tracy\"), reading (\"Yes! I Am a Long Way from Home\"), or just rambling (\"Katrien\"). It features limited instrumentation, .", "desc_lfm_artist": "Mogwai is a Scottish post-rock/instrumental band from Glasgow formed in 1995. \nThey compose lengthy, mostly instrumental guitar-based pieces in the style of post-rock, usually focused around the elaboration of a single theme, and are known traditionally for their quiet/loud dynamic, defined bass riffs, and an eminent ambient sound, sometimes dark and sometimes grand. Although frequently referred to as post-rock, the band have revealed in interviews that they despise this categorization", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 102, "title": "Under The Western Freeway", "artist": "Grandaddy", "year": 1997, "cover": "https://dn721904.ca.archive.org/0/items/mbid-bada239d-a4c2-4b2e-be15-51399f06d04e/mbid-bada239d-a4c2-4b2e-be15-51399f06d04e-38248486671.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6558-grandaddy-under-the-western-freeway.php", "aoty_critic_score": 85, "aoty_user_score": 81, "mbid": "fa1533b0-ea8d-370a-a663-42b276aa3039", "yt_id": "dqsduTi7LY8", "rym": null, "genres": ["indie rock", "neo-psychedelia", "noise pop", "indie pop", "slacker rock", "indietronica"], "desc_lfm_album": "Under the Western Freeway is the debut studio album by American indie rock band Grandaddy. It was released on October 21, 1997, by record label Will. The album, while not commercially successful, was well received by music critics. CMJ New Music Monthly described it as \"an eccentric psych-pop collection\". Andy Gill of The Independent called it \"one of the most beguiling debuts of the year a fortuitous collision of Brian Wilson, Neil Young and the Pixies which throws out a stream of understated pop gems\". AllMusic noted similarities to the bands Pavement and Weezer, and described it as \"a fairly .", "desc_lfm_artist": "Grandaddy is an American rock band formed in Modesto, California in 1992 by singer/guitarist/keyboardist Jason Lytle, bassist Kevin Garcia, and drummer Aaron Burtch; although a noisy, lo-fi approach characterized early recordings like 1994's Complex Party Come Along Theories, with the 1995 additions of guitarist Jim Fairchild and keyboardist Tim Dryden the group's sound expanded exponentially over the course of subsequent efforts including the unreleased Don't Sock the Tryer and the 1996 EP A Pretty Mess by This One Band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 103, "title": "Substrata", "artist": "Biosphere", "year": 1997, "cover": "https://ia902803.us.archive.org/9/items/mbid-f0b5621c-7f6f-3d83-9858-e24024291133/mbid-f0b5621c-7f6f-3d83-9858-e24024291133-8541527130.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10255-biosphere-substrata.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "c715c071-1e4e-335b-8a79-4e7ae29783ac", "yt_id": "xL3MBMim36E", "rym": "https://rateyourmusic.com/release/album/biosphere/substrata/", "genres": ["non-music", "field recording", "electronic", "ambient", "Electronic"], "desc_lfm_album": "Substrata is an ambient music album by Biosphere, released in 1997 by All Saints Records. It is considered to be a classic ambient album, consistently in the top 5 in surveys on the Hyperreal ambient mailing list. Biosphere's first truly ambient album, it has a theme of cold, of mountains and glaciers and running water. Sounds of howling wind and creaking wood, although infrequently employed, create a chilling soundscape interrupted by sonorous but quietly suspenseful music. In 2001 the album was re-released in a digitally-remastered format with a second disc featuring a soundtrack for Dziga Vertov's 1929 film Man with .", "desc_lfm_artist": "Biosphere is the main recording name of Geir Jenssen (born 1962 in  Tromsø, Norway), a musician who has released a notable catalog of ambient electronic music. He is well known for his \"ambient house\" and \"arctic ambient\" styles, his use of music loops, and peculiar samples from sci-fi sources. His track \"Novelty Waves\" was used for the 1995 campaign of Levi's. His 1997 album Substrata is generally seen as one of the all-time classic ambient albums. Before launching Biosphere, Jenssen was a member of the Norwegian synth pop band Bel Canto.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere"]}, {"n": 104, "title": "nimrod.", "artist": "Green Day", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/nimrod-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3931-green-day-nimrod.php", "aoty_critic_score": 65, "aoty_user_score": 80, "mbid": "4f1d08f2-d4bd-3ef2-ba72-eb348ae4c332", "yt_id": "a6jIR_InjyM", "rym": null, "genres": [], "desc_lfm_album": "Nimrod is the fifth studio album by American rock band Green Day, released on October 14, 1997, by Reprise Records. .", "desc_lfm_artist": "Green Day is an American rock band formed in Rodeo, California, in 1987, by lead singer and guitarist Billie Joe Armstrong and bassist and backing vocalist Mike Dirnt, with drummer Tré Cool joining in 1990. The band’s major-label debut, \"Dookie,\" released through Reprise Records in 1994, achieved commercial success, eventually shipping over 20 million copies in the United States, and has been credited with renewing mainstream interest in punk rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 105, "title": "The Velvet Rope", "artist": "Janet Jackson", "year": 1997, "cover": "https://dn710008.ca.archive.org/0/items/mbid-f1cf04bd-f968-4fad-9eb5-7faefe9cb430/mbid-f1cf04bd-f968-4fad-9eb5-7faefe9cb430-27271828673.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18834-janet-the-velvet-rope.php", "aoty_critic_score": 67, "aoty_user_score": 89, "mbid": "5bb501c6-2e78-393d-bcac-27d7d1b44a27", "yt_id": "4fbSRlqdZbU", "rym": null, "genres": ["art pop", "r&b", "contemporary r&b", "trip hop", "neo soul", "dance-pop"], "desc_lfm_album": "The Velvet Rope is the sixth studio album by Janet Jackson, released on October 7, 1997, through Virgin Records. Prior to its release, she renegotiated her contract with Virgin for US$80 million, the largest recording contract in history at that time. Upon experiencing an emotional breakdown, Jackson began facing a long-term case of depression. She in turn developed her new record as a concept album, using introspection as its theme. Its title is a metaphor for emotional boundaries, as well as an allusion to an individual's need to feel special. Its lyrics address subject matter such as depression, self-worth, social .", "desc_lfm_artist": "Janet Damita Jo Jackson (born May 16, 1966) is an American singer, songwriter, actress, and dancer. She is recognized for her contributions to pop music, including socially conscious and provocative themes in her recordings, as well as her choreography and stage performances. Her work has been influential in the development of MTV and has contributed to breaking gender and racial barriers in the music industry. Jackson’s lyrics often address social issues and personal experiences, appealing to a broad youth audience.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84"]}, {"n": 106, "title": "Come to Daddy", "artist": "Aphex Twin", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9585-come-to-daddy_132630.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9585-aphex-twin-come-to-daddy.php", "aoty_critic_score": 76, "aoty_user_score": 80, "mbid": "557e1cd5-5b6a-46c1-8d5b-45a32767449d", "yt_id": "TZ827lkktYs", "rym": null, "genres": [], "desc_lfm_album": "Come to Daddy is a 1997 EP by electronic music artist Richard D. James, commonly known as Aphex Twin. \"Come to Daddy, Pappy mix\" — often simply called \"Come to Daddy\" — is one of Aphex Twin's best-known songs. The album peaked at #36 on the UK Singles Chart. James describes his work like this: “ Come to Daddy came about while I was just hanging around my house, getting pissed and doing this crappy death metal jingle. Then it got marketed and a video was made, and this little idea that I had, which was a joke, turned into .", "desc_lfm_artist": "Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "verygooood"]}, {"n": 107, "title": "Time Out of Mind", "artist": "Bob Dylan", "year": 1997, "cover": "https://dn710805.ca.archive.org/0/items/mbid-3e812af9-b0e0-3bb8-9738-b51470797d92/mbid-3e812af9-b0e0-3bb8-9738-b51470797d92-22279139173.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4132-bob-dylan-time-out-of-mind.php", "aoty_critic_score": 87, "aoty_user_score": 81, "mbid": "dad1dada-1fda-3186-beb7-3bc80e90f9e0", "yt_id": "5y_VTtGujPI", "rym": "https://rateyourmusic.com/release/album/bob-dylan/time-out-of-mind/reviews/4", "genres": ["blues rock", "folk rock", "classic rock", "Rock"], "desc_lfm_album": "Time Out of Mind is Bob Dylan's 30th studio album, released in 1997 by Columbia Records. For fans and critics, the album marked Dylan's artistic comeback after he struggled with his musical identity throughout the 1980s, and hadn't released any original material since the release of Under the Red Sky in 1990. Upon release, Time Out of Mind was hailed as one of the singer-songwriter's best albums, and it went on to win three Grammy awards, including Album of the Year in 1998. It also made Uncut magazine's Album of the Year. The album features a particularly atmospheric sound, the .", "desc_lfm_artist": "Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan", "desc_mb_album": "", "desc_mb_artist": "Bob is a member of SESAC, with member #[http://www.sesac.com/Repertory/SongsByWriter.aspx?affilNum=102201&writerAKAName=BOB%20DYLAN|102201]\r\nASCAP has two listings for Bob Dylan: [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=DYLAN%20B&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|1] and [http://ascap.org/ace/search.cfm?requesttimeout=300&mode=results&searchstr=BOB%20DYLAN&search_in=a&search_type=exact&search_det=t,s,w,p,b,v&results_pp=20&start=1|2].\r\n\r\nThe following works are '''not''' Bob Dylan works:\r\n * Abraham's Altar - fake\r\n * Apollo's Love - fake\r\n * As It Is Before - by Earth Opera, not Dylan\r\n * Babylon - actual title is \"Belchezaar\", by Johnny Cash\r\n * Bacon Fat - written and performed by The Band, without Dylan\r\n * Be Car", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave"]}, {"n": 108, "title": "One Day It'll All Make Sense", "artist": "Common", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/17731-one-day-itll-all-make-sense.jpg", "aoty_url": "https://www.albumoftheyear.org/album/17731-common-one-day-itll-all-make-sense.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "4979c8b8-ca57-3b8a-9161-be546e0e67fb", "yt_id": "p5EI-ar0PDU", "rym": "https://rateyourmusic.com/release/album/common/one-day-itll-all-make-sense", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "", "desc_lfm_artist": "Lonnie Rashid Lynn, Jr. (born March 13, 1972 in Chicago, Illinois), better known by his stage name Common (previously Common Sense), is a Grammy award winning rapper, author and actor known for lyrics that focus on love and spirituality. Many people describe him as being a conscious hip hop artist who makes songs that send a message. He debuted in 1992 with the album Can I Borrow a Dollar? and maintained a significant underground following into the late 90s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "verygooood"]}, {"n": 109, "title": "Portishead", "artist": "Portishead", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2553-portishead_144455.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2553-portishead-portishead.php", "aoty_critic_score": 82, "aoty_user_score": 84, "mbid": "7685a5d0-3dac-40c7-b26d-544636129979", "yt_id": "FBXGd81YNzc", "rym": "https://rateyourmusic.com/release/album/portishead/portishead", "genres": ["Electronic"], "desc_lfm_album": "Portishead is the second studio album by English band Portishead, released on September 16, 1997 by Go! Discs. With Portishead, the band chose to eschew sampling other records, which had a defining feature of their debut album Dummy. Instead, they created original pieces which they weaved into the songs, resulting in a more textured sound. The only song to employ samples was \"Only You\", which incorporates elements of Ken Thorne's \"Inspector Clouseau\" and The Pharcyde's \"She Said\". .", "desc_lfm_artist": "Portishead is an English band formed in 1991 in Bristol. Portishead are named after Portishead, Somerset, eight miles west of Bristol, along the coast. The band comprises vocalist Beth Gibbons, producer Geoff Barrow and musician Adrian Utley.\n\nPortishead's debut album, Dummy (1994), fused hip hop production with an atmospheric, cinematic style reminiscent of spy film soundtracks. The album was met with commercial and critical acclaim, quickly becoming a landmark album in the emerging trip hop genre.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 110, "title": "Urban Hymns", "artist": "The Verve", "year": 1997, "cover": "https://dn710203.ca.archive.org/0/items/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034-29045897897.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6530-the-verve-urban-hymns.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "3dd0c8e4-af53-3605-9c20-f27c7635fb60", "yt_id": "GQNxSTFf6zQ", "rym": "https://rateyourmusic.com/release/album/the-verve/urban-hymns", "genres": ["alternative rock", "chamber pop", "indie rock", "neo-psychedelia", "britpop", "post-britpop"], "desc_lfm_album": "Urban Hymns is the third album by English rock band The Verve, released on 29 September 1997. It earned nearly unanimous critical praise upon its release and went on to become the band's best-selling release and one of the biggest-selling albums of the year. The album received nearly unanimous critical praise upon its release, with Melody Maker naming Urban Hymns as the number-one album of 1997 in its year-end list. The album is featured in the book \"1001 Albums You Must Hear Before You Die\". In the years following its release, Urban Hymns received much acclaim. In 1998, it won .", "desc_lfm_artist": "The Verve were an English rock band formed in Wigan in 1990 by lead vocalist Richard Ashcroft, guitarist Nick McCabe, bass guitarist Simon Jones, and drummer Peter Salisbury. Guitarist and keyboardist Simon Tong joined the band during its first reunion.\n\nThe band initially developed a psychedelic and shoegaze sound, showcased on their debut album \"A Storm in Heaven.\" By 1997, The Verve had released three EPs and three studio albums. Throughout their career", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 111, "title": "The End of Evangelion", "artist": "Shiro SAGISU", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/162309-the-end-of-evangelion_091331.jpg", "aoty_url": "https://www.albumoftheyear.org/album/162309-shiro-sagisu-the-end-of-evangelion.php", "aoty_critic_score": 90, "aoty_user_score": null, "mbid": "03587dbb-a647-34d5-a326-9661fd626197", "yt_id": "rfFRxRbqKZw", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Shiro Sagisu (鷺巣詩郎) is a multi-talented music producer/composer/arranger. He has been working in Japan's music scene for over 25 years. Many critics often refer to Shiro Sagisu as \"the Quincy Jones of Japan\". He has a diverse style of production skills in, but not limited to, Pop, R&B, Jazz and Classical music. \n\nHis career started in the late 70’s. He has written uncredited pieces of music for thousands of chart topping artists as well as worked on many films", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 112, "title": "Dots and Loops", "artist": "Stereolab", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9447-dots-and-loops_020629.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9447-stereolab-dots-and-loops.php", "aoty_critic_score": 83, "aoty_user_score": 86, "mbid": "dcc1e5d0-c35f-3e4a-b0d2-b53b23eb906f", "yt_id": "vbeJ4-OMorU", "rym": "https://rateyourmusic.com/release/album/stereolab/dots-and-loops", "genres": ["Alternative Rock"], "desc_lfm_album": "Dots and Loops is the fifth studio album by English-French rock band Stereolab. It was released on 22 September 1997 and was issued by Duophonic Records and Elektra Records. The band co-produced the album with John McEntire and Andi Toma, and recording took place in Chicago and Düsseldorf. The album explores jazz and electronic sounds, and is influenced by bossa nova and 1960s pop music. Its lyrics address matters such as consumerism, the \"spectacle\", materialism, and human interaction. Dots and Loops reached number 19 on the UK Albums Chart, as well as number 111 on the Billboard 200 chart in .", "desc_lfm_artist": "Stereolab is an Anglo-French avant-pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 113, "title": "Homogenic", "artist": "Björk", "year": 1997, "cover": "https://dn721903.ca.archive.org/0/items/mbid-9eb06b8b-73af-4e4f-815c-1a0e459af1c4/mbid-9eb06b8b-73af-4e4f-815c-1a0e459af1c4-42643046619.png", "aoty_url": "https://www.albumoftheyear.org/album/4037-bjork-homogenic.php", "aoty_critic_score": 91, "aoty_user_score": 91, "mbid": "810272e0-aef1-3d85-b2d3-e512e87fc38c", "yt_id": "o4RV4spF0cQ", "rym": "https://rateyourmusic.com/release/album/bjork/homogenic/", "genres": ["electro", "art pop", "trip hop", "idm", "glitch pop", "electro-industrial"], "desc_lfm_album": "Homogenic is the third studio album by Icelandic recording artist Björk. It was released on 22 September 1997 in the United Kingdom by One Little Indian Records and in the United States by Elektra Entertainment. Produced by Björk, Mark Bell, Guy Sigsworth, Howie B, and Markus Dravs, the album marked a stylistic change to her artistry, focusing on similar-sounding music combining electronic beats and string instruments with songs in tribute to her native country Iceland. \"Homogenic\" was originally to be produced in her home in London, but was later recorded in Spain. It marked the first of several production collaborations .", "desc_lfm_artist": "Björk Guðmundsdóttir (born 21 November 1965), known mononymously as Björk, is an Icelandic singer, songwriter, composer, record producer, and actress. Recognised for her distinctive voice, three-octave vocal range, and unconventional public image, she has developed an eclectic musical style over a career spanning five decades, incorporating elements of electronic, pop, dance, trip hop, jazz, and avant-garde music. She is widely regarded as an influential figure in electronic and experimental music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "armandwave"]}, {"n": 114, "title": "Static & Silence", "artist": "The Sundays", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33135-static-silence_150146.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33135-the-sundays-static-silence.php", "aoty_critic_score": 67, "aoty_user_score": 81, "mbid": "8d693db5-6f59-3da2-bec2-e1b782292606", "yt_id": "9q2RduExPLs", "rym": "https://rateyourmusic.com/release/album/the-sundays/static-and-silence", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "The Sundays were an English jangle pop band formed in 1988 in Bristol, United Kingdom. Singer Harriet Wheeler and guitarist David Gavurin formed the band in college, soon adding bassist Paul Brindley and drummer Patrick Hannan. Comparisons were drawn with original label-mates The Smiths, and bands such as Cocteau Twins, and 10,000 Maniacs. \n\nTheir level of commercial success was almost unprecedented by an indie act when their first album 'Reading Writing and Arithmetic' (Rough Trade", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik"]}, {"n": 115, "title": "Buena Vista Social Club", "artist": "Buena Vista Social Club", "year": 1997, "cover": "https://dn710804.ca.archive.org/0/items/mbid-96cba92f-afeb-3637-8506-2d16d77a24cc/mbid-96cba92f-afeb-3637-8506-2d16d77a24cc-17589875101.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8427-buena-vista-social-club-buena-vista-social-club.php", "aoty_critic_score": 88, "aoty_user_score": 86, "mbid": "32bbab8e-02c0-30d2-9e23-a19739864b84", "yt_id": "LX-SgU1uXYM", "rym": "https://rateyourmusic.com/release/album/buena-vista-social-club/buena-vista-social-club-3", "genres": ["jazz", "latin", "afro-cuban jazz", "bolero", "salsa", "son cubano"], "desc_lfm_album": "Buena Vista Social Club is a studio album by Buena Vista Social Club, an ensemble of Cuban musicians directed by Juan de Marcos González and American guitarist Ry Cooder. Produced by Cooder, it was recorded at Havana's EGREM studios in March 1996 and released on September 16, 1997, through World Circuit internationally and Nonesuch Records in the United States. It is the only standard studio album exclusively credited to the Buena Vista Social Club. Buena Vista Social Club was recorded in parallel with A toda Cuba le gusta by the Afro-Cuban All Stars, a similar project also promoted by World .", "desc_lfm_artist": "Buena Vista Social Club was a musical ensemble primarily made up of Cuban musicians, formed in 1996. The project was organized by World Circuit executive Nick Gold, produced by American guitarist Ry Cooder and directed by Juan de Marcos González. They named the group after the members' club of the same name in the Buenavista quarter of Havana, a popular music venue in the 1940s. To showcase the popular styles of the time, such as son, bolero and danzón, they recruited a dozen veteran musicians, some of whom had been retired for many years.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "Max
