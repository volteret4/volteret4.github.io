 While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style", "desc_mb_album": "", "desc_mb_artist": "Originally named ‘Diamond Lie’. Following the addition of Layne Staley, they were also periodically named ‘Mothra’ and ‘Fuck’ (amongst other names) until settling on ‘Alice in Chains’, after Staley’s [artist:5ec4ba3a-83b9-4623-9f63-8a1e3cfa1de5|old band].", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 217, "title": "Different Class", "artist": "Pulp", "year": 1995, "cover": "https://ia801502.us.archive.org/29/items/mbid-e26332fc-d9c5-4507-aeda-5f83df17a5a9/mbid-e26332fc-d9c5-4507-aeda-5f83df17a5a9-3032704385.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3602-pulp-different-class.php", "aoty_critic_score": 92, "aoty_user_score": 85, "mbid": "88f69eab-8f07-343b-847c-b944ad33dfcf", "yt_id": "2fD6kxn1zjI", "rym": "https://rateyourmusic.com/release/album/pulp/different-class", "genres": ["alternative rock", "art rock", "glam rock", "indie rock", "britpop"], "desc_lfm_album": "Different Class (released in Japan as \"Common People\") is the fifth studio album by English rock band Pulp. In 2013, NME ranked the album at number six in its list of the 500 greatest albums of all time. Released by Island Records on 30 October 1995 at the height of Britpop, the album led to the band being regarded by some as part of that movement. Two of the singles on the album – \"Common People\" (which reached number two in the UK singles chart) and \"Disco 2000\" (which reached number seven) – were especially notable, and helped propel Pulp .", "desc_lfm_artist": "Pulp is a britpop band that formed in 1978 in Sheffield, England, United Kingdom. The band's best known and most stable lineup consists of Jarvis Cocker (vocals), Russell Senior (guitar, violin), Mark Webber (guitar), Candida Doyle (keyboards), Steve Mackey (bass) and Nick Banks (drums). Although many members have had a long tenure with the band, the only constant member has been Cocker. In 2011, it was announced on Pulp's official website that the band's classic lineup would reunite and perform at several festivals", "desc_mb_album": "In Japan, this album is referred to as コモン・ピープル (Common People).", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 218, "title": "Mellon Collie and the Infinite Sadness", "artist": "The Smashing Pumpkins", "year": 1995, "cover": "https://dn721204.ca.archive.org/0/items/mbid-61a93f13-72ff-4aea-97e6-9b0954cb36b0/mbid-61a93f13-72ff-4aea-97e6-9b0954cb36b0-38216215200.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3073-smashing-pumpkins-mellon-collie-and-the-infinite-sadness.php", "aoty_critic_score": 76, "aoty_user_score": 87, "mbid": "1af599c9-0b44-3a5a-a06b-39e8db6b2b4e", "yt_id": "Filhvqr5XV4", "rym": "https://rateyourmusic.com/release/album/the-smashing-pumpkins/mellon-collie-and-the-infinite-sadness", "genres": ["alternative rock", "hard rock", "indie rock", "dream pop", "grunge", "post-grunge"], "desc_lfm_album": "Mellon Collie and the Infinite Sadness is the third album by American alternative rock band The Smashing Pumpkins, released on October 24, 1995 on Virgin Records. Produced by Smashing Pumpkins frontman Billy Corgan, Flood and Alan Moulder, the 28-track album was released as a two-disc CD and triple LP. Flood and Moulder had previously worked with Nine Inch Nails to produce 1994's The Downward Spiral. Led by the single \"Bullet with Butterfly Wings\", the album debuted at number one on the Billboard charts, a first for the group. The album spawned four more singles over the course of 1996 and .", "desc_lfm_artist": "The Smashing Pumpkins is an American alternative rock band from Chicago, Illinois. The band was formed in 1988 by Billy Corgan and James Iha, with bassist D'arcy Wretzky  and drummer Jimmy Chamberlin joining shortly after. Despite going through many lineup changes, the current lineup is identical to the original, with the exception of Wretzky, who would end up leaving the band just before their initial breakup in 2000.\n\nDisavowing the punk rock roots of many of their alt-rock contemporaries", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 219, "title": "Ask Me Tomorrow", "artist": "Mojave 3", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9155-ask-me-tomorrow_130423.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9155-mojave-3-ask-me-tomorrow.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "225de0e3-30af-3698-9a8f-e393a6abd0bf", "yt_id": "yhGCk1Nlyfw", "rym": "https://rateyourmusic.com/release/album/mojave-3/ask-me-tomorrow", "genres": [], "desc_lfm_album": "Ask Me Tomorrow is the debut album by Mojave 3, released by 4AD on 16 October 1995 in the UK and on 16 January 1996 in the US. The album was released roughly eight months after the release of Pygmalion, the third studio album by Mojave 3 founders Neil Halstead, Rachel Goswell, and Ian McCutcheon's previous band Slowdive. Musically, the album incorporates elements of alt-country, dream pop, and slowcore. .", "desc_lfm_artist": "Mojave 3 is a dream pop/folk band which formed in Reading, England in 1993. The band consists of Neil Halstead (vocals, guitar), Rachel Goswell (vocals, guitar, bass), Simon Rowe (guitar), Alan Forrester (organ, vocals), and Ian McCutcheon (drums). Goswell, Halstead and McCutcheon were previously members of the shoegaze band Slowdive.\n\nThe band initially existed as a trio consisting of Halstead, Goswell, and McCutcheon (hence the \"3\" in their name).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 220, "title": "Disco Volante", "artist": "Mr. Bungle", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7993-disco-volante-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7993-mr-bungle-disco-volante.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "93958da7-e728-3761-b28a-d6e0e89580ec", "yt_id": "uZ3WuOag218", "rym": "https://rateyourmusic.com/release/album/mr-bungle/disco-volante/", "genres": [], "desc_lfm_album": "Disco Volante is a 1995 album by the band Mr. Bungle. It is by far the most experimental of all their productions as it picks up inspirations from a wide variety of musical styles, including death metal, techno, 50s space age pop, Musique concrète and Italian avantgarde. Disco Volante usually demands a few listens for the subtleties and detail to really kick in, while the first listen will likely leave you confused, bewildered, and possibly entertained. The album's production is unconventional in every aspect. Musical references, recording quality, vocabulary; virtually every sound on this album has an unknown element to .", "desc_lfm_artist": "Mr. Bungle are an experimental rock group from Eureka, California, United States. The band was formed in 1985 while the members were still in high school and was named after a children educational film. Mr. Bungle released four demo tapes in the mid to late 1980s before being signed to Warner Bros. Records and releasing three full-length studio albums between 1991 and 1999. The band toured in 2000 to support their last album but as of 2004 were considered disbanded.", "desc_mb_album": "", "desc_mb_artist": "The Swedish 90's comedy show \"Varan-TV\" featured music by Mr. Bungle; Specifically the song \"Chemical Marriage\" from the album Disco Volante.", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 221, "title": "Daydream", "artist": "Mariah Carey", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12253-daydream_070525.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12253-mariah-carey-daydream.php", "aoty_critic_score": 67, "aoty_user_score": 82, "mbid": "bf0126a1-b79c-3c9c-a892-f4bf4fac2bb0", "yt_id": "U40lIWSEkqc", "rym": "https://rateyourmusic.com/release/album/mariah-carey/daydream", "genres": ["ballad", "contemporary r&b", "pop soul", "hip hop", "dance-pop", "garage house"], "desc_lfm_album": "Daydream is the fifth studio album by American singer Mariah Carey, released on October 3, 1995, through Columbia Records. Following the massive success of Music Box (1993) and Merry Christmas (1994), Daydream saw Carey embracing a more R&B and hip-hop-influenced sound, while still maintaining the pop balladry that had made her a superstar. The album was a critical and commercial triumph, spawning some of the biggest hits of the 1990s and earning multiple Grammy nominations. Background and Creation As Carey gained more control over her music, she sought to incorporate contemporary R&B and hip-hop elements into her sound, moving away .", "desc_lfm_artist": "Mariah Carey (born March 27, 1969) is an American singer, songwriter, record producer, author and actress. She is known for her five-octave vocal range, melismatic singing style, and use of the whistle register. In 2023, Rolling Stone ranked her as the fifth-greatest singer of all time.\n\nCarey rose to prominence with her self-titled debut album in 1990 and became the first artist to have their first five singles reach number one on the US Billboard Hot 100, from \"Vision of Love\" through \"Emotions\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84"]}, {"n": 222, "title": "(What’s the Story) Morning Glory?", "artist": "Oasis", "year": 1995, "cover": "https://dn710200.ca.archive.org/0/items/mbid-ed286309-6e64-48e3-835b-61aaf86cdb86/mbid-ed286309-6e64-48e3-835b-61aaf86cdb86-39250165476.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "cc7e6348-cc55-31fa-aeb2-748a46a81cb3", "yt_id": "kwFMdWp4Na0", "rym": "https://rateyourmusic.com/release/album/oasis/_whats-the-story-morning-glory", "genres": ["alternative rock", "hard rock", "pop rock", "neo-psychedelia", "britpop", "rock"], "desc_lfm_album": "", "desc_lfm_artist": "Oasis are an English rock band formed in Manchester in 1991. The original lineup consisted of Liam Gallagher on lead vocals, Paul \"Bonehead\" Arthurs on guitar, Paul \"Guigsy\" McGuigan on bass guitar, and Tony McCarroll on drums. Liam’s older brother Noel Gallagher joined later as lead guitarist and vocalist, becoming the group’s main songwriter and de facto leader. Oasis are regarded as one of the most successful and influential bands of the Britpop movement.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 223, "title": "Washing Machine", "artist": "Sonic Youth", "year": 1995, "cover": "https://dn710906.ca.archive.org/0/items/mbid-ae28608d-05af-4da1-a7ea-f4260621eb21/mbid-ae28608d-05af-4da1-a7ea-f4260621eb21-4080845359.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1024034-sonic-youth-goo-washing-machine-sonic-youth.php", "aoty_critic_score": 83, "aoty_user_score": 81, "mbid": "9722731f-48ec-3958-a6b7-a08521fcf115", "yt_id": "8wPPhifmRoA", "rym": "https://rateyourmusic.com/release/album/sonic-youth/washing-machine.p", "genres": ["alternative rock", "noise rock", "no wave", "indie rock"], "desc_lfm_album": "Washing Machine is the ninth studio album by the American experimental rock band Sonic Youth, released on September 26, 1995 by DGC Records. It was recorded at Easley Studios in Memphis, Tennessee and produced by the band and John Siket, who also engineered the band's previous two albums. The album features more open-ended pieces than its predecessors and contains some of the band's longest songs, including the 20-minute ballad \"The Diamond Sea\", which is the lengthiest track to feature on any of Sonic Youth's studio albums. Released shortly after the band concluded their stint headlining the 1995 Lollapalooza music festival, .", "desc_lfm_artist": "Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups", "desc_mb_album": "", "desc_mb_artist": "Sonic Youth were a four-piece band from New York. Emerging from the no-wave movement, their experimental noise distinguished them from other underground bands of the 1980s. Their signing to DGC in 1990 was unusual in the creative freedom given in the contract, and proved that it was possible to remain true to an independent ethic while on a major label.\r\nSee also [http://musicbrainz.org/show/artist/?artistid=58284|Ciccone Youth].", "heard_by": ["Lonsonxd", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 224, "title": "The Gold Experience", "artist": "Prince", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9273-the-gold-experience.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9273-prince-the-gold-experience.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "11deb7b3-c4d5-3e46-809f-f23123602dca", "yt_id": "UVZLzHmiiNM", "rym": null, "genres": [], "desc_lfm_album": "The Gold Experience is an album released by Prince (his stage name at that time being the love symbol he created) on September 26, 1995. The album is considered by some fans to be the Purple Rain of the 1990s, due to the rock and roll feel, accessibility of the tracks, and Prince's own admission that the song, \"Gold\" would be the next \"Purple Rain\". Prince wanted to release The Gold Experience under the symbolic moniker in 1994, alongside Come, which was marketed as a \"Prince\" album of \"old\" material. Both albums contained material from Prince's musical production called Glam .", "desc_lfm_artist": "Prince Rogers Nelson (June 7, 1958 – April 21, 2016), more commonly known mononymously as Prince, was an American singer-songwriter, musician, and record producer. The recipient of numerous awards and nominations, he is widely regarded as one of the greatest musicians of his generation. He was known for his flamboyant, androgynous persona; his wide vocal range, which included a far-reaching falsetto and high-pitched screams; and his skill as a multi-instrumentalist, often preferring to play all or most of the instruments on his recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 225, "title": "Garbage", "artist": "Garbage", "year": 1995, "cover": "https://dn710201.ca.archive.org/0/items/mbid-81fd4218-d269-48d4-b2cc-1e74b6c28187/mbid-81fd4218-d269-48d4-b2cc-1e74b6c28187-33157526921.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6147-garbage-garbage.php", "aoty_critic_score": 86, "aoty_user_score": 81, "mbid": "dcad245f-9d95-3751-9e69-d50ca399b46a", "yt_id": "m5lKNceLLeY", "rym": "https://rateyourmusic.com/release/album/garbage/garbage", "genres": ["alternative rock", "glam rock", "grunge", "pop"], "desc_lfm_album": "Garbage is the debut album by Scottish-American alternative rock group Garbage. It was released in the late summer and autumn of 1995 worldwide, following critical acclaim and promising chart positions for their debut single Vow, which entered the Billboard Hot 100. Garbage eventually spent over a year on both the US and UK charts, reaching the top 20 on charts worldwide and receiving multi-platinum certification in numerous territories. The albums success was helped by the band promoting it on a year-long tour, including playing on the European festival circuit and supporting the Smashing Pumpkins throughout 1996, as well as by .", "desc_lfm_artist": "Garbage is a Scottish and American alternative rock band formed in 1993 in Madison, Wisconsin. The band's line-up consisting of Scottish singer Shirley Manson (vocals) and American musicians Duke Erikson (guitar, bass, keyboards), Steve Marker (guitar, keyboards), and Butch Vig (drums, production) has remained unchanged since its inception. All four members are involved in the songwriting and production process. Garbage has sold over 17 million albums worldwide.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 226, "title": "Only Built 4 Cuban Linx…", "artist": "Raekwon", "year": 1995, "cover": "https://ia800605.us.archive.org/29/items/mbid-876f4c16-f0e1-40db-8586-87884d49b70d/mbid-876f4c16-f0e1-40db-8586-87884d49b70d-9706279036.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "ab981b48-9a7b-34c4-b46a-f6266317ce7c", "yt_id": "vMaJC4ZiahQ", "rym": "https://rateyourmusic.com/release/album/raekwon/only-built-4-cuban-linx", "genres": ["hip hop", "hardcore hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "Corey Woods (born January 12, 1970), a.k.a. Raekwon (/ɹeɪˈkwɒn/), is an American rapper, one of the nine Wu-Tang Clan  members. Raekwon joined Wu-Tang Clan, a hip hop group based in Staten Island, New York in 1992. When the time came for him to release his first solo album, Only Built 4 Cuban Linx... (1995), hip-hop, once again, underwent a momentous transformation. The album moves from track to track like a film moves from scene to scene. With its invigorating instrumentals and dramatic lyrical tales", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 227, "title": "E. 1999 iano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 229, "title": "Brown Sugar", "artist": "D’Angelo", "year": 1995, "cover": "https://dn710103.ca.archive.org/0/items/mbid-b29372ff-92c5-4acf-a25b-38f63f390e72/mbid-b29372ff-92c5-4acf-a25b-38f63f390e72-43317874585.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a4591f67-48d9-36ae-bc68-2deb954d0a15", "yt_id": "Uon7iKGqqaA", "rym": "https://rateyourmusic.com/release/album/dangelo/brown-sugar", "genres": ["soul", "r&b", "contemporary r&b", "neo soul", "funk / soul"], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "Rocky_stereo", "alberto_gu"]}, {"n": 230, "title": "Jagged Little Pill", "artist": "Alanis Morissette", "year": 1995, "cover": "https://dn710302.ca.archive.org/0/items/mbid-fbf0a5ee-f9ef-3077-a38a-f990a1b9c8eb/mbid-fbf0a5ee-f9ef-3077-a38a-f990a1b9c8eb-1000630504.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3939-alanis-morissette-jagged-little-pill.php", "aoty_critic_score": 82, "aoty_user_score": 80, "mbid": "ee3d18ed-d6a8-37c7-a964-41bbdb6d59f1", "yt_id": "K_f85Zc6u-U", "rym": "https://rateyourmusic.com/release/album/alanis-morissette/jagged-little-pill-7", "genres": ["alternative rock", "pop rock", "trip hop", "post-grunge"], "desc_lfm_album": "Jagged Little Pill is the third studio album (and the first to be released internationally) by Canadian singer Alanis Morissette. The album made a sharp turn in genre and style for Alanis from her previous dance pop sound. The album garnered great success, spending twelve non-consecutive weeks at number one on the U.S. Billboard 200 albums chart, and became one of three albums – along with Thriller by Michael Jackson and Falling into You by Céline Dion – to remain in the Top Ten for over a year. The album had a slow rise up the charts, but by 1996 .", "desc_lfm_artist": "Alanis Nadine Morissette (born June 1, 1974) is a Canadian and American singer, musician, and songwriter. She is known for her mezzo-soprano voice and confessional songwriting, and has sold over 60 million records worldwide. Her awards include a Brit Award, seven Grammy Awards, fourteen Juno Awards, and nominations for two Golden Globe Awards and a Tony Award.\n\nMorissette began her career in Canada in the early 1990s with the dance-pop albums \"Alanis\" (1991) and \"Now Is the Time\" (1992).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 231, "title": "Post", "artist": "Björk", "year": 1995, "cover": "https://dn721909.ca.archive.org/0/items/mbid-e9ff4eaf-8c9c-4c31-a0de-5cf967c90b53/mbid-e9ff4eaf-8c9c-4c31-a0de-5cf967c90b53-38887851407.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4332-bjork-post.php", "aoty_critic_score": 87, "aoty_user_score": 88, "mbid": "b2a6e057-087d-3ae5-a6e5-7f5fa39808ff", "yt_id": "Y0WO2Km-r94", "rym": "https://rateyourmusic.com/release/album/bjork/post", "genres": ["alternative pop"], "desc_lfm_album": "Post is the second studio album by Icelandic singer-songwriter/musician Björk. It was released in June of 1995. The album was produced in conjunction with Nellee Hooper, Tricky, Graham Massey of 808 State, and electronic music producer Howie B. Building on the success of her previous album Debut, Björk continued to pursue different sounds, taking particular interest in dance and techno. Production by Tricky and Howie B also provided trip hop-like sounds on tracks like \"Possibly Maybe\". It was these producers' influence that gave Björk impetus to create material like the storming \"Army of Me\" and \"Enjoy\". However, Björk had not .", "desc_lfm_artist": "Björk Guðmundsdóttir (born 21 November 1965), known mononymously as Björk, is an Icelandic singer, songwriter, composer, record producer, and actress. Recognised for her distinctive voice, three-octave vocal range, and unconventional public image, she has developed an eclectic musical style over a career spanning five decades, incorporating elements of electronic, pop, dance, trip hop, jazz, and avant-garde music. She is widely regarded as an influential figure in electronic and experimental music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 232, "title": "Red Medicine", "artist": "Fugazi", "year": 1995, "cover": "https://dn710805.ca.archive.org/0/items/mbid-1f62d07a-ff81-469f-ba61-1e7083055be2/mbid-1f62d07a-ff81-469f-ba61-1e7083055be2-9561307502.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4612-fugazi-red-medicine.php", "aoty_critic_score": 78, "aoty_user_score": 83, "mbid": "5b6401e0-54a3-3b91-9dac-b289ef456de1", "yt_id": "n9ahnd83sOY", "rym": "https://rateyourmusic.com/release/album/fugazi/red-medicine", "genres": ["alternative rock", "punk", "indie rock", "post-hardcore"], "desc_lfm_album": "", "desc_lfm_artist": "Fugazi was an American post-hardcore band formed in Washington, D.C., in 1986. The band consists of guitarists and vocalists Ian MacKaye and Guy Picciotto, bassist Joe Lally, and drummer Brendan Canty. They are noted for their style-transcending music, DIY ethical stance, manner of business practice and contempt for the music industry.\n\nSince its inception, Fugazi has been self-managed and have released almost all their material through Dischord Records, an independent label founded by MacKaye and partner Jeff Nelson in 1980.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["sdecandelario", "verygooood"]}, {"n": 233, "title": "Panzerfaust", "artist": "Dark n is a re-recording of the title track from the band's previous album. Both this album and Effigy of the Forgotten have been re-released by Roadrunner Records as part of the Two from the Vault series. .", "desc_lfm_artist": "Suffocation is an American brutal technical death metal band originating from Centereach, New York. The band formed in 1988 and approached this genre in their own style, revolving around heavy, uniquely rhythmic riffs and even deeper growling vocals and breakdowns to create a sub-genre of the form often termed \"brutal\" death metal - also known by many as \"New York Death Metal,\" or \"NYDM\" for short. Other New York death metal bands that soon after followed in the footsteps of Suffocation's style include  Immolation", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU"]}, {"n": 236, "title": "Mystic Stylez", "artist": "Three 6 Mafia", "year": 1995, "cover": "https://dn710702.ca.archive.org/0/items/mbid-d57b5ef8-ca89-4ce3-b1f4-b4f531f9cfe4/mbid-d57b5ef8-ca89-4ce3-b1f4-b4f531f9cfe4-18953650600.png", "aoty_url": "https://www.albumoftheyear.org/album/39327-three-6-mafia-mystic-stylez.php", "aoty_critic_score": 70, "aoty_user_score": 85, "mbid": "ac6859cf-3bc7-31da-9255-b7d6a08cc6a9", "yt_id": "EREwIISurr4", "rym": null, "genres": ["blues", "hip hop", "gangsta rap", "horrorcore"], "desc_lfm_album": "\"Mystic Stylez\" is the debut studio album by legendary Memphis rap group Three 6 Mafia. It was released on May 30, 1995 through their then-newly formed record label, Prophet. All of the songs on this LP were produced by two of the founding members of the group, DJ Paul & Juicy J, featuring all six members of the group with the addition of numerous affiliates. The album has left its mark on the rap game while defining the horrorcore sub-genre and played a major role in the South's rising in hip-hop's dominated East-West culture, inspiring artists such as A$AP Rocky, .", "desc_lfm_artist": "Three 6 Mafia is an American   hi 4816ff5573", "yt_id": "pMu5ir4JL0w", "rym": "https://rateyourmusic.com/release/album/mobb-deep/the-infamous", "genres": ["hip hop", "jazz rap", "east coast hip hop", "boom bap", "gangsta rap", "hardcore hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "Mobb Deep was a hip-hop duo made up of Havoc and Prodigy. Both members are natives of Queensbridge, New York; located in Long Island City. They are perhaps most famous for their landmark album, The Infamous, and the accompanying hit single, Shook Ones Pt. II.\n\n1992–1994: Early Career\n\nProdigy and Havoc met one another while attending the prestigious High School of Art & Design in Manhattan. Coming from similar backgrounds, the duo broke into the rap game in 1992.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 239, "title": "Wowee Zowee", "artist": "Pavement", "year": 1995, "cover": "https://dn721901.ca.archive.org/0/items/mbid-d919f8f0-1d66-3e03-a71f-2f1a7e9a3ebc/mbid-d919f8f0-1d66-3e03-a71f-2f1a7e9a3ebc-43763417085.png", "aoty_url": "https://www.albumoftheyear.org/album/1475-pavement-wowee-zowee.php", "aoty_critic_score": 68, "aoty_user_score": 81, "mbid": "fa79988d-62b5-3039-9169-ed0d17d53296", "yt_id": "YaMYh1pmon4", "rym": "https://rateyourmusic.com/release/album/pavement/wowee-zowee", "genres": ["alternative rock", "indie rock"], "desc_lfm_album": "Wowee Zowee is the third studio album by Pavement. The album showcased a more experimental and spontaneous side of the group, returning them to the clatter and unpredictability of their early recordings after the classic rock vibe of 1994's Crooked Rain, Crooked Rain. The cover art was painted by New York-based artist Steve Keene and resembles the cover of Guru Guru's 1972 album, \"Känguru.\" Rolling Stone speculated that the relative success of their previous album (having sold 169,000 copies by this time) was a reason for this album's eclectic nature; the magazine's review claimed Pavement were afraid of success. Stephen .", "desc_lfm_artist": "Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 240, "title": "You'd Prefer an Astronaut", "artist": "Hum", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8838-youd-prefer-an-astronaut-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8838-hum-youd-prefer-an-astronaut.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "99b74f6b-49e6-37a9-8caf-e4d03533622d", "yt_id": "c4UUessm_9U", "rym": "https://rateyourmusic.com/release/album/hum/youd-prefer-an-astronaut", "genres": [], "desc_lfm_album": "You'd Prefer an Astronaut is the third studio album by Hum. It was released in 1995 by RCA Records as their major label debut. The title of the album is a lyric lifted from the song \"I'd Like Your Hair Long\". The album was quite succesful selling over 250.000 copies since its release, mostly due to the second single from the album, \"Stars\"; it became Hum's highest charting song, reaching 11 on Hot Modern Rock Tracks and 28 on Hot Mainstream Rock Tracks; it regained popularity a decade later after being featured in a Cadillac commercial with actress Kate Walsh. .", "desc_lfm_artist": "Hum is an American alternative rock and post-hardcore band formed in 1989 in Champaign, Illinois; the band performed a mix between both genres obtaining a characteristic heaviness that would define them for the rest of their career (this sound is also known today as Heavy Alternative). The band went through member changes until 1993, finally settling with Matt Talbot (vocals, guitar), Tim Lash (guitar), Jeff Dimpsey (bass) and Bryan St. Pere (drums) until their split in 2000.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 241, "title": "King for a Day, Fool for a Lifetime", "artist": "Faith No More", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/king-for-a-day-fool-for-a-lifetime-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5095-faith-no-more-king-for-a-day-fool-for-a-lifetime.php", "aoty_critic_score": 49, "aoty_user_score": 82, "mbid": "1428e1d2-119e-3739-bee7-42bb6835a7f9", "yt_id": "MYULU2zPMHU", "rym": null, "genres": [], "desc_lfm_album": "\"King for a Day... Fool for a Lifetime\" is the fifth studio album by the American rock band Faith No More, released on March 13, 1995, by Slash and Reprise Records. It was the band’s first album recorded without longtime guitarist Jim Martin. The recording features a wide range of musical styles, which Rolling Stone described as a \"genre shuffle.\" The album produced the singles \"Digging the Grave,\" \"Ricochet,\" and \"Evidence.\" After Martin’s departure, Trey Spruance, who had previously played with vocalist Mike Patton in Mr. Bungle, was brought in to perform guitar parts for the album. The recording process .", "desc_lfm_artist": "Faith No More was an American rock band from San Francisco, California, formed in 1979. Before September 1983, the band performed under the names Sharp Young Men and later Faith No Man. Bassist Billy Gould, keyboardist and rhythm guitarist Roddy Bottum, and drummer Mike Bordin were the longest-tenured members of the band, having been involved since its inception. The band underwent several lineup changes over the years. The final lineup consisted of Gould, Bordin, Bottum, lead guitarist Jon Hudson, and vocalist and lyricist Mike Patton.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 242, "title": "Return to the 36 Chambers: The Dirty Version", "artist": "Ol’ Dirty Bastard", "year": 1995, "cover": "https://dn710809.ca.archive.org/0/items/mbid-5260a4fc-a974-4708-8aaa-2cd1a339532e/mbid-5260a4fc-a974-4708-8aaa-2cd1a339532e-25892939709.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "36c695e8-773a-3f30-9a8c-d7afc2804544", "yt_id": "s8E66FCDAuQ", "rym": null, "genres": ["hip hop", "east coast hip hop", "hardcore hip hop"], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["EliasJ72", "alberto_gu", "armandwave"]}, {"n": 243, "title": "Lifestylez ov da Poor & Dangerous", "artist": "Big L", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10252-lifestylez-ov-da-poor-dangerous_093510.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10252-big-l-lifestylez-ov-da-poor-dangerous.php", "aoty_critic_score": 68, "aoty_user_score": 86, "mbid": "9a29e57d-dd1c-35c1-bb05-d220bcb656d6", "yt_id": "G2gXUTDEvQ0", "rym": "https://rateyourmusic.com/release/album/big-l/lifestylez-ov-da-poor-and-dangerous/", "genres": [], "desc_lfm_album": "\"Lifestylez ov da Poor & Dangerous\" is the debut studio album by American hip-hop artist Big L. Released March 28, 1995 on Columbia Records, it is Big L's only album to be released during his lifetime. Recording sessions took place primarily at Powerplay Studios in Queens, New York from 1993 to 1995. Production was handled by Buckwild, Craig Boogie, Kid Capri, Lord Finesse, and Showbiz. The album debuted at number 149 on the US Billboard 200 and number 22 on R&B/Hip-Hop Albums, but did not chart internationally. The album was supported by two singles: “Put It On” featuring Kid Capri, .", "desc_lfm_artist": "L s Sveningsson on bass guitar,  Bengt Lagerberg on drums and Lars-Olof Johansson on keyboards and guitar. \n\nThe five-piece met as teenagers in Jönköping", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84"]}, {"n": 245, "title": "Symbolic", "artist": "Death", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/38701-symbolic_153318.jpg", "aoty_url": "https://www.albumoftheyear.org/album/38701-death-symbolic.php", "aoty_critic_score": 90, "aoty_user_score": 90, "mbid": "bd675025-abcb-3536-9e19-ba3204c0183d", "yt_id": "QH4jrLL-sS4", "rym": "https://rateyourmusic.com/release/album/death/symbolic/", "genres": [], "desc_lfm_album": "Symbolic is the sixth album by American death metal band Death. The album was released on March 21, 1995 through Roadrunner Records. The album was remastered and reissued on April 1, 2008 with five bonus tracks. Like its predecessors, the album is progressive and technically advanced. It also has higher production values than previous albums, with considerably less static on its overall sound. It is notable that the average song length on this album is around five minutes, while it was around four minutes on Human and Individual Thought Patterns, perhaps due to slowed down song tempos closer to that .", "desc_lfm_artist": "There are multiple artists sharing the name Death; \n\n1) A pioneering death metal band from Altamonte Springs, Florida, U.S. \n2) A protopunk band from Detroit, Michigan, U.S. \n3) A horrorcore rapper from New Orleans, Louisiana, U.S. \n4) A hard techno producer from Germany. \n\n1)  Death was an American death metal band formed in Altamonte Springs, Florida in 1984 by guitarist and vocalist Chuck Schuldiner. Death is considered to be among the most influential", "desc_mb_album": "", "desc_mb_artist": "The band was originally started as [http://musicbrainz.org/show/artist/relationships.html?artistid=602427|Mantas] in 1983 and changed its name to Death a year later.", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 246, "title": "Me Against the World", "artist": "2Pac", "year": 1995, "cover": "https://dn710702.ca.archive.org/0/items/mbid-3dbc70e8-b3a3-4a39-a1b6-1d4a6a4c7440/mbid-3dbc70e8-b3a3-4a39-a1b6-1d4a6a4c7440-20098653914.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "cfc98a2a-6aaa-3dda-a01d-e034e56c4fec", "yt_id": "ZgUBzpvT-D0", "rym": "https://rateyourmusic.com/release/album/2pac/me-against-the-world", "genres": ["hip hop", "conscious hip hop", "pop rap", "west coast hip hop", "g-funk", "gangsta rap"], "desc_lfm_album": "Me Against the World is the fourth studio album by American hip hop artist Tupac Shakur. It was released March 14, 1995 on the Interscope Records label recorded from September 1993 to November 1994. It was his impending prison sentence, troubles with the police and Shakur being poor, which many believe might have contributed to Shakur's artistic reemergence on record, as his material is believed by Steve Huey of Allmusic to have become markedly more \"confessional\", \"reflective\", and \"soul-baring\". Me Against the World, released while Shakur was imprisoned, made an immediate impact on the charts, debuting at number one on .", "desc_lfm_artist": "Tupac Amaru Shakur (born Lesane Parish Crooks; June 16, 1971 – September 13, 1996), known professionally as 2Pac and later as Makaveli, was an American rapper and actor. He is regarded as one of the most influential and successful rappers of all time and as a prominent political and cultural figure in late 20th-century America. Shakur sold more than 75 million records worldwide, making him one of the best-selling music artists in history. His work often addressed themes of social injustice", "desc_mb_album": "", "desc_mb_artist": "Please '''don't add''' the releases '''''Thug Life, Volume I''''' or '''''The Don Killuminati: The 7 Day Theory''''' to this artist entry:\n    * ''[http://musicbrainz.org/release-group/6d810afd-b059-31ca-b3e2-6c7e2a7d6efd.html|Thug Life, Volume I]'' is already filed under the correct artist, '''[http://musicbrainz.org/artist/703f9c8c-32c8-482a-900d-a12fd8f20360.html|Thug Life]'''.\n    * ''[http://musicbrainz.org/release-group/5782e30e-fd08-349d-8a22-bbe8c5d7ffec.html|The Don Killuminati: The 7 Day Theory]'' and its singles should be credited to '''[http://musicbrainz.org/artist/e263a1d8-8228-4ede-9e17-7acf8470165a.html|Makaveli]''' and are the only official releases that should be filed there.", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu"]}, {"n": 247, "title": "Above", "artist": "Mad Season", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8044-above.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8044-mad-season-above.php", "aoty_critic_score": 50, "aoty_user_score": 81, "mbid": "dfd71e05-6a88-3fed-87be-a09d466766e5", "yt_id": "sUnmdQ1iNOc", "rym": "https://rateyourmusic.com/release/album/mad-season/above", "genres": [], "desc_lfm_album": "Above is the only studio album by the American rock supergroup Mad Season, released on March 15, 1995 through Columbia Records. The album has been certified gold by the RIAA in the United States. During the production of Pearl Jam's Vitalogy, guitarist Mike McCready went into rehab in Minneapolis, Minnesota, where he met The Lamont Cranston Band bassist John Baker Saunders. In 1994, when the two returned to Seattle, they formed a side band with Screaming Trees drummer Barrett Martin. Immediately the trio set up rehearsal time together and began writing material. McCready then brought in friend and Alice in .", "desc_lfm_artist": "Mad Season was an American grunge supergroup formed in 1994 as a side project of members of other bands in the Seattle grunge scene. The band's principal members included guitarist Mike McCready of Pearl Jam, lead singer Layne Staley of Alice in Chains, drummer Barrett Martin of Screaming Trees and bassist John Baker Saunders. Mad Season released only one album, Above, in March 1995. Its first single, \"River of Deceit\", was a radio success, and Above was certified a gold record by the RIAA in June.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 248, "title": "The Bends", "artist": "Radiohead", "year": 1994, "cover": "https://ia800500.us.archive.org/0/items/mbid-8af759be-1495-4cc4-85a7-47edc21fa348/mbid-8af759be-1495-4cc4-85a7-47edc21fa348-32251121765.jpg", "aoty_url": "https://www.albumoftheyear.org/album/365-radiohead-the-bends.php", "aoty_critic_score": 83, "aoty_user_score": 86, "mbid": "b8048f24-c026-3398-b23a-b5e50716cbc7", "yt_id": "K8z8hLvjb_U", "rym": "https://rateyourmusic.com/release/album/radiohead/the-bends", "genres": ["alternative rock", "pop rock", "psychedelic", "indie rock", "britpop", "post-britpop"], "desc_lfm_album": "The Bends, released on 13 March 1995 in the United Kingdom and on 4 April 1995 in the United States, is the second studio album released by the English rock band Radiohead. The album was dedicated to the late comedian Bill Hicks. The album contains singles \"High and Dry\", \"Fake Plastic Trees\", \"Just\", \"My Iron Lung\", and \"Street Spirit (Fade Out)\". The Bends was ranked number 110 on Rolling Stone's 500 Greatest Albums of All Time, and number 2 on Q's 100 Greatest Albums Ever. The album was subject to much greater critical acclaim than their debut Pablo Honey (1993), .", "desc_lfm_artist": "Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock.", "desc_mb_album": "", "desc_mb_artist": "Formed in Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 249, "title": "To Bring You My Love", "artist": "PJ Harvey", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2332-to-bring-you-my-love_173645.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2332-pj-harvey-to-bring-you-my-love.php", "aoty_critic_score": 91, "aoty_user_score": 86, "mbid": "2a976d93-1131-3821-9bcb-6c79542d93aa", "yt_id": "cBZ08qW5SHM", "rym": "https://rateyourmusic.com/release/album/pj-harvey/to-bring-you-my-love", "genres": [], "desc_lfm_album": "\"To Bring You My Love\" is the third studio album by the English alternative rock musician PJ Harvey, released on 27 February 1995 by Island Records. Recorded after the break-up of the PJ Harvey trio, it stands as her first proper solo album. The songs on the album are heavily influenced by American blues music. Harvey co-produced the record with Flood and John Parish. \"To Bring You My Love\" would be the first of Harvey's many collaborations with Flood and Parish. The music on the album was played largely by Harvey and Parish, with contributions from seasoned musicians Joe Gore, .", "desc_lfm_artist": "Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 250, "title": "Maxinquaye", "artist": "Tricky", "year": 1995, "cover": "https://dn710102.ca.archive.org/0/items/mbid-849315e1-c3ee-4c1b-955a-a53a1a009e63/mbid-849315e1-c3ee-4c1b-955a-a53a1a009e63-40597098441.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4409-tricky-maxinquaye.php", "aoty_critic_score": 91, "aoty_user_score": 81, "mbid": "9fd2415f-182f-39c1-aa02-5acb36f99bef", "yt_id": "J_r2HZqw06E", "rym": "https://rateyourmusic.com/release/album/tricky/maxinquaye", "genres": ["psychedelic", "dub", "r&b", "electronica", "post-rock", "trip hop"], "desc_lfm_album": "Maxinquaye is the debut album of Tricky, released in 1995. Expanding on the sonic template of fellow Bristolians Massive Attack, and featuring then-girlfriend Martina Topley-Bird on vocals, Maxinquaye is a dark, mysterious album featuring a combination of hip-hop, soul, dub, rock and electronica. The album was later released in America and received great critical acclaim. The album is named after Tricky's late mother Maxine Quaye, who is thought to be reggae/soul singer Finley Quaye's half-sister .", "desc_lfm_artist": "Adrian Thaws (born 27 January 1968), better known as Tricky, is a rapper and musician from Knowle West, Bristol, England who is important in the trip-hop scene (despite loathing the tag) and remains influential on the British scene more generally.\n\nHe is noted for an asthmatic whispering lyrical style that is half-rapped, half-sung. As a producer and a musician he is known for having an aversion to perfection preferring to build up a dark, rich and layered sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 251, "title": "Bergtatt – Et eeventyr i 5 capitler", "artist": "Ulver", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/41088-bergtatt-et-eeventyr-i-5-capitler_135844.jpg", "aoty_url": "https://www.albumoftheyear.org/album/41088-ulver-bergtatt-et-eeventyr-i-5-capitler.php", "aoty_critic_score": 92, "aoty_user_score": 82, "mbid": "c9e7b2fc-ec8a-3450-a22f-a79ddd67bd47", "yt_id": "exm-PpPxiEQ", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ulver (Norwegian for “wolves”) is a multi-disciplinary musical group founded in Oslo, Norway and currently based in London, England. The band was formed by Kristoffer \"Garm\" Rygg in 1993, and the current line-up includes Rygg (vocal, programming), Jørn H. Sværen (misc.), Tore Ylwizaker (programming, piano) and Daniel O'Sullivan (guitar, piano, various). Since their first black metal releases in 1993, Ulver’s style has ever been changing by combining elements of experimental", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 252, "title": "The Great Annihilator", "artist": "Swans", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5891-the-great-annihilator_180212.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5891-swans-the-great-annihilator.php", "aoty_critic_score": 74, "aoty_user_score": 85, "mbid": "e5122542-1533-39d8-8cb0-93b76d1c2dad", "yt_id": "gu3d1yIZAUw", "rym": "https://rateyourmusic.com/release/album/swans/the-great-annihilator", "genres": [], "desc_lfm_album": "The Great Annihilator is the ninth studio album by American experimental rock band Swans. It was released on January 23, 1995, through frontman Michael Gira's own record label, Young God. The album has been described by Gira as a companion album to his solo album Drainland (1995); the two were remastered and re-released together in April 2017. .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 253, "title": "Bigtyme Vol II: All Screwed Up", "artist": "DJ Screw", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/82214-bigtyme-vol-ii-all-screwed-up_143959.jpg", "aoty_url": "https://www.albumoftheyear.org/album/82214-dj-screw-bigtyme-vol-ii-all-screwed-up.php", "aoty_critic_score": 82, "aoty_user_score": null, "mbid": null, "yt_id": "K10YhRUKXQI", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "DJ Screw, born Robert Earl Davis, Jr. (July 20, 1971 – November 16, 2000), was a central figure in the Houston hip hop scene. His innovation included the trademark technique of slowing down the basic tracks of a cut when he remixed it. He was the main mix tape mixer for the huge Screwed Up Click. \n\nHe was born in Bastrop, Texas to Robert Earl Davis, Sr. DJ Screw had lived in Smithville, Houston, and Los Angeles; at one point his father took him to Houston in order to keep him from trouble.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 254, "title": "Blasphemy Made Flesh", "artist": "Cryptopsy", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53820-blasphemy-made-flesh_223554.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53820-cryptopsy-blasphemy-made-flesh.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "6b581c7a-64e2-3940-afb2-457daca93505", "yt_id": "183HWDnqM7U", "rym": "https://rateyourmusic.com/release/album/cryptopsy/blasphemy-made-flesh", "genres": ["Metal"], "desc_lfm_album": "Debut album by the Canadian extreme metal band. Released 1994. .", "desc_lfm_artist": "Originating from the Montreal area, this group first appeared in 1992, when it was called Necrosis; in the same year it was reincarnated under the name of Cryptopsy. With just a demo called Ungentle Exhumation and then the album Blasphemy Made Flesh (1994), the group acquired a solid reputation on the international scene. Their release of None So Vile in 1996 was the first burst of brilliance in their career. From that point the group clearly outclassed other groups by reinventing the style, today categorized as extreme music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU"]}, {"n": 255, "title": "CrazySexyCool", "artist": "TLC", "year": 1994, "cover": "https://dn711305.ca.archive.org/0/items/mbid-821cfaab-a24e-4274-80d5-4b7eb96734f0/mbid-821cfaab-a24e-4274-80d5-4b7eb96734f0-1925883052.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8439-tlc-crazysexycool.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "3d886c06-a4c7-3431-be87-2b2940f07acd", "yt_id": "m5Fa4raZr8M", "rym": "https://rateyourmusic.com/release/album/tlc/crazysexycool", "genres": ["contemporary r&b", "hip hop", "pop rap", "new jack swing"], "desc_lfm_album": "CrazySexyCool is the second studio album by the group TLC, released on November 15, 1994 in North America, and throughout early 1995 in all other territories. The album became one of the most successful R&B albums ever released, shipping over eleven million records domestically and selling over fifteen million worldwide. It is the best selling album by a girl group in America. The album features two Billboard Hot 100 number-one hits: \"Creep\" and \"Waterfalls\". Other successful singles included \"Diggin' On You\" and \"Red Light Special\". \"Kick Your Game\" is the third TLC song besides \"Sumthin' Wicked This Way Comes\" in .", "desc_lfm_artist": "TLC is an American girl group formed in 1990 in Atlanta, Georgia. The group's best-known line-up was composed of Tionne \"T-Boz\" Watkins, Lisa \"Left Eye\" Lopes, and Rozonda \"Chilli\" Thomas. The group enjoyed success during the 1990s, with nine top-ten hits on the Billboard Hot 100, including four number-one singles: \"Creep\", \"Waterfalls\", \"No Scrubs\", and \"Unpretty\". The group also recorded four multi-platinum albums, including CrazySexyCool (1994), which received a diamond certification from the Recording Industry Association of America (RIAA).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 256, "title": "MTV Unplugged in New York", "artist": "Nirvana", "year": 1994, "cover": "https://dn710301.ca.archive.org/0/items/mbid-856045e3-162f-39ef-80ab-0cb13d054b96/mbid-856045e3-162f-39ef-80ab-0cb13d054b96-9917787295.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3669-nirvana-mtv-unplugged-in-new-york.php", "aoty_critic_score": 92, "aoty_user_score": 91, "mbid": "fb3770f6-83fb-32b7-85c4-1f522a92287e", "yt_id": "CXz7RC8W56I", "rym": "https://rateyourmusic.com/release/album/nirvana/mtv-unplugged-in-new-york", "genres": ["folk rock", "alternative rock", "acoustic rock", "indie rock", "grunge"], "desc_lfm_album": "MTV Unplugged in New York is a live album by the American grunge band Nirvana. It features an acoustic performance taped at Sony Music Studios in New York City on November 18, 1993 for the television series MTV Unplugged. The show was directed by Beth McCarthy and first aired on the cable television network MTV on December 14, 1993. As opposed to traditional practice on the television series, Nirvana played mainly lesser-known material and cover versions of songs by The Vaselines, David Bowie, Meat Puppets (during which they were joined by members of the group onstage) and Leadbelly. MTV Unplugged .", "desc_lfm_artist": "There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s.", "desc_mb_album": "", "desc_mb_artist": "Nirvana is a band whose shows and session recordings have been widely bootlegged as unofficial videos, CDs and raw WAV/FLAC files and mp3s. Details of these releases have been added to Musicbrainz where the sources have been confirmed. \r\n----\r\nDate and venue information current with information from the Nirvana LiveGuide (July 12, 2007 Update).\r\nDate and venue information current with information from the LiveNirvana (August 3, 2007 Update).\r\nBootlegs known to exist current with LiveNirvana (August 3, 2007 Update).", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 257, "title": "Resurrection", "artist": "Common", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4342-resurrection_044557.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4342-common-resurrection.php", "aoty_critic_score": 86, "aoty_user_score": 83, "mbid": "25fc4138-ffc2-36f1-90ac-4960b3e85301", "yt_id": "06ORuf4wYMY", "rym": null, "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "Resurrection is the second album by American rapper Common (then known as Common Sense). Released in 1994, the album received critical acclaim, but not a significant amount of mainstream attention. Resurrection was entirely produced by No I.D. (who also produced the bulk of Can I Borrow A Dollar?), and Ynot. The record was originally rated 3.5 mics in The Source in 1994. In 1998, the album was selected as one of The Source's 100 Best Rap Albums . The album is divided into two sections; the \"East Side of Stony\" (tracks 1-7) and \"West Side of Stony\" (tracks 8-15). Stony .", "desc_lfm_artist": "Lonnie Rashid Lynn, Jr. (born March 13, 1972 in Chicago, Illinois), better known by his stage name Common (previously Common Sense), is a Grammy award winning rapper, author and actor known for lyrics that focus on love and spirituality. Many people describe him as being a conscious hip hop artist who makes songs that send a message. He debuted in 1992 with the album Can I Borrow a Dollar? and maintained a significant underground following into the late 90s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "alberto_gu"]}, {"n": 258, "title": "Geek The Girl", "artist": "Lisa Germano", "year": 1994, "cover": "https://dn710305.ca.archive.org/0/items/mbid-80f21ff3-e087-4792-b22f-dfcaf8f502b4/mbid-80f21ff3-e087-4792-b22f-dfcaf8f502b4-44147985609.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "2fb59b47-507c-3101-8803-5a6bf8b133cb", "yt_id": "rY0vJHgWCDg", "rym": "https://rateyourmusic.com/release/album/lisa-germano/geek-the-girl", "genres": ["alternative rock", "Pop", "Alternative Rock"], "desc_lfm_album": "Released in October 1994 by 4AD, Geek the Girl is widely considered Lisa Germano’s creative breakthrough and emotional masterpiece. A concept album of sorts, it captures a character—”the geek”—navigating the landscape of trauma, desire, vulnerability, and identity. It’s an unsettling yet beautiful descent into the interior of the female experience, delivered with haunting intimacy and uncompromising honesty. Germano’s use of fractured melodies, off-kilter arrangements, and whispery vocals creates a soundscape that feels like a private confession—one that listeners are almost intruding upon. From the booklet: \"Hi, this is the story of geek the girl, a girl who is confused about .", "desc_lfm_artist": "Lisa Germano is a multi-instrumentalist, singer, writer and arranger from Mishawaka, Indiana.\n\nAfter years playing violin as a session musician with the likes of John Mellencamp, Indigo Girls and Bob Dylan, Germano embarked on a solo career in 1991 with the understated but occasionally brilliant On The Way Down From The Moon Palace on her own label, which led to a deal with Capitol, who released her second album. Although Happiness was a massive step up in terms of confidence and songwriting", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo"]}, {"n": 259, "title": "At Action Park", "artist": "Shellac", "year": 1994, "cover": "https://dn711004.ca.archive.org/0/items/mbid-13cb27a3-a149-4aa3-93e3-47b2cc6e0ab7/mbid-13cb27a3-a149-4aa3-93e3-47b2cc6e0ab7-26663400234.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7728-shellac-at-action-park.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "9c3d1af0-c350-32e7-b0f8-556826929a4f", "yt_id": "AC7Pkwmllow", "rym": "https://rateyourmusic.com/release/album/shellac/at-action-park", "genres": ["alternative rock", "noise rock", "industrial", "indie rock", "math rock", "Rock"], "desc_lfm_album": "At Action Park is the debut studio album by American rock band Shellac, released on October 24th, 1994 via Touch and Go Records. .", "desc_lfm_artist": "Shellac (sometimes referred to as 'Shellac of North America') was an American rock music group formed in Chicago, Illinois, in 1992 by Steve Albini (guitar and vocals), Bob Weston (bass guitar vocals) and Todd Trainer (drums). They have been classified as post-hardcore, noise rock and math rock. Albini has claimed they refer to themselves as 'Shellac of North America', \"when we're being pretentious.\"\n\nThey have a distinctive, minimalist sound based on unusual and urgent time signatures", "desc_mb_album": "", "desc_mb_artist": "Math rock trio with Steve Albini, guitar/vox; Bob Weston, bass; Todd Trainer, drums.", "heard_by": ["GabredMared", "alberto_gu", "sdecandelario"]}, {"n": 260, "title": "ORANGE", "artist": "Fishmans", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/113191-orange-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/113191-fishmans-orange.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "33e5adf0-c20e-3c14-af80-b8be75d57ac0", "yt_id": "fGDR_S5Jfxk", "rym": null, "genres": [], "desc_lfm_album": "Orange (typically written in capital letters as ORANGE) is the fourth studio album by Fishmans. It was first released on October 21, 1994 by Media Remoras, mostly recorded in previous months at Metropolis Studios in London, England. It would be the last Fishmans album to feature Hakase-Sun on keyboards. Despite its funk rock leanings, the album also heavily foreshadows Fishmans' future dream pop-oriented sound, such as songs like 帰り道 or Woofer Girl. On Fishmans' official website, the latter half of the album is described as \"slow reggae\", elaborating that this sound inspired their later albums. It also defines Orange as .", "desc_lfm_artist": "Fishmans (フィッシュマンズ) were an influential Japanese band formed in 1987. They were ranked number 83 in a list of Japan’s top 100 musicians provided by HMV, and are renowned for their unique sound and the distinctive vocals of lead singer Shinji Sato.\n\nThe band was formed in 1987 by Sato (vocals, guitar, trumpet), Kin-Ichi Motegi (drums, vocals, sampler), and Kensuke Ojima (guitar and vocals). The addition of Yuzuru Kashiwabara (bass) and Hakase (keyboards) rounded up the original line-up.", "desc_ 991. The original lineup consisted of Liam Gallagher on lead vocals, Paul \"Bonehead\" Arthurs on guitar, Paul \"Guigsy\" McGuigan on bass guitar, and Tony McCarroll on drums. Liam’s older brother Noel Gallagher joined later as lead guitarist and vocalist, becoming the group’s main songwriter and de facto leader. Oasis are regarded as one of the most successful and influential bands of the Britpop movement.", "desc_mb_album": "US and Canadian editions contain a typo for track 9, listed as \"Digsy's Diner\".", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 274, "title": "The Holy Bible", "artist": "Manic Street Preachers", "year": 1994, "cover": "https://dn710902.ca.archive.org/0/items/mbid-04c6af71-bb83-4791-922b-66a7091102ab/mbid-04c6af71-bb83-4791-922b-66a7091102ab-23548633118.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4341-manic-street-preachers-the-holy-bible.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "7882cea8-bd15-3ff7-a62a-f22f49c6a0c1", "yt_id": "tettEqBvpqc", "rym": "https://rateyourmusic.com/release/album/manic-street-preachers/the-holy-bible", "genres": ["alternative rock", "hard rock", "post-punk", "punk rock", "Rock", "Punk"], "desc_lfm_album": "The Holy Bible is the third studio album by the Welsh rock band Manic Street Preachers. It was released on August 30, 1994 by Epic Records, a subsidiary of Sony Records, unlike their two previous albums which had been released on the Columbia Records imprint. It peaked at number 6 on the UK Albums Chart. The first single from the album, \"Faster\", was released on June 6 and peaked at #16 on the British singles chart. The single marked a new chapter for the band as the material was both lyrically and sonically different than their previous release, the Life .", "desc_lfm_artist": "Manic Street Preachers are an alternative rock band from Blackwood, Wales, formed in 1986. Often referred to as \"the Manics\", they are James Dean Bradfield (vocals, guitars), Nicky Wire (bass, occasional vocals) and Sean Moore (drums, backing vocals, occasional trumpet). The band were originally a quartet: lyricist and rhythm guitarist Richey Edwards mysteriously vanished on 1 February 1995. He was declared presumed deceased in November 2008.\n\nThe Manics released their debut album Generation Terrorists in 1992.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 275, "title": "[untitled]", "artist": "Slint", "year": 1994, "cover": "https://i.discogs.com/6q9p86ipE6Sqll-bIf4PX2ct_PGUfity2DVFDEZ75Cg/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTM3NTUw/OS0xMzA2NTkyNjY1/LmpwZWc.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/27475-slint-untitled.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "f167c246-842b-4e44-bac9-76a149cddd86", "yt_id": "oUEpi18cVIA", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Slint was an American post-hardcore band consisting of Brian McMahan (guitar and vocals), David Pajo (guitar), Britt Walford (drums), Todd Brashear (bass on Spiderland) and Ethan Buckler (bass on Tweez). They formed in Louisville, Kentucky, United States in 1986. Though they disbanded circa 1991, they are considered to be a major influence on the post-hardcore, math rock, and post-rock scenes.\n\nSlint's first album Tweez was recorded by legendary sound", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 276, "title": "Grace", "artist": "Jeff Buckley", "year": 1994, "cover": "https://dn710600.ca.archive.org/0/items/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1-24008507233.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4338-jeff-buckley-grace.php", "aoty_critic_score": 90, "aoty_user_score": 92, "mbid": "ea29c347-696f-3165-986d-7bad1394b178", "yt_id": "ywEByqEVQRk", "rym": "https://rateyourmusic.com/release/album/jeff-buckley/grace", "genres": ["folk rock", "alternative rock", "classic rock", "pop rock", "Rock", "Alternative Rock"], "desc_lfm_album": "\"Grace\" is the first and only complete studio album by Jeff Buckley, released on August 23, 1994. The album is named after the title track, \"Grace\", co-written by Buckley and Gary Lucas. While the album initially had poor sales, only peaking at #149 in the U.S., it received wide critical acclaim. It has now sold over 2 million copies worldwide. An extended version of the album (subtitled Legacy Edition) celebrating its tenth anniversary was released in 2004, and it peaked at #44 in the UK. Musicians such as Thom Yorke of Radiohead and Matthew Bellamy of Muse list Buckley among .", "desc_lfm_artist": "Jeffrey Scott \"Jeff\" Buckley (raised Scott Moorhead; November 17, 1966 – May 29, 1997) was an American musician. After spending approximately a decade as a session guitarist in Los Angeles, he began performing in the early 1990s at venues in Manhattan’s East Village, where he developed a following. Buckley signed with Columbia Records and released his only studio album, \"Grace\", in 1994. He toured internationally to promote the album, performing in the United States, Europe, Japan, and Australia.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 277, "title": "Dummy", "artist": "Portishead", "year": 1994, "cover": "https://dn711103.ca.archive.org/0/items/mbid-76df3287-6cda-33eb-8e9a-044b5e15ffdd/mbid-76df3287-6cda-33eb-8e9a-044b5e15ffdd-829521842.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2552-portishead-dummy.php", "aoty_critic_score": 92, "aoty_user_score": 90, "mbid": "48140466-cff6-3222-bd55-63c27e43190d", "yt_id": "GxWgRnnWfcc", "rym": "https://rateyourmusic.com/release/album/portishead/dummy", "genres": ["trip hop", "acid jazz", "Electronic"], "desc_lfm_album": "Dummy is the debut studio album by English band Portishead, released on August 22, 1994 by Go! Beat Records. The album is often credited with popularising the trip hop genre and is frequently cited in lists of the best albums of the 1990s. \"Numb\" was released on June 6, 1994 as the album's lead single, followed by \"Sour Times\" in August of the same year and \"Glory Box\" in January 1995. The tracks \"Roads\" and \"Strangers\" were used in the soundtrack of the 1994 horror film Nadja. .", "desc_lfm_artist": "Portishead is an English band formed in 1991 in Bristol. Portishead are named after Portishead, Somerset, eight miles west of Bristol, along the coast. The band comprises vocalist Beth Gibbons, producer Geoff Barrow and musician Adrian Utley.\n\nPortishead's debut album, Dummy (1994), fused hip hop production with an atmospheric, cinematic style reminiscent of spy film soundtracks. The album was met with commercial and critical acclaim, quickly becoming a landmark album in the emerging trip hop genre.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 278, "title": "Stress: The Extinction Agenda", "artist": "Organized Konfusion", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10910-stress-the-extinction-agenda_133644.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10910-organized-konfusion-stress-the-extinction-agenda.php", "aoty_critic_score": 81, "aoty_user_score": 87, "mbid": "d6cfc3c2-462e-3695-8c90-b70b0afae306", "yt_id": "tdyBQkBuSjs", "rym": "https://rateyourmusic.com/release/album/organized-konfusion/stress-the-extinction-agenda", "genres": ["Hip-Hop"], "desc_lfm_album": "", "desc_lfm_artist": "Organized Konfusion was an alternative hip-hop duo from Queens, New York.\n\nBand members Prince Po and Pharoahe Monch began their career as Simply 2 Positive and then signed to Hollywood Records for 1991's Organized Konfusion. The album was commercially unsuccessful but critically acclaimed, as was the follow-up, Stress: The Extinction Agenda (1994) and the duo moved to Priority Records for the concept album The Equinox in 1997.\n\nMonch has also launched a successful solo career, highlighted by his album Internal Affairs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 279, "title": "6 Feet Deep", "artist": "Gravediggaz", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/37678-6-feet-deep_083454.jpg", "aoty_url": "https://www.albumoftheyear.org/album/37678-gravediggaz-6-feet-deep.php", "aoty_critic_score": 79, "aoty_user_score": 86, "mbid": "d6f1ef7d-64e1-39fc-be5b-f2d57afa3a45", "yt_id": "X6CGTkX8fBo", "rym": "https://rateyourmusic.com/release/album/gravediggaz/6-feet-deep/", "genres": ["Hip-Hop"], "desc_lfm_album": "6 Feet Deep is the debut album of the horrorcore supergroup Gravediggaz. It was released on August 9, 1994 by Gee Street Records. The album was re-issued in 1997. 6 Feet Deep received very positive reviews, with critics praising its ominous production and lyrics, and is considered an influential album in the horrorcore subgenre. The album peaked at number 36 on the Billboard 200 and spawned three singles: \"Diary of a Madman\", \"Nowhere to Run, Nowhere to Hide\" and \"1-800 Suicide\". .", "desc_lfm_artist": "Gravediggaz was an American hip-hop group from New York City, known for its dark sense of humor and abrasive, menacing soundscapes. Gravediggaz blended hardcore hip hop, gangsta rap and heavy metal with horror elements to pioneer the hip-hop subgenre of horrorcore.\n\nThe group was formed in 1992, bringing together Prince Paul (The Undertaker), Frukwan (The Gatekeeper), Poetic (The Grym Reaper) and RZA (The RZArector). It came about largely due to the efforts of Prince Paul.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "alberto_gu"]}, {"n": 280, "title": "When the Kite String Pops", "artist": "Acid Bath", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/42847-when-the-kite-string-pops_044216.jpg", "aoty_url": "https://www.albumoftheyear.org/album/42847-acid-bath-when-the-kite-string-pops.php", "aoty_critic_score": 75, "aoty_user_score": 86, "mbid": "8df242f8-232c-3235-91ec-d682786aba50", "yt_id": "Ia8M8NPsI7k", "rym": "https://rateyourmusic.com/release/album/acid-bath/when-the-kite-string-pops/", "genres": ["Metal", "Rock"], "desc_lfm_album": "When The Kite String Pops is the first of 2 albums released by American Sludge Metal band Acid Bath. Over the years the album has been hailed as a masterpiece and a landmark of the sludge metal genre. The cover art features a self painted portrait of the Serial Killer John Wayne Gacy as his alter-ego Pogo the Clown. .", "desc_lfm_artist": "Acid Bath is an American metal band from Houma, Louisiana that formed in 1991. They released their breakout debut When the Kite String Pops in 1994, which was then followed by their sophomore and final album, Paegan Terrorism Tactics, in 1996. The band later broke up in 1997 after the passing of bassist Audie Pitre in a traffic collision. \n\nTheir music is often regarded as hard to label under one certain genre. While sweeping across many sounds, Acid Bath put out two records of considerable influence", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 281, "title": "Roman Candle", "artist": "Elliott Smith", "year": 1994, "cover": "https://dn710602.ca.archive.org/0/items/mbid-2a3dbf29-e1d5-40c6-85d5-4c9611da9c9b/mbid-2a3dbf29-e1d5-40c6-85d5-4c9611da9c9b-5003037508.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7307-elliott-smith-roman-candle.php", "aoty_critic_score": 79, "aoty_user_score": 82, "mbid": "31e226a2-1359-356a-b39d-4ebcf9a87eec", "yt_id": "
