ally became associated with the London acid jazz movement of the early 1990s and later incorporated influences from rock, disco, electronic music, and Latin styles. Their lyrics have frequently focused on social and environmental themes.\n\nJamiroquai first recorded under Acid Jazz Records before signing with Sony", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario"]}, {"n": 167, "title": "ATLiens", "artist": "OutKast", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/atliens-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2916-outkast-atliens.php", "aoty_critic_score": 92, "aoty_user_score": 88, "mbid": "672fa6be-ae6a-38a2-a0d3-6a393a3929bf", "yt_id": "CplOmO_lGco", "rym": "https://rateyourmusic.com/release/album/outkast/atliens", "genres": ["alternative hip hop", "hip hop", "conscious hip hop", "dirty south", "abstract hip hop", "southern hip hop"], "desc_lfm_album": "ATLiens is the second studio album by American hip-hop duo OutKast, released on August 27, 1996, by LaFace Records. The duo sought to improve on their 1994 debut album Southernplayalisticadillacmuzik and gain respect for their burgeoning Southern hip-hop scene. ATLiens has been listed by several magazines and critics as one of the greatest hip-hop albums of all time. OutKast recorded ATLiens in sessions at several Atlanta studios—Bosstown Recording Studios, Doppler Recording Studios, PatchWerk Recording Studio, Purple Dragon Studios, and Studio LaCoCo—as well as Chung King Recording Studio and Sound On Sound Recording in New York City. The record features outer .", "desc_lfm_artist": "OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "sdecandelario"]}, {"n": 168, "title": "October Rust", "artist": "Type O Negative", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/25453-october-rust.jpg", "aoty_url": "https://www.albumoftheyear.org/album/25453-type-o-negative-october-rust.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "2a1ccd2d-fc6c-30fb-bdb4-ebf87b67a676", "yt_id": "J_sejul-Tko", "rym": "https://rateyourmusic.com/release/album/type-o-negative/october-rust", "genres": ["Metal"], "desc_lfm_album": "October Rust is the fourth album by Type O Negative. It was released in 1996, and has a more gothic rock feel than earlier albums. This is the first album to feature Johnny Kelly credited as the band's drummer, though in a 2007 interview with Dave Manack for dreadcentral.com keyboardist and co-producer, Josh Silver confessed that all the drum parts on \"October Rust\" and the band's two subsequent studio albums (World Coming Down and Life is Killing Me) were programmed. October Rust has more ballads and less of the punk/metal sound of previous or subsequent albums. It also features a .", "desc_lfm_artist": "Type O Negative was a gothic metal / doom metal band formed in Brooklyn, New York, US in 1990. They are well known for their dry, morbid and ironic sense of humor and their often slow and brooding music. \"The Drab Four\" (the nickname Type O Negative gave themselves) always succeeded in keeping their own unique style, mixing melodic, classic rock 'n' roll with slow, doom-like vibes, and down-tuned heavy metal guitar riffs with dark soundscapes. They were also known for doom metal riffs", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 169, "title": "Becoming X", "artist": "Sneaker Pimps", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29721-becoming-x.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29721-sneaker-pimps-becoming-x.php", "aoty_critic_score": 66, "aoty_user_score": 81, "mbid": "62c14bd1-2a53-3a69-9b68-c3df4bc61032", "yt_id": "gy6iHLXi4f0", "rym": "https://rateyourmusic.com/release/album/sneaker-pimps/becoming-x", "genres": [], "desc_lfm_album": "The first Sneaker Pimps album, released in 1996. It includes the popular singles \"6 Underground\" and \"Spin Spin Sugar.\" Due to the immense success the album received, it was re-released in 1997 with an alternate cover and remixes in place of certain songs. This is known as the limited edition release. The first, 1996 vinyl release contains the original artwork with original, intended track order. The 2008, 2016 and 2020 vinyl re-releases contain the original artwork with the 1997, limited edition track order. This was an error at One Little Indian Records' end. .", "desc_lfm_artist": "Sneaker Pimps is an English downtempo/trip-hop band, initially active from 1995 to 2006 and working together again since 2019. As Line of Flight and Frisk, DJs and childhood friends Chris Corner from Middlesbrough and Liam Howe from Hartlepool released two EPs: \"Soul of Indiscretion\" and \"World as A Cone\" in the early 1990s. While not nearly as complex as the song-based material they would produce, these bedroom-recorded mixes of sampled beats and folk sounds would form the blueprint for the later sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 170, "title": "One in a Million", "artist": "Aaliyah", "year": 1996, "cover": "https://dn710701.ca.archive.org/0/items/mbid-fd5b992e-23fa-3a3d-9422-772bedae2ab3/mbid-fd5b992e-23fa-3a3d-9422-772bedae2ab3-10355273764.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8428-aaliyah-one-in-a-million.php", "aoty_critic_score": 73, "aoty_user_score": 80, "mbid": "776a71f8-2071-3743-aab4-83436df1b366", "yt_id": "scJVnDW-0zc", "rym": "https://rateyourmusic.com/release/album/aaliyah/one-in-a-million", "genres": ["r&b", "contemporary r&b", "pop soul", "hip hop", "pop rap", "hip hop soul"], "desc_lfm_album": "One in a Million is the second studio album by Aaliyah. It was first released on August 27, 1996, by Blackground and Atlantic Records. The album was recorded from August 1995 to July 1996 with a variety of producers including Timbaland, Missy Elliott, Carl-So-Lowe, J. Dibbs, Jermaine Dupri, Kay Gee, Vincent Herbert, Rodney Jerkins, Craig King, Darren Lighty and Darryl Simmons. The album featured several guest vocalists, including Elliott, Timbaland, Treach and Slick Rick. .", "desc_lfm_artist": "Aaliyah Dana Haughton (January 16, 1979 – August 25, 2001) was an American singer, actress, dancer, and model. She was recognized for her contributions to contemporary R&B, pop, and hip hop, earning titles such as the \"Princess of R&B\" and \"Queen of Urban Pop\". Her awards and nominations include three American Music Awards, two MTV Video Music Awards, and five Grammy Award nominations.\n\nBorn in Brooklyn and raised in Detroit, Aaliyah first gained", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 171, "title": "Fantastic Planet", "artist": "Failure", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/62156-fantastic-planet.jpg", "aoty_url": "https://www.albumoftheyear.org/album/62156-failure-fantastic-planet.php", "aoty_critic_score": 83, "aoty_user_score": 83, "mbid": "ffaf0ab2-77e7-35da-b595-fdd8fad38cf3", "yt_id": "YjljI55NF_s", "rym": null, "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Fantastic Planet is the third studio album by the American alternative rock band Failure. It was the last album released on Slash Records as distributed by Warner Bros. Records. The album failed to chart on Billboard's Top 200 albums, but did produce a charting single with \"Stuck on You\", which reached #23 on Billboard's Alternative Songs Chart. The album was produced by Failure themselves in a process that took longer than their previous two albums, with one song being recorded and produced soon after being written, and repeating this process. Space-rock themes course through the album's lyrics, as well as .", "desc_lfm_artist": "There are multiple artists under this name: \n\n(1) Failure is an alternative rock band from Los Angeles, USA, which was active from 1990 to 1997, and reunited in 2014. They are distinguished by their meticulous attention to textural sonic detail, inventive use of guitar effects and signal processing, and the overall expansive sound design of their later albums. \n\nMembers played in other bands after the initial breakup, including Year of the Rabbit", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "sdecandelario"]}, {"n": 172, "title": "Sublime", "artist": "Sublime", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8442-sublime_132249.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8442-sublime-sublime.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "0430d8c5-7417-3c4c-9f2a-b7d02ef7d164", "yt_id": "DwCLPPFn0Yc", "rym": "https://rateyourmusic.com/release/album/sublime/sublime", "genres": ["Punk"], "desc_lfm_album": "Sublime is the third and final album released by the band Sublime, on July 30, 1996, two months after frontman Bradley Nowell's death. The album was a major commercial success, going five times platinum in 1999 and etching Sublime into a permanent place among the stars of mid-90s alternative rock. Its most popular single, \"What I Got\", was an uncharacteristically poppy song; the bulk of the album was faithful to Sublime's ska, dub, and reggae influences, with tempos ranging from the frantic — such as \"Seed,\" \"Same in the End,\" and \"Paddle Out\" — to the slow and deliberate, such .", "desc_lfm_artist": "Sublime are an American reggae rock and ska punk band from Long Beach, California, formed in 1988. The band's line-up, unchanged until their initial breakup, consisted of Bradley Nowell (vocals and guitar), Eric Wilson (bass), and Bud Gaugh (drums). Lou Dog, Nowell's dalmatian, was the mascot of the band. Nowell died of a heroin overdose in 1996, resulting in Sublime's breakup. In 1997, songs such as \"What I Got\", \"Santeria\", \"Wrong Way\", \"Doin' Time\", and \"April 29, 1992 (Miami)\" were released to U.S. radio.", "desc_mb_album": "", "desc_mb_artist": "This is the band led by [https://musicbrainz.org/artist/354c7145-01f0-4bf6-b35f-6db936f6a17e|Bradley Nowell]. For the band led by [http://musicbrainz.org/artist/ad51ea4c-c1bd-4a4c-9361-ba1325e2ea30|Rome Ramirez] that likewise has [http://musicbrainz.org/artist/07d91070-1fc7-4ff6-9b23-1bfb20d9724a|Eric Wilson] and [http://musicbrainz.org/artist/0fa337f2-9f5e-44eb-b6eb-3286e6945c8f|Bud Gaugh] as members see [http://musicbrainz.org/artist/079f2e2b-b3f9-4574-ac5c-add977b40762|Sublime With Rome].", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 173, "title": "Unplugged", "artist": "Alice in Chains", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/35611-unplugged_160212.jpg", "aoty_url": "https://www.albumoftheyear.org/album/35611-alice-in-chains-unplugged.php", "aoty_critic_score": 50, "aoty_user_score": 90, "mbid": "fd9e039a-0a75-3b48-b7b5-66e66bd355fe", "yt_id": "35ExI0fwxUY", "rym": null, "genres": [], "desc_lfm_album": "Unplugged is a live album by the American grunge band Alice in Chains, released on July 30, 1996, by Columbia Records. It was recorded on April 10, 1996, at the Brooklyn Academy of Music's Majestic Theatre for the television series MTV Unplugged, in which the musicians perform songs on acoustic instruments. The recording was of the band's first concert since early 1994. In the interim, lead singer Layne Staley battled heroin addiction to the point the group was unable to perform live, leading them to temporarily disband. Nevertheless, the band persevered and released their self-titled third studio album in late .", "desc_lfm_artist": "Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style", "desc_mb_album": "", "desc_mb_artist": "Originally named ‘Diamond Lie’. Following the addition of Layne Staley, they were also periodically named ‘Mothra’ and ‘Fuck’ (amongst other names) until settling on ‘Alice in Chains’, after Staley’s [artist:5ec4ba3a-83b9-4623-9f63-8a1e3cfa1de5|old band].", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 174, "title": "Ridin’ Dirty", "artist": "UGK", "year": 1996, "cover": "https://dn710707.ca.archive.org/0/items/mbid-6aa8b9a2-19f2-4ca0-87a5-58167fb3d01b/mbid-6aa8b9a2-19f2-4ca0-87a5-58167fb3d01b-15186448605.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "d1935561-e375-317b-b49b-ddbc78c52603", "yt_id": "HAimO-FDFZA", "rym": null, "genres": ["hip hop", "gangsta rap", "hardcore hip hop", "dirty south", "southern hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "UGK (short for Underground Kingz) were a hip-hop duo from Port Arthur, Texas, USA. Formed in 1987 by long-time friends Chad “Pimp C” Butler and Bernard “Bun B” Freeman, they were highly respected by many of their peers, due in part to their longevity and their entrenchment in hip-hop’s underground.\n\nUGK, from Port Arthur, TX, the neighboring city to Beaumont, TX, released their debut EP The Southern Way in 1992. It was distributed by local record label Bigtyme Recordz and only available as an audio cassette.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave"]}, {"n": 175, "title": "Tidal", "artist": "Fiona Apple", "year": 1996, "cover": "https://dn710708.ca.archive.org/0/items/mbid-760df385-dc2f-4623-9d2e-22a133915e0a/mbid-760df385-dc2f-4623-9d2e-22a133915e0a-18626409610.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3801-fiona-apple-tidal.php", "aoty_critic_score": 76, "aoty_user_score": 86, "mbid": "82ba556e-99bf-380d-b9b5-5a97737f1cd1", "yt_id": "JccOpO-4z5k", "rym": "https://rateyourmusic.com/release/album/fiona-apple/tidal", "genres": ["alternative rock", "pop rock", "baroque pop", "indie rock", "soft rock", "alternative pop"], "desc_lfm_album": "Tidal is the debut studio album by American singer-songwriter Fiona Apple, released in the United States on July 23, 1996, by Work Records and Columbia Records (Sony Music). According to Nielsen SoundScan, it was certified 3x platinum by the RIAA in December 1997. Tidal produced six singles: \"Shadowboxer\", \"Slow Like Honey\", \"Sleep to Dream\", \"The First Taste\", \"Criminal\" and \"Never Is a Promise\". \"Criminal\", the album's most popular single, won a 1998 Grammy Award for \"Best Female Rock Vocal Performance\" and was named the single of 1997 in a poll of Rolling Stone readers. \"When I did Tidal,\" Apple said .", "desc_lfm_artist": "Fiona Apple McAfee-Maggart (born September 13, 1977) is an American singer-songwriter. She is known for her songwriting and has released five albums between 1996 and 2020, all of which reached the top 20 on the U.S. Billboard 200 chart. As of 2021, she has sold over 15 million records worldwide. Apple has received several awards, including three Grammy Awards, two MTV Video Music Awards, and a Billboard Music Video Award.\n\nApple is the youngest daughter of actor Brandon Maggart and was born in New York City.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Rocky_stereo"]}, {"n": 176, "title": "None So Vile", "artist": "Cryptopsy", "year": 1996, "cover": "https://i.discogs.com/LfumejGJ6qaeWh5k8gwNGJvtYi2738HIiulQMCAJEZw/rs:fit/g:sm/q:90/h:500/w:500/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTE0MzAz/MzAtMTMyNTA5Mzg1/Ni5qcGVn.jpeg", "aoty_url": "https://www.albumoftheyear.org/album/53819-cryptopsy-none-so-vile.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "b8ca6f8f-a5bc-306b-88e1-4f176eb0a0ea", "yt_id": "j_vF1Wptvbw", "rym": "https://rateyourmusic.com/release/album/cryptopsy/none-so-vile/", "genres": ["Metal"], "desc_lfm_album": "None So Vile is the second album by Cryptopsy, released on the now defunct Wrong Again Records. The album was later re-issued by Displeased Records and Century Media Records. The album now has a considerable reputation within the death metal genre, many credit it with revitalizing the genre during the mid-90s and adding an unprecedented influence on the technical death metal and brutal death metal subgenres. It is the first album to feature bassist Eric Langois and the last album to feature vocalist Lord Worm, until his return on 2005's Once Was Not. The cover artwork is a painting of .", "desc_lfm_artist": "Originating from the Montreal area, this group first appeared in 1992, when it was called Necrosis; in the same year it was reincarnated under the name of Cryptopsy. With just a demo called Ungentle Exhumation and then the album Blasphemy Made Flesh (1994), the group acquired a solid reputation on the international scene. Their release of None So Vile in 1996 was the first burst of brilliance in their career. From that point the group clearly outclassed other groups by reinventing the style, today categorized as extreme music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 177, "title": "It Was Written", "artist": "Nas", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7981-it-was-written_193954.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7981-nas-it-was-written.php", "aoty_critic_score": 70, "aoty_user_score": 85, "mbid": "f4dde59b-9a1d-3e74-9dee-c734435d9ea0", "yt_id": "00p2EAUbdH4", "rym": "https://rateyourmusic.com/release/album/nas/it-was-written", "genres": [], "desc_lfm_album": "It Was Written is the second studio album by American rapper Nas, released July 2, 1996 on Columbia Records in the United States. Following the moderate sales success of his acclaimed debut album, Illmatic (1994), Nas chose to focus his efforts in a more mainstream direction. Primarily produced by Trackmasters, it is a departure for him from the raw, underground tone of his debut album towards a more polished, mainstream sound. The album features mafioso and gangsta themes, and marks the first appearance of Nas's short-lived supergroup The Firm, which included rappers Foxy Brown, AZ, and Cormega. The album proved .", "desc_lfm_artist": "Nasir bin Olu Dara Jones, more commonly known as Nas (formerly Nasty Nas and Escobar), born September 14, 1973 in Crown Heights, Brooklyn, New York, is a prominent American MC. The son of jazz musician Olu Dara, he was raised in the infamous Queensbridge housing projects in Queensbridge, New York. According to the Nasty Songfacts, as a teenager rapper, Nasir  first went by the nickname Kid Wave before adopting his more commonly known alias of Nasty Nas.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 178, "title": "Stakes Is High", "artist": "De La Soul", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/17007-stakes-is-high-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/17007-de-la-soul-stakes-is-high.php", "aoty_critic_score": 71, "aoty_user_score": 87, "mbid": "77ee68c1-d0bc-3315-a296-a3cee977d1e3", "yt_id": "P6fng8uHtBw", "rym": "https://rateyourmusic.com/release/album/de-la-soul/stakes-is-high", "genres": [], "desc_lfm_album": "Stakes Is High is De La Soul's fourth full-length album, released on July 2, 1996. The album marked a change in the group's sound and direction as it was their first release not to be produced in collaboration with Prince Paul. Stakes Is High was mainly produced by the group themselves with additional tracks provided by Jay Dee, DJ Ogee, Spearhead X and Skeff Anslem. It is considered to be the group's darkest and most serious album in terms of subject matter and production. .", "desc_lfm_artist": "De La Soul is an American hip-hop group formed in 1988 in the Amityville area of Long Island, New York. They are best known for their eclectic sampling, quirky lyrics, and their contributions to the evolution of the jazz rap and alternative hip-hop subgenres. The members are Posdnuos, Maseo, and Trugoy (until his death in 2023). The three formed the group in high school and caught the attention of producer Prince Paul with a demo tape of the song \"Plug Tunin'\".", "desc_mb_album": "", "desc_mb_artist": "Please don’t add the album [http://musicbrainz.org/release-group/4aebff62-baae-4017-a9e4-12cbbc4ecc7b|“First Serve”] here. It is already there with the correct Artist [http://musicbrainz.org/artist/a904f60a-b8d2-4ed5-90b5-569bf28d1a80|“First Serve”].", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "verygooood"]}, {"n": 179, "title": "Sons of 1973", "artist": "Satellite Lovers", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/987434-sons-of-1973_015153.jpg", "aoty_url": "https://www.albumoftheyear.org/album/987434-satellite-lovers-sons-of-1973.php", "aoty_critic_score": 81, "aoty_user_score": null, "mbid": "87f10e0d-1902-4e6b-9357-c53cce01e60c", "yt_id": "zlKuWanrsDg", "rym": null, "genres": [], "desc_lfm_album": "Sons of 1973 is the second album by Satellite Lovers, a Japanese trio active in the mid-1990s and associated with the Shibuya-kei and free soul/rare groove scenes. Released in 1996 and rediscovered decades later through YouTube, the album blends influences from early 1970s soul, jazz-fusion, and city pop. The group, originally a six-piece led by Mica Ikeuchi, had slimmed to a trio for this record, featuring Hiroyuki Suzuki and Yutaka Nakano. Despite its infectious, breezy sound and recent surge in online popularity, the album was initially overlooked outside Japan, leading to the band’s quiet dissolution after a brief discography spanning .", "desc_lfm_artist": "Satellite Lovers (サテライト・ラヴァーズ) was a Japanese pop music group active from 1994 to 1996. They were known for their blend of Shibuya-kei, free soul, and rare groove influences.\n\nMembers\nMica Ikeuchi (池内美加) - vocals, guitar\nHiroyuki Suzuki (鈴木洋之) - guitar\nYutaka Nakano (中野豊) - guitar, bass\nTsukasa Ogata (緒方司) - drums, percussion\nYasushi Kashiwakura (柏倉隆史) - bass\nShinichiro Takahashi (高橋慎一郎) - turntable (credited on the album MUSIC)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 180, "title": "Reasonable Doubt", "artist": "Jaÿ‐Z", "year": 1996, "cover": "https://ia801305.us.archive.org/20/items/mbid-37c0a6b5-f723-4e70-92b8-805a569bc436/mbid-37c0a6b5-f723-4e70-92b8-805a569bc436-28645054139.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a7f852ba-08bc-36f1-92f3-4dc127f4b70a", "yt_id": "43xgss3nZ9M", "rym": null, "genres": ["hip hop", "jazz rap", "east coast hip hop", "boom bap", "gangsta rap"], "desc_lfm_album": "\"Reasonable Doubt\" is the first studio album by American rapper Jay-Z. It was released on June 25, 1996 on Roc-A-Fella/Priority Records in the United States and on Northwestside Records in the United Kingdom. Reasonable Doubt received strong critical reviews and has been heralded as Jay-Z's \"crowning achievement\", a seminal work and an undisputed classic. Reasonable Doubt received a \"4 Mics\" rating from The Source and five stars from Allmusic, the highest ratings issued by AMG. The Source ranks it among the top 100 albums of all time, Blender ranks it as one of the 500 best albums of all time, .", "desc_lfm_artist": "", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 181, "title": "Odelay", "artist": "Beck", "year": 1996, "cover": "https://dn710302.ca.archive.org/0/items/mbid-804b7f78-0bbc-3479-887a-ab28390357d4/mbid-804b7f78-0bbc-3479-887a-ab28390357d4-4507123240.jpg", "aoty_url": "https://www.albumoftheyear.org/album/593-beck-odelay.php", "aoty_critic_score": 92, "aoty_user_score": 82, "mbid": "df0bfd42-78a9-40c3-a45f-a12e10d446f8", "yt_id": "RQ6EnfFGDiM", "rym": "https://rateyourmusic.com/release/album/beck/odelay", "genres": ["alternative rock", "contemporary folk", "indie rock", "neo-psychedelia", "hip hop", "alternative country"], "desc_lfm_album": "Odelay is the second major-label studio album (and fourth album overall) recorded by alternative rock artist Beck, originally released June 18, 1996. It was produced by the Dust Brothers. After the mainstream success of \"Loser\", Odelay featured several hit singles, including \"Where It's At\", \"Devils Haircut,\" and \"The New Pollution.\" The album peaked at #16 on the Billboard 200 chart and eventually sold over 2 million copies in the United States. It was also Beck's first hit album in the United Kingdom, making #17; it has since gone platinum in the UK. On January 29, 2008, Odelay was reissued as .", "desc_lfm_artist": "Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 182, "title": "Die Tür ist zu", "artist": "Swans", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/69732-die-tr-ist-zu-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/69732-swans-die-tur-ist-zu.php", "aoty_critic_score": 57, "aoty_user_score": 81, "mbid": "d7089b2f-5e80-3090-83d1-b7d53eda1178", "yt_id": "1mbL1iuGVXk", "rym": null, "genres": [], "desc_lfm_album": "Die Tür ist zu (German for The Door Is Closed) is an EP by American post rock band Swans, released in 1996 only in Germany. It contains early, German-language versions of two songs on the then unreleased Soundtracks for the Blind album, two studio outtakes (\"Surrogate Drones\" which would also appear later on Soundtracks for the Blind, and \"You Know Everything (reprise 1991)\" recorded for White Light From the Mouth of Infinity and already released on the \"Celebrity Lifestyle\" CD single), a radio performance excerpt from the VPRO session on December 14, 1994, and two live songs from the Astoria, .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 183, "title": "Sing to God", "artist": "Cardiacs", "year": 1996, "cover": "https://dn711203.ca.archive.org/0/items/mbid-80772eda-3097-34c2-87a4-78ad9ae87edb/mbid-80772eda-3097-34c2-87a4-78ad9ae87edb-19153390465.jpg", "aoty_url": "https://www.albumoftheyear.org/album/80752-cardiacs-sing-to-god.php", "aoty_critic_score": 88, "aoty_user_score": 82, "mbid": "2e989525-c800-32f4-9fb0-f30fa74efd23", "yt_id": "ax9yT3t1jSI", "rym": "https://rateyourmusic.com/release/album/cardiacs/sing-to-god", "genres": ["experimental rock", "avant-prog", "alternative rock", "art rock", "progressive rock", "art punk"], "desc_lfm_album": "Sing to God is the fourth studio album by English rock band Cardiacs. Their first album with drummer Bob Leith and their second as a four-piece, it was recorded throughout 1995, breaking a hiatus by the band that had lasted since the band's previous album Heaven Born and Ever Bright (1992). During writing and recording, Jon Poole took a greater role than before, contributing to many songs written by band leader Tim Smith, and writing some of his own. The band decided to create a double album to encompass the great wealth of material written after their previous album. As .", "desc_lfm_artist": "Cardiacs, originally called Cardiac Arrest, were an English band formed in 1977 and led by Tim Smith (1961-2020). Noted for their complex, varied and intense compositional style and for their eccentric, theatrical stage shows, they have been hailed as an influence by many newer groups and artists.\n\nAs well as Smith, around 23 musicians were part of the Cardiacs over the years, including Smith's brother, Jim, and multi-instrumentalist, Sarah Cutts, who married Tim Smith in 1983.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84"]}, {"n": 184, "title": "Tigermilk", "artist": "Belle and Sebastian", "year": 1996, "cover": "https://dn710909.ca.archive.org/0/items/mbid-ae871d82-4914-4338-b2db-f91d723f9b18/mbid-ae871d82-4914-4338-b2db-f91d723f9b18-6748490069.png", "aoty_url": "https://www.albumoftheyear.org/album/9399-belle-sebastian-tigermilk.php", "aoty_critic_score": 81, "aoty_user_score": 80, "mbid": "a36f3183-e862-3829-a4eb-b924264c76b6", "yt_id": "soMbZ7eLKlM", "rym": "https://rateyourmusic.com/release/album/belle-and-sebastian/tigermilk", "genres": ["chamber pop", "indie rock", "indie pop", "twee pop", "Alternative Rock"], "desc_lfm_album": "Tigermilk is the 1996 debut album from Scottish pop group Belle & Sebastian. Originally given a limited release (1,000 copies) by Electric Honey, the album was subsequently re-released in 1999 by Jeepster Records. The cover photograph was taken by Stuart Murdoch, and features Joanne Kenney - the same model who appeared on the cover of the Dog on Wheels EP. The album is named after a song that didn't end up making the cut – an instrumental that was later performed numerous times on Belle & Sebastian's early tours. All of the songs on the album were written by Stuart .", "desc_lfm_artist": "Belle and Sebastian are a Scottish indie pop band that formed in 1994 in Glasgow, Scotland. Led by guitarist/vocalist Stuart Murdoch, the seven-piece band have an intimate, majestic sound that is equal parts folk-rock and '60s pop. Murdoch has a gift not only for whimsy and surrealism, but also for odd, unsettling lyrical detail which keeps the songs grounded in a tangible reality. \n\nBelle and Sebastian released their first two albums in 1996: Tigermilk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 185, "title": "Feed Me Weird Things", "artist": "Squarepusher", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9345-feed-me-weird-things.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9345-squarepusher-feed-me-weird-things.php", "aoty_critic_score": 75, "aoty_user_score": 81, "mbid": "9d1fe9fa-9e76-3ce0-a845-83431033a160", "yt_id": "RJ6VFCUC6Vs", "rym": "https://rateyourmusic.com/release/album/squarepusher/feed-me-weird-things", "genres": ["Electronic"], "desc_lfm_album": "Feed Me Weird Things is the debut studio album by Squarepusher. It was released on Rephlex Records in 1996. A remastered 25th anniversary edition was released in 2021 on Warp Records -Released: 3 June 1996 (Remaster: 3 June 2021) -Genre: Drill 'n' Bass, Intelligent Dance Music, Jungle, Jazz Fusion -Length: 66:43 (Remaster: 76:17) -Label: Rephlex (Remaster: Warp) -Producer: Tom Jenkinson .", "desc_lfm_artist": "Squarepusher is a pseudonym of Chelmsford, Essex, England, electronic musician Tom Jenkinson (b. 1975), best known for his experimental drum and bass, with a heavy jazz fusion influence.  A skilled bassist and multi-instrumentalist, Jenkinson's virtuoso playing is a staple of his music and one of the more obvious affiliations with jazz (although his formal arrangements are often as jazz-derived as his playing). His bass style includes melodic fretless playing, high-speed slap bass and intricate chordal work.", "desc_mb_album": "", "desc_mb_artist": "Do not add releases by band Shobaleader One here. See [artist:943b27df-7d31-4fd7-82c9-99d6b6ef34b3|this] page.", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 186, "title": "浮躁 [Fúzào]", "artist": "王菲 [Faye Wong]", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/62714-fuzao.jpg", "aoty_url": "https://www.albumoftheyear.org/album/62714--faye-wong--fzo.php", "aoty_critic_score": 83, "aoty_user_score": 83, "mbid": null, "yt_id": "eg2PueVRcvU", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 187, "title": "革命京劇 Ver.1.28 [Revolutionary Pekinese Opera Ver.1.28]", "artist": "Ground-Zero", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/61744-revolutionary-pekinese-opera-version-128-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/61744-ground-zero--ver128-revolutionary-pekinese-opera-ver128.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": null, "yt_id": "C1lD5FdP7SE", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ground-Zero was an improvised experimental noise rock band during the 1990s led by Otomo Yoshihide (大友良英) that had a large and rotating group of performers on such instruments as turntables, sampler, shamisen, saxophone, koto, omnichord, electric guitar and two drum kits. They are most highly regarded for their album Consume Red, on which the performers improvise around a short sample of hojok music played by Korean holy musician Kim Seok Chul.\n\nCheck also Ground Zero.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 188, "title": "Walking Wounded", "artist": "Everything But the Girl", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/23447-walking-wounded.jpg", "aoty_url": "https://www.albumoftheyear.org/album/23447-everything-but-the-girl-walking-wounded.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "6cd35b85-b970-3985-8eb8-f1e94ab36fb1", "yt_id": "J2gHxIYu1a8", "rym": null, "genres": [], "desc_lfm_album": "Walking Wounded is the ninth studio album by Everything but the Girl, released on May 6, 1996, via Atlantic and Virgin Records. Drawing from downtempo, drum and bass, and trip hop, the album compressed these genres into a pop format. Ben Watt produced instrumental tracks, incorporating samples from artists like Tim Buckley and Stan Tracey, while Tracey Thorn wrote lyrics after the tracks were completed. This approach reflected a refinement of their earlier sound, combining Thorn's soft vocals with urban beats to create a distinctive contrast. .", "desc_lfm_artist": "Everything But the Girl (EBTG), are a Hull, Yorkshire, UK, sophisti-pop / Downtempo duo of Ben Watt and Tracey Thorn.  They débuted with a single for a Cole Porter cover, Night And Day (Mar 1982, Cherry Red).\n\nBen met Tracey when they were at Hull University and she was singing in pop girl-band Marine Girls.  Ben contributed a photograph, for a forthcoming album cover, after which, the pair became partners (later getting married).  They formed Everything But the Girl in 1982", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "paqueradejere"]}, {"n": 189, "title": "1996", "artist": "坂本龍一 [Ryuichi Sakamoto]", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/85483-1996.jpg", "aoty_url": "https://www.albumoftheyear.org/album/85483--ryuichi-sakamoto-1996.php", "aoty_critic_score": 60, "aoty_user_score": 85, "mbid": null, "yt_id": "YAMuSDsg83o", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "verygooood"]}, {"n": 190, "title": "The Great Southern Trendkill", "artist": "Pantera", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6980-the-great-southern-trendkill_212021.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6980-pantera-the-great-southern-trendkill.php", "aoty_critic_score": 59, "aoty_user_score": 83, "mbid": "75a041d3-1fa8-3082-bf4a-ad65416c4624", "yt_id": "3W0Gh-rFg70", "rym": "https://rateyourmusic.com/release/album/pantera/the-great-southern-trendkill", "genres": [], "desc_lfm_album": "The Great Southern Trendkill is the eighth studio album by Pantera. It was released in May, 1996 through East West Records. It reached #4 on the Billboard Top 200 chart. The Great Southern Trendkill features some of the fastest tempos and most down-tuned guitars that the band ever recorded. It also has a more experimental nature to its songs, such as the acoustic guitar and keyboard-laden \"Suicide Note Pt. I\".Unlike Pantera's first three major label albums, the vocals are often double tracked and layered to create a more \"demonic\" effect. An example of this can be heard in the chorus .", "desc_lfm_artist": "Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84"]}, {"n": 191, "title": "In Sides", "artist": "Orbital", "year": 1996, "cover": "https://dn710302.ca.archive.org/0/items/mbid-e7170832-d2d7-4f4b-802c-34e9c13da59b/mbid-e7170832-d2d7-4f4b-802c-34e9c13da59b-33883938491.jpg", "aoty_url": "https://www.albumoftheyear.org/album/16098-orbital-in-sides.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "5b2338ad-afbb-3046-ba00-32b395fe2d17", "yt_id": "K7E2Q0vBK0c", "rym": "https://rateyourmusic.com/release/album/orbital/in-sides", "genres": ["electronica", "trance", "techno", "breakbeat", "Electronic"], "desc_lfm_album": "In Sides is the fourth album recorded by Orbital, released in 1996. The name is a reference to the fact that the album was originally available as a 3-LP vinyl box set, with one track per \"side\" of each LP. \"The Girl with the Sun in Her Head\" was dedicated to the memory of Volume magazine photographer Sally Harding who died in 1995. The track was recorded using electricity from a Greenpeace solar power generator. It opens with the sound of a heartbeat which serves as bass and develops into a cyclopean soundscape which many critics hold as one of .", "desc_lfm_artist": "Orbital is an electronic music duo consisting of brothers Phil Hartnoll and Paul Hartnoll formed in Sevenoaks, Kent, England in 1989.  Orbital take their name from Greater London's orbital motorway, the M25, which was central to the early rave scene and party network in the South East during the early days of acid house. One of the biggest names in British electronica during the 1990s, Orbital were both critically and commercially successful, being particularly known for an element of live improvisation during their shows", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 192, "title": "Through Silver In Blood", "artist": "Neurosis", "year": 1996, "cover": "https://dn710704.ca.archive.org/0/items/mbid-867a9c66-d738-3857-b967-62b9367970fc/mbid-867a9c66-d738-3857-b967-62b9367970fc-7697193187.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "fb27225e-e66e-37ea-bc2c-9b7352f1e81f", "yt_id": "sjGZ2bpQxkY", "rym": null, "genres": ["doom metal", "atmospheric sludge metal", "post-metal", "sludge metal", "dark ambient", "rock"], "desc_lfm_album": "\"Through Silver in Blood\" is the fifth album from the California-based post-metal band Neurosis. The album was released on April 23, 1996, and was their first record to be released through Relapse Records. The album was reissued in July 2009 on the band's own label, Neurot Recordings. Since its release, \"Through Silver in Blood\" has been recognized not only as the band's critical and popular peak, but as one of the sources of post-metal and as one of the best metal albums of all time. The album was recorded in December 1995 at Brilliant Studios and Coast Studios in Oakland, .", "desc_lfm_artist": "1) Neurosis was a post-metal band based in Oakland, CA, United States. Their unique sound draws influences from sludge, progressive metal, hardcore punk, tribal and even ambient and industrial music. They are often considered as pioneers of post-metal. To date, the band have released eleven full-length studio albums as well as a number of live albums, split records, and EPs.\n\nIn late 1985, Scott Kelly, Dave Edwardson and Jason Roeder (formerly members of Violent Coercion) founded the band as a hardcore outfit, borrowing from British crust punk.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Nubis84", "sdecandelario"]}, {"n": 193, "title": "This Is A Long Drive", "artist": "Modest Mouse", "year": 1996, "cover": "https://ia601304.us.archive.org/33/items/mbid-cddfbb16-95ba-4eef-8468-29d0128bdc93/mbid-cddfbb16-95ba-4eef-8468-29d0128bdc93-21562810344.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "b73c10e9-4237-3fa6-9e3e-fe148455d3a4", "yt_id": "VNOj6HGlX6s", "rym": null, "genres": ["indie rock", "emo", "alternative punk"], "desc_lfm_album": "", "desc_lfm_artist": "Modest Mouse is an American alternative rock band which formed in 1993 in Issaquah, Washington, United States. The band's original lineup consisted of guitarist Isaac Brock, drummer Jeremiah Green and bassist Eric Judy. Since being signed to Sony's Epic Records in 2000, Modest Mouse has attained significant popular success with songs such as \"Float On\" and \"Dashboard.\"\n\nThe band's current configuration is Isaac Brock (vocals, guitar), Tom Peloso (strings, horns, bass, keyboards), Jim Fairchild (guitar), and Eric Judy (bass)).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "armandwave"]}, {"n": 194, "title": "Evil Empire", "artist": "Rage Against the Machine", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7140-evil-empire_165312.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7140-rage-against-the-machine-evil-empire.php", "aoty_critic_score": 72, "aoty_user_score": 85, "mbid": "1b469da1-e542-346b-84e6-4d7fe45be181", "yt_id": "qqAwgVAUGgE", "rym": "https://rateyourmusic.com/release/album/rage-against-the-machine/evil-empire", "genres": [], "desc_lfm_album": "\"Evil Empire\" is the second album by Rage Against the Machine. Released on April 16, 1996, almost four years after the band's first, self-titled album named Rage Against the Machine. The album's title is taken from the phrase \"Evil Empire\", which was used by former U.S. President Ronald Reagan and many Western conservatives in describing the former Soviet Union. The track \"Bulls on Parade\" became the first single and, as with their debut, five singles were released in total. \"Evil Empire\" debuted at #1 on the Billboard 200. The song \"Tire Me\" won the 1996 Grammy award for Best Metal .", "desc_lfm_artist": "Rage Against the Machine was an American rock band from Los Angeles, California. Formed in 1991, the group consisted of vocalist Zack de la Rocha, bassist and backing vocalist Tim Commerford, guitarist Tom Morello, and drummer Brad Wilk. Their songs express revolutionary left-wing political views. As of 2010, they had sold over 16 million records worldwide. In 2023, the band was inducted into the Rock and Roll Hall of Fame.\n\nRage Against the Machine released its eponymous debut album in 1992 to commercial and critical success", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "Nubis84", "alberto_gu", "sdecandelario"]}, {"n": 195, "title": "Repetition", "artist": "Unwound", "year": 1996, "cover": "https://dn710103.ca.archive.org/0/items/mbid-3af9fdd9-0f7d-41fb-86ea-de388eb18a04/mbid-3af9fdd9-0f7d-41fb-86ea-de388eb18a04-27704596213.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22863-unwound-repetition.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "86cc195d-3e67-3418-9bfa-9905206765a2", "yt_id": "xAERndXV0yw", "rym": "https://rateyourmusic.com/release/album/unwound/repetition", "genres": ["noise rock", "post-punk", "punk rock", "hardcore punk", "post-hardcore", "Rock"], "desc_lfm_album": "Repetition is the fifth studio album by the American post-hardcore band Unwound, released on April 9, 1996 by Kill Rock Stars. It was recorded in January 1996 at John and Stu's Place in Seattle, Washington and produced by Steve Fisk and John Goodmanson. The album received positive reviews from critics. Repetition was recorded in January 1996 at John and Stu's Place in Seattle, Washington and produced by Steve Fisk and John Goodmanson. The band sought a more \"studio-oriented\" approach than their previous albums and experimented new sounds with keyboards. The word \"Repetition\" was chosen as the album's title because, according .", "desc_lfm_artist": "Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 196, "title": "Maxwell’s Urban Hang Suite", "artist": "Maxwell", "year": 1996, "cover": "https://dn711109.ca.archive.org/0/items/mbid-e69dbabd-5a61-4147-914b-7e683f096cbc/mbid-e69dbabd-5a61-4147-914b-7e683f096cbc-15210098631.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e8d49b88-b411-35f9-9e34-4370a9708ef2", "yt_id": "4avT0Z46UAg", "rym": null, "genres": ["soul", "contemporary r&b", "neo soul"], "desc_lfm_album": "", "desc_lfm_artist": "Maxwell (born in Brooklyn, New York on May 23, 1973) is a Grammy Award Winning American R&B artist. He was enormously important in defining and shaping the soul sub-genre, neo-soul, over the latter half of the '90s. He recorded some of the most ambitious R&B of his time, becoming wildly popular and often earning critical raves in the process. What was more, his recurring theme of romantic monogamy set him apart from the vast majority of his bump'n'grind lover-man contemporaries.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 197, "title": "Crimson", "artist": "Edge Of Sanity", "year": 1996, "cover": "https://ia803400.us.archive.org/30/items/mbid-5a2905c1-90b1-4e1d-9aa8-f9e24cd9601b/mbid-5a2905c1-90b1-4e1d-9aa8-f9e24cd9601b-14627283366.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "11b01ea3-97ac-3bfe-b933-e80105d599ed", "yt_id": "iPQjgt9D8vg", "rym": null, "genres": ["heavy metal", "death metal", "melodic death metal"], "desc_lfm_album": "Crimson is the fifth full-length studio album by the Swedish death metal band Edge of Sanity, which is their first concept album and was released in 1996 by Black Mark Productions. It features a single 40-minute track, telling a story in the distant future, when human civilization is about to end. The album tells the story of a world where humans no longer can beget children. Into this time of despair a child is born to the King and Queen of the barren Earth. The Queen dies in the childbirth, and the King is left to rule the Earth and .", "desc_lfm_artist": "Edge of Sanity was a Swedish death metal band whose work often delved into experimental territory shifting from traditional death metal to melodic and progressive death metal. Edge of Sanity are regarded alongside Opeth as being the first to fuse extreme metal styles like death and black metal with genuine progressive rock.\n\nHaving formed in 1989 in Finspång, Sweden, Edge of Sanity asserted themselves as a solid death-metal outfit with their debut release \"Nothing But Death Remains\"", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "sdecandelario"]}, {"n": 198, "title": "Emperor Tomato Ketchup", "artist": "Stereolab", "year": 1996, "cover": "https://ia800301.us.archive.org/13/items/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de-24086681893.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4020-stereolab-emperor-tomato-ketchup.php", "aoty_critic_score": 88, "aoty_user_score": 83, "mbid": "1c51069d-4c59-4ddf-bd12-dacefada37c3", "yt_id": "GLYu0allKgs", "rym": "https://rateyourmusic.com/release/album/stereolab/emperor-tomato-ketchup", "genres": ["experimental rock", "art pop", "indie rock", "post-rock", "indie pop", "indietronica"], "desc_lfm_album": "Emperor Tomato Ketchup is the fourth studio album by English-French rock band Stereolab. It was released on 18 March 1996 and was issued by Duophonic Records and Elektra Records. The album is named after the 1971 experimental film Emperor Tomato Ketchup by Japanese author and director Shūji Terayama. Emperor Tomato Ketchup was released on 18 March 1996 in the United Kingdom by Duophonic Records, and on 9 April 1996 in the United States by Elektra Records. The artwork for the album was inspired by the LP cover sleeve of a 1964 recording of composer Béla Bartók's Concerto for Orchestra by .", "desc_lfm_artist": "Stereolab is an Anglo-French avant-pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 199, "title": "Static Age", "artist": "Misfits", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19974-static-age_145402.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19974-misfits-static-age.php", "aoty_critic_score": 85, "aoty_user_score": 84, "mbid": "3830954a-ffaf-3bde-b92f-93d8976d7876", "yt_id": "Zi4xKBfL3hY", "rym": null, "genres": ["Metal", "Punk"], "desc_lfm_album": "Static Age is an album by the American horror punk band the Misfits. It was recorded in 1978 but was not released in its entirety until 1997. .", "desc_lfm_artist": "The Misfits are an American punk rock band formed in Lodi, New Jersey in 1977. Often recognized as the progenitors of the horror punk subgenre, blending punk and other musical influences with horror film themes and imagery. The group was founded in 1977 in Lodi, New Jersey, by vocalist, songwriter and keyboardist Glenn Danzig, and drummer Manny Martínez. Jerry Only joined on bass guitar shortly after. Over the next six years, membership would change frequently with Danzig and Only the only consistent members.", "desc_mb_album": "", "desc_mb_artist": "Not to be confused with the original name used by the all girl punk-rockers, \"The Go-Go's\".", "heard_by": ["Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 200, "title": "All Eyez on Me", "artist": "2Pac", "year": 1996, "cover": "https://ia800602.us.archive.org/27/items/mbid-ecb3560e-c8e1-4936-afae-b456b45f331c/mbid-ecb3560e-c8e1-4936-afae-b456b45f331c-42235530841.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5767-2pac-all-eyez-on-me.php", "aoty_critic_score": 73, "aoty_user_score": 84, "mbid": "e2621417-9236-36b4-9f9e-376c416dc4b0", "yt_id": "pDTFR7ivvgE", "rym": "https://rateyourmusic.com/release/album/2pac/all-eyez-on-me/", "genres": ["hip hop", "pop rap", "west coast hip hop", "g-funk", "gangsta rap", "Hip-Hop"], "desc_lfm_album": "All Eyez on Me is the fourth studio album by American rapper 2Pac and the last to be released during his lifetime. Released on February 13, 1996, by Death Row Records and Interscope Record, All Eyez on Me features guest appearances from several artists including The Outlawz, Dr. Dre, Snoop Dogg, George Clinton, E-40, Redman, Method Man, Tha Dogg Pound, K-Ci & JoJo, Roger Troutman, among others. The album features productions by Shakur alongside a variety of producers, including DJ Quik, Johnny \"J\", Dr. Dre, Rick Rock, Daz Dillinger, DJ Pooh, DeVante Swing, among others. The album includes the Billboard .", "desc_lfm_artist": "Tupac Amaru Shakur (born Lesane Parish Crooks; June 16, 1971 – September 13, 1996), known professionally as 2Pac and later as Makaveli, was an American rapper and actor. He is regarded as one of the most influential and successful rappers of all time and as a prominent political and cultural figure in late 20th-century America. Shakur sold more than 75 million records worldwide, making him one of the best-selling music artists in history. His work often addressed themes of social injustice", "desc_mb_album": "", "desc_mb_artist": "Please '''don't add''' the releases '''''Thug Life, Volume I''''' or '''''The Don Killuminati: The 7 Day Theory''''' to this artist entry:\n    * ''[http://musicbrainz.org/release-group/6d810afd-b059-31ca-b3e2-6c7e2a7d6efd.html|Thug Life, Volume I]'' is already filed under the correct artist, '''[http://musicbrainz.org/artist/703f9c8c-32c8-482a-900d-a12fd8f20360.html|Thug Life]'''.\n    * ''[http://musicbrainz.org/release-group/5782e30e-fd08-349d-8a22-bbe8c5d7ffec.html|The Don Killuminati: The 7 Day Theory]'' and its singles should be credited to '''[http://musicbrainz.org/artist/e263a1d8-8228-4ede-9e17-7acf8470165a.html|Makaveli]''' and are the only official releases that should be filed there.", "heard_by": ["Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 201, "title": "The Score", "artist": "Fugees (Refugee Camp)", "year": 1996, "cover": "https://dn710607.ca.archive.org/0/items/mbid-13027e7b-340c-4478-8dda-df5fa4af3564/mbid-13027e7b-340c-4478-8dda-df5fa4af3564-34355828522.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "dd2203dd-a149-316b-ad7f-a303dc4fc459", "yt_id": "bSzUHD7367A", "rym": "https://rateyourmusic.com/release/album/fugees/the-score-3", "genres": ["contemporary r&b", "alternative hip hop", "hip hop", "east coast hip hop", "conscious hip hop", "boom bap"], "desc_lfm_album": "The Score is the second and final studio album by the hip hop trio Fugees, released worldwide February 13, 1996 on Columbia Records. The album features a wide range of samples and instrumentation, with many aspects of alternative hip hop that would come to dominate the hip hop music scene in the mid-late 1990s. The Score's production was handled mostly by the Fugees themselves and Jerry Duplessis, with additional production from Salaam Remi, John Forté, Shawn King, and Diamond D. The album's guest raps are from Outsidaz' members Rah Digga, Young Zee and Pacewon, as well as Omega, John Forté, .", "desc_lfm_artist": "", "desc_mb_album": "on the album packaging, \"Ready or Not\" is explicitly stated as containing a repeated sample from \"Ready or Not Here I Come (Can't Hide From Love)\" by  The Delphonics.\r\nit also includes a repeated slowed-down sample of \"Boadicea\" by Enya, though this is only mentioned in their '''''[http://www.discogs.com/viewimages?release=742020|Ready or Not]''''' single, but not in this album ('''[http://www.discogs.com/viewimages?release=227673|example]''').", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 202, "title": "Murder Ballads", "artist": "Nick Cave and the Bad Seeds", "year": 1996, "cover": "https://dn710702.ca.archive.org/0/items/mbid-5acd27fb-96ad-3316-85c2-05c955d35f28/mbid-5acd27fb-96ad-3316-85c2-05c955d35f28-19758872108.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "4030ac23-b953-33ee-9f31-35e9f3febf86", "yt_id": "77oXG0VNghU", "rym": "https://rateyourmusic.com/release/album/nick-cave-and-the-bad-seeds/murder-ballads-9", "genres": ["blues rock", "folk rock", "alternative rock", "post-punk", "gothic rock"], "desc_lfm_album": "", "desc_lfm_artist": "Nick Cave and the Bad Seeds were formed in 1983 in West Berlin, Germany by two former members of the Australian band The Birthday Party: Nick Cave (vocals, songwriter, keyboards, harmonica) and multi-instrumentalist Mick Harvey. The duo were joined by Einstürzende Neubauten member Blixa Bargeld (guitar), Hugo Race (guitar), and former Magazine member Barry Adamson (bass, piano). Cave's then girlfriend Anita Lane was also a creative influence and occasional lyricist.", "desc_mb_album": "", "desc_mb_artist": "Some releases are credited to \"Nick Cave & the Bad Seeds\" others are \"Nick Cave and the Bad Seeds.\" This is intentional on the part of the editors and matches the various releases. If you need to group them or normalize them in your own collection, use the %albumartistsort% variable (or something like \"$if2(%albumartistsort%,%albumartist%,%artistsort%,%artist%)\") in your tagger.\r\n\r\nDo not make arbitrary edits to the artist credits unless you can prove that your edit matches the release.", "heard_by": []}, {"n": 203, "title": "空中キャンプ [Kūchū Camp]", "artist": "Fishmans", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/61244--kch-camp_015351.jpg", "aoty_url": "https://www.albumoftheyear.org/album/61244-fishmans--kch-camp.php", "aoty_critic_score": 84, "aoty_user_score": null, "mbid": null, "yt_id": "0oKdM_7zuOk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Fishmans (フィッシュマンズ) were an influential Japanese band formed in 1987. They were ranked number 83 in a list of Japan’s top 100 musicians provided by HMV, and are renowned for their unique sound and the distinctive vocals of lead singer Shinji Sato.\n\nThe band was formed in 1987 by Sato (vocals, guitar, trumpet), Kin-Ichi Motegi (drums, vocals, sampler), and Kensuke Ojima (guitar and vocals). The addition of Yuzuru Kashiwabara (bass) and Hakase (keyboards) rounded up the original line-up.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 204, "title": "The Power of Failing", "artist": "Mineral", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22359-the-power-of-failing.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22359-mineral-the-power-of-failing.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "3ff93a02-eec5-3624-b1fe-7b33a0795cbb", "yt_id": "hLzSr-YUjtc", "rym": "https://rateyourmusic.com/release/album/mineral/the-power-of-failing", "genres": ["Punk", "Alternative Rock"], "desc_lfm_album": "", "desc_lfm_artist": "\"Mineral\" could refer to at least four bands: an emo band from Austin Texas, Armenian rock music veterans from Jermuk and another one from Boston.\n\n1) Mineral formed in 1994 and like other young bands, they toured constantly, virtually living in their van. The band's first release, the 7 inch \"Gloria\"/\"Parking Lot\" 7\", was released on Audio Concept by Kerry McDonald from Christie Front Drive (the record was later re-released by Caulfield Records).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "sdecandelario", "verygooood"]}, {"n": 205, "title": "Millions Now Living Will Never Die", "artist": "Tortoise", "year": 1996, "cover": "https://dn710804.ca.archive.org/0/items/mbid-08da1a27-a2d1-3eae-a5b0-74a935619800/mbid-08da1a27-a2d1-3eae-a5b0-74a935619800-21103719601.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8234-tortoise-millions-now-living-will-never-die.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "7bb7debb-bdcf-3991-aa19-2937a1ad4fa9", "yt_id": "gDt4_n6xP0M", "rym": "https://rateyourmusic.com/release/album/tortoise/millions-now-living-will-never-die", "genres": ["experimental rock", "post-rock", "instrumental", "Electronic", "Alternative Rock"], "desc_lfm_album": "Tortoise's production expertise hit an early peak with Millions Now Living Will Never Die, a work that not only references studio-centric forms like dub and electronica, but actively welds them to the group's aesthetic of sturdily constructed indie rock. The centerpiece is the 21-minute opener \"Djed,\" a multi-part track which brought Tortoise's already impressive compositional abilities to a grand scale. It's almost a history of influences in miniature, first referencing tape music and dub for several minutes, then moving on to Krautrock with a chugging section incorporating wheezing organ and understated guitar chords. Halfway through, the band takes on minimalism .", "desc_lfm_artist": "Tortoise's almost entirely instrumental music defies easy categorization.  The group gained significant attention from their early career. The members have roots in Chicago's fertile music scene, playing in various indie rock and punk groups.  Formed in 1990, Tortoise was among the first American indie rock bands to incorporate styles closer to Krautrock, dub, minimalism, electronica and various jazz styles, rather than the standard rock and roll and punk that had dominated indie rock for years.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 206, "title": "Boys For Pele", "artist": "Tori Amos", "year": 1996, "cover": "https://dn711003.ca.archive.org/0/items/mbid-011bab10-510c-34d1-acab-cc3a18d95729/mbid-011bab10-510c-34d1-acab-cc3a18d95729-3627817856.jpg", "aoty_url": "https://www.albumoftheyear.org/album/23448-tori-amos-boys-for-pele.php", "aoty_critic_score": 69, "aoty_user_score": 86, "mbid": "120da7c5-dd0f-38cd-abcd-3c3b8f0dcde9", "yt_id": "PxUqVJwWowY", "rym": "https://rateyourmusic.com/release/album/tori-amos/boys-for-pele", "genres": ["alternative rock", "pop rock", "baroque pop", "piano rock", "experimental"], "desc_lfm_album": "Boys for Pele is the third studio album by American singer and songwriter Tori Amos. Preceded by the first single, Caught a Lite Sneeze, by three weeks, the album was released on January 22, 1996, in the United Kingdom, on January 23 in the United States, and on January 29 in Australia. Despite the album being Amos's least accessible radio material to date, Boys for Pele debuted at #2 on both the US Billboard 200 and the UK Albums Chart, making it her biggest simultaneous transatlantic debut, her first Billboard top 10 debut, and the highest-charting US debut of her .", "desc_lfm_artist": "Tori Amos (born Myra Ellen Amos; August 22, 1963) is an American singer-songwriter and pianist. She is classically trained and has a mezzo-soprano vocal range. Amos began composing instrumental piano pieces at a young age and won a full scholarship to the Peabody Institute at Johns Hopkins University when she was five, becoming the youngest person admitted. She left the institute at eleven after her scholarship was discontinued.\n\nIn the 1980s, Amos", "desc_mb_album": "= Additional Credits =\r\n'''ELECTRONIC MANIPULATION BY METRO IMAGING'''\r\n\r\n'''PRODUCTION CO-ORDINATION AND PA-KERRI MANUELL'''\r\n'''PROJECT CO-ORDINATION: JULIE LARSON'''\r\n\r\n'''RECORDED AT A CHURCH IN DELGANY, CO WICKLOW,'''\r\n'''AND AT A WONDERFULLY DAMP GEORGIAN HOUSE IN CO. CORK, IRELAND'''\r\n\r\nDELGANY\r\nPROGRAMMING AND UTILITY: ALAN FREIDMAN FOR YIPE!\r\n(COOKIE, VIKING, PEGGY, PIZZA)\r\nCARPENTER/DRINKER AND SOMETIME JESUS: IAN CAMBELL\r\nCHEF: LUT DE CLERQ\r\nLOCATION ASSISTANCE: THEA DE RINGH\r\nFANTASTICNESS: ANDY MUIR\r\nNORTHERN EXPOSURE: BLACK DYKE MILLS BAND\r\n\r\nCORK\r\nCHEF: DARREN (UNLUCKY) STAATS,\r\nASSISTED BY JAYNE LEWIS\r\nFIRE OFFICER: IAN CAMBELL\r\nJAMBALAYA: GEORGE PORTER JR\r\nBREAD PUDDING: ARA (MAMA) PORTER\r\nALL SMILES: STEVE CATON\r\nMODEL CONNECTION IN PARIS: MANU KATCHE\r\nDOMESTIC ENGINEERIN", "desc_mb_artist": "Pip is one of several alter-egos created by Tori Amos for the American Doll Posse.  Pip is credited in the liner notes to that album.  Tori Amos also appeared as Pip to open several shows on the American Doll Posse tour.  More information can be found under the Personnel and Tour sections at [http://en.wikipedia.org/wiki/American_Doll_Posse#Personnel|Wikipedia].", "heard_by": ["MaxtorUwU", "Nubis84", "paqueradejere"]}, {"n": 207, "title": "Viva La Woman", "artist": "Cibo Matto", "year": 1996, "cover": "https://dn720006.ca.archive.org/0/items/mbid-038e8f53-a9e4-3cdc-bc41-8f4077f0f618/mbid-038e8f53-a9e4-3cdc-bc41-8f4077f0f618-8130270413.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "19866bdd-fcdc-34dd-9031-64e50dc482a9", "yt_id": "dMenteLu5t8", "rym": "https://rateyourmusic.com/release/album/cibo-matto/viva-la-woman", "genres": ["trip hop", "hip hop", "rock", "pop", "electronic"], "desc_lfm_album": "", "desc_lfm_artist": "Cibo Matto were a New York City-based band formed by two Japanese women, Miho Hatori and Yuka Honda in 1994. They sample and mix trip-hop and rock in their music. The group also stands out amongst other such artists for their particularly strong use of Latin and South American music. Cibo Matto is an Italian phrase that means \"crazy food\".\n\nAfter working together in the noise rock band Leitoh Lychee, Miho Hatori and Yuka Honda formed Cibo Matto around 1994.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 208, "title": "Neon Genesis Evangelion (Original Series Soundtrack)", "artist": "Shiro SAGISU", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/184793-neon-genesis-evangelion-original-series-soundtrack.jpg", "aoty_url": "https://www.albumoftheyear.org/album/184793-shiro-sagisu-neon-genesis-evangelion-original-series-soundtrack.php", "aoty_critic_score": 89, "aoty_user_score": null, "mbid": "4b608935-0ed2-3ff3-9618-3dd07055d814", "yt_id": "yal4lqG2ZA8", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Shiro Sagisu (鷺巣詩郎) is a multi-talented music producer/composer/arranger. He has been working in Japan's music scene for over 25 years. Many critics often refer to Shiro Sagisu as \"the Quincy Jones of Japan\". He has a diverse style of production skills in, but not limited to, Pop, R&B, Jazz and Classical music. \n\nHis career started in the late 70’s. He has written uncredited pieces of music for thousands of chart topping artists as well as worked on many films", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "verygooood"]}, {"n": 209, "title": "Storm of the Light’s Bane", "artist": "Dissection", "year": 1995, "cover": "https://dn710708.ca.archive.org/0/items/mbid-89e1e3e6-a646-4f67-b264-94ed2278c8d3/mbid-89e1e3e6-a646-4f67-b264-94ed2278c8d3-41267849507.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e6cebdb0-4116-39d1-a944-2138b8a7af7c", "yt_id": "bCp6N7xjH-A", "rym": null, "genres": ["death metal", "black metal", "melodic death metal", "melodic black metal"], "desc_lfm_album": "Storm of the Light's Bane is the 1995 album release by Swedish black/death metal band Dissection. That same year, Nuclear Blast released a Europe exclusive special digipak version of the album limited to 500 copies, which upon unfolding formed the shape of a cross with the song's lyrics printed on the sleeves. .", "desc_lfm_artist": "There are multiple bands called Dissection:\n\n1) Dissection was a Melodic Death/Black Metal band from Strömstad, Sweden. The 2006 album \"Reinkaos\" is Conceptual Melodic Thrash/Death Metal or as Jon himself called it \"The Metal Of Death\". The band was formed in 1989 by Jon Nödtveidt (vocals / lead, rhythm & acoustic guitars). Other members were Ole Öhman (drums), Peter Palmdahl (bass), and John Zwetsloot (rhythm & classic acoustic guitars).\n\nIn 1990, Dissection played their first live show with death metal act Entombed.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 210, "title": "Labcabincalifornia", "artist": "The Pharcyde", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7352-labcabincalifornia.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7352-the-pharcyde-labcabincalifornia.php", "aoty_critic_score": 69, "aoty_user_score": 86, "mbid": "d0dc0be5-53ec-3810-8683-ba1dfac644f8", "yt_id": "gL8ILr6lV9w", "rym": "https://rateyourmusic.com/release/album/the-pharcyde/labcabincalifornia", "genres": [], "desc_lfm_album": "\"Labcabincalifornia\" is the second album by The Pharcyde, released in 1995, three years after their debut Bizarre Ride II the Pharcyde. The album's production was handled by The Pharcyde themselves and J Dilla (known then as Jay Dee). The first single was \"Drop\". The video for \"Drop\" was directed by Spike Jonze, and used footage of the group performing the song backwards, replayed backwards, giving it a surreal quality. The backwards theme of the video was also a reference to the song itself, which featured a backwards sample. \"Drop\" was a hit, as was the follow up single \"Runnin'\" which .", "desc_lfm_artist": "The Pharcyde (pronounced \"Far Side\") is an American alternative hip-hop group, formed in 1989, from South Central Los Angeles. The original four members of the group are Imani (Emandu Wilcox), Slimkid3 (Trevant Hardson), Bootie Brown (Romye Robinson), and Fatlip (Derrick Stewart). DJ Mark Luv was the group's first disc jockey (DJ), followed by producer J-Swift and then J Dilla.\n\nThe group is perhaps best known for the hit singles \"Drop\", \"Passin' Me By\" and \"Runnin''\", as well as their first album, Bizarre Ride II the Pharcyde.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 211, "title": "Slaughter of the Soul", "artist": "At the Gates", "year": 1995, "cover": "https://e.snmc.io/i/600/w/d61bf84a8d884066d7a695d51d587c9e/4364266", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "675e453b-43c5-3c05-9ac8-dc526471e583", "yt_id": "614OdhFLUUU", "rym": "https://rateyourmusic.com/release/album/at-the-gates/slaughter-of-the-soul/", "genres": ["metal", "death metal", "melodic death metal"], "desc_lfm_album": "Slaughter Of The Soul is a 1995 album by Swedish melodic death metal band At the Gates, being their fourth full-length album release. It is considered a genre classic by many fans, and was largely responsible for establishing the Gothenburg scene, providing somewhat of an archetype for new melodic death metal bands. Slaughter of the Soul was re-released on CD in 2002 and 2007. A remastered LP edition was reissued Fall 2014 by Earache records. .", "desc_lfm_artist": "At the Gates is a Swedish melodic death metal band from Gothenburg. A major progenitor of the Gothenburg metal music scene, the band was formed in 1990 by singer Tomas Lindberg along with former members of the Swedish pioneering death metal band Grotesque. Although initially active from 1990–1996, the band reformed in 2007 for a reunion tour that lasted from April to September, 2008. In 2011, they reformed once again and have continued to perform since then.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 212, "title": "Liquid Swords", "artist": "Genius/GZA", "year": 1995, "cover": "https://dn721904.ca.archive.org/0/items/mbid-7d143b1f-9091-40be-bb5e-6413b6555fea/mbid-7d143b1f-9091-40be-bb5e-6413b6555fea-37506704036.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "6075a004-e983-3a00-8a13-50af32f0e200", "yt_id": "Br8me-Q6KTo", "rym": "https://rateyourmusic.com/release/album/genius_gza/liquid-swords", "genres": ["psychedelic", "hip hop", "east coast hip hop", "boom bap", "hardcore hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "GZA (pronounced Jizza), aka The Genius, born Gary Grice August 22, 1965 in Brooklyn, New York City is an American rapper. He is most well known as a founding member of the seminal hip-hop group the Wu-Tang Clan. In addition to appearing on all the Wu-Tang Clan albums he has released five solo albums and has appeared on many other clanmates’ solo releases.\n\nBorn in Brooklyn, GZA spent his childhood living with various groups of relatives in the other New York boroughs.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 213, "title": "Sunny Day Real Estate", "artist": "Sunny Day Real Estate", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/21136-lp2_004543.jpg", "aoty_url": "https://www.albumoftheyear.org/album/21136-sunny-day-real-estate-lp2.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "94189456-2ffc-3d6d-ab8a-0519a66243b6", "yt_id": "31gQBxUmJiQ", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Sunny Day Real Estate is an American alternative rock band formed in Seattle, Washington in 1992. The band helped bring the emo subgenre from an underground musical phenomenon to a wider audience. The band's lineup is Jeremy Enigk (vocals, guitars), Dan Hoerner (guitar), Nate Mendel (bass) and William Goldsmith (drums).\n\nThe core of Sunny Day Real Estate formed in 1992, originally under the name Empty Set. Empty Set consisted of Dan Hoerner (guitar, vocals), Nate Mendel (bass), and William Goldsmith (drums).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 214, "title": "Soul Food", "artist": "Goodie Mob", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/37680-soul-food-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/37680-goodie-mob-soul-food.php", "aoty_critic_score": 88, "aoty_user_score": 84, "mbid": "24cfe4c3-06c4-3148-9e32-b88dd2aebdb3", "yt_id": "q6-SFIAzFnA", "rym": "https://rateyourmusic.com/release/album/goodie-mob/soul-food", "genres": [], "desc_lfm_album": "Goodie Mob's debut was the Gold-certified album Soul Food in (1995), which was produced by Organized Noize and critically acclaimed. It was on this album that the phrase Dirty South was actually coined, with a song of that same title. This album touched on many social and political issues such as racism, discrimination, geo-politics, and gentrification. Although the album dealt with such heavy issues, some songs still carried a lighter tone, such as \"Soul Food,\" in which the crew expressed their love for home cooked meals. Along with Southernplayalisticadillacmuzik, this album put Atlanta's rap scene on the map. .", "desc_lfm_artist": "Goodie Mob, based in Atlanta, Georgia, is widely considered one of the founding hip hop acts of the (commerically viable) Dirty South movement. Members Cee-Lo (Thomas Callaway), Khujo Goodie (Willie Knighton, Jr.), T-Mo Goodie (Robert Barnett), and Big Gipp (Cameron Gipp) make up the group, which has been functioning since 1995.\n\n\"GOODIE MOb\", as it's written on their album covers, means the \"GOOD DIE Mostly Over bullshit\". Cee-Lo notes in a song off the Soul Food album that", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 215, "title": "Tri Repetae", "artist": "Autechre", "year": 1996, "cover": "https://ia801308.us.archive.org/1/items/mbid-d7838033-55fe-4fa4-949a-7bb96cc88839/mbid-d7838033-55fe-4fa4-949a-7bb96cc88839-19075543374.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6862-autechre-tri-repetae.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "8b3d1836-e3cd-35eb-a8cd-d03d56bcc6f8", "yt_id": "BkDaB263tkk", "rym": "https://rateyourmusic.com/release/album/autechre/tri-repetae", "genres": ["idm", "ambient techno"], "desc_lfm_album": "Tri Repetae (stylized as tri repetae., released in the United States as Tri Repetae++) is the third studio album by the British electronic music duo Autechre, released on 6 November 1995 by Warp Records in the United Kingdom and on 16 March 1996 by Wax Trax! Records and TVT Records. The album was released in the US as a two-disc set named Tri Repetae++, which included the Garbage and Anvil Vapre EPs constituting the second CD. In Japan, it was released with the bonus track \"Medrey\". Tri Repetae is considered to be one of the most influential electronic albums of .", "desc_lfm_artist": "Autechre (/ɔːˈtɛkər/) is the English electronic/IDM duo of Rob Brown and Sean Booth, signed with Warp Records.\n\nMuch of Autechre's music has a strong focus on complex rhythm and driving percussion, and more recently, on meticulous sequencing. Later work has been notably experimental and abstract, in contrast to the more club-friendly and conventional early 1990s releases.\n\nBooth and Brown formed the group in 1987 while they were both living in Rochdale, United Kingdom.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 216, "title": "Alice in Chains", "artist": "Alice in Chains", "year": 1995, "cover": "https://cdn2.albumoftheyear.org/600x0/album/alice-in-chains-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4844-alice-in-chains-alice-in-chains.php", "aoty_critic_score": 57, "aoty_user_score": 82, "mbid": "d2f5bcb9-a6e7-3d24-b2d6-95890b188c94", "yt_id": "lpKSs60XnhQ", "rym": "https://rateyourmusic.com/release/album/alice-in-chains/alice-in-chains", "genres": [], "desc_lfm_album": "Alice in Chains is the eponymous third studio album by the American rock band Alice in Chains. Released on November 7, 1995, it was the follow-up to the highly successful Dirt. Similar to Dirt, the album's songs focus on heavy subject matter such as depression, isolation, drug use, anger and death. The album relies less on metallic riffs and more on melody and texturally varied arrangements than the group's previous full-length albums, finally integrating some of the more delicate acoustic moods of their EPs. It marks the band's last studio album to feature vocalist Layne Staley (who would die of .", "desc_lfm_artist": "Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band.
