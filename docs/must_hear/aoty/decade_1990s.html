 of Power has been described as \"one of the defining albums of the groove-metal genre.\" Several songs from this release have become some of the band's best known, such as \"Mouth for War,\" \"A New Level,\" \"Walk,\" \"Fucking Hostile,\" \"This Love,\" and \"No Good (Attack the Radical).\" Background: The band's 1990 major label debut, Cowboys from Hell, demonstrated a change in their musical .", "desc_lfm_artist": "Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 380, "title": "Little Earthquakes", "artist": "Tori Amos", "year": 1991, "cover": "https://dn721809.ca.archive.org/0/items/mbid-d8074ae7-e163-4e20-b711-40b759198dfd/mbid-d8074ae7-e163-4e20-b711-40b759198dfd-38333421999.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9985-tori-amos-little-earthquakes.php", "aoty_critic_score": 76, "aoty_user_score": 84, "mbid": "cb10018e-e795-3b62-b9d6-f143d188e496", "yt_id": "dGBwsC0yJ8o", "rym": "https://rateyourmusic.com/release/album/tori-amos/little-earthquakes", "genres": ["alternative rock", "oldest release #1", "woman on cover", "Pop", "Alternative Rock"], "desc_lfm_album": "Little Earthquakes is the debut solo album of singer-songwriter Tori Amos, featuring the singles Silent All These Years, China, Winter and Crucify. The album was first released in the UK on January 13, 1992. Following the dissolution of her synth-pop band Y Kant Tori Read, Amos composed 12 songs, recorded them at Capitol Records in Los Angeles with Davitt Sigerson producing, and in June 1990 submitted them for copyright. Amos approached Atlantic Records in December 1990 with a 10-track demo tape, some being newer songs but mostly ones from June. The track listing consisted of Russia (later to become Take .", "desc_lfm_artist": "Tori Amos (born Myra Ellen Amos; August 22, 1963) is an American singer-songwriter and pianist. She is classically trained and has a mezzo-soprano vocal range. Amos began composing instrumental piano pieces at a young age and won a full scholarship to the Peabody Institute at Johns Hopkins University when she was five, becoming the youngest person admitted. She left the institute at eleven after her scholarship was discontinued.\n\nIn the 1980s, Amos", "desc_mb_album": "= Additional credits =\r\n'''Special thanks:''' “Eric, Mom and Dad, Mike Marie and all theirs, my nice manager Arthur Spivak, Al Schlesinger, all who worked on this record in any way, Cindy Palmano, Ian, Diana, Cin, Beene, the ESHT couple, Steve Chapman, Al and Kris, Ranz, Dane Blair, Stagg, Strawberry, Puddles in Belfast and all at EastWest Records UK, Max, Doug, and the Faeries.”", "desc_mb_artist": "Pip is one of several alter-egos created by Tori Amos for the American Doll Posse.  Pip is credited in the liner notes to that album.  Tori Amos also appeared as Pip to open several shows on the American Doll Posse tour.  More information can be found under the Personnel and Tour sections at [http://en.wikipedia.org/wiki/American_Doll_Posse#Personnel|Wikipedia].", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "paqueradejere"]}, {"n": 381, "title": "Dangerous", "artist": "Michael Jackson", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10687-dangerous-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10687-michael-jackson-dangerous.php", "aoty_critic_score": 69, "aoty_user_score": 80, "mbid": "d6b52521-0dfa-390f-970f-790174c22752", "yt_id": "m3snPmZJkn8", "rym": "https://rateyourmusic.com/release/album/michael-jackson/dangerous", "genres": [], "desc_lfm_album": "Dangerous is the eighth studio album by American singer Michael Jackson. It was released by Epic Records on November 26, 1991, more than four years after Jackson's previous album, Bad (1987). Co-produced by Jackson, Bill Bottrell, Teddy Riley, and Bruce Swedien, the album was Jackson's first since Off the Wall (1979) without longtime collaborator Quincy Jones. Guest appearances include Heavy D, Princess Stéphanie of Monaco, Slash and Wreckx-n-Effect. The album incorporates new jack swing, a popular genre at the time, R&B and pop. Elements of industrial, funk, hip hop, electronic, gospel, classical and rock are also present. Jackson wrote or .", "desc_lfm_artist": "Michael Joseph Jackson (August 29, 1958 – June 25, 2009) was an American singer, songwriter, dancer, and philanthropist. Known as the \"King of Pop,\" he is widely recognized as one of the most influential figures in popular music during the 20th century. His career spanned more than four decades, during which he broke racial barriers in the music industry and became a global icon. Jackson popularized street dance moves such as the moonwalk, the robot", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 382, "title": "Achtung Baby", "artist": "U2", "year": 1991, "cover": "https://dn711103.ca.archive.org/0/items/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f-16544589722.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4432-u2-achtung-baby.php", "aoty_critic_score": 92, "aoty_user_score": 80, "mbid": "744c7a1b-ac79-35c4-bd92-7e2c6a24c8d8", "yt_id": "tkoEGVAHpZg", "rym": "https://rateyourmusic.com/release/album/u2/achtung-baby", "genres": ["alternative rock", "pop rock", "post-punk", "indie rock", "alternative dance", "dance-rock"], "desc_lfm_album": "Achtung Baby is the seventh studio album by Irish rock band U2, released on 19 November 1991. The album arrived nearly two years after lead vocalist Bono announced the band would have to \"go away and dream it all up again\", following the mixed response to 1988's Rattle and Hum. While recording Achtung Baby, there was a rift between band members over the direction of the band's sound. Tensions almost prompted U2 to break-up until the band rallied around the writing of the album's hit One. The album marks a dramatic change in the band's image and sound, with the .", "desc_lfm_artist": "U2 are an Irish rock band formed in Dublin in 1976. The group comprises Paul \"Bono\" Hewson (lead vocals and rhythm guitar), David \"the Edge\" Evans (lead guitar, keyboards, and backing vocals), Adam Clayton (bass guitar), and Larry Mullen Jr. (drums and percussion). Initially rooted in post-punk, U2's musical style has evolved throughout their career, yet has maintained an anthemic quality built on Bono's expressive vocals and the Edge's chiming, effects-based guitar sounds.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 383, "title": "Loveless", "artist": "My Bloody Valentine", "year": 1991, "cover": "https://dn710703.ca.archive.org/0/items/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06-25797196285.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3671-my-bloody-valentine-loveless.php", "aoty_critic_score": 92, "aoty_user_score": 89, "mbid": "cb76227e-3ac0-3002-9a10-615a5b73cc59", "yt_id": "4nzZeUUiG2c", "rym": "https://rateyourmusic.com/release/album/my-bloody-valentine/loveless", "genres": ["alternative rock", "noise rock", "psychedelic", "noise pop", "shoegaze", "dream pop"], "desc_lfm_album": "loveless is the second studio album by Irish shoegaze band my bloody valentine, released on 4 November 1991 by Creation Records. The album was recorded over a two-year period between 1989 and 1991. Vocalist and guitarist Kevin Shields dominated the arduous recording process; intent on achieving a particular sound, he experimented with guitar tremolo techniques and tuning systems, unorthodox production methods, obscured vocals, and sampled percussion and feedback. The group cycled through nineteen studios and a larger number of engineers during the album's two-year creation, with total recording costs rumoured to have reached £250,000. While loveless did not achieve great .", "desc_lfm_artist": "my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 384, "title": "Death Certificate", "artist": "Ice Cube", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/14020-death-certificate.jpg", "aoty_url": "https://www.albumoftheyear.org/album/14020-ice-cube-death-certificate.php", "aoty_critic_score": 89, "aoty_user_score": 83, "mbid": "5e111110-e4af-3487-b498-c7fa44ddf32c", "yt_id": "eDZtBm52Xmo", "rym": "https://rateyourmusic.com/release/album/ice-cube/death-certificate", "genres": ["hip hop", "west coast hip hop", "gangsta rap", "hardcore hip hop", "Hip-Hop"], "desc_lfm_album": "Death Certificate is the second studio album by rapper Ice Cube, released October 31, 1991 on Priority Records. Highly anticipated with over a million advance orders, the album was certified platinum in sales on December 20, 1991. The album debuted on the Top R&B/Hip-Hop Albums chart at #1 and on the Billboard 200 chart at #2, while it went on to sell over two million copies to date. It is considered one of the greatest hip hop albums of all time. It was also the source of much controversy due to some of its racially charged content, and Ice Cube's .", "desc_lfm_artist": "O'Shea Jackson Sr. (born June 15, 1969), known professionally as Ice Cube, is an American rapper and actor. He began his career as a member of the hip-hop group C.I.A. and later joined the seminal rap group N.W.A (Niggaz Wit Attitudes). After leaving N.W.A in December 1989, he began both a successful solo music career and an acting career which included roles in films such as Boyz n the Hood (1991), Friday (1995), for which he also co-wrote the screenplay, and Barbershop (2002).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Rocky_stereo"]}, {"n": 385, "title": "Human", "artist": "Death", "year": 1991, "cover": "https://dn721602.ca.archive.org/0/items/mbid-3101ec0b-94c8-4cc2-8079-ae786ba5e838/mbid-3101ec0b-94c8-4cc2-8079-ae786ba5e838-31324237474.jpg", "aoty_url": "https://www.albumoftheyear.org/album/38699-death-human.php", "aoty_critic_score": 90, "aoty_user_score": 87, "mbid": "6346903b-4480-3b0f-adef-90fe0b338509", "yt_id": "EzvtfbqJeIY", "rym": "https://rateyourmusic.com/release/album/death/human/", "genres": ["metal", "progressive metal", "death metal", "technical death metal", "Metal"], "desc_lfm_album": "This album, released in 1991, was a major step up for this rapidly evolving death metal outfit. Rich with complicated riffs and beats Human's emphasis is really on technique. Paul Masvidal (guitar) and Sean Reinert (drums) from Cynic surely helped on creating the unique sound of this album. .", "desc_lfm_artist": "There are multiple artists sharing the name Death; \n\n1) A pioneering death metal band from Altamonte Springs, Florida, U.S. \n2) A protopunk band from Detroit, Michigan, U.S. \n3) A horrorcore rapper from New Orleans, Louisiana, U.S. \n4) A hard techno producer from Germany. \n\n1)  Death was an American death metal band formed in Altamonte Springs, Florida in 1984 by guitarist and vocalist Chuck Schuldiner. Death is considered to be among the most influential", "desc_mb_album": "", "desc_mb_artist": "The band was originally started as [http://musicbrainz.org/show/artist/relationships.html?artistid=602427|Mantas] in 1983 and changed its name to Death a year later.", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 386, "title": "Unquestionable Presence", "artist": "Atheist", "year": 1991, "cover": "https://dn710909.ca.archive.org/0/items/mbid-78a38814-d0cf-4f9a-9b64-9b89f8d80821/mbid-78a38814-d0cf-4f9a-9b64-9b89f8d80821-2571757705.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53606-atheist-unquestionable-presence.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "7be973f8-991d-35ce-91ff-e2c525fe0d9c", "yt_id": "fkoe074iiaw", "rym": "https://rateyourmusic.com/release/album/atheist/unquestionable-presence", "genres": ["progressive metal", "death metal", "technical death metal", "technical thrash metal", "thrash metal", "Metal"], "desc_lfm_album": "Unquestionable Presence is the second album by the death metal band Atheist. It was released in 1991 and added a new sound by using jazz-like harmonies, subtle Latin rhythms and unusual time signatures. It is considered a landmark album in the genre of technical death metal. .", "desc_lfm_artist": "Atheist is a death metal band from Florida, USA, founded in 1984 by vocalist/guitarist Kelly Shaefer, guitarist Rand Burkey, bassist Roger Patterson, and drummer Steve Flynn. The band is known for their technical playing style. Their album Unquestionable Presence (1991) is regarded as a landmark of the death metal genre. After dissolving in 1994, the band reformed in 2006.\n\nDiscography:\n1989 - Piece of Time\n1991 - Unquestionable Presence\n1993 - Elements\n2009 - Unquestionable Presence: Live at Wacken\n2010 - Jupiter", "desc_mb_album": "", "desc_mb_artist": "The band started out as Oblivion in 1984. They changed their name to R.A.V.A.G.E. (Raging Atheists Vowing A Gory End) in 1985, and to Atheist in 1987.", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 387, "title": "Badmotorfinger", "artist": "Soundgarden", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9285-badmotorfinger_223731.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9285-soundgarden-badmotorfinger.php", "aoty_critic_score": 85, "aoty_user_score": 83, "mbid": "85766188-9484-333e-b8ae-a5cab5e5167b", "yt_id": "_U7FT11N5ns", "rym": "https://rateyourmusic.com/release/album/soundgarden/badmotorfinger", "genres": ["Metal", "Alternative Rock"], "desc_lfm_album": "Badmotorfinger is the third album by the American rock band Soundgarden. It was released on October 8, 1991 through A&M Records. After touring in support of its previous album, Louder Than Love, released in 1989, the band began the recording sessions for its next album with new bassist Ben Shepherd. The music on the album maintained the band's heavy metal sound while featuring an increased focus on songwriting when compared with the band's previous releases. The focus on the Seattle grunge scene helped bring attention to Badmotorfinger. The singles \"Outshined\" and \"Rusty Cage\" were able to find an audience at .", "desc_lfm_artist": "Soundgarden was an American rock band formed in Seattle, Washington, in 1984 by singer and drummer Chris Cornell, lead guitarist Kim Thayil, and bassist Hiro Yamamoto. Cornell switched to rhythm guitar in 1985, and the drum position was taken over first by Scott Sundquist and then by Matt Cameron in 1986. Yamamoto departed in 1989 and was replaced briefly by Jason Everman before Ben Shepherd joined later that year. Soundgarden disbanded in 1997 and reunited in 2010.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 388, "title": "Effigy of the Forgotten", "artist": "Suffocation", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/72156-effigy-of-the-forgotten.jpg", "aoty_url": "https://www.albumoftheyear.org/album/72156-suffocation-effigy-of-the-forgotten.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "af11f424-5f79-355d-80ab-0ad4fc0b4c0b", "yt_id": "MUoAf7Zs52Q", "rym": "https://rateyourmusic.com/release/album/suffocation/effigy-of-the-forgotten", "genres": ["death metal", "technical death metal", "brutal death metal"], "desc_lfm_album": "Effigy of the Forgotten is the debut full-length album by New York-based brutal death metal band Suffocation, released in 1991. The cover artwork was created by Dan Seagrave. Several of the tracks had appeared on earlier releases: \"Reincremation\" and \"Involuntary Slaughter\" were re-recorded from the Reincremated demo, while \"Infecting the Crypts\", \"Mass Obliteration\", and \"Jesus Wept\" appeared originally on the Human Waste EP. The album became very influential in the death metal and grindcore genres, and is credited with the establishment of many stylistic features which would come to typify the genre that came to be known as brutal death .", "desc_lfm_artist": "Suffocation is an American brutal technical death metal band originating from Centereach, New York. The band formed in 1988 and approached this genre in their own style, revolving around heavy, uniquely rhythmic riffs and even deeper growling vocals and breakdowns to create a sub-genre of the form often termed \"brutal\" death metal - also known by many as \"New York Death Metal,\" or \"NYDM\" for short. Other New York death metal bands that soon after followed in the footsteps of Suffocation's style include  Immolation", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU"]}, {"n": 389, "title": "Nevermind", "artist": "Nirvana", "year": 1991, "cover": "https://dn721803.ca.archive.org/0/items/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b-30501372565.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3666-nirvana-nevermind.php", "aoty_critic_score": 91, "aoty_user_score": 90, "mbid": "1b022e01-4da6-387b-8658-8678046e4cef", "yt_id": "V0hDhjO3AwM", "rym": "https://rateyourmusic.com/release/album/nirvana/nevermind", "genres": ["alternative rock", "punk rock", "grunge", "rock", "censored album cover", "Rock"], "desc_lfm_album": "Nevermind is the second studio album by the American grunge band Nirvana, released on September 24, 1991. Produced by Butch Vig, Nevermind was the group's first release on Geffen Records, which signaled its move away from Seattle-based independent record label Sub Pop. Front man Kurt Cobain sought to make music outside of the restrictive confines of the Seattle grunge scene, drawing influence from groups such as the Pixies and its use of loud/quiet song dynamics. Nevermind was a surprise success by late 1991, largely due to the success of its lead single \"Smells Like Teen Spirit\". By January 1992 it .", "desc_lfm_artist": "There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s.", "desc_mb_album": "", "desc_mb_artist": "Nirvana is a band whose shows and session recordings have been widely bootlegged as unof  Wake bassist and The Jesus & Mary Chain drummer), Andrew Innes (guitars), Simone Butler (bass) and Darrin Mooney (drums). Other important members were Robert \"Throb\" Young (guitars from 1985 to 2006), Gary \"Mani\" Mounfield (bass from 1996 to 2011; also former The Stone Roses bassist) and Martin Duffy (keyboards from 1989 until his death in 2022).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 392, "title": "No More Tears", "artist": "Ozzy Osbourne", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/18387-no-more-tears_035436.jpg", "aoty_url": "https://www.albumoftheyear.org/album/18387-ozzy-osbourne-no-more-tears.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "1df6ebdf-8d54-31a6-9bf8-13737493f386", "yt_id": "j-C8lIHJMak", "rym": "https://rateyourmusic.com/release/album/ozzy-osbourne/no-more-tears", "genres": ["Metal", "Rock"], "desc_lfm_album": "No More Tears is an album by Ozzy Osbourne. It was released on September 17, 1991 and it was re-issued on August 22, 1995. Guitarist Zakk Wylde contributed songwriting and guitar to the album, while Motörhead's bassist/vocalist Lemmy wrote the lyrics for four songs. Although Mike Inez is seen playing bass in several of the album's videos, long-time Ozzy bassist Bob Daisley plays on the entire album. Though Inez was an official member of the band, the Osbournes had a longstanding working relationship with Daisley and had also asked him to write lyrics, as he did for all of Ozzy's .", "desc_lfm_artist": "Ozzy Osbourne (born John Michael Osbourne in Marston Green, Warwickshire, on 3 December 1948; died 22 July 2025) was an English singer, songwriter, and media personality remembered as the lead vocalist of the heavy metal band Black Sabbath, during which period he adopted the nickname \"Prince of Darkness\". On 5 July 2025, Osbourne performed his final show at the \"Back to the Beginning\" concert event. \n\nHe was inducted into the Rock and Roll Hall of Fame as a member of Black Sabbath in 2006 and as a solo artist in 2024.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 393, "title": "Laughing Stock", "artist": "Talk Talk", "year": 1991, "cover": "https://dn720709.ca.archive.org/0/items/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42-7497588359.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4350-talk-talk-laughing-stock.php", "aoty_critic_score": 79, "aoty_user_score": 87, "mbid": "3e0de863-6232-3f43-b2a2-7cfbf71b99e9", "yt_id": "ARehbaKm4U0", "rym": "https://rateyourmusic.com/release/album/talk-talk/laughing-stock/", "genres": ["experimental rock", "avant-garde", "post-rock", "rock", "Jazz", "Pop"], "desc_lfm_album": "Laughing Stock is the fifth and final LP from Talk Talk, released on November 19, 1991 from Polydor records. It marks the pinnacle of the band's transformation from synth-pop into an experimental, impressionistic sound that would later share characteristics with what music critics called post-rock; as such, it is the quintessential document of a proto-post-rock sound from this incredibly creative group, and it serves as a touchstone record for the era. Since it's release, many years later it has been hailed as a lost classic of the grunge-era nineties. Talk Talk had been steadily gestating a sound transformation from records .", "desc_lfm_artist": "Talk Talk were an English band formed in 1981 by Mark Hollis (vocals, guitar, piano), Lee Harris (drums), Paul Webb (bass), and Simon Brenner (keyboards). The band initially performed as a synth-pop group, and their first two albums, \"The Party's Over\" (1982) and \"It's My Life\" (1984), reached the top 40 in the UK and produced international singles including \"Talk Talk\", \"Today\", \"It's My Life\", and \"Such a Shame\".\n\nThe band's third album, \"The Colour of Spring\" (1986)", "desc_mb_album": "The US editions differ slightly from the UK/European editions in the lengths of tracks 3 and 4 due to crossfading, although I'm not sure this holds true for every release.", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 394, "title": "Just For A Day", "artist": "Slowdive", "year": 1991, "cover": "https://dn710308.ca.archive.org/0/items/mbid-ca7dc2c0-bb6e-47d1-843d-6e7420d11a75/mbid-ca7dc2c0-bb6e-47d1-843d-6e7420d11a75-16656085652.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7975-slowdive-just-for-a-day.php", "aoty_critic_score": 65, "aoty_user_score": 81, "mbid": "223866ce-e81a-3120-b215-b7ee69ebbfc7", "yt_id": "Oc2x6_7-c0U", "rym": "https://rateyourmusic.com/release/album/slowdive/just-for-a-day", "genres": ["shoegaze", "dream pop"], "desc_lfm_album": "Just for a Day is the debut studio album by the English band Slowdive, released on 2 September 1991 by record label Creation. Just for a Day was recorded at Courtyard Studios in Abingdon in the Thames Valley, formerly known as Georgetown Studios. The album peaked at No. 3 in the UK Indie Chart. Upon its release, copies of the album were labelled with a sticker that read \"like a mind altering substance, without the risk\". Just for a Day has been generally well received by critics. Trouser Press wrote that it was \"up and down in material, but the .", "desc_lfm_artist": "Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon t four albums towards a slower, heavier, and more polished approach. To promote the album, Metallica embarked on an extensive touring schedule and released five singles: \"Enter Sandman\", \"The Unforgiven\", .", "desc_lfm_artist": "Metallica is an American heavy metal band formed in Los Angeles in 1981 by James Hetfield and Lars Ulrich and later based in San Francisco. Known for fast tempos, complex instrumentals and aggressive musicianship, the group became one of the founding big four bands of thrash metal alongside Megadeth, Anthrax and Slayer. The current lineup consists of Hetfield, Ulrich, Kirk Hammett and Robert Trujillo. Former members include Dave Mustaine, Ron McGovney, Cliff Burton and Jason Newsted.", "desc_mb_album": "'''Attention!''' This album known sometimes as ''The Black Album'' is correctly named simply '''''Metallica'''''. ''The Black Album'' is only a fan-composed name. Please do not add it or rename it.", "desc_mb_artist": "'''Attention!''' The album known sometimes as ''The Black Album'' is already in this database, it is correctly named simply ''[http://musicbrainz.org/release-group/e8f70201-8899-3f0c-9e07-5d6495bc8046.html|Metallica]''. This is because ''The Black Album'' is only a fan-composed name. Please do not add it or rename it.\r\n\r\nBoth the infamous ''Garage Days'' (in the EPs section) and ''[http://musicbrainz.org/release-group/49371adc-871d-38f6-bb60-fd9e5af6795f.html|S&M]'' (in the Live section) are also here, they're just a bit scattered. \r\n\r\nMetallica has been selling Official/Live concert recordings on [http://www.livemetallica.com] since 2004-03-02.  Please add a \"X can be purchased for download at Y\" relationship if you add one of these releases.  For a list of which shows have already been a", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 399, "title": "Sailing The Seas Of Cheese", "artist": "Primus", "y , "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "0be4cdd5-ed37-3842-82ba-7f9983a34473", "yt_id": "fL_uR33mcX0", "rym": "https://rateyourmusic.com/release/album/de-la-soul/de-la-soul-is-dead", "genres": ["alternative hip hop", "hip hop", "jazz rap", "conscious hip hop", "boom bap", "abstract hip hop"], "desc_lfm_album": "De La Soul Is Dead is the second studio album by American hip-hop group De La Soul, released on May 14, 1991. It was produced by Prince Paul .", "desc_lfm_artist": "De La Soul is an American hip-hop group formed in 1988 in the Amityville area of Long Island, New York. They are best known for their eclectic sampling, quirky lyrics, and their contributions to the evolution of the jazz rap and alternative hip-hop subgenres. The members are Posdnuos, Maseo, and Trugoy (until his death in 2023). The three formed the group in high school and caught the attention of producer Prince Paul with a demo tape of the song \"Plug Tunin'\".", "desc_mb_album": "", "desc_mb_artist": "Please don’t add the album [http://musicbrainz.org/release-group/4aebff62-baae-4017-a9e4-12cbbc4ecc7b|“First Serve”] here. It is already there with the correct Artist [http://musicbrainz.org/artist/a904f60a-b8d2-4ed5-90b5-569bf28d1a80|“First Serve”].", "heard_by": []}, {"n": 401, "title": "White Light From The Mouth Of Infinity", "artist": "Swans", "year": 1991, "cover": "https://dn721608.ca.archive.org/0/items/mbid-03020f82-b6f6-3ae9-93f2-759aedceea43/mbid-03020f82-b6f6-3ae9-93f2-759aedceea43-3504583292.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "b9855e1a-7e4a-3c42-ad9c-0060f0324b6c", "yt_id": "PLFztSYvg5I", "rym": null, "genres": ["art rock", "post-punk", "gothic rock", "neofolk", "rock"], "desc_lfm_album": "\"White Light from the Mouth of Infinity\" is the seventh album by American experimental rock band Swans. It was released on June 6, 1991. The album was out of print until it was reissued in a box set on Young God Records, along with their eighth studio album: \"Love Of Life\" in December 2015. although all but two of the songs appear on the compilation \"Various Failures\". The two songs not included there, \"Power and Sacrifice\" & \"Song for the Sun\", are on the compilation \"Forever Burned\". The cover art is a painting by Deryk Thomas. .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 402, "title": "Whirlpool", "artist": "Chapterhouse", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8896-whirlpool_161732.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8896-chapterhouse-whirlpool.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "d0d9f7ee-8338-4fcb-9257-7bf2f55a4133", "yt_id": "opsRzq9tb64", "rym": "https://rateyourmusic.com/release/album/chapterhouse/whirlpool-5/", "genres": ["shoegaze"], "desc_lfm_album": "Whirlpool is the debut album by Chapterhouse, released on 29 April 1991. .", "desc_lfm_artist": "Chapterhouse was a British shoegaze band of the early 1990s, originally from Reading, England. Formed in 1987 by Andrew Sherriff and Stephen Patman, the band began performing alongside Spacemen 3. The band reunited for a few shows in 2008-2010.\n\nThe band comprised of Andrew Sherriff (guitar/vocals), Stephen Patman (guitar/vocals), Simon Rowe (guitar), Jon Curtis (bass) and Ashley Bates (drums).\n\nChapterhouse took the unusual step of rehearsing and gigging for well over a year before recording even a demo tape.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 403, "title": "Temple of the Dog", "artist": "Temple of the Dog", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/38013-temple-of-the-dog.jpg", "aoty_url": "https://www.albumoftheyear.org/album/38013-temple-of-the-dog-temple-of-the-dog.php", "aoty_critic_score": 74, "aoty_user_score": 81, "mbid": "b9369fce-01fc-36b2-9d67-3a7fb14a8f44", "yt_id": "sXDzO7IahlQ", "rym": "https://rateyourmusic.com/release/album/temple-of-the-dog/temple-of-the-dog", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Temple of the Dog is the only studio album by the American rock band Temple of the Dog, released on April 16, 1991 through A&M Records. The album is a tribute to Andrew Wood, the former lead singer of Malfunkshun and Mother Love Bone. Wood died on March 19, 1990 of a heroin overdose. The album has been certified platinum by the RIAA in the United States. Soundgarden frontman Chris Cornell, who had been Mother Love Bone vocalist Andrew Wood's roommate, approached former Mother Love Bone members Stone Gossard and Jeff Ament about working on material he had written when .", "desc_lfm_artist": "Temple of the Dog was an American rock supergroup formed in Seattle, Washington, in 1990. It was created by Chris Cornell of Soundgarden as a tribute to Andrew Wood, the late lead singer of Malfunkshun and Mother Love Bone. The lineup featured Stone Gossard on rhythm guitar and Jeff Ament on bass guitar, both previously of Mother Love Bone and later members of Pearl Jam, along with Mike McCready on lead guitar and Matt Cameron on drums. Eddie Vedder contributed guest lead and backing vocals and later joined Pearl Jam as its lead vocalist.", "desc_mb_album": "", "desc_mb_artist": "Initiated by Chris Cornell, Temple of the Dog was an expression of mourning. His friend and roommate, Andy Wood of Mother Love Bone, died of an accidental heroin overdose on March 19, 1990.\n\nCornell initially wrote \"Reach Down\" and \"Say Hello 2 Heaven\", a set of tracks which expanded after the rest of the members of TotD were recruited. Cornell's initial intentions were not a full release.\n\n\"The more we talked about it, the more songs kept flying out, and it ended up being an album. It didn't feel like a morose project. It felt sort of celebratory.\" -- Cornell to Reflex Magazine (1991)\n\nFor the full story and more, visit www.reachdown.com.", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "sdecandelario", "verygooood"]}, {"n": 404, "title": "Blue Lines", "artist": "Massive Attack", "year": 1991, "cover": "https://dn711308.ca.archive.org/0/items/mbid-3a25785e-50ec-383c-89cf-fd512181449c/mbid-3a25785e-50ec-383c-89cf-fd512181449c-2233107692.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1572-massive-attack-blue-lines.php", "aoty_critic_score": 96, "aoty_user_score": 82, "mbid": "8b6f133a-2fdf-3cc2-b84d-1c889adc0939", "yt_id": "W5UIf9CRXNI", "rym": "https://rateyourmusic.com/release/album/massive-attack/blue-lines", "genres": ["alternative rock", "dub", "electronica", "trip hop", "hip hop", "alternative dance"], "desc_lfm_album": "Blue Lines is the debut studio album by English electronic music group Massive Attack, released on April 8, 1991 by Wild Bunch and Virgin Records. Generally regarded as the first \"trip hop\" album, Blue Lines blended elements of hip hop (such as breakbeats, sampling and rapping) with dub, soul, reggae and electronic music. The recording was led by members Grantley \"Daddy G\" Marshall, Robert \"3D\" Del Naja, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles, with co-production by Jonny Dollar. It also features contributions by singers Shara Nelson and Horace Andy. Blue Lines was named the 21st greatest album of all .", "desc_lfm_artist": "Massive Attack is an English trip hop collective formed in 1988 in Bristol by Robert \"3D\" Del Naja, Grant \"Daddy G\" Marshall, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles. The group consists of Del Naja and Marshall.\n\nTheir debut album, \"Blue Lines\" (1991), is frequently cited as the first major work of the trip hop genre. The single \"Unfinished Sympathy\" achieved chart success in Europe, including reaching number one on the Dutch Top 40. Their second album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 405, "title": "Spiderland", "artist": "Slint", "year": 1991, "cover": "https://dn711203.ca.archive.org/0/items/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e-11175053947.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4349-slint-spiderland.php", "aoty_critic_score": 80, "aoty_user_score": 88, "mbid": "e9f4b96a-94df-36be-9659-c9a811caead6", "yt_id": "FAApF-FDkoY", "rym": "https://rateyourmusic.com/release/album/slint/spiderland", "genres": ["alternative rock", "post-hardcore", "post-rock", "math rock", "Rock", "Punk"], "desc_lfm_album": "Spiderland is the second and final studio album by the American rock band Slint. It contains six songs played over 40 minutes, and was released by Touch and Go Records on March 27, 1991. Slint's lineup at the time of recording comprised Brian McMahan on vocals and guitar, David Pajo on guitar, Todd Brashear on bass guitar and Britt Walford on drums. Spiderland was engineered by Brian Paulson and recorded over four days in August 1990. The music and vocal melodies were composed throughout the summer of 1990, while lyrics were written in-studio. Forming in 1986 in Louisville, Kentucky, Slint .", "desc_lfm_artist": "Slint was an American post-hardcore band consisting of Brian McMahan (guitar and vocals), David Pajo (guitar), Britt Walford (drums), Todd Brashear (bass on Spiderland) and Ethan Buckler (bass on Tweez). They formed in Louisville, Kentucky, United States in 1986. Though they disbanded circa 1991, they are considered to be a major influence on the post-hardcore, math rock, and post-rock scenes.\n\nSlint's first album Tweez was recorded by legendary sound", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 406, "title": "Arise", "artist": "Sepultura", "year": 1992, "cover": "https://dn710907.ca.archive.org/0/items/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057-19192586880.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8488-sepultura-arise.php", "aoty_critic_score": 88, "aoty_user_score": 83, "mbid": "6d9ffabb-233a-3cc1-9ac3-d2a8e4c99cdd", "yt_id": "XLaArdvo9-U", "rym": "https://rateyourmusic.com/release/album/sepultura/arise", "genres": ["heavy metal", "metal", "alternative metal", "progressive metal", "death metal", "thrash metal"], "desc_lfm_album": "Arise is the fourth studio album by Brazilian thrash metal band Sepultura, released in 1991 through Roadrunner Records. Upon its release, the album received top reviews from heavy metal magazines such as Rock Hard, Kerrang! and Metal Forces. Arise is considered Sepultura's finest hour among longtime fans. While the music on Arise was mostly in the same death/thrash style as their previous album, Beneath the Remains, it was clear that the Sepultura sound was acquiring an experimental edge. The album presented their first incursions with industrial music, hardcore punk and latin percussion. The tour (1990-1992) that supports the album has .", "desc_lfm_artist": "Sepultura (Portuguese word for \"Grave\") is a Brazilian metal band from Belo Horizonte. Formed in 1984 by brothers Max and Igor Cavalera, the band was a major force in the groove metal, thrash metal, and death metal genres during the late 1980s and early 1990s, with their later experiments drawing influence from alternative metal, world music, nu metal, hardcore punk, and industrial metal. Sepultura has also been credited as one of the second wave of thrash metal acts from the late 1980s and early-to-mid 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "sdecandelario"]}, {"n": 407, "title": "Goat", "artist": "Jesus Lizard", "year": 1991, "cover": "https://dn721605.ca.archive.org/0/items/mbid-da363688-9877-4cba-8ee0-89b42649e352/mbid-da363688-9877-4cba-8ee0-89b42649e352-9716876375.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "5c057a6c-1841-37b3-a94d-a43f476bef1f", "yt_id": "GhHwuPNA-j4", "rym": "https://rateyourmusic.com/release/album/the-jesus-lizard/goat", "genres": ["alternative rock", "noise rock", "post-punk", "indie rock", "post-hardcore", "pigfuck"], "desc_lfm_album": "", "desc_lfm_artist": "Fuckit. Just look on wikipedia.\n\n\n\n\n\n\n\n\n\n\n\nFuckit all", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 408, "title": "tremolo", "artist": "my bloody valentine", "year": 1991, "cover": "https://cdn2.albumoftheyear.org/600x0/album/tremolo.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5628-my-bloody-valentine-tremolo.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "edec025d-a17a-317b-bb51-e326b8a1ba31", "yt_id": "s_dvN7lmZQ0", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "verygooood"]}, {"n": 409, "title": "Slowdive", "artist": "Slowdive", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/47603-slowdive.jpg", "aoty_url": "https://www.albumoftheyear.org/album/47603-slowdive-slowdive.php", "aoty_critic_score": 78, "aoty_user_score": 82, "mbid": "9318347d-b4bc-4b50-bd5e-c9a9fcb9aa98", "yt_id": "zYWAk0ISQ-w", "rym": "https://rateyourmusic.com/release/album/slowdive/slowdive", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "Slowdive is the self-titled fourth studio album from the iconic shoegaze band Slowdive. Being Slowdive's first release in 22 years, it was released on May 5th, 2017 with two singles \"Star Roving\" and \"Sugar for the Pill\" preceding it's release. The album received highly positive reviews and acclaim upon release and it was included in numerous yearly top album lists at the end of 2017. .", "desc_lfm_artist": "Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon replaced Scott from 1994-1995.", "desc_mb_album": "", "desc_mb_artist": "'''Slowdive''' disbanded in 1995, reunited in 2014.", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 410, "title": "Nowhere", "artist": "Ride", "year": 1990, "cover": "https://dn721802.ca.archive.org/0/items/mbid-ebc2ee3f-3407-4f7e-8780-80deaf6cac1e/mbid-ebc2ee3f-3407-4f7e-8780-80deaf6cac1e-43289782633.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4606-ride-nowhere.php", "aoty_critic_score": 79, "aoty_user_score": 80, "mbid": "4ff18a50-33fa-37aa-a355-ea2a70e35ae3", "yt_id": "In9yq3oNqCg", "rym": "https://rateyourmusic.com/release/album/ride/nowhere", "genres": ["shoegaze", "Rock", "Pop", "Alternative Rock"], "desc_lfm_album": "\"Nowhere\" by Ride is one of the seminal albums of the Shoegazing genre, even if the sound of the album is not necessarily indebted to Shoegaze. Rather, Ride's album seems to predict many genres of rock that were to be heard down the road, from Britpop to Indie. Their heavy use of distortion and hypnotic guitar figures certainly got them lumped into the Shoegaze scene, but really what we have here is a unique slice of guitar pop made by a group of immensely talented and inspired young men. The influence of this album is still being felt today through .", "desc_lfm_artist": "Ride is a shoegaze band that formed in 1988 in Oxford, England, consisting of Andy Bell, Mark Gardener, Laurence Colbert, and Steve Queralt. The band were initially part of the shoegaze scene that emerged in England during the early 1990s. Their debut album Nowhere (1990) has been named one of the greatest albums of the genre. Ride has released five albums: \"Nowhere\" (1990), \"Going Blank Again\" (1992), \"Carnival of Light\" (1994), \"Tarantula\" (1996), and \"Weather Diaries\" (2017).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 411, "title": "Seasons in the Abyss", "artist": "Slayer", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12600-seasons-in-the-abyss.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12600-slayer-seasons-in-the-abyss.php", "aoty_critic_score": 71, "aoty_user_score": 84, "mbid": "8a38a60c-d5ea-3c57-907b-c3bae54247bb", "yt_id": "V_vM2nGkRkI", "rym": "https://rateyourmusic.com/release/album/slayer/seasons-in-the-abyss", "genres": [], "desc_lfm_album": "Seasons in the Abyss is the fifth studio album by the thrash metal band Slayer. It was released in 1990 through Def American Records, and later through American Recordings after the company changed its name. It was Dave Lombardo's last studio album with Slayer, until his return in 2006 with the release of Christ Illusion. Seasons in the Abyss is Slayer's third major record label release. Seasons in the Abyss is one of few albums to be issued with a Parental Advisory label despite the virtual absence of profanity unlike other Slayer albums, though the lyrics depict violent acts. .", "desc_lfm_artist": "Slayer is an American thrash metal band from Huntington Park, California, formed in 1981 by Kerry King, Jeff Hanneman, Dave Lombardo, and Tom Araya. The band became known for a fast and aggressive style that placed it among the big four of thrash metal alongside Metallica, Megadeth, and Anthrax. The lineup later included Paul Bostaph on drums and Gary Holt on guitar; Holt initially joined as a touring member in 2011 and became a permanent member following Hanneman’s death in 2013. Drummer Jon Dette is a former member.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 412, "title": "Rust in Peace", "artist": "Megadeth", "year": 1990, "cover": "https://dn710907.ca.archive.org/0/items/mbid-e68c6a5e-0773-4b5c-bb66-b6f032bb2db4/mbid-e68c6a5e-0773-4b5c-bb66-b6f032bb2db4-12663594543.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4131-megadeth-rust-in-peace.php", "aoty_critic_score": 84, "aoty_user_score": 87, "mbid": "19e7c9f3-7c4c-3a56-ba50-4156b39f76ca", "yt_id": "Ti_imhKBjXA", "rym": "https://rateyourmusic.com/release/album/megadeth/rust-in-peace", "genres": ["heavy metal", "metal", "technical thrash metal", "thrash metal", "Metal"], "desc_lfm_album": "Rust in Peace is the fourth studio album by American thrash metal band Megadeth. It was released by Capitol Records in 1990. A remixed and remastered version, featuring several bonus tracks, was released in 2004. Singles featured on the album include \"Holy Wars...The Punishment Due\", and \"Hangar 18\", both of which were made into music videos. This was the first Megadeth album to feature Marty Friedman and Nick Menza. Production After being released from a twelve-step program, Megadeth frontman Dave Mustaine had hired drummer Nick Menza and guitarist Marty Friedman to record Rust in Peace, creating what would become the .", "desc_lfm_artist": "Megadeth is an American thrash metal band formed in Los Angeles in 1983 by vocalist and guitarist Dave Mustaine. The group is known for complex guitar work and precise musicianship and is regarded as one of the big four bands of American thrash metal along with Slayer, Anthrax and Metallica. Its music features fast rhythm sections, dual lead guitars and lyrics addressing topics such as war, politics, religion, mortality and personal relationships.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 413, "title": "Heaven or Las Vegas", "artist": "Cocteau Twins", "year": 1990, "cover": "https://dn710700.ca.archive.org/0/items/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e-7946180530.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4594-cocteau-twins-heaven-or-las-vegas.php", "aoty_critic_score": 85, "aoty_user_score": 90, "mbid": "12fab6b9-4eaf-33b0-963e-cae03ac332fe", "yt_id": "PbbUeLkZt74", "rym": "https://rateyourmusic.com/release/album/cocteau-twins/heaven-or-las-vegas", "genres": ["alternative rock", "shoegaze", "dream pop", "ethereal wave", "ambient pop", "Punk"], "desc_lfm_album": "Heaven or Las Vegas is the sixth album by Scottish band Cocteau Twins, their last for the music label 4AD. In terms of chart positions, it was the most successful Cocteau Twins album, reaching No. 7 in the UK. Despite 4AD president Ivo Watts-Russell proclaiming it one of the best-ever releases on his label, he released the group from their contract at the end of 1990 because his relationship with the band had soured. The album is noteworthy for the musical evolution that the band displayed at the time. The lyrics of vocalist Elizabeth Fraser were more intelligible; many concerned .", "desc_lfm_artist": "Cocteau Twins was a Scottish rock band active from 1979 to 1997. The group was formed in Grangemouth, Scotland, by Robin Guthrie (guitar, drum machine) and Will Heggie (bass), with Elizabeth Fraser (vocals) joining in 1981. In 1983, Heggie was replaced by multi-instrumentalist Simon Raymonde, completing the lineup most associated with the band’s career. Cocteau Twins became known for their ethereal, heavily layered sound and Fraser’s distinctive soprano vocal style, often featuring lyrics that avoid conventional language.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 414, "title": "Painkiller", "artist": "Judas Priest", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/22381-painkiller_233811.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22381-judas-priest-painkiller.php", "aoty_critic_score": 75, "aoty_user_score": 86, "mbid": "384f9bb3-6437-386f-8f1e-ff7c1b772455", "yt_id": "oiCEeruRuB0", "rym": "https://rateyourmusic.com/release/album/judas-priest/painkiller", "genres": ["Metal", "Rock"], "desc_lfm_album": "Painkiller is a 1990 gold-certified album by Judas Priest, their 12th studio album. The album was recorded at Miraval Studios, Brignoles, France in early 1990, and mixed at Wisseloord Studios, Hilversum, the Netherlands later that year. It was the first album with drummer Scott Travis. The original LP, cassette and CD versions were released on September 3, 1990. A re-mastered CD was released in May 2001. The album received a Grammy nomination for Best Metal Performance at the February 20, 1991 33rd Annual Grammy Awards. Following the poor sales of the album Ram It Down, which was itself an attempt .", "desc_lfm_artist": "Judas Priest is an English heavy metal band formed in Birmingham in 1969. They have sold over 50 million albums and are considered a significant influence within the heavy metal genre. The band has been associated with the new wave of British heavy metal movement and has influenced various metal subgenres, including speed metal, thrash metal, and power metal, as well as aspects of the hard rock and glam metal scenes of the 1980s. Despite producing innovative music in the latter half of the 1970s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "sdecandelario"]}, {"n": 415, "title": "Soundtrack from Twin Peaks", "artist": "Angelo Badalamenti", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9990-soundtrack-from-twin-peaks.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9990-angelo-badalamenti-soundtrack-from-twin-peaks.php", "aoty_critic_score": 80, "aoty_user_score": 90, "mbid": "d76e8ddb-ee99-3f9e-baf5-a66123a18774", "yt_id": "nVM9GzUvEeA", "rym": null, "genres": [], "desc_lfm_album": "Soundtrack from Twin Peaks is a soundtrack album by American composer Angelo Badalamenti, released on September 11, 1990, via Warner Bros. Records. It is the official soundtrack to the television series Twin Peaks. Though mostly instrumental, three tracks feature vocals by Julee Cruise. Soundtrack from Twin Peaks was produced by David Lynch, one of the series' co-creators, in collaboration with Badalamenti. Lynch also wrote lyrics for various tracks, including the iconic theme song \"Falling\". Upon its release, the album achieved international chart success, reaching the top 10 in countries like Norway, Sweden, Australia, and the Netherlands. Additionally, the \"Twin Peaks .", "desc_lfm_artist": "Angelo Daniel Badalamenti (22 March 1937 – 11 December 2022) was an American composer and arranger best known for his film and television scores, particularly his collaborations with director David Lynch. His most notable works include the music for \"Blue Velvet\" (1986), \"Twin Peaks\" (1990–1991; 2017), \"Twin Peaks: Fire Walk with Me\" (1992), \"The Straight Story\" (1999), and \"Mulholland Drive\" (2001).\n\nBadalamenti also composed scores for other films such as \"National Lampoon's Christmas Vacation\" (1989)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 416, "title": "Facelift", "artist": "Alice in Chains", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4842-facelift_234111.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4842-alice-in-chains-facelift.php", "aoty_critic_score": 70, "aoty_user_score": 81, "mbid": "7d026b9c-9159-34b5-a40d-14f134718394", "yt_id": "forDj7SnJOs", "rym": "https://rateyourmusic.com/release/album/alice-in-chains/facelift", "genres": ["Metal", "Alternative Rock"], "desc_lfm_album": "Facelift is the debut album by the grunge band Alice in Chains. The album was released on August 21, 1990. It was also the first grunge album to reach the top 50 in America on the Billboard 200, and second to Soundgarden's Louder Than Love to reach number 1 on Heatseekers, thanks mainly to the hit songs \"We Die Young\" and \"Man in the Box\". The album has been certified 2x platinum by the RIAA for sales of two million copies in the United States. The album is featured in Rock Band 2, which incorrectly labeled the year for the .", "desc_lfm_artist": "Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style", "desc_mb_album": "", "desc_mb_artist": "Originally named ‘Diamond Lie’. Following the addition of Layne Staley, they were also periodically named ‘Mothra’ and ‘Fuck’ (amongst other names) until settling on ‘Alice in Chains’, after Staley’s [artist:5ec4ba3a-83b9-4623-9f63-8a1e3cfa1de5|old band].", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 417, "title": "Bossanova", "artist": "Pixies", "year": 1990, "cover": "https://ia601509.us.archive.org/23/items/mbid-7cc0bcbf-eb04-479c-bbf5-ca237021c492/mbid-7cc0bcbf-eb04-479c-bbf5-ca237021c492-33166933465.png", "aoty_url": "https://www.albumoftheyear.org/album/4352-pixies-bossanova.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "e062f23a-ed81-3baf-8f24-8979fef060cc", "yt_id": "V27ISDEbZ_Y", "rym": "https://rateyourmusic.com/release/album/pixies/bossanova", "genres": ["alternative rock", "indie rock", "surf rock", "Rock", "Alternative Rock"], "desc_lfm_album": "Bossanova is the third album by the American alternative rock band Pixies, released in August 1990 on the English independent record label 4AD. All of Bossanova's original material was written by the band's frontman Black Francis; it marked the point where his artistic control over the band became absolute. The album's sound, inspired by surf and space rock, complements its lyrical focus on outer space, which references subjects such as aliens and unidentified flying objects. Because of 4AD's independent status, major label Elektra Records handled distribution in the United States; however, Bossanova only reached #70 on the Billboard 200. It .", "desc_lfm_artist": "Pixies is an American alternative rock band which formed in Boston, Massachusetts, United States in 1986. The band consists of Charles (Black Francis) Thompson IV (vocals, guitar; also known as ''Frank Black''), Joey Santiago (lead guitar),   David Lovering (drums) and Emma Richardson (bass, vocals). Until 2013, the band also featured  Kim Deal on bass and vocals. From 2016 until 2024 the band also featured Paz Lechantin on bass and vocals.   The band officially split in 1993  and reunited in 2004.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 418, "title": "Canción Animal", "artist": "Soda Stereo", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/49940-cancion-animal.jpg", "aoty_url": "https://www.albumoftheyear.org/album/49940-soda-stereo-cancion-animal.php", "aoty_critic_score": 80, "aoty_user_score": 84, "mbid": "fdf231ee-2d2b-3238-8adc-352475606e6a", "yt_id": "jzLVaylmbJU", "rym": null, "genres": [], "desc_lfm_album": "Canción Animal (Spanish for Animal Song) is the fifth album released by the Argentine rock band Soda Stereo, released in December, 1990. Many of the songs on the album are among the band's most popular, such as one of their biggest hits \"De Música Ligera\", the last song played in Soda Stereo's last concert in 1997, \"Cae El Sol\", \"Un Millón de Años Luz\", and others. Is considered one of the best and most influential albums in the history of Latin America, for many people it is simply the best album ever to come out of South America, because of .", "desc_lfm_artist": "Soda Stereo was a rock power trio formed in Buenos Aires, Argentina in 1982. Consisting of guitarist and vocalist Gustavo Cerati, bassist Zeta Bosio and drummer Charly Alberti, the band established what would become the template for many other popular Spanish-speaking pop and rock music groups: Clever, often mysterious lyrics, pleasing musical arrangements and an elaborate and glamorous aesthetic image.\n\nThough nominally thought of as a new wave or alternative rock group", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 419, "title": "Cowboys from Hell", "artist": "Pantera", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6977-cowboys-from-hell_175020.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6977-pantera-cowboys-from-hell.php", "aoty_critic_score": 85, "aoty_user_score": 80, "mbid": "a0398241-a842-3593-83b4-a1aa1df23328", "yt_id": "xolAPOWtYVE", "rym": null, "genres": ["Metal"], "desc_lfm_album": "Cowboys from Hell is Pantera's fifth album and their first Atco Records album, released on July 24, 1990. This was their first commercially successful album, exposing the band's choppy rhythms and dissonant vocals to mainstream audiences for the first time. Cowboys from Hell is seen as Pantera's \"official\" debut by most fans, as well as the band itself as they left behind their glam metal past and began to exhibit a more groove metal-oriented sound. The album was available on tape, CD, vinyl and a Limited Edition version (Same album but in a long box). Soon after its release, a .", "desc_lfm_artist": "Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 420, "title": "Goo", "artist": "Sonic Youth", "year": 1990, "cover": "https://ia800309.us.archive.org/13/items/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060-13523354678.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4599-sonic-youth-goo.php", "aoty_critic_score": 81, "aoty_user_score": 83, "mbid": "8114542a-d659-3b5f-a11f-cf86ed7fa84d", "yt_id": "k_1rqDKM_0E", "rym": "https://rateyourmusic.com/release/album/sonic-youth/goo-29", "genres": ["experimental rock", "alternative rock", "noise rock", "no wave", "new wave", "indie rock"], "desc_lfm_album": "Goo is the sixth full-length studio album by American alternative rock band Sonic Youth, released on June 26, 1990 by DGC Records. For this album, the band sought to expand upon its trademark alternating guitar arrangements and the layered sound of their previous album Daydream Nation (1988) with songwriting on that was more topical than past works, exploring themes of female empowerment and pop culture. Coming off the success of Daydream Nation, Nick Sansano returned to engineer Goo, but veteran producer Ron Saint Germain was chosen by Sonic Youth to finish mixing the album following Sansano's dismissal. Goo was a .", "desc_lfm_artist": "Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups", "desc_mb_album": "", "desc_mb_artist": "Sonic Youth were a four-piece band from New York. Emerging from the no-wave movement, their experimental noise distinguished them from other underground bands of the 1980s. Their signing to DGC in 1990 was unusual in the creative freedom given in the contract, and proved that it was possible to remain true to an independent ethic while on a major label.\r\nSee also [http://musicbrainz.org/show/artist/?artistid=58284|Ciccone Youth].", "heard_by": ["BipolarMuzik", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 421, "title": "Left Hand Path", "artist": "Entombed", "year": 1990, "cover": "https://cdn2.albumoftheyear.org/600x0/album/37824-left-hand-path.jpg", "aoty_url": "https://www.albumoftheyear.org/album/37824-entombed-left-hand-path.php", "aoty_critic_score": 70, "aoty_user_score": 84, "mbid": "3f5ce50c-78a7-30f8-8a03-34b3d7aea9b9", "yt_id": "KeB1Rp6XAJQ", "rym": "https://rateyourmusic.com/release/album/entombed/left-hand-path/", "genres": ["Metal", "Rock", "Punk"], "desc_lfm_album": "Left Hand Path is the debut album from Entombed from 1990 that is known for defining the style of Swedish death metal by being the first recording to use the Tomas Skogsberg/Sunlight Studios \"buzzsaw\" guitar tone. The tone was created by heavily detuned electric guitars used with a maxed out Boss HM-2 Heavy Metal Pedal and a Boss DS-1 Distortion on a Peavey 40 watt Bandit amp. The originator of this guitar tone was Nihilist guitarist Leffe Cuzner. The album's liner notes give thanks to Nirvana, but the band in question is the Swedish death metal group Nirvana 2002, not .", "desc_lfm_artist": "Entombed is a death metal band from Stockholm, Sweden which formed in 1989 after the dissolution of Nihilist. Though Entombed began their career as an early pioneer of Scandinavian death metal, by the early 1990s their sound had broadened to include groove metal, alternative metal and hard rock.\n\nEntombed's debut album was Left Hand Path, a cult favorite that established the band as a popular death metal band. The follow-up, Clandestine, was just as popular.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario"]}, {"n": 422, "title": "AmeriKKKa’s Most Wanted", "artist": "Ice Cube", "year": 1990, "cover": "https://dn710609.ca.archive.org/0/items/mbid-a2c3b6a9-91ea-4e38-9d12-7590b76aab76/mbid-a2c3b6a9-91ea-4e38-9d12-7590b76aab76-13313905422.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "f7e8792d-4aaf-389c-b0e5-a4bbae2bacdf", "yt_id": "DbG2ySZ6uNA", "rym": "https://rateyourmusic.com/release/album/ice-cube/amerikkkas-most-wanted-9", "genres": ["hip hop", "west coast hip hop", "gangsta rap", "hardcore hip hop"], "desc_lfm_album": "AmeriKKKa's Most Wanted is rapper Ice Cube's influential debut solo album, released after his acrimonious split from his former group N.W.A. It was originally released on May 16, 1990. Primarily produced by The Bomb Squad (Public Enemy's production team), the album was an unexpectedly large critical and commercial success, and remains one of the defining hip hop albums of the 1990s. After departing from Ruthless Records and the west coast-based group N.W.A., Ice Cube immediately moved to record his own album. Linking up with Sir Jinx, the cousin of N.W.A. producer Dr. Dre, Cube made use of pre-written notebooks comprised .", "desc_lfm_artist": "O'Shea Jackson Sr. (born June 15, 1969), known professionally as Ice Cube, is an American rapper and actor. He began his career as a member of the hip-hop group C.I.A. and later joined the seminal rap group N.W.A (Niggaz Wit Attitudes). After leaving N.W.A in December 1989, he began both a successful solo music career and an acting career which included roles in films such as Boyz n the Hood (1991), Friday (1995), for which he also co-wrote the screenplay, and Barbershop (2002).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72"]}, {"n": 423, "  "desc_lfm_artist": "Public Enemy are an American hip hop group formed by Chuck D and Flavor Flav in Long Island, New York, in 1985. The group rose to prominence for their political messages including subjects such as American racism and the American media. Their debut album, Yo! Bum Rush the Show, was released in 1987 to critical acclaim, and their second album, It Takes a Nation of Millions to Hold Us Back (1988), was the first hip hop album to top The Village Voice's Pazz & Jop critics' poll.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "armandwave", "sdecandelario"]}, {"n": 426, "title": "People’s Instinctive Travels and the Paths of Rhythm", "artist": "A Tribe Called Quest", "year": 1990, "cover": "https://dn710608.ca.archive.org/0/items/mbid-0d03d65f-69d2-4bc0-bd98-cfd94449c06a/mbid-0d03d65f-69d2-4bc0-bd98-cfd94449c06a-10824837106.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "02adb8a7-496c-3a9a-a324-662df73fdba5", "yt_id": "2tsKiGQi-zs", "rym": "https://rateyourmusic.com/release/album/a-tribe-called-quest/peoples-instinctive-travels-and-the-paths-of-rhythm", "genres": ["psychedelic", "hip hop", "jazz rap", "east coast hip hop", "conscious hip hop", "boom bap"], "desc_lfm_album": "", "desc_lfm_artist": "A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 427, "title": "Violator", "artist": "Depeche Mode", "year": 1990, "cover": "https://dn710309.ca.archive.org/0/items/mbid-5454efa9-445a-4b73-8d16-e9fdbf022119/mbid-5454efa9-445a-4b73-8d16-e9fdbf022119-18529866710.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5347-depeche-mode-violator.php", "aoty_critic_score": 84, "aoty_user_score": 88, "mbid": "71f1482e-e63f-3b2c-811b-939f62708f2a", "yt_id": "NF9Pc2FvgQU", "rym": "https://rateyourmusic.com/release/album/depeche-mode/violator", "genres": ["synth-pop", "alternative dance"], "desc_lfm_album": "Violator is the seventh album by the English synthpop group Depeche Mode, released by Mute in 1990. Preceded by the hit singles Personal Jesus and Enjoy the Silence (a Top 10 hit on both sides of the Atlantic), Violator propelled the band into international stardom. The album yielded two further hit singles, Policy of Truth and World in My Eyes. This album is the first of the band to achieve the Top 10 on the Billboard 200 (number seven) and stand 74 weeks in the chart. In 2003, the album was ranked number 342 on Rolling Stone magazine's list of .", "desc_lfm_artist": "Depeche Mode is an English synthpop band formed in Basildon, Essex in 1980. The original lineup included Dave Gahan, Martin Gore, Andy Fletcher, and Vince Clarke. The current lineup consists of Gahan and Gore.\n\nWith Clarke as their primary songwriter, Depeche Mode released their debut album \"Speak & Spell\" in 1981 during the British new wave movement. Clarke left the band at the end of 1981 and later formed the groups Yazoo and Erasure. Following his departure", "desc_mb_album": "While not always printed on physical releases, ''Interlude #2: Crucified'' and ''Interlude #3'' are consistently included in track lists on the band's [https://archives.depechemode.com/discography/albums/11_violator.html|official discography page], and so may be treated as hidden tracks.", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 428, "title": "Naked City", "artist":
