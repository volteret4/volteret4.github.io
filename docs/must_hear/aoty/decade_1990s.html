pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 333, "title": "Siamese Dream", "artist": "Smashing Pumpkins", "year": 1993, "cover": "https://ia601400.us.archive.org/34/items/mbid-c8499dc3-843e-473e-9672-9ee95ec9d694/mbid-c8499dc3-843e-473e-9672-9ee95ec9d694-38221046992.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a159e102-18bb-42ca-a59e-5f96a7eff241", "yt_id": "rmJH1-tjovw", "rym": "https://rateyourmusic.com/release/album/smashing-pumpkins/siamese-dream", "genres": ["alternative rock", "shoegaze", "dream pop", "grunge", "post-grunge"], "desc_lfm_album": "", "desc_lfm_artist": "The Smashing Pumpkins are an influential American alternative rock band, formed in Chicago, Illinois in 1988. Billy Corgan and James Iha met in a record store, and began performing in local nightclubs with their bassist, D'arcy Wretzky, using a drum machine. Playing with a drum machine frustrated both the band and their audience, and so Chicago jazz drummer Jimmy Chamberlin was hired soon afterwards.\n\nLess influenced by punk than many of their contemporaries", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "sdecandelario", "verygooood"]}, {"n": 334, "title": "Black Sunday", "artist": "Cypress Hill", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8049-black-sunday.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8049-cypress-hill-black-sunday.php", "aoty_critic_score": 80, "aoty_user_score": 80, "mbid": "fe860e74-7eb8-4bc3-8b8d-cbf621aed500", "yt_id": "ARGFhMihDsQ", "rym": "https://rateyourmusic.com/release/album/cypress-hill/black-sunday", "genres": ["Metal", "Hip-Hop"], "desc_lfm_album": "Black Sunday is the second album by rap group Cypress Hill. It was released on July 20, 1993. It debuted at number one on the Billboard 200, recording the highest Soundscan for a rap group at the time. The album went double Platinum in the U.S. The first single, \"Insane in the Brain,\" became a crossover hit, initiating their following among rock audiences. The song \"Hits from the Bong\" was used in the movie How High. A censored version of the album was also made which removes the song \"A To The K\". The booklet to the album contains 19 .", "desc_lfm_artist": "Cypress Hill is an American hip-hop group from South Gate, California. Cypress Hill was the first latino group to have platinum and multi-platinum albums and one of the first rap groups to gain a following with fans of hard rock and metal. The band was originally called DVX, but the name was changed after Mellow Man Ace left in 1988.\n\nTheir first album, which was self-titled, was released in August 1991. Its single was \"Phuncky Feel One\", but it was", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 335, "title": "Fake Train", "artist": "Unwound", "year": 1993, "cover": "https://dn711104.ca.archive.org/0/items/mbid-a83e740b-8e53-4391-b50a-1bd08b7d06ee/mbid-a83e740b-8e53-4391-b50a-1bd08b7d06ee-27044971526.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53241-unwound-fake-train.php", "aoty_critic_score": 60, "aoty_user_score": 83, "mbid": "e1ea84db-78fd-3ca6-8cb8-998e08e81802", "yt_id": "4EPWEVlSo7Q", "rym": "https://rateyourmusic.com/release/album/unwound/fake-train", "genres": ["noise rock", "post-hardcore", "emocore", "Rock", "Punk"], "desc_lfm_album": "Fake Train is the second recorded studio album by the American post-hardcore band Unwound, (the first released, as the self-titled album, Unwound, was recorded first). The album was released on July 7, 1993 by Kill Rock Stars. The album marks the debut of Sara Lund, who became the band’s longest serving and last drummer. While being the first studio album in the band's catalog to be released, and the first LP on Kill Rock Stars, it is actually the second album by the group to be recorded. Their first full-length was recorded in 1992 with drummer Brandt Sandeno, who left .", "desc_lfm_artist": "Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "paqueradejere", "sdecandelario"]}, {"n": 336, "title": "Debut", "artist": "Björk", "year": 1993, "cover": "https://dn710604.ca.archive.org/0/items/mbid-bc9c06da-0be8-4e01-93a3-9a41261a8de3/mbid-bc9c06da-0be8-4e01-93a3-9a41261a8de3-35378638607.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4511-bjork-debut.php", "aoty_critic_score": 72, "aoty_user_score": 82, "mbid": "6891a28c-5865-36e2-9e5f-c9fac1d3595f", "yt_id": "fW7AUFadFGo", "rym": "https://rateyourmusic.com/release/album/bjork/debut", "genres": ["electro", "art pop", "alternative dance", "dance-pop", "house", "diva house"], "desc_lfm_album": "Debut is the international debut studio album by Icelandic recording artist Björk, released in July 1993 by One Little Indian and Elektra Entertainment. It was produced by Björk and Nellee Hooper. It was Björk's first recording following the dissolution of her previous band, the Sugarcubes. The album departed from the rock style of her previous work and drew from an eclectic variety of styles, including electronic pop, house music, jazz and trip hop. Debut received critical acclaim from British music critics, though American reviews were mixed. It exceeded sales expectations, charting at number two in Iceland, three in the United .", "desc_lfm_artist": "Björk Guðmundsdóttir (born 21 November 1965), known mononymously as Björk, is an Icelandic singer, songwriter, composer, record producer, and actress. Recognised for her distinctive voice, three-octave vocal range, and unconventional public image, she has developed an eclectic musical style over a career spanning five decades, incorporating elements of electronic, pop, dance, trip hop, jazz, and avant-garde music. She is widely regarded as an influential figure in electronic and experimental music.", "desc_mb_album": "The initial CD was released with 11 tracks (standard and limited) in July 1993. Later in November a 12-track edition (with \"Play Dead\" as a bonus track) was released in multiple variations of pressings, most sharing cat# and barcode. They need to be separated using a combination of information found on the back, in the booklet and on the CD to identify a particular release. Additionally a 1-minute silent pre-gap to the bonus track 12 \"Play Dead\" (causing a track 11 duration of 4:32) was added to some versions without any visible difference in artwork.\n== How to distinguish releases: ==\n=== tplp 31 cdx / 5016958020620 ===\nIdentifiers:\n'''Silence:''' One minute silence after \"The Anchor Song\" (track 11 approx. 4:32 / on some later versions a reduced silence of 10 seconds was appended)\n'''Sam", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 337, "title": "In On The Killtaker", "artist": "Fugazi", "year": 1993, "cover": "https://i.discogs.com/YZPTzPg_W70Vf20kE1Ym7ucyp-N7gksAMoUWZcjUg28/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTEzNDg5/ODIzLTE1NTUyMjYz/NDItMjI4NC5qcGVn.jpeg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3e65d48b-804d-3e6b-8d52-558ee8e1850c", "yt_id": "v8Pf1jwMCuo", "rym": "https://rateyourmusic.com/release/album/fugazi/in-on-the-kill-taker", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Fugazi was an American post-hardcore band formed in Washington, D.C., in 1986. The band consists of guitarists and vocalists Ian MacKaye and Guy Picciotto, bassist Joe Lally, and drummer Brendan Canty. They are noted for their style-transcending music, DIY ethical stance, manner of business practice and contempt for the music industry.\n\nSince its inception, Fugazi has been self-managed and have released almost all their material through Dischord Records, an independent label founded by MacKaye and partner Jeff Nelson in 1980.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["paqueradejere", "sdecandelario", "verygooood"]}, {"n": 338, "title": "Exile in Guyville", "artist": "Liz Phair", "year": 1993, "cover": "https://dn710708.ca.archive.org/0/items/mbid-b08b6174-7f4d-4064-a4d8-b6824e0dc1c3/mbid-b08b6174-7f4d-4064-a4d8-b6824e0dc1c3-40884043837.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4351-liz-phair-exile-in-guyville.php", "aoty_critic_score": 90, "aoty_user_score": 81, "mbid": "c186db82-9988-367e-8486-2e38e9b6c8db", "yt_id": "lROHqnlVE2g", "rym": "https://rateyourmusic.com/release/album/liz-phair/exile-in-guyville", "genres": ["alternative rock", "indie rock"], "desc_lfm_album": "Exile in Guyville is the debut studio album by American singer-songwriter Liz Phair, released on June 22, 1993, by Matador Records. It was recorded at Idful Music Corporation in Chicago between 1991 and 1993 and produced by Phair and Brad Wood. The album received critical acclaim for its ability to combine indie rock and lo-fi music and the concept behind it; in 2020, it was ranked No. 56 by Rolling Stone in its 500 Greatest Albums of All Time list. It was certified gold in 1998 and as of July 2010 it had sold 491,000 copies. .", "desc_lfm_artist": "Elizabeth Clark Phair is an American singer and songwriter. Born in New Haven, Connecticut, Phair was raised primarily in the Chicago area. After graduating from Oberlin College in 1990, she attempted to start a musical career in San Francisco, California, but returned to her home in Chicago, where she began self-releasing audio cassettes under the name Girly-Sound. The tapes led to a recording contract with the independent record label Matador Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 339, "title": "Individual Thought Patterns", "artist": "Death", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/38700-individual-thought-patterns_152504.jpg", "aoty_url": "https://www.albumoftheyear.org/album/38700-death-individual-thought-patterns.php", "aoty_critic_score": 83, "aoty_user_score": 86, "mbid": "94554b6c-2d9e-3174-89f0-94aec0b285e9", "yt_id": "yjLIwidBubg", "rym": "https://rateyourmusic.com/release/album/death/individual-thought-patterns", "genres": ["Metal"], "desc_lfm_album": "Individual Thought Patterns is the fifth studio album by American death metal band Death, released on June 22, 1993, by Relativity Records. It is the only album by the band to feature guitarist Andy LaRocque, the first to feature drummer Gene Hoglan and the second and last to feature bassist Steve DiGiorgio. .", "desc_lfm_artist": "There are multiple artists sharing the name Death; \n\n1) A pioneering death metal band from Altamonte Springs, Florida, U.S. \n2) A protopunk band from Detroit, Michigan, U.S. \n3) A horrorcore rapper from New Orleans, Louisiana, U.S. \n4) A hard techno producer from Germany. \n\n1)  Death was an American death metal band formed in Altamonte Springs, Florida in 1984 by guitarist and vocalist Chuck Schuldiner. Death is considered to be among the most influential", "desc_mb_album": "", "desc_mb_artist": "The band was originally started as [http://musicbrainz.org/show/artist/relationships.html?artistid=602427|Mantas] in 1983 and changed its name to Death a year later.", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 340, "title": "Emergency on Planet Earth", "artist": "Jamiroquai", "year": 1993, "cover": "https://dn710302.ca.archive.org/0/items/mbid-be5efb0f-b354-3071-a41f-e8784403ea8d/mbid-be5efb0f-b354-3071-a41f-e8784403ea8d-2479394930.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9358-jamiroquai-emergency-on-planet-earth.php", "aoty_critic_score": 73, "aoty_user_score": 82, "mbid": "07d5dcac-a3a5-3691-9a88-44bff141aecb", "yt_id": "FLQ4sfq1NZ8", "rym": "https://rateyourmusic.com/release/album/jamiroquai/emergency-on-planet-earth", "genres": ["funk", "acid jazz", "neo soul", "Jazz"], "desc_lfm_album": "Originally released in 1993. .", "desc_lfm_artist": "Jamiroquai are an English acid jazz and funk band formed in London in 1992. The group is led by vocalist Jay Kay, who has remained the sole consistent member throughout multiple lineup changes. They initially became associated with the London acid jazz movement of the early 1990s and later incorporated influences from rock, disco, electronic music, and Latin styles. Their lyrics have frequently focused on social and environmental themes.\n\nJamiroquai first recorded under Acid Jazz Records before signing with Sony", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 341, "title": "Souvlaki", "artist": "Slowdive", "year": 1993, "cover": "https://dn710300.ca.archive.org/0/items/mbid-12694708-e437-4874-a5d4-c1ca0ec46313/mbid-12694708-e437-4874-a5d4-c1ca0ec46313-16656091378.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7971-slowdive-souvlaki.php", "aoty_critic_score": 75, "aoty_user_score": 88, "mbid": "46482030-ef12-319c-9c5a-5d04c39d574b", "yt_id": "U6WnPceijEA", "rym": "https://rateyourmusic.com/release/album/slowdive/souvlaki", "genres": ["alternative rock", "psychedelic", "shoegaze", "dream pop", "rock", "Pop"], "desc_lfm_album": "Souvlaki is the second studio album by English shoegaze band Slowdive, released on June 1, 1993, via Creation Records. The album's title was taken from a skit by comedy duo The Jerky Boys, where one of the duo prank calls a hotel manager asking him to perform sexual acts on his wife. Upon learning the manager is Greek, the caller says: \"My wife loves that Greek shit... She'll suck your cock like souvlaki\". While touring Europe in early 1992, Slowdive began working on their next record, Souvlaki, writing and recording in mutiple sessions, a reported total of 40 songs were .", "desc_lfm_artist": "Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon replaced Scott from 1994-1995.", "desc_mb_album": "", "desc_mb_artist": "'''Slowdive''' disbanded in 1995, reunited in 2014.", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 342, "title": "Red House Painters (Rollercoaster)", "artist": "Red House Painters", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7374-red-house-painters-rollercoaster_180114.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7374-red-house-painters-red-house-painters-rollercoaster.php", "aoty_critic_score": 89, "aoty_user_score": 84, "mbid": null, "yt_id": "RNgDSscOKhk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Red House Painters was a slowcore band from San Francisco, CA, United States, formed in 1988 by singer/songwriter Mark Kozelek, who is currently active in the band Sun Kil Moon, with part of the original RHP line-up.\n\nThe band is described, along with Low and American Music Club, as one of the linchpins of the slowcore movement, a subgenre of Indie Rock characterized by downbeat melodies, slow tempos, and often minimalist arrangements. The genre was shaped by musical influences like Folk Rock", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 343, "title": "Orbital", "artist": "Orbital", "year": 1993, "cover": "https://dn710707.ca.archive.org/0/items/mbid-7d555dea-df25-49f3-b725-51cd193f1485/mbid-7d555dea-df25-49f3-b725-51cd193f1485-8235307243.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "ce8ac428-e056-3c57-b80f-bf05c4cbc9ea", "yt_id": "4PG5PCd284o", "rym": null, "genres": ["electronica", "ambient techno", "techno"], "desc_lfm_album": "Orbital is the first album from Orbital, released in 1991. It is often referred to as the \"Green Album\", to differentiate it from the band's second album, titled Orbital 2 (known as the \"Brown Album\"), which bears only the band's name on the cover. The original United Kingdom release includes live versions of \"Chime\" and \"Midnight\". Orbital was released in 1992 with a significantly different cover and tracklist in the United States, incorporating remixes and non-album singles. All tracks on the U.S. release had also been remastered using the Bedini Audio Spectral Enhancer (B.A.S.E.) to enhance their stereophonic effects. Samples .", "desc_lfm_artist": "Orbital is an electronic music duo consisting of brothers Phil Hartnoll and Paul Hartnoll formed in Sevenoaks, Kent, England in 1989.  Orbital take their name from Greater London's orbital motorway, the M25, which was central to the early rave scene and party network in the South East during the early days of acid house. One of the biggest names in British electronica during the 1990s, Orbital were both critically and commercially successful, being particularly known for an element of live improvisation during their shows", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 344, "title": "janet.", "artist": "Janet", "year": 1993, "cover": "https://ia600702.us.archive.org/30/items/mbid-3b60acb9-afb8-4be6-a0dd-3bcd11731924/mbid-3b60acb9-afb8-4be6-a0dd-3bcd11731924-36846971276.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "785e1f49-f5b7-3ca3-a58e-e138a0e5e531", "yt_id": "ymt-jFw1tUo", "rym": null, "genres": ["r&b", "contemporary r&b", "hip hop", "dance-pop"], "desc_lfm_album": "", "desc_lfm_artist": "1. \nJanet Jackson\nJanet Damita Jo Jackson (born May 16, 1966) is an American singer, songwriter, actress, and dancer. She is noted for her innovative, socially conscious and sexually provocative records, as well as elaborate stage shows. Her sound and choreography became a catalyst in the growth of MTV, enabling her to rise to prominence while breaking gender and racial barriers in the process. Lyrical content that focused on social issues and lived experiences set her reputation as a role model for youth.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 345, "title": "Jazzmatazz Volume 1", "artist": "Guru", "year": 1993, "cover": "https://dn710803.ca.archive.org/0/items/mbid-b249a0bc-6ca9-476c-94c1-67c272ad7a58/mbid-b249a0bc-6ca9-476c-94c1-67c272ad7a58-39617583622.jpg", "aoty_url": "https://www.albumoftheyear.org/album/22883-guru-jazzmatazz-volume-1.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "cb4db891-330d-394d-af54-3edc37e8416e", "yt_id": "zcuKyuDrcoQ", "rym": null, "genres": ["jazz", "hip hop", "jazz rap"], "desc_lfm_album": "", "desc_lfm_artist": "Keith Edward Elam (July 17, 1961 – April 19, 2010) - known professionally as Guru - was one half of the legendary hip hop duo Gang Starr and an accomplished solo artist. Guru, an acronym for Gifted Unlimited Rhymes Universal, originally began his hip hop career in Boston but due to lack of local support moved to New York where Gang Starr then blew up. Guru was well known for his smooth voice; socially conscious and hardcore lyrics; and an effortless, confident delivery.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 346, "title": "Rid of Me", "artist": "PJ Harvey", "year": 1993, "cover": "https://dn721608.ca.archive.org/0/items/mbid-aad52d2a-9502-4644-af00-412e264ffec0/mbid-aad52d2a-9502-4644-af00-412e264ffec0-32841758505.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2333-pj-harvey-rid-of-me.php", "aoty_critic_score": 83, "aoty_user_score": 84, "mbid": "c1bb54cc-751d-300c-ba29-d7502d571c2d", "yt_id": "8PlaNe3mXl8", "rym": "https://rateyourmusic.com/release/album/pj-harvey/rid-of-me", "genres": ["alternative rock", "indie rock", "rock", "Rock", "Alternative Rock"], "desc_lfm_album": "Rid of Me is the second studio album by English singer-songwriter and musician PJ Harvey. It was released on May 4, 1993, via Island Records. The album marked a departure from Harvey's previous songwriting, being more raw and aggressive than its predecessor. Rid of Me was met with critical acclaim and is cited as one of the greatest albums of all time, ranking at number 153 on the 2020 version of Rolling Stone's 500 Greatest Albums of All Time (up from 406 on the list's previous edition). .", "desc_lfm_artist": "Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 347, "title": "Pork Soda", "artist": "Primus", "year": 1993, "cover": "https://dn710800.ca.archive.org/0/items/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d-28985005149.png", "aoty_url": "https://www.albumoftheyear.org/album/19351-primus-pork-soda.php", "aoty_critic_score": 69, "aoty_user_score": 82, "mbid": "83e9f236-6687-3123-ad41-7338f4c22117", "yt_id": "K8WGVYxG5Ng", "rym": "https://rateyourmusic.com/release/album/primus/pork-soda", "genres": ["alternative rock", "funk rock", "heavy metal", "alternative metal", "funk metal", "Alternative Rock"], "desc_lfm_album": "Pork Soda is the third album by Primus. Released in 1993, \"Pork Soda\" is considerably darker than any of the band's earlier efforts, dealing with murder (\"My Name Is Mud\"), dissatisfaction with the human race (\"Nature Boy\", \"Welcome to This World\"), suicide (\"Bob\"), and inconvenient realities of life (\"DMV\"). It was a certified Gold record shortly after its release and is currently certified Platinum; it is Primus' largest seller to date. Track listing # Title Length 1. \"Pork Chop's Little Ditty\" 0:21 2. \"My Name Is Mud\" 4:48 3. \"Welcome to This World\" 3:40 4. \"Bob\" 4:40 5. \"DMV\" 4:58 .", "desc_lfm_artist": "Primus is a San Francisco-based alternative rock band formed in the mid-1980s by bassist Les Claypool and guitarist Todd Huth. Les (vocals and bass guitar) has been the only constant member. They have had two guitar players (although Larry has held onto the role for the past 30 years) and many different drummers (although Tim Alexander, Bryan Mantia and Jay Lane were the only ones who recorded with the band) in the past. \n\nTheir music has proven difficult to define; while usually considered by critics to be funk metal or alternative metal", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 348, "title": "Songs of Faith and Devotion", "artist": "Depeche Mode", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5343-songs-of-faith-and-devotion_215539.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5343-depeche-mode-songs-of-faith-and-devotion.php", "aoty_critic_score": 79, "aoty_user_score": 84, "mbid": "e171597d-e6d5-36c8-8d0e-63daf79796b8", "yt_id": "E_CpLbEJMuo", "rym": "https://rateyourmusic.com/release/album/depeche-mode/songs-of-faith-and-devotion/", "genres": [], "desc_lfm_album": "\"Songs of Faith and Devotion\" is the eighth studio album by English electronic music band Depeche Mode, and the final album produced with Alan Wilder as a member prior to his departure from the group. The album was released in the United Kingdom on 22 March 1993 by Mute Records. Production incorporated more use of organic instrumentals (such as Uillean pipes in \"Judas\" and string quartet in \"One Caress\"), and featured outside singers for the first time (gospel choir in \"Condemnation\"). The album and its subsequent tour marked the darkest and most difficult period for the band members; Dave Gahan .", "desc_lfm_artist": "Depeche Mode is an English synthpop band formed in Basildon, Essex in 1980. The original lineup included Dave Gahan, Martin Gore, Andy Fletcher, and Vince Clarke. The current lineup consists of Gahan and Gore.\n\nWith Clarke as their primary songwriter, Depeche Mode released their debut album \"Speak & Spell\" in 1981 during the British new wave movement. Clarke left the band at the end of 1981 and later formed the groups Yazoo and Erasure. Following his departure", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "MaxtorUwU", "sdecandelario", "verygooood"]}, {"n": 349, "title": "Everybody Else Is Doing It, So Why Can’t We?", "artist": "The Cranberries", "year": 1993, "cover": "https://dn710702.ca.archive.org/0/items/mbid-70224bbb-81f4-3b62-ab31-8d8e415f6667/mbid-70224bbb-81f4-3b62-ab31-8d8e415f6667-10265036337.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e6b486b3-68e7-331c-a078-94fd71d61877", "yt_id": "oTecVrr_3ek", "rym": null, "genres": ["alternative rock", "pop rock", "chamber pop", "dream pop", "alternative pop", "celtic rock"], "desc_lfm_album": "", "desc_lfm_artist": "The Cranberries were an Irish rock band formed in Limerick in 1989. The group consisted of lead vocalist and guitarist Dolores O’Riordan, guitarist Noel Hogan, bassist Mike Hogan, and drummer Fergal Lawler. O’Riordan joined the band in 1990, replacing founding member Niall Quinn, and the group’s name was shortened from The Cranberry Saw Us to The Cranberries following her arrival. Although primarily classified as an alternative rock band, their music incorporated elements of indie rock", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 350, "title": "Under A Funeral Moon", "artist": "Darkthrone", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53669-under-a-funeral-moon_004725.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53669-darkthrone-under-a-funeral-moon.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "f388f4e5-e63d-3659-897e-55165eed4df5", "yt_id": "47jB1-mllWY", "rym": null, "genres": [], "desc_lfm_album": "Under a Funeral Moon is the third album by the Norwegian black metal band, Darkthrone. It was released in July 1993, and marked Darkthrone's complete musical conversion to the black metal style. This album also contained the band’s first Norwegian song. Darkthrone's previous album, A Blaze in the Northern Sky, retained some death metal traits. However, in an interview, Fenriz claimed that they began recording Under a Funeral Moon with the intention of creating a \"pure black metal album.\" For this purpose, the studio production was toned-down to achieve an atmosphere that was more \"cold\" and \"grim\". Fenriz regards the .", "desc_lfm_artist": "Darkthrone is a Norwegian metal band from Kolbotn, Akershus. Formed in 1986 as a death metal band named Black Death, in 1991 Darkthrone embraced a black metal style influenced by Bathory and Celtic Frost and became one of the leading bands in the Norwegian black metal scene. Their first three black metal albums A Blaze in the Northern Sky (1992), Under a Funeral Moon (1993) and Transilvanian Hunger (1994) are sometimes dubbed the \"Unholy Trinity\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario", "verygooood"]}, {"n": 351, "title": "Reachin' (A New Refutation of Time and Space)", "artist": "Digable Planets", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9315-reachin-a-new-refutation-of-time-and-space.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9315-digable-planets-reachin-a-new-refutation-of-time-and-space.php", "aoty_critic_score": 86, "aoty_user_score": 84, "mbid": "2836fcb0-2fd3-3de8-b7cc-53141d666894", "yt_id": "nOpMLmgMPP8", "rym": "https://rateyourmusic.com/release/album/digable-planets/reachin-a-new-refutation-of-time-and-space", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "Reachin' (A New Refutation of Time and Space) is the debut album by alternative hip hop group Digable Planets. It was released on February 9, 1993, by Pendulum/Elektra Records. The single \"Rebirth of Slick (Cool Like Dat)\" became a hit in 1993, breaking into the Top 15 on the Billboard Hot 100 chart and winning Grammy Award for Best Rap Performance by a Duo or Group in 1994. In 1998, Reachin' was listed in the The Source's 100 Best Rap Albums. The album was certified Gold by the RIAA in 1993. In 2008, \"Rebirth of Slick (Cool Like Dat) was .", "desc_lfm_artist": "Digable Planets was a jazz hip-hop group from Brooklyn, New York, United States which formed in 1992. The group consists of rappers Ishmael \"Butterfly\" Butler, Ann \"Ladybug\" Vieira and Craig \"Doodlebug\" Irving, along with DJ King Britt. They are best known for their 1993 single \"Rebirth of Slick (Cool Like Dat)\", which was a success on hip-hop, pop and alternative rock radio in the United States. The group broke up in 1995 and reunited in 2005.\n\nThe group first took shape in the early ‘90s, in New York City.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "verygooood"]}, {"n": 352, "title": "The Chronic", "artist": "Dr. Dre", "year": 1992, "cover": "https://ia800305.us.archive.org/6/items/mbid-0001a90e-252d-3af0-8e1c-173c1c4835c3/mbid-0001a90e-252d-3af0-8e1c-173c1c4835c3-38739120180.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4601-dr-dre-the-chronic.php", "aoty_critic_score": 96, "aoty_user_score": 85, "mbid": "ad444843-7160-33d7-b0c9-fc99f2c14a99", "yt_id": "lFz7oEmabnE", "rym": "https://rateyourmusic.com/release/album/dr-dre/the-chronic", "genres": ["hip hop", "west coast hip hop", "g-funk", "gangsta rap", "Hip-Hop"], "desc_lfm_album": "\"The Chronic\" is the solo debut album of American hip hop artist Dr. Dre, released December 15, 1992, on his own record label Death Row Records, and distributed by Priority Records. Recording sessions for the album took place in June 1992 at Death Row Studios in Los Angeles and at Bernie Grundman Mastering in Hollywood. The album is named after a slang term for high-grade marijuana, and its cover is an homage to Zig-Zag rolling papers. It was recorded by Dr. Dre following his departure from hip hop group N.W.A in April of 1991 and its label Ruthless Records over .", "desc_lfm_artist": "André Romelle Young (born February 18, 1965 in Los Angeles, California), better known by his stage name Dr. Dre, is an American record producer, rapper, actor and record executive. He is the founder and current CEO of Aftermath Entertainment and a former co-owner and artist of Death Row Records, also having produced albums for and overseeing the careers of many rappers signed to those record labels. As a producer he is credited as a key figure in the popularization of West Coast G-funk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "armandwave"]}, {"n": 353, "title": "Bizarre Ride II the Pharcyde", "artist": "The Pharcyde", "year": 1992, "cover": "https://dn710202.ca.archive.org/0/items/mbid-1c6f2a35-4288-4f5d-9eec-97ca32e2a226/mbid-1c6f2a35-4288-4f5d-9eec-97ca32e2a226-32304157771.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4426-the-pharcyde-bizarre-ride-ii-the-pharcyde.php", "aoty_critic_score": 87, "aoty_user_score": 85, "mbid": "c799ef0c-f038-364b-972b-51f52d794781", "yt_id": "hAaQDxpv5X8", "rym": "https://rateyourmusic.com/release/album/the-pharcyde/bizarre-ride-ii-the-pharcyde", "genres": ["alternative hip hop", "hip hop", "boom bap", "west coast hip hop", "Jazz", "Hip-Hop"], "desc_lfm_album": "Bizarre Ride II the Pharcyde is the debut album by alternative hip-hop group The Pharcyde, released on November 24, 1992 through Delicious Vinyl Records. The album is produced by former group member J-Swift, and features only one guest appearance, provided by little-known Los Angeles rapper Bucwheed (known then as \"Buckwheat\" from The Wascals). In the years after its release, Bizarre Ride was hailed by critics and alternative rap fans and appeared in \"best albums\" lists in several publications. Released during the dominant Gangsta rap era of West Coast hip-hop, Bizarre Ride was described as \"refreshing,\" due to its playful, light-hearted .", "desc_lfm_artist": "The Pharcyde (pronounced \"Far Side\") is an American alternative hip-hop group, formed in 1989, from South Central Los Angeles. The original four members of the group are Imani (Emandu Wilcox), Slimkid3 (Trevant Hardson), Bootie Brown (Romye Robinson), and Fatlip (Derrick Stewart). DJ Mark Luv was the group's first disc jockey (DJ), followed by producer J-Swift and then J Dilla.\n\nThe group is perhaps best known for the hit singles \"Drop\", \"Passin' Me By\" and \"Runnin''\", as well as their first album, Bizarre Ride II the Pharcyde.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 354, "title": "Selected Ambient Works 85–92", "artist": "Aphex Twin", "year": 1992, "cover": "https://ia903407.us.archive.org/9/items/mbid-cbe086e2-5c1b-311c-8499-c060b0c12aac/mbid-cbe086e2-5c1b-311c-8499-c060b0c12aac-8131224534.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4347-aphex-twin-selected-ambient-works-85-92.php", "aoty_critic_score": 91, "aoty_user_score": 88, "mbid": "6842c81d-ea77-3dfd-abf7-4323add3f4d4", "yt_id": "Xw5AiRVqfqk", "rym": null, "genres": ["idm", "ambient techno", "acid techno", "electronic"], "desc_lfm_album": "", "desc_lfm_artist": "Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 355, "title": "Rage Against the Machine", "artist": "Rage Against the Machine", "year": 1992, "cover": "https://dn710909.ca.archive.org/0/items/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7-33270800624.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7138-rage-against-the-machine-rage-against-the-machine.php", "aoty_critic_score": 79, "aoty_user_score": 88, "mbid": "1305859b-8937-397f-9c33-39f62eb672fb", "yt_id": "MAnsR_7VYKQ", "rym": "https://rateyourmusic.com/release/album/rage-against-the-machine/rage-against-the-machine/", "genres": ["alternative rock", "metal", "alternative metal", "funk metal", "rap metal", "political hip hop"], "desc_lfm_album": "Rage Against the Machine is the debut album by rock band Rage Against the Machine, released November 3, 1992. The songs on Rage Against the Machine tend to feature political mantras with the vocals rapped. The album peaked at #1 on Billboard's Heatseekers chart, and at #45 on the Billboard Top 200 chart. Tom Morello's guitar soloing is somewhat traditional on this album, taking influence more from heavy metal music, in comparison to later releases where it is more experimental and geared toward emulation of DJs and hip hop. In 2001 Q magazine named Rage Against the Machine as one .", "desc_lfm_artist": "Rage Against the Machine was an American rock band from Los Angeles, California. Formed in 1991, the group consisted of vocalist Zack de la Rocha, bassist and backing vocalist Tim Commerford, guitarist Tom Morello, and drummer Brad Wilk. Their songs express revolutionary left-wing political views. As of 2010, they had sold over 16 million records worldwide. In 2023, the band was inducted into the Rock and Roll Hall of Fame.\n\nRage Against the Machine released its eponymous debut album in 1992 to commercial and critical success", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 356, "title": "Harvest Moon", "artist": "Neil Young", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8440-harvest-moon_184116.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8440-neil-young-harvest-moon.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "6c153d3a-cf36-37ea-8409-0e48b428315f", "yt_id": "6eXsn_1t0Go", "rym": "https://rateyourmusic.com/release/album/neil-young/harvest-moon", "genres": ["Rock"], "desc_lfm_album": "Harvest Moon is the twenty-first studio album by Canadian musician Neil Young, released in 1992. Many of the musicians appearing on it also appeared on his 1972 album Harvest, and this album is considered by many to be a pseudo-sequel to Harvest. Recovering from a case of tinnitus that had come about after the recording of 1990's Ragged Glory and its subsequent tour (which produced 1991's Weld and Arc), Young was determined to return to the studio. Returning to Nashville and joining up with compatriots like Ben Keith, Young put down the electric guitar, returning to the acoustic guitar, piano .", "desc_lfm_artist": "Neil Percival Young (born November 12, 1945) is a Canadian singer, guitarist, songwriter, and social activist who is widely regarded as one of the most influential musicians of his generation, particularly as Neil Young & Crazy Horse. Young was born in Toronto, but he moved to the family home of Winnipeg as a child, which is where his music career began. Young began performing as a solo artist in Canada in 1960, before moving to California in 1966, where he co-founded the band Buffalo Springfield along with Stephen Stills and Richie Furay.", "desc_mb_album": "", "desc_mb_artist": "... has a gigography at [http://www.sugarmtn.org].", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "armandwave"]}, {"n": 357, "title": "Sleep’s Holy Mountain", "artist": "Sleep", "year": 1992, "cover": "https://dn710704.ca.archive.org/0/items/mbid-6dcb4054-6294-3798-806b-bbc33681b7d5/mbid-6dcb4054-6294-3798-806b-bbc33681b7d5-11151768770.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "8fef03e2-e48d-3d09-a324-e39056eb2575", "yt_id": "1WNxnQ39b38", "rym": null, "genres": ["psychedelic", "doom metal", "stoner metal"], "desc_lfm_album": "", "desc_lfm_artist": "There are several artists titled Sleep;\n\n1) Sleep is an American doom metal power trio from San Jose, California. The band earned critical and record label attention early in its career. Critic Eduardo Rivadavia describes them as \"perhaps the ultimate stoner rock band\" and notes they exerted a strong influence on heavy metal in the 1990s. However, conflict with its record company contributed to Sleep's breakup by the end of the decade. The band reformed in 2009 and has played sporadic live dates internationally since.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 358, "title": "Love Deluxe", "artist": "Sade", "year": 1992, "cover": "https://ia601200.us.archive.org/11/items/mbid-49c1eeeb-919f-33d2-b72d-71b3fa5572cf/mbid-49c1eeeb-919f-33d2-b72d-71b3fa5572cf-5391926442.png", "aoty_url": "https://www.albumoftheyear.org/album/29856-sade-love-deluxe.php", "aoty_critic_score": 76, "aoty_user_score": 91, "mbid": "e4a67add-6aab-390c-bb82-53939fb9cd0a", "yt_id": "CtthQ_JotFU", "rym": "https://rateyourmusic.com/release/album/sade/love-deluxe", "genres": ["r&b", "smooth soul", "contemporary r&b", "pop soul", "sophisti-pop", "cool jazz"], "desc_lfm_album": "Love Deluxe is the fourth studio album by English band Sade, released by Epic Records in the United States on October 26, 1992, and in the United Kingdom on November 1, 1992. In a contemporary review for The Village Voice, music critic Robert Christgau felt that half of the album cannot qualify with Sade's most memorable songs and particularly panned the lyric about a Somali woman who has a life that \"hurts like brand-new shoes\" on the song \"Pearls\". Amy Linden of Entertainment Weekly stated that the album \"surges with emotion, but the mostly lush ambient music on Love Deluxe .", "desc_lfm_artist": "Sade (pronounced shah-day) is an English band formed in London in 1982, named after their lead singer, Sade Adu. Their music features elements of soul, quiet storm, smooth jazz and sophisti-pop. All of their albums, including compilations and a live album, have charted in the US Top Ten.\n\nThree of their members were originally from Hull in the East Riding of Yorkshire. Sade was formed in 1982, when members of Latin soul band Pride — Sade Adu, (real name Helen Folasade Adu - born 16 January 1959 in Ibadan", "desc_mb_album": "", "desc_mb_artist": "Formed out of the ashes of jazz group ''Pride'', this band had critical and commercial success with the album '''Diamond Life''' and several singles. From 1984, the record deal was solely in the name of '''Helen Folasade Adu''', the charismatic singer, but her backing band remained intact for several releases.", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "verygooood"]}, {"n": 359, "title": "Dynamo", "artist": "Soda Stereo", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/49941-dynamo_175904.jpg", "aoty_url": "https://www.albumoftheyear.org/album/49941-soda-stereo-dynamo.php", "aoty_critic_score": 60, "aoty_user_score": 86, "mbid": "37a12231-c07d-31f8-9cbd-63a741cc2e02", "yt_id": "H1uFesEPqJQ", "rym": "https://rateyourmusic.com/release/album/soda-stereo/dynamo", "genres": ["Alternative Rock"], "desc_lfm_album": "Dynamo is the sixth full-length album by Argentine band Soda Stereo. Released in 1992, Dynamo showed a complete turnaround in the music of the band, towards an alternative style. It is primarily a shoegaze album, but is also founded on neo-psychedelia, dream pop, noise rock, psychedelic rock and electronic music. A highly experimental record, the album failed to reach its predecessor's popularity due to many factors, including lack of support from the band's label. It also alienated many fans, who had a hard time trying to cope with the unexpected shift in the band's musical style. Nonetheless, a few songs .", "desc_lfm_artist": "Soda Stereo was a rock power trio formed in Buenos Aires, Argentina in 1982. Consisting of guitarist and vocalist Gustavo Cerati, bassist Zeta Bosio and drummer Charly Alberti, the band established what would become the template for many other popular Spanish-speaking pop and rock music groups: Clever, often mysterious lyrics, pleasing musical arrangements and an elaborate and glamorous aesthetic image.\n\nThough nominally thought of as a new wave or alternative rock group", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 360, "title": "Erotica", "artist": "Madonna", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/13863-erotica-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/13863-madonna-erotica.php", "aoty_critic_score": 75, "aoty_user_score": 85, "mbid": "7a6a2e9f-c699-3da5-a2d7-144d6ccba3e6", "yt_id": "TkremdXJv3E", "rym": "https://rateyourmusic.com/release/album/madonna/erotica", "genres": [], "desc_lfm_album": "Erotica is the fifth studio album by Madonna, released on October 20, 1992, by Maverick and Sire Records. The album was released simultaneously with Madonna's first book publication Sex, a coffee table book containing explicit photographs featuring the singer, and marked her first release under Maverick, her own multimedia entertainment company. Erotica is a concept album about sex and romance, incorporating her alter ego Mistress Dita, inspired by actress Dita Parlo. Some of its songs also take on a more confessional tone, influenced by the loss of two of Madonna's close friends to AIDS. .", "desc_lfm_artist": "Madonna Louise Ciccone (/tʃɪˈkoʊni/ chih-KOH-nee; born 16 August 1958) is an American singer, songwriter, record producer, and actress. Known as the \"Queen of Pop\", she is recognised for her continual reinvention and versatility in music, songwriting, and visual presentation. Her work frequently incorporates social, political, sexual, and religious themes, generating both critical acclaim and controversy. Madonna is considered a significant cultural", "desc_mb_album": "", "desc_mb_artist": "If you're looking for ''Greatest Hits Vol. 2'' or something similar, it is already listed under the correct name ''[https://musicbrainz.org/release-group/a0aa8b0a-5e10-3627-afde-7235b86042f6|GHV2]''. \r\nPlease '''do not''' add it again.\r\n\r\nRelease labels according to date: (all releases should follow this*)\r\nWMG parent (1982-2009) as Sire (1982–1995), Maverick (1992–2004), Warner Bros. (2004–2010), Live Nation Artists (2009-)\n\n-------\n\nBorn in Bay City, Michigan, USA, as Madonna Louise Ciccone, Madonna had the extra middle name Veronica added in childhood as confirmation of her family's Catholicism.\r\nHer music career took off in the early 1980's under the performance name [http://musicbrainz.org/artist/79239441-bfd5-4981-a70c-55c3f15c1287.html|Madonna].\r\n\r\nIt is believed her legal name has ", "heard_by": ["Frikomid", "armandwave"]}, {"n": 361, "title": "Automatic for the People", "artist": "R.E.M.", "year": 1992, "cover": "https://dn711101.ca.archive.org/0/items/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17-7646243169.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4611-rem-automatic-for-the-people.php", "aoty_critic_score": 97, "aoty_user_score": 83, "mbid": "c86c6af9-d10e-3079-b34b-30b682a797eb", "yt_id": "jBUjeOBzkIk", "rym": "https://rateyourmusic.com/release/album/r_e_m/automatic-for-the-people-11", "genres": ["alternative rock", "pop rock", "acoustic rock", "indie rock", "jangle pop", "Punk"], "desc_lfm_album": "Automatic for the People is the eighth album by the American alternative rock band R.E.M., released in 1992 on Warner Bros. Records. While R.E.M. had intended to make a harder-rocking album after dealing primarily with acoustic based sounds on its previous record Out of Time (1991), the group eventually abandoned that goal and created an album that was musically subdued and dealt with mortality. Automatic for the People reached number two on the US album charts and yielded six singles. It was ranked #247 in Rolling Stone’s 500 Greatest Albums of All Time. After promotional duties for their previous album .", "desc_lfm_artist": "R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming.", "desc_mb_album": "", "desc_mb_artist": "Has a gigography and other dates at [http://www.remtimeline.com]", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 362, "title": "Dirt", "artist": "Alice in Chains", "year": 1992, "cover": "https://dn710800.ca.archive.org/0/items/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf-9835602113.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4843-alice-in-chains-dirt.php", "aoty_critic_score": 86, "aoty_user_score": 87, "mbid": "92d8f0c4-8c64-3bee-bee1-812a70e77efa", "yt_id": "19CXYQhqVu0", "rym": "https://rateyourmusic.com/release/album/alice-in-chains/dirt", "genres": ["alternative rock", "hard rock", "heavy metal", "doom metal", "metal", "grunge"], "desc_lfm_album": "Dirt is the second studio album by the American rock band Alice in Chains and was released on September 29, 1992 through Columbia Records. Peaking at number six on the Billboard 200, the album was well received by music critics and has since been certified four-times platinum by the RIAA. It is nowadays considered as one of the best grunge/heavy metal albums and is usually on many \"Must have\" lists. The album spawned five singles: \"Would?\", \"Them Bones\", \"Angry Chair\", \"Rooster\", and \"Down in a Hole\". The songs on the album focused on depression, drug use, war, death, and other .", "desc_lfm_artist": "Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style", "desc_mb_album": "US represses of this album are unique in that ‘[recording:b5502d6e-25af-4655-966d-faceab6fa0df|Down in a Hole]’ was moved from track 12 up to track 4.", "desc_mb_artist": "Originally named ‘Diamond Lie’. Following the addition of Layne Staley, they were also periodically named ‘Mothra’ and ‘Fuck’ (amongst other names) until settling on ‘Alice in Chains’, after Staley’s [artist:5ec4ba3a-83b9-4623-9f63-8a1e3cfa1de5|old band].", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 363, "title": "Core", "artist": "Stone Temple Pilots", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/core.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5245-stone-temple-pilots-core.php", "aoty_critic_score": 71, "aoty_user_score": 81, "mbid": "6ca130f1-8f1f-3aa2-8cfb-6cfda3ed5d21", "yt_id": "hvzHum9457w", "rym": "https://rateyourmusic.com/release/album/stone-temple-pilots/core", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Core is the debut album by American hard rock band Stone Temple Pilots. It was released on September 29, 1992, by Atlantic Records. The album was certified 8x platinum by the RIAA, and is both STP's best-selling record and one of the best-selling debut albums of all time in the United States. Album sales were propelled by the hit singles \"Plush\", which won a Grammy Award in 1993, \"Creep\", \"Sex Type Thing\", and \"Wicked Garden\", all of which have since become modern and alternative rock radio staples. According to a 2007 interview with Rolling Stone, Core and Velvet Revolver's 2007 .", "desc_lfm_artist": "Stone Temple Pilots (also known by STP) is an American grunge band from San Diego, California, that originally consisted of Scott Weiland (lead vocals), brothers Dean (guitar) and Robert DeLeo (bass, backing vocals), and Eric Kretz (drums). The band's lineup remained unchanged from its formation in 1989 until the firing of Weiland in February 2013. Linkin Park vocalist Chester Bennington joined the band in May 2013 but left amicably in November 2015.", "desc_mb_album": "", "desc_mb_artist": "If you have found a file labeled as Stone Temple Pilots - Pour Some Sugar On Me, it is mislabeled. It is merely an acoustic version by Def Leppard in Singapore. (Usually, when a file is labeled as 'rare' or something, there's a good chance it's mislabeled.)", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 364, "title": "Broken", "artist": "Nine Inch Nails", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5557-broken_090905.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5557-nine-inch-nails-broken.php", "aoty_critic_score": 76, "aoty_user_score": 85, "mbid": "abcff3e9-a3f4-3a94-a6be-32381104084e", "yt_id": "i2dYO_dgKBk", "rym": null, "genres": ["Electronic", "Alternative Rock"], "desc_lfm_album": "Broken (also known as Halo 5) is an EP released on September 22nd 1992. Although not technically so, Broken is usually considered Nine Inch Nails' second major release after Pretty Hate Machine since it consists entirely of new material. The EP was recorded in secret, in order to avoid interference from TVT Records. It was followed later that year by Fixed, a companion EP of remixes of the songs on Broken. The release of Broken followed on from a major disagreement between Trent Reznor and his record label at the time, TVT Records, and the influence of the conflict is .", "desc_lfm_artist": "Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated", "desc_mb_album": "", "desc_mb_artist": "Please note the following about Nine Inch Nails releases:\n\n    * Certain tracks frequently included on Nine Inch Nails bootlegs are not actually Nine Inch Nails tracks; however they do feature Trent on vocals. These include:\n        * [http://musicbrainz.org/track/9f249bf3-af50-43b6-a820-b52091ca757d.html|1000 Homo DJs - Supernaut (Trent Reznor vocal version)] (studio)\n        * [http://musicbrainz.org/track/8440e3d4-d78e-49e7-9cf6-14e87ba53a8b.html|Tori Amos - Past The Mission] (studio)\n        * [http://musicbrainz.org/track/8ee4f9e3-6ff2-436d-bcb2-4f87dde6c0ae.html|David Bowie - Hallo Spaceboy] (live, vocal duet; played with Bowie's band on stage)\n        * [http://musicbrainz.org/track/c9a1f57b-a18d-4ede-bb91-cba7b6765890.html|David Bowie - Warszawa] (live, vocal duet, played with Bowi", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 365, "title": "Whut? Thee Album", "artist": "Redman", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/20315-whut-thee-album_212528.jpg", "aoty_url": "https://www.albumoftheyear.org/album/20315-redman-whut-thee-album.php", "aoty_critic_score": 94, "aoty_user_score": 82, "mbid": "bc239359-3ced-3684-a8b2-c7dfc1d0cb5b", "yt_id": "uEmeTHRll4w", "rym": "https://rateyourmusic.com/release/album/redman/whut-thee-album", "genres": ["Hip-Hop"], "desc_lfm_album": "", "desc_lfm_artist": "Redman (born Reggie Noble on April 17, 1970 in Newark, New Jersey) made his rapping debut on the EPMD songs \"Hardcore\" and \"Brothers on my Jock\", after Erick Sermon of the seminal group spotted him freestyling in a New York club and added him to their crew of aspiring emcees (along with K-Solo among others). Redman's 1992 Def Jam debut Whut? Thee Album broke into the US Top 50, achieved gold status in the United States, and prominent hip-hop magazine The Source subsequently named Redman Rap Artist of the Year for 1993.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84"]}, {"n": 366, "title": "Down Colorful Hill", "artist": "Red House Painters", "year": 1992, "cover": "https://dn721501.ca.archive.org/0/items/mbid-04ea0a76-af21-4da4-9a0f-6e1c5681aecc/mbid-04ea0a76-af21-4da4-9a0f-6e1c5681aecc-42391723213.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6931-red-house-painters-down-colorful-hill.php", "aoty_critic_score": 75, "aoty_user_score": 82, "mbid": "2c2ef029-d455-3867-a8a2-defa06f88590", "yt_id": "19I9V5NnbvA", "rym": "https://rateyourmusic.com/release/album/red-house-painters/down-colorful-hill", "genres": ["folk rock", "dream pop", "slowcore", "Rock", "Alternative Rock"], "desc_lfm_album": "Not a proper debut as such, Down Colorful Hill instead comprises the demo recordings which won Red House Painters their contract with the 4AD label, released here with minimal overdubbing. Regardless, the group has already reached full maturity; these lengthy, ponderous songs are remarkably evocative portraits of a distinctly tortured psyche -- Mark Kozelek forgoes the camouflage of metaphor to lay his soul on the line, and the honesty of his craft is both beautiful and disturbing. .", "desc_lfm_artist": "Red House Painters was a slowcore band from San Francisco, CA, United States, formed in 1988 by singer/songwriter Mark Kozelek, who is currently active in the band Sun Kil Moon, with part of the original RHP line-up.\n\nThe band is described, along with Low and American Music Club, as one of the linchpins of the slowcore movement, a subgenre of Indie Rock characterized by downbeat melodies, slow tempos, and often minimalist arrangements. The genre was shaped by musical influences like Folk Rock", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "verygooood"]}, {"n": 367, "title": "Bone Machine", "artist": "Tom Waits", "year": 1992, "cover": "https://dn711101.ca.archive.org/0/items/mbid-c234ce23-2d47-4e6d-91a0-fb679937f534/mbid-c234ce23-2d47-4e6d-91a0-fb679937f534-15193259092.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4355-tom-waits-bone-machine.php", "aoty_critic_score": 89, "aoty_user_score": 84, "mbid": "b65ca7b8-4069-3782-9c4c-b2353cc4bc04", "yt_id": "C7I4kSpS43o", "rym": "https://rateyourmusic.com/release/album/tom-waits/bone-machine", "genres": ["experimental rock", "blues rock", "Rock", "Jazz"], "desc_lfm_album": "Bone Machine is the tenth studio album by Tom Waits, released in August 1992 on Island Records. It won the Grammy Award for Best Alternative Music Album and is considered one of Waits' strongest studio recordings. It includes guest appearances by Les Claypool of Primus, Keith Richards of The Rolling Stones, and David Hidalgo of Los Lobos. As of March 2018, Last.fm's track list is completely wrong; it's missing several songs and several titles are wrong. The correct list is: 1. Earth Died Screaming - 3:39 2. Dirt in the Ground - 4:09 3. Such a Scream - 2:09 4. .", "desc_lfm_artist": "Tom Waits (born Thomas Alan Waits, in Pomona, California, on December 7, 1949) is a prolific American singer, songwriter, composer, and actor.\n\nHe started his career in the early 1970s as a singer in spit 'n' sawdust bars. Initially, he was deeply influenced by the beat generation, novelists like Jack Kerouac and William S. Burroughs, and poets like Allen Ginsberg and Charles Bukowski.  Waits is often compared to Charles Bukowski, being similar both in content and lifestyle", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 368, "title": "Dirty", "artist": "Sonic Youth", "year": 1992, "cover": "https://dn720809.ca.archive.org/0/items/mbid-7053ea26-cd46-415f-8620-d0d0d0a2ff72/mbid-7053ea26-cd46-415f-8620-d0d0d0a2ff72-44104465577.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7334-sonic-youth-dirty.php", "aoty_critic_score": 86, "aoty_user_score": 82, "mbid": "30fef5ef-b1d4-36b5-8f75-f45b8e76c545", "yt_id": "D7oURG_TPl0", "rym": "https://rateyourmusic.com/release/album/sonic-youth/dirty", "genres": ["alternative rock", "noise rock", "no wave", "indie rock", "grunge", "rock"], "desc_lfm_album": "Dirty is the seventh full-length studio album and second double album by American rock band Sonic Youth, released on July 21, 1992 by DGC Records. The band recorded and co-produced the album with Butch Vig in early 1992 at the Magic Shop studios. The sound on Dirty was inspired by the popularity of grunge music at the time, and has been described by Billboard magazine as avant-rock. Some songs on the album mark the first appearance of three guitars in a few Sonic Youth songs. Dirty reached number 83 on the US Billboard 200 and number six on the UK .", "desc_lfm_artist": "Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups", "desc_mb_album": "", "desc_mb_artist": "Sonic Youth were a four-piece band from New York. Emerging from the no-wave movement, their experimental noise distinguished them from other underground bands of the 1980s. Their signing to DGC in 1990 was unusual in the creative freedom given in the contract, and proved that it was possible to remain true to an independent ethic while on a major label.\r\nSee also [http://musicbrainz.org/show/artist/?artistid=58284|Ciccone Youth].", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 369, "title": "Images And Words", "artist": "Dream Theater", "year": 1992, "cover": "https://dn710704.ca.archive.org/0/items/mbid-42caac42-c876-4f22-8f3f-ebcccad8cf8b/mbid-42caac42-c876-4f22-8f3f-ebcccad8cf8b-15251537725.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "ee30c026-b4f4-3e2a-94cf-7e586f1ccae0", "yt_id": "wUn2OMmP9BQ", "rym": "https://rateyourmusic.com/release/album/dream-theater/images-and-words", "genres": ["progressive rock", "heavy metal", "progressive metal", "Metal", "Rock"], "desc_lfm_album": "Images and Words is the second studio album by influential American progressive metal band Dream Theater, released in 1992. It was recorded in late 1991 at BearTracks Studios in New York City. The album is the first album to feature James LaBrie on vocals. The album maintains its position as the band's most commercially successful album to date, and the song Pull Me Under's status as the only Top 10 hit the band has ever had. This song has also had some very recent success as it has appeared in the video game Guitar Hero: World Tour. Many critics and .", "desc_lfm_artist": "Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy.", "desc_mb_album": "", "desc_mb_artist": "Sites with lists of bootlegs: [http://www.ytsecollection.com/|Ytsecollection], [http://www.hf.rim.or.jp/~junya/dtboots/dtboots.html|The Sphere] and [http://dt.qrayg.com/bootlegs/|qDT].", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 370, "title": "Blues For The Red Sun", "artist": "Kyuss", "year": 1992, "cover": "https://dn720708.ca.archive.org/0/items/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be-11039555984.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "816f2753-e709-3b10-ad93-e4c1af7aea6c", "yt_id": "gZxPm06Dhn4", "rym": "https://rateyourmusic.com/release/album/kyuss/blues-for-the-red-sun", "genres": ["alternative rock", "hard rock", "heavy metal", "stoner rock", "alternative metal", "stoner metal"], "desc_lfm_album": "", "desc_lfm_artist": "Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "sdecandelario"]}, {"n": 371, "title": "Mecca and the Soul Brother", "artist": "Pete Rock & CL Smooth", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19262-mecca-and-the-soul-brother.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19262-pete-rock-cl-smooth-mecca-and-the-soul-brother.php", "aoty_critic_score": 88, "aoty_user_score": 86, "mbid": "7eb6da03-0f1f-3303-b079-8cba2f18c530", "yt_id": "_jomCXFdMsU", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Pete Rock & C.L. Smooth were an influential rap group from Mount Vernon, New York. They made their debut in the rap world with their 1991 EP, All Souled Out. It sold moderately well enough to justify Elektra Records clearing the way for 1992's Mecca and the Soul Brother LP.\nAs a producer, DJ Pete Rock (Peter Phillips) tended to prefer obscure soul and jazz sides for sample sources, frequently making use of horn-driven hooks. Lead vocalist CL Smooth (Corey Penn) tended to be philosophical in his raps, and he mostly avoided profanity.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "alberto_gu", "armandwave"]}, {"n": 372, "title": "Angel Dust", "artist": "Faith No More", "year": 1992, "cover": "https://dn711100.ca.archive.org/0/items/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18-25332359916.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5093-faith-no-more-angel-dust.php", "aoty_critic_score": 78, "aoty_user_score": 83, "mbid": "503e5b85-df2a-365a-82e4-32ca30538d8d", "yt_id": "k0tUb-87kP8", "rym": "https://rateyourmusic.com/release/album/faith-no-more/angel-dust", "genres": ["experimental rock", "alternative rock", "hard rock", "alternative metal", "funk metal", "avant-garde metal"], "desc_lfm_album": "Angel Dust is the fourth studio album by American rock band Faith No More, first released through Slash on June 8, 1992 in Europe and the United States. It's the final studio album with long time guitarist Jim Martin and the second to feature Mike Patton on vocals however it is the first album in which he had an influence on the band's sound, as Patton hadn't previously had input on the musical composition of the albums predecessor, The Real Thing, as it had all been composed and recorded prior to his joining. It remains as Faith No More's highest-selling .", "desc_lfm_artist": "Faith No More was an American rock band from San Francisco, California, formed in 1979. Before September 1983, the band performed under the names Sharp Young Men and later Faith No Man. Bassist Billy Gould, keyboardist and rhythm guitarist Roddy Bottum, and drummer Mike Bordin were the longest-tenured members of the band, having been involved since its inception. The band underwent several lineup changes over the years. The final lineup consisted of Gould, Bordin, Bottum, lead guitarist Jon Hudson, and vocalist and lyricist Mike Patton.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 373, "title": "MELTING MOMENT", "artist": "POiSON GiRL FRiEND", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/382399-melting-moment.jpg", "aoty_url": "https://www.albumoftheyear.org/album/382399-poison-girl-friend-melting-moment.php", "aoty_critic_score": 92, "aoty_user_score": 83, "mbid": "17ff2889-3be4-43c1-bcd3-368856ece108", "yt_id": "n-M5UpkDuxk", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Important facts to be gleaned from the PGF web site: Somebody named Noriko lived in the United Kingdom at some point, and lives in Tokyo now. She has been recording and performing as Poison Girl Friend since 1989, and released several albums in the 1990s. She also records as half of equally-undocumented duo Kiss-o-Matic. She likes cheese, olives and curry and sometimes works as an ambient/jungle DJ to keep the pantry stocked. She seems equally happy with the spelling \"Poison Girlfriend\", so nuts to your tags.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Rocky_stereo", "alberto_gu"]}, {"n": 374, "title": "Wish", "artist": "The Cure", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4386-wish_142612.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4386-the-cure-wish.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "88154914-4f14-355c-8066-b3cecd38c42c", "yt_id": "qoilx1fZeAE", "rym": null, "genres": [], "desc_lfm_album": "Wish is the ninth studio album by British band The Cure, released on 21 April 1992. The record is the final studio album featuring Boris Williams and the first featuring Perry Bamonte, as well as being the last album featuring Porl Thompson for sixteen years. Special guest Kate Wilkinson plays the viola on the track \"To Wish Impossible Things\". Although not as well received by critics as Disintegration (1989), Wish is the band's overall highest charting album, given its debut at number one in the UK and number two in the United States, where it sold more than 1.2 million .", "desc_lfm_artist": "The Cure are an English gothic rock band formed in Crawley in 1976 by Robert Smith (vocals, guitar) and Lol Tolhurst (drums). The band’s current lineup consists of Smith, Simon Gallup (bass), Roger O'Donnell (keyboards), Perry Bamonte (guitar and keyboards), Jason Cooper (drums), and Reeves Gabrels (guitar). Smith has been the sole constant member throughout the group’s history, while Gallup has appeared on all but two of the band’s studio albums.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 375, "title": "Slanted and Enchanted", "artist": "Pavement", "year": 1992, "cover": "https://dn720700.ca.archive.org/0/items/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf-36814960831.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1473-pavement-slanted-and-enchanted.php", "aoty_critic_score": 93, "aoty_user_score": 80, "mbid": "869f9eac-2a40-3a41-80a3-6bf2297a7cbc", "yt_id": "skGqpC0WYSk", "rym": "https://rateyourmusic.com/release/album/pavement/slanted-and-enchanted", "genres": ["alternative rock", "noise rock", "indie rock", "noise pop", "Alternative Rock"], "desc_lfm_album": "Slanted and Enchanted is the debut studio album by American indie rock band Pavement, released on April 20, 1992 by Matador Records. It is the only Pavement album to feature drummer Gary Young. The album received critical acclaim and is seen as a landmark for indie rock, with Rolling Stone ranking it 199th on its 2020 edition of The 500 Greatest Albums of All Time. As of 2007, the album had sold 150,000 copies. Slanted and Enchanted was distributed to critics as early as 1991, months before its official release; the original distribution did not feature the entire band, as .", "desc_lfm_artist": "Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 376, "title": "Dry", "artist": "PJ Harvey", "year": 1992, "cover": "https://dn711009.ca.archive.org/0/items/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703-16145595354.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2334-pj-harvey-dry.php", "aoty_critic_score": 87, "aoty_user_score": 82, "mbid": "78e2be48-6a07-31bf-b85f-3a1093177263", "yt_id": "lABPOmNiUqY", "rym": "https://rateyourmusic.com/release/album/pj-harvey/dry", "genres": ["alternative rock", "indie rock", "grunge", "Rock", "Alternative Rock"], "desc_lfm_album": "Dry is the debut studio album by the band PJ Harvey, fronted by English singer-songwriter and musician PJ Harvey, released on Too Pure Records on 30 March 1992. The album was recorded at The Icehouse, a local studio in Yeovil, United Kingdom. The first 5000 LPs and first 1000 CDs included demo versions of the album's tracks, being subsequently released in the United States on Indigo Records in the US. Both versions were released in 1992. Speaking to Filter magazine in 2004, Harvey said of her debut album: \"\"Dry\" is the first chance I ever had to make a record .", "desc_lfm_artist": "Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 377, "title": "Going Blank Again", "artist": "Ride", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7747-going-blank-again_222544.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7747-ride-going-blank-again.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "76692a6f-eba5-3689-8cca-2377162315d1", "yt_id": "01WWxRLRYhw", "rym": "https://rateyourmusic.com/release/album/ride/going-blank-again", "genres": ["alternative rock", "neo-psychedelia", "shoegaze", "dream pop", "Rock", "Pop"], "desc_lfm_album": "Going Blank Again is the second studio album by British rock band Ride, released on 9 March 1992 on Creation Records. It was produced by Alan Moulder, and peaked at No. 5 in the UK Albums Chart. In October 2009 the album was certified gold by the British Phonographic Industry for sales of over 100,000 units. Following Ride's 1990 debut album Nowhere, Ride released Going Blank Again as their second full-length record, accompanied by the singles \"Leave Them All Behind\" (10 February 1992) and \"Twisterella\" (13 April 1992), the latter named in reference to a song in the 1963 kitchen .", "desc_lfm_artist": "Ride is a shoegaze band that formed in 1988 in Oxford, England, consisting of Andy Bell, Mark Gardener, Laurence Colbert, and Steve Queralt. The band were initially part of the shoegaze scene that emerged in England during the early 1990s. Their debut album Nowhere (1990) has been named one of the greatest albums of the genre. Ride has released five albums: \"Nowhere\" (1990), \"Going Blank Again\" (1992), \"Carnival of Light\" (1994), \"Tarantula\" (1996), and \"Weather Diaries\" (2017).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 378, "title": "A Blaze in the Northern Sky", "artist": "Darkthrone", "year": 1992, "cover": "https://cdn2.albumoftheyear.org/600x0/album/51735-a-blaze-in-the-northern-sky_191607.jpg", "aoty_url": "https://www.albumoftheyear.org/album/51735-darkthrone-a-blaze-in-the-northern-sky.php", "aoty_critic_score": 94, "aoty_user_score": 85, "mbid": "3ab57384-506c-33ff-9ecc-e5a6134e17bd", "yt_id": "wbnG5RJKnf4", "rym": "https://rateyourmusic.com/release/album/darkthrone/a-blaze-in-the-northern-sky/", "genres": ["Metal", "Punk"], "desc_lfm_album": "A Blaze in the Northern Sky is the second album by the Norwegian black metal band, Darkthrone. It was released in February 1992 and contains the band's first black metal recordings. Due to Darkthrone's sudden change from death metal to black metal, Peaceville Records was reluctant to release the album in its original form. The band then threatened to release it through Deathlike Silence Productions, the record label owned by Øystein \"Euronymous\" Aarseth. However, Peaceville eventually agreed to release the album as it was recorded. In an interview, Fenriz said that the album was somewhat \"rushed\" as half of the .", "desc_lfm_artist": "Darkthrone is a Norwegian metal band from Kolbotn, Akershus. Formed in 1986 as a death metal band named Black Death, in 1991 Darkthrone embraced a black metal style influenced by Bathory and Celtic Frost and became one of the leading bands in the Norwegian black metal scene. Their first three black metal albums A Blaze in the Northern Sky (1992), Under a Funeral Moon (1993) and Transilvanian Hunger (1994) are sometimes dubbed the \"Unholy Trinity\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario", "verygooood"]}, {"n": 379, "title": "Vulgar Display of Power", "artist": "Pantera", "year": 1992, "cover": "https://dn710300.ca.archive.org/0/items/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5-7967409791.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6978-pantera-vulgar-display-of-power.php", "aoty_critic_score": 88, "aoty_user_score": 82, "mbid": "814e0b20-6884-31c5-9d99-d215f048cfd6", "yt_id": "8hu6xDPcNlE", "rym": "https://rateyourmusic.com/release/album/pantera/vulgar-display-of-power", "genres": ["heavy metal", "metal", "alternative metal", "groove metal", "thrash metal", "rock"], "desc_lfm_album": "Vulgar Display of Power is the sixth studio album by the American heavy metal band Pantera, released on February 25, 1992 through Atco Records. One of the most influential heavy metal albums of the 1990s, Vulgar Display
