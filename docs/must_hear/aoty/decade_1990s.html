-4842-93f7-339ed6f0e933/mbid-c5bb1efa-34f4-4842-93f7-339ed6f0e933-40027502691.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6915-refused-the-shape-of-punk-to-come.php", "aoty_critic_score": 92, "aoty_user_score": 87, "mbid": "d49f2704-3677-4ba4-8162-e2bd83c76417", "yt_id": "iHhe6ziuo3k", "rym": "https://rateyourmusic.com/release/album/refused/the-shape-of-punk-to-come", "genres": [], "desc_lfm_album": "The Shape of Punk to Come: A Chimerical Bombination in 12 Bursts, often shortened to The Shape of Punk to Come, is the third album by Swedish hardcore punk band Refused, released on October 27, 1998 through Burning Heart Records. Although Refused broke up only months after the album's release, The Shape of Punk to Come has since found an audience for the band and largely contributed to their posthumous fame, as well as inspiring many later artists in a wide range of genres. Kerrang! magazine listed The Shape of Punk to Come at #13 on their 50 Most Influential .", "desc_lfm_artist": "Refused is a hardcore band from Umeå, Sweden, formed in 1991. Members include vocalist Dennis Lyxzén, guitarist Kristofer Steen, drummer David Sandström, and bassist Magnus Flagge. Many sources cite the band as extremely influential in the development of underground music.\n\nRefused's lyrics focus mostly on revolutionary politics, drawing on Marxism and anarchism. Formed from the ashes of Step Forward, by the time of their first album the band already had a strong anti-establishment profile.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 55, "title": "American Water", "artist": "Silver Jews", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/american-water-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4046-silver-jews-american-water.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": "ce88168e-fa3f-367f-9d94-d9ed2c8ea8bb", "yt_id": "CvdpFcNUnKc", "rym": "https://rateyourmusic.com/release/album/silver-jews/american-water", "genres": ["alternative rock", "indie rock", "Rock", "Alternative Rock"], "desc_lfm_album": "American Water is the third full-length studio album by indie rock group Silver Jews. Released in 1998 as an LP and CD on Drag City (DC149) in America and Domino (WIG56) in Europe, American Water was recorded at The Rare Book Room in Brooklyn and mastered at Abbey Road Studios. The album features musicians Tim Barnes, David Berman, Mike Fellows, Stephen Malkmus, Chris Stroffolino, and artwork by Chris Kysor. Berman was struggling with drug addiction during the recording of American Water. Lyrically, this is expressed in a sense of solidarity with the downtrodden. He described the album's sessions saying: \"I .", "desc_lfm_artist": "Silver Jews were an American indie rock band formed in Hoboken, New Jersey, in 1989. The band's earliest incarnation was the college band Ectoslavia, formed by future Pavement founders Bob Nastanovich, Stephen Malkmus and frontman David Berman at the University of Virginia in 1985. An exercise in joyous noise, the band disbanded after graduation and the three friends moved to New York to take up various jobs - Nastanovich, a bus driver, and Berman and Malkmus, art museum security guards.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 56, "title": "Is This Desire?", "artist": "PJ Harvey", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/is-this-desire.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2331-pj-harvey-is-this-desire.php", "aoty_critic_score": 76, "aoty_user_score": 85, "mbid": "70745e26-405e-35ca-89d8-54c1720cfc46", "yt_id": "tFtYeDpdcYk", "rym": "https://rateyourmusic.com/release/album/pj-harvey/is-this-desire", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Is This Desire? is the fourth studio album by English musician PJ Harvey, released on 28 September 1998 on Island Records. Recorded on and off in Dorset and London between April 1997 and April 1998, it was co-produced by Flood, Head and Harvey herself, and featured instrumental contributions from Rob Ellis, John Parish, Mick Harvey, Eric Drew Feldman, Joe Gore and Jeremy Hogg. It marked a move away from Harvey’s earlier guitar-driven rock style into subtler, quieter, atmospheric soundscapes and mood pieces based around keyboards, bass and electronics. .", "desc_lfm_artist": "Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 57, "title": "Aquemini", "artist": "OutKast", "year": 1998, "cover": "https://dn710806.ca.archive.org/0/items/mbid-63f4592c-6f58-32bb-bd9f-a431dc14e04d/mbid-63f4592c-6f58-32bb-bd9f-a431dc14e04d-6640977411.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2915-outkast-aquemini.php", "aoty_critic_score": 90, "aoty_user_score": 90, "mbid": "eb655897-6cc5-3fc1-b9ed-5008eb80c682", "yt_id": "vnnTW6WL7pw", "rym": "https://rateyourmusic.com/release/album/outkast/aquemini", "genres": ["alternative hip hop", "hip hop", "dirty south", "Hip-Hop"], "desc_lfm_album": "A vaguely futuristic, synthesizer-drenched album punctuated with anthemic choruses and bluesy beats, Aquemini addresses numerous topics such as emancipation, drug addiction and problematic relationships, while exploring the bleakest aspects of humanity. In contrast to much of hip hop music in the late 1990s, OutKast did not tone down the regional qualities, like the harmonica break on \"Rosa Parks\" and distinctive Atlanta slang and diction throughout. \"Rosa Parks\" was later nominated for the 1999 Grammy Award for Best Rap Performance by a Duo or Group. The song led to much controversy with Rosa Parks filing a defamation suit against OutKast. Aquemini .", "desc_lfm_artist": "OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "sdecandelario"]}, {"n": 58, "title": "Deserter’s Songs", "artist": "Mercury Rev", "year": 1998, "cover": "https://ia801407.us.archive.org/23/items/mbid-622d3f09-9d01-39f3-b57b-4a0609a94c11/mbid-622d3f09-9d01-39f3-b57b-4a0609a94c11-16343213909.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "09c61550-5780-3fb4-b5ec-8b873fe4e8a9", "yt_id": "wHvfQWUzX40", "rym": null, "genres": ["alternative rock", "indie rock", "dream pop"], "desc_lfm_album": "This 12 track album was released in 1998 by V2, and catapulted Mercury Rev into the mainstream. .", "desc_lfm_artist": "Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 59, "title": "Dónde están los ladrones?", "artist": "Shakira", "year": 1998, "cover": "https://dn721900.ca.archive.org/0/items/mbid-6f58dbef-35c5-4c8d-bef5-abbcb39efccf/mbid-6f58dbef-35c5-4c8d-bef5-abbcb39efccf-24500476727.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3197ee5d-696e-374f-8df3-042f1c0fd3a5", "yt_id": "ngu2xMmRUAQ", "rym": "https://rateyourmusic.com/release/single/shakira/_donde-estan-los-ladrones.p", "genres": ["alternative rock", "pop rock", "latin", "latin pop"], "desc_lfm_album": "", "desc_lfm_artist": "Shakira Isabel Mebarak Ripoll is a Colombian singer. Born and raised in Barranquilla, She made her recording debut with Sony Music Colombia at the age of 13. Following the commercial failure of her first two albums, Magia (1991) and Peligro (1993), she rose to prominence in Hispanic countries with her next albums, Pies Descalzos (1995) and Dónde Están los Ladrones? (1998). She entered the English-language market with her fifth album, Laundry Service (2001), which sold over 13 million copies worldwide.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84"]}, {"n": 60, "title": "Mos Def & Talib Kweli Are Black Star", "artist": "Black Star", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19243-mos-def-talib-kweli-are-black-star-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19243-black-star-mos-def-talib-kweli-are-black-star.php", "aoty_critic_score": 86, "aoty_user_score": 87, "mbid": "aaa445c1-5f73-37c0-b53a-2444b279c538", "yt_id": "_nPgRbeFYcs", "rym": "https://rateyourmusic.com/release/album/black-star/mos-def-and-talib-kweli-are-black-star/", "genres": [], "desc_lfm_album": "\"Mos Def & Talib Kweli Are Black Star\" is an album-length collaboration of emcees Talib Kweli and Mos Def, it was released on August 26, 1998, to critical acclaim. The title is a reference to the Black Star Line, a shipping line founded by Pan-Africanist Marcus Garvey. The album deals with modern-day issues, philosophical ideas, and life in Brooklyn, New York City, as the two artists know it. .", "desc_lfm_artist": "Black Star is a hip-hop group formed by MCs Mos Def & Talib Kweli. Affiliated with the group is Hi-Tek, who formed producer/MC duo Reflection Eternal with Kweli, for the album Train of Thought & produced a portion of Black Star's debut album. They're, also, part of the Native Tongues Posse, a collective that contains, amongst others A Tribe Called Quest, De La Soul, Jungle Brothers, Da Bush Babees & Common.\n\nBlack Star arose from the underground movement of the late 1990s", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 61, "title": "Moon Pix", "artist": "Cat Power", "year": 1998, "cover": "https://dn710308.ca.archive.org/0/items/mbid-d8bfb0c6-4d82-41c4-8567-a2823525aade/mbid-d8bfb0c6-4d82-41c4-8567-a2823525aade-6010113367.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4070-cat-power-moon-pix.php", "aoty_critic_score": 91, "aoty_user_score": 82, "mbid": "88d34969-dd30-32ee-a28b-eb8015f07116", "yt_id": "6fw7KZ3v8fc", "rym": "https://rateyourmusic.com/release/album/cat-power/moon-pix", "genres": ["folk rock", "country rock", "slowcore", "rock", "Alternative Rock"], "desc_lfm_album": "Moon Pix is the fourth album by American singer-songwriter Cat Power (a.k.a. Chan Marshall). It was released in September 1998 on Matador Records. Prior to recording Moon Pix, Marshall had planned to retire from the music business, relocating to Portland, Oregon and Prosperity, South Carolina; however, after experiencing a hallucinatory nightmare while staying in a rural farmhouse, Marshall wrote the bulk of Moon Pix in a single night. In January 1998, Marshall traveled to Melbourne, Australia, to record the album with Mick Turner and Jim White, of the Australian instrumental band Dirty Three, on guitar and drums, respectively. .", "desc_lfm_artist": "Cat Power is an American singer, songwriter, musician, actress, and model. Charlyn Marie Marshall (also known as Chan, pronounced \"Shawn\")  was born in Atlanta, Georgia, U.S. on 21 January 1972. Cat Power was originally the name of Marshall's first band, but has become her stage name as a solo artist.\n\nAfter dropping out of high school, Marshall started performing under the name Cat Power, while in Atlanta, backed by musicians Glen Thrasher, Mark Moore, and others.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Nubis84", "Rocky_stereo", "armandwave"]}, {"n": 62, "title": "Celebrity Skin", "artist": "Hole", "year": 1998, "cover": "https://dn710106.ca.archive.org/0/items/mbid-f3e17f30-f0d5-440c-a624-c628c5cfd4e2/mbid-f3e17f30-f0d5-440c-a624-c628c5cfd4e2-40537704175.png", "aoty_url": "https://www.albumoftheyear.org/album/10755-hole-celebrity-skin.php", "aoty_critic_score": 73, "aoty_user_score": 80, "mbid": "bdf37fad-7332-3efb-8e7e-073d1c756c7e", "yt_id": "UGXL3gsdiQI", "rym": null, "genres": ["alternative rock", "grunge", "rock"], "desc_lfm_album": "Celebrity Skin is the third studio album by American alternative rock band Hole, released on September 8, 1998, on Geffen Records and in the United States on DGC Records. It was the last album released by the band before their dissolution in 2002. Hole intended for the record to diverge significantly from their previous noise and grunge-influenced sound as featured on Pretty on the Inside (1991) and Live Through This (1994). The band hired producer Michael Beinhorn to record Celebrity Skin over a nine-month period that included sessions in Los Angeles, New York City, and London. It was the band's .", "desc_lfm_artist": "Hole was an American alternative rock band formed by singer and guitarist Courtney Love and lead guitarist Eric Erlandson in Los Angeles, California in 1989. Influenced by Los Angeles' punk rock scene, and produced by Kim Gordon of Sonic Youth, the band's debut album, Pretty on the Inside, attracted critical interest from British and American alternative press. Their second album, Live Through This, released 1994 by DGC Records, which featured less aggressive melodies and more restrained lyrical content", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 63, "title": "How It Feels To Be Something On", "artist": "Sunny Day Real Estate", "year": 1998, "cover": "https://ia801901.us.archive.org/30/items/mbid-d28b1565-137e-475b-b554-a4a9cde3810b/mbid-d28b1565-137e-475b-b554-a4a9cde3810b-15145525545.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "11cc396d-9e51-37b4-afc3-e83cf175d782", "yt_id": "BjVTp9aPvog", "rym": null, "genres": ["alternative rock", "indie rock", "emo", "Punk", "Alternative Rock"], "desc_lfm_album": "How It Feels to Be Something On is the third studio album by American emo band Sunny Day Real Estate, and the first since their 1997 comeback. It was released September 8, 1998. .", "desc_lfm_artist": "Sunny Day Real Estate is an American alternative rock band formed in Seattle, Washington in 1992. The band helped bring the emo subgenre from an underground musical phenomenon to a wider audience. The band's lineup is Jeremy Enigk (vocals, guitars), Dan Hoerner (guitar), Nate Mendel (bass) and William Goldsmith (drums).\n\nThe core of Sunny Day Real Estate formed in 1992, originally under the name Empty Set. Empty Set consisted of Dan Hoerner (guitar, vocals), Nate Mendel (bass), and William Goldsmith (drums).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "sdecandelario", "verygooood"]}, {"n": 64, "title": "The Boy with the Arab Strap", "artist": "Belle and Sebastian", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10778-the-boy-with-the-arab-strap.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10778-belle-sebastian-the-boy-with-the-arab-strap.php", "aoty_critic_score": 84, "aoty_user_score": 81, "mbid": "25f3f7bf-f308-390c-b512-e0d4caaa8417", "yt_id": "YcgqJDEBC-o", "rym": null, "genres": [], "desc_lfm_album": "The Boy with the Arab Strap is the third album from the Scottish band Belle & Sebastian. The inspiration for the album's name came from the band Arab Strap, who are also from Scotland and briefly toured with Belle & Sebastian. An Arab strap is a sexual device for retaining an erection. Arab Strap were reportedly less than pleased with their inclusion in the title of the album. When questioned about it, Arab Strap's leader/singer, Aiden, said \"They have a sense of humor.\" Malcolm, the band's instrumentalist, added, \"Because Arab Strap is quite an interesting name. The words go well .", "desc_lfm_artist": "Belle and Sebastian are a Scottish indie pop band that formed in 1994 in Glasgow, Scotland. Led by guitarist/vocalist Stuart Murdoch, the seven-piece band have an intimate, majestic sound that is equal parts folk-rock and '60s pop. Murdoch has a gift not only for whimsy and surrealism, but also for odd, unsettling lyrical detail which keeps the songs grounded in a tangible reality. \n\nBelle and Sebastian released their first two albums in 1996: Tigermilk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 65, "title": "The Sound of Perseverance", "artist": "Death", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/38702-the-sound-of-perseverance-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/38702-death-the-sound-of-perseverance.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "0cd38da9-90a9-3e0b-bef6-e70036c8a619", "yt_id": "XjB101k2Bog", "rym": "https://rateyourmusic.com/release/album/death/the-sound-of-perseverance/", "genres": ["Metal"], "desc_lfm_album": "The Sound of Perseverance is the seventh and final album by American death metal band Death. The album was released on August 31, 1998 through Nuclear Blast. The album, in particular, employs a style more akin to progressive metal than the earliest Death releases, although since Human and the albums following it, the band had been developing more toward this style. The average song length on this album is around six minutes. Also, it was a breakthrough album for drummer and later radio star Richard Christy, a fan favorite, in the tradition of previous drummers like Gene Hoglan and Sean .", "desc_lfm_artist": "There are multiple artists sharing the name Death; \n\n1) A pioneering death metal band from Altamonte Springs, Florida, U.S. \n2) A protopunk band from Detroit, Michigan, U.S. \n3) A horrorcore rapper from New Orleans, Louisiana, U.S. \n4) A hard techno producer from Germany. \n\n1)  Death was an American death metal band formed in Altamonte Springs, Florida in 1984 by guitarist and vocalist Chuck Schuldiner. Death is considered to be among the most influential", "desc_mb_album": "", "desc_mb_artist": "The band was originally started as [http://musicbrainz.org/show/artist/relationships.html?artistid=602427|Mantas] in 1983 and changed its name to Death a year later.", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 66, "title": "XO", "artist": "Elliott Smith", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4019-xo_225009.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4019-elliott-smith-xo.php", "aoty_critic_score": 84, "aoty_user_score": 87, "mbid": "5672afcd-18af-4c38-a62a-6a7d76f7e529", "yt_id": "MW0GYNFjyaM", "rym": "https://rateyourmusic.com/release/album/elliott-smith/xo", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "XO is the name of the fourth album recorded by American singer-songwriter Elliott Smith. Smith's first work on a major label, it was released by DreamWorks Records on August 25, 1998. Bong Load Custom Records released it on vinyl LP, which has since gone out of print. Vinyl copies of XO remained rare until a re-release by Plain Records in 2008. The album is also available as digital download. The singles from XO were \"Waltz #2 (XO)\" and \"Baby Britain\". An early working title for the album was Grand Mal. Smith recorded numerous songs during the XO sessions that did .", "desc_lfm_artist": "Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 67, "title": "The Miseducation of Lauryn Hill", "artist": "Lauryn Hill", "year": 1998, "cover": "https://dn710605.ca.archive.org/0/items/mbid-c6e5d8ca-89e3-303c-b649-85f577e0cbc6/mbid-c6e5d8ca-89e3-303c-b649-85f577e0cbc6-3376969940.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5507-lauryn-hill-the-miseducation-of-lauryn-hill.php", "aoty_critic_score": 89, "aoty_user_score": 91, "mbid": "8691d12c-abd8-385c-b1eb-d841190124f7", "yt_id": "c5v6s0vUbXY", "rym": "https://rateyourmusic.com/release/album/lauryn-hill/the-miseducation-of-lauryn-hill-7", "genres": ["soul", "r&b", "contemporary r&b", "alternative hip hop", "hip hop", "neo soul"], "desc_lfm_album": "\"The Miseducation of Lauryn Hill\" is the debut solo studio album by American rapper and singer-songwriter Lauryn Hill, released on August 25, 1998, by Ruffhouse Records and Columbia Records. Recorded after the Fugees went on hiatus, the album was written and produced primarily by Hill. It is a concept album centred on themes of self-education through love, exploring topics such as romantic relationships, personal growth, motherhood, and faith. Musically, it blends elements of neo soul and R&B with influences from hip-hop, reggae, and soul, and features guest appearances from Carlos Santana, Mary J. Blige, and D'Angelo. Following her time with .", "desc_lfm_artist": "Lauryn Noel Hill (born May 26, 1975 in East Orange, New Jersey) is an American musical artist, and record producer, initially establishing her reputation as the most visible and vocal member of the Fugees, then continued on to a solo career releasing The Miseducation of Lauryn Hill. Hill's works primarily in the neo-soul and alternative rap styles, among other influences from reggae and folk. After a four year hiatus, she released the controversial MTV Unplugged No.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 68, "title": "Psyence Fiction", "artist": "UNKLE", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/psyence-fiction.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5012-unkle-psyence-fiction.php", "aoty_critic_score": 78, "aoty_user_score": 81, "mbid": "17027712-7707-3791-ab65-5320e5ebe501", "yt_id": "ZNU1OFTRS_g", "rym": "https://rateyourmusic.com/release/album/unkle/psyence-fiction", "genres": [], "desc_lfm_album": "Psyence Fiction is the debut album by the group UNKLE, released in 1998 for Mo'Wax. \"Unreal\" is an instrumental version of the song \"Be There\" (featuring Ian Brown), which was released a year later as a single. On some early presses of the album, instrumental versions of \"Guns Blazing\" and \"The Knock\" were added as tracks 13 & 14. On some re-releases of this album, \"Be There\" was added as track 13. Some versions (mainly the Japanese release, but also the US promotional copy) contain the hidden track \"Intro (optional)\" as \"track zero\", which is actually the pre-gap (index 0) .", "desc_lfm_artist": "UNKLE, a musical outfit founded in 1994 in London, England, United Kingdom. Originally categorized as trip-hop, the group once included producer DJ Shadow and has employed a variety of guest artists and producers.\n\nFrom the sleeve notes for the latest release End Titles...Stories For Film released in July 2008, the current line-up is stated as James Lavelle and Pablo Clements, also a member of the Psychonauts.\n\nThe original line-up was James Lavelle, Tim Goldsworthy (now a member of DFA) and Kudo (Major Force West, Skylab).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 69, "title": "救済の技法 [Technique of Relief]", "artist": "平沢進 [Susumu Hirasawa]", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/91063--technique-of-relief_201929.jpg", "aoty_url": "https://www.albumoftheyear.org/album/91063-susumu-hirasawa--technique-of-relief.php", "aoty_critic_score": 87, "aoty_user_score": null, "mbid": null, "yt_id": "cq1FrjvuGiQ", "rym": null, "genres": [], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": []}, {"n": 70, "title": "My Arms, Your Hearse", "artist": "Opeth", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29839-my-arms-your-hearse.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29839-opeth-my-arms-your-hearse.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "da8433e6-a5df-3d6b-bf27-4aa069e8adee", "yt_id": "TIjEs1wFsOo", "rym": "https://rateyourmusic.com/release/album/opeth/my-arms-your-hearse", "genres": ["Metal", "Rock"], "desc_lfm_album": "My Arms, Your Hearse (often abbreviated to MAYH) is Opeth's third album, released in 1998. This album marks a large stylistic change from their previous release, Morningrise, especially production-wise. All of the songs are shorter than ten minutes, in stark contrast to their prior albums on which most songs exceed this. The album features a heavier overall sound, cleaner production and fewer mellow acoustic parts (although, the album contains three instrumental tracks, \"Prologue\", \"Madrigal\", and \"Epilogue\" and one mellow track, \"Credence\" which is devoid of death metal vocals). This was also Opeth's first concept album. This was Opeth's first album .", "desc_lfm_artist": "Opeth is a Swedish progressive metal band from Stockholm, formed in 1990. The band incorporates elements of folk, blues, classical, and jazz into its compositions, alongside influences from death metal, particularly in their early works. Their music often includes acoustic guitar passages, Mellotron use, death growls, and dynamic shifts.\n\nOpeth has experienced several lineup changes, with every original member eventually replaced. Mikael Åkerfeldt", "desc_mb_album": "", "desc_mb_artist": "The band logo was created by [https://musicbrainz.org/artist/0bf74085-4006-4a1e-b0c9-a3a3b504e7a2|Timo Ketola].", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 71, "title": "Beats and Breaks from the Flower Patch", "artist": "Kitty Craft", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/347278-beats-and-breaks-from-the-flower-patch.jpg", "aoty_url": "https://www.albumoftheyear.org/album/347278-kitty-craft-beats-and-breaks-from-the-flower-patch.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "7d0cc368-67a3-38b7-aaba-5e4a053c6464", "yt_id": "9gq61wzDE4A", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Kitty Craft is the alias of Minneapolis’ Pamela Valfer.\n\nHer music is a combination of simple but catchy hip-hop beats, ethereal synth lines, dreamy samples, and her angelic vocals.\n\nShe has released three albums, 'Kitty Craft' (often referred to as \"the Toytown tape\") on Toytown in 1995, 'Beats and Breaks from the Flower Patch' on Kindercore in 1998 and 'Catskills' on March Records in 2000.\n\nIn 2019, Kitty Craft began re-releasing her music on Takotsubo Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Rocky_stereo", "verygooood"]}, {"n": 72, "title": "LP5", "artist": "Autechre", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6863-lp5.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6863-autechre-lp5.php", "aoty_critic_score": 81, "aoty_user_score": 83, "mbid": "58726780-ad15-3b77-8da8-4baa681862e4", "yt_id": "kQN6WSK55uw", "rym": "https://rateyourmusic.com/release/album/autechre/lp5-1/", "genres": ["idm", "Electronic"], "desc_lfm_album": "Autechre creates a fascinating sonic world on their fifth album release, where electronic pulses and blips are used to create fantastic textural waves. Members Sean Booth and Rob Brown prove they've become masters of programming throughout, issuing a more than suitable follow-up to their critically praised 1995 release, Tri Repetae++ (1997's Chiastic Slide wasn't considered a true follow-up by the band). Although it may be hard to take for those uninitiated into Autechre's unique style (it's hard to detect melodies upon first listen), you'll discover something new with each repeated listen. Since all the songs are cut from the same .", "desc_lfm_artist": "Autechre (/ɔːˈtɛkər/) is the English electronic/IDM duo of Rob Brown and Sean Booth, signed with Warp Records.\n\nMuch of Autechre's music has a strong focus on complex rhythm and driving percussion, and more recently, on meticulous sequencing. Later work has been notably experimental and abstract, in contrast to the more club-friendly and conventional early 1990s releases.\n\nBooth and Brown formed the group in 1987 while they were both living in Rochdale, United Kingdom.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "sdecandelario"]}, {"n": 73, "title": "System of a Down", "artist": "System of a Down", "year": 1998, "cover": "https://dn710702.ca.archive.org/0/items/mbid-a7d56884-5561-48db-bc93-6828bc7d01ac/mbid-a7d56884-5561-48db-bc93-6828bc7d01ac-29540548339.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5385-system-of-a-down-system-of-a-down.php", "aoty_critic_score": 88, "aoty_user_score": 86, "mbid": "97f37409-b91a-3495-8e70-56fd9f7658c2", "yt_id": "dAs7Vi0D558", "rym": "https://rateyourmusic.com/release/album/system-of-a-down/system-of-a-down", "genres": ["isrc", "Metal", "Alternative Rock"], "desc_lfm_album": "System of a Down is the debut studio album by the American heavy metal band System of a Down, released on June 30, 1998, by American Recordings and Columbia Records. The album was certified Gold by the Recording Industry Association of America in February 2000. After the success of the band's following album, Toxicity (2001), System of a Down was certified platinum and has since gone double platinum. The album is generally considered nu metal and alternative metal, both of which would become staples for the band. Lyrical themes throughout the album vary, with many songs following a theme of .", "desc_lfm_artist": "System of a Down is an Armenian-American heavy metal band formed in Glendale, California, in 1994. Since 1997, the lineup has consisted of Serj Tankian (lead vocals, keyboards), Daron Malakian (guitar, vocals), and Shavo Odadjian (bass, backing vocals), along with drummer John Dolmayan, who replaced original drummer Andy Khachaturian.\n\nThe band achieved commercial success with five studio albums, three of which debuted at number one on the US Billboard 200.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Lonsonxd", "MaxtorUwU", "armandwave"]}, {"n": 74, "title": "Obscura", "artist": "Gorguts", "year": 1998, "cover": "https://dn710701.ca.archive.org/0/items/mbid-8ce52599-4faa-438e-bc7b-6a0a23a67596/mbid-8ce52599-4faa-438e-bc7b-6a0a23a67596-25471215852.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9476-gorguts-obscura.php", "aoty_critic_score": 90, "aoty_user_score": 84, "mbid": "eb122d7a-13d6-3bd8-a3f1-0ae8ffb753e1", "yt_id": "ugTuSqeL3XM", "rym": "https://rateyourmusic.com/release/album/gorguts/obscura", "genres": ["technical death metal", "rock", "Metal"], "desc_lfm_album": "Third full length album, released 1998 by Olympic Recordings. Produced & Engineered by Pierre Rémillard (also worked on Quo Vadis). Artwork by Alain Cloutier and Luc Lemay. Lineup: Steve Cloutier - Bass Patrick Robert - Drums Luc Lemay - Guitars, Vocals, Viola (track 2) Steeve Hurdle - Guitars, Vocals .", "desc_lfm_artist": "Gorguts is a technical death metal/avant-garde metal band that formed in 1989 in Sherbrooke, Quebec, Canada.  They have released five full-length albums to date, and released their first EP 'Pleiades' Dust' in 2016, which consists of a single 33-minute song. The band has experienced numerous lineup changes and musical transformations since their inception, with founding guitarist/vocalist Luc Lemay being the only remaining founding member. In 2005, following the suicide of drummer Steve MacDonald, the band broke up.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84"]}, {"n": 75, "title": "F♯ A♯ ∞ (Expanded Version)", "artist": "Godspeed You! Black Emperor", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53478-f-a-expanded-version_173611.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53478-godspeed-you-black-emperor-f-a-expanded-version.php", "aoty_critic_score": 83, "aoty_user_score": 93, "mbid": null, "yt_id": "wy4IsC5eb7o", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Godspeed You! Black Emperor (formerly punctuated Godspeed You Black Emperor! and abbreviated to GY!BE, GYBE or Godspeed) is a Canadian post-rock band based in Montreal, Quebec. \n\nFormed in 1994 in Montreal, Canada, the band has been highly influential within the post-rock genre. Working with orchestrated arrangements, the nine-piece group created tracks with wide dynamic ranges, a highly evocative use of instrumentation and sounds and uncompromising long form compositions.", "desc_mb_album": "", "desc_mb_artist": "Up to the release of “'''[https://musicbrainz.org/release-group/fc3cf08c-3273-3af3-84ed-ab9782a72505|Yanqui U.X.O.]'''”, GYBE placed the exclamation mark at the end of their name. It was then moved to match the [https://en.wikipedia.org/wiki/God_Speed_You!_Black_Emperor|film] they had taken their name from.\r\n----\r\n    * “''&#91;Yanqui U.X.O.&#93; marks the first release by the group after slightly altering their name (moving the exclamation mark from the \"emperor\" to the \"you\")''” -- [https://en.wikipedia.org/wiki/Yanqui_U.X.O.|Wikipedia]\r\n    * “''In the beginning of their career, they were known as \"Godspeed You Black Emperor!\", but the name was later changed to have the exclamation point after the word \"You\".''” [https://www.urbandictionary.com/define.php?term=godspeed+you+black+emperor", "heard_by": []}, {"n": 76, "title": "Adore", "artist": "The Smashing Pumpkins", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/3072-adore_125354.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3072-smashing-pumpkins-adore.php", "aoty_critic_score": 69, "aoty_user_score": 80, "mbid": "359699b3-8118-369e-9591-c96dcd07a853", "yt_id": "Zgy73S6v5sA", "rym": null, "genres": [], "desc_lfm_album": "Adore is the fourth studio album by American alternative rock band The Smashing Pumpkins. Virgin Records released the album on June 2, 1998 in the United States. Adore marked a change in sound for The Smashing Pumpkins; Greg Kot of Rolling Stone magazine noted that the album \"isn't just a transitional record; it's a complete break with the past.\" Their previously layered, guitar-oriented sound was largely replaced by a quieter and more electronic influenced sound, and incorporated drum machines and synthesizers. For the release, the band shed their alternative hipster image for a more subdued Gothic look. Billy admitted in .", "desc_lfm_artist": "The Smashing Pumpkins is an American alternative rock band from Chicago, Illinois. The band was formed in 1988 by Billy Corgan and James Iha, with bassist D'arcy Wretzky  and drummer Jimmy Chamberlin joining shortly after. Despite going through many lineup changes, the current lineup is identical to the original, with the exception of Wretzky, who would end up leaving the band just before their initial breakup in 2000.\n\nDisavowing the punk rock roots of many of their alt-rock contemporaries", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave", "sdecandelario", "verygooood"]}, {"n": 77, "title": "Sketches for My Sweetheart The Drunk", "artist": "Jeff Buckley", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/33666-my-sweetheart-the-drunk-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/33666-jeff-buckley-my-sweetheart-the-drunk.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "98dd8826-eae5-3700-957e-397bd0cf82d4", "yt_id": "KgHBlATk7go", "rym": null, "genres": [], "desc_lfm_album": "Sketches for My Sweetheart the Drunk is a collection of polished studio tracks and four-track demos recorded by Jeff Buckley. Being dissatisfied with material recorded in the summer of 1996 and early in 1997, Buckley worked on many demos to reach the sound he was hoping to achieve. To be titled My Sweetheart, the Drunk, the album was never finished, as the rest of the band were traveling to meet Buckley at the time of his death. It was released posthumously on 26 May 1998 (see 1998 in music). Despite its unfinished state, the album garnered many positive reviews; The .", "desc_lfm_artist": "Jeffrey Scott \"Jeff\" Buckley (raised Scott Moorhead; November 17, 1966 – May 29, 1997) was an American musician. After spending approximately a decade as a session guitarist in Los Angeles, he began performing in the early 1990s at venues in Manhattan’s East Village, where he developed a following. Buckley signed with Columbia Records and released his only studio album, \"Grace\", in 1994. He toured internationally to promote the album, performing in the United States, Europe, Japan, and Australia.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 78, "title": "Cowboy Bebop", "artist": "Seatbelts", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/73701-cowboy-bebop.jpg", "aoty_url": "https://www.albumoftheyear.org/album/73701-seatbelts-cowboy-bebop.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "2fd0a042-8c07-3c57-9189-d158e0c1cde1", "yt_id": "MbKNwOIB2Ps", "rym": "https://rateyourmusic.com/release/album/seatbelts/cowboy-bebop/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "シートベルツ (Seatbelts), the name of the band, according to the fictional description given in the anime series Cowboy Bebop, derives from how the performers wear seatbelts to be safe while they play hardcore jam sessions.\n\nThe band performed the whole soundtrack of the anime series Cowboy Bebop and produced a total of seven albums and one live DVD. Their style is very diverse and ranges from straightforward big band jazz, blues, acoustic ballads, hard rock, country, funk to electronic, hip-hop and experimental compositions/elements.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 79, "title": "It’s Dark and Hell Is Hot", "artist": "DMX", "year": 1998, "cover": "https://dn710206.ca.archive.org/0/items/mbid-cfca57c0-eac4-4d85-9a3f-e19e05e78aed/mbid-cfca57c0-eac4-4d85-9a3f-e19e05e78aed-29049611396.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "209b96ad-1846-34ff-ac3c-871f2e633d80", "yt_id": "Y8W6Sr32BYY", "rym": null, "genres": ["hip hop", "east coast hip hop", "hardcore hip hop", "horrorcore"], "desc_lfm_album": "", "desc_lfm_artist": "Earl Simmons (December 18, 1970 - April 9, 2021), better known by his stage name DMX (Dark Man X), was an American rapper from Yonkers, New York and actor signed to Ruff Ryders Entertainment. In 1998 he released his debut solo album, It's Dark and Hell Is Hot, and has since released 1998's Flesh of My Flesh, Blood of My Blood, 1999's ...And Then There Was X, 2001's The Great Depression, 2003's Grand Champ and 2006's Year of the Dog...Again. \n\nDMX died on April 9", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu"]}, {"n": 80, "title": "From the Choirgirl Hotel", "artist": "Tori Amos", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10220-from-the-choirgirl-hotel-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10220-tori-amos-from-the-choirgirl-hotel.php", "aoty_critic_score": 72, "aoty_user_score": 87, "mbid": "8fe72194-46ee-4fac-beea-125705bea7b6", "yt_id": "ohpp6-hgcuU", "rym": "https://rateyourmusic.com/release/album/tori-amos/from-the-choirgirl-hotel", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "Shortly before she began work on From the Choirgirl Hotel, Tori Amos suffered a miscarriage. While she was recording the album, she married her long-term boyfriend. As expected, both events cryptically wind their way into the album, which arguably has Amos' most personal lyrics since Little Earthquakes. The surprise is, From the Choirgirl Hotel is considerably more accessible than its immediate predecessor, Boys for Pele. Tori has opened up her sound by working live with a full band, bringing an immediacy to her sound that has never been heard before. Added to that are samples and drum loops, ballads supported .", "desc_lfm_artist": "Tori Amos (born Myra Ellen Amos; August 22, 1963) is an American singer-songwriter and pianist. She is classically trained and has a mezzo-soprano vocal range. Amos began composing instrumental piano pieces at a young age and won a full scholarship to the Peabody Institute at Johns Hopkins University when she was five, becoming the youngest person admitted. She left the institute at eleven after her scholarship was discontinued.\n\nIn the 1980s, Amos", "desc_mb_album": "", "desc_mb_artist": "Pip is one of several alter-egos created by Tori Amos for the American Doll Posse.  Pip is credited in the liner notes to that album.  Tori Amos also appeared as Pip to open several shows on the American Doll Posse tour.  More information can be found under the Personnel and Tour sections at [http://en.wikipedia.org/wiki/American_Doll_Posse#Personnel|Wikipedia].", "heard_by": ["Frikomid", "MaxtorUwU"]}, {"n": 81, "title": "Capital Punishment", "artist": "Big Pun", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/19258-capital-punishment_150101.jpg", "aoty_url": "https://www.albumoftheyear.org/album/19258-big-pun-capital-punishment.php", "aoty_critic_score": 87, "aoty_user_score": 86, "mbid": "ac26d603-af30-3f88-8cee-3b2be29ea9e1", "yt_id": "pW2pMG_tPuU", "rym": "https://rateyourmusic.com/release/album/big-pun/capital-punishment", "genres": ["Hip-Hop"], "desc_lfm_album": "", "desc_lfm_artist": "Christopher Rios (November 9, 1971 - February 7, 2000), better known as Big Pun or Big Punisher, was a Puerto Rican American rapper who emerged from the underground rap scene in The Bronx in the late 1990s. He first appeared on albums from The Beatnuts on the track \"Off the Books\" and on Fat Joe's second album Jealous One's Envy, on the track \"Watch Out\", prior to signing to Loud Records as a solo artist. Big Pun's career was cut short in 2000 at age 28 by a fatal heart attack due to his obesity.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo"]}, {"n": 82, "title": "Breath From Another", "artist": "Esthero", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/120744-breath-from-another.jpg", "aoty_url": "https://www.albumoftheyear.org/album/120744-esthero-breath-from-another.php", "aoty_critic_score": 70, "aoty_user_score": 85, "mbid": "9caf4bc7-51b9-393c-b6f7-f7d7aa10d67a", "yt_id": "vSLDgI5UxpI", "rym": "https://rateyourmusic.com/release/album/esthero/breath-from-another", "genres": [], "desc_lfm_album": "\"Breath From Another\" is the debut album by Ontario-native singer-songwriter Esthero, released April 14th, 1998. Despite poor sales at the time, the album is considered a classic in retrospect and a mandatory listen for the trip-hop genre. Produced by Doc, the album spun out 3 singles: \"Breath From Another\", \"Heaven Sent\", and \"That Girl.\" .", "desc_lfm_artist": "Born December 23, 1978 Canadian singer-songwriter and producer Jenny-Bea Englishman is better known as Esthero.\n\nAt the age of sixteen, Esthero moved from small town Harriston, Ontario on her own to Toronto, where she began singing at open-mic nights, a journey that in 1997 led to a meeting with the president of EMI Publishing Canada, whom she charmed so well during their first meeting that without hearing her sing a single note he was moved to set up and finance recording sessions with Doc, a guitarist and studio engineer.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "MaxtorUwU"]}, {"n": 83, "title": "Mezzanine", "artist": "Massive Attack", "year": 1998, "cover": "https://dn710600.ca.archive.org/0/items/mbid-6e512ec0-1316-4abb-b6b6-07dbd8b005ed/mbid-6e512ec0-1316-4abb-b6b6-07dbd8b005ed-12203062606.png", "aoty_url": "https://www.albumoftheyear.org/album/1570-massive-attack-mezzanine.php", "aoty_critic_score": 87, "aoty_user_score": 89, "mbid": "6f9f6899-c0d3-311d-ae87-a10ae6bc53a9", "yt_id": "fQtyrAEjHAU", "rym": "https://rateyourmusic.com/release/album/massive-attack/mezzanine", "genres": ["dub", "electronica", "leftfield", "trip hop", "post-industrial", "alternative dance"], "desc_lfm_album": "Mezzanine is the third studio album by English electronic music group Massive Attack, released on 20 April 1998 by Circa and Virgin Records. Produced by Massive Attack and Neil Davidge, it saw the duo expanding their trip hop sound to electronica stylings, with diverse influences from new wave, rock, hip hop, and dub music. Mezzanine topped the charts in the United Kingdom, Australia, Ireland, and New Zealand, becoming the group's most commercially successful album to date. It spawned four singles: Risingson, Teardrop, Angel, and Inertia Creeps. Background The production of Mezzanine was a stressful process. With tensions arising within the .", "desc_lfm_artist": "Massive Attack is an English trip hop collective formed in 1988 in Bristol by Robert \"3D\" Del Naja, Grant \"Daddy G\" Marshall, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles. The group consists of Del Naja and Marshall.\n\nTheir debut album, \"Blue Lines\" (1991), is frequently cited as the first major work of the trip hop genre. The single \"Unfinished Sympathy\" achieved chart success in Europe, including reaching number one on the Dutch Top 40. Their second album", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 84, "title": "Music Has the Right to Children", "artist": "Boards of Canada", "year": 1998, "cover": "https://dn710307.ca.archive.org/0/items/mbid-c77121b6-4552-3127-9f19-685a7f8f090f/mbid-c77121b6-4552-3127-9f19-685a7f8f090f-2226656435.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4018-boards-of-canada-music-has-the-right-to-children.php", "aoty_critic_score": 90, "aoty_user_score": 86, "mbid": "17d74d52-c92b-3b8d-9f87-218ab2d1c4a0", "yt_id": "OjvgGE_q-5I", "rym": "https://rateyourmusic.com/release/album/boards-of-canada/music-has-the-right-to-children/", "genres": ["idm", "Electronic"], "desc_lfm_album": "Music Has the Right to Children is the first publicly-released studio album by Boards of Canada and their first release under Warp Records, who would be home to their later releases. The album was met with critical acclaim, being hailed as a modern classic and labelled as a “thing of wonder” - “the aural equivalent of old Super 8 movies.” Marcus Eoin, in an interview done coinciding the albums release says “a lot of it is trying to capture a nostalgic feeling buried somewhere in our minds. We are nostalgic people trying to get back moments from our pasts.” He .", "desc_lfm_artist": "Boards of Canada is an electronic music duo from Edinburgh, Scotland, UK, formed in 1985 and comprised of brothers Mike Sandison (born 1 June 1970) and Marcus Eoin (born 21 July 1971). They have released a number of works, most notably the studio albums Music Has the Right to Children (1998), Geogaddi (2002), and The Campfire Headphase (2005) on the pioneering electronic music label Warp. Their fourth album Tomorrow's Harvest was released in June 2013.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 85, "title": "Moment of Truth", "artist": "Gang Starr", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9024-moment-of-truth_105424.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9024-gang-starr-moment-of-truth.php", "aoty_critic_score": 78, "aoty_user_score": 88, "mbid": "248b3e39-8504-3253-97be-e6afdf6c22fa", "yt_id": "b1EbbT7Xrgs", "rym": "https://rateyourmusic.com/release/album/gang-starr/moment-of-truth", "genres": ["hip hop", "jazz rap", "east coast hip hop", "Jazz", "Hip-Hop"], "desc_lfm_album": "Moment of Truth is the fifth album by hip hop duo Gang Starr, released on March 31, 1998 by Noo Trybe Records and Virgin Records. Gang Starr recorded Moment of Truth in sessions at D&D Studios. Released four years after its previous album, Hard to Earn, this album could be perceived as a comeback, with a newer, updated style of the group's already-established jazz-tinged hip hop, as stated by Guru in the introduction. Lyrically, the album is more emotional and socially conscious than previous installments. The album features more guest artists than previous Gang Starr releases. Collaborations include songs with .", "desc_lfm_artist": "Gang Starr was an influential American hip-hop duo, composed of late rapper Guru (Backronym for Gifted Unlimited Rhymes Universal, real name Keith Elam) and DJ Premier (real name Chris Martin). Premier originally from Houston and Guru from Boston, but they were based in and represented Brooklyn, New York, epitomizing the New York City hip-hop sound. The entirety of Gang Starr's catalog, especially Step In The Arena (1991) ,Daily Operation (1992), and Hard To Earn (1994) are well-respected among critics and hip-hop heads alike.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 86, "title": "This Is Hardcore", "artist": "Pulp", "year": 1998, "cover": "https://dn711204.ca.archive.org/0/items/mbid-83e396ab-d4b2-4220-96a2-54eb167ba63d/mbid-83e396ab-d4b2-4220-96a2-54eb167ba63d-17812149459.png", "aoty_url": "https://www.albumoftheyear.org/album/3601-pulp-this-is-hardcore.php", "aoty_critic_score": 78, "aoty_user_score": 82, "mbid": "1ab343e8-490d-32a6-a6c8-1e56cf33c888", "yt_id": "BQtmeyFQKN8", "rym": "https://rateyourmusic.com/release/album/pulp/this-is-hardcore", "genres": ["alternative rock", "art rock", "glam rock", "chamber pop", "indie rock", "britpop"], "desc_lfm_album": "The sixth album by English band Pulp, released 30 March 1998. It reached No. 1 in the UK Albums Chart, and was well received critically. The album was included in the book 1001 Albums You Must Hear Before You Die. In 2017, Pitchfork listed the album at number seven in its list \"The 50 Best Britpop Albums.\" .", "desc_lfm_artist": "Pulp is a britpop band that formed in 1978 in Sheffield, England, United Kingdom. The band's best known and most stable lineup consists of Jarvis Cocker (vocals), Russell Senior (guitar, violin), Mark Webber (guitar), Candida Doyle (keyboards), Steve Mackey (bass) and Nick Banks (drums). Although many members have had a long tenure with the band, the only constant member has been Cocker. In 2011, it was announced on Pulp's official website that the band's classic lineup would reunite and perform at several festivals", "desc_mb_album": "''It's OK to grow up - just as long as you don't grow old.  Face it... you are young.''", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 87, "title": "TNT", "artist": "Tortoise", "year": 1998, "cover": "https://dn710805.ca.archive.org/0/items/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1-22029271309.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4014-tortoise-tnt.php", "aoty_critic_score": 77, "aoty_user_score": 82, "mbid": "45f5f27c-9f31-32bd-bff3-1a89d53549ec", "yt_id": "2WGb_9UW6EU", "rym": "https://rateyourmusic.com/release/album/tortoise/tnt", "genres": ["electronica", "post-rock", "rock", "instrumental", "Electronic", "Alternative Rock"], "desc_lfm_album": "Expected by many to continue leading the post-rock brigade into a new fusion with dub and electronics, Tortoise instead turned yet another corner with their third album, TNT. Adding guitarist Jeff Parker to cement their musicianship as well as their connections to Chicago's fertile jazz/avant-garde scene, the band returned with a record of post-modern cool jazz, only slightly informed by the dub, Krautrock, and electronics of Millions Now Living Will Never Die. It shows from the first few seconds -- a lazy, slightly free drum solo frames a few tentative guitar chords and some teased effects, before the band kicks .", "desc_lfm_artist": "Tortoise's almost entirely instrumental music defies easy categorization.  The group gained significant attention from their early career. The members have roots in Chicago's fertile music scene, playing in various indie rock and punk groups.  Formed in 1990, Tortoise was among the first American indie rock bands to incorporate styles closer to Krautrock, dub, minimalism, electronica and various jazz styles, rather than the standard rock and roll and punk that had dominated indie rock for years.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 88, "title": "Stratosphere", "artist": "Duster", "year": 1998, "cover": "https://cdn2.albumoftheyear.org/600x0/album/29372-stratosphere.jpg", "aoty_url": "https://www.albumoftheyear.org/album/29372-duster-stratosphere.php", "aoty_critic_score": 89, "aoty_user_score": 85, "mbid": "764a8c35-aacc-3269-8b10-5972e051815a", "yt_id": "6aF4idGemkk", "rym": "https://rateyourmusic.com/release/album/duster/stratosphere", "genres": ["Alternative Rock"], "desc_lfm_album": "Stratosphere is the debut studio album by American space-rock band Duster. The album was released February 24, 1998, on the Up Records label in the United States. The album was primarily written and recorded by members Clay Parton and Canaan Dove Amber, with Jason Albertini contributing drums to three tracks. The band subsequently released the Contemporary Movement album in 2000. The 7th track from the CD version of the album, \"Echo, Bravo\", is omitted from the original LP .", "desc_lfm_artist": "Duster is a American slowcore band from San Jose, California formed in 1996 with an initial lineup of Clay Parton and Canaan Amber, former members of bands Calm and Mohinder. They are known for their unique lo-fi sound, recording their music onto cassette decks and similar equipment at their home studio nicknamed Low Earth Orbit.\n\nThe duo released two demo tapes in the same year as their formation, Christmas Dust and On The Dodge. In 1997, they released their debut 7\" EP Transmission, Flux via Up Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 89, "title": "Ray of Light", "artist": "Madonna", "year": 1998, "cover": "https://dn710603.ca.archive.org/0/items/mbid-08dcbc7b-2cd6-3155-bd02-631124dfa493/mbid-08dcbc7b-2cd6-3155-bd02-631124dfa493-7049214901.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8441-madonna-ray-of-light.php", "aoty_critic_score": 77, "aoty_user_score": 89, "mbid": "cb93e87f-5d21-3447-a6e8-22d44f9b0d7a", "yt_id": "QwSnUu9yCNs", "rym": "https://rateyourmusic.com/release/album/madonna/ray-of-light", "genres": ["blues", "electro", "dance", "electronica", "dance-pop", "house"], "desc_lfm_album": "Ray of Light is the seventh studio album by Madonna, released on February 22, 1998 by Maverick Records. The album is a pop and dance record, yet, it contains elements of electronic music within its composition, making it a departure from her previous work. Additionally, it incorporates several genres and subgenres, including techno and ambient. The album has several themes, including spirituality. After giving birth to her daughter Lourdes, Madonna collaborated with Patrick Leonard and William Orbit in developing the album. After failed sessions with other producers, Madonna pursued a new musical direction with Orbit and incorporated his extensive usage .",
