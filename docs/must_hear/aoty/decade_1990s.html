, "breakbeat", "electronic"], "desc_lfm_album": "Music for the Jilted Generation is an album by British band The Prodigy. The album was released through XL Recordings in July 1994. The album was re-released in 2008 as More Music for the Jilted Generation. The re-release includes remastered and bonus tracks. It is largely a response to the corruption of the rave scene in England by its mainstream status as well as Great Britain's Criminal Justice and Public Order Act 1994, which effectively criminalised raves, rave culture, and by implication, rave music itself. The latter is exemplified in the song \"Their Law\" (predominant lyric: \"Fuck 'em and their .", "desc_lfm_artist": "The Prodigy is an English electronic dance music band from Braintree, Essex, formed in 1990 by keyboardist and songwriter Liam Howlett. The line-up of the band has included MC and vocalist Maxim, dancer and vocalist Keith Flint (until his death in March 2019), dancer and live keyboardist Leeroy Thornhill (who left to pursue a solo career in 1999), and dancer and vocalist Sharky (1990-1991). Along with the Chemical Brothers and Fatboy Slim, The Prodigy are credited as pioneers of the breakbeat-influenced genre big beat", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 283, "title": "Welcome To Sky Valley", "artist": "Kyuss", "year": 1994, "cover": "https://dn710903.ca.archive.org/0/items/mbid-6205da21-55a9-457d-aa85-2f1262e25694/mbid-6205da21-55a9-457d-aa85-2f1262e25694-8267363147.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "eecc24d6-b4ba-39a9-818f-a6ec14a9a04f", "yt_id": "RxOTKRoPhIo", "rym": null, "genres": ["hard rock", "heavy metal", "stoner rock", "alternative metal", "stoner metal", "desert rock"], "desc_lfm_album": "Welcome to Sky Valley is the third studio album by American stoner rock/metal band Kyuss, originally released on June 28, 1994. Kyuss was recorded in early 1993 and scheduled for release in January 1994. They sneak-previewed the completed album at Foundations Forum 93 and contributed the song \"Demon Cleaner\" to the sampler disc. Due to mild success from their previous album, Kyuss had been promoted from their subsidiary record label \"Dali\" to the main label \"Chameleon.\" On November 11, 1993 Chameleon Records abruptly shut down. Their joint-venture partner Elektra quickly picked up the band and scheduled the album for release .", "desc_lfm_artist": "Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 284, "title": "Bee Thousand", "artist": "Guided By Voices", "year": 1994, "cover": "https://ia601208.us.archive.org/5/items/mbid-80727694-3ec0-3bb7-9c08-afa06dae8f3d/mbid-80727694-3ec0-3bb7-9c08-afa06dae8f3d-5507836043.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "b30f876f-1fe6-34ef-b334-9c68af820daa", "yt_id": "qN23OSUhsRE", "rym": null, "genres": ["indie rock"], "desc_lfm_album": "Bee Thousand is the seventh album by American indie rock band Guided by Voices released on June 21, 1994. It is noted for its poor fidelity, having been recorded on retail devices rather than in a studio, and for its abnormally brief song lengths. Nonetheless, the album has been considered to be among the most important of indie rock. The album's music draws inspiration from British Invasion-era rock music and punk rock, while the surreal lyrics are largely a reflection of principal songwriter Robert Pollard's experiences as a schoolteacher, a father, and a musician. Upon its release, Bee Thousand unexpectedly .", "desc_lfm_artist": "Guided by Voices is an American indie rock band formed in Dayton, Ohio, United States in 1983. The band's lineup has changed several times throughout the band's history, with its only constant member being singer/songwriter Robert Pollard. The band's current lineup consists of Robert Pollard (vocals, guitar), Bobby Bare Jr. (guitar), Doug Gillard (guitar), Mark Shue (bass) and Kevin March (drums). The band's 39th album, Nowhere to Go But Up, was released on November 24, 2023.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 285, "title": "Split", "artist": "Lush", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11170-split_164143.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11170-lush-split.php", "aoty_critic_score": 79, "aoty_user_score": 81, "mbid": "150b59e4-9f69-31e9-b6ae-f05512b71580", "yt_id": "ISHTsDZBqEs", "rym": "https://rateyourmusic.com/release/album/lush/split", "genres": [], "desc_lfm_album": "Split is the third studio album by English rock band Lush, released on 4AD on 13 June 1994 in the UK and a day later in the US. Two commercial singles were released from the album: \"Desire Lines\" and \"Hypocrite,\" both released on 30 May 1994. Split was reissued by 4AD on CD in July 2001. Lush chose to work with producer Mike Hedges because they \"loved\" his work on Sulk by the Associates, A Kiss in the Dreamhouse by Siouxsie and the Banshees, and Seventeen Seconds by the Cure, according to Miki Berenyi. They first recorded at Rockfield in .", "desc_lfm_artist": "Lush was a shoegaze/britpop band, formed in 1987 in London, England. The group consisted of Miki Berenyi and Emma Anderson on guitars and vocals, Philip King on bass, and Chris Acland on drums. Other members were the bassist Steve Rippon (from 1987 to 1992) and the vocalist Meriel Barham (from 1987 to 1988). Lush was one of the first shoegaze bands, later moving toward Britpop.\n\nAnderson and Berenyi had been friends since the early 1980s, and published the Alphabet Soup fanzine together.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "Rocky_stereo", "verygooood"]}, {"n": 286, "title": "Purple", "artist": "Stone Temple Pilots", "year": 1994, "cover": "https://dn721909.ca.archive.org/0/items/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016-24373460607.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5246-stone-temple-pilots-purple.php", "aoty_critic_score": 69, "aoty_user_score": 81, "mbid": "01d45519-54a6-3427-b0dc-222203fa5d57", "yt_id": "6EM6Uk1BICc", "rym": "https://rateyourmusic.com/release/album/stone-temple-pilots/purple", "genres": ["alternative rock", "hard rock", "acoustic rock", "grunge", "rock", "Rock"], "desc_lfm_album": "Purple is the second album released by the American rock band Stone Temple Pilots, on June 7, 1994, by Atlantic Records. It contains several of the band's biggest hit songs, including \"Vasoline,\" \"Interstate Love Song,\" and \"Big Empty,\" which was also featured on The Crow soundtrack. The album was a big success for STP, debuting at #1 (for three weeks, longer than any stay at the top by Nirvana, Alice In Chains, or Soundgarden) and being certified 6x platinum. In 2006, the album was ranked number 73 on Guitar World magazine's list of the greatest 100 guitar albums of all .", "desc_lfm_artist": "Stone Temple Pilots (also known by STP) is an American grunge band from San Diego, California, that originally consisted of Scott Weiland (lead vocals), brothers Dean (guitar) and Robert DeLeo (bass, backing vocals), and Eric Kretz (drums). The band's lineup remained unchanged from its formation in 1989 until the firing of Weiland in February 2013. Linkin Park vocalist Chester Bennington joined the band in May 2013 but left amicably in November 2015.", "desc_mb_album": "", "desc_mb_artist": "If you have found a file labeled as Stone Temple Pilots - Pour Some Sugar On Me, it is mislabeled. It is merely an acoustic version by Def Leppard in Singapore. (Usually, when a file is labeled as 'rare' or something, there's a good chance it's mislabeled.)", "heard_by": ["Lonsonxd", "Nubis84", "sdecandelario", "verygooood"]}, {"n": 287, "title": "Regulate... G Funk Era", "artist": "Warren G", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5817-regulate-g-funk-era-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5817-warren-g-regulate-g-funk-era.php", "aoty_critic_score": 77, "aoty_user_score": 80, "mbid": "7d2ec03f-4abb-3fef-b7e5-465334a47b54", "yt_id": "1plPyJdXKIY", "rym": "https://rateyourmusic.com/release/album/warren-g/regulate-g-funk-era", "genres": [], "desc_lfm_album": "Regulate... G Funk Era is the debut studio album by American rapper Warren G. It was released on June 7, 1994 by Violator Records and distributed by Rush Associated Labels. The album's biggest hit was the eponymous single \"Regulate\", a gritty depiction of West Coast gang life which samples singer Michael McDonald's hit \"I Keep Forgettin' (Every Time You're Near)\" and featured Nate Dogg. The album also contained the top ten hit \"This D.J.\" The song \"Regulate\" was also featured on the Above the Rim soundtrack, which was released on March 22, 1994. An altered version of the song \"So .", "desc_lfm_artist": "Warren Griffin III (born November 10, 1970 in Long Beach, California), better known simply as Warren G, is a Grammy award nominated American West Coast rapper, singer, DJ and producer signed to his own label, G-Funk Entertainment. In 1990, Warren G formed the group 213 with Nate Dogg and Snoop Dogg, and in 1994 he exploded onto the Long Beach rap scene with the smash single \"Regulate,\" a duet with Nate Dogg, and its accompanying album, Regulate...", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 288, "title": "Blade Runner", "artist": "Vangelis", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/49986-blade-runner.jpg", "aoty_url": "https://www.albumoftheyear.org/album/49986-vangelis-blade-runner.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "f393097a-b567-3253-9bdf-df353ee3e9e1", "yt_id": "EsmHr45H204", "rym": null, "genres": ["jazz", "progressive electronic", "space ambient"], "desc_lfm_album": "Blade Runner is the soundtrack album to the film of the same name directed by Ridley Scott. The soundtrack was composed by Vangelis. It is a dark, melodic combination of classic composition and futuristic synthesizers (mainly a Yamaha CS-80) which mirrors the film-noir retro-future envisioned by Scott. Vangelis, fresh from his Academy Award winning score from Chariots of Fire, composed and performed the music on his synthesizers. The album features vocal contributions from frequent Vangelis collaborator Demis Roussos, as well as a sax solo by Dick Morrissey on \"Love Theme.\" Ridley Scott also included the track \"Memories of Green\" from .", "desc_lfm_artist": "Evangelos Odysseas Papathanassiou (March 29, 1943 - May 17, 2022), known professionally as Vangelis, was a Greek composer of electronic, progressive, ambient, new age, jazz, and orchestral music. He is best known for his Academy Award-winning score for the film Chariots of Fire, composing scores for the films Blade Runner, Missing, Antarctica, 1492: Conquest of Paradise, and Alexander, and the use of his music in the PBS documentary Cosmos: A Personal Voyage by Carl Sagan.", "desc_mb_album": "It took until 1994 for an official Vangelis soundtrack to be released, so bootlegs appeared first.  These have since been expanded into various deluxe editions including more music from the film than the official release.\ artist": "Beastie Boys", "year": 1994, "cover": "https://dn710608.ca.archive.org/0/items/mbid-39a6464c-3131-41a7-b44e-cb19416678e0/mbid-39a6464c-3131-41a7-b44e-cb19416678e0-35289827554.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2440-beastie-boys-ill-communication.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "1134696c-1078-3c38-bcaa-4ee7c320670a", "yt_id": "u6bW7p3STQk", "rym": "https://rateyourmusic.com/release/album/beastie-boys/ill-communication", "genres": ["hardcore punk", "funk", "hip hop", "experimental hip hop", "instrumental hip hop", "east coast hip hop"], "desc_lfm_album": "Ill Communication is the fourth studio album by the American hip hop group Beastie Boys. It was released on May 31, 1994 by Grand Royal Records. Co-produced by Beastie Boys and Mario C., the album is among the band's most varied releases, drawing from hip-hop, punk rock, jazz and funk. Ill Communication features musical contributions from Money Mark, Eric Bobo and Amery \"AWOL\" Smith and vocal contributions from Q-Tip and Biz Markie. The Beastie Boys were influenced by Miles Davis' jazz rock albums Agharta and On the Corner while recording Ill Communication. Mike D and Adam Yauch collaborated with Gibran .", "desc_lfm_artist": "Beastie Boys were an American hip-hop trio from New York City, United States: Brooklyn and Manhattan. Originally formed as a four-piece hardcore punk band, The Young Aborigines, in 1978 by Michael Diamond (vocals), John Berry (guitar; died May 2016), Adam Yauch (bass) and Kate Schellenbach (drums), for the majority of its career the group consisted of Mike D (real name Michael Diamond),  Ad-Rock (Adam Horovitz) and, until his death in May 2012, MCA (Adam Yauch).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Nubis84", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 291, "title": "Weezer (Blue Album)", "artist": "Weezer", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1018-weezer-blue-album_175110.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1018-weezer-weezer-blue-album.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": null, "yt_id": "dx3DlA4YggQ", "rym": null, "genres": [], "desc_lfm_album": "Weezer (commonly known as the Blue Album) is the eponymous debut studio album by American rock band Weezer, released on May 10, 1994 by DGC Records. The album came two years after the band's founding, after they initially struggled as an alternative to grunge music, which was prevalent in Los Angeles during the early 1990s. It was almost entirely arranged and composed by frontman Rivers Cuomo, who also anticipated to lead the band in self-producing the album. However, at the behest of DGC, the band was required to include a producer, and collectively opted for Cars frontman Ric Ocasek. Most .", "desc_lfm_artist": "Weezer is an American alternative rock band formed in Los Angeles, California in 1992. They have released 15 full length albums, 1 cover album, six EPs, and a DVD. Their latest album, titled 'Van Weezer', came out on May 7th, 2021, Although, they released 4 EPs in 2022, known as SZNZ. They've sold over ten million records in the United States to date, and 35 million worldwide. They play music influenced by alternative bands and power pop artists among others.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84"]}, {"n": 292, "title": "Diary", "artist": "Sunny Day Real Estate", "year": 1994, "cover": "https://ia802906.us.archive.org/16/items/mbid-d4ab95e8-c07e-479b-8d6d-dadad2819195/mbid-d4ab95e8-c07e-479b-8d6d-dadad2819195-30781295626.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7602-sunny-day-real-estate-diary.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "12e88251-2cde-3bea-9cee-2d8c7fe65039", "yt_id": "4FRFcE-jsQo", "rym": "https://rateyourmusic.com/release/album/sunny-day-real-estate/diary-5/", "genres": ["alternative rock", "indie rock", "midwest emo", "emo", "Punk", "Alternative Rock"], "desc_lfm_album": "Diary is the debut studio album by American rock band Sunny Day Real Estate, released on May 10, 1994. The album is considered by many to be a defining emo album of the second wave, and key in the development of its subgenre, Midwest emo. It has also been called the \"missing link\" between post-hardcore and the nascent emo genre. .", "desc_lfm_artist": "Sunny Day Real Estate is an American alternative rock band formed in Seattle, Washington in 1992. The band helped bring the emo subgenre from an underground musical phenomenon to a wider audience. The band's lineup is Jeremy Enigk (vocals, guitars), Dan Hoerner (guitar), Nate Mendel (bass) and William Goldsmith (drums).\n\nThe core of Sunny Day Real Estate formed in 1992, originally under the name Empty Set. Empty Set consisted of Dan Hoerner (guitar, vocals), Nate Mendel (bass), and William Goldsmith (drums).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 293, "title": "Southernplayalisticadillacmuzik", "artist": "OutKast", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/southernplayalisticadillacmuzik-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2917-outkast-southernplayalisticadillacmuzik.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "2ee919fe-eab8-3fb5-a069-ef0220c29e09", "yt_id": "smiaRsFn3ok", "rym": "https://rateyourmusic.com/release/album/outkast/southernplayalisticadillacmuzik", "genres": ["Hip-Hop"], "desc_lfm_album": "Southernplayalisticadillacmuzik is the 1994 debut album of American hip hop duo OutKast. Southernplayalisticadillacmuzik was released by LaFace on April 26, 1994, and peaked at number 20 on the Billboard 200, eventually being certified platinum in the United States. The album has since been viewed by music journalists as an important release in both hip hop and Atlanta's music scene. .", "desc_lfm_artist": "OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "alberto_gu"]}, {"n": 294, "title": "Yank Crime", "artist": "Drive Like Jehu", "year": 1994, "cover": "https://ia800502.us.archive.org/33/items/mbid-883a8c08-4f08-4acc-b2a4-9f2d549ac696/mbid-883a8c08-4f08-4acc-b2a4-9f2d549ac696-23545562962.png", "aoty_url": "https://www.albumoftheyear.org/album/18302-drive-like-jehu-yank-crime.php", "aoty_critic_score": 83, "aoty_user_score": 85, "mbid": "532210d8-5101-3893-a2bb-f9cd8df6e303", "yt_id": "02MAcqIvX7w", "rym": "https://rateyourmusic.com/release/album/drive-like-jehu/yank-crime", "genres": ["noise rock", "post-hardcore", "math rock", "emo", "Rock", "Punk"], "desc_lfm_album": "", "desc_lfm_artist": "Drive Like Jehu was an American post-hardcore band from San Diego, California founded in 1990 by Rick Froberg (guitar, vocals), John Reis (guitar), Mike Kennedy (bass), and Mark Trombino (drums). \n\nFroberg and Reis had originally played in Pitchfork, but despite musical similarities, there were some significant changes in the lineup of Drive Like Jehu. Froberg, no longer just a vocalist, picked up a guitar, while Kennedy and Trombino formed the rhythm section of the new band after having played together in Night Soil Man", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Nubis84", "Rocky_stereo", "sdecandelario", "verygooood"]}, {"n": 295, "title": "Parklife", "artist": "Blur", "year": 1994, "cover": "https://dn721902.ca.archive.org/0/items/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd-27625936663.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3948-blur-parklife.php", "aoty_critic_score": 82, "aoty_user_score": 82, "mbid": "67461c8e-d864-3910-9bf4-39e44357aac9", "yt_id": "LCp77Yf54_k", "rym": "https://rateyourmusic.com/release/album/blur/parklife/", "genres": ["alternative rock", "indie rock", "britpop", "rock", "Pop", "Alternative Rock"], "desc_lfm_album": "Parklife is the third studio album by the English alternative rock band blur, released on 25 April 1994 on Food Records. After disappointing sales for their previous album Modern Life is Rubbish (1993), Parklife returned Blur to prominence in the UK, helped by its four hit singles: Girls & Boys, End of a Century, Parklife and To the End. The album was certified quadruple platinum in the United Kingdom. .", "desc_lfm_artist": "Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995).", "desc_mb_album": "", "desc_mb_artist": "Changed their name from ''[http://musicbrainz.org/show/artist/?artistid=79827|Seymour]'' in 1990 in order to secure a record deal.", "heard_by": ["Frikomid", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 296, "title": "Illmatic", "artist": "Nas", "year": 1994, "cover": "https://dn710902.ca.archive.org/0/items/mbid-f00af81c-9249-49d0-b3f5-8b6725bd1900/mbid-f00af81c-9249-49d0-b3f5-8b6725bd1900-28008351580.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4128-nas-illmatic.php", "aoty_critic_score": 95, "aoty_user_score": 93, "mbid": "28298e2c-4d70-3eed-a0f5-a3280c662b3d", "yt_id": "Ufc81wjxOyE", "rym": "https://rateyourmusic.com/release/album/nas/illmatic", "genres": ["hip hop", "jazz rap", "east coast hip hop", "conscious hip hop", "boom bap", "hardcore hip hop"], "desc_lfm_album": "\"Illmatic\" is the debut studio album by American rapper Nas, released on April 19, 1994, through Columbia Records. Nas signed with the label with the assistance of MC Serch and recorded the album in 1992 and 1993 at Chung King Studios, D&D Recording, Battery Studios, and Unique Recording Studios in New York City. Production was handled by DJ Premier, Large Professor, Pete Rock, Q-Tip, L.E.S., and Nas himself. The album is characterized as a hardcore hip-hop record, featuring multi-syllabic internal rhymes and narratives inspired by Nas’ upbringing in the Queensbridge Houses in Queens, New York. Nas began writing lyrics for .", "desc_lfm_artist": "Nasir bin Olu Dara Jones, more commonly known as Nas (formerly Nasty Nas and Escobar), born September 14, 1973 in Crown Heights, Brooklyn, New York, is a prominent American MC. The son of jazz musician Olu Dara, he was raised in the infamous Queensbridge housing projects in Queensbridge, New York. According to the Nasty Songfacts, as a teenager rapper, Nasir  first went by the nickname Kid Wave before adopting his more commonly known alias of Nasty Nas.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 297, "title": "His ’n’ Hers", "artist": "Pulp", "year": 1994, "cover": "https://dn711105.ca.archive.org/0/items/mbid-30a94519-0c6e-41ab-8a4e-77cccd91f477/mbid-30a94519-0c6e-41ab-8a4e-77cccd91f477-4392724826.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "a0394996-0923-324b-a176-cc1a572cb9e4", "yt_id": "armPuOw7GPo", "rym": null, "genres": ["alternative rock", "glam rock", "new wave", "indie rock", "neo-psychedelia", "britpop"], "desc_lfm_album": "", "desc_lfm_artist": "Pulp is a britpop band that formed in 1978 in Sheffield, England, United Kingdom. The band's best known and most stable lineup consists of Jarvis Cocker (vocals), Russell Senior (guitar, violin), Mark Webber (guitar), Candida Doyle (keyboards), Steve Mackey (bass) and Nick Banks (drums). Although many members have had a long tenure with the band, the only constant member has been Cocker. In 2011, it was announced on Pulp's official website that the band's classic lineup would reunite and perform at several festivals", "desc_mb_album": "Pulp's first album for Island. Runner-up for the 1994 Mercury Music Prize.\r\n\r\n''Please deliver us from matching sweatshirts and 'chicken in the rough', from evenings sat on Couple Row admiring the flock, from Sundays spent parading the aisles of Meadowhall. We don't want to live like this. It's bad for our health. Do something soon or it's curtains (just as long as they match the walls and the sofa).''", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 298, "title": "Let Love In", "artist": "Nick Cave & The Bad Seeds", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4340-let-love-in_160409.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4340-nick-cave-the-bad-seeds-let-love-in.php", "aoty_critic_score": 86, "aoty_user_score": 84, "mbid": "f369d4bf-71f1-31f5-9e01-ffdbf15acdbe", "yt_id": "jYyHXd5u45o", "rym": "https://rateyourmusic.com/release/album/nick-cave-and-the-bad-seeds/let-love-in", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Nick Cave & the Bad Seeds is an Australian post-punk band formed in Melbourne in 1983 by vocalist Nick Cave, multi-instrumentalist Mick Harvey and guitarist Blixa Bargeld. The band has featured international personnel throughout its career and has released a lengthy series of studio albums and completed numerous international tours. \n\nThe band presently consists of Cave, violinist and multi-instrumentalist Warren Ellis, bassist Martyn P. Casey (all from Australia)", "desc_mb_album": "", "desc_mb_artist": "Some releases are credited to \"Nick Cave & the Bad Seeds\" others are \"Nick Cave and the Bad Seeds.\" This is intentional on the part of the editors and matches the various releases. If you need to group them or normalize them in your own collection, use the %albumartistsort% variable (or something like \"$if2(%albumartistsort%,%albumartist%,%artistsort%,%artist%)\") in your tagger.\r\n\r\nDo not make arbitrary edits to the artist credits unless you can prove that your edit matches the release.", "heard_by": ["GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "verygooood"]}, {"n": 299, "title": "Live Through This", "artist": "Hole", "year": 1994, "cover": "https://dn710601.ca.archive.org/0/items/mbid-6d2787f1-f584-4a76-8a97-7926e96fd73e/mbid-6d2787f1-f584-4a76-8a97-7926e96fd73e-5236643887.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7006-hole-live-through-this.php", "aoty_critic_score": 84, "aoty_user_score": 83, "mbid": "fe676d05-f97c-303a-890b-da53c69e5d42", "yt_id": "q5bWWNbvPmY", "rym": "https://rateyourmusic.com/release/album/hole/live-through-this", "genres": ["alternative rock", "grunge"], "desc_lfm_album": "Live Through This is the second studio album by American alternative rock band Hole, released on April 12, 1994, by DGC Records. Recorded in late 1993, it departed from the band's unpolished hardcore aesthetics to more refined melodies and song structure. Frontwoman Courtney Love said that she wanted the record to be \"shocking to the people who think that we don't have a soft edge\", but maintain a harsh sensibility. The album was produced by Sean Slade and Paul Q. Kolderie and mixed by Scott Litt and J Mascis. The lyrics and packaging reflect Love's thematic preoccupations with beauty, and .", "desc_lfm_artist": "Hole was an American alternative rock band formed by singer and guitarist Courtney Love and lead guitarist Eric Erlandson in Los Angeles, California in 1989. Influenced by Los Angeles' punk rock scene, and produced by Kim Gordon of Sonic Youth, the band's debut album, Pretty on the Inside, attracted critical interest from British and American alternative press. Their second album, Live Through This, released 1994 by DGC Records, which featured less aggressive melodies and more restrained lyrical content", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 300, "title": "Da lama ao caos", "artist": "Chico Science & Nação Zumbi", "year": 1994, "cover": "https://e.snmc.io/i/600/w/445a81246ab793d2083906eb96b8001d/12247749", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "b09ea0ac-051f-3d7d-b54b-432d1ad5cde6", "yt_id": "f4Ptgb2HaXU", "rym": "https://rateyourmusic.com/release/album/chico-science-and-nacao-zumbi/da-lama-ao-caos/", "genres": [], "desc_lfm_album": "Da Lama ao Caos é o primeiro álbum de estúdio da banda pernambucana Chico Science & Nação Zumbi, lançado em 1994. Considerado um verdadeiro clássico da música brasileira, apresentou um som revolucionário, com canções energéticas, muito bem elaboradas, mesclando funk rock com maracatu, embolada, psicodelia e música Afro. Além disso, foi o disco que inaugurou a cena Manguebeat e foi também um dos responsáveis pela \"abertura de portas\" para o rock dos anos 90 exercendo uma influencia muito forte para o que surgiria depois. O álbum está na lista dos 100 melhores discos da música brasileira da Rolling Stone na .", "desc_lfm_artist": "Chico Science & Nação Zumbi (CSNZ) was the former name of the Brazillian band led by Chico Science prior to his death on February 2, 1997. The remaining musicians continued on under the name Nação Zumbi.\n\nCSNZ released two albums by the time of Chico's death, Da Lama ao Caos (From Mud to Chaos) in 1994 and Afrociberdelia in 1996. Both were critically acclaimed.\n\nThe band was the major name in the fertile musical scene in the Brazillian city of Recife by the 90's.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 301, "title": "Far Beyond Driven", "artist": "Pantera", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6979-far-beyond-driven_082050.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6979-pantera-far-beyond-driven.php", "aoty_critic_score": 74, "aoty_user_score": 81, "mbid": "60b55a8c-fe68-3397-91a3-7444cab57d7b", "yt_id": "rIdjLL13gdI", "rym": "https://rateyourmusic.com/release/album/pantera/far-beyond-driven", "genres": [], "desc_lfm_album": "Far Beyond Driven is the seventh studio album by American heavy metal band Pantera, released on March 22, 1994 by East West Records. Pantera's fastest-selling album, it peaked at number 1 on the Billboard 200 and was certified Platinum by the RIAA. The album was also certified Platinum by the Canadian Recording Industry Association. Far Beyond Driven is the first album by Pantera where the band's guitarist Darrell Abbott is credited as \"Dimebag Darrell\", having changed his nickname from \"Diamond Darrell\" soon after Vulgar Display of Power was released. The Japanese and the Driven Downunder Tour '94 Souvenir Collection editions .", "desc_lfm_artist": "Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre", "desc_mb_album": "", "desc_mb_artist" 1994, "cover": "https://ia800305.us.archive.org/22/items/mbid-3a602a84-c2a7-48c3-9103-d708885ce870/mbid-3a602a84-c2a7-48c3-9103-d708885ce870-38627889680.jpg", "aoty_url": "https://www.albumoftheyear.org/album/34287-selena-amor-prohibido.php", "aoty_critic_score": 79, "aoty_user_score": 82, "mbid": "bc5e0495-4db9-3dae-9883-104d5df6b2cc", "yt_id": "TqgxucQP6MA", "rym": "https://rateyourmusic.com/release/album/selena/amor-prohibido-4", "genres": ["latin", "tejano", "cumbia", "Pop"], "desc_lfm_album": "Amor Prohibido (English: Forbidden Love) is the name of an album by Latin superstar Selena. The album remains as the biggest selling Latin album of all time, being certified 20x Platinum (Latin type) by the RIAA for selling over 2 million copies. The album produced four number-one singles (one posthumous) on the Billboard Hot Latin Tracks chart, the only Spanish album by a female to achieve this feat. Album history Continuing the formula of previous albums, A.B. Quintanilla III teamed up with Pete Astudillo and Ricky Vela to come up with what they hoped would be a successful Selena album. .", "desc_lfm_artist": "Selena Quintanilla-Pérez (April 16, 1971 - March 31, 1995), known mononymously as Selena, was an American with Mexican heritage singer who is regarded as one of the biggest stars of the Tejano genre of music. She was born in Lake Jackson, Texas and grew up in Corpus Christi, Texas, where she began her musical career. Her father, Abraham Quintanilla Jr., was a singer with the original Los Dinos from 1957-1972, and nurtured the burgeoning musical talent of his children.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "MaxtorUwU", "alberto_gu", "verygooood"]}, {"n": 304, "title": "Superunknown", "artist": "Soundgarden", "year": 1994, "cover": "https://dn720709.ca.archive.org/0/items/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c-2236678397.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4175-soundgarden-superunknown.php", "aoty_critic_score": 97, "aoty_user_score": 86, "mbid": "8300fe9c-0022-3c55-8a3e-8dc61f282e8c", "yt_id": "fELbXTDl5Ao", "rym": "https://rateyourmusic.com/release/album/soundgarden/superunknown", "genres": ["psychedelic rock", "alternative rock", "hard rock", "stoner rock", "grunge", "alternative metal"], "desc_lfm_album": "Superunknown is the fourth album by the American grunge band Soundgarden. It was released on March 8, 1994 through A&M Records. The band began work on the album after touring in support of its previous album, Badmotorfinger. The resulting album captured the creativity and heaviness of the band's earlier releases while displaying a more diverse range of influences. The album was a critical and commercial success and became the band's breakout album. It peaked at number one on the Billboard 200 and reached high positions on charts worldwide. Five singles were released from the album: The Day I Tried to .", "desc_lfm_artist": "Soundgarden was an American rock band formed in Seattle, Washington, in 1984 by singer and drummer Chris Cornell, lead guitarist Kim Thayil, and bassist Hiro Yamamoto. Cornell switched to rhythm guitar in 1985, and the drum position was taken over first by Scott Sundquist and then by Matt Cameron in 1986. Yamamoto departed in 1989 and was replaced briefly by Jason Everman before Ben Shepherd joined later that year. Soundgarden disbanded in 1997 and reunited in 2010.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 305, "title": "The Downward Spiral", "artist": "Nine Inch Nails", "year": 1994, "cover": "https://ia601606.us.archive.org/7/items/mbid-2d410836-5add-3661-b0b0-168ba1696611/mbid-2d410836-5add-3661-b0b0-168ba1696611-2546761764.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4339-nine-inch-nails-the-downward-spiral.php", "aoty_critic_score": 84, "aoty_user_score": 90, "mbid": "7c4cab8d-dead-3870-b501-93c90fd0a580", "yt_id": "fnw_UbJmmbY", "rym": "https://rateyourmusic.com/release/album/nine-inch-nails/the-downward-spiral", "genres": ["alternative rock", "art rock", "industrial", "industrial rock", "industrial metal", "alternative metal"], "desc_lfm_album": "The Downward Spiral (also known as Halo 8) is Nine Inch Nails' second studio album, though it is largely considered the third major release after the Broken EP, which consisted of entirely new material. It was released on March 8, 1994. It is likely the most acclaimed and well-known of the band's discography, and is said to have brought \"industrial\" music to the mainstream. A collection featuring remixes from The Downward Spiral was released as Further Down The Spiral on June 1, 1995. Inspiration Trent Reznor has stated in various interviews some of the ideas and inspiration behind the album: .", "desc_lfm_artist": "Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated", "desc_mb_album": "", "desc_mb_artist": "Please note the following about Nine Inch Nails releases:\n\n    * Certain tracks frequently included on Nine Inch Nails bootlegs are not actually Nine Inch Nails tracks; however they do feature Trent on vocals. These include:\n        * [http://musicbrainz.org/track/9f249bf3-af50-43b6-a820-b52091ca757d.html|1000 Homo DJs - Supernaut (Trent Reznor vocal version)] (studio)\n        * [http://musicbrainz.org/track/8440e3d4-d78e-49e7-9cf6-14e87ba53a8b.html|Tori Amos - Past The Mission] (studio)\n        * [http://musicbrainz.org/track/8ee4f9e3-6ff2-436d-bcb2-4f87dde6c0ae.html|David Bowie - Hallo Spaceboy] (live, vocal duet; played with Bowie's band on stage)\n        * [http://musicbrainz.org/track/c9a1f57b-a18d-4ede-bb91-cba7b6765890.html|David Bowie - Warszawa] (live, vocal duet, played with Bowi", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 306, "title": "Hard to Earn", "artist": "Gang Starr", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9025-hard-to-earn.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9025-gang-starr-hard-to-earn.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "6b3d273c-0548-3e58-a879-727ef831f4e5", "yt_id": "SlrhxMIA0Uw", "rym": "https://rateyourmusic.com/release/album/gang-starr/hard-to-earn", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "\"Hard to Earn\" is the fourth studio album by American hip-hop duo Gang Starr. It was released on March 8, 1994, by Chrysalis and EMI Records in North America. The album featured the singles \"Mass Appeal\", (their first charting single on the Billboard Hot 100 chart), \"DWYCK\" (featuring Nice & Smooth), and \"Code of the Streets\". Guest appearances on the album include Group Home, Jeru the Damaja, and Big Shug. At the time, all were part of the Gang Starr Foundation, which made the album a stepping-stone for future DJ Premier-helmed projects by Group Home and Jeru. Hard to Earn .", "desc_lfm_artist": "Gang Starr was an influential American hip-hop duo, composed of late rapper Guru (Backronym for Gifted Unlimited Rhymes Universal, real name Keith Elam) and DJ Premier (real name Chris Martin). Premier originally from Houston and Guru from Boston, but they were based in and represented Brooklyn, New York, epitomizing the New York City hip-hop sound. The entirety of Gang Starr's catalog, especially Step In The Arena (1991) ,Daily Operation (1992), and Hard To Earn (1994) are well-respected among critics and hip-hop heads alike.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "verygooood"]}, {"n": 307, "title": "Selected Ambient Works, Volume II", "artist": "Aphex Twin", "year": 1994, "cover": "https://ia800307.us.archive.org/16/items/mbid-6682f0f1-426a-43e4-a003-a8146365e41b/mbid-6682f0f1-426a-43e4-a003-a8146365e41b-17422813399.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "0e7a233f-81f8-3e63-ad07-6cdfe2faecc3", "yt_id": "MW3tcBRe41w", "rym": null, "genres": ["drone", "industrial"], "desc_lfm_album": "This is the correct title for the album, according to musicbrainz.org. Leave your ID3 tags the way they are. .", "desc_lfm_artist": "Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 308, "title": "In The Nightside Eclipse", "artist": "Emperor", "year": 1994, "cover": "https://dn711109.ca.archive.org/0/items/mbid-0cab65f8-7b6c-43f4-8c23-f397d86fcab3/mbid-0cab65f8-7b6c-43f4-8c23-f397d86fcab3-5918217027.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e8170089-f81a-3103-bb22-e6f43c4fcaf9", "yt_id": "2axi_m0BD-o", "rym": null, "genres": ["metal", "black metal", "symphonic black metal"], "desc_lfm_album": "In the Nightside Eclipse was the first full-length album and fourth official release by Norwegian black metal band Emperor. It is considered a defining release for the black metal genre, and is regarded by many fans as one of the greatest black metal albums ever made. It features one of Emperor's best-known songs, \"I Am the Black Wizards\". It was recorded in July, 1993 at Grieghallen and released in 1994 by Candlelight Records. The cover was drawn by \"Necrolord\", also known as Kristian Wåhlin. .", "desc_lfm_artist": "1) Emperor is a Norwegian black metal band formed in 1991, regarded as highly influential by critics and emerging black metal bands. The group split up in 2001, but reunited from 2005 to 2007 for a few festival dates and brief US tours, and again reunited in 2013 to 2014. Emperor reformed for the third time in 2016. The group was founded by Ihsahn (guitar/vocal) and Samoth (then, drums).\n\nFull Wikipedia article: https://en.wikipedia.org/wiki/Emperor_(band)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "armandwave", "sdecandelario", "verygooood"]}, {"n": 309, "title": "I Could Live In Hope", "artist": "Low", "year": 1994, "cover": "https://dn710903.ca.archive.org/0/items/mbid-2f4394d1-c5fa-493c-99dc-58d96b5864cf/mbid-2f4394d1-c5fa-493c-99dc-58d96b5864cf-13971905416.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "05605e58-2923-319e-87f0-3cdbf97f57f8", "yt_id": "8ruU-MohvMY", "rym": null, "genres": ["indie rock", "dream pop", "slowcore", "post-rock"], "desc_lfm_album": "", "desc_lfm_artist": "There are at least seven artists with this name:\n1) Low is an American indie rock/slowcore band from Duluth.\n2) Low is a German industrial punk rock band from Berlin.\n3)  Low is a Danish rapper.\n4) Low is a Spanish hip hop artist.\n5)  low is a doujin artist.\n6) Low (White Leaves)is a Japanese artist.\n7) Low is a member of CLOSER.\n\n1)  Low was a slowcore band formed in Duluth, Minnesota, United States in 1993, by Alan Sparhawk (guitar and vocals), Mimi Parker (drums and vocals) and original bassist John Nichols (bass guitar).", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 310, "title": "Transilvanian Hunger", "artist": "Darkthrone", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/53670-transilvanian-hunger.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53670-darkthrone-transilvanian-hunger.php", "aoty_critic_score": 90, "aoty_user_score": 80, "mbid": "bc9a4ab3-2ce0-3a49-b48f-3742169d0636", "yt_id": "X_xUwGNlIyU", "rym": "https://rateyourmusic.com/release/album/darkthrone/transilvanian-hunger/", "genres": ["Metal", "Punk"], "desc_lfm_album": "Transilvanian Hunger is the fourth album by Darkthrone. Released in 1994, it was the band's first album to be recorded with just two members, Nocturno Culto (lead guitar, bass, vocals) and Fenriz (drums, rhythm guitar, bass). The band would remain a duo from this point onwards. However they claim that this record is somewhat atypical for Darkthrone, since it is much more monotone, more simplistic, and it was made with a very \"raw\" or \"low fidelity\" recording style. The back cover of the album states that \"Darkthrone is for all the evil in man\". All Music Guide notes that the .", "desc_lfm_artist": "Darkthrone is a Norwegian metal band from Kolbotn, Akershus. Formed in 1986 as a death metal band named Black Death, in 1991 Darkthrone embraced a black metal style influenced by Bathory and Celtic Frost and became one of the leading bands in the Norwegian black metal scene. Their first three black metal albums A Blaze in the Northern Sky (1992), Under a Funeral Moon (1993) and Transilvanian Hunger (1994) are sometimes dubbed the \"Unholy Trinity\".", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario", "verygooood"]}, {"n": 311, "title": "Crooked Rain, Crooked Rain", "artist": "Pavement", "year": 1994, "cover": "https://ia800607.us.archive.org/5/items/mbid-8684f971-08a2-3551-8e5c-a87440408725/mbid-8684f971-08a2-3551-8e5c-a87440408725-23540686482.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1474-pavement-crooked-rain-crooked-rain.php", "aoty_critic_score": 86, "aoty_user_score": 85, "mbid": "4f348977-6f44-39f9-b243-071927ecc6a4", "yt_id": "4IED3Q5VLeg", "rym": "https://rateyourmusic.com/release/album/pavement/crooked-rain-crooked-rain-11", "genres": ["alternative rock", "indie rock", "noise pop", "rock", "Alternative Rock"], "desc_lfm_album": "Crooked Rain, Crooked Rain is an album released by Pavement in 1994. With this album, the band abandoned the lo-fi sound displayed on Slanted and Enchanted (as well as their drummer, Gary Young). During the tour for Slanted, the band added percussionist Bob Nastanovich and bassist Mark Ibold; partway through this album's recording sessions, Gary Young was replaced by Steve West. The album featured the band at its most easily accessible, and the single \"Cut Your Hair\" was the band's closest brush with mainstream success. As of 2007, the album has sold almost 500,000 copies and was a UK Top .", "desc_lfm_artist": "Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 312, "title": "Hex", "artist": "Bark Psychosis", "year": 1994, "cover": "https://dn711001.ca.archive.org/0/items/mbid-6c13438f-0179-3d15-b6c8-03da5231d3fa/mbid-6c13438f-0179-3d15-b6c8-03da5231d3fa-10191158066.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8863-bark-psychosis-hex.php", "aoty_critic_score": 90, "aoty_user_score": 83, "mbid": "926e41b0-52b6-3234-9f5e-7c9b7e72a85d", "yt_id": "jtFgAisNn1A", "rym": "https://rateyourmusic.com/release/album/bark-psychosis/hex/", "genres": ["post-rock", "Electronic", "Alternative Rock"], "desc_lfm_album": "Hex is the debut studio album by English post-rock band Bark Psychosis. It was released on February 14, 1994 by Circa Records in the United Kingdom and on 11 March 1994 by Caroline Records in the United States. The term \"post-rock\" was coined by music journalist Simon Reynolds in his review of the album for Mojo magazine. Reception to Hex was generally positive. Melody Maker described Hex as \"the work of a band nourished by constant evolution and is unquestionably divine\" and \"a gorgeously intense 50 minutes\". The NME referred to the band as \"nothing less than completely captivating\" and .", "desc_lfm_artist": "Bark Psychosis are a band from east London, England formed in 1986. Graham Sutton is the core of the group, supported by a dynamic roster of musicians. The line up for the seminal album \"Hex\" was Graham Sutton, Daniel Gish, John Ling, and Mark Simnett. Current members include Sutton, Colin Bradley, Lee Harris (formerly with Talk Talk), and others. Formed as a Napalm Death cover band when Sutton, Ling and Simnett were in their teens, they released several singles and EPs from 1988 to 1994.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 313, "title": "Dookie", "artist": "Green Day", "year": 1994, "cover": "https://dn720706.ca.archive.org/0/items/mbid-20fef8d3-72b5-369a-9712-ad0b1ee6d226/mbid-20fef8d3-72b5-369a-9712-ad0b1ee6d226-7378765590.png", "aoty_url": "https://www.albumoftheyear.org/album/3933-green-day-dookie.php", "aoty_critic_score": 93, "aoty_user_score": 82, "mbid": "314cffd4-daa5-3337-85e5-e54165a96113", "yt_id": "koyYZc6hS-s", "rym": "https://rateyourmusic.com/release/album/green-day/dookie", "genres": ["alternative rock", "punk", "punk rock", "pop punk", "skate punk", "alternative punk"], "desc_lfm_album": "Dookie is the third studio album and the major label debut by American Alternative rock band Green Day. The album was the band's first collaboration with producer Rob Cavallo. Released on February 1st, 1994 through Reprise Records, Dookie became a worldwide commercial success, reaching number two on the U.S. Billboard 200 and charting in seven countries. The album helped to propel Green Day into mainstream popularity, amid claims from the punk rock community that the band had \"sold out\". Dookie produced five singles for the band: \"Longview\", the re-recorded \"Welcome to Paradise\", \"Basket Case\", the radio-only single \"She\" and \"When .", "desc_lfm_artist": "Green Day is an American rock band formed in Rodeo, California, in 1987, by lead singer and guitarist Billie Joe Armstrong and bassist and backing vocalist Mike Dirnt, with drummer Tré Cool joining in 1990. The band’s major-label debut, \"Dookie,\" released through Reprise Records in 1994, achieved commercial success, eventually shipping over 20 million copies in the United States, and has been credited with renewing mainstream interest in punk rock.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "Nubis84", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 314, "title": "Under The Pink", "artist": "Tori Amos", "year": 1994, "cover": "https://ia801808.us.archive.org/19/items/mbid-908eb6f6-793a-400b-9ec4-444e6fb168da/mbid-908eb6f6-793a-400b-9ec4-444e6fb168da-32519938617.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11611-tori-amos-under-the-pink.php", "aoty_critic_score": 79, "aoty_user_score": 84, "mbid": "ef2b891f-ca73-3e14-b38b-a68699dab8c4", an, Judy Reynolds, Julie Larson, Cindy Palmano, Karen Binns, Ina Meibach. All the musicians", "desc_mb_artist": "Pip is one of several alter-egos created by Tori Amos for the American Doll Posse.  Pip is credited in the liner notes to that album.  Tori Amos also appeared as Pip to open several shows on the American Doll Posse tour.  More information can be found under the Personnel and Tour sections at [http://en.wikipedia.org/wiki/American_Doll_Posse#Personnel|Wikipedia].", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84"]}, {"n": 315, "title": "Jar of Flies", "artist": "Alice in Chains", "year": 1994, "cover": "https://cdn2.albumoftheyear.org/600x0/album/6673-jar-of-flies_051430.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6673-alice-in-chains-jar-of-flies.php", "aoty_critic_score": 85, "aoty_user_score": 86, "mbid": "3b6b7688-c97b-3d11-9334-3158468074f7", "yt_id": "uAxyAVGennM", "rym": null, "genres": [], "desc_lfm_album": "Jar of Flies is the third studio EP by the American rock band Alice in Chains, released on January 25, 1994 through Columbia Records. It is the first EP in music history to debut at number one on the Billboard 200 Chart and was well-received by critics. According to Staley, the title for the album came from a science experiment Cantrell conducted in third grade: \"They gave him two jars full of flies. One of the jars they overfed, the other jar they underfed. The one they overfed flourished for a while, then all the flies died from overpopulation. The .", "desc_lfm_artist": "Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style", "desc_mb_album": "", "desc_mb_artist": "Originally named ‘Diamond Lie’. Following the addition of Layne Staley, they were also periodically named ‘Mothra’ and ‘Fuck’ (amongst other names) until settling on ‘Alice in Chains’, after Staley’s [artist:5ec4ba3a-83b9-4623-9f63-8a1e3cfa1de5|old band].", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 316, "title": "Dubnobasswithmyheadman", "artist": "Underworld", "year": 1994, "cover": "https://dn710700.ca.archive.org/0/items/mbid-60f59c97-528c-3d70-a68e-f4ff44207cfc/mbid-60f59c97-528c-3d70-a68e-f4ff44207cfc-13698079115.jpg", "aoty_url": "https://www.albumoftheyear.org/album/6613-underworld-dubnobasswithmyheadman.php", "aoty_critic_score": 89, "aoty_user_score": 83, "mbid": "3fa924b2-aae8-3ab6-b2d3-f647a8a8e8f6", "yt_id": "is2RBNWz8JQ", "rym": "https://rateyourmusic.com/release/album/underworld/dubnobasswithmyheadman", "genres": ["psychedelic", "dub", "leftfield", "acid house", "techno", "progressive house"], "desc_lfm_album": "Dubnobasswithmyheadman (stylised as dubnobasswithmyheadman) is the third studio album by English electronic music group Underworld, released in the United Kingdom on Junior Boy's Own on 24 January 1994. It was the first Underworld album after the 1980s version of the band had made the transition from synthpop to techno and progressive house and is also the first album to feature Darren Emerson as a band member. .", "desc_lfm_artist": "Underworld are a British electronic music group initially formed in Cardiff, Wales in 1979 (as \"The Screen Gemz\"), and is primarily the collaborative project of Karl Hyde and Rick Smith.\n\nBy the early 1980s, Smith and Hyde's post-punk Screen Gemz had morphed into the flamboyant new wave pop quintet Freur, who managed a respectable hit in 1983 with \"Doot Doot\". They went on to release two albums, \"Doot Doot\" (1983), and \"Get Us Out Of Here\" (1986), as well as performing the score for the 1985 movie \"Underworld\" (later \"Transmutations\").", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 317, "title": "Doggystyle", "artist": "Snoop Dogg", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/5808-doggystyle-2.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5808-snoop-dogg-doggystyle.php", "aoty_critic_score": 86, "aoty_user_score": 84, "mbid": "63760049-abfe-47f1-935c-24e2d1ac06d1", "yt_id": "TxlKe2oXows", "rym": null, "genres": ["Hip-Hop"], "desc_lfm_album": "Doggystyle is the debut album from American rapper Snoop Dogg, released by Death Row Records on November 23, 1993. The album was recorded soon following the release of Dr. Dre's landmark debut album The Chronic (1992), to which Snoop Dogg contributed significantly. His musical stylizations for the album share similarity to those featured on Doggystyle.Critics have praised Snoop Dogg for the lyrical \"realism\" he delivers on the album and for his distinctive vocal flow.Despite some mixed criticism of the album initially upon its release, Doggystyle has earned recognition from many music critics as one of the most significant albums of .", "desc_lfm_artist": "Snoop Dogg (born Calvin Cordozar Broadus Jr.; October 20, 1971), previously known as Snoop Doggy Dogg, is an American rapper, singer, record producer, songwriter, and actor. He is a prominent figure in West Coast hip-hop and played a significant role in the popularization of G-funk and gangsta rap. He is noted for his distinctive drawled vocal delivery and melodic flow, and his lyrics frequently address themes such as recreational drug use and gun violence.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["armandwave"]}, {"n": 318, "title": "Enter the Wu‐Tang (36 Chambers)", "artist": "Wu‐Tang Clan", "year": 1993, "cover": "https://dn711305.ca.archive.org/0/items/mbid-2a059e43-e66c-4d6d-9a4f-dea9a6919061/mbid-2a059e43-e66c-4d6d-9a4f-dea9a6919061-10112836421.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4127-wu-tang-clan-enter-the-wu-tang-36-chambers.php", "aoty_critic_score": 98, "aoty_user_score": 92, "mbid": "610fb60f-900a-3c42-ac7d-f6b6aa8035f9", "yt_id": "daK3XFw5Rsc", "rym": null, "genres": ["hip hop", "east coast hip hop", "boom bap", "hardcore hip hop"], "desc_lfm_album": "", "desc_lfm_artist": "", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 319, "title": "Midnight Marauders", "artist": "A Tribe Called Quest", "year": 1993, "cover": "https://dn710707.ca.archive.org/0/items/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c-9900302771.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4605-a-tribe-called-quest-midnight-marauders.php", "aoty_critic_score": 83, "aoty_user_score": 89, "mbid": "c2afedfb-034a-3683-ad47-e4404cd7c485", "yt_id": "CVKrrs5K9v0", "rym": "https://rateyourmusic.com/release/album/a-tribe-called-quest/midnight-marauders", "genres": ["alternative hip hop", "hip hop", "jazz rap", "east coast hip hop", "conscious hip hop", "boom bap"], "desc_lfm_album": "Midnight Marauders is the third studio album by American hip hop group A Tribe Called Quest, released on November 9, 1993, by Jive Records. It had major commercial success and is regarded as one of the greatest albums in hip hop, as well as one of the the group's best. Recording sessions for the album occurred at Battery Studios, Platinum Island Studios and Scorcerer Sound in New York City. Its production was mainly handled by Q-Tip, with contributions from Skeff Anselm, Large Professor and the group's DJ, Ali Shaheed Muhammad. .", "desc_lfm_artist": "A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 320, "title": "Amor amarillo", "artist": "Gustavo Cerati", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/59719-amor-amarillo.jpg", "aoty_url": "https://www.albumoftheyear.org/album/59719-gustavo-cerati-amor-amarillo.php", "aoty_critic_score": 70, "aoty_user_score": 81, "mbid": "ac98f1fe-9afe-39c8-be60-0f6cb2024a55", "yt_id": "WlracwwxpPM", "rym": "https://rateyourmusic.com/release/album/gustavo-cerati/amor-amarillo", "genres": [], "desc_lfm_album": "Amor Amarillo (Spanish for \"Yellow Love\") is the first solo album by Argentine rock musician Gustavo Cerati, released on November 1, 1993, as a side-project, while he was still active in Soda Stereo. .", "desc_lfm_artist": "Gustavo Adrián Cerati Clarke, (Buenos Aires - Argentina: August 11th, 1959 --- September 4th, 2014: Buenos Aires - Argentina) better known as Gustavo Cerati was an Argentinean guitarist, producer, occasional bass player, dj, lyricist, and vocalist. During the 1980's and until the mid-1990's he was the visible leader of Soda Stereo, -arguably one of Latin America's most important rock bands. \n\nCerati was in a coma for over four years, after suffering a stroke on May 15", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 321, "title": "Vs.", "artist": "Pearl Jam", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/2874-vs_153330.jpg", "aoty_url": "https://www.albumoftheyear.org/album/2874-pearl-jam-vs.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "50ac60c4-fb35-37f8-a065-222996ea139c", "yt_id": "hJoK221y65I", "rym": "https://rateyourmusic.com/release/album/pearl-jam/vs", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "Vs. is the second studio album by the American alternative rock band Pearl Jam, released on October 19, 1993 through Epic Records. After a relentless touring schedule in support of its debut album, Ten (1991), Pearl Jam headed into the studio in early 1993 facing the challenge of following up the commercial success of its debut. The resulting album, Vs., featured a rawer and more aggressive sound compared with the band's previous release. Pearl Jam decided to scale back its commercial efforts for Vs., including declining to produce music videos for any of the album’s singles. Upon its release, Vs. .", "desc_lfm_artist": "Pearl Jam is an American grunge/alternative rock band formed in Seattle, Washington, in 1990. The band's lineup consists of founding members Jeff Ament (bass guitar), Stone Gossard (rhythm guitar), Mike McCready (lead guitar), and Eddie Vedder (lead vocals, guitar), as well as Matt Cameron (drums), who joined in 1998. Keyboardist Boom Gaspar has also been a touring/session member with the band since 2002. Drummers Jack Irons, Dave Krusen, Matt Chamberlain, and Dave Abbruzzese are former members of the band.", "desc_mb_album": "", "desc_mb_artist": "Current band members: [http://musicbrainz.org/artist/1a60d6dd-9d3e-40fc-a66d-3184f9ee0d61.html|Eddie Vedder] (vocals), [http://musicbrainz.org/artist/ca7e6e03-4973-45ef-8833-98774a2d4138.html|Stone Gossard] (guitar), [http://musicbrainz.org/artist/16cb4a74-225a-4262-a885-628083f12460.html|Mike McCready] (guitar), [http://musicbrainz.org/artist/2781b946-104c-47d3-a573-2eade82f68cd.html|Jeff Ament] (bass guitar) and [http://musicbrainz.org/artist/07e93890-46a1-4ebd-9a70-3988a2135d87.html|Matt Cameron] (drums).\r\n\r\nAll bootlegs of concerts should be named --> \"date: venue, city, state, country\". See the album list below for examples. On the official bootlegs covers there is a number, that number should be added at the end of the title like: \"date: venue, city, state, country (#<number>)\" with ", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 322, "title": "Enta da Stage", "artist": "Black Moon", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/60176-enta-da-stage.jpg", "aoty_url": "https://www.albumoftheyear.org/album/60176-black-moon-enta-da-stage.php", "aoty_critic_score": 75, "aoty_user_score": 82, "mbid": "47afb438-72a6-3cb8-aa61-7df13de6e9ab", "yt_id": "iuYF1OLaHNs", "rym": "https://rateyourmusic.com/release/album/black-moon/enta-da-stage-5", "genres": [], "desc_lfm_album": "Enta da Stage is the debut album of American East Coast hip hop group Black Moon, released on October 19, 1993 through Nervous Records. Enta da Stage served as a precursor to the resurgence of the New York hip hop scene in the mid-1990s. .", "desc_lfm_artist": "There are four bands by the name of Black Moon:\n\n1)  Black Moon (Brothers who Lyrically Act and Combine Kickin Music Out On Nations) is a Hip Hop group from Brooklyn, New York which debuted in 1992, with the release of the single \"Who Got Da Props?\". The song became something of an underground phenomenon, and charted on the Billboard Hot 100. With the help of DJ Chuck Chillout, the group landed a record deal with Nervous Records for the release of their debut album Enta Da Stage, released in late 1993.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "alberto_gu"]}, {"n": 323, "title": "Four-Calendar Café", "artist": "Cocteau Twins", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10879-four-calendar-cafe_222757.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10879-cocteau-twins-four-calendar-cafe.php", "aoty_critic_score": 75, "aoty_user_score": 81, "mbid": "4757dca4-6c26-35ae-b271-24ed9ca6ea4f", "yt_id": "zv9NimPx3Es", "rym": "https://rateyourmusic.com/release/album/cocteau-twins/four-calendar-cafe", "genres": [], "desc_lfm_album": "Cocteau Twins' first release following their exodus from the 4AD stable, Four-Calendar Cafe is also, tellingly, their most earthbound effort; as with Heaven or Las Vegas, the emphasis here is on substance as much as style -- \"Evangeline,\" \"Bluebeard,\" and \"Know Who You Are at Every Age\" continue the trio's advance into more accessible melodic and lyrical ground without sacrificing even an ounce of their trademark ethereality. .", "desc_lfm_artist": "Cocteau Twins was a Scottish rock band active from 1979 to 1997. The group was formed in Grangemouth, Scotland, by Robin Guthrie (guitar, drum machine) and Will Heggie (bass), with Elizabeth Fraser (vocals) joining in 1981. In 1983, Heggie was replaced by multi-instrumentalist Simon Raymonde, completing the lineup most associated with the band’s career. Cocteau Twins became known for their ethereal, heavily layered sound and Fraser’s distinctive soprano vocal style, often featuring lyrics that avoid conventional language.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Rocky_stereo", "alberto_gu", "paqueradejere", "verygooood"]}, {"n": 324, "title": "Heartwork", "artist": "Carcass", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/12493-heartwork.jpg", "aoty_url": "https://www.albumoftheyear.org/album/12493-carcass-heartwork.php", "aoty_critic_score": 74, "aoty_user_score": 83, "mbid": "0c151ec8-7252-33b8-bef9-a889872ce10d", "yt_id": "TJg-1ZJ_tTc", "rym": "https://rateyourmusic.com/release/album/carcass/heartwork", "genres": ["Metal"], "desc_lfm_album": "This is the fourth album by Carcass. It was released through Earache Records on October 18, 1993. It has been called their \"breakthrough\" album. .", "desc_lfm_artist": "Carcass is an English death metal band from Liverpool, formed in 1985. The band has undergone several line-up changes, with guitarist Bill Steer and bassist-vocalist Jeff Walker remaining the only constant members. They disbanded in 1996 but reformed in 2007 without original drummer Ken Owen for health reasons. To date, the band has released seven studio albums, two compilation albums, four EPs, two demo albums, one video album, and six music videos.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "Nubis84", "sdecandelario"]}, {"n": 325, "title": "Painful", "artist": "Yo La Tengo", "year": 1993, "cover": "https://ia600809.us.archive.org/24/items/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd-21480189175.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4613-yo-la-tengo-painful.php", "aoty_critic_score": 83, "aoty_user_score": 82, "mbid": "43f61ece-3bac-3e2e-8b37-72c9278d243e", "yt_id": "dmvXdKXi-tk", "rym": "https://rateyourmusic.com/release/album/yo-la-tengo/painful", "genres": ["alternative rock", "indie rock", "rock", "Alternative Rock"], "desc_lfm_album": "Painful is the sixth studio album by American indie rock band Yo La Tengo, released in 1993 by record label Matador, their first for the label. The album marked a creative shift from Yo La Tengo's previous work, blending atmospheric and ambient sounds with their famous noise jams. Painful features a much more melody-driven Yo La Tengo in its hazy, dream-like songwriting. Two versions of the track \"Big Day Coming\" are present on the album and display the range of musical stylings Yo La Tengo works with; the first version features a simple organ melody accompanied by a soft bass .", "desc_lfm_artist": "Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "armandwave", "verygooood"]}, {"n": 326, "title": "So Tonight That I Might See", "artist": "Mazzy Star", "year": 1993, "cover": "https://ia803100.us.archive.org/29/items/mbid-f3686430-4792-4e0f-b105-45f68c459c64/mbid-f3686430-4792-4e0f-b105-45f68c459c64-37044044892.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5582-mazzy-star-so-tonight-that-i-might-see.php", "aoty_critic_score": 83, "aoty_user_score": 81, "mbid": "2863caa0-14e9-3016-83e4-4f0cdab55f4f", "yt_id": "gYbBL_3XLEM", "rym": "https://rateyourmusic.com/release/album/mazzy-star/so-tonight-that-i-might-see", "genres": ["psychedelic rock", "alternative rock", "psychedelic folk", "shoegaze", "dream pop", "slowcore"], "desc_lfm_album": "So Tonight That I Might See is the second studio album by American alternative rock band Mazzy Star, released on October 5, 1993. The album's first track, \"Fade into You\", became the band's first and only single to make the Billboard Hot 100 chart, peaking at number 44 and charting at number 48 on the UK Singles Chart. In a highly positive review, Steve Hochman of the Los Angeles Times called So Tonight That I Might See \"far more narcotic and hypnotic than anything the whole techno-trance universe has digitally blipped up to date.\" NME described it as an \"even .", "desc_lfm_artist": "Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 327, "title": "93 'til Infinity", "artist": "Souls of Mischief", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8876-93-til-infinity.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8876-souls-of-mischief-93-til-infinity.php", "aoty_critic_score": 98, "aoty_user_score": 84, "mbid": "1187d51f-81b4-4b79-815d-524bf7524fe0", "yt_id": "KRLUFEJBTyE", "rym": null, "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "One of hip-hop's great lost masterpieces, 93 'Til Infinity is the best single album to come out of Oakland's Hieroglyphics camp, and ranks as a seminal early classic of the West Coast underground. The Souls of Mischief weren't even out of their teens when they completely redefined the art of lyrical technique for the West Coast, along with fellow standard-bearers Freestyle Fellowship, the Pharcyde, and Hiero founder Del tha Funkee Homosapien. The Souls come off as four brash young MCs who are too smart for their own good, yet they're so full of youthful exuberance that it's impossible to dislike .", "desc_lfm_artist": "Souls of Mischief is a hip-hop group from Oakland, California, that is also part of the hip-hop collective Hieroglyphics. The Souls of Mischief formed in 1991 and is composed of rappers A-Plus, Opio, Phesto, and Tajai.\n\nEast Oakland native Tajai began rhyming with future bandmate A-Plus at age 8, while both were in elementary school. Tajai and Phesto met later in junior high school. Tajai recruited his best friend Phesto in middle school and A-Plus", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo", "alberto_gu", "verygooood"]}, {"n": 328, "title": "In Utero", "artist": "Nirvana", "year": 1994, "cover": "https://dn710700.ca.archive.org/0/items/mbid-7d13c434-1c49-4d7f-b164-a5247108af01/mbid-7d13c434-1c49-4d7f-b164-a5247108af01-19918667556.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3668-nirvana-in-utero.php", "aoty_critic_score": 90, "aoty_user_score": 89, "mbid": "2a0981fb-9593-3019-864b-ce934d97a16e", "yt_id": "GrLUUVfKeUw", "rym": "https://rateyourmusic.com/release/album/nirvana/in-utero", "genres": ["alternative rock", "noise rock", "punk", "post-hardcore", "grunge", "pigfuck"], "desc_lfm_album": "In Utero is the third and final studio album by the American alternative rock band Nirvana, released on September 21, 1993 by DGC Records. Following the success of the group's 1991 breakthrough album Nevermind, Nirvana sought to avoid that album's polished production and hired recording engineer Steve Albini to produce the record. The band recorded In Utero with Albini in two weeks in February 1993, capturing an abrasive and naturalistic sound for the record. While some of the songs had been written years prior, the lyrics largely dealt with frontman Kurt Cobain's reflections on his newfound fame and recent personal .", "desc_lfm_artist": "There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s.", "desc_mb_album": "", "desc_mb_artist": "Nirvana is a band whose shows and session recordings have been widely bootlegged as unofficial videos, CDs and raw WAV/FLAC files and mp3s. Details of these releases have been added to Musicbrainz where emo tape of the song \"Plug Tunin'\".", "desc_mb_album": "", "desc_mb_artist": "Please don’t add the album [http://musicbrainz.org/release-group/4aebff62-baae-4017-a9e4-12cbbc4ecc7b|“First Serve”] here. It is already there with the correct Artist [http://musicbrainz.org/artist/a904f60a-b8d2-4ed5-90b5-569bf28d1a80|“First Serve”].", "heard_by": ["MaxtorUwU", "verygooood"]}, {"n": 330, "title": "Cure for Pain", "artist": "Morphine", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/20437-cure-for-pain.jpg", "aoty_url": "https://www.albumoftheyear.org/album/20437-morphine-cure-for-pain.php", "aoty_critic_score": 82, "aoty_user_score": 81, "mbid": "c27c4bc3-98da-33ea-ad7a-5a765ccf9580", "yt_id": "6xMHmevf0kg", "rym": "https://rateyourmusic.com/release/album/morphine/cure-for-pain", "genres": ["Jazz", "Alternative Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Morphine was formed in Cambridge, Massachusetts, United States in 1990 by Mark Sandman (vocals, bass) and Dana Colley (saxophone). Jerome Dupree became the group's drummer in 1991 prior to the release of their debut album, Good. \"Low Rock\" is Morphine's unique combination of jazz, blues and pop/rock, sung with darkly comic and ironic lyrics.  Their guitarless sound relied on an unusual combination of baritone/tenor sax, percussion and a two string slide bass.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 331, "title": "Chaos A.D.", "artist": "Sepultura", "year": 1993, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8489-chaos-ad_122515.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8489-sepultura-chaos-ad.php", "aoty_critic_score": 79, "aoty_user_score": 84, "mbid": "b53fdd53-f70c-3580-ad92-04f7fe77b254", "yt_id": "jw48joavvpc", "rym": "https://rateyourmusic.com/release/album/sepultura/chaos-a_d", "genres": ["Metal"], "desc_lfm_album": "Chaos A.D. is the fifth studio album by Brazilian heavy metal band Sepultura, released in late 1993 through Roadrunner Records. This was the record that helped the group transcend their previous death/thrash style, deepening their forays into hardcore punk, industrial music and Brazilian-styled percussion. It would later become one of the founding pillars of the groove metal subgenre. It won silver and gold certifications throughout Europe and the USA, and was considered their first step into the metal mainstream Out of the boredom of playing the Arise songs for two years straight and the threat of musically stagnating, Sepultura pushed .", "desc_lfm_artist": "Sepultura (Portuguese word for \"Grave\") is a Brazilian metal band from Belo Horizonte. Formed in 1984 by brothers Max and Igor Cavalera, the band was a major force in the groove metal, thrash metal, and death metal genres during the late 1980s and early 1990s, with their later experiments drawing influence from alternative metal, world music, nu metal, hardcore punk, and industrial metal. Sepultura has also been credited as one of the second wave of thrash metal acts from the late 1980s and early-to-mid 1990s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "MaxtorUwU", "alberto_gu", "armandwave", "sdecandelario"]}, {"n": 332, "title": "Transient Random Noise Bursts With Announcements", "artist": "Stereolab", "year": 1993, "cover": "https://dn721602.ca.archive.org/0/items/mbid-72fb3432-bba6-3d05-8402-22c437087dd6/mbid-72fb3432-bba6-3d05-8402-22c437087dd6-36492024046.png", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "9cb80efb-6b1a-3d7b-aff8-86f051737d91", "yt_id": "CgNwXjhrip4", "rym": "https://rateyourmusic.com/release/album/stereolab/transient-random-noise-bursts-with-announcements", "genres": ["space rock", "krautrock", "indie rock", "noise pop", "post-rock", "indie pop"], "desc_lfm_album": "", "desc_lfm_artist": "Stereolab is an Anglo-French avant-
