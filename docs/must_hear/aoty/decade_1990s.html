 "armandwave"]}, {"n": 117, "title": "S.C.I.E.N.C.E.", "artist": "Incubus", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/15512-science.jpg", "aoty_url": "https://www.albumoftheyear.org/album/15512-incubus-science.php", "aoty_critic_score": 69, "aoty_user_score": 82, "mbid": "f3fae816-c675-3a4d-9240-b4cf364b25c1", "yt_id": "O3GRldZkRxg", "rym": "https://rateyourmusic.com/release/album/incubus/s_c_i_e_n_c_e", "genres": [], "desc_lfm_album": "S.C.I.E.N.C.E. is the second studio album by American rock band Incubus. It was released on September 9th, 1997, by Epic and Immortal Records. The album was certified gold by the RIAA, and is the second and final release to feature Gavin Koppel (known as DJ Lyfe), who first appeared on the 1997 Enjoy Incubus EP. It has been occasionally considered the band's proper debut album, due to the nature of their independent release Fungus Amongus. After recording their independent debut album Fungus Amongus (1995), Incubus signed a seven-record deal with Epic/Sony-affiliated Immortal Records in 1996. An EP titled Enjoy Incubus .", "desc_lfm_artist": "There are multiple artists using this name:\n\n1. Incubus is an American alternative rock band formed in 1991 and based in Calabasas, California. The lineup has included Brandon Boyd (vocals, percussion), Mike Einziger (guitar), Nicole Row (bass), Jose Pasillas II (drums), and DJ Chris Kilmore (turntables). Former members include Gavin Koppel (turntables), Alex Katunich, also known as Dirk Lance (bass), and Ben Kenney (bass). The band’s name was selected", "desc_mb_album": "", "desc_mb_artist": "Please do not add the track \"Turning Japanese\" as a work by Incubus. See http://incubus-online-view.com/iframe/songindex.php for a list of legitimate and misidentified tracks.", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "sdecandelario"]}, {"n": 118, "title": "If You're Into It, I'm Out of It", "artist": "Christoph de Babalon", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/56907-if-youre-into-it-im-out-of-it_124740.jpg", "aoty_url": "https://www.albumoftheyear.org/album/56907-christoph-de-babalon-if-youre-into-it-im-out-of-it.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "9091ccc2-07f0-3d44-930e-d9fca43c47c0", "yt_id": "Zgub2SL4Q8o", "rym": "https://rateyourmusic.com/release/album/christoph-de-babalon/if-youre-into-it-im-out-of-it", "genres": [], "desc_lfm_album": "If You're Into It, I'm Out of It is the second album by electronic producer Christoph de Babalon, initially released on September 15, 1997 through Digital Hardcore Recordings. It is noted for its dark, heavy atmosphere, as it combines the musical stylings of dark ambient, breakcore, and drum and bass. Since its release, it has gained a cult following and received much critical praise. .", "desc_lfm_artist": "Christoph de Babalon is known for tripping beats, dark wide spaces and eternal melancholy. He released his first record in 1994 on Hamburg's cult-label Fischkopf. This record (as well as all that followed over the next years) were extensively played by BBC-DJ-legend John Peel. Right after his debut he began working with Alec Empire's Digital Hardcore Recordings (DHR) where he, besides a couple of other records released his most important work: the legendary album 'If You're Into It, I'm Out of It'.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Nubis84"]}, {"n": 119, "title": "F♯ A♯ ∞", "artist": "Godspeed You Black Emperor!", "year": 1997, "cover": "https://dn710107.ca.archive.org/0/items/mbid-f1d70484-3379-4dfa-88dd-affab4cb0307/mbid-f1d70484-3379-4dfa-88dd-affab4cb0307-40876181789.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "01d06c6e-a4e6-3d8b-8a45-42a598fe87d7", "yt_id": "ft0v_NoeljQ", "rym": null, "genres": ["drone", "slowcore", "post-rock", "ambient americana"], "desc_lfm_album": "", "desc_lfm_artist": "Godspeed You! Black Emperor (formerly punctuated Godspeed You Black Emperor!; abbreviated to GYBE) is a Canadian post-rock band formed in 1994 and based in Montreal, Quebec. One of the first musical acts to publish their albums through the Constellation Records label, they have since released three studio albums and one EP.\n\nThe nine-piece group is well-known for working on a near-orchestral scale, utilizing such techniques as wide dynamic ranges", "desc_mb_album": "", "desc_mb_artist": "Up to the release of “'''[https://musicbrainz.org/release-group/fc3cf08c-3273-3af3-84ed-ab9782a72505|Yanqui U.X.O.]'''”, GYBE placed the exclamation mark at the end of their name. It was then moved to match the [https://en.wikipedia.org/wiki/God_Speed_You!_Black_Emperor|film] they had taken their name from.\r\n----\r\n    * “''&#91;Yanqui U.X.O.&#93; marks the first release by the group after slightly altering their name (moving the exclamation mark from the \"emperor\" to the \"you\")''” -- [https://en.wikipedia.org/wiki/Yanqui_U.X.O.|Wikipedia]\r\n    * “''In the beginning of their career, they were known as \"Godspeed You Black Emperor!\", but the name was later changed to have the exclamation point after the word \"You\".''” [https://www.urbandictionary.com/define.php?term=godspeed+you+black+emperor", "heard_by": ["armandwave", "verygooood"]}, {"n": 120, "title": "Fantasma", "artist": "Cornelius", "year": 1997, "cover": "https://dn721908.ca.archive.org/0/items/mbid-72582f70-5df2-4bf8-8685-531d01c33f63/mbid-72582f70-5df2-4bf8-8685-531d01c33f63-33574198727.jpg", "aoty_url": "https://www.albumoftheyear.org/album/31493-cornelius-fantasma.php", "aoty_critic_score": 73, "aoty_user_score": 82, "mbid": "7ab5258c-d0d7-39f0-b1bb-383a4053c754", "yt_id": "__b6I8ZuXxo", "rym": "https://rateyourmusic.com/release/album/cornelius/fantasma", "genres": ["leftfield", "neo-psychedelia", "indietronica", "shibuya-kei", "Rock", "Electronic"], "desc_lfm_album": "", "desc_lfm_artist": "There are at least three bands/musicians using this name:\n\n(1) Cornelius (born Keigo Oyamada (小山田圭吾 Oyamada Keigo) 27 January 1969 in Setagaya-ku, Tokyo, Japan) is a Japanese recording artist and producer. His name is a reference to the Planet of the Apes chimpanzee character of the same name played by Roddy MacDowall.  Oyamada's first claim to fame was as a member of the pop duo, Flipper's Guitar, one of the key groups of the Tokyo Shibuya-kei scene.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 121, "title": "Funcrusher Plus", "artist": "Company Flow", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/funcrusher-plus-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4597-company-flow-funcrusher-plus.php", "aoty_critic_score": 87, "aoty_user_score": 83, "mbid": "e6e03027-2955-38b5-ba9f-2076297f8528", "yt_id": "T3fvKBa28x0", "rym": "https://rateyourmusic.com/release/album/company-flow/funcrusher-plus", "genres": ["Hip-Hop"], "desc_lfm_album": "Funcrusher Plus is the debut album by Brooklyn, New York hip-hop group Company Flow, released on July 28, 1997 (see 1997 in music). It was the first album released on Rawkus Records, arguably the most popular and successful independent hip hop label of the late 1990s. Extremely well received - in the East Coast independent hip-hop community - the record is considered influential, but ultimately failed to significantly penetrate into market demographics outside of \"independent East Coast hip-hop,\" that is to say, Funcrusher Plus did not see much mainstream play. .", "desc_lfm_artist": "Company flow was a New York based hip hop group, consisted of El-P, Bigg Jus and DJ Mr. Len. Their 1997 debut album Funcrusher Plus is often cited as the catalyst for the new type of underground hip-hop scene that emerged in the late nineties. A Co Flow collaboration with Juggaknots and J-Treds appeared in 1998 under the name Indelible MC's and was featured on the Lyricist Lounge comp. \nThe group disbanded in 2000 after Bigg Jus had left in 1999. As a duo, El-P and Mr.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 122, "title": "宇宙 日本 世田谷 [Uchu Nippon Setagaya]", "artist": "Fishmans", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/31072--uch-nippon-setagaya_132806.jpg", "aoty_url": "https://www.albumoftheyear.org/album/31072-fishmans--uchu-nippon-setagaya.php", "aoty_critic_score": 80, "aoty_user_score": 88, "mbid": null, "yt_id": "SxsvkiCzFjg", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Fishmans (フィッシュマンズ) were an influential Japanese band formed in 1987. They were ranked number 83 in a list of Japan’s top 100 musicians provided by HMV, and are renowned for their unique sound and the distinctive vocals of lead singer Shinji Sato.\n\nThe band was formed in 1987 by Sato (vocals, guitar, trumpet), Kin-Ichi Motegi (drums, vocals, sampler), and Kensuke Ojima (guitar and vocals). The addition of Yuzuru Kashiwabara (bass) and Hakase (keyboards) rounded up the original line-up.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 123, "title": "Anthems to the Welkin at Dusk", "artist": "Emperor", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/30817-anthems-to-the-welkin-at-dusk.jpg", "aoty_url": "https://www.albumoftheyear.org/album/30817-emperor-anthems-to-the-welkin-at-dusk.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "f55aa89a-d660-3a93-a586-e6455a2f7226", "yt_id": "Jmlhq5rtFXw", "rym": "https://rateyourmusic.com/release/album/emperor/anthems-to-the-welkin-at-dusk/", "genres": ["Metal"], "desc_lfm_album": "Anthems to the Welkin at Dusk is the second studio album by Norwegian black metal band Emperor. It was released on 19 May 1997 through Candlelight Records and Century Black. The album was recorded in the Grieg Hall in Bergen, Norway. The opening guitar riff to \"Ye Entrancemperium\" is taken from an unnamed Mayhem song. As such, Mayhem guitarist Euronymous is credited in the album liner notes, even though he was murdered three years before the album was written and recorded. A recording of this unfinished track can be found on the Mayhem bootleg Ha Elm Zalag. In contrast to .", "desc_lfm_artist": "1) Emperor is a Norwegian black metal band formed in 1991, regarded as highly influential by critics and emerging black metal bands. The group split up in 2001, but reunited from 2005 to 2007 for a few festival dates and brief US tours, and again reunited in 2013 to 2014. Emperor reformed for the third time in 2016. The group was founded by Ihsahn (guitar/vocal) and Samoth (then, drums).\n\nFull Wikipedia article: https://en.wikipedia.org/wiki/Emperor_(band)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Lonsonxd", "sdecandelario"]}, {"n": 124, "title": "The Fat of the Land", "artist": "Prodigy", "year": 1997, "cover": "https://dn710108.ca.archive.org/0/items/mbid-24587253-3368-4ec2-a34d-9bcd2b5de57d/mbid-24587253-3368-4ec2-a34d-9bcd2b5de57d-34015251111.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "ac9138ce-6331-3f8d-86d7-69f13e4ab4f4", "yt_id": "gB5aXPgZ61s", "rym": "https://rateyourmusic.com/release/album/prodigy/the-fat-of-the-land", "genres": ["new age", "electronica", "techno", "hip hop", "big beat", "breakbeat"], "desc_lfm_album": "", "desc_lfm_artist": "Prodigy is the name of more than one artist. For the electronic group, please correct your tags to The Prodigy.\n\n1) rapper from Mobb Deep\n2) group fronted by Todd Duane and Lale Larsen\n3) 90s teenage rapper\n4) 70s powerpop from Minnesota\n5) US progressive/power metal\n6) lounge jazz, alias of Miki Litvak\n7) 90s US metal\n8) US rapper in The Dominion\n\n1) Albert Johnson (born November 2, 1974 in Bradford, Brooklyn, New York and died on June 20, 2017 in Las Vegas), better known by his stage name Prodigy, was a member of the hip hop duo Mobb Deep.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 125, "title": "The Mollusk", "artist": "Ween", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/8297-the-mollusk.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8297-ween-the-mollusk.php", "aoty_critic_score": 77, "aoty_user_score": 86, "mbid": "c68a633d-ea8c-35af-834d-8e835deb7ac2", "yt_id": "hIE2ZoeFZtA", "rym": "https://rateyourmusic.com/release/album/ween/the-mollusk/", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "A direct influence on a nascent little show called SpongeBob SquarePants, American alternative rock band Ween’s The Mollusk is a brilliant collection of nautical nonsense. Released in 1997, the duo’s sixth album cruises through the murky, the absurd, and the heartfelt: From the Mariana Trench ickiness of its Storm Thorgerson cover art to its dark-hued fantasias of whales, eels, and expanding tentacles, The Mollusk is a prog-rock-slash-alt-psych concept album that brings the band’s quirky vocal effects and bizarro guitar heroics to the bottom of the sea. And though the restless, fearless Ween is still cycling through genres with abandon, the .", "desc_lfm_artist": "Ween is an American rock band from New Hope, Pennsylvania, formed in 1984 by Aaron Freeman and Mickey Melchiondo, who perform under the stage names Gene Ween and Dean Ween. The band is commonly categorized as alternative rock and is noted for a highly eclectic musical style drawing on influences including funk, psychedelia, soul, country, gospel, progressive rock, R&B, heavy metal, and punk rock.\n\nFrom their formation through 1989, Ween self-released several cassette-only recordings.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Nubis84", "armandwave", "sdecandelario", "verygooood"]}, {"n": 126, "title": "Ladies and Gentlemen We Are Floating in Space", "artist": "Spiritualized", "year": 1997, "cover": "https://dn711205.ca.archive.org/0/items/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7-19716414556.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4043-spiritualized-ladies-and-gentlemen-we-are-floating-in-space.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "c88c77da-b9f9-34b9-abdf-ad3cec875aca", "yt_id": "_eCGu2Te3ZA", "rym": "https://rateyourmusic.com/release/album/spiritualized/ladies-and-gentlemen-we-are-floating-in-space/lists", "genres": ["psychedelic rock", "alternative rock", "art rock", "space rock", "neo-psychedelia", "space rock revival"], "desc_lfm_album": "Ladies and Gentlemen We Are Floating in Space is the third studio album by English space rock band Spiritualized, released on 16 June 1997. The album features guest appearances from the Balanescu Quartet, The London Community Gospel Choir and Dr. John. The title comes from the philosophical novel Sophie's World by Jostein Gaarder, the context being: “Only philosophers embark on this perilous expedition to the outermost reaches of language and existence. Some of them fall off, but others cling on desperately and yell at the people nestling deep in the snug softness, stuffing themselves with delicious food and drink. 'Ladies .", "desc_lfm_artist": "Spiritualized are an English rock band formed in 1990 in Rugby, Warwickshire, United Kingdom by Jason Pierce, who often goes by the alias J. Spaceman, after the spectacular demise of the Spacemen 3 outfit. The membership of Spiritualized changes from album to album, with Pierce being the only constant factor.\n\nThe first Spiritualized release was a space rock-esque cover of Any Way That You Want Me in 1990, a record which heralded the official split of Spacemen 3 following contractual wrangles over the band's name.", "desc_mb_album": "Originally released in a limited edition cardboard box resembling a pharmaceutical package, replete with product information sheet containing a list of ingredients and side effects. The CD itself (\"1 tablet 70 min\") is inside a foil blister pack.\r\n\"Play once twice daily\".", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 127, "title": "Wu-Tang Forever", "artist": "Wu-Tang Clan", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/10897-wu-tang-forever-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/10897-wu-tang-clan-wu-tang-forever.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "9c175231-56c2-35f1-a8f0-6059ad587d59", "yt_id": "Rd_9ZD0yn7s", "rym": "https://rateyourmusic.com/release/album/wu-tang-clan/wu-tang-forever", "genres": ["Hip-Hop"], "desc_lfm_album": "Wu-Tang Forever was the long-awaited follow-up to the Wu-Tang Clan's first album Enter the Wu-Tang (36 Chambers). It came following a string of successful solo projects from the clan's prominent members (Tical, Return to the 36 Chambers: The Dirty Version, Only Built 4 Cuban Linx..., Liquid Swords & Ironman). Forever was released on June 3, 1997 as a double album at the peak of the group's popularity and to high expectations. Despite limited radio /TV airplay and the lead single that famously clocked at nearly 6 minutes with no chorus, the album debuted at #1 in the U.S. with 650,000 .", "desc_lfm_artist": "Wu-Tang Clan is a hip-hop group that consists of: RZA, GZA/Genius, Ghostface Killah, Raekwon, Ol' Dirty Bastard, Method Man, Inspectah Deck, U-God, and Masta Killa. They are frequently joined by fellow childhood friend Cappadonna, a quasi member of the group. They were formed in (and are associated with) the New York City borough of Staten Island (referred to by members as \"Shaolin\"), though Masta Killa and GZA are from Brooklyn and Inspectah Deck is from the Bronx.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 128, "title": "Get Some", "artist": "Snot", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/105993-get-some_211021.jpg", "aoty_url": "https://www.albumoftheyear.org/album/105993-snot-get-some.php", "aoty_critic_score": 50, "aoty_user_score": 82, "mbid": "91655f50-2ee3-39da-87cf-a80073aa62d2", "yt_id": "jL7mCxR3NfM", "rym": "https://rateyourmusic.com/release/album/snot/get-some", "genres": [], "desc_lfm_album": "Get some is the debut studio album for the nu metal band Snot, Released in May 27th, 1997. It is the only album with vocalist Lynn Strait, who tragically passed away in a car accident in December 11th, 1998. His dog, Dobbs, who was in the album cover, was also killed in the same car accident. .", "desc_lfm_artist": "Snot was an American nu metal/alternative metal band from Santa Barbara, California that gained huge critical acclaim in the 1990's. The band was formed in 1995 by singer Lynn Strait, the former bassist of local metal band First Strike/Indica, and guitarist Mike Doling, formerly of Kronix. After building a strong following with performances in Los Angeles, Snot signed with Geffen Records, and began work on their debut album, Get Some, released on May 27, 1997. Although the album received positive critical notice, sales were disappointing.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "Lonsonxd", "MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 129, "title": "OK Computer", "artist": "Radiohead", "year": 1997, "cover": "https://dn720706.ca.archive.org/0/items/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d-43287476628.png", "aoty_url": "https://www.albumoftheyear.org/album/362-radiohead-ok-computer.php", "aoty_critic_score": 94, "aoty_user_score": 93, "mbid": "b1392450-e666-3926-a536-22c65f834433", "yt_id": "jNY_wLukVW0", "rym": "https://rateyourmusic.com/release/album/radiohead/ok-computer", "genres": ["experimental rock", "alternative rock", "art rock", "indie rock", "space rock revival", "post-britpop"], "desc_lfm_album": "OK Computer is the third album by the English rock band Radiohead, released in 1997. It reached #1 on the UK Albums Chart and marked Radiohead's highest entry into the American market at the time, where it debuted at #21. OK Computer expanded the band's worldwide popularity, becoming the last Radiohead album to have a delayed release outside of the United Kingdom. As of 2007, it has been certified triple platinum in the UK and double platinum in the US. OK Computer included the singles \"Paranoid Android\", \"Karma Police\" and \"No Surprises\". The album was recorded in rural Oxfordshire and .", "desc_lfm_artist": "Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock.", "desc_mb_album": "", "desc_mb_artist": "Formed in Oxford, UK. Originally performed as '''[http://musicbrainz.org/artist/c74f4726-2671-4011-81b6-f70da905c05a.html|On a Friday]''' until 1991.\r\n\r\nCurrently, Radiohead track names on bootlegs are standardized with the name on the album, except for tracks of Hail to the Thief due to the subtitles. There is only one album that uses their full names, which is Hail to the Thief. (The Gloaming.)\r\n\r\nStandardized track names: (Nice Dream); Street Spirit (Fade Out); Exit Music (for a Film); Pearly*; The National Anthem; You and Whose Army?; Dollars and Cents; 2 + 2 = 5; Sit Down, Stand Up; A Punchup at a Wedding.", "heard_by": ["BipolarMuzik", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 130, "title": "Transmission, Flux", "artist": "Duster", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/60834-transmission-flux_022630.jpg", "aoty_url": "https://www.albumoftheyear.org/album/60834-duster-transmission-flux.php", "aoty_critic_score": 80, "aoty_user_score": null, "mbid": "4940577f-e51b-4d5d-a30a-e46ebad71c06", "yt_id": "eh-cjzRWaio", "rym": null, "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Duster is a American slowcore band from San Jose, California formed in 1996 with an initial lineup of Clay Parton and Canaan Amber, former members of bands Calm and Mohinder. They are known for their unique lo-fi sound, recording their music onto cassette decks and similar equipment at their home studio nicknamed Low Earth Orbit.\n\nThe duo released two demo tapes in the same year as their formation, Christmas Dust and On The Dodge. In 1997, they released their debut 7\" EP Transmission, Flux via Up Records.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Rocky_stereo"]}, {"n": 131, "title": "Bricolage", "artist": "Amon Tobin", "year": 1997, "cover": "https://dn721803.ca.archive.org/0/items/mbid-2d0ccf04-19a0-4c35-8685-ec556f632fae/mbid-2d0ccf04-19a0-4c35-8685-ec556f632fae-31534451387.png", "aoty_url": "https://www.albumoftheyear.org/album/2606-amon-tobin-bricolage.php", "aoty_critic_score": 90, "aoty_user_score": 82, "mbid": "c1f40fac-2abd-3f0c-a635-26d166766b46", "yt_id": "OjAX3Iw4Hxg", "rym": "https://rateyourmusic.com/release/album/amon-tobin/bricolage/", "genres": ["jazz", "leftfield", "drum and bass", "nu jazz", "trip hop", "breaks"], "desc_lfm_album": "", "desc_lfm_artist": "Amon Tobin (born Amon Adonai Santos de Araújo Tobin on February 7, 1972) is a Brazilian musician, composer and producer of electronic music. He is described as a virtuoso sound designer and is considered to be one of the most influential electronic music artists in the world. He is noted for his unusual methodology in sound design and music production. He has released seven major studio albums under the London-based Ninja Tune record label.\n\nIt began for him sometime in the mid-90s when", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "MaxtorUwU", "armandwave"]}, {"n": 132, "title": "Hard Normal Daddy", "artist": "Squarepusher", "year": 1997, "cover": "https://dn711209.ca.archive.org/0/items/mbid-2769ab22-3c74-4b74-9217-d68d84b89b70/mbid-2769ab22-3c74-4b74-9217-d68d84b89b70-40829298775.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9344-squarepusher-hard-normal-daddy.php", "aoty_critic_score": 77, "aoty_user_score": 81, "mbid": "f4168d4e-c0e8-388f-8baa-4de058d852e5", "yt_id": "BPuIoKzG3CA", "rym": "https://rateyourmusic.com/release/album/squarepusher/hard-normal-daddy", "genres": ["drum and bass", "idm", "electronic music", "Electronic"], "desc_lfm_album": "Hard Normal Daddy is a 1997 studio album by British electronic musician Tom Jenkinson under his alias of Squarepusher. The album was Jenkinson's first studio album as Squarepusher for Warp Records. A single for the track \"Vic Acid\" was released in 1997 prior to the album's release. The album has received praise since its release including a five star review from AllMusic and being listed as one of the best albums of the year by The Wire and the NME. Stylus Magazine referred to the album in 2003 as Squarepusher's \"masterpiece\". .", "desc_lfm_artist": "Squarepusher is a pseudonym of Chelmsford, Essex, England, electronic musician Tom Jenkinson (b. 1975), best known for his experimental drum and bass, with a heavy jazz fusion influence.  A skilled bassist and multi-instrumentalist, Jenkinson's virtuoso playing is a staple of his music and one of the more obvious affiliations with jazz (although his formal arrangements are often as jazz-derived as his playing). His bass style includes melodic fretless playing, high-speed slap bass and intricate chordal work.", "desc_mb_album": "", "desc_mb_artist": "Do not add releases by band Shobaleader One here. See [artist:943b27df-7d31-4fd7-82c9-99d6b6ef34b3|this] page.", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 133, "title": "I Can Hear the Heart Beating as One", "artist": "Yo La Tengo", "year": 1997, "cover": "https://dn710607.ca.archive.org/0/items/mbid-dc5ee2df-7e5b-4a43-b67b-b9551e65c361/mbid-dc5ee2df-7e5b-4a43-b67b-b9551e65c361-3592364273.jpg", "aoty_url": "https://www.albumoftheyear.org/album/358-yo-la-tengo-i-can-hear-the-heart-beating-as-one.php", "aoty_critic_score": 91, "aoty_user_score": 83, "mbid": "901ddfef-b428-3022-a7b9-429f56513831", "yt_id": "Jp1MDdMDCno", "rym": "https://rateyourmusic.com/release/album/yo-la-tengo/i-can-hear-the-heart-beating-as-one", "genres": ["indie rock", "rock", "Alternative Rock"], "desc_lfm_album": "I Can Hear the Heart Beating as One is an album by Yo La Tengo released on Matador in 1997. It was recorded in Nashville, Tennessee and mixed in New York City. The album's sound is a blend of various genres, such as folk (\"One PM Again\"), rock (\"Moby Octopad\"), shoegazing (\"Deeper Into Movies\"), noise pop (\"Sugarcube\"), long noise jams (\"Spec Bebop\"), ambient (\"Green Arrow\"), and bossa nova (\"Center of Gravity\"), with a few songs showing electronic music influences (\"Autumn Sweater\"). The album also contains two cover songs: \"Little Honda,\" a Beach Boys tune by Brian Wilson and Mike Love, .", "desc_lfm_artist": "Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "armandwave", "verygooood"]}, {"n": 134, "title": "Consume Red", "artist": "Ground-Zero", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/91062-consume-red.jpg", "aoty_url": "https://www.albumoftheyear.org/album/91062-ground-zero-consume-red.php", "aoty_critic_score": 90, "aoty_user_score": 85, "mbid": "a1a4fa78-f815-37f8-8329-908132b02620", "yt_id": "BrBoQLkZY2g", "rym": "https://rateyourmusic.com/release/album/ground-zero/consume-red/", "genres": [], "desc_lfm_album": "", "desc_lfm_artist": "Ground-Zero was an improvised experimental noise rock band during the 1990s led by Otomo Yoshihide (大友良英) that had a large and rotating group of performers on such instruments as turntables, sampler, shamisen, saxophone, koto, omnichord, electric guitar and two drum kits. They are most highly regarded for their album Consume Red, on which the performers improvise around a short sample of hojok music played by Korean holy musician Kim Seok Chul.\n\nCheck also Ground Zero.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 135, "title": "Ultra", "artist": "Depeche Mode", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/ultra-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/5344-depeche-mode-ultra.php", "aoty_critic_score": 73, "aoty_user_score": 81, "mbid": "a40c7843-979b-38a6-926a-efa31476c51c", "yt_id": "u1WCPvfuL5Q", "rym": "https://rateyourmusic.com/release/album/depeche-mode/ultra", "genres": [], "desc_lfm_album": "Ultra is the ninth studio album by the English electronic music band Depeche Mode, released on 14 April 1997 by Mute Records. The album was the band's first since the departure of Alan Wilder, who had left the band in 1995 having become disillusioned with life in Depeche Mode. Wilder's departure and lead singer Dave Gahan's drug problems, which culminated in a near-fatal overdose, had caused many people to speculate that the band was finished. This is their first album as a trio since 1982's A Broken Frame. .", "desc_lfm_artist": "Depeche Mode is an English synthpop band formed in Basildon, Essex in 1980. The original lineup included Dave Gahan, Martin Gore, Andy Fletcher, and Vince Clarke. The current lineup consists of Gahan and Gore.\n\nWith Clarke as their primary songwriter, Depeche Mode released their debut album \"Speak & Spell\" in 1981 during the British new wave movement. Clarke left the band at the end of 1981 and later formed the groups Yazoo and Erasure. Following his departure", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "GabredMared", "MaxtorUwU", "armandwave"]}, {"n": 136, "title": "Dig Me Out", "artist": "Sleater‐Kinney", "year": 1997, "cover": "https://dn710704.ca.archive.org/0/items/mbid-d3bca172-fa17-4f55-8011-0a2851e59d19/mbid-d3bca172-fa17-4f55-8011-0a2851e59d19-17353601806.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "209b45b7-8b2f-3e07-b194-efff9cde80dd", "yt_id": "pVp6A0Ufots", "rym": "https://rateyourmusic.com/release/album/sleater-kinney/dig-me-out", "genres": ["alternative rock", "punk rock", "indie rock", "riot grrrl"], "desc_lfm_album": null, "desc_lfm_artist": null, "desc_mb_album": null, "desc_mb_artist": null, "heard_by": ["MaxtorUwU", "armandwave"]}, {"n": 137, "title": "Third Eye Blind", "artist": "Third Eye Blind", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/25393-third-eye-blind.jpg", "aoty_url": "https://www.albumoftheyear.org/album/25393-third-eye-blind-third-eye-blind.php", "aoty_critic_score": 82, "aoty_user_score": 83, "mbid": "2ccf437c-9b4e-35f5-98d6-812b08c8ac43", "yt_id": "93aWbiarrxg", "rym": "https://rateyourmusic.com/release/album/third-eye-blind/third-eye-blind", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "Third Eye Blind is the eponymous debut for the American alternative rock band Third Eye Blind, originally released on April 8, 1997. It spawned several singles, including top 10 charting \"Semi-Charmed Life\", \"Jumper\", and \"How's It Going to Be\". While Third Eye Blind only peaked at #25 on the Billboard 200, it spent 104 weeks on the chart. Three singles from the album charted in the top 10 of the Billboard Hot 100: \"Semi-Charmed Life\", \"Jumper\", and \"How's It Going to Be\". It is the group's best selling album, having been certified 6x Platinum by the RIAA. The layout of .", "desc_lfm_artist": "Third Eye Blind is a rock band formed in the mid 1990s in San Francisco, California. The original members were Stephan Jenkins (singer, songwriter, electric guitar), Kevin Cadogan (guitar), Adrian Burley (drums), and Jason Slater (bass guitar). The band's original line-up changed several times before the release of the group's debut album, and again shortly after the release of the band's second album Blue — at which point the band's main guitarist", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 138, "title": "Dig Your Own Hole", "artist": "The Chemical Brothers", "year": 1997, "cover": "https://dn710406.ca.archive.org/0/items/mbid-4331ea73-77e1-3213-a840-5e4e74180f93/mbid-4331ea73-77e1-3213-a840-5e4e74180f93-2609487756.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4923-the-chemical-brothers-dig-your-own-hole.php", "aoty_critic_score": 84, "aoty_user_score": 82, "mbid": "69f4aa7f-d760-3890-bd2a-902fb9abe40b", "yt_id": "0kMfTYPzSnI", "rym": "https://rateyourmusic.com/release/album/the-chemical-brothers/dig-your-own-hole/", "genres": ["psychedelic", "electronica", "techno", "big beat", "breakbeat", "funky breaks"], "desc_lfm_album": "Dig Your Own Hole is the second album by British electronica duo The Chemical Brothers, released in the UK on April 7, 1997. It features Noel Gallagher of Oasis and Beth Orton as guest vocalists. In 1998 Q magazine readers voted Dig Your Own Hole the 49th greatest album of all time. In 2000 the same magazine placed it at number 42 in its list of the 100 Greatest British Albums Ever. In 2004, the album was packaged with 1995's Exit Planet Dust in a limited edition box set as part of EMI's \"2CD Originals\" collection. It was certified platinum .", "desc_lfm_artist": "The Chemical Brothers is an English electronic music duo formed by Tom Rowlands and Ed Simons in Manchester in 1989. They were pioneers (along with the Prodigy, Fatboy Slim, the Crystal Method, and other acts) in bringing the big beat genre to the forefront of pop culture. After attracting Virgin Records, the duo achieved further success with second album Dig Your Own Hole (1997), which topped the UK charts. In the UK, they have had six No. 1 albums and 13 top-20 singles, including two chart-toppers.", "desc_mb_album": "", "desc_mb_artist": "Originally named \"The Dust Brothers\" in honor of the [artist:91d471a1-7639-4a70-baa4-a9e063fb4e83|US production duo], later renamed following an objection by the latter.", "heard_by": ["BipolarMuzik", "Frikomid", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 139, "title": "Life After Death", "artist": "The Notorious B.I.G.", "year": 1997, "cover": "https://dn711202.ca.archive.org/0/items/mbid-03aa0355-70d2-4032-9985-f9a040978520/mbid-03aa0355-70d2-4032-9985-f9a040978520-3409750467.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4841-the-notorious-big-life-after-death.php", "aoty_critic_score": 73, "aoty_user_score": 84, "mbid": "132d78be-baa5-3301-aba5-933409e3f848", "yt_id": "rCyWFj0nLyk", "rym": "https://rateyourmusic.com/release/album/the-notorious-b_i_g/life-after-death/reviews/4", "genres": ["hip hop", "east coast hip hop", "boom bap", "gangsta rap", "mafioso rap", "coke rap"], "desc_lfm_album": "Released as scheduled two weeks after his murder in Los Angeles, California, Life After Death, the ambitious diamond-certified double-disc sophomore album by The Notorious B.I.G., topped the Billboard 200 for 4 weeks and was Grammy-nominated for best rap album in 1997. Life After Death documents the extraordinary and ultimately tragic final chapter in the life of an ascending star. Recorded over 18 months between Los Angeles, New York, and Maraval, Trinidad, the sessions were interrupted by B.I.G.’s arrest for marijuana and gun possession, and a car accident that shattered his left leg, forcing him to stay seated for the majority .", "desc_lfm_artist": "Christopher George Latore Wallace (May 21, 1972 – March 9, 1997), known professionally as The Notorious B.I.G., Biggie Smalls, or Biggie, was an American rapper. He is widely considered to be one of the greatest hip-hop artists of all time.\n\nWallace was born and raised in the Brooklyn borough of New York City. His debut album Ready to Die (1994) made him a central figure in East Coast hip hop and increased New York City's visibility in the genre at a time when West Coast hip hop dominated the mainstream.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "verygooood"]}, {"n": 140, "title": "The Boatman’s Call", "artist": "Nick Cave & the Bad Seeds", "year": 1997, "cover": "https://dn710806.ca.archive.org/0/items/mbid-16d125c8-148c-36dd-aef2-4186946a2521/mbid-16d125c8-148c-36dd-aef2-4186946a2521-13398090408.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "af11e225-96a0-3b42-8645-54d9e8906054", "yt_id": "-LeSYvokBJU", "rym": "https://rateyourmusic.com/release/album/nick-cave-and-the-bad-seeds/the-boatmans-call", "genres": ["alternative rock", "indie rock", "piano rock", "gothic country", "rock"], "desc_lfm_album": "", "desc_lfm_artist": "Nick Cave & the Bad Seeds is an Australian post-punk band formed in Melbourne in 1983 by vocalist Nick Cave, multi-instrumentalist Mick Harvey and guitarist Blixa Bargeld. The band has featured international personnel throughout its career and has released a lengthy series of studio albums and completed numerous international tours. \n\nThe band presently consists of Cave, violinist and multi-instrumentalist Warren Ellis, bassist Martyn P. Casey (all from Australia)", "desc_mb_album": "", "desc_mb_artist": "Some releases are credited to \"Nick Cave & the Bad Seeds\" others are \"Nick Cave and the Bad Seeds.\" This is intentional on the part of the editors and matches the various releases. If you need to group them or normalize them in your own collection, use the %albumartistsort% variable (or something like \"$if2(%albumartistsort%,%albumartist%,%artistsort%,%artist%)\") in your tagger.\r\n\r\nDo not make arbitrary edits to the artist credits unless you can prove that your edit matches the release.", "heard_by": ["Frikomid", "armandwave"]}, {"n": 141, "title": "Either/Or", "artist": "Elliott Smith", "year": 1997, "cover": "https://dn710706.ca.archive.org/0/items/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e-18047694847.png", "aoty_url": "https://www.albumoftheyear.org/album/4042-elliott-smith-eitheror.php", "aoty_critic_score": 84, "aoty_user_score": 90, "mbid": "dfb85157-313b-3f5f-8739-a5162bcb6345", "yt_id": "UuizNQUOFCI", "rym": "https://rateyourmusic.com/release/album/elliott-smith/either-or", "genres": ["folk rock", "indie rock", "indie folk", "indie pop", "Rock", "Alternative Rock"], "desc_lfm_album": "Either/Or is the third studio album by American singer-songwriter Elliott Smith. Either/Or was recorded in several locations, mostly in Portland, Oregon – while Smith was still a member of Heatmiser – and was produced by Smith, Tom Rothrock, and Rob Schnapf. It was released on February 25, 1997, through Kill Rock Stars record label, following Heatmiser's dissolution. Book-ended by its two singles, Speed Trials and Ballad of Big Nothing, \"Either/Or\" did not chart in the US, but was acclaimed by critics. It has been described as \"a bridge between the lo-fi darkness of Roman Candle and Elliott Smith and the .", "desc_lfm_artist": "Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 142, "title": "Brighten the Corners", "artist": "Pavement", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/1476-brighten-the-corners_192745.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1476-pavement-brighten-the-corners.php", "aoty_critic_score": 74, "aoty_user_score": 82, "mbid": "071af447-389f-360d-aced-1d0ae3e0d5ec", "yt_id": "d1WGMY5-3w4", "rym": "https://rateyourmusic.com/release/album/pavement/brighten-the-corners", "genres": [], "desc_lfm_album": "Brighten the Corners is the fourth studio album by Pavement, released on February 11, 1997 by Matador Records. The album was recorded at a studio in Mitch Easter's house in North Carolina. According to singer and guitarist Stephen Malkmus, it was either Matador Records or Mary Timony from Helium who suggested that the band should record the album there. Although Brighten the Corners was mostly produced by Pavement and Bryce Goggin, Easter worked with the band for roughly a week when Goggin left the studio. The recording sessions involved a lot of editing, and the band would often record several .", "desc_lfm_artist": "Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 143, "title": "Baduizm", "artist": "Erykah Badu", "year": 1997, "cover": "https://dn721602.ca.archive.org/0/items/mbid-6e3c9aef-8a10-4597-a12d-a1783c6ece77/mbid-6e3c9aef-8a10-4597-a12d-a1783c6ece77-40069662962.jpg", "aoty_url": "https://www.albumoftheyear.org/album/8433-erykah-badu-baduizm.php", "aoty_critic_score": 84, "aoty_user_score": 87, "mbid": "45536412-c62c-34fc-9524-0bac1d2542c1", "yt_id": "OTfa4RQhU4Y", "rym": "https://rateyourmusic.com/release/album/erykah-badu/baduizm", "genres": ["soul", "jazz", "r&b", "hip hop", "neo soul", "funk / soul"], "desc_lfm_album": "Baduizm is the debut album by American singer and songwriter Erykah Badu, released on February 11, 1997, by Kedar Records. After leaving university in order to concentrate on music full-time, Badu then began touring with her cousin, Robert \"Free\" Bradford, and recorded a 19-song demo, Country Cousins, which attracted the attention of Kedar Massenburg. He set Badu up to record a duet with D'Angelo, \"Your Precious Love,\" and eventually signed her to a record deal with Universal Records. Recording sessions for the album took place from January to October 1996 in New York City, Philadelphia, and Dallas. Baduizm was met .", "desc_lfm_artist": "Erykah Badu (born Erica Abi Wright on February 26, 1971 in Dallas, Texas) is an American R'n'B/neo-soul artist whose work crosses over into jazz. \n\nShe is best known for her singles You Got Me her collaboration with The Roots, as well as her own songs Tyrone, Love of My Life, On & On, Bag Lady, The Healer,  Honey and Soldier. Her lyrics are highly personal urban philosophy which throw emotional challenges in the face of the listener. She weaves unusual musical influences together creating a rich texture of sound.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu"]}, {"n": 144, "title": "Blur", "artist": "Blur", "year": 1997, "cover": "https://dn710704.ca.archive.org/0/items/mbid-c5555d72-2713-434d-a26e-584c465a5f99/mbid-c5555d72-2713-434d-a26e-584c465a5f99-11267191059.jpg", "aoty_url": "https://www.albumoftheyear.org/album/3950-blur-blur.php", "aoty_critic_score": 75, "aoty_user_score": 80, "mbid": "fdd6c833-3c96-33cb-9917-72e15bcd34bc", "yt_id": "o_RaZPmeJCU", "rym": "https://rateyourmusic.com/release/album/blur/blur", "genres": ["alternative rock", "art rock", "indie rock", "neo-psychedelia", "slacker rock", "britpop"], "desc_lfm_album": "Blur is the fifth album by English alternative rock band Blur. Released on 10 February 1997 in the UK, it reached the top of the UK album chart. Blur was also a hit in the US, with Song 2 becoming a hit there and the album being certified Gold. It also spawned several hit singles in the UK, most notably Beetlebum and \"Song 2\". The album's style was resultant of Blur's dropping their previous Britpop mantle after The Great Escape in favor of lo-fi and alternative rock recordings, reportedly at Graham Coxon 's urging. As a result, Blur was a .", "desc_lfm_artist": "Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995).", "desc_mb_album": "", "desc_mb_artist": "Changed their name from ''[http://musicbrainz.org/show/artist/?artistid=79827|Seymour]'' in 1990 in order to secure a record deal.", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "sdecandelario", "verygooood"]}, {"n": 145, "title": "Perfect From Now On", "artist": "Built To Spill", "year": 1997, "cover": "https://dn711000.ca.archive.org/0/items/mbid-a253ff2f-c934-4801-822a-5b476268ba36/mbid-a253ff2f-c934-4801-822a-5b476268ba36-22152232964.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "e79d22e8-bad6-4b4b-a7b1-ea62796b7eee", "yt_id": "FsTl-lZo_50", "rym": null, "genres": ["art rock", "indie rock", "post-hardcore", "neo-psychedelia", "post-rock", "midwest emo"], "desc_lfm_album": "Perfect from Now On is the third full-length album released by Built to Spill, and the band's first major label (Warner Bros.) release. The line-up for the album was singer/guitarist Doug Martsch, bassist Brett Nelson, and drummer Scott Plouf. It was recorded at the Avast! Recording Company in Seattle, Washington by Phil Ek. Stylistically, the album was marked by its experimentation with longer song structures, philosophical lyrics, and the incorporation of cello. The album was essentially recorded three times. The first time, Martsch attempted to play all the instruments except drums. He and Phil Ek were dissatisfied with the results, .", "desc_lfm_artist": "Built to Spill is an American alternative rock band based in Boise, Idaho, United States. The band is best known for its catchy guitar hooks and the unique voice of frontman Doug Martsch.\n\nFormer Treepeople frontman Doug Martsch formed Built to Spill in 1992 with Brett Netson and Ralf Youtz as the band's original members. In an interview with Spin magazine, Martsch stated that he intended to change the band's lineup for every album, with Martsch being the only permanent member.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "GabredMared", "MaxtorUwU", "Nubis84", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario"]}, {"n": 146, "title": "Come My Fanatics", "artist": "Electric Wizard", "year": 1997, "cover": "https://dn710708.ca.archive.org/0/items/mbid-2e5fbf51-b419-4e34-bdd8-2afc65fd9dd3/mbid-2e5fbf51-b419-4e34-bdd8-2afc65fd9dd3-18298461504.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "3443d8ea-6d7d-3d9e-b613-f9df853438c4", "yt_id": "-eUVubC7ojM", "rym": null, "genres": ["doom metal", "stoner rock"], "desc_lfm_album": "", "desc_lfm_artist": "Electric Wizard is a band from Dorset, UK. They have a distinct, yet traditional doom metal sound that incorporates stoner and sludge traits, with lyrics typically involving the occult, witchcraft, H.P. Lovecraft, horror films and marijuana. During 2003, founding members Tim Bagshaw and Mark Greening left to form the band Ramesses, leaving guitarist/vocalist Jus Oborn the only remaining founding member.\n\nThe oblivion and ecstasy of crushing doom and high grade marijuana", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU"]}, {"n": 147, "title": "Everyone Asked About You", "artist": "Everyone Asked About You", "year": 1997, "cover": "https://cdn2.albumoftheyear.org/600x0/album/72999-everyone-asked-about-you_180939.jpg", "aoty_url": "https://www.albumoftheyear.org/album/72999-everyone-asked-about-you-everyone-asked-about-you.php", "aoty_critic_score": 70, "aoty_user_score": 82, "mbid": "5ee30721-c0d8-499d-ace2-8d8a326bb614", "yt_id": "rHleV-kpR8A", "rym": null, "genres": [], "desc_lfm_album": "This self-title debut EP from Everyone Asked About You was released between 1997. Albeit barely passing the ten minute mark, this EP managed to gain a huge cult following later on in the years for it's beautifully short, romantic, and longing lyricism about love and bittersweetness of it all. It's jangly guitars, the midwest emo; twee pop sound it takes on; alongside it's DIY punk rock attitude. Everyone Asked About You was released on a 7' inch vinyl under Landmark Records, hand numbered out of 500 copies. Today , finding the original pressing of this vinyl is really hard, usually .", "desc_lfm_artist": "Everyone Asked About You is a four-piece emo band from Little Rock, Arkansas that were originally around from 1996 to 2000 and later reformed in 2023. Though relatively unknown in their heyday, they've built up a following over the years, almost exclusively because of their sole 7\"; Everyone Asked About You. Besides that self-titled EP, they only ever released one split and another EP, neither of which gained as much attention of the self-titled one.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 148, "title": "Hi Scores", "artist": "Boards of Canada", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/21739-hi-scores.jpg", "aoty_url": "https://www.albumoftheyear.org/album/21739-boards-of-canada-hi-scores.php", "aoty_critic_score": 88, "aoty_user_score": 80, "mbid": "7600e51e-065c-39d2-bd0e-556a968cce02", "yt_id": "EuvMNQ7IjNY", "rym": null, "genres": ["Electronic"], "desc_lfm_album": "Hi Scores is an EP by Boards of Canada. It was released on CD and vinyl in 1996, and subsequently re-released in 1998, 2002, 2005, and 2014. .", "desc_lfm_artist": "Boards of Canada is an electronic music duo from Edinburgh, Scotland, UK, formed in 1985 and comprised of brothers Mike Sandison (born 1 June 1970) and Marcus Eoin (born 21 July 1971). They have released a number of works, most notably the studio albums Music Has the Right to Children (1998), Geogaddi (2002), and The Campfire Headphase (2005) on the pioneering electronic music label Warp. Their fourth album Tomorrow's Harvest was released in June 2013.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 149, "title": "Hell on Earth", "artist": "Mobb Deep", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/20229-hell-on-earth.jpg", "aoty_url": "https://www.albumoftheyear.org/album/20229-mobb-deep-hell-on-earth.php", "aoty_critic_score": 80, "aoty_user_score": 85, "mbid": "7cf83ecd-6eb9-3c3c-b9ad-93fff9934e3a", "yt_id": "YNmRPo3HKfg", "rym": "https://rateyourmusic.com/release/album/mobb-deep/hell-on-earth", "genres": ["Hip-Hop"], "desc_lfm_album": "Hell on Earth is the third studio album by East Coast hip hop group Mobb Deep, which was first released on November 19, 1996, on Loud/RCA/BMG Records. The album is largely a continuation of Mobb Deep's previous album, the critically acclaimed The Infamous. The album is produced by Havoc and Prodigy and also features guest appearances by emcees Nas, Raekwon, Method Man, and frequent collaborator Big Noyd. The album stands out for its acclaimed singles \"G.O.D. Pt. III\" and \"Hell on Earth (Front Lines),\" as well as “Drop a Gem on 'Em,\" a response to 2Pac's diss track \"Hit 'Em .", "desc_lfm_artist": "Mobb Deep was a hip-hop duo made up of Havoc and Prodigy. Both members are natives of Queensbridge, New York; located in Long Island City. They are perhaps most famous for their landmark album, The Infamous, and the accompanying hit single, Shook Ones Pt. II.\n\n1992–1994: Early Career\n\nProdigy and Havoc met one another while attending the prestigious High School of Art & Design in Manhattan. Coming from similar backgrounds, the duo broke into the rap game in 1992.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 150, "title": "If You’re Feeling Sinister", "artist": "Belle and Sebastian", "year": 1996, "cover": "https://dn710804.ca.archive.org/0/items/mbid-62ea89c4-7be5-3872-b1b7-ad025197c706/mbid-62ea89c4-7be5-3872-b1b7-ad025197c706-3626885778.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "66be5deb-75d5-3737-9037-1c745891d3ec", "yt_id": "LDrCuEAHNZc", "rym": "https://rateyourmusic.com/release/album/belle-and-sebastian/if-youre-feeling-sinister", "genres": ["chamber folk", "pop rock", "chamber pop", "indie rock", "indie pop", "twee pop"], "desc_lfm_album": "If You're Feeling Sinister is the second album by Scottish indie pop band Belle and Sebastian. It was released in 1996 on Jeepster Records in the United Kingdom and in 1997 by Matador Records in the United States. It is often ranked among the best albums of the nineties. Band leader Stuart Murdoch has stated the album is probably his best collection of songs. In 2005, Belle and Sebastian released a live version, If You're Feeling Sinister: Live at the Barbican. After the release of their debut album Tigermilk, Belle and Sebastian were approached by a number of record labels. .", "desc_lfm_artist": "Belle and Sebastian are a Scottish indie pop band that formed in 1994 in Glasgow, Scotland. Led by guitarist/vocalist Stuart Murdoch, the seven-piece band have an intimate, majestic sound that is equal parts folk-rock and '60s pop. Murdoch has a gift not only for whimsy and surrealism, but also for odd, unsettling lyrical detail which keeps the songs grounded in a tangible reality. \n\nBelle and Sebastian released their first two albums in 1996: Tigermilk", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "alberto_gu", "armandwave"]}, {"n": 151, "title": "Paegan Terrorism Tactics", "artist": "Acid Bath", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/42848-paegan-terrorism-tactics.jpg", "aoty_url": "https://www.albumoftheyear.org/album/42848-acid-bath-paegan-terrorism-tactics.php", "aoty_critic_score": 80, "aoty_user_score": 83, "mbid": "36f521fa-fc3a-3d4b-9eb3-53753f575546", "yt_id": "fIuSc4k2oSU", "rym": "https://rateyourmusic.com/release/album/acid-bath/paegan-terrorism-tactics", "genres": ["Metal", "Rock"], "desc_lfm_album": "", "desc_lfm_artist": "Acid Bath is an American metal band from Houma, Louisiana that formed in 1991. They released their breakout debut When the Kite String Pops in 1994, which was then followed by their sophomore and final album, Paegan Terrorism Tactics, in 1996. The band later broke up in 1997 after the passing of bassist Audie Pitre in a traffic collision. \n\nTheir music is often regarded as hard to label under one certain genre. While sweeping across many sounds, Acid Bath put out two records of considerable influence", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["GabredMared", "sdecandelario"]}, {"n": 152, "title": "Beat", "artist": "Bowery Electric", "year": 1996, "cover": "https://dn710702.ca.archive.org/0/items/mbid-ad22724c-58fd-4701-b001-fcb676fc384d/mbid-ad22724c-58fd-4701-b001-fcb676fc384d-23100734125.jpg", "aoty_url": "https://www.albumoftheyear.org/album/53101-bowery-electric-beat.php", "aoty_critic_score": 80, "aoty_user_score": 81, "mbid": "ab1b6a2e-5a1f-3844-a1ec-7e283427fc2e", "yt_id": "4oQt49NReEM", "rym": "https://rateyourmusic.com/release/album/bowery-electric/beat", "genres": ["trip hop"], "desc_lfm_album": "Beat is the 2nd studio album by the Trip-Hop band Bowery Electric. It was released on November 12th, 1996 on Kranky Limited. The album was liked by critics, gaining generally positive reviews, and Melody Maker named the album the \"rock LP of the year\" .", "desc_lfm_artist": "Bowery Electric was an American band formed in New York in 1993 by Lawrence Chandler and Martha Schwendener. They released three albums between 1995 and 2000, including the critically praised Beat (1996).\n\nFormed by Lawrence Chandler and Martha Schwendener in late 1993, Bowery Electric played their first show in New York City in January 1994. The band's debut double 7-inch single was recorded by Kramer and released by Hi-Fidelity Recordings in 1994. After listening to it, Kranky contacted the band.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario", "verygooood"]}, {"n": 153, "title": "The Don Killuminati: The 7 Day Theory", "artist": "2Pac", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/23657-the-don-killuminati-the-7-day-theory_090536.jpg", "aoty_url": "https://www.albumoftheyear.org/album/23657-2pac-the-don-killuminati-the-7-day-theory.php", "aoty_critic_score": 62, "aoty_user_score": 83, "mbid": null, "yt_id": "XVJLy7TMM3A", "rym": null, "genres": ["Hip-Hop"], "desc_lfm_album": "The Don Killuminati: The 7 Day Theory (commonly shortened to The 7 Day Theory or Don Killuminati and sometimes called Makaveli) is the fifth and final studio album by Tupac Shakur. Released under the new stage name Makaveli, it was his first studio album to be posthumously released. The album was completely finished in a total of seven days during the month of August 1996. The lyrics were written and recorded in only three days and mixing took an additional four days. These are among the very last songs Shakur recorded before his fatal shooting on September 7, 1996. The .", "desc_lfm_artist": "Tupac Amaru Shakur (born Lesane Parish Crooks; June 16, 1971 – September 13, 1996), known professionally as 2Pac and later as Makaveli, was an American rapper and actor. He is regarded as one of the most influential and successful rappers of all time and as a prominent political and cultural figure in late 20th-century America. Shakur sold more than 75 million records worldwide, making him one of the best-selling music artists in history. His work often addressed themes of social injustice", "desc_mb_album": "", "desc_mb_artist": "Please '''don't add''' the releases '''''Thug Life, Volume I''''' or '''''The Don Killuminati: The 7 Day Theory''''' to this artist entry:\n    * ''[http://musicbrainz.org/release-group/6d810afd-b059-31ca-b3e2-6c7e2a7d6efd.html|Thug Life, Volume I]'' is already filed under the correct artist, '''[http://musicbrainz.org/artist/703f9c8c-32c8-482a-900d-a12fd8f20360.html|Thug Life]'''.\n    * ''[http://musicbrainz.org/release-group/5782e30e-fd08-349d-8a22-bbe8c5d7ffec.html|The Don Killuminati: The 7 Day Theory]'' and its singles should be credited to '''[http://musicbrainz.org/artist/e263a1d8-8228-4ede-9e17-7acf8470165a.html|Makaveli]''' and are the only official releases that should be filed there.", "heard_by": []}, {"n": 154, "title": "Richard D. James Album", "artist": "Aphex Twin", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/4013-richard-d-james-album_020556.jpg", "aoty_url": "https://www.albumoftheyear.org/album/4013-aphex-twin-richard-d-james-album.php", "aoty_critic_score": 81, "aoty_user_score": 83, "mbid": "84d79dbe-7ac1-3ebc-9b36-238ddfb8229c", "yt_id": "LAFazXZKZwQ", "rym": "https://rateyourmusic.com/release/album/aphex-twin/richard-d-james-album/", "genres": ["art pop", "electronica", "idm", "jungle", "drill and bass", "Electronic"], "desc_lfm_album": "Richard D. James Album is the eponymous fourth studio album by British electronic musician Richard D. James, under his pseudonym Aphex Twin. In the United Kingdom, the album was released on 4 November 1996 through Warp. In the United States, it was released on 28 January 1997 by Sire Records, with the Girl/Boy EP included as bonus tracks. A reissue on vinyl was released on 18 September 2012. Richard D. James Album was composed by James on his Macintosh computer, and took longer to complete than his previous efforts. The album features faster breakbeats and intricate drum programming which draw .", "desc_lfm_artist": "Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 155, "title": "Being There", "artist": "Wilco", "year": 1996, "cover": "https://dn710309.ca.archive.org/0/items/mbid-d18b273a-4987-4594-a4db-419454c7e113/mbid-d18b273a-4987-4594-a4db-419454c7e113-2013460549.jpg", "aoty_url": "https://www.albumoftheyear.org/album/349-wilco-being-there.php", "aoty_critic_score": 83, "aoty_user_score": 80, "mbid": "5aed5f2c-4b8a-35a7-9655-906e3ea72fa1", "yt_id": "Vn7ZSbZhKVE", "rym": "https://rateyourmusic.com/release/album/wilco/being-there", "genres": ["country rock", "alternative rock", "country", "alternative country", "Rock", "Alternative Rock"], "desc_lfm_album": "Being There is the second album by Chicago-based rock band Wilco. Despite its release as a nineteen-song double album, Being There was sold at a single album price due to a deal between lead singer Jeff Tweedy and Reprise Records. Released on October 29, 1996, the album was an improvement for the band in both sales and critical reception as compared with their first album, A.M.. Taking its name from the 1979 film Being There, the self-produced effort featured more surrealistic and introspective writing than their previous album. This was due in part to several significant changes in Tweedy's life, .", "desc_lfm_artist": "Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "armandwave", "sdecandelario"]}, {"n": 156, "title": "Soundtracks For The Blind", "artist": "Swans", "year": 1996, "cover": "https://ia802901.us.archive.org/22/items/mbid-4e3e2b8a-adfb-3690-b0c3-03b78205049d/mbid-4e3e2b8a-adfb-3690-b0c3-03b78205049d-1958490670.jpg", "aoty_url": null, "aoty_critic_score": null, "aoty_user_score": null, "mbid": "213bce2d-6499-3abd-8a58-af2ba83a2344", "yt_id": "bm0lNDL_dZg", "rym": "https://rateyourmusic.com/release/album/swans/soundtracks-for-the-blind", "genres": ["experimental rock", "industrial", "post-rock", "rock", "electronic"], "desc_lfm_album": "Soundtracks for the Blind is the tenth studio album by American post rock band Swans, and the last released until 2010's My Father Will Guide Me Up a Rope to the Sky. It was released as a double CD in 1996, through Young God Records. Soundtracks for the Blind was intended, as suggested by the title, to function as a sort of \"soundtrack for a non-existent film\", and is Swans' most varied studio effort. On the composition of Soundtracks for the Blind, frontman Michael Gira said in 1997: I've always been interested in different sounds like that and listened to .", "desc_lfm_artist": "Swans is an American experimental rock band from New York, United States, active from 1982 to 1997, reformed in 2010, led by singer, songwriter and multi-instrumentalist Michael Gira.\n\nMarginally associated with the no wave scene at first, their original sound was slow and extremely heavy, with live performances that were often so brutal and physical that in a number of instances certain audience members were made ill, police were called and venues were shut down.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "GabredMared", "MaxtorUwU", "Nubis84", "armandwave", "verygooood"]}, {"n": 157, "title": "Ironman", "artist": "Ghostface Killah", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7984-ironman_172609.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7984-ghostface-killah-ironman.php", "aoty_critic_score": 83, "aoty_user_score": 85, "mbid": "97173ef6-fd21-3d0a-80d3-c8c79fb97b17", "yt_id": "a74LEdZawLo", "rym": "https://rateyourmusic.com/release/album/ghostface-killah/ironman-3", "genres": ["hip hop", "east coast hip hop", "conscious hip hop", "boom bap", "hardcore hip hop", "abstract hip hop"], "desc_lfm_album": "Ironman is the solo debut album by American hip hop artist and Wu-Tang Clan member Ghostface Killah, released October 29, 1996, on Epic Records. Though mainly produced by fellow group member RZA, the LP is slightly different to that of other first generation solo Wu-Tang albums, owing much of its thematic scope, mythology and samples from classic 1960s and 1970s blaxploitation films, as well as a wider range of soul samples. It is also notable for being considerably more open in its references to the Nation of Gods and Earths and the group's beliefs. Upon its release, Ironman debuted at .", "desc_lfm_artist": "Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": []}, {"n": 158, "title": "Among My Swan", "artist": "Mazzy Star", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9157-among-my-swan.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9157-mazzy-star-among-my-swan.php", "aoty_critic_score": 62, "aoty_user_score": 81, "mbid": "966a02cf-fc62-3abc-8560-c60ce115efed", "yt_id": "p3NZn0mA_XI", "rym": "https://rateyourmusic.com/release/album/mazzy-star/among-my-swan", "genres": ["Rock", "Pop"], "desc_lfm_album": "\"Among My Swan\" is the third studio album by American band Mazzy Star, released on October 29, 1996. Although \"Among My Swan\" did not contain any US Billboard Hot 100 hits like its predecessor, \"So Tonight That I Might See\", this album garnered the band its highest-ranking single on the UK Singles Chart, when \"Flowers in December\" reached No. 40 in November 1996. \"Among My Swan\" relied less on the echo effect that was nearly ubiquitous in all tracks on the previous two albums. Hope Sandoval's voice is paired with simple acoustic instrumentation that marks most of the tracks. The .", "desc_lfm_artist": "Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "armandwave", "sdecandelario"]}, {"n": 159, "title": "LONG SEASON", "artist": "Fishmans", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/24856-long-season_195722.jpg", "aoty_url": "https://www.albumoftheyear.org/album/24856-fishmans-long-season.php", "aoty_critic_score": 92, "aoty_user_score": 90, "mbid": "fc38cdba-ea52-328c-aa3d-41edf8811a0c", "yt_id": "S3EKEwMXmXY", "rym": null, "genres": [], "desc_lfm_album": "Long Season (stylized in all caps; subtitled ...we are not four seasons) is the sixth studio album by Japanese dub group Fishmans. It was first released on October 25, 1996 in Japan by Polydor Records.It was recorded in July 1996 and consists of a single 35-minute composition based on the band's earlier song \"Season .", "desc_lfm_artist": "Fishmans (フィッシュマンズ) were an influential Japanese band formed in 1987. They were ranked number 83 in a list of Japan’s top 100 musicians provided by HMV, and are renowned for their unique sound and the distinctive vocals of lead singer Shinji Sato.\n\nThe band was formed in 1987 by Sato (vocals, guitar, trumpet), Kin-Ichi Motegi (drums, vocals, sampler), and Kensuke Ojima (guitar and vocals). The addition of Yuzuru Kashiwabara (bass) and Hakase (keyboards) rounded up the original line-up.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "verygooood"]}, {"n": 160, "title": "The Natural Bridge", "artist": "Silver Jews", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/11152-the-natural-bridge.jpg", "aoty_url": "https://www.albumoftheyear.org/album/11152-silver-jews-the-natural-bridge.php", "aoty_critic_score": 76, "aoty_user_score": 82, "mbid": "675f2971-7de2-3fdc-a73e-f0516587ee99", "yt_id": "16LkluMfFfE", "rym": "https://rateyourmusic.com/release/album/silver-jews/the-natural-bridge", "genres": ["Rock", "Alternative Rock"], "desc_lfm_album": "The Natural Bridge is the second full-length studio album by indie-rock group the Silver Jews. Released in 1996 as an LP and CD on Drag City (DC101) in America and Domino (WIG28) in Europe, The Natural Bridge was engineered and mixed by Michael Deming and Thom Monahan and features cover art by Mike Flood. Featured musicians include: David Berman; Matt Hunter; Rian Murphy; Peyton Pinkerton; and Michael Deming. Some tracks on the album were originally recorded using members of the Scud Mountain Boys as Berman's backing band, but scrapped. None of these recordings have ever been released, and were rumored .", "desc_lfm_artist": "Silver Jews were an American indie rock band formed in Hoboken, New Jersey, in 1989. The band's earliest incarnation was the college band Ectoslavia, formed by future Pavement founders Bob Nastanovich, Stephen Malkmus and frontman David Berman at the University of Virginia in 1985. An exercise in joyous noise, the band disbanded after graduation and the three friends moved to New York to take up various jobs - Nastanovich, a bus driver, and Berman and Malkmus, art museum security guards.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["Frikomid", "MaxtorUwU", "armandwave", "sdecandelario", "verygooood"]}, {"n": 161, "title": "Pinkerton", "artist": "Weezer", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/pinkerton-1.jpg", "aoty_url": "https://www.albumoftheyear.org/album/1019-weezer-pinkerton.php", "aoty_critic_score": 72, "aoty_user_score": 84, "mbid": "385f30e2-0483-355d-aded-23e66aa20f87", "yt_id": "vfU0Vu0R-SU", "rym": "https://rateyourmusic.com/release/album/weezer/pinkerton", "genres": ["Pop", "Alternative Rock"], "desc_lfm_album": "Pinkerton is the second studio album by American alternative rock band Weezer, released on September 24, 1996 on DGC Records. Pinkerton was seen as a departure from the band's original power pop style, replacing it with a darker, more abrasive sound with themes drawn from songwriter Rivers Cuomo's disillusionment with the rock lifestyle. It was the last Weezer album to feature bassist Matt Sharp. Initially a commercial and critical failure, Pinkerton went on to achieve cult status and wide acclaim years after its release. .", "desc_lfm_artist": "Weezer is an American alternative rock band formed in Los Angeles, California in 1992. They have released 15 full length albums, 1 cover album, six EPs, and a DVD. Their latest album, titled 'Van Weezer', came out on May 7th, 2021, Although, they released 4 EPs in 2022, known as SZNZ. They've sold over ten million records in the United States to date, and 35 million worldwide. They play music influenced by alternative bands and power pop artists among others.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["EliasJ72", "Frikomid", "MaxtorUwU", "Nubis84", "armandwave", "sdecandelario"]}, {"n": 162, "title": "Illadelph Halflife", "artist": "The Roots", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/7980-illadelph-halflife.jpg", "aoty_url": "https://www.albumoftheyear.org/album/7980-the-roots-illadelph-halflife.php", "aoty_critic_score": 78, "aoty_user_score": 85, "mbid": "6bb001e8-78e1-37bf-9aac-9e47f7dbe8f9", "yt_id": "_piSp5gfW68", "rym": "https://rateyourmusic.com/release/album/the-roots/illadelph-halflife", "genres": ["Jazz", "Hip-Hop"], "desc_lfm_album": "Illadelph Halflife is the third studio album by American hip hop band The Roots, released September 24, 1996 on Geffen Records. It features a tougher and broader sound than their previous album, Do You Want More?!!!??! (1995). The album also contains integration of programmed drums and guest contributions by R&B musicians such as Amel Larrieux and D'Angelo, as well as jazz musicians such as David Murray, Steve Coleman, Cassandra Wilson, Graham Haynes. In 1998, the album was selected as one of The Source's 100 Best Rap Albums. In 2006, the album was selected as one of Hip-Hop Connection's 100 Best .", "desc_lfm_artist": "The Roots, also known as The Legendary Roots Crew, The Square Roots and The Foundation, is an influential, Grammy winning hip hop group based out of Philadelphia, Pennsylvania, famed for a heavily jazzy sound and live instrumentation. Inspired by the \"hip-hop band\" concept pioneered by Stetsasonic, the Roots themselves have garnered critical acclaim and influenced later hip-hop and R&B acts.\n\nThe Roots' original lineup included Black Thought (MC vocals) and Ahmir \"?uestlove\" Thompson (drums)", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["MaxtorUwU", "Rocky_stereo"]}, {"n": 163, "title": "Aenima", "artist": "Tool", "year": 1996, "cover": "https://ia902802.us.archive.org/13/items/mbid-b ut of sampled elements from genres ranging from hip hop, jazz, funk, psychedelia, as well as samples from films and interviews. All sampling on the album was done on an Akai MPC60 MKII sampler. DJ Shadow released Endtroducing..... when he was 24 years old. Frequenting record stores to find music, he would often bring .", "desc_lfm_artist": "Joshua Paul Davis (born June 29, 1972), known professionally as DJ Shadow, is an American DJ and record producer. He first gained attention with his debut studio album \"Endtroducing.....\" (1996), noted for its extensive use of samples and layered production. He was also a member of the band UNKLE from 1996 to 1999.\n\nDJ Shadow began experimenting with a four-track recorder while in high school in Davis, California, and started his career as a disc jockey for the University of California, Davis, campus radio station KDVS.", "desc_mb_album": "", "desc_mb_artist": "", "heard_by": ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "Rocky_stereo", "alberto_gu", "armandwave", "paqueradejere", "sdecandelario", "verygooood"]}, {"n": 165, "title": "First Band on the Moon", "artist": "The Cardigans", "year": 1996, "cover": "https://dn721605.ca.archive.org/0/items/mbid-6f7a28b7-c6e0-4a65-870e-7e9e82d33511/mbid-6f7a28b7-c6e0-4a65-870e-7e9e82d33511-43045234238.jpg", "aoty_url": "https://www.albumoftheyear.org/album/30893-the-cardigans-first-band-on-the-moon.php", "aoty_critic_score": 80, "aoty_user_score": 82, "mbid": "33a35fc0-1126-30c2-a046-b2803116f882", "yt_id": "qEf9DvfKpp0", "rym": "https://rateyourmusic.com/release/album/the-cardigans/first-band-on-the-moon", "genres": ["folk rock", "alternative rock", "pop rock", "indie rock", "disco", "indie pop"], "desc_lfm_album": "'First Band on the Moon' is the third album the The Cardigans and features the hit single Lovefool. .", "desc_lfm_artist": "The Cardigans is a Swedish band that formed in Jönköping, Småland, Sweden in 1992. The band's musical style has varied greatly from album to album; encompassing their early indie-leanings passing through '60s-inspired pop and more band-based rock. Their current lineup is Nina Persson on vocals, Peter Svensson on lead guitar, Magnus Sveningsson on bass guitar,  Bengt Lagerberg on drums and Lars-Olof Johansson on keyboards and guitar. \n\nThe five-piece met as teenagers in Jönköping", "desc_mb_album": "Originally released (presumably in Sweden) on the Trampoline label: TRACD1506\r\nWorldwide barcode for CD is 731453311725 on Stockholm Records.\r\nSome versions include Polydor or Mercury logo on sleeve.", "desc_mb_artist": "", "heard_by": ["Frikomid", "Lonsonxd", "MaxtorUwU", "Nubis84", "alberto_gu", "verygooood"]}, {"n": 166, "title": "Travelling Without Moving", "artist": "Jamiroquai", "year": 1996, "cover": "https://cdn2.albumoftheyear.org/600x0/album/9360-travelling-without-moving_193029.jpg", "aoty_url": "https://www.albumoftheyear.org/album/9360-jamiroquai-travelling-without-moving.php", "aoty_critic_score": 65, "aoty_user_score": 82, "mbid": "4b5e5a6f-c941-384c-8508-a4fee1dfcec4", "yt_id": "L3_5p50gFqM", "rym": "https://rateyourmusic.com/release/album/jamiroquai/travelling-without-moving", "genres": ["Jazz"], "desc_lfm_album": "\"Travelling Without Moving\" is the third studio album by English funk and acid jazz band Jamiroquai, released on 28 August 1996 in Japan then on 9 September 1996 in the United Kingdom under Sony Soho Square. The album was the band's American breakthrough, with the band's first entry in the US Billboard 200 chart at number 24. Selling over 8 million copies worldwide, it holds the Guinness World Records as the best-selling funk album in history. The album was reissued in 2013 in remastered form with bonus material. .", "desc_lfm_artist": "Jamiroquai are an English acid jazz and funk band formed in London in 1992. The group is led by vocalist Jay Kay, who has remained the sole consistent member throughout multiple lineup changes. They initi
