<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singles — Eurovisión</title>
<link rel="icon" type="image/png" href="/images/discount.png" />
<!-- Umami Analytics -->
<script
    defer
    src="https://cloud.umami.is/script.js"
    data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"
></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0a; --surface:#111; --surface2:#161616; --border:#1e1e1e;
    --accent:#c9a227; --muted:#666; --text:#e0e0e0; --ok:#5fb57a;
    --header-h:52px;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
  a { color:inherit; }
  header {
    position:fixed; top:0; left:0; right:0; z-index:100; height:var(--header-h);
    background:rgba(10,10,10,.97); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px; padding:0 24px;
  }
  .site-label { font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted); white-space:nowrap; }
  .site-label a { color:var(--muted); text-decoration:none; }
  .site-label a:hover { color:var(--accent); }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:.06em; line-height:1;
    color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .header-meta { font-family:'DM Mono',monospace; font-size:.6rem; color:var(--muted); margin-left:auto; white-space:nowrap; }
  .header-nav-link {
    font-family:'DM Mono',monospace; font-size:.58rem; letter-spacing:.1em; text-transform:uppercase;
    padding:4px 10px; border-radius:3px; border:1px solid var(--border); color:var(--muted);
    text-decoration:none; transition:all .12s; flex-shrink:0;
  }
  .header-nav-link:hover { border-color:var(--accent); color:var(--accent); }
  main { padding:24px 40px 80px; margin-top:var(--header-h); }
  .section-label { font-family:'DM Mono',monospace; font-size:.65rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted); margin-bottom:20px; }
  .intro { color:var(--muted); font-size:.9rem; margin-bottom:22px; max-width:70ch; }
  footer { padding:24px 40px; border-top:1px solid var(--border);
    font-family:'DM Mono',monospace; font-size:.65rem; color:var(--muted); }
  @media (max-width:700px) {
    header { padding:0 16px; gap:10px; }
    .header-meta, .site-label { display:none; }
    main, footer { padding-left:16px; padding-right:16px; }
  }

  .collections-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .col-card {
    display:block; text-decoration:none; background:var(--surface); border:1px solid var(--border);
    border-radius:6px; padding:24px 22px 20px; transition:border-color .15s, transform .15s;
    position:relative; overflow:hidden;
  }
  .col-card::after { content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .25s ease; }
  .col-card:hover { border-color:#333; transform:translateY(-2px); }
  .col-card:hover::after { transform:scaleX(1); }
  .col-name { font-family:'Bebas Neue',sans-serif; font-size:1.55rem; letter-spacing:.05em;
    color:var(--text); margin-bottom:8px; line-height:1.1; }
  .col-desc { font-size:.8rem; color:var(--muted); margin-bottom:12px; line-height:1.4; }
  .col-meta { font-family:'DM Mono',monospace; font-size:.65rem; color:var(--muted); margin-bottom:14px; }
  .col-bar-wrap { height:3px; background:var(--border); border-radius:2px; overflow:hidden; margin-bottom:6px; }
  .col-bar { height:100%; background:var(--accent); border-radius:2px; transition:width .6s ease; }
  .col-pct { font-family:'DM Mono',monospace; font-size:.62rem; color:var(--muted); }

  /* ── MH user modal ── */
  .mh-usr-btn {
    display:flex; align-items:center; gap:4px;
    background:none; border:1px solid var(--border,#1e1e1e); border-radius:4px;
    color:var(--muted,#555); font-family:'DM Mono',monospace;
    font-size:.62rem; padding:4px 9px; cursor:pointer; flex-shrink:0;
    white-space:nowrap; transition:border-color .12s, color .12s;
  }
  .mh-usr-btn:hover { border-color:var(--accent,#c9a227); color:var(--text,#e0e0e0); }
  .mh-usr-btn.has-user { border-color:var(--accent,#c9a227); color:var(--accent,#c9a227); }
  .mh-modal-ov {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.78);
    z-index:500; align-items:center; justify-content:center;
  }
  .mh-modal-ov.open { display:flex; }
  .mh-modal-box {
    background:var(--surface,#111); border:1px solid var(--border,#1e1e1e);
    border-top:2px solid var(--accent,#c9a227); border-radius:6px;
    padding:1.4rem; width:min(300px,92vw); max-height:80vh; overflow-y:auto;
  }
  .mh-modal-title {
    font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted,#555);
    margin-bottom:1rem; text-align:center;
  }
  .mh-usr-opt {
    padding:9px 12px; margin-bottom:5px;
    background:var(--surface2,#161616); border:1px solid var(--border,#1e1e1e);
    border-radius:4px; cursor:pointer; transition:all .15s;
    font-family:'DM Mono',monospace; font-size:.75rem;
    letter-spacing:.04em; color:var(--muted,#555);
  }
  .mh-usr-opt:hover { border-color:var(--accent,#c9a227); color:var(--text,#e0e0e0); }
  .mh-usr-opt.active { border-color:var(--accent,#c9a227); color:var(--accent,#c9a227); background:rgba(201,162,39,.07); }
  .mh-modal-close {
    display:block; margin:1rem auto 0; padding:6px 18px;
    background:var(--surface2,#161616); color:var(--muted,#555);
    border:1px solid var(--border,#1e1e1e); border-radius:4px;
    cursor:pointer; font-family:'DM Mono',monospace; font-size:.68rem;
  }
  .mh-modal-close:hover { color:var(--text,#e0e0e0); }
</style>
</head>
<body>

<div class="mh-modal-ov" id="mhUserModal">
  <div class="mh-modal-box">
    <div class="mh-modal-title">Seleccionar usuario</div>
    <div id="mhUserOpts"></div>
    <button class="mh-modal-close" id="mhModalClose">Cerrar</button>
  </div>
</div>
<header>
  <div class="site-label"><a href="../index.html">← Singles</a></div>
  <h1>Eurovisión</h1>
  <div class="header-meta">1 listas</div>
  <button class="mh-usr-btn" id="mhUserBtn" title="Seleccionar usuario">👤 <span id="mhULbl">—</span></button>
</header>
<main>
  <p class="intro">Todas las canciones ganadoras del Festival de Eurovisión.</p>
  <div class="collections-grid">
      <a class="col-card" href="eurovision_winners.html" data-avg="4.6" data-stats="{&quot;alberto_gu&quot;: 0.0, &quot;armandwave&quot;: 16.2, &quot;BipolarMuzik&quot;: 1.4, &quot;EliasJ72&quot;: 0.0, &quot;Frikomid&quot;: 12.2, &quot;GabredMared&quot;: 4.1, &quot;Lonsonxd&quot;: 2.7, &quot;MaxtorUwU&quot;: 2.7, &quot;Nubis84&quot;: 17.6, &quot;paqueradejere&quot;: 0.0, &quot;Rocky_stereo&quot;: 0.0, &quot;sdecandelario&quot;: 2.7, &quot;verygooood&quot;: 0.0}">
        <div class="col-name">Eurovisión · Ganadoras</div>
        <div class="col-meta">74 canciones</div>
        <div class="col-bar-wrap"><div class="col-bar" style="width:4.6%"></div></div>
        <div class="col-pct">4.6% media del grupo</div>
      </a>
  </div>
</main>
<footer>Generado 2026-10-19 15:16 · Listas de Wikipedia · Escuchas de Last.fm</footer>

<script>
(function() {
  const USERS = ["alberto_gu", "armandwave", "BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "Rocky_stereo", "sdecandelario", "verygooood"];
  const KEY   = 'mh_user';
  const modal  = document.getElementById('mhUserModal');
  const btn    = document.getElementById('mhUserBtn');
  const opts   = document.getElementById('mhUserOpts');
  const close  = document.getElementById('mhModalClose');
  if (!modal || !btn || !opts) return;

  function buildOpts() {
    opts.innerHTML = '';
    const all = document.createElement('div');
    all.className = 'mh-usr-opt' + (localStorage.getItem(KEY) ? '' : ' active');
    all.textContent = 'Todos (sin filtro)';
    all.onclick = () => selectUser(null);
    opts.appendChild(all);
    USERS.forEach(u => {
      const el = document.createElement('div');
      el.className = 'mh-usr-opt' + (localStorage.getItem(KEY) === u ? ' active' : '');
      el.textContent = u;
      el.onclick = () => selectUser(u);
      opts.appendChild(el);
    });
  }

  function updateBtn() {
    const u = localStorage.getItem(KEY);
    const lbl = document.getElementById('mhULbl');
    if (lbl) lbl.textContent = u || '—';
    btn.title = u ? u : 'Seleccionar usuario';
    btn.classList.toggle('has-user', !!u);
  }

  function selectUser(u) {
    if (u) localStorage.setItem(KEY, u);
    else localStorage.removeItem(KEY);
    updateBtn();
    buildOpts();
    modal.classList.remove('open');
    mhPaintCards();
  }

  btn.addEventListener('click', e => { e.stopPropagation(); buildOpts(); modal.classList.add('open'); });
  close.addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

  updateBtn();
})();
</script>

<script>
(function() {
  function paint() {
    let u = null;
    try { u = localStorage.getItem('mh_user'); } catch (e) {}
    document.querySelectorAll('.col-card').forEach(card => {
      const stats = JSON.parse(card.dataset.stats || '{}');
      const pct = (u && u in stats) ? stats[u] : parseFloat(card.dataset.avg || '0');
      card.querySelector('.col-bar').style.width = pct + '%';
      card.querySelector('.col-pct').textContent =
        pct.toFixed(1) + (u && u in stats ? '% escuchado por ' + u : '% media del grupo');
    });
  }
  window.mhPaintCards = paint;
  paint();
})();
</script>
</body>
</html>
