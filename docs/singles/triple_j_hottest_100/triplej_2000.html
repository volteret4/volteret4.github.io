<script>
(function() {
  const USERS = ["alberto_gu", "armandwave", "BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "MaxtorUwU", "Nubis84", "paqueradejere", "Rocky_stereo", "sdecandelario", "verygooood"];
  const KEY   = 'mh_user';
  const modal  = document.getElementById('mhUserModal');
  const btn    = document.getElementById('mhUserBtn');
  const opts   = document.getElementById('mhUserOpts');
  const close  = document.getElementById('mhModalClose');
  if (!modal || !btn || !opts) return;

  function buildOpts() {
    opts.innerHTML = '';
    const all = document.createElement('div');
    all.className = 'mh-usr-opt' + (localStorage.getItem(KEY) ? '' : ' active');
    all.textContent = 'Todos (sin filtro)';
    all.onclick = () => selectUser(null);
    opts.appendChild(all);
    USERS.forEach(u => {
      const el = document.createElement('div');
      el.className = 'mh-usr-opt' + (localStorage.getItem(KEY) === u ? ' active' : '');
      el.textContent = u;
      el.onclick = () => selectUser(u);
      opts.appendChild(el);
    });
  }

  function updateBtn() {
    const u = localStorage.getItem(KEY);
    const lbl = document.getElementById('mhULbl');
    if (lbl) lbl.textContent = u || '—';
    btn.title = u ? u : 'Seleccionar usuario';
    btn.classList.toggle('has-user', !!u);
  }

  function selectUser(u) {
    if (u) localStorage.setItem(KEY, u);
    else localStorage.removeItem(KEY);
    updateBtn();
    buildOpts();
    modal.classList.remove('open');
    mhRenderList();
  }

  btn.addEventListener('click', e => { e.stopPropagation(); buildOpts(); modal.classList.add('open'); });
  close.addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('open'); });

  updateBtn();
})();

86,"t":"Hello Cruel World","a":"Klinger","y":2000,"w":null,"n":"Australia","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/5af0c344e0c8b1f3e3cc4c643c5e5d20/250x250-000000-80-0-0.jpg","dz":83173782,"yt":"GVVU06gU_dU"},{"r":87,"t":"Music","a":"Madonna","y":2000,"w":null,"n":"United States","h":{"alberto_gu":3,"Frikomid":28,"GabredMared":5,"Nubis84":1},"c":"https://cdn-images.dzcdn.net/images/cover/32fa1f6bf870f558de0e874ee04be456/250x250-000000-80-0-0.jpg","dz":3667551,"yt":"Sdz2oW0NMFk"},{"r":88,"t":"Rome Wasn't Built in a Day","a":"Morcheeba","y":2000,"w":null,"n":"United Kingdom","h":{"Frikomid":2,"Nubis84":2,"sdecandelario":1},"c":"https://cdn-images.dzcdn.net/images/cover/f8a3145e31b1ef65b118325d5585a242/250x250-000000-80-0-0.jpg","dz":764172,"yt":"FLGJXbl6g8o"},{"r":89,"t":"Work It Out","a":"Brassy","y":2000,"w":null,"n":"United Kingdom","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/e202f4479297912243e205831a1863fc/250x250-000000-80-0-0.jpg","dz":937122,"yt":"dAdiBDYWi0U"},{"r":90,"t":"Good Fortune","a":"PJ Harvey","y":2000,"w":null,"n":"United Kingdom","h":{"Frikomid":3,"Lonsonxd":3,"MaxtorUwU":3,"Nubis84":24,"paqueradejere":2,"sdecandelario":6},"c":"https://cdn-images.dzcdn.net/images/cover/2acafc30a5555be1661abe5181bdb73b/250x250-000000-80-0-0.jpg","dz":1172878,"yt":"gDBZZ3uvimE"},{"r":91,"t":"Start Making Sense","a":"Area-7","y":2000,"w":null,"n":"Australia","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/b5308e2dda27b8422de48818079eec0d/250x250-000000-80-0-0.jpg","dz":1638100,"yt":"yh2Xvln2bX4"},{"r":92,"t":"Live Without It","a":"Killing Heidi","y":2000,"w":null,"n":"Australia","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/0f7e1d3d4c5865212c0ee8cd8bb38561/250x250-000000-80-0-0.jpg","dz":904117812,"yt":"eI-FTI-jzy4"},{"r":93,"t":"Set the Record Straight","a":"Reef","y":2000,"w":null,"n":"United Kingdom","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/d522f3657d3bce98184fd638fd0201bd/250x250-000000-80-0-0.jpg","dz":2322854,"yt":"ZD6HjlEsOmY"},{"r":94,"t":"The Ground Beneath Her Feet","a":"U2","y":2000,"w":null,"n":"Ireland","h":{"armandwave":7},"c":"https://cdn-images.dzcdn.net/images/cover/b37725cd9d9771d7674df22fafdcc0a2/250x250-000000-80-0-0.jpg","dz":2162753,"yt":"ZsyDpjj4PbU"},{"r":95,"t":"Renegades of Funk","a":"Rage Against the Machine","y":2000,"w":null,"n":"United States","h":{"MaxtorUwU":5,"Nubis84":1,"sdecandelario":2},"c":"https://cdn-images.dzcdn.net/images/cover/725a0dcdd59a884d415fd6a31ec98756/250x250-000000-80-0-0.jpg","dz":15217246,"yt":"4KXdU3cZbNQ"},{"r":96,"t":"Paint Pastel Princess","a":"Silverchair","y":2000,"w":null,"n":"Australia","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/70055a4bffa0e5ac5ffae7d420e5e4d6/250x250-000000-80-0-0.jpg","dz":856378,"yt":"pIUwqx03iBs"},{"r":97,"t":"Ben Lee","a":"Klinger","y":2000,"w":null,"n":"Australia","h":{},"yt":"GXDlrbUaCEI"},{"r":98,"t":"Death Defy","a":"Motor Ace","y":2000,"w":null,"n":"Australia","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/2dad382e7e46a603ae3b3d64ec568beb/250x250-000000-80-0-0.jpg","dz":4089737,"yt":"ezryeBN4A4g"},{"r":99,"t":"Who the Hell Are You","a":"Madison Avenue","y":2000,"w":null,"n":"Australia","h":{},"c":"https://cdn-images.dzcdn.net/images/cover/ed3627c78c49d47ec3f56d3e3896858f/250x250-000000-80-0-0.jpg","dz":4107065571,"yt":"r1FFfBp9zsc"},{"r":100,"t":"Warning","a":"Green Day","y":2000,"w":null,"n":"United States","h":{"BipolarMuzik":1,"sdecandelario":5},"c":"https://cdn-images.dzcdn.net/images/cover/a92793f7cda0286e051d16da87d7d6f0/250x250-000000-80-0-0.jpg","dz":2657769,"yt":"eebfMFzJHNs"}]};</script>
<script>
(function() {
  const D = DATA, USERS = D.users, NU = USERS.length;
  const $ = id => document.getElementById(id);
  const mobile = () => matchMedia('(max-width:800px)').matches;
  let filter = 'all', sort = 'rank', q = '', cur = null;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  D.tracks.forEach((t, i) => { t.i = i; t.nh = Object.keys(t.h).length; t.q = fold(t.t + ' ' + t.a); });

  function user() { try { return localStorage.getItem('mh_user'); } catch (e) { return null; } }

  // Carátulas: solo se pide la imagen cuando la tarjeta se acerca al viewport,
  // y el grid se pinta por lotes para que listas de 1000+ no bloqueen el primer render.
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const img = e.target; io.unobserve(img);
    img.onload = () => { img.classList.add('ok'); img.parentElement.classList.add('has-img'); };
    img.src = img.dataset.src;
  }), { rootMargin: '400px' });

  function card(t, u) {
    const mine = u ? !!t.h[u] : t.nh > 0;
    return `<div class="card ${mine ? 'heard' : 'pending'}${u && !mine ? ' dim' : ''}" data-i="${t.i}">
      <div class="card-ph"><b>${esc(t.t)}</b><i>${esc(t.a)}</i></div>
      ${t.c ? `<img data-src="${esc(t.c)}" alt="" decoding="async">` : ''}
      ${t.r != null ? `<div class="card-rank">${t.r}</div>` : ''}
      <div class="card-overlay"><div class="card-num">${t.r != null ? '#' + t.r : ''}${t.y && D.showYear ? ' · ' + t.y : ''}</div>
        <div class="card-title">${esc(t.t)}</div><div class="card-artist">${esc(t.a)}</div></div>
    </div>`;
  }

  let renderToken = 0;
  function render() {
    const u = user();
    const heard = t => u ? !!t.h[u] : t.nh > 0;
    let list = D.tracks.filter(t => (filter === 'all' || (filter === 'heard') === heard(t)) && (!q || t.q.includes(q)));
    if (sort === 'pop') list = [...list].sort((a, b) => b.nh - a.nh || a.i - b.i);
    if (sort === 'year') list = [...list].sort((a, b) => (a.y || 0) - (b.y || 0) || a.i - b.i);

    const total = D.tracks.length;
    let pct, txt;
    if (u) {
      const n = D.tracks.filter(t => t.h[u]).length;
      pct = 100 * n / total;
      txt = `<b>${n}</b>/${total} · ${pct.toFixed(1)}% ${esc(u)}`;
    } else {
      const avg = USERS.reduce((s, x) => s + D.tracks.filter(t => t.h[x]).length, 0) / (NU || 1);
      pct = 100 * avg / total;
      txt = `media <b>${pct.toFixed(1)}%</b> · ${D.tracks.filter(t => t.nh).length}/${total} alguien`;
    }
    $('progTxt').innerHTML = txt;
    $('progBar').style.width = pct + '%';
    $('fHeard').textContent = u ? 'Escuchadas' : 'Alguien';
    $('fPending').textContent = u ? 'Pendientes' : 'Nadie';

    const parts = [];
    let lastY;
    const sepByYear = D.yearSeparators && (sort === 'rank' || sort === 'year');
    for (const t of list) {
      if (sepByYear && t.y !== lastY) { parts.push(`<div class="year-sep">${t.y ?? '—'}</div>`); lastY = t.y; }
      parts.push(card(t, u));
    }
    const grid = $('grid'), token = ++renderToken;
    io.disconnect();
    grid.innerHTML = parts.length ? '' : '<div class="empty">Nada por aquí.</div>';
    const CHUNK = 240;
    (function chunk(i) {
      if (token !== renderToken) return;
      grid.insertAdjacentHTML('beforeend', parts.slice(i, i + CHUNK).join(''));
      grid.querySelectorAll('img[data-src]:not([src])').forEach(img => io.observe(img));
      if (i + CHUNK < parts.length) requestAnimationFrame(() => chunk(i + CHUNK));
      else if (cur) grid.querySelector(`.card[data-i="${cur.i}"]`)?.classList.add('active');
    })(0);
  }

  function openPanel(t) {
    cur = t;
    const u = user(), mine = u ? !!t.h[u] : t.nh > 0;
    document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
    document.querySelector(`.card[data-i="${t.i}"]`)?.classList.add('active');
    const big = t.c ? t.c.replace('/250x250-', '/500x500-') : '';
    $('pCover').innerHTML = `<div class="card-ph"><b>${esc(t.t)}</b><i>${esc(t.a)}</i></div>`
      + (big ? `<img src="${esc(big)}" alt="" onload="this.previousElementSibling.style.display='none'">` : '')
      + `<span class="panel-status ${mine ? 'heard' : 'pending'}">${u ? (mine ? 'Escuchada · ' + t.h[u] + ' plays' : 'Pendiente') : t.nh + '/' + NU + ' usuarios'}</span>`;
    const meta = [];
    if (t.y) meta.push(t.y);
    if (t.n === 'winner') meta.push('<span class="badge win">🏆 Ganadora</span>');
    else if (t.n === 'nominee') meta.push('<span class="badge">Nominada</span>');
    else if (t.n) meta.push(esc(t.n));
    if (t.w) meta.push(t.w + (t.w === 1 ? ' semana' : ' semanas') + ' nº1');
    const users = USERS.map(x => `<span class="p-user${t.h[x] ? ' on' : ''}${x === u ? ' me' : ''}">${esc(x)}${t.h[x] ? ' · ' + t.h[x] : ''}</span>`).join('');
    const qs = encodeURIComponent(t.a + ' ' + t.t);
    const lfm = 'https://www.last.fm/music/' + encodeURIComponent(t.a.split(/ (?:featuring|feat\.|with|con) /i)[0]) + '/_/' + encodeURIComponent(t.t.split(' / ')[0]);
    $('pBody').innerHTML = `
      ${t.r != null ? `<div class="p-num">#${t.r}</div>` : ''}
      <div class="p-title">${esc(t.t)}</div>
      <div class="p-artist">${esc(t.a)}</div>
      <div class="p-meta">${meta.join(' · ')}</div>
      <audio id="pAudio" controls preload="none"></audio>
      <div class="p-label">Escuchada por ${t.nh}/${NU}</div>
      <div class="p-users">${users}</div>
      <div class="p-links">
        ${t.yt ? `<button id="pYtBtn" type="button">▶ YouTube</button>`
               : `<a href="https://www.youtube.com/results?search_query=${qs}" target="_blank" rel="noopener">Buscar en YouTube</a>`}
        <a href="${lfm}" target="_blank" rel="noopener">Last.fm</a>
        ${t.dz ? `<a href="https://www.deezer.com/track/${t.dz}" target="_blank" rel="noopener">Deezer</a>` : ''}
      </div>
      <div class="p-yt" id="pYt"></div>`;
    if (t.yt) $('pYtBtn').onclick = () => {
      $('pAudio').pause();
      $('pYt').innerHTML = `<iframe src="https://www.youtube.com/embed/${t.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="${esc(t.t)}"></iframe>`;
      $('pYt').classList.add('on');
      $('pYtBtn').remove();
      $('pYt').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
    if (t.dz) preview(t);
    $('panel').classList.add('open');
  }

  // Preview de 30 s: las URLs de Deezer caducan, así que se piden al abrir (JSONP, sin CORS).
  function preview(t) {
    const cb = 'dz' + t.dz, s = document.createElement('script');
    window[cb] = d => {
      delete window[cb]; s.remove();
      const a = $('pAudio');
      if (cur === t && a && d && d.preview) { a.src = d.preview; a.style.display = 'block'; }
    };
    s.src = `https://api.deezer.com/track/${t.dz}?output=jsonp&callback=${cb}`;
    s.onerror = () => { delete window[cb]; s.remove(); };
    document.body.appendChild(s);
  }

  $('grid').onclick = e => { const c = e.target.closest('.card'); if (c) openPanel(D.tracks[+c.dataset.i]); };
  $('pClose').onclick = () => $('panel').classList.remove('open');
  document.querySelectorAll('#filters button').forEach(b => b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  $('sort').onchange = e => { sort = e.target.value; render(); };
  let qt;
  $('search').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { q = fold(e.target.value.trim()); render(); }, 150); };
  function setCols(v) {
    $('grid').style.setProperty('--cols', v);
    $('gridLbl').textContent = v + '×';
    try { localStorage.setItem('sg_cols', v); } catch (e) {}
  }
  $('gridSlider').oninput = e => setCols(e.target.value);
  let cols = mobile() ? 3 : 8;
  try { cols = +localStorage.getItem('sg_cols') || cols; } catch (e) {}
  $('gridSlider').value = cols; setCols(cols);
  const fitHeader = () => document.querySelector('main').style.marginTop = document.querySelector('header').offsetHeight + 'px';
  addEventListener('resize', fitHeader); fitHeader();

  window.mhRenderList = () => { render(); if (cur) openPanel(cur); };
  render();
  if (!mobile() && D.tracks.length) openPanel(D.tracks[0]);
})();
</script>
</body>
</html>
